open_questions:
- Which TTS components should be adapted for speaker, language, style, and domain transfer?
- How should adapter capacity and placement scale with the amount and type of adaptation data?
- When does parameter-efficient tuning outperform full fine-tuning after controlling for training budget?
- How can target-language speaker diversity be separated from total data volume in adaptation studies?
trend_notes:
- The Q3 evidence introduces parameter-efficient adapters as an alternative to full multilingual TTS fine-tuning.
- The available evidence suggests adaptation quality depends on pre-training speaker coverage as well as the tuning
  method itself.
