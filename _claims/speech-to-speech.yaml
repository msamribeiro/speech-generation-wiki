open_questions:
- Whether the cascade-vs-end-to-end performance gap will continue to close as end-to-end backbone LLMs
  improve, or whether it reflects a structural limitation of joint audio-token generation independent
  of backbone quality.
- Whether staged (modality-specific) pretraining helps or harms instruction-following in end-to-end speech
  LMs (see the staged_pretraining_effect_on_instruction_following contested cluster).
- Whether backchannel generation and robust barge-in handling can be solved with better training data
  and architecture, or require a fundamentally different full-duplex training paradigm than current flattened
  or dual-stream approaches.
- Whether retrieval-augmented generation genuinely improves multi-turn conversational context recall in
  spoken dialogue agents, or only knowledge-intensive factual QA (see the rag_tool_use_mixed_benefit contested
  cluster).
trend_notes:
- Full-duplex evaluation infrastructure (Full-Duplex-Bench, Full-Duplex-Bench v1.5, the FD-Bench-pipeline
  paper, Flexi, WildSpeech-Bench, VERA, MTalkBench) proliferated rapidly through 2025, reflecting a shift
  in the field from proposing new architectures toward diagnostic benchmarking of specific failure modes
  (backchannel, interruption, multi-turn degradation, paralinguistic capability).
- Modular architectures pairing a frozen or lightly-adapted text LLM with a separately-trained streaming
  TTS decoder (gate fusion, CTC, or autoregressive streaming) became the dominant design pattern among
  2025 systems in this corpus, appearing to supersede the earlier 2023-2024 approach of training a single
  native joint speech-text token stream from scratch.
- Paralinguistic and multi-turn degradation emerged as distinct, heavily-studied evaluation axes separate
  from semantic accuracy starting around Q2-Q3 2025, with multiple independent benchmarks converging on
  the same finding that these dimensions lag well behind content understanding.
