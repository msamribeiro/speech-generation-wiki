  - '2411.00774'
  caveats:
  - SLAM-Omni's two paper entries (2412.15649, arXiv preprint, and 2025.findings-acl.115, ACL Findings
    camera-ready) are the same underlying work; they are counted as one independent data point against
    this cluster, not two, per the arXiv-full-version-dedup precedent.
  - 'The tension is confounded by model scale (SLAM-Omni: 0.5B Qwen2 backbone; Baichuan-Audio: 7B backbone)
    and by differing training regimes (single-stage dialogue-only fine-tuning vs. frozen-then-joint staged
    pretraining), so the disagreement may partly reflect scale-dependent effects rather than a clean contradiction.
    Flagged in reassessment_queue pending a scale-matched ablation.'
  - Mini-Omni2 (2410.11190) and Freeze-Omni (2411.00774) both find staged or frozen-LLM training preserves
    capability, broadly consistent with Baichuan-Audio's side of the tension, but their claims are about
    general text-capability forgetting rather than instruction-following specifically, so they are listed
    as refining context rather than primary support.
  last_reviewed: '2026-07-19'
- id: full_duplex_responsiveness_floorholding_tradeoff
  claim: Full-duplex spoken dialogue systems face an inherent trade-off between fast, low-latency responsiveness/interruption
