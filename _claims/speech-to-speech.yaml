      than via a controlled ablation.
    confidence: low
    relevance: medium
  - claim_id: stepaudio2_multitask_pretraining_helps_lowresource
    role: supports
    claim: Comprehensive multi-task pre-training across ASR, TTS, translation, and conversation significantly
      improves spoken dialogue performance in low-resource languages and accented speech.
    source: §3.2, §4.1
    evidence: Step-Audio 2 achieves 8.85% average CER on low-resource dialects and accented Mandarin,
      versus 25.52% for Kimi-Audio and 40.49% for GPT-4o Transcribe.
    confidence: medium
    relevance: medium
  - claim_id: stepaudio2_existing_benchmarks_miss_paralinguistic_toolcall
    role: supports
    claim: Existing audio language model benchmarks fail to capture fine-grained paralinguistic comprehension
      and voice-triggered tool invocation, leaving important capability dimensions systematically unmeasured.
    source: §4.2, §4.5
    evidence: The paper introduces two new benchmarks (StepEval-Audio-Paralinguistic, StepEval-Audio-Toolcall)
      explicitly because no prior benchmark measured these dimensions.
    confidence: medium
    relevance: high
  limitations:
  - Two of the main evaluation benchmarks (StepEval-Audio-Paralinguistic, StepEval-Audio-Toolcall) are
    introduced by the authors themselves and have not been validated independently.
  - Model size is not reported, making parameter-count comparisons with other open-source systems difficult;
    the audio search tool relies on a proprietary sample library, limiting reproducibility.
  caveats:
  - Evaluation is primarily Chinese-English bilingual, and the tool-calling evaluation uses synthesized
    speech conversations generated from text scripts rather than natural speech.
- id: '2507.18119'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  architecture:
  - autoregressive-LM
  - flow-matching
  relevance: high
  evidence_role:
  - core_evidence
  - control_evidence
  current_role: active_evidence
  method_family:
  - modular_gated_streaming_tts_decoder
  claims:
  - claim_id: goatslm_paralinguistic_awareness_without_instruction
    role: supports
    claim: Modality-alignment spoken language models can internalize paralinguistic cues (dialect, age,
      emotion, non-speech vocalizations) through staged training without requiring explicit user instructions
      at inference time.
    source: §5.2, Table 7, Table 8
    evidence: GOAT-SLM achieves 50.73% average dialect-following accuracy across five Chinese dialects
      without explicit prompting, versus 18.91% for the next-best model, and 40.91% on non-speech vocal
      response tasks where all other models score below 10%.
    confidence: high
    relevance: high
  - claim_id: goatslm_speech_head_init_from_text_head
    role: supports
    claim: Initializing a speech generation head from a pretrained LLM text head promotes parameter reuse
      and can preserve linguistic competence in the speech branch without full retraining.
    source: §3, §5.1, Table 6
    evidence: The Speak module is initialized from Write module weights; the model retains 84% multi-turn
      dialogue accuracy despite not training on multi-turn data, attributed to well-aligned input embeddings
      from this parameter-sharing strategy.
    confidence: medium
    relevance: medium
  - claim_id: goatslm_paralinguistic_tradeoff_with_aqa
    role: complicates
    claim: Incorporating paralinguistic awareness into a spoken language model introduces a trade-off
      with general semantic question-answering performance.
    source: §5.1, Table 4
    evidence: GOAT-SLM's capability on general audio QA declines relative to models without paralinguistic
      training, remaining at average level across eight QA datasets, which the authors attribute to the
      expanded training objectives.
    confidence: high
    relevance: high
  - claim_id: goatslm_dialect_generation_uneven
    role: complicates
    claim: Dialectal speech generation quality is uneven across dialects, with closely related varieties
      more reliably acquired than typologically distant ones.
    source: §5.2, Table 10
    evidence: In subjective evaluation of dialectal spoken response, GOAT-SLM exceeds 90% consistency
      for Cantonese, Henan, Shanghainese, and Sichuanese, but achieves only 57.2% for northeastern Mandarin,
      which is lexically similar to standard Mandarin.
    confidence: medium
    relevance: low
  - claim_id: goatslm_confidence_gradient_masking_stabilizes_pronunciation
    role: supports
    claim: Confidence-based gradient masking during speech token training can improve pronunciation stability
      by selectively updating tokens where the model's predictions are reliable.
    source: §4.3
    evidence: GOAT-SLM applies confidence-based automatic gradient masking in training, masking low-confidence
      tokens during backpropagation, credited with enhanced pronunciation stability.
    confidence: low
    relevance: low
  limitations:
  - Evaluation is restricted to Chinese-language dialects and Mandarin-English bilingual content; generalization
    to non-Chinese languages is untested.
  - The TELEVAL benchmark is developed by the same research group, introducing potential evaluation-training
    alignment bias.
  caveats:
  - The paper does not ablate LLM-initialized speech branch weights versus random initialization in a
    controlled experiment, leaving the primary architectural design claim without direct causal evidence.
- id: '2505.15670'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: high
  evidence_role:
  - core_evidence
  - acceleration_evidence
  current_role: active_evidence
  method_family:
  - full_duplex_dual_stream_architectures
  claims:
  - claim_id: salmduplex_full_duplex_without_speech_pretraining
    role: supports
    claim: Full-duplex spoken dialogue systems can be built without speech-text pretraining by routing
      user audio through a pretrained streaming encoder rather than requiring the LLM to learn audio representations
      end-to-end.
    source: §3, §6.1, §6.2, Tables 2-3
    evidence: SALM-Duplex skips speech pretraining entirely, using a 100M-parameter streaming CTC encoder
      for user input, and still outperforms Moshi on barge-in success rate (94.5% vs. 55.1%) and reasoning
      GPT scores across all five evaluation sets.
    confidence: high
    relevance: high
  - claim_id: salmduplex_asymmetric_enables_codec_personalization
    role: supports
    claim: Asymmetric duplex architectures that separate user and agent speech pathways enable independent
      specialization, including speaker-specific codec fine-tuning without affecting user comprehension.
    source: §3.2, §6.3, Table 4
    evidence: A personalized 0.6 kbps NanoCodec, fine-tuned on 21k target-speaker utterances, outperforms
      Moshi's Mimi at 1.1 kbps and the untuned NanoCodec at 1.2 kbps on MOS, CER, and SECS, at roughly
      half the bitrate.
    confidence: high
    relevance: medium
  - claim_id: salmduplex_e2e_not_always_matching_cascade_oracle
    role: complicates
    claim: End-to-end speech-to-speech models do not consistently match optimal cascaded systems in reasoning
      quality, even when the cascaded oracle has access to ground-truth ASR transcriptions of user speech.
    source: §6.2, Table 3
    evidence: SALM-Duplex outperforms a ground-truth-transcript-plus-LLM oracle on Roleplay and ASR-QA
      but underperforms on UltraChat (3.5 vs. 6.4), Topic, and Alpaca.
    confidence: medium
    relevance: high
  - claim_id: salmduplex_bargein_more_discriminative_than_utmos
    role: supports
    claim: Barge-in success rate and latency together constitute more discriminative signals for evaluating
      full-duplex systems than speech quality metrics such as UTMOS.
    source: §5.2, §6.1, Table 2
    evidence: On the Impatient set, SALM-Duplex and Moshi have zero false alarms each and UTMOS within
      0.2 points, yet differ by 39.4 percentage points in barge-in success rate.
    confidence: medium
    relevance: medium
  limitations:
  - All agent speech in training data is synthesized using a TTS model with a fixed speaker; generalization
    to diverse agent voices or real conversational speech has not been demonstrated.
  - The quantitative comparison is restricted to Moshi; other contemporaneous duplex systems (OmniFlatten,
    SALMONN-Omni, MinMo) are discussed but not benchmarked.
  caveats:
  - The 1.1B TinyLlama backbone limits the reasoning ceiling; the gap to the GT+LLM oracle on complex
    dialogue tasks likely reflects both compounding ASR-pathway error and limited LLM capacity, somewhat
    confounding the E2E-vs-cascade comparison.
- id: 2025.findings-acl.470
  entry_date: '2026-07-19'
  year: 2025
  venue: ACL
  task:
  - SCA
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - evaluation_caution
  - negative_evidence
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: contextdialog_speech_extension_degrades_recall
    role: supports
    claim: Extending a pre-trained text LLM to process speech input substantially degrades its ability
      to recall and utilize long-range conversational context.
    source: §4.1, Table 2
    evidence: All four evaluated open-source voice interaction models score 2.00-2.83 on ContextDialog
      (5-point GPT Score), compared to 4.03-4.10 for their text-only backbone LLMs; the gap is largest
      when the LLM backbone is frozen during speech adaptation.
    confidence: high
    relevance: high
  - claim_id: contextdialog_modality_specific_recall_asymmetry
    role: supports
    claim: Voice interaction models exhibit a modality-specific recall asymmetry, retrieving information
      from model-generated text responses more reliably than from user-spoken utterances.
    source: §4.1, Table 2, Figure 3
    evidence: All four speech models score significantly higher on questions about the model's own past
      utterances than past user utterances (p < 0.01); attention maps confirm systematically lower attention
      weight on user-spoken supporting utterances.
    confidence: high
    relevance: medium
  - claim_id: contextdialog_rag_no_consistent_help
    role: complicates
    claim: Retrieval-augmented generation provides a practical route to improving multi-turn context recall
      in spoken dialogue models.
    source: §4.2, Figure 4, Table 3, Table 5
    evidence: Augmenting four open-source voice interaction models with a top-k text retriever yields
      no consistent improvement and often degrades performance; top-1 retrieval recall is only 0.58 and
      irrelevant retrieved utterances lower all models below baseline.
    confidence: medium
    relevance: medium
  - claim_id: contextdialog_open_source_lags_closed_source
    role: supports
    claim: Open-source voice interaction models show critically underdeveloped long-context capabilities
      compared to closed-source systems, even on simple factual recall tasks.
    source: §A.1.4, Table 7
    evidence: gpt-4o-mini-audio-preview scores 3.83-4.50 on ContextDialog, more than 1 point above the
      best open-source model (Lyra, 2.83), even though the closed-source API does not support a proper
      multi-turn spoken dialogue context.
    confidence: medium
    relevance: medium
  limitations:
  - ContextDialog is entirely synthetic (GPT-4o-generated questions, Fish Speech-synthesized audio); may
    overfit to patterns clean TTS speech handles well and underestimate difficulty on real, disfluent
    user speech.
  - The evaluation covers only four open-source models from 2024-2025; full-duplex and pure speech-output
    models are excluded due to incompatible interaction formats.
  caveats:
  - Text-based RAG is the only augmentation strategy tested; no speech-native retriever suitable for open-source
    voice interaction currently exists, so whether the RAG failure is fundamental or an artifact of text-only
    retrieval remains unresolved.
- id: 2025.findings-acl.1051
  entry_date: '2026-07-19'
  year: 2025
  venue: ACL
  task:
  - TTS
  - SCA
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - core_evidence
  - acceleration_evidence
  current_role: active_evidence
  method_family:
  - modular_gated_streaming_tts_decoder
  claims:
  - claim_id: llmvox_decoupled_tts_preserves_llm_reasoning
    role: supports
    claim: Decoupling speech synthesis from LLM text generation via a lightweight autoregressive module
      can preserve the base LLM's reasoning quality while achieving competitive streaming latency.
    source: §6.4, Table 1
    evidence: Whisper+LLaMA3.1-8B+LLMVoX achieves the highest GPT-4o General/Knowledge QA scores among
      streaming models (6.14/7.62) at 475ms end-to-end latency, without modifying the LLM.
    confidence: high
    relevance: high
  - claim_id: llmvox_e2e_finetuning_degrades_understanding
    role: supports
    claim: End-to-end speech-enabled LLMs that fine-tune or condition the base LLM on speech data consistently
      show degraded language understanding compared to systems that keep the LLM frozen.
    source: §6.4, Table 1
    evidence: Moshi (2.71) and Freeze-Omni (3.48) score well below Whisper+LLM+LLMVoX (6.14) on GPT-4o
      General QA despite fine-tuning the LLM or its components on speech data.
    confidence: medium
    relevance: high
  - claim_id: llmvox_single_layer_rvq_sufficient
    role: supports
    claim: A single-layer RVQ codec is sufficient for low-latency autoregressive TTS generation when paired
      with a compact decoder transformer, avoiding the complexity of multi-codebook prediction.
    source: §3.1
    evidence: LLMVoX uses WavTokenizer's single-layer RVQ (4096-entry codebook) rather than multi-level
      RVQ, keeping the autoregressive sequence manageable for a 4-layer, 30M-parameter transformer.
    confidence: medium
    relevance: low
  - claim_id: llmvox_larger_chunks_improve_quality
    role: supports
    claim: Streaming TTS quality improves with larger decode chunk sizes, with WER and UTMOS gains achievable
      without substantially increasing end-to-end latency.
    source: §6.4, Figure 6
    evidence: The doubling chunk-size schedule in the multi-queue streaming scheduler raises UTMOS while
      leveraging playback time to absorb the additional processing cost.
    confidence: medium
    relevance: low
  - claim_id: llmvox_language_adaptation_via_data_alone
    role: supports
    claim: Language adaptation of a codec-based TTS module can be achieved by replacing training data
      alone, without architectural changes or explicit G2P conversion for the new language.
    source: §6.5, Table 3
    evidence: The Arabic LLMVoX model is trained on ~1500 hours of XTTS-synthesized data with no architectural
      change, reaching a streaming CER of 8.2% competing with non-streaming XTTS (1.7%) at roughly 10x
      the speed.
    confidence: medium
    relevance: low
  limitations:
  - LLMVoX is single-speaker with no voice cloning or speaker reference support.
  - The streaming pipeline does not yet extend to the ASR front-end, and latency with 70B LLMs exceeds
    1.9s, making real-time use marginal at larger LLM scale.
  caveats:
  - LLMVoX is a modular TTS frontend rather than a complete speech-to-speech system; its relevance to
    this concept is as cascade-pipeline infrastructure (the TTS stage of ASR+LLM+TTS) rather than direct
    evidence about end-to-end dialogue or S2S translation.
- id: 2025.acl-long.817
  entry_date: '2026-07-19'
  year: 2025
  venue: ACL
  task:
  - SCA
  - TTS
  architecture:
  - autoregressive-LM
  relevance: high
  evidence_role:
  - core_evidence
  - acceleration_evidence
  current_role: active_evidence
  method_family:
  - speech_to_speech_translation_systems
  claims:
  - claim_id: simuls2sllm_boundary_aware_critical_for_streaming
    role: supports
    claim: Boundary-aware speech representations are critical for enabling offline-trained speech LLMs
      to perform simultaneous inference via wait-k strategies.
    source: §5.1, §5.2, Tables 4, 11
    evidence: CIF-based boundary-aware prompts outperform fixed downsampling by approximately 4 ASR-BLEU
      points at equivalent latency on Es-En, Fr-En, and De-En CVSS-C test sets, with a parallel gap on
      text output confirming the bottleneck is LLM prediction rather than speech synthesis.
    confidence: high
    relevance: high
  - claim_id: simuls2sllm_offline_training_matches_streaming_trained
    role: supports
    claim: Offline training combined with test-time simultaneous inference policies can match or outperform
      systems trained specifically for streaming in speech-to-speech translation.
    source: §5.1, Fig. 4, Table 1
    evidence: SimulS2S-LLM, trained offline, consistently outperforms the streaming-trained StreamSpeech
      model across all three language pairs at comparable latency, achieving up to 4 ASR-BLEU improvement
      on Es-En.
    confidence: high
    relevance: high
  - claim_id: simuls2sllm_multilayer_aggregation_improves_prediction
    role: supports
    claim: Aggregating LLM hidden states across multiple layers improves discrete speech token prediction
      compared to using only the final layer.
    source: §5.3, Fig. 6
    evidence: Multi-layer hidden state weighting yields approximately 1 ASR-BLEU improvement over last-layer-only
      decoding, attributed to the final layer's focus on semantic text information at the expense of acoustic
      richness.
    confidence: medium
    relevance: low
  - claim_id: simuls2sllm_llm_latency_overhead_narrows_advantage
    role: complicates
    claim: LLM-based approaches to simultaneous speech generation face a latency penalty from LLM inference
      overhead that narrows the practical quality-latency advantage over non-LLM methods.
    source: §D, Tables 8-10, Limitations
    evidence: Computation-aware average token delay for SimulS2S-LLM is substantially higher than standard
      ATD (e.g., 4239ms vs. 3440ms at k=8 on Es-En), and the system is not evaluated at very low latency
      regimes (AL < 1s).
    confidence: medium
    relevance: medium
  - claim_id: simuls2sllm_ngram_fusion_improves_quality
    role: supports
    claim: Shallow fusion of n-gram language models with CTC decoding of discrete speech tokens improves
      simultaneous speech translation quality without increasing latency.
    source: §5.4, Table 2
    evidence: n-gram LM fusion over greedy CTC search improves ASR-BLEU from 24.7 to 26.3 on CVSS-C Es-En
      at identical average token delay.
    confidence: medium
    relevance: low
  limitations:
  - Not evaluated at very low latency (AL < 1s), a regime the authors identify as unsuitable for offline-trained
    models due to reordering requirements.
  - Evaluated only on three European language pairs (Es-En, Fr-En, De-En) on relatively small datasets
    (70-174 hours per language pair).
  caveats:
  - 'Table 1 comparisons are not well-controlled: StreamSpeech is a reproduction on CVSS-C, while SeamlessStreaming
    (Appendix E) uses roughly 9,300 hours of S2ST data versus 70-174 hours for SimulS2S-LLM; direct numerical
    comparison across these baselines should be treated with caution, per the paper''s own note.'
- id: 2025.acl-long.912
  entry_date: '2026-07-19'
  year: 2025
  venue: ACL
  task:
  - SCA
  - TTS
  architecture:
  - autoregressive-LM
  - flow-matching
  - hybrid
  relevance: high
  evidence_role:
  - core_evidence
  - acceleration_evidence
  current_role: influential
  method_family:
  - modular_gated_streaming_tts_decoder
  claims:
  - claim_id: llamaomni2acl_ar_decoder_improves_naturalness
    role: supports
    claim: Autoregressive streaming speech decoders in modular spoken conversational agents substantially
      improve naturalness over non-autoregressive alternatives with comparable latency.
    source: §5.1, Table 1
    evidence: LLaMA-Omni2 models score UTMOS 4.19-4.22 across sizes, versus 3.67 for LLaMA-Omni's NAR
      decoder and 3.48 for GLM-4-Voice.
    confidence: high
    relevance: high
  - claim_id: llamaomni2acl_gate_fusion_improves_instruction_and_consistency
    role: supports
    claim: A gate fusion mechanism that adaptively blends LLM hidden states with text token embeddings
      as input to the TTS language model improves both instruction following quality and text-speech consistency
      over simpler additive fusion.
    source: §5.2, Table 2
    evidence: Ablating the gate fusion module reduces instruction-following ChatGPT scores and raises
      ASR-WER relative to the full gate-fusion model.
    confidence: high
    relevance: medium
  - claim_id: llamaomni2acl_streaming_pretraining_critical
    role: supports
    claim: 'Streaming TTS pretraining on speech dialogue data is critical for quality: initializing from
      a text-only pretrained model degrades performance substantially, and training from scratch fails
      to converge.'
    source: §5.2, Table 3
    evidence: A from-scratch TTS language model fails to converge, and a text-only-pretrained initialization
      substantially underperforms the full streaming-pretrained recipe.
    confidence: high
    relevance: medium
  - claim_id: llamaomni2acl_multiturn_data_beats_singleturn
    role: supports
    claim: Multi-turn dialogue training data consistently outperforms single-turn data of the same total
      size for modular speech language models across spoken QA and instruction-following benchmarks.
    source: §5.3, Table 5
    evidence: Ablations comparing multi-turn versus single-turn training data of matched size show consistent
      gains for multi-turn data across all reported benchmarks.
    confidence: medium
    relevance: medium
  - claim_id: llamaomni2acl_s2t_s2s_gap_indicates_generation_quality
    role: supports
    claim: The S2T-to-S2S accuracy gap in spoken question answering is a meaningful indicator of speech
      generation quality, and autoregressive TTS decoders reduce this gap relative to non-autoregressive
      alternatives.
    source: §5.1, Table 1
    evidence: LLaMA-Omni2-7B reduces the S2T-to-S2S accuracy gap on Web Questions to 3.2 points, versus
      9.7 for LLaMA-Omni and 16.3 for GLM-4-Voice.
    confidence: high
    relevance: high
  limitations:
  - Generates speech in a single fixed output style; cannot modulate emotion, speaking rate, or dialect
    in response to input content.
  - Inherently a response-after-input architecture; does not support full-duplex conversation.
  caveats:
  - This paper (ACL camera-ready) and 2505.02625 (arXiv preprint) are the same underlying work (LLaMA-Omni
    2, identical authors and title, overlapping results with minor additions such as 14B-scale numbers
    here). Both exist as separate wiki pages and are included here per instruction, but Phase 2 synthesis
    should treat this pair as one independent data point, not two, when assessing claim-cluster support
    thresholds. Recommend an ingest-side dedup review per the arXiv-full-version-dedup precedent.
- id: '2507.17527'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  relevance: high
  evidence_role:
  - core_evidence
  - control_evidence
  current_role: frontier_probe
  method_family:
  - speech_to_speech_translation_systems
  claims:
  - claim_id: seedliveinterpret_rl_e2e_beats_commercial_cascade
    role: supports
    claim: End-to-end speech-to-speech translation trained with reinforcement learning can achieve substantially
      lower latency than cascaded commercial systems while surpassing them in translation quality.
    source: §3.3, Table 1
    evidence: On RealSI (zh-en), the system achieves VIP 79.5 and SVIP 67.8 at Average Lagging 5.18 seconds,
      versus the best commercial competitor at VIP 53.2 and SVIP 3.0 at AL 48.21.
    confidence: medium
    relevance: high
  - claim_id: seedliveinterpret_two_stage_rl_beats_single_strategy
    role: supports
    claim: Two-stage RL training that separates fine-grained process rewards from holistic sequence-level
      outcome rewards outperforms applying either strategy in isolation for streaming speech generation.
    source: §4.3, Table 6
    evidence: The combined two-stage scheme achieves higher VIP and lower Average Lagging than both single-turn-only
      and multi-turn-only variants on internal benchmarks.
    confidence: medium
    relevance: medium
  - claim_id: seedliveinterpret_reward_exploitation_risk
    role: complicates
    claim: RL reward design for speech generation is prone to exploitation when individual reward signals
      are applied without complementary constraints.
    source: §4.2, Table 5
    evidence: Training with the Time Compliance Reward alone caused the model to reduce audio duration
      by ~35% and text token count by ~15%, yielding an 8-point BLEURT drop, until an adversarial quality
      reward restored translation fidelity.
    confidence: high
    relevance: medium
  - claim_id: seedliveinterpret_rl_improves_latency_more_than_quality
    role: supports
    claim: Reinforcement learning applied after SFT improves latency more substantially than translation
      quality in simultaneous speech translation.
    source: §4.1, Tables 3, 4
    evidence: RL reduces FLAL from 3.90 to 2.37 and AL from 2.82 to 2.58 on RealSI, while VIP improves
      more modestly from 75.1 to 79.5 compared to the SFT baseline.
    confidence: medium
    relevance: medium
  - claim_id: seedliveinterpret_automated_metrics_dont_capture_si_quality
    role: complicates
    claim: Automated MT metrics such as BLEURT and COMET do not fully capture the quality of simultaneous
      speech interpretation in realistic long-form scenarios.
    source: §3.2, Appendix A
    evidence: The paper introduces SVIP as a composite human evaluation metric combining translation quality,
      delivery latency, speech rate, pronunciation, and fluency, arguing automated metrics fail to assess
      the pragmatic requirements of live spoken interpretation.
    confidence: medium
    relevance: medium
  limitations:
  - Training data, model weights, and all commercial baseline identities are proprietary; the headline
    results cannot be independently reproduced or verified.
  - Evaluation covers only Chinese-to-English and English-to-Chinese translation; generalisation to other
    language pairs is untested.
  caveats:
  - Given the fully proprietary setting (data, weights, and baseline identities all undisclosed), this
    paper's headline comparisons against commercial competitors should be treated as a frontier claim
    pending independent replication, not as established fact.
- id: 2025.findings-ijcnlp.49
  entry_date: '2026-07-19'
  year: 2025
  venue: ACL
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: high
  evidence_role:
  - core_evidence
  - architecture_variant
  current_role: active_evidence
  method_family:
  - native_joint_speech_text_lm
  claims:
  - claim_id: jmoshidst_full_duplex_dst_via_text_stream
    role: supports
    claim: A full-duplex speech language model can perform structured dialogue state tracking when DST
      is executed entirely through the model's text stream using explicit delimiter tokens.
    source: §3, §5.3, Table 1
    evidence: J-Moshi-ext fine-tuned on synthesized JMultiWOZ data achieves JGA 65.69 and Slot F1 97.78
      on the JMultiWOZ test set, with both metrics improving monotonically as training data volume increases
      from 25% to 100%.
    confidence: high
    relevance: high
  - claim_id: jmoshidst_task_oriented_extension_leaves_gap_to_text
    role: complicates
    claim: Extending full-duplex speech models to task-oriented dialogue does not close the gap with text-based
      systems on response generation quality.
    source: §5.3, Table 1
    evidence: The proposed method reaches BLEU 0.129 and BERTScore 0.689, against text-based upper bounds
      of BLEU 0.364 and BERTScore 0.830 (T5-large), a gap attributed to insufficient training data and
      text-audio modality alignment difficulty.
    confidence: high
    relevance: high
  - claim_id: jmoshidst_synthetic_tts_noise_compounds
    role: complicates
    claim: TTS data quality limitations compound into downstream training noise when synthesized speech
      is used to construct full-duplex dialogue training corpora.
    source: §5.3
    evidence: The multilingual OuteTTS model used for Japanese speech synthesis generated speech with
      reduced clarity, causing recognition errors during time-aligned tokenization that hindered learning
      of coherent response generation.
    confidence: medium
    relevance: low
  - claim_id: jmoshidst_dst_timing_feasible_with_error
    role: supports
    claim: DST timing estimation is feasible within a full-duplex spoken dialogue model but introduces
      substantial prediction error tied to the model's speech perception accuracy.
    source: §5.1, §5.3
    evidence: DST initiation timing achieved a mean absolute error of 4.9 seconds from the reference,
      attributed to the difficulty of predicting user utterance boundaries from audio token representations
      alone.
    confidence: medium
    relevance: medium
  limitations:
  - All experiments are conducted in Japanese using J-Moshi, trained on less Japanese data than the original
    English Moshi; cross-lingual generalisability is untested.
  - Evaluation is fully automatic (JGA, Slot F1, BLEU, BERTScore); no subjective listening tests or user
    studies are reported.
  caveats:
  - The experiment covers only JMultiWOZ's travel-planning domain; extension to diverse or open-domain
    task-oriented settings is planned but not yet evaluated.
- id: 2025.findings-acl.115
  entry_date: '2026-07-19'
  year: 2025
  venue: ACL
  task:
  - SCA
  - TTS
  architecture:
  - autoregressive-LM
  relevance: high
  evidence_role:
  - core_evidence
  - control_evidence
  current_role: active_evidence
  method_family:
  - modular_gated_streaming_tts_decoder
  claims:
  - claim_id: slamomni_semantic_group_modeling_reduces_cost
    role: supports
    claim: Grouping discrete semantic tokens during autoregressive generation reduces training and inference
      costs by alleviating the frequency mismatch between text and audio token streams.
    source: §5.4.1, Table 6
    evidence: Semantic Group Modeling with G=3 reduces SLAM-Omni training from 126 to 60 GPU hours and
      ASR-WER from 18.23% (G=1) to 4.54%, providing the best quality-efficiency trade-off across five
      group sizes tested.
    confidence: high
    relevance: medium
  - claim_id: slamomni_modality_pretraining_can_degrade_instruction_following
    role: refines
    claim: Multi-stage pre-training on modality-specific tasks for spoken dialogue systems can degrade
      instruction-following ability despite improving modality alignment metrics.
    source: §5.4.2, Table 7
    evidence: ASR pre-training reduces ChatGPT Score from 39.32 to 34.02 and TTS pre-training to 27.22,
      while ASR-WER improves only marginally, indicating that modality-specific pre-training shifts the
      model away from general instruction-following.
    confidence: high
    relevance: high
  - claim_id: slamomni_timbre_control_constrained_by_data
    role: complicates
    claim: Zero-shot timbre control in spoken dialogue systems achieves competitive speaker similarity
      but remains constrained by training data volume relative to dedicated TTS systems.
    source: §5.2, Table 5
    evidence: SLAM-Omni reaches SIM-o of 0.517, comparable to FireRedTTS (0.486) but below CosyVoice2
      (0.684), with the gap attributed to roughly 50x less training data.
    confidence: medium
    relevance: medium
  - claim_id: slamomni_text_history_sacrifices_paralinguistic_context
    role: complicates
    claim: Compressing multi-turn dialogue history to text representation sacrifices non-verbal paralinguistic
      context that may be important for maintaining dialogue coherence across turns.
    source: §3.5, §6 Limitations
    evidence: Historical Text Prompting stores only text history, explicitly trading away emotional and
      prosodic signals from previous dialogue turns for computational efficiency.
    confidence: medium
    relevance: medium
  - claim_id: slamomni_semantic_tokens_tighter_alignment_than_acoustic
    role: supports
    claim: Semantic token-based speech generation in spoken dialogue systems provides tighter speech-text
      alignment than acoustic codec-based approaches, as measured by word error rate between generated
      speech and corresponding text.
    source: §5.1, Table 3
    evidence: SLAM-Omni achieves the lowest ASR-WER (4.54%) among evaluated spoken dialogue models, outperforming
      larger models including Moshi (7.18%), GLM-4-Voice (12.71%), and Freeze-Omni (16.32%), using single-layer
      semantic tokens rather than multi-codebook acoustic tokens.
    confidence: high
    relevance: high
  limitations:
  - The single-stage training finding is demonstrated only at 0.5B scale with limited data (400K utterances);
    whether it holds at larger scales or more diverse corpora is untested.
  - 'Evaluation is narrow: the custom 8-task benchmark measures general spoken interaction but not domain-specific
    or emotion-aware dialogue quality.'
  caveats:
  - SLAM-Omni's finding that ASR/TTS pre-training degrades instruction-following directly tensions with
    Baichuan-Audio's finding in this same batch that staged pretraining reduces intelligence degradation;
    both are single-stage vs. two-stage comparisons under different training regimes and scales (0.5B
    vs. 7B), and this tension should be surfaced as a contested cluster in Phase 2 rather than silently
    reconciled.
- id: 2025.acl-long.997
  entry_date: '2026-07-19'
  year: 2025
  venue: ACL
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: high
  evidence_role:
  - core_evidence
  - control_evidence
  current_role: active_evidence
  method_family:
  - native_joint_speech_text_lm
  claims:
  - claim_id: alignslm_preference_opt_improves_semantic_coherence
    role: supports
    claim: Preference optimization with LLM-based semantic feedback improves long-range semantic coherence
      in textless spoken language models beyond next-token prediction training.
    source: §5.2, Table 2
    evidence: DPO with Mistral-score preference data raises T-StoryCloze from 69.7% to 74.2% (1.3B model)
      and from 75.4% to 83.8% (7B model) over the pre-trained TWIST baseline; curriculum learning further
      improves both to 76.1% and 85.6%.
    confidence: high
    relevance: high
  - claim_id: alignslm_llm_scoring_beats_perplexity_selection
    role: supports
    claim: LLM-based semantic scoring provides more effective alignment signal for speech continuation
      than perplexity-based preference selection.
    source: §5.1, Table 1
    evidence: On the 1.3B model, Align-SLM with Mistral score improves T-StoryCloze by +4.5 points over
      the pre-trained baseline, whereas the PPL-based variant degrades T-StoryCloze by 2.0 points.
    confidence: medium
    relevance: medium
  - claim_id: alignslm_curriculum_learning_progressive_gains
    role: supports
    claim: Curriculum learning with iteratively tightened preference thresholds yields progressive semantic
      improvements in preference-optimized spoken language models.
    source: §5.3, Appendix E, Table 2
    evidence: Two curriculum learning iterations on the 7B model improve T-StoryCloze from 83.8% to 85.6%
      and GPT4-o score from 3.50 to 3.56.
    confidence: medium
    relevance: low
  - claim_id: alignslm_gains_dont_transfer_to_lexical_grammar
    role: complicates
    claim: Semantic gains from preference optimization do not transfer uniformly to lexical and grammatical
      aspects of spoken language modeling.
    source: §5.5, Table 2
    evidence: Align-SLM shows only marginal sBLIMP improvement (+1.3 for the 1.3B Mistral variant), while
      AudioLM and SyllableLM, which use no preference training but better speech token designs, outperform
      on grammatical correctness.
    confidence: medium
    relevance: medium
  - claim_id: alignslm_textless_still_behind_cascade
    role: complicates
    claim: Textless end-to-end spoken language models remain substantially behind cascaded ASR+LLM pipelines
      in semantic understanding even with preference optimization.
    source: §5.5, Table 2
    evidence: The best Align-SLM variant achieves 77.9% sWUGGY and 86.8% T-StoryCloze, compared to 79.2%
      and 94.8% for the ASR+LLM cascade topline, a gap that preference optimization alone does not close.
    confidence: high
    relevance: high
  limitations:
  - Training and evaluation are restricted to English audiobook speech (LibriSpeech, MLS); generalisation
    to spontaneous, noisy, or multi-speaker speech is untested.
  - Does not compare against text-injecting SLMs (SPIRITLM, Moshi, VoxtLM) under matched data and compute
    budgets, so the relative cost of the textless constraint is unquantified.
  caveats:
  - Only the semantic dimension of SLM quality is addressed; paralinguistic aspects (prosody, speaking
    style, emotion) are explicitly out of scope.
- id: 2025.findings-acl.75
  entry_date: '2026-07-19'
  year: 2025
  venue: ACL
  task:
  - TTS
  architecture:
  - transformer-enc-dec
  relevance: high
  evidence_role:
  - core_evidence
  current_role: active_evidence
  method_family:
  - speech_to_speech_translation_systems
  claims:
  - claim_id: unitlang_textfree_guidance_matches_text_supervised
    role: supports
    claim: Discrete speech unit sequences can be compressed into text-like representations via n-gram
      language modelling, providing effective text-free guidance for both cross-modal and cross-lingual
      learning in speech translation.
    source: §2.1, §3.2, Table 2
    evidence: Unit language (2-gram merged mHubert units, K=3) achieves average ASR-BLEU of 21.5 on VoxPopuli
      across four language directions, matching recognised-text training and yielding +1.2 BLEU over the
      baseline using raw discrete units alone.
    confidence: high
    relevance: high
  - claim_id: unitlang_cm_cl_objective_conflict
    role: complicates
    claim: Combining cross-modal and cross-lingual auxiliary objectives in multi-task sequence-to-sequence
      speech translation training can produce gradient interference that limits the gains of each individual
      loss.
    source: §2.3, §3.2, §4.3
    evidence: Simultaneously applying source (L_CM) and target (L_CL) unit language losses without task
      prompts yields combined gains no greater than either loss alone, because CM guidance at middle encoder
      layers disrupts CL representation learning in upper layers.
    confidence: medium
    relevance: medium
  - claim_id: unitlang_task_prompt_separates_objectives
    role: supports
    claim: Learnable task-specific prompt vectors can separate competing auxiliary objectives within a
      shared Transformer encoder by enforcing distinct intermediate representations for each task.
    source: §2.4, §3.2, Table 2
    evidence: Two prompt vectors (b_CM, b_CL) prepended at different encoder layer boundaries, with a
      negative MSE diversification loss, fully recover the +1.2 BLEU combined gain from unit language
      guidance that is otherwise lost to task interference.
    confidence: medium
    relevance: medium
  - claim_id: unitlang_sequence_compression_enables_alignment
    role: refines
    claim: Sequence length compression is a critical enabler of cross-lingual alignment in textless speech
      translation, and n-gram-merged unit sequences provide substantially better compression than BPE
      pseudo-languages.
    source: §4.1, §4.6, Figure 4, Table 6
    evidence: Unit language lengths fall consistently between raw units and character-level text across
      all four VoxPopuli language pairs, and CL training with unit language outperforms BPE pseudo-language
      by +0.5 BLEU average.
    confidence: medium
    relevance: medium
  limitations:
  - Evaluation uses ASR-BLEU only on synthesized speech; naturalness, fluency, and speaker consistency
    of the output speech are not assessed.
  - Validated only on four European language directions (Spanish, French, English); generalisation to
    typologically distant or low-resource languages is unexamined.
  caveats:
  - As a direct S2S translation system, this paper's contribution is at the sequence-representation and
    training-objective level rather than the dialogue or duplex dimension of speech-to-speech.
- id: '2507.23159'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - evaluation_caution
  - infrastructure
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: fdbenchv15_responsiveness_floorholding_tradeoff
    role: complicates
    claim: Current full-duplex spoken dialogue systems face a fundamental responsiveness-versus-floor-holding
      trade-off, with no single system achieving strong performance across both genuine interruptions
      and non-addressee overlap scenarios.
    source: §4, Table 2
    evidence: GPT-4o achieves the highest interruption response rate (RESPOND=0.78) and fastest stop latency
      (0.23s) but incorrectly yields in 91% and 93% of non-addressee and background-speech cases respectively,
      while Nova Sonic and Gemini hold the floor well but respond slowly to genuine interruptions.
    confidence: high
    relevance: high
  - claim_id: fdbenchv15_low_latency_costs_false_yields
    role: complicates
    claim: Stop latency below roughly 0.5 seconds under genuine user interruptions is achievable for commercial
      API-based systems but comes at the cost of significantly elevated false-yield rates on backchannel
      and background speech.
    source: §4.1, Table 2
    evidence: GPT-4o's 0.23s stop latency on true interruptions is paired with 91-93% false-yield rates
      when a non-addressee or background speaker is talking, showing the fast-response strategy does not
      generalise to non-floor-taking audio.
    confidence: high
    relevance: medium
  - claim_id: fdbenchv15_prosodic_adaptation_diverges
    role: supports
    claim: Full-duplex systems exhibit measurable prosodic adaptation post-interruption, but the adaptation
      strategies diverge across architectures, with some systems showing unstable or brittle re-entry
      delivery.
    source: §5, Table 3
    evidence: GPT-4o and Gemini accelerate speech with elevated pitch after re-acquiring the floor, Freeze-Omni
      and Sonic instead reduce intensity while increasing variability, and Moshi's re-entry is erratic
      with inconsistent pitch and intensity.
    confidence: medium
    relevance: medium
  - claim_id: fdbenchv15_automated_overlap_eval_feasible
    role: supports
    claim: Automated evaluation of full-duplex overlap handling is feasible without human annotation by
      combining ASR transcription, LLM-based semantic classification, VAD-based timing measurement, and
      acoustic feature analysis.
    source: §2.3
    evidence: The benchmark scores five full-duplex systems on categorical dialogue behavior, timing latency,
      and prosodic adaptation entirely through GPT-4o transcript classification, Parakeet-TDT ASR, and
      paired-t-test acoustic comparison, with no human raters in the loop.
    confidence: medium
    relevance: low
  limitations:
  - All evaluation stimuli are synthesized rather than drawn from real conversational corpora, and the
    acoustic simulations for off-axis and background speech use fixed, rule-based filters.
  - Coverage is English-only and uses a single synthesized speaker voice for most scenarios.
  caveats:
  - Extends the same authors' original Full-Duplex-Bench (already in this concept's paper list) with prosodic
    analysis and more controlled non-addressee simulation, rather than introducing a new evaluation paradigm.
- id: '2508.02013'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - infrastructure
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: speechrole_text_lm_dominates_quality
    role: complicates
    claim: The quality of spoken role-playing in both cascaded and end-to-end systems is more strongly
      determined by the underlying language model's text reasoning ability than by the speech synthesis
      or speech-to-speech architecture.
    source: §5.2
    evidence: Cascaded systems built on a strong text LM (Llama-3.1-8B, overall 0.957) outperform GPT-4o
      Audio end-to-end (0.921), and open-source end-to-end models trail cascaded baselines across all
      dimensions, indicating text-LM quality rather than architecture drives outcomes.
    confidence: medium
    relevance: high
  - claim_id: speechrole_finetuning_helps_expressive_more_than_fidelity
    role: supports
    claim: End-to-end speech-language models exhibit larger gains from task-specific fine-tuning in expressive
      speech dimensions than in interaction or role fidelity dimensions, which remain text-LM bottlenecked.
    source: §5.2
    evidence: Fine-tuning Qwen2.5-Omni on SpeechRole-Data raises overall English score from 0.568 to 0.801,
      with gains extending to unseen roles (0.783 OOD), while personality and relational consistency gains
      remain smaller than expressiveness gains.
    confidence: medium
    relevance: medium
  - claim_id: speechrole_llm_judge_matches_human_experts
    role: supports
    claim: LLM-based pairwise evaluation of speech quality can achieve high rank correlation with human
      expert judgements when using multi-reference normalisation, making automated SRPA benchmarking feasible
      at scale.
    source: §5.3, Table 3
    evidence: Spearman's rho between the Gemini-2.5-Pro LLM judge and human expert annotators ranges from
      0.67 to 0.98 across metrics in English, with human-LLM agreement exceeding 0.75 for most dimensions.
    confidence: high
    relevance: medium
  - claim_id: speechrole_opensource_e2e_capability_gap
    role: complicates
    claim: Current open-source end-to-end speech models lag proprietary cascaded systems in prosody consistency
      and emotion appropriateness by margins large enough to constitute a capability gap, not merely a
      performance gap.
    source: §5.2, Table 2
    evidence: Open-source end-to-end models Qwen2.5-Omni and LLaMA-Omni score well below cascaded baselines
      across all dimensions, with Qwen2.5-Omni reaching only 0.568 overall in English against 0.957 for
      the best cascaded system.
    confidence: medium
    relevance: high
  limitations:
  - All evaluation reference speech is TTS-synthesised rather than recorded from human actors, so scores
    measure performance relative to synthetic reference quality rather than a naturalness ceiling.
  - Coverage is limited to English and Chinese; the evaluation judge (Gemini-2.5-Pro) is a proprietary
    black box.
  caveats:
  - The dataset and benchmark target speech-based role-playing dialogue specifically, providing direct
    sub-paradigm-1 (E2E spoken dialogue) evidence via both cascaded and end-to-end system comparisons.
- id: '2508.07375'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: high
  evidence_role:
  - core_evidence
  - control_evidence
  current_role: active_evidence
  method_family:
  - full_duplex_dual_stream_architectures
  claims:
  - claim_id: turnguide_turn_level_text_beats_word_level
    role: supports
    claim: Aggregating text tokens at the dialogue-turn level provides stronger semantic guidance for
      full-duplex speech generation than word-level token-by-token text insertion.
    source: §2.2, §4.2.1, Table 2
    evidence: TurnGuide's turn-level text-speech interleaving achieves a GPT-score of 7.27 versus 5.91
      for the word-level Speech Chunk Interleaving baseline on the Fisher test set, a 24% relative gain.
    confidence: high
    relevance: high
  - claim_id: turnguide_insertion_timing_more_sensitive_than_length
    role: refines
    claim: The timing of text insertion into full-duplex dialogue sequences is more sensitive to error
      than the length of inserted text, with mistimed insertions causing larger semantic degradation than
      incorrectly sized text chunks.
    source: §4.2.3, Table 4
    evidence: Shifting text insertion 4 seconds early causes the largest ablation degradation (GPT-score
      5.61 vs. 6.76 at nominal timing), a bigger drop than either too-long or too-short text chunk variants.
    confidence: medium
    relevance: medium
  - claim_id: turnguide_text_loss_weighting_improves_semantics
    role: supports
    claim: Increasing the training loss weight of text tokens relative to speech tokens in a text-speech
      interleaved model improves semantic quality without sacrificing turn-taking naturalness.
    source: §4.2.1, Table 2
    evidence: The 2:1 and 3:1 text-to-speech loss weighting variants reach GPT-scores of 7.70 and 7.79,
      exceeding the 1:1 baseline (7.27) and matching or exceeding the ground-truth-transcript upper bound
      (7.39), while retaining competitive Full-Duplex-Bench turn-taking metrics.
    confidence: high
    relevance: medium
  - claim_id: turnguide_finegrained_benchmarks_more_informative
    role: supports
    claim: Fine-grained turn-taking benchmarks are more informative than corpus-level statistical correlations
      for evaluating full-duplex spoken dialogue models.
    source: §4.2.2
    evidence: TurnGuide is at parity with baselines on corpus-level Pearson correlation of turn-taking
      statistics (Table 7) but shows clear differentiation on Full-Duplex-Bench's scenario-specific metrics,
      which the paper uses to establish its advantage over dGSLM and Moshi.
    confidence: medium
    relevance: low
  - claim_id: turnguide_gptscore_aligns_with_human_above_threshold
    role: refines
    claim: GPT-based automated semantic evaluation of spoken dialogue aligns closely with human preference
      judgements when score differences exceed one point, but reliability degrades for near-tied comparisons.
    source: Appendix A, Table 5
    evidence: GPT-score-based pairwise rankings match human listening-test preferences in 25 of 30 comparisons,
      with disagreements concentrated among model pairs whose GPT-scores differ by less than one point.
    confidence: medium
    relevance: low
  limitations:
  - All results are on the Fisher telephone conversation corpus only, restricted to English spontaneous
    telephone speech.
  - The model has not undergone safety alignment (RLHF or equivalent), and theoretical first-package latency
    (1.05s) is workable but not near real-time.
  caveats:
  - Evaluates against a Fisher-fine-tuned reimplementation of Moshi (Moshi TS), not the original Moshi
    checkpoint, so cross-system comparisons in this paper are not directly comparable to Moshi's original
    reported numbers.
- id: '2508.09600'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  architecture:
  - autoregressive-LM
  - flow-matching
  relevance: high
  evidence_role:
  - core_evidence
  - infrastructure
  current_role: active_evidence
  method_family:
  - modular_gated_streaming_tts_decoder
  claims:
  - claim_id: osumechat_cot_paralinguistic_improves_empathy
    role: supports
    claim: Explicit chain-of-thought reasoning over paralinguistic cues (emotion, age, gender, sound events)
      improves empathetic response generation in speech-to-speech dialogue systems.
    source: §OSUM-EChat Training, Stage 3 Empathy; Table 2
    evidence: Removing the dual-think chain-of-thought mechanism drops the multi-label EChat-eval score
      from 72.0 to 56.4, the largest single-component ablation drop in the paper.
    confidence: high
    relevance: high
  - claim_id: osumechat_understanding_pretraining_reduces_data_need
    role: supports
    claim: Pretraining on multitask speech understanding before speech-to-speech dialogue training reduces
      dependence on large-scale paired dialogue datasets while maintaining paralinguistic modelling quality.
    source: §OSUM-EChat Training, Stage 1; Table 2
    evidence: Removing the understanding-driven Stage 1 training drops the multi-label EChat-eval score
      from 72.0 to 63.1, despite the model being trained on a comparatively modest 50Kh understanding
      corpus rather than industrial-scale paired dialogue data.
    confidence: medium
    relevance: high
  - claim_id: osumechat_synthetic_s2s_data_expressiveness_gap
    role: complicates
    claim: Synthetic speech-to-speech data derived from TTS systems exhibits reduced emotional expressiveness
      compared to real human speech, creating a systematic domain gap that degrades empathetic dialogue
      evaluation.
    source: §EChat-200K Dataset
    evidence: The EChat-200K training corpus is almost entirely synthesised via CosyVoice2 for both query
      and response audio, and the authors note this synthetic audio lags real human speech in emotional
      expressiveness, motivating the inclusion of a real-recording subset in EChat-eval.
    confidence: medium
    relevance: medium
  - claim_id: osumechat_automatic_empathy_eval_diverges_from_human
    role: complicates
    claim: Automatic empathy evaluation pipelines using LLM scoring and automatic emotion classifiers
      diverge measurably from human judgements, primarily due to emotion classifier errors and LLM hallucinations.
    source: §Main Results, Results of Empathetic Intelligence; Table 3
    evidence: Automated GPT-4o plus emotion2vec-Large scoring produces rankings consistent with human
      evaluation but absolute scores that diverge meaningfully, attributed to emotion2vec labelling errors
      and GPT-4o hallucinations.
    confidence: medium
    relevance: low
  - claim_id: osumechat_native_multimodal_better_for_paralinguistics
    role: supports
    claim: Native multimodal models that integrate speech token prediction directly into the LLM are better
      suited to capturing and generating paralinguistic nuance than modularly aligned architectures that
      treat speech decoding separately.
    source: §Introduction; §Related Work End-to-End Spoken Dialogue System
    evidence: OSUM-EChat, a native multimodal architecture where the LLM predicts both text and CosyVoice
      speech tokens directly, achieves the highest sound-event empathy score (87.1) where most competitors
      score zero because they lack the capability.
    confidence: medium
    relevance: medium
  limitations:
  - The EChat-200K training corpus is almost entirely synthetic; generalisability to natural in-the-wild
    speech remains unvalidated.
  - General linguistic reasoning regresses substantially after the multi-stage training (GSM8K drops from
    85 to 34 relative to the Qwen2.5-3B base), indicating the speech capability gain comes at a cost to
    LLM reasoning.
  caveats:
  - As a native end-to-end empathetic spoken chatbot, this paper is direct sub-paradigm-1 evidence; its
    claims about the text-LM reasoning trade-off are specific to the empathy/paralinguistic dimension
    rather than general dialogue coherence.
- id: '2503.04721'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - evaluation_caution
  - infrastructure
  current_role: influential
  method_family: []
  claims:
  - claim_id: fdbench_explicit_turnstate_reduces_interruptions
    role: supports
    claim: Explicit turn-state prediction modules reduce unwanted interruptions during intra-turn speaker
      pauses more effectively than purely end-to-end architectures trained on dialogue data.
    source: §V, Table III
    evidence: Freeze-Omni, which uses an explicit turn-state classifier, reduces pause-handling Takeover
      Rate to 0.481-0.642 versus 0.980-0.985 for the end-to-end Moshi model.
    confidence: high
    relevance: high
  - claim_id: fdbench_e2e_lower_latency_less_coherent
    role: complicates
    claim: End-to-end full-duplex speech models respond with lower latency but produce less semantically
      coherent replies when confronted with user interruptions than cascaded systems with a frozen LLM
      backbone.
    source: §V, Table III
    evidence: Moshi responds to interruptions fastest (0.257s) but scores only 0.765 on GPT-4o coherence,
      while the cascaded Freeze-Omni is slower (1.409s) but more coherent (3.615).
    confidence: high
    relevance: high
  - claim_id: fdbench_backchannel_unsolved
    role: complicates
    claim: Backchannel generation remains a largely unsolved capability in current full-duplex spoken
      dialogue models, with most open-source systems producing near-zero backchannel frequency.
    source: §V, Table III
    evidence: Only dGSLM produces backchannel responses at a measurable rate (0.015 events/s); Moshi and
      Freeze-Omni produce near-zero backchannel frequency.
    confidence: high
    relevance: medium
  - claim_id: fdbench_commercial_better_calibrated_turntaking
    role: supports
    claim: Commercial full-duplex systems exhibit better-calibrated turn-taking behaviour on naturalistic
      data than open-source research models, suggesting that VAD design and deployment-scale tuning contribute
      substantially to perceived conversational naturalness.
    source: §V, Table III
    evidence: Gemini Live achieves the lowest pause-handling Takeover Rate (0.255-0.310) among the four
      evaluated systems and the best backchannel-timing JSD (0.896).
    confidence: medium
    relevance: medium
  - claim_id: fdbench_automatic_metrics_reproducible
    role: supports
    claim: Automatic metrics for full-duplex dialogue can be made reproducible and model-agnostic without
      human raters, enabling rapid cross-system comparisons that corpus-level statistics and user studies
      cannot efficiently provide.
    source: §I, §III-A
    evidence: Full-Duplex-Bench evaluates four systems across pause handling, backchanneling, smooth turn-taking,
      and interruption management entirely through parakeet-tdt ASR transcripts and GPT-4o coherence scoring,
      without human annotators in the loop.
    confidence: medium
    relevance: low
  limitations:
  - The benchmark evaluates only four models (three open-source, one commercial API) and is restricted
    to English.
  - Backchannel detection relies on a heuristic duration-and-word-count rule that may not generalise across
    speaking styles or languages.
  caveats:
  - This is the original Full-Duplex-Bench (ASRU 2025); [[2507.23159]] (Full-Duplex-Bench v1.5, already
    integrated above) is the same authors' follow-up extending it with prosodic analysis.
- id: interspeech-2025-1595
  entry_date: '2026-07-19'
  year: 2025
  venue: Interspeech
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: high
  evidence_role:
  - core_evidence
  current_role: active_evidence
  method_family:
  - speech_to_speech_translation_systems
  claims:
  - claim_id: scheduledilt_gradual_modality_transition_improves_adaptation
    role: supports
    claim: Gradual modality transition during fine-tuning, rather than abrupt full-speech training, improves
      LLM adaptation from text to speech units.
    source: §3.2, Table 2
    evidence: Scheduled interleaved speech-text training, which decays the text ratio from 0.9 to 0 over
      training, consistently improves ASR-BLEU over the ASR-fine-tuned baseline across seven CVSS-C language
      pairs without degrading UTMOS.
    confidence: high
    relevance: high
  - claim_id: scheduledilt_lowresource_benefit_amplified
    role: refines
    claim: The benefit of interleaved speech-text training is amplified in low-resource language settings
      where speech-domain supervision is scarce.
    source: §4, Table 2
    evidence: Portuguese-to-English improves from 10.3 to 19.5 ASR-BLEU (+89%) and Russian-to-English
      from 6.0 to 14.1 (+135%), far larger gains than high-resource pairs like French-to-English (28.8
      to 29.5).
    confidence: high
    relevance: high
  - claim_id: scheduledilt_twosided_interleaving_necessary
    role: supports
    claim: Applying word-aligned text interleaving to both source and target sequences simultaneously
      is necessary; one-sided interleaving provides substantially weaker adaptation.
    source: §4, Table 3
    evidence: One-sided interleaving variants score only 11.1-12.6 ASR-BLEU on Portuguese-to-English versus
      19.5 for two-sided interleaving.
    confidence: high
    relevance: medium
  - claim_id: scheduledilt_modality_gap_length_and_representation
    role: supports
    claim: The modality gap between speech and text in LLM-based S2ST manifests as both a length disparity
      and a representation distance, and scheduled training addresses both.
    source: §3.1, Figure 3
    evidence: Speech units are 13-21 times longer than corresponding text, and the scheduled decay from
      near-text to near-speech representations is designed specifically to close this length and representation
      gap gradually.
    confidence: medium
    relevance: medium
  limitations:
  - Evaluation is limited to seven language pairs from a single corpus (CVSS-C) and a 1B-parameter LLM;
    scaling to larger models or more diverse corpora is untested.
  - The unit-based HiFi-GAN vocoder maps to a single canonical TTS voice, so speaker identity is not preserved
    and results do not generalise to voice-preserving S2ST.
  caveats:
  - This is direct sub-paradigm-2 (S2S translation) evidence at the LLM fine-tuning level; the paper explicitly
    notes extension to spoken dialogue systems as future work rather than current scope.
- id: interspeech-2025-bokkahallisatish25_interspeech
  entry_date: '2026-07-19'
  year: 2025
  venue: Interspeech
  task:
  - SCA
  - evaluation
  architecture: []
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: minor
  method_family: []
  claims:
  - claim_id: hearmeout_interactive_tools_surface_bias
    role: supports
    claim: Interactive evaluation tools that pair voice conversion with side-by-side response comparison
      can surface speaker-dependent biases in speech foundation models that automated benchmarks do not
      capture.
    source: §2.2, §2.4
    evidence: The platform lets users re-ask questions with voice-converted inputs and directly observe
      changes in response tone, phrasing, and behavior, positioning human interactive comparison as the
      primary bias discovery mechanism.
    confidence: low
    relevance: medium
  - claim_id: hearmeout_automated_metrics_insufficient_for_bias
    role: complicates
    claim: Automated speech evaluation metrics are insufficient on their own for assessing fairness and
      speaker-dependent behavior in speech foundation models.
    source: §2.3, §2.4
    evidence: Even with speech rate, pitch statistics, sentiment analysis, and semantic similarity available,
      the authors present human interactive comparison rather than the automated metrics as the primary
      mode of bias discovery.
    confidence: low
    relevance: medium
  - claim_id: hearmeout_benchmarks_treat_attributes_independently
    role: supports
    claim: Existing benchmarks for speech foundation models treat speaker attributes independently, limiting
      the ability to detect intersectional or compounded identity-based biases.
    source: §1
    evidence: A survey of VoxDialogue, Spoken StereoSet, and VoxEval finds each evaluates dimensions such
      as gender or age in isolation, with VoxEval explicitly excluding bias and harmful content analysis.
    confidence: medium
    relevance: low
  limitations:
  - The platform reports no empirical benchmark results; claims about its effectiveness at bias discovery
    remain qualitative and user-dependent.
  - The voice conversion module's perceptual fidelity is not systematically evaluated, which could confound
    interpretation of response differences.
  caveats:
  - A system demonstration rather than an empirical study; evaluates end-to-end speech-to-speech conversational
    systems (sub-paradigm 1) using voice conversion as a bias probe rather than proposing a new S2S architecture.
- id: interspeech-2025-0739
  entry_date: '2026-07-19'
  year: 2025
  venue: Interspeech
  task:
  - SCA
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - evaluation_caution
  - infrastructure
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: fdbenchpipeline_internal_interruption_detection_wins
    role: supports
    claim: Full-duplex spoken dialogue systems that integrate interruption detection internally rather
      than relying on external VAD modules show systematically higher interrupt success rates under challenging
      conditions.
    source: §3.2, Table 4
    evidence: Moshi, which uses a built-in full-duplex mechanism, reaches 61.7% success on Easy interruptions
      versus 11.3% for VAD-dependent Freeze-Omni and 26.9% for VITA-1.5.
    confidence: high
    relevance: high
  - claim_id: fdbenchpipeline_latency_robustness_tradeoff
    role: complicates
    claim: 'Real-time responsiveness (first-speech-emit delay) and interruption robustness trade off against
      each other: systems optimised for low latency may not handle mid-utterance interruptions reliably.'
    source: §3.2, Table 4
    evidence: Freeze-Omni achieves the lowest first-speech-emit delay (449-515ms vs. 2,020-4,155ms for
      Moshi) yet handles interruptions far less reliably than Moshi (11.3% vs. 61.7% success under Easy
      conditions).
    confidence: medium
    relevance: high
  - claim_id: fdbenchpipeline_background_noise_worse_than_gaps
    role: supports
    claim: Background noise degrades response quality in full-duplex spoken dialogue systems more severely
      than discrete noise events inserted into silence gaps.
    source: §3.2, Table 5
    evidence: Continuous background noise (Noise-bg) at low SNR degrades subjective scores across all
      three tested models, while gap noise (Noise-gap) has comparatively little effect, particularly for
      Freeze-Omni's high VAD threshold.
    confidence: medium
    relevance: medium
  - claim_id: fdbenchpipeline_llm_scoring_and_ppl_complementary
    role: supports
    claim: Automated LLM-based scoring and conditioned perplexity provide complementary signals for evaluating
      spoken dialogue quality, but neither alone captures interruption-handling behaviour.
    source: §2.3, §3.2
    evidence: GPT-4o subjective scoring and Llama-3.3-70B conditioned perplexity (c-PPL) are reported
      alongside timing-based interrupt metrics (SRRate, IRD, FSED) because neither language-based metric
      alone reflects interruption robustness.
    confidence: medium
    relevance: low
  - claim_id: fdbenchpipeline_far_from_human_robustness
    role: complicates
    claim: Current full-duplex spoken dialogue systems remain far from human-level robustness under frequent
      interruptions, suggesting the capability remains an open engineering and research challenge.
    source: §3.2, §5
    evidence: All three evaluated open-source systems (Moshi, Freeze-Omni, VITA-1.5) show substantial
      performance degradation under frequent interruptions and noisy conditions, with VITA-1.5 subjective
      scores dropping from 2.68 to 2.27 under hard interruptions.
    confidence: high
    relevance: medium
  limitations:
  - All reported results use CosyVoice2-synthesised speech only; the ChatTTS and F5-TTS corpus subsets
    are not reported, and no real human speech is used.
  - Evaluation is English-only and depends on GPT-4o and Llama-3.3-70B for subjective scoring, tying evaluation
    cost to specific external model versions.
  caveats:
  - Complements [[2503.04721]] (Full-Duplex-Bench) and [[2507.23159]] (Full-Duplex-Bench v1.5) as a third
    independent full-duplex evaluation pipeline, focused specifically on interruption-type taxonomy and
    noise robustness.
- id: interspeech-2025-0874
  entry_date: '2026-07-19'
  year: 2025
  venue: Interspeech
  task:
  - SCA
  architecture:
  - autoregressive-LM
  - hybrid
  relevance: high
  evidence_role:
  - core_evidence
  - acceleration_evidence
  current_role: influential
  method_family:
  - full_duplex_dual_stream_architectures
  claims:
  - claim_id: nvduplex_separated_streams_bypass_pretraining
    role: supports
    claim: Separating user and agent stream representations, using a pretrained speech encoder for input
      and a neural codec for generation, allows full-duplex S2S models to bypass LLM speech pretraining
      without sacrificing conversation quality.
    source: §3, §6.1, §6.2
    evidence: The proposed model outperforms Moshi on barge-in success rate (83.0% vs. 56.0% on UltraChat)
      and reasoning quality despite requiring no speech-text pretraining of the LLM backbone, unlike Moshi.
    confidence: high
    relevance: high
  - claim_id: nvduplex_codec_personalisation_recovers_quality_at_half_bitrate
    role: supports
    claim: Codec personalisation through fine-tuning on target-speaker data can recover audio quality
      at half the bitrate of an untuned codec, as measured by MOS, CER, and speaker similarity.
    source: §6.3, Table 4
    evidence: The personalised 0.6kbps NanoCodec achieves MOS 4.75, CER 1.36%, and SECS 0.94, outperforming
      both 1.2kbps NanoCodec and 1.1kbps Mimi at roughly half the bitrate.
    confidence: high
    relevance: medium
  - claim_id: nvduplex_turnlevel_alignment_sufficient_for_bargein
    role: supports
    claim: Turn-level alignment between text and speech tokens in duplex training is sufficient to learn
      barge-in behaviour; word-level alignment provides no measurable improvement.
    source: §3.1
    evidence: The model is trained with text and speech channels aligned at the turn level rather than
      word level and still achieves barge-in success rates of 83.0-94.5%, substantially exceeding Moshi's
      55-56%.
    confidence: medium
    relevance: medium
  - claim_id: nvduplex_e2e_reasoning_gap_vs_cascade
    role: complicates
    claim: Full-duplex end-to-end models remain at a reasoning disadvantage compared to cascaded oracle
      systems, though the gap narrows as backbone LLM quality increases.
    source: §6.2, Table 3
    evidence: The proposed model is competitive with an oracle cascaded system on two of five reasoning
      evaluation sets but still trails on the others despite outperforming Moshi across all five.
    confidence: medium
    relevance: high
  - claim_id: nvduplex_opensource_code_is_bottleneck
    role: supports
    claim: Open-source availability of training code and model weights is a critical bottleneck for research
      progress in full-duplex spoken dialogue, given the historical concentration of such systems in closed
      industrial labs.
    source: §1
    evidence: The paper frames its open-source release of both training and inference code as a significant
      contribution to reproducibility in a subfield that has been largely dominated by closed systems.
    confidence: low
    relevance: low
  limitations:
  - Training data is entirely synthetic (TTS-generated user and agent speech) except for the ASR-QA portion,
    introducing a domain mismatch with natural conversation.
  - No listening test (human MOS) is reported for duplex conversation quality; UTMOS and GPT score are
    used as proxies, and the backbone (TinyLlama-1.1B) is relatively small with untested scaling behaviour.
  caveats:
  - Comparisons with Moshi use shared test sets but different backbone sizes and training data, so cross-system
    comparisons in this paper are not fully controlled.
- id: interspeech-2025-2564
  entry_date: '2026-07-19'
  year: 2025
  venue: Interspeech
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: high
  evidence_role:
  - core_evidence
  - control_evidence
  current_role: active_evidence
  method_family:
  - native_joint_speech_text_lm
  claims:
  - claim_id: jmoshi_pretraining_finetuning_yields_language_specific_behavior
    role: supports
    claim: Large-scale monolingual pre-training followed by stereo dialogue fine-tuning enables spoken
      dialogue models to acquire language-specific conversational behaviors.
    source: §5, Table 3
    evidence: J-Moshi, trained on J-CHAT and stereo Japanese dialogue, exhibits more speech overlaps (5.0s/min)
      and more IPUs (53.2/min) than English Moshi (1.2s overlap, 35.1 IPUs), consistent with known Japanese
      conversational norms.
    confidence: medium
    relevance: high
  - claim_id: jmoshi_synthetic_dialogue_improves_language_capability
    role: supports
    claim: Synthetic spoken dialogue generated by multi-stream TTS improves language capability in full-duplex
      dialogue models when added to fine-tuning data.
    source: §4.3, Table 2
    evidence: J-Moshi-ext, fine-tuned with 602 additional hours of TTS-synthesized dialogue, achieves
      meaningfulness 2.30 versus J-Moshi's 2.19 with no degradation in naturalness.
    confidence: medium
    relevance: medium
  - claim_id: jmoshi_codec_transfers_lm_needs_retraining
    role: complicates
    claim: Neural audio codecs pre-trained on one language can transfer to another with minimal acoustic
      degradation, but the autoregressive language model component requires substantial retraining to
      achieve acceptable dialogue quality.
    source: §4.3, Table 2
    evidence: Mimi re-synthesis of Japanese speech degrades by only about 0.5 MOS from ground truth, while
      the fully adapted J-Moshi (RQ-Transformer retrained) still degrades by more than 1 MOS, identifying
      the language model as the primary quality bottleneck.
    confidence: medium
    relevance: high
  - claim_id: jmoshi_morphological_density_affects_training
    role: complicates
    claim: 'Morphological density differences across languages affect full-duplex dialogue model training
      dynamics: languages with higher phoneme-to-token ratios produce sparser text-to-audio token alignments
      that may require adjusted training objectives.'
    source: §5
    evidence: Japanese data preprocessing results in 88% PAD tokens in text sequences versus 65% for English
      in Moshi, reflecting that kanji characters encode more phonemes per token.
    confidence: low
    relevance: medium
  limitations:
  - Both J-Moshi variants score more than 1 MOS below the Mimi re-synthesis ceiling, indicating the autoregressive
    RQ-Transformer component remains a major quality bottleneck in Japanese.
  - The comparison with English Moshi is not conducted under identical experimental conditions (different
    test sets, possibly different prompt lengths).
  caveats:
  - First publicly available full-duplex S2S system for Japanese, extending the Moshi architecture (already
    represented in this concept's paper list) to a new language rather than introducing a new architecture.
- id: '2508.15827'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: high
  evidence_role:
  - core_evidence
  current_role: active_evidence
  method_family:
  - native_joint_speech_text_lm
  claims:
  - claim_id: miniomnireasoner_throughput_surplus_no_latency_conflict
    role: supports
    claim: In speech models, reasoning depth and response latency are not fundamentally in conflict when
      the model's token generation rate substantially exceeds the real-time audio playback rate.
    source: §1, §3.1
    evidence: A 3B model generates roughly 100 tokens/second while natural speech playback requires only
      about 12.5 tokens/second, leaving throughput surplus that the 2:8 response-to-reasoning interleaving
      ratio allocates to silent reasoning with no added latency.
    confidence: medium
    relevance: high
  - claim_id: miniomnireasoner_interleaved_reasoning_improves_accuracy_reduces_length
    role: supports
    claim: Interleaving silent reasoning tokens with spoken response tokens at a fixed ratio can improve
      accuracy on structured reasoning tasks while reducing audible output length.
    source: §2.3, §4.4, Table 2
    evidence: Mini-Omni-Reasoner improves arithmetic accuracy on Spoken-MQA from 64.9% (base Qwen2.5-Omni-3B)
      to 77.25% while cutting response length by over 60% (42.9 vs. 116.1 words for a 7B baseline).
    confidence: high
    relevance: high
  - claim_id: miniomnireasoner_thinkbeforespeak_causes_latency_or_verbosity
    role: complicates
    claim: The 'thinking-before-speaking' paradigm, when applied directly to speech, produces user-facing
      latency or verbosity that impairs conversational quality independently of reasoning correctness.
    source: §1, §2.2
    evidence: Standard thinking-before-speaking requires completing the full reasoning trace before any
      audio output, forcing either a silent wait or a verbose verbalised reasoning chain, both of which
      the interleaved design is built to avoid.
    confidence: medium
    relevance: medium
  - claim_id: miniomnireasoner_staged_training_effective_adaptation
    role: supports
    claim: Multi-stage training, separating modality alignment, reasoning transfer, and acoustic synthesis,
      is an effective strategy for progressively adapting an existing speech LLM to a new generation paradigm.
    source: §3.3
    evidence: The five-stage training pipeline (adapter alignment, mathematical pretraining, textual interleaving,
      acoustic transfer, Talker training) isolates each adaptation step and the resulting model outperforms
      all evaluated 3B conversational baselines.
    confidence: medium
    relevance: medium
  - claim_id: miniomnireasoner_synthetic_tts_data_sufficient
    role: supports
    claim: Synthetic speech-based mathematical reasoning datasets constructed from text corpora via TTS
      can provide sufficient training signal for spoken reasoning capabilities.
    source: §3.2, §4.4
    evidence: The SPOKEN-MATH-PROBLEMS-3M dataset, built by converting text maths QA corpora to speech
      via CosyVoice2-0.5B, is sufficient to train a model that matches or exceeds a cascade upper bound
      (77.25% vs. 77.3%) on arithmetic reasoning.
    confidence: medium
    relevance: low
  limitations:
  - The entire evaluation uses a single benchmark (Spoken-MQA) focused on mathematics; there is no assessment
    of speech naturalness, intelligibility, or open-domain conversational reasoning.
  - Training data is entirely synthetic (both audio and reasoning traces); whether the model generalises
    to naturalistic spoken queries beyond maths problems is untested.
  caveats:
  - Direct sub-paradigm-1 evidence for reasoning-latency trade-offs in E2E spoken dialogue; the finding
    is specific to structured maths reasoning and has not been validated on open-domain dialogue.
- id: '2507.16835'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  - evaluation
  architecture: []
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: minor
  method_family:
  - cascade_pipeline_systems
  claims:
  - claim_id: aiinterview_stt_quality_dominates_cascade
    role: supports
    claim: In cascaded STT-LLM-TTS pipelines, transcription quality has a larger effect on downstream
      conversational performance than LLM or TTS component selection.
    source: §4.5
    evidence: Switching from Whisper to Google STT produced larger effect sizes on all quality metrics
      than swapping LLM versions or TTS providers across 5,000+ production AI interviews in five configurations.
    confidence: medium
    relevance: high
  - claim_id: aiinterview_llm_judge_insufficient_proxy_for_satisfaction
    role: complicates
    claim: Automated LLM-based quality evaluation scores are insufficient proxies for user satisfaction
      in production voice-based conversational AI.
    source: §4.6
    evidence: LLM-as-Judge conversational and technical quality scores showed Pearson correlations below
      0.11 with candidate post-interview star ratings, despite high internal correlation among the automated
      sub-metrics.
    confidence: medium
    relevance: medium
  - claim_id: aiinterview_tts_secondary_effect
    role: supports
    claim: TTS component selection has a systematic but secondary effect on user experience in production
      voice-based conversational AI, smaller than the effects of STT or LLM choices.
    source: §4.5, Table 3
    evidence: Cartesia TTS outperformed OpenAI TTS by only 0.1-0.2 points across all LLM-judge metrics,
      a smaller margin than the STT or LLM component effects.
    confidence: low
    relevance: medium
  - claim_id: aiinterview_satisfaction_depends_on_unmeasured_factors
    role: complicates
    claim: User satisfaction in voice-based conversational AI depends on factors beyond measurable conversational
      and technical quality metrics.
    source: §4.6, §5
    evidence: The consistently weak correlation (below 0.11) between automated quality scores and user
      star ratings, combined with a higher correlation for soft-skills assessment (0.53), suggests perceived
      interpersonal qualities influence satisfaction independently of assessed question quality.
    confidence: medium
    relevance: medium
  limitations:
  - The five configurations were deployed in non-overlapping time windows rather than concurrently, introducing
    temporal confounds that prevent clean causal attribution.
  - Findings are specific to a proprietary job-interview application; user expectations and success criteria
    differ substantially from other cascade S2S deployment domains.
  caveats:
  - This is production-scale sub-paradigm-3 (cascade) evidence; no new model is trained, and all components
    evaluated are proprietary commercial APIs, limiting reproducibility.
- id: '2508.16188'
  entry_date: '2026-07-19'
  year: 2025
  venue: EMNLP
  task:
  - TTS
  - SCA
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - architecture_variant
  - control_evidence
  current_role: frontier_probe
  method_family:
  - native_joint_speech_text_lm
  claims:
  - claim_id: avlm_visual_features_complement_audio_emotion
    role: supports
    claim: Full-face visual features encode complementary emotional information not captured by audio
      alone, and combining both modalities yields meaningfully higher emotion recognition accuracy than
      either modality individually.
    source: §3, Table 1
    evidence: The audio-visual language model reaches 66.2% F1 on four-class IEMOCAP emotion recognition
      versus 61.3% for the speech-only SpiritLM baseline, a +4.9 F1 gain.
    confidence: medium
    relevance: medium
  - claim_id: avlm_prefix_fusion_beats_concatenation
    role: supports
    claim: Prefix-based visual fusion using compressed Q-Former query latents integrates more effectively
      into autoregressive speech LMs than direct feature concatenation, which collapses perplexity.
    source: §5.1, Table 3
    evidence: Among three fusion strategies compared, Q-Former Prefix with 30% speech attention masking
      achieved the lowest perplexity and was adopted as the base for all downstream fine-tuning, while
      direct concatenation collapsed perplexity.
    confidence: medium
    relevance: low
  - claim_id: avlm_visual_guidance_improves_generated_speech_alignment
    role: supports
    claim: Visual guidance during training improves not only classification accuracy but also the emotional
      alignment of generated speech in conversational settings.
    source: §5.3, Table 7
    evidence: For expressive speech generation evaluated by Qwen2-Audio, the audio-visual model achieves
      42.49% emotion F1 versus 38.39% for the speech-only baseline, a +4.1 F1 gain.
    confidence: medium
    relevance: high
  - claim_id: avlm_prompt_only_emotion_control_insufficient
    role: complicates
    claim: Emotion controllability through prompt-only label manipulation is insufficient when a model
      is trained on data where input and response emotions are correlated; in-context demonstrations are
      necessary to override this bias.
    source: §5.3, Figure 5
    evidence: Zero-shot prompt modification of the emotion label largely fails to change the emotional
      tone of generated speech; only in-context learning demonstrations per emotion class substantially
      improve responsiveness.
    confidence: medium
    relevance: medium
  limitations:
  - The expressive generation evaluation relies on a third-party classifier (Qwen2-Audio) with no human
    perceptual evaluation of naturalness or quality.
  - The fine-tuning dataset is small (4,859 synthetic pairs from IEMOCAP) and restricted to a closed four-class
    emotion taxonomy on a two-speaker dyadic corpus.
  caveats:
  - This is an audio-visual conditioned expressive speech generation system rather than a full spoken-dialogue
    system; its relevance to speech-to-speech is as a multimodal conditioning variant on the response-generation
    side of E2E dialogue, not a complete duplex or turn-taking system.
- id: '2508.17623'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - evaluation_caution
  - infrastructure
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: emoreasoning_multiturn_emotional_coherence_fails
    role: complicates
    claim: Current spoken dialogue systems reliably fail to sustain emotionally coherent responses across
      multi-turn conversations, with degradation compounding across turns.
    source: §V, Table V
    evidence: Moshi's perceptual Emotion Reasoning Score drops from 0.284 (single-turn) to 0.271 (multi-turn)
      and dGSLM's from 0.296 to 0.291, both well below the human DailyTalk baseline of 0.928.
    confidence: high
    relevance: high
  - claim_id: emoreasoning_automatic_metrics_overestimate_atypical_systems
    role: complicates
    claim: Automatic continuous and categorical emotion metrics correlate moderately with human perceptual
      judgements on most SDMs, but overestimate emotional coherence on systems with atypical output characteristics.
    source: §V, Figure 3, Figure 4
    evidence: Moshi and dGSLM are overestimated by automatic continuous and categorical metrics relative
      to human ratings, signalling that current automatic emotion metrics do not fully capture human perception
      for these architectures.
    confidence: medium
    relevance: medium
  - claim_id: emoreasoning_categorical_continuous_tradeoff
    role: refines
    claim: Optimising for categorical emotion appropriateness and optimising for continuous affect trajectory
      alignment represent distinct objectives that current SDMs trade off against each other rather than
      jointly satisfying.
    source: §V, Table IV
    evidence: Freeze-Omni achieves the strongest categorical-based score (0.738) while GLM-4-Voice leads
      on continuous-based scores (0.803) in single-turn settings, and the two systems do not co-rank.
    confidence: medium
    relevance: medium
  - claim_id: emoreasoning_synthetic_tts_data_sufficient_for_eval
    role: supports
    claim: Synthetic emotional speech generated by controllable TTS systems provides sufficient variety
      and quality to serve as evaluation stimulus material when real annotated data is scarce.
    source: §IV-A, Table III
    evidence: The benchmark's synthetic dataset, rendered via CosyVoice from GPT-4-generated scripts across
      four emotion classes, is used alongside real DailyTalk speech as the evaluation stimulus set for
      seven spoken dialogue systems.
    confidence: medium
    relevance: low
  limitations:
  - Human perceptual evaluation covers only 20 randomly sampled dialogues per system rated by 20 annotators;
    inter-rater agreement statistics are not reported.
  - The benchmark covers English only and a closed four-class emotion taxonomy (neutral, happy, angry,
    sad).
  caveats:
  - Evaluates seven E2E spoken dialogue systems (sub-paradigm 1) including several already in this concept's
    paper list (Moshi, GLM-4-Voice, Freeze-Omni); its multi-turn degradation finding is a genuinely new
    diagnostic not previously quantified in this concept's evidence base.
- id: '2509.03940'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - evaluation_caution
  - infrastructure
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: voxrole_acoustic_quality_weakest_capability
    role: complicates
    claim: Acoustic quality (paralinguistic appropriateness) is the most consistently underperformed capability
      across current spoken dialogue models, even for proprietary systems, lagging well behind text generation
      and reasoning dimensions.
    source: '§Experiments: LLM-based Result, Table 3'
    evidence: Across all seven evaluated models, Acoustic (Paralinguistic) Appropriateness is universally
      the weakest LLM-judge dimension, with even GPT-4o scoring only 3.82 versus 4.48 on Contextual Coherence.
    confidence: high
    relevance: high
  - claim_id: voxrole_param_count_doesnt_predict_synthesis_quality
    role: supports
    claim: 'Model parameter count does not reliably predict speech synthesis quality in spoken dialogue
      systems: smaller, better-trained models can match or exceed much larger counterparts on naturalness
      metrics.'
    source: '§Experiments: Metric-based Results, Table 2'
    evidence: Qwen2.5-Omni (7B) achieves UTMOS 3.57, nearly matching GPT-4o (3.66), while Step-Audio (132B)
      scores only UTMOS 2.42 despite having the highest BertScore F1.
    confidence: medium
    relevance: medium
  - claim_id: voxrole_llm_eval_with_acoustic_features_aligns_with_humans
    role: supports
    claim: LLM-based evaluation augmented with discrete acoustic features achieves strong alignment with
      human judgment on multi-dimensional spoken role-playing tasks.
    source: '§Evaluation Framework, §Experiments: Subjective experimental results'
    evidence: The acoustically-aware LLM judge, which augments transcribed text with pitch, energy, and
      speaking-rate bins, achieves a Pearson correlation of 0.762 with human annotator scores across 20
      sampled instances.
    confidence: medium
    relevance: medium
  - claim_id: voxrole_optimal_context_window_exists
    role: refines
    claim: There is an optimal context window length for spoken role-playing models beyond which additional
      conversational history degrades rather than improves performance.
    source: '§Experiments: Ablation study on context length, Table 4'
    evidence: An ablation over context window length (4-10 turns) shows a non-monotonic trend, with a
      6-turn context achieving the best overall score.
    confidence: medium
    relevance: low
  limitations:
  - The benchmark is sourced exclusively from movie dialogue, which is scripted and stylistically distinct
    from spontaneous conversational speech.
  - The benchmark is currently restricted to two-speaker conversations, limiting applicability to multi-party
    or group dialogue settings.
  caveats:
  - Direct sub-paradigm-1 evaluation evidence (speech role-playing agents); complements [[2508.02013]]
    (SpeechRole, already integrated above) as an independently constructed benchmark for the same task
    family.
- id: '2509.06502'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  architecture:
  - hybrid
  relevance: high
  evidence_role:
  - core_evidence
  - infrastructure
  current_role: active_evidence
  method_family:
  - modular_gated_streaming_tts_decoder
  claims:
  - claim_id: fireredchat_speaker_conditioned_vad_reduces_false_bargein
    role: supports
    claim: Speaker-conditioned VAD substantially reduces false barge-in rates in full-duplex spoken conversational
      agents compared to standard VAD, at the cost of slightly higher target-speaker response latency.
    source: §3.1, Table 2
    evidence: FireRedChat's personalized VAD achieves a 10.2% false barge-in rate versus 33.4% (LiveKit)
      and 78.1% (Ten), with a T90 of 170ms versus 140ms and 90ms respectively.
    confidence: high
    relevance: high
  - claim_id: fireredchat_compact_eot_classifier_matches_large_models
    role: supports
    claim: Compact task-specific classifiers for semantic end-of-turn detection can match parameter-heavy
      general-purpose language models while imposing negligible latency overhead.
    source: §3.2, Table 3
    evidence: A 170M-parameter BERT-based end-of-turn model achieves 96.0%/94.9% average accuracy on Chinese/English,
      on par with a 7B-parameter model (95.8%/94.4%).
    confidence: high
    relevance: medium
  - claim_id: fireredchat_semicascaded_offers_paralinguistic_awareness
    role: supports
    claim: Semi-cascaded architectures that replace the ASR+LLM cascade with a single AudioLLM offer paralinguistic
      awareness and reduced error propagation while maintaining competitive end-to-end latency.
    source: §2.3.2
    evidence: The semi-cascaded variant conditions FireRedTTS-2 directly on the user's input audio to
      capture emotional tone, mitigating ASR error propagation while enabling paralinguistic-consistent
      TTS synthesis.
    confidence: medium
    relevance: high
  - claim_id: fireredchat_e2e_s2s_faces_training_challenges
    role: complicates
    claim: End-to-end speech-to-speech models face training and architectural challenges that limit their
      use as a foundation for full-duplex interaction systems.
    source: §1
    evidence: The authors identify catastrophic forgetting in LLM backbones and token length mismatch
      between text and speech sequences as key drawbacks of end-to-end approaches, motivating their pluggable
      modular controller design instead.
    confidence: medium
    relevance: high
  - claim_id: fireredchat_systemlevel_metrics_needed
    role: supports
    claim: System-level evaluation of full-duplex voice interaction requires metrics beyond component-level
      quality scores, covering barge-in accuracy, semantic end-of-turn detection, and end-to-end latency
      jointly.
    source: §3
    evidence: FireRedChat introduces three interaction-level metrics (barge-in T90, false barge-in rate,
      end-to-first-response P50/P95) that capture naturalness, control accuracy, and efficiency independently
      of individual ASR, LLM, or TTS component scores.
    confidence: medium
    relevance: medium
  limitations:
  - All evaluation uses proprietary test data for barge-in and latency experiments (1,000 utterances per
    language, 25 synthetic utterances for latency), preventing external reproducibility.
  - The semi-cascaded pipeline's paralinguistic advantages are described qualitatively; no objective metric
    (MOS, emotion accuracy) quantifies the improvement, and the AudioLLM and FireRedTTS-2 components are
    proprietary and not released.
  caveats:
  - Directly compares cascade, semi-cascade, and (by argument) end-to-end sub-paradigms within a single
    deployable system, making it unusually direct cross-sub-paradigm evidence for this concept.
- id: '2509.09174'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: high
  evidence_role:
  - core_evidence
  current_role: active_evidence
  method_family:
  - native_joint_speech_text_lm
  claims:
  - claim_id: echox_decoupling_semantic_from_acoustic_reduces_degradation
    role: supports
    claim: Decoupling semantic training objectives from acoustic token prediction substantially reduces
      knowledge degradation in speech-to-speech LLMs.
    source: §5.1, Table 4
    evidence: Echo training, which generates speech targets from the model's own semantic hidden states,
      raises average spoken-QA accuracy from 24.3 (standard T2C decoder) to 37.1 (EchoX-3B) on the same
      data, versus 12.8 for direct interleaved training.
    confidence: high
    relevance: high
  - claim_id: echox_unit_compression_improves_accuracy
    role: supports
    claim: Unit-based speech token compression via language-model segmentation improves downstream accuracy
      and reduces sequence length without sacrificing audio quality.
    source: §5.3, Table 5, Figure 7
    evidence: Unit language achieves a 4.57 length-compression ratio versus 9.31 for raw HuBERT units,
      while improving accuracy on all three spoken-QA benchmarks and maintaining comparable spectral audio
      quality.
    confidence: medium
    relevance: medium
  - claim_id: echox_semantic_similarity_streaming_minimal_degradation
    role: supports
    claim: Streaming inference in speech LLMs can be achieved with minimal accuracy degradation when the
      segmentation boundary is determined by semantic similarity rather than fixed length.
    source: §5.4, Table 6
    evidence: EchoX's cosine-similarity streaming trigger reduces first-token latency from 138 to 27 tokens
      at 3B scale with less than 1.5 percentage points of accuracy drop on any spoken-QA benchmark.
    confidence: medium
    relevance: medium
  - claim_id: echox_data_efficiency_depends_on_paradigm
    role: complicates
    claim: Training data efficiency in speech LLMs may depend more on the training paradigm than on data
      volume.
    source: §4.2, Table 2
    evidence: EchoX-8B achieves 46.3 average spoken-QA accuracy using approximately 6,200 hours of training
      data, competitive with MinMo (47.2) and MiniCPM-o 2.6 (47.1), which are trained on far larger corpora,
      though this holds specifically for factual QA.
    confidence: medium
    relevance: medium
  - claim_id: echox_naturalness_and_helpfulness_not_jointly_optimized
    role: complicates
    claim: Speech naturalness and response helpfulness are not jointly optimised by the same training
      signal in speech-to-speech LLMs.
    source: Appendix C, Figure 8
    evidence: Human evaluation shows EchoX wins clearly on helpfulness against Freeze-Omni and LLaMA-Omni2
      but is only competitive, not dominant, on naturalness, reflecting a training objective focused on
      semantic correctness rather than prosodic quality.
    confidence: medium
    relevance: medium
  limitations:
  - Speech quality is assessed only via brief spectral comparison and a 5-rater human study; no perceptual
    quality metric (MOS, DNSMOS) is reported as a primary result.
  - Evaluation benchmarks are limited to factual knowledge QA (Llama Questions, Web Questions, TriviaQA);
    performance on open-ended dialogue or longer-form conversation is untested.
  caveats:
  - Core sub-paradigm-1 architectural/training evidence addressing acoustic-semantic conflict, a known
    bottleneck already central to this concept (paralinguistic variability in speech tokens).
- id: '2508.18240'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - evaluation_caution
  - infrastructure
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: mtalkbench_semantic_nonverbal_gap
    role: supports
    claim: Current speech-to-speech language models exhibit a systematic capability gap between semantic
      understanding and non-verbal speech dimensions such as paralinguistic and ambient sound processing.
    source: §6.3.1, Table 2
    evidence: All ten evaluated S2S models outperform the human baseline on semantic rubric scores but
      underperform on paralinguistic and ambient-sound dimensions, and no model exceeds 80/100 overall.
    confidence: high
    relevance: high
  - claim_id: mtalkbench_multiturn_verbosity_not_density
    role: complicates
    claim: Multi-turn spoken dialogue systems compensate for context-accumulation bottlenecks by increasing
      response verbosity rather than informational density.
    source: §6.3.2, Table 4
    evidence: Turn-level rubric scores show a dip from Turn 1 to Turn 2 with partial recovery at Turn
      3, while content density declines linearly across turns even as token count increases.
    confidence: medium
    relevance: medium
  - claim_id: mtalkbench_modality_aware_design_beats_scale
    role: supports
    claim: Task-specific modality-aware design provides greater performance gains in multi-turn spoken
      dialogue than parameter scaling alone.
    source: §6.3.3, Table 2
    evidence: Step-Audio-Chat (130B), which transcribes prior turns into text before processing, achieves
      the highest overall Arena Elo (1049) among open-source models, while parameter count shows no reliable
      correlation with performance across the evaluated set.
    confidence: medium
    relevance: high
  - claim_id: mtalkbench_llm_judge_unreliable_on_raw_audio_nonverbal
    role: complicates
    claim: LLM-as-judge automated evaluation of speech quality is unreliable for non-verbal audio cues
      when models are given raw waveforms.
    source: §7.2.2
    evidence: LLM evaluators achieve near-zero Spearman correlation with human evaluators on ambient sound
      and paralinguistic dimensions under raw-audio evaluation, but Spearman rho exceeds 0.85 when the
      same cues are provided as text annotations.
    confidence: high
    relevance: medium
  - claim_id: mtalkbench_arena_rubrics_consistent_only_for_large_gaps
    role: refines
    claim: Arena-style and rubrics-based evaluation methods yield consistent model rankings for speech
      systems, but only when performance gaps between models are sufficiently large.
    source: §7.2.1, §7.2.3, Table 2
    evidence: Bootstrap rubric-exclusion analysis shows Spearman rho > 0.95 alignment between Arena and
      Rubrics rankings overall, but small Elo and rubric-score differences correspond to statistically
      insignificant win-rate gaps.
    confidence: medium
    relevance: low
  limitations:
  - The benchmark contains only 270 audio samples, and the paper's own analysis shows reliable distinctions
    require large performance gaps between models.
  - The benchmark is English-only, and ambient-sound evaluation relies on artificially mixed audio rather
    than genuinely recorded noisy environments.
  caveats:
  - First holistic multi-turn, audio-grounded evaluation covering ten S2S systems (sub-paradigm 1) across
    semantic, paralinguistic, and ambient dimensions simultaneously.
- id: '2509.17765'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  - TTS
  architecture:
  - autoregressive-LM
  - hybrid
  relevance: medium
  evidence_role:
  - core_evidence
  - acceleration_evidence
  current_role: active_evidence
  method_family:
  - modular_gated_streaming_tts_decoder
  claims:
  - claim_id: qwen3omni_causal_convnet_vocoder_latency
    role: supports
    claim: Replacing a block-wise diffusion vocoder with a lightweight causal convolutional decoder, driven
      by a multi-codebook autoregressive token predictor, can substantially reduce first-packet latency
      in streaming speech generation without sacrificing competitiveness on content-consistency metrics.
    source: §2.4, §2.5, Table 1, Table 13
    evidence: The Talker's multi-codebook AR scheme plus a 200M-parameter causal ConvNet Code2Wav stage
      achieves a 234ms end-to-end first-packet latency at 1x concurrency and the lowest reported content-consistency
      error on SEED test-en (1.39) among all compared zero-shot TTS systems.
    confidence: high
    relevance: medium
  - claim_id: qwen3omni_multimodal_no_degradation
    role: supports
    claim: Mixing unimodal and cross-modal training data from the earliest stage of pretraining allows
      a language model to add new input/output modalities without degrading its original text, vision,
      or audio-specific capabilities relative to matched unimodal baselines.
    source: §6, Table 16
    evidence: A controlled comparison of parameter-matched text-only, vision-only, and Omni models trained
      on identical corpora, schedules, and compute shows the Omni model matches or exceeds the unimodal
      baselines on text, vision, and video benchmarks.
    confidence: high
    relevance: low
  - claim_id: qwen3omni_voice_cloning_language_unevenness
    role: complicates
    claim: Strong zero-shot voice-cloning performance in one or two conditioning languages does not guarantee
      comparable speaker-similarity performance uniformly across all supported languages.
    source: §5.2.2, Table 14
    evidence: Against MiniMax-Speech and ElevenLabs Multilingual v2 on a 10-language test set, the system
      leads by a substantial margin on Chinese, English, and French but reports only competitive, non-leading
      speaker-similarity or content-consistency scores on several other languages.
    confidence: medium
    relevance: low
  - claim_id: qwen3omni_purpose_built_audio_encoder
    role: supports
    claim: A large-scale, purpose-built supervised audio encoder trained from scratch for a multimodal
      LLM's audio pathway can outperform reusing a general pretrained ASR encoder (e.g., Whisper) as the
      perceptual front-end for both speech understanding and downstream speech generation.
    source: §1, §2.2, Table 6, Table 7
    evidence: Replacing the Whisper-based audio encoder from the predecessor system with AuT, trained
      from scratch on 20 million hours of supervised audio at a 12.5 Hz token rate, is cited as a key
      driver of gains across ASR, lyric-ASR, and voice-interaction benchmarks.
    confidence: medium
    relevance: medium
  limitations:
  - Speech generation quality is evaluated exclusively with automatic metrics (WER/CER, embedding-based
    speaker similarity); no human MOS or listening-test results are reported for the Talker's synthesized
    speech.
  - The reported 234ms first-packet latency is described as theoretical, measured under a specific deployment
    configuration, and degrades substantially under higher concurrency (up to 1172ms at 6-way concurrency).
  caveats:
  - Evaluation of the Thinker-Talker pipeline's spoken dialogue capability relies primarily on VoiceBench
    (voice-instruction-following) and zero-shot TTS/voice-cloning scores rather than dedicated turn-taking,
    duplex-interaction, or conversational-latency benchmarks used elsewhere in this concept.
- id: '2501.04561'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  - TTS
  architecture:
  - autoregressive-LM
  - hybrid
  relevance: medium
  evidence_role:
  - core_evidence
  - control_evidence
  current_role: active_evidence
  method_family:
  - modular_gated_streaming_tts_decoder
  claims:
  - claim_id: openomni_text_pivot_substitutes_trimodal_data
    role: supports
    claim: Progressive, text-pivoted alignment across modality pairs can substitute for paired tri-modal
      training data without sacrificing downstream omnimodal task performance.
    source: §4.2, Table 1
    evidence: OpenOmni trains only on speech-text and image-text pairs (no image-speech-text triples)
      yet outperforms VITA, which is trained on 5M tri-modal samples, by 4 points on OmniBench while using
      a 7B rather than 7x8B language model and roughly 5x fewer training samples.
    confidence: high
    relevance: medium
  - claim_id: openomni_nar_ar_quality_latency_tradeoff
    role: complicates
    claim: Non-autoregressive discrete-unit speech decoding trades generation quality for latency relative
      to autoregressive decoding.
    source: §4.2, §D "AR mode"
    evidence: The AR mode (16K-unit vocabulary) yields higher speech generation quality but slower streaming,
      while the NAR mode (6K-unit vocabulary, CTC loss) achieves under-1-second latency for up to 30 seconds
      of speech at the cost of slightly worse generation quality.
    confidence: medium
    relevance: medium
  - claim_id: openomni_dpo_emotional_coherence_ctc
    role: supports
    claim: Direct preference optimization can be adapted to discrete-unit, CTC-trained speech generators
      to improve emotional coherence without an auxiliary emotion-control module.
    source: §4.2, Table 4
    evidence: CTC-DPO training on the 9K-pair EO2S-9K preference dataset raises Emotion2Vec-classified
      emotion accuracy from 57.9% to 70.4% on Chinese and 62.6% to 65.4% on English test speech.
    confidence: medium
    relevance: medium
  - claim_id: openomni_moe_necessary_for_ctc_stability
    role: complicates
    claim: Mixture-of-experts capacity is necessary, not merely beneficial, for stabilizing CTC-loss training
      of multilingual non-autoregressive speech decoders.
    source: §3.4, §C, Table 6
    evidence: A single feed-forward decoder layer (1 expert) fails to converge on bilingual WeNetSpeech/LibriSpeech
      data (CER/WER up to 129.7), while a 4-expert MoE layer brings these down to single digits.
    confidence: medium
    relevance: low
  limitations:
  - The system is trained and validated only on Chinese and English; multilingual speech data beyond these
    two languages was not used due to resource constraints.
  - Evaluation of emotional and omnimodal quality relies on automated classifiers (Emotion2Vec, Whisper-based
    WER) rather than independent human listening tests.
  caveats:
  - OpenOmni's speech-to-speech framing is single-turn response generation (image/speech instruction to
    spoken answer), not a duplex or turn-taking dialogue system; it does not address interruption, backchanneling,
    or full-duplex interaction.
- id: '2509.22243'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - infrastructure
  - negative_evidence
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: flexi_jumpin_vs_pause_takeover_tradeoff
    role: complicates
    claim: Full-duplex speech systems face a trade-off between avoiding mid-turn jump-ins and avoiding
      premature takeover during a user's pause; tuning to reduce one failure mode appears to increase
      the other.
    source: §3.2, Table 2
    evidence: Moshi shows the lowest turn-taking latency but the highest jump-in rate (0.785) and the
      lowest (best) pause-handling takeover rate (0.55), while Freeze-Omni, Vita-1.5, and Gemini show
      near-zero jump-in rate but 85-94% pause-handling takeover rate.
    confidence: high
    relevance: high
  - claim_id: flexi_commercial_beats_opensource_on_interruption
    role: supports
    claim: Commercial full-duplex speech systems currently produce more topically coherent responses to
      user interruptions than open-source full-duplex systems.
    source: §3.2, Table 3
    evidence: Gemini-2.5-flash-live reaches Turn-Taking Rate 0.935 and GPT-4o-rated Topic Shift Score
      4.51/5 on the user-interrupt scenario, versus 0.226-0.539 TTR and 0.75-2.9 TSS for Moshi, Freeze-Omni,
      and Vita-1.5.
    confidence: high
    relevance: high
  - claim_id: flexi_emergency_detection_not_proactive_interrupt
    role: complicates
    claim: A full-duplex system's ability to recognize an emergency in its generated response content
      does not imply it will proactively interrupt the user to act on it.
    source: §3.2, Table 3
    evidence: Gemini attains the highest Emergency Detection Score (2.19) but a model-interrupt takeover
      rate of 0, while open-source models with higher takeover rates (up to 0.535) score lower on emergency
      detection.
    confidence: medium
    relevance: high
  - claim_id: flexi_backchannel_rarity_and_poor_timing
    role: complicates
    claim: Current full-duplex speech language models generate listener backchannels rarely and with poor
      timing alignment to human-judged reference positions.
    source: §3.2, Table 4; §4
    evidence: All four evaluated systems show near-zero Backchannel Rate (0.002-0.031) and Jensen-Shannon
      Divergence near the 1.0 maximum (0.947-0.986) against GPT-4o-annotated reference backchannel timing.
    confidence: medium
    relevance: high
  limitations:
  - Benchmark data is fully synthetic (LLM-generated queries synthesized with CosyVoice2, not real human
    speech).
  - Only one commercial system (Gemini-2.5-flash-live) is evaluated due to budget constraints, excluding
    GPT-4o-realtime, Nova Sonic, and DouBao.
  caveats:
  - Findings are specific to full-duplex dialogue interaction (turn-taking, interruption, backchanneling);
    the benchmark does not evaluate S2S translation or cascade-specific latency/quality trade-offs.
- id: '2506.21875'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - infrastructure
  - negative_evidence
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: wildspeech_s2t_does_not_predict_s2s_quality
    role: supports
    claim: Strong performance on speech-to-text dialogue benchmarks does not reliably predict a model's
      speech-to-speech generation quality.
    source: §3.2, Appendix G
    evidence: Kimi-Audio's text-response quality on VoiceBench's CommonEval subset drops from 3.97 (text-only
      mode) to 3.00 (dual-modal speech+text mode), and its overall WildSpeech-Bench score (4.54) trails
      several models it is known to outperform on S2T-only benchmarks.
    confidence: high
    relevance: high
  - claim_id: wildspeech_noise_vulnerability_universal
    role: complicates
    claim: End-to-end speech LLMs remain broadly vulnerable to background acoustic interference despite
      strong performance in clean conditions.
    source: §3.4, Figure 5
    evidence: Adding either environmental noise (ESC-50) or human background speech (LibriTTS) causes
      a significant performance decline across every evaluated model, including the top-performing GPT-4o-Audio.
    confidence: high
    relevance: medium
  - claim_id: wildspeech_cascade_matches_general_not_paralinguistic
    role: refines
    claim: Cascaded ASR-LLM-TTS pipelines can match dedicated end-to-end speech LLMs on general conversational
      quality, but the gap re-emerges specifically on tasks requiring paralinguistic understanding.
    source: §3.2, Table 2
    evidence: The naive Whisper + Qwen2.5-7B + MeloTTS pipeline scores comparably to GLM-4-Voice and MiniCPM
      overall (5.24 vs. 5.03/5.08) but scores markedly worse on the stress (2.95) and tone (4.12) paralinguistic
      subcategories.
    confidence: medium
    relevance: high
  - claim_id: wildspeech_checklist_eval_improves_human_alignment
    role: supports
    claim: Query-aware, checklist-based evaluation improves an LLM judge's alignment with human judgment
      over generic scoring rubrics for speech-to-speech systems.
    source: §3.3, Figure 4
    evidence: An ablation removing either the query-aware checklist or the multi-round ASR-plus-scoring
      procedure reduces the Pearson correlation between automatic and human expert scores relative to
      the full evaluation method.
    confidence: medium
    relevance: low
  limitations:
  - Automatic scoring depends on a proprietary judge (GPT-4o-mini) and a proprietary ASR model (Whisper-large-v3)
    in the evaluation loop.
  - The benchmark is deliberately restricted to English, non-toxic, single-turn queries by design.
  caveats:
  - The paper's central S2S-relevant finding (S2T proficiency doesn't transfer to S2S quality) is demonstrated
    primarily via one case study (Kimi-Audio); broader generality across other architectures is not exhaustively
    tested.
- id: '2510.02352'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  architecture: []
  relevance: medium
  evidence_role:
  - evaluation_caution
  - negative_evidence
  current_role: frontier_probe
  method_family: []
  claims:
  - claim_id: fairdialogue_closedsource_lower_bias
    role: supports
    claim: Closed-source spoken dialogue systems can exhibit substantially lower paralinguistic decision
      bias than open-source alternatives evaluated under the same protocol.
    source: §3.3.1, Table 2
    evidence: Gemini-2.5-Flash achieves Group Unfairness Scores of 0.12-0.14 across award, interview,
      and assignment decision tasks, compared to 0.17-0.20 for Qwen2.5-Omni and 0.19-0.21 for GLM-4-Voice
      on the same FairDialogue samples.
    confidence: medium
    relevance: medium
  - claim_id: fairdialogue_fairness_ranking_task_specific
    role: complicates
    claim: A model's relative fairness ranking on one conversational task type does not transfer to another
      task type.
    source: §3.3.1, Table 2
    evidence: GPT-4o Audio and GLM-4-Voice, not the most biased models on decision-making, show the largest
      cross-group disparities (SNSR 0.63-0.72 and 0.66-0.68) on recommendation tasks, while Gemini-2.5
      and Qwen2.5-Omni perform comparatively better here.
    confidence: medium
    relevance: medium
  - claim_id: fairdialogue_singleturn_understates_multiturn_bias
    role: complicates
    claim: Single-turn bias evaluation can understate a spoken dialogue system's paralinguistic bias relative
      to multi-turn interaction.
    source: §3.3.2, Table 3
    evidence: On samples where all four models initially gave identical negative decisions in single-turn
      evaluation, four rounds of corrective feedback revealed attribute-dependent revision success rates
      (88-95% for Elder Male speakers versus 69-91% for Young Female speakers).
    confidence: medium
    relevance: medium
  - claim_id: fairdialogue_voice_only_cues_sufficient_to_bias
    role: supports
    claim: Paralinguistic attributes carried only through voice (not through text content) are sufficient
      to bias spoken dialogue LLM outputs in real-world-relevant decision and recommendation tasks.
    source: §2, §3.3.1
    evidence: FairDialogue holds text content demographically neutral while varying only synthesized speech
      attributes (age, gender, accent), and all four evaluated models still show measurable disparities
      in decision acceptance rates and recommendation rankings across these attribute groups.
    confidence: high
    relevance: high
  limitations:
  - The evaluation covers only four spoken dialogue systems and paralinguistic variation is synthetic
    (TTS-generated) rather than drawn from real speakers with those attributes.
  - The paper does not propose or evaluate any bias mitigation technique.
  caveats:
  - Bias evaluation is specific to decision-making/recommendation tasks; it does not address dialogue
    interaction mechanics (turn-taking, latency) that define other sub-paradigm comparisons in this concept.
- id: '2509.26542'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - evaluation_caution
  - negative_evidence
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: vera_textvoice_reasoning_gap_widens_with_steps
    role: supports
    claim: A substantial reasoning-accuracy gap exists between text and voice modalities within the same
      model family, and the gap widens with the number of reasoning steps a task requires.
    source: §5.1, Table 3
    evidence: GPT-5 text reaches 74.8% accuracy on competition math versus 6.1% for GPT-realtime voice
      (a 68.7-point gap), while the same model pair differs by only ~21 points on factual recall; macro-averaged
      across five tracks, text models reach 54.0% vs. 11.3% for voice.
    confidence: high
    relevance: medium
  - claim_id: vera_thinking_time_insufficient
    role: complicates
    claim: Increasing inference-time deliberation ("thinking time") before a voice system speaks is not,
      by itself, sufficient to close a voice-native reasoning gap.
    source: §5.2
    evidence: Enabling Audio Flamingo 3's thinking mode raises time-to-first-response by 530% (2.40s to
      15.14s) but overall accuracy decreases slightly (1.7% to 1.5%).
    confidence: medium
    relevance: low
  - claim_id: vera_cascade_narrows_gap_new_errors
    role: complicates
    claim: Decoupling reasoning from speech narration in a cascade architecture narrows a voice-native
      reasoning gap but introduces new grounding and logical-consistency failures that prevent full parity
      with text.
    source: §5.2, Figure 5
    evidence: A cascade pairing a strong text reasoner with a separate narration model still trails the
      text-only upper bound by 15.7 points on Math (59.1% vs. 74.8%) and collapses to 0.2% accuracy on
      the Context track, with elevated grounding/consistency errors attributed to the narration stage.
    confidence: medium
    relevance: high
  - claim_id: vera_intelligibility_not_the_bottleneck
    role: supports
    claim: Speech output intelligibility is not the primary bottleneck limiting reasoning performance
      in voice-interactive systems.
    source: §5.2, Table 3
    evidence: Word Error Rate across evaluated voice systems ranges from 7.9% (Gemini-2.5-Flash-audio)
      to 19.8% (Freeze-Omni) with no corresponding difference in reasoning accuracy.
    confidence: medium
    relevance: medium
  - claim_id: vera_architecture_linked_failure_signatures
    role: refines
    claim: Different voice system architectures fail on reasoning tasks in systematically different, architecture-linked
      ways rather than through a single uniform error pattern.
    source: §5.3, Figure 6
    evidence: Native streaming models under-produce NO_FINAL_ANSWER and OFF_TARGET errors, favoring fluent-but-incorrect
      completions, while the LiveAnswer cascade over-produces UNSUPPORTED_FACT, OFF_TARGET, and LOGICAL_CONTRADICTION
      deviations, and end-to-end models show a bimodal pattern of extreme over- or under-completion.
    confidence: medium
    relevance: medium
  limitations:
  - The study is an observational, cross-architecture diagnostic rather than a controlled experiment;
    the authors state they cannot isolate the causal impact of modality alone.
  - Accuracy grading relies on an LLM-as-a-judge protocol with track-dependent reliability as low as 84.3%
    on the Science track.
  caveats:
  - VERA's cascade-vs-E2E comparison (LiveAnswer) is a single hand-built diagnostic configuration, not
    a systematic sweep across cascade designs; findings about which paradigm is 'better' for reasoning
    should not be over-generalized to latency or paralinguistic-preservation trade-offs covered elsewhere
    in this concept.
claim_clusters:
- id: cascade_outperforms_e2e_on_benchmarks
  claim: Cascaded ASR+LLM+TTS pipelines currently achieve stronger performance than end-to-end speech-to-speech
    systems on general spoken-instruction-following and reasoning benchmarks, though the gap is narrowing
    with backbone LLM quality and is concentrated in semantic/task accuracy rather than paralinguistic
    fidelity.
  status: strongly_supported
  confidence: high
  supporting_papers:
  - '2410.17196'
  - '2506.23049'
  - 2025.naacl-demo.21
  - 2025.acl-long.997
  - 2025.findings-acl.1051
  - '2503.04721'
  - '2505.15670'
  - '2509.06502'
  - '2508.02013'
  - '2402.05755'
  contradicting_papers: []
  refining_papers:
  - interspeech-2025-0874
  - '2506.21875'
  - '2509.26542'
  - '2411.13577'
  - '2504.08528'
  caveats:
  - The ESPnet-SDS comparison (2025.naacl-demo.21) is explicitly flagged by its own authors as not strictly
    fair (different inputs across systems), so it should be read as corroborating rather than independently
    decisive.
  - The two survey entries (2411.13577, 2504.08528) synthesize the same underlying literature rather than
    contributing independent new evidence; counted here as refining/contextual support, not primary evidence.
  - 'The gap is not uniform: WildSpeech-Bench (2506.21875) and VERA (2509.26542) both find it re-emerges
    specifically on paralinguistic understanding and reasoning depth rather than general conversational
    quality.'
  last_reviewed: '2026-07-19'
- id: staged_pretraining_effect_on_instruction_following
  claim: 'Whether staged, modality-specific (ASR/TTS) pretraining before joint spoken-dialogue fine-tuning
    helps or harms an end-to-end speech LM''s instruction-following ability is unresolved: some systems
    find single-stage training directly on dialogue data outperforms staged pretraining, while others
    find staged pretraining necessary to reduce intelligence and instruction-following degradation.'
  status: contested
  confidence: medium
  supporting_papers:
  - '2502.17239'
  contradicting_papers:
  - '2412.15649'
  - 2025.findings-acl.115
  refining_papers:
