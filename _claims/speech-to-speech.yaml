- id: '2303.03926'
  entry_date: '2026-07-19'
  year: 2023
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - architecture_variant
  current_role: historical_context
  method_family:
  - speech_to_speech_translation_systems
  claims:
  - claim_id: vallex_cross_lingual_transfer_no_paired_data
    role: supports
    claim: Large-scale multilingual codec language models can transfer speaker identity, emotion, and
      acoustic environment across languages from a single source utterance without paired bilingual data.
    source: §3, §5.3, Table 3
    evidence: VALL-E X reaches SMOS 4.00 vs. 3.42 for YourTTS on cross-lingual TTS with a Chinese prompt,
      using in-context acoustic-token prompting rather than any bilingual speaker recordings.
    confidence: high
    relevance: medium
  - claim_id: vallex_language_id_accent_control
    role: supports
    claim: 'Language ID conditioning is essential for native-sounding accent in cross-lingual codec TTS:
      removing it significantly degrades accent scores even while modestly improving speaker similarity.'
    source: §5.5, Table 6
    evidence: Removing the language ID module drops accent scores from 4.10 to 2.98 (1-5 scale) and costs
      roughly 1.5 BLEU in translation quality, while ASV-Score modestly rises.
    confidence: high
    relevance: low
  - claim_id: vallex_incontext_learning_s2st
    role: supports
    claim: In-context learning with acoustic token prompts provides stronger cross-lingual voice preservation
      than speaker embedding approaches across both TTS and speech-to-speech translation tasks.
    source: §5.3, §5.4, Tables 3, 5
    evidence: On bidirectional zero-shot S2ST (EMIME), VALL-E X Trans reaches SMOS 4.12 vs. 3.06 for the
      cascaded speaker-embedding baseline on Chinese-to-English, a gain of more than 1 point.
    confidence: medium
    relevance: high
  - claim_id: vallex_ar_nar_bilingual_prompt
    role: supports
    claim: The AR/NAR two-stage codec language model architecture extends naturally to cross-lingual generation
      by treating bilingual phoneme sequences as concatenated prompts.
    source: §3.2, §3.4
    evidence: The multilingual AR model conditions on concatenated source- and target-language phoneme
      sequences plus source acoustic tokens, requiring no structural change to the VALL-E AR/NAR design
      beyond the bilingual prompt format.
    confidence: medium
    relevance: low
  limitations:
  - The EMIME S2ST test set is small (14 speakers, 350 utterances) and bilingual by construction, which
    is unusually favourable for a cross-lingual system and may overstate generalisation.
  - S2ST quality is bottlenecked by translation quality; the paper does not disentangle acoustic and linguistic
    error sources beyond an oracle-text upper-bound analysis.
  caveats:
  - The speech-to-speech translation pathway (VALL-E X Trans) is a cascade of an ASR+MT front-end (derived
    from SpeechUT) feeding phoneme sequences into VALL-E X for synthesis, not a single end-to-end speech-to-speech
    model; it fits the cascade/direct-translation boundary of the S2S taxonomy rather than the end-to-end
    dialogue sub-paradigm.
- id: '2305.11000'
  entry_date: '2026-07-19'
  year: 2023
  venue: arXiv
  task:
  - SCA
  - TTS
  architecture:
  - autoregressive-LM
  relevance: high
  evidence_role:
  - core_evidence
  - historical_context
  current_role: foundational
  method_family:
  - native_joint_speech_text_lm
  claims:
  - claim_id: speechgpt_vocab_expansion_no_cascade
    role: supports
    claim: Expanding an LLM's token vocabulary with discretised speech units enables a single model to
      perform both speech comprehension and speech generation without a cascade pipeline.
    source: §4.1
    evidence: HuBERT discrete units are appended to LLaMA-13B's vocabulary and the model performs ASR,
      TTS, and spoken dialogue turns via a single next-token-prediction interface, with no separate ASR
      or TTS module in the inference path.
    confidence: low
    relevance: high
  - claim_id: speechgpt_multistage_curriculum_necessary
    role: supports
    claim: A multi-stage training curriculum, separating modality adaptation, cross-modal instruction
      tuning, and chain-of-modality alignment, is necessary to acquire reliable cross-modal instruction-following
      from an LLM backbone.
    source: §4.2
    evidence: Stage 1 modality-adaptation pretraining on 60K hours of LibriLight precedes stage 2 instruction
      tuning on SpeechInstruct and stage 3 LoRA-based chain-of-modality fine-tuning; the paper presents
      this as the mechanism enabling instruction-following case studies in Table 1-2.
    confidence: low
    relevance: high
  - claim_id: speechgpt_chain_of_modality_mechanism
    role: supports
    claim: The chain-of-modality pattern, generating a text intermediate before the speech response, is
      a practical mechanism for transferring LLM reasoning capability to speech output.
    source: §3.2, §4.2
    evidence: Stage-3 training explicitly teaches the model to transcribe a speech instruction to text,
      reason in text, then produce a speech response, serialising cross-modal reasoning through an explicit
      text step.
    confidence: low
    relevance: high
  - claim_id: speechgpt_gpt4_instruction_bootstrapping
    role: supports
    claim: Large-scale instruction dataset construction via GPT-4-generated task descriptions applied
      to existing ASR corpora is a scalable approach to bootstrapping cross-modal training data.
    source: §3.1
    evidence: SpeechInstruct's cross-modal portion (9 million unit-text pairs) is built by applying GPT-4-generated
      task instructions to GigaSpeech, Common Voice, and LibriSpeech transcripts.
    confidence: low
    relevance: low
  limitations:
  - 'No quantitative evaluation is reported: no MOS, WER, or speaker similarity scores, and no comparison
    to cascade baselines; all results are case studies.'
  - Context length (2048 tokens) prevents true multi-turn dialogue; only single-turn exchanges are demonstrated.
  - The chain-of-modality design requires generating a full text response before producing speech, introducing
    latency incompatible with real-time interaction.
  caveats:
  - current_role is set to foundational for this concept specifically because SpeechGPT is repeatedly
    cited as the key early precedent by later end-to-end speech-to-speech systems in this batch (Mini-Omni,
    Freeze-Omni, OmniFlatten), not because its own evaluation is strong; treat its own claims as low-confidence,
    historical evidence.
- id: '2305.15255'
  entry_date: '2026-07-19'
  year: 2023
  venue: arXiv
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - architecture_variant
  - core_evidence
  current_role: historical_context
  method_family:
  - native_joint_speech_text_lm
  claims:
  - claim_id: spectron_continuous_repr_competitive
    role: supports
    claim: Continuous spectrogram representations can support spoken language modelling at quality levels
      competitive with discrete-token systems, without requiring a separate quantisation stage.
    source: §4.2.1, §4.2.2, Tables 1-3
    evidence: Spectron (350M) reaches log-perplexity 126.08 on LibriSpeech speech continuation, outperforming
      AudioLM, GSLM, TWIST, and SpeechGPT, and achieves the highest speaker similarity (0.42) among all
      compared discrete-token systems.
    confidence: high
    relevance: medium
  - claim_id: spectron_joint_supervision_preserves_knowledge
    role: supports
    claim: Jointly supervising ASR, text continuation, and speech synthesis within a single decoding pass
      preserves LLM world knowledge better than separate components or warm-start initialisation alone.
    source: §4.2.3, Table 4
    evidence: Spectron (1B) reaches 22.9%/6.1% on LLaMA-Questions/WebQuestions zero-shot, matching SpeechGPT-7B
      (21.9%/6.5%) at one-seventh the parameter count, while TWIST models largely fail (0.5-1%).
    confidence: high
    relevance: medium
  - claim_id: spectron_derivative_loss_coherence
    role: supports
    claim: Penalising temporal and spectral derivatives of the predicted spectrogram improves semantic
      coherence in speech continuation more than the basic regression loss alone.
    source: §4.2.4, Table 5
    evidence: Removing the derivative loss term increases log-perplexity by more than 580 points, the
      largest single ablation effect measured.
    confidence: medium
    relevance: low
  - claim_id: spectron_compact_lm_matches_larger
    role: supports
    claim: A compact LM (1B parameters) that tightly couples audio encoding with text decoding can match
      a 7B instruction-tuned spoken LM on zero-shot spoken question answering tasks.
    source: §4.2.3, Table 4
    evidence: Spectron (1B) matches SpeechGPT-7B on LLaMA-Questions and WebQuestions accuracy without
      any instruction fine-tuning.
    confidence: medium
    relevance: medium
  limitations:
  - Frame-by-frame spectrogram decoding at 12.5ms resolution makes long-utterance generation computationally
    prohibitive and precludes streaming inference.
  - Evaluation is restricted to English read-speech from LibriVox with short 3-second prompts; conversational
    or spontaneous speech is not assessed.
  caveats:
  - Spectron performs speech-in/speech-out continuation and QA rather than open-ended multi-turn dialogue;
    it is included under the end-to-end sub-paradigm as an early continuous-representation alternative,
    not as a full dialogue system.
- id: '2402.05755'
  entry_date: '2026-07-19'
  year: 2024
  venue: arXiv
  task:
  - SCA
  - TTS
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - core_evidence
  - control_evidence
  current_role: influential
  method_family:
  - native_joint_speech_text_lm
  claims:
  - claim_id: spiritlm_interleaved_pretraining_transfers_reasoning
    role: supports
    claim: Continuous pretraining of a text LLM on interleaved speech and text tokens transfers the text
      model's few-shot learning and semantic reasoning abilities to the speech modality.
    source: §4.2, §4.3, Table 4
    evidence: Spirit LM Base reaches 36.9% on MMLU (5-shot, text-only) despite pretraining on 30B+ speech
      tokens, and outperforms prior speech-only LMs on StoryCloze semantic understanding.
    confidence: high
    relevance: high
  - claim_id: spiritlm_word_level_interleaving_best
    role: supports
    claim: Word-level interleaving of speech and text during training is more effective than parallel
      ASR/TTS training or speech-only fine-tuning for cross-modal semantic understanding.
    source: §4.2, Table 6
    evidence: Removing interleaved data while keeping speech and text separate drops cross-modal StoryCloze
      performance by more than 10 points; parallel ASR+TTS training without interleaving also underperforms
      the full recipe.
    confidence: high
    relevance: high
  - claim_id: spiritlm_expressive_tokens_sentiment
    role: supports
    claim: Expressive speech properties (sentiment, pitch, style) can be modeled in a language model through
      discrete token streams that supplement phonetic tokens, enabling cross-modal sentiment preservation.
    source: §5, Table 3
    evidence: Spirit LM Expressive achieves 0.48 average STSP accuracy across all directions, outperforming
      Spirit LM Base (0.41) and the cascade topline (0.42), particularly on S-to-S (0.54 vs. 0.33).
    confidence: medium
    relevance: medium
  - claim_id: spiritlm_expressivity_lexical_tradeoff
    role: supports
    claim: Adding expressive speech tokens to a speech LM improves expressivity at the cost of moderate
      degradation in lexical and grammatical speech understanding.
    source: §4.2, Table 4
    evidence: Spirit LM Expressive shows a measurable drop on WUGGY/BLIMP lexical and grammatical benchmarks
      relative to Spirit LM Base, alongside its STSP gains.
    confidence: medium
    relevance: medium
  - claim_id: spiritlm_cascade_still_stronger_task_specific
    role: complicates
    claim: Cascade speech pipelines remain substantially stronger than end-to-end unified models on task-specific
      metrics such as ASR WER and TTS intelligibility at equivalent model scale.
    source: §4.3, Table 5
    evidence: Spirit LM Base reaches only 21.9% WER (ASR, 10-shot) and 45.5% CER (TTS, 10-shot) versus
      3.7%/4.0% for the cascade topline (Whisper + LLaMA 2).
    confidence: high
    relevance: high
  limitations:
  - The vocoder is conditioned on only 4 speaker voices from the Expresso dataset, severely constraining
    output speaker diversity.
  - The STSP benchmark is evaluated using fine-tuned automatic classifiers rather than human listeners.
  - Evaluated only in English; multilingual capability untested.
  caveats:
  - Spirit LM is a general interleaved speech-text LM rather than a purpose-built dialogue system; it
    is included here as core infrastructure for the end-to-end speech-to-speech sub-paradigm rather than
    as a deployed conversational agent.
- id: '2408.02622'
  entry_date: '2026-07-19'
  year: 2024
  venue: arXiv
  task:
  - SCA
  - TTS
  architecture:
  - autoregressive-LM
  relevance: high
  evidence_role:
  - core_evidence
  current_role: influential
  method_family:
  - full_duplex_dual_stream_architectures
  claims:
  - claim_id: lslm_middle_fusion_required
    role: supports
    claim: Full-duplex speech generation requires that the listening channel information be injected at
      intermediate representation layers, not at the input or output level, to avoid degrading speech
      generation quality.
    source: §6.2, Table 2
    evidence: Middle fusion (LSLM-MF) achieves 4.05% WER and 98.00% interactive F1 in clean conditions,
      while early fusion collapses to 33.56% WER.
    confidence: high
    relevance: high
  - claim_id: lslm_single_layer_token_minimal_degradation
    role: supports
    claim: A single-layer discrete token autoregressive TTS backbone can integrate real-time audio input
      streams with minimal WER degradation relative to a no-listening baseline in controlled conditions.
    source: §6.2, Table 2
    evidence: LSLM-MF reaches 4.05% WER in clean command-based conditions versus 4.28% for the vanilla
      TTS baseline with no listening channel.
    confidence: high
    relevance: high
  - claim_id: lslm_voice_based_harder_than_command
    role: refines
    claim: Robustness to noise and sensitivity to unseen speaker interruptions are distinct challenges
      in full-duplex SLMs, and voice-based generalisation introduces significantly higher error rates
      than command-based triggering.
    source: §6.2, Table 3
    evidence: Voice-based FDM WER rises to 5.33% clean / 8.50% noisy versus command-based 4.05%/4.51%,
      with interactive F1 dropping to 85.15% under noise.
    confidence: medium
    relevance: medium
  - claim_id: lslm_joint_finetuning_necessary
    role: supports
    claim: Joint fine-tuning of both the speech generation backbone and the streaming SSL encoder is necessary
      for full-duplex models to reach peak interactive capability; freezing either component degrades
      turn-taking recall.
    source: §6.3, Table 4
    evidence: Ablations freezing either the TTS backbone or SSL encoder show measurable interactive-capability
      degradation relative to full joint fine-tuning.
    confidence: medium
    relevance: medium
  limitations:
  - The system stops speaking on interruption but does not generate a contextually appropriate spoken
    reply; the 'full duplex' claim is limited to interruption detection and cessation, not conversational
    back-and-forth.
  - Evaluation relies entirely on automatic metrics (WER, precision/recall); no subjective MOS or naturalness
    assessment is reported.
  caveats:
  - Speaker-following and true speech-in/speech-out dialogue generation with full-duplex capability are
    explicitly left as future work; this paper establishes a fusion-strategy taxonomy rather than a complete
    dialogue system.
- id: '2408.16725'
  entry_date: '2026-07-19'
  year: 2024
  venue: arXiv
  task:
  - SCA
  - TTS
  architecture:
  - autoregressive-LM
  relevance: high
  evidence_role:
  - core_evidence
  current_role: influential
  method_family:
  - native_joint_speech_text_lm
  claims:
  - claim_id: miniomni_text_instructed_parallel_decoding
    role: supports
    claim: Simultaneous text and audio generation, conditioned on text tokens generated in parallel, enables
      streaming speech output without the latency penalty of sequential text-then-audio decoding.
    source: §3.2
    evidence: Mini-Omni generates text and SNAC audio tokens in parallel across 8 decoding heads with
      a one-step delay, avoiding the sequential text-then-audio pattern of SpeechGPT.
    confidence: medium
    relevance: high
  - claim_id: miniomni_audio_reasoning_lags_text
    role: refines
    claim: Audio reasoning quality in end-to-end speech LMs lags behind text reasoning quality when trained
      on similar data volumes, and batch inference strategies can partially bridge this gap.
    source: §3.2, §4.4
    evidence: The paper reports audio responses are 'somewhat weaker' than text responses without batch
      parallel decoding, motivating a two-sample batch strategy that substitutes stronger text-only reasoning
      into the audio-generating sample.
    confidence: low
    relevance: high
  - claim_id: miniomni_staged_adapter_training
    role: supports
    claim: A three-stage adapter-based training curriculum can integrate speech input and output into
      a frozen language model backbone with minimal degradation to text capabilities.
    source: §3.3
    evidence: The 'Any Model Can Talk' three-stage curriculum (modality alignment, adaptation training,
      multi-modal fine-tuning) builds on Qwen2-0.5B via lightweight adapters.
    confidence: medium
    relevance: medium
  - claim_id: miniomni_multicodebook_needs_parallel_decoding
    role: supports
    claim: Multi-codebook audio codecs with high token rates require parallel decoding schemes to maintain
      practical streaming throughput in autoregressive speech LMs.
    source: §3.1, §3.2
    evidence: SNAC's 7-layer codebook depth makes flattened token sequences impractically long, motivating
      parallel decoding across all 8 heads instead.
    confidence: medium
    relevance: medium
  limitations:
  - No MOS or naturalness metrics are reported for speech output; the claim that quality is 'on par with
    common TTS systems' is unsupported.
  - Evaluation is restricted to ASR performance on LibriSpeech; no evaluation of conversational quality,
    response coherence, or latency is provided.
  caveats:
  - The VoiceAssistant-400K training dataset is entirely synthesised by GPT-4o, which may introduce systematic
    biases in prosody and topic coverage that are not assessed.
- id: '2409.06666'
  entry_date: '2026-07-19'
  year: 2024
  venue: arXiv
  task:
  - SCA
  architecture:
  - hybrid
  relevance: high
  evidence_role:
  - core_evidence
  - acceleration_evidence
  current_role: influential
  method_family:
  - modular_gated_streaming_tts_decoder
  claims:
  - claim_id: llamaomni_parallel_generation_lower_latency
    role: supports
    claim: End-to-end speech LLMs with parallel text and speech generation can achieve lower response
      latency than cascaded ASR-LLM-TTS pipelines without sacrificing prosody coherence under low-latency
      streaming conditions.
    source: §4.5
    evidence: LLaMA-Omni achieves minimum latency of 236ms, below GPT-4o's reported 320ms, and maintains
      stable prosody across latency settings unlike word-chunked cascade streaming.
    confidence: high
    relevance: high
  - claim_id: llamaomni_instruction_rewriting_improves_style
    role: supports
    claim: Aligning LLM output to speech interaction conventions through targeted instruction data rewriting
      substantially improves response style suitability, independently of model architecture.
    source: §3, §4.4
    evidence: InstructS2S-200K rewrites Alpaca/UltraChat instructions into spoken style via Llama-3-70B-Instruct
      before synthesising responses, underlying the ChatGPT Score improvements over baselines.
    confidence: medium
    relevance: medium
  - claim_id: llamaomni_ctc_nar_robust_to_chunk_size
    role: supports
    claim: Non-autoregressive CTC decoding from LLM hidden states enables streaming speech synthesis whose
      speech rate and naturalness are robust to chunk size variation, unlike word-level streaming TTS
      cascades.
    source: §4.5, Table 4
    evidence: Reducing unit chunk size in cascaded systems degrades speech rate and naturalness, while
      LLaMA-Omni's NAR CTC decoder maintains stable prosody because only the final vocoder step is cascaded.
    confidence: high
    relevance: high
  - claim_id: llamaomni_small_curated_data_closes_gap
    role: supports
    claim: Training an end-to-end speech interaction model on a small, carefully curated speech instruction
      dataset is sufficient to significantly close the gap with models trained on orders of magnitude
      more data, provided the LLM backbone is sufficiently capable.
    source: §4.4, §5
    evidence: LLaMA-Omni is trained on ~1K hours of response speech in under 3 days on 4 GPUs, yet outperforms
      SpeechGPT and matches Qwen2-Audio+Orca on ChatGPT Score.
    confidence: medium
    relevance: medium
  limitations:
  - ASR-WER of 10.82% is notably higher than cascaded baselines (3.78% for SALMONN+Orca), reflecting only
    ~1K hours of response-speech training data.
  - The architecture does not support full-duplex interaction (interruption, turn-taking); responses are
    generated only after the full instruction is received.
  caveats:
  - Training data is synthesised from text corpora via instruction rewriting, which may not capture the
    naturalness and variability of real spoken dialogue.
- id: '2410.00037'
  entry_date: '2026-07-19'
  year: 2024
  venue: arXiv
  task:
  - SCA
  - TTS
  architecture:
  - autoregressive-LM
  - hybrid
  relevance: high
  evidence_role:
  - core_evidence
  - acceleration_evidence
  current_role: foundational
  method_family:
  - native_joint_speech_text_lm
  claims:
  - claim_id: moshi_joint_acoustic_semantic_tokens_required
    role: supports
    claim: Eliminating the text bottleneck in spoken dialogue requires modeling acoustic tokens jointly
      with semantic tokens in a single generative model, as purely semantic approaches cannot capture
      paralinguistic information or generate in arbitrary voices.
    source: §3.4, §5.4
    evidence: Moshi's RQ-Transformer jointly predicts text, semantic, and 7-layer acoustic tokens per
      timestep via Mimi's split-RVQ design, distinguishing it from purely semantic-token full-duplex predecessors
      like dGSLM.
    confidence: high
    relevance: high
  - claim_id: moshi_inner_monologue_improves_quality
    role: supports
    claim: Predicting time-aligned text tokens as a per-frame prefix to audio tokens substantially improves
      the linguistic quality and factual accuracy of speech generated by audio language models, with minimal
      inference overhead.
    source: §3.4.4, §5.3, Table 6
    evidence: 'Inner Monologue improves transcript length from 602 to 1920 characters and NLL from 3.65
      to 2.77, and nearly triples spoken QA accuracy (Web Questions: 9.2 to 26.6) at negligible extra
      token cost (17 vs. 16 tokens per step).'
    confidence: high
    relevance: high
  - claim_id: moshi_parallel_streams_no_turn_boundary
    role: supports
    claim: Modeling conversation as parallel autoregressive streams for each speaker, without explicit
      turn boundaries, enables full-duplex spoken interaction and allows training on naturally overlapping
      speech.
    source: §3.4.3, §5.6, Table 9
    evidence: Moshi models both the user's and its own semantic and acoustic token streams in parallel
      at every frame, with no explicit turn-boundary token required.
    confidence: medium
    relevance: high
  - claim_id: moshi_adversarial_only_codec_training
    role: supports
    claim: Adversarial-only training of neural audio codecs substantially improves subjectively rated
      audio quality relative to mixed reconstruction-adversarial objectives, despite degrading objective
      metrics such as VisQOL.
    source: §3.3, §5.2, Table 4
    evidence: Mimi trained with adversarial-only losses reaches MUSHRA 81.0 versus 58.8 with mixed reconstruction-adversarial
      losses at the same 1.1kbps/12.5Hz operating point.
    confidence: medium
    relevance: medium
  - claim_id: moshi_objective_metrics_unreliable_for_codec
    role: refines
    claim: Standard objective audio quality metrics (VisQOL, MOSNet) are unreliable proxies for perceived
      quality when the training objective changes, making human evaluation indispensable for codec comparison.
    source: §5.2, §5.8
    evidence: The adversarial-only Mimi variant scores worse on VisQOL despite scoring far higher on human
      MUSHRA evaluation, motivating the paper's reliance on MUSHRA for its headline codec claim.
    confidence: medium
    relevance: low
  limitations:
  - 'Spoken factual question answering lags substantially behind the Helium text-only baseline (TriviaQA:
    22.8 vs. 56.4), indicating significant knowledge forgetting from audio training.'
  - Signal-based watermarking (Audioseal) is ineffective against Mimi's own lossy coding, leaving no robust
    content-attribution mechanism at release.
  caveats:
  - Turn-taking statistics (Table 9) are evaluated on generated dialogues seeded from Fisher rather than
    live interactions, which may underrepresent real conversational dynamics; the instruction fine-tuning
    pipeline also relies heavily on synthetic TTS-generated speech.
- id: '2410.03751'
  entry_date: '2026-07-19'
  year: 2024
  venue: arXiv
  task:
  - SCA
  - TTS
  architecture: []
  relevance: medium
  evidence_role:
  - infrastructure
  current_role: influential
  method_family: []
  claims:
  - claim_id: survey_e2e_avoids_cascade_error_but_needs_unified_training
    role: supports
    claim: End-to-end speech generation models avoid the information loss, latency, and cumulative error
      introduced by cascaded ASR-LLM-TTS pipelines, but require integrating speech tokenisation and synthesis
      into a unified training regime.
    source: §I, §II
    evidence: The survey frames cascade pipelines as suffering compounding transcription/synthesis errors
      and text-bottleneck information loss, motivating the unified tokenizer-LM-vocoder decomposition
      it uses to organise the SpeechLM literature.
    confidence: medium
    relevance: high
  - claim_id: survey_semantic_acoustic_tokenizer_tradeoff
    role: supports
    claim: 'Semantic tokenizers and acoustic tokenizers impose an inherent trade-off: semantic tokens
      produce coherent content but poor acoustic quality, while acoustic tokens enable high-fidelity reconstruction
      but risk content inaccuracies.'
    source: §III-A, §IV-A1
    evidence: The survey classifies HuBERT/wav2vec2/W2v-BERT as semantic tokenizers and EnCodec/SoundStream
      as acoustic tokenizers, citing mixed-objective tokenizers (SpeechTokenizer, Mimi) as attempts to
      balance both.
    confidence: medium
    relevance: medium
  - claim_id: survey_text_pretrained_init_helps
    role: supports
    claim: Initialising a speech LM from a text-pretrained checkpoint accelerates convergence and improves
      speech understanding, whereas initialisation from image-pretrained checkpoints yields worse results
      than random initialisation.
    source: §IV-B1
    evidence: The survey synthesises findings from TWIST and SPIRIT-LM showing text-pretrained initialisation
      outperforms cold-start training on speech understanding benchmarks.
    confidence: medium
    relevance: low
  - claim_id: survey_interleaving_improves_alignment
    role: supports
    claim: Interleaving speech and text tokens during pre-training measurably improves cross-modal representation
      alignment compared to training on speech tokens alone.
    source: §IV-B1
    evidence: The survey cites SPIRIT-LM's feature-similarity visualisations as evidence that interleaved
      pre-training improves text-speech representation alignment.
    confidence: medium
    relevance: medium
  - claim_id: survey_post_alignment_underexplored
    role: supports
    claim: Post-alignment techniques (RLHF, DPO) for speech LMs remain substantially underexplored relative
      to their established role in text LM development, leaving semantic consistency and acoustic quality
      gaps in deployed systems.
    source: §IV-B3, §VII
    evidence: The survey identifies only Align-SLM and SpeechAlign as post-alignment work for SpeechLMs
      at time of writing, versus a mature RLHF/DPO literature for text LMs.
    confidence: medium
    relevance: low
  limitations:
  - As a survey, it reports no original experimental results; several 2024 systems it covers (Moshi, Mini-Omni,
    LLaMA-Omni) were still very recent preprints without peer-reviewed evaluation at time of writing.
  - Coverage of full-duplex systems and post-alignment techniques is acknowledged by the authors as incomplete.
  caveats:
  - This entry's claims are taxonomic syntheses of the literature rather than the survey's own new evidence;
    treat confidence as bounded by the quality of the underlying papers it summarises, not independently
    verified here.
- id: '2410.11190'
  entry_date: '2026-07-19'
  year: 2024
  venue: arXiv
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: high
  evidence_role:
  - core_evidence
  current_role: minor
  method_family:
  - native_joint_speech_text_lm
  claims:
  - claim_id: miniomni2_staged_adapter_no_forgetting
    role: supports
    claim: Staged adapter training (encoder alignment before language model fine-tuning) enables tri-modal
      extension of a compact language model with minimal data without catastrophic forgetting of the base
      model's text capabilities.
    source: §3.3
    evidence: Mini-Omni2's three-stage recipe adds CLIP and Whisper encoders to Qwen2-0.5B via adapters,
      with a text-to-text QA task retained throughout all stages to preserve base capability.
    confidence: medium
    relevance: medium
  - claim_id: miniomni2_continuous_features_more_stable
    role: supports
    claim: Using continuous encoder features (Whisper) rather than discrete audio tokens for speech input
      yields more stable and semantically consistent representations, reducing ASR loss instability during
      training.
    source: §3.1, "Audio Encoder"
    evidence: Mini-Omni2 uses Whisper-small as a continuous feature extractor for audio input rather than
      a discrete tokenizer, a design choice the authors attribute to training stability.
    confidence: low
    relevance: low
  - claim_id: miniomni2_vision_modality_degrades_asr
    role: complicates
    claim: Adding a third modality (vision) to an audio-text spoken conversational agent modestly degrades
      ASR performance, likely due to diluted training data proportion rather than architectural interference.
    source: §4.4, Table 2
    evidence: Mini-Omni2 reaches 4.8%/9.8% WER on LibriSpeech test-clean/test-other versus Mini-Omni's
      4.5%/9.7%, a small but consistent regression attributed to reduced audio-data proportion.
    confidence: medium
    relevance: low
  - claim_id: miniomni2_semantic_interruption_alternative_to_vad
    role: supports
    claim: Command-based semantic interruption (intent token classification) provides a viable alternative
      to VAD-based full-duplex detection, with the advantage of robustness to noise and unrelated background
      sounds.
    source: §3.4
    evidence: The model emits frame-level irq/n-irq state tokens trained on noise-augmented 'Stop Omni'
      phrase data synthesised with CosyVoice in varied voice timbres.
    confidence: low
    relevance: high
  limitations:
  - No naturalness MOS, SMOS, or intelligibility metrics for speech output are reported in this version;
    vision benchmark results are explicitly deferred.
  - The interruption mechanism is demonstrated on a single synthesised phrase ('Stop Omni') with a narrow
    distribution of noise conditions; generalisation to arbitrary interrupt commands is untested.
  caveats:
  - The paper is explicitly positioned as a reference implementation with deferred evaluation; its speech-to-speech
    contribution is primarily the semantic-interruption mechanism rather than validated dialogue quality.
- id: '2410.17196'
  entry_date: '2026-07-19'
  year: 2024
  venue: arXiv
  task:
  - evaluation
  - SCA
  architecture: []
  relevance: high
  evidence_role:
  - evaluation_caution
  - negative_evidence
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: voicebench_pipeline_outperforms_e2e
    role: contradicts
    claim: Pipeline-based voice assistants (ASR plus LLM) substantially outperform end-to-end audio LLMs
      on spoken instruction understanding, with the gap persisting even for state-of-the-art proprietary
      end-to-end systems.
    source: §3.3, Table 3
    evidence: The naive Whisper + LLaMA-3.1-8B pipeline scores 79.1 on the composite VoiceBench score
      versus 55.7 for the best open-source end-to-end model (DiVA); even GPT-4o-Audio (86.4) trails the
      GPT-4o-backed pipeline (87.2).
    confidence: high
    relevance: high
  - claim_id: voicebench_e2e_training_degrades_llm_safety
    role: complicates
    claim: End-to-end audio LLM training can degrade the underlying LLM's text-instruction capabilities,
      including safety alignment, compared to using the same base model in a pipeline configuration.
    source: §3.3
    evidence: LLaMA-Omni's AdvBench refusal rate drops from 98.5% (text) to 11.4% (speech), and Mini-Omni's
      from 86.4% to 37.1%, when the same harmful instruction is delivered via speech instead of text.
    confidence: high
    relevance: high
  - claim_id: voicebench_mispronunciation_worst_degradation
    role: refines
    claim: Mispronunciation causes significantly greater performance degradation in voice assistants than
      disfluencies or grammatical errors, because it increases effective word error rate rather than merely
      adding irrelevant context.
    source: §6.2, Table 5
    evidence: Mispronunciation causes an average 20.3% score reduction across models versus 12.6% for
      repair disfluencies, with grammatical errors largely tolerated.
    confidence: medium
    relevance: low
  - claim_id: voicebench_synthetic_speech_overestimates_robustness
    role: complicates
    claim: Evaluations using clean synthetic speech substantially overestimate voice assistant robustness
      relative to real recorded speech, particularly for models with non-standard speech encoders.
    source: §3.3, Table 4
    evidence: Real accent data (SD-QA) proves substantially harder than synthetic accent data, with VITA
      showing the greatest accent sensitivity, attributed to its non-Whisper CNN+Transformer speech encoder.
    confidence: medium
    relevance: medium
  - claim_id: voicebench_encoder_choice_drives_robustness
    role: supports
    claim: The choice of speech encoder determines a voice assistant's robustness to accent and speaker
      variation more than the choice of base LLM.
    source: §4.2
    evidence: VITA's non-Whisper CNN+Transformer encoder shows markedly greater accent sensitivity than
      Whisper-encoder-based systems across the accent robustness tests.
    confidence: medium
    relevance: medium
  limitations:
  - The benchmark evaluates only the text content of responses, not speech output quality, naturalness,
    prosody, or latency, even for Moshi, the only tested model with native speech output.
  - Coverage is English only, and content perturbations are all synthetically generated via GPT-4o rewriting
    rather than drawn from natural human disfluencies.
  caveats:
  - This is the strongest negative-evidence paper in the current batch for the optimistic reading of end-to-end
    speech-to-speech systems; its cascade-vs-E2E gap finding should anchor any claim cluster about paradigm
    comparison.
- id: '2410.17799'
  entry_date: '2026-07-19'
  year: 2024
  venue: arXiv
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: high
  evidence_role:
  - core_evidence
  current_role: active_evidence
  method_family:
  - native_joint_speech_text_lm
  claims:
  - claim_id: omniflatten_flattening_enables_full_duplex
    role: supports
    claim: Full-duplex spoken dialogue can be achieved by flattening interleaved speech and text token
      streams into a single autoregressive sequence, without modifying the backbone LLM architecture.
    source: §3, §3.3.2
    evidence: OmniFlatten segments user/assistant speech and text streams into fixed-size chunks and concatenates
      them into one sequence, achieving full-duplex behaviour on an unmodified Qwen2-0.5B backbone.
    confidence: medium
    relevance: high
  - claim_id: omniflatten_progressive_curriculum_improves_quality
    role: supports
    claim: Progressive curriculum training (modality alignment followed by half-duplex, then full-duplex)
      improves final full-duplex dialogue quality compared to training directly on full-duplex data.
    source: §4.3, Table 3
    evidence: Ablations omitting the modality-alignment or half-duplex stages both reduce final full-duplex
      LLM-judged dialogue scores relative to the full three-stage recipe.
    confidence: medium
    relevance: medium
  - claim_id: omniflatten_speed_semantic_coherence_tradeoff
    role: complicates
    claim: Eliminating intermediate text output from dialogue models substantially reduces response latency
      but causes a significant drop in semantic coherence, indicating a fundamental trade-off between
      speed and content quality in speech-to-speech generation.
    source: §3.3.2, §4.3, Table 3
    evidence: The 2-stream (speech-only output) model drops to 2.19/3.06 LLM-judged dialogue quality versus
      4.88/5.6 for the full 3-stream model with intermediate text.
    confidence: high
    relevance: high
  - claim_id: omniflatten_chunked_training_reduces_latency
    role: supports
    claim: Turn-taking response latency in full-duplex speech models can be reduced by chunked interleaved
      sequence training, with practical response times under 200ms achievable at 0.5B parameter scale.
    source: §4.3, Table 4
    evidence: OmniFlatten reaches a mean response time of 193ms versus Moshi's 553ms, though at lower
      first-token turn-taking accuracy (20.6% vs. Moshi's 2.9%, favouring OmniFlatten).
    confidence: medium
    relevance: high
  limitations:
  - The 0.5B backbone is substantially smaller than comparators (LLaMA-Omni 8B, Moshi 7B), making LLM-score
    comparisons in Table 3 not directly attributable to the flattening method alone.
  - Training data is entirely synthesised from text dialogues via a TTS pipeline; real conversational
    dynamics (natural prosody, disfluencies, real interruptions) are not represented, and the model does
    not handle backchannels.
  caveats:
  - User turn-taking (interruption handling) accuracy remains below 55% for both OmniFlatten and Moshi
    at the harder 25-token evaluation point, so neither system should be read as having solved interruption
    handling.
- id: '2411.00774'
  entry_date: '2026-07-19'
  year: 2024
  venue: arXiv
  task:
  - SCA
  architecture:
  - autoregressive-LM
  - hybrid
  relevance: high
  evidence_role:
  - core_evidence
  current_role: influential
  method_family:
  - modular_gated_streaming_tts_decoder
  claims:
  - claim_id: freezeomni_frozen_llm_reduces_intelligence_gap
    role: supports
    claim: Freezing the LLM backbone during speech-modality alignment reduces the intelligence gap between
      spoken and text question-answering performance compared to fine-tuned approaches.
    source: §3.4, Table 3
    evidence: Freeze-Omni's gap to its text-only backbone (Qwen2-7B-Instruct) on Web Questions/LlaMA Questions/Trivia
      QA is smaller than Moshi's gap to its own Helium backbone on the same three benchmarks.
    confidence: high
    relevance: high
  - claim_id: freezeomni_three_stage_curriculum_without_updating_llm
    role: supports
    claim: A three-stage training curriculum, using large ASR corpora for encoder pretraining followed
      by small-scale multi-modal Q&A fine-tuning, is sufficient to achieve competitive spoken dialogue
      quality without updating backbone LLM parameters.
    source: §2.2.2, §2.3.2
    evidence: Freeze-Omni substantially outperforms Moshi (7B) on Web Questions/LlaMA Questions/Trivia
      QA (44.73/72.0/53.88 vs. 26.6/62.3/22.8) using only 60k Q&A pairs and 3k hours of TTS data, with
      the LLM never updated.
    confidence: high
    relevance: high
  - claim_id: freezeomni_chunk_state_classification_duplex
    role: supports
    claim: Chunk-level state classification integrated into the LLM's prefill stage enables duplex interruption
      detection without requiring a separate monitoring model or additional LLM context.
    source: §2.4
    evidence: A chunk-level state-prediction head added to the LLM's output layer classifies each chunk
      as continue/interrupt-and-generate/end-of-speech during stage-3 training.
    confidence: medium
    relevance: high
  - claim_id: freezeomni_decoupled_kv_cache_scheduling
    role: supports
    claim: Decoupling encoder and LLM KV-cache per user session allows a server-side pool of model replicas
      to handle concurrent users with chunk-granular scheduling.
    source: §2.4
    evidence: The server-side scheduling strategy keeps per-user KV-caches isolated so any model replica
      can serve any chunk of any active session without coordination overhead.
    confidence: low
    relevance: medium
  limitations:
  - Spoken Q&A benchmarks used for intelligence comparison were synthesised from text using edge-tts rather
    than collected from real speakers; results on naturally spoken or noisy input are not reported.
  - Speech output quality is evaluated primarily through CER on a single speaker rather than subjective
    MOS or naturalness benchmarks.
  caveats:
  - The system supports a limited number of output speakers and does not yet support style or voice instruct-following,
    which the authors flag as future work.
- id: '2411.13577'
  entry_date: '2026-07-19'
  year: 2024
  venue: arXiv
  task:
  - SCA
  architecture:
  - autoregressive-LM
  - transformer-enc-dec
  - hybrid
  relevance: high
  evidence_role:
  - infrastructure
  current_role: influential
  method_family: []
  claims:
  - claim_id: wavchat_cascade_e2e_different_tradeoffs
    role: supports
    claim: The cascaded and end-to-end paradigms for spoken dialogue impose fundamentally different trade-offs
      between latency, paralinguistic fidelity, and intelligibility, and the appropriate choice depends
      on the target interaction scenario.
    source: §2.2, §2.3
    evidence: The survey's cascaded-vs-end-to-end taxonomy organises the entire literature review around
      this trade-off, citing latency and paralinguistic-fidelity differences documented across the surveyed
      systems.
    confidence: medium
    relevance: high
  - claim_id: wavchat_semantic_vs_acoustic_tradeoff
    role: supports
    claim: Semantic speech representations offer higher compression rates and better LLM compatibility
      than acoustic representations, but sacrifice expressiveness, timbre, and style fidelity, necessitating
      additional vocoders in pipeline-based generation.
    source: §3.3.1, Table 1
    evidence: The survey's representation taxonomy (Table 1) contrasts semantic tokenizers (HuBERT, Whisper,
      WavLM) against acoustic tokenizers (EnCodec, SpeechTokenizer, Mimi, SNAC) on this compression/expressiveness
      axis.
    confidence: medium
    relevance: medium
  - claim_id: wavchat_full_duplex_requires_causal_pipeline
    role: refines
    claim: Achieving genuine full-duplex spoken dialogue (simultaneous listening and speaking with interrupt
      handling) requires architecturally causal models throughout the full pipeline, a constraint that
      current systems largely satisfy only on the output side.
    source: §5.1, §5.2
    evidence: The survey documents that most surveyed systems (aside from Moshi and OmniFlatten) use non-streaming
      input encoders (e.g. Whisper-based), satisfying causality only on the speech-generation side.
    confidence: medium
    relevance: high
  - claim_id: wavchat_paired_data_forgetting_risk
    role: supports
    claim: Speech-text modality alignment in current spoken dialogue systems relies heavily on paired
      data, introducing catastrophic forgetting risk and creating a structural dependency on the availability
      of labelled speech corpora.
    source: §4.4.1
    evidence: The survey's training-paradigm chapter documents that nearly all surveyed systems depend
      on paired text-speech data for alignment, flagging catastrophic forgetting as a consistent risk.
    confidence: medium
    relevance: medium
  - claim_id: wavchat_evaluation_infrastructure_lags
    role: supports
    claim: 'Evaluation infrastructure for spoken dialogue lags substantially behind system capabilities:
      interaction, streaming latency, and audio generation are either absent from or severely underrepresented
      in existing benchmarks.'
    source: §6.2, §6.3, Table 3
    evidence: The survey's benchmark-mapping table (Table 3) shows that of eight reviewed benchmarks,
      none covers audio generation by spoken dialogue models and interaction-capability evaluation remains
      largely ad hoc.
    confidence: medium
    relevance: high
  limitations:
  - Produced concurrently with the primary wave of open-source spoken dialogue models it covers (late
    2024); some systems are described in early form.
  - Several prominent systems (Westlake-Omni, Hertz-dev, SpeechGPT2, Fish-Agent) lack published papers
    and are excluded from the survey's timeline.
  caveats:
  - As with the other survey in this batch, treat these claims as literature synthesis rather than the
    paper's own new experimental evidence.
- id: '2411.17607'
  entry_date: '2026-07-19'
  year: 2024
  venue: arXiv
  task:
  - SCA
  architecture:
  - autoregressive-LM
  - flow-matching
  relevance: high
  evidence_role:
  - core_evidence
  - acceleration_evidence
  current_role: active_evidence
  method_family:
  - native_joint_speech_text_lm
  claims:
  - claim_id: scaling_synthetic_interleaved_transfer
    role: supports
    claim: Synthetic speech-text interleaved data, generated by converting text spans to speech tokens
      using a learned text-to-token model, enables effective cross-modal knowledge transfer from pre-trained
      LLMs to the speech domain.
    source: §2.2, §3.3.1, Table 5
    evidence: 'Removing interleaved data causes near-total collapse on spoken QA (Llama Questions, S setting:
      50.7 drops to 2.3), while scaling from 100B to 600B interleaved tokens yields consistent further
      gains.'
    confidence: high
    relevance: high
  - claim_id: scaling_lower_frame_rate_improves_perf
    role: supports
    claim: Lower speech tokenizer frame rates improve speech language modelling performance within a fixed
      token budget, with gains plateauing around 12.5 Hz where information loss begins to outweigh efficiency
      benefits.
    source: §3.3.2, Figure 3a
    evidence: A single codebook of size 16,384 at 12.5 Hz is selected as the best trade-off between semantic
      retention (WER 8.43 on LibriSpeech) and pre-training efficiency.
    confidence: medium
    relevance: medium
  - claim_id: scaling_supervised_tokenizer_better_semantic_retention
    role: supports
    claim: Supervised speech tokenization derived from ASR model fine-tuning achieves stronger semantic
      preservation at low frame rates than unsupervised codec-based tokenisers, while maintaining competitive
      speech reconstruction quality.
    source: §2.1, Table 1
    evidence: The supervised VQ-Whisper tokenizer achieves comparable or better reconstruction than WavTokenizer
      (RVQGAN) in Table 1 while operating causally at a lower frame rate.
    confidence: medium
    relevance: medium
  - claim_id: scaling_interleaved_pretraining_narrows_qa_gap
    role: supports
    claim: Speech-text pre-training with interleaved data substantially narrows the gap between speech-only
      and speech-to-text performance on spoken question answering, suggesting that cross-modal alignment
      transfers factual knowledge from text representations to speech decoding.
    source: §3.2, Table 3
    evidence: On Llama Questions (S setting), the 9B model reaches 50.7 versus Moshi's 21.0, more than
      doubling Moshi's best score despite roughly one-tenth of Moshi's natural speech training data.
    confidence: high
    relevance: high
  - claim_id: scaling_pure_speech_can_match_text_guided_baselines
    role: refines
    claim: An intermediate text response in speech generation (text-guided mode) provides meaningful accuracy
      gains for knowledge-intensive tasks, but a well-pre-trained model operating purely in the speech
      domain can still match text-guided baselines from prior work.
    source: §3.2, Table 4
    evidence: In direct speech-to-speech mode (no text guidance), the model scores 3.18/3.2 on the spoken
      chatbot evaluation, comparable to text-guided baselines such as LlamaOmni (3.5/3.9) and Moshi (2.42/3.6).
    confidence: medium
    relevance: high
  limitations:
  - No code or model weights are publicly released, and the proprietary Chinese ASR dataset (10k hours)
    used in tokenizer training cannot be replicated by third parties.
  - Full-duplex conversation capability, demonstrated by Moshi, is not explored, and scaling beyond 9B
    parameters is left as future work.
  caveats:
  - The fine-tuning dataset (SpeechDialog-90K) is synthesised using MeloTTS for speech responses, so the
    chatbot's output speech may inherit MeloTTS's quality characteristics rather than reflecting the model's
    own generative capacity.
- id: '2412.15649'
  entry_date: '2026-07-19'
  year: 2024
  venue: arXiv
  task:
  - SCA
  architecture:
  - autoregressive-LM
  - flow-matching
  relevance: high
  evidence_role:
  - core_evidence
  - control_evidence
  current_role: active_evidence
  method_family:
  - modular_gated_streaming_tts_decoder
  claims:
  - claim_id: slamomni_decoupled_timbre_control
    role: supports
    claim: Decoupling speaker identity from semantic content in spoken dialogue systems enables zero-shot
      timbre control without modifying the language model or adding speaker-conditioning layers.
    source: §3.4
    evidence: Semantic tokens encode only linguistic content; a conditional flow-matching vocoder conditioned
      on a speaker audio prompt supplies the timbre, letting users select the output voice at inference
      with no LLM change.
    confidence: medium
    relevance: high
  - claim_id: slamomni_grouped_tokens_improve_alignment
    role: supports
    claim: Grouping audio tokens to reduce the frequency mismatch between text and speech representations
      substantially improves speech-text alignment and training efficiency in parallel audio-text dialogue
      models.
    source: §3.3, Table 5
    evidence: Semantic Group Modeling with G=3 reduces ASR-WER from 18.23% (G=1) to 4.54% while converging
      in less than half the GPU hours.
    confidence: high
    relevance: medium
  - claim_id: slamomni_single_stage_matches_multistage
    role: contradicts
    claim: Single-stage fine-tuning on dialogue data can match or outperform multi-stage pipelines that
      include ASR or TTS pre-training, because modality-specific pre-training degrades instruction-following
      and general knowledge retention.
    source: §5.3.2, Table 6
    evidence: Adding an ASR or TTS pre-training stage before dialogue fine-tuning hurts ChatGPT content
      scores by 5 and 12 points respectively, with no meaningful WER gain, versus the single-stage recipe.
    confidence: high
    relevance: high
  - claim_id: slamomni_text_history_improves_multiturn
    role: supports
    claim: Replacing audio-token history with text-only history in multi-turn spoken dialogue models improves
      the system's ability to handle longer conversation contexts while leveraging pre-trained LLM in-context
      learning.
    source: §3.5
    evidence: Historical Text Prompting stores only text transcriptions of past turns with KV-cache reuse,
      drastically reducing context length versus interleaved audio-text history.
    confidence: low
    relevance: medium
  - claim_id: slamomni_sdms_underperform_text_llms
    role: complicates
    claim: Current spoken dialogue models consistently underperform text-only LLMs of similar scale on
      semantic content quality, even after dialogue fine-tuning.
    source: §5.1, Table 3
    evidence: SLAM-Omni and all compared SDMs (Mini-Omni, Mini-Omni2, LLaMA-Omni, Freeze-Omni, GLM-4-Voice)
      score well below the text-only ceiling on ChatGPT-based content scoring despite SLAM-Omni leading
      the SDM comparison set.
    confidence: high
    relevance: high
  limitations:
  - Historical text prompting discards all non-verbal information from prior dialogue turns (prosody,
    emotion, paralinguistic cues), which may reduce response quality in ways not captured by text-based
    evaluation metrics.
  - The system is evaluated exclusively at 0.5B scale; the single-stage training advantage may not hold
    for larger LLMs.
  caveats:
  - Training data relies entirely on TTS-synthesized dialogue utterances rather than real recorded speech;
    whether timbre control and speech quality generalise to natural in-the-wild audio at inference time
    is untested.
- id: '2501.06282'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - TTS
  - SCA
  architecture:
  - autoregressive-LM
  - flow-matching
  - hybrid
  relevance: high
  evidence_role:
  - core_evidence
  - control_evidence
  current_role: influential
  method_family:
  - modular_gated_streaming_tts_decoder
  claims:
  - claim_id: minmo_scale_no_catastrophic_forgetting
    role: supports
    claim: Large-scale multi-task training across heterogeneous speech tasks substantially improves both
      comprehension and generation in aligned multimodal speech LMs without catastrophic forgetting of
      the base LLM's text capabilities.
    source: §3.4, §4.1-4.5
    evidence: MinMo's four-stage curriculum trains an 8B aligned multimodal model on 1.4M hours spanning
      ASR, translation, emotion, speaker analysis, and conversational speech, achieving leading ASR/translation/spoken-QA
      results while retaining broad task coverage.
    confidence: medium
    relevance: high
  - claim_id: minmo_aligned_style_control_contradicts_native_only_claim
    role: contradicts
    claim: Aligned multimodal architectures can achieve instruction-controlled speech style (emotion,
      dialect, speaking rate, voice identity) when trained with appropriate instruction data, contradicting
      prior claims that this capability is limited to native multimodal models.
    source: §3.2, §4.4, Table 18
    evidence: MinMo reaches 98.4% instruction-following accuracy for emotion/dialect/speaking-rate/role-play
      control on a 122-turn in-house Chinese test set, versus 63.1% for GLM-4-Voice, directly against
      GLM-4-Voice's own framing that only native multimodal models support style control.
    confidence: medium
    relevance: high
  - claim_id: minmo_subsecond_full_duplex_without_joint_pretraining
    role: supports
    claim: Full-duplex spoken dialogue at sub-second latency is achievable with a modular aligned architecture
      combining a semantic predictor with a streaming autoregressive decoder, without requiring joint
      speech-text pre-training.
    source: §3.1, §4.5, Table 21
    evidence: MinMo's Full Duplex Predictor plus streaming voice decoder reaches ~600ms theoretical (~800ms
      practical) end-to-end latency and 0.80 turn-taking F1 at K=10 on real Alimeeting conversation.
    confidence: medium
    relevance: high
  - claim_id: minmo_ar_decoder_beats_nar_and_composite
    role: supports
    claim: An autoregressive streaming voice decoder that interleaves text hidden states with speech tokens
      outperforms non-autoregressive CTC-based decoders in naturalness and content consistency for aligned
      speech LMs.
    source: §3.2, §4.4, Table 17
    evidence: MinMo's AR voice decoder, interleaving LLM hidden states with speech tokens at a 5:15 ratio,
      is presented as outperforming LLaMA-Omni's NAR CTC decoder and Freeze-Omni's composite multi-decoder
      design in the paper's architecture comparison.
    confidence: medium
    relevance: medium
  limitations:
  - LoRA-only updates to the text LLM during training limit the model's ability to follow diverse instructions;
    more comprehensive LLM updates remain unexplored.
  - The full-duplex module still relies on external acoustic echo cancellation and VAD modules, meaning
    a truly end-to-end duplex system has not been achieved.
  caveats:
  - The instruction-following voice generation evaluation uses a single in-house Chinese test set of 122
    turns, and code/model weights were unreleased at time of publication, limiting external verification
    of the headline style-control numbers.
- id: '2502.17239'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  - TTS
  architecture:
  - autoregressive-LM
  - flow-matching
  - hybrid
  relevance: high
  evidence_role:
  - core_evidence
  - architecture_variant
  current_role: influential
  method_family:
  - modular_gated_streaming_tts_decoder
  claims:
  - claim_id: baichuanaudio_multicodebook_rvq_preserves_content
    role: supports
    claim: Multi-codebook RVQ tokenizers with semantic alignment objectives better preserve both acoustic
      and linguistic content than single-codebook designs, with each additional layer reducing ASR error
      substantially up to eight layers.
    source: §3.1, Table 1
    evidence: The 8-layer RVQ Baichuan-Audio-Tokenizer achieves WER 5.3% vs. 26.2% for a 1-layer variant
      on LibriSpeech reconstruction, using layerwise codebook dropout to concentrate semantic content
      in top layers.
    confidence: high
    relevance: medium
  - claim_id: baichuanaudio_staged_pretraining_reduces_forgetting
    role: supports
    claim: Staged pretraining (frozen LLM first, then joint training) measurably reduces intelligence
      degradation in end-to-end speech LMs relative to single-stage joint training.
    source: §3.3.1, Table 5
    evidence: Two-stage pretraining closes roughly 2 percentage points of the S->T accuracy gap on sStoryCloze
      relative to single-stage training (79.6 vs. 77.5).
    confidence: high
    relevance: high
  - claim_id: baichuanaudio_text_guided_generation_mitigates_incoherence
    role: supports
    claim: Text-guided aligned generation, where the model completes text tokens before emitting the corresponding
      audio tokens, mitigates semantic incoherence in speech LM outputs.
    source: §3.3, §4.1
    evidence: Modality-switching special tokens enforce text completion before audio generation for each
      utterance, following the text-guided interleaved pattern established by GLM-4-Voice.
    confidence: medium
    relevance: high
  - claim_id: baichuanaudio_flowmatching_recovers_quantization_loss
    role: supports
    claim: Flow-matching decoders trained as post-VQ refinement stages recover significant audio quality
      lost during quantisation, with UTMOS improvements of several tenths of a point possible without
      retraining the LLM.
    source: §3.2, Table 3
    evidence: UTMOS rises from 3.43 (VQ alone) to 4.05 with the flow-matching decoder, approaching ground
      truth (4.08), while also reducing WER from 2.84% to 2.78% on LibriSpeech-dev.
    confidence: high
    relevance: medium
  - claim_id: baichuanaudio_s2s_mode_penalty_vs_s2t
    role: complicates
    claim: End-to-end speech LMs evaluated in speech-to-speech mode exhibit notably lower benchmark performance
      than the same model evaluated in speech-to-text mode, indicating that audio token generation itself
      introduces a quality penalty beyond the comprehension step.
    source: §4.3, Table 8
    evidence: Baichuan-Audio's S->S mode consistently underperforms its own S->T mode across the OpenAudioBench
      task suite (Reasoning QA, Llama Questions, Web Questions, TriviaQA, AlpacaEval).
    confidence: medium
    relevance: high
  limitations:
  - TTS quality evaluation is limited to an in-house test set (MED-TTS); no comparison against standard
    TTS benchmarks or dedicated TTS systems is reported.
  - Full-duplex and interruption-handling capabilities common in deployed spoken conversational agents
    are not evaluated.
  caveats:
  - The intelligence gap to GPT-4o-Audio remains large (roughly 15-20 points on QA tasks) without an architectural
    or data-driven explanation, and the OpenAudioBench GPT-4o-as-judge evaluation may introduce evaluation
    bias.
- id: '2504.08528'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  architecture: []
  relevance: medium
  evidence_role:
  - infrastructure
  current_role: influential
  method_family: []
  claims:
  - claim_id: survey_landscape_content_vs_paralinguistic_tradeoff
    role: supports
    claim: Models that excel at content-level spoken language understanding tend to underperform on tasks
      requiring reasoning about acoustic and paralinguistic details, indicating that these capabilities
      require separate optimisation.
    source: §7.2, VoiceBench vs. MMAU comparison
    evidence: The survey observes that VoiceBench and MMAU scores are negatively correlated across models,
      indicating content-oriented QA ability and broader audio reasoning are distinct, non-jointly-optimised
      capabilities.
    confidence: medium
    relevance: medium
  - claim_id: survey_landscape_cascade_e2e_complementary
    role: supports
    claim: 'Cascaded speech pipelines and end-to-end spoken language models have complementary strengths:
      cascades are stronger on semantic tasks, while end-to-end models better handle speaker and paralinguistic
      information.'
    source: §7.2
    evidence: The survey synthesises comparisons across Dynamic-SUPERB Phase 2, MMAU, and VoiceBench to
      support this complementary-strengths framing of the cascade-vs-end-to-end split.
    confidence: medium
    relevance: high
  - claim_id: survey_landscape_joint_training_forgetting_risk
    role: supports
    claim: Jointly training a speech encoder with an LLM backbone improves instruction following and paralinguistic
      understanding but introduces risk of catastrophic forgetting of pre-trained text capabilities.
    source: §7.2, §4.3
    evidence: The survey's training-paradigm synthesis identifies catastrophic forgetting as a consistent
      risk across the surveyed joint speech-LLM training literature.
    confidence: medium
    relevance: medium
  - claim_id: survey_landscape_full_duplex_architectural_tradeoffs
    role: supports
    claim: Full-duplex spoken dialogue requires architectural support beyond turn-taking assumptions,
      and current approaches (dual-channel and time-multiplexing) each involve significant trade-offs
      in latency, naturalness, and modelling complexity.
    source: §6
    evidence: The survey's duplex dialogue section catalogues dual-channel systems (dGSLM, Moshi) against
      time-multiplexing systems (OmniFlatten, SCoT) and their respective trade-offs.
    confidence: medium
    relevance: high
  - claim_id: survey_landscape_tokenization_choice_tradeoff
    role: supports
    claim: The tokenisation choice (phonetic tokens versus audio codec tokens) determines the trade-off
      between linguistic coherence and speaker or acoustic fidelity in spoken language model outputs.
    source: §3.1.2, comparison of token types
    evidence: The survey's token-type comparison table contrasts phonetic (HuBERT/WavLM-derived) against
      acoustic (RVQ codec) tokenizers on this linguistic-coherence-versus-fidelity axis.
    confidence: medium
    relevance: medium
  limitations:
  - Primarily a snapshot of English-centric, high-resource SLM research; multilingual, low-resource, and
    dialect coverage receives minimal treatment.
  - Scaling behaviour for speech+text LMs and speech-aware text LMs is entirely unknown per the survey's
    own gap analysis; only pure speech LM scaling has been studied.
  caveats:
  - As a survey, these claims are literature syntheses rather than the paper's own new experimental evidence;
    confidence should be read as bounded by the quality of the underlying papers it summarises, not independently
    verified here.
- id: 2025.naacl-long.484
  entry_date: '2026-07-19'
  year: 2025
  venue: NAACL
  task:
  - SCA
  - TTS
  architecture:
  - autoregressive-LM
  relevance: high
  evidence_role:
  - core_evidence
  - control_evidence
  current_role: active_evidence
  method_family:
  - native_joint_speech_text_lm
  claims:
  - claim_id: behaviorsd_streamlined_tokens_beat_alternating_channel
    role: supports
    claim: A single-stream control-token representation for full-duplex dialogue can match or exceed a
      doubled-channel alternating representation in both naturalness and behavioral adherence, while using
      fewer tokens per unit of audio duration.
    source: §7.1, §7.2, Table 4, Table 5
    evidence: On the same Llama3.2-1B backbone and Behavior-SD training data, the streamlined-unit variant
      scores 4.09 naturalness MOS and 0.58 interruption adherence vs. 3.90 MOS and 1.21 interruption adherence
      for the alternating-unit (dGSLM-style) variant.
    confidence: high
    relevance: high
  - claim_id: behaviorsd_first_utterance_prompting_improves_identity
    role: supports
    claim: Conditioning a speech-prompted TTS synthesizer on a speaker's very first utterance, in addition
      to their most recent utterance, materially improves long-range speaker identity consistency in independently
      synthesized multi-turn dialogue.
    source: §7.3, Table 6
    evidence: WavLM-Base+ cosine similarity between the prompt and synthesized speech rises from 0.680
      (no prompt) to 0.889 when conditioning on the first utterance alone, with combined first+previous
      prompting yielding the best transition smoothness (0.872) without degrading global identity.
    confidence: high
    relevance: medium
  - claim_id: behaviorsd_text_pretraining_helps_narrative_not_behavior
    role: complicates
    claim: Pretraining a dialogue generation model on text-only dialogue before fine-tuning on speech-unit
      sequences improves adherence to narrative content but is not necessary for behavioral adherence.
    source: §7.2, Table 5
    evidence: Removing the text-dialogue pretraining stage drops narrative adherence from 3.11 to 2.80,
      while behavioral adherence scores for filler words, backchannels, and interruptions remain comparable
      with and without pretraining.
    confidence: medium
    relevance: medium
  - claim_id: behaviorsd_cascade_lacks_behavioral_tracking
    role: complicates
    claim: Cascaded LLM-then-TTS pipelines for spoken dialogue generation can achieve strong narrative
      coherence and sound quality but struggle to maintain conversational meaningfulness because they
      lack any mechanism to track behavioral context across the full dialogue.
    source: §7.1, §6.2, Table 3
    evidence: GPT-4o and Llama3-70B cascaded baselines achieve the highest narrative adherence scores
      (4.58 and 4.09) but lower meaningfulness MOS (3.97 for both) than the proposed model (4.04), attributed
      by the authors to speaker confusion and misplaced backchannels in cascaded outputs.
    confidence: medium
    relevance: high
  limitations:
  - All quantitative evaluation (human MOS, behavioral adherence, speaker consistency) is conducted entirely
    on Behavior-SD's own synthetic test split, generated by the same LLM and TTS pipeline used for training
    data; no evaluation on real human-recorded spoken dialogue is reported.
  - The dataset and model are limited to two-speaker dialogues; multi-speaker extension is flagged as
    future work.
  caveats:
  - As a dialogue-generation model producing full-duplex two-channel audio from narrative and behavior
    conditions rather than an interactive real-time conversational agent, Behavior-SD extends the dGSLM/Moshi
    lineage of speech-token dialogue modeling to controllable generation rather than live user interaction;
    manual verification recommended on whether this changes its weight relative to interactive S2S systems
    in this concept's synthesis.
- id: 2025.naacl-demo.21
  entry_date: '2026-07-19'
  year: 2025
  venue: NAACL
  task:
  - SCA
  architecture: []
  relevance: high
  evidence_role:
  - infrastructure
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - cascade_pipeline_systems
  claims:
  - claim_id: espnetsds_cascade_higher_audio_quality_than_e2e
    role: supports
    claim: Cascaded spoken dialogue pipelines built from dedicated, task-specific ASR and TTS components
      can produce substantially higher audio output quality than current end-to-end spoken dialogue systems
      that generate speech directly from audio input.
    source: §7, Table 4
    evidence: On Switchboard Eval 2000, the directly-synthesized speech from the E2E system Mini-Omni
      scores UTMOS 2.88, versus 3.97-4.07 for cascaded pipelines using LJSpeech, LibriTTS, or VCTK VITS
      as the TTS module.
    confidence: medium
    relevance: high
  - claim_id: espnetsds_e2e_coherent_but_templated
    role: complicates
    claim: End-to-end spoken dialogue systems that respond directly to audio input without explicit dialogue-context
      modeling can produce coherent individual responses while still exhibiting unnatural conversational
      behavior such as repeated or templated phrasing across turns.
    source: §7, Table 3
    evidence: The text dialogue evaluation finds that Mini-Omni produces highly coherent, contextually
      relevant responses but exhibits significant self-overlap and template-like outputs across turns.
    confidence: medium
    relevance: medium
  - claim_id: espnetsds_asr_domain_mismatch_misleads_wer
    role: complicates
    claim: Automatic ASR module benchmarking on conversational telephone speech corpora can produce highly
      misleading word error rates when the candidate ASR model's training domain does not match the conversational,
      disfluent register of the test data.
    source: §7, Table 2
    evidence: An ESPnet LibriSpeech-trained ASR model evaluated on Switchboard Eval 2000 yields WER 342.2%
      and CER 298%, far worse than domain-matched models like OWSM 3.1 (14.4% WER), illustrating a severe
      train/test domain mismatch rather than a genuine architecture comparison.
    confidence: high
    relevance: low
  - claim_id: espnetsds_transcript_quality_affects_tts_intelligibility
    role: supports
    claim: The choice of input transcript quality substantially affects downstream TTS intelligibility
      metrics independent of the TTS model itself, because more grammatically well-formed text is easier
      for TTS systems to synthesize accurately.
    source: §A.4, Table 8
    evidence: Replacing ground-truth disfluent Switchboard transcripts with LLM-generated text responses
      as TTS input improves intelligibility across all tested TTS models, e.g. LJSpeech VITS WER drops
      from 16.1% to 6.0% under OWSM 3.1 hypotheses.
    confidence: medium
    relevance: low
  - claim_id: espnetsds_dialogue_llm_robust_to_asr_noise_variably
    role: complicates
    claim: Text dialogue response generators integrated into a cascaded spoken dialogue pipeline are not
      strongly degraded by upstream automatic speech recognition errors relative to using ground-truth
      transcripts, though smaller language models may be more sensitive to this noise than larger ones.
    source: §A.3, Table 7
    evidence: Substituting OWSM 3.1 ASR transcripts for ground-truth transcripts as dialogue context changes
      LLaMA-3.2-1B perplexity only slightly (48.2 to 47.5) while SmolLM v2-1.7B perplexity degrades substantially
      (113.7 to 285.1).
    confidence: low
    relevance: low
  limitations:
  - The headline comparative analysis (§7) is conducted on a single dataset (11 hours of Switchboard Eval
    2000) with only one example E2E system (Mini-Omni), and the human pilot study involves just 4 participants
    drawn from the author group and research collaborators.
  - The range of currently supported E2E audio foundation models is limited (only Mini-Omni is demonstrated);
    performance has not been assessed in low-resource language, noisy-environment, or multi-speaker settings.
  caveats:
  - The toolkit's own comparisons (e.g., Mini-Omni vs. dedicated TTS models) are explicitly flagged by
    the authors as not strictly fair since the systems take different inputs (audio vs. ground-truth text);
    the reported findings should be read as a demonstration of the toolkit's evaluation capability rather
    than a generalizable cascade-vs-E2E benchmark.
- id: 2025.iwsds-1.27
  entry_date: '2026-07-19'
  year: 2025
  venue: IWSDS
  task:
  - SCA
  architecture: []
  relevance: medium
  evidence_role:
  - infrastructure
  - evaluation_caution
  current_role: minor
  method_family: []
  claims:
  - claim_id: turntaking_survey_no_shared_benchmarks
    role: complicates
    claim: Systematic progress measurement in turn-taking modeling is impeded by the absence of shared
      evaluation benchmarks.
    source: §7.1
    evidence: 72% of surveyed papers do not compare their methods with prior work, and one third of end-of-turn
      detection papers use no public corpus, making cross-study comparison unreliable.
    confidence: high
    relevance: low
  - claim_id: turntaking_survey_multimodal_cues_help
    role: supports
    claim: Combining multimodal cues (prosodic, lexical, and visual) consistently improves turn-taking
      prediction over single-modality approaches.
    source: §4.1
    evidence: Multiple independent surveyed works demonstrate that joint use of prosodic and word features
      outperforms either in isolation.
    confidence: medium
    relevance: low
  - claim_id: turntaking_survey_vap_unifies_eou_backchannel
    role: supports
    claim: Voice Activity Projection models provide a self-supervised framework that unifies end-of-turn
      and backchannel prediction in continuous spoken dialogue.
    source: §4.1, §5
    evidence: VAP models evaluated zero-shot across shift prediction, hold prediction, upcoming backchannel,
      and backchannel-vs-turn-shift classification outperform earlier silence-threshold and IPU-based
      baselines in multiple reviewed works.
    confidence: medium
    relevance: medium
  - claim_id: turntaking_survey_llms_insufficient_alone
    role: complicates
    claim: Large language models are insufficient as standalone turn-taking detectors in spoken dialogue.
    source: §4.1
    evidence: A surveyed study demonstrates that LLMs are ineffective at detecting mid-utterance turn
      initiation points without integration of acoustic signals.
    confidence: medium
    relevance: medium
  - claim_id: turntaking_survey_crosslingual_needs_alignment
    role: complicates
    claim: Cross-lingual transfer for turn-taking models requires alignment of speech segmentation criteria,
      not merely multilingual training data.
    source: §4.1, §7.3
    evidence: VAP models show poor zero-shot cross-lingual transfer; alignment of IPU silence threshold
      definitions across datasets is identified as a prerequisite for valid multilingual evaluation.
    confidence: medium
    relevance: low
  limitations:
  - Literature search focuses on post-2021 work from major conference proceedings and may underrepresent
    preprints and workshop papers outside those venues.
  - The multi-party conversation section is acknowledged by the authors as sparse.
  caveats:
  - This survey covers turn-taking modeling broadly across spoken dialogue systems, including non-generative
    and classical VAD-based agents, rather than specifically the end-to-end speech-to-speech paradigm;
    its relevance to this concept is as cross-cutting infrastructure and evaluation context for full-duplex
    E2E systems rather than direct S2S system evidence. Manual verification recommended on whether this
    paper should remain tagged to speech-to-speech versus living solely under evaluation-metrics/subjective-evaluation.
- id: '2505.02625'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  architecture:
  - autoregressive-LM
  - flow-matching
  - hybrid
  relevance: high
  evidence_role:
  - core_evidence
  - acceleration_evidence
  current_role: influential
  method_family:
  - modular_gated_streaming_tts_decoder
  claims:
  - claim_id: llamaomni2_ar_decoder_smaller_s2t_s2s_gap
    role: supports
    claim: Autoregressive streaming TTS decoders in modular spoken conversational agents produce higher-quality
      speech and smaller S2T-to-S2S accuracy gaps than non-autoregressive streaming decoders, at a modest
      latency cost.
    source: §5.1, Table 1
    evidence: LLaMA-Omni2-7B's S2T-to-S2S accuracy gap on Web Questions is only 3.2 points, versus 9.7
      for LLaMA-Omni's NAR decoder and 16.3 for GLM-4-Voice.
    confidence: high
    relevance: high
  - claim_id: llamaomni2_modular_matches_native_with_far_less_data
    role: supports
    claim: Modular spoken conversational agents trained on tens of thousands of hours of synthesized speech-to-speech
      dialogue can match the performance of native SpeechLMs trained on millions of hours of unsupervised
      speech data.
    source: §5.1, Table 1
    evidence: LLaMA-Omni2-7B surpasses GLM-4-Voice (9B, trained on millions of hours) on SpokenQA and
      instruction-following despite training on only about 200K multi-turn dialogue samples.
    confidence: medium
    relevance: high
  - claim_id: llamaomni2_gate_fusion_improves_consistency
    role: supports
    claim: Jointly conditioning a TTS language model on LLM hidden states and text token embeddings via
      a learned gate fusion improves both semantic consistency (WER) and instruction-following quality
      over hidden-state-only conditioning.
    source: §5.2, Table 2
    evidence: Removing the gate fusion module raises ASR-WER from 3.26% to 4.89% and lowers the S2S ChatGPT
      score from 4.15 to 4.02.
    confidence: high
    relevance: medium
  - claim_id: llamaomni2_tts_pretraining_critical_for_convergence
    role: supports
    claim: TTS language model pretraining on text-speech pairs is a critical prerequisite for stable convergence
      in modular SpeechLMs; initializing from a language model alone is insufficient.
    source: §5.2, Table 3
    evidence: A randomly initialized TTS language model fails to converge, and text-only pretraining without
      streaming causes WER to reach 10.34%.
    confidence: high
    relevance: medium
  - claim_id: llamaomni2_rw_chunk_size_tradeoffs
    role: supports
    claim: In streaming speech generation, the write chunk size primarily determines speech naturalness
      while the read chunk size primarily determines text-speech alignment, with latency jointly determined
      by both.
    source: §5.2, Table 4
    evidence: Ablating the Read:Write chunk parameters shows larger write chunks improving UTMOS at a
      latency cost, while read chunk size primarily affects alignment.
    confidence: medium
    relevance: low
  limitations:
  - All evaluations are conducted in English only, trained on a single fixed output voice; no multilingual
    or voice-diversity experiments are reported.
  - Cannot modulate speech style (emotion, speaking rate, dialect) in response to paralinguistic cues
    in the input.
  caveats:
  - Comparison to MinMo (a concurrent work using 1.4M hours) is mentioned in related work but not included
    in the main experimental table, leaving the data-efficiency claim partially unverified against the
    most directly comparable system.
  - This paper (arXiv preprint) and 2025.acl-long.912 (ACL camera-ready) are the same underlying work
    (LLaMA-Omni 2, identical authors and title, overlapping results). Both exist as separate wiki pages
    and are included here per instruction, but Phase 2 synthesis should treat this pair as one independent
    data point, not two, when assessing claim-cluster support thresholds. Recommend an ingest-side dedup
    review per the arXiv-full-version-dedup precedent.
- id: '2506.23049'
  entry_date: '2026-07-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: high
  evidence_role:
  - core_evidence
  - negative_evidence
  current_role: active_evidence
  method_family:
  - cascade_pipeline_systems
  claims:
  - claim_id: aura_cascade_beats_e2e_on_voicebench
    role: supports
    claim: Cascaded ASR+LLM+TTS pipelines outperform end-to-end speech models on practical spoken task
      benchmarks when a high-quality instruction-tuned text LLM serves as the reasoning backbone.
    source: §III.A, Table I
    evidence: AURA with Whisper+LLaMA-3.3-70B achieves 92.75% on VoiceBench OpenBookQA versus 25.93% (Moshi)
      and 26.59% (Mini-Omni2) for end-to-end speech models, and 83.52% for Kimi-Audio.
    confidence: high
    relevance: high
  - claim_id: aura_retrieval_augmentation_improves_qa
    role: supports
    claim: Retrieval augmentation via web search at inference time improves spoken question answering
      on knowledge-intensive multiple-choice tasks without retraining.
    source: §III.A
    evidence: Prompting AURA (OWSM ASR) to perform at least one web search before answering raises OpenBookQA
      accuracy from 87.69% to 89.23%.
    confidence: medium
    relevance: low
  - claim_id: aura_react_enables_tool_use
    role: supports
    claim: ReAct-style interleaved reasoning and action enables reliable tool selection and goal completion
      in multi-turn spoken conversational agents.
    source: §III.B, Table II
    evidence: AURA achieves 90% overall task success and satisfaction scores above 4.0 across 30 human-evaluated
      tasks spanning compound goals requiring calendar, email, contact, and web search APIs.
    confidence: medium
    relevance: medium
  - claim_id: aura_dst_remains_unreliable
    role: complicates
    claim: Dialog state tracking in spoken task-oriented systems remains far from reliable even with large
      instruction-tuned LLMs applied without fine-tuning.
    source: §III.C, Table III
    evidence: AURA achieves 28.76% JGA on SpokenWOZ, improving over the best prior baseline by 3.1 points
      but remaining well below full accuracy.
    confidence: medium
    relevance: medium
  limitations:
  - The human evaluation of multi-turn task success uses a single evaluator (a co-author), introducing
    potential bias; no inter-annotator agreement or independent replication is provided.
  - The TTS component is a single English, single-speaker VITS model; naturalness, speaker diversity,
    and multilingual coverage are not assessed.
  caveats:
  - AURA's central empirical finding, cascade substantially outperforming E2E on VoiceBench, reinforces
    the same pattern already established by VoiceBench itself (2410.17196, already in this YAML) and by
    ESPnet-SDS in this same batch; treat as corroborating rather than independent new evidence for the
    cascade-vs-E2E cluster.
- id: '2507.16632'
