method_families:
- id: native_joint_speech_text_lm
  name: Native joint speech-text token language models
  summary: A single autoregressive decoder generates interleaved or parallel speech and text tokens directly
    from an LLM-derived vocabulary, without a separate downstream TTS module. This is the lineage running
    from SpeechGPT through Moshi and OmniFlatten to their multilingual, reasoning, and duplex-DST descendants.
  papers:
  - '2305.11000'
  - '2305.15255'
  - '2402.05755'
  - '2408.16725'
  - '2410.00037'
  - '2410.17799'
  - '2410.11190'
  - 2025.naacl-long.484
  - interspeech-2025-2564
  - 2025.findings-ijcnlp.49
  - '2509.09174'
  - '2508.15827'
  - '2508.16188'
  - '2411.17607'
  - 2025.acl-long.997
  open_questions:
  - Whether joint token-stream generation can close the remaining semantic and reasoning gap with cascaded
    systems without reintroducing a text bottleneck.
  - Whether full-duplex stream-flattening approaches generalize beyond the sub-1B-parameter regimes in
    which they have mostly been demonstrated.
- id: full_duplex_dual_stream_architectures
  name: Dual-stream / asymmetric full-duplex architectures
  summary: User and agent audio are routed through separate pathways, a pretrained streaming encoder for
    input and a distinct codec/decoder for output, rather than flattened into a single token stream, allowing
    full-duplex interaction without requiring the backbone LLM to learn speech representations end-to-end.
  papers:
  - '2408.02622'
  - '2505.15670'
  - interspeech-2025-0874
  - '2508.07375'
  open_questions:
  - Whether asymmetric duplex designs scale to open-domain, high-complexity reasoning tasks as well as
    the flattened single-stream alternative.
  - How text-insertion timing and chunking policies generalize across languages with different morphological
    density.
- id: modular_gated_streaming_tts_decoder
  name: Modular LLM with gated / aligned streaming TTS decoder
  summary: The backbone text LLM is kept largely intact (frozen or lightly adapted) and a separately-trained
    streaming autoregressive or flow-matching TTS decoder is conditioned on its hidden states or text
    tokens via learned fusion (gating, cross-attention, or CTC), rather than training a single joint token
    stream from scratch.
  papers:
  - '2409.06666'
  - '2411.00774'
  - '2501.06282'
  - '2505.02625'
  - 2025.acl-long.912
  - 2025.findings-acl.1051
  - '2507.18119'
  - '2412.15649'
  - 2025.findings-acl.115
  - '2502.17239'
  - '2507.16632'
  - '2509.17765'
  - '2501.04561'
  - '2508.09600'
  - '2509.06502'
  open_questions:
  - Whether gated-fusion streaming TTS decoders will fully close the S2T-to-S2S accuracy gap or asymptote
    at a residual generation-quality penalty.
  - Whether this modular pattern will consolidate as the dominant production architecture given its consistent
    latency and text-capability-preservation advantages over training a native joint token stream from
    scratch.
- id: speech_to_speech_translation_systems
  name: Speech-to-speech / simultaneous translation systems
  summary: Direct speech-to-speech and simultaneous translation models, spanning cross-lingual codec language
    models, boundary-aware streaming decoders, and unit-based translation objectives, distinct from open-domain
    dialogue systems.
  papers:
  - '2303.03926'
  - 2025.acl-long.817
  - interspeech-2025-1595
  - '2507.17527'
  - 2025.findings-acl.75
  open_questions:
  - Whether RL-trained streaming S2ST systems generalize beyond the single proprietary configuration reported
    to date.
  - Whether boundary-aware / wait-k policies remain effective as source-target language pairs diverge
    further in word order and morphology.
- id: cascade_pipeline_systems
  name: Cascaded ASR + LLM + TTS pipeline systems
  summary: Explicit multi-component pipelines chaining separate ASR, text-LLM reasoning, and TTS synthesis
    stages, evaluated as complete spoken dialogue or S2S systems; the baseline paradigm against which
    end-to-end systems are consistently compared in this corpus. Two of the three member papers (ESPnet-SDS,
    the AI-Interview production study) carry no architecture tag of their own since they instantiate a
    pipeline of existing components rather than propose a new generative architecture; membership here
    is a judgment call, not a literal architecture-field match.
  papers:
  - '2506.23049'
  - 2025.naacl-demo.21
  - '2507.16835'
  open_questions:
  - Whether cascade pipelines' quality advantage on general benchmarks is intrinsic to the paradigm or
    simply reflects the current maturity gap between dedicated ASR/TTS components and jointly-trained
    audio LLMs.
  - How production cascade quality decomposes across component choice (ASR/LLM/TTS) versus system-level
    orchestration in real deployment settings.
