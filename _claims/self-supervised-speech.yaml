  claims:
  - claim_id: single_stage_autoregressive_tts_trained_with_next_token_prediction_over
    role: supports
    claim: Single-stage autoregressive TTS trained with next-token prediction over discrete speech tokens is competitive
      with multi-stage AR+NAR pipelines on intelligibility and speaker similarity in continuation mode, though SIM-o
      gaps remain due to codec acoustic reconstruction limits.
    source: §3.2.4, Table 3
    evidence: Single-stage autoregressive TTS trained with next-token prediction over discrete speech tokens is
      competitive with multi-stage AR+NAR pipelines on intelligibility and speaker similarity in continuation mode,
      though SIM-o gaps remain due to codec acoustic reconstruction limits.
    confidence: high
    relevance: low
  - claim_id: both_model_scale_and_training_data_volume_independently_improve_tts
    role: supports
    claim: Both model scale and training data volume independently improve TTS quality across naturalness, prosody,
      and text comprehension, consistent with scaling laws observed in text LLMs.
    source: §2.3, §3.2.2, Tables 2, 4
    evidence: Both model scale and training data volume independently improve TTS quality across naturalness, prosody,
      and text comprehension, consistent with scaling laws observed in text LLMs.
    confidence: high
    relevance: medium
  - claim_id: inference_time_compute_scaling_via_speech_understanding_verifiers_can_substantially
    role: complicates
    claim: Inference-time compute scaling via speech understanding verifiers can substantially improve speaker similarity
      and emotional expressiveness beyond what train-time scaling alone achieves, at the cost of additional inference
      compute.
    source: §2.4, §3.2.3, Figure 2, Table 2
    evidence: Inference-time compute scaling via speech understanding verifiers can substantially improve speaker
      similarity and emotional expressiveness beyond what train-time scaling alone achieves, at the cost of additional
      inference compute.
    confidence: high
    relevance: low
  - claim_id: pure_process_reward_model_beam_search_for_tts_is_prone
    role: supports
    claim: Pure process reward model beam search for TTS is prone to mode collapse that degrades content accuracy
      (WER), and a hybrid partial-PRM strategy is needed to preserve both speaker similarity and intelligibility.
    source: §3.2.3, Figure 2
    evidence: Pure process reward model beam search for TTS is prone to mode collapse that degrades content accuracy
      (WER), and a hybrid partial-PRM strategy is needed to preserve both speaker similarity and intelligibility.
    confidence: high
    relevance: low
  - claim_id: single_vq_codecs_can_achieve_intelligibility_and_naturalness_competitive_with
    role: supports
    claim: Single-VQ codecs can achieve intelligibility and naturalness competitive with multi-layer RVQ codecs
      at the same token rate, but acoustic fidelity (speaker similarity) remains the limiting factor for single-VQ
      reconstruction.
    source: §3.1.2, Table 1
    evidence: Single-VQ codecs can achieve intelligibility and naturalness competitive with multi-layer RVQ codecs
      at the same token rate, but acoustic fidelity (speaker similarity) remains the limiting factor for single-VQ
      reconstruction.
    confidence: high
    relevance: low
  limitations:
  - 'The SIM-o gap between Llasa and RVQ-based baselines is intrinsic to the single-VQ design: acoustic reconstruction
    from a 65,536-entry single codebook at 50 Hz is weaker than 8-layer RVQ codecs, and this gap is only partially
    recovered by inference-time search. Systems requiring high timbre fidelity in a single inference pass would
    need a different codec design.'
  - Inference-time compute scaling requires running multiple candidates (beam search or Best-of-N) with auxiliary
    verifier models, which increases latency and compute cost substantially and makes the approach unsuitable for
    real-time or low-resource applications. The paper does not characterize latency or wall-clock overhead of the
    search strategies.
  - The text understanding evaluation uses expert-rated 3-point discrete scores, which are not directly comparable
    across papers and rely on a small number of sentences per category. The evaluation methodology is adapted from
    BASE TTS but the inter-rater reliability is not reported.
  - Models are trained on mixed Mandarin/English data, but the language coverage and balance are not fully documented.
    The internal data component of the 250k-hour corpus is not described, limiting reproducibility.
  caveats: []
