- id: 2025.naacl-long.484
  entry_date: '2026-07-29'
  year: 2025
  venue: NAACL
  task:
  - SCA
  - TTS
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - architecture_variant
  - acceleration_evidence
  - control_evidence
  current_role: active_evidence
  method_family:
  - autoregressive_ssl_conditioned_models
  claims:
  - claim_id: a_single_stream_control_token_representation_for_full_duplex_dialogue
    role: supports
    claim: A single-stream control-token representation for full-duplex dialogue can match or exceed a doubled-channel
      alternating representation in both naturalness and behavioral adherence, while using fewer tokens per unit
      of audio duration.
    source: §7.1, §7.2, Table 4, Table 5
    evidence: On the same Llama3.2-1B backbone and Behavior-SD training data, the streamlined-unit variant scores
      4.09 naturalness MOS and 0.58 interruption adherence vs. 3.90 MOS and 1.21 interruption adherence for the
      alternating-unit variant.
    confidence: high
    relevance: low
  - claim_id: conditioning_a_speech_prompted_tts_synthesizer_on_a_speaker_s
    role: supports
    claim: Conditioning a speech-prompted TTS synthesizer on a speaker's very first utterance, in addition to their
      most recent utterance, materially improves long-range speaker identity consistency in independently synthesized
      multi-turn dialogue.
    source: §7.3, Table 6
    evidence: WavLM-Base+ cosine similarity between the prompt and synthesized speech rises from 0.680 (no prompt)
      to 0.889 when conditioning on the first utterance alone, and combining first-utterance and previous-utterance
      prompts yields the best transition smoothness (0.872) without degrading global identity (0.885).
    confidence: high
    relevance: low
  - claim_id: pretraining_a_dialogue_generation_model_on_text_only_dialogue_before
    role: complicates
    claim: Pretraining a dialogue generation model on text-only dialogue before fine-tuning on speech-unit sequences
      improves adherence to narrative content but is not necessary for behavioral adherence.
    source: §7.2, Table 5
    evidence: Removing the text-dialogue pretraining stage drops narrative adherence (GPT-4o-rated) from 3.11 to
      2.80, while behavioral adherence scores for filler words, backchannels, and interruptions remain comparable
      (0.10/0.87/0.64 vs. 0.15/0.87/0.58 with pretraining).
    confidence: high
    relevance: low
  - claim_id: cascaded_llm_then_tts_pipelines_for_spoken_dialogue_generation_can
    role: complicates
    claim: Cascaded LLM-then-TTS pipelines for spoken dialogue generation can achieve strong narrative coherence
      and sound quality but struggle to maintain conversational meaningfulness because they lack any mechanism to
      track behavioral context (speaker turn identity, backchannel placement) across the full dialogue.
    source: §7.1, §6.2, Table 3
    evidence: GPT-4o and Llama3-70B cascaded baselines achieve the highest narrative adherence scores (4.58 and
      4.09) but their meaningfulness MOS (3.97 for both) is lower than the proposed model (4.04), attributed by
      the authors to speaker confusion and misplaced backchannels in cascaded outputs.
    confidence: high
    relevance: low
  limitations:
  - All quantitative evaluation (human MOS, behavioral adherence, speaker consistency) is conducted entirely on
    Behavior-SD's own synthetic test split, which is itself generated by the same LLM and TTS pipeline used for
    training data. No evaluation is reported on real, human-recorded spoken dialogue, so it remains untested whether
    behavioral adherence and naturalness gains transfer outside the paper's own synthetic data distribution.
  - The authors note occasional mispronunciation, limited control over complex emotions beyond the five discrete
    categories used for style captioning, and limited non-lexical vocalization beyond laughter. The word error rate
    on the Behavior-SD test split (3.55%, measured via Whisper-Large V3) is higher than the underlying CosyVoice
    TTS system's WER on LibriSpeech (2.89%), attributed to filler-word insertion and proper-name misrecognition
    rather than a fundamental synthesis quality gap. The dataset and model are limited to two-speaker dialogues;
    the authors flag multi-speaker extension as future work. Behavior-SD's narratives derive from SODA, which itself
    derives from a smaller set of social-commonsense scenarios, so diversity of conversational topics is bounded
    by that source. As with any LLM/TTS-synthesized dataset, the authors flag inherited biases from training data
    and the risk of misuse for voice impersonation or deepfake audio.
  caveats: []
