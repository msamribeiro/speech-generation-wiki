    to other languages with different prosodic hierarchies (e.g., stress-timed languages with ToBI conventions)
    is not tested. The annotation model depends on accurate phoneme alignments from a forced aligner; errors in
    alignment propagate directly into label prediction. Finally, CSJ is a monologue corpus of academic lectures;
    generalization to conversational or spontaneous speech styles with different prosodic distributions is an open
    question.
