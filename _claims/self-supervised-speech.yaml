  - The conditioning mechanism requires time-aligned semantic tokens, restricting drop-in use to AudioLM-family
    pipelines with compatible semantic tokenisers. Extension to cross-attention conditioning or unconditional generation
    is left as future work. The 350M acoustic model trained on LibriLight is English-only; no multilingual evaluation
    is presented. The dialogue synthesis component depends on a proprietary 100k-hour dialogue corpus, limiting
    reproducibility of that subsystem. The ablation on decoding iterations is limited to speech; the authors hypothesise
    that multiple fine-level iterations may matter for non-speech audio, but this is not tested.
