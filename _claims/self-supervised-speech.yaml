  - claim_id: variance_based_feature_discovery_in_prompt_based_tts_is_unreliable
    role: complicates
    claim: Variance-based feature discovery in prompt-based TTS is unreliable when the model's output distribution
      is highly constrained by existing conditioning labels.
    source: §4.4, Figure 6
    evidence: T3-emotion, already trained with explicit emotion and intensity labels, generated highly consistent
      F0 contours under neutral-emotion prompts (Figure 6), leaving insufficient variance for meaningful feature
      discovery in the fixed-input analysis set.
    confidence: high
    relevance: medium
  - claim_id: embedding_based_clustering_of_tts_output_variance_can_surface_acoustic
    role: complicates
    claim: Embedding-based clustering of TTS output variance can surface acoustic artefacts of the training corpus
      (such as recording-condition variation) rather than prosodic features of interest.
    source: §4.4, Figure 8
    evidence: For T3-emotion with a diverse analysis set, the principal component correlated strongly with GeMaps-v01b
      loudness features attributable to microphone distance differences in the Talromur-3 corpus, not to prosody.
    confidence: high
    relevance: medium
  - claim_id: self_supervised_speech_representations_suitable_for_prosody_analysis_are_inherently
    role: complicates
    claim: Self-supervised speech representations suitable for prosody analysis are inherently entangled with speaker
      identity and linguistic content, requiring fixed-input generation sets to isolate prosodic variation.
    source: §3.2, Figure 1
    evidence: Wav2Vec2 summary embeddings cluster by target text and speaker identity regardless of which network
      layer is used (Figure 1), motivating the fixed-input analysis design where text, speaker, and prompt are held
      constant.
    confidence: high
    relevance: high
  limitations:
  - No subjective listening tests are reported. All quality and controllability assessments use automatic metrics
    (ASR-based WER, speaker embedding cosine similarity, diversity score). Whether the discovered features correspond
    to perceptually meaningful and user-controllable dimensions is not established.
  - The method is evaluated on a single Icelandic speaker (Ingrid) for the fine-tuning stages, with no cross-speaker
    or cross-language generalisation experiments. The paper does not address why T3-emotion fails and T3 succeeds
    beyond noting the former's consistent output distribution; whether adding a more diverse analysis set would
    help, or whether an alternative embedding choice (not Wav2Vec2) would be less sensitive to recording conditions,
    remains open. The use of Icelandic as the sole test language, while noted as language-agnostic in principle,
    is unverified on any other language.
  caveats: []
- id: '2507.04349'
  entry_date: '2026-07-29'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - flow-matching
  relevance: medium
  evidence_role:
  - architecture_variant
  - control_evidence
  current_role: active_evidence
  method_family:
  - flow_matching_with_ssl_conditioning
  claims:
  - claim_id: frozen_backbone_adapter_training_can_add_fine_grained_time_varying
    role: supports
    claim: Frozen-backbone adapter training can add fine-grained, time-varying conditioning to pretrained flow-matching
      TTS with substantially less data than full fine-tuning.
    source: §1, §4.4, Table 5
    evidence: ControlNet blocks trained on approximately 400 hours of public emotion data achieve higher Emo-SIM
      and Aro-Val SIM than EmoCtrl-TTS, which requires 87k hours of training including 27k hours of in-house emotion
      data, while preserving the backbone's zero-shot voice cloning capability.
    confidence: high
    relevance: medium
  - claim_id: stronger_emotion_conditioning_in_flow_matching_tts_introduces_a_trade
    role: complicates
    claim: Stronger emotion conditioning in flow-matching TTS introduces a trade-off with text intelligibility.
    source: §4.3.4, Table 4
    evidence: Increasing control scale lambda from 0 to 1 consistently improves AutoPCP, Emo-SIM, and Aro-Val SIM
      but raises WER from 2.9% to 9.58% on the EMO-Change benchmark, showing that stronger emotion modulation introduces
      acoustic variations that degrade phoneme-level precision.
    confidence: high
    relevance: medium
  - claim_id: transformer_blocks_in_dit_based_tts_models_contribute_unequally_to
    role: supports
    claim: Transformer blocks in DiT-based TTS models contribute unequally to speaker identity and text intelligibility,
      and block selection is important for conditional control.
    source: §4.3.1, Figure 2, Table 3
    evidence: Layer-wise skip analysis on F5-TTS shows that removing specific blocks dramatically increases WER
      and reduces speaker similarity; excluding those critical blocks from ControlNet connections yields WER 0%
      and SIM-o 0.684 versus 8.9% WER and 0.630 SIM-o when all blocks are connected.
    confidence: high
    relevance: medium
  - claim_id: emotion_in_a_flow_matching_trajectory_is_concentrated_at_early
    role: supports
    claim: Emotion in a flow-matching trajectory is concentrated at early denoising steps, and restricting conditioning
      to this interval improves both efficiency and intelligibility.
    source: §4.3.2, Table 1, Table 8
    evidence: Training with flow step interval [0, 0.1] achieves Emo-SIM 0.565 and Aro-Val SIM 0.876 with 1.9% WER,
      whereas training on the full [0, 1] interval degrades to Emo-SIM 0.389 and Aro-Val SIM 0.674 with 0% WER;
      applying ControlNet only in early steps reduces per-sample inference time from 5.4s to 4.2s.
    confidence: high
    relevance: medium
  - claim_id: frame_level_emotion_features_from_self_supervised_ser_models_require
    role: complicates
    claim: Frame-level emotion features from self-supervised SER models require temporal smoothing to serve as effective
      conditioning signals for TTS.
    source: §4.3.3, Table 2
    evidence: Using emotion window size of 1 (no smoothing) produces Emo-SIM 0.500 and WER 4.7%; a window size of
      30 achieves Emo-SIM 0.565 and WER 1.9%, demonstrating that token-level SER features without pooling lose emotional
      coherence.
    confidence: high
    relevance: high
  limitations:
  - The underlying SER model cannot reliably recognize non-verbal vocalizations (laughing, crying) since these are
    not well-captured by the arousal-valence-dominance regression framework trained on utterance-level labels. This
    restricts the expressiveness of the emotion conditioning relative to systems with dedicated non-verbal encoders
    (e.g., EmoCtrl-TTS with its NV encoder).
  - Most baseline comparisons use values reported in a prior paper (EmoCtrl-TTS) rather than independently reproduced,
    limiting the reliability of direct numerical comparisons for closed-source models. On the cross-lingual JVNV
    S2ST benchmark, TTS-CtrlNet's speaker similarity (0.464) remains behind several baselines trained on much larger
    data. The method inherits any failure modes of the backbone F5-TTS, including artifacts during high-pitch synthesis
    and language bias toward English and Chinese.
  caveats: []
- id: '2507.06116'
  entry_date: '2026-07-29'
  year: 2025
  venue: arXiv
  task:
  - evaluation
  architecture: []
  relevance: medium
  evidence_role:
  - architecture_variant
  - evaluation_caution
  current_role: minor
  method_family: []
  claims:
  - claim_id: multi_task_learning_with_an_auxiliary_synthesis_model_classification_objective
    role: supports
    claim: Multi-task learning with an auxiliary synthesis-model classification objective can improve absolute MOS
      prediction accuracy at the system level by encouraging the model to learn discriminative acoustic quality
      features.
    source: §III.C, Table 2
    evidence: The MoE system with auxiliary classification achieves system-level MSE 0.056 (rank 1 of seven teams),
      a 21% reduction in MSE over the strongest single-objective baseline (MSE 0.071).
    confidence: high
    relevance: medium
  - claim_id: improvements_in_system_level_mos_prediction_accuracy_do_not_reliably
    role: complicates
    claim: Improvements in system-level MOS prediction accuracy do not reliably transfer to utterance-level prediction
      performance.
    source: §IV, Table 1
    evidence: Despite ranking first on system-level MSE, the proposed model places 3rd-6th across utterance-level
      metrics; the authors identify disjoint train/test annotator sets as a primary cause, not merely architectural
      limitations.
    confidence: high
    relevance: medium
  - claim_id: the_performance_gap_between_system_level_and_utterance_level_mos
    role: refines
    claim: The performance gap between system-level and utterance-level MOS prediction reflects fundamentally different
      task requirements, not a data-scaling problem alone.
    source: §IV
    evidence: Doubling training data from 400 to 800 samples and introducing MoE architecture yields only marginal
      utterance-level gains, while system-level gains are large; the paper attributes residual difficulty to micro-feature
      variability and rater-specific bias.
    confidence: high
    relevance: medium
  - claim_id: high_correlation_between_predicted_and_actual_mos_at_the_system
    role: complicates
    claim: High correlation between predicted and actual MOS at the system level does not imply high correlation
      at the utterance level for the same model.
    source: §IV, Tables 1-2
    evidence: The proposed model achieves LCC 0.978 on system-level evaluation but only LCC 0.811 on utterance-level
      evaluation, with similarly large gaps in SRCC and KTAU, confirming that aggregation masks prediction errors
      at finer granularity.
    confidence: high
    relevance: medium
  limitations:
  - The training and test annotator pools are completely disjoint (raters 0-9 for training, raters 10-19 for testing).
    This means utterance-level results measure how well the model generalises to unseen rater subjectivity, an inherently
    harder problem than standard train/test splits assume. Utterance-level claims should be interpreted with this
    constraint in mind.
  - 'The dataset is small (800 samples across 12 systems, derived from 30 text entries), making it difficult to
    assess whether findings generalise to larger and more diverse evaluation sets. System and sample diversity are
    limited: all audio is generated from the same text prompts, which may suppress naturalness variation that appears
    in open-domain evaluation.'
  - The challenge setup is unnamed in the paper, making it impossible to compare directly against published baseline
    systems outside the competition tables. The paper proposes rater adaptation and fine-grained acoustic features
    as future directions but does not experiment with them.
  caveats: []
- id: '2412.18603'
  entry_date: '2026-07-29'
  year: 2025
  venue: ICML
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - architecture_variant
  - control_evidence
  - evaluation_caution
  current_role: influential
  method_family:
  - autoregressive_ssl_conditioned_models
  claims:
  - claim_id: linear_time_state_space_sequence_models_enable_stable_long_form
    role: supports
    claim: Linear-time state-space sequence models enable stable long-form speech generation that Transformer spoken
      LMs cannot sustain at comparable scale.
    source: §7.1, §7.2, Tables 3-4
    evidence: SpeechSSM-2B maintains N-MOS of 4.12-4.16 across all time strata up to 4+ minutes and stable semantic
      coherence in 16-minute generation, while all Transformer-based baselines and windowed extensions of prior
      spoken LMs degrade rapidly beyond their training lengths.
    confidence: high
    relevance: medium
  - claim_id: separating_speaker_conditioning_into_a_dedicated_acoustic_synthesis_stage_preserves
    role: supports
    claim: Separating speaker conditioning into a dedicated acoustic synthesis stage preserves voice identity more
      effectively in long-form speech generation than encoding speaker information in semantic tokens.
    source: §6.1, §7.1, Tables 2-3
    evidence: SpeechSSM achieves SpkrSim of 0.85 in long-form evaluation (vs. 0.33-0.41 for GSLM and TWIST), attributed
      to SoundStorm's speaker-prompted acoustic stage handling identity independently of the semantic LM.
    confidence: high
    relevance: medium
  - claim_id: standard_evaluation_metrics_for_spoken_language_models_are_unreliable_or
    role: complicates
    claim: Standard evaluation metrics for spoken language models are unreliable or saturating for modern systems,
      particularly in long-form settings.
    source: §6.1, §4
    evidence: sWUGGY scores negatively correlate with generation quality at large token vocabularies (32k vs. hundreds);
      short-form holistic MOS approaches ground truth at 7 seconds while qualitative failures persist; transcript
      perplexity favors repetitive outputs at default temperatures. Reference-based embedding metrics and LLM-as-judge
      side-by-sides prove more discriminative.
    confidence: high
    relevance: low
  - claim_id: long_form_speech_generation_remains_far_below_human_quality_even
    role: complicates
    claim: Long-form speech generation remains far below human quality even for state-of-the-art spoken language
      models.
    source: §7.1, Table 3
    evidence: No model achieves any wins against LibriSpeech-Long ground truth in 4-minute side-by-side comparisons
      judged by an LLM on fluency, coherence, logicality, and interestingness, demonstrating a large remaining quality
      gap despite strong short-form performance.
    confidence: high
    relevance: medium
  limitations:
  - Model weights are not released and inference requires TPU infrastructure; independent reproducibility of the
    long-form results is not currently possible.
  - 'Comparison fairness across baselines is imperfect: systems differ in training data scale, semantic tokenizer
    choice, token vocabulary size, and whether text was seen during training. The authors partially address this
    with the matched SpeechTransformer-2B baseline, but cannot control all confounds across the full set of comparisons.'
  - The semantic coherence advantage may partly reflect USM-v2's speaker invariance (reducing token entropy from
    vocal variation) rather than the SSM architecture per se. SpeechSSM-X, the extemporaneous variant trained on
    216k hours of monologue speech, is evaluated qualitatively only without quantitative benchmarks. LibriSpeech-Long
    covers read audiobook speech; generalization to spontaneous, multi-speaker, or conversational long-form speech
    is not evaluated.
  caveats: []
