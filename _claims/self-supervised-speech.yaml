  - claim_id: cross_system_comparisons_of_speech_language_models_reported_in_the
    role: complicates
    claim: Cross-system comparisons of speech language models reported in the literature are frequently not run
      under matched conditions, limiting how much can be concluded from any single performance table.
    source: §4.3, Table 5
    evidence: In the multi-task comparison (Table 5), competitor numbers for Moshi, VITA, GLM-4-Voice, and others
      are taken directly from their own published reports rather than reproduced by the authors, and the paper explicitly
      flags this with footnote markers.
    confidence: high
    relevance: medium
