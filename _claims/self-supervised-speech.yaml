  limitations:
  - The UTMOS model is trained and evaluated exclusively on synthetic speech data from Blizzard and Voice Conversion
    Challenges; its generalization to modern neural TTS systems (LLM-based, flow-matching) with different quality
    failure modes is not characterized.
  - The OOD evaluation uses Chinese synthetic speech while the strong learner SSL backbone (wav2vec 2.0) was pretrained
    primarily on English. Generalization to other languages depends on the SSL model's cross-lingual transfer capability,
    which is not analyzed here. The external data collection for OOD (32 Chinese listeners, ~2 ratings per utterance)
    is low-coverage and introduces annotation noise. The paper proposes larger-scale general-purpose data collection
    as future work but does not address it here. Additionally, data augmentation (pitch-shifting, time-stretching)
    is assumed not to change perceptual quality, but this assumption is not verified through listening tests.
