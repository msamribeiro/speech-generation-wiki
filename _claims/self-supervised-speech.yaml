  method_family:
  - transformer_ssl_encoders_and_adapters
  claims:
  - claim_id: iterative_natural_language_feedback_can_progressively_refine_the_speaking_style
    role: supports
    claim: Iterative natural language feedback can progressively refine the speaking style of synthesized speech
      without accumulating naturalness degradation.
    source: §4.2, §4.4, Figure 4, Figure 6
    evidence: Over three interaction sessions, Iterative (ours) significantly outperformed the Identical baseline
      on a 5-point style refinement MOS, and naturalness MOS showed no significant difference between Iterative
      and the oracle condition across all style groups.
    confidence: high
    relevance: medium
  - claim_id: global_speech_embedding_based_conditioning_cannot_accurately_reflect_fine_grained
    role: complicates
    claim: Global speech embedding-based conditioning cannot accurately reflect fine-grained positional or linguistic
      instructions in expressive TTS.
    source: §5.1, §5.2, Table 4
    evidence: Low-scoring examples in the test set contained directions targeting specific word positions ("at the
      beginning", "at the end", "for the part of...") or linguistic modifications ("hold your breath", "place just
      a slight pause between words"), which the speech embedding manipulation approach could not handle.
    confidence: high
    relevance: medium
  - claim_id: semantic_similarity_of_style_direction_text_not_exact_wording_governs
    role: supports
    claim: Semantic similarity of style direction text, not exact wording, governs how well listeners perceive style
      refinement as aligned with the instruction.
    source: §4.3, Figure 5
    evidence: In the style refinement accuracy evaluation, directions semantically similar to the one used for refinement
      (Random Similar) yielded scores comparable to the Matched condition, while semantically dissimilar directions
      scored significantly lower across all style groups.
    confidence: high
    relevance: medium
  - claim_id: holistic_subjective_evaluation_scales_may_not_adequately_capture_fine_grained
    role: complicates
    claim: Holistic subjective evaluation scales may not adequately capture fine-grained stylistic alignment in
      iterative TTS refinement tasks.
    source: §4.2, §5.3
    evidence: Even the Actor-Guided oracle condition scored around 3 out of 5 on the iterative style refinement
      MOS, which the authors attribute to the evaluation task not fully discriminating subtle style differences;
      similar evaluation difficulties have been noted in text-to-image/video generation research.
    confidence: high
    relevance: low
  limitations:
  - All training and evaluation data is proprietary in-house Japanese speech from two voice actors. No public dataset
    is used, and no results are reported outside this setup. Reproducibility and generalization are untested.
  - 'The style refiner is speaker-dependent; the authors plan to extend to speaker-independent operation as future
    work. The current model refines only paralinguistic information (speaking style via global embeddings), not
    linguistic content, so instructions involving pauses, stress, or pitch accent placement cannot be followed.
    The directions cover only two of four practical categories from actual recording sessions (paralinguistic and
    text-expressible linguistic instructions), omitting demonstrative and gestural instructions entirely. The evaluation
    task design is also noted as an open problem: the relatively low absolute scores even under oracle conditions
    suggest that existing MOS paradigms do not cleanly measure this type of fine-grained iterative alignment, and
    more sensitive evaluation methods are needed.'
  caveats: []
- id: '2507.02176'
  entry_date: '2026-07-29'
  year: 2025
  venue: arXiv
  task:
  - evaluation
  architecture: []
  relevance: medium
  evidence_role:
  - architecture_variant
  - control_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: asv_embeddings_encode_static_anatomical_speech_features_but_systematically_fail
    role: supports
    claim: ASV embeddings encode static anatomical speech features but systematically fail to represent dynamic
      behavioral identity markers such as rhythm and timing patterns.
    source: §3.2, Figure 1
    evidence: Lasso regression predicting handcrafted features from ASV embeddings across LibriSpeech, ARCTIC, and
      L2-ARCTIC shows high r² for mean pitch, HNR, shimmer, and α-ratio, but near-zero r² for speech rate, voiced
      and unvoiced segment lengths, and pitch standard deviation across all seven tested ASV models.
    confidence: high
    relevance: medium
  - claim_id: eer_based_speaker_similarity_measurements_in_speech_synthesis_evaluation_are
    role: complicates
    claim: EER-based speaker similarity measurements in speech synthesis evaluation are susceptible to confounding
      factors unrelated to voice identity, which can invalidate comparisons between synthesis systems.
    source: §3.3, Table 2
    evidence: Duration-sorting same-speaker utterances depresses EER from 50% to 30–39% across all ASV models; SNR
      20 dB noise reduces EER to 15–38%; equalization shifts cause near-total failure in GE2E. Re-equalization and
      duration matching restore correct EER.
    confidence: high
    relevance: low
  - claim_id: characterizing_speaker_rhythm_for_identity_assessment_requires_modeling_phoneme_duration
    role: supports
    claim: Characterizing speaker rhythm for identity assessment requires modeling phoneme-duration distributions
      rather than aggregate measures such as mean speech rate.
    source: §3.4, Figure 2, Table 3
    evidence: Many L2-ARCTIC speakers share similar syllable rates but show substantially different voiced segment
      duration patterns; U3D Wasserstein distances clearly separate same-speaker pairs (avg. 2.15) from nearest-by-speech-rate
      pairs (18.40) and random pairs (21.53).
    confidence: high
    relevance: medium
  - claim_id: self_supervised_speech_unit_representations_serve_as_language_agnostic_substitutes
    role: refines
    claim: Self-supervised speech unit representations serve as language-agnostic substitutes for phoneme labels
      in rhythm analysis, avoiding the need for forced alignment.
    source: §3.4, Table 3
    evidence: 'U3D using HuBERT-derived unsupervised clusters achieves Wasserstein distance separation between speaker
      conditions nearly identical to forced-alignment-based phoneme rhythm analysis (same: 2.15 vs. 2.48; nearest:
      18.40 vs. 18.37; random: 21.53 vs. 24.43).'
    confidence: high
    relevance: high
  limitations:
  - U3D is validated as a discriminative metric (separating speaker pairs) but has not been validated against human
    perceptual judgments of rhythm similarity. Whether Wasserstein distances correlate with listeners' perception
    of rhythmic difference between voices remains untested.
  - The paper is limited to neutral speech, with the authors explicitly noting extension to expressive or conversational
    speech as future work. Experiments use clean studio-quality recordings (ARCTIC, L2-ARCTIC), so the behavior
    of confounding factors in in-the-wild multi-condition data remains untested. Recommended mitigation strategies
    (duration matching, re-equalization) assume access to the same text prompts used in genuine recordings, which
    may not be feasible in all evaluation settings. U3D's language-agnosticism is argued theoretically but not empirically
    tested on non-English languages.
  caveats: []
- id: '2507.03887'
  entry_date: '2026-07-29'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - flow-matching
  relevance: medium
  evidence_role:
  - architecture_variant
  current_role: active_evidence
  method_family:
  - flow_matching_with_ssl_conditioning
  claims:
  - claim_id: joint_training_of_a_tts_generator_and_a_speech_discriminator
    role: supports
    claim: Joint training of a TTS generator and a speech discriminator with aligned optimization objectives improves
      out-of-domain generalization of model-specific attribution compared to training the discriminator independently.
    source: §5.4, Table 3
    evidence: Jointly training F5-TTS and a wav2vec 2.0 + LCNN discriminator improves out-of-domain AUC from 0.8823
      to 0.9421 and EER from 18.99% to 11.50%, while independent discriminator training on the same data shows substantially
      weaker generalization.
    confidence: high
    relevance: medium
  - claim_id: watermark_free_tts_traceability_through_joint_training_can_preserve_or
    role: supports
    claim: Watermark-free TTS traceability through joint training can preserve or slightly improve synthesis quality
      relative to the base model.
    source: §5.6, Table 5
    evidence: The jointly trained F5-TTS achieves WER 2.033% (vs. 2.202% baseline), UTMOS 3.958 (vs. 3.926), and
      speaker similarity 0.661 (vs. 0.659) on LibriSpeech-PC test-clean, indicating no quality penalty from the
      added traceability objective.
    confidence: high
    relevance: medium
  - claim_id: tts_attribution_discriminators_based_on_audio_feature_patterns_are_vulnerable
    role: complicates
    claim: TTS attribution discriminators based on audio feature patterns are vulnerable to additive noise and pitch
      manipulation, but robust to common audio processing operations.
    source: §5.5, Table 4
    evidence: Out-of-domain AUC drops by 0.1233 under additive noise (MUSAN) and 0.0901 under pitch shifting, while
      remaining stable (within 0.025 AUC) under resampling, time-stretching, reverb, volume scaling, and MP3 compression.
    confidence: high
    relevance: medium
  - claim_id: differentiability_of_the_full_synthesis_pipeline_from_text_input_to
    role: complicates
    claim: Differentiability of the full synthesis pipeline from text input to output waveform is a necessary precondition
      for watermark-free traceability via joint generator-discriminator training, excluding discrete token-based
      TTS architectures.
    source: §6
    evidence: The paper explicitly notes that VALL-E-type models using non-differentiable discrete token generation
      are incompatible with this framework because the discriminator's loss cannot backpropagate through the discrete
      generation step.
    confidence: high
    relevance: medium
  limitations:
  - The method is evaluated on a single TTS backbone (F5-TTS) with a single discriminator architecture, and the
    out-of-domain test uses only three other TTS systems. Generalization of the approach to a broader range of TTS
    models and adversarial conditions is untested.
  - The framework is architecturally restricted to TTS models that support end-to-end differentiation from text
    input to waveform, ruling out discrete token-based systems (VALL-E and its descendants). Additive noise and
    pitch shifting substantially degrade discriminator performance, suggesting that an adversary with access to
    these transformations could evade attribution. The paper does not evaluate whether the discriminator's traceability
    signal remains effective after the fine-tuned model is further fine-tuned by a third party or after the vocoder
    is swapped at inference time (though vocoder-robustness is claimed by design). Code release is conditional on
    paper acceptance and not yet available.
  caveats: []
