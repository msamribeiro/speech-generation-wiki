  limitations:
  - 'The paper provides no quantitative evaluation: no MOS, WER, or speaker similarity scores are reported, and
    no comparison to cascade baselines is made. All results are case studies. Claims about spoken dialogue quality
    and instruction-following capability cannot be independently verified from the paper alone.'
  - 'Additional limitations acknowledged by the authors:'
  - '- The system does not model paralinguistic information; it cannot generate responses with different emotional
    tones or speaking styles. - The chain-of-modality design requires generating a full text response before producing
    speech, introducing latency incompatible with real-time interaction. - Context length limitations (2048 tokens)
    prevent true multi-turn dialogue; only single-turn exchanges are demonstrated. - HuBERT units discard fine-grained
    acoustic detail (prosody, speaker identity beyond the vocoder''s speaker embedding), limiting expressiveness
    relative to audio codec approaches. - The unit vocoder is trained separately and is not end-to-end jointly optimised
