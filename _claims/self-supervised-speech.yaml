    source: §2.1, §4.2, Table 2
    evidence: emotion2vec frame-level features aligned via MFA and pooled to word boundaries form the annotation
      backbone; removing word-level data tuning causes the most severe degradation (FEDD DTW 49.62 to 133.97).
    confidence: high
    relevance: high
  - claim_id: frame_averaged_emotion_similarity_metrics_are_insufficient_for_evaluating_intra
    role: complicates
    claim: Frame-averaged emotion similarity metrics are insufficient for evaluating intra-utterance emotional dynamics
      in TTS output.
    source: §3.4
    evidence: The authors note that Emo SIM averages frame-level emotion vectors, potentially obscuring dynamic
      information, and introduce DTW as a complementary metric that more sensitively distinguishes the models' ability
      to track emotional transitions.
    confidence: high
    relevance: medium
  - claim_id: explicit_emotion_classification_as_an_auxiliary_training_objective_improves_fine
    role: supports
    claim: Explicit emotion classification as an auxiliary training objective improves fine-grained emotion control
      in multi-task TTS training.
    source: §4.2, Table 2
    evidence: Removing the emotion classification loss increases FEDD DTW from 49.62 to 73.96, a degradation comparable
      to removing the FiLM layer entirely.
    confidence: high
    relevance: medium
  limitations:
  - The FEDD dataset is small (1,000 utterances, 5 speakers) and constructed partly via concatenation of emotionally
    distinct segments, which may not capture naturally occurring emotional transitions. The method is not evaluated
    for spontaneous or conversational speech, where emotion boundaries are less well-defined. The backbone (CosyVoice2)
    is frozen, so the approach inherits any limitations of that system in speaker diversity or prosodic range. Model
    size and speaker generalization are not reported.
  caveats: []
- id: '2509.17006'
  entry_date: '2026-07-29'
  year: 2025
  venue: arXiv
  task:
  - codec
  architecture:
  - GAN
  relevance: medium
  evidence_role:
  - architecture_variant
  current_role: active_evidence
  method_family:
  - gan_decoders_for_ssl_units
  claims:
  - claim_id: explicit_semantic_acoustic_disentanglement_in_neural_codecs_improves_reconstruction_quality
    role: supports
    claim: Explicit semantic-acoustic disentanglement in neural codecs improves reconstruction quality at comparable
      bitrates relative to conventional residual quantization approaches.
    source: §3.2, Table 1
    evidence: MBCodec (16 codebooks, 50Hz, 8.8kbps) achieves PESQ 3.83 and MUSHRA 85.9, versus EnCodec at the same
      bitrate scoring PESQ 2.78 and MUSHRA 85.3; at 4.4kbps, MBCodec (16 codebooks, 25Hz) scores PESQ 3.64 versus
      SpeechTokenizer at PESQ 1.26 and MUSHRA 79.0.
    confidence: high
    relevance: medium
  - claim_id: pqmf_based_frequency_subband_supervision_substantially_improves_spectral_reconstruction_fidelity
    role: supports
    claim: PQMF-based frequency subband supervision substantially improves spectral reconstruction fidelity in multi-codebook
      codec training.
    source: §3.4, Table 3
    evidence: Ablation shows removing PQMF supervision degrades PESQ from 3.83 to 2.34 (a 39% drop) and increases
      Mel-spectrogram distance from 2.34 to 3.45 in the best MBCodec configuration.
    confidence: high
    relevance: low
  - claim_id: non_uniform_codebook_dropout_distributions_that_concentrate_sampling_on_early
    role: supports
    claim: Non-uniform codebook dropout distributions that concentrate sampling on early RVQ layers outperform uniform
      dropout, better matching the hierarchical information density of residual quantization.
    source: §2.2, §3.4, Table 2, Table 3
    evidence: Half-Gaussian adaptive dropout achieves PESQ 3.28 versus exponential decay at 3.02 and chi-squared
      at 2.75; removing adaptive dropout entirely drops SI-SDR from 7.94 to 7.32 and increases STFT distance from
      0.08 to 0.22.
    confidence: high
    relevance: medium
  - claim_id: ultra_low_bitrate_neural_audio_compression_imposes_a_persistent_quality
    role: complicates
    claim: Ultra-low bitrate neural audio compression imposes a persistent quality gap relative to ground truth,
      even with strong disentanglement strategies.
    source: §3.2, Table 1
    evidence: MBCodec at 2.2kbps achieves MUSHRA 82.8 versus ground truth MUSHRA 90.7 (a gap of 7.9 points) and
      PESQ 2.98 versus 4.64, despite the 170x compression ratio and explicit semantic-acoustic disentanglement.
    confidence: high
    relevance: medium
  limitations:
  - The paper does not evaluate MBCodec as a token representation for downstream TTS or speech LM inference, which
    is presented as a primary motivation. The codec is trained and evaluated on speech-dominant data; generalisation
    to music or general audio is not assessed. No parameter count is reported, making direct efficiency comparison
    with other codecs difficult. The comparison set is limited to DAC, EnCodec, and SpeechTokenizer; more recent
    codecs such as Mimi or BiCodec are not included. As a preprint, no independent reproduction or external listening
    evaluation is available.
  caveats: []
- id: '2509.17143'
  entry_date: '2026-07-29'
  year: 2025
  venue: arXiv
  task:
  - VC
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - architecture_variant
  - control_evidence
  current_role: active_evidence
  method_family:
  - autoregressive_ssl_conditioned_models
  claims:
  - claim_id: in_zero_shot_voice_conversion_temporally_coarser_syllabic_representations_reduce
    role: supports
    claim: In zero-shot voice conversion, temporally coarser syllabic representations reduce pitch leakage from
      linguistic features more effectively than standard frame-aligned SSL features, enabling cleaner prosody control
      at the cost of intelligibility.
    source: §2.1, §4, Table 2
    evidence: MaskVCT-Spk using SylBoost syllabic tokens achieves the lowest FPC (0.167) among all tested systems,
      indicating near-complete pitch independence from the source, while MaskVCT-All with continuous features retains
      more pitch correlation (FPC 0.417).
    confidence: high
    relevance: high
  - claim_id: multiple_classifier_free_guidance_weights_applied_to_distinct_conditioning_factors
    role: supports
    claim: Multiple classifier-free guidance weights applied to distinct conditioning factors in a single masked
      generative model enable user-configurable inference-time trade-offs between intelligibility, pitch fidelity,
      and speaker similarity.
    source: §2.5, §3.4, Table 2
    evidence: MaskVCT defines triple CFG weights (w_all, w_spk, w_ling) over speaker, pitch, and linguistic conditions
      within one trained model; sweeping these weights continuously interpolates between MaskVCT-All (WER 4.68%,
      S-SIM 0.865) and MaskVCT-Spk (WER 6.47%, S-SIM 0.895).
    confidence: high
    relevance: low
  - claim_id: syllabic_speech_representations_that_suppress_pitch_leakage_in_voice_conversion
    role: complicates
    claim: Syllabic speech representations that suppress pitch leakage in voice conversion also degrade content
      intelligibility through syllable misreadings caused by coarse temporal quantisation.
    source: §4, §5, Table 2
    evidence: MaskVCT-Spk achieves the highest speaker similarity (S-SIM 0.895) but the highest WER (6.47%) among
      systems tested, substantially above FACodec (3.55%) and FreeVC (3.96%); the conclusion section attributes
      misreadings to K-means syllable mapping errors in SylBoost.
    confidence: high
    relevance: low
  - claim_id: masked_non_autoregressive_codec_models_can_match_or_exceed_autoregressive
    role: supports
    claim: Masked non-autoregressive codec models can match or exceed autoregressive and diffusion-based baselines
      on speaker similarity and quality in zero-shot VC while operating with fewer discrete tokens per utterance.
    source: §3.4, §4, Table 2
    evidence: MaskVCT-Spk (2048 tokens) achieves higher S-SIM (0.895) and SS-MOS (3.69) than MaskGCT-S2A (8192 tokens,
      S-SIM 0.863, SS-MOS 3.02) and competitive UTMOS (3.17 vs. 3.24).
    confidence: high
    relevance: low
  limitations:
  - Syllabic tokens introduce misreadings that WER alone cannot fully diagnose; the authors acknowledge the K-means
    quantiser cannot recover from incorrect syllable boundary assignments, and propose future work to address this
    with a trainable VQ module.
  - The model is English-only. Accent conversion experiments are limited to L2-ARCTIC and test only two conversion
    directions; how well the syllabic pitch-stripping generalises to tonal languages (where pitch is phonemic) is
    unexplored. The 511-pair test set is relatively small for statistical confidence, especially given the reported
    confidence intervals overlap for several key comparisons. No code or trained checkpoint is publicly released,
    limiting reproducibility.
  caveats: []
- id: '2509.19928'
  entry_date: '2026-07-29'
  year: 2025
  venue: arXiv
  task:
  - TTS
  - evaluation
  architecture: []
  relevance: medium
  evidence_role:
  - architecture_variant
  - control_evidence
  - infrastructure
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: acoustic_proxy_metrics_for_prosodic_variation_correlate_weakly_with_human
    role: supports
    claim: Acoustic proxy metrics for prosodic variation correlate weakly with human perception, while distance
      measures computed over discretized self-supervised speech tokens correlate substantially better.
    source: §4.1, Table 1
    evidence: Averaged Pearson correlation with human PMOS ratings is r̄ = 0.30 for log F0 RMSE and r̄ = 0.66 for
      MCD, versus r̄ = 0.77 for the proposed token-edit-distance metric, aggregated via Fisher's Z transformation
      across 1000 samples and 2000 ratings.
    confidence: high
    relevance: high
  - claim_id: autoregressive_generation_provides_greater_output_diversity_in_prosody_than_non
    role: supports
    claim: Autoregressive generation provides greater output diversity in prosody than non-autoregressive flow-matching
      models with implicit text-speech alignment, but this advantage does not extend to non-autoregressive masked
      generative modeling.
    source: §4.4-4.5, Table 2
    evidence: On the DS-WED benchmark across LibriSpeech test-clean and Seed-TTS test-en, three AR systems (XTTS-v2,
      CosyVoice, CosyVoice 2) outperform three flow-matching NAR systems (E2 TTS, F5-TTS, ZipVoice), while the masked
      generative modeling system (MaskGCT) surpasses all AR systems on LibriSpeech and remains competitive on Seed-TTS
      despite training on the same Emilia corpus as the flow-matching systems.
    confidence: high
    relevance: medium
  - claim_id: explicit_duration_control_during_inference_is_a_significant_but_not
    role: complicates
    claim: Explicit duration control during inference is a significant, but not sufficient, factor in restoring
      prosodic diversity to non-autoregressive TTS systems with implicit alignment.
    source: §4.5, Table 3
    evidence: Applying duration perturbation (0.8-1.2x) to two flow-matching/MGM NAR systems increases DS-WED diversity
      by 13.8-28.5%, but the perturbed flow-matching system (F5-TTS) still lags behind AR and MGM systems evaluated
      without perturbation, suggesting the shortfall is architectural (implicit alignment) rather than purely a
      missing duration-control step.
    confidence: high
    relevance: medium
  - claim_id: preference_optimization_that_targets_one_quality_dimension_intelligibility_can_measurably
    role: complicates
    claim: Preference optimization that targets one quality dimension (intelligibility) can measurably suppress
      output diversity along an unrelated axis (prosody) as a side effect.
    source: §4.5, Table 4
    evidence: Applying DPO for intelligibility to CosyVoice 2 and MaskGCT reduces DS-WED prosody-diversity scores
      by 18.8% and 2.9-3.2% respectively across two test sets, with no diversity-specific reward term in the alignment
      objective.
    confidence: high
    relevance: medium
  - claim_id: a_general_purpose_large_audio_language_model_with_strong_multimodal
    role: contradicts
    claim: A general-purpose large audio language model with strong multimodal reasoning capability can serve as
      a reliable automatic judge of fine-grained prosodic variation.
    source: §4.5, Table 5
    evidence: Gemini 2.5 Pro, prompted to rate relative prosodic difference within groups of five samples, achieves
      only a weak correlation with human PMOS ratings (r̄ = 0.27) and unstable, wide-confidence-interval correlations
      with objective acoustic and token-based metrics.
    confidence: high
    relevance: medium
  limitations:
  - The authors state that DS-WED has only been validated on English speech; cross-lingual applicability is untested.
    The benchmark itself covers only seven open-source systems and two evaluation corpora (LibriSpeech test-clean,
    Seed-TTS test-en), so its paradigm-level conclusions (AR vs. flow-matching vs. MGM) rest on a small number of
    representative systems per category rather than an exhaustive sweep. The DPO and duration-perturbation exploration
    each cover only two systems, limiting how confidently the reported trends generalize across the broader space
    of NAR TTS architectures. The paper also does not report whether code or the ProsodyEval dataset itself will
    be released beyond the audio-sample demo page, which affects reproducibility of the correlation analysis.
  caveats: []
- id: '2509.20485'
  entry_date: '2026-07-29'
  year: 2025
  venue: arXiv
  task:
  - evaluation
  - TTS
  architecture: []
  relevance: medium
  evidence_role:
  - architecture_variant
  - control_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: conditioning_a_discrete_token_likelihood_model_on_the_input_text
    role: supports
    claim: Conditioning a discrete-token likelihood model on the input text produces a substantially more discriminative
      and human-aligned intelligibility signal than unconditional token language modeling.
    source: §V.A, Table 1
    evidence: TTScore-int reaches utterance-level correlation with WER up to 0.78 on VoiceMOS22 (system-level up
      to 0.96), compared to at most 0.44/0.55 for an identically-trained unconditional token-LM (uLM) baseline and
      0.32/0.42 for SpeechLMScore.
    confidence: high
    relevance: medium
  - claim_id: mos_predictors_trained_directly_on_mos_labeled_data_generalize_poorly
    role: supports
    claim: MOS predictors trained directly on MOS-labeled data generalize poorly across benchmarks relative to reference-free
      metrics with a narrower, aspect-specific training objective.
    source: §V.B, Table 2
    evidence: UTMOS, trained on VoiceMOS22 data, achieves high correlation with MOS on VoiceMOS22 but notably lower
      correlation on the out-of-distribution SOMOS dataset, while TTScore-int retains stronger correlation with
      MOS on SOMOS.
    confidence: high
    relevance: medium
  - claim_id: reference_free_text_conditioned_prosody_scoring_can_track_prosodic_appropriateness
    role: supports
    claim: Reference-free, text-conditioned prosody scoring can track prosodic appropriateness where reference-dependent
      F0-based metrics fail, including on benchmarks lacking aligned reference audio.
    source: §VI.C, Tables 3-5
    evidence: TTScore-pro shows positive correlation with MOS on both SOMOS and VoiceMOS22 and correct-sign correlation
      with TTS Arena ELO scores, while F0-RMSE shows near-zero or negative correlation with MOS and an unexpected
      positive (wrong-sign) correlation with ELO.
    confidence: high
    relevance: medium
  - claim_id: objective_prosody_metrics_that_isolate_a_single_acoustic_dimension_pitch
    role: complicates
    claim: Objective prosody metrics that isolate a single acoustic dimension (pitch) correlate only moderately
      with overall perceived naturalness, since naturalness depends on additional prosodic factors beyond F0.
    source: §VI.C, Table 3
    evidence: TTScore-pro's correlations with MOS remain in the 0.2-0.5 range even where it clearly outperforms
      F0-RMSE and F0-correlation baselines, and the paper attributes the residual gap to prosody encompassing rhythm,
      energy, and phrasing beyond the F0-based prosody tokens used here.
    confidence: high
    relevance: medium
  limitations:
  - The method targets only F0-related prosody; rhythm, energy, and phrasing, which the authors acknowledge are
    also core prosodic dimensions, are not modeled or evaluated.
  - The text-to-token generators are trained exclusively on a large-scale, clean, English-only corpus (LibriSpeech-960),
    so the metric's reliability in noisy, spontaneous, or non-English settings is untested. Because the token distributions
    are learned from data, the authors note the approach may inherit whatever biases exist in that training corpus.
    The paper also does not report whether code will be released, and the demo/code availability fields could not
    be confirmed from the paper text.
  caveats: []
- id: '2509.21968'
  entry_date: '2026-07-29'
  year: 2025
  venue: arXiv
  task:
  - codec
  architecture:
  - GAN
  - VAE
  relevance: medium
  evidence_role:
  - architecture_variant
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - gan_decoders_for_ssl_units
  - vae_and_quantized_ssl_representations
  claims:
  - claim_id: a_shared_single_codebook_can_be_structured_with_overlapping_nested
    role: supports
    claim: A shared single codebook can be structured with overlapping, nested domain partitions rather than rigid
      disjoint splits, improving both reconstruction and downstream generation quality relative to a rigid-split
      design.
    source: §4.4, Tables 3–4
    evidence: Ablating codebook design at fixed codebook size and data scale, the nested codebook reduces reconstruction
      WER from 4.21 (rigid-split) to 3.99 and downstream TTS generation WER from 6.26 to 4.99 on LibriSpeech-PC
      test-clean.
    confidence: high
    relevance: medium
  - claim_id: distilling_frame_level_representations_from_multiple_domain_specific_self_supervised
    role: supports
    claim: Distilling frame-level representations from multiple domain-specific self-supervised teacher models into
      one acoustic codec can improve reconstruction and generation quality across all the covered domains simultaneously,
      not just the domain of a single teacher.
    source: §3.3, §4.4, Tables 3–4
    evidence: Adding multi-domain distillation (WavLM for speech, MuQ for vocal/music, BEATs for sound) on top of
      the nested codebook further raises the speech-partition code-usage ratio from 37.1% to 38.2% and improves
      downstream TTS generation WER from 4.99 to 4.51.
    confidence: high
    relevance: high
  - claim_id: unifying_multiple_audio_domains_into_a_single_shared_quantization_codebook
    role: complicates
    claim: Unifying multiple audio domains into a single, shared quantization codebook does not close the gap with
      domain-specific single-layer codecs on every reconstruction metric, even when the unified model uses a larger
      codebook and lower token rate.
    source: §4.2, Table 1
    evidence: On LibriSpeech test-clean, AUV's PESQ-WB (2.40) and SPK-SIM (0.81) trail dedicated speech codecs such
      as DAC (4.01, 0.95) and are roughly on par with, not clearly better than, BigCodec and UniCodec.
    confidence: high
    relevance: medium
  - claim_id: larger_unified_codebooks_intended_to_accommodate_more_audio_domains_can
    role: complicates
    claim: Larger unified codebooks intended to accommodate more audio domains can hurt downstream autoregressive
      generation quality by increasing the modeling burden on the generative model consuming the tokens, even when
      reconstruction quality is unaffected.
    source: §4.3, Table 4
    evidence: Scaling the codebook from 16,384 to 20,480 entries (C0 vs. C2) yields slightly worse downstream generation
      WER (4.51 vs. 4.89) despite improved reconstruction metrics; training an autoregressive model on codes from
      a still-larger 131,072-entry codebook (MagiCodec) reportedly failed outright.
    confidence: high
    relevance: medium
  limitations:
  - The paper reports no total parameter count for the AUV encoder-decoder, limiting direct efficiency comparison
    with baselines whose sizes are known. Downstream generative evaluation is restricted to a single autoregressive
    TTS backbone (EmoVoice) trained on a comparatively small 1K-hour subset of LibriSpeech, so it is unclear whether
    the reconstruction and generation gains hold at larger downstream training scales or with non-autoregressive
    generators. Speaker similarity in the downstream TTS setting remains low in absolute terms (SPK-SIM ≈ 0.43–0.44)
    across all codecs tested, including AUV, suggesting the codec-level improvements shown here do not yet translate
    into strong speaker fidelity for generated speech. The domain-label input used during training but withheld
    at inference creates a train/inference mismatch whose effect on codebook index selection is only indirectly
    probed via the reported index-distribution statistics, not directly ablated.
  caveats: []
- id: '2509.22167'
  entry_date: '2026-07-29'
  year: 2025
  venue: arXiv
  task:
  - TTS
  - codec
  architecture:
  - VAE
  relevance: medium
  evidence_role:
  - architecture_variant
  - control_evidence
  current_role: active_evidence
  method_family:
  - vae_and_quantized_ssl_representations
  claims:
  - claim_id: regularizing_a_continuous_vae_latent_space_toward_semantic_structure_derived
    role: supports
    claim: Regularizing a continuous VAE latent space toward semantic structure derived from self-supervised speech
      features mitigates the reconstruction-generation trade-off in latent-based non-autoregressive TTS.
    source: §4.1, Table 1
    evidence: At a fixed 64-dimensional latent size, adding cosine-similarity alignment to WavLM features reduces
      WER from 2.65% (vanilla VAE) to 2.10% while raising speaker similarity from 0.59 to 0.64 on LibriSpeech-PC
      test-clean.
    confidence: high
    relevance: high
  - claim_id: semantic_alignment_regularization_of_the_generation_target_accelerates_training_convergence
    role: supports
    claim: Semantic alignment regularization of the generation target accelerates training convergence of latent
      diffusion/flow-matching TTS models.
    source: §4.1, Figure 3
    evidence: Training-step comparisons show Semantic-VAE-based F5-TTS reaching lower WER and higher SIM than both
      the vanilla-VAE and mel-spectrogram baselines at the same number of training steps.
    confidence: high
    relevance: medium
  - claim_id: the_intelligibility_versus_speaker_similarity_trade_off_in_vae_latent
    role: refines
    claim: The intelligibility-versus-speaker-similarity trade-off in VAE latent representations is governed by
      which layer of a self-supervised model is used for semantic supervision, not eliminated outright by adding
      semantic alignment.
    source: §4.3, Table 3
    evidence: Ablating SSL layer choice shows the final layer of WavLM/HuBERT substantially degrades SIM (0.50-0.58)
      despite comparable WER, while an intermediate layer (WavLM layer 23) gives the best joint WER/SIM balance.
    confidence: high
    relevance: high
  - claim_id: cosine_similarity_alignment_losses_to_self_supervised_speech_features_preserve
    role: supports
    claim: Cosine-similarity alignment losses to self-supervised speech features preserve useful semantic structure
      in a latent space more effectively than L1 or L2 distance losses to the same features.
    source: §4.3, Table 3
    evidence: Negative cosine alignment achieves 2.10% WER / 0.64 SIM, compared to 3.12% WER / 0.47 SIM for L1 alignment
      and 4.37% WER / 0.48 SIM for L2 alignment under otherwise identical settings.
    confidence: high
    relevance: high
  - claim_id: adding_a_semantic_regularization_objective_to_a_vae_s_training
    role: complicates
    claim: Adding a semantic regularization objective to a VAE's training loss does not necessarily degrade the
      representation's reconstruction fidelity, contrary to the general expectation that additional regularization
      terms cost reconstruction quality.
    source: §4.2, Table 2
    evidence: Semantic-VAE reconstruction metrics on LibriTTS test-other (PESQ 3.74, STOI 0.96, UTMOS 3.56) are
      nearly identical to an unregularized vanilla VAE of the same architecture (PESQ 3.75, STOI 0.97, UTMOS 3.57).
    confidence: high
    relevance: medium
  limitations:
  - The high-resource baseline numbers in Table 1 (CosyVoice, FireRedTTS, E2 TTS, F5-TTS at 100k-580k training hours)
    are quoted directly from their original papers rather than re-run under matched data and compute, so any comparison
    against Semantic-VAE's low-resource (0.6k-hour) results is illustrative context only, not a controlled comparison.
    The method is validated on English speech only, at a single latent configuration (64 dimensions, 40Hz), and
    on two NAR backbones (F5-TTS, E2 TTS); generalization to AR codec-token TTS systems, other languages, or other
    latent dimensionalities/frame rates is untested. The paper also does not report inference latency or discuss
    how the added SSL model changes deployment cost of the VAE training pipeline (inference itself is unaffected,
    since the SSL branch is training-only).
  caveats: []
- id: '2509.24773'
  entry_date: '2026-07-29'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - flow-matching
  relevance: medium
  evidence_role:
  - architecture_variant
  current_role: active_evidence
  method_family:
  - flow_matching_with_ssl_conditioning
  claims:
  - claim_id: joint_training_of_two_video_conditioned_audio_generation_tasks_with
    role: supports
    claim: Joint training of two video-conditioned audio generation tasks with different output characteristics
      does not need to degrade either task's performance, provided the conditioning pathways for each task's signals
      are architecturally separated.
    source: §4.4, Figure 4
    evidence: Learning curves comparing joint (V2S+VisualTTS), sound-only, and speech-only training at matched epochs
      show the joint-trained model reaches performance parity with each single-task model on FAD/DeSync (sound)
      and WER/UTMOS (speech), directly contrasting with a prior report that joint training of these tasks causes
      mutual degradation.
    confidence: high
    relevance: medium
  - claim_id: the_choice_between_cross_attention_and_channel_concatenation_conditioning_in
    role: refines
    claim: The choice between cross-attention and channel-concatenation conditioning in a DiT-based generative model
      should be determined by whether the conditioning signal is temporally dense/aligned or sparse/global, not
      fixed uniformly across all condition types.
    source: §4.3, Figure 3
    evidence: A 5-variant ablation shows concatenation-based conditioning improves WER and lip-sync error for temporally-dense
      signals (transcript, sound/speech sync cues), while cross-attention conditioning improves FAD and video-audio
      semantic alignment for the sparse, global video-semantic feature; self-attention weight visualization shows
      a diagonal locality bias explaining the concatenation result.
    confidence: high
    relevance: medium
  - claim_id: feature_level_synthesis_of_paired_training_examples_constructed_by_mixing
    role: supports
    claim: Feature-level synthesis of paired training examples, constructed by mixing independently-sourced single-modality
      data in representation space, can substitute for scarce real multimodal joint-generation training data.
    source: §4.4, Table 4
    evidence: Fine-tuning on synthetic sound-speech mixtures alone yields the best WER (19.4) and UTMOS (2.07) on
      the V2C-Animation joint-generation benchmark among all training-data configurations tested, exceeding fine-tuning
      on the small (8k-sample) real V2C corpus alone (36.5 WER).
    confidence: high
    relevance: medium
  - claim_id: unified_video_conditioned_generation_systems_that_depend_on_frozen_pretrained
    role: complicates
    claim: Unified video-conditioned generation systems that depend on frozen pretrained feature extractors for
      their conditioning signals inherit those extractors' representational limits, and systems adapted with synthetic
      joint data remain bounded by the distributional gap between synthetic and real joint data.
    source: §Limitations
    evidence: The authors state that reliance on frozen pretrained extractors (CLIP, Synchformer, AV-HuBERT) may
      limit capture of fine-grained audio-visual nuances, and that generation quality on real joint scenarios is
      inherently constrained by the distributional gap of the synthetic training data used for joint-generation
      fine-tuning.
    confidence: high
    relevance: medium
  limitations:
  - Beyond the frozen-extractor and synthetic-data-gap limitations the authors state directly, the joint sound-speech
    generation results are evaluated on a single benchmark (V2C-Animation) drawn entirely from animated content,
    and the joint-generation comparison is against pipeline baselines composed by the authors rather than against
    other end-to-end unified systems, since none are publicly available for this exact three-way task. Code was
    not released at the time of publication ("Demos and code will be soon released" per the paper), though a project
    page with generated examples is available.
  caveats: []
