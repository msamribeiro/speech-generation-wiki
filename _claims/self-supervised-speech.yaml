  claims:
  - claim_id: auxiliary_alignment_losses_applied_at_intermediate_transformer_layers_can_substantially
    role: supports
    claim: Auxiliary alignment losses applied at intermediate transformer layers can substantially accelerate convergence
      in flow-matching TTS training without modifying the inference pipeline.
    source: §2, §4.1, Table 1
    evidence: A-DMA reduces WER from 2.68% to 1.97% and improves SIM from 0.60 to 0.62 for F5-TTS on LibriSpeech-PC
      test-clean in a low-resource (0.6kh) setting, with the convergence curve showing that A-DMA matches the baseline's
      terminal WER in roughly half the training steps.
    confidence: high
    relevance: medium
  - claim_id: in_transformer_based_generative_models_text_semantic_and_speaker_acoustic
    role: refines
    claim: In transformer-based generative models, text-semantic and speaker-acoustic alignment supervision are
      best applied at different network depths rather than at the same layer.
    source: §4.2, Table 2
    evidence: Layer-wise ablation on F5-TTS Small (18 DiT layers) shows that applying CTC text alignment at layer
      8 and HuBERT speech alignment at layer 12 (WER 2.226%) outperforms both same-layer dual alignment at layer
      8 (WER 3.063%) and same-layer alignment at layer 12 (WER 2.688%), supporting a modality-specific depth hypothesis.
    confidence: high
    relevance: medium
  - claim_id: frozen_self_supervised_speech_encoders_such_as_hubert_are_effective
    role: supports
    claim: Frozen self-supervised speech encoders such as HuBERT are effective perceptual teachers for improving
      speaker similarity in flow-matching TTS through cosine-similarity distillation.
    source: §4.3, Table 3
    evidence: Negative cosine similarity to HuBERT-large last-layer features at the 12th transformer layer improves
      SIM from 0.578 to 0.609 and WER from 7.474% to 3.521%; WavLM achieves similar gains (SIM 0.612, WER 3.992%).
      L1 distance and BCE-sigmoid variants are less effective.
    confidence: high
    relevance: high
  - claim_id: training_time_alignment_acceleration_for_diffusion_tts_primarily_improves_text
    role: complicates
    claim: Training-time alignment acceleration for diffusion TTS primarily improves text intelligibility and speaker
      similarity rather than overall speech naturalness, as measured by automatic MOS prediction.
    source: §4.2, Table 2, §6
    evidence: UTMOS scores across all A-DMA ablation conditions (Table 2) range from 4.01 to 4.12, close to the
      4.04 baseline, while WER and SIM show large improvements. The paper reports no human listening test, leaving
      perceptual naturalness gains unconfirmed.
    confidence: high
    relevance: low
  limitations:
  - The evaluation covers only automated metrics (WER via Whisper-large-V3, SIM via WavLM speaker verification,
    UTMOS as an automatic MOS proxy); no human listening evaluation is reported. All A-DMA experiments use the low-resource
    0.6kh training regime; whether doubled convergence speed holds at the 100kh scale used by high-resource baselines
    is untested. The paper also does not address model efficiency at inference, explicitly leaving inference acceleration
    as future work.
  caveats: []
- id: interspeech-2025-1394
  entry_date: '2026-07-29'
