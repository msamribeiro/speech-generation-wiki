    role: supports
    claim: Semantic distillation (aligning early RVQ layers with SSL features) improves phonetic content preservation
      in acoustic tokenizers but may reduce cross-domain generalization when the distillation source is speech-specific.
    source: §4.2 "Distillation Effect", Table 16
    evidence: Semantic distillation (aligning early RVQ layers with SSL features) improves phonetic content preservation
      in acoustic tokenizers but may reduce cross-domain generalization when the distillation source is speech-specific.
    confidence: high
    relevance: high
  - claim_id: domain_alignment_between_tokenizer_training_data_and_evaluation_domain_is
    role: supports
    claim: Domain alignment between tokenizer training data and evaluation domain is the dominant factor in discrete
      audio codec performance, outweighing quantization method or bitrate choices.
    source: §4.2 "Data Domains"
    evidence: Domain alignment between tokenizer training data and evaluation domain is the dominant factor in discrete
      audio codec performance, outweighing quantization method or bitrate choices.
    confidence: high
    relevance: low
  - claim_id: continuous_speech_representations_e_g_wavlm_large_consistently_outperform_all
    role: supports
    claim: Continuous speech representations (e.g., WavLM-large) consistently outperform all discrete tokenizers
      on discriminative tasks, with the gap widening in low-resource conditions.
    source: §3.2, Table 7
    evidence: Continuous speech representations (e.g., WavLM-large) consistently outperform all discrete tokenizers
      on discriminative tasks, with the gap widening in low-resource conditions.
    confidence: high
    relevance: high
  limitations:
  - The TTS and audio LM evaluations are conducted with constrained training budgets (VALL-E on LibriTTS only; 300M
    audio LM at half the original training compute), which limits the practical transferability of findings on TTS
    tokenizer ranking to large-scale production settings.
  - The acoustic LM evaluation uses a single architecture (Qwen-2.5 based, 357M) and a single dataset (LibriHeavy),
    so findings on which tokenizers support better SLMs may not generalise to other LM architectures or training
    scales. The ablation study (Section 4) is restricted to a DAC-backbone framework; FSQ and SVQ conclusions may
