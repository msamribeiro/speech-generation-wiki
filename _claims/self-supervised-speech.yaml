  claims:
  - claim_id: self_supervised_speech_representations_capture_sufficient_prosodic_information_to_classify
    role: supports
    claim: Self-supervised speech representations capture sufficient prosodic information to classify paralinguistic
      attitudes from acoustic input alone, without linguistic features.
    source: §4.1, Table 4, Table 5
    evidence: A frozen HuBERT-large model using layer 12 embeddings averaged over time achieves macro-F1 of 0.909
      on a four-class attitude task in Japanese reading speech, exceeding human listener performance of 0.829 on
      the same data.
    confidence: high
    relevance: high
  - claim_id: environmental_reverberation_poses_a_more_persistent_challenge_than_additive_noise
    role: complicates
    claim: Environmental reverberation poses a more persistent challenge than additive noise for paralinguistic
      recognition models, and is not adequately addressed by speech enhancement postprocessing.
    source: §4.3, Table 7
    evidence: Under noisy conditions, MP-SENet speech enhancement recovers macro-F1 from 0.625 to 0.844; under reverberant
      conditions, the same model raises F1 only from 0.449 to 0.492, attributed to the difficulty of recovering
      prosodic structure from reverberant speech.
    confidence: high
    relevance: medium
  - claim_id: data_augmentation_with_noise_and_reverberation_during_training_does_not
    role: complicates
    claim: Data augmentation with noise and reverberation during training does not close the performance gap when
      those conditions appear at inference time.
    source: §4, §4.3, Table 7
    evidence: Despite four-fold augmentation using noise (DEMAND, MUSAN, FSD50K) and room impulse responses (BIRD)
      at varying SNR levels, macro-F1 drops from 0.912 (clean) to 0.625 (noisy) and 0.449 (noisy-reverberant) on
      held-out test conditions.
    confidence: high
    relevance: medium
  - claim_id: paralinguistic_attitude_recognition_systems_trained_on_reading_speech_datasets_may
    role: complicates
    claim: Paralinguistic attitude recognition systems trained on reading-speech datasets may overstate real-world
      spoken dialogue performance, where speech production is more spontaneous and less controlled.
    source: §3, §5
    evidence: The dataset consists entirely of scripts read with intended attitudes by crowd workers and actors;
      the authors identify generalisation to naturally-occurring speech directed at dialogue systems as unresolved
      future work.
    confidence: high
    relevance: low
  limitations:
  - 'The corpus is a Japanese reading-speech dataset where speakers deliberately produce each attitude; it does
    not reflect the ambiguity or variability of spontaneous human-machine dialogue speech. The four-class taxonomy
    covers core boundary attitudes but may miss finer-grained paralinguistic distinctions. Reverberation robustness
    remains an open problem: speech enhancement postprocessing helps only marginally, and joint enhancement-recognition
    models are proposed but not explored. The paper does not address how an inferred attitude label should influence
    downstream response generation policy within the dialogue system.'
  caveats: []
