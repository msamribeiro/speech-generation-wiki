  claims:
  - claim_id: no_discrete_audio_tokenizer_consistently_outperforms_others_across_reconstruction_downstream
    role: supports
    claim: No discrete audio tokenizer consistently outperforms others across reconstruction, downstream discriminative
      tasks, and acoustic language modeling; the optimal tokenizer is task- and domain-dependent.
    source: §3.4, Figure 4
