- id: '2509.05359'
  entry_date: '2026-07-29'
  year: 2025
  venue: arXiv
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - architecture_variant
  current_role: active_evidence
  method_family:
  - autoregressive_ssl_conditioned_models
  claims:
  - claim_id: discrete_vocabulary_size_is_the_dominant_design_variable_in_speech
    role: supports
    claim: Discrete vocabulary size is the dominant design variable in speech LM continual pre-training, with compact
      cluster sets substantially outperforming fine-grained discretizations regardless of encoder choice.
    source: §3.1, Table 1
    evidence: WavLM NLL degrades from 2.05 (k=500) to 4.01 (k=2500) and 4.21 (k=5000) for SmolLM-135M at step 300;
      the same degradation pattern holds for HuBERT, XLS-R, and Wav2Vec 2.0 across all model sizes.
    confidence: high
    relevance: medium
  - claim_id: optimal_discrete_vocabulary_granularity_for_speech_lm_pre_training_is
    role: complicates
    claim: 'Optimal discrete vocabulary granularity for speech LM pre-training is not fixed across model capacities:
      larger models tolerate higher cluster counts where smaller models fail.'
    source: §3.2, Table 2
    evidence: SmolLM-135M degrades sharply at k=1,000 (NLL=2.19) versus k=500 (NLL=2.05), while SmolLM-1.7B maintains
      stable NLL of 1.83 to 1.94 across k=125 to k=1,000, suggesting capacity-dependent discretization regimes.
    confidence: high
    relevance: medium
  - claim_id: domain_matching_between_the_clustering_training_corpus_and_the_target
    role: supports
    claim: Domain matching between the clustering training corpus and the target speech domain is a critical factor
      for both discrete unit quality and robustness to acoustic perturbations.
    source: §3.3, Table 3
    evidence: LibriHeavy-trained k-means (read English, in-domain with LibriSpeech) achieves NLL=2.62 clean and
      2.70 under heavy noise; GigaSpeech-trained k-means degrades from 3.07 to 3.09 and CommonVoice from 2.85 to
      3.11, showing that exposure to noisier audio during k-means construction does not improve robustness.
    confidence: high
    relevance: medium
  - claim_id: self_supervised_discrete_speech_units_encode_phoneme_level_distinctions_without
    role: supports
    claim: Self-supervised discrete speech units encode phoneme-level distinctions without explicit phonetic supervision,
      as evidenced by their systematic alignment with forced-alignment phoneme sequences.
    source: §3.5, Figure 2
    evidence: Phoneme confusion matrices on LibriSpeech test-clean (WavLM, k=125) show a strong diagonal structure
      where vowels and consonants each specialize into distinct unit subsets; the pattern persists across all four
      k-means data sources and holds at k=250.
    confidence: high
    relevance: high
  limitations:
  - Evaluation uses only NLL on LibriSpeech, a proxy metric. No downstream task evaluation (spoken question answering,
    spoken language understanding, ASR) is included, so the practical implications of the observed NLL differences
    for real applications remain untested.
  - The study uses the SmolLM family exclusively, trained only on read English speech from LibriSpeech. Whether
    the encoder and cluster-count findings generalize to larger models, multilingual data, conversational speech,
    or production-scale training runs is unknown. The 1.7B model encounters out-of-memory limitations at k=2,500
    and above, so the full picture for large models at high cluster counts is missing. The relationship between
    cluster utilization efficiency and downstream performance is posited but not directly measured.
  caveats: []
