- id: 2025.acl-long.790
  entry_date: '2026-07-29'
  year: 2025
  venue: ACL
  task:
  - VC
  architecture:
  - flow-matching
  relevance: medium
  evidence_role:
  - architecture_variant
  - control_evidence
  current_role: active_evidence
  method_family:
  - flow_matching_with_ssl_conditioning
  claims:
  - claim_id: self_consistency_training_enables_shortcut_flow_matching_to_match_full
    role: supports
    claim: Self-consistency training enables shortcut flow matching to match full-step quality in voice conversion
      with as few as two inference steps.
    source: §4.2, Table 1
    evidence: R-VC at NFE=2 matches NFE=10 across all quality metrics (SECS 0.930 vs 0.931, UTMOS 4.1 vs 4.1, QMOS
      4.03 vs 4.05, SMOS 4.11 vs 4.12) while reducing inference time by 2.83x; vanilla CFM degrades sharply below
      10 steps.
    confidence: high
    relevance: low
  - claim_id: explicit_rhythm_modeling_via_a_target_conditioned_duration_model_substantially
    role: supports
    claim: Explicit rhythm modeling via a target-conditioned duration model substantially improves emotion style
      transfer in zero-shot VC.
    source: §4.3, §4.5, Table 2, Table 4
    evidence: Removing the duration module from R-VC drops the emotion score from 0.59 to 0.425 on the ESD dataset,
      while also increasing WER slightly; baselines that preserve source rhythm score 0.395-0.489.
    confidence: high
    relevance: medium
  - claim_id: fine_grained_duration_prediction_in_non_autoregressive_models_introduces_instability
    role: complicates
    claim: Fine-grained duration prediction in non-autoregressive models introduces instability in voice conversion
      that coarser duration strategies do not fully resolve.
    source: §7, Table 4
    evidence: R-VC's masked transformer duration model produces occasional over-extended pronunciations; sentence-level
      duration as a fallback yields worse WER (9.86 vs 6.95) and UTMOS (3.58 vs 3.85), offering no stability improvement
      in practice.
    confidence: high
    relevance: low
  - claim_id: data_perturbation_before_discrete_content_tokenisation_reduces_timbre_leakage_more
    role: supports
    claim: Data perturbation before discrete content tokenisation reduces timbre leakage more effectively than relying
      on the self-supervised representation alone.
    source: §4.5, Table 4
    evidence: Removing pitch perturbation before HuBERT token extraction degrades WER from 3.51 to 7.28 and speaker
      similarity from 0.930 to 0.869, confirming that perturbation actively suppresses content-irrelevant speaker
      information.
    confidence: high
    relevance: high
  limitations:
  - 'The masked transformer duration model has a known instability: inaccurate predictions cause over-extended pronunciations.
    Sentence-level duration as an alternative proved worse in both stability and quality, leaving robust duration
    modeling as an unresolved challenge.'
  - The system is evaluated only on English (MLS, LibriSpeech, ESD) and English Seed-TTS subsets; generalisation
    to cross-lingual or multilingual VC is untested. Training data (20k hours) is smaller than top competitors such
    as CosyVoice-VC (171k hours), which makes speaker similarity comparisons somewhat favourable to R-VC but also
    means that high-similarity performance on out-of-distribution accents or recording conditions is unknown. The
    RTF of 0.12 using 2-step inference is faster than most flow-matching competitors but still 20% slower than non-diffusion
    methods (FACodec-VC RTF 0.10).
  caveats: []
- id: 2025.acl-long.817
  entry_date: '2026-07-29'
  year: 2025
  venue: ACL
  task:
  - SCA
  - TTS
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - architecture_variant
  - acceleration_evidence
  - control_evidence
  current_role: active_evidence
  method_family:
  - autoregressive_ssl_conditioned_models
  claims:
  - claim_id: boundary_aware_speech_representations_are_critical_for_enabling_offline_trained
    role: supports
    claim: Boundary-aware speech representations are critical for enabling offline-trained speech LLMs to perform
      simultaneous inference via wait-k strategies.
    source: §5.1, §5.2, Tables 4, 11
    evidence: CIF-based boundary-aware prompts outperform fixed downsampling by approximately 4 ASR-BLEU points
      at equivalent latency on Es-En, Fr-En, and De-En CVSS-C test sets, with a parallel ~4 BLEU gap on text output
      confirming the bottleneck is LLM prediction rather than speech synthesis.
    confidence: high
    relevance: medium
  - claim_id: offline_training_combined_with_test_time_simultaneous_inference_policies_can
    role: supports
    claim: Offline training combined with test-time simultaneous inference policies can match or outperform systems
      trained specifically for streaming in speech-to-speech translation.
    source: §5.1, Fig. 4, Table 1
    evidence: SimulS2S-LLM, trained offline, consistently outperforms the streaming-trained StreamSpeech model across
      all three language pairs at comparable latency, achieving up to 4 ASR-BLEU improvement on Es-En.
    confidence: high
    relevance: low
  - claim_id: aggregating_llm_hidden_states_across_multiple_layers_improves_discrete_speech
    role: supports
    claim: Aggregating LLM hidden states across multiple layers improves discrete speech token prediction compared
      to using only the final layer.
    source: §5.3, Fig. 6
    evidence: Multi-layer hidden state weighting yields approximately 1 ASR-BLEU improvement over last-layer-only
      decoding on CVSS-C Es-En Simul-S2ST, attributed to the final layer's focus on semantic text information at
      the expense of acoustic richness needed for speech token generation.
    confidence: high
    relevance: medium
  - claim_id: llm_based_approaches_to_simultaneous_speech_generation_face_a_latency
    role: complicates
    claim: LLM-based approaches to simultaneous speech generation face a latency penalty from LLM inference overhead
      that narrows the practical quality-latency advantage over non-LLM methods.
    source: §D, Tables 8-10, Limitations
    evidence: Computation-aware ATD for SimulS2S-LLM is substantially higher than standard ATD (e.g., 4239ms vs.
      3440ms at k=8 on Es-En), and the system is not evaluated at very low latency regimes (AL < 1s) where reordering
      requirements make offline-trained models unsuitable.
    confidence: high
    relevance: low
  - claim_id: shallow_fusion_of_n_gram_language_models_with_ctc_decoding
    role: supports
    claim: Shallow fusion of n-gram language models with CTC decoding of discrete speech tokens improves simultaneous
      speech translation quality without increasing latency.
    source: §5.4, Table 2
    evidence: n-gram LM fusion over greedy CTC search improves ASR-BLEU from 24.7 to 26.3 on CVSS-C Es-En at identical
      ATD of 3439ms.
    confidence: high
    relevance: low
  limitations:
  - The system is not evaluated at very low latency (AL < 1s), a regime the authors identify as unsuitable for offline-trained
    models due to reordering requirements. This excludes SimulS2S-LLM from the most latency-critical applications.
    Computation-aware latency is substantially higher than the reported ATD, and all experiments use 7B/8B open-source
    LLMs on small datasets (70-174 hours per language pair), leaving scalability to larger models and data unverified.
  - The evaluation is limited to three European language pairs in a single translation direction each. Language
    pairs with greater structural divergence or more extensive reordering would stress the wait-k assumption more
    severely. The system has not been evaluated on offline inference or tasks other than S2ST and S2TT, despite
    the claim that offline training preserves such capabilities. Long-form simultaneous speech translation is also
    untested due to lack of suitable data.
  caveats: []
- id: 2025.acl-long.87
  entry_date: '2026-07-29'
  year: 2025
  venue: ACL
  task:
  - VC
  architecture:
  - flow-matching
  relevance: medium
  evidence_role:
  - architecture_variant
  - acceleration_evidence
  - control_evidence
  current_role: active_evidence
  method_family:
  - flow_matching_with_ssl_conditioning
  claims:
  - claim_id: combining_asr_derived_phonetic_features_and_quantized_self_supervised_representations
    role: supports
    claim: Combining ASR-derived phonetic features and quantized self-supervised representations via adaptive fusion
      reduces timbre leakage while preserving paralinguistic content in zero-shot voice conversion.
    source: §5.3, Table 3
    evidence: Removing the PPG branch (WavLM-only) causes SMOS to drop from 4.11 to 3.07 and SECS from 0.71 to 0.45
      on LibriTTS, indicating that SSL features alone carry substantial timbre leakage; removing the SSL branch
      degrades NMOS and WER, confirming PPGs alone lose paralinguistic richness.
    confidence: high
    relevance: high
  - claim_id: flow_matching_provides_faster_inference_than_diffusion_based_voice_conversion
    role: supports
    claim: Flow matching provides faster inference than diffusion-based voice conversion systems without sacrificing
      speaker similarity or naturalness.
    source: §5.1, Table 1
    evidence: Takin-VC achieves RTF 0.154, lower than DiffVC (0.294), NS2VC (0.347), and SeedVC (0.341), while simultaneously
      outperforming these baselines on NMOS, SMOS, and SECS.
    confidence: high
    relevance: low
  - claim_id: global_time_invariant_speaker_embeddings_are_insufficient_for_robust_timbre
    role: complicates
    claim: Global, time-invariant speaker embeddings are insufficient for robust timbre modeling in expressive zero-shot
      voice conversion.
    source: §5.3, Table 4
    evidence: Removing the context-aware cross-attention module (which aligns source content with target timbre
      dynamically) drops SMOS from 4.11 to 3.61 and SECS from 0.71 to 0.58, while the memory-augmented module removal
      drops SECS to 0.52. Both modules provide content-sensitive timbre conditioning beyond a static speaker embedding
      alone.
    confidence: high
    relevance: low
  - claim_id: cross_gender_voice_conversion_consistently_yields_lower_speaker_similarity_than
    role: complicates
    claim: Cross-gender voice conversion consistently yields lower speaker similarity than same-gender conversion
      even in well-trained systems.
    source: §5.2, Table 2
    evidence: 'On the large-scale multilingual dataset, same-gender pairs (F2F: SECS 0.74; M2M: 0.73) outperform
      cross-gender pairs (F2M: 0.71; M2F: 0.70) in speaker embedding cosine similarity, a gap that persists across
      all conversion directions.'
    confidence: high
    relevance: low
  - claim_id: quantizing_self_supervised_speech_features_before_content_encoding_reduces_timbre
    role: refines
    claim: Quantizing self-supervised speech features before content encoding reduces timbre leakage more effectively
      than using continuous SSL representations directly.
    source: §3.2, §5.3, Table 3
    evidence: The RVQ quantizer (codebook size 8,200) applied to WavLM features is the key mechanism for timbre
      suppression in the hybrid encoder; ablation with WavLM-only (continuous features without adaptive fusion)
      shows SECS drops to 0.45 compared to 0.71 for the full model, consistent with timbre leakage from unquantized
      SSL features.
    confidence: high
    relevance: high
  limitations:
  - All large-scale training data (500k hours) and the 100-speaker evaluation set are proprietary and not publicly
    available. The large-scale results cannot be reproduced by external researchers, and it is unclear how much
    of the gain over competitive baselines is attributable to data scale rather than the proposed modules.
  - The paper does not include targeted evaluation of paralinguistic preservation (breathing, crying, emotion transfer),
    despite listing this as a primary contribution. NMOS and SMOS measure general naturalness and speaker similarity
    but are not designed to capture expressive fidelity specifically. Speech editing under zero-shot conditions
    is acknowledged as out of scope and a direction for future work. Ethical risks from voice impersonation are
    noted but no technical mitigations are proposed.
  caveats: []
- id: 2025.acl-long.997
  entry_date: '2026-07-29'
  year: 2025
  venue: ACL
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - architecture_variant
  - control_evidence
  current_role: active_evidence
  method_family:
  - autoregressive_ssl_conditioned_models
  claims:
  - claim_id: preference_optimization_with_llm_based_semantic_feedback_improves_long_range
    role: supports
    claim: Preference optimization with LLM-based semantic feedback improves long-range semantic coherence in textless
      spoken language models beyond next-token prediction training.
    source: §5.2, Table 2
    evidence: DPO with Mistral-score preference data raises T-StoryCloze from 69.7% to 74.2% (1.3B model) and from
      75.4% to 83.8% (7B model) over the pre-trained TWIST baseline; curriculum learning further improves both to
      76.1% and 85.6% respectively.
    confidence: high
    relevance: medium
  - claim_id: llm_based_semantic_scoring_provides_more_effective_alignment_signal_for
    role: supports
    claim: LLM-based semantic scoring provides more effective alignment signal for speech continuation than perplexity-based
      preference selection.
    source: §5.1, Table 1
    evidence: On the 1.3B model, Align-SLM with Mistral score improves T-StoryCloze by +4.5 and GPT4-o score by
      +0.24 over the pre-trained baseline, whereas the PPL-based variant degrades T-StoryCloze by 2.0 and improves
      GPT4-o by only +0.03.
    confidence: high
    relevance: medium
  - claim_id: curriculum_learning_with_iteratively_tightened_preference_thresholds_yields_progressive_semantic
    role: supports
    claim: Curriculum learning with iteratively tightened preference thresholds yields progressive semantic improvements
      in preference-optimized spoken language models.
    source: §5.3, Appendix E, Table 2
    evidence: Two curriculum learning iterations on the 7B model with LibriSpeech data improve T-StoryCloze from
      83.8% (Align-SLM) to 85.6% (Align-SLM+CL) and GPT4-o from 3.50 to 3.56; further iterations continue to improve
      most metrics.
    confidence: high
    relevance: medium
  - claim_id: semantic_gains_from_preference_optimization_do_not_transfer_uniformly_to
    role: complicates
    claim: Semantic gains from preference optimization do not transfer uniformly to lexical and grammatical aspects
      of spoken language modeling.
    source: §5.5, Table 2
    evidence: Align-SLM shows only marginal sBLIMP improvement (+1.3 for the 1.3B Mistral variant) while AudioLM
      and SyllableLM, which use no preference training but have better speech token designs, outperform on grammatical
      correctness.
    confidence: high
    relevance: medium
  - claim_id: textless_end_to_end_spoken_language_models_remain_substantially_behind
    role: complicates
    claim: Textless end-to-end spoken language models remain substantially behind cascaded ASR+LLM pipelines in
      semantic understanding even with preference optimization.
    source: §5.5, Table 2
    evidence: The best Align-SLM variant achieves 77.9% sWUGGY and 86.8% T-StoryCloze, compared to 79.2% and 94.8%
      for the ASR+LLM cascade topline, a gap that preference optimization alone does not close.
    confidence: high
    relevance: medium
  limitations:
  - Training and evaluation are restricted to English audiobook speech (LibriSpeech, MLS), a clean and structured
    domain. Generalisation to spontaneous, noisy, or multi-speaker speech is untested, and the automatic preference
    pipeline's reliance on ASR transcription quality may degrade under real-world acoustic conditions.
  - The paper does not compare against text-injecting SLMs (SPIRITLM, Moshi, VoxtLM) under matched data and compute
    budgets, so the relative cost of maintaining the textless constraint is not quantified. Only the semantic dimension
    of SLM quality is addressed; paralinguistic aspects such as prosody, speaking style, and emotion are explicitly
    out of scope and represent open directions for extending the framework.
  caveats: []
- id: 2025.findings-acl.631
  entry_date: '2026-07-29'
  year: 2025
  venue: ACL
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - architecture_variant
  - acceleration_evidence
  current_role: active_evidence
  method_family:
  - autoregressive_ssl_conditioned_models
  claims:
  - claim_id: text_lm_initialization_substantially_accelerates_slm_convergence_and_improves_final
    role: supports
    claim: Text LM initialization substantially accelerates SLM convergence and improves final model quality within
      fixed compute budgets.
    source: §4.1, Figure 2, Figure 3
    evidence: TWIST-style initialization from Qwen2.5-0.5B outperforms uninitialised variants across all evaluated
      model families; by end of training, Qwen2.5 with initialization surpasses alternatives even with fewer training
      tokens.
    confidence: high
    relevance: medium
  - claim_id: synthetic_tts_data_improves_semantic_modeling_in_slms_when_combined
    role: supports
    claim: Synthetic TTS data improves semantic modeling in SLMs when combined with real speech, but replacing real
      data with synthetic data alone degrades performance.
    source: §4.2, Table 1
    evidence: Adding sTinyStories to the training mix boosts TSC from 71.14 to 78.01 and GenPPL from 145.4 to 88.3
      for Qwen-0.5B; training on synthetic data exclusively yields sBLIMP 52.35 versus 56.45 for the mixed baseline.
    confidence: high
    relevance: medium
  - claim_id: preference_optimization_with_synthetically_generated_preference_data_substantially_improves_slm
    role: supports
    claim: Preference optimization with synthetically generated preference data substantially improves SLM generation
      quality even under tight compute constraints.
    source: §4.4, Figure 5, Table 2
    evidence: 30 minutes of DPO training on SpokenSwag improves TSC from 78.01 to 82.04 and GenPPL from 88.3 to
      62.8; the gain saturates quickly and additional DPO budget can degrade results.
    confidence: high
    relevance: medium
  - claim_id: slm_scaling_laws_accurately_predict_compute_optimal_performance_boundaries_for
    role: contradicts
    claim: SLM scaling laws accurately predict compute-optimal performance boundaries for academic-scale training.
    source: §5, Table 2
    evidence: Slam on one A5000 GPU-day achieves TSC 82.04 against the scaling-law predicted optimal of TSC 70.49
      for the same compute, and sBLIMP 58.86 against the predicted 56.85; the authors attribute the gap to text
      LM initialization and synthetic data not being factored into scaling law derivations.
    confidence: high
    relevance: medium
  - claim_id: diverse_multi_domain_speech_training_data_improves_slm_generalization
    role: complicates
    claim: Diverse multi-domain speech training data improves SLM generalization.
    source: §4.2, Table 1
    evidence: Augmenting LibriLight and LibriSpeech with VoxPopuli, TED-LIUM, PeopleSpeech, and SWC consistently
      degrades TSC and SSC for both OPT-125M and Qwen-0.5B under the single-GPU budget; the authors hypothesize
      that modelling acoustic diversity requires more compute than the Slamming budget allows.
    confidence: high
    relevance: medium
  limitations:
  - The evaluation uses only semantic modeling benchmarks (TSC, SSC, sBLIMP) and generation perplexity. Acoustic
    and prosodic quality are not evaluated; the authors note that benchmarks such as SALMon may reveal further limitations
    of low-resource SLM training in these dimensions. *(§7)*
  - The recipe relies exclusively on HuBERT semantic tokens, leaving open whether the same efficiency gains apply
    with newer tokenizers such as Mimi or SylBoost. Text-speech interleaving underperforms speech-only training
    at the single-GPU budget due to vocabulary expansion and fewer speech tokens per step; whether this changes
    at higher compute is unresolved. Out-of-domain generalization (People Speech) shows that Slam scaled matches
    but does not clearly outperform TWIST-7B, despite Slam using only audiobook-domain training data that TWIST
    also trained on.
  caveats: []
- id: 2025.findings-acl.71
  entry_date: '2026-07-29'
  year: 2025
  venue: ACL
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - architecture_variant
  current_role: active_evidence
  method_family:
  - autoregressive_ssl_conditioned_models
  claims:
  - claim_id: explicit_listening_comprehension_objectives_improve_cross_modal_understanding_in_multimodal
    role: supports
    claim: Explicit listening comprehension objectives improve cross-modal understanding in multimodal LLMs fine-tuned
      for spoken QA.
    source: §3.4, Table 3
    evidence: Removing the story listening comprehension sub-task from DAMSEL causes the largest single-task performance
      degradation (Table 3, ablations on ASK-QA with Speech-Qwen), confirming that transcription supervision is
      the most critical auxiliary signal.
    confidence: high
    relevance: medium
  - claim_id: multi_task_auxiliary_task_design_can_substitute_for_large_scale
    role: supports
    claim: Multi-task auxiliary task design can substitute for large-scale data collection in adapting MLLMs to
      spoken question answering.
    source: §3.2, Figure 4, Table A7
    evidence: DAMSEL with Speech-Qwen surpasses the prior state-of-the-art on Spoken-SQuAD using only 10% of training
      data (66.38 EM vs. DDNet 64.1 EM trained on 100% of data).
    confidence: high
    relevance: medium
  - claim_id: data_centric_multi_task_fine_tuning_yields_consistent_gains_even
    role: supports
    claim: Data-centric multi-task fine-tuning yields consistent gains even for frontier MLLMs with extensive prior
      multi-modal pre-training.
    source: §3.1
    evidence: Gemini Pro fine-tuned with DAMSEL on 1% of ASK-QA improves 5.7% relative over single-task tuning;
      improvement persists with full data (1.6% relative), despite Gemini having seen large-scale multi-modal training
      data and ASK-QA being newly synthesised.
    confidence: high
    relevance: medium
  - claim_id: tts_synthesised_speech_datasets_have_quality_ceilings_that_limit_model
    role: complicates
    claim: TTS-synthesised speech datasets have quality ceilings that limit model generalisation to naturalistic
      paralinguistic variation.
    source: §Limitations, §B.1
    evidence: The paper notes that WER-filtered ASK-QA transcriptions may not perfectly match synthesised speech,
      and that current TTS lacks perfect controllability for speaking rate and pitch. The dynamic evaluation pipeline
      also depends on TTS to regenerate spoken turns, compounding generation quality issues across multi-turn rollouts.
    confidence: high
    relevance: medium
  - claim_id: spoken_qa_performance_gains_from_multi_task_learning_are_largest
    role: refines
    claim: Spoken QA performance gains from multi-task learning are largest in the low-data regime and diminish
      as training data scales.
    source: §3.1, §3.3, Table 2
    evidence: Gemini Pro's DAMSEL advantage over single-task tuning narrows from 16.13% relative EM improvement
      (1% data) to 1.7% (full data) on SD-QA, and from 5.7% to 1.6% relative on ASK-QA.
    confidence: high
    relevance: medium
  limitations:
  - Performance relies on ground-truth transcriptions as listening comprehension targets. In practice, transcriptions
    from Spoken-SQuAD and SD-QA are derived from ASR systems with known errors. The paper acknowledges it is unclear
    whether slight transcription noise improves robustness or degrades performance.
  - A key open question is whether the DAMSEL data generation process scales to MLLM post-training. The paper demonstrates
    gains with fine-tuning but notes that verifying post-training effects is computationally infeasible in this
    work. The dynamic multi-turn evaluation for ASK-QA also depends on an LLM-based action classifier and user simulator,
    introducing additional sources of evaluation variance that are not thoroughly characterised.
  - The model currently targets auditory semantic understanding. The paper notes that more nuanced SCA tasks (such
    as monitoring user frustration in task guidance) require sensitivity to different paralinguistic dimensions
    not addressed by the current auxiliary tasks.
  caveats: []
- id: 2025.findings-acl.75
  entry_date: '2026-07-29'
  year: 2025
  venue: ACL
  task:
