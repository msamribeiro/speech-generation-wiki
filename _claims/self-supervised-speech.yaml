  claims:
  - claim_id: acoustic_consistency_in_autoregressive_speech_language_models_can_be_improved
    role: supports
    claim: Acoustic consistency in autoregressive speech language models can be improved through LM-side embedding
      initialization and auxiliary training objectives, independent of parameter count.
    source: §4, Table 1
    evidence: The 0.7B speech-only CAST model scores 90.8 speaker and 90.0 gender consistency on SALMON, exceeding
      the 7B SpiritLM (81.0/85.0) and 7B Twist (71.0/70.0), despite using an order of magnitude fewer parameters
      and the same evaluation protocol.
    confidence: high
    relevance: medium
  - claim_id: interleaving_text_and_speech_tokens_in_a_shared_vocabulary_language
    role: complicates
    claim: Interleaving text and speech tokens in a shared-vocabulary language model improves semantic and lexical
      grounding at the cost of acoustic consistency.
    source: §4, Tables 1-2
    evidence: The 1.0B interleaved model drops SALMON consistency by 5-9 points across every measured factor relative
      to the 1.0B speech-only model (e.g., speaker 83.5 vs. 90.0) while sWUGGY rises from 67.0 to 73.7 and semantic-acoustic
      alignment scores improve by 6-7.5 points.
    confidence: high
    relevance: medium
  - claim_id: auxiliary_objectives_that_require_the_model_to_plan_coarse_content
    role: supports
    claim: Auxiliary objectives that require the model to plan coarse content structure before predicting fine acoustic
      detail materially contribute to speaker- and gender-identity stability beyond what embedding initialization
      alone provides.
    source: §4, Table 4
    evidence: Removing the delayed coarse-label and next-code auxiliary losses drops speaker consistency from 90.8
      to 83.5 in the 0.7B model and from 90.0 to 83.0 in the 1.0B model, with background and room consistency declining
      more moderately.
    confidence: high
    relevance: medium
  - claim_id: initializing_speech_token_embeddings_from_self_supervised_acoustic_features_biases
    role: refines
    claim: Initializing speech-token embeddings from self-supervised acoustic features biases the resulting representation
      toward content structure at the expense of fine-grained prosodic detail.
    source: §4, Table 3
    evidence: Linear probes on frozen LM features show the SSL-initialized variant gains on average +16% relative
      accuracy on content-leaning tasks (ESC-50, US8K, RAVDESS) while losing about 7% relative accuracy on prosody-leaning
      tasks (VIVAE, EMOVO), compared to a randomly initialized baseline.
    confidence: high
    relevance: high
  limitations:
  - The paper evaluates consistency exclusively through likelihood-based pairwise preference scoring (SALMON) rather
    than through generated-sample quality or human listening tests; no MOS or subjective naturalness evaluation
    is reported, so it is untested whether the consistency gains translate into perceptibly better generations.
    The comparison against Twist, SpiritLM, LAST, and Flow-SLM baselines is confounded by differences in tokenizer,
    training data, and architecture beyond scale, which the paper acknowledges only implicitly by noting these systems
    "differ in tokenization, architecture, and training objectives." The 1.0B ablation shows a single anomalous
    result for room consistency that the authors attribute to run instability rather than investigate further. All
    experiments use English-only, largely read-speech and audiobook data (LibriLight, People's Speech), leaving
    open whether the training recipe generalizes to conversational, multilingual, or noisier real-world speech.
  caveats: []
