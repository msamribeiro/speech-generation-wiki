  claims:
  - claim_id: interleaving_discrete_audio_tokens_with_text_tokens_in_a_shared
    role: supports
    claim: Interleaving discrete audio tokens with text tokens in a shared language model vocabulary enables end-to-end
      spoken dialogue systems that respond coherently to paralinguistic cues without requiring separate speech synthesis
      pipelines.
    source: §3.1, §4.6
    evidence: Interleaving discrete audio tokens with text tokens in a shared language model vocabulary enables
      end-to-end spoken dialogue systems that respond coherently to paralinguistic cues without requiring separate
      speech synthesis pipelines.
    confidence: high
    relevance: low
  - claim_id: reinforcement_learning_applied_to_audio_language_models_can_improve_reasoning
    role: supports
    claim: Reinforcement learning applied to audio language models can improve reasoning efficiency in complex acoustic
      scenarios while preserving generation quality.
    source: §3.4
    evidence: Reinforcement learning applied to audio language models can improve reasoning efficiency in complex
      acoustic scenarios while preserving generation quality.
    confidence: high
    relevance: medium
  - claim_id: retrieval_augmented_generation_and_external_tool_calling_can_substantially_reduce
    role: supports
    claim: Retrieval-augmented generation and external tool calling can substantially reduce hallucination and expand
      capability (timbre switching, web-grounded responses) in large audio language models without architectural
      redesign.
    source: §3.1, §4.5
    evidence: Retrieval-augmented generation and external tool calling can substantially reduce hallucination and
      expand capability (timbre switching, web-grounded responses) in large audio language models without architectural
      redesign.
    confidence: high
    relevance: medium
  - claim_id: comprehensive_multi_task_pre_training_across_asr_tts_translation_and
    role: supports
    claim: Comprehensive multi-task pre-training across ASR, TTS, translation, and conversation significantly improves
      spoken dialogue performance in low-resource languages and accented speech.
    source: §3.2, §4.1
    evidence: Comprehensive multi-task pre-training across ASR, TTS, translation, and conversation significantly
      improves spoken dialogue performance in low-resource languages and accented speech.
    confidence: high
    relevance: low
  - claim_id: existing_audio_language_model_benchmarks_fail_to_capture_fine_grained
    role: complicates
    claim: Existing audio language model benchmarks fail to capture fine-grained paralinguistic comprehension and
      voice-triggered tool invocation, leaving important capability dimensions systematically unmeasured.
    source: §4.2, §4.5
    evidence: Existing audio language model benchmarks fail to capture fine-grained paralinguistic comprehension
      and voice-triggered tool invocation, leaving important capability dimensions systematically unmeasured.
    confidence: high
    relevance: medium
  limitations:
  - Two of the main evaluation benchmarks (StepEval-Audio-Paralinguistic, StepEval-Audio-Toolcall) are introduced
    by the authors themselves and have not been validated independently. Results on these benchmarks may overstate
    absolute capability levels even if relative comparisons are informative.
  - Model size is not reported, which makes parameter-count comparisons with other open-source systems (Kimi-Audio,
    Qwen2.5-Omni) difficult to interpret fairly. The open-source mini variant uses Qwen2.5-7B as its backbone, but
    the full model's parameter count remains undisclosed.
  - The audio search tool relies on a proprietary library of hundreds of thousands of speech samples, limiting reproducibility
    of this capability. Latency characteristics are not reported; real-time performance is claimed via VAD and deployment
    infrastructure inherited from Step-Audio but not benchmarked here.
  - Evaluation is primarily Chinese-English bilingual. Performance on other language families, especially those
    with minimal pre-training coverage, is largely uncharacterized. The tool-calling evaluation uses synthesized
    speech conversations generated from text scripts rather than natural speech, which may not reflect real-world
    tool invocation patterns.
  caveats: []
- id: '2507.18897'
  entry_date: '2026-07-29'
  year: 2025
  venue: arXiv
  task:
  - codec
  architecture:
  - GAN
  relevance: medium
  evidence_role:
  - architecture_variant
  current_role: active_evidence
  method_family:
  - gan_decoders_for_ssl_units
  claims:
  - claim_id: single_quantizer_neural_codecs_can_match_multi_quantizer_systems_in
    role: supports
    claim: Single-quantizer neural codecs can match multi-quantizer systems in perceived speech quality at far lower
      bitrates when combined with stabilized VQ spaces and asymmetric decoder architectures.
    source: §4.3, Table 1
    evidence: HH-Codec achieves UTMOS 3.61 on LibriTTS test-clean at 0.3 kbps with a single quantizer, competitive
      with DAC's 4-quantizer configuration at 4 kbps (UTMOS 3.41) and markedly above SpeechTokenizer's single-quantizer
      variant at 0.75 kbps (UTMOS 1.26).
    confidence: high
    relevance: medium
  - claim_id: multi_layer_vq_training_with_single_layer_inference_where_auxiliary
    role: supports
    claim: Multi-layer VQ training with single-layer inference, where auxiliary quantizer layers act as regularizers,
      substantially improves codebook utilization in high-compression single-quantizer settings.
    source: §4.4, Tables 2-3
    evidence: SLM-VQ achieves 98% codebook utilization at 8192 entries versus 56% for Classic VQ and 92% for single-layer
      SLM-VQ, while improving UTMOS from 2.76 (Classic VQ) to 3.07 on LibriTTS test-other.
    confidence: high
    relevance: medium
  - claim_id: dual_domain_supervision_combining_intermediate_mel_spectrogram_and_final_audio
    role: supports
    claim: Dual-domain supervision combining intermediate mel-spectrogram and final audio reconstruction objectives
      is critical for stable high-compression neural codec training.
    source: §4.4, Table 2
    evidence: Reducing to single audio-domain supervision drops UTMOS from 3.07 to 1.85 and SPK-SIM from 0.64 to
      0.33 on LibriTTS test-other, the largest degradation across all ablation variants.
    confidence: high
    relevance: low
  - claim_id: standard_adversarial_codec_training_recipes_break_down_at_extreme_compression
    role: complicates
    claim: Standard adversarial codec training recipes break down at extreme compression ratios, requiring architectural
      and procedural modifications to avoid collapse.
    source: §1
    evidence: Below 0.3 kbps with existing methods, the paper documents adversarial training collapse, a 63% UTMOS
      drop below 30 tokens/s, 43% codebook utilization at 8192 entries, and minimal benefit from expanding training
      data, all addressed in HH-Codec through SLM-VQ and progressive training.
    confidence: high
    relevance: low
  limitations:
  - HuBERT-based semantic distillation is trained on English, so multilingual performance of SLM-VQ is unknown.
    The downstream spoken language modeling experiment measures only training loss reduction rather than end-to-end
    TTS quality, leaving it unclear how the 24-token-per-second compression affects downstream synthesis intelligibility
    and naturalness. Training data conditions differ across compared baselines (WavTokenizer and DAC use larger
    or different datasets), which limits direct attribution of gains to architecture versus data. The ablation study
    is conducted on a subset of training data only (LibriTTS train-100/360, not the full training set including
    Emilia), which may underestimate some component contributions.
  caveats: []
