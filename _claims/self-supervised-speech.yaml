  claims:
  - claim_id: in_video_to_speech_synthesis_discrete_acoustic_unit_intermediate_representations
    role: supports
    claim: In video-to-speech synthesis, discrete acoustic-unit intermediate representations preserve speech content
      but discard speaker-identifying acoustic detail relative to continuous Mel-spectrogram representations.
    source: §3, Table 1, Figure 1
    evidence: With ground-truth input held fixed, Unit-HiFiGAN scores SECS 0.555 / EER 40.52 versus HiFi-GAN's SECS
      0.894 / EER 22.96, and a Mel-spectrogram visual comparison shows the unit-based vocoder output diverges from
      ground truth in the frequency domain.
    confidence: high
    relevance: medium
  - claim_id: audio_visual_pre_trained_visual_encoders_can_supply_enough_speaker
    role: supports
    claim: Audio-visual pre-trained visual encoders can supply enough speaker-identity information from silent video
      to make explicit speaker embeddings unnecessary in video-to-speech synthesis.
    source: §5.2, Table 4
    evidence: DiVISe attains the best or near-best SECS scores on LRS2 (0.609) and LRS3 (0.624) among all compared
      methods, including several that use audio speaker embeddings during training or inference (SVTS, Multi-Task).
    confidence: high
    relevance: medium
  - claim_id: gains_in_objective_intelligibility_metrics_from_architectural_changes_do_not
    role: complicates
    claim: Gains in objective intelligibility metrics from architectural changes do not necessarily transfer to
      subjective audio-quality preference, especially when speaker-identity cues are removed from the listening
      context.
    source: Appendix C, Table 16
    evidence: In an audio-only MOS test without speaker reference images, Unit-HiFiGAN scores higher (4.37±0.11)
      than the Mel-based HiFi-GAN (4.24±0.12), the inverse of the speaker-matching and intelligibility rankings
      observed elsewhere in the paper.
    confidence: high
    relevance: medium
  - claim_id: the_benefit_of_audio_visual_pre_training_for_video_to
    role: refines
    claim: The benefit of audio-visual pre-training for video-to-speech synthesis is not uniform across model components;
      it most strongly aids the component responsible for output representation choice rather than uniformly improving
      all downstream metrics.
    source: §5.4.2, Table 7
    evidence: Removing pre-training degrades DiVISe across all four reported metrics (SECS, EER, ESTOI, WER), but
      for ReVISE removing pre-training mainly hurts intelligibility (WER 36.03 to 77.24) while leaving speaker metrics
      comparatively unaffected (SECS 0.5384 to 0.5304).
    confidence: high
    relevance: medium
  limitations:
  - Reported WER remains high (35.68-36.24% in the full-resource setting), and the paper's own subjective MOS audio-quality
    test (without speaker context) ranks the proposed Mel-based vocoder below the unit-based baseline, indicating
    the speaker-preservation gains are not accompanied by a clear audio-quality win in isolation.
  - The paper requires the same heavy mouth-region preprocessing pipeline as AV-HuBERT, which the authors note limits
    real-time applicability (§8, Limitations). Evaluation is restricted to English-only corpora (LRS2, LRS3); the
    authors explicitly flag multilingual generalization as untested due to compute constraints. The model's WER
    substantially trails dedicated ASR or text-conditioned TTS systems, reflecting the inherent difficulty of inferring
    content purely from lip movements without textual or acoustic priors. Latency analysis (§6) shows the conformer
    module, while improving intelligibility, reduces throughput relative to a no-conformer variant, an explicit
    accuracy/speed trade-off the paper surfaces but does not resolve.
  caveats: []
- id: 2025.findings-naacl.471
  entry_date: '2026-07-29'
  year: 2025
  venue: NAACL
  task:
  - evaluation
  architecture: []
  relevance: medium
  evidence_role:
  - architecture_variant
  - control_evidence
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: prosodic_cues_in_natural_speech_carry_information_sufficient_to_partially
    role: supports
    claim: Prosodic cues in natural speech carry information sufficient to partially guide spoken comprehension
      models above chance level.
    source: §4.1, Table 2
    evidence: A WavLM-based SQA model trained and tested on 300 Hz low-pass filtered (prosodic condition) audio
      achieves FF1 18.49 on SLUE-SQA-5 test, substantially above the white-noise chance baseline of 6.03.
    confidence: high
    relevance: medium
  - claim_id: ssl_based_spoken_language_models_do_not_effectively_leverage_prosodic
    role: complicates
    claim: SSL-based spoken language models do not effectively leverage prosodic information when lexical cues are
      simultaneously available, even when lexical data is a small minority of training.
    source: §4.2, Figure 5
    evidence: When only 10% of training data carries lexical information and 90% is prosodic, models rapidly shift
      toward lexical strategies, with lexical and natural evaluation losses converging near prosodic-only levels
      within training.
    confidence: high
    relevance: high
  - claim_id: the_use_of_tts_synthesised_speech_in_sqa_training_data
    role: complicates
    claim: The use of TTS-synthesised speech in SQA training data may not capture the prosodic characteristics of
      natural speech, limiting the study of prosody in comprehension models.
    source: §1, §3.1
    evidence: The paper selects SLUE-SQA-5 specifically because prior SQA datasets relied on TTS synthesis, whose
      prosodic properties differ from natural speech; the prosodic condition experiments are only valid under the
      natural-speech assumption.
    confidence: high
    relevance: medium
  - claim_id: prosodic_cues_in_sqa_are_at_least_partially_question_sensitive
    role: refines
    claim: Prosodic cues in SQA are at least partially question-sensitive rather than globally highlighting salient
      passage regions.
    source: §4.1, Table 4
    evidence: Random pairing of questions and contexts in the prosodic condition reduces FF1 from 18.49 to 9.77,
      showing the model's prosodic utilization depends on question-context alignment, not only on passage-level
      salience signals.
    confidence: high
    relevance: medium
  limitations:
  - 'The prosodic and lexical conditions cannot achieve perfect information separation: the 300 Hz low-pass filter
    retains some residual lexical information (WER ~57% at 300 Hz cut-off), and flattening F0/intensity preserves
    rhythm. Results for the prosodic condition therefore reflect a lower bound on prosodic-only performance, and
    the lexical condition''s prosodic residue may slightly inflate cross-condition scores.'
  - The study uses extractive SQA where answers are timestamped spans in spoken passages. This frames prosody as
    a localization cue; its role in open-ended or inferential comprehension tasks is not addressed. The choice of
    deeper WavLM layers (stronger semantic encoding) likely underrepresents prosodic information relative to earlier
    layers, which may encode prosody more directly. The corpus (Spoken Wikipedia) is read-aloud speech, so findings
    may not generalize to conversational or spontaneous speaking styles where prosody is more variable and communicatively
    richer.
  caveats: []
