reassessment_queue:
- id: continuous_features_outperform_discrete_units_on_discrimination
  type: claim_status
  reason: Only a small set of matched comparisons separates representation form from rate and model capacity.
  trigger: Matched continuous-versus-discrete studies reproduce the result across discriminative and generative
    tasks.
  due: 2026-10
  current_assessment: emerging
  watch_for:
  - Rate-controlled representation studies
  - Speaker-sensitive task comparisons
- id: pretraining_scale_benefits_are_not_universal
  type: claim_status
  reason: Speech scaling behavior varies across architectures, tokenizers, and academic compute regimes.
  trigger: Independent scaling studies converge on predictive compute/data boundaries across speech architectures.
  due: 2026-10
  current_assessment: contested
  watch_for:
  - Reproduced speech scaling laws
  - Data-quality-adjusted scaling studies
- id: automatic_judges_are_unreliable_for_fine_grained_prosody
  type: benchmark_validity
  reason: The evidence directly disputes general-purpose audio-language-model reliability for fine prosodic judgments.
  trigger: Listener-calibrated benchmarks demonstrate reliable raw-acoustic and paralinguistic scoring.
  due: 2026-10
  current_assessment: contested
  watch_for:
  - Listener-calibrated audio judges
  - Fine-grained prosody benchmarks
- id: hybrid_semantic_acoustic_ssl_systems
  type: method_family
  reason: The family combines several placements of semantic and acoustic pathways.
  trigger: Enough matched systems exist to split parallel streams, hierarchical tokens, and layer-conditioned decoders.
  due: 2026-10
  current_assessment: active_evidence
  watch_for:
  - Matched semantic-integration ablations
  - Layer-wise information probes
- id: speaker_and_prosody_leakage_persists_in_ssl_features
  type: claim_status
  reason: The desired level of invariance differs across recognition, TTS, VC, and dialogue.
  trigger: Task-conditioned studies quantify beneficial versus harmful leakage across applications.
  due: 2026-10
  current_assessment: strongly_supported
  watch_for:
  - Task-specific invariance studies
  - Causal representation interventions
open_questions:
- Which SSL objective and model layer best balances linguistic abstraction with speaker, prosodic, and acoustic
  information?
- When should speech representations remain continuous, and when does quantization improve downstream modelability
  enough to justify information loss?
- How should multilingual pretraining data be allocated to avoid systematic degradation for low-resource languages
  and accents?
- Can one pretrained speech representation serve recognition, synthesis, conversion, dialogue, and evaluation without
  task-specific compromises?
- How much downstream performance comes from representation quality versus decoder capacity, prompting, adapters,
  or supervised fine-tuning?
- What evaluation protocol can measure semantic content, acoustic fidelity, speaker information, robustness, and
  generative usefulness jointly?
trend_notes:
- SSL speech representations have shifted from recognition-oriented encoders toward core interfaces for generative
  and conversational models.
- Discrete semantic units became increasingly common after 2022 as speech language modeling expanded.
- Recent systems increasingly combine SSL semantic features with separate acoustic codec or generative-decoder pathways.
- Multilingual and multimodal pretraining expanded rapidly in 2024–2025, while balanced low-resource coverage remains
  unresolved.
- Evaluation is moving beyond linear probes toward generation quality, robustness, information leakage, and task-specific
  adaptation behavior.
