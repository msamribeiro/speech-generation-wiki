    caveats:
    - 'FairDialogue (2510.02352) is listed as refining: its finding (single-turn evaluation understates multi-turn bias) supports
      the general degradation pattern but in the bias dimension specifically, not coherence or recall.'
  - ref: speech-to-speech#paralinguistic_semantic_capability_gap
    proposition: Current speech-to-speech and spoken dialogue systems exhibit a persistent capability gap between semantic/content
      understanding and paralinguistic or non-verbal audio understanding (emotion, ambient sound, speaker traits), with paralinguistic
      dimensions consistently underperforming.
    baseline_assessment:
