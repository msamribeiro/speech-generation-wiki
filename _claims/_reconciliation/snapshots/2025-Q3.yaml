  - ref: speech-to-speech#model_scale_doesnt_predict_quality
    proposition: Parameter count and model scale do not reliably predict speech-to-speech / spoken dialogue quality; smaller,
      well-trained or well-designed models can match or exceed much larger counterparts on naturalness and task performance.
    baseline_assessment:
      status: emerging
      confidence: medium
      supporting_papers:
