  proposition: Speech-system evaluations should report separately the dimensions material to the task—for example, semantic
    correctness and intelligibility, naturalness, speaker identity, prosody or expression, and, for interactive systems, turn-taking
    or other interaction behavior. Transcript-only scores or a single aggregate quality score can conceal failures on unmeasured
    dimensions and cannot reveal when an improvement on one dimension degrades another.
