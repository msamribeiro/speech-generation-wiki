  claim_clusters:
  - ref: rlhf-speech#composite_multiobjective_rewards_outperform_single_metric_but_need_balancing
    proposition: RL or preference-optimization reward functions that jointly target multiple speech quality dimensions (intelligibility,
      speaker similarity, emotion, prosody) outperform single-metric rewards, which improve only their targeted dimension
      and can degrade complementary ones, but balancing multiple reward terms remains a nontrivial, often under-ablated engineering
      problem.
    baseline_assessment: null
    cutoff_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
      - '2507.21138'
      - '2508.16332'
      - '2509.00685'
      - interspeech-2025-0704
      contradicting_papers: []
      refining_papers: []
    caveats:
    - '2508.16332 (Vevo2) is the clearest negative case: intelligibility-only GRPO reward dropped melody accuracy from 65%
      to 50%, only resolved by joint multi-objective reward design.'
  - ref: rlhf-speech#differentiable_reward_backprop_cheaper_than_policy_gradient
    proposition: Backpropagating gradients from a frozen differentiable reward/critic model through discrete speech tokens
      via Gumbel-Softmax achieves comparable or better alignment gains than PPO-style policy-gradient RL or standard DPO,
      at lower computational cost, by avoiding multi-sample rollout or multi-forward-pass overhead.
    baseline_assessment:
      status: emerging
      confidence: medium
      supporting_papers:
      - '2412.10117'
      - '2505.17589'
      contradicting_papers: []
      refining_papers: []
    cutoff_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
      - '2412.10117'
      - '2505.17589'
      - interspeech-2025-0704
      contradicting_papers: []
      refining_papers: []
    caveats:
    - 'Validated only within the CosyVoice architecture family (CosyVoice 2, CosyVoice 3, and the Interspeech DiffRO paper
      all build on the same lineage): no independent replication on an unrelated backbone yet.'
  - ref: rlhf-speech#dpo_adapts_to_non_autoregressive_ctc_decoders
    proposition: DPO-style preference optimization can be adapted to non-autoregressive, CTC-trained discrete- unit speech
      decoders to improve a targeted qualitative attribute (e.g. emotional coherence) without requiring an auxiliary control
      module.
    baseline_assessment: null
    cutoff_assessment:
      status: emerging
      confidence: high
      supporting_papers:
      - '2501.04561'
      contradicting_papers: []
      refining_papers: []
    caveats:
    - Single-paper finding (OpenOmni); the CTC-DPO contribution is one component of a broader omnimodal LLM system, and the
      preference dataset used is synthesized rather than human-labeled.
  - ref: rlhf-speech#grpo_extends_to_non_autoregressive_tts
    proposition: GRPO/policy-gradient RL, originally developed for discrete-token generation, can be extended to non-autoregressive
      flow-matching TTS pipelines by reformulating a continuous output as a probabilistic (Gaussian) distribution or by applying
      RL to a discrete upstream subcomponent, yielding measurable WER/SIM gains.
    baseline_assessment:
      status: emerging
      confidence: low
      supporting_papers:
      - '2504.02407'
      contradicting_papers: []
      refining_papers: []
    cutoff_assessment:
      status: emerging
      confidence: medium
      supporting_papers:
      - '2504.02407'
      - '2507.14988'
      contradicting_papers: []
      refining_papers: []
    caveats:
    - 'Both papers apply RL to a narrow, isolated component (F5R-TTS: the final output layer; DMOSpeech2: only the duration
      predictor) rather than the full flow-matching generation process.'
  - ref: rlhf-speech#image_domain_rl_techniques_transfer_poorly_to_speech
    proposition: RL/regularization techniques developed for text-to-image diffusion alignment (e.g. plain KL- divergence regularization)
      transfer poorly to speech diffusion TTS, because audio generation requires stronger temporal coherence than image synthesis;
      incorporating the model's own diffusion training loss as a penalty term in the reward function works better.
    baseline_assessment: null
    cutoff_assessment:
      status: emerging
      confidence: high
      supporting_papers:
      - interspeech-2025-0063
      contradicting_papers: []
      refining_papers: []
    caveats:
    - 'Single-paper finding (DLPO) benchmarked against 4 image-domain RL baselines (DDPO, DPOK, KLinR, RWR) on a single-speaker
      dataset with a relatively simple diffusion TTS backbone (WaveGrad 2R): untested on more capable flow-matching or score-based
      TTS systems.'
  - ref: rlhf-speech#intrinsic_backbone_reward_sufficient_for_alignment
    proposition: An intrinsic reward signal derived from a speech LM's own output probability distribution (without an external
      reward model, human annotations, or ground-truth speech) is sufficient to drive meaningful post-training alignment,
      when combined with fine-grained trajectory-level (rather than sequence-level) optimization.
    baseline_assessment: null
    cutoff_assessment:
      status: emerging
      confidence: high
      supporting_papers:
      - '2508.15442'
      contradicting_papers: []
      refining_papers: []
    caveats:
    - 'Single-paper finding (GOAT) using a GFlowNet trajectory-balance objective, a distinct paradigm from every other paper
      in the corpus: no second paper yet replicates or extends GFlowNet-based intrinsic-reward alignment for speech.'
    - The paper's own authors acknowledge the core assumption (that the backbone LM assigns higher probability to higher-quality
      sequences) as a hypothesis, not a proven property.
  - ref: rlhf-speech#iterative_human_preference_optimization_recovers_rl_induced_degradation
    proposition: When RL post-training optimized for a verifiable proxy reward degrades an unmeasured perceptual quality,
      a subsequent small-scale iterative human preference optimization (DPO) stage using only a few hundred preference pairs
      per round can recover much of the lost quality, though gains across rounds are not strictly monotonic and can saturate
      or reverse.
    baseline_assessment: null
    cutoff_assessment:
      status: emerging
      confidence: high
      supporting_papers:
      - '2509.18531'
      contradicting_papers: []
      refining_papers: []
    caveats:
    - 'Single-paper finding (Prosody-GRPO); evaluated on a narrow scope (single fine-tuned speaker voice, Korean call-center
      dialogue, 50-utterance test set, 27 raters): the generality of the recovery effect across domains/languages is untested.'
  - ref: rlhf-speech#lm_level_rlhf_cannot_fix_post_lm_pipeline_quality
    proposition: In cascaded TTS pipelines where an LM component is followed by a separate flow-matching/vocoder stage, RLHF
      applied only at the LM/token level has limited ability to improve final audio quality attributes (MOS, speaker characteristics)
      that are primarily determined by the downstream, frozen post-LM stages.
    baseline_assessment: null
    cutoff_assessment:
      status: emerging
      confidence: high
      supporting_papers:
      - interspeech-2025-0704
      contradicting_papers: []
      refining_papers: []
    caveats:
    - Single-paper finding; the paper shows DiffRO can shift codec-level predicted MOS substantially but the final audio MOS
      change after the frozen flow-matching+vocoder stages is comparatively modest, implying a structural ceiling on LM-level-only
      RLHF in cascaded architectures.
  - ref: rlhf-speech#preference_optimization_extends_to_continuous_generative_tts
    proposition: DPO-style preference optimization, originally formulated for discrete autoregressive token sequences, can
      be reformulated for continuous or iterative-denoising generative TTS architectures (flow-matching, diffusion, autoregressive-diffusion
      hybrids) by operating in velocity space, marginalizing over intermediate diffusion states, or applying local win/lose
      preference supervision at each denoising step, without requiring an external reward model.
    baseline_assessment: null
    cutoff_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
      - 2025.acl-long.598
      - '2509.18928'
      - '2509.25416'
      contradicting_papers: []
      refining_papers: []
    caveats:
    - 2509.25416 (EASPO) additionally shows that endpoint-propagated preference optimization (applying preference supervision
      only to the final output) underperforms local, stepwise supervision, because the assumption that intermediate states
      toward a preferred output are themselves preferred does not reliably hold.
    - Each of the 3 papers validates on a different, non-overlapping backbone (F5-TTS/MaskGCT, DiTAR, Grad-TTS); no cross-backbone
      replication yet.
  - ref: rlhf-speech#preference_optimization_improves_slm_semantic_coherence
    proposition: Preference optimization (DPO) with semantic-quality feedback (LLM scoring or synthetic preference data) improves
      long-range semantic coherence and generation quality in textless spoken language models beyond next-token pretraining,
      more effectively than perplexity-based selection.
    baseline_assessment: null
    cutoff_assessment:
      status: emerging
      confidence: high
      supporting_papers:
      - 2025.acl-long.997
      - 2025.findings-acl.631
      contradicting_papers: []
      refining_papers:
      - 2025.acl-long.997
    caveats:
    - '2025.acl-long.997 (AlignSLM) itself refines this claim: semantic gains do not transfer uniformly to lexical/grammatical
      correctness (sBLIMP), and even the best preference-optimized variant remains behind a cascaded ASR+LLM topline.'
  - ref: rlhf-speech#preference_pair_construction_determines_dpo_success
    proposition: The construction strategy for DPO/preference training pairs in speech generation (checkpoint diversity, cross-model
      vs. self-comparison sourcing, natural vs. synthetic pairing, automatic scoring of noisy intermediate states) has a first-order
      effect on alignment outcome quality, independent of the DPO objective itself.
    baseline_assessment:
      status: emerging
      confidence: low
      supporting_papers:
      - '2406.00654'
      contradicting_papers: []
      refining_papers: []
    cutoff_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
      - 2025.acl-long.598
      - 2025.icnlsp-1.34
      - '2406.00654'
      - '2509.14946'
      - '2509.18928'
      - '2509.25416'
      contradicting_papers: []
      refining_papers: []
    caveats:
    - '2025.icnlsp-1.34 found DPO from an ASR-fine-tuned checkpoint underperforms DPO from the base model because standard
      fine-tuning narrows generation diversity, leaving insufficient variation for the preference signal: a direct mechanistic
      explanation for why 2406.00654 (UNO) argues pairwise DPO is impractical for codec TTS in the first place.'
  - ref: rlhf-speech#reward_model_training_benefits_from_rl_and_reward_shaping
    proposition: Training automatic reward models / evaluators for speech RLHF benefits from RL-based training (over plain
      supervised fine-tuning) and from carefully shaped, nonlinear reward functions and chain-of-thought reasoning, mirroring
      patterns established in text-domain RLHF.
    baseline_assessment:
      status: emerging
      confidence: medium
      supporting_papers:
      - '2505.09558'
      contradicting_papers: []
      refining_papers: []
    cutoff_assessment:
      status: emerging
      confidence: medium
      supporting_papers:
      - '2505.09558'
      contradicting_papers: []
      refining_papers: []
    caveats:
    - Single-paper finding; 2508.08957 (QAMRO) trains a comparable audio-quality predictor but with a ranking loss rather
      than RL, so it does not independently corroborate the RL-specific portion of this claim.
  - ref: rlhf-speech#rl_posttraining_for_streaming_s2s_translation
    proposition: For streaming/simultaneous end-to-end speech-to-speech translation, RL post-training combining fine-grained
      process rewards with holistic outcome rewards improves latency more substantially than translation quality, and outperforms
      cascaded commercial systems on both dimensions.
    baseline_assessment: null
    cutoff_assessment:
      status: emerging
      confidence: high
      supporting_papers:
      - '2507.17527'
      contradicting_papers: []
      refining_papers: []
    caveats:
    - Single-paper finding from a proprietary system (SeedLiveInterpret) with no public weights or reproducible baseline;
      the RL framework is specialized for chunk-level read-write policies and duration-matching rewards specific to simultaneous
      interpretation.
  - ref: rlhf-speech#rlhf_alignment_bounded_by_base_model_capability
    proposition: 'Gains from preference or reward-based alignment are ultimately bounded by the base model''s underlying capability:
      iterative alignment rounds show diminishing returns, and RL-optimized systems approach but do not fully close the gap
      to oracle best-of-N or cascaded-system toplines.'
    baseline_assessment: null
    cutoff_assessment:
