  - ref: rlhf-speech#rlhf_reward_hacking_risk
    proposition: RL/RLHF post-training for speech generation optimized against an automatically measured proxy reward is prone
      to reward hacking, degrading unmeasured or complementary perceptual qualities (prosody naturalness, emotional appropriateness,
      non-targeted objectives) unless explicitly counteracted.
    baseline_assessment:
