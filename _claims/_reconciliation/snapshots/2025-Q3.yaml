    caveats:
    - CFG doubles inference compute per step; in low-NFE regimes the compute cost of CFG is proportionally larger.
    - The guidance strength hyperparameter has no principled selection criterion and is typically tuned empirically per system.
    - MegaTTS 3 shows that decoupling text and speaker guidance scales into independent CFG parameters produces an emergent,
      continuous accent-intensity control axis without any accent labels in training, extending CFG's role beyond binary conditional/unconditional
      interpolation; UmbraTTS (2509.14684) independently demonstrates the same decoupling pattern for speaker vs. environment
      attributes.
    - 'A 2025 paper (2509.19668) directly contradicts the ''transfers cleanly'' framing of this cluster: CFG strategies effective
      in image generation do not transfer directly to zero-shot TTS speaker similarity, and require separated-condition, time-varying
      guidance scheduling (standard CFG in early timesteps, speaker-emphasized CFG later) to be effective; the paper further
      finds this fix is itself dependent on the underlying model''s text-representation architecture, with effectiveness diverging
      across languages, and that inference-time CFG tuning alone cannot close the gap between open-weight and closed-source
      systems. Status changed from strongly_supported to contested pending further evidence (see reassessment_queue).'
    - Hybrid CFG (interspeech-2025-0455), which decouples the unconditional branch to a frozen base-model checkpoint, and
      VoxCPM's diffusion decoder (2509.24650) both confirm a non-monotonic guidance-strength trade-off (too little or too
      much guidance degrades both intelligibility and speaker similarity), consistent with the naive-transfer difficulties
      reported by 2509.19668 even where the systems do not describe their finding as a contradiction of CFG's usefulness per
      se.
  - ref: flow-matching#continuous_ar_fm_efficiency_gains
    proposition: Replacing the discrete-token interface between an autoregressive language model and its acoustic decoder
      with continuous representations and a flow-matching or diffusion output head — via an AR-conditioned informative prior,
      continuous VAE latents that shorten the AR sequence, or block-wise AR generation with parallel intra-block denoising
      — reduces AR decoding steps or per-token function evaluations relative to discrete-token autoregressive TTS, without
      sacrificing quality.
    baseline_assessment: null
    cutoff_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
