  - ref: speech-to-speech#llm_judge_automated_eval_limits
    proposition: Automated LLM-as-judge and other automatic metrics for spoken dialogue quality correlate with human judgment
      only under certain conditions (large score gaps, text-only cues) and are unreliable for paralinguistic, non-verbal,
      or near-tied comparisons.
    baseline_assessment: null
