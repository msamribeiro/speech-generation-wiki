      - '2509.22243'
      - interspeech-2025-0739
      contradicting_papers: []
      refining_papers: []
    caveats:
    - OmniFlatten's contribution here (2410.17799) is a caveat on its own headline result (user turn-taking accuracy below
      55% at the harder evaluation point), not a dedicated turn-taking study.
  - ref: speech-to-speech#full_duplex_responsiveness_floorholding_tradeoff
    proposition: Full-duplex spoken dialogue systems face an inherent trade-off between fast, low-latency responsiveness/interruption
      handling and semantic coherence or floor-holding robustness; no current system achieves strong performance on both simultaneously
      across interaction scenarios.
    baseline_assessment:
      status: emerging
      confidence: low
      supporting_papers:
