- id: broader_semantic_acoustic_hierarchies_balance_coherence_and_fidelity
  proposition: 'In hierarchical speech generation, semantic representations carry word content and longer-range linguistic
    structure, while acoustic codec tokens carry speaker, prosodic, and waveform detail. Conditioning acoustic reconstruction
    on semantic representations can improve linguistic coherence without discarding all fine acoustic information, but the
    separation is incomplete: errors in the semantic stage constrain later reconstruction, and overly strong semantic objectives
    can suppress prosody or speaker cues.'
