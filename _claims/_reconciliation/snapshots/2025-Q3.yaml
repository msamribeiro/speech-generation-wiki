  - ref: disentanglement#orthogonality_constraints_stabilize_multiattribute_disentanglement
    proposition: Explicit orthogonality constraints between attribute embedding spaces, such as speaker, emotion, and content,
      provide a more stable and directly interpretable disentanglement mechanism than mutual-information-based or purely adversarial
      losses.
    baseline_assessment: null
    cutoff_assessment:
      status: strongly_supported
