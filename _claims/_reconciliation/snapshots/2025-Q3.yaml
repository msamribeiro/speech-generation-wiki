- id: broader_full_duplex_responsiveness_trades_against_floor_holding
  proposition: Across evaluated full-duplex dialogue systems, reacting more quickly to user speech or barge-ins makes it harder
    to distinguish genuine interruptions from brief overlaps or backchannels. This can cause the system to stop speaking or
    yield its turn prematurely. Systems that preserve their ongoing response and semantic coherence tend to react more slowly
    to genuine interruptions; no evaluated system performs strongly on both behaviors across interaction scenarios.
