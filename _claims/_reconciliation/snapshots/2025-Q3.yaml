- id: broader_automatic_judges_require_scoped_human_validation
  proposition: Automatic speech evaluators—including LLM or audio-language-model judges and learned task- or quality-specific
    metrics—can reproduce some human rankings when systems are clearly separated and evaluation conditions match the evaluator’s
    validation domain. Their agreement degrades for near-tied systems, utterance-level prosody or emotion, non-verbal or paralinguistic
    cues, and domain shifts. They should therefore be validated against human ratings for the same task, domain, attribute,
    and scoring granularity before their scores are treated as substitutes for listener evaluation.
