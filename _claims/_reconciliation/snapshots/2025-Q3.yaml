      DiffRO: Japanese, Korean) from an English+Chinese/Mandarin training base: broader multilingual coverage is untested.'
  - ref: rlhf-speech#rlhf_alignment_is_data_and_compute_efficient
    proposition: Preference or reward-based post-training for speech generation can achieve substantial quality gains using
      only a small fraction of pretraining-scale data, compute, or update steps, and a single fine-tuning run can match or
      exceed the gains from inference-time best-of-K sampling or iterative rejection-sampling fine-tuning (RAFT).
    baseline_assessment:
      status: emerging
      confidence: medium
      supporting_papers:
