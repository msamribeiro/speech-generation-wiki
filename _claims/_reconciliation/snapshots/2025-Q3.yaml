      benchmark; treated here as two data points because v1.5 adds a genuinely new prosodic-adaptation dimension, but the
      underlying system pool overlaps substantially.
  - ref: speech-to-speech#internal_interruption_detection_beats_external_vad
    proposition: Integrating interruption / turn-taking detection internally within the dialogue model (rather than relying
      on an external VAD module) yields more robust barge-in and interruption handling.
