- id: broader_full_duplex_requires_joint_interaction_modeling
  proposition: 'Natural full-duplex dialogue requires two distinct capabilities: concurrently processing incoming audio while
    generating speech, and controlling the interaction by deciding whether to continue speaking, yield the turn, respond to
    an interruption, or interpret overlapping speech as a backchannel. An architecture that merely permits simultaneous input
    and output does not by itself establish effective turn-taking.'
