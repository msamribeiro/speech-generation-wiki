  claim_clusters:
  - ref: flow-matching#ar_fm_hybrid_emotion_representation_richness
    proposition: In hybrid autoregressive-plus-flow-matching TTS architectures, richer or multi-format emotion/style conditioning
      — combining discrete and continuous emotion representations, orthogonalizing speaker and emotion embedding spaces, or
      deep hidden-state-level fusion between the AR and FM stages — measurably improves emotional expressiveness or phonetic
      clarity under emotional expressiveness beyond what a single conditioning format achieves.
    baseline_assessment: null
    cutoff_assessment:
      status: emerging
      confidence: medium
      supporting_papers:
      - '2505.10599'
      - '2508.02038'
      contradicting_papers: []
      refining_papers:
      - '2506.21619'
    caveats:
    - The two supporting papers pursue different mechanisms (combining discrete emotion labels with continuous dimensional
      emotion representations vs. orthogonalizing speaker/emotion embedding spaces via a cross-dot-product loss) united by
      the shared finding that a single conditioning format under-serves emotional expressiveness in hybrid AR+FM systems.
    - 'The refining paper (2506.21619) reports a related but narrower finding: GPT-latent fusion between the AR semantic module
      and the FM acoustic module improves phonetic clarity specifically under high emotional expressiveness, as measured by
      WER on an emotional test set, rather than improving expressiveness itself.'
    - None of the three papers directly compare their mechanism against the others; whether these approaches are complementary
      or converge on the same underlying fix for emotion-expressiveness limitations in hybrid architectures is untested.
  - ref: flow-matching#ar_fm_hybrid_style_timbre_decoupling
    proposition: Hybrid architectures that separate autoregressive style token generation from flow-matching acoustic decoding
      achieve stronger decoupling of style and timbre attributes than single-stage flow-matching systems conditioned in-context.
    baseline_assessment:
      status: emerging
