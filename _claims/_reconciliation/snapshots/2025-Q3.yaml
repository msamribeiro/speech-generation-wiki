    caveats:
    - LLaMA-Omni 2's two paper entries (2505.02625, arXiv preprint, and 2025.acl-long.912, ACL camera-ready) are the same
      underlying work; counted as one independent data point toward this cluster, not two.
  - ref: speech-to-speech#multiturn_dialogue_degradation
    proposition: Current spoken dialogue systems degrade across multi-turn interactions, failing to sustain emotional coherence,
      informational density, or long-range context recall as conversations lengthen.
    baseline_assessment: null
    cutoff_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
