    caveats:
    - The style-timbre decoupling advantage comes at the cost of sequential decoding latency from the AR stage, making these
      systems less suitable for real-time applications.
    - Evaluation of decoupling quality relies on automatic speaker similarity metrics and style MOS ratings, whose reliability
