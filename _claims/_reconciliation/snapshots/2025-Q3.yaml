      confidence: medium
      supporting_papers:
      - '2502.11946'
      contradicting_papers: []
      refining_papers:
      - 2025.acl-long.682
    caveats:
    - 2025.acl-long.682 is a survey citing this pattern from secondary sources (AlignSLM, SpeechAlign) rather than presenting
      independent primary evidence, so this cluster currently rests on one primary-research data point (Step-Audio's 'deaf
      hacking' finding) plus one literature-review corroboration.
