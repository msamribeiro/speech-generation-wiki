    - Marco-Voice (2508.02038) demonstrates a distinct decoupling mechanism — an explicit cross-dot-product orthogonality
      loss between speaker and emotion embedding spaces, rather than architectural separation of AR style tokens from FM acoustic
      decoding — achieving independent control of voice identity and emotional style within a single hybrid model; the paper's
      own novelty assessment describes this as primarily an engineering recipe rather than a new decoupling principle.
