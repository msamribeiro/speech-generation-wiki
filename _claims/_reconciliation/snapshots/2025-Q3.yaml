  - ref: rlhf-speech#rlhf_alignment_generalizes_crosslingually
    proposition: Preference- or reward-based alignment trained on a small set of high-resource languages generalizes intelligibility/quality
      gains to unseen languages without requiring language- specific alignment data.
    baseline_assessment: null
    cutoff_assessment:
      status: emerging
      confidence: medium
      supporting_papers:
