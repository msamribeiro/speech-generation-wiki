      contradicting_papers: []
      refining_papers:
      - '2506.21875'
    caveats: []
  - ref: speech-to-speech#rag_tool_use_mixed_benefit
    proposition: Retrieval augmentation and external tool calling can improve knowledge-intensive spoken question answering
      and reduce hallucination in spoken dialogue agents without retraining the core model, but retrieval augmentation does
      not reliably improve multi-turn conversational context recall specifically.
    baseline_assessment:
      status: emerging
      confidence: low
      supporting_papers:
      - '2506.23049'
      contradicting_papers: []
      refining_papers: []
    cutoff_assessment:
      status: contested
      confidence: medium
      supporting_papers:
      - '2506.23049'
      - '2507.16632'
      contradicting_papers:
      - 2025.findings-acl.470
      refining_papers: []
    caveats:
    - 'The apparent disagreement is plausibly a scope difference rather than a true contradiction: AURA and Step-Audio2 test
      RAG for knowledge-intensive QA and tool invocation, while ContextDialog tests RAG specifically for recalling prior conversational
      turns; both may be true simultaneously. Kept as contested rather than silently split into two claims because both papers
      frame their finding as a general statement about RAG''s value for spoken agents.'
  - ref: speech-to-speech#s2st_streaming_training_strategies
    proposition: For simultaneous / streaming speech-to-speech translation, targeted training strategies, offline training
      with test-time simultaneous decoding policies, gradual modality-transition fine-tuning, or reinforcement learning, can
      match or exceed systems trained end-to-end for streaming, though each introduces its own new trade-off (latency overhead,
      reward exploitation, or evaluation-metric mismatch).
    baseline_assessment: null
    cutoff_assessment:
      status: strongly_supported
      confidence: medium
      supporting_papers:
      - 2025.acl-long.817
      - '2507.17527'
      - interspeech-2025-1595
      contradicting_papers: []
      refining_papers: []
    caveats:
    - Seed-LiveInterpret (2507.17527) is a fully proprietary system (undisclosed data, weights, and baseline identities);
      its headline comparison against commercial cascades should be treated as a frontier claim pending independent replication.
  - ref: speech-to-speech#semantic_acoustic_token_tradeoff
    proposition: Semantic speech tokens provide tighter text-speech alignment and better LLM compatibility but sacrifice acoustic
      and paralinguistic fidelity relative to acoustic codec tokens, creating a persistent trade-off in speech LM tokenizer
      design.
    baseline_assessment:
      status: strongly_supported
      confidence: medium
      supporting_papers:
      - '2410.03751'
      - '2411.13577'
      - '2412.15649'
      - '2504.08528'
      contradicting_papers: []
      refining_papers:
      - '2410.00037'
    cutoff_assessment:
      status: strongly_supported
      confidence: medium
      supporting_papers:
      - 2025.findings-acl.115
      - '2410.03751'
      - '2411.13577'
      - '2412.15649'
      - '2504.08528'
      contradicting_papers: []
      refining_papers:
      - '2410.00037'
    caveats:
    - Three of the five supporting entries (2410.03751, 2411.13577, 2504.08528) are survey papers synthesizing the same underlying
      tokenizer literature rather than independent primary evidence; treat the effective independent support as closer to
      2-3 papers, not 5.
    - 'Moshi (2410.00037) is listed as refining rather than contradicting: it argues joint acoustic+semantic modeling is necessary
      precisely because semantic-only tokens cannot capture paralinguistic information, which sharpens rather than opposes
      the trade-off claim.'
  - ref: speech-to-speech#speech_text_interleaving_improves_alignment
    proposition: Interleaving or jointly training on speech and text tokens (rather than speech-only training) measurably
      improves cross-modal semantic alignment and transfers text-LLM reasoning capability to the speech modality.
    baseline_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
      - '2402.05755'
      - '2410.03751'
      - '2411.17607'
      contradicting_papers: []
      refining_papers: []
    cutoff_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
      - '2402.05755'
      - '2410.03751'
      - '2411.17607'
      contradicting_papers: []
      refining_papers: []
    caveats:
    - ScheduledILT (interspeech-2025-1595) demonstrates a closely related interleaving benefit but is scoped to S2ST fine-tuning;
      it is grouped instead under the s2st_streaming_training_strategies cluster to avoid double-counting the same paper toward
      two thresholds.
  - ref: speech-to-speech#staged_pretraining_effect_on_instruction_following
    proposition: 'Whether staged, modality-specific (ASR/TTS) pretraining before joint spoken-dialogue fine-tuning helps or
      harms an end-to-end speech LM''s instruction-following ability is unresolved: some systems find single-stage training
      directly on dialogue data outperforms staged pretraining, while others find staged pretraining necessary to reduce intelligence
      and instruction-following degradation.'
    baseline_assessment:
      status: contested
      confidence: medium
      supporting_papers:
      - '2502.17239'
      contradicting_papers:
      - '2412.15649'
      refining_papers:
      - '2410.11190'
      - '2411.00774'
    cutoff_assessment:
      status: contested
      confidence: medium
      supporting_papers:
      - '2502.17239'
      contradicting_papers:
      - 2025.findings-acl.115
      - '2412.15649'
      refining_papers:
      - '2410.11190'
      - '2411.00774'
    caveats:
    - SLAM-Omni's two paper entries (2412.15649, arXiv preprint, and 2025.findings-acl.115, ACL Findings camera-ready) are
      the same underlying work; they are counted as one independent data point against this cluster, not two, per the arXiv-full-version-dedup
      precedent.
    - 'The tension is confounded by model scale (SLAM-Omni: 0.5B Qwen2 backbone; Baichuan-Audio: 7B backbone) and by differing
      training regimes (single-stage dialogue-only fine-tuning vs. frozen-then-joint staged pretraining), so the disagreement
      may partly reflect scale-dependent effects rather than a clean contradiction. Flagged in reassessment_queue pending
      a scale-matched ablation.'
    - Mini-Omni2 (2410.11190) and Freeze-Omni (2411.00774) both find staged or frozen-LLM training preserves capability, broadly
      consistent with Baichuan-Audio's side of the tension, but their claims are about general text-capability forgetting
      rather than instruction-following specifically, so they are listed as refining context rather than primary support.
