    proposition: Discrete flow matching defined directly over factorized speech-attribute token subspaces, using multi-head
      velocity prediction with a separate head per subspace, can achieve competitive naturalness and superior prosody reconstruction
      compared to continuous-space flow-matching and diffusion TTS baselines trained on comparable data, while matching the
      inference latency of single-step continuous flow-matching systems at higher NFE.
    baseline_assessment: null
