    caveats:
    - No paper in the corpus disputes that reward hacking is a real risk; disagreement (where it exists) is only about which
      mitigation works best, not whether the phenomenon occurs.
    - '2509.18531 (Prosody-GRPO) is the most extreme documented case: GRPO on a harmonic-mean CER/likelihood reward achieved
      the lowest CER of any tested system while producing the lowest human-preference ELO score, with pitch collapsing toward
      monotone speech.'
  - ref: rlhf-speech#rlhf_training_instability_requires_regularization_or_early_stopping
    proposition: RL or DPO fine-tuning of speech generation models (autoregressive or diffusion-based) is prone to training
      instability, capability collapse, or monotonic degradation of held-out quality metrics without explicit regularization
      (e.g. cross-entropy penalty) or early stopping, particularly as training progresses beyond an optimal point.
    baseline_assessment: null
    cutoff_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
      - '2509.00685'
      - '2509.18531'
      - '2509.18928'
      contradicting_papers: []
      refining_papers: []
    caveats:
    - 2509.00685 (MPO) documents catastrophic CER inflation (4.72 to 14.52) without CE regularization; 2509.18928 (ARDM-DPO)
      documents monotonically decreasing speaker similarity across all tested beta values with no principled stopping criterion;
      2509.18531 (Prosody-GRPO) documents non- monotonic ELO across iterative DPO rounds, peaking at round 2 and declining
      at round 3.
  - ref: rlhf-speech#sca_rlhf_addresses_distinct_failure_modes_from_tts_quality_alignment
    proposition: RLHF applied to spoken conversational agents / dialogue systems targets qualitatively different failure modes
      (evasive or unhelpful responses to ambiguous input, semantic inconsistency, token- distribution mismatch) than RLHF
      applied to raw TTS acoustic quality, and this direction remains substantially underexplored relative to text-LLM RLHF.
    baseline_assessment:
