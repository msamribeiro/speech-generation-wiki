- id: broader_reference_conditioning_enables_unseen_voice_transfer
  proposition: 'Reference-audio conditioning enables a synthesis or voice-conversion system to produce speech in the identity
    of a speaker excluded from the system’s training set, without speaker-specific parameter updates at inference. This establishes
    zero-shot feasibility, not uniform identity fidelity: performance varies with reference duration, content, noise, and
    channel; language or accent match; expressive style; training-speaker coverage; and the speaker encoder and listening
    protocol used to evaluate identity.'
