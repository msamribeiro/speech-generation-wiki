      DPO stage, rather than a direct efficiency claim about DPO itself: a related but distinct framing worth keeping separate
      in future review.'
  - ref: rlhf-speech#rlhf_posttraining_beats_sft_baseline
    proposition: Preference- or reward-based post-training (DPO, KTO, GRPO, differentiable-reward optimization) for TTS/SLM
      generation consistently improves intelligibility, speaker similarity, or naturalness beyond what supervised fine-tuning
      alone achieves.
