  claim_clusters:
  - ref: evaluation-metrics#automated_annotation_can_match_or_exceed_human_consistency
    proposition: Automated multimodal annotation pipelines for emotional/paralinguistic speech can match human labeling accuracy
      while exceeding human inter-rater consistency, enabling larger- scale, lower-cost dataset construction.
    baseline_assessment:
      status: emerging
      confidence: low
      supporting_papers:
      - '2505.15772'
      contradicting_papers: []
      refining_papers: []
    cutoff_assessment:
      status: emerging
      confidence: high
      supporting_papers:
      - '2505.15772'
      - interspeech-2025-0648
      - interspeech-2025-0706
      contradicting_papers: []
      refining_papers: []
    caveats:
    - 2505.15772 and interspeech-2025-0648 report closely related pipeline designs and may share dataset or authorship lineage;
      independent replication from an unrelated group would strengthen this cluster (see reassessment_queue).
  - ref: evaluation-metrics#automatic_mos_predictors_diverge_from_subjective_mos
    proposition: Automatic/neural MOS predictors (e.g. UTMOS-style SSL-based predictors, DNSMOS) can rank systems differently
      from actual subjective MOS, particularly near the quality ceiling, out-of-domain, or for non-standard synthesis paradigms.
    baseline_assessment: null
    cutoff_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
      - '2506.18296'
      - '2508.00317'
      - '2508.07711'
      - '2509.14270'
      - '2509.20485'
      - '2509.24457'
      - interspeech-2025-1066
      - interspeech-2025-2536
      contradicting_papers: []
      refining_papers: []
    caveats:
    - The ceiling/saturation effect (2508.00317, 2509.24457) is distinct from the domain- mismatch effect (2506.18296, interspeech-2025-1066)
      but both reduce to the same practical caution against treating any single automatic MOS predictor as a MOS substitute.
  - ref: evaluation-metrics#backchannel_generation_remains_unsolved
    proposition: Current full-duplex spoken dialogue models generate listener backchannels rarely and with poor timing alignment
      to human-judged reference positions.
    baseline_assessment: null
    cutoff_assessment:
      status: emerging
      confidence: high
      supporting_papers:
      - '2503.04721'
      - '2509.22243'
      contradicting_papers: []
      refining_papers: []
    caveats:
    - Only 2 independent papers so far, but both report the same near-zero backchannel frequency pattern across different
      system sets.
  - ref: evaluation-metrics#cascaded_vs_endtoend_sca_tradeoffs
    proposition: 'Cascaded (ASR+LLM+TTS) spoken dialogue pipelines and end-to-end speech LLMs show complementary rather than
      uniformly dominant strengths: cascades tend to win on semantic/content quality and output audio quality, while end-to-end
      systems tend to win on latency, with the paralinguistic-handling gap re-emerging for cascades regardless of overall
      parity.'
    baseline_assessment:
      status: strongly_supported
      confidence: medium
      supporting_papers:
      - 2025.naacl-demo.21
      - '2410.17196'
      - '2412.15649'
      - '2504.08528'
      contradicting_papers: []
      refining_papers: []
    cutoff_assessment:
      status: strongly_supported
      confidence: medium
      supporting_papers:
      - 2025.naacl-demo.21
      - '2410.17196'
      - '2412.15649'
      - '2503.04721'
      - '2504.08528'
      - '2506.21875'
      contradicting_papers: []
      refining_papers: []
    caveats:
    - The specific axis of cascade advantage differs by paper (instruction-following in 2410.17196, output audio quality in
      2025.naacl-demo.21, semantic content in 2412.15649), so this cluster aggregates a consistent qualitative pattern rather
      than a single quantitative effect size.
  - ref: evaluation-metrics#clean_indomain_benchmarks_understate_wild_performance_gap
    proposition: Evaluating speech systems only on clean, studio-quality, or in-domain benchmark data (audiobooks, neutral
      read speech, in-distribution acoustic conditions) systematically underestimates performance gaps that appear under real-world
      or in-the-wild conditions.
    baseline_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
      - '2403.16973'
      - '2410.17196'
      - '2505.17589'
      contradicting_papers: []
      refining_papers: []
    cutoff_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
      - '2403.16973'
      - '2410.17196'
      - '2504.20581'
      - '2505.17589'
      - '2509.04072'
      - interspeech-2025-0406
      - interspeech-2025-2765
      contradicting_papers: []
      refining_papers: []
    caveats:
    - Replicated across intelligibility (VoiceCraft), voice cloning (2505.17589, 2504.20581), binaural synthesis (interspeech-2025-0406),
      spoken-instruction benchmarking (VoiceBench, 2410.17196), and expressive-speech naturalness (2509.04072, interspeech-2025-2765).
  - ref: evaluation-metrics#clinical_accessibility_speech_eval_needs_domain_specific_validation
    proposition: Automatic evaluation metrics and TTS systems calibrated on typical/healthy speech do not reliably generalize
      to clinical, dysarthric, or neuroprosthetic speech applications, and require domain-specific validation before use.
    baseline_assessment: null
    cutoff_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
      - interspeech-2025-1334
      - interspeech-2025-1536
      - interspeech-2025-1726
      - interspeech-2025-2679
      contradicting_papers: []
      refining_papers: []
    caveats:
    - 'interspeech-2025-1536 additionally shows the direction of the failure is not generic degradation but systematic over-normalization:
      zero-shot TTS trained on typical speech cleans up dysarthric reference speech rather than preserving its diagnostic
      features.'
  - ref: evaluation-metrics#codec_evaluation_requires_multi_condition_protocols_beyond_clean_speech
    proposition: Neural codec evaluation using only clean-speech reconstruction metrics provides an incomplete characterization
      of codec behavior; robustness under noise, reverberation, domain shift, and bitrate variation requires dedicated multi-condition,
      multi-metric protocols.
    baseline_assessment:
      status: emerging
      confidence: low
      supporting_papers:
      - '2506.10274'
      contradicting_papers: []
      refining_papers: []
    cutoff_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
      - '2506.10274'
      - '2508.20660'
      - '2509.24457'
      - '2510.00264'
      - interspeech-2025-0115
      - interspeech-2025-0355
      contradicting_papers: []
      refining_papers: []
    caveats:
    - 'interspeech-2025-0355 adds a mechanistic explanation: codecs exhibit non-linear input- output behavior (violating additivity/homogeneity)
      that partially explains why clean- speech-derived metric rankings fail to transfer to noisy or overlapping-signal conditions.'
  - ref: evaluation-metrics#codec_reconstruction_metrics_dont_predict_downstream_generation_quality
    proposition: A neural codec's signal-reconstruction quality, as measured by standard objective metrics, does not reliably
      predict the quality of a downstream generative TTS/language model trained on its tokens.
    baseline_assessment:
      status: emerging
      confidence: medium
      supporting_papers:
      - 2025.naacl-srw.6
      - '2506.10274'
      contradicting_papers: []
      refining_papers: []
    cutoff_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
      - 2025.naacl-srw.6
      - '2506.10274'
      - '2509.21968'
      contradicting_papers: []
      refining_papers: []
    caveats:
    - '2506.10274 documents the counter-intuitive direction directly: increasing codebook count improves reconstruction but
      often degrades downstream task performance by adding representational redundancy.'
  - ref: evaluation-metrics#corpus_quality_filtering_criteria_introduce_data_distortions
    proposition: Automatic corpus-quality filtering criteria for TTS training data (WER-based rejection, fixed quality thresholds,
      segmentation choices) each introduce systematic distortions in the resulting training data distribution, independent
      of the intended quality-control goal.
    baseline_assessment:
      status: emerging
      confidence: low
      supporting_papers:
      - '1904.02882'
      contradicting_papers: []
      refining_papers: []
    cutoff_assessment:
      status: emerging
      confidence: medium
      supporting_papers:
      - '1904.02882'
      - 2025.findings-acl.534
      - interspeech-2025-0989
      contradicting_papers: []
      refining_papers: []
    caveats:
    - The three papers document distinct mechanisms (WER-filtering rejecting correct-but-ASR- mismatched data; fixed thresholds
      discarding usable quality-volume tradeoffs; segmentation confounded with corpus-version quality), so this is a convergent
      caution rather than one replicated finding.
  - ref: evaluation-metrics#deception_based_evaluation_more_discriminative_than_naturalness_scales
    proposition: Deception-rate (Turing-test-style) evaluation, asking listeners to judge whether speech is human or synthetic,
      surfaces gaps between synthetic and human speech that standard naturalness/preference scales do not.
    baseline_assessment: null
    cutoff_assessment:
      status: emerging
      confidence: high
      supporting_papers:
      - interspeech-2025-2765
      contradicting_papers: []
      refining_papers: []
    caveats:
    - Single-paper finding so far; the paper's own analysis argues CMOS/MUSHRA overestimate naturalness specifically because
