    caveats:
    - PeriodCodec reports that its own GRL-based pitch disentanglement module did not improve, and in some conditions worsened,
      subjective naturalness.
    - DiEmoTTS argues self-supervised distillation with emotion-specific inductive biases outperforms GRL- and VQ-based disentanglement
      for speaker-independent emotion embeddings, directly critiquing GRL as introducing a separation-versus-quality tension.
    - No paper in this batch reports a controlled GRL-on/GRL-off ablation on identical architecture and data isolating the
      quality effect from other confounds.
  - ref: disentanglement#objective_metrics_dont_predict_subjective_disentanglement_quality
    proposition: Objective similarity and intelligibility metrics do not reliably predict subjective perception of successful
      attribute disentanglement or control.
    baseline_assessment:
