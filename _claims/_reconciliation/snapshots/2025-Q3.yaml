      - '2409.09098'
      - interspeech-2025-1081
      contradicting_papers: []
      refining_papers: []
    caveats:
    - AccentBox separately finds that standard zero-shot TTS evaluation protocols (naturalness and speaker similarity) fail
      to detect accent hallucination altogether, underrepresenting the accent-fidelity gap this cluster's core claim describes.
    - SNCR shows speaker-similarity metrics in zero-shot VC evaluations can be artificially inflated when test-set speakers
