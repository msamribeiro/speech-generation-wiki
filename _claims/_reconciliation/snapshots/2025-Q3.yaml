  - ref: disentanglement#prompt_based_conditioning_causes_attribute_leakage
    proposition: Prompt-based conditioning in codec-language and masked generative TTS models causes measurable leakage of
      prosodic or stylistic attributes from the acoustic prompt into the synthesized output, independent of language or domain.
    baseline_assessment: null
    cutoff_assessment:
