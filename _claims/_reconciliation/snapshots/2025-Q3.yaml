      contradicting_papers: []
      refining_papers: []
    caveats:
    - The three supporting papers achieve the shared efficiency outcome via three distinct mechanisms (informative AR prior
      for per-token flow matching; continuous VAE latents replacing discrete codec tokens; block-wise AR generation with parallel
      flow-matching denoising per block); whether these mechanisms compose or are redundant alternatives is untested.
    - 'Each paper independently reports a non-monotonic relationship between the flow-matching/diffusion head''s NFE and downstream
      quality: moderate NFE improves intelligibility, but excessive NFE degrades both intelligibility and speaker similarity,
      unlike the typical acceleration-literature framing of NFE reduction as a pure quality-speed trade-off.'
    - This family is entirely composed of 2025 papers; a fourth, closely related system (VoxCPM, 2509.24650) uses an AR-conditioned
      diffusion decoder with a similar continuous-latent philosophy but its directly relevant claims concern classifier-free
      guidance behaviour rather than this specific efficiency mechanism, so it is tracked under the cfg_conditioning_mechanism_adopted
      cluster instead.
