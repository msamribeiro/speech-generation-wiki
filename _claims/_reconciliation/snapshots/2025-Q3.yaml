  - ref: autoregressive-codec-tts#alignment_failures_remain_primary_ar_robustness_limit
    proposition: Autoregressive codec TTS remains vulnerable to omissions, repetitions, insertions, and runaway decoding caused
      by text–speech alignment failures.
    baseline_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
      - '2401.07333'
      - '2406.05370'
      - '2407.08551'
      contradicting_papers: []
      refining_papers: []
    cutoff_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
      - '2401.07333'
      - '2406.05370'
      - '2407.08551'
      - '2507.16632'
      - '2508.15442'
