      - '2503.01710'
      contradicting_papers: []
      refining_papers: []
    cutoff_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
      - '2502.07243'
      - '2503.01710'
      - '2508.16332'
      - '2509.24650'
      - interspeech-2025-1106
      - interspeech-2025-2684
      contradicting_papers: []
      refining_papers:
      - interspeech-2025-1531
    caveats:
    - Discretizing speaker vectors specifically reduces speaker-identity fidelity compared to continuous speaker representations
      (DisentCodec), so bottleneck-based approaches still face the general reconstruction/fidelity trade-off documented elsewhere
      in this concept.
    - Vevo2's information-bottleneck content-style tokenizer follows the same pattern as its Vevo predecessor but is described
      only briefly and is not directly ablated in that paper.
  - ref: disentanglement#rvq_semantic_content_concentrates_early_layers
    proposition: In RVQ-based neural speech codecs, linguistic and semantic content concentrates in the first or lowest quantizer
      layers when semantic supervision or distillation is applied, allowing those layers to be used independently for content-related
      downstream tasks.
    baseline_assessment:
      status: emerging
      confidence: low
      supporting_papers:
      - '2308.16692'
      contradicting_papers: []
      refining_papers: []
    cutoff_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
      - '2308.16692'
      - '2507.12197'
      - interspeech-2025-0468
      - interspeech-2025-1639
      contradicting_papers: []
      refining_papers:
      - interspeech-2025-0115
    caveats:
    - AnCoGen finds this concentration weakens and content leaks into higher RVQ scales when the codec's frame rate is very
      low, indicating the pattern is not unconditionally robust across all operating points.
  - ref: disentanglement#signal_level_prosody_decomposition_enables_finegrained_control
    proposition: Explicit signal-level decomposition of prosodic sub-attributes, such as F0 sub-bands, periodic components,
      or wavelet-domain decomposition, enables more accurate and independently controllable prosody manipulation than implicit,
      representation-level style embeddings.
    baseline_assessment: null
    cutoff_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
      - '2507.20091'
      - interspeech-2025-0347
      - interspeech-2025-1397
      contradicting_papers: []
      refining_papers: []
    caveats:
    - The effective granularity of wavelet-based decomposition is sensitive to the decomposition level chosen, with an optimal
      level needed to capture the target sub-attribute (e.g. vibrato) without including unrelated high-frequency content (VibeSVC).
    - Increasing style/prosody transfer accuracy via explicit decomposition still trades off against naturalness in some systems
      (VibeSVC); ProsodyLM similarly reports that disentangling prosodic from linguistic content trades voice-quality fidelity
      for prosodic expressiveness and controllability.
  - ref: disentanglement#ssl_content_representations_incomplete_disentanglement
    proposition: Distillation from self-supervised speech models such as HuBERT, WavLM, or w2v-BERT narrows but does not eliminate
      paralinguistic and speaker leakage into content representations.
    baseline_assessment:
      status: emerging
      confidence: low
      supporting_papers:
      - '2104.00355'
      contradicting_papers: []
      refining_papers: []
    cutoff_assessment:
      status: emerging
      confidence: medium
      supporting_papers:
      - '2104.00355'
      - '2508.02849'
      - interspeech-2025-1440
      contradicting_papers: []
      refining_papers: []
    caveats:
    - SeCoUSTIC reports that frame-level cross-modal contrastive learning between phoneme and speech representations produces
      cleaner semantic-paralinguistic separation than a phoneme-classification distillation loss, suggesting the training
      objective (not just the SSL source) matters.
    - FreeCodec's own analysis shows incomplete prosody/speaker clustering separation despite matching supervised-codec reconstruction
      quality, illustrating that competitive reconstruction does not guarantee complete attribute separation.
