  claim_clusters:
  - ref: speech-to-speech#cascade_outperforms_e2e_on_benchmarks
    proposition: Cascaded ASR+LLM+TTS pipelines currently achieve stronger performance than end-to-end speech-to-speech systems
      on general spoken-instruction-following and reasoning benchmarks, though the gap is narrowing with backbone LLM quality
      and is concentrated in semantic/task accuracy rather than paralinguistic fidelity.
    baseline_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
      - 2025.naacl-demo.21
      - '2402.05755'
      - '2410.17196'
      - '2506.23049'
      contradicting_papers: []
      refining_papers:
      - '2411.13577'
      - '2504.08528'
    cutoff_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
      - 2025.acl-long.997
      - 2025.findings-acl.1051
      - 2025.naacl-demo.21
      - '2402.05755'
      - '2410.17196'
      - '2503.04721'
      - '2505.15670'
      - '2506.23049'
      - '2508.02013'
      - '2509.06502'
      contradicting_papers: []
      refining_papers:
      - '2411.13577'
      - '2504.08528'
      - '2506.21875'
      - '2509.26542'
      - interspeech-2025-0874
    caveats:
    - The ESPnet-SDS comparison (2025.naacl-demo.21) is explicitly flagged by its own authors as not strictly fair (different
      inputs across systems), so it should be read as corroborating rather than independently decisive.
    - The two survey entries (2411.13577, 2504.08528) synthesize the same underlying literature rather than contributing independent
      new evidence; counted here as refining/contextual support, not primary evidence.
    - 'The gap is not uniform: WildSpeech-Bench (2506.21875) and VERA (2509.26542) both find it re-emerges specifically on
      paralinguistic understanding and reasoning depth rather than general conversational quality.'
  - ref: speech-to-speech#commercial_vs_opensource_duplex_gap
    proposition: Commercial/closed-source full-duplex and spoken dialogue systems currently show better-calibrated turn-taking,
      lower paralinguistic decision bias, and more topically coherent interruption handling than open-source research systems.
    baseline_assessment: null
    cutoff_assessment:
      status: strongly_supported
      confidence: medium
      supporting_papers:
      - 2025.findings-acl.470
      - '2503.04721'
      - '2509.22243'
      - '2510.02352'
      contradicting_papers: []
      refining_papers: []
    caveats:
    - None of the four papers control for training data or compute scale between commercial and open-source systems, so the
      gap may reflect deployment-scale tuning as much as architecture.
  - ref: speech-to-speech#cross_lingual_incontext_voice_preservation
    proposition: In-context learning with acoustic token prompts, rather than speaker embeddings, provides stronger cross-lingual
      speaker/voice preservation in codec-based speech-to-speech translation.
    baseline_assessment:
      status: emerging
      confidence: medium
      supporting_papers:
      - '2303.03926'
      contradicting_papers: []
      refining_papers: []
    cutoff_assessment:
      status: emerging
      confidence: medium
      supporting_papers:
      - '2303.03926'
      contradicting_papers: []
      refining_papers: []
    caveats:
    - Backed by a single paper (VALL-E X); no later paper in this concept's corpus directly tests the same in-context-vs-embedding
      comparison for cross-lingual S2ST.
  - ref: speech-to-speech#frozen_decoupled_llm_preserves_text_capability
    proposition: Keeping the backbone LLM frozen, or decoupling speech generation into a separate module trained without updating
      LLM weights, better preserves the LLM's original text reasoning and instruction-following capability than end-to-end
      fine-tuning on speech data.
    baseline_assessment:
      status: emerging
      confidence: low
      supporting_papers:
      - '2411.00774'
      contradicting_papers: []
      refining_papers: []
    cutoff_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
      - 2025.findings-acl.1051
      - '2411.00774'
      - '2505.15670'
      - interspeech-2025-0874
      contradicting_papers: []
      refining_papers: []
    caveats: []
  - ref: speech-to-speech#full_duplex_backchannel_interruption_unsolved
    proposition: Backchannel generation and robust interruption handling remain largely unsolved in current full-duplex spoken
      dialogue systems, with most systems showing near-zero or poorly-timed backchannel behavior and degraded turn-taking
      accuracy under realistic conditions.
    baseline_assessment:
      status: emerging
      confidence: low
      supporting_papers:
      - '2410.17799'
      contradicting_papers: []
      refining_papers: []
    cutoff_assessment:
      status: strongly_supported
      confidence: high
      supporting_papers:
