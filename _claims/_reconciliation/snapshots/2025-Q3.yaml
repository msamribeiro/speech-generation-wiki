  - ref: disentanglement#quantization_bottleneck_induces_attribute_separation
    proposition: Constraining a representation through a small discrete-token vocabulary, finite scalar quantization, or a
      differentiable scalar-quantization bottleneck can induce beneficial attribute separation as an implicit side effect,
      without a dedicated adversarial or information-theoretic disentanglement objective.
