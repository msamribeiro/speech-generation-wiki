- id: broader_training_diversity_drives_unseen_voice_generalization
  proposition: Across speaker adaptation, voice conversion, and zero-shot synthesis, broader training-set coverage
    of speakers and acoustic conditions is consistently associated with better identity similarity and robustness
    for unseen voices. Total training hours alone cannot be interpreted as the cause because reported scale gains
    are confounded with speaker, language, and accent coverage; recording conditions; filtering and transcription
    quality; pretraining; architecture; and model capacity.
  status: strongly_supported
  confidence: high
  members:
  - claim: speaker-adaptation#data_scale_and_diversity_drive_unseen_speaker_generalization
    relationship: specialization
    rationale: Speaker-adaptation studies provide task-specific evidence associating broader speaker and condition
      coverage with stronger unseen-speaker similarity and robustness, while scale and diversity remain experimentally
      confounded.
  - claim: voice-conversion#data_diversity_drives_unseen_speaker_generalization
    relationship: specialization
    rationale: Voice-conversion studies provide conversion-specific evidence associating training-speaker and acoustic
      coverage with unseen-speaker generalization, while data composition, quality, and model design remain confounded.
  - claim: zero-shot-tts#data_scale_and_diversity_improve_generalization
    relationship: specialization
    rationale: Zero-shot TTS studies provide synthesis-specific evidence associating broader training coverage with
      unseen-voice transfer, although some evidence uses proprietary data and does not isolate diversity from scale
      or architecture.
