- id: broader_automatic_judges_require_scoped_human_validation
  proposition: Automatic LLM, audio-language-model, and learned-metric judges sometimes reproduce coarse or clearly
    separated human rankings of speech systems. They remain unreliable for utterance-level prosody, emotion, other
    paralinguistic behavior, and comparisons between near-tied systems, so each judge must be validated against
    human ratings in the same task, domain, and scoring granularity before it replaces listener evaluation.
  status: strongly_supported
  confidence: high
  members:
  - claim: evaluation-metrics#llm_audio_judge_reliability_is_contested
    relationship: specialization
    rationale: 'The evaluation-metrics cluster states: "LLM- or audio-LM-based automatic judges can approximate
      human evaluation well for some speech-quality and dialogue-quality judgments, but become unreliable for fine-grained,
      prosodic, or non-verbal/paralinguistic judgments." It is proposed as a specialization member because the source
      is a narrower task, architecture, or deployment instance of the target relative to the broader proposition.'
