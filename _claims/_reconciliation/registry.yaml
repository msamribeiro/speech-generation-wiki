- id: broader_disentanglement_improves_multiattribute_control
  proposition: Representing linguistic content, speaker identity or timbre, prosody, emotion, and style as separate
    factors allows a system to change or transfer one attribute with less unintended change to the others. Current
    codec and self-supervised representations still leak these attributes across factors, and that residual entanglement
    can reduce waveform fidelity, speaker-identity preservation, or independent control.
  status: strongly_supported
  confidence: high
  members:
  - claim: autoregressive-codec-tts#speaker_and_style_control_conflict_with_token_disentanglement
    relationship: refines
    rationale: 'The autoregressive-codec-tts cluster states: "Separating linguistic content, speaker identity, and
      style in codec tokens improves controllability but introduces fidelity and identity trade-offs." It is proposed
      as a refines member because the source adds a boundary, condition, failure mode, or more precise formulation
      to the target relative to the broader proposition.'
  - claim: disentanglement#codecs_ssl_entangle_content_speaker_by_default
    relationship: supports
    rationale: 'The disentanglement cluster states: "Standard neural codec and self-supervised speech representations
      entangle linguistic content with speaker identity and other paralinguistic detail unless an explicit disentanglement
      mechanism is applied." It is proposed as a supports member because the source supplies a compatible mechanism
      or evidence for the target without claiming that the propositions are identical relative to the broader proposition.'
  - claim: disentanglement#emotion_speaker_disentanglement_enables_crossspeaker_transfer
    relationship: specialization
    rationale: 'The disentanglement cluster states: "Disentangling emotional or expressive representations from
      speaker identity, via architectural separation, adversarial training, or self-supervised distillation, enables
      emotion or style transfer across speakers that were not paired during training." It is proposed as a specialization
      member because the source is a narrower task, architecture, or deployment instance of the target relative
      to the broader proposition.'
  - claim: disentanglement#explicit_disentanglement_enables_independent_multiattribute_control
    relationship: equivalent
