- id: broader_full_duplex_requires_joint_interaction_modeling
  proposition: 'Natural full-duplex dialogue requires two distinct capabilities: concurrently processing incoming
    audio while generating speech, and controlling the interaction by deciding whether to continue speaking, yield
    the turn, respond to an interruption, or interpret overlapping speech as a backchannel. An architecture that
    merely permits simultaneous input and output does not by itself establish effective turn-taking.'
  status: strongly_supported
  confidence: high
  members:
  - claim: autoregressive-codec-tts#multistream_autoregression_enables_full_duplex_dialogue
    relationship: supports
    rationale: Parallel or delayed autoregressive streams provide a concrete architecture for concurrent listening
      and generation, but their existence alone does not establish correct interruption or turn-transition behavior.
  - claim: spoken-language-model#full_duplex_requires_joint_listening_speaking_and_turn_taking
    relationship: equivalent
    rationale: This local claim covers both concurrent listening while speaking and explicit handling of overlap,
      interruptions, and turn transitions at the same scope as the broader proposition.
  - claim: streaming-tts#full_duplex_requires_simultaneous_listening_and_speaking
    relationship: supports
    rationale: This claim establishes the concurrent input-and-output requirement, but does not by itself cover
      the interaction policy needed for turn-taking and interruption handling.
  - claim: streaming-tts#turn_taking_and_barge_in_need_explicit_modeling
    relationship: supports
    rationale: This claim establishes the need to model turn boundaries, interruptions, barge-in, and response timing,
      but does not by itself establish concurrent listening and generation.
