- id: broader_preference_posttraining_improves_targeted_speech_attributes
  proposition: Preference- and reward-based post-training can improve explicitly targeted attributes such as intelligibility,
    speaker similarity, naturalness, emotion, or instruction adherence beyond supervised fine-tuning in autoregressive,
    diffusion, flow-matching, and spoken-language generators. The gain depends on the base model, preference pairs
    or reward definition, and training stability; optimizing a proxy too aggressively can degrade untargeted perceptual
    qualities or collapse held-out quality.
  status: strongly_supported
  confidence: high
  members:
  - claim: autoregressive-codec-tts#preference_optimization_improves_multiple_quality_dimensions
    relationship: specialization
    rationale: 'The autoregressive-codec-tts cluster states: "Preference and reinforcement-learning post-training
      can improve intelligibility, speaker similarity, and perceptual quality beyond supervised autoregressive TTS."
      It is proposed as a specialization member because the source is a narrower task, architecture, or deployment
      instance of the target relative to the broader proposition.'
  - claim: diffusion-tts#preference_optimization_can_steer_diffusion
    relationship: specialization
    rationale: 'The diffusion-tts cluster states: "Preference optimization can steer diffusion trajectories toward
      human-aligned speech attributes." It is proposed as a specialization member because the source is a narrower
      task, architecture, or deployment instance of the target relative to the broader proposition.'
  - claim: emotion-synthesis#preference_optimization_can_improve_emotional_alignment
    relationship: specialization
    rationale: 'The emotion-synthesis cluster states: "Preference optimization can improve emotional coherence and
      expressive alignment beyond supervised fine-tuning alone." It is proposed as a specialization member because
      the source is a narrower task, architecture, or deployment instance of the target relative to the broader
      proposition.'
  - claim: flow-matching#fm_velocity_space_alignment
    relationship: specialization
    rationale: 'The flow-matching cluster states: "Preference and reinforcement-learning-based post-training alignment
      can be formulated for flow-matching TTS architectures — either as a direct DPO objective in the velocity space,
      or via Gaussian reparameterization of the deterministic output combined with policy-gradient methods (GRPO)
