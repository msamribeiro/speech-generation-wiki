  caveats:
  - The optimal hierarchy, token rate, and allocation of semantic and acoustic information remain architecture- and task-dependent.
  - Semantic and acoustic factors are not cleanly separable; interface errors and overly strong semantic objectives can reduce
    prosody, speaker identity, or other non-verbal detail.
  review_rationale: Q4 review reaffirmed convergence across autoregressive generation, neural codecs, self-supervised representations,
    and zero-shot synthesis. Deduplicated evidence continues to support semantic guidance for coherence together with acoustic
    tokens for speaker, prosodic, and waveform detail, while showing that the separation remains porous and architecture-dependent.
  evidence_cutoff: '2025-12-31'
  assessment_date: '2026-10-25'
  reviewed_in: 2025-Q4
  review_status: human_approved
- id: broader_speech_evaluation_requires_multidimensional_coverage
  proposition: Speech-system evaluations should report separately the dimensions material to the task—for example, semantic
    correctness and intelligibility, naturalness, speaker identity, prosody or expression, and, for interactive systems,
    turn-taking or other interaction behavior. Transcript-only scores or a single aggregate quality score can conceal
    failures on unmeasured dimensions and cannot reveal when an improvement on one dimension degrades another.
  status: strongly_supported
  confidence: high
  members:
  - claim: evaluation-metrics#no_single_metric_suffices_multidimensional_evaluation_needed
    relationship: equivalent
    rationale: 'The evaluation-metrics cluster states: "No single automatic or subjective metric captures overall speech-generation
      quality; gains on one evaluated dimension (naturalness, intelligibility, similarity, diversity) frequently trade
      off against another, so multi-metric, multi-dimensional evaluation is necessary." It is proposed as a equivalent
      member because the two clusters make the same material assertion at matching scope and polarity relative to the
      broader proposition.'
  - claim: subjective-evaluation#naturalness_intelligibility_and_identity_are_distinct_axes
    relationship: supports
    rationale: 'The subjective-evaluation cluster states: "Naturalness, intelligibility, speaker identity, and expressiveness
      are distinct perceptual axes and improvements on one do not guarantee gains on the others." It is proposed as a
      supports member because the source supplies a compatible mechanism or evidence for the target without claiming
      that the propositions are identical relative to the broader proposition.'
  - claim: subjective-evaluation#benchmark_design_needs_multidimensional_coverage
    relationship: equivalent
    rationale: 'The subjective-evaluation cluster states: "Speech-system benchmarks need multidimensional rubrics that
      separate semantic success, naturalness, identity, prosody, and interaction behavior." It is proposed as a equivalent
      member because the two clusters make the same material assertion at matching scope and polarity relative to the
      broader proposition.'
  - claim: evaluation-metrics#text_asr_based_sca_eval_misses_paralinguistic_signal
    relationship: specialization
    rationale: 'The evaluation-metrics cluster states: "Evaluating spoken dialogue/SCA systems via text-only transcripts
      or ASR-derived proxies systematically misses acoustic-level and paralinguistic information that materially affects
      true system quality or capability." It is proposed as a specialization member because the source is a narrower
      task, architecture, or deployment instance of the target relative to the broader proposition.'
  - claim: spoken-language-model#multidimensional_benchmarks_expose_spoken_model_gaps
    relationship: specialization
    rationale: 'The spoken-language-model cluster states: "Multidimensional benchmarks reveal spoken-language-model failures
      that text-only accuracy and aggregate speech-quality scores miss." It is proposed as a specialization member because
      the source is a narrower task, architecture, or deployment instance of the target relative to the broader proposition.'
  - claim: prosody-control#objective_prosody_metrics_do_not_fully_predict_perception
    relationship: specialization
    rationale: 'This cluster specializes the broader proposition to prosody evaluation: objective alignment and prosody
      measures do not consistently predict naturalness, expressiveness, or control success, so those perceptual dimensions
      must be tested separately.'
  - claim: evaluation-metrics#conversational_evaluation_requires_real_multiturn_context
    relationship: specialization
    rationale: Conversational evaluation specializes the broader proposition to real multi-turn, multi-speaker, and interaction-timing
      context that isolated or transcript-only tests omit.
  - claim: subjective-evaluation#conversational_evaluation_requires_interaction_context
    relationship: specialization
    rationale: Interaction-context evaluation specializes the broader proposition to dual-channel, turn-taking, and multi-turn
      protocols for spoken dialogue.
  - claim: evaluation-metrics#fullduplex_automatic_metrics_feasible_without_human_raters
    relationship: specialization
    rationale: Full-duplex automatic evaluation operationalizes separate semantic, acoustic, and interaction-timing dimensions
      for conversational systems.
  - claim: speech-to-speech#multiturn_dialogue_degradation
    relationship: supports
    rationale: Observed degradation in emotional coherence, information density, and long-range recall across turns demonstrates
      why conversational benchmarks must preserve multi-turn context.
  - claim: speech-to-speech#llm_judge_automated_eval_limits
    relationship: supports
    rationale: Conditional agreement and paralinguistic failures of automated spoken-dialogue judges support separate,
      human-validated semantic, acoustic, and interaction rubrics.
  - claim: disentanglement#objective_metrics_dont_predict_subjective_disentanglement_quality
    relationship: specialization
    rationale: 'Disentanglement evaluation specializes the broader proposition: objective leakage and reconstruction
      scores do not reliably predict perceived separation and output quality.'
  - claim: subjective-evaluation#fine_grained_style_and_prosody_need_dimension_specific_tests
    relationship: specialization
    rationale: Fine-grained style, prosody, accent, and emotion evaluation specializes the broader requirement for dimension-specific
      perceptual tests.
  - claim: evaluation-metrics#reference_free_task_specific_metrics_can_outperform_generic_mos
    relationship: supports
    rationale: Task-specific reference-free metrics support matching evaluation measures to the target attribute instead
      of relying on one generic quality score.
  - claim: subjective-evaluation#automatic_metrics_diverge_from_human_perception
    relationship: supports
    rationale: System-ranking disagreement between automatic metrics and listeners supports separate human-validated
      dimensions rather than a single aggregate score.
  - claim: evaluation-metrics#emotion_evaluation_diverges_from_human_at_finegrained_level
    relationship: specialization
    rationale: Fine-grained emotion evaluation specializes the broader proposition to semantic empathy, acoustic expression,
      style intensity, and dynamic affect.
  - claim: speech-to-speech#paralinguistic_semantic_capability_gap
    relationship: supports
    rationale: The persistent gap between semantic and paralinguistic capability supports reporting those dimensions
      separately.
  - claim: spoken-language-model#paralinguistic_reasoning_remains_weaker_than_semantics
    relationship: supports
    rationale: Weaker paralinguistic than semantic reasoning supports multidimensional benchmarks that do not collapse
      both capabilities into one score.
  - claim: emotion-synthesis#automatic_emotion_metrics_do_not_replace_human_evaluation
    relationship: specialization
    rationale: Emotion and style metric limitations specialize the broader requirement for dimension-specific human perceptual
      evaluation.
  - claim: emotion-synthesis#emotion_strength_trades_off_with_intelligibility_and_identity
    relationship: supports
    rationale: Emotion-strength trade-offs show why expression, intelligibility, identity, and naturalness must be reported
      separately.
  - claim: emotion-synthesis#dialogue_context_supports_appropriate_emotional_responses
    relationship: supports
    rationale: Context-dependent emotional appropriateness supports evaluation protocols that preserve dialogue history
      and cross-turn behavior.
