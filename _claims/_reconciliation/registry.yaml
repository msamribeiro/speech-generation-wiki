- id: broader_speech_tokens_trade_semantics_against_acoustic_fidelity
  proposition: Speech tokens optimized for linguistic discrimination or text alignment are easier for language models
    to use for intelligible, semantically coherent generation, but retain less speaker, prosodic, and other fine
    acoustic information. Tokens optimized for waveform reconstruction retain more acoustic detail but offer weaker
    semantic abstraction. Frame rate, codebook structure, training objective, and decoder capacity determine where
    a tokenizer lies on this trade-off.
  status: strongly_supported
  confidence: high
  members:
  - claim: speech-to-speech#semantic_acoustic_token_tradeoff
    relationship: equivalent
    rationale: 'The speech-to-speech cluster states: "Semantic speech tokens provide tighter text-speech alignment
      and better LLM compatibility but sacrifice acoustic and paralinguistic fidelity relative to acoustic codec
      tokens, creating a persistent trade-off in speech LM tokenizer design." It is proposed as a equivalent member
      because the two clusters make the same material assertion at matching scope and polarity relative to the broader
      proposition.'
  - claim: spoken-language-model#semantic_acoustic_token_tradeoff
    relationship: equivalent
    rationale: 'The spoken-language-model cluster states: "Speech tokenizers face a persistent trade-off between
      semantic intelligibility and fine acoustic, speaker, and prosodic fidelity." It is proposed as a equivalent
      member because the two clusters make the same material assertion at matching scope and polarity relative to
      the broader proposition.'
