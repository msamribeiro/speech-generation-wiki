- id: broader_semantic_acoustic_hierarchies_balance_coherence_and_fidelity
  proposition: 'In hierarchical speech generation, semantic representations carry word content and longer-range
    linguistic structure, while acoustic codec tokens carry speaker, prosodic, and waveform detail. Conditioning
    acoustic reconstruction on semantic representations can improve linguistic coherence without discarding all
    fine acoustic information, but the separation is incomplete: errors in the semantic stage constrain later reconstruction,
    and overly strong semantic objectives can suppress prosody or speaker cues.'
  status: strongly_supported
  confidence: high
  members:
  - claim: autoregressive-codec-tts#semantic_acoustic_hierarchy_balances_coherence_and_fidelity
    relationship: equivalent
    rationale: 'The autoregressive-codec-tts cluster states: "Separating semantic and acoustic token prediction
      improves linguistic coherence while retaining high-fidelity waveform detail." It is proposed as a equivalent
      member because the two clusters make the same material assertion at matching scope and polarity relative to
      the broader proposition.'
  - claim: neural-codec#semantic_acoustic_hierarchy_balances_coherence_fidelity
    relationship: equivalent
    rationale: 'The neural-codec cluster states: "Separating semantic and acoustic token layers helps balance linguistic
      coherence against fine-grained waveform fidelity." It is proposed as a equivalent member because the two clusters
      make the same material assertion at matching scope and polarity relative to the broader proposition.'
  - claim: self-supervised-speech#semantic_acoustic_hierarchies_balance_coherence_and_fidelity
    relationship: equivalent
    rationale: 'The self-supervised-speech cluster states: "Combining SSL semantic representations with acoustic
      codec detail balances linguistic coherence against waveform fidelity." It is proposed as a equivalent member
      because the two clusters make the same material assertion at matching scope and polarity relative to the broader
      proposition.'
  - claim: zero-shot-tts#hybrid_semantic_acoustic_generation_balances_quality
    relationship: specialization
    rationale: 'The zero-shot-tts cluster states: "Separating semantic planning from acoustic reconstruction can
      balance intelligibility and speaker fidelity." It is proposed as a specialization member because the source
      is a narrower task, architecture, or deployment instance of the target relative to the broader proposition.'
  supporting_papers:
