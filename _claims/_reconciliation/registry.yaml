  caveats:
  - Dataset size and diversity effects are usually not isolated experimentally; speaker coverage, language and accent balance,
    recording conditions, filtering, transcription quality, pretraining, architecture, and model capacity often change together.
  - The association supports a data-coverage conclusion, not a universal scaling law or a claim that adding hours from the
    same distribution will improve unseen-speaker transfer.
  review_rationale: Q4 review reaffirmed the same proposition across speaker adaptation, voice conversion, and zero-shot TTS.
    Deduplicated member evidence continues to associate broader speaker and acoustic-condition coverage with stronger unseen-voice
    similarity and robustness, while scale, diversity, data quality, pretraining, and architecture remain confounded; the
    conclusion therefore remains associative rather than an isolated causal scaling law.
