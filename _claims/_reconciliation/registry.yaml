- id: rel_191b714790ab2daa
  source: gan-vocoder#gan_decoders_support_low_bitrate_neural_codecs
  target: neural-codec#adversarial_objectives_improve_perceptual_reconstruction
  type: specialization
  rationale: Using a GAN decoder for a low-bitrate neural codec is an architectural specialization of applying adversarial
    and multi-scale spectral objectives to improve perceptual reconstruction under aggressive compression. The outcome
    remains sensitive to discriminator design, quantizer rate, decoder capacity, and evaluation domain.
