- id: broader_reference_conditioning_enables_unseen_voice_transfer
  proposition: 'Reference-audio conditioning enables a synthesis or voice-conversion system to produce speech in
    the identity of a speaker excluded from the system’s training set, without speaker-specific parameter updates
    at inference. This establishes zero-shot feasibility, not uniform identity fidelity: performance varies with
    reference duration, content, noise, and channel; language or accent match; expressive style; training-speaker
    coverage; and the speaker encoder and listening protocol used to evaluate identity.'
  status: strongly_supported
  confidence: high
  members:
  - claim: diffusion-tts#diffusion_supports_zero_shot_voice_transfer
    relationship: specialization
    rationale: Diffusion-based reference-conditioned synthesis is an architecture-specific instance of transferring
      an unseen speaker identity without speaker-specific fine-tuning; its measured fidelity depends on prompt quality,
      language match, and the evaluation method.
  - claim: speaker-adaptation#reference_conditioning_enables_unseen_speaker_adaptation
    relationship: equivalent
    rationale: 'This cluster states the same core mechanism and scope as the broader claim: reference audio enables
      synthesis or conversion for an unseen speaker without full speaker-specific retraining, with performance conditioned
      on the reference and training domain.'
  - claim: voice-conversion#zero_shot_any_to_any_conversion_is_feasible
    relationship: specialization
    rationale: Zero-shot any-to-any voice conversion is the conversion-specific instance of reference-conditioned
      unseen- voice transfer; accents, expressive styles, atypical speech, and out-of-domain channels remain material
      failure conditions.
  - claim: zero-shot-tts#reference_conditioning_preserves_speaker_identity
    relationship: specialization
    rationale: Reference-conditioned zero-shot TTS is the synthesis-specific instance of the broader mechanism.
      Its large evidence base establishes feasibility but remains sensitive to the reference distribution, training-speaker
      coverage, speaker encoder, and listening protocol.
