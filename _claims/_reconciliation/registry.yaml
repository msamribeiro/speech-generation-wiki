- id: broader_full_duplex_requires_joint_interaction_modeling
  proposition: A full-duplex spoken dialogue system must continue processing incoming speech while generating its
    own output and must model when to keep speaking, yield the speaking turn, respond to an interruption, or handle
    overlapping speech. Concurrent listening and generation without these interaction decisions is insufficient
    for natural turn-taking.
