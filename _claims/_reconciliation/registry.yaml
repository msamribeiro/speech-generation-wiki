broader_claims:
- id: broader_automatic_judges_require_scoped_human_validation
  proposition: Automatic speech evaluators—including LLM or audio-language-model judges and learned task- or quality-specific
    metrics—can reproduce some human rankings when systems are clearly separated and evaluation conditions match
    the evaluator’s validation domain. Their agreement degrades for near-tied systems, utterance-level prosody or
    emotion, non-verbal or paralinguistic cues, and domain shifts. They should therefore be validated against human
    ratings for the same task, domain, attribute, and scoring granularity before their scores are treated as substitutes
    for listener evaluation.
  status: strongly_supported
  confidence: high
  members:
  - claim: evaluation-metrics#llm_audio_judge_reliability_is_contested
    relationship: specialization
    rationale: 'The evaluation-metrics cluster states: "LLM- or audio-LM-based automatic judges can approximate
      human evaluation well for some speech-quality and dialogue-quality judgments, but become unreliable for fine-grained,
      prosodic, or non-verbal/paralinguistic judgments." It is proposed as a specialization member because the source
      is a narrower task, architecture, or deployment instance of the target relative to the broader proposition.'
  - claim: subjective-evaluation#llm_and_audio_language_judges_are_not_uniformly_reliable
    relationship: specialization
    rationale: 'The subjective-evaluation cluster states: "Automated LLM and audio-language-model judges can approximate
      some human speech judgments but are not uniformly reliable for fine-grained or non-verbal attributes." It
      is proposed as a specialization member because the source is a narrower task, architecture, or deployment
      instance of the target relative to the broader proposition.'
  - claim: subjective-evaluation#automatic_metrics_diverge_from_human_perception
    relationship: supports
    rationale: 'The subjective-evaluation cluster states: "Automatic speech-quality and task metrics frequently
      rank systems differently from human perceptual judgments." It is proposed as a supports member because the
      source supplies a compatible mechanism or evidence for the target without claiming that the propositions are
      identical relative to the broader proposition.'
  - claim: instruction-conditioned-tts#automatic_judges_do_not_fully_replace_human_evaluation
    relationship: specialization
    rationale: 'The instruction-conditioned-tts cluster states: "Automatic judges can approximate human instruction-adherence
      ratings, but they do not reliably capture all perceptual alignment, naturalness, or domain-specific failure
      modes." It is proposed as a specialization member because the source is a narrower task, architecture, or
      deployment instance of the target relative to the broader proposition.'
  - claim: emotion-synthesis#automatic_emotion_metrics_do_not_replace_human_evaluation
    relationship: specialization
    rationale: 'The emotion-synthesis cluster states: "Automatic emotion and style metrics can diverge from human
      judgments and do not replace perceptual evaluation." It is proposed as a specialization member because the
      source is a narrower task, architecture, or deployment instance of the target relative to the broader proposition.'
  - claim: speech-to-speech#llm_judge_automated_eval_limits
    relationship: specialization
    rationale: 'The speech-to-speech cluster states: "Automated LLM-as-judge and other automatic metrics for spoken
      dialogue quality correlate with human judgment only under certain conditions (large score gaps, text-only
      cues) and are unreliable for paralinguistic, non-verbal, or near-tied comparisons." It is proposed as a specialization
      member because the source is a narrower task, architecture, or deployment instance of the target relative
      to the broader proposition.'
  - claim: evaluation-metrics#emotion_evaluation_diverges_from_human_at_finegrained_level
    relationship: specialization
    rationale: 'The evaluation-metrics cluster states: "Automatic emotion/paralinguistic evaluation (embedding similarity,
      discrete SER classifiers, LLM-based empathy scoring) correlates with human judgment at the aggregate/system
      level but diverges at the fine-grained, utterance-level, or dynamic level." It is proposed as a specialization
      member because the source is a narrower task, architecture, or deployment instance of the target relative
      to the broader proposition.'
