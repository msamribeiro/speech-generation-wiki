  target: spoken-language-model#semantic_acoustic_token_tradeoff
  type: refines
  rationale: 'Separating semantic planning from acoustic reconstruction refines the persistent tokenizer trade-off
    by providing a concrete mitigation in zero-shot synthesis: semantic guidance supports intelligibility while
    acoustic reconstruction supports speaker fidelity. It does not eliminate the trade-off, and stage interfaces
    can introduce additional errors.'
