- id: rel_06f012f2c74a14fb
  source: speaker-adaptation#speaker_privacy_conflicts_with_identity_preservation
  target: voice-conversion#privacy_conversion_trades_utility_for_unlinkability
  type: tradeoff
  rationale: Speaker anonymization intentionally suppresses identity cues that personalized adaptation seeks to
    preserve. Privacy-oriented conversion can also reduce intelligibility or naturalness, so stronger unlinkability
    and the resulting losses in personalization and speech utility are coupled outcomes that must be evaluated together.
  reviewed_on: '2026-09-12'
  accepted_in: 2025-Q3-corrective-review
  review_status: human_approved
