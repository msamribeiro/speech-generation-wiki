- id: broader_speech_evaluation_requires_multidimensional_coverage
  proposition: "Speech-system evaluations should report separately the dimensions material to the task\u2014for example, semantic\
    \ correctness and intelligibility, naturalness, speaker identity, prosody or expression, and, for interactive systems,\
    \ turn-taking or other interaction behavior. Transcript-only scores or a single aggregate quality score can conceal failures\
    \ on unmeasured dimensions and cannot reveal when an improvement on one dimension degrades another."
  status: strongly_supported
  confidence: high
  members:
  - claim: evaluation-metrics#no_single_metric_suffices_multidimensional_evaluation_needed
    relationship: equivalent
    rationale: 'The evaluation-metrics cluster states: "No single automatic or subjective metric captures overall speech-generation
      quality; gains on one evaluated dimension (naturalness, intelligibility, similarity, diversity) frequently trade off
      against another, so multi-metric, multi-dimensional evaluation is necessary." It is proposed as a equivalent member
      because the two clusters make the same material assertion at matching scope and polarity relative to the broader proposition.'
  - claim: subjective-evaluation#naturalness_intelligibility_and_identity_are_distinct_axes
    relationship: supports
    rationale: 'The subjective-evaluation cluster states: "Naturalness, intelligibility, speaker identity, and expressiveness
      are distinct perceptual axes and improvements on one do not guarantee gains on the others." It is proposed as a supports
      member because the source supplies a compatible mechanism or evidence for the target without claiming that the propositions
      are identical relative to the broader proposition.'
  - claim: subjective-evaluation#benchmark_design_needs_multidimensional_coverage
    relationship: equivalent
    rationale: 'The subjective-evaluation cluster states: "Speech-system benchmarks need multidimensional rubrics that separate
      semantic success, naturalness, identity, prosody, and interaction behavior." It is proposed as a equivalent member because
      the two clusters make the same material assertion at matching scope and polarity relative to the broader proposition.'
  - claim: evaluation-metrics#text_asr_based_sca_eval_misses_paralinguistic_signal
    relationship: specialization
    rationale: 'The evaluation-metrics cluster states: "Evaluating spoken dialogue/SCA systems via text-only transcripts or
      ASR-derived proxies systematically misses acoustic-level and paralinguistic information that materially affects true
      system quality or capability." It is proposed as a specialization member because the source is a narrower task, architecture,
      or deployment instance of the target relative to the broader proposition.'
  - claim: spoken-language-model#multidimensional_benchmarks_expose_spoken_model_gaps
    relationship: specialization
    rationale: 'The spoken-language-model cluster states: "Multidimensional benchmarks reveal spoken-language-model failures
      that text-only accuracy and aggregate speech-quality scores miss." It is proposed as a specialization member because
      the source is a narrower task, architecture, or deployment instance of the target relative to the broader proposition.'
  - claim: prosody-control#objective_prosody_metrics_do_not_fully_predict_perception
    relationship: specialization
    rationale: 'This cluster specializes the broader proposition to prosody evaluation: objective alignment and prosody measures
      do not consistently predict naturalness, expressiveness, or control success, so those perceptual dimensions must be
      tested separately.'
