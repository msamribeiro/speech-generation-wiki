      of the target relative to the broader proposition.'
  - claim: emotion-synthesis#automatic_emotion_metrics_do_not_replace_human_evaluation
    relationship: specialization
    rationale: 'The emotion-synthesis cluster states: "Automatic emotion and style metrics can diverge from human judgments
      and do not replace perceptual evaluation." It is proposed as a specialization member because the source is a narrower
      task, architecture, or deployment instance of the target relative to the broader proposition.'
  - claim: speech-to-speech#llm_judge_automated_eval_limits
    relationship: specialization
    rationale: 'The speech-to-speech cluster states: "Automated LLM-as-judge and other automatic metrics for spoken dialogue
      quality correlate with human judgment only under certain conditions (large score gaps, text-only cues) and are unreliable
      for paralinguistic, non-verbal, or near-tied comparisons." It is proposed as a specialization member because the source
      is a narrower task, architecture, or deployment instance of the target relative to the broader proposition.'
  - claim: evaluation-metrics#emotion_evaluation_diverges_from_human_at_finegrained_level
    relationship: specialization
    rationale: 'The evaluation-metrics cluster states: "Automatic emotion/paralinguistic evaluation (embedding similarity,
      discrete SER classifiers, LLM-based empathy scoring) correlates with human judgment at the aggregate/system level but
      diverges at the fine-grained, utterance-level, or dynamic level." It is proposed as a specialization member because
      the source is a narrower task, architecture, or deployment instance of the target relative to the broader proposition.'
  - claim: zero-shot-tts#automatic_metrics_do_not_fully_capture_cloning_quality
    relationship: specialization
    rationale: Zero-shot voice cloning is a task-specific instance in which automatic intelligibility and speaker-similarity
      metrics do not fully represent listener-perceived cloning quality and therefore require matched human validation.
