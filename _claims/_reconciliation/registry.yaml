  rationale: 'The source cluster states: "Parallel, multi-token, and speculative decoding reduce serial speech-token
    generation cost." The target cluster states: "Decoding acceleration can reduce zero-shot TTS latency while retaining
    usable intelligibility and speaker fidelity." The proposed specialization relation means that the source is
    a narrower task, architecture, or deployment instance of the target. The original agent adjudication further
    noted: Parallel and speculative streaming decoding are specific acceleration mechanisms within the broader usable-quality
    finding.'
