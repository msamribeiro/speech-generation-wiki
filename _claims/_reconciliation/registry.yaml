- id: broader_full_duplex_responsiveness_trades_against_floor_holding
  proposition: Across the evaluated full-duplex dialogue systems, reacting more quickly to user speech or barge-ins
    makes it harder to distinguish genuine interruptions from brief overlaps or backchannels, which can cause the
    system to stop speaking or yield its turn prematurely. Systems that preserve their ongoing response and semantic
    coherence react more slowly to genuine interruptions; no evaluated system performs strongly on both behaviors
    across interaction scenarios.
  status: strongly_supported
  confidence: high
  members:
  - claim: evaluation-metrics#fullduplex_dialogue_has_fundamental_responsiveness_tradeoffs
    relationship: equivalent
    rationale: 'The evaluation-metrics cluster states: "Full-duplex spoken dialogue systems face a fundamental trade-off
      between responsiveness (low latency, quick barge-in / jump-in) and stability (avoiding false interruptions,
      floor-holding, or premature takeover), with no evaluated system dominating on both axes." It is proposed as
      a equivalent member because the two clusters make the same material assertion at matching scope and polarity
      relative to the broader proposition.'
  - claim: speech-to-speech#full_duplex_responsiveness_floorholding_tradeoff
    relationship: equivalent
    rationale: 'The speech-to-speech cluster states: "Full-duplex spoken dialogue systems face an inherent trade-off
      between fast, low-latency responsiveness/interruption handling and semantic coherence or floor-holding robustness;
      no current system achieves strong performance on both simultaneously across interaction scenarios." It is
      proposed as a equivalent member because the two clusters make the same material assertion at matching scope
      and polarity relative to the broader proposition.'
