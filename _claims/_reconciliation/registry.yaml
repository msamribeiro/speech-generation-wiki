  target: prosody-control#explicit_pitch_energy_duration_enable_controllability
  type: supports
  rationale: 'The source cluster states: "Parallel acoustic generation requires explicit modeling of duration, pitch,
    and other sources of speech variation." The target cluster states: "Explicit prediction or conditioning of pitch,
    energy, and duration enables interpretable prosodic control and reduces variation left unresolved by text alone."
    The proposed supports relation means that the source supplies a compatible mechanism or evidence for the target
    without claiming that the propositions are identical. The original agent adjudication further noted: The need
    for explicit duration and pitch modeling in parallel TTS supports the broader controllability role of those
    interpretable prosodic variables.'
