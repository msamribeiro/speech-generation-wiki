- id: broader_learned_quality_metrics_are_useful_but_domain_sensitive
  proposition: Learned speech-quality predictors usually agree with human ratings more closely than classical signal-distortion
    metrics on evaluation data similar to their training data. Their system rankings can change across languages, recording
    domains, utterance-versus-system scoring, quality ceilings, and synthesis architectures, so matched human listening
    tests remain necessary when those conditions change.
  status: strongly_supported
  confidence: high
  members:
  - claim: evaluation-metrics#ssl_features_effective_basis_for_mos_prediction
    relationship: supports
    rationale: 'The evaluation-metrics cluster states: "Fine-tuned self-supervised (SSL) speech representations are an
      effective, data-efficient basis for automatic MOS/quality prediction, with listener-dependent modeling, contrastive/pairwise
      ranking losses, and reward-shaped training objectives each providing further, additive accuracy gains." It is proposed
      as a supports member because the source supplies a compatible mechanism or evidence for the target without claiming
      that the propositions are identical relative to the broader proposition.'
  - claim: evaluation-metrics#mos_predictors_generalize_poorly_across_language_domain_or_granularity
    relationship: refines
    rationale: 'The evaluation-metrics cluster states: "Automatic MOS predictors trained on one language, domain, or
      evaluation granularity (e.g. system-level) generalize poorly when applied to a different language, out-of-domain
      content, or a finer granularity (e.g. utterance-level)." It is proposed as a refines member because the source
      adds a boundary, condition, failure mode, or more precise formulation to the target relative to the broader proposition.'
  - claim: evaluation-metrics#automatic_mos_predictors_diverge_from_subjective_mos
    relationship: refines
    rationale: 'The evaluation-metrics cluster states: "Automatic/neural MOS predictors (e.g. UTMOS-style SSL-based predictors,
      DNSMOS) can rank systems differently from actual subjective MOS, particularly near the quality ceiling, out-of-domain,
      or for non-standard synthesis paradigms." It is proposed as a refines member because the source adds a boundary,
      condition, failure mode, or more precise formulation to the target relative to the broader proposition.'
  - claim: evaluation-metrics#intrusive_spectral_distance_metrics_diverge_from_perceptual_quality
    relationship: supports
    rationale: 'The evaluation-metrics cluster states: "Intrusive, reference-based objective distortion metrics (PESQ,
      STOI, MCD) frequently disagree with subjective perceptual quality ratings or with each other, especially across
      codec/vocoder architectures and sampling rates." It is proposed as a supports member because the source supplies
      a compatible mechanism or evidence for the target without claiming that the propositions are identical relative
      to the broader proposition.'
  - claim: subjective-evaluation#learned_quality_metrics_outperform_classical_metrics
    relationship: equivalent
    rationale: 'The subjective-evaluation cluster states: "Learned perceptual-quality models generally correlate with
      human ratings better than classical signal-based metrics, but remain domain- and scale-sensitive." It is proposed
      as a equivalent member because the two clusters make the same material assertion at matching scope and polarity
      relative to the broader proposition.'
  - claim: gan-vocoder#objective_metrics_can_misrank_vocoder_quality
    relationship: supports
    rationale: Vocoder metric misranking supports the conclusion that quality predictors and distortion measures remain
      architecture-sensitive and require matched listening tests.
  - claim: neural-codec#codec_evaluation_lacks_metric_consensus
    relationship: supports
    rationale: Codec metric non-consensus supports the conclusion that no learned or classical proxy reliably predicts
      both listener quality and downstream utility across architectures.
