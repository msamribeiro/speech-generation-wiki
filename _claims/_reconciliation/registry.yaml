- id: broader_preference_posttraining_improves_targeted_speech_attributes
  proposition: "Across the reviewed TTS, singing-generation, and spoken-language-model evidence, preference- or reward-based\
    \ post-training has improved attributes explicitly represented in the training signal\u2014such as intelligibility, speaker\
    \ similarity, naturalness, melody, emotional alignment, or instruction following\u2014relative to the reported supervised\
    \ or metric-only baselines. These gains do not imply overall perceptual improvement: outcomes depend on base-model capability,\
    \ preference-pair or reward construction, multi-objective weighting, and optimization stability, while aggressive proxy\
    \ optimization can degrade untargeted qualities."
  status: strongly_supported
  confidence: high
  members:
  - claim: autoregressive-codec-tts#preference_optimization_improves_multiple_quality_dimensions
    relationship: specialization
    rationale: Autoregressive codec TTS provides an architecture-specific instance in which preference or reinforcement learning
      improves explicitly targeted intelligibility, speaker-similarity, or perceptual-quality measures.
  - claim: diffusion-tts#preference_optimization_can_steer_diffusion
    relationship: specialization
    rationale: Diffusion TTS provides an architecture-specific instance in which preference optimization steers iterative
      generation toward the speech attributes represented by the preference signal.
  - claim: emotion-synthesis#preference_optimization_can_improve_emotional_alignment
    relationship: specialization
    rationale: Emotion synthesis provides an attribute-specific instance in which preference optimization improves reported
      emotional coherence and expressive alignment relative to supervised fine-tuning.
  - claim: flow-matching#fm_velocity_space_alignment
    relationship: specialization
    rationale: Flow-matching TTS provides an architecture-specific formulation of preference or reward optimization in velocity
      space, with reported gains in targeted intelligibility and speaker similarity.
  - claim: rlhf-speech#rlhf_posttraining_beats_sft_baseline
    relationship: supports
    rationale: This cross-task RLHF cluster supplies direct evidence that several preference- and reward-based methods improve
      targeted speech attributes over reported supervised baselines, without matching every scope and qualification of the
      broader proposition.
  - claim: rlhf-speech#preference_optimization_extends_to_continuous_generative_tts
    relationship: supports
    rationale: Reformulations for continuous and iterative-denoising generators provide the technical mechanism by which preference
      objectives can be applied beyond discrete autoregressive token models.
  - claim: rlhf-speech#composite_multiobjective_rewards_outperform_single_metric_but_need_balancing
    relationship: refines
    rationale: This claim refines the broader result by showing that single-metric rewards can improve only their target while
      degrading complementary qualities, and that multi-objective rewards require careful weighting.
  - claim: rlhf-speech#rlhf_reward_hacking_risk
    relationship: refines
    rationale: This claim adds the failure condition that aggressive optimization of an automatic proxy can reward-hack the
      measured attribute while degrading unmeasured perceptual qualities.
  - claim: rlhf-speech#rlhf_alignment_bounded_by_base_model_capability
    relationship: refines
    rationale: This claim bounds achievable post-training gains by the base model's underlying capabilities and documents
      diminishing returns across repeated alignment rounds.
  - claim: spoken-language-model#reward_and_preference_alignment_improve_spoken_behavior
    relationship: specialization
    rationale: Spoken-language models provide a task-specific instance in which reward modeling or preference alignment improves
      reported helpfulness, naturalness, or behavioral control over supervised training.
  - claim: subjective-evaluation#preference_optimization_improves_targeted_perception
    relationship: supports
    rationale: Subjective evaluation supplies perceptual evidence that preference optimization can improve the attributes
      explicitly targeted by its comparisons or reward, without implying uniform improvement across other qualities.
  - claim: rlhf-speech#grpo_extends_to_non_autoregressive_tts
    relationship: specialization
    rationale: This cluster specializes the broader proposition to non-autoregressive flow-matching TTS, where continuous
      outputs are reformulated for policy-gradient optimization and improvements remain tied to WER or speaker-similarity
      rewards.
  - claim: singing#multi_objective_rl_improves_singing_generation_and_conversion
    relationship: specialization
    rationale: This cluster specializes the broader proposition to flow-based singing synthesis and conversion, where multi-objective
      reinforcement learning improves explicitly rewarded content, melody, or perceptual attributes while retaining proxy-quality
      and balancing caveats.
  - claim: zero-shot-tts#preference_optimization_improves_cloning_but_requires_reward_controls
    relationship: specialization
    rationale: This cluster specializes the broader proposition to zero-shot voice cloning, where multidimensional rewards
      and stopping criteria improve targeted quality or control while limiting saturation and cross-attribute regression.
  - claim: rlhf-speech#dpo_adapts_to_non_autoregressive_ctc_decoders
    relationship: specialization
    rationale: This cluster specializes the broader proposition to non-autoregressive CTC-trained speech decoders, where
      DPO-style training improves an explicitly targeted emotional-coherence attribute without an auxiliary control module.
  - claim: rlhf-speech#preference_optimization_improves_slm_semantic_coherence
    relationship: specialization
    rationale: This cluster specializes the broader proposition to textless spoken language models, where preference feedback
      improves long-range semantic coherence while leaving lexical and grammatical capability limits visible.
  - claim: prosody-control#reward_guided_post_training_improves_prosodic_control
    relationship: specialization
    rationale: This cluster specializes the broader proposition to fine-grained emotion, emphasis, and melody control, with
      gains bounded by reward definition and possible reward-specific regressions.
  - claim: rlhf-speech#sca_rlhf_addresses_distinct_failure_modes_from_tts_quality_alignment
    relationship: refines
    rationale: This cluster refines the broader proposition by distinguishing conversational helpfulness, semantic consistency,
      and token-distribution failures from the acoustic-quality objectives used in TTS alignment.
  - claim: rlhf-speech#localized_token_level_alignment_improves_data_efficiency
    relationship: refines
    rationale: Localizing feedback to erroneous segments or tokens identifies a data-efficient condition for realizing broader
      gains when preference data are sparse or unpaired.
  - claim: rlhf-speech#preference_pair_construction_determines_dpo_success
    relationship: refines
    rationale: Preference-pair diversity, source, and noisy-state construction are first-order conditions determining whether
      preference objectives produce useful targeted improvements.
  - claim: rlhf-speech#reward_model_domain_shift_and_brittleness_limit_alignment
    relationship: refines
    rationale: Evaluator domain shift, ranking errors, long-context degradation, and adversarial exploitation bound the reliability
      of reported reward- or preference-based post-training gains.
