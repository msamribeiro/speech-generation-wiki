- id: broader_speech_evaluation_requires_multidimensional_coverage
  proposition: Speech-system evaluation must score semantic correctness, intelligibility, naturalness, speaker identity,
    prosody or expression, and interaction behavior separately. A transcript-only score or one aggregate quality
    number can conceal a failure on any of these other dimensions and cannot show whether an improvement on one
    dimension degraded another.
  status: strongly_supported
  confidence: high
  members:
  - claim: evaluation-metrics#no_single_metric_suffices_multidimensional_evaluation_needed
    relationship: equivalent
    rationale: 'The evaluation-metrics cluster states: "No single automatic or subjective metric captures overall
      speech-generation quality; gains on one evaluated dimension (naturalness, intelligibility, similarity, diversity)
      frequently trade off against another, so multi-metric, multi-dimensional evaluation is necessary." It is proposed
      as a equivalent member because the two clusters make the same material assertion at matching scope and polarity
      relative to the broader proposition.'
  - claim: subjective-evaluation#naturalness_intelligibility_and_identity_are_distinct_axes
    relationship: supports
    rationale: 'The subjective-evaluation cluster states: "Naturalness, intelligibility, speaker identity, and expressiveness
      are distinct perceptual axes and improvements on one do not guarantee gains on the others." It is proposed
      as a supports member because the source supplies a compatible mechanism or evidence for the target without
      claiming that the propositions are identical relative to the broader proposition.'
  - claim: subjective-evaluation#benchmark_design_needs_multidimensional_coverage
    relationship: equivalent
    rationale: 'The subjective-evaluation cluster states: "Speech-system benchmarks need multidimensional rubrics
      that separate semantic success, naturalness, identity, prosody, and interaction behavior." It is proposed
      as a equivalent member because the two clusters make the same material assertion at matching scope and polarity
      relative to the broader proposition.'
  - claim: evaluation-metrics#text_asr_based_sca_eval_misses_paralinguistic_signal
    relationship: specialization
    rationale: 'The evaluation-metrics cluster states: "Evaluating spoken dialogue/SCA systems via text-only transcripts
