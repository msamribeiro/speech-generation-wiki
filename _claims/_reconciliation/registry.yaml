- id: broader_learned_quality_metrics_are_useful_but_domain_sensitive
  proposition: Learned speech-quality predictors usually agree with human ratings more closely than classical signal-distortion
    metrics on evaluation data similar to their training data. Their system rankings can change across languages,
    recording domains, utterance-versus-system scoring, quality ceilings, and synthesis architectures, so matched
    human listening tests remain necessary when those conditions change.
