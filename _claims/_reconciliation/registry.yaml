- id: broader_preference_posttraining_improves_targeted_speech_attributes
  proposition: Preference- and reward-based post-training can improve explicitly targeted attributes such as intelligibility,
    speaker similarity, naturalness, emotion, or instruction adherence beyond supervised fine-tuning in autoregressive,
    diffusion, flow-matching, and spoken-language generators. The gain depends on the base model, preference pairs
    or reward definition, and training stability; optimizing a proxy too aggressively can degrade untargeted perceptual
    qualities or collapse held-out quality.
