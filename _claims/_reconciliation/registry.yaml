- id: broader_full_duplex_responsiveness_trades_against_floor_holding
  proposition: Across evaluated full-duplex dialogue systems, reacting more quickly to user speech or barge-ins
    makes it harder to distinguish genuine interruptions from brief overlaps or backchannels. This can cause the
    system to stop speaking or yield its turn prematurely. Systems that preserve their ongoing response and semantic
    coherence tend to react more slowly to genuine interruptions; no evaluated system performs strongly on both
    behaviors across interaction scenarios.
  status: strongly_supported
  confidence: high
  members:
  - claim: evaluation-metrics#fullduplex_dialogue_has_fundamental_responsiveness_tradeoffs
    relationship: equivalent
    rationale: This claim states the same evaluated tradeoff between fast interruption response and avoiding false
      interruptions or premature yielding, with matching system scope and polarity.
  - claim: speech-to-speech#full_duplex_responsiveness_floorholding_tradeoff
    relationship: equivalent
    rationale: This claim states the same system-level tradeoff between rapid interruption handling and preserving
      the system's ongoing speaking turn and semantic coherence, with matching scope and polarity.
  supporting_papers:
  - '2410.17799'
  - '2503.04721'
  - '2507.23159'
  - '2509.06502'
  - '2509.22243'
  - interspeech-2025-0739
  contradicting_papers: []
  refining_papers: []
  caveats:
  - The operating point depends on the interaction scenario, interruption threshold, and the latency and error characteristics
    of the underlying speech model.
  review_rationale: 'After deduplicating their substantially overlapping evidence, the evaluation and speech-to-speech
    clusters state the same bounded tradeoff: faster interruption response increases premature stopping or yielding,
    while stronger continuation behavior delays responses to genuine interruptions.'
