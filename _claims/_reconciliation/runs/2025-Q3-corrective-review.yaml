    rationale: 'The left cluster states: "Separating semantic and acoustic token prediction improves linguistic
      coherence while retaining high-fidelity waveform detail." The right cluster states: "Separating semantic and
      acoustic token layers helps balance linguistic coherence against fine-grained waveform fidelity." Both are
      proposed as members of the broader proposition: "In hierarchical speech generation, semantic representations
      guide word content, intelligibility, and longer-range coherence, while acoustic codec tokens reconstruct speaker
      timbre, prosody, and fine waveform detail. Predicting a semantic plan and then acoustic detail can preserve
      both sets of properties better than relying on either representation alone, although errors in the semantic
      stage still constrain the acoustic reconstruction." The proposed related classification means that the clusters
      share a decision-relevant issue but differ enough in mechanism or scope that a stronger relation is not justified,
      while each local cluster retains its own scope and evidence.'
