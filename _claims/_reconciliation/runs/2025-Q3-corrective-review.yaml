    rationale: 'The left cluster states: "Full-duplex spoken dialogue systems face a fundamental trade-off between
      responsiveness (low latency, quick barge-in / jump-in) and stability (avoiding false interruptions, floor-holding,
      or premature takeover), with no evaluated system dominating on both axes." The right cluster states: "Full-duplex
      spoken dialogue systems face an inherent trade-off between fast, low-latency responsiveness/interruption handling
      and semantic coherence or floor-holding robustness; no current system achieves strong performance on both
      simultaneously across interaction scenarios." Both are proposed as members of the broader proposition: "Across
      the evaluated full-duplex dialogue systems, reacting more quickly to user speech or barge-ins makes it harder
      to distinguish genuine interruptions from brief overlaps or backchannels, which can cause the system to stop
      speaking or yield its turn prematurely. Systems that preserve their ongoing response and semantic coherence
      react more slowly to genuine interruptions; no evaluated system performs strongly on both behaviors across
      interaction scenarios." The proposed related classification means that the clusters share a decision-relevant
      issue but differ enough in mechanism or scope that a stronger relation is not justified, while each local
      cluster retains its own scope and evidence.'
