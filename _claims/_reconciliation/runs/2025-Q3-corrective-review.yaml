    rationale: 'The left cluster states: "Automatic/neural MOS predictors (e.g. UTMOS-style SSL-based predictors,
      DNSMOS) can rank systems differently from actual subjective MOS, particularly near the quality ceiling, out-of-domain,
      or for non-standard synthesis paradigms." The right cluster states: "Learned perceptual-quality models generally
      correlate with human ratings better than classical signal-based metrics, but remain domain- and scale-sensitive."
      Both are proposed as members of the broader proposition: "Learned speech-quality predictors usually agree
      with human ratings more closely than classical signal-distortion metrics on evaluation data similar to their
      training data. Their system rankings can change across languages, recording domains, utterance-versus-system
      scoring, quality ceilings, and synthesis architectures, so matched human listening tests remain necessary
      when those conditions change." The proposed related classification means that the clusters share a decision-relevant
      issue but differ enough in mechanism or scope that a stronger relation is not justified, while each local
      cluster retains its own scope and evidence.'
