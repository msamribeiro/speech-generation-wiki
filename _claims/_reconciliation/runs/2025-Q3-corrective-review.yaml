      attributes." Both are proposed as members of the broader proposition: "Automatic LLM, audio-language-model,
      and learned-metric judges sometimes reproduce coarse or clearly separated human rankings of speech systems.
      They remain unreliable for utterance-level prosody, emotion, other paralinguistic behavior, and comparisons
      between near-tied systems, so each judge must be validated against human ratings in the same task, domain,
      and scoring granularity before it replaces listener evaluation." The proposed related classification means
      that the clusters share a decision-relevant issue but differ enough in mechanism or scope that a stronger
      relation is not justified, while each local cluster retains its own scope and evidence.'
