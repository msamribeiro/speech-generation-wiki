open_questions:
- How should singer identity, vocal technique, and musical style be separated without losing naturalness?
- Can speech prompts support singing timbre transfer as reliably as singing references?
- Which representations capture vibrato, glissando, breathiness, and other time-varying techniques?
- How few diffusion or flow steps can singing generation use without losing dynamic detail?
- Which objective and subjective metrics reliably evaluate singer identity, style, and naturalness?
- How should melody, lyrics, visual timing, and acoustic prompts be fused without attribute leakage?
- Can annotation-light singing systems generalize beyond Mandarin and Western pitch conventions without task-specific
  alignment tools?
- How should robust singing conversion be evaluated on public mixtures with controlled harmony, reverberation, and
  source-separation errors?
- Can reinforcement-learning rewards improve expressive singing without optimizing ASR, pitch, or aesthetic proxies
  at the expense of listener preference?
trend_notes:
- Singing generation is moving from same-domain singer conditioning toward speech-prompted and cross-modal identity
  transfer.
- Explicit signal-derived controls increasingly replace opaque style embeddings for pitch and technique manipulation.
- Diffusion remains common, while consistency and one-step methods target lower inference cost with visible quality
  trade-offs.
- Multimodal singing systems increasingly incorporate visual timing, scene acoustics, transcription, and melody
  controls.
- Evaluation is expanding beyond naturalness toward identity, style accuracy, controllability, and dynamic-technique
  fidelity.
- Q4 2025 singing systems increasingly adapt pretrained speech diffusion and flow backbones while adding singing-specific
  pitch, alignment, and harmonic structure.
- Annotation-light melody conditioning, zero-shot timbre transfer, and robustness to separated real-song vocals
  became central development targets in Q4 2025.
- Multi-objective reinforcement learning entered both singing synthesis and conversion, but evidence remains limited
  to two related flow-based systems.
