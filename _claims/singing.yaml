    role: supports
    claim: Factorizing singing audio into disentangled content tokens, a continuous F0 contour, and a timbre embedding,
      rather than relying on phoneme-aligned score supervision, allows a synthesis and conversion system to generalize
      to timbres well outside its human training distribution.
    source: §4.2, Tables 1-3
