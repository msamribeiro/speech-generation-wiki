  claims:
  - claim_id: constraining_cross_attention_to_character_level_temporal_spans_via_a_fix
    role: supports
    claim: Constraining cross-attention to character-level temporal spans via a fixed additive attention bias can
      substitute for explicit phoneme-level duration labels in phoneme-to-acoustic alignment for singing synthesis.
    source: §2.3, Table 2
    evidence: The implicit alignment mask (Eq. 6–8) is derived only from character-level start times and durations,
      extended by a tunable offset δ, and is applied identically at training and inference under diffusion reconstruction
      loss alone; the resulting model achieves the best MCD (3.03) and F0RMSE (11.18) among all compared systems.
    confidence: high
    relevance: high
  - claim_id: diffusion_transformer_scaling_trends_observed_in_other_modalities_qualit
    role: supports
    claim: Diffusion transformer scaling trends observed in other modalities (quality improving with depth, width,
      and resolution) extend to singing voice synthesis.
    source: §3.2, Fig. 3
    evidence: Sweeping DiTSinger from Small (depth 4, width 384) to Large (depth 16, width 768) and data from 30h
      to 530h produces consistent MCD improvements, with a half-resolution Small variant (S2) outperforming a higher-FLOP
      Base variant (B4), showing resolution has an outsized effect relative to raw compute.
    confidence: high
    relevance: high
  - claim_id: bootstrapping_large_singing_corpora_from_a_small_number_of_melody_specia
    role: complicates
    claim: Bootstrapping large singing corpora from a small number of melody-specialized synthesis models has a
      data-regime sweet spot rather than improving monotonically with the number of source models.
    source: §3.3, Table 1
    evidence: MOS peaks at 20 PseudoSinger groups (4.05 ± 0.06) and then falls to 3.81 at 50 groups, with MCD rising
      from 3.12 to 3.65, as each group's melody coverage shrinks and generalization to unseen lyrics worsens.
    confidence: high
    relevance: medium
  - claim_id: cross_system_comparisons_in_singing_voice_synthesis_are_hard_to_interpre
    role: complicates
    claim: Cross-system comparisons in singing voice synthesis are hard to interpret when baselines differ in whether
      they are retrained on the evaluation corpus or conditioned via a reference clip.
    source: §3.1, §3.4, Table 2
    evidence: DiffSinger is retrained on the paper's own 530h corpus, while StyleSinger and TCSinger are instead
      conditioned on a reference clip from the same singer rather than retrained, so the MOS/MCD gaps in Table 2
      partly reflect this mismatch in evaluation protocol rather than architecture alone.
    confidence: high
    relevance: low
  limitations:
  - MOS results use an unreleased Chinese corpus and baselines with mismatched retraining/reference-conditioning
    protocols.
  caveats:
  - For subjective evaluation, this paper provides medium-relevance evidence; claims primarily concerning other
    concepts remain included but are marked low relevance.
