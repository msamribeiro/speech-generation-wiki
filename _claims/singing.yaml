method_families:
- id: diffusion_singing_generation
  name: Diffusion singing generation and conversion
  summary: Diffusion and consistency systems generate or convert singing while conditioning on singer, style, spatial
    context, or explicit signal attributes.
  papers:
  - '2304.09116'
  - interspeech-2025-0816
  - interspeech-2025-1364
  - interspeech-2025-1397
  - '2509.07038'
  open_questions:
  - Can few-step singing diffusion retain the quality and dynamic detail of multi-step generation?
- id: vae_singing_latent_systems
  name: VAE singing latent systems
  summary: Variational systems encode timbre, content, pitch, or style in latent spaces used for singing synthesis,
    conversion, and codec reconstruction.
  papers:
  - '2304.09116'
  - interspeech-2025-0347
  - interspeech-2025-1531
  open_questions:
  - How can singing latents separate timbre, content, and expressive pitch dynamics without losing reconstruction
    quality?
- id: gan_singing_conversion_systems
  name: GAN-based singing conversion systems
  summary: Adversarial singing systems regularize pitch, timbre, spectral detail, or style-transfer objectives during
    conversion and reconstruction.
  papers:
  - interspeech-2025-0347
  - interspeech-2025-1531
  open_questions:
  - Which adversarial objectives improve singing style accuracy without amplifying naturalness trade-offs?
- id: hybrid_multimodal_singing_systems
  name: Hybrid multimodal singing systems
  summary: Hybrid systems combine acoustic models with prompts, melody, transcription, visual timing, or other external
    control pathways.
  papers:
  - '2509.19883'
  - '2509.22718'
  open_questions:
  - Which external signals add controllability without leaking attributes or destabilizing acoustic training?
