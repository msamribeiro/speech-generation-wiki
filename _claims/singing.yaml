  - The model is described as still underfitting at 300K training steps, meaning reported results are likely below
    the system's ceiling performance. Inference requires 150 diffusion steps (ODE solver), and 1000 steps for singing,
    which is slow for real-time deployment. The paper cites consistency models as future work for acceleration.
    Training and evaluation are English-only, so multilingual generalisation is uncharacterised. The singing dataset
    is approximately 30 hours of web-crawled data with no formal provenance or quality validation beyond alignment
    filtering, which raises questions about singing style coverage. Code and model weights are not publicly released,
    limiting reproducibility.
