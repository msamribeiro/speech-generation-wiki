  - evaluation_caution
  current_role: minor
  method_family: []
  claims:
  - claim_id: framing_generative_model_evaluation_as_multi_dimensional_language_and_audio_feedback_rather_than_a_s
    role: supports
    claim: Framing generative-model evaluation as multi-dimensional language-and-audio feedback, rather than a single
      scalar reward, can preserve interpretability across separate quality dimensions while remaining usable as
      a training signal.
    source: §1, §2.2
    evidence: The proposed framework generates parallel text and audio critiques spanning melody, content, and auditory-quality
      dimensions instead of a single numeric reward, directly targeting the interpretability limits of prior scalar
      SVS reward models.
    confidence: high
    relevance: medium
  - claim_id: combining_authentic_human_generated_feedback_data_with_standardized_synthetic_mllm_generated_feedbac
    role: supports
    claim: Combining authentic human-generated feedback data with standardized synthetic (MLLM-generated) feedback
      data captures complementary properties that neither source provides alone.
    source: §3, Table 1
    evidence: Human-only training raises SCQ accuracy to 0.60 (above GPT-4o-Audio's 0.583) but collapses OEQ average
      to 0.375, while MLLM-only training preserves balanced OEQ (0.739) with weaker SCQ (0.375); hybrid training
      achieves the best combined trade-off (SCQ 0.65, OEQ weighted average 0.577).
    confidence: high
    relevance: medium
  - claim_id: reaction_or_commentary_data_mined_from_in_the_wild_recordings_can_leak_target_like_signal_into_the_m
    role: complicates
    claim: Reaction or commentary data mined from in-the-wild recordings can leak target-like signal into the model's
      input, letting a feedback-generation model shortcut-learn instead of genuinely inferring critique from the
      underlying performance.
    source: §Appendix F, Figure 5
    evidence: In the raw Human Reaction Data, the reviewer's overlapping speech closely resembled the target critique
      text; removing it with source separation (AudioSep) produced significantly lower validation loss than training
      on the unseparated audio.
    confidence: high
    relevance: low
  - claim_id: joint_autoregressive_supervision_of_text_and_audio_outputs_from_a_shared_llm_backbone_can_induce_exp
    role: supports
    claim: Joint autoregressive supervision of text and audio outputs from a shared LLM backbone can induce expressive,
      affect-laden audio-generation behavior beyond what the base model exhibits.
    source: §3 "Multi-modal Supervision", §Appendix E
    evidence: Case studies comparing the base Kimi-Audio model to fine-tuning checkpoints show the final model producing
      emotionally intonated spoken reactions and, in one case, spontaneous humming in response to musical input,
      capabilities absent from the base model.
    confidence: high
    relevance: low
  limitations:
  - The framework's own evaluation relies entirely on an LLM-as-judge benchmark (SCQ accuracy plus LLM-judged OEQ
    completeness/accuracy/novelty) rather than human listening tests, and no experiment fine-tunes an SVS model
    via RL using the generated feedback signal, so the paper's central motivating claim (that this feedback can
    guide generative model improvement) is not directly demonstrated.
  caveats:
  - The evaluation contribution is directly relevant, but its conclusions remain bounded by the reported datasets,
    systems, languages, judges, and validation protocol.
- id: '2512.03486'
  published_date: '2025-12-03'
  entry_date: '2026-09-26'
  year: 2025
  venue: ASRU
  task:
  - TTS
  - singing
  architecture:
  - GAN
  relevance: medium
  evidence_role:
  - architecture_variant
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - gan_singing_conversion_systems
  claims:
  - claim_id: dynamic_frequency_resolution_in_a_gan_vocoder_s_time_frequency_discriminator
    role: supports
    claim: Dynamic frequency resolution in a GAN vocoder's time-frequency discriminator improves synthesis quality
      over fixed-resolution STFT discriminators, with the largest gains on signals with dense, fast-moving harmonic
      content such as singing voice.
    source: §IV-C1, Table I
    evidence: On out-of-domain singing, MS-SB-CQT and the proposed UnivHD (both dynamic-resolution) outperform the
      fixed-resolution MS-STFT discriminator on all four objective/subjective metrics for both HiFi-GAN and iSTFTNet
      backbones.
    confidence: high
    relevance: high
  - claim_id: aligning_a_discriminator_s_frequency_filters_to_exact_integer_multiples_of_a
    role: refines
    claim: Aligning a discriminator's frequency filters to exact integer multiples of a base frequency, rather than
      to power-of-two-spaced bins, extends dynamic-resolution time-frequency discriminators to cover odd harmonics
      that constant-Q-based designs systematically miss.
    source: §III-A
    evidence: Because CQT center frequencies are defined as f_c^k = f_min · 2^(k/B), the h-th harmonic h·f_c^k is
      only representable when h = 2^d; the proposed harmonic filter instead scales center frequencies by integer
      harmonic order h, so the k-th bin's h-th harmonic is exactly h times the k-th bin's first harmonic.
    confidence: high
    relevance: medium
  - claim_id: combining_a_harmonic_dynamic_resolution_discriminator_with_a_fixed_resolutio
    role: supports
    claim: Combining a harmonic/dynamic-resolution discriminator with a fixed-resolution multi-scale STFT discriminator
      yields complementary gains beyond either alone.
    source: §IV-C1, Table II
    evidence: HiFi-GAN with both MS-STFT and UnivHD (+S+H) improves PESQ and MCD on in- and out-of-domain speech
      over HiFi-GAN with either discriminator alone, and also outperforms the MS-STFT + MS-SB-CQT combination on
      the same test sets.
    confidence: high
    relevance: medium
  - claim_id: the_number_of_harmonics_modeled_by_a_harmonic_filter_discriminator_is_not_a
    role: complicates
    claim: The number of harmonics modeled by a harmonic-filter discriminator is not a free hyperparameter to maximize;
      too few harmonics under-resolves the spectrum and too many can push the modeled range past the sample's fundamental
      frequency, degrading pitch fidelity.
    source: §IV-C2
    evidence: Ablation over H ∈ {2, 8, 10, 12, 15, 20} shows near-flat performance in a mid-range but clear degradation
      at both extremes; at 24kHz sampling with H > 20 the discriminator cannot represent fundamental frequencies
      above roughly 600Hz within the first harmonic.
    confidence: high
    relevance: high
  limitations:
  - MOS uses 15 utterances per condition and 10 raters without a stated significance test, and only two prior discriminator
    families are compared.
  caveats: []
- id: '2512.04779'
  published_date: '2025-12-04'
  entry_date: '2026-09-26'
  year: 2025
  venue: arXiv
  task:
  - singing
  architecture:
  - flow-matching
  relevance: high
  evidence_role:
  - core_evidence
  - control_evidence
  - architecture_variant
  current_role: active_evidence
  method_family:
  - flow_matching_singing_generation
  claims:
  - claim_id: annotation_free_melody_extraction_learned_end_to_end_via_teacher_student_dis
    role: supports
    claim: Annotation-free melody extraction, learned end-to-end via teacher-student distillation and jointly optimized
      with the synthesis model, can substitute for manually-annotated phoneme and pitch alignment as a conditioning
      signal for singing voice synthesis without degrading output quality.
    source: §3.2, §4.5, Table 1
    evidence: An online melody extractor is trained with a KL-divergence distillation loss against a frozen MIDI-pretrained
      teacher, jointly with the DiT synthesis model, using only sentence-level-timestamped weakly-aligned data;
      the resulting system achieves aesthetic scores (CE, CU, PC, PQ) comparable to or better than baselines trained
      with precise phoneme/MIDI annotation.
    confidence: high
    relevance: high
  - claim_id: reinforcement_learning_post_training_with_a_multi_objective_reward_combining
    role: supports
    claim: Reinforcement learning post-training with a multi-objective reward combining content-accuracy and melodic-similarity
      terms can jointly improve intelligibility and melody adherence in a flow-matching-based singing synthesis
      model, particularly in zero-shot and lyric-editing conditions.
    source: §3.3, §4.6, Table 3
    evidence: Flow-GRPO post-training (single-timestep stochastic noise injection into the ODE flow) reduces WER
      from 16.75% to 15.18% and raises F0 Pearson correlation from 76.64% to 82.84% relative to the pre-trained-only
      model.
    confidence: high
    relevance: high
  - claim_id: an_explicit_representation_alignment_loss_between_a_conditioning_signal_and
    role: complicates
    claim: An explicit representation-alignment loss between a conditioning signal and internal model features can
      accelerate convergence of conditional behavior, but risks degrading a competing objective unless its loss
      weight is annealed during training.
    source: §4.1, §4.6, Table 3
    evidence: The CKA-alignment loss speeds early convergence of melody-following behavior, but the paper reports
      that its weight must be gradually reduced during training; leaving it too high yields strong F0 correlation
      at the cost of increased WER.
    confidence: high
    relevance: high
  - claim_id: zero_shot_singing_voice_timbre_transfer_conditioned_on_a_short_reference_aud
    role: supports
    claim: Zero-shot singing-voice timbre transfer, conditioned on a short reference audio prompt, can generalize
      to unseen speakers without dedicated fine-tuning when the synthesis backbone is initialized from a pretrained
      zero-shot flow-matching TTS model.
    source: §4.3, §4.5, Table 1
    evidence: Evaluated on five unseen in-the-wild speakers absent from training, the system achieves 1.28% WER,
      93.95% speaker similarity, and 81.28% F0 correlation in the zero-shot timbre-transfer setting, outperforming
      TCSinger and Vevo baselines on WER.
    confidence: high
    relevance: high
  - claim_id: structural_and_lyrical_editing_that_changes_phoneme_counts_and_sentence_stru
    role: complicates
    claim: Structural and lyrical editing that changes phoneme counts and sentence structure remains harder for
      annotation-free singing synthesis than straightforward zero-shot synthesis, since intelligibility degrades
      for the editing task even when melody adherence and relative comparisons to baselines remain favorable.
    source: §4.5, Table 1
    evidence: WER rises to 12.62-18.44% for zero-shot lyric and structural editing versus 1.28% for zero-shot synthesis
      on the same model, though this is still far below Vevo's 67.31-73.97% WER on the identical editing tasks.
    confidence: high
    relevance: high
  limitations:
  - Subjective editing results cover a narrow Mandarin, unseen-speaker setting, while the broader annotation-free
    claims rely heavily on automatic content and melody metrics.
  caveats:
  - Annotation-free flow singing synthesis improves with RL, but structural editing remains harder than zero-shot
    generation.
- id: '2512.04793'
  published_date: '2025-12-04'
  entry_date: '2026-09-26'
  year: 2025
  venue: arXiv
  task:
  - singing
  - VC
  architecture:
  - flow-matching
  relevance: high
  evidence_role:
  - core_evidence
  - control_evidence
  - negative_evidence
  current_role: active_evidence
  method_family:
  - flow_matching_singing_generation
  claims:
  - claim_id: q4_2512_04793_passing_a_zero_shot_voice_singing_conversion_model_s_input_through_a_sep
    role: supports
    claim: Passing a zero-shot voice/singing conversion model's input through a separate, pretrained single-shot
      conversion model to strip source-speaker identity before content-feature extraction improves the invariance
      of the resulting content representation and downstream conversion fidelity.
    source: §5.3.1, Table 3
    evidence: Ablating the RVC-based timbre shifter is the single largest degradation across all three test settings,
      e.g. under Mix Vocal SPK-SIM drops from 0.810 to 0.804 and CER rises from 15.70% to 16.30%.
    confidence: high
    relevance: high
  - claim_id: q4_2512_04793_making_speaker_timbre_conditioning_a_function_of_the_local_pitch_contour
    role: supports
    claim: Making speaker/timbre conditioning a function of the local pitch contour, rather than a single static
      per-speaker embedding, improves perceived quality of converted singing by allowing timbre to shift with vocal
      register.
    source: §5.3.1, Table 3, Figure 3a
    evidence: Removing the F0-aware timbre adaptor lowers aesthetic Content Enjoyment/Usefulness scores across all
      settings, e.g. GT Leading CE/CU falls from 5.79/6.50 to 5.75/6.46.
    confidence: high
    relevance: high
  - claim_id: q4_2512_04793_reweighting_a_flow_matching_training_loss_to_emphasize_under_represented
    role: complicates
    claim: Reweighting a flow-matching training loss to emphasize under-represented high-frequency spectral content
      does not uniformly improve all quality dimensions; it can trade improved spectral/aesthetic detail against
      measured intelligibility.
    source: §5.3.1, Table 3
    evidence: On the clean GT Leading set, including the energy-balanced loss lowers CER (9.20% vs. 9.40% without
      it) but very slightly reduces aesthetic CE/CU (5.79/6.50 vs. 5.81/6.54 without it), a pattern the authors
      attribute to a spectral-detail/intelligibility trade-off.
    confidence: high
    relevance: high
  - claim_id: q4_2512_04793_online_rl_post_training_with_a_multi_objective_non_differentiable_percep
    role: supports
    claim: Online RL post-training with a multi-objective, non-differentiable perceptual reward (aesthetic quality,
      intelligibility, speaker similarity) can improve a flow-matching voice/singing conversion model on dimensions
      not directly optimized by its supervised training objective.
    source: §5.2
    evidence: After SFT, the RL stage further raises CMOS from 3.23 to 3.31 and aesthetic CE/CU from 5.73/6.35 to
      5.75/6.40 on Mix Vocal, and yields the highest CMOS (3.91) on the full production pipeline (Ours Leading).
    confidence: medium
    relevance: high
  - claim_id: q4_2512_04793_zero_shot_svc_systems_evaluated_only_on_clean_isolated_solo_vocals_subst
    role: complicates
    claim: Zero-shot SVC systems evaluated only on clean, isolated solo vocals substantially overstate real-world
      performance, because harmony bleed and F0 errors from imperfect source separation degrade intelligibility
      and pitch stability even for otherwise strong baselines.
    source: §5.1, Table 2
    evidence: The Seed-VC baseline's CER rises from 10.89% (GT Leading, clean) to 17.30% (Mix Vocal, harmony-contaminated)
      and LogF0PCC drops from 98.29% to 84.02%, a degradation the paper's own robustness-trained model only partially
      closes (CER 15.90%, LogF0PCC 86.47%).
    confidence: high
    relevance: high
  limitations:
  - A small proprietary test suite, five target timbres, two baselines, and partially ablated training stages limit
    reproducibility and generality.
  caveats:
  - Real-world singing robustness improves but remains sensitive to source-separation errors and proprietary training
    assets.
- id: '2601.13910'
  published_date: '2025-12-20'
  entry_date: '2026-09-26'
  year: 2025
  venue: IJCNLP-AACL
  task:
  - singing
  architecture: []
