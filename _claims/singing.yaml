    the method is not genuinely zero-shot across timbre domains.
  caveats:
  - Out-of-domain timbre transfer sacrifices intelligibility and requires domain-specific vocoder fine-tuning.
- id: '2512.02523'
  published_date: '2025-12-02'
  entry_date: '2026-09-26'
  year: 2025
  venue: arXiv
  task:
  - singing
  - evaluation
  architecture:
