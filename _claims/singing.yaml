  current_role: influential
  method_family: []
  claims:
  - claim_id: cascaded_singing_pipelines_retain_low_resource_advantages
    role: supports
    claim: Cascaded speech and singing synthesis pipelines can retain a practical performance advantage over end-to-end
      designs in low-resource settings because hand-crafted intermediate targets provide auxiliary supervision.
    source: §B.2
    evidence: The survey attributes the continued strength of cascaded SVS systems to auxiliary supervision from
      acoustic targets, while end-to-end systems require more data and face training and alignment instability.
    confidence: medium
    relevance: high
  - claim_id: continuous_and_discrete_singing_representations_remain_unsettled
    role: complicates
    claim: There is no settled consensus on whether continuous or discrete acoustic representations are preferable
      for singing generation because each supports different quality, control, and deployment properties.
    source: §B.3
    evidence: The survey contrasts discrete representations that enable token modeling and streaming with continuous
      representations that preserve finer acoustic texture but require stronger decoders and alignment.
    confidence: medium
    relevance: high
  - claim_id: singing_controllability_can_trade_against_audio_fidelity
    role: complicates
    claim: Increasing singing-generation controllability does not straightforwardly improve audio fidelity, and
      stronger inference guidance alone does not establish genuine control.
    source: §B.3
    evidence: The survey identifies fidelity loss from overemphasized control, persistent factor-disentanglement
      difficulties, and the insufficiency of single encoders or stronger guidance for robust control.
    confidence: medium
    relevance: high
  - claim_id: singing_data_scale_and_annotation_quality_remain_bottlenecks
    role: supports
    claim: Singing voice synthesis remains substantially more constrained than speech synthesis by both corpus scale
      and annotation quality.
    source: §B.4, Table 1
    evidence: The survey finds that public singing corpora remain orders of magnitude smaller than speech corpora
      and suffer from long-tail style and language gaps plus inaccurate lyric timing.
    confidence: high
    relevance: high
  limitations:
  - This is a literature survey with no original experiments, and its cross-paper conclusions are not independently
    re-verified.
  caveats:
  - The survey scopes itself to deep-learning SVS and treats multimodal-LLM opportunities as forward-looking rather
    than validated.
