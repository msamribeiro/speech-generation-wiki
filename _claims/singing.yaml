  claims:
  - claim_id: integrating_schr_dinger_bridge_into_consistency_training_can_improve_one
    role: supports
    claim: Integrating Schrödinger bridge into consistency training can improve one-step generative model quality
      for audio synthesis without a pre-trained teacher model.
    source: §2.2, §3.4, Table 2
    evidence: VS-Singer's CSB decoder achieves MOS 3.74 at NFE=4 on test-unseen, outperforming CoMoSpeech (3.70)
      which uses consistency distillation with a teacher; ablation removing only the Schrödinger bridge drops MOS
      from 3.81 to 3.50 and raises MCD from 7.65 to 8.63 on test-seen.
    confidence: high
    relevance: medium
  - claim_id: cross_modal_visual_attention_over_scene_images_can_encode_spatial
    role: supports
    claim: Cross-modal visual attention over scene images can encode spatial acoustic properties into a singing
      synthesis pipeline, enabling reverberation-aware binaural audio generation.
    source: §2.1, §3.4, Table 2
    evidence: The Modal Interaction Network integrates dual-view visual features, 3D location encoding, and energy
      vectors with text hidden sequences via cross-attention; removing MIN degrades LRE from 0.889 to 1.257 and
      RTE from 0.058 to 0.084 in the ablation on test-seen.
    confidence: high
    relevance: high
  - claim_id: one_step_consistency_model_inference_incurs_a_substantial_quality_penalty
    role: complicates
    claim: One-step consistency model inference incurs a substantial quality penalty compared to multi-step inference
      in diffusion-based singing synthesis.
    source: §3.3, Table 1
    evidence: VS-Singer at NFE=1 achieves MOS 3.48 vs. 3.74 at NFE=4 on test-unseen, with MCD degrading from 7.71
      to 8.55; CoMoSpeech shows the same pattern (MOS 3.46 at NFE=1 vs. 3.70 at NFE=4), suggesting this trade-off
      is intrinsic to consistency models rather than model-specific.
    confidence: high
    relevance: high
  - claim_id: unified_end_to_end_architectures_for_spatial_audio_generation_outperform
    role: supports
    claim: Unified end-to-end architectures for spatial audio generation outperform cascaded specialised model pipelines
      in both inference speed and spatial accuracy.
    source: §3.3, Table 1
    evidence: VS-Singer (NFE=1) achieves RTF 0.024 on test-unseen vs. RTF 0.203 for DiffSinger in the cascaded baseline,
      while achieving better LRE and RTE than all cascaded combinations at NFE=4.
    confidence: high
    relevance: medium
  limitations:
  - The full system is evaluated on a single female Chinese pop singer (Opencpop). Generalisability to other vocal
    timbres, singing styles, and languages is entirely unexamined.
  - No code is released, and the binaural training data is generated synthetically via convolution of room impulse
    responses rather than natural binaural recordings, which may limit real-world spatial realism. The paper claims
    first-of-kind status, meaning all baselines are cascaded systems rather than competing unified approaches; it
    is therefore unclear whether the gains come from end-to-end training, the specific architectural choices, or
    both. Perceptual evaluation uses only naturalness MOS and does not include spatial audio perceptual tests (e.g.
    externalisation, localisation accuracy, envelopment) that specialists in binaural audio would expect. Performance
    in test-unseen scenes is consistently lower than test-seen, indicating limited spatial generalisation to novel
    environments.
  caveats: []
- id: interspeech-2025-1397
  published_date: "2025-08-17"
  entry_date: '2026-08-02'
