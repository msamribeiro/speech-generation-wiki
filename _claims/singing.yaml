  claims:
  - claim_id: q4_2510_20677_explicitly_perturbing_fundamental_frequency_during_training_and_forcing
    role: supports
    claim: Explicitly perturbing fundamental frequency during training and forcing reconstruction of the clean target
      reduces a voice conversion model's reliance on noisy F0 tracking, improving robustness to real-world pitch
      extraction errors.
    source: §2.2, Table 1
    evidence: 'Random jitter/glide/jump F0 perturbation applied to 2-4 segments per sample, combined with reconstruction-of-clean-target
      training, drove the largest naturalness ablation effect: removing this module (w/o SRE) dropped SVC-Hard NMOS
      from 2.90±0.11 to 2.23±0.21.'
    confidence: high
    relevance: high
  - claim_id: q4_2510_20677_augmenting_speaker_timbre_extraction_with_domain_specific_target_style_d
    role: supports
    claim: Augmenting speaker/timbre extraction with domain-specific target-style data improves style preservation
      without requiring a redesigned embedding architecture.
    source: §2.3, Table 1
    evidence: Extending CAM++ with clean vocals, DNSMOS-filtered separated vocals, and public singing corpora (SETSE)
      raised SVC-Hard SMOS from 1.74±0.11 (w/o SETSE) to 2.64±0.10 in the full model.
    confidence: high
    relevance: high
  - claim_id: q4_2510_20677_robustness_interventions_aimed_at_noisy_real_world_conditions_can_trade
    role: complicates
    claim: Robustness interventions aimed at noisy real-world conditions can trade off against raw speaker-similarity
      scores measured by automatic embedding cosine similarity.
    source: §4.3, Table 1
    evidence: The ablated w/o-SETSE and w/o-SRE variants achieved higher SPK-SIM than the full R2-SVC model on both
      test sets (e.g., 78.95% vs. 75.17% on SVC-Normal), even though the full model scored better on subjective
      naturalness and similarity (NMOS, SMOS).
    confidence: high
    relevance: medium
  - claim_id: q4_2510_20677_automatic_intelligibility_metrics_computed_with_off_the_shelf_asr_system
    role: complicates
    claim: Automatic intelligibility metrics computed with off-the-shelf ASR systems degrade sharply on singing
      material with ambiguous pronunciation and complex vocal techniques, independent of the voice conversion system's
      own quality.
    source: §4.1
    evidence: CER on the SVC-Hard test set (25.77% for R2-SVC) was roughly double the SVC-Normal CER (13.41%) for
      the same system, attributed to ambiguous pronunciation and complex singing techniques in the hard set rather
      than conversion failures.
    confidence: medium
    relevance: low
  limitations:
  - Internal data, targets, and test sets prevent independent reproduction, and robustness gains sometimes reduce
    automatic speaker similarity without a full causal analysis.
  caveats:
  - Robustness and style modules improve subjective results while sometimes lowering automatic speaker similarity.
