        claim: "Quality-aware upweighting of high-scoring sample pairs is a consistently beneficial component in automatic perceptual quality evaluation."
        source: "§IV.A, §IV.B"
        evidence: "Removing quality-aware weighting causes a noticeable SRCC drop; gains are most pronounced on content usefulness (0.052 SRCC improvement), the hardest dimension for baselines."
        confidence: medium
        relevance: low
      - claim_id: qamro_objective_change_improves_predictors
        role: supports
        claim: "Automatic MOS predictors built on pre-trained audio-text representations can be meaningfully improved by training objective changes without modifying the backbone architecture."
        source: "§II.B, Table II"
        evidence: "Results hold across both CLAP (TTM) and Audiobox-Aesthetics (multi-task TTS/TTA/TTM) backbones with only a training objective change, no architecture modification."
        confidence: medium
        relevance: low
    limitations:
      - "All training and evaluation is conducted on the AudioMOS Challenge 2025 closed-set data only; generalisation to unseen TTS or VC systems outside this distribution is untested."
    caveats:
      - "QAMRO trains an automatic MOS predictor, not an RLHF-tuned generation system; its relevance to rlhf-speech is only as a potential future reward-model architecture, since the paper does not connect QAMRO to any RL training loop."

  - id: "interspeech-2025-0063"
    entry_date: "2026-07-20"
    year: 2025
    venue: Interspeech
    task: [TTS]
    architecture: [diffusion]
    relevance: high
    evidence_role:
      - core_evidence
    current_role: foundational
    method_family: [rl_policy_gradient_reward_optimization]
    claims:
      - claim_id: dlpo_image_domain_rl_transfers_poorly
        role: complicates
        claim: "KL-based regularization strategies developed for text-to-image diffusion RL fine-tuning provide limited gains when transferred to TTS, because audio waveform generation requires stronger temporal coherence than image synthesis."
        source: "§2.3.1, Table 1"
        evidence: "DDPO, DPOK, and KLinR (image-domain RL methods) achieve UTMOS 2.69-3.18 versus DLPO's 3.65 on WaveGrad 2R fine-tuning, with RWR actually degrading quality (UTMOS 2.18, WER 8.9%) relative to the base model."
        confidence: high
        relevance: high
      - claim_id: dlpo_diffusion_loss_penalty_stabilizes
        role: supports
        claim: "Incorporating the original diffusion training objective as a penalty term in the RL reward function stabilizes fine-tuning and yields larger quality improvements than KL-divergence regularization alone."
        source: "§2.2, Table 1"
        evidence: "DLPO (diffusion loss + reward) achieves UTMOS 3.65 and NISQA 4.02, outperforming OnlyDL (diffusion loss only, UTMOS 3.16) and all four KL/score-based baselines tested."
        confidence: high
        relevance: high
      - claim_id: dlpo_dual_mos_guards_reward_hacking
        role: supports
        claim: "Dual MOS evaluation using a reward-model-independent predictor (NISQA) alongside the training reward (UTMOS) provides a practical safeguard against reward hacking in RLHF for TTS."
        source: "§2.3"
        evidence: "NISQA (held out from the UTMOS reward) reaches 4.02, close to the ground truth ceiling of 4.37, corroborating the UTMOS-based reward gains rather than reflecting pure reward overfitting."
        confidence: medium
        relevance: high
      - claim_id: dlpo_naturalness_gain_without_intelligibility_loss
        role: supports
        claim: "RLHF fine-tuning of diffusion TTS models can improve perceived naturalness substantially without degrading intelligibility, as measured by WER remaining near the pre-trained baseline."
        source: "§2.3.1, Table 1"
        evidence: "DLPO achieves WER 1.2% versus the base model's 1.5% and ground truth's 0.99%, and is preferred by humans in 67% of pairwise comparisons (p<10^-16) over the base WaveGrad 2R model."
        confidence: high
        relevance: high
    limitations:
      - "Single-speaker dataset (LJSpeech); generalization to multi-speaker and zero-shot diffusion TTS is unverified."
      - "WaveGrad 2R is a relatively simple baseline; DLPO's benefit on more capable flow-matching or score-based TTS systems remains to be shown."
    caveats:
      - "UTMOS as reward model introduces reward hacking risk; the NISQA cross-check and human study mitigate but do not fully eliminate this risk."

  - id: "interspeech-2025-0704"
    entry_date: "2026-07-20"
    year: 2025
    venue: Interspeech
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: influential
    method_family: [differentiable_reward_gradient_backprop]
    claims:
      - claim_id: diffro_token_level_rewards_cheaper
        role: supports
        claim: "Computing rewards directly on codec tokens rather than synthesized audio reduces the computational cost of RLHF for codec LM-based TTS systems without sacrificing reward signal quality."
        source: "§3.1"
        evidence: "DiffRO-ASR achieves WER 0.78% (zh), 1.89% (en), 5.58% (hard) on seed-tts-eval versus baseline 1.56%/2.75%/6.91%, computing rewards directly on codec tokens by bypassing FM+vocoder decoding."
        confidence: high
        relevance: high
      - claim_id: diffro_gumbel_softmax_replaces_ppo
        role: supports
        claim: "Differentiable reward optimization via Gumbel-Softmax can replace PPO-style policy gradient training for codec LM fine-tuning, enabling direct backpropagation through the reward model."
        source: "§3.1, §2.2"
        evidence: "Gumbel-Softmax replaces argmax token sampling, allowing gradients to flow from the reward signal back through the LM parameters without a PPO policy-gradient loop; applied to the SFT model, DiffRO-ASR (1.09% zh) outperforms DPO (1.27% zh)."
        confidence: high
        relevance: high
      - claim_id: diffro_multitask_reward_multi_dimension
        role: supports
        claim: "A multi-task reward model trained on codec tokens can simultaneously improve pronunciation accuracy, emotion expressiveness, and audio quality in a single RL training phase."
        source: "§3.2, §4.3"
        evidence: "The MTR model (trained on ASR, SER, SQA, AED) drives DiffRO-MTR emotion accuracy on EmoBox to 1.00/0.92 (Happy zh/en) versus 0.92/0.80 baseline, with the LM spontaneously learning laughter/sobs/breaths for emotion without emotion-labeled RL data."
        confidence: high
        relevance: high
      - claim_id: diffro_generalizes_unseen_languages
        role: supports
        claim: "RLHF fine-tuning on Mandarin and English data generalizes to unseen languages (Japanese, Korean) when the reward signal targets phonetic accuracy rather than language-specific patterns."
        source: "§4.2, Table 2"
        evidence: "Japanese WER improves from 9.13% to 6.36% and Korean from 7.43% to 5.41% under RL training using only Mandarin/English text, without explicit multilingual RL data curation."
        confidence: medium
        relevance: high
      - claim_id: diffro_lm_level_rl_cannot_fix_postlm_quality
        role: complicates
        claim: "Quality attributes governed primarily by the flow-matching and vocoder stages (MOS, speaker characteristics) are largely resistant to optimization by LM-level RLHF alone."
        source: "§4.3.2, Table 4"
        evidence: "DiffRO can shift codec-level predicted MOS substantially (MOS_t=2 drops codec MOS to 2.2 from 3.82; MOS_t=4 raises it to 3.96), but the final audio MOS change after the frozen FM+vocoder is modest (3.77-3.86), showing quality is mostly determined by post-LM stages."
        confidence: high
        relevance: high
    limitations:
      - "DiffRO only optimizes the LM component; the FM and vocoder are frozen, limiting the impact of rewards that primarily affect post-LM processing."
      - "The MTR reward model requires a large in-house multi-task labeled corpus (13,000+ hours) that is not publicly available, limiting reproducibility."
    caveats:
      - "Validated only on Mandarin-focused data with CosyVoice 2.0 as the base system; generalization to languages with distinct phonological properties beyond Japanese/Korean needs further study."

  - id: "2508.15442"
    entry_date: "2026-07-20"
    year: 2025
    venue: EMNLP
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    evidence_role:
      - core_evidence
    current_role: foundational
    method_family: []
    claims:
      - claim_id: goat_entropy_predicts_hallucination
        role: supports
        claim: "Token-level entropy is a statistically significant predictor of hallucination in autoregressive LM-based TTS, enabling unsupervised detection of likely error regions before synthesis is complete."
        source: "§2.1, §2.2"
        evidence: "Token-level entropy correlates with hallucination at Pearson r=0.636, Spearman r=0.649 (p<1e-4) on 200 SeedTTS-Eval test-hard samples."
        confidence: high
        relevance: medium
      - claim_id: goat_gflownet_trajectory_flow_reduces_hallucination
        role: supports
        claim: "Reformulating autoregressive speech token generation as trajectory flow optimization via GFlowNets enables reward-proportional sampling that reduces hallucination without modifying the inference procedure."
        source: "§3.1, §3.2"
        evidence: "GOAT trains a GFlowNet forward policy via a SubTrajectory Balance objective, reducing test-hard CER from 13.72% to 6.28-6.61% (a >50% reduction) with no added inference latency."
        confidence: high
        relevance: high
      - claim_id: goat_intrinsic_reward_sufficient
        role: supports
        claim: "An intrinsic reward derived from the backbone LM's own probability distribution is sufficient to drive distribution alignment in post-training, without requiring human annotations or an external reward model."
        source: "§3.2.2"
        evidence: "GOAT uses the cumulative log-probability of the generated sequence under the backbone LM (sharpened by an inverse temperature) as its sole reward signal, requiring no external reward model or labeled preference data, trained on only 1,000 text-speech pairs per language."
        confidence: high
        relevance: high
      - claim_id: goat_subtrajectory_optimization_essential
        role: refines
        claim: "Fine-grained subtrajectory optimization is essential for hallucination suppression in long and complex utterances; degrading to trajectory-level balance significantly reduces the error reduction."
        source: "§4.4.5, Table 2"
        evidence: "Enhanced SubTB reduces test-hard CER to 6.61%, while degrading to plain Trajectory Balance yields 11.72-11.84%, nearly double the error rate."
        confidence: high
        relevance: high
      - claim_id: goat_crosslingual_generalization
        role: supports
        claim: "Post-training alignment for hallucination suppression in one language generalizes to unseen languages, with cross-lingual models retaining meaningful gains over the untuned baseline."
        source: "§4.4.4, Table 1"
        evidence: "Models trained on one language and evaluated on the other still outperform the baseline; mixed-language training on 500 samples per language matches monolingual-training performance."
        confidence: medium
        relevance: medium
    limitations:
      - "Evaluated on a single backbone (CosyVoice 2); generalization to other LM-based TTS architectures (VALL-E, BASE TTS, LLaSA) is asserted but not demonstrated."
      - "No subjective listening evaluation (MOS/MUSHRA) is reported; quality improvements are measured entirely through ASR-based error rates and the automatic UTMOS predictor."
    caveats:
      - "Reward temperature (a key hyperparameter controlling reward sharpness and reward-hacking suppression) was tuned empirically to 0.825 and may not transfer to other backbones; the assumption that the backbone LM assigns higher probability to higher-quality sequences is acknowledged by the authors as a hypothesis, not a proven property."

  - id: "2508.16332"
    entry_date: "2026-07-20"
    year: 2025
    venue: arXiv
    task: [TTS, VC, singing]
    architecture: [autoregressive-LM, flow-matching, hybrid]
    relevance: medium
    evidence_role:
      - control_evidence
    current_role: active_evidence
    method_family: [rl_policy_gradient_reward_optimization]
    claims:
      - claim_id: vevo2_joint_pretraining_domain_transfer
        role: supports
        claim: "Joint pre-training on speech and singing voice data improves generation quality in both domains, with singing data contributing to expressive speech prosody richness and speech data compensating for the limited size of singing corpora."
        source: "§V-A, Table I"
        evidence: "Vevo2's joint speech-singing training yields mutual quality gains, validated by ablation comparisons on the SeedTTS and singing benchmarks."
        confidence: medium
        relevance: low
      - claim_id: vevo2_chromagram_prosody_tokenizer
        role: supports
        claim: "Chromagram-based prosody tokenization provides a notation-free, octave-invariant representation that bridges the F0 distribution gap between speech and singing, enabling unified prosody control without expert MIDI annotations."
        source: "§III-A"
        evidence: "The prosody tokenizer encodes chromagram features (6.25 Hz, codebook 512) that are octave-free and notation-free, unlike prior F0- or mel-subband-based tokenizers."
        confidence: high
        relevance: low
      - claim_id: vevo2_ar_llm_init_low_frame_rate
        role: supports
        claim: "Autoregressive models initialized from LLM checkpoints can achieve competitive zero-shot TTS quality at low codec frame rates (12.5 Hz) when paired with strong post-training, partially compensating for the sequence granularity disadvantage relative to higher frame-rate systems."
        source: "§V-A, Table VII"
        evidence: "Vevo2's AR stage, initialized from Qwen2.5-0.5B and operating at 12.5 Hz, achieves SeedTTS WER/SIM competitive with CosyVoice 2 and MaskGCT despite the lower frame rate."
        confidence: medium
        relevance: low
      - claim_id: vevo2_single_objective_alignment_degrades_complements
        role: complicates
        claim: "Single-objective preference alignment in multi-capability speech models degrades complementary objectives; joint multi-objective optimization is necessary to avoid quality regressions on non-targeted capabilities."
        source: "§V-F, Figure 5"
        evidence: "GRPO post-training with intelligibility-only reward drops melody accuracy from 65% to 50%, while joint multi-objective GRPO (intelligibility + prosody similarity reward) achieves gains on both axes simultaneously."
        confidence: high
        relevance: high
      - claim_id: vevo2_pitch_shift_similarity_intelligibility_tradeoff
        role: complicates
        claim: "Inference-time pitch shift applied to prosody tokens improves speaker similarity in voice and singing conversion tasks, at the cost of a minor intelligibility degradation due to train-inference distribution mismatch."
        source: "§V-E, Table VI"
        evidence: "Pitch-shifted content-style tokens are out-of-distribution relative to training, causing slight WER degradation alongside the similarity gain."
        confidence: medium
        relevance: low
    limitations:
      - "Training-inference mismatch when applying pitch shift causes slight WER degradation; the paper flags future work to include pitch shift augmentation during training."
      - "The 12.5 Hz frame rate of the content-style tokenizer slightly limits VC intelligibility compared to the higher-frame-rate Vevo-FM variant."
    caveats:
      - "The GRPO multi-objective post-training stage is one component of a larger unified speech-singing architecture; the RLHF-specific contribution (composite intelligibility + prosody-similarity reward) is narrower in scope than papers dedicated to preference-alignment methodology, and reward construction details (e.g. Bradley-Terry model over the INTP preference corpus) are described only briefly."

  - id: "2509.00685"
    entry_date: "2026-07-20"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: active_evidence
    method_family: [dpo_style_preference_optimization_discrete_tts]
    claims:
      - claim_id: mpo_multidimensional_preference_set
        role: supports
        claim: "Optimizing LM-based TTS with preference data across multiple quality dimensions simultaneously is more effective than per-metric or naively combined ranking approaches."
        source: "§4.5, Table 2"
        evidence: "MPO's multidimensional preference-set construction (CER, speaker similarity, prosody, pooled with cross-dimensional pairing) outperforms a combined-ranking baseline and single-metric DPO variants on CER, SPK-SIM, and F0-RMSE jointly."
        confidence: high
        relevance: high
      - claim_id: mpo_vanilla_dpo_collapse
        role: complicates
        claim: "Vanilla DPO applied to LM-based TTS without regularization causes progressive degradation of generation capability, with CER rising sharply after 10k training steps."
        source: "§4.4, Table 1"
        evidence: "Without a cross-entropy regularization constraint, CER worsens from 4.72 (SFT baseline) to 6.41 at 10k steps and 14.52 at 15k steps, consistent with DPO's winning-response probability collapsing toward zero."
        confidence: high
        relevance: high
      - claim_id: mpo_ce_regularization_prevents_collapse
        role: supports
        claim: "Adding a cross-entropy loss on preferred sequences as a regularizer during DPO training prevents model collapse without sacrificing alignment gains."
        source: "§3.2, §4.4"
        evidence: "MPO's combined loss (λ·L_DPO + L_CE, λ=10) reaches CER 4.24 at ~20k steps with no degradation, versus catastrophic CER inflation in the unregularized ablation."
        confidence: high
        relevance: high
      - claim_id: mpo_multidim_alignment_near_ground_truth
        role: supports
        claim: "Multi-dimensional preference alignment in LM-based TTS produces output quality comparable to ground truth in subjective pairwise preference tests."
        source: "§4.5, Figure 3"
        evidence: "In ABX preference tests, MPO is preferred over the SFT baseline in 52.3% of comparisons (22.4% ties) and is reported as competitive with ground truth in pairwise preference."
        confidence: medium
        relevance: medium
    limitations:
      - "Evaluation is entirely on an internal Mandarin TTS corpus with no open benchmark comparison, making it difficult to assess absolute quality relative to published systems."
      - "The preference set construction requires running three separate quality scorers (ASR, speaker verification, F0) over 10 generated candidates per input, a non-trivial computational overhead not quantified in the paper."
    caveats:
      - "The optimal value of λ (set to 10) and the preference margin thresholds (0.1 for SPK-SIM and prosody) are not ablated, so sensitivity of the regularization and preference-set construction to these hyperparameters is unknown; comparison against SpeechAlign, UNO, and RIO is only qualitative."

  - id: "2509.05863"
    entry_date: "2026-07-20"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    evidence_role:
      - core_evidence
      - evaluation_caution
    current_role: active_evidence
    method_family: [dpo_style_preference_optimization_discrete_tts]
    claims:
      - claim_id: latinx_dpo_improves_crosslingual_intelligibility
        role: supports
        claim: "Preference-based alignment (DPO) improves intelligibility in multilingual autoregressive TTS systems beyond what supervised fine-tuning achieves."
        source: "§4.3, §5.2, Table 2, Table 3"
        evidence: "LatinX (DPO) reduces WER across nearly all 30 cross-lingual language pairs compared to the supervised fine-tuned baseline and outperforms XTTSv2 in most pairs, with particularly large gains for low-resource Romanian source conditions (e.g. ro-to-es at 0.45% WER)."
        confidence: high
        relevance: high
      - claim_id: latinx_objective_vs_subjective_similarity_divergence
        role: complicates
        claim: "Automated speaker similarity metrics based on speaker encoder embeddings do not reliably reflect human perceptual judgments of voice identity in zero-shot TTS."
        source: "§5.2, §6, Table 4, Table 5"
        evidence: "XTTSv2 achieves higher Sim-O scores than both LatinX models, yet human evaluators strongly prefer LatinX speaker similarity (SMOS 3.63/3.54 vs. 3.24), a divergence the paper explicitly flags between objective and subjective evaluation."
        confidence: high
        relevance: medium
      - claim_id: latinx_dpo_naturalness_tradeoff
        role: complicates
        claim: "DPO alignment in TTS involves a trade-off: optimizing for intelligibility and objective similarity can reduce naturalness MOS and, in some language conditions, perceptual similarity relative to the fine-tuned baseline."
        source: "§5.2, §6, Table 5, Table 6"
        evidence: "LatinX (DPO) improves WER and Sim-E over the fine-tuned model but achieves lower average MOS (3.35 vs. 3.41) and lower SMOS in several cross-lingual conditions, attributed partly to the codec introducing artifacts that cap perceptual quality."
        confidence: medium
        relevance: high
      - claim_id: latinx_codec_quality_ceiling
        role: complicates
        claim: "Lossy neural audio codecs set a perceptual quality ceiling in codec-based TTS that preference alignment cannot overcome, because the model learns to replicate codec artifacts introduced during reference encoding."
        source: "§6"
        evidence: "The paper notes that its VQ-VAE codec is lossy and the model learns to reproduce its artifacts, limiting the maximum perceptual quality achievable regardless of post-training alignment method."
        confidence: medium
        relevance: medium
    limitations:
      - "The evaluation uses an internal test set of unseen speakers with no publicly named benchmark, and the human rating pool is predominantly English and Portuguese native speakers."
      - "The DPO preference signal is constructed solely from WER and speaker similarity; no prosody, naturalness, or rhythm metric is incorporated, which likely explains the MOS regression relative to the fine-tuned baseline."
    caveats:
      - "The preference labeling is fully automated via Pareto-dominance on WER and speaker similarity with no human verification of winner/loser assignments; the Romanian SMOS results (exceeding real audio) rest on very small, predominantly non-native rater counts and should be treated cautiously."

  - id: "2509.14946"
    entry_date: "2026-07-20"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching]
    relevance: medium
    evidence_role:
      - core_evidence
      - infrastructure
    current_role: active_evidence
    method_family: [dpo_style_preference_optimization_discrete_tts]
    claims:
      - claim_id: synparaspeech_synthetic_paralinguistic_finetune
        role: supports
        claim: "Automated mixing of isolated paralinguistic audio events with clean conversational speech, combined with voice conversion for timbre alignment, can produce effective fine-tuning data for paralinguistic TTS."
        source: "§4.2.1, Table 3"
        evidence: "CosyVoice2 SFT on SynParaSpeech achieves PMOS 3.31 versus 2.35 for NVS SFT and 1.88 baseline; F5-TTS SFT on SynParaSpeech similarly achieves PMOS 3.10 versus 1.49 for NVS SFT."
        confidence: high
        relevance: low
      - claim_id: synparaspeech_natural_pairing_dpo
        role: supports
        claim: "DPO with naturally paired utterances (with vs. without paralinguistic events) can improve paralinguistic speech quality beyond SFT alone."
        source: "§4.2.1, Table 3"
        evidence: "CosyVoice2 DPO-Joint (using original clean speech as rejected and paralinguistic-event speech as chosen) achieves PMOS 3.46 and QMOS 4.12 versus SFT-only PMOS 3.31 and QMOS 4.01, with joint SFT+DPO outperforming staged DPO across all subjective dimensions."
        confidence: high
        relevance: high
      - claim_id: synparaspeech_objective_metrics_unreliable_for_paralinguistic
        role: complicates
        claim: "Standard automatic speech quality metrics are unreliable for evaluating paralinguistic TTS systems."
        source: "§4.2.1, Table 3"
        evidence: "All models fine-tuned on paralinguistic data show degraded CER, SECS, and UTMOSv2 relative to baselines despite achieving higher subjective NMOS and QMOS, because e.g. ASR transcribes laughter as 'ha ha'."
        confidence: high
        relevance: low
      - claim_id: synparaspeech_fewshot_icl_paralinguistic_detection
        role: supports
        claim: "Few-shot in-context prompting with paralinguistic examples improves paralinguistic event detection in multimodal LLMs."
        source: "§4.2.2, Table 4"
        evidence: "SynParaSpeech prompt tuning raises accuracy and macro F1 for both Kimi Audio and Qwen 2.5 Omni over no-context baselines, with optimal performance at 5-shot context for both models."
        confidence: medium
        relevance: low
      - claim_id: synparaspeech_context_length_diminishing_returns
        role: complicates
        claim: "Increasing prompt context length for in-context learning in paralinguistic event detection yields diminishing returns and eventually degrades performance."
        source: "§4.2.2, Table 4"
        evidence: "Kimi Audio accuracy peaks at 5-shot (0.382) and declines at 7-shot (0.371); Qwen 2.5 Omni also peaks at 5-shot (0.473) and declines at 7-shot (0.423)."
        confidence: medium
        relevance: low
    limitations:
      - "The corpus is Chinese-only and covers only 6 paralinguistic categories, limiting direct applicability to other languages or richer paralinguistic inventories."
      - "Standard objective metrics (CER, UTMOSv2, SECS) degrade after paralinguistic fine-tuning and do not reflect the true quality improvement observed in subjective evaluation, leaving the field without reliable automatic metrics for this task."
    caveats:
      - "The RLHF-relevant contribution is a natural-pairing DPO application enabled by the dataset's structure (clean vs. paralinguistic-event speech as a ready-made preference pair) rather than a new alignment algorithm; the paper's primary contribution is the dataset construction pipeline, not preference-optimization methodology."

  - id: "2501.04561"
    entry_date: "2026-07-20"
    year: 2025
    venue: arXiv
    task: [SCA, TTS]
    architecture: [autoregressive-LM, hybrid]
    relevance: medium
    evidence_role:
      - control_evidence
    current_role: active_evidence
    method_family: [dpo_style_preference_optimization_discrete_tts]
    claims:
      - claim_id: openomni_text_pivot_alignment
        role: supports
        claim: "Progressive, text-pivoted alignment across modality pairs can substitute for paired tri-modal training data without sacrificing downstream omnimodal task performance."
        source: "§4.2, Table 1"
        evidence: "OpenOmni trains only on speech-text and image-text pairs (no image-speech-text triples) yet outperforms VITA, which is trained on 5M tri-modal samples, by 4 points on OmniBench while using a 7B rather than 7x8B language model and roughly 5x fewer training samples."
        confidence: high
        relevance: low
      - claim_id: openomni_nar_latency_quality_tradeoff
        role: complicates
        claim: "Non-autoregressive discrete-unit speech decoding trades generation quality for latency relative to autoregressive decoding."
        source: "§4.2, §D 'AR mode'"
        evidence: "The AR mode (16K-unit vocabulary) yields higher speech generation quality but slower streaming, while the NAR mode (CTC loss, 6K-unit vocabulary) achieves under-1-second latency for up to 30 seconds of speech (5x faster) at the cost of slightly worse generation quality."
        confidence: medium
        relevance: low
      - claim_id: openomni_ctc_dpo_emotional_coherence
        role: supports
        claim: "Direct preference optimization can be adapted to discrete-unit, CTC-trained speech generators to improve emotional coherence without an auxiliary emotion-control module."
        source: "§4.2, Table 4"
        evidence: "CTC-DPO training on the 9K-pair EO2S-9K preference dataset (Plutchik-based emotion categories, CosyVoice-synthesized positive/negative pairs) raises Emotion2Vec-classified accuracy from 57.9% to 70.4% on Chinese and 62.6% to 65.4% on English test speech."
        confidence: high
        relevance: high
      - claim_id: openomni_moe_necessary_for_ctc_stability
        role: complicates
        claim: "Mixture-of-experts capacity is necessary, not merely beneficial, for stabilizing CTC-loss training of multilingual non-autoregressive speech decoders."
        source: "§3.4, §C, Table 6"
        evidence: "A single feed-forward decoder layer (1 expert) fails to converge on bilingual WeNetSpeech/LibriSpeech data (CER/WER of 113.6/129.7/87.8/96.5), while a 4-expert MoE layer brings these down to single digits (8.5/8.4/4.2/4.7)."
        confidence: high
        relevance: low
    limitations:
      - "The system is trained and validated only on Chinese and English; generalization of the alignment and speech-generation strategy to other languages is untested."
      - "Evaluation of emotional and omnimodal quality relies on automated classifiers (Emotion2Vec, Whisper-based WER) and the authors' own benchmarks rather than independent human listening tests."
    caveats:
      - "The CTC-DPO contribution is one component of a broader omnimodal LLM system; the preference dataset (EO2S-9K) is synthesized rather than human-labeled, and the DPO reference policy is the frozen post-CTC-training model rather than an independently validated baseline."

  - id: "2509.18531"
    entry_date: "2026-07-20"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    evidence_role:
      - negative_evidence
      - core_evidence
      - evaluation_caution
    current_role: influential
    method_family: [dpo_style_preference_optimization_discrete_tts, rl_policy_gradient_reward_optimization]
    claims:
      - claim_id: prosody_grpo_verifiable_reward_collapse
        role: contradicts
        claim: "Reinforcement learning with automatically verifiable rewards can optimize the measured objective while degrading unmeasured perceptual qualities such as prosodic naturalness."
        source: "§4.3, Table 1, Figure 2"
        evidence: "GRPO trained on a harmonic-mean reward of CER and token likelihood reduced CER to the lowest value among all tested systems (2.20%) but produced the lowest human-preference ELO (753.7), with log-F0 pitch distributions showing collapse toward monotone speech relative to the baseline."
        confidence: high
        relevance: high
      - claim_id: prosody_grpo_reward_augmentation_destabilizes
        role: complicates
        claim: "Adding an auxiliary reward term intended to fix a known RL side effect can destabilize training instead of correcting the targeted attribute."
        source: "§4.4"
        evidence: "Extending the GRPO reward with a speaker-similarity utility increased similarity scores but inflated CER to 42.63% and produced degenerate non-terminating outputs (missing end-of-sequence tokens), consistent with reward hacking."
        confidence: high
        relevance: high
      - claim_id: prosody_iterative_dpo_recovers_naturalness
        role: supports
        claim: "Small-scale iterative human preference optimization can recover perceptual speech qualities lost to metric-driven RL training without requiring a large static preference dataset."
        source: "§4.5, Table 1"
        evidence: "Using approximately 200 human preference pairs per round with a moving DPO reference, three iterative rounds raised ELO from 753.7 (GRPO) to a peak of 1190.1 at round 2, exceeding three commercial TTS baselines in human preference, while CER recovered to 3.30-3.60% by rounds 2-3."
        confidence: high
        relevance: high
      - claim_id: prosody_iterative_dpo_nonmonotonic_gains
        role: refines
        claim: "The benefit of successive rounds of iterative preference optimization is not monotonic and can saturate or reverse as the policy converges toward its own reference."
        source: "§4.5"
        evidence: "ELO peaked at round 2 (1190.1) and declined at round 3 (1064.2); the authors attribute this to a narrowing policy-reference gap reducing the informativeness of newly collected preference pairs in later rounds."
        confidence: medium
        relevance: high
    limitations:
      - "The evaluation is narrow: a single base architecture (Llasa-1B derived), a single language and domain (Korean call-center dialogue), a single fine-tuned speaker voice, a 50-utterance test set, and 596 votes from 27 raters."
      - "No ablation is reported over the DPO sharpness parameter (beta) or preference-pair budget per round; the mechanism behind the round-3 ELO decline is a hypothesis rather than directly verified."
    caveats:
      - "Open-source TTS systems were deliberately excluded from the human-preference comparison after a preliminary screening judged them to produce floor-effect prosody, which removes a category of baseline from the headline ELO comparison; the GRPO speaker-similarity failure is reported as a single run rather than across multiple reward-weighting configurations."

  - id: "2509.18928"
    entry_date: "2026-07-20"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [autoregressive-LM, diffusion, hybrid]
    relevance: high
    evidence_role:
      - core_evidence
      - architecture_variant
    current_role: influential
    method_family: [continuous_generative_preference_optimization]
    claims:
      - claim_id: ardm_dpo_extension_to_diffusion
        role: supports
        claim: "Direct Preference Optimization can be extended beyond discrete-token generative models to continuous-token autoregressive diffusion models for speech, by marginalizing the DPO objective over intermediate diffusion states of the autoregressive sampling trajectory."
        source: "§3, §4.2, Table 1"
        evidence: "The derived ARDM-DPO objective reduces to a log-sigmoid of the difference in denoising losses between the fine-tuned and reference model on winning vs. losing trajectories; applied to a 0.4B DiTAR model it nearly doubles F0 variance (14.2 to 29.2) while WER improves (5.17 to 3.73) after 200 training steps."
        confidence: high
        relevance: high
      - claim_id: ardm_dpo_automatic_proxy_preference_data
        role: supports
        claim: "Automatic proxy signals, rather than human-labeled preference pairs, can be used to construct DPO training data that improves a targeted, measurable aspect of speech generation quality."
        source: "§4.3, Table 2"
        evidence: "Task B builds 430k preference pairs by ranking 16 candidate outputs per prompt using a separately trained CTC model's negative log-likelihood as an intelligibility proxy; this reduces CER by 25% (8.37 to 6.32) on the Seed-TTS-Eval hard test set while preserving speaker similarity and naturalness in subjective tests."
        confidence: high
        relevance: high
      - claim_id: ardm_dpo_training_instability
        role: complicates
        claim: "DPO fine-tuning of autoregressive diffusion speech models is not guaranteed to be stable and can require early stopping to prevent degradation of speaker similarity and naturalness."
        source: "§4.2, Fig. 3, §5"
        evidence: "Across the beta in {200, 400, 800} grid search for Task A, speaker similarity decreases monotonically throughout training regardless of beta, and the diffusion loss for both preferred and dispreferred samples increases during training instead of diverging as the objective predicts."
        confidence: high
        relevance: high
      - claim_id: ardm_dpo_beats_bestofk_and_raft
        role: refines
        claim: "Preference-optimizing a generative TTS model via a single fine-tuning run can match or exceed the quality gains obtained by inference-time best-of-K sampling or iterative rejection-sampling fine-tuning, without their added inference-time or multi-round training cost."
        source: "§4.2, Table 1"
        evidence: "On Task A, ARDM-DPO (200 steps, beta=200) reaches F0V 29.2, higher than best-of-64 sampling (26.6, no training) and three iterations of RAFT rejection-sampling SFT (20.1), while requiring a single training run and no extra inference-time sampling."
        confidence: high
        relevance: high
    limitations:
      - "All experiments fine-tune a single proprietary 0.4B DiTAR checkpoint pretrained on an internal 280,000-hour corpus, with no code or model release; the reported gains cannot be independently reproduced or verified on a public base model."
      - "Training instability on Task A (monotonically decreasing speaker similarity across all tested beta values) is acknowledged as unresolved and requires manual early stopping rather than a principled stopping criterion."
    caveats:
      - "The preference signals used (F0 variance, CTC-model negative log-likelihood) are automatic proxies for expressiveness and intelligibility rather than direct human preference judgments, so the method is validated against these specific proxies rather than against a broader notion of listener preference."

  - id: "2509.19928"
    entry_date: "2026-07-20"
    year: 2025
    venue: arXiv
    task: [TTS, evaluation]
    architecture: []
    relevance: low
    evidence_role:
      - evaluation_caution
    current_role: minor
    method_family: []
    claims:
      - claim_id: prosodyeval_token_distance_correlates_with_perception
        role: supports
        claim: "Acoustic proxy metrics for prosodic variation correlate weakly with human perception, while distance measures computed over discretized self-supervised speech tokens correlate substantially better."
        source: "§4.1, Table 1"
        evidence: "Averaged Pearson correlation with human PMOS ratings is r=0.30 for log F0 RMSE and r=0.66 for MCD, versus r=0.77 for the proposed DS-WED token-edit-distance metric, aggregated across 1000 samples and 2000 ratings."
        confidence: high
        relevance: low
      - claim_id: prosodyeval_ar_vs_fm_diversity
        role: supports
        claim: "Autoregressive generation provides greater output diversity in prosody than non-autoregressive flow-matching models with implicit text-speech alignment, but this advantage does not extend to non-autoregressive masked generative modeling."
        source: "§4.4-4.5, Table 2"
        evidence: "Three AR systems (XTTS-v2, CosyVoice, CosyVoice 2) outperform three flow-matching NAR systems (E2 TTS, F5-TTS, ZipVoice) in DS-WED prosody diversity, while the masked generative modeling system MaskGCT surpasses all AR systems on LibriSpeech and remains competitive on Seed-TTS despite training on the same Emilia corpus as the flow-matching systems."
        confidence: medium
        relevance: low
      - claim_id: prosodyeval_duration_perturbation_partial_fix
        role: complicates
        claim: "Explicit duration control during inference is a significant, but not sufficient, factor in restoring prosodic diversity to non-autoregressive TTS systems with implicit alignment."
        source: "§4.5, Table 3"
        evidence: "Applying duration perturbation (0.8-1.2x) to two flow-matching/MGM NAR systems increases DS-WED diversity by 13.8-28.5%, but the perturbed flow-matching system F5-TTS still lags behind AR and MGM systems evaluated without perturbation."
        confidence: medium
        relevance: low
      - claim_id: prosodyeval_dpo_suppresses_prosody_diversity
        role: complicates
        claim: "Preference optimization that targets one quality dimension (intelligibility) can measurably suppress output diversity along an unrelated axis (prosody) as a side effect."
        source: "§4.5, Table 4"
        evidence: "Applying DPO for intelligibility to CosyVoice 2 and MaskGCT reduces DS-WED prosody-diversity scores by 18.8% and 2.9-3.2% respectively across two test sets, with no diversity-specific reward term in the alignment objective."
        confidence: high
        relevance: high
      - claim_id: prosodyeval_llm_judge_unreliable_for_prosody
        role: contradicts
        claim: "A general-purpose large audio language model with strong multimodal reasoning capability can serve as a reliable automatic judge of fine-grained prosodic variation."
        source: "§4.5, Table 5"
        evidence: "Gemini 2.5 Pro, prompted to rate relative prosodic difference within groups of five samples, achieves only a weak correlation with human PMOS ratings (r=0.27) and unstable, wide-confidence-interval correlations with objective acoustic and token-based metrics."
        confidence: medium
        relevance: low
    limitations:
      - "DS-WED has only been validated on English speech; cross-lingual applicability is untested."
      - "The DPO and duration-perturbation exploration each cover only two systems, limiting how confidently the reported trends generalize across the broader space of NAR TTS architectures."
    caveats:
      - "This is primarily an evaluation-methodology paper; its only claim bearing directly on RLHF for speech (that DPO for intelligibility measurably reduces prosody diversity as a side effect) is a secondary application of the paper's core metric contribution rather than a proposed alignment method."

  - id: "2509.25416"
    entry_date: "2026-07-20"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [diffusion]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: influential
    method_family: [continuous_generative_preference_optimization]
    claims:
      - claim_id: easpo_stepwise_beats_endpoint_dpo
        role: supports
        claim: "Applying preference supervision at each denoising step of a diffusion model, rather than only at the final generated output, improves alignment with a fine-grained target attribute compared to endpoint-propagated preference optimization."
        source: "§3.4, Table 8"
        evidence: "Under a matched Grad-TTS backbone, the stepwise EASPO method outperforms three prior diffusion-DPO variants (DDPO, D3PO, Diffusion-DPO) on emotion similarity, prosody similarity, WER, and UTMOS."
        confidence: high
        relevance: high
      - claim_id: easpo_endpoint_propagation_assumption_invalid
        role: complicates
        claim: "The assumption underlying trajectory-level preference propagation in diffusion models, that all intermediate states on a path toward a preferred final output are themselves preferred, does not reliably hold."
        source: "§1, §2.2"
        evidence: "The paper motivates its stepwise design specifically by rejecting this assumption, and shows local win/lose selection at a shared latent outperforms endpoint-propagated variants."
        confidence: medium
        relevance: high
      - claim_id: easpo_contrastive_scorer_on_noisy_states
        role: supports
        claim: "A contrastive audio-language scoring model can be adapted to evaluate noisy intermediate diffusion states, enabling automatic preference-pair construction without categorical emotion classifiers."
        source: "§2.1, Table 3"
        evidence: "Adding a time-aware normalization layer to a CLAP-based encoder (CLEP) and training it with diffusion-perturbed audio pairs lets it score emotional-prompt consistency directly on noisy mel-spectrograms; removing this timestep conditioning degrades Emo SIM, Prosody SIM, WER, and UTMOS."
        confidence: high
        relevance: high
      - claim_id: easpo_topcandidate_rollout_bias
        role: complicates
        claim: "In RLHF-style fine-tuning of diffusion generation, continuing rollouts from the highest-reward candidate at each step, rather than a randomly selected candidate, biases training toward degenerate regions and reduces overall quality."
        source: "§2.1, §3.4, Table 4"
        evidence: "The paper reports that random selection of the next rollout state from the candidate pool consistently improves performance relative to continuing from the top-ranked (winning) candidate."
        confidence: high
        relevance: high
    limitations:
      - "Evaluation is confined to a single diffusion TTS backbone (Grad-TTS) and a single, small English emotion corpus (ESD: 5 emotions x 10 speakers, 350 utterances/emotion)."
      - "The paper does not report parameter counts for the fine-tuned decoder or wall-clock/inference overhead introduced by the k-candidate sampling and reward scoring at each training step, which matters for RLHF-style diffusion fine-tuning cost."
    caveats:
      - "Generalization to other diffusion or flow-based TTS architectures, other languages, or continuous/non-categorical emotional targets is untested; the reward-difference matching objective is adapted from a prior image-diffusion alignment method (PRDP) rather than developed from scratch for speech."

claim_clusters:
  - id: rlhf_posttraining_beats_sft_baseline
    claim: >-
      Preference- or reward-based post-training (DPO, KTO, GRPO, differentiable-reward optimization)
      for TTS/SLM generation consistently improves intelligibility, speaker similarity, or naturalness
      beyond what supervised fine-tuning alone achieves.
    status: strongly_supported
    confidence: high
    supporting_papers: ["2406.00654", "2025.icnlsp-1.34", "2509.00685", "2509.05863", "2025.acl-long.598", "2507.21138", "2504.02407", "2509.14946", "interspeech-2025-0063", "2505.17589", "2025.findings-acl.631"]
    contradicting_papers: []
    refining_papers: []
    caveats:
      - >-
        This is the headline result replicated across 11 independent papers spanning DPO, KTO, GRPO, and
        differentiable-reward methods, but each paper measures a different subset of WER/SIM/MOS
        metrics, so the effect size is not directly comparable across papers.
    last_reviewed: "2026-07-20"

  - id: rlhf_reward_hacking_risk
    claim: >-
      RL/RLHF post-training for speech generation optimized against an automatically measured proxy
      reward is prone to reward hacking, degrading unmeasured or complementary perceptual qualities
      (prosody naturalness, emotional appropriateness, non-targeted objectives) unless explicitly
      counteracted.
    status: strongly_supported
    confidence: high
    supporting_papers: ["2406.02430", "2502.11946", "2507.17527", "2509.18531", "2509.19928", "2508.16332", "2509.05863"]
    contradicting_papers: []
    refining_papers: ["interspeech-2025-0063", "2509.25416"]
    caveats:
      - >-
        No paper in the corpus disputes that reward hacking is a real risk; disagreement (where it
        exists) is only about which mitigation works best, not whether the phenomenon occurs.
      - >-
        2509.18531 (Prosody-GRPO) is the most extreme documented case: GRPO on a harmonic-mean
        CER/likelihood reward achieved the lowest CER of any tested system while producing the lowest
        human-preference ELO score, with pitch collapsing toward monotone speech.
    last_reviewed: "2026-07-20"

  - id: preference_pair_construction_determines_dpo_success
    claim: >-
      The construction strategy for DPO/preference training pairs in speech generation (checkpoint
      diversity, cross-model vs. self-comparison sourcing, natural vs. synthetic pairing, automatic
      scoring of noisy intermediate states) has a first-order effect on alignment outcome quality,
      independent of the DPO objective itself.
    status: strongly_supported
    confidence: high
    supporting_papers: ["2025.icnlsp-1.34", "2025.acl-long.598", "2509.14946", "2406.00654", "2509.18928", "2509.25416"]
    contradicting_papers: []
    refining_papers: []
    caveats:
      - >-
        2025.icnlsp-1.34 found DPO from an ASR-fine-tuned checkpoint underperforms DPO from the base
        model because standard fine-tuning narrows generation diversity, leaving insufficient variation
        for the preference signal: a direct mechanistic explanation for why 2406.00654 (UNO) argues
        pairwise DPO is impractical for codec TTS in the first place.
    last_reviewed: "2026-07-20"

  - id: differentiable_reward_backprop_cheaper_than_policy_gradient
    claim: >-
      Backpropagating gradients from a frozen differentiable reward/critic model through discrete
      speech tokens via Gumbel-Softmax achieves comparable or better alignment gains than PPO-style
      policy-gradient RL or standard DPO, at lower computational cost, by avoiding multi-sample
      rollout or multi-forward-pass overhead.
    status: strongly_supported
    confidence: high
    supporting_papers: ["2412.10117", "2505.17589", "interspeech-2025-0704"]
    contradicting_papers: []
    refining_papers: []
    caveats:
      - >-
        Validated only within the CosyVoice architecture family (CosyVoice 2, CosyVoice 3, and the
        Interspeech DiffRO paper all build on the same lineage): no independent replication on an
        unrelated backbone yet.
    last_reviewed: "2026-07-20"

  - id: grpo_extends_to_non_autoregressive_tts
    claim: >-
      GRPO/policy-gradient RL, originally developed for discrete-token generation, can be extended to
      non-autoregressive flow-matching TTS pipelines by reformulating a continuous output as a
      probabilistic (Gaussian) distribution or by applying RL to a discrete upstream subcomponent,
      yielding measurable WER/SIM gains.
    status: emerging
    confidence: medium
    supporting_papers: ["2504.02407", "2507.14988"]
    contradicting_papers: []
    refining_papers: []
    caveats:
      - >-
        Both papers apply RL to a narrow, isolated component (F5R-TTS: the final output layer;
        DMOSpeech2: only the duration predictor) rather than the full flow-matching generation process.
    last_reviewed: "2026-07-20"

  - id: rlhf_alignment_is_data_and_compute_efficient
    claim: >-
      Preference or reward-based post-training for speech generation can achieve substantial quality
      gains using only a small fraction of pretraining-scale data, compute, or update steps, and a
      single fine-tuning run can match or exceed the gains from inference-time best-of-K sampling or
      iterative rejection-sampling fine-tuning (RAFT).
    status: strongly_supported
    confidence: high
    supporting_papers: ["2406.00654", "2504.02407", "2025.findings-acl.631", "2509.18928"]
    contradicting_papers: []
    refining_papers: []
    caveats:
      - >-
        2025.findings-acl.631 (Slam) frames this as scaling laws being too pessimistic because they
        don't factor in a subsequent DPO stage, rather than a direct efficiency claim about DPO itself:
        a related but distinct framing worth keeping separate in future review.
    last_reviewed: "2026-07-20"

  - id: preference_optimization_extends_to_continuous_generative_tts
    claim: >-
      DPO-style preference optimization, originally formulated for discrete autoregressive token
      sequences, can be reformulated for continuous or iterative-denoising generative TTS
      architectures (flow-matching, diffusion, autoregressive-diffusion hybrids) by operating in
      velocity space, marginalizing over intermediate diffusion states, or applying local win/lose
      preference supervision at each denoising step, without requiring an external reward model.
    status: strongly_supported
    confidence: high
    supporting_papers: ["2025.acl-long.598", "2509.18928", "2509.25416"]
    contradicting_papers: []
    refining_papers: []
    caveats:
      - >-
        2509.25416 (EASPO) additionally shows that endpoint-propagated preference optimization (applying
        preference supervision only to the final output) underperforms local, stepwise supervision,
        because the assumption that intermediate states toward a preferred output are themselves
        preferred does not reliably hold.
      - >-
        Each of the 3 papers validates on a different, non-overlapping backbone (F5-TTS/MaskGCT, DiTAR,
        Grad-TTS); no cross-backbone replication yet.
    last_reviewed: "2026-07-20"

  - id: reward_model_training_benefits_from_rl_and_reward_shaping
    claim: >-
      Training automatic reward models / evaluators for speech RLHF benefits from RL-based training
      (over plain supervised fine-tuning) and from carefully shaped, nonlinear reward functions and
      chain-of-thought reasoning, mirroring patterns established in text-domain RLHF.
    status: emerging
    confidence: medium
    supporting_papers: ["2505.09558"]
    contradicting_papers: []
    refining_papers: []
    caveats:
      - >-
        Single-paper finding; 2508.08957 (QAMRO) trains a comparable audio-quality predictor but with a
        ranking loss rather than RL, so it does not independently corroborate the RL-specific portion of
        this claim.
    last_reviewed: "2026-07-20"

  - id: composite_multiobjective_rewards_outperform_single_metric_but_need_balancing
    claim: >-
      RL or preference-optimization reward functions that jointly target multiple speech quality
      dimensions (intelligibility, speaker similarity, emotion, prosody) outperform single-metric
      rewards, which improve only their targeted dimension and can degrade complementary ones, but
      balancing multiple reward terms remains a nontrivial, often under-ablated engineering problem.
    status: strongly_supported
    confidence: high
    supporting_papers: ["2507.21138", "2508.16332", "2509.00685", "interspeech-2025-0704"]
    contradicting_papers: []
    refining_papers: []
    caveats:
      - >-
        2508.16332 (Vevo2) is the clearest negative case: intelligibility-only GRPO reward dropped
        melody accuracy from 65% to 50%, only resolved by joint multi-objective reward design.
    last_reviewed: "2026-07-20"

  - id: rlhf_alignment_generalizes_crosslingually
    claim: >-
      Preference- or reward-based alignment trained on a small set of high-resource languages
      generalizes intelligibility/quality gains to unseen languages without requiring language-
      specific alignment data.
    status: emerging
    confidence: medium
    supporting_papers: ["2025.acl-long.598", "interspeech-2025-0704"]
    contradicting_papers: []
    refining_papers: []
    caveats:
      - >-
        Both papers test generalization to a small number of additional languages (INTP: Japanese,
        Korean, German, French; DiffRO: Japanese, Korean) from an English+Chinese/Mandarin training
        base: broader multilingual coverage is untested.
    last_reviewed: "2026-07-20"

  - id: preference_optimization_improves_slm_semantic_coherence
    claim: >-
      Preference optimization (DPO) with semantic-quality feedback (LLM scoring or synthetic
      preference data) improves long-range semantic coherence and generation quality in textless
      spoken language models beyond next-token pretraining, more effectively than perplexity-based
      selection.
    status: emerging
    confidence: high
    supporting_papers: ["2025.acl-long.997", "2025.findings-acl.631"]
    contradicting_papers: []
    refining_papers: ["2025.acl-long.997"]
    caveats:
      - >-
        2025.acl-long.997 (AlignSLM) itself refines this claim: semantic gains do not transfer uniformly
        to lexical/grammatical correctness (sBLIMP), and even the best preference-optimized variant
        remains behind a cascaded ASR+LLM topline.
    last_reviewed: "2026-07-20"

  - id: rlhf_alignment_bounded_by_base_model_capability
    claim: >-
      Gains from preference or reward-based alignment are ultimately bounded by the base model's
      underlying capability: iterative alignment rounds show diminishing returns, and RL-optimized
      systems approach but do not fully close the gap to oracle best-of-N or cascaded-system toplines.
    status: strongly_supported
    confidence: medium
    supporting_papers: ["2025.acl-long.997", "2025.acl-long.598", "2507.14988"]
    contradicting_papers: []
    refining_papers: []
    caveats:
      - >-
        This is a consistent qualitative pattern across three independent papers, but none directly
        measures the ceiling's location, only that alignment approaches without fully reaching an oracle
        or topline comparator.
    last_reviewed: "2026-07-20"

  - id: rl_posttraining_for_streaming_s2s_translation
    claim: >-
      For streaming/simultaneous end-to-end speech-to-speech translation, RL post-training combining
      fine-grained process rewards with holistic outcome rewards improves latency more substantially
      than translation quality, and outperforms cascaded commercial systems on both dimensions.
    status: emerging
    confidence: high
    supporting_papers: ["2507.17527"]
    contradicting_papers: []
    refining_papers: []
    caveats:
      - >-
        Single-paper finding from a proprietary system (SeedLiveInterpret) with no public weights or
        reproducible baseline; the RL framework is specialized for chunk-level read-write policies and
        duration-matching rewards specific to simultaneous interpretation.
    last_reviewed: "2026-07-20"

  - id: rlhf_training_instability_requires_regularization_or_early_stopping
    claim: >-
      RL or DPO fine-tuning of speech generation models (autoregressive or diffusion-based) is prone
      to training instability, capability collapse, or monotonic degradation of held-out quality
      metrics without explicit regularization (e.g. cross-entropy penalty) or early stopping,
      particularly as training progresses beyond an optimal point.
    status: strongly_supported
    confidence: high
    supporting_papers: ["2509.00685", "2509.18928", "2509.18531"]
    contradicting_papers: []
    refining_papers: []
    caveats:
      - >-
        2509.00685 (MPO) documents catastrophic CER inflation (4.72 to 14.52) without CE regularization;
        2509.18928 (ARDM-DPO) documents monotonically decreasing speaker similarity across all tested
        beta values with no principled stopping criterion; 2509.18531 (Prosody-GRPO) documents non-
        monotonic ELO across iterative DPO rounds, peaking at round 2 and declining at round 3.
    last_reviewed: "2026-07-20"

  - id: sca_rlhf_addresses_distinct_failure_modes_from_tts_quality_alignment
    claim: >-
      RLHF applied to spoken conversational agents / dialogue systems targets qualitatively different
      failure modes (evasive or unhelpful responses to ambiguous input, semantic inconsistency, token-
      distribution mismatch) than RLHF applied to raw TTS acoustic quality, and this direction remains
      substantially underexplored relative to text-LLM RLHF.
    status: emerging
    confidence: medium
    supporting_papers: ["2502.11946"]
    contradicting_papers: []
    refining_papers: ["2025.acl-long.682"]
    caveats:
      - >-
        2025.acl-long.682 is a survey citing this pattern from secondary sources (AlignSLM, SpeechAlign)
        rather than presenting independent primary evidence, so this cluster currently rests on one
        primary-research data point (Step-Audio's 'deaf hacking' finding) plus one literature-review
        corroboration.
    last_reviewed: "2026-07-20"

  - id: intrinsic_backbone_reward_sufficient_for_alignment
    claim: >-
      An intrinsic reward signal derived from a speech LM's own output probability distribution
      (without an external reward model, human annotations, or ground-truth speech) is sufficient to
      drive meaningful post-training alignment, when combined with fine-grained trajectory-level
      (rather than sequence-level) optimization.
    status: emerging
    confidence: high
    supporting_papers: ["2508.15442"]
    contradicting_papers: []
    refining_papers: []
    caveats:
      - >-
        Single-paper finding (GOAT) using a GFlowNet trajectory-balance objective, a distinct paradigm
        from every other paper in the corpus: no second paper yet replicates or extends GFlowNet-based
        intrinsic-reward alignment for speech.
      - >-
        The paper's own authors acknowledge the core assumption (that the backbone LM assigns higher
        probability to higher-quality sequences) as a hypothesis, not a proven property.
    last_reviewed: "2026-07-20"

  - id: image_domain_rl_techniques_transfer_poorly_to_speech
    claim: >-
      RL/regularization techniques developed for text-to-image diffusion alignment (e.g. plain KL-
      divergence regularization) transfer poorly to speech diffusion TTS, because audio generation
      requires stronger temporal coherence than image synthesis; incorporating the model's own
      diffusion training loss as a penalty term in the reward function works better.
    status: emerging
    confidence: high
    supporting_papers: ["interspeech-2025-0063"]
    contradicting_papers: []
    refining_papers: []
    caveats:
      - >-
        Single-paper finding (DLPO) benchmarked against 4 image-domain RL baselines (DDPO, DPOK, KLinR,
        RWR) on a single-speaker dataset with a relatively simple diffusion TTS backbone (WaveGrad 2R):
        untested on more capable flow-matching or score-based TTS systems.
    last_reviewed: "2026-07-20"

  - id: lm_level_rlhf_cannot_fix_post_lm_pipeline_quality
    claim: >-
      In cascaded TTS pipelines where an LM component is followed by a separate flow-matching/vocoder
      stage, RLHF applied only at the LM/token level has limited ability to improve final audio
      quality attributes (MOS, speaker characteristics) that are primarily determined by the
      downstream, frozen post-LM stages.
    status: emerging
    confidence: high
    supporting_papers: ["interspeech-2025-0704"]
    contradicting_papers: []
    refining_papers: []
    caveats:
      - >-
        Single-paper finding; the paper shows DiffRO can shift codec-level predicted MOS substantially
        but the final audio MOS change after the frozen flow-matching+vocoder stages is comparatively
        modest, implying a structural ceiling on LM-level-only RLHF in cascaded architectures.
    last_reviewed: "2026-07-20"

  - id: dpo_adapts_to_non_autoregressive_ctc_decoders
    claim: >-
      DPO-style preference optimization can be adapted to non-autoregressive, CTC-trained discrete-
      unit speech decoders to improve a targeted qualitative attribute (e.g. emotional coherence)
      without requiring an auxiliary control module.
    status: emerging
    confidence: high
    supporting_papers: ["2501.04561"]
    contradicting_papers: []
    refining_papers: []
    caveats:
      - >-
        Single-paper finding (OpenOmni); the CTC-DPO contribution is one component of a broader
        omnimodal LLM system, and the preference dataset used is synthesized rather than human-labeled.
    last_reviewed: "2026-07-20"

  - id: iterative_human_preference_optimization_recovers_rl_induced_degradation
    claim: >-
      When RL post-training optimized for a verifiable proxy reward degrades an unmeasured perceptual
      quality, a subsequent small-scale iterative human preference optimization (DPO) stage using only
      a few hundred preference pairs per round can recover much of the lost quality, though gains
      across rounds are not strictly monotonic and can saturate or reverse.
    status: emerging
    confidence: high
    supporting_papers: ["2509.18531"]
    contradicting_papers: []
    refining_papers: []
    caveats:
      - >-
        Single-paper finding (Prosody-GRPO); evaluated on a narrow scope (single fine-tuned speaker
        voice, Korean call-center dialogue, 50-utterance test set, 27 raters): the generality of the
        recovery effect across domains/languages is untested.
    last_reviewed: "2026-07-20"

method_families:
  - id: dpo_style_preference_optimization_discrete_tts
    name: "DPO/KTO-style preference optimization on discrete-token TTS/SLM output"
    summary: >-
      Offline preference optimization (DPO, KTO, or regularized variants) applied directly to a
      discrete-token autoregressive TTS or spoken-language-model decoder's own generated output, using
      a log-ratio or classification-style objective without an explicit policy-gradient rollout.
    papers:
      - "2406.00654"
      - "2412.10117"
      - "2025.acl-long.598"
      - "2025.acl-long.997"
      - "2025.findings-acl.631"
      - "2025.icnlsp-1.34"
      - "2509.00685"
      - "2509.05863"
      - "2509.14946"
      - "2501.04561"
      - "2509.18531"
    open_questions:
      - >-
        How much of DPO's reported gain in this family depends on preference-pair construction quality
        (checkpoint diversity, cross-model sourcing) versus the DPO objective itself?
  - id: rl_policy_gradient_reward_optimization
    name: "Policy-gradient RL with explicit reward signals (GRPO/PPO/REINFORCE)"
    summary: >-
      Online reinforcement learning (GRPO, PPO, or REINFORCE) using an explicit scalar reward computed
      on synthesized audio, intermediate tokens, or task-level metrics (WER, speaker similarity,
      DNSMOS, translation quality), applied to autoregressive-LM, flow-matching, or diffusion TTS/SCA
      systems via a policy-gradient update.
    papers:
      - "2406.02430"
      - "2502.11946"
      - "2504.02407"
      - "2507.14988"
      - "2507.21138"
      - "2507.17527"
      - "interspeech-2025-0063"
      - "2508.16332"
      - "2509.18531"
    open_questions:
      - >-
        Does the reward-hacking pattern documented repeatedly in this family (Seed-TTS, Prosody-GRPO,
        Vevo2, SeedLiveInterpret) have a general mitigation, or is it addressed ad hoc per paper?
  - id: differentiable_reward_gradient_backprop
    name: "Differentiable reward optimization via gradient backpropagation through discrete tokens"
    summary: >-
      Backpropagates gradients from a frozen differentiable reward or critic model (e.g. an ASR
      decoder) directly through discrete speech-token predictions via Gumbel-Softmax, bypassing
      explicit RL rollout or PPO-style policy-gradient loops.
    papers:
      - "2412.10117"
      - "2505.17589"
      - "interspeech-2025-0704"
    open_questions:
      - >-
        Does differentiable-reward backprop generalize beyond the CosyVoice architecture family it has
        so far been validated on?
  - id: continuous_generative_preference_optimization
    name: "Preference optimization extended to continuous/iterative-denoising generative TTS"
    summary: >-
      Adapts DPO-style preference optimization to non-autoregressive continuous generative TTS (flow-
      matching, diffusion, autoregressive-diffusion hybrids) by operating in velocity space,
      marginalizing the objective over intermediate diffusion states, or applying local win/lose
      preference supervision at each denoising step, without requiring an external reward model.
    papers:
      - "2025.acl-long.598"
      - "2509.18928"
      - "2509.25416"
    open_questions:
      - >-
        Each of the 3 papers in this family validates on a single, different backbone (F5-TTS/MaskGCT,
        DiTAR, Grad-TTS) with no cross-backbone replication yet: does the technique transfer across
        continuous TTS architectures?
  - id: reward_model_infrastructure
    name: "Reward model / automatic evaluator construction for speech RLHF"
    summary: >-
      Trains a dedicated reward model or automatic quality predictor for speech (via RL or ranking-
      based objectives) as reusable infrastructure for future RLHF pipelines, rather than directly
      aligning a TTS/SCA generation model.
    papers:
      - "2505.09558"
      - "2508.08957"
    open_questions:
      - >-
        Neither WavReward nor QAMRO has yet been plugged into an end-to-end RLHF training loop as the
        reward source for a generation model in the corpus: does either transfer effectively when used
        that way?

reassessment_queue:
  - id: intrinsic_backbone_reward_sufficient_for_alignment
    type: method_family
    reason: >-
      GOAT (2508.15442) is currently the sole paper using a GFlowNet-based intrinsic-reward paradigm
      for speech alignment; the family threshold (>=2 papers) has not been met.
    trigger: >-
      A second paper adopts GFlowNet trajectory-balance optimization, or otherwise validates
      intrinsic-reward-only alignment without an external reward model or human preference data, for
      any speech generation task.
    due: "2026-12"
    current_assessment: emerging
    watch_for:
      - >-
        GFlowNet or trajectory-balance objectives applied to TTS/SLM/VC alignment.
      - >-
        Replication of the backbone-probability-as-reward assumption on a second architecture.

  - id: preference_optimization_extends_to_continuous_generative_tts
    type: claim_status
    reason: >-
      Strongly_supported status rests on 3 papers, each validated on a different, non-overlapping
      backbone (F5-TTS/MaskGCT, DiTAR, Grad-TTS) with no direct cross-backbone replication: a similar
      pattern to flow-matching's cfg_conditioning_mechanism_adopted cluster before it was downgraded
      to contested.
    trigger: >-
      A new paper either replicates one of the three specific techniques (DPO-FM/DPO-MGM, ARDM-DPO
      trajectory marginalization, EASPO stepwise supervision) on a backbone already used by another
      paper in this cluster, or reports a negative result when attempting to transfer one of them.
    due: "2027-01"
    current_assessment: strongly_supported
    watch_for:
      - >-
        Direct backbone overlap between two papers in this family (currently zero).
      - >-
        A negative-result paper showing one of these three techniques fails to transfer to a new
        continuous-generative backbone.

  - id: sca_rlhf_addresses_distinct_failure_modes_from_tts_quality_alignment
    type: claim_status
    reason: >-
      Currently rests on one primary-research data point (Step-Audio's 'deaf hacking' finding) plus
      one survey's secondary citation of AlignSLM/SpeechAlign: thinner evidentiary basis than most
      other strongly_supported or emerging clusters in this concept.
    trigger: >-
      A second primary-research paper (not a survey) reports a distinct RLHF failure mode specific to
      spoken dialogue/SCA systems, corroborating that SCA-level alignment differs structurally from
      TTS-acoustic-quality alignment.
    due: "2026-12"
    current_assessment: emerging
    watch_for:
      - >-
        New SCA/dialogue papers applying RLHF or DPO directly to a conversational (not single-utterance
        TTS) speech model.
      - >-
        Reports of reward-model failure modes specific to ambiguous or multi-turn audio input.

open_questions:
  - >-
    Does GFlowNet-based intrinsic-reward alignment (GOAT) generalize beyond hallucination
    suppression to other quality dimensions, and does it replicate on a second backbone?
  - >-
    Can preference/RL alignment techniques so far validated on a single flow-matching or diffusion
    TTS backbone (F5R-TTS, DMOSpeech2, ARDM-DPO, EASPO) be shown to transfer across backbones, or is
    each currently a backbone-specific proof of concept?
  - >-
    Is there a principled, generalizable mitigation for RLHF reward hacking in speech generation
    (dual held-out metrics, human-in-the-loop iterative DPO, constrained multi-objective rewards),
    or do current mitigations remain ad hoc per-paper workarounds?
  - >-
    How does RLHF alignment for spoken conversational agents / dialogue quality differ
    mechanistically from RLHF alignment for raw TTS acoustic quality, and can a unified framework
    address both?

trend_notes:
  - >-
    RLHF/preference-optimization methodology for speech generation is a fast-moving, recently-
    emerged research direction: all 29 papers integrated for this concept were published between
    June 2024 and September 2025, with roughly two-thirds appearing in Q3 2025 alone.
  - >-
    DPO-style preference optimization directly on discrete autoregressive codec tokens is the
    dominant paradigm by paper count (10 of 29 papers), closely followed by policy-gradient RL
    (GRPO/PPO/REINFORCE, 9 papers); extending either family to non-autoregressive flow-matching or
    diffusion TTS backbones is a newer, less mature direction (6 papers total across the
    differentiable-reward and continuous-preference-optimization families) that emerged mostly in Q3
    2025.
  - >-
    Reward hacking / proxy-objective side effects (degraded prosody, evasive 'deaf hacking'
    responses, reduced output diversity) recur across roughly a quarter of the corpus (7 of 29
    papers) regardless of underlying architecture or optimization method, suggesting this is a
    structural property of applying automatically verifiable rewards to speech generation rather
    than a defect specific to any single technique.
