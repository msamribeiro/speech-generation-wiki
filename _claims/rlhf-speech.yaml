    current_role: active_evidence
    method_family: [rl_policy_gradient_reward_optimization]
    claims:
      - claim_id: dmospeech2_grpo_subcomponent_efficiency
        role: supports
        claim: "Applying GRPO to a discrete upstream subcomponent of a distilled TTS pipeline achieves perceptual metric gains at substantially lower computational cost than whole-system RL."
        source: "§3.2.2, §4.1, Table 1"
        evidence: "Duration predictor GRPO fine-tuning uses 4-step student inference for reward computation and converges in 1.5K steps; on Seed-TTS-en, WER improves from 3.750 (no RL) to 1.752 and SIM from 0.672 to 0.698 without modifying the synthesis model."
        confidence: high
        relevance: high
      - claim_id: dmospeech2_duration_bottleneck
        role: supports
        claim: "Duration prediction quality independently constrains intelligibility and speaker similarity in non-autoregressive TTS regardless of synthesis model capacity."
        source: "§A.1, Table 3"
        evidence: "With the same flow-matching generator, WER on Seed-TTS-en ranges from 1.723 (best-of-8 oracle duration sampling) to 3.750 (unoptimized predictor) to 1.752 (RL-optimized), establishing duration as the primary bottleneck."
        confidence: high
        relevance: medium
      - claim_id: dmospeech2_distillation_reduces_diversity
        role: complicates
        claim: "Distribution matching distillation in flow-matching TTS reduces prosodic diversity disproportionately relative to acoustic quality, concentrating degradation in temporal and structural dimensions."
        source: "§3.3.1, §4.3.3, Table 1, Figure 3"
        evidence: "Step reduction from 32 to 4 lowers pitch CV-f0 by 30.3% (from 0.666 to 0.464) while mean-centered UTMOS distributions remain consistent across teacher and student, showing diversity loss is prosodic rather than spectral."
        confidence: high
        relevance: low
      - claim_id: dmospeech2_best_of_n_ceiling
        role: refines
        claim: "Best-of-N sampling over discrete duration predictions establishes a practical performance ceiling for RL-based duration optimization in non-autoregressive TTS."
        source: "§A.1, Table 3"
        evidence: "Best-of-8 duration sampling achieves WER 1.723 and SIM 0.724 on Seed-TTS-en; the RL-optimized system reaches WER 1.752 and SIM 0.698 in a single pass, approaching but not fully closing the gap to this oracle upper bound."
        confidence: high
        relevance: high
      - claim_id: dmospeech2_teacher_guided_sampling
        role: supports
        claim: "A hybrid inference strategy using a high-diversity teacher for early denoising and a distilled student for acoustic refinement can restore prosodic diversity without sacrificing metric optimization gains."
        source: "§3.3.2, §4.3.3, Table 1"
        evidence: "Teacher-guided sampling (t_switch=0.25, 16 steps) recovers CV-f0 to 0.593 (89.1% of teacher diversity) while achieving WER 1.738 and SIM 0.699, outperforming the teacher on both objective metrics at 1.8x faster RTF."
        confidence: high
        relevance: low
    limitations:
      - "RL training is sensitive to step count: performance degrades significantly beyond 1.5K steps due to reward over-optimization, constraining total optimization capacity."
      - "Rewards are limited to WER and speaker similarity; explicit naturalness or prosody rewards are not explored."
    caveats:
      - "RL is applied narrowly to the duration predictor subcomponent rather than the full synthesis pipeline; this scope decision is motivated by compute cost, not a general claim that narrow RL scope is preferable."

  - id: "2507.21138"
    entry_date: "2026-07-20"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    evidence_role:
      - core_evidence
    current_role: active_evidence
    method_family: [rl_policy_gradient_reward_optimization]
    claims:
      - claim_id: tts1_grpo_composite_reward_multi_dimension
        role: supports
        claim: "RL alignment with composite perceptual rewards improves multiple speech quality dimensions simultaneously over SFT-only baselines in autoregressive codec TTS."
        source: "§3.5, Table 8"
        evidence: "GRPO with combined WER + speaker similarity + DNSMOS rewards achieves gains in all three metrics over the SFT baseline, while single-reward models improve only their target dimension; TTS-1 WER drops from 7.9% (SFT) to 6.3% (RL-aligned)."
        confidence: high
        relevance: high
      - claim_id: tts1_audio_pretraining_improves_sft
        role: supports
        claim: "Audio pre-training on large-scale raw speech substantially improves subsequent SFT quality in LLM-based TTS beyond what instruction-tuned LLM initialisation provides."
        source: "§3.4, Figure 5"
        evidence: "Initialising SFT from an audio pre-trained LLaMA-3.2-1B checkpoint yields approximately 15% lower WER and approximately 3% higher speaker similarity than initialising from the base instruct checkpoint."
        confidence: medium
        relevance: low
      - claim_id: tts1_scaling_improves_intelligibility
        role: supports
        claim: "Scaling SpeechLM parameter count in autoregressive codec TTS consistently improves intelligibility and speaker fidelity across languages."
        source: "§4, Figure 8, Table 8"
        evidence: "TTS-1-Max (8.8B) achieves 5.1% overall WER and higher SIM across all 11 evaluated languages compared to TTS-1 (1.6B) at 6.3% WER."
        confidence: medium
        relevance: low
      - claim_id: tts1_style_tags_conflict_speaker_identity
        role: complicates
        claim: "Style conditioning via discrete text tags conflicts with speaker identity preservation in single-codebook codec TTS architectures."
        source: "§3.6"
        evidence: "Direct prepending of style markup tags during SFT produced no effect on synthesized speech because the single-codebook design entangles acoustic and semantic information; successful style control required paired neutral/stylized data and LoRA fine-tuning."
        confidence: medium
        relevance: low
      - claim_id: tts1_streaming_artifacts_engineering
        role: complicates
        claim: "Streaming audio delivery in autoregressive TTS introduces audible artifacts and volume inconsistencies at segment boundaries that require specific engineering mitigations independent of the generative model's quality."
        source: "§5.1"
        evidence: "Without concatenation restricted to non-voicing regions and context-aware decoder decoding, segment boundaries introduce clicks and volume drops."
        confidence: medium
        relevance: low
    limitations:
      - "Model weights are not publicly released, making independent benchmarking of the RL-aligned model impossible."
      - "All evaluations use proprietary or internal test sets; the internal TTS arena covers only English with a modest vote count per pair."
    caveats:
      - "The composite GRPO reward (WER + SIM + DNSMOS) is reported at a system level without an ablation isolating a single-reward variant against the full three-way reward, so the marginal contribution of each reward term to RL-specific gains is not separable."

  - id: "2025.acl-long.598"
    entry_date: "2026-07-20"
    year: 2025
    venue: ACL
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching, hybrid]
    relevance: high
    evidence_role:
      - core_evidence
      - infrastructure
    current_role: foundational
    method_family: [dpo_style_preference_optimization_discrete_tts, continuous_generative_preference_optimization]
    claims:
      - claim_id: intp_cross_model_pairs_outperform_self_comparison
        role: supports
        claim: "Preference alignment with cross-model preference pairs yields larger intelligibility improvements than single-model self-comparison pairs for TTS post-training."
        source: "§5.2, Table 5"
        evidence: "Ablations show all three INTP pair types (intra, inter, perturbed) contribute, with inter-pairs and intra-pairs complementary; full DPO with negative-pair contrast gives larger improvements than supervised fine-tuning on positives alone."
        confidence: high
        relevance: high
      - claim_id: intp_dpo_fm_dpo_mgm_derivation
        role: supports
        claim: "DPO objectives can be derived for flow-matching and masked generative TTS architectures by operating in velocity space and masked token distributions, respectively, without requiring explicit reward models."
        source: "§4.2, §4.3"
        evidence: "The paper derives DPO-FM (log-ratio of learned vs. reference velocity fields, equivalent to an MSE difference in predicted velocities) and DPO-MGM (product of log-probabilities over masked tokens), enabling principled preference alignment for flow-matching (F5-TTS) and masked generative (MaskGCT) TTS architectures for the first time."
        confidence: high
        relevance: high
      - claim_id: intp_generalizes_to_unseen_languages
        role: supports
        claim: "Intelligibility gains from preference alignment on English and Chinese data generalize to unseen languages (Japanese, Korean, German, French) without degrading speaker similarity."
        source: "§5.1, Table 10"
        evidence: "INTP alignment trained on EN+ZH data reduces WER substantially across Japanese, Korean, German, and French evaluation sets, without harming speaker similarity."
        confidence: high
        relevance: high
      - claim_id: intp_weak_to_strong_generalization
        role: supports
        claim: "Preference datasets constructed from weaker TTS generators effectively improve stronger models outside the training distribution, demonstrating weak-to-strong generalization in speech alignment."
        source: "§5.1, Table 4"
        evidence: "INTP built from weaker ARS/F5-TTS/MaskGCT generators also improves the stronger CosyVoice 2 model (average WER 13.09 to 10.56), and Ints v1 (INTP-aligned) generates new preference data used to train the stronger Ints v2."
        confidence: high
        relevance: high
      - claim_id: intp_iterative_alignment_diminishing_returns
        role: complicates
        claim: "Iterative preference alignment yields diminishing returns across rounds, suggesting that base model capability is the primary ceiling on alignment effectiveness."
        source: "§5.3, Table 6"
        evidence: "Ints v2 (iterative alignment) reaches 7.10 average WER versus 7.96 for Ints v1, a smaller relative gain than the first alignment round; the authors attribute this ceiling to base model capability."
        confidence: medium
        relevance: medium
    limitations:
      - "INTP covers only English and Chinese; while generalization to a few unseen languages is shown, low-resource language coverage remains weak."
      - "The computational cost of alignment (8 H100 GPUs per run) limits accessibility for smaller labs."
      - "Anti-spoofing robustness is not evaluated; improved intelligibility alignment may inadvertently affect spoofing resilience."
    caveats:
      - "All evaluation uses SeedTTS test sets (English/Chinese); no evaluation on truly out-of-distribution natural speech (radio or phone call recordings) is provided."

  - id: "2025.acl-long.682"
    entry_date: "2026-07-20"
    year: 2025
    venue: ACL
    task: [TTS, SCA, evaluation]
    architecture: [autoregressive-LM, GAN, hybrid]
    relevance: low
    evidence_role:
      - historical_context
    current_role: minor
    method_family: []
    claims:
      - claim_id: speechlm_survey_gan_vocoder_dominance
        role: supports
        claim: "GAN-based vocoders occupy the dominant position in production speech generation systems because their computational efficiency advantage over autoregressive and diffusion alternatives is orders of magnitude, at acceptable perceptual quality cost."
        source: "§3.3.1, §F.3, Table 8"
        evidence: "GAN-based vocoders achieve real-time factors 70-3,500x faster than diffusion models at competitive perceptual quality, explaining their prevalence in production SpeechLMs."
        confidence: medium
        relevance: low
      - claim_id: speechlm_survey_textlm_init_improves_convergence
        role: supports
        claim: "Continued pretraining from a text language model checkpoint improves SpeechLM convergence and downstream task performance compared to random initialization."
        source: "§4.2.1"
        evidence: "TWIST and AudioPaLM show continued pretraining from TextLM checkpoints improves convergence and task performance over cold initialization."
        confidence: medium
        relevance: low
      - claim_id: speechlm_survey_semantic_acoustic_tradeoff
        role: supports
        claim: "Semantic tokenizers and acoustic tokenizers represent complementary capability profiles, strong semantic content fidelity versus strong acoustic reconstruction fidelity, and no single tokenizer type dominates both dimensions."
        source: "§3.1, §F.2, Table 6"
        evidence: "Semantic tokens excel at content modeling (lower WER) but fail at acoustic fidelity (lower SPK-SIM), while acoustic tokens invert this profile; mixed tokens (SpeechTokenizer, Mimi) offer partial balance."
        confidence: medium
        relevance: low
      - claim_id: speechlm_survey_post_alignment_different_failure_modes
        role: refines
        claim: "Post-alignment of SpeechLMs via preference optimization addresses qualitatively different failure modes (semantic inconsistency, token distribution mismatch) than post-alignment of text LLMs."
        source: "§4.2.3"
        evidence: "The survey identifies AlignSLM's DPO for semantic consistency and SpeechAlign's token distribution alignment as addressing SpeechLM-specific failure modes, and notes post-alignment is substantially underexplored relative to the TextLM literature."
        confidence: medium
        relevance: high
      - claim_id: speechlm_survey_full_duplex_open_challenge
        role: supports
        claim: "Full-duplex spoken interaction, simultaneous bidirectional speech with interruption support, requires joint modeling of both speaker streams and remains an open research challenge."
        source: "§4.3"
        evidence: "Full-duplex systems (dGSLM, Parrot, Moshi, LSLM) are surveyed as an emerging frontier requiring joint modeling of both speaker streams simultaneously."
        confidence: medium
        relevance: low
    limitations:
      - "As a survey, no original experimental results are reported; the RLHF/post-alignment discussion (§4.2.3) is brief relative to the tokenizer and LM architecture sections."
    caveats:
      - "Coverage of post-alignment work is limited to citing AlignSLM and SpeechAlign as examples rather than providing a systematic comparison of preference-optimization approaches for speech, so this entry contributes context rather than new evidence to rlhf-speech."

  - id: "2025.acl-long.997"
    entry_date: "2026-07-20"
    year: 2025
    venue: ACL
    task: [SCA]
    architecture: [autoregressive-LM]
    relevance: high
    evidence_role:
      - core_evidence
    current_role: foundational
    method_family: [dpo_style_preference_optimization_discrete_tts]
    claims:
      - claim_id: alignslm_preference_opt_improves_semantic_coherence
        role: supports
        claim: "Preference optimization with LLM-based semantic feedback improves long-range semantic coherence in textless spoken language models beyond next-token prediction training."
        source: "§5.2, Table 2"
        evidence: "DPO with Mistral-score preference data raises T-StoryCloze from 69.7% to 74.2% (1.3B model) and from 75.4% to 83.8% (7B model) over the pre-trained TWIST baseline; curriculum learning further improves both to 76.1% and 85.6% respectively."
        confidence: high
        relevance: high
      - claim_id: alignslm_llm_scoring_beats_perplexity
        role: supports
        claim: "LLM-based semantic scoring provides more effective alignment signal for speech continuation than perplexity-based preference selection."
        source: "§5.1, Table 1"
        evidence: "On the 1.3B model, Align-SLM with Mistral score improves T-StoryCloze by +4.5 over the pre-trained baseline, whereas the PPL-based variant degrades T-StoryCloze by 2.0."
        confidence: high
        relevance: high
      - claim_id: alignslm_curriculum_learning_progressive_gains
        role: supports
        claim: "Curriculum learning with iteratively tightened preference thresholds yields progressive semantic improvements in preference-optimized spoken language models."
        source: "§5.3, Appendix E, Table 2"
        evidence: "Two curriculum learning iterations on the 7B model improve T-StoryCloze from 83.8% (Align-SLM) to 85.6% (Align-SLM+CL) and GPT4-o score from 3.50 to 3.56."
        confidence: medium
        relevance: high
      - claim_id: alignslm_gains_not_uniform_grammar
        role: complicates
        claim: "Semantic gains from preference optimization do not transfer uniformly to lexical and grammatical aspects of spoken language modeling."
        source: "§5.5, Table 2"
        evidence: "Align-SLM shows only marginal sBLIMP improvement (+1.3 for the 1.3B Mistral variant) while models with no preference training but better token designs (AudioLM, SyllableLM) outperform on grammatical correctness."
        confidence: medium
        relevance: medium
      - claim_id: alignslm_gap_to_cascaded_topline
        role: complicates
        claim: "Textless end-to-end spoken language models remain substantially behind cascaded ASR+LLM pipelines in semantic understanding even with preference optimization."
        source: "§5.5, Table 2"
        evidence: "The best Align-SLM variant achieves 77.9% sWUGGY and 86.8% T-StoryCloze, compared to 79.2% and 94.8% for the ASR+LLM cascade topline, a gap that preference optimization alone does not close."
        confidence: high
        relevance: medium
    limitations:
      - "Training and evaluation are restricted to English audiobook speech (LibriSpeech, MLS); generalisation to spontaneous, noisy, or multi-speaker speech is untested."
      - "The paper does not compare against text-injecting SLMs (SPIRITLM, Moshi, VoxtLM) under matched data and compute budgets."
    caveats:
      - "Only the semantic dimension of SLM quality is addressed via preference optimization; paralinguistic aspects (prosody, speaking style, emotion) are explicitly out of scope for this alignment framework."

  - id: "2025.findings-acl.631"
    entry_date: "2026-07-20"
    year: 2025
    venue: ACL Findings
    task: [SCA]
    architecture: [autoregressive-LM]
    relevance: high
    evidence_role:
      - core_evidence
    current_role: active_evidence
    method_family: [dpo_style_preference_optimization_discrete_tts]
    claims:
      - claim_id: slam_textlm_init_accelerates_convergence
        role: supports
        claim: "Text LM initialization substantially accelerates SLM convergence and improves final model quality within fixed compute budgets."
        source: "§4.1, Figure 2, Figure 3"
        evidence: "TWIST-style initialization from Qwen2.5-0.5B outperforms uninitialised variants across all evaluated model families, surpassing alternatives even with fewer training tokens."
        confidence: high
        relevance: low
      - claim_id: slam_synthetic_data_improves_semantics
        role: supports
        claim: "Synthetic TTS data improves semantic modeling in SLMs when combined with real speech, but replacing real data with synthetic data alone degrades performance."
        source: "§4.2, Table 1"
        evidence: "Adding sTinyStories to the training mix boosts TSC from 71.14 to 78.01 and GenPPL from 145.4 to 88.3 for Qwen-0.5B; training on synthetic data exclusively yields lower sBLIMP than the mixed baseline."
        confidence: medium
        relevance: low
      - claim_id: slam_dpo_improves_under_tight_compute
        role: supports
        claim: "Preference optimization with synthetically generated preference data substantially improves SLM generation quality even under tight compute constraints."
        source: "§4.4, Figure 5, Table 2"
        evidence: "30 minutes of DPO training on SpokenSwag improves TSC from 78.01 to 82.04 and GenPPL from 88.3 to 62.8; the gain saturates quickly and additional DPO budget can degrade results."
        confidence: high
        relevance: high
      - claim_id: slam_scaling_laws_too_pessimistic
        role: contradicts
        claim: "SLM scaling laws accurately predict compute-optimal performance boundaries for academic-scale training."
        source: "§5, Table 2"
        evidence: "Slam on one A5000 GPU-day achieves TSC 82.04 against the scaling-law predicted optimal of TSC 70.49 for the same compute; the authors attribute the gap partly to preference optimization (DPO) not being factored into scaling law derivations."
        confidence: medium
        relevance: medium
      - claim_id: slam_diverse_data_hurts_low_compute
        role: complicates
        claim: "Diverse multi-domain speech training data improves SLM generalization."
        source: "§4.2, Table 1"
        evidence: "Augmenting LibriLight and LibriSpeech with VoxPopuli, TED-LIUM, PeopleSpeech, and SWC consistently degrades TSC and SSC under the single-GPU budget."
        confidence: medium
        relevance: low
    limitations:
      - "Evaluation uses only semantic modeling benchmarks (TSC, SSC, sBLIMP) and generation perplexity; acoustic and prosodic quality of the DPO-aligned outputs are not evaluated."
    caveats:
      - "DPO here uses fully synthetic preference pairs (SpokenSwag, derived from a text commonsense corpus) rather than paired human or model-judged speech preferences, and allocating more DPO budget beyond roughly 30 minutes can degrade results rather than continuing to improve them."

  - id: "2507.17527"
    entry_date: "2026-07-20"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    evidence_role:
      - core_evidence
      - evaluation_caution
    current_role: influential
    method_family: [rl_policy_gradient_reward_optimization]
    claims:
      - claim_id: seedliveinterpret_rl_lower_latency_higher_quality
        role: supports
        claim: "End-to-end speech-to-speech translation trained with reinforcement learning can achieve substantially lower latency than cascaded commercial systems while surpassing them in translation quality."
        source: "§3.3, Table 1"
        evidence: "On RealSI (zh-en), the RL-trained system achieves VIP 79.5 and SVIP 67.8 at Average Lagging 5.18 seconds, versus the best commercial competitor at VIP 53.2 and SVIP 3.0 at AL 48.21."
        confidence: high
        relevance: high
      - claim_id: seedliveinterpret_two_stage_rl_outperforms_single
        role: supports
        claim: "Two-stage RL training that separates fine-grained process rewards from holistic sequence-level outcome rewards outperforms applying either strategy in isolation for streaming speech generation."
        source: "§4.3, Table 6"
        evidence: "The combined two-stage RL scheme achieves higher VIP and lower Average Lagging than both single-turn-only and multi-turn-only reward variants on internal benchmarks."
        confidence: high
        relevance: high
      - claim_id: seedliveinterpret_reward_exploitation_without_constraints
        role: complicates
        claim: "RL reward design for speech generation is prone to exploitation when individual reward signals are applied without complementary constraints."
        source: "§4.2, Table 5"
        evidence: "Training with the Time Compliance Reward alone caused the model to reduce audio duration by ~35% and text token count by ~15%, yielding an 8-point BLEURT drop; adding an adversarial quality reward restored translation fidelity."
        confidence: high
        relevance: high
      - claim_id: seedliveinterpret_rl_improves_latency_more_than_quality
        role: supports
        claim: "Reinforcement learning applied after SFT improves latency more substantially than translation quality in simultaneous speech translation."
        source: "§4.1, Tables 3, 4"
        evidence: "RL reduces FLAL from 3.90 to 2.37 and Average Lagging from 2.82 to 2.58 on RealSI, while VIP improves more modestly from 75.1 to 79.5 compared to the SFT baseline."
        confidence: high
        relevance: high
      - claim_id: seedliveinterpret_automated_mt_metrics_insufficient
        role: complicates
        claim: "Automated MT metrics such as BLEURT and COMET do not fully capture the quality of simultaneous speech interpretation in realistic long-form scenarios."
        source: "§3.2, Appendix A"
        evidence: "The paper introduces SVIP as a composite human evaluation metric combining translation quality, delivery latency, speech rate, pronunciation, and fluency, arguing automated metrics fail to assess the pragmatic requirements of live spoken interpretation."
        confidence: medium
        relevance: low
    limitations:
      - "Training data, model weights, and all commercial baseline identities are proprietary; the headline results cannot be independently reproduced or verified."
    caveats:
      - "The RL framework is specialized for the simultaneous-translation task (chunk-level read-write policy, duration-matching rewards); its transferability to general TTS or open-domain SCA alignment beyond simultaneous interpretation is untested."

  - id: "2025.icnlsp-1.34"
    entry_date: "2026-07-20"
    year: 2025
    venue: workshop
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    evidence_role:
      - core_evidence
    current_role: active_evidence
    method_family: [dpo_style_preference_optimization_discrete_tts]
    claims:
      - claim_id: icnlsp_dpo_matches_labeled_ft
        role: supports
        claim: "Preference alignment via DPO can match the perceptual quality of supervised fine-tuning on human-labeled TTS data when preference pairs are constructed automatically from model-generated samples."
        source: "§3.5, Table 1, Table 2, Table 5"
        evidence: "On VCTK, DPO fine-tuning with LLM-augmented texts (V4) achieves WER 0.013, SS 0.482, and UTMOS 4.108 from the base xTTSv2 checkpoint, outperforming classical fine-tuning on human-labeled data (V1: WER 0.041, SS 0.500, UTMOS 3.685) on intelligibility and naturalness; CMOS evaluation confirms no statistically significant perceptual difference (all CM p > 0.30)."
        confidence: high
        relevance: high
      - claim_id: icnlsp_dpo_init_point_critical
        role: complicates
        claim: "The initialisation point before DPO fine-tuning critically determines outcome quality, with checkpoint diversity being a more important factor than label quality of the preceding supervised stage."
        source: "§3.6, Table 1, Table 2"
        evidence: "DPO applied from the ASR-fine-tuned checkpoint (L5/V5) consistently underperforms DPO from the base model (L3/V3), with V5 reaching WER 0.273 versus V3's WER 0.014, because standard fine-tuning narrows generation diversity, leaving insufficient variation for DPO preference signal."
        confidence: high
        relevance: high
      - claim_id: icnlsp_llm_texts_improve_naturalness
        role: supports
        claim: "Augmenting unlabeled TTS training data with LLM-generated texts improves synthesis naturalness when the dataset's own texts are structurally mismatched with natural language."
        source: "§3.5, Table 1, Table 2"
        evidence: "On VCTK, which contains newspaper sentences well-aligned with LLM output, adding 15,000 LLM-generated texts (V4 vs. V3) raises UTMOS from 4.009 to 4.108; on LJSpeech (audiobook fragments) the improvement is smaller and WER increases, attributed to domain mismatch."
        confidence: medium
        relevance: medium
      - claim_id: icnlsp_spk_sim_hardest_to_preserve
        role: complicates
        claim: "Speaker similarity is the most difficult quality dimension to preserve when fine-tuning TTS on ASR-transcribed or automatically constructed data, even when naturalness and intelligibility are maintained."
        source: "§3.5, §3.7, Table 4, Table 5"
        evidence: "Human-labeled fine-tuning achieves the highest SS scores across both datasets; DPO from the base model recovers intelligibility and naturalness but trails on SS, and SS degradation is statistically significant for checkpoint-initialised DPO (p < 0.001) while naturalness differences are not."
        confidence: high
        relevance: medium
    limitations:
      - "All experiments use xTTSv2 as the sole base model; it is unknown whether the checkpoint-initialisation finding generalises to other LM-based TTS architectures."
      - "Evaluation covers English only despite xTTSv2 being multilingual."
    caveats:
      - "The human-labeled baseline starts from the same pre-trained xTTSv2 checkpoint rather than a randomly initialised model, which limits conclusions about the true cost of label-free DPO training relative to a from-scratch comparison."

