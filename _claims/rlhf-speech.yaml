papers:
  - id: "2406.00654"
    entry_date: "2026-07-20"
    year: 2024
    venue: arXiv
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: foundational
    method_family: [dpo_style_preference_optimization_discrete_tts]
    claims:
      - claim_id: uno_kto_uncertainty_optimization
        role: supports
        claim: "Standard supervised training objectives for TTS produce a systematic mismatch with human perceptual evaluation metrics such as MOS and WER, and correcting this mismatch through preference-aware fine-tuning yields large performance gains."
        source: "§1, §4.2, Table 1"
        evidence: "UNO reduces VoiceCraft's WER from 8.4% to 2.6% and raises naturalness MOS from 3.38 to 4.06 by incorporating human feedback directly into training."
        confidence: high
        relevance: high
      - claim_id: uno_dpo_infeasible_for_codec_tts
        role: complicates
        claim: "Existing RLHF methods requiring pairwise preference data from the same input (DPO) are difficult to apply directly to autoregressive codec TTS because these models lack sufficient output diversity to form meaningful preference pairs from a fixed transcript-prompt combination."
        source: "§4.2, Appendix B"
        evidence: "The paper argues DPO-style pairwise preference collection is impractical because a fixed transcript-prompt pair yields insufficiently diverse codec LM outputs for meaningful preference labelling, motivating UNO's non-pairwise KTO-style approach."
        confidence: medium
        relevance: high
      - claim_id: uno_uncertainty_as_signal
        role: supports
        claim: "Uncertainty in human speech quality annotations is not noise to be discarded but an informative signal that, when incorporated into the optimization objective, improves the consistency of generated speech across listeners."
        source: "§4.2, §6.3, Table 3"
        evidence: "Uncertainty-weighted KTO (I-CNF) achieves comparable mean MOS to an unweighted ablation (UNO-null) but with lower output variance, indicating the uncertainty signal specifically improves generation consistency."
        confidence: medium
        relevance: high
      - claim_id: uno_data_efficient_alignment
        role: supports
        claim: "RLHF-style alignment for TTS can be achieved with a small number of self-generated samples (hundreds) without access to ground truth speech, making it practical for post-training fine-tuning at low computational cost."
        source: "§4.1, §5, Appendix D"
        evidence: "Fine-tuning uses only 400 self-generated samples (200 positive / 200 negative) and about 10 minutes on a single A100 GPU, with no ground-truth speech required."
        confidence: high
        relevance: high
      - claim_id: uno_generalizes_to_emotion
        role: supports
        claim: "Alignment objectives designed for naturalness MOS transfer to other perceptual dimensions such as emotion by substituting the selection criterion, demonstrating that preference-based fine-tuning generalises beyond a single quality axis."
        source: "§6.4, Table 4"
        evidence: "Substituting the sampling selection criterion with emotional valence/arousal scores increases valence from 0.55 to 0.67 and arousal from 0.62 to 0.71, without any explicit emotion labelling at training time."
        confidence: medium
        relevance: medium
    limitations:
      - "Evaluated exclusively on VoiceCraft, an autoregressive codec model; applicability to diffusion or flow-matching TTS is discussed theoretically but untested."
      - "Human evaluation uses only 10 listeners for 120 samples, a relatively small pool."
    caveats:
      - "The comparison against SpeechAlign is partially unfair by the authors' own admission: SpeechAlign-DPO requires ground-truth speech as positive samples, additional supervision UNO does not use."

  - id: "2406.02430"
    entry_date: "2026-07-20"
    year: 2024
    venue: arXiv
    task: [TTS, VC]
    architecture: [autoregressive-LM, diffusion, hybrid]
    relevance: medium
    evidence_role:
      - core_evidence
      - evaluation_caution
    current_role: influential
    method_family: [rl_policy_gradient_reward_optimization]
    claims:
      - claim_id: seedtts_human_parity_zeroshot
        role: supports
        claim: "Autoregressive codec language models trained at sufficient scale can generate zero-shot speech with naturalness and speaker similarity indistinguishable from human speech as measured by CMOS."
        source: "§3.1, Table 1"
        evidence: "Seed-TTS ICL achieves CMOS of -0.07 (EN) and -0.08 (ZH) versus human recordings, effectively indistinguishable in subjective comparison."
        confidence: high
        relevance: low
      - claim_id: seedtts_self_distillation_disentanglement
        role: supports
        claim: "Self-distillation on perturbation-generated pairs is an effective method for timbre disentanglement in TTS systems, achieving large speaker similarity gains in voice conversion without modifying model architecture or loss functions."
        source: "§4.1, Table 6"
        evidence: "Self-distillation raises voice-conversion SIM from 0.491 to 0.753 (EN) and 0.636 to 0.791 (ZH), far exceeding DiffVC (0.311) and HierSpeech++ (0.387)."
        confidence: high
        relevance: low
      - claim_id: seedtts_rl_posttraining_reward_hacking
        role: refines
        claim: "Reinforcement learning post-training with objective speech quality rewards improves robustness and speaker similarity in autoregressive TTS while introducing reward hacking that must be carefully managed."
        source: "§4.2, Tables 7, 8"
        evidence: "REINFORCE-based RL post-training (RL-SIM-WER) reduces EN WER from 2.249% to 1.945% and ZH WER from 1.115% to 1.002%, while the paper documents reward hacking (over-slow, over-articulated speech) as a failure mode requiring careful tuning."
        confidence: high
        relevance: high
      - claim_id: seedtts_dit_implicit_alignment
        role: supports
        claim: "End-to-end diffusion models that predict total duration and learn local text-audio alignment implicitly can match or exceed the quality of autoregressive codec LM systems without per-phoneme duration supervision."
        source: "§4.3, Table 10"
        evidence: "Seed-TTSDiT achieves EN WER 1.733% and SIM 0.790, superior speaker similarity to the autoregressive ICL variant."
        confidence: high
        relevance: low
      - claim_id: seedtts_synthetic_asr_training
        role: supports
        claim: "Synthetic speech generated by a high-quality zero-shot TTS system can train ASR models that approach real-data performance on clean test sets, though a gap persists on noisy sets due to background noise smoothing."
        source: "§3.1, Table 2"
        evidence: "An ASR model trained on synthetic Seed-TTS LibriSpeech data achieves WER within 0.31% absolute of a real-data baseline on clean sets."
        confidence: medium
        relevance: low
    limitations:
      - "Reward hacking (over-slow, over-articulated speech) during RL post-training requires careful tuning; model weights and RL implementation details are not released."
    caveats:
      - "RL post-training is described at a high level (REINFORCE with WER+SIM or SER rewards, plus a DPO exploration) without extensive ablation of reward design choices, so the RLHF-specific contribution is thinner than in papers dedicated to alignment methodology."

  - id: "2412.10117"
    entry_date: "2026-07-20"
    year: 2024
    venue: arXiv
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching, hybrid]
    relevance: medium
    evidence_role:
      - core_evidence
    current_role: influential
    method_family: [differentiable_reward_gradient_backprop, dpo_style_preference_optimization_discrete_tts]
    claims:
      - claim_id: cosyvoice2_fsq_codebook_utilization
        role: supports
        claim: "Finite scalar quantization achieves full codebook utilization in supervised speech tokenizers, capturing substantially more semantic content than vector quantization at equivalent bitrates."
        source: "§2.2, §4.1, Table 4"
        evidence: "FSQ reaches 100% codebook utilization versus 23% for VQ, and reduces ASR error rate from 18.26% to 10.67% on CommonVoice EN."
        confidence: high
        relevance: low
      - claim_id: cosyvoice2_llm_backbone_consistency
        role: supports
        claim: "Replacing a randomly initialized custom LM with a pre-trained LLM backbone improves content consistency in hybrid TTS systems without requiring a separate text encoder."
        source: "§2.3, §4.3, Table 7"
        evidence: "Initializing from Qwen2.5-0.5B and dropping the speaker embedding and text encoder yields an 18.46% relative CER improvement on Chinese test sets in ablation (Table 7)."
        confidence: high
        relevance: low
      - claim_id: cosyvoice2_unified_streaming
        role: supports
        claim: "Streaming and non-streaming synthesis can be unified in a single autoregressive model through interleaved text-speech token sequences, with virtually lossless quality on typical inputs relative to offline mode."
        source: "§2.3, §4.2, Table 8"
        evidence: "Streaming LM + streaming flow matching achieves WER 2.38% (EN) versus 2.57% offline, close to lossless on typical test cases."
        confidence: high
        relevance: low
      - claim_id: cosyvoice2_chunk_aware_fm
        role: supports
        claim: "Training a flow matching model simultaneously on multiple causal mask types, from non-causal to full-causal, enables a single model to span the latency-quality trade-off continuum at inference time, with masks providing implicit self-distillation."
        source: "§2.4, §4.3, Table 8"
        evidence: "The chunk-aware causal flow matching model trained with four mask types (non-causal, full-causal, Chunk-M, Chunk-2M) supports both offline and streaming deployment from one set of weights."
        confidence: high
        relevance: low
      - claim_id: cosyvoice2_differentiable_reward_vs_dpo
        role: refines
        claim: "Differentiable ASR reward optimization generalizes better to out-of-domain and hard-case inputs than preference-based DPO in TTS speaker fine-tuning."
        source: "§2.8, §4.7, Table 11"
        evidence: "Combining a differentiable ASR reward (Gumbel-softmax sampling through FSQ indices into a frozen ASR decoder) with DPO achieves the best WER/SIM results on both in-domain speaker fine-tuning and SEED test sets in Table 11, avoiding the four-forward-pass overhead of standard DPO."
        confidence: medium
        relevance: high
    limitations:
      - "RL/DPO fine-tuning is reported only for the speaker fine-tuning stage, without extensive ablation isolating the differentiable-reward contribution from the DPO baseline component."
    caveats:
      - "The differentiable ASR reward mechanism is demonstrated only for speaker fine-tuning; it is not evaluated as a general-purpose alignment technique across the model's other capabilities (streaming, instruction-following)."

  - id: "2502.11946"
    entry_date: "2026-07-20"
    year: 2025
    venue: arXiv
    task: [TTS, SCA]
    architecture: [autoregressive-LM, flow-matching, hybrid]
    relevance: medium
    evidence_role:
      - core_evidence
      - evaluation_caution
    current_role: influential
    method_family: [rl_policy_gradient_reward_optimization]
    claims:
      - claim_id: stepaudio_dual_codebook_tokenizer
        role: supports
        claim: "A dual-codebook interleaved tokenizer that combines linguistic and semantic representations can achieve lower ASR error rates than either codebook alone, without sacrificing acoustic reconstruction quality."
        source: "§4.4, §6.2.1"
        evidence: "The dual-codebook approach reduced CER on ASR tasks from 25.5 to 18.4 in ablation experiments on a 3B-scale model."
        confidence: medium
        relevance: low
      - claim_id: stepaudio_scale_sensitivity
        role: supports
        claim: "Scaling autoregressive LLM backbone size from 3B to 130B parameters produces substantial gains in speech synthesis intelligibility on standard TTS benchmarks, suggesting speech generation quality is LLM-scale-sensitive."
        source: "§6.2.2, Table 3"
        evidence: "The 130B Step-Audio-TTS improves CER/WER to 1.17%/2.00% on SEED-TTS versus 1.31%/2.31% for the distilled 3B model."
        confidence: medium
        relevance: low
      - claim_id: stepaudio_rlhf_deaf_hacking
        role: complicates
        claim: "RLHF reward models trained on speech interaction data can exhibit systematic failure modes (such as rewarding evasive non-answers to unclear audio) unless explicit counter-examples are constructed during reward model training."
        source: "§5.2.6"
        evidence: "During PPO-based RLHF training of Step-Audio-Chat, a 'deaf hacking' failure mode emerged where the reward model preferred evasive non-answers to unclear audio; the team mitigated it by constructing explicit counter-examples for reward model training."
        confidence: medium
        relevance: high
      - claim_id: stepaudio_speculative_response
        role: supports
        claim: "Speculative response generation triggered by voice activity detection can reduce per-response latency by approximately 500 ms, with roughly 40% of pre-generated responses being usable, enabling practical real-time conversational systems."
        source: "§3.4"
        evidence: "The system preemptively generates responses during user pauses; roughly 40% of speculative responses are committed, reducing latency by approximately 500 ms per response."
        confidence: medium
        relevance: low
      - claim_id: stepaudio_synthetic_data_substitution
        role: supports
        claim: "Synthetic speech data generated by a large multi-modal model can substitute for manually curated recordings in training TTS systems for low-resource dialects, emotions, and singing styles."
        source: "§5.1.1"
        evidence: "The distilled Step-Audio-TTS-3B model is trained on synthetic data produced by the 130B model rather than manually curated recordings, and reaches competitive intelligibility on SEED-TTS."
        confidence: medium
        relevance: low
    limitations:
      - "RLHF training details are limited to a single subsection (§5.2.6) without ablation of the counter-example mitigation's independent effect."
    caveats:
      - "The RLHF post-training targets the AQTA chat/dialogue model, not the TTS decoder itself; its transferability to pure TTS alignment (as in UNO or F5R-TTS) is untested."

  - id: "2504.02407"
    entry_date: "2026-07-20"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching]
    relevance: high
    evidence_role:
      - core_evidence
      - architecture_variant
    current_role: foundational
    method_family: [rl_policy_gradient_reward_optimization]
    claims:
      - claim_id: f5rtts_gaussian_reformulation_enables_rl
        role: supports
        claim: "Reformulating the output of a flow-matching TTS model as a Gaussian distribution is sufficient to enable standard policy-gradient RL algorithms without architectural redesign."
        source: "§2.2"
        evidence: "The final linear layer of the F5-TTS DiT backbone is modified to output a Gaussian mean/variance instead of a deterministic velocity vector, with the pretraining phase functionally equivalent to the original flow-matching loss."
        confidence: high
        relevance: high
      - claim_id: f5rtts_grpo_improves_wer_sim
        role: supports
        claim: "GRPO with WER and speaker-similarity rewards consistently reduces word error rate and increases speaker similarity in non-autoregressive TTS post-training, across diverse Mandarin datasets."
        source: "§3.2.2, Table 1, Table 2"
        evidence: "GRPO reduces WER from 2.10% to 1.48% and raises SIM from 0.698 to 0.730 on Seed-TTS-eval test-cn general set, with consistent gains (18.4% relative WER reduction, 3.1% SIM improvement) replicated on a separate internal 10,000-hour dataset."
        confidence: high
        relevance: high
      - claim_id: f5rtts_rl_improves_noise_robustness
        role: supports
        claim: "RL post-training that optimises speaker-similarity reward also improves robustness to noisy reference audio, not only clean-reference speaker cloning."
        source: "§3.2.2, Table 1"
        evidence: "On a noisy-reference subset, GRPO training yields a larger relative WER reduction (33.6%, from 2.32% to 1.54%) than the general-set improvement, indicating improved robustness to reference audio quality."
        confidence: medium
        relevance: high
      - claim_id: f5rtts_hard_text_limits_rl_gains
        role: complicates
        claim: "Hard text (tongue twisters and repetitive phrasing) degrades all flow-matching TTS variants substantially, and RL training with WER rewards provides smaller relative gains in this regime than on plain text."
        source: "§3.2.2, Table 1"
        evidence: "On the hard set, WER drops only from 11.30% to 10.63% (6.1% relative) after GRPO, versus a 29.5% relative reduction on the general set."
        confidence: medium
        relevance: medium
      - claim_id: f5rtts_data_efficient_rl
        role: supports
        claim: "The GRPO phase requires only a small fraction of the pretraining data (100 h out of 7,226 h) and update steps to achieve measurable objective improvements, suggesting that RL fine-tuning is data-efficient for this task."
        source: "§3.1"
        evidence: "The GRPO phase uses only 100 hours of data and runs for 1,100 update steps on 8 A100 GPUs, compared to 1 million steps in pretraining, yet produces measurable WER/SIM gains."
        confidence: high
        relevance: medium
    limitations:
      - "No subjective (MOS/MUSHRA) evaluation is reported; all claimed improvements rely on automatic WER and speaker-cosine-similarity proxies."
      - "Evaluation is restricted to Mandarin (Seed-TTS-eval test-cn); generalisation to English or multilingual settings is not studied."
    caveats:
      - "As the first RL application to a NAR/flow-matching TTS architecture, the probabilistic-output reformulation technique has not yet been validated on other flow-matching or diffusion TTS backbones beyond F5-TTS."

  - id: "2025.naacl-demo.12"
    entry_date: "2026-07-20"
    year: 2025
    venue: NAACL
    task: [TTS, SCA]
    architecture: [autoregressive-LM]
    relevance: low
    evidence_role:
      - infrastructure
    current_role: minor
    method_family: []
    claims:
      - claim_id: espnet_speechlm_llm_init_no_degradation
        role: supports
        claim: "A speech language model can be initialized from a pre-trained text LLM and jointly trained on speech recognition, speech synthesis, text continuation, and audio continuation without substantially degrading the text-only capability of the base model."
        source: "§4.3, Table 5"
        evidence: "The 1.7B multi-task model trained on ASR, TTS, TextLM, and AudioLM objectives scores MMLU 30.5, ARC-C 41.3, and HellaSwag 50.4, close to the text-only LLaMA-3.2-1B baseline (32.2, 32.8, 41.2)."
        confidence: medium
        relevance: low
      - claim_id: espnet_speechlm_codec_ssl_concat
        role: supports
        claim: "Concatenating neural codec tokens with self-supervised speech representations frame-by-frame is a viable tokenization strategy for both speech understanding and generation tasks within a single sequential model."
        source: "§3.3"
        evidence: "The 'Codec_SSL' scheme (ESPnet-Codec combined with XEUS SSL tokens) is used for the headline ASR and TTS experiments and is reported to behave well in both understanding and generation."
        confidence: medium
        relevance: low
      - claim_id: espnet_speechlm_small_matches_large_asr
        role: supports
        claim: "A decoder-only autoregressive speech language model can match or exceed dedicated, larger ASR-only systems on English benchmarks while using substantially fewer parameters."
        source: "§4.2, Table 3"
        evidence: "A 442M-parameter ESPnet-SpeechLM ASR model reaches average WER 5.4% across six English test sets, matching OWSM v3.1-medium (1.02B, 5.4%) and beating Whisper-small/medium."
        confidence: medium
        relevance: low
      - claim_id: espnet_speechlm_unmatched_comparisons
        role: complicates
        claim: "Cross-system comparisons of speech language models reported in the literature are frequently not run under matched conditions, limiting how much can be concluded from any single performance table."
        source: "§4.3, Table 5"
        evidence: "In the multi-task comparison table, competitor numbers for Moshi, VITA, and GLM-4-Voice are taken directly from their own published reports rather than reproduced by the authors, flagged explicitly with footnotes."
        confidence: medium
        relevance: low
      - claim_id: espnet_speechlm_codec_ssl_unablated
        role: complicates
        claim: "Combining a codec tokenizer with a self-supervised tokenizer frame-by-frame is reported as an effective design choice but is not validated against single-tokenizer ablations in the same controlled setting."
        source: "§3.3"
        evidence: "The claim that Codec_SSL tokenization 'behaves well' rests on a single line of justification without a paired ablation against codec-only or SSL-only tokenization."
        confidence: low
        relevance: low
    limitations:
      - "As a toolkit/demo paper, RLHF is offered only as a configurable training option; no RLHF experiments, ablations, or results are reported for the flagship 1.7B model."
    caveats:
      - "The paper's relevance to rlhf-speech is purely infrastructural: it states the toolkit 'also supports RLHF fine-tuning for speech LMs' but presents no RLHF-trained model, reward design, or evaluation."

  - id: "2505.09558"
    entry_date: "2026-07-20"
    year: 2025
    venue: arXiv
    task: [SCA, evaluation]
    architecture: [autoregressive-LM]
    relevance: high
    evidence_role:
      - core_evidence
      - infrastructure
    current_role: influential
    method_family: [reward_model_infrastructure]
    claims:
      - claim_id: wavreward_text_only_eval_misses_acoustics
        role: supports
        claim: "Text-only evaluation of speech-to-speech dialogue systems systematically misses acoustic-level mismatches that human judges readily detect."
        source: "§2.2, §4.3"
        evidence: "The paper motivates WavReward by noting text-based metrics (BLEU, ChatGPT-based scoring) cannot detect acoustic mismatches, such as a fearful query answered with cheerful mockery."
        confidence: medium
        relevance: low
      - claim_id: wavreward_grpo_outperforms_sft_reward_model
        role: supports
        claim: "Reinforcement learning with group-based advantage estimates substantially outperforms supervised fine-tuning for training audio-domain reward models, consistent with patterns observed in text-domain RLHF."
        source: "§4.2, Table 2"
        evidence: "RL (GRPO) fine-tuning outperforms full-parameter supervised fine-tuning, which itself outperforms LoRA-based fine-tuning, on ChatReward-30K-test accuracy across content, explicit paralinguistic, and implicit categories."
        confidence: high
        relevance: high
      - claim_id: wavreward_cot_improves_scoring
        role: supports
        claim: "Chain-of-thought reasoning improves scoring accuracy of audio language model evaluators, with the benefit amplified in out-of-domain settings."
        source: "§4.4"
        evidence: "Removing chain-of-thought reasoning costs roughly 10 percentage points across categories and up to 21.7 points on the out-of-domain RealDialogue set."
        confidence: medium
        relevance: medium
      - claim_id: wavreward_nonlinear_reward_calibration
        role: supports
        claim: "Nonlinear reward shaping that penalises large prediction errors exponentially improves calibration across acoustic attributes compared to binary correct/incorrect rewards."
        source: "§3.1, §4.4"
        evidence: "Ablation removing the nonlinear reward reduces performance particularly on implicit and generation tasks relative to the full model's exponential-penalty reward."
        confidence: medium
        relevance: high
      - claim_id: wavreward_implicit_dialogue_hardest
        role: supports
        claim: "Implicit dialogue scenarios, where the appropriate response depends on inferring the user's emotional state from speech, remain significantly harder to evaluate automatically than explicit instruction-following scenarios."
        source: "§4.2, Table 2"
        evidence: "WavReward raises implicit dialogue scoring accuracy from 48.5% to 74.3% relative to the strongest open baseline, still notably lower than explicit-category accuracy (around 91.5%)."
        confidence: medium
        relevance: low
    limitations:
      - "The entire ChatReward-30K training corpus is synthesised using TTS systems (GPT-4o-mini-TTS, Step-Audio-TTS-3B, CosyVoice2) rather than real human speech; generalisation to real dialogue audio is tested only on a 120-sample RealDialogue set."
      - "GPU training details are withheld due to company policy, reducing reproducibility."
    caveats:
      - "WavReward trains a reward *evaluator* via RL rather than applying RLHF to a TTS/SCA generation model directly; its relevance to rlhf-speech is as a reusable reward-model methodology and potential future reward source, not as a demonstrated RLHF-tuned generation system."

  - id: "2505.17589"
    entry_date: "2026-07-20"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching]
    relevance: high
    evidence_role:
      - core_evidence
    current_role: influential
    method_family: [differentiable_reward_gradient_backprop]
    claims:
      - claim_id: cosyvoice3_diffro_token_level_reward
        role: supports
        claim: "Differentiable reward optimization over discrete speech tokens, rather than synthesized audio, enables scalable post-training for LLM-based TTS without the computational overhead of full audio generation."
        source: "§2.2"
        evidence: "DiffRO trains a Token2Text model and uses Gumbel-Softmax sampling to backpropagate gradients through discrete token predictions, with a KL penalty against the reference policy; DiffRO alone contributes 12-35% relative WER improvements, exceeding 50% in half of cross-lingual/low-resource conditions."
        confidence: high
        relevance: high
      - claim_id: cosyvoice3_multitask_tokenizer_paralinguistic
        role: supports
        claim: "Supervised multi-task training of a speech tokenizer on tasks including emotion recognition, language identification, and speaker analysis captures richer paralinguistic content than ASR-only objectives, with measurable downstream gains in content consistency and speaker similarity."
        source: "§2.1, §5.3"
        evidence: "The MinMo-based tokenizer, fine-tuned on 530K hours across ASR, LID, SER, AED, and speaker analysis, embeds richer paralinguistic content than the SenseVoice-based CosyVoice 2 tokenizer."
        confidence: medium
        relevance: low
      - claim_id: cosyvoice3_emotion_from_text_not_prompt
        role: complicates
        claim: "Current zero-shot TTS systems infer emotional tone primarily from text semantics; expression of text-unrelated emotions from a reference prompt remains a significant unsolved challenge."
        source: "§5.2.3, Table 9"
        evidence: "Emotion cloning results show text-related emotion accuracy is strong (0.84-0.98) with DiffRO-EMO, but text-unrelated emotion accuracy drops substantially for sad and angry categories, and multi-reward DiffRO with emotion targets further degrades pronunciation."
        confidence: medium
        relevance: medium
      - claim_id: cosyvoice3_scaling_diminishing_returns
        role: supports
        claim: "Scaling training data and model size in two-stage codec TTS produces consistent gains up to a point of diminishing returns, with data scaling showing stronger marginal returns than model size scaling beyond 0.5B parameters on current benchmarks."
        source: "§4.2, §5.1"
        evidence: "CosyVoice 3-1.5B with DiffRO reaches 44-51% relative CER/WER improvements over CosyVoice 2, attributed jointly to the 1M-hour data scale and the larger 1.5B LM."
        confidence: medium
        relevance: low
      - claim_id: cosyvoice3_studio_benchmarks_underestimate_difficulty
        role: supports
        claim: "Existing TTS benchmarks based on studio-quality audiobook data underestimate the difficulty of in-the-wild voice cloning, where noisy reference audio and domain diversity expose robustness gaps not visible in standard evaluations."
        source: "§4.4"
        evidence: "The newly introduced CV3-Eval multilingual benchmark is the only one covering noisy in-the-wild reference conditions across 9 languages; open-source baselines (F5-TTS, SparkTTS, GPT-SoVits) support only Chinese and English."
        confidence: medium
        relevance: low
    limitations:
      - "DiffRO exhibits a trade-off between intelligibility and speaker similarity: RL post-training slightly reduces speaker similarity while improving WER."
      - "Multi-reward DiffRO with emotion targets further degrades pronunciation, indicating reward balancing in multi-objective post-training for TTS remains an open engineering problem."
    caveats:
      - "DiffRO's generality across other LLM-based TTS pipelines is asserted by the authors but demonstrated only within the CosyVoice architecture family."

  - id: "2507.14988"
    entry_date: "2026-07-20"
    year: 2025
