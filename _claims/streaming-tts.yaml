  claims:
  - role: supports
    claim: Augmenting speech-in speech-out dialogue systems with external tool retrieval substantially improves
      factual question-answering accuracy over relying on internalized model knowledge alone.
    source: §1, Table 1
    evidence: Across Qwen2.5-7B, OpusLM, and Kimi-Audio, moving from Closed Book to Open Book tool integration raises
      AudioCRAG-Synthetic accuracy by up to 140% relative (11.1% to 26.3% absolute for Qwen2.5-7B), though at the
      cost of roughly 2.3x higher first-token latency.
    confidence: high
    claim_id: q4_2510_02044_augmenting_speech_in_speech_out_dialogue_systems_with_external_tool_retrieval_substantia
    relevance: medium
  - role: supports
    claim: Predicting tool queries incrementally from partial speech input, before the user finishes speaking, can
      recover most of the latency overhead that external tool calls introduce into spoken dialogue, without sacrificing
      accuracy.
    source: §5.1, Table 1
    evidence: Model-Triggered Streaming RAG post-training on Qwen2.5-7B reaches 34.2% accuracy on AudioCRAG-Synthetic
      (higher than the non-streaming Open Book's 26.3%) while cutting first-token tool-use latency by 20.7% on AudioCRAG-Synthetic
      and 53.4% on AudioCRAG-Human.
    confidence: high
    claim_id: q4_2510_02044_predicting_tool_queries_incrementally_from_partial_speech_input_before_the_user_finishes
    relevance: high
  - role: complicates
    claim: Generating a spoken response degrades factual QA accuracy relative to generating a text response from
      the same tool-augmented model and identical retrieved evidence.
    source: §5.2, Table 2
    evidence: 'In the Open Book setting, all three evaluated models score lower for speech output than text output
      from the same references (Qwen2.5-7B: 39.6% text vs. 26.3% speech; Kimi-Audio: 45.8% text vs. 21.8% speech),
      and an intermediate text-then-speech self-cascade only partially closes the gap.'
    confidence: high
    claim_id: q4_2510_02044_generating_a_spoken_response_degrades_factual_qa_accuracy_relative_to_generating_a_text_
    relevance: medium
  - role: complicates
    claim: Streaming tool-query generation without a learned trigger requires substantially more parallel computation
      to achieve latency savings comparable to a model that learns when to query.
    source: §5.4, Figure 4
    evidence: Fixed-Interval Streaming RAG requires multiple parallel tool-call threads per query and reduces Open-Book
      tool-use latency by only 10.7% for Qwen-Omni without any post-training, whereas Model-Triggered Streaming
      RAG achieves larger average latency reductions using a single thread.
    confidence: high
    claim_id: q4_2510_02044_streaming_tool_query_generation_without_a_learned_trigger_requires_substantially_more_pa
    relevance: high
  limitations:
  - All reported accuracy scores rely on automated LLM-judge evaluation (LLaMA-4-Maverick transcribing and scoring
    Whisper transcripts of the spoken output), and no human listening study validates either the naturalness of
    the spoken responses or the paper's central claim about reduced user-perceived latency; the framework's core
    motivation (avoiding "awkward silences") is argued from measured latency numbers rather than from subjective
    user studies.
  - The evaluation is restricted to single-turn factual QA with simulated web and knowledge-graph APIs drawn from
    the CRAG corpus; multi-turn dialogue, ambiguous follow-up queries, and real (non-mocked) retrieval latency are
    not tested. Kimi-Audio could not be evaluated under Streaming RAG at all due to an architectural limit on tool-result
    reference length, and OpusLM only supports tool-result conditioning in speech-out mode after post-training,
    not zero-shot, indicating the framework's applicability still depends on properties of the underlying backbone.
    The proposed Streaming RAG methods are demonstrated only in this speech-in speech-out setting on English factual
    QA; the paper notes the approach is modality-agnostic in principle but does not evaluate typed-input or multilingual
    scenarios.
