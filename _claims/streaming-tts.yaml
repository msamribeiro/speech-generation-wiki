    in expressiveness, with generated speech sometimes not fully capturing the intended emotional nuance, style,
    or prosody; and voice empathy performance is inconsistent across different emotional scenarios despite competitive
    benchmark averages. The dual-resolution architecture and Core-Cocktail Training strategy are both inherited
