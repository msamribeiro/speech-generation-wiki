    source: §4.5, Tables 5-6, Appendix H
    evidence: StreamFlow outperforms the native Mimi decoder on WER, M-STFT, PESQ, pitch error, and UTMOS at matched
      bitrates, receives a positive CMOS preference from listeners, and was integrated as a drop-in replacement
      for the Mimi decoder in Moshi's full-duplex pipeline.
