    relevance: high
  - claim_id: q4_neurips_2025_pdwwz9f7zh_a_continuous_latent_speech_language_model_whose_per_step_distribution_is
    role: supports
    claim: A continuous-latent speech language model whose per-step distribution is captured by a single forward
      pass, rather than an iterative diffusion or flow-matching process, can achieve comparable zero-shot synthesis
      quality to those iterative approaches while being substantially more computationally efficient.
    source: §6.3, Table 4
    evidence: Compared to DiTAR, a semi-autoregressive continuous approach using a local diffusion transformer per
      step, SLED achieves a comparable real-time factor while using roughly 10x fewer FLOPs and about one-third
      the parameters.
    confidence: high
    relevance: high
  - claim_id: q4_neurips_2025_pdwwz9f7zh_a_purely_autoregressive_continuous_latent_speech_language_model_with_no
    role: supports
    claim: A purely autoregressive continuous-latent speech language model with no post-hoc non-autoregressive refinement
      stage can support genuine incremental streaming synthesis by interleaving text and speech generation, at a
      moderate cost to word accuracy relative to offline generation.
    source: §5.4, Table 2
    evidence: With text and speech interleaved at a 5:20 or 5:45 token ratio, streaming inference achieves DNSMOS
      within 0.04 of offline generation (3.59/3.54 vs. 3.58) while WER rises from 1.67 to 2.18-2.20.
    confidence: high
    relevance: high
  - claim_id: q4_neurips_2025_pdwwz9f7zh_classifier_free_guidance_strength_in_continuous_latent_autoregressive_sp
    role: complicates
    claim: Classifier-free guidance strength in continuous-latent autoregressive speech generation trades off differently
      against intelligibility versus perceptual quality and speaker similarity, so a single guidance value cannot
      simultaneously optimize both.
    source: §6.2, Figure 3
    evidence: Increasing CFG strength from the unconditional setting sharply improves word accuracy up to a point,
      but timbre cloning and perceived speech quality peak at a moderate value and degrade with further increases,
      with streaming-mode quality at high guidance falling below even the no-CFG baseline.
    confidence: high
    relevance: medium
  limitations:
