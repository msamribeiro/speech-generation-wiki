    evidence: Following Core-Cocktail supervised fine-tuning with Multi-Task DPO Training, Fun-Audio-Chat substantially
      outperforms open-source Baichuan-Audio and Kimi-Audio on the VStyle instruction-following/empathy benchmark
      (overall scores 3.35/3.46 for Fun-Audio-Chat-8B vs. 2.50/2.25 and 2.54/3.11 respectively, English/Mandarin)
