open_questions:
- Which latency definition and measurement boundary should be standard for streaming speech generation?
- How small can chunks and lookahead become before intelligibility, prosody, or speaker identity fails?
- Can native speech systems match text-mediated reasoning while preserving paralinguistic information?
- What training data and objectives support genuine simultaneous listening, speaking, interruption, and recovery?
- How should token rate, codebook structure, and parallel decoding be co-designed for interactive generation?
- Which architectures provide the best quality–latency–energy trade-off across multilingual and noisy deployment?
- How should concurrent reasoning be synchronized with streaming speech generation so responses can begin early
  without committing before decisive reasoning evidence arrives?
- How can external retrieval and tool use be scheduled from partial speech without excessive speculative compute
  or premature queries?
- Which component-level and end-to-end measurements best reveal when latency bottlenecks migrate between ASR, language
  modeling, acoustic decoding, vocoding, and orchestration?
trend_notes:
- Streaming research is moving beyond causal synthesis toward full speech-in/speech-out systems that reason, retrieve
  tools, manage interruptions, and generate speech concurrently.
- Q4 systems increasingly exploit the listening window for blockwise or parallel reasoning, reducing the historical
  latency penalty of chain-of-thought processing while preserving preemption.
- Autoregressive systems reduce serial cost through multi-token prediction, low-rate or grouped tokens, interleaving,
  and input-time speculation, but decoder and vocoder latency can become the next bottleneck.
- Causal flow, GAN, spectral-codec, and hybrid decoders increasingly approach offline quality, although small chunks
  and one-step generation retain quality and stability trade-offs.
- Modular streaming systems remain competitive when every component is incremental and paralinguistic signals are
  preserved, weakening the assumption that low latency requires a monolithic end-to-end model.
- Evaluation is shifting toward component-attributed first-packet delay, sustained throughput, reasoning availability,
  barge-in timing, and matched end-to-end comparisons rather than batch real-time factor alone.
