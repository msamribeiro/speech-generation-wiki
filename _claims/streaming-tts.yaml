    evidence: SLED outperforms VALL-E on all reported metrics in both prompting settings despite using a roughly
      35M-parameter per-step generative module compared to VALL-E's approximately 159M-parameter non-autoregressive
      residual-token predictor, with both models sharing the same EnCodec latent encoder.
