      end-to-end inference time, because the deeper RVQ stacks needed to preserve quality at low frame rates introduce
      more sequential decoding steps.
    source: §4.3, Table 6
    evidence: The 100-layer-RVQ/5Hz configuration keeps total MACs modest (1.45G) but has the highest measured RTF
      (4.68) of all 5Hz variants, higher even than the 12.5Hz 8-layer configuration (RTF 1.33), because autoregressive
      decoding over 100 sequential codebook layers limits parallel throughput.
