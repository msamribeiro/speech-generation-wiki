  claims:
  - role: supports
    claim: Using text as an explicit, timestamped intermediate modality between a multimodal LLM's language understanding
      and a downstream TTS module can improve both the content quality and audio-visual timing accuracy of synchronized,
      incrementally generated speech, compared to generating audio tokens directly from LLM hidden states.
    source: §5.3, Table 3
    evidence: Removing TempoVoice (predicting audio tokens directly from trimmed/padded hidden states via an MLP)
      degrades UTMOSv2 from 1.41 to 1.23 and audio-visual synchronization (LSE-D) from 9.56 to 11.91.
    confidence: high
    claim_id: q4_neurips_2025_vhpy3nmso5_using_text_as_an_explicit_timestamped_intermediate_modality_between_a_multimodal_llm_s_l
    relevance: high
  - role: supports
    claim: Explicit temporal markup embedded directly into generated text tokens, rather than post-hoc timestamp-window
      filtering of generated words, improves the semantic quality and audio-visual synchronization of speech generated
      from a static, non-temporal text representation.
    source: §5.3, Table 3
    evidence: Removing Chrono-Text Markup (substituting timestamp-window filtering) degrades LSE-D from 9.56 to
      11.51, METEOR from 0.141 to 0.122, and BERTScore F1 from 0.806 to 0.766.
    confidence: high
    claim_id: q4_neurips_2025_vhpy3nmso5_explicit_temporal_markup_embedded_directly_into_generated_text_tokens_rather_than_post_h
    relevance: high
  - role: supports
    claim: A cross-attention mechanism using zero-initialized, positionally-encoded placeholder queries over fused
      text-and-voiceprint representations can generate an audio-token sequence whose length is decoupled from the
      source text-token sequence, while remaining synchronized to a parallel, independently-generated visual stream.
    source: §3.1
    evidence: TempoVoice's decoder uses zero-initialized, sinusoidally-positioned placeholder tokens as cross-attention
      queries over fused text-voice representations, enabling autoregressive audio-token generation in lockstep
      with visual frames despite the differing native lengths of the audio, text, and visual-frame sequences.
    confidence: high
    claim_id: q4_neurips_2025_vhpy3nmso5_a_cross_attention_mechanism_using_zero_initialized_positionally_encoded_placeholder_quer
    relevance: medium
  - role: complicates
    claim: Multimodal listener-response systems that omit text as an explicit intermediate representation and instead
      generate audio directly from LLM hidden states struggle with both content quality and audio-visual timing,
      even when built on the same class of pretrained LLM.
    source: §5.1, Table 2
    evidence: An Audio-visual LLM baseline lacking the text-intermediate design achieves substantially lower speech-content
      quality (METEOR 0.030 vs. 0.141, BERTScore F1 0.662 vs. 0.806) and worse audio-visual synchronization (LSE-D
      10.03 vs. 9.56) than OmniResponse despite using a comparable pretrained LLM.
    confidence: high
    claim_id: q4_neurips_2025_vhpy3nmso5_multimodal_listener_response_systems_that_omit_text_as_an_explicit_intermediate_represen
    relevance: high
  limitations:
  - The authors note the approach depends heavily on training data quality and diversity, requires accurate speaker-listener
    audio segmentation (degrading in noisy or overlapping conversations), and struggles with well-aligned multimodal
    response generation in fast-changing or emotionally rich interactions. ResponseNet itself is modest in scale
    (696 pairs, 14.2 hours) relative to large speech corpora, and the paper explicitly states it lacks a fairness
    analysis. The audio evaluation relies on an automated MOS predictor (UTMOSv2) and a Lip-Speech Error Distance
    metric rather than a dedicated human listening test isolating audio quality alone (the user study combines audio
    quality with visual and synchronization judgments).
