  claims:
  - claim_id: explicit_classification_objectives_that_predict_target_attributes_e_g_em
    role: supports
    claim: Explicit classification objectives that predict target attributes (e.g., emotion, speaker identity) from
      disentangled embeddings provide a stronger and more reliable disentanglement signal than mutual-information
      minimization alone.
    source: §V-F, Table II
    evidence: Ablating both the Emotion/Speaker Predictors and MINE drops emotion-recognition UAA from 82.42% to
      56.84% and worsens MCD from 8.23 to 9.71, a larger degradation than removing either component individually.
    confidence: high
    relevance: high
  - claim_id: predicting_phoneme_level_rather_than_utterance_level_style_embeddings_fr
    role: supports
    claim: Predicting phoneme-level, rather than utterance-level, style embeddings from a reference signal improves
      perceived style/emotion similarity without degrading naturalness relative to global-style-vector baselines.
    source: §V-E, Table I
    evidence: The proposed phoneme-aware Emotion Extractor achieves the highest SMOS (3.41 ± 0.06) among all compared
      systems while matching the best baseline's MOS (3.63 vs. 3.62 for FS2+MIST), evaluated on the same FS2 backbone.
    confidence: high
    relevance: high
  - claim_id: fine_grained_style_embeddings_derived_from_a_reference_utterance_can_lea
    role: complicates
    claim: Fine-grained style embeddings derived from a reference utterance can leak the reference's lexical content
      into the synthesized output unless the conditioning pathway is explicitly constrained against it.
    source: §V-E
    evidence: The authors omit positional encoding from the reference mel-spectrogram features specifically to prevent
      "content leakage," and construct evaluation reference clips from a fixed, different-text utterance matching
      only speaker and emotion, to avoid an artificial similarity boost from shared lexical content.
    confidence: high
    relevance: medium
  - claim_id: discrete_codec_derived_reference_embeddings_do_not_uniformly_outperform
    role: refines
    claim: Discrete-codec-derived reference embeddings do not uniformly outperform continuous mel-spectrogram reference
      embeddings for capturing emotional expressiveness.
    source: §V-E, Table I
    evidence: DC Comix TTS, which replaces the GST reference encoder with an EnCodec-style discrete-code encoder,
      scores the lowest emotion-recognition UAA (58.79%) of all four baselines, below both continuous-mel-based
      systems (FS2+GST 74.22%, FS2+MIST 76.17%) on the same evaluation protocol.
    confidence: high
    relevance: medium
  limitations:
  - The closed-set study uses one English emotional-speech corpus and ten known speakers; MOS parity does not establish
    unseen-speaker generalization.
  caveats:
  - Fine-grained reference conditioning improves emotion similarity but remains vulnerable to lexical-content leakage
    and is tested in a closed speaker set.
