  - control_evidence
  current_role: active_evidence
  method_family: [flow_matching_emotional_synthesis]
  claims:
  - claim_id: q4_2512_09504_combining_multi_task_attribute_supervision_with_contrastive_audio_text_a
    role: supports
    claim: Combining multi-task attribute supervision with contrastive audio-text alignment in a style encoder yields
      stronger downstream style control than contrastive alignment alone.
    source: §4.3.2, Table 2
    evidence: Removing multi-task supervision (keeping only the contrastive loss) drops emotion control accuracy
      from 0.64 to 0.54 and energy accuracy from 0.85 to 0.80, while speaker similarity and WER change negligibly.
    confidence: high
    relevance: high
  - claim_id: q4_2512_09504_distilling_acoustic_semantic_features_from_a_pretrained_asr_encoder_into
    role: supports
    claim: Distilling acoustic-semantic features from a pretrained ASR encoder into intermediate diffusion-transformer
      layers can improve TTS intelligibility with little effect on style or speaker control.
    source: §4.3.2, Table 2
    evidence: Removing Whisper-based representation alignment (REPA) raises WER from 0.038 to 0.046, while style-accuracy
      and speaker-similarity metrics remain nearly unchanged, and REPA is reported to reach intelligible speech
      earlier in training.
    confidence: high
    relevance: medium
  - claim_id: q4_2512_09504_hierarchical_condition_dropout_during_classifier_free_guidance_training
    role: supports
    claim: Hierarchical condition dropout during classifier-free guidance training enables each conditioning attribute's
      guidance strength to be tuned independently at inference, rather than a single scale strengthening all conditions
      together.
    source: §4.3.3, Figure 2
    evidence: Independently varying the speaker or style guidance scale from 6.0 to 21.0 produces a corresponding
      upward trend in speaker similarity or emotion accuracy respectively, without requiring joint adjustment of
      the other attributes' guidance scales.
    confidence: high
    relevance: high
  - claim_id: q4_2512_09504_per_attribute_guidance_decomposition_does_not_fully_eliminate_cross_attr
    role: complicates
    claim: 'Per-attribute guidance decomposition does not fully eliminate cross-attribute interaction: pushing a
      single attribute''s guidance scale too high still degrades overall naturalness and can slightly reduce accuracy
      on attributes not being adjusted.'
    source: §4.3.3
    evidence: Excessively high guidance scales were observed to introduce over-conditioning that degrades naturalness
      and can slightly reduce the non-target attribute's accuracy, even under chained CFG's nominal per-attribute
      decomposition.
    confidence: medium
    relevance: high
  - claim_id: q4_2512_09504_choice_of_style_prompting_modality_audio_vs_descriptive_text_trades_off
    role: complicates
    claim: Choice of style-prompting modality (audio vs. descriptive text) trades off stability of attribute control
      against perceived naturalness, rather than one modality dominating the other.
    source: §4.3.1, Table 1
    evidence: Text-prompted synthesis gives more stable, generally higher style-attribute accuracy, while audio-prompted
      synthesis gives higher naturalness MOS (3.82 vs. 3.73), attributed to audio carrying richer prosodic and acoustic
      information than discrete text labels.
    confidence: high
    relevance: high
  limitations:
  - A small Chinese dataset and discrete style labels leave multilingual, dynamic-style, and large-scale speaker-fidelity
    behavior unresolved.
  caveats:
  - Independent attribute guidance remains coupled at high scales, and text versus audio style prompts trade control
    stability against naturalness.
- id: neurips-2025-4iehXI36QG
  published_date: '2025-12-10'
