  claims:
  - claim_id: decomposing_a_holistic_subjective_speech_quality_construct_into_interpretable_sub_dimensions_and
    role: supports
    claim: Decomposing a holistic, subjective speech quality construct into interpretable sub-dimensions and fusing
      them with a lightweight, separately-trained model can approximate human preference judgments with high data
      efficiency.
    source: §2.3, §4.1, Table 2
    evidence: The XGBoost preference-fusion function, trained on only 480 human-annotated clips using three proxy
      sub-scores as input, reaches SRCC = 0.86 and PCC = 0.91 against averaged human expressiveness ratings.
    confidence: high
    relevance: medium
  - claim_id: an_automatic_expressiveness_metric_aligned_with_human_judgment_can_reliably_rank_competing
    role: supports
    claim: An automatic expressiveness metric aligned with human judgment can reliably rank competing speech generation
      systems, offering a scalable substitute for comparative listening tests at the system level.
    source: §4.2, Table 3
    evidence: DeEAR ranks seven SOTA speech-to-speech dialogue systems with SRCC = 0.96 against human rankings and
      reproduces the near-60-point gap between the highest- and lowest-scoring systems.
    confidence: high
    relevance: medium
  - claim_id: filtering_training_data_with_an_automatic_expressiveness_score_can_substantially_increase_the
    role: supports
    claim: Filtering training data with an automatic expressiveness score can substantially increase the expressiveness
      of a fine-tuned speech generation model without any architectural change to that model.
    source: §4.3.2, Table 4
    evidence: Fine-tuning an existing speech-to-speech model on 51 hours of DeEAR-selected utterances (threshold
      63.5) for a single epoch raised the overall expressiveness score from 2.0 to 23.4 (p < 0.001), corroborated
      by a 78.5%-vs-10% human A/B preference for the fine-tuned model.
    confidence: high
    relevance: medium
  - claim_id: using_a_general_purpose_llm_as_a_scalable_proxy_annotator_for_a
    role: complicates
    claim: Using a general-purpose LLM as a scalable proxy annotator for a subjective perceptual dimension yields
      only moderate alignment with human judgment, so its labels should be treated as a noisy training signal rather
      than as ground truth.
    source: §2.2.2, §4.1, Table 2
    evidence: Gemini 2.5 Pro, used to generate prosodic-richness training labels, itself reaches only SRCC = 0.73
      against human ratings, and the resulting Prosody sub-scorer is the weakest of the three dimensions against
      holistic human perception (PCC = 0.70, SRCC = 0.68).
    confidence: high
    relevance: low
  - claim_id: heuristic_pseudo_labeling_of_a_perceptual_attribute_at_the_dataset_level_rather
    role: complicates
    claim: Heuristic pseudo-labeling of a perceptual attribute at the dataset level, rather than the individual-utterance
      level, caps the precision of any model subsequently distilled from those labels.
    source: §2.2.3
    evidence: The spontaneity pseudo-label heuristic assigns a single manually-set categorical base level per source
      dataset, combined with a DNSMOS-derived acoustic-quality adjustment, so utterance-level variation in true
      spontaneity within a dataset is not captured by the label itself.
    confidence: medium
    relevance: low
  limitations:
  - The same DeEAR metric is used both to select the ExpressiveSpeech training data and to score the resulting fine-tuned
    model's expressiveness gains (§4.3), so the headline 2.0-to-23.4 improvement is partially self-referential.
    The independent human A/B preference test (§4.3.2) mitigates but does not fully resolve this circularity, since
    the curation criterion and the primary evaluation criterion are the same underlying construct.
  caveats:
  - Expressiveness-based curation and evaluation partly reuse the same learned metric, despite an independent preference
    check.
