    claim: Improving emotional expressiveness in conditioned speech generation does not automatically preserve intelligibility
      relative to the strongest prior non-emotion-focused system.
    source: §Results and Discussion, Table 1
    evidence: Authentic-Dubber achieves the best EMO-ACC (47.21%) and MOS scores among all compared systems, but
      its WER (25.95) is higher than both StyleDubber (24.70) and Speaker2Dubber (18.27), the two strongest baselines
      on pronunciation accuracy.
    confidence: high
    relevance: high
  limitations:
  - The evaluation uses 20 raters and 12 samples, and improved emotional fidelity can trade off against intelligibility.
  caveats:
  - Retrieval-augmented emotional dubbing is sensitive to retrieval design and improves emotion at a possible intelligibility
    cost.
- id: '2511.18487'
  published_date: 2025-11-23
  entry_date: '2026-09-26'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - flow-matching
  relevance: high
  evidence_role:
  - architecture_variant
  - control_evidence
  current_role: active_evidence
  method_family: [flow_matching_emotional_synthesis]
  claims:
  - claim_id: natural_language_instruction_conditioning_can_control_timbre_and_paralinguis
    role: supports
    claim: Natural-language instruction conditioning can control timbre and paralinguistic attributes of synthesized
      speech at accuracy competitive with or exceeding reference-audio-dependent methods, without requiring a reference
      audio input.
    source: §3.3, Table 2
    evidence: Against CosyVoice2 (which needs reference audio for gender/age control), InstructAudio achieves 100%
      gender and 86.67% age classification control accuracy using text-only instructions, and outperforms CosyVoice2
      on emotion (83.33% vs. 58.33%) and style (86.67% vs. 65%) control accuracy that CosyVoice2 does support.
    confidence: high
    relevance: high
  - claim_id: conditioning_speech_synthesis_on_text_only_instructions_rather_than_referenc
    role: complicates
    claim: Conditioning speech synthesis on text-only instructions rather than reference audio introduces one-to-many
      mapping ambiguity that reduces perceived naturalness relative to audio-prompted systems.
    source: §3.3, §3.4, Table 2
    evidence: InstructAudio's NMOS (3.46) trails CosyVoice2's NMOS (3.65) despite InstructAudio outperforming CosyVoice2
      on nearly every objective control, similarity, and distortion metric; the authors attribute the naturalness
      gap to the information loss inherent in text-only conditioning versus reference-audio conditioning.
    confidence: high
    relevance: high
  - claim_id: a_single_instruction_conditioned_architecture_can_jointly_serve_speech_and_m
    role: supports
    claim: A single instruction-conditioned architecture can jointly serve speech and music generation at competitive
      quality in both domains, without requiring task-specific architectural branches or per-task fine-tuning.
    source: §3.3, Tables 1 and 3
    evidence: Trained jointly on 50K hours of speech and 20K hours of music using one standardized instruction-phoneme
      input format and one MM-DiT model, InstructAudio achieves the best SongEval scores across all five evaluated
      dimensions against dedicated TTM systems (DiffRhythm+, ACE-Step) while simultaneously achieving the lowest
      Seed-TTS WER among compared TTS systems, despite using less total training data than the largest single-task
      baselines.
    confidence: high
    relevance: medium
  - claim_id: constraining_audio_clip_length_to_enable_joint_training_across_generation_do
    role: complicates
    claim: Constraining audio clip length to enable joint training across generation domains with different natural
      durations limits the applicability of the resulting model to long-form generation in either domain.
    source: §3.2, §3.4
    evidence: To align speech and music training, clips are capped at 5–20 seconds; this disadvantages the TTM comparison
      against DiffRhythm+, which is optimized for full-length song generation and does not natively support outputs
      under 90 seconds, requiring the authors to generate longer sequences and truncate them for the evaluation,
      which they acknowledge "may introduce evaluation bias."
    confidence: high
    relevance: low
  limitations:
  - Professional listening tests use proprietary datasets and test sets, and baseline-access differences may bias
    comparisons.
  caveats:
  - Text-only emotion and style instructions improve control but introduce one-to-many ambiguity and lower naturalness
    than audio prompting.
- id: '2512.04552'
  published_date: '2025-12-04'
  entry_date: '2026-09-26'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  - flow-matching
  relevance: high
  evidence_role:
  - core_evidence
  - control_evidence
  - negative_evidence
  current_role: active_evidence
  method_family: [autoregressive_emotion_language_models, flow_matching_emotional_synthesis]
  claims:
  - claim_id: differentiable_reward_optimization_for_tts_is_vulnerable_to_reward_hacking_w
    role: supports
    claim: Differentiable reward optimization for TTS is vulnerable to reward hacking, where the policy model learns
      to exploit reward model weaknesses via imperceptible-to-measurable acoustic artifacts rather than the intended
      target behavior.
    source: §3.2.1, Table 1
    evidence: The DiffRO baseline achieves a competitive Emotion MOS (3.65) but its Naturalness MOS (3.61) falls
      below even the SFT baseline (3.72), a divergence the authors attribute to the policy exploiting RM vulnerabilities
      with acoustic artifacts.
    confidence: high
    relevance: high
  - claim_id: a_reward_model_s_robustness_against_reward_hacking_can_be_improved_by_combin
    role: supports
    claim: A reward model's robustness against reward hacking can be improved by combining complementary regularization
      techniques that each target a distinct failure mode (label overconfidence, brittle decision boundaries, perturbation
      sensitivity), and this robustness transfers to downstream policy behavior.
    source: §3.2.2, Table 2; §3.2.1, Table 1
    evidence: Progressively adding label smoothing, energy-adaptive Mixup, and adversarial training to the reward
      model raises SER weighted accuracy on IEMOCAP/MER2023/ESD from 66.0/50.9/64.4 (DiffRO baseline) to 68.0/54.8/81.7
      (full RRPO), and the resulting policy achieves the highest subjective MOS on both emotion and naturalness
      axes among all four compared systems.
    confidence: high
    relevance: high
  - claim_id: objective_proxy_metrics_for_reward_model_robustness_do_not_move_uniformly_wi
    role: complicates
    claim: Objective proxy metrics for reward-model robustness do not move uniformly with each added regularization
      component, so component-level ablations can show trade-offs rather than monotonic improvement.
    source: §3.2.2, Table 2
    evidence: Adding adversarial training on top of label smoothing and energy-adaptive Mixup improves MER2023 accuracy
      (52.7 → 54.8) but slightly degrades IEMOCAP (69.1 → 68.0) and ESD (82.3 → 81.7), which the authors attribute
      to a known generalization/adversarial-robustness trade-off.
    confidence: high
    relevance: high
  - claim_id: fine_tuning_a_reward_model_s_robustness_on_data_from_a_single_language_can_s
    role: supports
    claim: Fine-tuning a reward model's robustness on data from a single language can still improve the reward signal's
      reliability on other languages, suggesting the correction targets language-agnostic representations rather
      than language-specific acoustic cues.
    source: §3.2.2
    evidence: Despite the RM being fine-tuned exclusively on Mandarin emotional data, weighted accuracy on the English-language
      IEMOCAP benchmark improves substantially (66.0 → 68.0–69.1 across ablation variants).
    confidence: high
    relevance: high
  limitations:
  - Training and listening data come from one male Mandarin speaker; 20 raters judge 50 utterances, and cross-lingual
    evidence is objective rather than perceptual.
  caveats:
  - Reward robustness is demonstrated mainly on one Mandarin speaker, while cross-lingual transfer is evaluated
    automatically.
- id: '2512.09504'
  published_date: '2025-12-10'
  entry_date: '2026-09-26'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - flow-matching
  relevance: high
  evidence_role:
