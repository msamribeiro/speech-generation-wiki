  claims:
  - claim_id: retrieval_augmented_conditioning_on_real_reference_exemplars_can_substit
    role: supports
    claim: Retrieval-augmented conditioning on real reference exemplars can substitute for a single manually chosen
      style-reference utterance in expressive speech synthesis, without a loss in perceived naturalness.
    source: §Sarcastic Speech Synthesis Results, Table 2
    evidence: Prosody-only conditioning using the top-3 retrieved sarcastic exemplars (WavLM-encoded) raised sarcasm
      MOS from 3.2±0.2 (baseline) to 3.7±0.2 while naturalness MOS stayed flat at 2.6±0.1.
    confidence: high
    relevance: high
  - claim_id: task_specific_fine_tuning_of_a_general_purpose_llm_is_necessary_to_make
    role: supports
    claim: Task-specific fine-tuning of a general-purpose LLM is necessary to make its embeddings useful for conditioning
      expressive speech synthesis; the pretrained embeddings alone are not sufficient and can be actively harmful.
    source: §Sarcastic Speech Synthesis Results, Table 2
    evidence: Conditioning on untuned LLaMA 3 embeddings degraded both naturalness (2.0±0.1 NMOS, versus 2.6±0.1
      for baseline) and perceived sarcasm (2.6±0.2 SMOS, versus 3.2±0.2 for baseline), while the same LLaMA 3 backbone
      after LoRA fine-tuning raised sarcasm MOS to 3.8±0.2 with naturalness restored to 2.6±0.1.
    confidence: high
    relevance: medium
  - claim_id: semantic_and_prosodic_cues_make_complementary_non_redundant_contribution
    role: supports
    claim: Semantic and prosodic cues make complementary, non-redundant contributions to a pragmatic speech phenomenon,
      and combining them yields effects that neither cue produces alone.
    source: §Sarcastic Speech Synthesis Results, Table 2
    evidence: The combined LoRA+RAG condition achieved the highest downstream sarcasm-detection F1 from synthesized
      audio (62.5%) among all six tested conditions and the lowest acoustic distortion (9.8 MCD), while matching
      the best single-cue SMOS (3.8±0.2) at improved naturalness (2.7±0.1 NMOS) relative to either cue alone.
    confidence: high
    relevance: high
  - claim_id: low_level_acoustic_fidelity_metrics_can_fail_to_reflect_meaningful_diffe
    role: complicates
    claim: Low-level acoustic fidelity metrics can fail to reflect meaningful differences in a system's ability
      to convey pragmatic or paralinguistic intent, so they should not be used as proxies for expressivity.
    source: §Sarcastic Speech Synthesis Results
    evidence: MCD, pitch RMSE, and energy RMSE remained nearly identical across all six conditions (MCD ranging
      9.6-10.4) even though sarcasm detection F1 varied from 59.0% to 62.5% and SMOS varied from 2.6±0.2 to 3.8±0.2
      across the same conditions.
    confidence: high
    relevance: medium
  limitations:
  - The perceptual study uses 30 listeners and eight sentences per system from one English sitcom corpus, without
    reported significance tests.
  caveats:
  - Sarcasm is one pragmatic style on one English sitcom corpus, and the perceptual test is small.
