  claims:
  - claim_id: q4_2512_18699_a_style_specific_parameter_direction_extracted_by_subtracting_a_model_s
    role: supports
    claim: A style-specific parameter direction, extracted by subtracting a model's pretrained parameters from its
      style-fine-tuned parameters, can be linearly scaled and added back to the pretrained model to enhance that
      single expressive style without full fine-tuning.
    source: §4.2, Table 2
    evidence: The E-Vector method, built by scaling a dialect or emotion task vector and adding it to F5-TTS's pretrained
      parameters, achieves higher average dialect-synthesis MOS (3.18) than both a standard fine-tune (1.85) and
      an over-fine-tuned model (2.85), using roughly one-fifth of the over-fine-tuned model's training steps.
    confidence: high
    relevance: high
  - claim_id: q4_2512_18699_two_independently_learned_expressive_style_controls_can_be_combined_for
    role: supports
    claim: Two independently-learned expressive style controls can be combined for joint multi-style speech synthesis,
      without any data labeled for both styles simultaneously, by applying each style's parameter modulation to
      a disjoint subset of model layers rather than merging them into the same parameters.
    source: §4.3, Table 3
    evidence: The hierarchical merging strategy, which applies the dialect LoRA E-Vector to the text embedding and
      early DiT layers and the emotion LoRA E-Vector to the later DiT layers, achieves the best average MOS (2.83)
      on joint emotional-dialectal synthesis, ahead of a fully-merged variant (2.76) and a sequential dual-stage
      pipeline (2.56).
    confidence: high
    relevance: high
  - claim_id: q4_2512_18699_a_style_enhancement_technique_validated_on_one_tts_backbone_does_not_nec
    role: complicates
    claim: A style-enhancement technique validated on one TTS backbone does not necessarily transfer to another
      backbone with a different architecture, particularly when the target model couples an LLM-based component
      with a separate acoustic generation component.
    source: §5
    evidence: Applying the same E-Vector construction to CosyVoice, which combines an LLM-based text encoder with
      a flow-matching acoustic model, produced degraded synthesis quality, attributed to interference between the
      two components.
    confidence: medium
    relevance: medium
  - claim_id: q4_2512_18699_jointly_controlling_two_expressive_styles_in_speech_synthesis_remains_su
    role: complicates
    claim: Jointly controlling two expressive styles in speech synthesis remains substantially harder than controlling
      either style alone, even with an interference-mitigating combination strategy.
    source: §4.3, Table 3
    evidence: All evaluated systems' average MOS scores on the joint emotional-dialectal synthesis task (HE-Vector
      2.83, Fully E-Vector 2.76) are markedly lower than the best single-style dialect-synthesis MOS (E-Vector 3.18),
      and the paper explicitly notes existing models often fail when controlling two or more expressive styles simultaneously.
    confidence: high
    relevance: high
  limitations:
  - Private dialect data, unreliable dialect ASR, heuristic layer splits, and failure on CosyVoice constrain generalization.
  caveats:
  - Parameter-vector emotion control is backbone-sensitive and still degrades when dialect and emotion are composed.
