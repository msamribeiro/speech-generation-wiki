      can achieve large real-time latency reductions over autoregressive speech decoding, without requiring a separate
      external TTS module.
    source: §3.4, §4.2
    evidence: The non-autoregressive speech decoder generates up to 30 seconds of speech in under 1 second of latency,
      roughly 5x faster than autoregressive decoding, replacing the common pattern of coupling an LLM to an external
      TTS system.
    confidence: high
    claim_id: q4_neurips_2025_4iehxi36qg_a_speech_decoder_trained_with_ctc_based_non_autoregressive_alignment_on_top_of_an_llm_s_
    relevance: low
  - role: supports
    claim: Adapting direct preference optimization to a CTC-based non-autoregressive speech generation objective
      can induce emotionally coherent, context-aware speech without any explicit emotion-control module or handcrafted
      prompt at inference time.
    source: §4.2, Table 4
    evidence: CTC-DPO training on emotion-congruent vs. emotion-neutral preference pairs raises overall emotion-classification
      accuracy on generated speech from 62.6% to 65.4% (English) and 57.9% to 70.4% (Chinese) on the bilingual EO2S-9K
      test set, with no additional inference-time control module.
    confidence: high
    claim_id: q4_neurips_2025_4iehxi36qg_adapting_direct_preference_optimization_to_a_ctc_based_non_autoregressive_speech_generat
    relevance: high
  - role: supports
    claim: Progressive alignment through a shared text pivot, training separately on speech-text pairs and image-text
      pairs, can substitute for costly tri-modal (image-speech-text) training data while remaining competitive on
      omnimodal benchmarks.
    source: §4.2, Table 1
    evidence: Trained only on pairwise speech-text and image-text data, OpenOmni outperforms VITA (trained on true
      tri-modal image-speech-text triples) on OmniBench, 37.40 vs. 33.45 overall, using a smaller model (7B vs.
      7x8B) and fewer training samples.
    confidence: high
    claim_id: q4_neurips_2025_4iehxi36qg_progressive_alignment_through_a_shared_text_pivot_training_separately_on_speech_text_pai
    relevance: low
  - role: complicates
    claim: Combining vision, language, and speech generation in one omnimodal system does not close the accuracy
      gap between a model's own synthesized-speech recognition and its recognition of natural speech input.
    source: §4.2, Table 3
    evidence: On AIShell-2, OpenOmni's speech-to-text CER (6.8-6.9%) is lower than its text-to-speech CER on its
      own synthesized output (7.3-13.1%), and its synthesized-speech WER on LibriSpeech test-other (5.6%) exceeds
      its own speech-recognition WER on the same split (4.1%).
    confidence: high
    claim_id: q4_neurips_2025_4iehxi36qg_combining_vision_language_and_speech_generation_in_one_omnimodal_system_does_not_close_t
    relevance: low
  limitations:
  - The quasi-zero-shot transfer from image-text instruction tuning to spoken-instruction response is explicitly
    reported as producing predominantly text-dominant answers rather than robust omnimodal understanding, an approximation
    the authors attribute to representational similarity between text and speech instructions in the LLM rather
    than genuine trained speech-instruction understanding. Emotion-classification evaluation relies on an automated
    classifier (Emotion2Vec) rather than human listening tests, and the emotional preference dataset itself is partly
    synthetically constructed and augmented (via GPT-4o-mini) to balance underrepresented emotion categories, which
    may not fully reflect natural emotional speech distributions.
  caveats:
  - Emotion coherence is evaluated with an automatic classifier on partly synthetic preference data rather than
