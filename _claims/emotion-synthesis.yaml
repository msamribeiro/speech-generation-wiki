  claims:
  - claim_id: q4_2511_03601_data_driven_contrastive_pair_construction_with_margin_filtering_can_subs
    role: supports
    claim: Data-driven contrastive pair construction with margin filtering can substitute for explicit representation-level
      disentanglement mechanisms (adversarial training, factorized encoders) as a route to independent attribute
      control in speech generation.
    source: §3.1.2, §1
    evidence: Emotion/style triplets are built by zero-shot cloning the same speaker's neutral vs. target-attribute
      prompt, filtered by a margin-scoring model with a universal minimum score of 6/10, and produce accurate attribute
      editing without any auxiliary disentanglement module or adversarial loss.
    confidence: medium
    relevance: high
  - claim_id: q4_2511_03601_reformulating_attribute_editing_as_multiple_iterative_regeneration_passe
    role: supports
    claim: Reformulating attribute editing as multiple iterative regeneration passes over the same audio increases
      control strength beyond what a single generation pass achieves.
    source: §5.2.1, Table 1
    evidence: Average emotion accuracy on the benchmark rises from 55.0 (Iter0) to 71.0 (Iter3) and speaking-style
      accuracy from 44.6 to 66.2, with the gain persisting under a prompt-audio-fixed ablation that isolates the
      iterative token-editing effect from prompt changes.
    confidence: high
    relevance: high
  - claim_id: q4_2511_03601_token_level_reward_modeling_on_discrete_audio_codec_sequences_bypassing
    role: supports
    claim: Token-level reward modeling on discrete audio codec sequences, bypassing waveform decoding during reward
      computation, is a viable strategy for applying RLHF to speech generation, including editing tasks with large
      source-target attribute divergence.
    source: §4.2
    evidence: A Bradley-Terry reward model trained directly on dual-codebook token pairs (no audio decoder needed
      for scoring) is used for PPO fine-tuning, which the authors report most noticeably improves stability and
      expressiveness on cases such as generating sad speech from a happy prompt or whispered speech from loud input.
    confidence: medium
    relevance: high
  - claim_id: q4_2511_03601_systems_that_implement_attribute_editing_as_full_sequence_conditional_re
    role: complicates
    claim: Systems that implement attribute editing as full-sequence conditional regeneration rather than localized
      token editing face a trade-off between control strength and precise preservation of unedited content.
    source: §7
    evidence: The authors note their editing process "is not strictly conventional editing... it functions as a
      form of conditional regeneration or transfer," and propose a separate, only briefly described mask-based reconstruction
      approach for tasks requiring partial modification while preserving the rest of the sequence.
    confidence: medium
    relevance: high
  limitations:
  - Editing is full-sequence regeneration rather than localized modification, and proprietary data plus an unvalidated
    LLM judge limit reproducibility.
  caveats:
  - Full-sequence regeneration strengthens attribute editing but weakens preservation of untargeted content, and
    evaluation depends partly on an unvalidated LLM judge.
