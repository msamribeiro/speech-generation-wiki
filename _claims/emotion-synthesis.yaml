  evidence_role:
  - core_evidence
  - control_evidence
  current_role: active_evidence
  method_family: [autoregressive_emotion_language_models, flow_matching_emotional_synthesis]
  claims:
  - claim_id: q4_neurips_2025_sycggdxx6w_word_level_control_of_both_emotion_and_speaking_rate_in_a_pretrained_zer
    role: supports
    claim: Word-level control of both emotion and speaking rate in a pretrained zero-shot TTS model can be achieved
      without any training data containing intra-sentence emotion or speed transitions, by using multi-round inference
      over multiple utterance-level emotional prompts with explicit transition smoothing.
    source: §4.2.1, Table 1
    evidence: Using only ESD's non-transition emotional prompts, WeSCon's first-stage teacher achieves state-of-the-art
      word-level emotion and speaking-rate control metrics with no transition-labeled training data, reducing transition
      discontinuity (DNSV) from 7.612-7.894 (CosyVoice2 baseline) to 4.21-4.58 across English and Chinese.
    confidence: high
    relevance: high
  - claim_id: q4_neurips_2025_sycggdxx6w_the_fine_grained_expressive_control_ability_of_a_complex_multi_round_tea
    role: supports
    claim: The fine-grained expressive control ability of a complex multi-round teacher inference pipeline can be
      distilled into a single end-to-end student model via self-training on teacher-generated pseudo-labels, eliminating
      the need for multi-round inference at deployment.
    source: §4.2.1, Tables 1-2
    evidence: The self-trained student model matches or slightly exceeds the multi-round teacher on nearly all objective
      and subjective metrics (e.g., DNSV improves from 4.980 to 4.210 on Chinese) while replacing multi-round concatenative
      inference with a single end-to-end forward pass.
    confidence: high
    relevance: high
  - claim_id: q4_neurips_2025_sycggdxx6w_adding_fine_grained_expressive_controllability_to_a_pretrained_zero_shot
    role: supports
    claim: Adding fine-grained expressive controllability to a pretrained zero-shot TTS model does not have to degrade
      its original zero-shot synthesis quality, if the control mechanism preserves the model's original input format.
    source: §4.2.1, Table 3
    evidence: On the standard zero-shot TTS benchmark SEED test-zh, WeSCon's fine-tuned model achieves CER and speaker
      similarity nearly identical to the unmodified CosyVoice2 backbone (CER 1.45 vs. 1.47, S-SIM 0.748 vs. 0.744).
    confidence: high
    relevance: high
  - claim_id: q4_neurips_2025_sycggdxx6w_explicit_word_level_speaking_rate_control_is_not_an_independent_prosodic
    role: complicates
    claim: Explicit word-level speaking-rate control is not an independent prosodic dimension from emotional expressiveness;
      removing it measurably degrades emotion-similarity metrics, not just rate accuracy.
    source: §4.2.2, Table 4
    evidence: Ablating the dynamic speed control mechanism degrades AutoPCP from 2.650 to 2.499 and emotion2vec
      similarity from 0.866 to 0.844, alongside the expected prosody-metric changes.
    confidence: high
    relevance: high
  - claim_id: q4_neurips_2025_sycggdxx6w_self_training_data_scale_for_fine_grained_expressive_control_has_a_dimin
    role: complicates
    claim: Self-training data scale for fine-grained expressive control has a diminishing and eventually reversing
      return when the underlying source dataset has limited emotional and speaker diversity, rather than benefiting
      monotonically from more synthetic training data.
    source: §4.2.2, Figure 5
    evidence: Performance of the self-trained student model peaks at 500 hours of teacher-generated data and declines
      beyond that point, which the authors attribute to overfitting given ESD's limited emotion categories and speaker
      identities.
    confidence: high
    relevance: high
  limitations:
  - Fixed discrete emotions, GPT-defined transition plans, and limited ESD diversity constrain semantic and compositional
    emotional control.
  caveats:
  - Word-level emotion control relies on fixed categories and synthetic teacher data whose gains reverse beyond
    the source corpus diversity limit.
