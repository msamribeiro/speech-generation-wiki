  name: Hybrid semantic–acoustic emotion systems
  summary: Hybrid systems separate semantic interpretation, affect planning, acoustic rendering, and sometimes speaker
    or dialogue pathways to retain complementary signals. Q4 extends the pattern to style-rich dialogue tuning,
    reward-guided regeneration, multimodal retrieval, omnimodal preference alignment, and laughter-aware control.
