  claims:
  - claim_id: in_autoregressive_tts_models_classifier_free_guidance_can_be_made_more_e
    role: supports
    claim: In autoregressive TTS models, classifier-free guidance can be made more effective at resolving competing
      conditioning signals by contrasting the target condition against the specific opposing signal rather than
      against an uninformative unconditional baseline.
    source: §2.2.1, §4.1, Table 3
    evidence: CCG-CFG, which substitutes the CFG dropout branch with the text-implied emotion when inconsistency
      is detected, raises EmoACC over CosyVoice2-CFG at the same nominal guidance-scale setting (e.g., CCG-CFG (H)
      reaches 64.79% EmoACC vs. 56.40% for CosyVoice2-CFG (H)) while WER is comparable.
    confidence: high
    relevance: high
  - claim_id: increasing_emotional_expressiveness_in_autoregressive_tts_via_inference
    role: complicates
    claim: Increasing emotional expressiveness in autoregressive TTS via inference-time guidance amplification tends
      to trade off against intelligibility and perceived naturalness.
    source: §4.1, §4.2, Table 3, Table 5
    evidence: DS-CCG-CFG raises EmoACC to 64.83% over the 50.63% neutral-reference baseline but nearly doubles WER
      (from 4.61% to 7.86%) and lowers human-rated naturalness (NMOS 3.31) and quality (MOS 3.91) below the unguided
      baseline (NMOS 3.6, MOS 4.2).
    confidence: high
    relevance: high
  - claim_id: distilling_an_inference_time_guidance_signal_into_a_tts_model_s_weights
    role: supports
    claim: Distilling an inference-time guidance signal into a TTS model's weights via preference optimization can
      recover much of the guidance's expressiveness benefit while removing its synthesis-artifact cost and its two-pass
      decoding overhead.
    source: §4.1, §4.2, Table 3, Table 5
    evidence: DS-CCG-CFG-DPO+EXT. improves EmoACC to 59.55% over the 50.63% baseline while lowering WER to 3.76%
      (better than the unguided baseline's 4.61%) and achieving the highest human MOS (4.33), NMOS (3.94), and EMOS
      (3.67) scores of any configuration tested, without requiring inference-time two-pass CFG decoding.
    confidence: high
    relevance: high
  - claim_id: providing_a_target_emotion_reference_audio_clip_to_a_zero_shot_voice_clo
    role: complicates
    claim: Providing a target-emotion reference audio clip to a zero-shot voice cloning TTS system, rather than
      relying on a text-only emotion instruction, can leak style information that inflates apparent natural-language
      emotion-control performance.
    source: §4.1, Table 3
    evidence: CosyVoice2 with Natural Language Emotion Control achieves 65.11% EmoACC when given a rendered-emotion
      reference clip, dropping to 50.63% when the reference is replaced with a neutral-emotion clip, leading the
      authors to adopt the neutral-reference condition as the realistic baseline for all subsequent experiments.
    confidence: high
    relevance: high
  limitations:
  - Human evaluation covers 14 samples, and automated subjective judging depends on proprietary external LLMs.
  caveats:
  - Guidance and preference optimization are evaluated with a small listening set and proprietary automatic judges.
- id: '2510.18308'
  published_date: '2025-10-21'
  entry_date: '2026-09-26'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - VAE
  - GAN
  claims:
  - role: supports
    claim: Explicit, disentangled conditioning mechanisms for prosodic versus paralinguistic style can match the
      perceptual quality of LLM-mediated style fusion while substantially reducing model size and inference cost.
    source: §5.1, §5.3, Table 2, Table 4
    evidence: ParaStyleTTS reaches I-MOS 4.65 / N-MOS 4.36 versus CosyVoice's I-MOS 4.75 / N-MOS 4.57, while using
      8x fewer parameters (52.51M vs. 436.05M), running 30x faster (121.2ms vs. 4076.1ms), and needing 2.5x less
      CUDA memory (763MB vs. 1852MB).
    claim_id: q4_2510_18308_explicit_disentangled_conditioning_mechanisms_for_prosodic_versus_paralinguistic_style_can_match_the
    confidence: high
    relevance: high
  - role: supports
    claim: Acoustic-centric conditioning that directly grounds text-prompt embeddings in latent speech features
      produces more robust style control under paraphrased prompts than approaches that route style through an autoregressive
      language model's semantic interpretation.
    source: §5.4, Table 6, Figure 3
    evidence: Under ten semantically equivalent gender-describing prompt variants, ParaStyleTTS preserves 100%/100%
      male/female classification accuracy while CosyVoice misclassifies 5 of 10 male-prompted samples as female.
    claim_id: q4_2510_18308_acoustic_centric_conditioning_that_directly_grounds_text_prompt_embeddings_in_latent_speech_features
    confidence: high
    relevance: high
  - role: complicates
    claim: Text-prompt-conditioned paralinguistic style control trained on synthetic or category-based captions
      can still underperform LLM-based systems on raw intelligibility and naturalness, even when it outperforms
      them on style controllability.
    source: §5.1, §7, Table 2
    evidence: ParaStyleTTS trails CosyVoice on both WER (15.29% vs. 10.30%) and MOS (I-MOS 4.65 vs. 4.75; N-MOS
      4.36 vs. 4.57) despite winning on all three paralinguistic-controllability metrics.
    claim_id: q4_2510_18308_text_prompt_conditioned_paralinguistic_style_control_trained_on_synthetic_or_category_based_captions
    confidence: high
    relevance: high
  - role: refines
    claim: Fine-grained per-class evaluation of paralinguistic attribute control (rather than aggregate accuracy
      alone) reveals that emotion classes with overlapping acoustic correlates, such as happiness and surprise,
      are systematically harder to disentangle than classes with more distinct acoustic signatures.
    source: §5.2, Figure 2
    evidence: t-SNE visualization of emotion embeddings shows clear cluster separation for sad, neutral, and angry,
      but noticeable overlap between happy and surprise, attributed to both sharing elevated pitch, faster speech
      rate, and high energy.
    claim_id: q4_2510_18308_fine_grained_per_class_evaluation_of_paralinguistic_attribute_control_rather_than_aggregate_accuracy
    confidence: high
    relevance: high
  limitations:
  - The training and evaluation corpus is limited to two languages (English, Chinese), 38 speakers, and only three
    paralinguistic style dimensions (emotion, age, gender); style-classifier evaluation is performed with the authors'
    own custom CLAP-based age/gender classifier rather than an independently validated benchmark. The authors acknowledge
    that ParaStyleTTS still trails CosyVoice on overall intelligibility and subjective naturalness, and note the
    model currently supports only three paralinguistic style categories, with extension to personality, tone, and
    energy left to future work *(§7)*. Robustness testing is limited to a single proxy attribute (gender) with ten
    hand-written phrasing variants; whether the robustness advantage generalizes to other attributes (emotion, age)
    or to open-ended, unconstrained prompts is not directly tested.
