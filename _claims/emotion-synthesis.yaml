      multilingual pretraining exposure of the underlying LLM backbone.
    source: §4.2, "Cross-Metric Consistency and Limitations"
    evidence: LLaMA-backbone models (VocalNet-1B, VocalNet-8B) show a slight MOS decline and near-zero IFR gain
      on the Language control dimension, while Qwen-backbone models (SLAM-Omni-0.5B, VocalNet-7B) show clear gains
      on the same dimension and dataset.
    confidence: high
    claim_id: q4_2510_22588_fine_grained_language_switching_control_transfers_unevenly_via_supervised_fine_tuning_de
    relevance: medium
  - role: supports
    claim: Fine-grained, style-annotated speech data constructed for dialogue training also generalizes to standalone
      controllable TTS fine-tuning.
    source: §4.4, Tables 6-7
    evidence: Repurposing five of UltraVoice's stylistic dimensions as instruction-speech pairs to fine-tune a pre-trained
      EmoVoice-0.5B checkpoint reduces in-domain WER from 19.82 to 3.97 while improving MOS and IFR across accent,
      speed, volume, emotion, and composite dimensions relative to the pre-trained baseline.
    confidence: high
    claim_id: q4_2510_22588_fine_grained_style_annotated_speech_data_constructed_for_dialogue_training_also_generali
    relevance: high
  - role: complicates
    claim: Reported "MOS" scores from automatic audio-language-model judges substitute for, rather than replicate,
      human perceptual evaluation, and should be interpreted as automated-judge scores rather than listening-test
      outcomes.
    source: §4.1, "Audio-Language Model (ALM) based Metric"
    evidence: Both MOS and instruction-following rate are generated by prompting Gemini-2.5-Flash as an automatic
