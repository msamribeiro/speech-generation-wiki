  claims:
  - claim_id: q4_2510_11124_perturbing_speaker_identifying_information_in_self_supervised_speech_rep
    role: supports
    claim: Perturbing speaker-identifying information in self-supervised speech representations during training
      improves disentanglement of speaker timbre from other speech attributes, measurable as higher speaker-similarity
      scores at inference when perturbation is used versus omitted.
    source: §4.2.2, Table 7
    evidence: Adding either formant-shift or SSL-based speaker-anonymization perturbation during vec2wav training
      raises SECS relative to the no-perturbation ablation across all four language/speaker test combinations (e.g.,
      0.662 vs. 0.627 for Chinese speech, Chinese speaker).
    confidence: high
    relevance: medium
  - claim_id: q4_2510_11124_stronger_speaker_identity_perturbation_for_disentanglement_purposes_trad
    role: complicates
    claim: Stronger speaker-identity perturbation for disentanglement purposes trades off against synthesized speech
      intelligibility.
    source: §4.2.2, Tables 6-7
    evidence: SSL-based speaker anonymization produces a larger drop in speaker-embedding similarity of the perturbed
      audio itself (SECS 0.354 vs. 0.514 for formant shift) but a far worse character error rate on that same perturbed
      audio (20.57% vs. 9.07% CER), and this intelligibility gap persists in the full synthesized output (12.24%
      vs. 7.13% CER in one test condition).
    confidence: high
    relevance: medium
  - claim_id: q4_2510_11124_in_cross_lingual_emotional_speech_synthesis_emotion_similarity_and_speak
    role: complicates
    claim: In cross-lingual emotional speech synthesis, emotion similarity and speaker similarity behave as competing
      objectives rather than independent ones.
    source: §4.2.3, Table 8
    evidence: Component ablations (removing SCL, SEALN, or the pretrained emotion representation) show that gains
      in speaker-similarity metrics (DMOS) are accompanied by losses in emotion-similarity metrics (EMOS) and vice
      versa across the tested configurations.
    confidence: high
    relevance: high
  - claim_id: q4_2510_11124_combining_explicit_acoustic_features_pitch_energy_duration_with_pretrain
    role: supports
    claim: Combining explicit acoustic features (pitch, energy, duration) with pretrained latent SSL representations
      improves voice-cloning quality beyond using latent representations alone.
    source: §5, §4.1
    evidence: The authors report that pretrained high-dimensional latent features from speaker or emotion encoders
      cannot fully substitute for explicit acoustic feature modeling, and that incorporating explicit pitch/energy/duration
      prediction alongside the SSL-based txt2vec pipeline improves voice-cloning performance relative to their ZMM-TTS
      predecessor, which lacks this explicit modeling.
    confidence: medium
    relevance: medium
  limitations:
  - The bilingual ESD-only evaluation does not compare against current large-scale codec or flow-matching cloning
    systems and leaves the emotion-identity trade-off unresolved.
  caveats:
  - Cross-lingual emotion and identity remain competing objectives on a bilingual acted-emotion corpus.
- id: '2510.13293'
