  claims:
  - claim_id: standard_tts_pipeline_intelligible_for_lowresource_tonal_script
    role: supports
    claim: "Standard neural TTS pipelines (acoustic model + neural vocoder) can produce intelligible speech for previously unsupported tonal scripts with as little as 40 minutes of single-speaker training data."
    source: "§5.3.5, §5.4"
    evidence: "The Tacotron 2 + HiFi-GAN pipeline, trained from scratch on 818 utterances (~40 minutes) of Meitei Mayek speech, achieves naturalness MOS 3.34, pronunciation accuracy MOS 3.51, and overall MOS 3.43, with evaluators reporting intelligible output in most cases."
    confidence: medium
    relevance: low
  - claim_id: missing_tone_modeling_degrades_prosody_in_tonal_languages
    role: complicates
    claim: "The absence of explicit tone modelling in a Tacotron 2 pipeline leads to degraded prosody on complex utterances in tonal languages, even when the training corpus is small."
    source: "§2.1, §5.4"
    evidence: "Manipuri's tonal contrast (falling vs. level tone) is not explicitly modelled; the tone diacritic is treated as another character in the phoneme table, and evaluators reported degraded rhythm specifically on long, syntactically complex sentences."
    confidence: low
    relevance: low
  - claim_id: novel_script_phoneme_mapping_necessary_prerequisite
    role: supports
    claim: "Developing a phoneme mapping between a novel script and an established phoneme set (such as ARPAbet) is a necessary and non-trivial prerequisite before standard TTS toolkits can be applied to indigenous writing systems."
    source: "§3.1.4, §6.2"
    evidence: "The paper constructs a manual lookup table mapping each of the 55 unique Meitei Mayek characters to its closest ARPAbet equivalent, a prerequisite step without which the standard Tacotron 2 phoneme pipeline could not be applied to this script."
    confidence: medium
    relevance: low
  limitations:
  - "The system is trained on a single speaker with only 40 minutes of audio, and no comparison to any baseline is possible; MOS scores are self-contained and cannot be situated relative to other low-resource systems."
  caveats:
  - "No prior TTS system exists for Meitei Mayek, so all reported MOS values (naturalness 3.34, pronunciation accuracy 3.51, overall 3.43) are self-assessed absolute scores rather than comparative results, limiting their value as evaluation-metrics evidence beyond establishing an existence proof."
- id: "2508.06890"
  entry_date: "2026-07-21"
  year: 2025
  venue: ASRU
  task:
  - VC
  architecture:
  - GAN
  - transformer-enc-dec
  relevance: low
  evidence_role:
  - evaluation_caution
  current_role: minor
  method_family: []
  claims:
  - claim_id: maestro_evc_frame_level_emotion_improves_transfer
    role: supports
    claim: "Frame-level emotion representations improve speaker emotion classification accuracy and prosody transfer fidelity over utterance-level representations in voice conversion."
    source: "§IV.C, Table I"
    evidence: "Maestro-EVC's frame-level emotion diarization approach outperforms utterance-level embedding baselines (StyleVC, ZEST) on SCA and prosody similarity, with the temporal emotion representation ablation reducing SCA by over 16 percentage points when removed."
    confidence: medium
    relevance: low
  - claim_id: maestro_evc_grl_reduces_phonetic_leakage
    role: supports
    claim: "Adversarial disentanglement via gradient reversal layers reduces phonetic leakage into emotion embeddings, improving intelligibility under cross-linguistic-content conversion."
    source: "§IV.C, Table I"
    evidence: "Removing the content gradient-reversal layer causes the largest degradation in the ablation, raising WER from 11.78% to 20.98%."
    confidence: medium
    relevance: low
  - claim_id: maestro_evc_explicit_prosody_conditioning
    role: supports
    claim: "Explicit conditioning on extracted prosodic features (F0 and energy) from an emotion reference transfers temporal dynamics more faithfully than implicit prediction from latent codes."
    source: "§IV.A, Table I"
    evidence: "Maestro-EVC's explicit F0/energy conditioning achieves the largest MOS gap over baselines in prosody similarity (4.15 vs. 2.86 for ZEST)."
    confidence: medium
    relevance: low
  - claim_id: maestro_evc_prosody_augmentation_robustness
    role: supports
    claim: "Training-time prosody augmentation through temporal shifting and warping improves robustness of prosody transfer under mismatched reference conditions without sacrificing naturalness."
    source: "§IV.C, Table I"
    evidence: "Removing prosody augmentation raises WER from 11.78% to 17.56% in the ablation study, while its inclusion sustains high naturalness MOS (4.06)."
    confidence: medium
    relevance: low
  limitations:
  - "Speaker classification accuracy (SCA) is reported as a zero-shot metric for the seen-speaker scenario but becomes undefined for unseen speakers, leaving a gap in the zero-shot evaluation suite."
  caveats:
  - "Evaluation relies on a small, parallel corpus (ESD: 350 utterances, 10 speakers, 5 emotions) with both objective metrics and a 25-participant subjective MOS study; the paper does not test whether the same metric suite would generalize to spontaneous or multilingual emotional speech."
- id: "2508.07273"
  entry_date: "2026-07-21"
  year: 2025
  venue: arXiv
  task:
  - SCA
  architecture:
  - transformer-enc-dec
  relevance: medium
  evidence_role:
  - core_evidence
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: contextual_paralinguistic_qa_data_outperforms_isolated_templates
    role: supports
    claim: "Training Speech-LLMs on data that jointly encodes contextual and paralinguistic reasoning substantially outperforms training on isolated paralinguistic QA templates, even when the underlying speech encoder is frozen."
    source: "§V.B.1, Table III"
    evidence: "Adding CPQA training data raises the human-annotated CPQA score from 41.0 (baseline) to 56.75, a 38.41% relative improvement, with the frozen Whisper encoder and Gemma2 decoder unchanged."
    confidence: high
    relevance: low
  - claim_id: dimensional_emotion_annotations_diversify_qa_supervision
    role: supports
    claim: "Incorporating dimensional emotion annotations (valence, arousal, dominance) alongside categorical labels into LLM-generated QA data diversifies training supervision and improves generalisation to complex emotional states."
    source: "§II.D, §V.B.1"
    evidence: "The CPQA generation pipeline explicitly prompts GPT-4o with both categorical (Emotion2Vec) and dimensional emotion scores, and CPQA-trained models show the largest gains on contextual+emotion question types (37.56 to 53.86)."
    confidence: medium
    relevance: low
  - claim_id: explicit_emotion_metadata_partially_compensates
    role: supports
    claim: "Explicitly injecting emotion metadata into inference prompts can partially compensate for a model's limited intrinsic paralinguistic understanding, but training on contextual-paralinguistic data yields more robust generalisation across question types."
    source: "§V.B.3, Fig. 2"
    evidence: "Injecting explicit emotion metadata at inference (S32) raises the human-annotated CPQA score further to 59.87, a 46.02% gain, but the paper notes this technique alone does not match CPQA training's broader gains across all question types."
    confidence: medium
    relevance: low
  - claim_id: llm_judge_scores_correlate_with_classification_metrics
    role: supports
    claim: "LLM judge scores for open-ended speech-language model evaluation correlate reliably with classification-based accuracy and F1 metrics on questions with deterministic answers, supporting their use as a proxy metric."
    source: "§IV, §V.B.4, Table V"
    evidence: "The paper validates GPT-4o judge scores against estimated weighted accuracy and F1 derived via embedding-based label extraction, showing the ratio of correct to incorrect predictions rises monotonically with judge score."
    confidence: medium
    relevance: high
  limitations:
  - "Emotion labels used both in training and inference prompts come from SER models rather than ground-truth annotations, introducing noise that may suppress performance on direct classification tasks."
  - "The LLM-generated CPQA evaluation set contains evaluation confounds: direct emotion questions can benefit disproportionately from explicit metadata injection, which the authors flag but do not resolve."
  caveats:
  - "The LLM-judge validation methodology, converting open-ended answers to classification labels via keyword/embedding matching to compute accuracy and F1, is a practical contribution to evaluation methodology for open-ended speech-LLM assessment, though it is validated only within the paper's own CPQA and emotion-PQA benchmarks."
- id: "2508.07375"
  entry_date: "2026-07-21"
  year: 2025
  venue: arXiv
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: turn_level_text_aggregation_stronger_guidance
    role: supports
    claim: "Aggregating text tokens at the dialogue-turn level provides stronger semantic guidance for full-duplex speech generation than word-level token-by-token text insertion."
    source: "§2.2, §4.2.1, Table 2"
    evidence: "TurnGuide's turn-level interleaving achieves a GPT-score of 7.27 versus 5.91 for the Speech Chunk Interleaving (word/token-level) baseline on the Fisher test set."
    confidence: high
    relevance: low
  - claim_id: text_insertion_timing_more_sensitive_than_length
    role: supports
    claim: "The timing of text insertion into full-duplex dialogue sequences is more sensitive to error than the length of inserted text, with mistimed insertions causing larger semantic degradation than incorrectly sized text chunks."
    source: "§4.2.3, Table 4"
    evidence: "Shifting text insertion 4 seconds early causes the largest degradation (GPT-score 5.61 vs. 6.76 at nominal timing), a bigger effect than the chunk-length ablations."
    confidence: medium
    relevance: low
  - claim_id: text_loss_weighting_improves_semantic_quality
    role: supports
    claim: "Increasing the training loss weight of text tokens relative to speech tokens in a text-speech interleaved model improves semantic quality without sacrificing turn-taking naturalness."
    source: "§4.2.1, Table 2"
    evidence: "The 2:1 and 3:1 text-loss variants reach GPT-scores of 7.70 and 7.79 respectively, exceeding the 1:1 loss upper bound (7.39) obtained with ground-truth transcripts."
    confidence: medium
    relevance: low
  - claim_id: finegrained_turntaking_benchmarks_more_informative
    role: supports
    claim: "Fine-grained turn-taking benchmarks are more informative than corpus-level statistical correlations for evaluating full-duplex spoken dialogue models."
    source: "§4.2.2"
    evidence: "On Full-Duplex-Bench, TurnGuide's behavioural differences from Moshi and dGSLM on backchanneling and interruption latency are visible in the fine-grained metrics even though the corpus-level Pearson correlation analysis (Table 7) shows parity with baselines."
    confidence: medium
    relevance: high
  - claim_id: gpt_based_semantic_eval_aligns_with_human_pref_above_threshold
    role: complicates
    claim: "GPT-based automated semantic evaluation of spoken dialogue aligns closely with human preference judgements when score differences exceed one point, but reliability degrades for near-tied comparisons."
    source: "Appendix A, Table 5"
    evidence: "The paper's validation of GPT-score against a 25/30 pairwise human comparison shows agreement holds for larger score gaps but weakens for close comparisons, and the paper separately flags a circularity risk since GPT-4o is used as both semantic evaluator and implicit oracle."
    confidence: medium
    relevance: high
  limitations:
  - "The evaluation uses GPT-4o as both the semantic evaluator and implicitly as an oracle for dialogue quality, introducing a potential circularity if the trained model's outputs are biased toward patterns GPT-4o scores favourably."
  caveats:
  - "The corpus-level Pearson correlation analysis (Table 7) shows TurnGuide is at parity with baselines on turn-taking statistics but does not establish whether the GPT-score improvement translates to user preference in live interaction, illustrating a gap between automated proxy metrics and behavioural benchmarks."
- id: "2508.07426"
  entry_date: "2026-07-21"
  year: 2025
  venue: ASRU
  task:
  - TTS
  architecture:
  - transformer-enc-dec
  - GAN
  - VAE
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: accent_label_quality_matters_more_than_volume
    role: supports
    claim: "Accent label quality exerts a larger effect on accent synthesis fidelity than raw data volume, and filtering noisy self-reported labels consistently outperforms using them directly."
    source: "§V-C, Table VI"
    evidence: "The geolocation-filtered system achieves DCF 0.571 averaged across accents versus 0.735 for the unfiltered self-reported-label system."
    confidence: medium
    relevance: low
  - claim_id: vc_timbre_augmentation_aids_disentanglement
    role: supports
    claim: "Speaker-accent disentanglement in low-resource settings benefits from voice conversion-based timbre augmentation, even when the augmented data introduces acoustic degradation."
    source: "§V-D, Table VIII"
    evidence: "kNN-VC timbre augmentation improves objective accent similarity even though it introduces mixed effects in human evaluation for some accents."
    confidence: medium
    relevance: low
  - claim_id: automatic_and_human_accent_evaluation_diverge
    role: complicates
    claim: "Automatic accent identification metrics and human perceptual evaluations of accent plausibility frequently diverge, limiting the reliability of either metric alone as a benchmark."
    source: "§V-B, §V-E"
    evidence: "CosyVoice2 ranks highest across all four human-evaluated accents, including above real utterances for the US accent, despite not leading on the objective DCF metric for several accents."
    confidence: medium
    relevance: high
  - claim_id: large_zeroshot_tts_competitive_via_style_copying
    role: supports
    claim: "Large zero-shot TTS systems can produce competitive accented speech through style copying without explicit accent conditioning, often matching or exceeding dedicated accent-controllable models on naturalness."
    source: "§V-B, Table VII"
    evidence: "CosyVoice2, using zero-shot style copying rather than dedicated accent conditioning, achieves the best human evaluation scores across all four tested accents."
    confidence: medium
    relevance: low
  - claim_id: geolocation_label_discovery_extensible_but_variable_precision
    role: refines
    claim: "Geolocation-based accent label discovery is extensible to languages and accent varieties without existing labeled speech, but precision varies substantially across accent regions depending on broadcast training data coverage."
    source: "§III-A, Table III"
    evidence: "Precision for the geolocation-based unlabeled discovery method ranges from 20.4% (Ireland) and 9.4% (Scotland) to much higher values for other regions, reflecting uneven broadcast-corpus coverage."
    confidence: medium
    relevance: low
  limitations:
  - "Human evaluation is expensive and was conducted for only 4 of the 11+ accents included in training, leaving uncertain whether objective metric rankings carry over to human preference for the remaining accents."
  caveats:
  - "The paper uses two objective accent-similarity metrics (raw cosine similarity and a DCF/Gaussian-backend aggregate) specifically because a single metric was found insufficiently robust to speaker and content confounds, illustrating a broader accent-evaluation methodology gap."
- id: "2508.07711"
  entry_date: "2026-07-21"
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - GAN
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: gan_not_necessary_with_explicit_phase_prediction
    role: supports
    claim: "Adversarial training is not necessary for high-quality mel-spectrogram vocoders that explicitly predict the phase spectrum; frequency-weighted phase supervision can substitute for discriminator-provided phase signal."
    source: "§IV.A, Table I"
    evidence: "FreeGAN achieves MOS 4.12 versus BigVGAN's 4.14 (p=0.61) and APNet2's 4.13 (p=0.76) with no discriminator and a frequency-weighted anti-wrapping phase loss in its place."
    confidence: high
    relevance: low
  - claim_id: gan_necessity_contingent_on_explicit_phase_prediction
    role: refines
    claim: "The necessity of GAN in neural vocoders is contingent on the presence of explicit phase prediction: removing adversarial training without explicit phase modelling results in a quality gap that targeted improvements do not fully close."
    source: "§IV.B, Table III"
    evidence: "For systems without explicit phase prediction (HiFi-GAN, iSTFTNet, Vocos), removing GAN causes a noticeable quality drop that the proposed strategies only partially recover, while explicit-phase systems (APNet2, FreeV) show no significant drop."
    confidence: high
    relevance: low
  - claim_id: gan_elimination_reduces_cost_without_quality_loss
    role: supports
    claim: "Eliminating GAN discriminators from vocoder training substantially reduces wall-clock training time and storage requirements with no measurable subjective quality cost for explicit-phase architectures."
    source: "§IV.A, Table I"
    evidence: "FreeGAN trains in 191 seconds per epoch versus 1937 for BigVGAN, and eliminates the 70.7M discriminator parameters used by HiFi-GAN, while matching MOS."
    confidence: medium
    relevance: low
  - claim_id: utmos_and_mos_can_disagree
    role: complicates
    claim: "Automatic MOS predictors (UTMOS) and subjective MOS scores can rank vocoder systems differently, making UTMOS an unreliable sole proxy for naturalness evaluation."
    source: "§IV.A, Table I"
    evidence: "BigVGAN scores higher UTMOS (3.97) than FreeGAN (3.92) despite the two being statistically indistinguishable on subjective MOS (4.14 vs. 4.12, p=0.61)."
    confidence: high
    relevance: high
  limitations:
  - "All experiments use VCTK at 16 kHz, a constrained multi-speaker English setup; generalisation of the vocoder-quality findings to 24/44.1 kHz targets or non-English speakers is untested."
  caveats:
  - "The paper explicitly notes that UTMOS and subjective MOS rankings do not always agree across baselines on this corpus, directly cautioning against relying on a single automatic predictor for vocoder naturalness comparisons."
- id: "2508.08715"
  entry_date: "2026-07-21"
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  - flow-matching
  - GAN
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: llm_tts_with_speaker_conditioning_outperforms_conventional_on_mos
    role: supports
    claim: "LLM-based TTS architectures, when fine-tuned with appropriate speaker conditioning, substantially outperform conventional non-autoregressive models on low-resource language naturalness as measured by subjective MOS."
    source: "§4.2"
    evidence: "MultiGen (CosyVoice-based) improves Tamil naturalness MOS from 2.19 (VITS) to 3.72 and Malay from 2.46 to 3.63."
    confidence: medium
    relevance: low
  - claim_id: child_vocal_characteristics_via_xvector_conditioning
    role: supports
    claim: "Child-specific vocal characteristics can be transferred to multilingual TTS through x-vector speaker conditioning without architectural modifications to the base model."
    source: "§2.2, §3.2"
    evidence: "MultiGen incorporates x-vector embeddings from children's speech in each target language as speaker representations without modifying CosyVoice's architecture."
    confidence: medium
    relevance: low
  - claim_id: foundation_models_adapt_to_lowresource_with_limited_data
    role: supports
    claim: "Foundation TTS models originally trained on high-resource languages can be adapted to low-resource language targets with limited domain data while retaining high intelligibility."
    source: "§3.1, §4.3, Table 1"
    evidence: "The Singaporean-accented Mandarin model is fine-tuned on only 1,400 utterances from a single child speaker yet achieves CER of 4.00% versus 10.70% for the non-fine-tuned CosyBase."
    confidence: medium
    relevance: low
  - claim_id: cer_more_consistent_than_mos_in_lowresource_settings
    role: complicates
    claim: "Intelligibility gains from modern TTS architectures in low-resource settings are more consistently captured by ASR-based CER than by subjective listener ratings, particularly when native annotators are limited."
    source: "§4.3, Table 1"
    evidence: "The paper's own evaluation uses only 30 samples per language rated by 10 listeners each, and notes that CER improvements (e.g. 9.60% to 2.10% for Tamil) are large and consistent while MOS comparisons are not cross-language comparable and lack significance testing."
    confidence: low
    relevance: high
  limitations:
  - "Evaluation uses only 30 speech samples per language rated by 10 listeners each; no significance testing distinguishes genuine quality gaps from listener variability."
  caveats:
  - "MOS scores are explicitly noted as not cross-language comparable in this study, since baselines differ by language (VITS for Malay/Tamil, CosyBase for Mandarin), limiting the value of raw MOS comparison across the three reported languages."
- id: "2508.08957"
  entry_date: "2026-07-21"
  year: 2025
  venue: ASRU
  task:
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - core_evidence
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: pairwise_ranking_objectives_improve_mos_prediction
    role: supports
    claim: "Incorporating pairwise ranking objectives into MOS prediction training improves system-level ranking consistency with human judgments beyond what standard regression losses achieve."
    source: "§II.A, Table I"
    evidence: "QAMRO achieves SRCC of 0.972 (musical impression) and 0.916 (textual alignment) on MusicEval, compared to 0.845 and 0.779 for the same-backbone regression-only baseline."
    confidence: high
    relevance: high
  - claim_id: adaptive_margins_outperform_fixed_margin_ranking
    role: supports
    claim: "Adaptive margins that scale with perceptual score gaps outperform fixed-margin ranking losses for audio quality assessment."
    source: "§II.A, Table I — w/o Adaptive Margin ablation"
    evidence: "The ablation removing the adaptive margin component shows a measurable drop in SRCC relative to the full QAMRO objective."
    confidence: high
    relevance: high
  - claim_id: quality_aware_weighting_consistently_beneficial
    role: supports
    claim: "Quality-aware upweighting of high-scoring sample pairs is a consistently beneficial component in automatic perceptual quality evaluation."
    source: "§IV.A, §IV.B"
    evidence: "Ablations on both the MusicEval/CLAP backbone and the AES-Natural/Audiobox-Aesthetics backbone show removing quality-aware weighting degrades SRCC on both."
    confidence: high
    relevance: high
  - claim_id: training_objective_change_improves_pretrained_backbone_evaluators
    role: supports
    claim: "Automatic MOS predictors built on pre-trained audio-text representations can be meaningfully improved by training objective changes without modifying the backbone architecture."
    source: "§II.B, Table II"
    evidence: "QAMRO improves SRCC over the Audiobox-Aesthetics baseline across all four AES-Natural dimensions (e.g. content usefulness improves by 0.052 SRCC) using the same pretrained backbone."
    confidence: high
    relevance: high
  limitations:
  - "All training and evaluation is conducted on the AudioMOS Challenge 2025 closed-set data only; generalisation to unseen TTS or VC systems outside this distribution is untested."
  caveats:
  - "The paper evaluates only system-level SRCC, which averages predictions over all clips per system; utterance-level accuracy and failure modes for individual clips are not examined, and the pairwise ranking strategy's quadratic batch-size scaling is untested beyond a fixed batch size of 256."
- id: "2504.12867"
  entry_date: "2026-07-21"
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  - flow-matching
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: freeform_emotion_descriptions_richer_but_costlier
    role: supports
    claim: "Fine-grained natural language emotion descriptions provide richer control over expressive speech synthesis than coarse categorical labels, at the cost of requiring emotion-specific training data."
    source: "§2.1, §6.1"
    evidence: "EmoVoice conditions on freestyle natural language emotion prompts rather than categorical labels, requiring the purpose-built EmoVoice-DB (40h) and LAION Got Talent (200h) fine-tuning corpora."
    confidence: medium
    relevance: low
  - claim_id: parallel_phoneme_prediction_reduces_intelligibility_errors
    role: supports
    claim: "Parallel phoneme token prediction as a secondary output head reduces intelligibility errors in LLM-based TTS, particularly on challenging inputs such as rare words and tongue twisters."
    source: "§6.2.1, §6.2.2, Table 5, Table 6"
    evidence: "The phoneme-boost variant (EmoVoice-PP) reduces WER on a hard-case test set with tongue twisters and technical terms from 18.07 to 11.68 relative to the base model."
    confidence: high
    relevance: low
  - claim_id: llm_pretraining_benefits_emotional_tts
    role: supports
    claim: "LLM pretraining initialisation meaningfully benefits emotion-controllable TTS: models without it show substantially higher word error rates and weaker emotion transfer."
    source: "§6.2.4, Table 8"
    evidence: "Removing pretrained Qwen2.5 weights raises WER from 2.73 to 6.16 for the base model in the ablation study."
    confidence: high
    relevance: low
  - claim_id: emotion_similarity_metrics_weak_at_utterance_level
    role: complicates
    claim: "Automatic emotion similarity metrics (e.g. emotion2vec cosine similarity) correlate reasonably at the system level but poorly at the utterance level with human perceptual judgments, limiting their utility for fine-grained model comparison."
    source: "§7, Table 10"
    evidence: "The paper's evaluation analysis in Section 7 finds only roughly 40% Spearman correlation between sentence-level emotion similarity and human MOS."
    confidence: medium
    relevance: high
  - claim_id: multimodal_llms_not_yet_reliable_emotion_judges
    role: complicates
    claim: "Multimodal LLMs are not yet reliable judges of emotional speech quality, exhibiting both low correlation with human ratings and inter-run instability."
    source: "§7, Table 10"
    evidence: "GPT-4o and Gemini, tested as emotion evaluators, show low correlation with human MOS and inter-run instability in the paper's evaluation analysis."
    confidence: medium
    relevance: high
  limitations:
  - "The English model is trained and evaluated entirely on synthetic data generated by GPT-4o-audio, creating circularity between the evaluation oracle and the training distribution."
  - "The emotion recall evaluation omits three of seven emotion categories (disgusted, fearful, surprised) due to low recognition accuracy from emotion2vec, limiting the scope of the emotional-expressiveness evaluation."
  caveats:
  - "The paper's most durable contribution to evaluation-metrics may be its negative finding: neither automatic emotion similarity metrics nor multimodal LLM judges reliably track human perception of emotional speech at the sentence level."
- id: "2508.09600"
