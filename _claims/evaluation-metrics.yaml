- id: "2506.09874"
  entry_date: "2026-07-20"
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - flow-matching
  relevance: low
  evidence_role:
  - core_evidence
  current_role: minor
  method_family: []
  claims:
  - claim_id: joint_generation_beats_post_hoc_mixing
    role: supports
    claim: "Joint generative modelling of speech and environmental audio produces more naturally
      integrated output than post-hoc mixing of separately generated speech with background
      sounds."
    source: "§4.2"
    evidence: "A/B tests with 20+ raters per sample showed 87.89% preference for UmbraTTS over
      F5-TTS plus post-hoc background mixing across 30 AudioSet samples."
    confidence: high
    relevance: low
  - claim_id: self_supervised_extraction_sufficient_for_environmental_tts
    role: supports
    claim: "Self-supervised extraction of speech and background audio from unlabeled mixed
      recordings is sufficient to train environmentally conditioned TTS to state-of-the-art
      performance."
    source: "§3, §4.1, Table 1"
    evidence: "UmbraTTS uses VAD-based silence extraction and learned source separation applied to
      AudioSet to construct training triplets without manual annotation, achieving best WER and
      FAD among all baselines on AudioCaps."
    confidence: medium
    relevance: low
  - claim_id: flow_matching_beats_diffusion_for_environmental_tts
    role: supports
    claim: "Flow matching outperforms diffusion-based architectures in environmentally aware speech
      synthesis on both automatic and human evaluation metrics."
    source: "§4.1, §4.2, Tables 1-3"
    evidence: "UmbraTTS (CFM-based) achieves WER 6.89% and FAD 4.14 versus VoiceDiT (diffusion,
      7.09%, 4.60) and VoiceLDM (diffusion, 10.39%, 5.56) on AudioCaps, with 78.54-81.91% human
      preference over VoiceLDM."
    confidence: medium
    relevance: low
  - claim_id: explicit_ser_control_needed_for_background_balance
    role: complicates
    claim: "Controlling speech-to-environment balance in jointly generated audio scenes requires an
      explicit scalar conditioning parameter; standard text and speaker conditioning are
      insufficient for this degree of output control."
    source: "§3, §4.2"
    evidence: "UmbraTTS introduces a dedicated SER signal injected via adaLN-zero; a separate
      controlled listening test confirms 96.6% of participants correctly distinguish the intended
      background volume direction in pairwise comparisons."
    confidence: medium
    relevance: low
  limitations:
  - "The evaluation protocol is borrowed from VoiceLDM and covers only the AudioCaps and MusicCaps
    test subsets, so generalisation to other environmental conditions is untested."
  caveats:
  - "Evaluation combines FAD, KL divergence, CLAP score, and WER alongside A/B human preference
    tests, providing a multi-dimensional protocol for jointly generated speech-plus-environment
    audio, though the paper does not itself propose new metrics."

- id: "2507.07799"
  entry_date: "2026-07-20"
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: instruction_tts_enables_anonymization_without_source_audio
    role: supports
    claim: "Instruction-conditioned TTS enables speaker anonymization without relying on source
      speaker audio or speaker embeddings."
    source: "§3.3, §3.4.1, Table 1"
    evidence: "Parler-TTS with natural language speaker descriptions achieves FAR=0% on
      SLUE-VoxPopuli, matching zero-shot TTS baselines (VALL-E, XTTS-v2) that require reference
      audio."
    confidence: high
    relevance: low
  - claim_id: far_unreliable_under_disjoint_speaker_evaluation_design
    role: complicates
    claim: "False acceptance rate is an unreliable discriminator of speaker anonymization quality
      when evaluation design guarantees disjoint training and test speakers."
    source: "§3.4.1"
    evidence: "FAR=0% is achieved by every TTS-based system regardless of architecture or
      conditioning, because TTS models are trained on speakers absent from the evaluation set; the
      metric cannot distinguish the proposed method from any TTS-based pipeline in this setting."
    confidence: high
    relevance: high
  - claim_id: asr_ner_pipeline_content_privacy_limited_by_errors
    role: complicates
    claim: "ASR + NER pipeline-based content privacy is limited by recognition and detection errors
      that allow a meaningful share of sensitive content to pass through."
    source: "§3.4.1, §4"
    evidence: "The ASR component achieves 19.00% WER on original speech and DeBERTa-L NER achieves
      only 71.80% F1 on predicted transcriptions, meaning many named entities are missed at the
      detection stage."
    confidence: medium
    relevance: low
  - claim_id: prompt_based_tts_variability_limits_identity_consistency
    role: complicates
    claim: "Generative variability in prompt-based TTS limits consistent voice identity
      reproduction across utterances sharing the same speaker description."
    source: "§4"
    evidence: "Parler-TTS outputs may sound like different persons across generations even with an
      identical speaker description, undermining multi-utterance anonymization coherence."
    confidence: low
    relevance: low
  - claim_id: speaker_attribute_choice_affects_intelligibility
    role: supports
    claim: "Speaker attribute choice in instruction-conditioned TTS introduces measurable variation
      in downstream speech intelligibility that practitioners must account for."
    source: "§3.4.2, Tables 2 and 3"
    evidence: "WER varies from 12.07% (Slovak accent) to 23.76% (Italian accent) across 38 accent
      descriptions, and from 12.39% (normal rate) to 18.56% (very fast) across speaking rate
      settings, while speaker privacy (FAR=0%) remains constant."
    confidence: medium
    relevance: medium
  limitations:
  - "FAR=0% is observed for all TTS-based systems including both baselines, because the evaluation
    speakers are disjoint from TTS training speakers; the privacy metric cannot distinguish the
    proposed approach from any TTS pipeline in this experimental design."
  caveats:
  - "The paper's most durable contribution to evaluation-metrics is the demonstration that FAR, a
    standard speaker-anonymization privacy metric, is structurally unable to discriminate between
    methods whenever evaluation speakers are disjoint from TTS training speakers, a design flaw
    that could affect other anonymization evaluations using the same protocol."

- id: "2507.08319"
  entry_date: "2026-07-20"
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - transformer-enc-dec
  relevance: low
  evidence_role:
  - core_evidence
  current_role: minor
  method_family: []
  claims:
  - claim_id: active_learning_more_data_efficient_than_static_selection
    role: supports
    claim: "Active learning with model-informed informativeness criteria produces more
      data-efficient TTS corpora than model-agnostic static data selection at equal corpus size."
    source: "§III.B, Table I"
    evidence: "The proposed method achieves 71.0% synthesizable speaker ratio at 3,943 utterances
      versus 66.6% for the static baseline of the same size, measured by pseudo-MOS exceedance
      rate."
    confidence: high
    relevance: low
  - claim_id: informativeness_criterion_trades_off_top_quality_speakers
    role: complicates
    claim: "Data selection methods that optimize synthesizable speaker coverage may reduce
      synthesis quality for speakers already near the quality threshold."
    source: "§III.B, Figure 3"
    evidence: "The proposed method underperforms the static baseline for speakers with pseudo-MOS
      above 2.6, because the informativeness criterion explicitly excludes speakers the current
      model can already synthesize well."
    confidence: medium
    relevance: medium
  - claim_id: quality_estimator_effective_on_small_training_fraction
    role: supports
    claim: "TTS corpus quality estimators remain effective when trained on a small fraction of
      candidate data rather than requiring full candidate set pre-processing."
    source: "§III.B, Figure 7"
    evidence: "The data quality estimator trained on 10% of the YouTube candidate pool shows a
      strong correlation with the estimator trained on 100% of the data, with no significant change
      in selection behavior."
    confidence: medium
    relevance: medium
  - claim_id: diffusion_better_captures_speaker_embedding_distributions
    role: supports
    claim: "Diffusion models better capture complex speaker embedding distributions than Gaussian
      mixture models for speaker generation tasks with limited training samples."
    source: "§III.B, Figure 5"
    evidence: "The diffusion model achieves Wasserstein distance to held-out test speakers that is
      more than twice the standard deviation lower than GMMs across all cluster sizes (M=1..10)."
    confidence: medium
    relevance: low
  limitations:
  - "The evaluation uses pseudo-MOS (an automatic quality predictor) rather than subjective
    listening tests, so the absolute synthesis quality of the final corpora is not independently
    verified."
  caveats:
  - "Pseudo-MOS quality prediction is used as the sole selection and evaluation criterion
    throughout the pipeline; its role here is as a practical automated stand-in for human MOS
    rather than a methodological contribution to evaluation-metrics itself."
