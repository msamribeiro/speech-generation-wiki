  - claim_id: supervised_binaural_models_degrade_ood
    role: supports
    claim: "Supervised mono-to-binaural synthesis models trained on small room-specific datasets degrade significantly under out-of-distribution acoustic conditions, including different rooms and languages."
    source: "§4.5, Table 2"
    evidence: "On the out-of-distribution TUT Mono-to-Binaural dataset (different rooms, French speakers), supervised baselines WarpNet and BinauralGrad drop to MOS 3.60 and 3.27 respectively, with BinauralGrad producing Gaussian noise artifacts on OOD samples."
    confidence: high
    relevance: medium
  - claim_id: gtw_and_as_both_necessary_for_zeroshot_binaural
    role: supports
    claim: "Geometric interaural time delay warping and amplitude scaling based on the inverse-square law are both necessary components for zero-shot binaural synthesis; removing either one substantially degrades perceptual quality."
    source: "§5, Table 3"
