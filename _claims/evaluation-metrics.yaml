  claims:
  - claim_id: acoustic_only_realtime_turntaking_inference_feasible
    role: supports
    claim: "Purely acoustic, real-time turn-taking inference is feasible without relying on ASR or linguistic features."
    source: "§5.3, Figure 6"
    evidence: "TRPDformer achieves AUC = 0.83 on CEJC using only CPC audio representations and a causal transformer, outperforming a VAD baseline with no transcription step."
    confidence: high
    relevance: low
  - claim_id: vap_models_not_directly_transferable_to_trp_detection
    role: complicates
    claim: "Voice activity projection models are not directly transferable to transition relevance point detection, even though the tasks appear structurally similar."
    source: "§4.2"
    evidence: "Statistical analysis of CEJC shows that a theoretically perfect VAP model would achieve at most recall = 0.60 and precision = 0.71 on TRP detection, below TRPDformer's empirical performance, because speaker shift and TRP are not equivalent events."
    confidence: high
    relevance: medium
  - claim_id: learned_timing_models_perceived_more_natural_than_vad
    role: supports
    claim: "Learned acoustic response-timing models produce perceptibly more natural dialogue turn-taking than fixed-threshold silence detection."
    source: "§5.5, Figure 8"
    evidence: "In a preference test with 40 raters per stimulus pair, subjects preferred TRPDformer's response timing over the VAD baseline, including in cases where both models misdetected TRPs."
    confidence: medium
    relevance: medium
  - claim_id: framelevel_trp_models_may_not_generalize_across_languages
    role: complicates
    claim: "Frame-level TRP models trained on spontaneous conversation may not generalise across languages or domains, limiting their direct applicability in multilingual or task-oriented dialogue systems."
    source: "§6"
    evidence: "TRPDformer is trained and evaluated solely on CEJC (Japanese everyday conversation); the paper identifies cross-lingual and cross-domain robustness as open future directions."
    confidence: low
    relevance: low
  limitations:
  - "Evaluation is limited to a single language (Japanese) and a single corpus (CEJC); the paper does not report real-time processing latency or robustness to noise, both critical for deployment."
  caveats:
  - "The paper's evaluation-metrics contribution is a precision-recall/AUC framework for TRP detection combined with a human preference test methodology, providing a template for evaluating response-timing naturalness independent of downstream dialogue content quality."
- id: "2025.sigdial-1.27"
  entry_date: "2026-07-21"
