    source: "§3.2, §3.3, Tables 1-3"
    evidence: "DC-Spin 100,4096 achieves 78.47 sWUGGY and 61.35 sBLIMP versus NAST's 73.35/55.86 at the same unit count, and SpinHuBERT + DC-Spin + PR reduces resynthesis WER by roughly 23% relative to HuBERT + K-means 500."
    confidence: high
    relevance: low
  - claim_id: ngram_and_mi_better_proxies_than_abx
    role: complicates
    claim: "N-gram predictability and phoneme/character mutual information are stronger proxies for SLM downstream performance than the widely-used ABX error rate."
    source: "§3.5, Figure 3b"
    evidence: "The paper's proxy-task analysis shows ABX error rate negatively correlates with TSC and sBLIMP, whereas n-gram predictability, PNMI, and CNMI are consistently strong predictors of downstream SLM performance."
    confidence: medium
    relevance: high
  - claim_id: ssl_tokenizers_match_codecs_at_lower_bitrate
    role: supports
    claim: "SSL-based tokenizers can match or exceed neural codec tokenizers on speech intelligibility (WER) at substantially lower bitrates when the encoder is fine-tuned to suppress speaker variation."
    source: "§3.3, Table 3"
    evidence: "SpinHuBERT + DC-Spin + PR achieves 18.7% WER at 448 bps, surpassing EnCodec's 27.5% WER at 1.5k bps."
    confidence: medium
    relevance: low
  - claim_id: phoneme_recognition_sft_better_than_asr_for_resynthesis
    role: supports
    claim: "Supervised fine-tuning with phoneme recognition targets provides consistent gains over ASR targets for speech resynthesis intelligibility, suggesting phoneme alignment is more directly beneficial than word-level transcription for unit-based vocoders."
    source: "§3.3, Table 3"
    evidence: "Phoneme-recognition-based supervised fine-tuning consistently improves resynthesis WER over CTC-ASR-based fine-tuning across the reported configurations in Table 3."
    confidence: medium
    relevance: low
  - claim_id: scaling_slm_diminishing_returns_when_tokenizer_bottleneck
    role: refines
    claim: "Scaling SLM model size has diminishing returns on tasks that require sentence-level semantic coherence when the tokenizer quality is the primary bottleneck."
    source: "§3.2, Table 2"
    evidence: "A 150M-parameter SLM trained on 6k hours with SpinHuBERT + DC-Spin tokens exceeds the sBLIMP and sWUGGY scores of models using up to 13B parameters and 150k+ hours."
    confidence: medium
    relevance: low
  limitations:
  - "The unconstrained comparison against high-resource SLMs (e.g. SPIRIT LM, TWIST) pits a 150M/6k-hour system against 13B-parameter/150k+-hour systems; the framing as resource-efficient is accurate but the sizable TSC gap (70.7 vs. 82.9 for SPIRIT LM) is likely attributable to scale rather than tokenizer quality alone."
  caveats:
  - "The paper explicitly challenges reliance on ABX error rate as a proxy metric for SLM tokenizer quality, proposing n-gram predictability and mutual information measures as stronger alternatives, a direct contribution to evaluation methodology for discrete speech tokenizers."
