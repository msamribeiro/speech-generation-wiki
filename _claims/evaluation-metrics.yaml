    reproducibility of the long-form results is not currently possible."
  caveats:
  - "SpeechSSM introduces the LibriSpeech-Long benchmark and a time-stratified naturalness MOS plus
    LLM-as-judge side-by-side evaluation methodology specifically because it demonstrates existing
    spoken-LM metrics (sWUGGY, transcript perplexity, short-form MOS) are unreliable or saturating
    for long-form generation, a direct evaluation-metrics contribution."

- id: "2506.09874"
  entry_date: "2026-07-20"
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - flow-matching
  relevance: low
  evidence_role:
  - core_evidence
  current_role: minor
  method_family: []
  claims:
  - claim_id: joint_generation_beats_post_hoc_mixing
    role: supports
    claim: "Joint generative modelling of speech and environmental audio produces more naturally
      integrated output than post-hoc mixing of separately generated speech with background
      sounds."
    source: "§4.2"
    evidence: "A/B tests with 20+ raters per sample showed 87.89% preference for UmbraTTS over
      F5-TTS plus post-hoc background mixing across 30 AudioSet samples."
    confidence: high
    relevance: low
  - claim_id: self_supervised_extraction_sufficient_for_environmental_tts
    role: supports
    claim: "Self-supervised extraction of speech and background audio from unlabeled mixed
      recordings is sufficient to train environmentally conditioned TTS to state-of-the-art
      performance."
    source: "§3, §4.1, Table 1"
    evidence: "UmbraTTS uses VAD-based silence extraction and learned source separation applied to
      AudioSet to construct training triplets without manual annotation, achieving best WER and
      FAD among all baselines on AudioCaps."
    confidence: medium
    relevance: low
  - claim_id: flow_matching_beats_diffusion_for_environmental_tts
    role: supports
    claim: "Flow matching outperforms diffusion-based architectures in environmentally aware speech
      synthesis on both automatic and human evaluation metrics."
    source: "§4.1, §4.2, Tables 1-3"
    evidence: "UmbraTTS (CFM-based) achieves WER 6.89% and FAD 4.14 versus VoiceDiT (diffusion,
      7.09%, 4.60) and VoiceLDM (diffusion, 10.39%, 5.56) on AudioCaps, with 78.54-81.91% human
      preference over VoiceLDM."
    confidence: medium
    relevance: low
  - claim_id: explicit_ser_control_needed_for_background_balance
    role: complicates
    claim: "Controlling speech-to-environment balance in jointly generated audio scenes requires an
      explicit scalar conditioning parameter; standard text and speaker conditioning are
      insufficient for this degree of output control."
    source: "§3, §4.2"
    evidence: "UmbraTTS introduces a dedicated SER signal injected via adaLN-zero; a separate
      controlled listening test confirms 96.6% of participants correctly distinguish the intended
      background volume direction in pairwise comparisons."
    confidence: medium
    relevance: low
  limitations:
  - "The evaluation protocol is borrowed from VoiceLDM and covers only the AudioCaps and MusicCaps
    test subsets, so generalisation to other environmental conditions is untested."
  caveats:
  - "Evaluation combines FAD, KL divergence, CLAP score, and WER alongside A/B human preference
    tests, providing a multi-dimensional protocol for jointly generated speech-plus-environment
    audio, though the paper does not itself propose new metrics."

- id: "2507.07799"
  entry_date: "2026-07-20"
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: instruction_tts_enables_anonymization_without_source_audio
    role: supports
    claim: "Instruction-conditioned TTS enables speaker anonymization without relying on source
      speaker audio or speaker embeddings."
    source: "§3.3, §3.4.1, Table 1"
    evidence: "Parler-TTS with natural language speaker descriptions achieves FAR=0% on
      SLUE-VoxPopuli, matching zero-shot TTS baselines (VALL-E, XTTS-v2) that require reference
      audio."
    confidence: high
    relevance: low
  - claim_id: far_unreliable_under_disjoint_speaker_evaluation_design
    role: complicates
    claim: "False acceptance rate is an unreliable discriminator of speaker anonymization quality
      when evaluation design guarantees disjoint training and test speakers."
    source: "§3.4.1"
    evidence: "FAR=0% is achieved by every TTS-based system regardless of architecture or
      conditioning, because TTS models are trained on speakers absent from the evaluation set; the
      metric cannot distinguish the proposed method from any TTS-based pipeline in this setting."
    confidence: high
    relevance: high
  - claim_id: asr_ner_pipeline_content_privacy_limited_by_errors
    role: complicates
    claim: "ASR + NER pipeline-based content privacy is limited by recognition and detection errors
      that allow a meaningful share of sensitive content to pass through."
    source: "§3.4.1, §4"
    evidence: "The ASR component achieves 19.00% WER on original speech and DeBERTa-L NER achieves
      only 71.80% F1 on predicted transcriptions, meaning many named entities are missed at the
      detection stage."
    confidence: medium
    relevance: low
  - claim_id: prompt_based_tts_variability_limits_identity_consistency
    role: complicates
    claim: "Generative variability in prompt-based TTS limits consistent voice identity
      reproduction across utterances sharing the same speaker description."
    source: "§4"
    evidence: "Parler-TTS outputs may sound like different persons across generations even with an
      identical speaker description, undermining multi-utterance anonymization coherence."
    confidence: low
    relevance: low
  - claim_id: speaker_attribute_choice_affects_intelligibility
    role: supports
    claim: "Speaker attribute choice in instruction-conditioned TTS introduces measurable variation
      in downstream speech intelligibility that practitioners must account for."
    source: "§3.4.2, Tables 2 and 3"
    evidence: "WER varies from 12.07% (Slovak accent) to 23.76% (Italian accent) across 38 accent
      descriptions, and from 12.39% (normal rate) to 18.56% (very fast) across speaking rate
      settings, while speaker privacy (FAR=0%) remains constant."
    confidence: medium
    relevance: medium
  limitations:
  - "FAR=0% is observed for all TTS-based systems including both baselines, because the evaluation
    speakers are disjoint from TTS training speakers; the privacy metric cannot distinguish the
    proposed approach from any TTS pipeline in this experimental design."
  caveats:
  - "The paper's most durable contribution to evaluation-metrics is the demonstration that FAR, a
    standard speaker-anonymization privacy metric, is structurally unable to discriminate between
    methods whenever evaluation speakers are disjoint from TTS training speakers, a design flaw
    that could affect other anonymization evaluations using the same protocol."

- id: "2507.08319"
  entry_date: "2026-07-20"
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - transformer-enc-dec
  relevance: low
  evidence_role:
  - core_evidence
  current_role: minor
  method_family: []
  claims:
  - claim_id: active_learning_more_data_efficient_than_static_selection
    role: supports
    claim: "Active learning with model-informed informativeness criteria produces more
      data-efficient TTS corpora than model-agnostic static data selection at equal corpus size."
    source: "§III.B, Table I"
    evidence: "The proposed method achieves 71.0% synthesizable speaker ratio at 3,943 utterances
      versus 66.6% for the static baseline of the same size, measured by pseudo-MOS exceedance
      rate."
    confidence: high
    relevance: low
  - claim_id: informativeness_criterion_trades_off_top_quality_speakers
    role: complicates
    claim: "Data selection methods that optimize synthesizable speaker coverage may reduce
      synthesis quality for speakers already near the quality threshold."
    source: "§III.B, Figure 3"
    evidence: "The proposed method underperforms the static baseline for speakers with pseudo-MOS
      above 2.6, because the informativeness criterion explicitly excludes speakers the current
      model can already synthesize well."
    confidence: medium
    relevance: medium
  - claim_id: quality_estimator_effective_on_small_training_fraction
    role: supports
    claim: "TTS corpus quality estimators remain effective when trained on a small fraction of
      candidate data rather than requiring full candidate set pre-processing."
    source: "§III.B, Figure 7"
    evidence: "The data quality estimator trained on 10% of the YouTube candidate pool shows a
      strong correlation with the estimator trained on 100% of the data, with no significant change
      in selection behavior."
    confidence: medium
    relevance: medium
  - claim_id: diffusion_better_captures_speaker_embedding_distributions
    role: supports
    claim: "Diffusion models better capture complex speaker embedding distributions than Gaussian
      mixture models for speaker generation tasks with limited training samples."
    source: "§III.B, Figure 5"
    evidence: "The diffusion model achieves Wasserstein distance to held-out test speakers that is
      more than twice the standard deviation lower than GMMs across all cluster sizes (M=1..10)."
    confidence: medium
    relevance: low
  limitations:
  - "The evaluation uses pseudo-MOS (an automatic quality predictor) rather than subjective
    listening tests, so the absolute synthesis quality of the final corpora is not independently
    verified."
  caveats:
  - "Pseudo-MOS quality prediction is used as the sole selection and evaluation criterion
    throughout the pipeline; its role here is as a practical automated stand-in for human MOS
    rather than a methodological contribution to evaluation-metrics itself."

- id: "2507.09282"
  entry_date: "2026-07-20"
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  - diffusion
  - VAE
  relevance: low
  evidence_role:
  - evaluation_caution
  current_role: minor
  method_family: []
  claims:
  - claim_id: zero_shot_tts_normalisation_filters_atypical_speech
    role: supports
    claim: "The normalising tendency of zero-shot TTS models can be deliberately exploited to filter
      atypical speech characteristics while preserving general voice timbre."
    source: "§2.2, §4, Table 1"
    evidence: "ClaritySpeech applies XTTSv2 to dementia-affected speech without fine-tuning, reducing
      adversarial dementia detection F1 by 16% on ADReSS while maintaining speaker similarity of
      0.50, exploiting the model's tendency to smooth prosodic irregularities learned from diverse
      fluent training data."
    confidence: medium
    relevance: low
  - claim_id: speaker_identity_naturalness_tradeoff_zero_shot_tts
    role: complicates
    claim: "Speaker identity preservation and speech naturalness trade off against each other when
      zero-shot TTS is applied to atypical speech."
    source: "§4, Table 1"
    evidence: "StyleTTS2 achieves the best naturalness (UTMOS 2.86) and lowest WER (0.04) on ADReSS
      but the worst speaker similarity (0.36) among three TTS backends, while XTTSv2 achieves a more
      balanced UTMOS 2.15 and speaker similarity 0.50, showing that more aggressive normalisation
      sacrifices voice fidelity."
    confidence: medium
    relevance: medium
  - claim_id: text_acoustic_obfuscation_complementary
    role: supports
    claim: "Text-level content correction and acoustic re-synthesis provide complementary privacy
      protection that neither provides alone in disordered speech obfuscation."
    source: "§4, Table 2"
    evidence: "Ablation on ADReSS shows removing text obfuscation raises text-modality detection F1
      by 10 points (0.59 to 0.68), while removing zero-shot TTS collapses speaker similarity to
      0.12, showing the full pipeline needs both components."
    confidence: medium
    relevance: low
  - claim_id: pipeline_latency_precludes_realtime_obfuscation
    role: complicates
    claim: "Pipeline-based speech obfuscation systems that chain ASR, text processing, and TTS carry
      latency that precludes real-time deployment on standard hardware."
    source: "§4, Table 4"
    evidence: "ClaritySpeech achieves a mean real-time factor of 6.07 on CPU for 3-6 second audio
      samples, with ASR alone contributing RTF 3.01 and TTS contributing RTF 1.71."
    confidence: high
    relevance: low
  limitations:
  - "Evaluation uses small, low-diversity datasets (ADReSS: 690 samples, ADReSSo: 947 samples) from
    a single cookie-theft description task; generalisability to other dementia types, languages, or
    conversational speech is untested."
  caveats:
  - "Speaker identity preservation is measured only automatically via ECAPA-TDNN embeddings rather
    than subjective listening tests, illustrating how automatic metrics substitute for human
    perceptual judgment in privacy-sensitive evaluation contexts."

- id: "2507.09310"
  entry_date: "2026-07-20"
  year: 2025
  venue: arXiv
  task:
  - VC
  - TTS
  architecture:
  - VAE
  relevance: low
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: implicit_style_modeling_preserves_speech_style
    role: supports
    claim: "Implicit style modeling via an auxiliary reconstruction loss can preserve speaking style
      characteristics in voice conversion without requiring explicit acoustic feature extraction."
    source: "§3.3, §3.4, Table 2"
    evidence: "A style reconstruction loss using a frozen Lombard/neutral classifier achieves SIIB
      scores comparable to explicit conditioning on f0, mgc0, and mgc1 across male and female
      target speakers, with no statistically significant differences in most conditions."
    confidence: medium
    relevance: low
  - claim_id: explicit_feature_effectiveness_gender_dependent
    role: complicates
    claim: "The effectiveness of explicit prosodic features for style-preserving voice conversion
      depends on speaker gender, limiting the generalizability of feature-based conditioning
      approaches."
    source: "§3.4, Table 2"
    evidence: "F0 conditioning improves SIIB for male target speakers but is detrimental for female
      target speakers at both SNR-1 and SNR-3; spectral tilt and energy (mgc0+mgc1) are beneficial
      across genders."
    confidence: medium
    relevance: low
  - claim_id: speaker_similarity_perceptible_in_noise
    role: supports
    claim: "Speaker identity remains perceptible to listeners in noisy conditions, confirming that
      speaker similarity is a relevant evaluation dimension for intelligibility-enhancing voice
      conversion."
    source: "§2.3, Figure 1, §3.4, Figure 6"
    evidence: "Pilot study results show that listeners maintain consistent similarity rankings
      between speakers at SNR-1 and SNR-3 noise levels, and the implicit conditioning VC model
      preserves speaker similarity comparably to the CopyCat baseline."
    confidence: medium
    relevance: medium
  - claim_id: fusion_inconsistent_improvement
    role: complicates
    claim: "Combining implicit and explicit style conditioning does not consistently improve
      intelligibility over either approach alone, and can degrade performance in some
      configurations."
    source: "§3.4, Figure 5, Table 2"
    evidence: "Fusion of Ls with individual explicit features (e.g., Ls+f0 for female targets)
      reduces SIIB compared to Ls alone; only Ls+mgc0+mgc1 reliably improves over Ls in most
      conditions, and gains are inconsistent across genders."
    confidence: medium
    relevance: low
  limitations:
  - "The evaluation is restricted to a single small dataset (54 speakers, 100 short utterances
    each) with only two VC target speakers, limiting how far the intelligibility and
    speaker-similarity findings generalize."
  caveats:
  - "SIIB (speech intelligibility in bits) is applied here as the primary objective metric for
    noise-degraded speech, illustrating its niche use case in evaluation-metrics beyond the more
    common WER/MOS pairing, but validated against only a single MUSHRA-style pilot study rather
    than full-scale subjective evaluation of the main VC systems."

- id: "2506.18296"
  entry_date: "2026-07-20"
  year: 2025
  venue: Interspeech
  task:
  - TTS
  - VC
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - infrastructure
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: nonanonymous_corpora_enable_rigorous_speaker_similarity_eval
    role: supports
    claim: "Non-anonymous speaker corpora with publicly identifiable voices enable more rigorous
      subjective evaluations of speaker similarity in TTS and VC systems."
    source: "§1, §3.1"
    evidence: "JIS assigns stage names to 169 Japanese live idol speakers, allowing experiment
      designers to recruit listeners familiar with the speakers, enabling discrimination of subtle
      voice characteristics that anonymous corpus evaluations cannot capture."
    confidence: high
    relevance: high
  - claim_id: automatic_mos_underestimates_nonprofessional_quality
    role: complicates
    claim: "Automatic MOS predictors trained on TTS-generated speech may underestimate audio quality
      when applied to recordings of non-professional speakers, even under studio conditions."
    source: "§4.2.1"
    evidence: "JIS Speech A (studio-recorded) achieves a mean UTMOS of 3.4 compared to JVS
      parallel100's 3.7, with the gap attributed to linguistic mismatch in UTMOS training data and
      speech hesitations inherent to non-professional speakers rather than recording quality
      differences."
    confidence: medium
    relevance: high
  - claim_id: speaking_style_shifts_speaker_embeddings
    role: supports
    claim: "Speaking style and communicative context introduce systematic variation in speaker
      embeddings that interacts with speaker identity, presenting a challenge for style-robust
      speaker representation."
    source: "§4.2.2"
    evidence: "ECAPA-TDNN embeddings of JIS speakers show that specific speaking styles (energetic
      post-performance greetings, intimate photo-session speech) produce cross-speaker clusters in
      t-SNE, partially overriding individual speaker identity, while speech expressing personal
      individuality is more dispersed."
    confidence: medium
    relevance: medium
  limitations:
  - "The corpus is small (17 hours, 169 speakers) and its non-anonymous design is restricted to
    non-commercial basic research, which is a general corpus limitation rather than one specific to
    its evaluation-methodology contribution."
  caveats:
  - "JIS demonstrates a structural blind spot in current speaker-similarity evaluation practice:
    anonymous speaker corpora prevent listener familiarity, systematically tolerating approximate
    voice matches, a methodological critique applicable to most existing TTS/VC evaluation
    protocols beyond this corpus."

- id: "2507.10985"
  entry_date: "2026-07-20"
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture: []
  relevance: medium
  evidence_role:
  - core_evidence
  current_role: frontier_probe
  method_family: []
  claims:
  - claim_id: acoustic_deviation_correlates_mispronunciation
    role: supports
    claim: "Acoustic deviation between a learner utterance and a personalized voice-cloned reference
      correlates with mispronunciation at the word level."
    source: "§4, Table 2"
    evidence: "MFCC-DTW distances are consistently higher for mispronounced words than correctly
      pronounced words across all four L2-ARCTIC speakers tested (mean deviation of 0.027-0.028
      units on average), confirming the core deviation hypothesis."
    confidence: medium
    relevance: high
  - claim_id: deviation_metric_high_speaker_variability
    role: complicates
    claim: "Acoustic deviation metrics derived from voice cloning exhibit high per-speaker
      variability, making universal calibration insufficient for reliable mispronunciation
      detection."
    source: "§4, Table 1"
    evidence: "Classification accuracy ranges from 0.461 to 0.646 across four speakers; the authors
      note that per-individual models would likely improve results."
    confidence: medium
    relevance: high
  - claim_id: ambiguity_class_needed_for_threshold_decisions
    role: complicates
    claim: "Mispronunciation detection systems based on acoustic distance alone require an explicit
      ambiguity class when threshold-based decision rules cannot confidently separate correct from
      incorrect pronunciations."
    source: "§3.6"
    evidence: "The system defines an AMBIGUOUS output for samples falling between class-specific KDE
      thresholds, but the paper does not report how frequently this category occurs in practice."
    confidence: low
    relevance: medium
  limitations:
  - "No comparison against established CAPT baselines (e.g., GOP scoring) is provided, so it is
    unclear whether the proposed MFCC-DTW deviation score is competitive as an evaluation
    methodology."
  caveats:
  - "The deviation metric is validated only on four speakers from a single corpus (L2-ARCTIC), and
    the AMBIGUOUS output category's frequency is never quantified, leaving the practical
    reliability of the metric's decision boundaries unclear."

- id: "2507.14988"
  entry_date: "2026-07-20"
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - flow-matching
  relevance: medium
  evidence_role:
  - core_evidence
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: grpo_discrete_upstream_subcomponent_gain
    role: supports
    claim: "Applying GRPO to a discrete upstream subcomponent of a distilled TTS pipeline achieves
      perceptual metric gains at substantially lower computational cost than whole-system RL."
    source: "§3.2.2, §4.1, Table 1"
    evidence: "Duration predictor GRPO fine-tuning uses 4-step student inference for reward
      computation and converges in 1.5K steps; on Seed-TTS-en, WER improves from 3.750 (no RL) to
      1.752 and SIM from 0.672 to 0.698 without modifying the synthesis model."
    confidence: high
    relevance: low
  - claim_id: duration_prediction_bottleneck
    role: supports
    claim: "Duration prediction quality independently constrains intelligibility and speaker
      similarity in non-autoregressive TTS regardless of synthesis model capacity."
    source: "§A.1, Table 3"
    evidence: "With the same flow-matching generator, WER on Seed-TTS-en ranges from 1.723
      (best-of-8 oracle duration sampling) to 3.750 (unoptimized predictor) to 1.752
      (RL-optimized), establishing duration as the primary bottleneck."
    confidence: high
    relevance: low
  - claim_id: distillation_reduces_prosodic_diversity
    role: complicates
    claim: "Distribution matching distillation in flow-matching TTS reduces prosodic diversity
      disproportionately relative to acoustic quality, concentrating degradation in temporal and
      structural dimensions."
    source: "§3.3.1, §4.3.3, Table 1, Figure 3"
    evidence: "Step reduction from 32 to 4 lowers pitch CV-f0 by 30.3% (from 0.666 to 0.464) while
      mean-centered UTMOS distributions remain consistent across teacher and student, showing
      diversity loss is prosodic rather than spectral."
    confidence: high
    relevance: medium
  - claim_id: best_of_n_practical_ceiling
    role: refines
    claim: "Best-of-N sampling over discrete duration predictions establishes a practical
      performance ceiling for RL-based duration optimization in non-autoregressive TTS."
    source: "§A.1, Table 3"
    evidence: "Best-of-8 duration sampling achieves WER 1.723 and SIM 0.724 on Seed-TTS-en; the
      RL-optimized system reaches WER 1.752 and SIM 0.698 in a single pass, approaching but not
      fully closing the gap to this oracle upper bound."
    confidence: medium
    relevance: low
  - claim_id: teacher_guided_sampling_restores_diversity
    role: supports
    claim: "A hybrid inference strategy using a high-diversity teacher for early denoising and a
      distilled student for acoustic refinement can restore prosodic diversity without sacrificing
      metric optimization gains."
    source: "§3.3.2, §4.3.3, Table 1"
    evidence: "Teacher-guided sampling (t_switch=0.25, 16 steps) recovers CV-f0 to 0.593 (89.1% of
      teacher diversity) while achieving WER 1.738 and SIM 0.699, outperforming the teacher on both
      objective metrics at 1.8x faster RTF."
    confidence: high
    relevance: medium
  limitations:
  - "Reward signals used for RL optimization are limited to WER and speaker similarity; explicit
    naturalness or prosody reward metrics are not explored, leaving the reward design incomplete
    relative to full perceptual quality."
  caveats:
  - "CV-f0 is introduced specifically as a diagnostic for prosodic diversity loss under
    distillation, a useful complement to WER/SIM/RTF that other flow-matching distillation papers
    do not typically report."

- id: "2507.16632"
  entry_date: "2026-07-20"
