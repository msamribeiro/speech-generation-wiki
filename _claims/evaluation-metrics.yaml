  - core_evidence
  current_role: minor
  method_family: []
  claims:
  - claim_id: emotionconditioned_tts_in_sds_improves_emotion_appropriateness
    role: supports
    claim: "Integrating emotion-conditioned TTS into a spoken dialogue system produces measurably more appropriate emotional speech than a neutral TTS baseline."
    source: "§3.5, Table 2"
    evidence: "Speech emotion appropriateness scores were 4.10 (proposed) vs. 1.70 (baseline) with a very large effect size (Cohen's d = 3.07, p < 0.001) across 20 human-judged conversations."
    confidence: medium
    relevance: low
  - claim_id: sentimentdriven_control_not_sufficient_for_engagement_gains
    role: complicates
    claim: "Sentiment-driven emotional speech control does not straightforwardly translate into significantly higher user engagement in short task-oriented interactions."
    source: "§3.5, Table 2"
    evidence: "Engagement scores and number of SDS turns showed large effect sizes favouring the proposed system (d = 0.824, d = 0.831) but failed to reach statistical significance (p = 0.09, p = 0.07) with n = 20 conversations."
    confidence: low
    relevance: low
  - claim_id: discrete_contextfree_emotion_shifts_undermine_naturalness
    role: complicates
    claim: "Discrete, context-free emotion label assignment produces step-change tonal shifts that may undermine conversational naturalness even when individual utterance emotion is appropriate."
    source: "§3.5"
    evidence: "Mean engagement remained around 3.0 on a 5-point scale, and the authors note that abrupt emotion transitions without considering prior context may have suppressed engagement gains."
    confidence: low
    relevance: low
  - claim_id: emotional_sds_needs_taskspecific_evaluation_metrics
    role: supports
    claim: "Subjective evaluation of emotional spoken dialogue systems requires task-specific metrics beyond standard TTS naturalness; generic MOS-type ratings do not capture emotion appropriateness or conversational engagement."
    source: "§3.3"
    evidence: "The paper proposes a seven-item questionnaire covering RAG quality, task achievement, speech emotion appropriateness, and engagement, arguing existing evaluation frameworks lack appropriate metrics for social goals in emotional SDSs."
    confidence: medium
    relevance: high
  limitations:
  - "The evaluation uses only 20 conversation samples (10 per system) conducted by the authors themselves, which is underpowered for the engagement and turn-count analyses and does not include independent users."
  caveats:
  - "The paper's principal evaluation-metrics contribution is a seven-item Likert questionnaire targeting emotion appropriateness and engagement in spoken dialogue systems, addressing a real gap in standardised assessment for socio-conversational agents, though validated on only 20 conversations with no independent replication."
