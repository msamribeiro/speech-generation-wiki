- id: "2508.00317"
  entry_date: "2026-07-21"
  year: 2025
  venue: arXiv
  task:
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - evaluation_caution
  - infrastructure
  current_role: influential
  method_family: []
  claims:
  - claim_id: ssl_mos_finetuning_indomain_success_ood_gap
    role: supports
    claim: "Fine-tuning self-supervised speech representations is sufficient to achieve high MOS prediction correlation in-domain, even with small labeled datasets, but this does not transfer reliably to out-of-domain evaluation settings."
    source: "§II.A"
    evidence: "Fine-tuning SSL models for MOS prediction emerged as the dominant approach in VMC 2022, achieving high correlation even with very small amounts of labeled OOD data (down to 136 training samples), while VMC 2023 found no team achieved uniformly strong performance across all three tracks from a single model trained on shared data."
    confidence: medium
    relevance: high
  - claim_id: mos_predictors_fail_at_high_quality_ceiling
    role: complicates
    claim: "Automatic MOS predictors consistently fail to discriminate among high-quality speech generation systems whose naturalness approaches human levels, indicating a ceiling effect in current SQA methodology."
    source: "§II.C"
    evidence: "VMC 2024's zoomed-in track, evaluating high-quality systems near human naturalness, proved particularly difficult for automatic predictors, indicating current SQA methods struggle to discriminate among the best modern TTS systems."
    confidence: medium
    relevance: high
  - claim_id: community_challenges_accelerate_evaluation_progress
    role: supports
    claim: "Community challenges with well-documented baselines and open datasets accelerate research progress in evaluation methodology more reliably than individual paper contributions."
    source: "§I, §II.E"
    evidence: "AMC 2025 attracted 24 teams, the highest across all editions, and the paper argues via citation trend data that the VoiceMOS/AudioMOS Challenge series and open-source toolkits (MOSNet, DNSMOS, NISQA, SSL-MOS, UTMOS, TorchAudio-Squim, SHEET, VERSA) have been the primary drivers of progress in automatic speech quality assessment."
    confidence: low
    relevance: medium
  - claim_id: quality_assessment_beyond_speech_needs_new_dimensions
    role: refines
    claim: "Expanding automatic quality assessment beyond speech to music and general audio requires rethinking evaluation dimensions beyond MOS, as production quality, content enjoyment, and textual alignment reflect distinct perceptual dimensions that do not collapse to a single score."
    source: "§II.D, §IV"
    evidence: "AMC 2025 introduced a text-to-music quality track and a multi-axis audio aesthetics evaluation track, with organisers noting that a single in-domain MOS-style score does not capture axes such as production quality, content enjoyment, and text alignment for music and general audio."
    confidence: medium
    relevance: medium
  limitations:
  - "The paper's central argument that challenges and open-source toolkits drive progress is supported by citation count trends rather than a controlled study; alternative explanations (larger models, more data, general SSL pre-training improvements) are not ruled out."
  caveats:
  - "As a perspective/retrospective review rather than a system paper, this paper's contribution to evaluation-metrics is curatorial: it consolidates four years of VoiceMOS/AudioMOS Challenge findings and surveys open-source SQA toolkits (MOSNet, DNSMOS, NISQA, SSL-MOS, UTMOS, TorchAudio-Squim, SHEET, VERSA), identifying cross-domain MOS prediction and near-human-quality discrimination as still-unsolved problems."
- id: "2508.01796"
  entry_date: "2026-07-21"
  year: 2025
  venue: arXiv
  task:
  - singing
  architecture:
  - diffusion
  - GAN
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: minor
  method_family: []
  claims:
  - claim_id: mel_vocoders_underrepresent_highfreq_detectable_signature
    role: supports
    claim: "Mel-spectrogram-to-waveform vocoders systematically underrepresent high-frequency spectral structure, producing a detectable signature that lightweight classifiers can exploit."
    source: "§1, §4.2"
    evidence: "A ConvNeXt classifier trained to distinguish real from synthetic spectrograms readily identifies baseline vocoder (Vocos, mdctGAN, NU-Wave 2) outputs as synthetic due to blurry, smoothed high-frequency energy patterns, whereas human observers rate baseline Vocos spectrograms as real only 24.3% of the time versus 78.1% for ground truth."
    confidence: medium
    relevance: low
  - claim_id: bandwidth_extension_helps_only_with_redesigned_vocoder
    role: refines
    claim: "Inserting an explicit bandwidth extension step prior to vocoding can improve both spectrogram visual realism and perceived audio quality, but only when the vocoder is redesigned to accommodate the higher-resolution intermediate representation."
    source: "§4.4, Figure 8"
    evidence: "Adding the LSE bandwidth-extension step to the original (unmodified) Vocos vocoder slightly reduces audio quality (MOS 3.329), because the unmodified 1D-convolution vocoder struggles with the larger frequency resolution; the quality gain requires the Vocos2D redesign, which alone reaches MOS 4.157."
    confidence: medium
    relevance: low
  - claim_id: dit_adaptable_to_timefrequency_spectral_data
    role: supports
    claim: "Diffusion models with transformer backbones can be adapted to time-frequency spectral data by restricting self-attention to the time axis and using per-frequency learned embeddings to handle the lack of spatial invariance across frequency."
    source: "§3.2"
    evidence: "The LSE model restricts DiT self-attention to the time axis only and handles inter-frequency communication through linear projections with per-frequency-bin learned embeddings, reconstructing a 592-bin full-bandwidth linear spectrogram from a mel spectrogram condition."
    confidence: medium
    relevance: low
  - claim_id: spectrogram_realism_and_audio_quality_partially_independent
    role: complicates
    claim: "Spectrogram visual realism and waveform perceptual quality are partially independent dimensions: a system can improve on one while degrading on the other depending on how the vocoder processes the extended spectral representation."
    source: "§4.4"
    evidence: "The Vocos2D-only ablation (without the LSE step) achieves a subjective MOS of 4.157, close to the full LSE+Vocos2D system's 4.176, suggesting most of the MOS gain comes from the vocoder redesign rather than the LSE step, even though LSE contributes materially to spectrogram-level visual realism."
    confidence: medium
    relevance: high
  limitations:
  - "All training and evaluation data is assembled from a mix of privately recorded singing audio and public datasets under a custom pipeline; no standard public benchmark is used for final comparison."
  caveats:
  - "The paper's evaluation protocol combining a neural classifier for spectrogram realism, human visual-realism judgment, and subjective MOS is unusually thorough for a vocoder paper and introduces spectrogram visual realism as a quality axis distinct from standard perceptual audio quality metrics."
- id: "2508.02013"
  entry_date: "2026-07-21"
  year: 2025
  venue: arXiv
  task:
  - SCA
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - infrastructure
  - core_evidence
  current_role: influential
  method_family: []
  claims:
  - claim_id: srpa_quality_determined_by_text_lm_not_speech_architecture
    role: supports
    claim: "The quality of spoken role-playing in both cascaded and end-to-end systems is more strongly determined by the underlying language model's text reasoning ability than by the speech synthesis or speech-to-speech architecture."
    source: "§5.2"
    evidence: "Cascaded systems built on strong text LMs, particularly Llama-3.1-8B, achieve the best overall English scores (0.957), outperforming GPT-4o Audio overall (0.921), while open-source end-to-end models (Qwen2.5-Omni, LLaMA-Omni) fall well below cascaded baselines across all dimensions."
    confidence: medium
    relevance: medium
  - claim_id: finetuning_gains_larger_for_expressive_dims_than_interaction
    role: refines
    claim: "End-to-end speech-language models exhibit larger gains from task-specific fine-tuning in expressive speech dimensions than in interaction or role fidelity dimensions, which remain text-LM bottlenecked."
    source: "§5.2"
    evidence: "Fine-tuning Qwen2.5-Omni on SpeechRole-Data substantially improves the resulting SpeechRole-Agent (0.801 English overall vs. 0.568 for the base model), with gains extending to unseen roles (OOD: 0.783), suggesting the benefit is not purely role memorisation."
    confidence: medium
    relevance: low
  - claim_id: llm_pairwise_eval_correlates_with_human_judgement_multireference
    role: supports
    claim: "LLM-based pairwise evaluation of speech quality can achieve high rank correlation with human expert judgements when using multi-reference normalisation, making automated SRPA benchmarking feasible at scale."
    source: "§5.3, Table 3"
    evidence: "Human-LLM agreement via Spearman's ρ ranges from 0.67 to 0.98 across metrics in English and 0.64 to 0.96 in Chinese, with Human-LLM Agreement rates exceeding 0.75 for most dimensions."
    confidence: high
    relevance: high
  - claim_id: opensource_e2e_lags_cascaded_on_prosody_emotion
    role: supports
    claim: "Current open-source end-to-end speech models lag proprietary cascaded systems in prosody consistency and emotion appropriateness by margins large enough to constitute a capability gap, not merely a performance gap."
    source: "§5.2, Table 2"
    evidence: "GPT-4o Audio trails cascaded systems on prosody consistency (0.900 vs. 0.966 for Llama-3.1-8B) and emotion appropriateness (0.816 vs. 0.964), while open-source end-to-end Qwen2.5-Omni scores only 0.568 overall in English."
    confidence: medium
    relevance: low
  limitations:
  - "All reference speech in SpeechRole-Eval is TTS-synthesised rather than recorded from human actors, meaning benchmark scores measure performance relative to synthetic reference quality rather than against a naturalness ceiling."
  caveats:
  - "SpeechRole-Eval's pairwise LLM-judge protocol (Gemini-2.5-Pro comparing candidates against three synthesised TTS references, validated via Spearman's ρ 0.67-0.98 against human experts) is the paper's central evaluation-methodology contribution, providing the first large-scale automated benchmark for Speech Role-Playing Agents."
- id: "2508.04195"
  entry_date: "2026-07-21"
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  - flow-matching
  relevance: low
  evidence_role:
  - evaluation_caution
  current_role: minor
  method_family: []
  claims:
  - claim_id: paralinguistic_tokens_enable_joint_asr_transcription
    role: supports
    claim: "Treating paralinguistic vocalizations as inline vocabulary tokens in ASR decoding enables joint transcription of lexical and non-verbal content within a single unified sequence, without requiring a separate event detection module."
    source: "§Paralinguistic Aware Speech Recognition"
    evidence: "SenseVoice-Small, fine-tuned with paralinguistic events as special output tokens, achieves in-domain F1 0.83 and open-domain F1 0.85 on the paralinguistic-aware ASR task, outperforming Paraformer, Whisper, and Qwen-Audio."
    confidence: medium
    relevance: low
  - claim_id: autolabeled_data_matches_human_annotated_for_paralinguistic_tts
    role: supports
    claim: "Automatically annotated data at scale can match or exceed the training effectiveness of smaller human-annotated sets for paralinguistic-enhanced TTS, measured by CER and perceptual quality."
    source: "§Main Results, Table 5"
    evidence: "Fine-tuning CosyVoice2 on the full auto-labeled corpus (573h) achieves 7.51% in-domain CER (vs. 8.61% on human data alone) and UTMOS 2.67 (vs. 2.54), with speaker similarity preserved at 0.700."
    confidence: medium
    relevance: low
  - claim_id: tts_finetuning_enables_tokenlevel_nonverbal_control
    role: supports
    claim: "Fine-tuning zero-shot TTS models with paralinguistic vocabulary extensions enables token-level control over non-verbal vocalization placement without material degradation of lexical quality or speaker similarity."
    source: "§Paralinguistic-enhanced TTS Experiments, Table 5"
    evidence: "CosyVoice2 fine-tuned with paralinguistic vocabulary extensions maintains 7.51% CER and 0.700 speaker similarity while inserting non-verbal tags at arbitrary token positions in the target sequence."
    confidence: medium
    relevance: low
  - claim_id: listener_preference_strong_despite_low_tag_recall
    role: complicates
    claim: "Listener preference for para-enhanced TTS is strong even when paralinguistic tag recall remains below 65%, suggesting that the mere presence of contextually appropriate non-verbal cues improves perceived naturalness."
    source: "§Human Evaluation, Table 6"
    evidence: "Human evaluation finds listener preference for para-enhanced output at win rates of 78.7% (CosyVoice) and 75.4% (CosyVoice2), with naturalness MOS of 3.9-4.0, even though paralinguistic tag recall reaches only 61.9%."
    confidence: medium
    relevance: high
  limitations:
  - "Paralinguistic tag recall in TTS reaches only 61.9%, leaving substantial room for improvement in ensuring specified non-verbal cues are faithfully rendered; the paper evaluates TTS on its own in-domain/open-domain splits rather than a shared benchmark."
  caveats:
  - "The paper introduces paralinguistic-specific evaluation metrics (Para Detection Rate, paralinguistic F1, NMOS, QMOS) to complement standard MOS and CER for expressive speech assessment; the finding that subjective preference remains high despite imperfect tag recall (61.9%) suggests these objective and subjective axes can diverge."
- id: "2508.05385"
  entry_date: "2026-07-21"
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - transformer-enc-dec
  relevance: medium
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: automated_nv_annotation_matches_manual_annotation
    role: supports
    claim: "Automated annotation pipelines for non-verbal vocalizations can match or exceed manually-annotated datasets in downstream NV generation and understanding tasks, while scaling at substantially lower cost."
    source: "§5.1, Table 2; §5.2, Tables 4-5"
    evidence: "F5-TTS fine-tuned on the automatically-annotated NVS(TSA) dataset achieves CLAP Scores of 0.187 (EN) and 0.179 (ZH), compared to 0.110/0.100 for the strongest comparable baseline trained on a smaller, more manually-curated dataset, representing relative gains of roughly 70-79%."
    confidence: medium
    relevance: low
  - claim_id: nv_tag_positional_accuracy_more_important_than_dataset_size
    role: supports
    claim: "Positional accuracy of non-verbal tag annotations is a more important determinant of NV controllability in TTS than dataset size alone."
    source: "§5.1, Table 2"
    evidence: "The TSA (Temporal-Semantic Alignment) annotation variant consistently outperforms the simpler TBO (timestamp-based ordering) variant on the same underlying data, improving CLAP scores by roughly 0.07 and IMOS by roughly 0.2-0.3 in both English and Chinese."
    confidence: medium
    relevance: medium
  - claim_id: framelevel_nv_detection_generalizes_crosslingual
    role: supports
    claim: "Frame-level NV detection models trained exclusively on one language can generalise to structurally different languages without retraining, suggesting that acoustic features of non-verbal sounds are largely language-agnostic."
    source: "§2.2; §3"
    evidence: "The frame-level NV detection model, trained on English data only, achieves approximately 91% F1 across three test splits and performs comparably on Chinese test sets without additional training."
    confidence: medium
    relevance: low
  - claim_id: rulebased_nv_augmentation_worse_than_natural_data
    role: complicates
    claim: "Rule-based NV data augmentation produces measurably worse NV controllability in fine-tuned TTS systems compared to models trained on naturally-occurring vocalizations."
    source: "§5.1, Table 2"
    evidence: "TTS models fine-tuned on the naturally-occurring NVS dataset outperform comparable systems trained on rule-based augmented data (NV clips concatenated or overlaid onto clean speech), which produce unnatural timbre mismatches."
    confidence: low
    relevance: low
  limitations:
  - "The detection model is trained and evaluated on simulated test data (augmented speech + NV clips), not on naturally-occurring NV events in the wild; whether the ~91% F1 reflects real-world performance is untested."
  caveats:
  - "The paper's TSA (Temporal-Semantic Alignment) annotation method is evaluated via Tag Position Distance (TPD) and Normalized Tag Distance (NTD) metrics, which the paper introduces specifically to measure annotation positional accuracy, distinct from standard TTS naturalness or intelligibility metrics."
- id: "2508.06870"
  entry_date: "2026-07-21"
