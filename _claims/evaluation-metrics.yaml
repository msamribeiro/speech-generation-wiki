  current_role: minor
  method_family: []
  claims:
  - claim_id: discrete_unit_vc_extends_to_perceptual_attribute_control
    role: supports
    claim: "Discrete-unit voice conversion can be extended to control subjective perceptual attributes beyond speaker identity by adding a scalar conditioning signal to the synthesis model."
    source: "§3, §5.3, Figure 6"
    evidence: "A FastSpeech 2 model conditioned on HuBERT-based discrete units, ECAPA-TDNN speaker embeddings, and a target likability scalar successfully steered perceived likability for 3 of 4 speakers in pairwise preference tests."
    confidence: medium
    relevance: low
  - claim_id: automatic_likability_predictor_sufficient_proxy_labels
    role: supports
    claim: "Automatic likability predictors based on TDNN regression on crowd-sourced ratings can provide sufficient proxy labels to train large-scale perceptual attribute control systems."
    source: "§4.2, Table 2"
    evidence: "The predictor achieved LCC 0.46 and SRCC 0.49 with human ratings (p < 3e-17) and 74% binary classification accuracy; its outputs were used to automatically annotate the JVS and JTES corpora for VC training, avoiding costly human annotation."
    confidence: medium
    relevance: high
  - claim_id: likability_control_speaker_identity_tension
    role: complicates
    claim: "Strong likability control and speaker identity preservation are in tension in discrete-unit VC systems, particularly at extreme target values."
    source: "§5.2, §5.3, Figures 4-6"
    evidence: "At target likability = 2 (outside the training range), CER increased substantially for female speakers and speaker m49 showed degraded speaker similarity and unexpected subjective likability drop."
    confidence: medium
    relevance: low
  - claim_id: likability_control_fails_for_individual_speakers
    role: complicates
    claim: "Voice likability control demonstrates effective behaviour for majority speaker groups but can fail for individual speakers due to identity-likability interaction effects."
    source: "§5.3, Figure 6"
    evidence: "Three of four speakers showed significant preference differences between target -1 and 1; speaker m49 exhibited the opposite trend, attributed to failure to preserve speaker identity."
    confidence: medium
    relevance: low
  - claim_id: likability_is_multifactorial_requires_demographic_modelling
    role: refines
    claim: "Perceived voice likability is a multi-factorial attribute requiring demographic-stratified modelling, not a single group-level score."
    source: "§2, §4.2, Table 2"
    evidence: "The predictor uses four separate listener-group outputs (by gender and age); per-group LCC ranges from 0.36 to 0.41 while the aggregate LCC is 0.46, confirming systematic variation across listener demographics."
    confidence: medium
    relevance: medium
  limitations:
  - "The evaluation is limited to four speakers (two female, two male) and one language (Japanese); cross-lingual and multi-lingual generalisability is entirely untested."
  caveats:
  - "The likability predictor's moderate correlation with human ratings (LCC 0.46) means a substantial portion of subjective likability variance is not captured, and since this predictor is the sole source of training supervision, any systematic biases in its predictions propagate to the VC model — a caution relevant to any automated-proxy evaluation metric."

- id: "interspeech-2025-0401"
  entry_date: "2026-07-21"
  year: 2025
  venue: Interspeech
  task:
  - evaluation
  architecture: []
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: standard_mos_mushra_insufficient_for_modern_tts
    role: complicates
    claim: "Standard MOS and MUSHRA protocols are insufficient for evaluating modern high-quality synthetic speech, and evaluation protocol saturation now drives the need for purpose-designed alternatives."
    source: "§1, §2"
    evidence: "The paper argues, building on a decade of meta-analyses (Wester et al. 2015, Kirkland et al. 2023), that as synthetic speech quality has risen, standard protocols increasingly fail to discriminate between systems without careful, purpose-designed adaptation."
    confidence: medium
    relevance: high
  - claim_id: missing_methodological_details_undermine_comparisons
    role: complicates
    claim: "Missing methodological details in published evaluation reports, particularly the exact question posed to listeners and cohort composition, materially affect the validity of cross-paper comparisons."
    source: "§1"
    evidence: "The paper cites a decade of documented practice where the precise listener question, cohort composition, and protocol rationale are routinely omitted from published TTS evaluation reports, making replication and cross-paper comparison unreliable."
    confidence: high
    relevance: high
  - claim_id: shareable_recipe_schema_enables_replication
    role: supports
    claim: "Standardising evaluation into a shareable recipe schema separates the evaluation design from its execution platform, enabling replication without re-implementing the full setup."
    source: "§3.3"
    evidence: "The replikant platform packages procedure, anonymised data, and configuration into a self-contained recipe bundle; several published evaluations (North Sami TTS, video summarisation) already reuse replikant-based recipes, demonstrating real-world replication."
    confidence: medium
    relevance: high
  - claim_id: review_process_can_improve_evaluation_quality
    role: supports
    claim: "Conference review processes can meaningfully improve evaluation quality by assessing protocol justification, material appropriateness, and alignment between the statistical analysis and the evaluated hypothesis."
    source: "§4, §4.1, §4.2"
    evidence: "The paper proposes a checklist-style reviewer guideline grounded in ITU-T P.800, P.85, and prior meta-analyses, covering evaluation campaign design, material description, and analysis appropriateness."
    confidence: low
    relevance: medium
  limitations:
  - "Without formal adoption by Interspeech, ICASSP, or SSW programme committees, the reviewer guidelines remain advisory, and the paper does not evaluate whether recipe sharing actually increases replication attempts in practice."
  caveats:
  - "The paper distinguishes reproducibility (identical inputs/code/conditions) from replicability (same scientific question, different data) and argues replicability is the correct target for inherently unreproducible subjective speech evaluations — a conceptual framing directly relevant to how evaluation-metrics claims should be interpreted across papers."

- id: "interspeech-2025-0406"
