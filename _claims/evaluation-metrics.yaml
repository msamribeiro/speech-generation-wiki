    confidence: high
    relevance: low
  - claim_id: speechtokenizer_entangled_tokens_cause_content_errors
    role: supports
    claim: Acoustic tokens from standard neural codecs encode content and speaker identity in an entangled
      form that causes systematic word errors in autoregressive language model generation.
    source: "§2.3, Table 3"
    evidence: EnCodec RVQ-1 tokens achieve only 16.5 mutual information with text versus 31.6-32.9 for
      SpeechTokenizer's RVQ-1 on the paper's SLMTokBench benchmark.
    confidence: high
    relevance: low
  - claim_id: speechtokenizer_daxis_distillation_stronger
    role: refines
    claim: A distillation objective computed per feature dimension (D-axis) produces stronger semantic
      guidance to a codec's first quantizer than the conventional per-timestep (T-axis) formulation.
    source: "Appendix C, Table 7"
    evidence: The D-axis cosine distillation loss outperforms the T-axis formulation in the paper's ablation
      (Appendix C, Table 7).
    confidence: medium
    relevance: low
  - claim_id: speechtokenizer_first_layer_enables_zeroshot_vc
    role: supports
    claim: The first-layer tokens of a hierarchically disentangled codec can serve as a zero-shot voice
      conversion mechanism by swapping higher-layer tokens from a reference speaker, without requiring
      a separate conversion model.
    source: "§5.2, Table 5"
    evidence: The paper demonstrates zero-shot voice conversion by substituting RVQ layers 2-8 from a
      reference speaker while retaining RVQ-1 content tokens.
    confidence: medium
    relevance: low
  - claim_id: speechtokenizer_unsupervised_codebooks_poor_utilization
    role: complicates
    claim: Codec tokens trained without explicit content supervision exhibit poor codebook utilisation
      and weak phoneme-code correspondence, increasing the modelling burden on downstream language models.
    source: "Appendix F, Table 8"
    evidence: SpeechTokenizer RVQ-1 reaches Phone-Normalized Mutual Information of 0.71 versus 0.28 for
      EnCodec RVQ-1 and 0.43 for HuBERT KM500 units.
    confidence: medium
    relevance: low
  limitations:
  - SpeechTokenizer is trained solely on English LibriSpeech; multilingual validation of the codec's text-alignment
    properties is not established.
  caveats:
  - The paper introduces SLMTokBench, a two-axis benchmark (text alignment via mutual information/downstream
    ASR WER, and information preservation via resynthesis WER/speaker similarity) for evaluating discrete
    speech representations. The paper's own Novelty Assessment and Limitations note that the benchmark's
    mutual-information estimation relies on a variational approximation and a fixed BiLSTM downstream
    model, so absolute scores are not directly comparable across different evaluation setups, an important
    caveat for anyone reusing SLMTokBench as a standard metric.
- id: "2312.15821"
  entry_date: "2026-07-20"
  year: 2023
  venue: arXiv
  task:
  - TTS
  architecture:
  - flow-matching
  relevance: medium
  evidence_role:
  - core_evidence
  current_role: influential
  method_family: []
  claims:
  - claim_id: audiobox_unified_model_matches_specialists
    role: supports
    claim: A single generative model trained across speech, sound, and music modalities can match or surpass
      modality-specific models on dedicated benchmarks.
    source: "§5.4, §6.4, §7.5, Tables 1, 5, 13, 14"
    evidence: Audiobox Speech surpasses Voicebox and UniAudio on LibriSpeech zero-shot TTS speaker similarity
      while the unified Audiobox model outperforms all unified text-to-audio baselines on AudioCaps FAD.
    confidence: high
    relevance: low
  - claim_id: audiobox_ssl_pretraining_improves_generalization
    role: supports
    claim: Self-supervised pre-training on large-scale unlabeled audio substantially improves multi-domain
      style generalisation in subsequent supervised fine-tuning, with gains most pronounced on out-of-domain
      test sets.
    source: "§5.5, Table 3"
    evidence: Audiobox Speech improves over Voicebox by 0.096-0.156 absolute speaker similarity on CommonVoice,
      Switchboard, Expresso, and internal Accent datasets after SSL pre-training on 185K hours.
    confidence: high
    relevance: low
  - claim_id: audiobox_general_clap_fails_speech_attributes
    role: supports
    claim: General audio-language embedding models trained primarily on sound events fail to capture fine-grained
      speech attributes, rendering them unreliable for evaluating description-conditioned speech generation.
    source: "§7.3.1, Table 8"
    evidence: Stock CLAP achieves text-to-audio retrieval recall@10 of only 2.29 on speech description
      data and Pearson correlation of 0.028 with human relevance scores, versus 22.01 and 0.727 respectively
      for the paper's proposed Joint-CLAP.
    confidence: high
    relevance: high
  - claim_id: audiobox_bespoke_solvers_speedup_flow_matching
    role: supports
    claim: Flow-matching models admit post-training inference optimisation via learned ODE reparameterisation
      (Bespoke Solvers) that reduces function evaluations by 25x without measurable quality degradation.
    source: "§8, Table 15"
    evidence: Bespoke Solvers at 4 steps (8 NFE) match the midpoint solver at 32 steps (64 NFE) exactly
      on speaker similarity and WER across five test sets.
    confidence: high
    relevance: low
  - claim_id: audiobox_silence_removal_improves_speaker_similarity
    role: supports
    claim: Removing trailing silence from audio context prompts substantially improves speaker similarity
      in zero-shot TTS, particularly on datasets with long prompt silences.
    source: "§5.5, Table 3"
    evidence: Table 3's ablation attributes part of the speaker-similarity gain over Voicebox to removing
      trailing silence from voice prompts.
    confidence: medium
    relevance: low
  limitations:
  - The model and training data are not released publicly, limiting reproducibility, and the description-based
    conditioning pipeline depends on LLM-generated captions from a limited categorical attribute vocabulary.
  caveats:
  - The paper directly advances the evaluation-metrics concept by introducing Joint-CLAP, a WavLM/RoBERTa
    contrastive model fine-tuned on both speech-description and sound-caption data specifically to fix
    the failure of standard CLAP on fine-grained speech attributes; the paper's own Limitations note that
    Joint-CLAP has not been independently validated as a general benchmark metric outside this paper.
- id: "2403.16973"
  entry_date: "2026-07-20"
  year: 2024
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  relevance: high
  evidence_role:
  - core_evidence
  - evaluation_caution
  current_role: influential
  method_family: []
  claims:
  - claim_id: voicecraft_infilling_near_groundtruth_naturalness
    role: supports
    claim: Autoregressive codec language models can perform speech infilling with naturalness approaching
      that of the original unedited recording when masked spans are relocated to the end of the sequence,
      enabling bidirectional context conditioning within a causal framework.
    source: "§3.1, §5.3, Table 5"
    evidence: Listeners judge VoiceCraft's edited speech to be equally or more natural than the original
      unedited recording 56.4% of the time on the REALEDIT benchmark.
    confidence: high
    relevance: low
  - claim_id: voicecraft_unified_editing_and_tts_no_cost
    role: supports
    claim: Zero-shot TTS and speech editing can be unified as a single autoregressive infilling operation
      without task-specific architectural components, at no cost to performance on either task.
    source: "§3.4, §5.4, Table 6"
    evidence: The same token-rearrangement mechanism achieves MOS 4.03 on REALEDIT speech editing and
      MOS 4.17 on zero-shot TTS, both competitive with or exceeding task-specific baselines.
    confidence: high
    relevance: low
  - claim_id: voicecraft_wer_unreliable_intelligibility_proxy
    role: supports
    claim: 'WER measured by ASR systems is an unreliable proxy for perceptual intelligibility when evaluating
      speech synthesis quality: systems can achieve lower WER than ground truth recordings while receiving
      substantially lower intelligibility ratings from human listeners.'
    source: "§5.3, §5.4"
    evidence: FluentSpeech achieves lower WER than ground truth (3.5% vs 3.8% for TTS; 4.5% vs 5.4% for
      editing) yet receives substantially lower naturalness MOS than VoiceCraft from human listeners.
    confidence: high
    relevance: high
  - claim_id: voicecraft_audiobook_only_eval_underestimates_gaps
    role: supports
    claim: Evaluation of speech synthesis exclusively on audiobook data underestimates the performance
      gap between systems when applied to in-the-wild recordings with diverse accents, noise, and speaking
      styles.
    source: "§5.3, §5.4"
    evidence: The REALEDIT benchmark (310 in-the-wild examples from audiobooks, YouTube, and podcasts)
      is introduced specifically because prior audiobook-only speech-editing benchmarks were judged less
      challenging and less realistic.
    confidence: high
    relevance: high
  - claim_id: voicecraft_scaling_improves_objective_metrics
    role: supports
    claim: Scaling autoregressive codec LM parameters consistently improves objective metrics across intelligibility
      and acoustic fidelity measures, with larger gaps between larger model sizes suggesting further gains
      from continued scaling.
    source: "§5.2, Table 3"
    evidence: The 120M/430M/830M model-size ablation shows consistent gains across WER, MCD, F0, and energy
      distance as parameter count increases.
    confidence: medium
    relevance: low
  limitations:
  - The inference-time artifact mitigation (generating 10 candidates and discarding the 4 longest) adds
    significant latency and compute cost, and the underlying repetitive-loop generation cause remains
    unresolved.
  caveats:
  - VoiceCraft's demonstration that ASR-measured WER can diverge sharply from human-perceived intelligibility
    (FluentSpeech beats ground-truth WER while sounding worse to listeners), combined with its introduction
    of the in-the-wild REALEDIT benchmark specifically to expose gaps hidden by audiobook-only evaluation,
    makes this one of the more direct and field-relevant evaluation-metrics contributions in this batch.
- id: "2404.03204"
  entry_date: "2026-07-20"
  year: 2024
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: minor
  method_family: []
  claims:
  - claim_id: rall_e_cot_prosody_stabilizes_ar_tts
    role: supports
    claim: Autoregressive codec language model TTS can be substantially stabilised by predicting prosody
      tokens as explicit intermediate targets before speech token generation, without requiring reranking
      or a separate alignment model at inference.
    source: "§3.2, Table 2"
    evidence: RALL-E reduces WER from 5.6% (VALL-E baseline) to 2.5% on LibriSpeech test-clean without
      reranking, using chain-of-thought prosody token prediction.
    confidence: high
    relevance: low
  - claim_id: rall_e_duration_masking_improves_robustness
    role: supports
    claim: Duration-guided attention masking, which restricts each speech token to attend only to a local
      phoneme window based on predicted alignment, provides significant robustness improvements beyond
      prosody conditioning alone.
    source: "§3.3, Table 4"
    evidence: Removing duration-guided masking from the ablation raises WER from 2.5% to 3.2%, isolating
      its independent contribution beyond prosody CoT prompting.
    confidence: high
    relevance: low
  - claim_id: rall_e_hard_sentence_benchmark_exposes_robustness_gap
    role: refines
    claim: The robustness deficit of AR codec TTS relative to non-autoregressive methods is most pronounced
      on structurally unusual inputs (repetitive patterns, numeric sequences, code strings) where learned
      implicit alignment is most likely to fail.
    source: "§4.4, Table 1"
    evidence: On 50 hard sentences containing repetitive numbers, file paths, and code strings, RALL-E
      reduces the VALL-E baseline's 68% error rate to 4%, exposing a robustness gap that standard LibriSpeech
      test-clean WER does not surface.
    confidence: high
    relevance: high
  - claim_id: rall_e_prosody_cot_reduces_reranking_dependency
    role: refines
    claim: Reranking over multiple samples and explicit intermediate prosody prediction address the same
      underlying alignment problem and can be combined for additive gain, but prosody CoT prompting reduces
      the dependency on reranking by improving single-sample quality.
    source: "§4.2, Table 2"
    evidence: With 5-sample reranking, RALL-E's WER drops to 1.0% versus VALL-E's 1.7%, showing CoT prompting
      and reranking compound rather than substitute for each other.
    confidence: medium
    relevance: medium
  limitations:
  - Relies on an internal proprietary alignment tool for extracting phoneme-speech alignments during training,
    limiting reproducibility.
  caveats:
  - The 50-sentence hard-sentence benchmark (repetitive numbers, file paths, code strings) is a purpose-built
    adversarial test set rather than a standardized evaluation protocol, but it demonstrates that standard
    LibriSpeech WER substantially understates AR TTS robustness failures on structurally unusual inputs.
- id: "2406.00654"
  entry_date: "2026-07-20"
  year: 2024
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  relevance: high
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: uno_supervised_objective_mismatch_with_perceptual_metrics
    role: supports
    claim: Standard supervised training objectives for TTS produce a systematic mismatch with human perceptual
      evaluation metrics such as MOS and WER, and correcting this mismatch through preference-aware fine-tuning
      yields large performance gains.
    source: "§1, §4.2, Table 1"
    evidence: UNO-ICNF fine-tuning of VoiceCraft reduces WER from 8.4% to 2.6% and raises naturalness
      MOS from 3.38 to 4.06 without any change to the underlying supervised architecture.
    confidence: high
    relevance: high
  - claim_id: uno_dpo_infeasible_for_low_diversity_tts
    role: complicates
    claim: Existing RLHF methods requiring pairwise preference data from the same input (DPO) are difficult
      to apply directly to autoregressive codec TTS because these models lack sufficient output diversity
      to form meaningful preference pairs from a fixed transcript-prompt combination.
    source: "§4.2, Appendix B"
    evidence: The paper argues stochastic decoding alone does not produce enough quality variation from
      a fixed transcript-prompt pair for DPO-style preference labelling, motivating the prompt-varying
      sampling strategy instead.
    confidence: medium
    relevance: low
  - claim_id: uno_annotation_uncertainty_is_informative_signal
    role: refines
    claim: Uncertainty in human speech quality annotations is not noise to be discarded but an informative
      signal that, when incorporated into the optimization objective, improves the consistency of generated
      speech across listeners.
    source: "§4.2, §6.3, Table 3"
    evidence: An ablation without uncertainty weighting (UNO-null) achieves similar mean MOS but higher
      output variance than the uncertainty-aware UNO-ICNF, confirming uncertainty modelling specifically
      improves consistency rather than just central tendency.
    confidence: medium
    relevance: high
  - claim_id: uno_small_sample_alignment_without_ground_truth
    role: supports
    claim: RLHF-style alignment for TTS can be achieved with a small number of self-generated samples
      (hundreds) without access to ground truth speech, making it practical for post-training fine-tuning
      at low computational cost.
    source: "§4.1, §5, Appendix D"
    evidence: UNO requires only 400 self-generated samples (200 positive/200 negative) and about 10 minutes
      of fine-tuning on a single A100 GPU to achieve its reported gains.
    confidence: high
    relevance: low
  - claim_id: uno_mos_alignment_transfers_to_emotion_axis
    role: supports
    claim: Alignment objectives designed for naturalness MOS transfer to other perceptual dimensions such
      as emotion by substituting the selection criterion, demonstrating that preference-based fine-tuning
      generalises beyond a single quality axis.
    source: "§6.4, Table 4"
    evidence: Substituting the MOS-based selection criterion with valence/arousal sorting on ESD prompts
      increases measured valence from 0.55 to 0.67 and arousal from 0.62 to 0.71 without explicit emotion
      labels.
    confidence: medium
    relevance: medium
  limitations:
  - Evaluated exclusively on VoiceCraft, an autoregressive codec language model; transfer to diffusion
    or flow-matching TTS is discussed but not tested.
  caveats:
  - Human evaluation uses only 10 listeners rating 120 samples, a relatively small pool for the MOS and
    preference judgments that UNO's uncertainty-modelling claims rest on; the comparison against SpeechAlign
    is also acknowledged by the authors as partially unfair since SpeechAlign uses ground-truth speech
    as positive samples.
- id: "2406.04904"
  entry_date: "2026-07-20"
  year: 2024
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  - GAN
  relevance: low
  evidence_role:
  - evaluation_caution
  current_role: minor
  method_family: []
  claims:
  - claim_id: xtts_multilingual_training_degrades_speaker_similarity
    role: supports
    claim: Multilingual zero-shot TTS training degrades speaker similarity compared to monolingual training
      on the same data, reflecting a fundamental trade-off in cross-lingual speaker conditioning.
    source: "§4.1, Table 2, Table 3"
    evidence: XTTS's speaker similarity (SECS 0.642) trails the monolingual YourTTS configuration (0.712)
      trained on the same underlying dataset.
    confidence: medium
    relevance: low
  - claim_id: xtts_perceiver_resampler_improves_multilingual_cloning
    role: supports
    claim: A Perceiver Resampler-based speaker conditioning encoder, producing multiple fixed-length embeddings
      from variable-length reference audio, improves voice cloning robustness in massively multilingual
      autoregressive TTS over single-embedding approaches.
    source: "§2"
    evidence: XTTS replaces Tortoise's single 1024-dim speaker embedding with 32 Perceiver-Resampler embeddings
      per reference clip, a change the authors identify as critical for multilingual speaker conditioning.
    confidence: medium
    relevance: low
  - claim_id: xtts_monolingual_baseline_comparison_is_unfair
    role: complicates
    claim: Evaluating multilingual TTS models against monolingual baselines on the same language produces
      misleading comparisons, because the multilingual model's per-language training data is substantially
      reduced.
    source: "§3.2, §4.1"
    evidence: The paper notes prior comparisons against YourTTS's multilingual checkpoint used a severely
      imbalanced training mix (66% of batches from six speakers), making it an artificially weak baseline
      that inflates apparent gains for English-only systems.
    confidence: high
    relevance: high
  - claim_id: xtts_short_finetuning_improves_crosslingual_similarity
    role: supports
    claim: A small amount of target-speaker fine-tuning data (approximately 10 minutes) substantially
      improves speaker similarity in cross-lingual zero-shot synthesis, including extreme prosody styles
      such as whispering.
    source: "§5"
    evidence: Ten minutes of adaptation data improves SECS from 0.585 to 0.717 in cross-lingual transfer,
      including transfer of a whispered voice style to all 16 languages.
    confidence: medium
    relevance: low
  - claim_id: xtts_codebook_pruning_improves_expressiveness
    role: supports
    claim: Low-frequency codec codebook entries can be pruned without quality loss and improve expressiveness
      in multilingual discrete-token TTS.
    source: "§2"
    evidence: After training, the VQ-VAE codebook is filtered to the 1,024 most-frequent of 8,192 codes,
      which the authors found improved expressiveness in preliminary experiments.
    confidence: low
    relevance: low
  limitations:
  - No ablation isolates the contribution of the Perceiver Resampler versus the larger reference representation
    alone.
  caveats:
  - 'The paper''s most eval-metrics-relevant contribution is methodological rather than architectural:
    exposing that prior multilingual-vs-monolingual TTS comparisons used an artificially imbalanced YourTTS
    baseline, inflating the apparent advantage of English-only systems.'
- id: "2406.05370"
  entry_date: "2026-07-20"
  year: 2024
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: valle2_repetition_aware_sampling_stabilizes_decoding
    role: supports
    claim: Adaptive sampling that detects and breaks token repetition loops can stabilise autoregressive
      codec LM decoding without requiring forced-alignment auxiliary data.
    source: "§3.4.1, Table 1"
    evidence: Repetition Aware Sampling replaces VALL-E's pure nucleus sampling with an adaptive switch
      that reverts to random sampling once a sliding-window repetition ratio exceeds threshold, without
      needing an alignment model.
    confidence: high
    relevance: low
  - claim_id: valle2_grouped_code_modeling_improves_long_context
    role: supports
    claim: Grouping codec codes into multi-token AR steps reduces effective sequence length and simultaneously
      improves long-context modelling quality at moderate group sizes.
    source: "§3.1, §4.2.1, Table 1"
    evidence: Grouped Code Modeling with G=2 preserves near-identical quality while halving AR sequence
      length; G=8 degrades quality, indicating a practical grouping ceiling.
    confidence: high
    relevance: low
  - claim_id: valle2_matches_ground_truth_on_clean_benchmarks
    role: refines
    claim: Autoregressive codec TTS can match or exceed ground-truth speech on robustness and speaker
      similarity metrics when evaluated on clean English audiobook benchmarks.
    source: "§4.2.2, Table 2; §4.3.2, Table 5"
    evidence: VALL-E 2 reaches SMOS 4.61 versus ground-truth SMOS 4.13 on LibriSpeech test-clean and SMOS
      4.42 versus ground-truth 4.47 on VCTK, with single-sampling WER matching ground-truth WER (1.6%).
    confidence: high
    relevance: high
  - claim_id: valle2_prompt_necessary_in_both_stages
    role: supports
    claim: Prompt availability in both the AR and NAR stages is independently necessary for preserving
      speaker identity; removing either prompt degrades speaker similarity substantially.
    source: "§4.2.3, Table 3; §4.3.3, Table 6"
    evidence: Ablations show removing the prompt from either the AR or NAR stage collapses speaker similarity
      by 50-80%.
    confidence: high
    relevance: low
  - claim_id: valle2_multisampling_closes_robustness_gap
    role: refines
    claim: Inference-time multiple sampling followed by metric-based selection can substantially close
      the single-sample robustness gap, but at proportional computational cost.
    source: "§4.1.3, Table 1"
    evidence: The paper reports that reranking over multiple samples further reduces WER beyond single-sample
      decoding, at compute cost proportional to the number of samples drawn.
    confidence: medium
    relevance: medium
  limitations:
  - Human parity is claimed solely on LibriSpeech test-clean and VCTK, both controlled or semi-controlled
    read-speech benchmarks; generalisation to spontaneous, noisy, or low-resource speech is untested.
  caveats:
  - The paper's ‘human parity’ framing rests entirely on WER and SMOS meeting or exceeding ground truth
    on clean audiobook-style benchmarks, illustrating a broader evaluation-metrics concern about what
    such claims do and do not establish outside controlled read-speech conditions.
- id: "2406.18009"
  entry_date: "2026-07-20"
  year: 2024
  venue: arXiv
  task:
  - TTS
  architecture:
  - flow-matching
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: e2tts_alignment_supervision_imposes_naturalness_ceiling
    role: supports
    claim: Explicit phoneme alignment supervision in non-autoregressive TTS, while useful for early convergence,
      imposes a naturalness ceiling that joint character-level training can exceed.
    source: "§3.4, Table 2"
    evidence: E2 TTS reaches CMOS -0.05 relative to ground truth, versus -0.78 for the Voicebox reimplementation
      trained on identical data but with explicit phoneme alignment.
    confidence: high
    relevance: low
  - claim_id: e2tts_flow_matching_learns_alignment_implicitly
    role: supports
    claim: Flow-matching mel spectrogram generators can learn alignment implicitly from raw characters
      and filler tokens, eliminating the need for grapheme-to-phoneme converters, phoneme aligners, and
      duration models.
    source: "§2.1, §2.3"
    evidence: E2 TTS pads the character sequence with filler tokens to match the target mel length and
      trains with a masked speech-infilling objective, with no external aligner or duration model in the
      pipeline.
    confidence: high
    relevance: low
  - claim_id: e2tts_pretraining_improves_zero_shot_performance
    role: supports
    claim: Unsupervised pretraining on unlabeled speech improves downstream zero-shot TTS performance
      in both intelligibility and speaker similarity.
    source: "§3.4, Table 1"
    evidence: Pretrained initialization improves WER from 2.0% to 1.9% and SIM-o from 0.675 to 0.708 on
      LibriSpeech-PC test-clean relative to random initialization.
    confidence: medium
    relevance: low
  - claim_id: e2tts_sim_metric_can_exceed_ground_truth
    role: complicates
    claim: Zero-shot TTS speaker similarity scores at inference can exceed those of ground-truth recordings
      on standard speaker verification metrics, suggesting the metrics reward consistency within a generation
      rather than perceptual identity.
    source: "§3.4, Table 2"
    evidence: E2 TTS's objective speaker-similarity score surpasses that of ground-truth recordings under
      the paper's speaker-verification metric, a pattern the authors attribute to the metric rewarding
      within-generation consistency rather than true perceptual identity match.
    confidence: high
    relevance: high
  - claim_id: e2tts_scales_predictably_with_data
    role: supports
    claim: Non-autoregressive TTS systems trained jointly on duration and acoustics scale predictably
      with training data volume without requiring architectural changes.
    source: "§3.4, Table 1"
    evidence: Training on 200,000 hours of proprietary data reaches WER 1.9% and SIM-o 0.707 from random
      initialization, comparable to the pretrained 50,000-hour Libriheavy configuration, without architectural
      modification.
    confidence: medium
    relevance: low
  limitations:
  - CMOS evaluation covers only 39 samples from 39 LibriSpeech speakers reading English; naturalness findings
    are narrow in scope for spontaneous, non-native, or cross-lingual speech.
  caveats:
  - 'The finding that E2 TTS''s objective SIM score exceeds ground truth is a direct, well-evidenced illustration
    of a known evaluation-metrics limitation: standard speaker-similarity metrics can reward within-generation
    consistency rather than genuine perceptual speaker identity.'
- id: "2407.05361"
  entry_date: "2026-07-20"
  year: 2024
  venue: arXiv
  task:
  - TTS
  - evaluation
  architecture: []
  relevance: low
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: emilia_itw_data_matches_formal_improves_spontaneous
    role: supports
    claim: Training speech generation models on large-scale in-the-wild data, after automated quality
      filtering, can match audiobook-derived training data on formal-domain benchmarks while improving
      performance on spontaneous speech generation.
    source: "§V.A, Table V"
    evidence: AR+SoundStorm and VoiceBox trained on Emilia-En (46k hours) match MLS-trained counterparts
      on LibriSpeech-Test WER/S-SIM/FSD, but improve WER, S-SIM, and FSD on Emilia-Test (spontaneous speech)
      for both architectures.
    confidence: high
    relevance: low
  - claim_id: emilia_scaling_law_diminishing_returns
    role: supports
    claim: Increasing in-the-wild training-set size continues to improve zero-shot TTS quality at fixed
      model capacity, with the largest gains at smaller scales and diminishing but still-positive returns
      as scale grows.
    source: "§V.B, Figure 5"
    evidence: Scaling training data from 5k to 134k hours steadily reduces AR+SoundStorm WER (5.2% to
      4.2% on LibriSpeech-Test; 5.7% to 4.9% on Emilia-Test), with gains concentrated below 46k hours
      and convergence emerging around 100k hours.
    confidence: high
    relevance: low
  - claim_id: emilia_multilingual_pooling_tradeoff
    role: complicates
    claim: Training a single model on pooled multilingual in-the-wild data enables crosslingual generation
      but trades off same-language quality relative to a monolingual model trained on comparable per-language
      data volume.
    source: "§V.C"
    evidence: The Emilia-Large-trained multilingual AR+SoundStorm model scores WER 4.9%, S-SIM 0.636,
      and FSD 15.31 on English, all slightly worse than an English-only 134k-hour model (WER 4.5%, S-SIM
      0.65, FSD 14.8).
    confidence: medium
    relevance: low
  - claim_id: emilia_filtering_discards_majority_of_raw_audio
    role: complicates
    claim: Automated quality-filtering pipelines for in-the-wild speech data necessarily discard a large
      majority of raw source audio to reach a training-quality bar.
    source: "§III, Table 2"
    evidence: On a 666.94-hour benchmark sample, Emilia-Pipe's six stages retain only 38.75% of the input
      (258.44 hours, 96,117 clips) after DNSMOS, language-confidence, and duration-outlier filtering.
    confidence: high
    relevance: low
  - claim_id: emilia_crosslingual_transfer_remains_harder
    role: complicates
    claim: Crosslingual voice transfer in zero-shot TTS remains substantially harder than same-language
      transfer even when the training corpus itself is multilingual and balanced across the target languages.
    source: "§V.C, Table VI"
    evidence: Crosslingual WER and speaker similarity degrade relative to matched-language pairs across
      all six languages, e.g. VoiceBox S-SIM falls from 0.588 En-En to 0.386 En-Zh.
    confidence: high
    relevance: low
  limitations:
  - Subjective evaluation in the audiobook-vs-in-the-wild comparison uses only sixteen samples and twelve
    English-speaking evaluators, limiting statistical reliability of reported CMOS/SMOS differences.
  caveats:
  - 'The paper''s main evaluation-metrics contribution is infrastructural rather than a discrete claim:
    it defines and applies a multi-axis objective protocol (WER for intelligibility, S-SIM for speaker
    similarity, FSD via emotion2vec features for naturalness) that is reused across its own scaling and
    multilingual experiments and by later corpus papers.'
- id: "2407.08551"
  entry_date: "2026-07-20"
  year: 2024
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  relevance: low
  evidence_role:
  - core_evidence
  current_role: minor
  method_family: []
  claims:
  - claim_id: melle_continuous_repr_preserves_speaker_info
    role: supports
    claim: Continuous mel-spectrogram representations preserve more speaker-relevant acoustic information
      than vector-quantized codec codes at standard compression rates.
    source: "§5.1, Table 1"
    evidence: MELLE's speaker similarity under ECAPA-TDNN (0.680) exceeds VALL-E 2's (0.662) despite both
      models operating at comparable scale, which the authors attribute partly to avoiding codec quantization
      loss.
    confidence: medium
    relevance: low
  - claim_id: melle_continuous_ar_avoids_discrete_failure_modes
    role: supports
    claim: Autoregressive TTS models trained to predict continuous frames can achieve naturalness comparable
      to human speech while avoiding the silence and repetition failures endemic to discrete codec language
      models.
    source: "§5.2, Table 3"
    evidence: MELLE achieves MOS 4.20 versus ground-truth MOS 4.29 (CMOS -0.032, not significantly different
      at p>0.1) on 40 cross-sentence LibriSpeech samples.
    confidence: high
    relevance: low
  - claim_id: melle_variational_sampling_beats_topp
    role: supports
    claim: Variational sampling in the continuous latent space is more effective than top-p discrete sampling
      for improving output diversity and speaker similarity in autoregressive TTS.
    source: "§5.3, Table 4"
    evidence: Ablating both the Latent Sampling Module and the spectrogram flux loss degrades cross-sentence
      WER from 1.47% to 23.21%, with flux loss contributing most of the robustness gain.
    confidence: high
    relevance: low
  - claim_id: melle_reduction_factor_speeds_inference
    role: refines
    claim: A reduction factor that predicts multiple frames per autoregressive step can substantially
      reduce inference time with only modest degradation in speaker similarity.
    source: "§5.4, Table 5"
    evidence: At r=4, inference time for 10-second speech drops to 1.40s (versus 5.49s at r=1) while still
      outperforming most VALL-E variants on WER.
    confidence: medium
    relevance: low
  limitations:
  - Subjective evaluation rests on only 40 samples from a single English corpus (LibriSpeech test-clean);
    generalisation to noisier prompts, non-native accents, or other languages is untested.
  caveats:
  - MELLE's SMOS (4.40) exceeding ground truth (3.94) is reported without discussion of whether this reflects
    the same speaker-similarity-metric ceiling effect documented explicitly in other papers in this batch
    (e.g. E2 TTS), an open question for evaluation-metrics synthesis.
- id: "2408.16532"
  entry_date: "2026-07-20"
  year: 2024
  venue: arXiv
  task:
  - codec
  architecture:
  - GAN
  - VAE
  relevance: low
  evidence_role:
  - core_evidence
  current_role: minor
  method_family: []
  claims:
  - claim_id: wavtok_single_quantizer_beats_multiquantizer
    role: supports
    claim: A single large-codebook quantizer can achieve higher perceptual reconstruction quality than
      multi-quantizer residual VQ systems at substantially higher bitrates, when supported by a strong
      decoder.
    source: "§4.2, Table 1, Table 2"
    evidence: WavTokenizer at 0.9 kbps (1 quantizer) achieves UTMOS 4.05 versus 3.91 for DAC at 9 kbps
      (9 quantizers), and MUSHRA 96.1 versus DAC's 92.8.
    confidence: high
    relevance: low
  - claim_id: wavtok_single_quantizer_tokens_improve_downstream_tts
    role: supports
    claim: Codec tokens produced by a single quantizer enable better downstream autoregressive speech
      generation than tokens from multi-quantizer codecs, as measured by intelligibility and speaker similarity.
    source: "§4.2, Appendix I, Table 12"
    evidence: Downstream TTS using WavTokenizer achieves WER 5.1% and SPK-SIM 0.61 versus 6.9% WER and
      0.59 SIM for DAC at 9 kbps.
    confidence: medium
    relevance: medium
  - claim_id: wavtok_attention_decoder_improves_semantics
    role: supports
    claim: Incorporating attention mechanisms in the codec decoder and extending the training context
      window improves the semantic richness of discrete audio tokens without requiring distillation from
      a semantic model.
    source: "§3.3, §4.3, Table 9"
    evidence: On the 12-dataset ARCH semantic classification benchmark, WavTokenizer with 75 tokens outperforms
      DAC and EnCodec at comparable or higher quantizer counts on 7 of 12 tasks, without semantic distillation.
    confidence: medium
    relevance: low
  - claim_id: wavtok_codebook_expansion_diminishing_returns
    role: refines
    claim: Expanding the VQ codebook space beyond the conventional 1024 entries improves reconstruction
      quality under extreme compression, but excessively large codebooks reduce codebook utilisation and
      yield diminishing returns.
    source: "§3.2, §4.3, Table 5"
    evidence: Codebook utilisation analysis shows usage concentrates below 2^12 entries even at large
      training scale, motivating the 4096-entry default rather than a larger codebook.
    confidence: medium
    relevance: low
  - claim_id: wavtok_ifft_decoder_beats_transposed_conv
    role: supports
    claim: Inverse Fourier transform decoding significantly outperforms mirrored transposed-convolution
      upsampling in high-compression codec settings.
    source: "§3.3, §4.3, Table 7"
    evidence: Replacing the conventional transposed-convolution decoder with an inverse-STFT structure
      borrowed from Vocos is shown by ablation to be a key driver of WavTokenizer's reconstruction gains.
    confidence: medium
    relevance: low
  limitations:
  - Downstream TTS evaluation uses only LibriTTS (~960 hours) and a single model configuration; advantages
    over multi-quantizer codecs at VALL-E/Voicebox scale are unvalidated.
  caveats:
  - Codebook utilisation plateaus below 2^12 even at 4000 hours of training, leaving the ceiling of useful
    codebook expansion, and the generality of the ARCH-benchmark semantic-classification results, uncharacterised.
- id: "2409.05377"
  entry_date: "2026-07-20"
  year: 2024
  venue: arXiv
  task:
  - codec
  architecture:
  - GAN
  - VAE
  relevance: low
  evidence_role:
  - core_evidence
  current_role: minor
  method_family: []
  claims:
  - claim_id: bigcodec_capacity_decisive_at_low_bitrate
    role: supports
    claim: At very low bitrates (around 1 kbps), model capacity is a decisive factor in reconstruction
      quality, with larger models substantially outperforming architecturally sophisticated but smaller
      codecs.
    source: "§III-C, §IV-B, Table I"
    evidence: BigCodec (159M params) reaches MUSHRA 92.33 versus ground truth 91.84, outperforming smaller
      low-bitrate baselines TF-Codec (74.67) and LLM-Codec (67.90) by a wide margin.
    confidence: high
    relevance: low
  - claim_id: bigcodec_low_dim_vq_improves_utilization
    role: supports
    claim: Low-dimensional vector quantisation before codebook lookup substantially improves codebook
      utilisation in single-codebook, single-quantisation-step codec designs.
    source: "§III-A, §IV-B"
    evidence: Projecting latents to an 8-dimensional space before quantisation against a single 8192-entry
      codebook is identified as central to avoiding the sparse high-dimensional quantisation problem.
    confidence: medium
    relevance: low
  - claim_id: bigcodec_lstm_improves_quality_independent_of_scale
    role: supports
    claim: Adding sequential (LSTM) modelling to a convolutional codec encoder improves both perceptual
      quality and speaker similarity at low bitrates, independently of the parameter count effect.
    source: "§III-A, §IV-D, Table III"
    evidence: Ablation shows the LSTM temporal-modelling layer contributes to quality and speaker-similarity
      gains beyond what the parameter-count increase alone explains.
    confidence: medium
    relevance: low
  - claim_id: bigcodec_scaling_saturates_at_159m
    role: refines
    claim: Scaling codec model size beyond a saturation point (approximately 159M parameters in this setting)
      yields no further reconstruction benefit, analogous to scale-up behaviour observed in neural vocoders.
    source: "§IV-D, Table III"
    evidence: A 300M-parameter BigCodec variant shows no measurable improvement over the 159M model on
      the evaluated metrics.
    confidence: medium
    relevance: low
  - claim_id: bigcodec_data_scaling_no_benefit
    role: refines
    claim: Increasing training data volume from 960 hours to 60k hours does not improve codec reconstruction
      quality, suggesting that model capacity rather than data quantity is the binding constraint at this
      bitrate.
    source: "§IV-D, Table III"
    evidence: Scaling training data from LibriSpeech 960h to LibriLight 60k hours produces no measurable
      quality improvement in the ablation.
    confidence: medium
    relevance: low
  limitations:
  - Trained exclusively on clean English speech (LibriSpeech 960h); competing codecs train on diverse
    multilingual, music, and environmental audio, limiting applicability to those domains without fine-tuning.
  caveats:
  - The paper explicitly flags that BigCodec's MUSHRA score exceeding ground truth (92.33 vs. 91.84) may
    reflect a subjective-test artefact (listener anchoring, signal-processing smoothing) rather than genuine
    perceptual enhancement, an open evaluation-metrics question the authors themselves raise but do not
    resolve.
- id: "2410.03751"
  entry_date: "2026-07-20"
  year: 2024
  venue: arXiv
  task:
  - SCA
  - TTS
  architecture: []
  relevance: low
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: speechlm_survey_e2e_avoids_cascade_info_loss
    role: supports
    claim: End-to-end speech generation models avoid the information loss, latency, and cumulative error
      introduced by cascaded ASR-LLM-TTS pipelines, but require integrating speech tokenisation and synthesis
      into a unified training regime.
    source: "§I, §II"
    evidence: The survey characterises the cascade pipeline's text bottleneck as discarding paralinguistic
      features at each stage and compounding latency and transcription/synthesis errors across three sequential
      modules.
    confidence: medium
    relevance: low
  - claim_id: speechlm_survey_semantic_acoustic_tradeoff
    role: supports
    claim: 'Semantic tokenizers and acoustic tokenizers impose an inherent trade-off: semantic tokens
      produce coherent content but poor acoustic quality, while acoustic tokens enable high-fidelity reconstruction
      but risk content inaccuracies.'
    source: "§III-A, §IV-A1"
    evidence: The survey's taxonomy classifies HuBERT/wav2vec2/W2v-BERT as semantic tokenizers trading
      fidelity for content, and EnCodec/SoundStream as acoustic tokenizers trading content consistency
      for fidelity, citing GSLM and related literature.
    confidence: medium
    relevance: low
  - claim_id: speechlm_survey_text_pretrained_init_helps
    role: supports
    claim: Initialising a speech LM from a text-pretrained checkpoint accelerates convergence and improves
      speech understanding, whereas initialisation from image-pretrained checkpoints yields worse results
      than random initialisation.
    source: "§IV-B1"
    evidence: The survey reports that text-pretrained LM checkpoints (as in TWIST, SPIRIT-LM) yield faster
      convergence and better speech understanding than cold initialisation (GSLM), while image-pretrained
      checkpoints underperform random initialisation.
    confidence: medium
    relevance: low
  - claim_id: speechlm_survey_interleaving_improves_alignment
    role: supports
    claim: Interleaving speech and text tokens during pre-training measurably improves cross-modal representation
      alignment compared to training on speech tokens alone.
    source: "§IV-B1"
    evidence: The survey cites SPIRIT-LM's feature-similarity visualisations as demonstrating improved
      text-speech representation alignment from interleaved pre-training.
    confidence: medium
    relevance: low
  - claim_id: speechlm_survey_post_alignment_underexplored
    role: complicates
    claim: Post-alignment techniques (RLHF, DPO) for speech LMs remain substantially underexplored relative
      to their established role in text LM development, leaving semantic consistency and acoustic quality
      gaps in deployed systems.
    source: "§IV-B3, §VII"
    evidence: The survey identifies Align-SLM and SpeechAlign as isolated examples, characterising post-alignment
      for SpeechLMs as an early-stage and underexplored area relative to text LM RLHF practice.
    confidence: medium
    relevance: low
  limitations:
  - Submitted October 2024; coverage of full-duplex systems and post-alignment techniques is acknowledged
    by the authors as incomplete given the rapidly evolving landscape.
  caveats:
  - The survey's Section VI systematises SpeechLM evaluation across representation probing (ABX), linguistic
    benchmarks (sWUGGY, sBLIMP), paralinguistic evaluation (STSP), and downstream task suites (SUPERB,
    VoiceBench, MMAU), providing a taxonomic reference for evaluation-metrics even though none of its
    five headline claims are evaluation-specific.
- id: "2410.17196"
  entry_date: "2026-07-20"
  year: 2024
  venue: arXiv
  task:
  - evaluation
  - SCA
  architecture: []
  relevance: high
  evidence_role:
  - evaluation_caution
  - infrastructure
  current_role: influential
  method_family: []
  claims:
  - claim_id: voicebench_pipeline_beats_e2e
    role: supports
    claim: Pipeline-based voice assistants (ASR plus LLM) substantially outperform end-to-end audio LLMs
      on spoken instruction understanding, with the gap persisting even for state-of-the-art proprietary
      end-to-end systems.
    source: "§3.3, Table 3"
    evidence: The naive Whisper + LLaMA-3.1-8B pipeline scores 79.1 on the composite VoiceBench score
      versus 55.7 for the best open-source end-to-end model (DiVA); even GPT-4o-Audio (86.4) trails the
      Naive-4o pipeline (87.2).
    confidence: high
    relevance: high
  - claim_id: voicebench_e2e_training_degrades_llm_capability
    role: supports
    claim: End-to-end audio LLM training can degrade the underlying LLM's text-instruction capabilities,
      including safety alignment, compared to using the same base model in a pipeline configuration.
    source: "§3.3"
    evidence: LLaMA-Omni's safety refusal rate drops from 98.5% (text) to 11.4% (speech), and its text-instruction
      performance falls over 11 points compared to the same base LLM used in a pipeline.
    confidence: high
    relevance: high
  - claim_id: voicebench_mispronunciation_worse_than_disfluency
    role: refines
    claim: Mispronunciation causes significantly greater performance degradation in voice assistants than
      disfluencies or grammatical errors, because it increases effective word error rate rather than merely
      adding irrelevant context.
    source: "§6.2, Table 5"
    evidence: Mispronunciation causes an average 20.3% score reduction across models, versus 12.6% for
      repair disfluencies, while grammatical errors are largely tolerated.
    confidence: high
    relevance: high
  - claim_id: voicebench_clean_synthetic_speech_overestimates_robustness
    role: contradicts
    claim: Evaluations using clean synthetic speech substantially overestimate voice assistant robustness
      relative to real recorded speech, particularly for models with non-standard speech encoders.
    source: "§3.3, Table 4"
    evidence: Real accent data (SD-QA) is shown to be substantially harder than synthetic accent data
      for the same models, particularly for low-resource accents such as Philippine and Indian English.
    confidence: high
    relevance: high
  - claim_id: voicebench_encoder_choice_dominates_robustness
    role: refines
    claim: The choice of speech encoder determines a voice assistant's robustness to accent and speaker
      variation more than the choice of base LLM.
    source: "§4.2"
    evidence: VITA, which uses a non-Whisper CNN+Transformer speech encoder, shows the greatest accent
      sensitivity among all evaluated systems, a pattern the authors attribute to encoder choice rather
      than the base LLM.
    confidence: medium
    relevance: medium
  limitations:
  - Evaluates only the text content of responses, not speech output quality; Moshi, the only tested model
    that natively outputs speech, is scored under the same text-only protocol as text-output models.
  caveats:
  - VoiceBench is itself a purpose-built evaluation benchmark for voice assistants, directly and substantially
    advancing the evaluation-metrics concept rather than merely using existing metrics; its text-form-vs-speech-form
    separation methodology is a reusable diagnostic pattern.
- id: "2411.13577"
  entry_date: "2026-07-20"
  year: 2024
  venue: arXiv
  task:
  - SCA
  architecture:
  - autoregressive-LM
  - transformer-enc-dec
  - hybrid
  relevance: medium
  evidence_role:
  - evaluation_caution
  - infrastructure
  current_role: influential
  method_family: []
  claims:
  - claim_id: wavchat_cascade_vs_e2e_tradeoffs
    role: supports
    claim: The cascaded and end-to-end paradigms for spoken dialogue impose fundamentally different trade-offs
      between latency, paralinguistic fidelity, and intelligibility, and the appropriate choice depends
      on the target interaction scenario.
    source: "§2.2, §2.3"
    evidence: The survey's taxonomy contrasts cascaded systems' reliance on text as an intermediary against
      end-to-end systems' direct speech understanding and generation, mapping each to distinct latency/fidelity
      trade-offs.
    confidence: medium
    relevance: low
  - claim_id: wavchat_semantic_repr_sacrifices_expressiveness
    role: supports
    claim: Semantic speech representations offer higher compression rates and better LLM compatibility
      than acoustic representations, but sacrifice expressiveness, timbre, and style fidelity, necessitating
      additional vocoders in pipeline-based generation.
    source: "§3.3.1, Table 1"
    evidence: The survey's representation taxonomy documents that semantic tokens (HuBERT, WavLM) compress
      more aggressively and integrate better with LLMs, at the cost of requiring a separate vocoder to
      recover acoustic detail.
    confidence: medium
    relevance: low
  - claim_id: wavchat_full_duplex_requires_causal_architecture
    role: supports
    claim: Achieving genuine full-duplex spoken dialogue (simultaneous listening and speaking with interrupt
      handling) requires architecturally causal models throughout the full pipeline, a constraint that
      current systems largely satisfy only on the output side.
    source: "§5.1, §5.2"
    evidence: The survey documents that most systems still use non-streaming encoders (Whisper-based)
      on the input side even when Moshi and OmniFlatten demonstrate genuine full-duplex output-side capability.
    confidence: medium
    relevance: low
  - claim_id: wavchat_alignment_relies_on_paired_data
    role: complicates
    claim: Speech-text modality alignment in current spoken dialogue systems relies heavily on paired
      data, introducing catastrophic forgetting risk and creating a structural dependency on the availability
      of labelled speech corpora.
    source: "§4.4.1"
    evidence: The survey identifies paired text-speech data dependency as a near-universal property of
      surveyed SDM training pipelines, creating structural forgetting risk.
    confidence: medium
    relevance: low
  - claim_id: wavchat_eval_infrastructure_lags_capability
    role: complicates
    claim: 'Evaluation infrastructure for spoken dialogue lags substantially behind system capabilities:
      interaction, streaming latency, and audio generation are either absent from or severely underrepresented
      in existing benchmarks.'
    source: "§6.2, §6.3, Table 3"
    evidence: Mapping eight existing benchmarks (VoiceBench, SUPERB, AudioBench, AIR-Bench, SpokenWOZ,
      SD-Eval, SuperCLUE, MMAU) against eleven capability dimensions reveals no benchmark covers audio
      generation by spoken dialogue models and that interaction-capability evaluation remains largely
      ad hoc.
    confidence: high
    relevance: high
  limitations:
  - Produced concurrently with the primary wave of open-source spoken dialogue models it covers (late
    2024); some systems are described in early form.
  caveats:
  - WavChat's benchmark-mapping table (Table 3, eight benchmarks against eleven capability dimensions)
    is a direct, reusable evaluation-metrics contribution documenting where SDM evaluation infrastructure
    is thin, independent of the survey's non-evaluation taxonomic claims.
- id: "2411.19842"
  entry_date: "2026-07-20"
  year: 2024
  venue: arXiv
  task:
  - codec
  architecture:
  - transformer-enc-dec
  - VAE
  relevance: low
  evidence_role:
  - core_evidence
  current_role: minor
  method_family: []
  claims:
  - claim_id: taae_scaling_improves_quality
    role: supports
    claim: Scaling transformer architecture parameter count in neural audio codecs produces consistent
      quality improvements across objective and subjective metrics.
    source: "§4.6, Table 4"
    evidence: Scaling ablations show consistent, monotonic quality improvement as parameter count grows
      from 240M to 540M to 950M across all evaluated metrics.
    confidence: high
    relevance: low
  - claim_id: taae_fsq_near_perfect_utilization
    role: supports
    claim: Finite scalar quantization achieves near-perfect codebook utilization without explicit utilization
      regularization, simplifying downstream generative modeling compared to RVQ.
    source: "§3.2, §A.8, Table 9"
    evidence: The FSQ bottleneck achieves near-perfect codebook utilization in the ablation without any
      explicit regularization term, unlike RVQ approaches that often require utilization tricks.
    confidence: medium
    relevance: low
  - claim_id: taae_english_only_generalizes_multilingual
    role: refines
    claim: A neural codec trained exclusively on English speech can generalize effectively to unseen languages,
      outperforming multilingual-trained baselines of similar scale on most objective metrics.
    source: "§A.5, Table 7"
    evidence: TAAE trained only on English outperforms Mimi (trained on 7M hours, roughly 70x more data
      including multilingual content) across all seven evaluated languages on most objective metrics.
    confidence: medium
    relevance: low
  - claim_id: taae_perceptual_loss_critical_for_intelligibility
    role: supports
    claim: Perceptual losses derived from self-supervised speech models (WavLM-Large features) are critical
      for achieving intelligible reconstruction at low bitrates, beyond what adversarial and spectral
      reconstruction losses alone provide.
    source: "§3.4, §A.1, Table 3"
    evidence: The finetuning stage replaces reconstruction losses with WavLM-Large perceptual feature-matching
      loss, which the ablation shows is essential for intelligible, high-quality reconstruction.
    confidence: high
    relevance: low
  - claim_id: taae_stft_discriminator_spectral_bias
    role: complicates
    claim: Systematic spectral bias in multi-resolution STFT discriminators, arising from power-of-two
      FFT configurations, causes periodic reconstruction artifacts that disproportionately affect large-capacity
      codec architectures.
    source: "§3.3, §B.5"
    evidence: A per-sample sensitivity analysis motivates using inharmonic FFT sizes (spaced by the golden
      ratio) instead of the standard power-of-two configuration to avoid systematic spectral bias in the
      discriminator.
    confidence: medium
    relevance: low
  limitations:
  - Trained exclusively on 16 kHz English audiobook speech (105k hours); not evaluated on noisy speech,
    overlapping speakers, or environmental audio.
  caveats:
  - None of the paper's headline claims directly concern evaluation methodology; its evaluation-metrics
    relevance is limited to standard use of PESQ/STOI/MUSHRA/MOSNet as reconstruction-quality benchmarks.
- id: "2412.15649"
  entry_date: "2026-07-20"
  year: 2024
  venue: arXiv
  task:
  - SCA
  architecture:
  - autoregressive-LM
  - flow-matching
  relevance: low
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: slamomni_speaker_decoupling_enables_timbre_control
    role: supports
    claim: Decoupling speaker identity from semantic content in spoken dialogue systems enables zero-shot
      timbre control without modifying the language model or adding speaker-conditioning layers.
    source: "§3.4"
    evidence: Because CosyVoice supervised semantic tokens encode only linguistic content, a conditional
      flow-matching vocoder conditioned on a reference audio prompt performs timbre control entirely outside
      the LLM.
    confidence: high
    relevance: low
  - claim_id: slamomni_grouped_tokens_improve_alignment
    role: supports
    claim: Grouping audio tokens to reduce the frequency mismatch between text and speech representations
      substantially improves speech-text alignment and training efficiency in parallel audio-text dialogue
      models.
    source: "§3.3, Table 5"
    evidence: Semantic Group Modeling with G=3 reduces the ASR-WER from 18.23% (G=1) to 4.54%, while converging
      in less than half the GPU-hours.
    confidence: high
    relevance: low
  - claim_id: slamomni_single_stage_matches_multistage
    role: refines
    claim: Single-stage fine-tuning on dialogue data can match or outperform multi-stage pipelines that
      include ASR or TTS pre-training, because modality-specific pre-training degrades instruction-following
      and general knowledge retention.
    source: "§5.3.2, Table 6"
    evidence: Adding an ASR or TTS pre-training stage before dialogue fine-tuning hurts ChatGPT content
      scores by 5 and 12 points respectively while providing no meaningful WER gain.
    confidence: medium
    relevance: low
  - claim_id: slamomni_text_only_history_improves_context
    role: supports
    claim: Replacing audio-token history with text-only history in multi-turn spoken dialogue models improves
      the system's ability to handle longer conversation contexts while leveraging pre-trained LLM in-context
      learning.
    source: "§3.5"
    evidence: Historical Text Prompting stores only text transcriptions of past turns with KV-cache reuse,
      drastically reducing context length relative to interleaved audio-text histories.
    confidence: medium
    relevance: low
  - claim_id: slamomni_sdms_lag_text_llms_on_content
    role: complicates
    claim: Current spoken dialogue models consistently underperform text-only LLMs of similar scale on
      semantic content quality, even after dialogue fine-tuning.
    source: "§5.1, Table 3"
    evidence: Across the evaluated SDMs including SLAM-Omni, semantic content scores from ChatGPT-based
      scoring remain below comparable text-only LLM performance.
    confidence: medium
    relevance: medium
  limitations:
  - Historical text prompting discards all non-verbal information (prosody, emotion, paralinguistic cues)
    from prior dialogue turns, which text-based evaluation metrics do not capture as a quality loss.
  caveats:
  - SLAM-Omni proposes an 8-dataset benchmark spanning understanding, reasoning, and oral conversation
    for evaluating spoken dialogue models, a genuine evaluation-metrics contribution not fully captured
    by its five headline claims, though the benchmark itself is built on synthetic TTS-generated test
    inputs rather than real end-to-end voice interactions.
- id: "2409.09098"
  entry_date: "2026-07-20"
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - transformer-enc-dec
  relevance: high
  evidence_role:
  - evaluation_caution
  - control_evidence
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: accentbox_speaker_accent_entanglement_limits_generalization
    role: supports
    claim: Speaker-accent entanglement in accent identification models causes poor generalisation to unseen
      speakers and limits the utility of accent embeddings for conditioning TTS systems.
    source: "§III.A, §IV.A, Table IV"
    evidence: The CommonAccent baseline achieves 0.96 accuracy on seen speakers but only 0.43 on unseen
      speakers (gap 0.53) with a high Silhouette Coefficient for Speaker Clusters (0.236); GenAID's information
      bottleneck and adversarial training reduce the gap to 0.06 and SCSC to 0.079.
    confidence: high
    relevance: medium
  - claim_id: accentbox_continuous_embeddings_beat_onehot
    role: supports
    claim: Continuous accent embeddings extracted from a speaker-agnostic model provide stronger accent
      conditioning for zero-shot TTS than discrete one-hot accent labels.
    source: "§IV.B, Tables V-VII"
    evidence: AccentBox conditioned on continuous GenAID embeddings achieves higher accent cosine similarity
      than the Accent_ID system using one-hot labels in both inherent and cross accent generation, and
      is preferred by listeners in subjective accent-similarity tests.
    confidence: high
    relevance: low
  - claim_id: accentbox_accent_fidelity_naturalness_tradeoff
    role: complicates
    claim: Zero-shot accent generation introduces a trade-off between accent fidelity and naturalness
      that varies with accent data coverage.
    source: "§IV.B, Table VI"
    evidence: AccentBox shows higher naturalness preference for American accent (60.0% preferred over
      Baseline, p=0.011) but lower preference for Irish accent (33.9%), where limited training data and
      monotonic reference prosody cause degradation.
    confidence: medium
    relevance: medium
  - claim_id: accentbox_objective_similarity_misaligned_with_subjective
    role: complicates
    claim: Objective speaker similarity metrics may not align with subjective listener perception when
      accent and speaker identity are jointly manipulated.
    source: "§IV.B, Tables V-VI"
    evidence: For inherent accent generation, AccentBox achieves lower objective SpkCos (0.8293) than
      Baseline (0.8413) and VALL-E X (0.8605), yet listeners subjectively prefer AccentBox for speaker
      similarity (70.0%, p=0.002 for American accent).
    confidence: high
    relevance: high
  - claim_id: accentbox_standard_zstts_metrics_miss_accent_hallucination
    role: refines
    claim: Standard ZS-TTS evaluations based on naturalness and speaker similarity fail to detect accent
      hallucination, underrepresenting the accent fidelity gap between TTS systems trained predominantly
      on American English and target accented speakers.
    source: "§I, §III.B"
    evidence: Current SOTA ZS-TTS systems including VALL-E X are shown to generate a default American-English
      accent regardless of the target speaker's accent, an artefact not captured by conventional MOS or
      speaker-similarity metrics; accent cosine similarity and subjective accent preference tests are
      introduced as complementary metrics.
    confidence: high
    relevance: high
  limitations:
  - Subjective listening tests are restricted to two accents (American and Irish) due to budget constraints;
    cross-accent and unseen-accent generation results lack systematic subjective evaluation.
  caveats:
  - The paper explicitly declines to evaluate WER, arguing ASR models are biased against accented speech,
    a methodological choice that limits comparability with other work but is itself a documented evaluation-metrics
    caution.
- id: "2025.chipsal-1.18"
  entry_date: "2026-07-20"
  year: 2025
  venue: CHiPSAL 2025
  task:
  - TTS
  - evaluation
  architecture:
  - GAN
  - transformer-enc-dec
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: minor
  method_family: []
  claims:
  - claim_id: nepali_gan_vocoder_lower_latency
    role: supports
    claim: GAN-based vocoders offer substantially lower inference latency than autoregressive vocoders
      when generating speech from mel-spectrograms.
    source: "§5.1, Table 4"
    evidence: Tacotron2 + MelGAN synthesises speech in 0.142s versus 1,320s for Tacotron2 + WaveNet on
      an NVIDIA GTX 960M GPU, owing to MelGAN's parallel waveform generation.
    confidence: high
    relevance: low
  - claim_id: nepali_gan_vocoder_comparable_quality
    role: supports
    claim: GAN-based vocoders achieve comparable or superior perceptual quality to autoregressive vocoders
      in low-resource language TTS.
    source: "§5.2, Tables 5-7; §3.4.2, Figure 2"
    evidence: Tacotron2 + MelGAN outperforms Tacotron2 + WaveNet in MOS on both Nepali test sets (4.245
      vs. 3.65 on OpenSLR; 2.885 vs. 2.31 on male voice data), confirmed by lower MCD on the OpenSLR set.
    confidence: medium
    relevance: medium
  - claim_id: nepali_multispeaker_data_lowers_naturalness
    role: complicates
    claim: Naturalness scores for Nepali TTS systems trained on multi-speaker male voice data are substantially
      lower than those achieved on curated single-accent female corpora.
    source: "§5.2, Tables 5-7"
    evidence: Both Tacotron2 + MelGAN and Tacotron2 + WaveNet score more than 1 MOS point lower on the
      male voice dataset relative to OpenSLR, with the gap persisting across both objective (MCD) and
      subjective (MOS) metrics.
    confidence: medium
    relevance: low
  - claim_id: nepali_low_resource_lags_english_benchmarks
    role: complicates
    claim: Performance of well-studied vocoders on low-resource languages lags behind their English-language
      benchmarks, even when the acoustic model and training procedure are unchanged.
    source: "§5.3, Table 8"
    evidence: Tacotron2 + WaveNet achieves 3.65 MOS on Nepali OpenSLR versus 4.53 MOS reported for WaveNet
      on US English data; Tacotron2 + MelGAN achieves 2.885 MOS on the male voice set, below MelGAN's
      3.49-3.61 MOS on English.
    confidence: medium
    relevance: medium
  limitations:
  - MOS evaluation is based on only 40 participants rating four samples per model, too small a listener
    pool for statistically robust conclusions; no significance tests are reported.
  caveats:
  - Illustrates the value of pairing objective (MCD) and subjective (MOS) metrics in a genuinely low-resource-language
    TTS setting, and documents that vocoder benchmarks calibrated on English do not transfer numerically
    to other languages.
- id: "2025.coling-industry.29"
  entry_date: "2026-07-20"
  year: 2025
  venue: COLING Industry Track
  task:
  - SCA
  architecture: []
  relevance: low
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: carmem_category_bounded_extraction_reduces_redundancy
    role: supports
    claim: Structured, category-bounded memory extraction reduces both redundant and contradictory preference
      storage compared to unstructured extraction in conversational agents.
    source: "§5.2, Table 5"
    evidence: The category-bounded system achieves a 95% reduction in redundant preferences and a 92%
      reduction in contradictory ones on the CarMem maintenance benchmark; hierarchical schema constraints
      prevent out-of-category storage entirely.
    confidence: high
    relevance: low
  - claim_id: carmem_extraction_degrades_with_granularity
    role: complicates
    claim: LLM-based preference extraction from conversational context degrades significantly as category
      granularity increases.
    source: "§5.1, Tables 2-3"
    evidence: Extraction F1 drops from 0.94 at the 4-category main level to 0.78 at the 41-category detail
      level, with over-extraction rates of 12-15% in the In-Schema condition driven by confusion among
      semantically similar categories.
    confidence: high
    relevance: medium
  - claim_id: carmem_structured_metadata_improves_retrieval
    role: supports
    claim: Enriching retrieval embeddings with structured metadata (category label and attribute) substantially
      improves preference recall in personalised spoken conversational agents.
    source: "§5.3, Table 6"
    evidence: Concatenating the detail category and attribute to the sentence-of-preference embedding
      raises top-n retrieval accuracy from 0.75 to 0.87 on CarMem.
    confidence: high
    relevance: low
  - claim_id: carmem_synthetic_benchmarks_overestimate_robustness
    role: complicates
    claim: Synthetic benchmarks evaluated on in-domain synthetic data overestimate system robustness for
      real-world deployment in spoken conversational agents.
    source: "§7"
    evidence: The CarMem dataset is generated by GPT-4 and evaluated against GPT-4o, omitting speech recognition
      errors and multi-preference conversations common in real-world in-car interactions, a limitation
      the authors acknowledge.
    confidence: medium
    relevance: high
  limitations:
  - CarMem contains exactly one preference per conversation and is entirely synthetic, generated and evaluated
    with GPT-class models; no real user data or ASR errors are simulated.
  caveats:
  - CarMem's F1/accuracy metrics evaluate dialogue-memory extraction and retrieval quality rather than
    speech generation quality; its relevance to evaluation-metrics is narrow and adjacent (task-specific
    benchmark design for SCA memory components) rather than core to TTS/VC evaluation.
- id: "2025.coling-main.685"
  entry_date: "2026-07-20"
  year: 2025
  venue: COLING
  task:
  - TTS
  architecture: []
  relevance: low
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: voxpopulitts_naturalistic_corpora_enable_crosslingual
    role: supports
    claim: Large-scale, naturally-spoken multilingual corpora enable cross-lingual zero-shot TTS capabilities
      in models that lack them when trained on single-language or audiobook-derived data.
    source: "§4, Table 2"
    evidence: XTTS_v2 trained on the VoxpopuliTTS large subset (10,000h per language) achieves cross-lingual
      synthesis in EN, FR, and ES with MOS scores of 3.37, 3.52, and 3.31, respectively.
    confidence: medium
    relevance: low
  - claim_id: voxpopulitts_naturalness_intelligibility_tradeoff
    role: complicates
    claim: Naturalness and conversational style in training data trades off against intelligibility metrics
      during TTS model training.
    source: "§4"
    evidence: The authors attribute relatively high WER values (8.25-9.20%) to the naturalness and conversational
      complexity of VoxpopuliTTS, suggesting models trained on naturalistic in-the-wild data face greater
      transcript-fidelity challenges than those trained on clean studio recordings.
    confidence: medium
    relevance: high
  - claim_id: voxpopulitts_asr_confidence_filters_hallucination
    role: supports
    claim: ASR confidence scores provide an effective proxy for filtering hallucinated transcripts in
      automatic speech processing pipelines for TTS data curation.
    source: "§2.2"
    evidence: Per-word logit thresholding (confidence < 0.7 discarded) is used to remove FasterWhisper
      hallucinations, validated as effective in the pipeline design alongside punctuation-based segment
      merging.
    confidence: medium
    relevance: low
  - claim_id: voxpopulitts_quality_scale_tradeoff
    role: complicates
    claim: Quality-stratified corpus subsets introduce a trade-off between data scale and audio quality,
      requiring practitioners to select the appropriate tier for their task.
    source: "§3, Table 1"
    evidence: VoxpopuliTTS is split into small (~1,000h, DNSMOS ~3.87), medium (~5,000h, DNSMOS ~3.71),
      and large (~10,000h, DNSMOS ~3.39) subsets per language, with quality decreasing as scale increases.
    confidence: medium
    relevance: low
  limitations:
  - Does not compare VoxpopuliTTS against Emilia or WenetSpeech4TTS in a controlled training experiment,
    making it impossible to assess whether the pipeline or dataset composition offers measurable advantages
    over alternatives.
  caveats:
  - The WER-naturalness trade-off claim is a genuine evaluation-metrics observation (naturalistic training
    data raising measured WER independent of true intelligibility), but the paper does not isolate or
    further investigate this effect beyond noting it.
- id: "2409.20007"
  entry_date: "2026-07-20"
  year: 2025
  venue: arXiv
  task:
  - SCA
  architecture:
  - transformer-enc-dec
  relevance: low
  evidence_role:
  - core_evidence
  current_role: minor
  method_family: []
  claims:
  - claim_id: desta2_broad_instruction_following_without_tuning_data
    role: supports
    claim: Speech language models can acquire broad instruction-following capabilities over paralinguistic
      attributes without task-specific speech instruction-tuning data.
    source: "§V.A, Table I"
    evidence: DeSTA2 achieves 56.78% overall accuracy on Dynamic-SUPERB across 48 tasks, surpassing all
      prior end-to-end systems that used extensive instruction-tuning, using only LLM-generated speech
      captions with a single generic prompt.
    confidence: high
    relevance: medium
  - claim_id: desta2_constrained_prompts_degrade_general_capability
    role: complicates
    claim: Automated speech instruction-tuning pipelines that use constrained prompts or QA formatting
      may degrade the base LLM's general language capabilities.
    source: "§V.B, Table III"
    evidence: Ablations show training with open-ended QA pairs improves degradation-task performance but
      causes measurable drops in content and semantic dimensions relative to DeSTA2's unconstrained caption-generation
      approach.
    confidence: medium
    relevance: low
  - claim_id: desta2_distributional_alignment_reduces_forgetting
    role: supports
    claim: Distributional alignment between training targets and the base LLM's pretraining regime reduces
      catastrophic forgetting in speech-extended language models.
    source: "§V.D, Table V"
    evidence: DeSTA2 preserves chain-of-thought reasoning and output-format following (e.g., computing
      words-per-second, responding in all-caps on demand), capabilities absent from Qwen2-Audio despite
      its larger training budget.
    confidence: medium
    relevance: low
  - claim_id: desta2_paralinguistic_metadata_drives_performance
    role: refines
    claim: Rich paralinguistic metadata coverage, rather than task diversity, is the primary driver of
      broad spoken language model performance on multi-dimensional speech benchmarks.
    source: "§IV.A, §V.A, Table I"
    evidence: DeSTA2 uses a single captioning task with 12 paralinguistic attributes and outperforms systems
      with diverse task-specific instruction sets on the paralinguistic dimension of Dynamic-SUPERB (43.14%
      vs. 29.21% for Qwen2-Audio).
    confidence: medium
    relevance: medium
  limitations:
  - Speaker verification performance remains below specialized baselines (42.5% vs. 47.9% for Qwen2-Audio
    on the Dynamic-SUPERB speaker dimension); the approach does not address multi-speaker comparison tasks.
  caveats:
  - The evaluation benchmarks (Dynamic-SUPERB, AIR-Bench-Chat) use GPT-4 and GPT-4o as judges; the paper's
    near-tie with Qwen2-Audio on AIR-Bench-Chat (7.16 vs. 7.18) raises unaddressed questions about the
    reproducibility and reliability of LLM-judged speech evaluation.
- id: "2502.04128"
  entry_date: "2026-07-20"
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  relevance: low
  evidence_role:
  - core_evidence
  current_role: minor
  method_family: []
  claims:
  - claim_id: llasa_single_stage_competitive_with_multistage
    role: supports
    claim: Single-stage autoregressive TTS trained with next-token prediction over discrete speech tokens
      is competitive with multi-stage AR+NAR pipelines on intelligibility and speaker similarity in continuation
      mode, though SIM-o gaps remain due to codec acoustic reconstruction limits.
    source: "§3.2.4, Table 3"
    evidence: Llasa-8B-250k direct achieves SIM-r of 0.626 on LibriSpeech test-clean continuation, close
      to the codec resynthesis ceiling (0.638), while WER (2.29%) is competitive with multi-stage baselines.
    confidence: high
    relevance: low
  - claim_id: llasa_scale_and_data_improve_quality
    role: supports
    claim: Both model scale and training data volume independently improve TTS quality across naturalness,
      prosody, and text comprehension, consistent with scaling laws observed in text LLMs.
    source: "§2.3, §3.2.2, Tables 2, 4"
    evidence: WER on test-en drops from 3.71% (1B-80k) to 2.97% (8B-250k) as both model size and training
      data scale up.
    confidence: high
    relevance: low
  - claim_id: llasa_inference_scaling_improves_similarity
    role: supports
    claim: Inference-time compute scaling via speech understanding verifiers can substantially improve
      speaker similarity and emotional expressiveness beyond what train-time scaling alone achieves, at
      the cost of additional inference compute.
    source: "§2.4, §3.2.3, Figure 2, Table 2"
    evidence: The partial-PRM+ORM(WER) search strategy pushes WER to 1.84% and SIM-o to 0.783 for Llasa-8B-250k,
      surpassing all listed baselines on speaker similarity while maintaining competitive WER.
    confidence: high
    relevance: medium
  - claim_id: llasa_prm_beam_search_causes_mode_collapse
    role: complicates
    claim: Pure process reward model beam search for TTS is prone to mode collapse that degrades content
      accuracy (WER), and a hybrid partial-PRM strategy is needed to preserve both speaker similarity
      and intelligibility.
    source: "§3.2.3, Figure 2"
    evidence: Pure PRM beam search is shown to overfit to speaker-similarity scoring at the cost of content
      accuracy, motivating the partial-PRM-then-ORM hybrid strategy that balances both objectives.
    confidence: medium
    relevance: medium
  - claim_id: llasa_single_vq_competitive_but_acoustic_limited
    role: refines
    claim: Single-VQ codecs can achieve intelligibility and naturalness competitive with multi-layer RVQ
      codecs at the same token rate, but acoustic fidelity (speaker similarity) remains the limiting factor
      for single-VQ reconstruction.
    source: "§3.1.2, Table 1"
    evidence: X-codec2 at 50 tokens/second achieves UTMOS 4.13 and WER 2.47%, outperforming BigCodec and
      X-codec at the same token rate, though downstream SIM-o still trails multi-layer RVQ baselines.
    confidence: high
    relevance: low
  limitations:
  - Inference-time compute scaling requires running multiple candidates with auxiliary verifier models,
    increasing latency substantially; the paper does not characterize wall-clock overhead of the search
    strategies.
  caveats:
  - The text-understanding evaluation uses expert-rated 3-point discrete scores adapted from BASE TTS
    without reporting inter-rater reliability, limiting comparability of that portion of the evaluation
    across papers.
- id: "2502.06490"
  entry_date: "2026-07-20"
  year: 2025
  venue: arXiv
  task:
  - TTS
  - VC
  - codec
  architecture: []
  relevance: low
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: token_reconstruction_semantics_tradeoff
    role: complicates
    claim: "Acoustic tokens and semantic tokens occupy fundamentally distinct points in a
      reconstruction-versus-semantics trade-off space, and no single tokenization strategy currently
      achieves strong performance on both axes simultaneously."
    source: "§VI-C, Table I"
    evidence: "General-purpose acoustic tokens (EnCodec Q=8) achieve the best reconstruction (PESQ
      2.83) but weak semantic probing (34.8% intent-classification accuracy), while semantic SSL
      tokens (HuBERT/WavLM Large) achieve the best voice-conversion similarity and intent
      classification but the worst reconstruction (PESQ ~1.15)."
    confidence: high
    relevance: low
  - claim_id: disentanglement_vc_reconstruction_tradeoff
    role: complicates
    claim: "Speaker disentanglement in acoustic tokens enables voice conversion capability but
      consistently reduces reconstruction quality metrics at equivalent bitrates."
    source: "§VI-D, Table I"
    evidence: "Disentangled acoustic tokens (FACodec, LSCodec) reach speaker-similarity (SECS) up to
      0.852 for voice conversion but sacrifice reconstruction PESQ relative to general-purpose
      acoustic tokens."
    confidence: high
    relevance: low
  - claim_id: kmeans_discards_prosody
    role: complicates
    claim: "K-means clustering on SSL model embeddings discards prosody information more severely
      than supervised or internally-quantized semantic tokenizers, making offline clustering
      ill-suited for tasks requiring prosody fidelity."
    source: "§VI-C, §VI-D, Table I"
    evidence: "Semantic SSL tokens produced via k-means clustering (HuBERT Large, WavLM Large) show
      severe prosody loss (GPE ~15-18%) versus ~1% for acoustic tokens, while the supervised S3
      Tokenizer retains better prosody than clustering-based SSL tokens."
    confidence: high
    relevance: medium
  - claim_id: bpe_compression_inversely_related_to_information_density
    role: supports
    claim: "Acoustic byte-pair encoding achieves greater length reduction on tokens with lower
      information density, such as speaker-decoupled and semantic tokens, than on general-purpose
      acoustic tokens."
    source: "§V-A, Figure 8"
    evidence: "Semantic tokens and speaker-decoupled LSCodec tokens compress more under acoustic BPE
      than general-purpose acoustic tokens, confirming an inverse relationship between BPE gain and
      information density."
    confidence: medium
    relevance: low
  - claim_id: single_codebook_low_frame_rate_degradation
    role: complicates
    claim: "Single-codebook tokens at very low frame rates improve compatibility with language model
      generation but currently exhibit measurable quality and intelligibility degradation relative
      to multi-codebook or higher frame-rate alternatives."
    source: "§VIII.1, §VI-C"
    evidence: "The survey's unified comparison shows single-codebook low-frame-rate tokens trade off
      reconstruction fidelity for LM-friendly sequence lengths, a tension the authors identify as an
      open bitrate lower-bound question."
    confidence: medium
    relevance: low
  limitations:
  - "The unified vocoder (CTX-vec2wav) is specifically designed for semantic tokens, which may
    introduce a systematic advantage for semantic token types in the reconstruction experiments, and
    the comparisons are conducted on English data only (LibriTTS, LibriSpeech)."
  caveats:
  - "The survey's unified cross-paradigm evaluation protocol (WER, PESQ, STOI, SECS, GPE across
    roughly 20 token systems) is a genuine evaluation-methodology contribution, but its
    cross-paradigm rankings rest on a single vocoder and English-only training data, so
    generalization of the rankings themselves is untested."
- id: "2025.computel-main.6"
  entry_date: "2026-07-20"
  year: 2025
  venue: ComputEL
  task:
  - TTS
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: quantitative_qualitative_dimensions_diverge
    role: supports
    claim: "Quantitative accuracy ratings and qualitative community feedback reveal distinct
      dimensions of TTS quality that do not co-vary for low-resource Indigenous language systems."
    source: "§6, Table 1"
    evidence: "Participants rated phonetic accuracy highly (11 \"Strongly Agree\" / 8 \"Agree\"
      aggregated across tasks) while rating contextual appropriateness and naturalness much lower,
      and identified natural rhythm and tone modulation as absent from the system."
    confidence: medium
    relevance: high
  - claim_id: small_l1_populations_limit_perceptual_eval
    role: complicates
    claim: "Small L1 speaker populations make standard large-scale perceptual evaluation of
      Indigenous language TTS impractical, limiting how generalisable accuracy findings can be."
    source: "§Limitations"
    evidence: "Five participants constituted the entire available pool; the paper explicitly flags
      sample size as a limitation and uses qualitative PD methods as an alternative to quantitative
      MOS-style evaluation."
    confidence: high
    relevance: high
  - claim_id: adoption_depends_on_more_than_quality
    role: supports
    claim: "Community adoption of TTS tools for language education depends on factors beyond output
      quality, including interface discoverability, voice representation, and alignment with
      cultural pedagogy."
    source: "§7.1, §7.2"
    evidence: "The Ojibwe TTS feature had been available for teacher use but was unknown to
      participants before this workshop; teacher priorities surfaced in the PD sessions included
      voice diversity, accessible UI labelling, and offline download capability for rural use."
    confidence: medium
    relevance: medium
  - claim_id: participatory_design_as_evaluation_method
    role: refines
    claim: "Participatory design workshops can serve as an evaluation method for Indigenous language
      TTS when quantitative listener studies are not feasible, eliciting both usability feedback and
      pedagogical priorities in a single session."
    source: "§4, §8.2"
    evidence: "The combined pre-workshop guided trial and co-design session produced both
      Likert-scale quality ratings and lesson-plan artefacts, with unprompted participant insights
      addressing all four research questions without formal prompting."
    confidence: medium
    relevance: high
  limitations:
  - "The study involves five participants from a single community and a single TTS system; the
    workshop findings, while rich, cannot be generalised quantitatively and are specific to Border
    Lakes Ojibwe and the Anishinaabemodaa platform context."
  caveats:
  - "Because L1 speaker populations for many Indigenous languages are too small to support standard
    large-N perceptual studies, the participatory-design protocol proposed here is best read as a
    complementary evaluation mode alongside, not a replacement for, standard MOS-style listening
    tests."
- id: "2025.nodalida-1.32"
  entry_date: "2026-07-20"
  year: 2025
  venue: NoDaLiDa/Baltic-HLT 2025
  task:
  - TTS
  architecture: []
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: minor
  method_family: []
  claims:
  - claim_id: explicit_annotation_substitutes_disambiguation
    role: supports
    claim: "Explicit phonological annotation in TTS input can substitute for context-dependent
      disambiguation when morphological parsing is unavailable or unreliable."
    source: "§3.2"
    evidence: "The system achieves near-perfect expert recognition of palatalisation and quantity
      contrasts in Estonian homographs by requiring users to supply diacritics rather than relying
      on statistical disambiguation, compared to 50% chance-level performance in standard Estonian
      TTS systems."
    confidence: medium
    relevance: low
  - claim_id: perception_accuracy_alone_insufficient
    role: complicates
    claim: "Perception-based accuracy metrics alone are insufficient for evaluating isolated-word
      TTS quality."
    source: "§3.1, §3.2"
    evidence: "The evaluation uses expert phoneticians (n=8) on a controlled set of 64 homograph
      pairs with no naturalness MOS, no intelligibility test with naive listeners, and no comparison
      to natural speech recordings; the scope of \"very good\" performance claims is therefore
      limited to pronunciation accuracy on a specialist-curated test."
    confidence: medium
    relevance: high
  - claim_id: isolated_word_corpora_yield_citation_prosody
    role: supports
    claim: "Purpose-built isolated-word training corpora enable statistical parametric TTS systems
      to generate citation-form prosody that is inappropriate when systems are trained on continuous
      speech."
    source: "§2.1, §4"
    evidence: "Training on 31,215 professionally recorded isolated Estonian words (10h 36min) from
      CombiDic yields utterance prosody judged suitable for pronunciation training and dictionary
      applications."
    confidence: medium
    relevance: low
  limitations:
  - "The evaluation relies entirely on expert phonetician listeners (n=8) on a controlled homograph
    subset; no naturalness MOS or intelligibility test with naive listeners is reported, and no
    comparison to natural speech is provided."
  caveats:
  - "Because the evaluation only tests binary pronunciation-correctness perception on a
    specialist-curated homograph set, the paper's \"very good\" performance claims should be scoped
    narrowly to disambiguation accuracy rather than treated as evidence of general speech quality."
- id: "2504.08528"
  entry_date: "2026-07-20"
  year: 2025
  venue: arXiv
  task:
  - SCA
  architecture: []
  relevance: medium
  evidence_role:
  - infrastructure
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: content_understanding_and_acoustic_reasoning_separate
    role: complicates
    claim: "Models that excel at content-level spoken language understanding tend to underperform on
      tasks requiring reasoning about acoustic and paralinguistic details, indicating that these
      capabilities require separate optimisation."
    source: "§7.2"
    evidence: "The survey documents that VoiceBench (content-oriented) and MMAU (audio reasoning)
      scores are negatively correlated across surveyed models, indicating that current training
      pipelines do not jointly optimize both capabilities."
    confidence: medium
    relevance: high
  - claim_id: cascaded_and_e2e_complementary_strengths
    role: supports
    claim: "Cascaded speech pipelines and end-to-end spoken language models have complementary
      strengths: cascades are stronger on semantic tasks, while end-to-end models better handle
      speaker and paralinguistic information."
    source: "§7.2"
    evidence: "Cascaded ASR+LLM+TTS systems consistently outperform end-to-end SLMs on semantic and
      content-heavy benchmarks (Dynamic-SUPERB Phase 2, MMAU, VoiceBench) but underperform on
      paralinguistic and speaker-related tasks, a pattern observed across the surveyed literature."
    confidence: medium
    relevance: medium
  - claim_id: joint_speech_llm_training_forgetting_risk
    role: complicates
    claim: "Jointly training a speech encoder with an LLM backbone improves instruction following
      and paralinguistic understanding but introduces risk of catastrophic forgetting of pre-trained
      text capabilities."
    source: "§7.2, §4.3"
    evidence: "The survey notes that end-to-end joint training of speech encoders with LLM backbones
      is reported across surveyed systems to trade instruction-following gains against forgetting of
      the base LLM's text capabilities."
    confidence: low
    relevance: low
  - claim_id: full_duplex_requires_architectural_tradeoffs
    role: complicates
    claim: "Full-duplex spoken dialogue requires architectural support beyond turn-taking
      assumptions, and current approaches (dual-channel and time-multiplexing) each involve
      significant trade-offs in latency, naturalness, and modelling complexity."
    source: "§6"
    evidence: "Reported first-packet latency for full-duplex SLMs spans 200ms (Moshi) to 5,588ms
      (SpeechGPT), a 28x range reflecting fundamentally different dual-channel versus
      time-multiplexing architectural choices (Table 3)."
    confidence: medium
    relevance: low
  - claim_id: tokenisation_choice_determines_coherence_fidelity_tradeoff
    role: supports
    claim: "The tokenisation choice (phonetic tokens versus audio codec tokens) determines the
      trade-off between linguistic coherence and speaker or acoustic fidelity in spoken language
      model outputs."
    source: "§3.1.2"
    evidence: "The survey's taxonomy in §3.1.2 contrasts phonetic (SSL-derived) tokens, which favor
      linguistic coherence, against audio codec tokens, which favor speaker and acoustic fidelity,
      as the two dominant tokenisation families for SLM sequence models."
    confidence: medium
    relevance: low
  limitations:
  - "The survey is primarily a snapshot of English-centric, high-resource SLM research; most SLM
    evaluations use non-overlapping benchmarks, making direct performance comparisons across model
    families impossible, and scaling behaviour for speech+text and speech-aware text LMs is entirely
    unknown."
  caveats:
  - "The negative correlation identified between VoiceBench and MMAU scores is an observational
    meta-finding synthesised across surveyed systems rather than a controlled ablation, so causal
    claims about why these capabilities trade off should be treated cautiously."
- id: "iclr-2025-868masI331"
  entry_date: "2026-07-20"
  year: 2025
  venue: ICLR
  task:
  - TTS
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: hierarchical_requantization_enables_minute_long_ar_tts
    role: supports
    claim: "Reducing the first-layer RVQ frame rate of a neural audio codec through hierarchical
      multi-resolution distillation enables autoregressive TTS to generate minute-long speech with
      stable intelligibility."
    source: "§4, §7.3, Table 3, Table 4"
    evidence: "MReQ-Encodec at 8Hz achieves WER 9.79% on MinutesSpeech test-90s where standard
      Encodec at 8Hz produces 100% WER and naive VALL-E at 48Hz with long training data yields
      16.14%."
    confidence: high
    relevance: low
  - claim_id: low_frame_rate_speaker_similarity_tradeoff
    role: complicates
    claim: "Lowering the codec frame rate in autoregressive TTS improves temporal coherence and
      intelligibility for long utterances but degrades speaker similarity."
    source: "§7.3, Table 4, Table 6"
    evidence: "HALL-E consistently lags VALL-E by 0.025-0.042 SIM points on MinutesSpeech tests; the
      paper attributes this to acoustic information loss when compressing from 48Hz to 8Hz in the
      first RVQ layer."
    confidence: high
    relevance: low
  - claim_id: pretraining_essential_for_hierarchical_codec_tts
    role: supports
    claim: "Post-training from a pre-trained LM checkpoint is essential for hierarchical codec TTS:
      training from scratch without pre-trained weights collapses quality."
    source: "§7.4, Table 10"
    evidence: "Removing VALL-E pre-training from HALL-E increases WER from 9.79% to 49.8% on
      MinutesSpeech test-90s, and removing MReQ pre-training similarly degrades codec
      reconstruction."
    confidence: high
    relevance: low
  - claim_id: eight_hz_instability_threshold
    role: refines
    claim: "The frame rate at which autoregressive speech token generation becomes unstable is
      approximately 8Hz, consistent with average phoneme durations of around 100ms."
    source: "Appendix C.1, Table 18"
    evidence: "Ablation at 4Hz first-layer rate raises WER to 20.07%, while 8Hz yields 9.79%; the
      paper notes that phoneme duration averaging ~100ms corresponds to ~10Hz, making 4Hz
      fundamentally insufficient."
    confidence: medium
    relevance: low
  - claim_id: length_balanced_data_necessary_for_long_form_generalization
    role: supports
    claim: "Length-balanced training data covering the target synthesis duration is necessary for
      autoregressive models to generalize to long-form speech."
    source: "§7.3, Table 4"
    evidence: "VALL-E trained only on segments up to 28 seconds achieves WER 39.77% on test-90s, and
      training on longer data decreases but does not eliminate the gap; HALL-E's 8Hz formulation
      resolves instability that remains even with longer VALL-E training data."
    confidence: medium
    relevance: low
  limitations:
  - "The NAR model still processes audio at full 48Hz resolution, and the paper does not compare
    against streaming or chunked autoregressive synthesis approaches; MinutesSpeech training data is
    entirely English podcast speech, so generalization to other languages or domains is untested."
  caveats:
  - "The paper introduces a Wasserstein-distance-over-duration-distribution metric specifically
    because standard short-form metrics (WER, DNSMOS, UTMOS) do not capture long-form temporal
    coherence, but this metric's own generalizability beyond the MinutesSpeech benchmark is
    untested."
- id: "iclr-2025-cuFzE8Jlvb"
  entry_date: "2026-07-20"
  year: 2025
  venue: ICLR
  task:
  - TTS
  architecture:
  - autoregressive-LM
  - VAE
  relevance: low
  evidence_role:
  - core_evidence
  current_role: minor
  method_family: []
  claims:
  - claim_id: continuous_latents_replace_discrete_quantization
    role: supports
    claim: "Continuous latent representations can replace discrete vector quantization in
      autoregressive TTS without sacrificing generation quality."
    source: "§5.1, Table 1, Table 2"
    evidence: "GMM-LM trained on continuous GMM-VAE encoder features outperforms VALL-E (RVQ-based)
      on WER, speaker similarity, Q-MOS, and S-MOS on LibriSpeech test-clean across all prompt
      lengths, while using 10.3% of VALL-E's parameter count."
    confidence: high
    relevance: low
  - claim_id: longer_prompts_not_uniformly_beneficial
    role: complicates
    claim: "Longer audio prompts do not uniformly improve zero-shot speaker cloning across AR
      architectures."
    source: "§5.1, Table 2"
    evidence: "VALL-E's WER increases monotonically with prompt length (6.04% at 3s, 7.54% at 8s,
      9.68% at 15s), suggesting that simple cross-attention cannot leverage extended speaker context
      in AR decoding; the proposed GMM-LM shows the opposite trend, consistently benefiting from
      longer prompts."
    confidence: medium
    relevance: low
  - claim_id: monotonic_alignment_reduces_wer
    role: supports
    claim: "Strict monotonic alignment substantially reduces word error rate in autoregressive TTS
      compared to standard cross-attention and soft monotonic variants."
    source: "Appendix A.1, Table 6"
    evidence: "Among alignment strategies tested on the same GMM-LM architecture, stochastic
      monotonic alignment with ST-Gumbel achieves WER 2.72% vs. 6.6% for cross-attention alone; even
      monotonic attention with Gumbel (without the stochastic binary forward pass) scores 3.34%."
    confidence: high
    relevance: low
  - claim_id: continuous_representations_improve_ar_independent_of_alignment
    role: supports
    claim: "Continuous speech representations improve downstream autoregressive model performance
      relative to discrete counterparts, independent of the alignment mechanism."
    source: "Appendix A.6, Table 10"
    evidence: "A head-to-head ablation comparing GMM-LM (continuous) against discrete AR models
      (VQ-VAE single codebook and DAC multi-codebook with delayed prediction), all using the
      proposed monotonic alignment, shows GMM-LM achieves WER 2.72% vs. 5.35% and 5.87% for the
      discrete variants."
    confidence: high
    relevance: low
  - claim_id: gaussian_component_count_diminishing_returns
    role: complicates
    claim: "Increasing the number of Gaussian components in continuous AR modeling yields
      diminishing returns and can reduce quality through overfitting."
    source: "§5.4, Table 4, Table 5, Appendix A.3"
    evidence: "GMM-LM with 6 diagonal-covariance Gaussians (WER 2.72%, SIM 0.91) outperforms
      3-Gaussian (WER 2.89%, SIM 0.85), but 10-Gaussian degrades to WER 5.21%, SIM 0.71; the
      6-mixture GMM-VAE also shows worse evaluation-set reconstruction than the 3-mixture model
      despite better training-set fit."
    confidence: medium
    relevance: low
  limitations:
  - "The evaluation compares against VALL-E (2023), a dated AR baseline; stronger AR systems
    available by submission time are not included, and the model is evaluated exclusively on English
    audiobook speech (LibriLight training, LibriSpeech evaluation)."
  caveats:
  - "The GMM-VAE component itself adds 76.5M parameters, partially offsetting the
    parameter-efficiency claim relative to VALL-E's RVQ codec; the total system size (VAE + LM) is
    larger than the headline 51.5M figure suggests when reporting parameter-based comparisons."
- id: "iclr-2025-dGSOn7sdWg"
  entry_date: "2026-07-20"
  year: 2025
  venue: ICLR
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: sub_10hz_token_rate_sufficient_for_slm_semantics
    role: supports
    claim: "Reducing the token rate of speech representations below 10Hz is sufficient to preserve
      semantic content adequate for spoken language modelling, while substantially improving
      training and inference efficiency."
    source: "§5.6, Table 6"
    evidence: "SyllableLM at 6.25Hz, 90M parameters, matches or exceeds TWIST models up to 13B
      parameters on sBLIMP semantic understanding benchmarks, with 30x less training compute and
      4.5x faster inference than an equal-sized TWIST baseline."
    confidence: high
    relevance: low
  - claim_id: loss_surface_encodes_syllabic_boundaries
    role: supports
    claim: "The loss surface of a masked-prediction SSL model encodes latent syllabic segmentation
      boundaries discoverable without additional supervised signal or cross-modal supervision."
    source: "§3.1, Table 1"
    evidence: "LossPred, applied to a frozen HuBERT student-teacher pair without any training,
      achieves F1-50 of 59.6 on syllabic boundary detection, outperforming the
      feature-similarity-based baseline (47.3) while requiring no fine-tuning."
    confidence: high
    relevance: low
  - claim_id: iterative_distillation_sharpens_syllable_organization
    role: supports
    claim: "Iterative student-teacher distillation over pseudo-syllabic boundaries progressively
      sharpens SSL encoder representations toward syllable-level organisation."
    source: "§5.3, Table 2"
    evidence: "SylBoost applied to HuBERT improves boundary detection F1 from 60.1 (LossPred
      initialisation) to 70.2 after two iterations; applying it to Data2Vec2 reaches 73.2, each
      iteration producing a measurable gain over the previous."
    confidence: high
    relevance: low
  - claim_id: low_freq_units_sacrifice_speaker_rate_robustness
    role: complicates
    claim: "Low-frequency speech units that improve semantic modelling efficiency may sacrifice
      robustness to speaker rate variation."
    source: "Appendix A.5, Table 11"
    evidence: "SylBoost unit counts collapse under audio speedups of 0.5x and 0.6x relative to
      original length, performing comparably to SD-HuBERT only at mild speedups (0.8x-0.9x range),
      while showing greater robustness to slowdowns."
    confidence: medium
    relevance: medium
  - claim_id: semantic_units_lose_paralinguistic_info
    role: complicates
    claim: "Units optimised for semantic modelling in audiobook speech may lose paralinguistic
      information, limiting applicability to domains requiring prosodic or tonal fidelity."
    source: "§6"
    evidence: "The authors note that low-frequency SylBoost units may lose paralinguistic features
      such as tone, and the entire evaluation is conducted on audiobook data (LibriSpeech /
      LibriLight); performance on spontaneous or multi-speaker speech is not reported."
    confidence: medium
    relevance: low
  limitations:
  - "All training and evaluation uses English audiobook data (LibriSpeech, LibriLight); the
    interleaved vocoder decoding pipeline is not fully end-to-end and bounds resynthesis bitrate by
    the TWIST tokeniser's own quality ceiling."
  caveats:
  - "The paper's multi-level evaluation framework (syllabic boundary F1, resynthesis WER/CER,
    sWUGGY/sBLIMP/tStoryCloze for language-modelling quality) is a useful template for assessing
    speech-unit tokenizers, but base-encoder quality (Data2Vec2 vs. newer models) is acknowledged as
    a confound in cross-model comparisons."
- id: "iclr-2025-uxDFlPGRLX"
  entry_date: "2026-07-20"
  year: 2025
  venue: ICLR
  task:
  - codec
  architecture:
  - flow-matching
  - GAN
  relevance: high
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: flow_postfilter_matches_gan_subjective_quality
    role: supports
    claim: "A flow matching-based stochastic postfilter conditioned on a deterministic codec's
      decoder output can replace adversarial training while achieving comparable subjective quality
      to a GAN-based codec."
    source: "§5.2, Figure 6"
    evidence: "MUSHRA listening tests (Test A, 11 expert listeners) show no significant difference
      between FlowDec-75m and DAC-75 score distributions at matched bitrates of 4.5 and 7.5 kbit/s."
    confidence: high
    relevance: medium
  - claim_id: coupled_source_distribution_improves_low_budget_quality
    role: supports
    claim: "Coupling the flow matching source distribution to the conditioning signal (rather than
      sampling it independently) removes the need for minibatch optimal-transport solvers and
      improves postfilter sample quality at low inference budgets."
    source: "§5.1, Table 4"
    evidence: "At NFE=6, the proposed coupled formulation achieves FADx100 of 1.62 versus 145.3 for
      the diffusion-based ScoreDec baseline and approximately 29 for an alternative constant-sigma
      flow matching formulation, on the same underlying codec and test set."
    confidence: high
    relevance: low
  - claim_id: perceptual_distance_trades_off_intrusive_distortion
    role: complicates
    claim: "Improving perceptual distance metrics (FAD) via generative postfiltering trades off
      against intrusive distortion metrics relative to discriminator-trained codecs."
    source: "§5.1, Figure 4, Figure 5"
    evidence: "Retrained non-adversarial DAC (NDAC) generally outperforms FlowDec on SI-SDR and
      fwSSNR even though FlowDec achieves better FAD, consistent with the perception-distortion
      tradeoff; the gap is small in the perceptually weighted fwSSNR but clear in SI-SDR."
    confidence: high
    relevance: high
  - claim_id: vanilla_postfilters_fail_at_low_step_budgets
    role: complicates
    claim: "Generative postfilters trained with vanilla score- or flow-matching formulations using a
      fixed-variance or independent prior can fail to converge to the target signal or require
      expensive multi-step inference to reach acceptable quality."
    source: "§5.1, Table 4"
    evidence: "ScoreDec (diffusion-based postfilter) produces unusable audio quality at a reduced
      inference budget of 6 function evaluations (FADx100 = 145.3, SI-SDR = -27.23), only becoming
      competitive at roughly 50 evaluations; a constant-sigma flow matching variant also
      underperforms the proposed coupled formulation at NFE=6."
    confidence: high
    relevance: low
  limitations:
  - "The proposed codec uses a noncausal architecture and is not streaming-capable; the postfilter
    and underlying codec are trained in two separate stages rather than jointly, and listening-test
    sample sizes (11 and 10 raters) are modest for the audio-type breakdown analysis."
  caveats:
  - "The paper explicitly documents a perception-distortion tradeoff: FlowDec improves FAD (a
    perceptual metric) over the non-adversarial DAC baseline while lagging on intrusive distortion
    metrics (SI-SDR, fwSSNR), a caution against relying on any single metric family to characterize
    codec quality."
- id: "2025.findings-naacl.130"
  entry_date: "2026-07-20"
  year: 2025
  venue: NAACL
  task:
  - TTS
  architecture:
  - transformer-enc-dec
  - GAN
  relevance: high
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: unit_vocoders_discard_speaker_information
    role: supports
    claim: "In video-to-speech synthesis, discrete acoustic-unit intermediate representations
      preserve speech content but discard speaker-identifying acoustic detail relative to continuous
      Mel-spectrogram representations."
    source: "§3, Table 1, Figure 1"
    evidence: "With ground-truth input held fixed, Unit-HiFiGAN scores SECS 0.555 / EER 40.52 versus
      HiFi-GAN's SECS 0.894 / EER 22.96, and a Mel-spectrogram visual comparison shows the
      unit-based vocoder output diverges from ground truth in the frequency domain."
    confidence: high
    relevance: medium
  - claim_id: av_pretrained_encoders_supply_speaker_identity
    role: supports
    claim: "Audio-visual pre-trained visual encoders can supply enough speaker-identity information
      from silent video to make explicit speaker embeddings unnecessary in video-to-speech
      synthesis."
    source: "§5.2, Table 4"
    evidence: "DiVISe attains the best or near-best SECS scores on LRS2 (0.609) and LRS3 (0.624)
      among all compared methods, including several that use audio speaker embeddings during
      training or inference (SVTS, Multi-Task)."
    confidence: high
    relevance: low
  - claim_id: objective_gains_dont_transfer_to_subjective_preference
    role: complicates
    claim: "Gains in objective intelligibility metrics from architectural changes do not necessarily
      transfer to subjective audio-quality preference, especially when speaker-identity cues are
      removed from the listening context."
    source: "Appendix C, Table 16"
    evidence: "In an audio-only MOS test without speaker reference images, Unit-HiFiGAN scores
      higher (4.37 +/- 0.11) than the Mel-based HiFi-GAN (4.24 +/- 0.12), the inverse of the
      speaker-matching and intelligibility rankings observed elsewhere in the paper."
    confidence: medium
    relevance: high
  - claim_id: av_pretraining_benefit_uneven_across_components
    role: refines
    claim: "The benefit of audio-visual pre-training for video-to-speech synthesis is not uniform
      across model components; it most strongly aids the component responsible for output
      representation choice rather than uniformly improving all downstream metrics."
    source: "§5.4.2, Table 7"
    evidence: "Removing pre-training degrades DiVISe across all four reported metrics (SECS, EER,
      ESTOI, WER), but for ReVISE removing pre-training mainly hurts intelligibility (WER 36.03 to
      77.24) while leaving speaker metrics comparatively unaffected (SECS 0.5384 to 0.5304)."
    confidence: medium
    relevance: low
  limitations:
  - "Reported WER remains high (35.68-36.24% in the full-resource setting); evaluation is restricted
    to English-only corpora (LRS2, LRS3), and multilingual generalization is untested due to compute
    constraints."
  caveats:
  - "The paper's own subjective MOS test (without speaker-reference context) ranks the proposed
    Mel-based vocoder below the unit-based baseline, the inverse of the speaker-matching and
    intelligibility rankings observed elsewhere, illustrating that evaluation context (presence or
    absence of speaker cues) can flip relative rankings between systems."
- id: "2025.findings-naacl.298"
  entry_date: "2026-07-20"
  year: 2025
  venue: NAACL
  task:
  - TTS
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - infrastructure
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: instruction_tts_amplifies_occupational_gender_stereotypes
    role: supports
    claim: "Instruction-conditioned TTS models reflect and amplify occupational gender stereotypes
      present in training data when interpreting ambiguous style prompts."
    source: "§4.3, Table 1"
    evidence: "Across four Parler-TTS variants and 109 occupations, chi-square analysis shows
      statistically significant overrepresentation of male voices for male-coded occupations and
      female voices for female-coded occupations, with standardized residuals up to 27.2 for
      individual occupation-model pairs."
    confidence: high
    relevance: medium
  - claim_id: prompt_mitigation_causes_compensatory_bias
    role: complicates
    claim: "Prompt-based fairness interventions can introduce compensatory bias rather than
      achieving gender neutrality in instruction-conditioned TTS."
    source: "§4.4, Tables 2-4"
    evidence: "Methods 2 and 3 (adding explicit fairness language to style prompts) frequently
      reverse the bias direction for traditionally masculine occupations across all four models,
      shifting overrepresentation from male to female rather than reducing bias magnitude."
    confidence: high
    relevance: high
  - claim_id: bias_magnitude_varies_across_model_variants
    role: complicates
    claim: "Gender bias magnitude in instruction-guided TTS varies substantially across model
      variants trained on the same data distribution, limiting the generalizability of any single
      model's bias profile."
    source: "§4.3"
    evidence: "Large v1 and Mini v1 share training data but display different bias patterns by
      occupation; Mini v0.1 and Mini Expresso (fine-tuned variant) likewise differ, suggesting model
      scale and fine-tuning interact with bias in ways not fully explained by data alone."
    confidence: medium
    relevance: medium
  - claim_id: bias_eval_requires_baseline_control_groups
    role: supports
    claim: "Evaluating gender bias in TTS requires controlling for the model's inherent gendered
      tendency in baseline generation, separate from the effect of specific style prompts."
    source: "§3.3, §4.2"
    evidence: "Even with an empty style prompt or neutral non-occupational prompts, Parler-TTS
      models generate voices skewed toward a particular gender, necessitating three distinct control
      groups to isolate the effect of occupation-related prompting."
    confidence: high
    relevance: high
  limitations:
  - "The analysis is restricted to Parler-TTS, the only publicly available open-source model family
    accepting free-form style prompts without reference audio at the time of publication; findings
    may not generalise to other model families."
  caveats:
  - "The bias-quantification framework relies on a binary automatic gender classifier and a fixed
    list of 109 occupations, so its residual-based bias metric should be read as an evaluation
    instrument specific to this operationalization of gender rather than a general-purpose fairness
    benchmark."
- id: "2025.findings-naacl.471"
  entry_date: "2026-07-20"
  year: 2025
  venue: NAACL
  task:
  - evaluation
  architecture: []
  relevance: medium
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: prosody_sufficient_above_chance_for_sqa
    role: supports
    claim: "Prosodic cues in natural speech carry information sufficient to partially guide spoken
      comprehension models above chance level."
    source: "§4.1, Table 2"
    evidence: "A WavLM-based SQA model trained and tested on 300Hz low-pass filtered (prosodic
      condition) audio achieves FF1 18.49 on SLUE-SQA-5 test, substantially above the white-noise
      chance baseline of 6.03."
    confidence: high
    relevance: medium
  - claim_id: ssl_models_default_to_lexical_over_prosodic
    role: complicates
    claim: "SSL-based spoken language models do not effectively leverage prosodic information when
      lexical cues are simultaneously available, even when lexical data is a small minority of
      training."
    source: "§4.2, Figure 5"
    evidence: "When only 10% of training data carries lexical information and 90% is prosodic,
      models rapidly shift toward lexical strategies, with lexical and natural evaluation losses
      converging near prosodic-only levels within training."
    confidence: high
    relevance: medium
  - claim_id: tts_synthesized_speech_misrepresents_natural_prosody
    role: complicates
    claim: "The use of TTS-synthesised speech in SQA training data may not capture the prosodic
      characteristics of natural speech, limiting the study of prosody in comprehension models."
    source: "§1, §3.1"
    evidence: "The paper selects SLUE-SQA-5 specifically because prior SQA datasets relied on TTS
      synthesis, whose prosodic properties differ from natural speech; the prosodic condition
      experiments are only valid under the natural-speech assumption."
    confidence: medium
    relevance: high
  - claim_id: prosodic_cues_partially_question_sensitive
    role: refines
    claim: "Prosodic cues in SQA are at least partially question-sensitive rather than globally
      highlighting salient passage regions."
    source: "§4.1, Table 4"
    evidence: "Random pairing of questions and contexts in the prosodic condition reduces FF1 from
      18.49 to 9.77, showing the model's prosodic utilization depends on question-context alignment,
      not only on passage-level salience signals."
    confidence: medium
    relevance: low
  limitations:
  - "The prosodic and lexical conditions cannot achieve perfect information separation (residual
    lexical content leaks through the 300Hz low-pass filter, ~57% WER at that cutoff); the corpus is
    read-aloud speech, so findings may not generalize to spontaneous conversational prosody."
  caveats:
  - "The paper's central motivation for choosing SLUE-SQA-5 over prior SQA datasets is that
    TTS-synthesised speech does not capture natural-speech prosodic characteristics, a caution
    relevant to any evaluation methodology that relies on synthetic speech as a stand-in for natural
    recordings."
- id: "2025.naacl-demo.21"
  entry_date: "2026-07-20"
  year: 2025
  venue: NAACL
  task:
  - SCA
  architecture: []
  relevance: high
  evidence_role:
  - infrastructure
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: cascaded_pipelines_higher_output_quality_than_e2e
    role: supports
    claim: "Cascaded spoken dialogue pipelines built from dedicated, task-specific ASR and TTS
      components can produce substantially higher audio output quality than current end-to-end
      spoken dialogue systems that generate speech directly from audio input."
    source: "§7, Table 4"
    evidence: "On Switchboard Eval 2000, the directly-synthesized speech from the E2E system
      Mini-Omni scores UTMOS 2.88, versus 3.97-4.07 for cascaded pipelines using LJSpeech, LibriTTS,
      or VCTK VITS as the TTS module."
    confidence: medium
    relevance: medium
  - claim_id: e2e_coherent_but_repetitive_across_turns
    role: complicates
    claim: "End-to-end spoken dialogue systems that respond directly to audio input without explicit
      dialogue-context modeling can produce coherent individual responses while still exhibiting
      unnatural conversational behavior such as repeated or templated phrasing across turns."
    source: "§7, Table 3"
    evidence: "The text dialogue evaluation finds that Mini-Omni \"produces highly coherent and
      contextually relevant responses\" but \"exhibits significant overlap in its responses, often
      generating template-like outputs,\" which the authors note could make conversations feel less
      natural in deployment."
    confidence: medium
    relevance: low
  - claim_id: domain_mismatched_asr_produces_misleading_wer
    role: complicates
    claim: "Automatic ASR module benchmarking on conversational telephone speech corpora can produce
      highly misleading word error rates when the candidate ASR model's training domain does not
      match the conversational, disfluent register of the test data."
    source: "§7, Table 2"
    evidence: "An ESPnet LibriSpeech-trained ASR model evaluated on Switchboard Eval 2000 yields a
      WER of 342.2% and CER of 298%, far worse than domain-matched models like OWSM 3.1 (14.4% WER),
      illustrating a severe train/test domain mismatch effect rather than a genuine architecture
      comparison."
    confidence: high
    relevance: high
  - claim_id: transcript_quality_affects_downstream_tts_intelligibility
    role: supports
    claim: "The choice of input transcript quality substantially affects downstream TTS
      intelligibility metrics independent of the TTS model itself, because more grammatically
      well-formed text is easier for TTS systems to synthesize accurately."
    source: "§A.4, Table 8"
    evidence: "Replacing ground-truth (disfluent, spontaneous) Switchboard transcripts with
      LLM-generated text responses as TTS input improves intelligibility across all tested TTS
      models, e.g. LJSpeech VITS WER drops from 16.1% to 6.0% under OWSM 3.1 hypotheses."
    confidence: high
    relevance: high
  - claim_id: dialogue_lm_sensitivity_to_asr_noise_varies_by_size
    role: complicates
    claim: "Text dialogue response generators integrated into a cascaded spoken dialogue pipeline
      are not strongly degraded by upstream automatic speech recognition errors relative to using
      ground-truth transcripts, though smaller language models may be more sensitive to this noise
      than larger ones."
    source: "§A.3, Table 7"
    evidence: "When substituting OWSM 3.1 ASR transcripts for ground-truth transcripts as dialogue
      context, LLaMA-3.2-1B perplexity changes only slightly (48.2 to 47.5) while SmolLM v2-1.7B
      perplexity degrades substantially (113.7 to 285.1)."
    confidence: medium
    relevance: medium
  limitations:
  - "The headline comparative analysis is conducted on a single dataset (11 hours of Switchboard
    Eval 2000) with only one example E2E system (Mini-Omni) and a 4-participant human pilot drawn
    from the author group; findings should be read as a toolkit demonstration rather than a
    generalizable benchmark."
  caveats:
  - "The paper explicitly documents that an ASR model evaluated outside its training domain (a
    LibriSpeech-trained model on Switchboard telephone speech) produces a WER of 342.2%,
    illustrating how domain mismatch can produce misleading automated evaluation numbers unrelated
    to genuine architecture differences."
- id: "2025.naacl-long.242"
  entry_date: "2026-07-20"
  year: 2025
  venue: NAACL
  task:
  - TTS
  architecture:
  - diffusion
  - GAN
  - VAE
  - hybrid
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: compact_latent_enables_one_step_distillation
    role: supports
    claim: "Compressing prosodic variation into a fixed-length discrete latent before diffusion
      modeling makes one-step distillation feasible with a small simulation budget, whereas
      bootstrapping-based distillation methods require significantly more samples or fail entirely
      on variable-length latents."
    source: "§3.3, Appendix A.3, Table 6"
    evidence: "Simulation-based distillation on the compact RVQ prosody latent converges with only
      10k samples, whereas bootstrapping methods like consistency distillation require substantially
      larger sample budgets or fail on variable-length latents, per the ablation in Appendix A.3."
    confidence: medium
    relevance: low
  - claim_id: codec_free_synthesis_competitive_with_codec_dependent
    role: supports
    claim: "Codec-free end-to-end waveform synthesis achieves competitive or superior human-rated
      naturalness and similarity compared to codec-dependent systems, while adversarial training
      with multimodal discriminators compensates for the quantisation reconstruction gap."
    source: "§3.1, §3.4, §4.2, Table 1"
    evidence: "StyleTTS-ZS (LibriLight) achieves CMOS-N 0.00 (best among compared systems) and WER
      0.79%, both without any neural codec, using dual multimodal discriminators to compensate for
      the RVQ prosody latent's reconstruction gap."
    confidence: high
    relevance: medium
  - claim_id: joint_prompt_text_and_global_style_conditioning_gains
    role: supports
    claim: "Jointly encoding the speech prompt and input text into prompt-aligned embeddings
      alongside a global style vector provides larger naturalness and similarity gains than using
      either conditioning alone in zero-shot TTS."
    source: "§4.3, Table 3"
    evidence: "Ablation removing PATE or the global style vector individually drops CMOS-N by 0.24
      and 0.31 respectively relative to the full model."
    confidence: medium
    relevance: low
  - claim_id: automatic_speaker_similarity_diverges_from_human_rating
    role: complicates
    claim: "Automatic speaker embedding similarity metrics can diverge from human-rated similarity
      in zero-shot TTS when codec-free systems are compared to codec-dependent ones, suggesting that
      codec representations may be tuned to neural-network perceptions rather than human perception."
    source: "§4.2, Table 1"
    evidence: "StyleTTS-ZS scores lower automatic speaker-embedding SIM (0.56) than NaturalSpeech 3
      (0.66), yet human CMOS-S shows no statistically significant difference between the two
      systems, indicating the automatic metric and human perception disagree for codec-free versus
      codec-dependent synthesis."
    confidence: medium
    relevance: high
  limitations:
  - "The model is English-only (LibriTTS/LibriLight); the GAN-based acoustic synthesizer does not
    benefit from iterative refinement, and distillation quality degrades at very small sample sizes
    (1k-5k), making the 10k minimum a practical requirement."
  caveats:
  - "The divergence between automatic speaker-similarity metrics and human CMOS-S ratings observed
    for this codec-free system is a caution against treating embedding-based SIM as a universal
    proxy for perceptual speaker similarity across architecturally different (codec vs. codec-free)
    TTS systems."
- id: "2025.naacl-long.464"
  entry_date: "2026-07-20"
  year: 2025
  venue: NAACL
  task:
  - TTS
  - evaluation
  architecture: []
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: minor
  method_family: []
  claims:
  - claim_id: multi_asr_voting_produces_aligned_data
    role: supports
    claim: "Open-pipeline corpus construction using multi-ASR majority voting can produce
      high-quality aligned TTS data even when no single ASR model is reliable."
    source: "§5.2, §C, Table 7"
    evidence: "The ManaTTS pipeline achieved 97.98% chunk acceptance and a manual CER of 0.01 on 100
      sampled chunks, despite relying on Persian ASRs with 10-30% CER on evaluation sets."
    confidence: high
    relevance: low
  - claim_id: open_corpus_absence_is_primary_bottleneck
    role: supports
    claim: "The absence of open-access TTS corpora is a primary bottleneck for speech synthesis in
      low-resource languages."
    source: "§2, Table 1, §6"
    evidence: "All prior Persian TTS datasets are either not publicly available, synthetically
      generated, domain-limited (Quran-only), or under restrictive licenses; ManaTTS is the first to
      address all five criteria simultaneously."
    confidence: medium
    relevance: low
  - claim_id: high_mos_may_reflect_weak_baselines
    role: complicates
    claim: "High MOS scores on a TTS system trained in a low-resource setting may reflect weak
      baselines rather than strong absolute quality."
    source: "§5.1, Table 2"
    evidence: "The proposed Tacotron2 model scores MOS 3.76, outperforming open-access Persian VITS
      and Glow-TTS baselines that score 1.68 and 1.34 respectively; the gap to natural speech (4.01)
      and to GT-spectrogram synthesis (3.86) is non-trivial."
    confidence: medium
    relevance: high
  - claim_id: forced_alignment_needs_mismatch_robustness
    role: refines
    claim: "Forced alignment pipelines for TTS corpus construction require robustness to text-audio
      mismatch when sourcing from naturalistic recordings."
    source: "§3.2.3, Figure 11"
    evidence: "Standard alignment tools (e.g., Aeneas) assume exact text-audio correspondence; the
      custom gapped-interval alignment algorithm accepted 99.39% of chunks via Interval Search and
      handled mismatch cases via Gapped Search, critical for magazine-sourced data where speakers
      censor or self-correct."
    confidence: medium
    relevance: low
  limitations:
  - "The MOS evaluation uses only five utterances and a single speaker, and comparisons are
    restricted to open-access Persian baselines that score far below acceptable naturalness; no
    comparison to current SOTA multilingual TTS systems is reported."
  caveats:
  - "The proposed system's MOS advantage over prior open-access Persian baselines (3.76 vs.
    1.68/1.34) is evaluated against weak comparators, so the finding should be read as establishing
    corpus usability rather than an absolute quality ceiling for Persian TTS."
- id: "2025.naacl-long.484"
  entry_date: "2026-07-20"
  year: 2025
  venue: NAACL
  task:
  - SCA
  - TTS
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: single_stream_representation_matches_doubled_channel
    role: supports
    claim: "A single-stream control-token representation for full-duplex dialogue can match or
      exceed a doubled-channel alternating representation in both naturalness and behavioral
      adherence, while using fewer tokens per unit of audio duration."
    source: "§7.1, §7.2, Table 4, Table 5"
    evidence: "On the same Llama3.2-1B backbone and Behavior-SD training data, the streamlined-unit
      variant scores 4.09 naturalness MOS and 0.58 interruption adherence vs. 3.90 MOS and 1.21
      interruption adherence for the alternating-unit variant."
    confidence: high
    relevance: low
  - claim_id: first_utterance_prompting_improves_speaker_consistency
    role: supports
    claim: "Conditioning a speech-prompted TTS synthesizer on a speaker's very first utterance, in
      addition to their most recent utterance, materially improves long-range speaker identity
      consistency in independently synthesized multi-turn dialogue."
    source: "§7.3, Table 6"
    evidence: "WavLM-Base+ cosine similarity between the prompt and synthesized speech rises from
      0.680 (no prompt) to 0.889 when conditioning on the first utterance alone, and combining
      first-utterance and previous-utterance prompts yields the best transition smoothness (0.872)
      without degrading global identity (0.885)."
    confidence: high
    relevance: low
  - claim_id: text_pretraining_helps_narrative_not_behavior_adherence
    role: complicates
    claim: "Pretraining a dialogue generation model on text-only dialogue before fine-tuning on
      speech-unit sequences improves adherence to narrative content but is not necessary for
      behavioral adherence."
    source: "§7.2, Table 5"
    evidence: "Removing the text-dialogue pretraining stage drops narrative adherence (GPT-4o-rated)
      from 3.11 to 2.80, while behavioral adherence scores for filler words, backchannels, and
      interruptions remain comparable (0.10/0.87/0.64 vs. 0.15/0.87/0.58 with pretraining)."
    confidence: medium
    relevance: low
  - claim_id: cascaded_pipelines_lack_behavioral_context_tracking
    role: complicates
    claim: "Cascaded LLM-then-TTS pipelines for spoken dialogue generation can achieve strong
      narrative coherence and sound quality but struggle to maintain conversational meaningfulness
      because they lack any mechanism to track behavioral context (speaker turn identity,
      backchannel placement) across the full dialogue."
    source: "§7.1, §6.2, Table 3"
    evidence: "GPT-4o and Llama3-70B cascaded baselines achieve the highest narrative adherence
      scores (4.58 and 4.09) but their meaningfulness MOS (3.97 for both) is lower than the proposed
      model (4.04), attributed by the authors to speaker confusion and misplaced backchannels in
      cascaded outputs."
    confidence: medium
    relevance: medium
  limitations:
  - "All quantitative evaluation (human MOS, behavioral adherence, speaker consistency) is conducted
    entirely on Behavior-SD's own synthetic test split, generated by the same LLM/TTS pipeline used
    for training data; no evaluation on real human-recorded dialogue is reported."
  caveats:
  - "The paper introduces a Wasserstein-distance-based behavioral-adherence metric to quantify
    turn-taking, backchannel, and interruption fidelity against ground-truth behavior-feature
    distributions, providing a template for evaluating conversational dynamics beyond standard
    MOS-style naturalness scoring."
- id: "2025.naacl-long.619"
  entry_date: "2026-07-20"
  year: 2025
  venue: NAACL
  task:
  - TTS
  architecture:
  - diffusion
  - transformer-enc-dec
  relevance: high
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: latent_space_diffusion_reduces_steps_without_degradation
    role: supports
    claim: "Applying diffusion in a compact latent space rather than over the full signal
      substantially reduces the number of inference steps required without degrading output quality."
    source: "§6, Table 3"
    evidence: "ProSE achieves state-of-the-art PESQ and STOI on VoiceBank-DEMAND and TIMIT+MUSAN
      using only T=2 diffusion steps, outperforming baselines that require 6-50 steps."
    confidence: high
    relevance: low
  - claim_id: prior_regression_separation_reduces_artifacts
    role: supports
    claim: "Separating prior generation by a diffusion model from regression-based reconstruction
      reduces artifacts caused by direct multi-step denoising in speech enhancement."
    source: "§6, Figure 3"
    evidence: "Waveform and mel-spectrogram comparisons show that DOSE introduces extraneous
      misaligned details absent in clean speech, whereas ProSE does not, because the regression
      model performs the actual mapping."
    confidence: medium
    relevance: low
  - claim_id: diffusion_se_generalization_not_uniform
    role: complicates
    claim: "Diffusion-based speech enhancement methods do not uniformly generalize to real-world
      noise conditions unseen during training."
    source: "§5, Table 4"
    evidence: "Several baselines (DiffuSE, CDiffuSE, SGMSE, DR-DiffuSE, DOSE) show markedly lower
      subjective MOS in mismatched CHiME-4 conditions, suggesting condition-collapse or domain
      shift; ProSE is more robust but still incurs a gap from matched to mismatched conditions."
    confidence: medium
    relevance: medium
  - claim_id: latent_diffusion_efficiency_holds_for_enhancement
    role: refines
    claim: "The computational advantage of latent diffusion over waveform-space diffusion holds for
      speech enhancement tasks, not only for speech synthesis."
    source: "§6, Table 3"
    evidence: "ProSE uses fewer FLOPs (150.78G) than most diffusion-based SE baselines while
      achieving higher PESQ, attributable to running diffusion on a compact N=16, C'=256 latent
      rather than over the full mel-spectrogram or waveform."
    confidence: medium
    relevance: low
  limitations:
  - "Comparisons are restricted to diffusion-based speech-enhancement baselines; no deterministic
    discriminative methods (e.g., Demucs, MANNER) are included, so the \"state-of-the-art\" claim
    applies specifically within the diffusion SE category."
  caveats:
  - "Subjective MOS gains for ProSE over the strongest diffusion baseline (4.45 vs. 3.70 matched,
    3.45 vs. 2.95 mismatched) are proportionally larger than its objective PESQ/STOI gains,
    illustrating that objective distortion metrics can understate perceptual quality improvements in
    speech enhancement."
- id: "2025.naacl-short.69"
  entry_date: "2026-07-20"
  year: 2025
  venue: NAACL
  task:
  - TTS
  architecture:
  - flow-matching
  relevance: high
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: multilingual_training_improves_related_low_resource_langs
    role: supports
    claim: "Multilingual training on typologically related low-resource languages improves TTS
      objective quality over monolingual training for all participating languages."
    source: "§5, Table 2"
    evidence: "Multilingual models consistently outperform monolingual baselines across F0-RMSE,
      MCD, PESQ, and VUV F1 for all four speakers (Ojibwe JJ, NJ; Mi'kmaq MJ; Maliseet AT); MOS for
      Ojibwe JJ improves from 2.71 (monolingual) to 3.42 (multilingual FNet)."
    confidence: high
    relevance: low
  - claim_id: attention_free_mixers_match_self_attention_half_memory
    role: supports
    claim: "Attention-free sequence mixing architectures can match self-attention performance in
      flow-matching TTS while halving GPU memory requirements."
    source: "§5, Tables 2-3"
    evidence: "Hydra achieves objective metrics close to self-attention MatchaTTS across all four
      speakers, and attention-free models consume 2.3-2.5G vs. 4.6G GPU memory at batch size 400
      (float32)."
    confidence: medium
    relevance: low
  - claim_id: subquadratic_complexity_no_latency_gain_at_small_scale
    role: complicates
    claim: "Subquadratic complexity in attention-free architectures does not translate to inference
      latency gains in small TTS models."
    source: "§5, Table 3"
    evidence: "Self-attention has higher throughput than Mamba2, Hydra, and FNet in float32 on an
      A100 at batch size 400, because the model is small enough that architectural complexity
      advantages are not observable."
    confidence: medium
    relevance: low
  - claim_id: mos_unreliable_for_indigenous_communities
    role: complicates
    claim: "Standard MOS-based subjective evaluation protocols can produce unreliable results when
      applied to Indigenous language TTS due to cultural norms around negative judgement."
    source: "§5"
    evidence: "One of two Ojibwe raters assigned the highest score (5/5) to all voices including
      synthetic ones; MOS surveys could not be completed for Mi'kmaq and Maliseet due to lack of
      available raters; the authors argue the task paradigm itself is culturally misaligned."
    confidence: medium
    relevance: high
  limitations:
  - "The custom datasets are not publicly released due to lack of consent from voice donors,
    preventing replication; MOS evaluation is available only for one Ojibwe speaker (two raters),
    making subjective assessment effectively impossible for three of the four speakers."
  caveats:
  - "One of two Ojibwe MOS raters assigned the highest score to all voices regardless of
    naturalness, which the authors attribute to cultural reluctance to judge negatively; this raises
    a caution about the cross-cultural validity of standard MOS listening-test protocols."
- id: "2025.naacl-srw.6"
  entry_date: "2026-07-20"
  year: 2025
  venue: NAACL
  task:
  - TTS
  - codec
  architecture:
  - autoregressive-LM
  - hybrid
  relevance: high
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: nonoverlapping_encoder_improves_lm_and_tts_metrics
    role: supports
    claim: "Non-overlapping encoder receptive fields in RVQ codecs improve downstream language model
      likelihood and end-to-end TTS metrics relative to the standard causal overlapping setup."
    source: "§3.1, Table 1"
    evidence: "Replacing the overlapping causal encoder with a framewise encoder on a DAC-based
      codec reduces LM NLL by more than 8% and improves WER, NISQA, and speaker similarity on
      LibriTTS-R test-clean, despite slightly worsening Mel-L1 reconstruction."
    confidence: high
    relevance: medium
  - claim_id: codec_reconstruction_quality_not_predictive_of_e2e_quality
    role: complicates
    claim: "Better codec audio reconstruction quality does not reliably predict better end-to-end
      speech generation quality in codec-LM systems."
    source: "§4, Table 1"
    evidence: "The framewise encoder achieves higher NLL and better TTS metrics than the causal
      baseline while scoring slightly worse on Mel-spectral L1 reconstruction distance,
      demonstrating that reconstruction-optimised codecs can be suboptimal for downstream LM
      training."
    confidence: high
    relevance: high
  - claim_id: longer_frame_duration_cuts_latency_with_little_degradation
    role: supports
    claim: "Increasing RVQ codec frame duration can substantially reduce codec-LM inference latency
      with little or no degradation in TTS intelligibility and speaker similarity, provided the
      bitrate is held approximately constant by adjusting codebook depth."
    source: "§3.3, §4, Table 2"
    evidence: "Doubling frame duration from 11ms to 22ms yields a 1.94x inference speedup with WER
      4.21%, NISQA 4.42, and speaker similarity 81.0%, matching or improving on the 11ms framewise
      baseline; quadrupling to 44ms accelerates further (3.2-3.8x) but substantially degrades WER
      and speaker similarity."
    confidence: high
    relevance: low
  - claim_id: codebook_level_dropout_approximates_per_level_training
    role: supports
    claim: "A single LM trained with codebook level dropout can efficiently approximate the
      performance profile of training one LM per candidate RVQ level count."
    source: "§3.2, §4, Figure 2"
    evidence: "Training with 90%-full CL drop on a 12-level codec produces per-level performance
      curves for WER, NISQA, and speaker similarity that closely track those of 12 independently
      trained LMs across all Q' values 1-12."
    confidence: medium
    relevance: low
  - claim_id: optimal_rvq_level_count_differs_by_eval_dimension
    role: refines
    claim: "The optimal number of RVQ codebook levels for end-to-end codec-LM TTS differs across
      evaluation dimensions, and more levels are not universally better for end-to-end performance
      even when they monotonically improve codec reconstruction."
    source: "Appendix B, Figure 3"
    evidence: "End-to-end FAD reaches a global minimum at 9 levels before degrading, while WER
      reaches its best at 3-4 levels and NISQA and speaker similarity peak at approximately 9
      levels, in contrast to codec Mel-L1 which improves monotonically."
    confidence: medium
    relevance: high
  limitations:
  - "The evaluation is conducted on a single English TTS corpus (LibriTTS-R test-clean) using
    automatic metrics only (WER, NISQA, cosine speaker similarity); no human listening test is
    reported, and the codec is trained on proprietary in-house podcast data, limiting
    reproducibility."
  caveats:
  - "The paper demonstrates directly that codec Mel-L1 reconstruction quality and end-to-end
    LM-generation quality can diverge (the framewise encoder improves LM likelihood and TTS metrics
    while slightly worsening Mel-L1), a concrete caution against using codec reconstruction fidelity
    as a proxy for downstream generative system quality."
- id: "2025.iwsds-1.11"
  entry_date: "2026-07-20"
  year: 2025
  venue: IWSDS
  task:
  - SCA
  architecture: []
  relevance: medium
  evidence_role:
  - core_evidence
  current_role: minor
  method_family: []
  claims:
  - claim_id: ssl_representations_capture_paralinguistic_attitude
    role: supports
    claim: "Self-supervised speech representations capture sufficient prosodic information to
      classify paralinguistic attitudes from acoustic input alone, without linguistic features."
    source: "§4.1, Table 4, Table 5"
    evidence: "A frozen HuBERT-large model using layer 12 embeddings averaged over time achieves
      macro-F1 of 0.909 on a four-class attitude task in Japanese reading speech, exceeding human
      listener performance of 0.829 on the same data."
    confidence: high
    relevance: low
  - claim_id: reverberation_more_persistent_than_noise
    role: complicates
    claim: "Environmental reverberation poses a more persistent challenge than additive noise for
      paralinguistic recognition models, and is not adequately addressed by speech enhancement
      postprocessing."
    source: "§4.3, Table 7"
    evidence: "Under noisy conditions, MP-SENet speech enhancement recovers macro-F1 from 0.625 to
      0.844; under reverberant conditions, the same model raises F1 only from 0.449 to 0.492,
      attributed to the difficulty of recovering prosodic structure from reverberant speech."
    confidence: medium
    relevance: medium
  - claim_id: augmentation_does_not_close_inference_time_gap
    role: complicates
    claim: "Data augmentation with noise and reverberation during training does not close the
      performance gap when those conditions appear at inference time."
    source: "§4, §4.3, Table 7"
    evidence: "Despite four-fold augmentation using noise (DEMAND, MUSAN, FSD50K) and room impulse
      responses (BIRD) at varying SNR levels, macro-F1 drops from 0.912 (clean) to 0.625 (noisy) and
      0.449 (noisy-reverberant) on held-out test conditions."
    confidence: medium
    relevance: medium
  - claim_id: reading_speech_may_overstate_real_world_performance
    role: complicates
    claim: "Paralinguistic attitude recognition systems trained on reading-speech datasets may
      overstate real-world spoken dialogue performance, where speech production is more spontaneous
      and less controlled."
    source: "§3, §5"
    evidence: "The dataset consists entirely of scripts read with intended attitudes by crowd
      workers and actors; the authors identify generalisation to naturally-occurring speech directed
      at dialogue systems as unresolved future work."
    confidence: low
    relevance: medium
  limitations:
  - "The corpus is a Japanese reading-speech dataset where speakers deliberately produce each
    attitude; it does not reflect the ambiguity or variability of spontaneous human-machine dialogue
    speech, and reverberation robustness remains largely unaddressed by tested enhancement
    postprocessing."
  caveats:
  - "Macro-F1 is benchmarked directly against a human-listener perception baseline (0.829) collected
    on the same test material, providing a calibrated reference point rather than an arbitrary
    threshold for judging model performance."
- id: "2025.iwsds-1.27"
  entry_date: "2026-07-20"
