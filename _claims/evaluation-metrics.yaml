- id: "1703.10135"
  entry_date: "2026-07-20"
  year: 2017
  venue: arXiv
  task:
  - TTS
  architecture:
  - transformer-enc-dec
  relevance: low
  evidence_role:
  - historical_context
  current_role: historical_context
  method_family: []
  claims:
  - claim_id: tacotron_e2e_matches_parametric_mos
    role: supports
    claim: End-to-end TTS models trained from characters with seq2seq attention can match or exceed production
      statistical parametric systems in subjective naturalness without hand-engineered linguistic features.
    source: "§5.2, Table 2"
    evidence: Tacotron reaches MOS 3.82 vs. 3.69 for the production LSTM parametric baseline on an internal
      100-phrase US English test set, despite using Griffin-Lim rather than a neural vocoder.
    confidence: high
    relevance: low
  - claim_id: tacotron_reduction_factor_stability
    role: supports
    claim: Training stability and alignment quality in character-level seq2seq TTS improve substantially
      when the decoder emits multiple output frames per attention step rather than one.
    source: "§3.3"
    evidence: The reduction factor r=2 accelerates attention alignment and convergence relative to single-frame
      decoding, per the paper's ablation discussion.
    confidence: medium
    relevance: low
  - claim_id: tacotron_cbhg_encoder_robustness
    role: supports
    claim: CBHG-style encoders combining multi-scale convolution, highway networks, and bidirectional
      recurrence yield more robust text representations than standard RNN encoders, reducing mispronunciation
      rates.
    source: "§3.2, §5.1"
    evidence: Replacing the CBHG encoder with a 2-layer residual GRU degrades alignment quality and causes
      mispronunciations in the paper's ablation.
    confidence: medium
    relevance: low
  - claim_id: tacotron_postnet_harmonic_structure
    role: supports
    claim: Post-processing networks with access to the full decoded sequence improve harmonic structure
      in predicted spectrograms compared to frame-level-only decoding.
    source: "§3.4, §5.1"
    evidence: Removing the post-processing net eliminates fine harmonic structure in the output, per the
      paper's ablation.
    confidence: medium
    relevance: low
  limitations:
  - Evaluated on a single internal speaker in a controlled studio environment; the internal dataset is
    not released, precluding independent replication of the reported MOS numbers.
  caveats:
  - MOS is collected on an internal, unreleased 100-phrase US English test set with 8 raters (headphones
    only); Griffin-Lim vocoding artefacts are explicitly acknowledged by the authors as depressing the
    reported MOS, making this an early but methodologically thin example of the crowdsourced-MOS protocol
    later standardised across TTS papers.
- id: "1712.05884"
  entry_date: "2026-07-20"
  year: 2017
  venue: arXiv
  task:
  - TTS
  architecture:
  - transformer-enc-dec
  relevance: low
  evidence_role:
  - historical_context
  - evaluation_caution
  current_role: historical_context
  method_family: []
  claims:
  - claim_id: tacotron2_mel_intermediate_bridges_e2e
    role: supports
    claim: A compact low-level acoustic intermediate representation can bridge text encoding and neural
      vocoder synthesis without requiring hand-crafted linguistic features, enabling fully end-to-end
      neural TTS at human-quality levels.
    source: "§2.1, Table 1"
    evidence: Tacotron 2 reaches MOS 4.526 against a ground-truth MOS of 4.582, closing nearly the entire
      gap to human recordings on the internal single-speaker test set.
    confidence: high
    relevance: low
  - claim_id: tacotron2_location_sensitive_attention
    role: supports
    claim: Location-sensitive attention, which incorporates cumulative attention weights as a conditioning
      signal, reduces failure modes such as repetition and omission compared to standard additive attention
      in autoregressive TTS decoders.
    source: "§2.2"
    evidence: The paper adopts location-sensitive attention specifically to address repetition/omission
      failure modes observed with plain additive attention in the original Tacotron.
    confidence: medium
    relevance: low
  - claim_id: tacotron2_prenet_bottleneck_essential
    role: supports
    claim: A pre-net information bottleneck in the autoregressive decoder is essential for stable attention
      alignment during training.
    source: "§2.2"
    evidence: The two-layer 256-unit pre-net bottleneck is described as necessary for stable attention
      learning in the decoder design.
    confidence: medium
    relevance: low
  - claim_id: tacotron2_vocoder_train_on_predicted
    role: supports
    claim: Training the vocoder on predicted rather than ground-truth intermediate features is necessary
      because predicted features are systematically oversmoothed; vocoders trained on clean features degrade
      when exposed to predicted inputs.
    source: "§3.3.1, Table 2"
    evidence: Training WaveNet on ground-truth spectrograms and then synthesising from predicted (oversmoothed)
      spectrograms is the worst configuration in the paper's ablation (MOS 4.362 vs. 4.526 for the matched
      train/inference condition).
    confidence: high
    relevance: low
  - claim_id: tacotron2_mel_shrinks_vocoder_receptive_field
    role: supports
    claim: Neural vocoders conditioned on compact mel spectrograms can operate with substantially smaller
      receptive fields than those conditioned on linguistic features, enabling significant architecture
      simplification without quality loss.
    source: "§3.3.4, Table 4"
    evidence: A 12-layer WaveNet with a 10.5 ms receptive field matches the quality of the full 30-layer
      256 ms model when conditioned on mel spectrograms.
    confidence: medium
    relevance: low
  limitations:
  - All experiments use a single proprietary speaker and internal, unreleased dataset, leaving generalisation
    to multiple speakers, languages, or recording conditions untested.
  caveats:
  - All MOS evaluations use an internal proprietary test set with no reported inter-rater agreement beyond
    confidence intervals, and evaluations across the compared systems (Tacotron 2, WaveNet-linguistic,
    Tacotron/Griffin-Lim, concatenative, parametric) are not conducted directly side-by-side, limiting
    numerical comparisons to relative ordering within this single paper rather than across the literature.
- id: "1904.02882"
  entry_date: "2026-07-20"
  year: 2019
  venue: arXiv
  task:
  - TTS
  architecture: []
  relevance: medium
  evidence_role:
  - infrastructure
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: libritts_24khz_higher_mos_than_16khz
    role: supports
    claim: Training TTS models at 24 kHz rather than 16 kHz produces measurably higher subjective naturalness
      scores even when the underlying model architecture is held constant.
    source: "§5.2, Table 4"
    evidence: GMVAE-Tacotron trained on LibriTTS at 24 kHz outperforms the 16 kHz LibriTTS models by an
      average of 0.175 MOS for female speakers and 0.133 MOS for male speakers.
    confidence: high
    relevance: medium
  - claim_id: libritts_segmentation_effect_confounded
    role: complicates
    claim: Sentence-boundary segmentation and preserved punctuation are theoretically beneficial for TTS
      training, but their effect is difficult to isolate empirically because corpus size and acoustic
      quality covary when comparing corpus versions.
    source: "§5.2"
    evidence: Comparing LibriSpeech (16 kHz, 460h) with LibriTTS (16 kHz, 245h) at matched sampling rate
      shows a 0.15 MOS gain for female speakers but no consistent gain for male speakers, and the authors
      explicitly acknowledge in §5.2 that the corpora differ in size, confounding attribution to text-processing
      quality.
    confidence: medium
    relevance: high
  - claim_id: libritts_snr_filtering_tradeoff
    role: supports
    claim: 'SNR-based filtering of audiobook recordings improves corpus quality at the cost of significantly
      reducing yield: approximately 25% of clean-subset sentences are removed by a 20 dB threshold.'
    source: "§4, Table 3"
    evidence: A WADA-SNR threshold of 20 dB on the clean subsets discards roughly a quarter of candidate
      sentences during corpus construction.
    confidence: high
    relevance: low
  - claim_id: libritts_gender_disparity_in_mos
    role: supports
    claim: Gender disparities in TTS naturalness persist under multi-speaker training on large open corpora,
      with male voices showing larger gaps to natural speech than female voices.
    source: "§5.2, Table 4"
    evidence: The naturalness gap to natural speech is 0.61 MOS for male speakers versus 0.16 MOS for
      female speakers in the LibriTTS 24 kHz evaluation.
    confidence: high
    relevance: medium
  limitations:
  - Experimental validation uses a single model architecture (GMVAE-Tacotron) and evaluates only six held-out
    speakers, limiting the generality of the corpus-quality findings.
  caveats:
  - The paper's own §5.2 confound (corpus size covaries with acoustic quality across the LibriSpeech/LibriTTS
    comparison conditions) is a concrete illustration of how naturalness-MOS comparisons across corpus
    versions can be misattributed to segmentation or punctuation improvements when the underlying training
    data volume also changed.
- id: "2006.04558"
  entry_date: "2026-07-20"
  year: 2020
  venue: arXiv
  task:
  - TTS
  architecture:
  - transformer-enc-dec
  relevance: low
  evidence_role:
  - evaluation_caution
  current_role: historical_context
  method_family: []
  claims:
  - claim_id: fastspeech2_variance_conditioning_closes_gap
    role: supports
    claim: Explicit variance conditioning on pitch, energy, and duration in non-autoregressive TTS reduces
      the information gap between text and speech, enabling quality matching or surpassing autoregressive
      models without autoregressive inference.
    source: "§2.2, §3.2.1, Table 1"
    evidence: FastSpeech 2 reaches MOS 3.83 versus 3.70 for Tacotron 2 and 3.68 for FastSpeech on LJSpeech,
      all evaluated with the same Parallel WaveGAN vocoder.
    confidence: high
    relevance: low
  - claim_id: fastspeech2_mfa_durations_more_accurate
    role: supports
    claim: Phoneme durations derived from forced alignment are substantially more accurate than those
      extracted from autoregressive teacher attention maps, and this accuracy difference directly improves
      output voice quality.
    source: "§3.2.2, Table 5"
    evidence: MFA-derived durations improve CMOS by 0.195 over teacher-extracted durations, and average
      alignment boundary error drops from 19.68 ms to 12.47 ms.
    confidence: high
    relevance: low
  - claim_id: fastspeech2_cwt_pitch_more_natural
    role: supports
    claim: Modeling pitch in the frequency domain via continuous wavelet transform produces more natural
      pitch distributions in synthesized speech than direct time-domain F0 regression.
    source: "§2.3, §3.2.3, Table 3"
    evidence: CWT-based pitch prediction yields a 0.185 CMOS gain over direct time-domain F0 regression
      in the paper's ablation.
    confidence: medium
    relevance: low
  - claim_id: fastspeech2_removing_distillation_simplifies_and_improves
    role: supports
    claim: Removing teacher-student distillation from non-autoregressive TTS training can simultaneously
      simplify the pipeline, reduce training time, and improve output quality relative to the distillation
      approach.
    source: "§1, §3.2.1, Table 2"
    evidence: FastSpeech 2 trains in 17.02 hours versus FastSpeech's 53.12 hours (including teacher training)
      while achieving higher MOS.
    confidence: high
    relevance: low
  - claim_id: fastspeech2s_e2e_feasible_but_pitch_sensitive
    role: refines
    claim: End-to-end parallel text-to-waveform generation is technically feasible but more sensitive
      to variance conditioning than mel-spectrogram-based acoustic models, particularly in the pitch dimension.
    source: "§2.4, §3.2.3, Table 6"
    evidence: Removing pitch conditioning costs 0.245 CMOS for FastSpeech 2 but 1.130 CMOS for the fully
      end-to-end FastSpeech 2s variant.
    confidence: medium
    relevance: low
  limitations:
  - All experiments use a single studio-quality English speaker (LJSpeech); multi-speaker, emotional,
    or cross-lingual generalisation is untested and no speaker similarity metrics are reported.
  caveats:
  - The paper's own Limitations note that the CMOS evaluation protocol is used for ablation comparisons
    rather than the more interpretable absolute MOS, making it harder to assess the magnitude of individual
    component contributions in absolute perceptual terms.
- id: "2010.05646"
  entry_date: "2026-07-20"
  year: 2020
  venue: arXiv
  task:
  - TTS
  architecture:
  - GAN
  relevance: low
  evidence_role:
  - evaluation_caution
  current_role: historical_context
  method_family: []
  claims:
  - claim_id: hifigan_periodicity_necessary_for_quality
    role: supports
    claim: Explicitly modeling periodic structure in speech at multiple timescales is necessary for GAN-based
      vocoders to match the perceptual quality of autoregressive models.
    source: "§2.3, Table 2"
    evidence: Removing the multi-period discriminator causes MOS to collapse from 4.10 to 2.28 in the
      ablation study.
    confidence: high
    relevance: low
  - claim_id: hifigan_discriminator_enables_cpu_realtime
    role: supports
    claim: A compact GAN vocoder can achieve CPU real-time synthesis with quality comparable to autoregressive
      models when discriminator design, rather than generator depth, is the primary quality bottleneck.
    source: "§4.1, Table 1"
    evidence: HiFi-GAN V3 (1.46M params) reaches MOS 4.05 at 13.4x real-time on CPU, comparable to WaveNet
      MoL (MOS 4.02) at a fraction of the compute.
    confidence: high
    relevance: low
  - claim_id: hifigan_generalises_to_unseen_speakers
    role: supports
    claim: Vocoders trained on single-speaker data generalise to unseen speakers when the generator is
      conditioned only on mel-spectrograms, with quality exceeding flow-based and autoregressive alternatives.
    source: "§4.3, Table 3"
    evidence: On VCTK held-out speakers, HiFi-GAN V1 reaches MOS 3.77 versus 3.50-3.52 for WaveNet MoL,
      WaveGlow, and MelGAN baselines.
    confidence: medium
    relevance: low
  - claim_id: hifigan_finetuning_benefits_gan_not_flow
    role: refines
    claim: Fine-tuning a mel-spectrogram vocoder on predicted (rather than ground-truth) spectrograms
      substantially improves end-to-end TTS quality, while flow-based vocoders do not benefit from the
      same adaptation.
    source: "§4.4, Table 4"
    evidence: In the end-to-end Tacotron2 experiment, all fine-tuned HiFi-GAN variants exceed MOS 4.0
      while fine-tuned WaveGlow shows no improvement over its pre-fine-tuning baseline.
    confidence: medium
    relevance: low
  - claim_id: hifigan_discriminator_matters_more_than_generator
    role: supports
    claim: Discriminator architecture choices have a larger impact on GAN vocoder quality than generator
      architecture choices.
    source: "§4.2, Table 2"
    evidence: Adding the multi-period discriminator to MelGAN alone yields +0.47 MOS, larger than the
      differences observed between the three HiFi-GAN generator variants.
    confidence: medium
    relevance: low
  limitations:
  - Evaluation is limited to LJSpeech and VCTK; performance on noisy, spontaneous, or cross-lingual speech
    is not assessed, and streaming/chunk-wise inference latency is not reported.
  caveats:
  - The paper explicitly notes that all MOS evaluations were conducted from scratch via Amazon Mechanical
    Turk and were not taken from other papers, flagging that direct numerical comparison with MOS numbers
    reported elsewhere (different raters, different test sets) should be treated with caution; this is
    a widely-cited methodological caution in the vocoder literature.
- id: "2105.06337"
  entry_date: "2026-07-20"
  year: 2021
  venue: arXiv
  task:
  - TTS
  architecture:
  - diffusion
  - transformer-enc-dec
  relevance: low
  evidence_role:
  - historical_context
  current_role: historical_context
  method_family: []
  claims:
  - claim_id: gradtts_diffusion_matches_ar_with_speed_control
    role: supports
    claim: Diffusion-based acoustic feature generators can match autoregressive TTS naturalness while
      enabling flexible inference-time speed-quality trade-offs not available in single-pass models.
    source: "§4.1, Table 2"
    evidence: Grad-TTS-10 reaches MOS 4.38 versus 4.32 for Tacotron 2 while running roughly twice as fast
      (RTF 0.033 vs. 0.075 on GPU).
    confidence: high
    relevance: low
  - claim_id: gradtts_text_conditioned_prior_reduces_steps
    role: supports
    claim: Initialising reverse diffusion from a text-conditioned noise distribution rather than standard
      Gaussian substantially reduces the number of steps required for high-quality synthesis.
    source: "§3.1, Table 1"
    evidence: A preference test (p < 0.005) shows that even at 50 reverse-diffusion steps, the standard
      N(0,I) variant is significantly worse than Grad-TTS-10 using the text-conditioned N(mu,I) prior.
    confidence: high
    relevance: low
  - claim_id: gradtts_higher_likelihood_than_flow
    role: supports
    claim: Diffusion models can achieve higher data log-likelihood on mel-spectrograms than normalising-flow
      models with larger decoder capacity explicitly trained for maximum likelihood.
    source: "§4.2, Table 2"
    evidence: Grad-TTS achieves a log-likelihood of 0.174 versus 0.082 for Glow-TTS despite Glow-TTS having
      a 3x larger decoder trained explicitly to maximise likelihood.
    confidence: medium
    relevance: low
  - claim_id: gradtts_diminishing_returns_with_steps
    role: supports
    claim: Subjective quality in diffusion-based mel-spectrogram synthesis improves diminishingly with
      reverse-diffusion step count, with most quality gain recovered by 10 steps rather than 1000.
    source: "§4.1, Table 2"
    evidence: Grad-TTS-1000 reaches MOS 4.44 versus 4.38 for Grad-TTS-10, a gain of only 0.06 for a 100x
      increase in reverse-diffusion steps.
    confidence: high
    relevance: low
  limitations:
  - Evaluation is restricted to a single-speaker English dataset (LJSpeech); no multi-speaker, zero-shot,
    or multilingual capability is demonstrated.
  caveats:
  - All MOS comparisons use a shared HiFi-GAN vocoder and report 95% confidence intervals from a consistent
    Amazon Mechanical Turk rater pool (10 evaluators per sample), a methodologically clean single-paper
    comparison, though the FastSpeech baseline used an unofficial reimplementation that the authors acknowledge
    may understate that system's true quality.
- id: "2106.15561"
  entry_date: "2026-07-20"
  year: 2021
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  - flow-matching
  - diffusion
  - GAN
  - VAE
  - transformer-enc-dec
  relevance: low
  evidence_role:
  - historical_context
  current_role: historical_context
  method_family: []
  claims:
  - claim_id: survey_duration_prediction_beats_attention
    role: supports
    claim: The transition from attention-based alignment to explicit duration prediction in non-autoregressive
      acoustic models eliminates word skipping and repeating artefacts while enabling parallel mel-spectrogram
      generation.
    source: "§3.4, Table 11"
    evidence: Table 11 catalogues alignment strategies and identifies explicit duration prediction as
      the only mechanism that simultaneously satisfies locality, monotonicity, and completeness properties
      for robust alignment.
    confidence: medium
    relevance: low
  - claim_id: survey_variation_modeling_granularity_tradeoff
    role: supports
    claim: Modelling variation information (prosody, style, speaker) at multiple granularities from frame
      to utterance level improves expressiveness while fine-grained control remains difficult when relying
      on implicit latent representations.
    source: "§3.5.1, §3.5.3"
    evidence: The survey catalogues expressive TTS approaches (explicit labels, reference encoders, VAE/flow
      variation modeling) across granularity levels from frame to utterance.
    confidence: medium
    relevance: low
  - claim_id: survey_diffusion_vocoders_slow_but_high_quality
    role: supports
    claim: Diffusion-based vocoders achieve high perceptual quality but suffer from slow inference due
      to iterative reverse diffusion, motivating step-reduction methods.
    source: "§2.4, Table 6"
    evidence: Table 6 compares generative model families on simplicity, parallel generation, latent manipulation,
      and likelihood estimation, noting that diffusion models require iterative sampling despite supporting
      likelihood estimation.
    confidence: medium
    relevance: low
  - claim_id: survey_zeroshot_speaker_adaptation_lower_quality
    role: supports
    claim: Zero-shot speaker adaptation that relies solely on a speaker encoder without any fine-tuning
      produces noticeably lower voice quality than few-shot adaptation, particularly for speakers distant
      from the training distribution.
    source: "§3.6.2"
    evidence: The survey's adaptive-TTS section characterises zero-shot speaker-encoder approaches as
      underperforming few-shot fine-tuning-based adaptation, drawing on the contemporaneous literature
      it reviews.
    confidence: low
    relevance: low
  - claim_id: survey_crosslingual_transfer_benefits_lowresource
    role: supports
    claim: Low-resource TTS benefits from cross-lingual transfer because human languages share vocal organs
      and phonetic structures, though phoneme set mismatches require explicit bridging.
    source: "§3.3"
    evidence: The survey's low-resource TTS section discusses cross-lingual transfer and phoneme-set bridging
      techniques drawn from the papers it reviews.
    confidence: low
    relevance: low
  limitations:
  - Coverage horizon is mid-2021, predating neural-codec-based discrete speech tokenisation, LLM-based
    TTS, and flow-matching acoustic models.
  caveats:
  - The survey's own Limitations section explicitly states that evaluation methodology is discussed mainly
    by cataloguing which metrics are used by which systems, rather than analysing metric reliability or
    mutual disagreement, which limits its direct utility as an evaluation-metrics reference beyond serving
    as a historical catalogue of what metrics (MOS, RTF, likelihood) were standard as of 2021.
- id: "2204.02152"
  entry_date: "2026-07-20"
  year: 2022
  venue: arXiv
  task:
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - core_evidence
  current_role: foundational
  method_family: []
  claims:
  - claim_id: utmos_listener_dependent_modeling_improves_accuracy
    role: supports
    claim: Listener-dependent modeling substantially improves MOS prediction accuracy, particularly for
      out-of-domain data with limited labeled samples.
    source: "§3.1.3, Table 2b, Table 3b"
    evidence: Removing listener IDs drops system-level SRCC from 0.972 to 0.931 on the OOD track and degrades
      utterance-level MSE substantially on both tracks.
    confidence: high
    relevance: high
  - claim_id: utmos_contrastive_loss_improves_spearman
    role: supports
    claim: Contrastive pairwise ranking losses improve Spearman correlation in MOS prediction more than
      standard regression losses alone.
    source: "§3.1.2, §4.3, Table 2"
    evidence: The contrastive ranking loss produces a larger gain on the OOD track than the main track,
      particularly for ranking (SRCC) metrics.
    confidence: high
    relevance: high
  - claim_id: utmos_ensemble_stacking_more_robust
    role: supports
    claim: SSL-based features from multiple heterogeneous pretrained models (wav2vec 2.0, HuBERT, WavLM)
      combined via ensemble stacking yield more robust MOS predictions than any single model.
    source: "§3.3, §4.4, Tables 4-5"
    evidence: The full 17-strong + 48-weak learner ensemble achieves utterance-level MSE of 0.165 versus
      0.216 for a single strong learner alone.
    confidence: high
    relevance: high
  - claim_id: utmos_phoneme_input_helps_low_resource_not_indomain
    role: refines
    claim: Phoneme-level linguistic inputs improve MOS prediction robustly in low-resource conditions
      but may not benefit in-domain prediction when sufficient labeled data is available.
    source: "§3.1.4, §4.3, Table 2"
    evidence: 'The phoneme encoder ablation shows mixed results: slightly degrading main-track metrics
      while improving OOD-track metrics.'
    confidence: medium
    relevance: high
  limitations:
  - The model is trained and evaluated exclusively on synthetic speech from Blizzard and Voice Conversion
    Challenges, so its generalisation to modern neural TTS systems (LLM-based, flow-matching) with different
    failure modes is not characterised in this paper.
  caveats:
  - UTMOS became the community's reference automatic MOS predictor following its top ranking on both the
    main and OOD tracks of VoiceMOS Challenge 2022, and its public code release makes it the most frequently
    reused automatic speech-quality proxy in downstream TTS evaluation pipelines, directly shaping how
    the field substitutes automatic scoring for costly human listening tests.
- id: "2206.04658"
  entry_date: "2026-07-20"
  year: 2022
  venue: arXiv
  task:
  - TTS
  architecture:
  - GAN
  relevance: low
  evidence_role:
  - evaluation_caution
  current_role: minor
  method_family: []
  claims:
  - claim_id: bigvgan_periodic_activation_improves_ood_robustness
    role: supports
    claim: Periodic activation functions with learnable frequency parameters improve GAN vocoder robustness
      to out-of-distribution audio, including unseen recording environments, languages, and non-speech
      signals.
    source: "§3.2, §4.5, §4.6"
    evidence: On out-of-distribution real-world Korean speech, BigVGAN reaches SMOS 4.38 versus 4.21 for
      HiFi-GAN.
    confidence: high
    relevance: low
  - claim_id: bigvgan_antialiasing_reduces_artifacts
    role: supports
    claim: Anti-aliasing via low-pass filtering around nonlinear activations reduces high-frequency artifacts
      in neural vocoders and is complementary to periodic inductive bias.
    source: "§3.3, §4.7, Table 4"
    evidence: Ablation shows removing the low-pass filter degrades OOD performance, and removing both
      filter and Snake activation degrades it further still, with differences statistically significant
      (p<0.01).
    confidence: high
    relevance: low
  - claim_id: bigvgan_scaling_benefits_with_stabilization
    role: supports
    claim: GAN vocoders benefit significantly from scaling model capacity when paired with appropriate
      architectural improvements and training stabilisation techniques, whereas naive scaling without
      those changes leads to early collapse.
    source: "§3.4, §4.7"
    evidence: Scaling from 14M to 112M parameters requires gradient clipping at global norm 10^3 and a
      halved learning rate (1e-4) to avoid early training collapse caused by amplified discriminator gradients.
    confidence: medium
    relevance: low
  - claim_id: bigvgan_smos_more_sensitive_than_mos
    role: refines
    claim: Similarity MOS (SMOS), which requires direct comparison with ground truth, is a more sensitive
      evaluation metric than standard MOS for distinguishing speaker fidelity under diverse and out-of-distribution
      conditions.
    source: "§4.3"
    evidence: BigVGAN-base (14M params) already outperforms HiFi-GAN on SMOS (+0.05) even though the MOS
      gap between these small models is comparatively less diagnostic, and the SMOS gap over HiFi-GAN
      widens further under noisy and OOD conditions (e.g. +0.13 SMOS on real-world Korean).
    confidence: high
    relevance: high
  - claim_id: bigvgan_diverse_training_data_necessary
    role: supports
    claim: Training on diverse, multi-condition speech data (including noisy recordings) is a necessary
      complement to architectural improvements for achieving universal vocoding performance.
    source: "§4.7, Table 5"
    evidence: All models are trained on the full LibriTTS train set including the noisy train-other-500
      subset, which the ablations in Table 5 identify as contributing to OOD robustness.
    confidence: medium
    relevance: low
  limitations:
  - Trained and evaluated on 24 kHz audio only; generalisation to 44.1 kHz or 48 kHz audio common in music
    and broadcast is not tested.
  caveats:
  - The claim that SMOS is more diagnostic than standard MOS for speaker fidelity under OOD conditions
    is a direct, generalisable evaluation-metrics finding, though the paper's own MOS evaluations use
    native English-speaking Mechanical Turk workers even for non-English and OOD test conditions, which
    may introduce evaluator-language bias into the reported scores.
- id: "2210.13438"
  entry_date: "2026-07-20"
  year: 2022
  venue: arXiv
  task:
  - codec
  architecture:
  - GAN
  relevance: low
  evidence_role:
  - infrastructure
  current_role: historical_context
  method_family: []
  claims:
  - claim_id: encodec_msstft_discriminator_sufficient
    role: supports
    claim: A multi-scale STFT discriminator alone is sufficient for perceptual quality in neural audio
      codecs, removing the need for waveform-domain discriminators.
    source: "§4.5.1, Table 2"
    evidence: The MS-STFT-only discriminator achieves MUSHRA 77.5, close to the MS-STFT+MPD combination
      (79.0) and substantially better than the prior MSD+Mono-STFT setup (62.9).
    confidence: high
    relevance: low
  - claim_id: encodec_gradient_balancer_stabilizes_training
    role: supports
    claim: Gradient balancers that normalise loss contributions by expected gradient magnitude substantially
      stabilise training when combining reconstruction, adversarial, and commitment losses with widely
      varying natural scales.
    source: "§3.4, Table A.4"
    evidence: The gradient balancer decouples per-loss weight selection from the natural gradient scale
      of each term, avoiding per-loss scale tuning.
    confidence: medium
    relevance: low
  - claim_id: encodec_variable_bitrate_diminishing_returns
    role: supports
    claim: Residual vector quantization supports variable-bitrate operation from a single model by varying
      the number of active codebooks at inference, with each additional codebook yielding diminishing
      quality returns.
    source: "§3.2, Table 1"
    evidence: A single EnCodec model operates across 1.5-24 kbps by selecting the number of active RVQ
      codebooks at inference, per Table 1.
    confidence: high
    relevance: low
  - claim_id: encodec_entropy_coding_reduces_bitrate
    role: supports
    claim: Auxiliary Transformer language models over RVQ codes can reduce effective bitrate by 25-40%
      through entropy coding without perceptual quality degradation, at the cost of increased latency.
    source: "§3.3, §4.5"
    evidence: Effective bitrates drop from 3 kbps to 1.9 kbps and from 6 kbps to 4.1 kbps with entropy
      coding while MUSHRA quality is preserved.
    confidence: high
    relevance: low
  - claim_id: encodec_neural_outperforms_dsp_at_low_bitrate
    role: supports
    claim: Neural audio codecs outperform traditional DSP codecs at low bitrates across both speech and
      music domains, with the quality gap widening as bitrate decreases.
    source: "§4.5, Table 1, Figure 3"
    evidence: At 6 kbps, EnCodec reaches MUSHRA 83.1 for clean speech versus 30.1 for Opus at the same
      bitrate.
    confidence: high
    relevance: low
  limitations:
  - No evaluation of robustness to codec chaining (encode-decode-re-encode) or downstream generation-task
    degradation from quantization artefacts is provided.
  caveats:
  - The paper describes a detailed MUSHRA evaluation protocol (crowd-sourced annotation with explicit
    outlier filtering) that has become a methodological reference point for subsequent codec evaluation,
    though none of its own claims directly address metric validity or cross-paper comparability.
- id: "2212.04356"
  entry_date: "2026-07-20"
  year: 2022
  venue: arXiv
  task:
  - evaluation
  architecture:
  - transformer-enc-dec
  relevance: medium
  evidence_role:
  - evaluation_caution
  - infrastructure
  current_role: influential
  method_family: []
  claims:
  - claim_id: whisper_weak_supervision_generalizes_ood
    role: supports
    claim: Weakly supervised ASR training at sufficient scale produces models that generalise robustly
      across recording conditions, speakers, and languages without dataset-specific fine-tuning.
    source: "§3.3, Table 2"
    evidence: Whisper Large achieves 55.2% lower average WER than a matched wav2vec 2.0 Large model across
      14 held-out OOD datasets, despite matching it on LibriSpeech test-clean.
    confidence: high
    relevance: medium
  - claim_id: whisper_indomain_benchmarks_overstate_robustness
    role: supports
    claim: Models evaluated solely on in-distribution benchmarks can appear superhuman while remaining
      significantly below human performance out-of-distribution, indicating that benchmark-focused evaluation
      overstates robustness.
    source: "§3.3, Figure 2"
    evidence: Whisper's LibriSpeech test-clean WER (2.7%) roughly matches 2019 supervised state-of-the-art,
      but the paper's central empirical contribution is showing that in-distribution WER alone dramatically
      understates the robustness gap relative to genuinely out-of-distribution test conditions.
    confidence: high
    relevance: high
  - claim_id: whisper_multitask_hurts_small_helps_large
    role: complicates
    claim: Multitask and multilingual joint training introduces negative transfer in small models but
      confers benefits at large scale.
    source: "§4.3, Figure 9"
    evidence: Multitask/multilingual joint training degrades performance in small models but large multitask/multilingual
      models slightly outperform English-only counterparts of the same size.
    confidence: medium
    relevance: low
  - claim_id: whisper_wer_scales_with_perlanguage_data
    role: supports
    claim: Per-language zero-shot ASR performance scales predictably with per-language training data,
      with WER roughly halving for every 16-fold increase in supervision hours.
    source: "§3.4, Figure 3"
    evidence: Figure 3 shows a roughly log-linear relationship between per-language training hours and
      zero-shot WER across Whisper's 99 supported languages.
    confidence: medium
    relevance: low
  limitations:
  - Long-form transcription remains unreliable without explicit decoding heuristics (beam search, temperature
    fallback, timestamp constraints) to prevent repetition loops and hallucination.
  caveats:
  - 'Whisper''s significance to this concept is primarily as an evaluation instrument rather than a speech-synthesis
    system: its public multi-size release (39M-1550M params) makes automatic intelligibility scoring (WER
    on synthesized speech) practically accessible for downstream TTS evaluation pipelines, and its own
    text-normalisation procedure was developed iteratively against Whisper''s transcription style, which
    the authors flag (§4.4) as a risk of overfitting the normalizer to Whisper-specific output patterns
    when using it as a WER scoring tool.'
- id: "2301.11325"
  entry_date: "2026-07-20"
  year: 2023
  venue: arXiv
  task: []
  architecture:
  - autoregressive-LM
  relevance: low
  evidence_role:
  - evaluation_caution
  current_role: minor
  method_family: []
  claims:
  - claim_id: musiclm_hierarchical_ar_enables_longform_coherence
    role: supports
    claim: Hierarchical autoregressive modeling over semantic and acoustic tokens enables long-form music
      generation (several minutes) with temporal coherence at 24 kHz.
    source: "§3.2, §6"
    evidence: MusicLM generates multi-minute coherent music by advancing generation with a 15-second stride
      using the previous segment as a prefix.
    confidence: medium
    relevance: low
  - claim_id: musiclm_joint_embedding_substitutes_paired_data
    role: supports
    claim: A joint audio-text embedding space can substitute for paired text-audio supervision at training
      time, allowing generative models to be trained on audio-only corpora and conditioned on text at
      inference.
    source: "§3.1, §4.2"
    evidence: MusicLM trains on a 280,000-hour audio-only corpus using MuLan audio embeddings and substitutes
      MuLan text embeddings only at inference.
    confidence: high
    relevance: low
  - claim_id: musiclm_semantic_tokens_improve_text_adherence
    role: supports
    claim: Semantic token intermediaries improve adherence to text descriptions in hierarchical audio
      generation beyond what direct acoustic token prediction achieves.
    source: "§5, Table 1"
    evidence: Removing the semantic modeling stage preserves FAD but degrades KLD (1.01 to 1.05) and MCC
      (0.51 to 0.49) in the paper's ablation.
    confidence: medium
    relevance: low
  - claim_id: musiclm_fad_and_mcc_are_complementary_metrics
    role: refines
    claim: For text-conditioned music generation, perceptual audio quality (FAD) and semantic text alignment
      (MCC, KLD) are complementary evaluation axes that do not always correlate with each other.
    source: "§4.4, Table 1"
    evidence: The semantic-modeling-stage ablation shows FAD unaffected while MCC and KLD both degrade,
      demonstrating that these metrics capture distinct failure modes.
    confidence: medium
    relevance: medium
  - claim_id: musiclm_low_exact_memorization_higher_approximate
    role: supports
    claim: Large autoregressive audio LMs trained on extensive unlabeled corpora memorize only a small
      fraction of training sequences exactly, but approximate semantic matches affect a higher proportion
      of generated outputs under targeted prompting.
    source: "§5, Figure 3"
    evidence: Exact token matches remain below 0.2% even with 10-second training-audio prompts, while
      approximate (optimal-transport-based) matches remain below 1%.
    confidence: medium
    relevance: low
  limitations:
  - The 280,000-hour training corpus is proprietary and unreleased, and model weights are not released,
    limiting reproducibility.
  caveats:
  - MCC, one of the paper's two primary text-adherence metrics, is computed using MuLan itself, the same
    model used for conditioning; the paper's own Limitations acknowledge this circularity biases the metric
    in MusicLM's favour relative to baselines that do not use MuLan representations, a concrete illustration
    of a self-referential evaluation-metric validity problem. MusicLM is a music-generation system rather
    than a speech-generation system, so its contribution to this concept is limited to this generalisable
    evaluation-methodology lesson rather than to TTS-specific evidence.
- id: "2301.12503"
  entry_date: "2026-07-20"
  year: 2023
  venue: ICML
  task: []
  architecture:
  - diffusion
  - VAE
  relevance: low
  evidence_role:
  - evaluation_caution
  current_role: minor
  method_family: []
  claims:
  - claim_id: audioldm_latent_diffusion_efficient
    role: supports
    claim: Latent diffusion models operating on compressed mel-spectrogram representations achieve significantly
      better computational efficiency than diffusion models applied in raw waveform or full-resolution
      spectrogram space, without sacrificing generation quality.
    source: "§3.2, §G, Table 4"
    evidence: AudioLDM-S trains on a single RTX 3090 while surpassing DiffSound (trained on 32 V100s)
      and AudioGen (64 A100s) on objective metrics.
    confidence: high
    relevance: low
  - claim_id: audioldm_audio_embedding_conditioning_outperforms_text
    role: supports
    claim: Conditioning generative models on audio embeddings from a contrastive audio-text model during
      training, then substituting text embeddings at inference, can outperform direct text-conditioned
      training when paired audio-text data is limited or noisy.
    source: "§5.1, Table 3"
    evidence: Table 3's ablation shows audio-embedding-conditioned training consistently outperforms text-embedding-conditioned
      training across all model sizes and data scales, even with augmented text data.
    confidence: high
    relevance: low
  - claim_id: audioldm_zeroshot_manipulation_without_finetuning
    role: supports
    claim: Latent diffusion models trained for audio generation can perform zero-shot manipulation tasks
      (inpainting, super-resolution, style transfer) by controlling the reverse diffusion starting point,
      without task-specific fine-tuning.
    source: "§4, Table 5"
    evidence: AudioLDM-L achieves LSD 0.98 on VCTK zero-shot super-resolution, outperforming the AudioUNet
      baseline (1.32) without any task-specific fine-tuning.
    confidence: medium
    relevance: low
  - claim_id: audioldm_quality_scales_with_data_more_than_size
    role: supports
    claim: Text-guided audio generation quality scales with both model size and training data volume,
      but data scale provides larger gains than model size at comparable compute.
    source: "§5.1, Table 1"
    evidence: Table 1's scaling comparison shows larger gains from increased training data than from increased
      model size at matched compute.
    confidence: medium
    relevance: low
  limitations:
  - AudioLDM operates at 16 kHz, limiting music generation fidelity, and all pipeline modules (VAE, LDM,
    vocoder) are trained separately, creating potential train-time misalignment.
  caveats:
  - The paper's own Limitations note that classifier-free guidance scale interacts with the FD and FAD
    metrics in non-trivial ways (a guidance scale of 3 is optimal for FD but not FAD), demonstrating that
    the optimal operating point for a generative system depends on which evaluation metric is used to
    select it. AudioLDM is a general-audio generation system rather than a speech-specific one, so its
    relevance to this concept is limited to this generalisable metric-divergence lesson.
- id: "2305.02765"
  entry_date: "2026-07-20"
  year: 2023
  venue: arXiv
  task:
  - codec
  architecture:
  - GAN
  - VAE
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: hificodec_grvq_improves_per_codebook_quality
    role: supports
    claim: Grouping residual vector quantization into parallel chains rather than a single sequential
      chain improves reconstruction quality per codebook, enabling competitive fidelity with fewer total
      quantizers.
    source: "§3.3, Table 1"
    evidence: HiFi-Codec with 4 codebooks reaches PESQ 3.63/STOI 0.95, outperforming a 12-codebook EnCodec
      (PESQ 3.21/STOI 0.95).
    confidence: high
    relevance: low
  - claim_id: hificodec_codebook_count_constrains_generation
    role: supports
    claim: The burden that codec codebook count imposes on downstream generation models is a practical
      constraint that drives codec architecture choices independently of raw reconstruction quality.
    source: "§1 Introduction, §3.3"
    evidence: The paper motivates GRVQ explicitly by the sequence-length burden that additional RVQ codebooks
      impose on downstream autoregressive generation models.
    confidence: medium
    relevance: low
  - claim_id: hificodec_objective_metrics_insufficient_alone
    role: complicates
    claim: Objective speech quality metrics such as PESQ and STOI are insufficient alone to characterise
      codec reconstruction quality, and subjective evaluation is necessary but often omitted in codec
      research.
    source: "§6 Limitations"
    evidence: The paper's own §6 states verbatim that subjective evaluation is always the best choice
      but was omitted from this study, and that all quality comparisons rest solely on PESQ and STOI.
    confidence: high
    relevance: high
  - claim_id: hificodec_open_toolkit_needed_for_reproducibility
    role: supports
    claim: Publicly available training code and pre-trained baselines for neural audio codecs are necessary
      for reproducible research, as previously these were unavailable for EnCodec and SoundStream.
    source: "§5 Conclusion, §6 Limitations"
    evidence: The paper releases AcademiCodec, an open-source toolkit providing training code and pre-trained
      models for EnCodec, SoundStream, and HiFi-Codec.
    confidence: medium
    relevance: low
  limitations:
  - The paper does not validate GRVQ on downstream generation tasks; the claim that fewer codebooks reduce
    burden on generation models is motivated but not experimentally demonstrated with TTS or audio-LM
    experiments.
  caveats:
  - 'The paper''s explicit acknowledgment that it omits subjective (MOS) evaluation entirely, relying
    only on PESQ and STOI, is a direct and self-critical evaluation-metrics data point: the authors themselves
    flag that objective metrics alone are insufficient to characterise codec quality, a caution echoed
    across the codec literature.'
- id: "2305.09636"
  entry_date: "2026-07-20"
  year: 2023
  venue: arXiv
  task:
  - TTS
  - SCA
  architecture:
  - autoregressive-LM
  relevance: low
  evidence_role:
  - evaluation_caution
  current_role: minor
  method_family: []
  claims:
  - claim_id: soundstorm_parallel_decoding_two_orders_faster
    role: supports
    claim: Parallel, iterative masked decoding adapted to RVQ structure enables acoustic token generation
      two orders of magnitude faster than autoregressive generation at matched perceptual quality.
    source: "§4.3, Figure 3"
    evidence: SoundStorm generates 30 seconds of audio in 0.5 seconds on a TPU-v4, matching AudioLM's
      DNSMOS quality (4.01 vs 3.93 unprompted).
    confidence: high
    relevance: low
  - claim_id: soundstorm_nar_better_longform_consistency
    role: supports
    claim: Non-autoregressive RVQ-level-by-level decoding maintains better voice and acoustic consistency
      over long sequences than autoregressive chunk-and-prompt approaches.
    source: "§4.2, Table 1, Figure 2"
    evidence: For 20-30 second segments, acoustic consistency (cosine similarity) is 0.91 for SoundStorm
      versus 0.86 for AudioLM's slide-and-prompt strategy.
    confidence: medium
    relevance: low
  - claim_id: soundstorm_fine_rvq_conditionally_independent
    role: supports
    claim: Fine-level RVQ tokens are conditionally independent given coarser tokens and can be decoded
      greedily in a single pass without measurable quality loss.
    source: "§3.3, §4.3"
    evidence: Additional iterations on finer RVQ levels yield no statistically significant improvement
      over single-pass greedy decoding, per the ablation.
    confidence: medium
    relevance: low
  - claim_id: soundstorm_confidence_decoding_gain_coarsest_level
    role: refines
    claim: Confidence-based iterative decoding provides a meaningful quality gain over greedy decoding
      at the coarsest RVQ level, but additional iterations at finer levels yield no significant improvement
      for speech.
    source: "§4.3, Figure 4"
    evidence: 16 iterations at the first RVQ level provide approximately a 0.1-0.2 quality gain over greedy
      decoding, per Figure 4.
    confidence: medium
    relevance: low
  - claim_id: soundstorm_enables_realtime_dialogue_synthesis
    role: supports
    claim: Coupling a text-to-semantic token model with an efficient acoustic generator enables real-time
      synthesis of controllable multi-speaker dialogue at 30-second horizons.
    source: "§5"
    evidence: The full pipeline (ByT5 text-to-semantic model plus SoundStorm) generates 30 seconds of
      multi-speaker dialogue in 2 seconds.
    confidence: medium
    relevance: low
  limitations:
  - The 350M acoustic model trained on LibriLight is English-only, with no multilingual evaluation presented.
  caveats:
  - The paper's own Limitations note that audio quality comparisons rely on a DNSMOS-style automatic estimator
    rather than fresh human listening tests, and the subjective baseline is carried over from earlier
    AudioLM papers rather than re-run under matched conditions, so direct perceptual comparisons between
    SoundStorm and AudioLM by human raters are not reported.
- id: "2305.15255"
  entry_date: "2026-07-20"
  year: 2023
  venue: arXiv
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: low
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: spectron_continuous_specs_competitive_with_discrete
    role: supports
    claim: Continuous spectrogram representations can support spoken language modelling at quality levels
      competitive with discrete-token systems, without requiring a separate quantisation stage.
    source: "§4.2.1, §4.2.2, Tables 1-3"
    evidence: Spectron (350M) reaches log-perplexity 126.08, outperforming AudioLM 3-RVQ (138.96) and
      12-RVQ (140.28) on LibriSpeech speech continuation.
    confidence: high
    relevance: low
  - claim_id: spectron_joint_supervision_preserves_world_knowledge
    role: supports
    claim: Jointly supervising ASR, text continuation, and speech synthesis within a single decoding pass
      preserves LLM world knowledge better than separate components or warm-start initialisation alone.
    source: "§4.2.3, Table 4"
    evidence: Spectron (1B) reaches 22.9% accuracy on LLaMA-Questions versus 0.5-1% for TWIST models that
      only warm-start from a text LM without joint ASR/synthesis supervision.
    confidence: high
    relevance: low
  - claim_id: spectron_derivative_loss_improves_coherence
    role: supports
    claim: Penalising temporal and spectral derivatives of the predicted spectrogram improves semantic
      coherence in speech continuation more than the basic regression loss alone.
    source: "§4.2.4, Table 5"
    evidence: Removing the spectrogram derivative loss increases log-perplexity by more than 580 points
      in the ablation.
    confidence: medium
    relevance: low
  - claim_id: spectron_compact_lm_matches_larger_on_qa
    role: supports
    claim: A compact LM (1B parameters) that tightly couples audio encoding with text decoding can match
      a 7B instruction-tuned spoken LM on zero-shot spoken question answering tasks.
    source: "§4.2.3, Table 4"
    evidence: Spectron (1B) matches SpeechGPT-7B on LLaMA-Questions (22.9% vs. 21.9%) and WebQuestions
      (6.1% vs. 6.5%) at one-seventh the parameter count.
    confidence: high
    relevance: low
  limitations:
  - Frame-by-frame spectrogram decoding at 12.5 ms resolution makes generating long utterances computationally
    prohibitive and precludes streaming inference.
  caveats:
  - 'The paper introduces two spoken QA benchmarks (LLaMA-Questions and a spoken adaptation of WebQuestions)
    and combines log-perplexity, naturalness MOS, and speaker similarity into a joint evaluation suite
    for speech-continuation systems, contributing reusable evaluation infrastructure for the spoken-language-model
    subfield even though its own ## Claims are primarily architectural.'
- id: "2306.00814"
  entry_date: "2026-07-20"
  year: 2023
  venue: arXiv
  task:
  - TTS
  architecture:
  - GAN
  relevance: low
  evidence_role:
  - evaluation_caution
  current_role: minor
  method_family: []
  claims:
  - claim_id: vocos_isotropic_istft_reduces_cost_no_quality_loss
    role: supports
    claim: Maintaining constant temporal resolution throughout a GAN vocoder, with ISTFT as the sole upsampling
      step, eliminates aliasing artefacts and dramatically reduces inference cost without sacrificing
      perceptual quality.
    source: "§3.1, §4.3, Table 6"
    evidence: Vocos runs at 6696x real-time on GPU versus 98x for BigVGAN and 495x for HiFi-GAN, while
      matching BigVGAN's MOS (3.62 vs 3.64) within statistical equivalence.
    confidence: high
    relevance: low
  - claim_id: vocos_unit_circle_phase_essential
    role: supports
    claim: Implicit phase wrapping via a unit-circle activation is essential for stable GAN training of
      complex-valued spectrogram generators; alternatives that clamp or clip phase angles substantially
      degrade output quality.
    source: "§3.2, §4.1.1, Table 1"
    evidence: Removing the unit-circle phase activation reduces PESQ from 3.70 to 3.57 in the paper's
      ablation.
    confidence: high
    relevance: low
  - claim_id: vocos_fourier_domain_reduces_periodicity_errors
    role: supports
    claim: Fourier-domain vocoders reduce periodicity errors more effectively than time-domain GANs, suggesting
      that modelling harmonics in the frequency domain provides a stronger inductive bias for voiced speech.
    source: "§4.1.1, Table 1"
    evidence: Vocos achieves the best periodicity score (0.101) among compared vocoders in Table 1.
    confidence: medium
    relevance: low
  - claim_id: vocos_convnext_outperforms_resblocks
    role: supports
    claim: ConvNeXt blocks with isotropic architecture outperform dilated ResBlocks in the Fourier-domain
      vocoder setting, even though dilated convolutions were motivated by the need to expand receptive
      fields in time-domain models.
    source: "§4.1.1, Table 1"
    evidence: ConvNeXt blocks reach PESQ 3.70 versus 3.53 for standard ResBlocks in the ablation.
    confidence: medium
    relevance: low
  - claim_id: vocos_fourier_decoder_improves_codec_decoder_quality
    role: supports
    claim: A Fourier-domain GAN vocoder trained as a neural codec decoder can substantially improve perceptual
      quality over the original codec decoder across all bitrates without architectural changes to the
      upstream codec.
    source: "§4.2, Table 5"
    evidence: At 1.5 kbps, the Vocos EnCodec-decoder variant scores MOS 2.73 versus 1.09 for the original
      EnCodec decoder.
    confidence: high
    relevance: low
  limitations:
  - The model is trained exclusively on 24 kHz speech and music; performance at higher sample rates (44.1/48
    kHz) relevant to high-fidelity TTS is not reported.
  caveats:
  - The paper's own Limitations note that the ground-truth MOS (3.81) on its LibriTTS listening test is
    noticeably below what might be expected for studio speech, suggesting the evaluation pool or headphone-compliance
    filtering may limit the discriminative power of the subjective test, and that the reported statistical
    equivalence with BigVGAN may reflect an underpowered test rather than genuine parity.
- id: "2308.16692"
  entry_date: "2026-07-20"
  year: 2023
  venue: arXiv
  task:
  - TTS
  - codec
  architecture:
  - GAN
  relevance: medium
  evidence_role:
  - infrastructure
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: speechtokenizer_layer_separation_improves_recon_and_coherence
    role: supports
    claim: Separating semantic content from paralinguistic information across RVQ layers within a single
      codec improves both reconstruction quality and speech language model coherence compared to undifferentiated
      acoustic tokenisation.
    source: "§4.4, Tables 2 and 4"
    evidence: SpeechTokenizer reaches MUSHRA 90.55 versus 79.86 for EnCodec on reconstruction, and its
