    evidence: "The EChat-200K training corpus is synthesised via CosyVoice2 with a minority of real recordings included specifically to mitigate the acknowledged synthetic-emotion expressiveness gap."
    confidence: medium
    relevance: medium
  - claim_id: automatic_empathy_evaluation_diverges_from_human
    role: complicates
    claim: "Automatic empathy evaluation pipelines using LLM scoring and automatic emotion classifiers diverge measurably from human judgements, primarily due to emotion classifier errors and LLM hallucinations."
    source: "§Main Results, Results of Empathetic Intelligence; Table 3"
    evidence: "OSUM-EChat scores 72.0 (GPT-4 automatic) vs. 73.3 (human) on the multi-label metric, and the divergence is more pronounced for individual competitors, with rankings remaining consistent but absolute scores diverging."
    confidence: medium
    relevance: high
  - claim_id: native_multimodal_better_for_paralinguistic_nuance
    role: supports
    claim: "Native multimodal models that integrate speech token prediction directly into the LLM are better suited to capturing and generating paralinguistic nuance than modularly aligned architectures that treat speech decoding separately."
    source: "§Introduction; §Related Work, End-to-End Spoken Dialogue System"
    evidence: "OSUM-EChat, a native multimodal architecture, achieves 87.1 on sound event empathy where most modularly-aligned competitors score zero."
    confidence: medium
    relevance: low
  limitations:
  - "General linguistic intelligence regresses substantially compared to the Qwen2.5-3B text base (GSM8K drops from 85 to 34), indicating the speech-capability gain comes at a significant cost to LLM reasoning that the empathy-focused evaluation does not capture."
  caveats:
  - "The EChat-eval automatic scoring pipeline (GPT-4o + emotion2vec-Large) produces rankings consistent with human evaluation but absolute scores that diverge meaningfully, making the benchmark more reliable for ranking systems than for measuring absolute empathy."
- id: "2508.09702"
  entry_date: "2026-07-21"
  year: 2025
  venue: arXiv
  task:
  - TTS
  - evaluation
  architecture: []
  relevance: low
  evidence_role:
  - evaluation_caution
  current_role: minor
  method_family: []
  claims:
  - claim_id: quality_mismatch_degrades_zeroshot_generation
    role: supports
    claim: "Quality mismatch between clean training corpora and real-world inference prompts is a meaningful source of degradation in zero-shot speech generation systems."
    source: "§1"
    evidence: "The paper motivates M3PDB by observing that zero-shot TTS systems trained on clean studio recordings degrade against noisy, incomplete, or out-of-domain inference prompts."
    confidence: medium
    relevance: low
  - claim_id: crosslingual_proxy_prompts_can_outperform_native
    role: supports
    claim: "Cross-lingual proxy prompts selected by linguistic proximity can produce lower synthesis error than native-language prompts of lower audio quality."
    source: "§3.2, Table 3"
    evidence: "Cross-lingual prompts selected by M3PDB for Italian synthesis via XTTS-v2 yield CER of 2.78%, compared to 4.32% for native Italian prompts and 5.21% for randomly selected French prompts."
    confidence: medium
    relevance: low
  - claim_id: multimodal_annotation_improves_age_gender_accuracy
    role: supports
    claim: "Multi-modal annotation that fuses visual and acoustic signals yields substantially higher age and gender labelling accuracy than audio-only or text-only annotation strategies."
    source: "§5.1, Table 2"
    evidence: "The multi-agent annotation system reduces age MAE from 12.54 (SpeechCraft) to 6.22 years and raises gender accuracy from 80.69% to 91.22%."
    confidence: medium
    relevance: low
  - claim_id: curated_database_outperforms_generative_face_to_speech
    role: supports
    claim: "A curated, high-quality audio database outperforms generative face-to-speech synthesis as a source of speaker prompts when audio quality is the binding constraint."
    source: "§5.3, Table 4"
    evidence: "M3PDB-retrieved audio achieves comparable speaker similarity to Imaginary Voice face-to-speech synthesis (15.14% vs. 16.18% SS) while substantially improving UTMOSv2 (2.69 vs. 2.10)."
    confidence: medium
    relevance: low
  - claim_id: cascaded_retrieval_viable_for_latency_constraints
    role: supports
    claim: "Cascaded, interruptible similarity retrieval is a viable approach to prompt selection under strict latency constraints without dedicated hardware."
    source: "§4.2, §5.4, Table 5"
    evidence: "The online two-stage selection strategy improves SS from 39.53% to 44.88% and CER from 4.21% to 1.17% over using degraded input directly, without specialized hardware."
    confidence: medium
    relevance: low
  limitations:
  - "No subjective listening tests are reported anywhere in the paper; all quality metrics (UTMOSv2, automatic speaker similarity via cosine embeddings, Emotion2Vec emotion similarity) are automatic predictors."
  caveats:
  - "The relationship between M3PDB's automatic predictors and actual perceptual quality in the prompt-selection context is not validated against human judgments, and comparisons across the paper's experiments use different test sets that are not directly comparable numerically."
- id: "2508.11224"
  entry_date: "2026-07-21"
  year: 2025
  venue: ASRU
  task:
  - evaluation
  - TTS
  architecture: []
  relevance: medium
  evidence_role:
  - infrastructure
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: framewise_ssl_models_capture_relative_prosody
    role: supports
    claim: "SSL models using frame-wise masked prediction capture relative prosodic contours within an utterance rather than absolute acoustic magnitudes, making them insensitive to global intensity rescaling."
    source: "§V-A, Fig. 1"
    evidence: "HuBERT, ContentVec, and data2vec show near-zero Token Error Rate change under utterance-level intensity scaling, attributable to waveform normalisation in their wav2vec-2.0-derived CNN front-ends."
    confidence: high
    relevance: low
  - claim_id: discrete_vs_continuous_pretraining_affects_cluster_size_needs
    role: supports
    claim: "Models pretrained to predict discrete targets encode phoneme-like structure effectively at small cluster sizes, while models pretrained on continuous targets require larger cluster sizes to approach the same phonemic alignment."
    source: "§V-A, Fig. 3"
    evidence: "HuBERT and ContentVec capture phoneme-like structure even at 100 clusters, while data2vec and emotion2vec show degraded prosodic sensitivity at small cluster sizes at their final layers."
    confidence: medium
    relevance: low
  - claim_id: emotional_kmeans_training_increases_prosodic_sensitivity
    role: supports
    claim: "Training k-means clustering on emotionally expressive speech increases the prosodic sensitivity of resulting tokens for most SSL model and layer combinations."
    source: "§V-B, Table I"
    evidence: "Training k-means on MEAD (emotional speech) instead of LibriSpeech significantly increases prosodic sensitivity in most conditions (p < 0.05), at the cost of moderately increased speaker sensitivity."
    confidence: medium
    relevance: low
  - claim_id: moving_average_trades_off_prosody_and_speaker_invariance
    role: supports
    claim: "Applying a temporal moving average to SSL features before k-means clustering provides an adjustable trade-off between prosodic sensitivity and speaker invariance, with intermediate window sizes improving both simultaneously."
    source: "§V-C, Fig. 5"
    evidence: "For HuBERT's final layer with 2000 clusters, moving-average window sizes of 9-11 outperform no smoothing on prosody while also reducing speaker sensitivity."
    confidence: medium
    relevance: low
  - claim_id: layer_specific_divergence_between_ssl_objectives
    role: supports
    claim: "Differences between SSL pretraining objectives in their token-level linguistic and prosodic encoding are concentrated in the final transformer layers, while intermediate layers exhibit largely similar behaviour across model families."
    source: "§V-A, §V-B"
    evidence: "Phone normalised mutual information (PNMI) confirms that data2vec and emotion2vec's intermediate layers (around 9-10) behave similarly to HuBERT and ContentVec despite diverging at the final layer."
    confidence: medium
    relevance: low
  limitations:
  - "The analysis measures sensitivity via Token Error Rate, a proxy for how much token sequences change in response to acoustic manipulation, rather than directly probing what prosodic information is decodable from the tokens; whether sensitivity translates to gains on downstream prosody-conditional tasks remains untested."
  caveats:
  - "The paper's core methodological contribution to evaluation-metrics is a controlled, TER-based direct token-comparison benchmark for prosodic sensitivity, decoupled from any downstream decoder, filling a gap left by prior downstream-task-based token evaluations; it evaluates only semantic tokens on a single corpus (TIMIT), not acoustic codec tokens."
- id: "2503.04721"
  entry_date: "2026-07-21"
  year: 2025
  venue: arXiv
  task:
  - SCA
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - core_evidence
  current_role: influential
  method_family: []
  claims:
  - claim_id: explicit_turn_state_reduces_pause_interruptions
    role: supports
    claim: "Explicit turn-state prediction modules reduce unwanted interruptions during intra-turn speaker pauses more effectively than purely end-to-end architectures trained on dialogue data."
    source: "§V, Table III"
    evidence: "Freeze-Omni, which uses an explicit turn-state classifier, reduces Takeover Rate to 0.481-0.642 during pause handling versus 0.934-0.985 for end-to-end dGSLM and Moshi."
    confidence: high
    relevance: medium
  - claim_id: e2e_lower_latency_but_less_coherent_on_interruption
    role: supports
    claim: "End-to-end full-duplex speech models respond with lower latency but produce less semantically coherent replies when confronted with user interruptions than cascaded systems with a frozen LLM backbone."
    source: "§V, Table III"
    evidence: "Moshi responds to interruptions in 0.257s but scores only 0.765 on GPT-4o coherence, while Freeze-Omni responds in 1.409s with a coherence score of 3.615."
    confidence: high
    relevance: medium
  - claim_id: backchanneling_largely_unsolved
    role: supports
    claim: "Backchannel generation remains a largely unsolved capability in current full-duplex spoken dialogue models, with most open-source systems producing near-zero backchannel frequency."
    source: "§V, Table III"
    evidence: "Only dGSLM produces backchannel responses at a measurable rate (Freq = 0.015); Moshi and Freeze-Omni produce near-zero backchannel frequency."
    confidence: high
    relevance: medium
  - claim_id: commercial_systems_better_calibrated_turn_taking
    role: supports
    claim: "Commercial full-duplex systems exhibit better-calibrated turn-taking behaviour on naturalistic data than open-source research models, suggesting that VAD design and deployment-scale tuning contribute substantially to perceived conversational naturalness."
    source: "§V, Table III"
    evidence: "Gemini Live achieves the lowest pause-handling TOR (0.255-0.310) and the best backchannel-timing JSD (0.896) among all four evaluated systems."
    confidence: medium
    relevance: medium
  - claim_id: automatic_metrics_can_be_reproducible_and_modelagnostic
    role: supports
    claim: "Automatic metrics for full-duplex dialogue can be made reproducible and model-agnostic without human raters, enabling rapid cross-system comparisons that corpus-level statistics and user studies cannot efficiently provide."
    source: "§I, §III-A"
    evidence: "Full-Duplex-Bench derives all four evaluation dimensions (pause handling, backchanneling, smooth turn-taking, interruption management) from automatic, time-aligned ASR transcripts and scenario-controlled stimuli, requiring no human annotators in the evaluation loop itself."
    confidence: high
    relevance: high
  limitations:
  - "The benchmark evaluates only four models (three open-source, one commercial API) and is restricted to English, so conclusions about which architectural choices drive observed behaviours are correspondingly narrow."
  caveats:
  - "The metrics are explicitly framed as descriptive rather than prescriptive: a model with low pause-handling TOR is assumed better, but the benchmark does not currently capture human preference directly, and backchannel detection relies on a heuristic duration/word-count rule that may not generalise across speaking styles or languages."
- id: "2508.12001"
  entry_date: "2026-07-21"
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - VAE
  - GAN
  - hybrid
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: moe_duration_predictor_matches_speaker_specific_prosody
    role: supports
    claim: "Applying Mixture-of-Experts routing to the duration predictor of a non-autoregressive TTS system produces phoneme duration distributions that more closely match ground-truth speaker-specific prosodic variation than deterministic or stochastic single-path predictors."
    source: "§IV-C, Table III"
    evidence: "FNH-TTS's MoE-DP achieves 67.07% phoneme duration classification accuracy against ground truth, the highest among all compared systems including SparkTTS (66.77%) and F5-TTS (11.17%)."
    confidence: high
    relevance: low
  - claim_id: duration_diversity_needs_vocoder_coupgrade
    role: supports
    claim: "Improving duration prediction diversity in NAR TTS without upgrading the vocoder degrades synthesis quality, because richer prosodic information exceeds the artifact-rejection capacity of standard GAN discriminators."
    source: "§IV-A, Table I"
    evidence: "MoE-DP alone with the original HiFi-GAN vocoder degrades MOS to 3.92 on LJSpeech, versus 4.48 for the full FNH-TTS system with the VOCOS + CoMBD/SBD vocoder upgrade."
    confidence: high
    relevance: low
  - claim_id: frequency_domain_discriminators_better_suppress_artifacts
    role: supports
    claim: "Frequency-domain and multi-band discriminators (CoMBD and SBD) are more effective than HiFi-GAN's multi-period discriminator at suppressing spectral artifacts when a more expressive duration predictor is used."
    source: "§V-B, Table II"
    evidence: "FNH-TTS's vocoder with CoMBD+SBD achieves the lowest M-STFT (1.207) and MCD (1.654) among compared vocoders."
    confidence: medium
    relevance: low
  - claim_id: wer_unreliable_proxy_for_prosody_quality
    role: complicates
    claim: "Word Error Rate is an unreliable proxy for prosody modeling quality in TTS, as simpler prosodic patterns can yield lower WER by reducing ASR system disruption."
    source: "§IV-C, §III"
    evidence: "F5-TTS achieves the lowest phoneme duration classification accuracy (11.17%) among all systems despite competitive WER, indicating WER does not capture the duration-diversity gap that the paper's MFA-based duration accuracy metric reveals."
    confidence: medium
    relevance: high
  limitations:
  - "The MoE-DP requires the discriminator upgrade to yield any net benefit; neither module alone suffices, raising questions about robustness when either component is replaced or updated independently."
  caveats:
  - "The proposed MFA-based phoneme duration classification accuracy metric requires ground-truth phoneme duration annotations from forced alignment, limiting its generalizability as a standalone prosody evaluation tool compared to WER, which needs no such annotation."
- id: "interspeech-2025-0063"
  entry_date: "2026-07-21"
  year: 2025
  venue: Interspeech
  task:
  - TTS
  architecture:
  - diffusion
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: kl_regularizers_transfer_poorly_to_tts
    role: complicates
    claim: "KL-based regularization strategies developed for text-to-image diffusion RL fine-tuning provide limited gains when transferred to TTS, because audio waveform generation requires stronger temporal coherence than image synthesis."
    source: "§2.3.1, Table 1"
    evidence: "DPOK and KLinR (KL-regularized baselines) reach UTMOS of only 3.18 and 3.02 respectively, versus 3.65 for DLPO, on the same WaveGrad 2R base model."
    confidence: high
    relevance: low
  - claim_id: diffusion_loss_penalty_stabilizes_rlhf
    role: supports
    claim: "Incorporating the original diffusion training objective as a penalty term in the RL reward function stabilizes fine-tuning and yields larger quality improvements than KL-divergence regularization alone."
    source: "§2.2, Table 1"
    evidence: "DLPO achieves UTMOS 3.65 and NISQA 4.02, exceeding all five competing RL fine-tuning strategies including OnlyDL (diffusion loss only, UTMOS 3.16) and DPOK (UTMOS 3.18)."
    confidence: high
    relevance: low
  - claim_id: dual_mos_evaluation_guards_against_reward_hacking
    role: supports
    claim: "Dual MOS evaluation using a reward-model-independent predictor (NISQA) alongside the training reward (UTMOS) provides a practical safeguard against reward hacking in RLHF for TTS."
    source: "§2.3"
    evidence: "The paper reports NISQA (4.02) as a held-out predictor separate from the UTMOS reward model used during training, plus a human preference study (67% preference for DLPO), to guard against overfitting the reward signal."
    confidence: medium
    relevance: high
  - claim_id: rlhf_improves_naturalness_without_degrading_intelligibility
    role: supports
    claim: "RLHF fine-tuning of diffusion TTS models can improve perceived naturalness substantially without degrading intelligibility, as measured by WER remaining near the pre-trained baseline."
    source: "§2.3.1, Table 1"
    evidence: "DLPO's WER (1.2%) remains close to the base WaveGrad 2R's 1.5% and the ground truth's 0.99%, while UTMOS rises from 2.90 to 3.65."
    confidence: high
    relevance: low
  limitations:
  - "Evaluation is single-speaker (LJSpeech) on a relatively simple base diffusion model (WaveGrad 2R); it is unclear whether DLPO's benefit generalizes to more capable multi-speaker or flow-matching-based TTS systems."
  caveats:
  - "UTMOS is used as both the RL reward model and (implicitly) a headline evaluation metric, creating reward-hacking risk that the paper mitigates but does not fully eliminate via the separate NISQA predictor and human preference study."
- id: "interspeech-2025-0115"
  entry_date: "2026-07-21"
  year: 2025
  venue: Interspeech
  task:
  - codec
  architecture:
  - transformer-enc-dec
  relevance: low
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: codecs_fail_to_disentangle_pitch
    role: supports
    claim: "Even codecs explicitly trained with disentanglement objectives fail to cleanly separate pitch from other speech attributes in their token embeddings."
    source: "§2.3, §2.4"
    evidence: "Mimi's split-RVQ design, intended to prevent semantic leakage into higher scales, still carries substantial linguistic content in upper scales, and pitch remains the most diffusely encoded attribute across all four codecs studied."
    confidence: medium
    relevance: low
  - claim_id: content_concentrates_in_lowest_rvq_scales
    role: supports
    claim: "Linguistic content in neural audio codec representations concentrates in the lowest RVQ scales regardless of whether distillation was used, but leaks into higher scales when the frame rate is very low."
    source: "§2.1"
    evidence: "SpeechTokenizer's first RVQ scale shows strong HuBERT alignment via t-SNE clustering, while even Mimi's split-RVQ design carries linguistic content in upper scales, attributed to its low 12.5 Hz frame rate."
    confidence: medium
    relevance: low
  - claim_id: masked_autoencoder_bridges_codec_tokens_and_attributes
    role: supports
    claim: "A masked-autoencoder framework can bridge codec tokens and perceptual speech attributes bidirectionally, enabling voice conversion at dramatically lower bitrates than spectrogram-based equivalents."
    source: "§3.1, §3.2"
    evidence: "AnCoGen-SpeechTokenizer operates at 4 kbps and AnCoGen-BigCodec at 1.04 kbps with resynthesis quality broadly comparable to a 51.2 kbps Mel-spectrogram-based AnCoGen baseline."
    confidence: medium
    relevance: low
  - claim_id: posthoc_interpretability_reveals_codec_tradeoffs
    role: supports
    claim: "Post-hoc interpretability tools reveal systematic trade-offs between content accuracy and synthesis quality that differ by codec design, complicating the choice of codec for controllable speech generation."
    source: "§3.2, Table 1"
    evidence: "AnCoGen-BigCodec achieves the highest resynthesis N-MOS (4.39) but the lowest content accuracy (73.58%), while AnCoGen-SpeechTokenizer trades slightly lower N-MOS (4.34) for higher content accuracy (82%)."
    confidence: medium
    relevance: medium
  limitations:
  - "All experiments use LibriSpeech, a clean read-speech corpus with limited acoustic diversity; whether the observed encoding patterns and interpretability findings hold for spontaneous, expressive, or noise-conditioned codecs is untested."
  caveats:
  - "The paper's probing methodology (token co-occurrence with HuBERT classes, CLUB mutual information estimation, t-SNE visualization) is an analytical toolkit for auditing what codec tokens encode, rather than a new codec architecture or a new standardized benchmark metric."
- id: "interspeech-2025-0143"
  entry_date: "2026-07-21"
  year: 2025
  venue: Interspeech
  task:
  - TTS
  - evaluation
  architecture: []
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: multimodal_fusion_outperforms_unimodal_sentence_mode
    role: supports
    claim: "Multimodal fusion of data-driven acoustic and word-level linguistic embeddings outperforms unimodal and knowledge-based features for multilingual sentence mode classification."
    source: "§4, Table 2"
    evidence: "Early fusion of WavLM Large acoustic embeddings and XLM-RoBERTa word-level embeddings achieves the best intra-language UAR for all three languages (74.22% German, 67.10% French, 64.14% Italian)."
    confidence: high
    relevance: low
  - claim_id: multilingual_ssl_transfers_sentence_mode_discrimination
    role: supports
    claim: "Multilingual SSL representations trained on large corpora can transfer sentence-mode discriminative information across languages without language-specific training."
    source: "§5"
    evidence: "Models trained on German achieve UAR up to 63.62% on French in the inter-language transfer protocol, without any French-specific training."
    confidence: medium
    relevance: low
  - claim_id: asr_fails_to_detect_exclamatory_mode
    role: complicates
    claim: "State-of-the-art ASR systems are unable to reliably detect exclamatory sentence mode from speech, producing recall rates below chance level for that class."
    source: "§4, Table 3"
    evidence: "WHISPER Large V3 transcripts with punctuation detection show recall for exclamatory sentences well below chance for all three languages, despite strong declarative/interrogative recall."
    confidence: high
    relevance: high
  - claim_id: sentence_mode_degrades_on_emotional_speech
    role: complicates
    claim: "Sentence mode prediction performance degrades substantially on emotional speech due to definitional overlap between exclamatory sentence mode and emotional expressiveness."
    source: "§5, Table 4"
    evidence: "A model trained on CML-TTS German and evaluated on EMO-DB (German emotional speech) misclassifies most emotional samples as exclamatory."
    confidence: medium
    relevance: low
  limitations:
  - "No end-to-end TTS synthesis experiment is conducted; the study measures sentence-mode prediction accuracy from existing recordings, not synthesized prosody quality, so its direct application to TTS output evaluation is indirect."
  caveats:
  - "The finding that ASR-derived (WHISPER) punctuation is an unreliable proxy for exclamatory sentence mode is directly relevant to any TTS or prosody-labeling pipeline that relies on ASR transcripts as ground-truth prosody labels."
- id: "interspeech-2025-0166"
  entry_date: "2026-07-21"
  year: 2025
  venue: Interspeech
  task:
  - SCA
  architecture:
  - transformer-enc-dec
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: speech_encoder_transfers_paralinguistic_to_frozen_llm
    role: supports
    claim: "Training a speech encoder to match LLM responses conditioned on emotion labels can transfer paralinguistic understanding to a frozen LLM without any LLM weight modification."
    source: "§2.3, §4.1, §4.2, Table 1"
    evidence: "SpeechEmotionLlama achieves an LLM-annotated emotion understanding score of 7.54 versus 5.83 for the best cascaded baseline, and 81.51% SER accuracy versus 80.81% for the standalone SER model, while keeping Llama 3 8B entirely frozen throughout training."
    confidence: high
    relevance: low
  - claim_id: cascaded_ser_provides_marginal_improvement
    role: complicates
    claim: "Cascading a high-accuracy standalone emotion classifier onto a speech-LLM system provides only marginal improvement in emotional response quality."
    source: "§3.2, §4.1, Table 1"
    evidence: "Prepending SER model predictions (80.81% accuracy) to Baseline 2 raises the LLM-annotated emotion score from 5.59 to only 5.83, while encoder-level alignment raises it to 7.54, suggesting that discretized emotion tags do not capture the richness of paralinguistic information as effectively as continuous encoder embeddings."
    confidence: medium
    relevance: medium
  - claim_id: proprietary_data_complicates_paralinguistic_evaluation
    role: complicates
    claim: "Evaluating paralinguistic speech-LLM systems is inherently difficult when training and evaluation data are fully proprietary."
    source: "§3.1, §3.3"
    evidence: "All datasets (pre-training, fine-tuning, and test sets) are proprietary, precluding external replication; the LLM-based evaluation metric (Llama 3 70B as judge) also introduces a dependency on the evaluator model's own behavior, which is not systematically validated against human listeners."
    confidence: medium
    relevance: high
  - claim_id: ssl_pretraining_benefits_paralinguistic_understanding
    role: supports
    claim: "Self-supervised speech pre-training on large-scale multilingual data provides a strong initialization for downstream paralinguistic understanding in speech encoders."
    source: "§2.2, §3.2, §4.2"
    evidence: "The Conformer encoder is pre-trained with BEST-RQ on approximately 15M hours before fine-tuning on emotion tasks; the system substantially outperforms baselines using a speech encoder that is not further fine-tuned on emotion-related tasks."
    confidence: medium
    relevance: low
  limitations:
  - "All training and evaluation data are proprietary; results cannot be replicated externally and comparisons are restricted to in-house baselines. The role of data scale (1B-parameter encoder, 15M hours pre-training) versus the training paradigm itself is not ablated."
  caveats:
  - "LLM-judged metrics (Llama 3 70B as scorer) have not been validated against human listener judgments for empathy or response quality in this setup, and the test set is constructed to control for linguistic content in a way that may not reflect realistic distribution."
- id: "interspeech-2025-0196"
  entry_date: "2026-07-21"
  year: 2025
  venue: Interspeech
  task:
  - codec
  architecture:
  - GAN
  - VAE
  relevance: low
  evidence_role:
  - evaluation_caution
  current_role: minor
  method_family: []
  claims:
  - claim_id: spectral_disentanglement_improves_compression_efficiency
    role: supports
    claim: "Imposing spectral structure on codec latent embeddings through supervised disentanglement improves compression efficiency over unstructured group quantization."
    source: "§2.2, §3.3, Table 3"
    evidence: "SPCODEC's spectrally-supervised split-and-prediction module outperforms DAC, HiFiCodec, and SRCodec on MelDistance, STOI, and POLQA when all are run on the same DAC backbone for fairness."
    confidence: medium
    relevance: low
  - claim_id: intergroup_prediction_reduces_redundancy
    role: supports
    claim: "Inter-group prediction in neural codecs, where high-frequency representations are predicted from quantized low-frequency components, reduces bitstream redundancy without proportional increases in model size."
    source: "§2.2, §3.1"
    evidence: "The split-and-prediction module adds only 33K parameters and 4.3 MMAC/s of compute while removing redundancy between low- and high-frequency embeddings."
    confidence: medium
    relevance: low
  - claim_id: spectral_decomposition_gains_scale_with_bitrate
    role: supports
    claim: "The performance advantage of latent-space spectral decomposition in neural codecs scales with bitrate, with larger gains at higher bitrates where low-frequency quality is sufficient to anchor the prediction."
    source: "§3.3, Table 3"
    evidence: "The SP module's advantage over DAC is more pronounced at 32kHz/16kbps (POLQA 4.543 vs. 4.501) than at 5.33kbps, where the gap narrows."
    confidence: medium
    relevance: low
  - claim_id: causal_codecs_match_traditional_at_equivalent_bitrate
    role: supports
    claim: "Causal, time-domain neural speech codecs can match or exceed traditional codecs (EVS, Opus) on perceptual quality metrics at equivalent bitrates."
    source: "§3.2, Table 2"
    evidence: "SPCODEC achieves POLQA 4.5 and MOS 4.63 at 10.66 kbps, exceeding Opus (POLQA 4.15, MOS 4.46) and EVS (POLQA 4.14, MOS 4.12) at comparable bitrates."
    confidence: medium
    relevance: low
