  claims:
  - claim_id: mi_minimisation_effective_prosody_timbre_disentanglement
    role: supports
    claim: "Explicit mutual information minimisation at the codec-embedding level provides effective prosody-timbre disentanglement for voice conversion."
    source: "§3.5, Table 3"
    evidence: "Removing the MI loss from the full system leads to a notably higher normalised F0 distance in the prosody-from-source scenario (3.28 versus 2.82), while quality and timbre metrics change only modestly."
    confidence: medium
    relevance: low
  - claim_id: icl_codec_lm_can_be_controllable_vc_backbone
    role: supports
    claim: "In-context learning codec LMs can serve as controllable VC backbones when augmented with prosody-disentangling encoder modules."
    source: "§3.4, §3.5, Table 2, Table 3"
    evidence: "The proposed system builds on VALL-E X's ICL mechanism and outperforms VALL-E X in speaker similarity (ASV 0.91 vs. 0.84), intelligibility (WER 0.101 vs. 0.115), naturalness (MOS 4.36 vs. 4.19), and prosody alignment (F0 distance 2.70 vs. 3.10)."
    confidence: medium
    relevance: low
  - claim_id: prosody_disentanglement_codec_fidelity_tradeoff
    role: complicates
    claim: "Prosody disentanglement at the codec level introduces a small trade-off in absolute codec reconstruction fidelity compared to the unmodified encoder."
    source: "§3.3, Table 1"
    evidence: "PACE's ASV score (0.662) and NISQA score (3.98) are lower than the baseline EnCodec encoder (0.681, 4.17), though the gap does not substantially affect system-level VC performance."
    confidence: medium
    relevance: low
  - claim_id: prosody_from_source_and_prompt_are_distinct_axes
    role: refines
    claim: "Prosody-from-source and prosody-from-prompt are distinct capability axes in voice conversion; systems strong at one do not automatically handle the other."
    source: "§3.5, Table 3"
    evidence: "VALL-E X supports only prosody-from-prompt and is excluded from the source-prosody evaluation; TriAAN-VC and ProsoVC support only source-prosody and are excluded from the prompt-prosody evaluation, with only the proposed system evaluated in both modes."
    confidence: medium
    relevance: medium
  limitations:
  - "The 54-hour training dataset is modest for a codec language model approach, and no cross-lingual or noisy-environment experiments are reported."
  caveats:
  - "The paper's use of ASV-score, WER, F0 distance, and MOSNET alongside human ratings is an application of established multi-metric VC evaluation practice rather than a contribution to evaluation methodology itself."

- id: "interspeech-2025-0469"
  entry_date: "2026-07-21"
  year: 2025
  venue: Interspeech
  task:
  - TTS
  - evaluation
  architecture:
  - transformer-enc-dec
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: phoneme_based_tts_outperforms_character_based_multilingual
    role: supports
    claim: "Phoneme-based TTS training substantially outperforms character-based multilingual approaches in intelligibility for low-resource South Asian languages, as measured by WER, CER, and subjective MOS."
    source: "§4.2, §4.3"
    evidence: "Tacotron 2 + WaveGlow achieves WER 16.1% versus MMS's 31.4% on Punjabi male, and Tacotron 1 achieves WER 13.1% versus MMS's 25.6% on Urdu male."
    confidence: high
    relevance: low
  - claim_id: transliteration_workarounds_degrade_tts_quality
    role: complicates
    claim: "Script-mismatch workarounds such as transliteration introduce cumulative errors that degrade TTS quality below what a dedicated script-native model achieves."
    source: "§1, §5"
    evidence: "Meta MMS lacks native Punjabi Shahmukhi support and required an additional Shahmukhi-to-Gurumukhi transliteration step via ChatGPT before synthesis, contributing to its substantially higher WER and CER relative to the dedicated Shahmukhi-native Tacotron models."
    confidence: medium
    relevance: low
  - claim_id: multilingual_tts_fails_on_numerals_and_symbols
    role: supports
    claim: "Large-scale multilingual TTS models fail to synthesize numerals and language-specific symbols correctly in languages whose text processing was not explicitly handled at training time, causing systematic intelligibility failures."
    source: "§4.2, §4.3"
    evidence: "MMS failed completely to synthesize numbers and symbols in both Punjabi and Urdu, severely degrading intelligibility relative to the dedicated Tacotron systems with script-specific text-analysis modules."
    confidence: high
    relevance: low
  - claim_id: phoneme_level_metrics_expose_weaknesses_mos_misses
    role: refines
    claim: "Phoneme-level evaluation metrics (DRT/MRT) expose word-final articulatory weaknesses in TTS systems that aggregate perceptual scores like MOS do not adequately capture."
    source: "§4.3.1"
    evidence: "DRT/MRT phoneme-feature accuracy testing showed MMS weakest at word-final positions across voicing, nasality, aspiration, and sibilation in Punjabi, distinctions not visible in the aggregate MOS or SUS scores."
    confidence: medium
    relevance: high
  - claim_id: simpler_architecture_matches_larger_for_lowresource_transcription
    role: supports
    claim: "For low-resource encoder-decoder TTS, simpler architectures can match or exceed larger ones in transcription accuracy while offering substantially lower inference latency."
    source: "§4.1, §4.2"
    evidence: "Tacotron 1 (6.9M params, RTF 0.17) achieved the best Urdu male transcription accuracy (WER 13.1%, CER 4.0%), while the larger Tacotron 2 + WaveGlow (296M params combined) had RTF 3.54."
    confidence: medium
    relevance: low
  limitations:
  - "The Punjabi corpus covers only the Majhi accent, and the MMS comparison is limited since MMS training data details are unavailable, preventing MCD-DTW and SpeechBERTScore computation for MMS."
  caveats:
  - "The paper's phoneme-level DRT/MRT testing methodology is a concrete evaluation-metrics contribution demonstrating that aggregate perceptual scores (MOS, SUS) can conceal systematic articulatory failure modes that phoneme-feature-level testing reveals."

- id: "interspeech-2025-0506"
  entry_date: "2026-07-21"
  year: 2025
  venue: Interspeech
  task:
  - codec
  architecture:
  - transformer-enc-dec
  relevance: medium
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: codec_tokens_useful_ssl_pretraining_targets
    role: supports
    claim: "Neural codec token spaces capture semantically useful information beyond audio reconstruction, enabling effective use as pretraining targets for general audio representation models."
    source: "§4, Table 1"
    evidence: "EnCodecMAE, which predicts frozen EnCodec RVQ tokens, outperforms BEATs (random quantizer targets) and AudioMAE on global HEAREval score, with large+ST models reaching 99.2 on Audioset-only pretraining versus 96.0 for BEATs Iter 3."
    confidence: high
    relevance: low
  - claim_id: frame_level_beats_patch_level_for_speech_tasks
    role: supports
    claim: "Frame-level temporal representations outperform patch-based representations for speech tasks in universal audio models, while both approaches perform comparably on environmental sound classification."
    source: "§4, Table 1"
    evidence: "EnCodecMAE (frame-level) achieves 96.3% speech command accuracy and 75.5% emotion recognition versus patch-based BEATs Iter 1's 91.0% and 68.7%, while matching or being slightly behind on ESC-50."
    confidence: high
    relevance: low
  - claim_id: universal_audio_models_lag_dedicated_speech_ssl_on_asr
    role: complicates
    claim: "Self-supervised universal audio representations do not close the gap with dedicated speech SSL models on phoneme-level tasks such as ASR."
    source: "§4, Table 2"
    evidence: "EnCodecMAE Large+ST achieves 8.59% WER on LibriSpeech with a language model versus 2.94% for HuBERT Large trained solely on speech data."
    confidence: high
    relevance: low
  - claim_id: optimal_input_representation_is_task_dependent
    role: refines
    claim: "The optimal input representation for self-supervised audio models is task-dependent rather than universally preferable across audio domains."
    source: "§4, Table 1"
    evidence: "Melspectrograms yield higher global HEAREval scores than EnCodec encoder outputs (95.9 vs. 83.4 base model), but EnCodec input outperforms melspectrograms specifically on pitch prediction (NSynth)."
    confidence: medium
    relevance: medium
  - claim_id: pretraining_data_diversity_essential_for_universal_audio
    role: supports
    claim: "Pretraining data diversity is essential for universal audio representation; models pretrained on a single domain generalise poorly outside that domain."
    source: "§4, Table 1"
    evidence: "Speech-only pretraining (LL6K only) gives a global HEAREval score of 75.3 and music-only (FMA only) gives 89.1, while the full mixture (AS+FMA+LL6K) reaches 97.1 global."
    confidence: high
    relevance: low
  limitations:
  - "All models are evaluated with a frozen upstream encoder; fine-tuning experiments are not reported, leaving open whether representations would improve further under task-specific adaptation."
  caveats:
  - "The paper's use of the HEAREval benchmark (global normalised score across 6 tasks) and the SUPERB ASR protocol provides a reproducible multi-domain evaluation framework, though the paper's central contribution is representation learning rather than evaluation methodology."

- id: "interspeech-2025-0551"
  entry_date: "2026-07-21"
  year: 2025
  venue: Interspeech
  task:
  - TTS
  architecture:
  - autoregressive-LM
  relevance: low
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: sma_reduces_repetition_omission_without_degrading_general_sets
    role: supports
    claim: "Selectively applying monotonic attention constraints to automatically identified alignment heads in decoder-only LLMs reduces word repetition and omission errors without degrading performance on general test sets."
    source: "§3.1, §3.2, §5.1, Table 1"
    evidence: "Phn-Cosy-L-SMA reduces CER on Seed-ZH-Hard from 10.42% to 8.53% and WER on ELLA-V-Hard from 14.92% to 12.01% versus baseline, while Libri-X general-set WER moves slightly favorably (3.12% to 2.99%)."
    confidence: high
    relevance: low
  - claim_id: forced_aligner_methods_generalize_poorly_ood
    role: complicates
    claim: "Forced-aligner-based monotonic alignment methods for LLM TTS suffer from out-of-domain generalization failure when training data is diverse, while alignment-free approaches are more robust."
    source: "§5.1, Table 1"
    evidence: "VALL-E R (via Phn-Cosy-S-Ali) significantly raises general test WER (Seed-ZH CER 4.03% to 5.08%, Seed-EN WER 5.32% to 6.40%), indicating poor out-of-domain generalization, while SMA avoids this degradation."
    confidence: medium
    relevance: low
  - claim_id: alignment_concentrated_in_few_heads
    role: supports
    claim: "In decoder-only LLMs used for TTS, alignment characteristics are concentrated in a small subset of attention heads (typically 2-3 out of the full multi-head set), and applying monotonic constraints only to those heads is critical for preserving generation quality."
    source: "§3.2, §5.2, Figure 2"
    evidence: "A diagonal-ratio metric identifies the top 2-3 alignment heads per model; applying SMA to non-alignment heads was found to severely degrade accuracy."
    confidence: high
    relevance: low
  - claim_id: sma_scales_to_large_models_without_degrading_speaker_sim
    role: supports
    claim: "Monotonic attention fine-tuning for LLM-based TTS scales to large model sizes and large-scale multilingual training corpora without degrading speaker similarity."
    source: "§5.1, Table 1"
    evidence: "At 300M parameters and 150K hours of training data across Chinese and English, speaker similarity remains largely unchanged (SPK-SIM 0.596 vs. 0.580 on Libri-X, SMA vs. baseline)."
    confidence: medium
    relevance: low
  limitations:
  - "Hard-case CER/WER remains substantially above general test performance even after SMA (e.g., Seed-ZH-Hard CER 8.53% vs. Seed-ZH CER 2.33%), meaning severe repetition/omission cases are not fully resolved."
  caveats:
  - "The paper's evaluation across multiple hard-case test sets (Seed-ZH-Hard, Seed-EN, ELLA-V-Hard) with WER, CER, and SPK-SIM applies established robustness-benchmarking practice rather than proposing new evaluation methodology."

- id: "interspeech-2025-0554"
  entry_date: "2026-07-21"
  year: 2025
  venue: Interspeech
  task:
  - TTS
  architecture:
  - flow-matching
  - GAN
  relevance: low
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: consistency_on_straight_fm_trajectories_beats_curved_diffusion
    role: supports
    claim: "Enforcing velocity-field self-consistency on straight flow-matching trajectories yields more effective few-step TTS than applying consistency constraints to curved diffusion-model trajectories."
    source: "§1, §3.1, Table 1"
    evidence: "RapFlow-TTS at 2 NFE achieves MOS 3.89 versus Comospeech (consistency-distilled diffusion) at MOS 3.19 on LJSpeech under matched 2-NFE inference."
    confidence: high
    relevance: low
  - claim_id: adversarial_learning_most_impactful_for_fewstep_tts
    role: supports
    claim: "Adversarial learning at the mel-spectrogram level is the single most impactful technique for improving few-step consistency TTS naturalness, outperforming all other regularisation methods individually."
    source: "§3.2, §4.3, Table 2"
    evidence: "Ablation shows adversarial learning yields the largest NISQA improvement (3.78 to 4.19 on LJSpeech) among all proposed improved techniques."
    confidence: high
    relevance: low
  - claim_id: consistency_models_dont_benefit_from_more_steps
    role: supports
    claim: "Consistency models for TTS do not benefit from increasing the number of inference steps beyond what they were trained for, and can degrade with more steps."
    source: "§4.3, Table 2"
    evidence: "More NFE steps do not consistently improve quality for the consistency-trained RapFlow-TTS model, a characteristic behavior noted across both LJSpeech and VCTK evaluations."
    confidence: medium
    relevance: low
  - claim_id: straight_flow_plus_consistency_reaches_fastspeech2_speed
    role: supports
    claim: "Combining a straight flow pre-training stage with consistency fine-tuning and multi-segment objectives enables 2-step TTS at real-time factors comparable to non-autoregressive models such as FastSpeech2."
    source: "§3.1, §4.2, Table 1"
    evidence: "RapFlow-TTS+ achieves RTF 0.031 at 2 NFE, matching FastSpeech2's inference speed, while reaching MOS 4.01 versus FastSpeech2's 3.35."
    confidence: high
    relevance: low
  limitations:
  - "Quality at 2 NFE remains slightly below ground truth (MOS 4.01 vs. GT 4.42 on LJSpeech), and the system is not zero-shot; it conditions on speaker identity via training rather than a reference prompt."
  caveats:
  - "The paper's evaluation framework (MOS + WER + RTF) is a standard application of established TTS evaluation practice rather than a contribution to evaluation methodology itself."

- id: "interspeech-2025-0648"
  entry_date: "2026-07-21"
  year: 2025
  venue: Interspeech
  task:
  - TTS
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - evaluation_caution
  - infrastructure
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: automated_annotation_exceeds_human_consistency
    role: supports
    claim: "Automated multimodal annotation pipelines can achieve annotation consistency significantly exceeding that of human raters on emotional speech datasets, at substantially lower cost per hour."
    source: "§2.3, Table 1"
    evidence: "MIKU-PAL achieves Fleiss kappa of 0.93-0.95 on MELD and IEMOCAP versus human annotator kappa of only 0.40-0.43, at roughly 1/20th the cost (~$0.50/hour vs. ~$10/hour)."
    confidence: high
    relevance: high
  - claim_id: finegrained_consistent_datasets_improve_emotional_tts
    role: supports
    claim: "Fine-grained emotion datasets with a larger category space and higher annotation consistency lead to measurable improvements in downstream emotional TTS quality compared to smaller manually annotated alternatives."
    source: "§3.2, Table 3"
    evidence: "Fish-Speech fine-tuned on MIKU-EmoBench (131.2h, 26 emotion categories) achieves MOS 4.12 and emotion similarity 0.92 on the MELD test set, versus 3.91 MOS and 0.88 emotion similarity for the baseline."
    confidence: medium
    relevance: medium
  - claim_id: visual_preprocessing_boosts_multimodal_emotion_accuracy
    role: supports
    claim: "Visual preprocessing is a substantial contributor to multimodal emotion recognition accuracy, as removing it causes a measurable drop in classification performance."
    source: "§2.1"
    evidence: "Ablating active-speaker visual preprocessing (via TalkNet-based speaker identification) reduces MELD classification accuracy by 25.6% relative to the full pipeline."
    confidence: medium
    relevance: low
  - claim_id: limited_emotion_taxonomies_cause_benchmark_confusion
    role: complicates
    claim: "The limited emotion category sets in standard SER benchmarks introduce systematic classification confusion for emotionally adjacent categories that are not psychologically distinct."
    source: "§2.3"
    evidence: "The paper argues standard benchmarks using Ekman's six basic emotions (IEMOCAP, MELD) cannot capture nuanced transitions confirmed by t-SNE visualization on MIKU-PAL's 26-category outputs (e.g., admiration to love, joy to satisfied to excitement), motivating the psychologically grounded 26-category taxonomy."
    confidence: medium
    relevance: high
  limitations:
  - "MIKU-PAL accuracy (58.6-68.5%) remains below human accuracy on IEMOCAP (72.9%), and current SER models cannot reliably classify all 26 fine-grained emotion categories, limiting full evaluation of MIKU-EmoBench."
  caveats:
  - "The paper's central insight, that annotation consistency (Fleiss kappa) matters more than raw accuracy for downstream TTS training utility, is a direct and generalisable finding for evaluation-metrics regarding how dataset labeling quality should be assessed."

- id: "interspeech-2025-0656"
  entry_date: "2026-07-21"
  year: 2025
  venue: Interspeech
  task:
  - VC
  architecture:
  - hybrid
  relevance: low
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: crossmodal_alignment_enables_vc_without_target_voice_data
    role: supports
    claim: "Cross-modal feature alignment between neural signals and speaker embeddings can enable voice conversion without any target-speaker voice data."
    source: "§3.1.2, §4.4"
    evidence: "The EEG-voice feature alignment module, trained with embedding MSE and speaker classification losses, produces speaker embeddings from EEG that drive FreeVC-based conversion to zero-shot quality (Naturalness MOS 4.00, Consistency obj 0.8026 for unseen speakers)."
    confidence: medium
    relevance: low
  - claim_id: nonspeech_biometric_signals_encode_speaker_identity
    role: supports
    claim: "Non-speech biometric signals can encode speaker-identity information sufficient to guide voice timbre conversion."
    source: "§4.4.1, Figure 2"
    evidence: "t-SNE visualisation shows synthesised speech clusters align with reference audio per speaker, and Homogeneity scores (0.9437-0.9465) exceed the FreeVC speech-only baseline (0.9371)."
    confidence: medium
    relevance: low
  - claim_id: eeg_vc_requires_speech_pretraining_stage
    role: complicates
    claim: "Zero-shot voice conversion from EEG signals requires a large-scale speech-only pre-training stage to compensate for the scarcity and noise of paired EEG-speech data."
    source: "§3.2"
    evidence: "The three-stage curriculum first pre-trains on VCTK (speech only, Stage I), then aligns EEG to pre-trained speaker embeddings (Stage II), before joint fine-tuning (Stage III); the authors explicitly attribute feasibility to leveraging the pre-trained VC model's representations."
    confidence: medium
    relevance: low
  - claim_id: eeg_vc_evaluation_limited_by_paired_corpora_scarcity
    role: complicates
    claim: "Evaluation of EEG-driven voice conversion is fundamentally limited by the availability of paired EEG-speech corpora at the scale needed for generalisation."
    source: "§4.1, §5"
    evidence: "The entire EEG evaluation uses the Single-Word-Production Dutch-iBIDS dataset (10 speakers, single-word utterances); seen-speaker training uses 80% of this data and unseen-speaker evaluation uses k-fold over just 10 speakers."
    confidence: medium
    relevance: medium
  limitations:
  - "The baseline comparison (FreeVC) is not an equivalent system since it uses a target-speaker voice prompt while the proposed system uses EEG, so observed quality differences may partly reflect the inherent difficulty of the EEG conditioning signal."
  caveats:
  - "The paper does not report intelligibility metrics (WER/CER), making it impossible to assess from the reported evaluation whether semantic content is preserved faithfully alongside the reported speaker-similarity and MOS metrics."

- id: "interspeech-2025-0704"
  entry_date: "2026-07-21"
  year: 2025
  venue: Interspeech
  task:
  - TTS
  architecture:
  - autoregressive-LM
  - flow-matching
  relevance: low
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: codec_token_rewards_reduce_rlhf_compute_cost
    role: supports
    claim: "Computing rewards directly on codec tokens rather than synthesized audio reduces the computational cost of RLHF for codec LM-based TTS systems without sacrificing reward signal quality."
    source: "§3.1"
    evidence: "DiffRO's Token2Reward model predicts ASR transcripts directly from predicted codec token sequences, bypassing the flow-matching and vocoder stages that would otherwise be required to compute rewards on decoded audio."
    confidence: medium
    relevance: low
  - claim_id: gumbel_softmax_enables_differentiable_rlhf
    role: supports
    claim: "Differentiable reward optimization via Gumbel-Softmax can replace PPO-style policy gradient training for codec LM fine-tuning, enabling direct backpropagation through the reward model."
    source: "§3.1, §2.2"
    evidence: "Gumbel-Softmax replaces the argmax token sampling operation in codec token generation, allowing gradients from the reward signal to flow directly back through the LM parameters without a PPO training loop."
    confidence: medium
    relevance: low
  - claim_id: multitask_reward_model_jointly_improves_multiple_dimensions
    role: supports
    claim: "A multi-task reward model trained on codec tokens can simultaneously improve pronunciation accuracy, emotion expressiveness, and audio quality in a single RL training phase."
    source: "§3.2, §4.3"
    evidence: "The Multi-Task Reward model, jointly trained on ASR, SER, SQA, and audio event detection, drives DiffRO-MTR to outperform CosyVoice2.0 baseline on emotion accuracy across most categories while also serving as the basis for MOS-direction control."
    confidence: medium
    relevance: medium
  - claim_id: rlhf_generalizes_to_unseen_languages_via_phonetic_reward
    role: supports
    claim: "RLHF fine-tuning on Mandarin and English data generalizes to unseen languages (Japanese, Korean) when the reward signal targets phonetic accuracy rather than language-specific patterns."
    source: "§4.2, Table 2"
    evidence: "Japanese WER improves from 9.13% to 6.36% and Korean from 7.43% to 5.41% after DiffRO-ASR training, despite no explicit RL training data in those languages."
    confidence: medium
    relevance: low
  - claim_id: post_lm_attributes_resistant_to_lm_level_rlhf
    role: complicates
    claim: "Quality attributes governed primarily by the flow-matching and vocoder stages (MOS, speaker characteristics) are largely resistant to optimization by LM-level RLHF alone."
    source: "§4.3.2, Table 4"
    evidence: "DiffRO can shift the codec-level predicted MOS substantially (e.g., toward MOS_t=2 the codec MOS drops from 3.82 to 2.2), but because the frozen flow-matching model and vocoder largely denoise the output, the resulting audio MOS change is modest (3.77-3.86)."
    confidence: medium
    relevance: medium
  limitations:
  - "The MTR reward model requires a large in-house multi-task labeled corpus (13,000+ hours) that is not publicly available, limiting reproducibility of the multi-dimensional reward signal."
  caveats:
  - "The paper's Multi-Task Reward model operationalizes multiple evaluation dimensions (ASR/WER, SER, SQA/MOS proxy, audio events) as differentiable training rewards, illustrating how evaluation-metrics concepts can be repurposed as optimization targets rather than only as post-hoc assessment tools."

- id: "interspeech-2025-0706"
