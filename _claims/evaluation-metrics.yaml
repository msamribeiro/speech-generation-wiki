  current_role: influential
  method_family: []
  claims:
  - claim_id: ssm_enables_stable_long_form_generation
    role: supports
    claim: "Linear-time state-space sequence models enable stable long-form speech generation that
      Transformer spoken LMs cannot sustain at comparable scale."
    source: "§7.1, §7.2, Tables 3-4"
    evidence: "SpeechSSM-2B maintains N-MOS of 4.12-4.16 across all time strata up to 4+ minutes
      and stable semantic coherence in 16-minute generation, while Transformer-based baselines and
      windowed extensions of prior spoken LMs degrade rapidly beyond their training lengths."
    confidence: high
    relevance: low
  - claim_id: separating_speaker_conditioning_preserves_identity_long_form
    role: supports
    claim: "Separating speaker conditioning into a dedicated acoustic synthesis stage preserves
      voice identity more effectively in long-form speech generation than encoding speaker
      information in semantic tokens."
    source: "§6.1, §7.1, Tables 2-3"
    evidence: "SpeechSSM achieves SpkrSim of 0.85 in long-form evaluation versus 0.33-0.41 for
      GSLM and TWIST, attributed to SoundStorm's speaker-prompted acoustic stage handling identity
      independently of the semantic LM."
    confidence: medium
    relevance: low
