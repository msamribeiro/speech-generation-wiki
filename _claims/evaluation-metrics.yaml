- id: "interspeech-2025-0438"
  entry_date: "2026-07-21"
  year: 2025
  venue: Interspeech
  task:
  - VC
  architecture:
  - hybrid
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: minor
  method_family: []
  claims:
  - claim_id: linear_ssl_projection_sufficient_for_competitive_vc
    role: supports
    claim: "Linear transformations of self-supervised speech features are sufficient for competitive voice conversion, without complex nonlinear decoders or model fine-tuning."
    source: "§3.2, Table 1"
    evidence: "LinearVC's single learned projection matrix on WavLM-Large layer 6 achieves WER 4.9%, EER 33.6%, and MUSHRA naturalness 62.5 on LibriSpeech test-clean, statistically indistinguishable from kNN-VC and SoundStorm."
    confidence: high
    relevance: low
  - claim_id: content_speaker_orthogonal_subspaces_in_ssl_features
    role: supports
    claim: "Content and speaker identity information reside in orthogonal low-dimensional subspaces within the same SSL layer, enabling voice style transfer through geometric manipulation."
    source: "§4, Table 2; §5.2, Figure 4"
    evidence: "Constraining the linear transformation to rotation and reflection only achieves EER 27.7% versus 31.8% for unconstrained; translation alone gives only EER 7.7% with intelligibility maintained, confirming a shared phonetic subspace across speakers."
    confidence: high
    relevance: low
  - claim_id: naturalness_similarity_tradeoff_in_vc
    role: complicates
    claim: "High naturalness in voice conversion does not imply high speaker similarity, these objectives can trade off sharply depending on the system design."
    source: "§3.2, Table 1"
    evidence: "FreeVC achieves the highest naturalness (71.1 MUSHRA) among all systems but the lowest speaker similarity (EER 10.5% versus 33.6% for LinearVC and 38.9% for kNN-VC), indicating perceptual smoothness and target-speaker fidelity are partly in tension."
    confidence: medium
    relevance: medium
  - claim_id: eer_coarse_proxy_for_perceived_similarity
    role: refines
    claim: "EER as an objective speaker similarity metric provides only coarse correspondence with perceived speaker similarity in voice conversion evaluation."
    source: "§3.2"
    evidence: "LinearVC and kNN-VC have comparable subjective similarity (67.5 versus 67.2) despite different EERs (33.6 versus 38.9), and the paper notes small EER differences do not reliably track subjective similarity ratings."
    confidence: medium
    relevance: high
  limitations:
  - "The analysis is restricted to WavLM-Large (layer 6) on English LibriSpeech; whether the orthogonal subspace structure holds for other SSL models, layers, or languages is untested."
  caveats:
  - "The paper's direct observation that objective EER and subjective similarity ratings diverge is a concrete, generalisable caution for speaker-similarity metric design in voice conversion evaluation."

- id: "interspeech-2025-0464"
  entry_date: "2026-07-21"
