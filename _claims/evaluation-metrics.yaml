    role: complicates
    claim: "Systematic progress measurement in turn-taking modeling is impeded by the absence of
      shared evaluation benchmarks."
    source: "§7.1"
    evidence: "72% of surveyed papers do not compare their methods with prior work; one third of EOU
      detection papers use no public corpus, making cross-study comparison unreliable."
    confidence: high
