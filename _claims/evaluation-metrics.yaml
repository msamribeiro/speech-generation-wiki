- id: "interspeech-2025-0355"
  entry_date: "2026-07-21"
  year: 2025
  venue: Interspeech
  task:
  - codec
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: codec_robustness_not_bitrate_invariant
    role: supports
    claim: "Codec noise robustness does not reliably rank consistently across bitrate regimes, and clean-speech quality metrics are a poor proxy for noisy-condition performance."
    source: "§4, Figure 1"
    evidence: "At the highest bitrate, DAC outperforms EnCodec in noise robustness; at 3 kbps, EnCodec surpasses DAC on most downstream metrics under noise, and HiFi-Codec matches EnCodec on clean-speech perceptual quality but degrades far more under noise."
    confidence: high
    relevance: high
  - claim_id: codec_nonlinearity_explains_robustness_failures
    role: supports
    claim: "Neural speech codecs exhibit non-linear input-output behavior (violations of additivity and homogeneity) that partially explains their robustness failures under noise and signal overlap."
    source: "§5, Figure 2"
    evidence: "Additivity improves with bitrate across all evaluated codecs, and codecs with better additivity (DAC) show stronger noise robustness, while HiFi-Codec and SpeechTokenizer exhibit uneven homogeneity at extreme gains, aligning with higher degradation in speaker and emotion metrics."
    confidence: medium
    relevance: medium
  - claim_id: clean_speech_metrics_incomplete_for_codec_eval
    role: complicates
    claim: "Codec evaluation using only clean-speech reconstruction metrics provides an incomplete characterization of codec behavior for real-world speech processing pipelines."
    source: "§4"
    evidence: "Perceptual quality (PESQ) converges to similar values across codecs under severe noise, masking large differences in phonetic content (WER), speaker identity (EER), and emotional fidelity (SER-ACC)."
    confidence: high
    relevance: high
  - claim_id: low_frequency_boosting_consistent_codec_artifact
    role: supports
    claim: "Low-frequency spectral emphasis introduced by time-domain training losses is a consistent artifact across neural speech codecs and can cause unintended spectral coloration."
    source: "§6, Figure 3"
    evidence: "All five evaluated codecs exhibit low-frequency boosting below 100 Hz under sine sweep analysis, most pronounced in EnCodec, attributed to waveform-level L1/L2 training losses."
    confidence: medium
    relevance: low
  limitations:
  - "The evaluation is limited to five codecs, all using residual vector quantization; more recent codecs with different quantization strategies are not included, and all test data are English."
  caveats:
  - "This paper is a direct evaluation-methodology contribution: it demonstrates that standard clean-speech reconstruction metrics (PESQ, Mel Distance) are insufficient indicators of codec robustness, motivating multi-metric evaluation across phonetic, speaker, and emotional axes for codec benchmarking."

- id: "interspeech-2025-0383"
  entry_date: "2026-07-21"
