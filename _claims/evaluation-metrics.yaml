  claims:
  - claim_id: interleaved_audio_text_tokens_enable_e2e_dialogue
    role: supports
    claim: "Interleaving discrete audio tokens with text tokens in a shared language model
      vocabulary enables end-to-end spoken dialogue systems that respond coherently to
      paralinguistic cues without requiring separate speech synthesis pipelines."
    source: "§3.1, §4.6"
    evidence: "Step-Audio 2 extends the LLM vocabulary with 6.6K CosyVoice 2 audio tokens and
      generates interleaved text/audio sequences directly, achieving 83.09% accuracy on the
      authors' StepEval-Audio-Paralinguistic benchmark versus 49.64% for Kimi-Audio."
    confidence: medium
    relevance: low
  - claim_id: rl_improves_audio_lm_reasoning_efficiency
    role: supports
    claim: "Reinforcement learning applied to audio language models can improve reasoning efficiency
      in complex acoustic scenarios while preserving generation quality."
    source: "§3.4"
    evidence: "Multi-stage RL using PPO and GRPO is applied after supervised fine-tuning to improve
      reasoning efficiency and audio perceptual ability, contributing to Step-Audio 2's leading
      scores on the MMAU audio understanding benchmark (78.0 average)."
    confidence: low
    relevance: low
  - claim_id: rag_tool_calling_reduces_hallucination
    role: supports
    claim: "Retrieval-augmented generation and external tool calling can substantially reduce
      hallucination and expand capability (timbre switching, web-grounded responses) in large audio
      language models without architectural redesign."
    source: "§3.1, §4.5"
    evidence: "An audio search tool retrieves from a library of hundreds of thousands of speech
      samples to enable inference-time timbre switching and style retrieval, alongside web search
      and factual tools, without modifying the core architecture."
    confidence: medium
    relevance: low
  - claim_id: multitask_pretraining_improves_lowresource_dialogue
    role: supports
    claim: "Comprehensive multi-task pre-training across ASR, TTS, translation, and conversation
      significantly improves spoken dialogue performance in low-resource languages and accented
      speech."
    source: "§3.2, §4.1"
    evidence: "On in-house low-resource dialect and accented Mandarin test sets, Step-Audio 2
      achieves 8.85% average CER versus 25.52% for Kimi-Audio and 40.49% for GPT-4o Transcribe."
    confidence: medium
    relevance: low
  - claim_id: existing_benchmarks_miss_paralinguistic_toolcall_dimensions
    role: complicates
    claim: "Existing audio language model benchmarks fail to capture fine-grained paralinguistic
      comprehension and voice-triggered tool invocation, leaving important capability dimensions
      systematically unmeasured."
    source: "§4.2, §4.5"
    evidence: "The authors introduce StepEval-Audio-Paralinguistic (11 paralinguistic dimensions)
      and StepEval-Audio-Toolcall specifically because no prior benchmark measured these
      capabilities, though both are author-constructed and not yet independently validated."
    confidence: medium
    relevance: high
  limitations:
  - "Two of the main evaluation benchmarks (StepEval-Audio-Paralinguistic, StepEval-Audio-Toolcall)
    are introduced by the authors themselves and have not been validated independently, so results
    on these benchmarks may overstate absolute capability levels."
  caveats:
  - "Model size is not reported, making parameter-count-normalized comparisons with other open
    audio LMs (Kimi-Audio, Qwen2.5-Omni) difficult to interpret, a common evaluation confound in
    this literature."

- id: "2507.16875"
  entry_date: "2026-07-20"
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - flow-matching
  relevance: low
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: duration_strategy_language_dependent_tradeoffs
    role: complicates
    claim: "Duration prediction strategy choice in zero-shot TTS presents language-dependent
      trade-offs between intelligibility and speaker similarity that are not consistent across
      multilingual settings."
    source: "§5, Table 3, Table 5"
    evidence: "The speaker-prompted (PFlow-style) predictor improves Tamil intelligibility (WER
      0.295 vs. 0.312) and speaker similarity (SMOS 4.56 vs. 4.41) but degrades Marathi
      intelligibility substantially (WER 0.365 vs. 0.224 for infill), while Bengali human
      evaluation favours infill on both dimensions."
    confidence: medium
    relevance: low
  - claim_id: speaker_prompted_duration_no_forced_alignment
    role: supports
    claim: "Speaker-conditioned audio prompting enables duration prediction without forced
      alignment, yielding competitive or superior speaker similarity in low-resource multilingual
      TTS."
    source: "§3.4.2, §5.1, Table 4, Table 5"
    evidence: "The 84M-parameter speaker-prompted predictor, conditioning on a 3-second mel
      spectrogram via cross-attention, achieves higher Sim-o scores than the infill predictor for
      Tamil, Telugu, and Bengali, and substantially higher human SMOS for Hindi (4.14 vs. 3.57),
      without using explicit duration context at inference."
    confidence: medium
    relevance: low
  - claim_id: pooled_corpora_quality_variance_requires_filtering
    role: complicates
    claim: "Pooled low-resource training corpora for multilingual TTS contain significant quality
      variance that requires aggressive filtering before flow-matching models can be reliably
      trained."
    source: "§4.2.2"
    evidence: "WER-based filtering using IndicWhisper reduced the Hindi training set from 1.3M to 1M
      utterances; a partial recovery via CTC alignment scores added 30K back, indicating that
      roughly 23% of the raw data was too noisy or misaligned to be usable."
    confidence: medium
    relevance: low
  - claim_id: speaker_prompting_benefit_depends_on_phonology
    role: refines
    claim: "The relative benefit of speaker-prompted duration conditioning over text-and-alignment
      conditioning is not uniform and depends on the phonological and prosodic characteristics of
      the target language."
    source: "§5.1, §5.2, Table 3, Table 4, Table 5"
    evidence: "Tamil, with complex phoneme structures and high prosodic variability, benefits
      consistently from speaker prompting across both objective WER and human SMOS; Marathi shows a
      clear regression; Hindi and Bengali exhibit mixed patterns depending on test subset."
    confidence: medium
    relevance: low
  limitations:
  - "All experiments are conducted on speech infilling (50% sentence masking) rather than
    full-sentence TTS generation, so intelligibility and speaker-similarity results may not
    transfer directly to the standard single-utterance TTS evaluation setting."
  caveats:
  - "The paper reports both objective (WER, Sim-o) and human (QMOS, SMOS) evaluation with 30
    annotators per language, but no external TTS baselines from the Indian-language literature are
    included, limiting the evaluation's comparative value."

- id: "2505.15670"
  entry_date: "2026-07-20"
  year: 2025
  venue: arXiv
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - core_evidence
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: fullduplex_without_speech_pretraining
    role: supports
    claim: "Full-duplex spoken dialogue systems can be built without speech-text pretraining by
      routing user audio through a pretrained streaming encoder rather than requiring the LLM to
      learn audio representations end-to-end."
    source: "§3, §6.1, §6.2, Tables 2-3"
    evidence: "SALM-Duplex skips speech pretraining entirely and instead uses a 100M streaming CTC
      encoder for user input; it still outperforms Moshi on barge-in success rate (94.5% vs. 55.1%)
      and reasoning GPT scores across all five evaluation sets."
    confidence: high
    relevance: low
  - claim_id: asymmetric_duplex_enables_specialization
    role: supports
    claim: "Asymmetric duplex architectures that separate user and agent speech pathways enable
      independent specialization, including speaker-specific codec fine-tuning without affecting
      user comprehension."
    source: "§3.2, §6.3, Table 4"
    evidence: "Personalized 0.6 kbps NanoCodec (fine-tuned on 21k target-speaker utterances)
      outperforms Moshi's Mimi at 1.1 kbps and untuned NanoCodec at 1.2 kbps on MOS, CER, and SECS,
      while operating at roughly half the bitrate."
    confidence: high
    relevance: low
  - claim_id: e2e_s2s_not_consistently_matching_cascaded
    role: complicates
    claim: "End-to-end speech-to-speech models do not consistently match optimal cascaded systems in
      reasoning quality, even when the cascaded oracle has access to ground-truth ASR transcriptions
      of user speech."
    source: "§6.2, Table 3"
    evidence: "SALM-Duplex outperforms GT+LLM on Roleplay and ASR-QA but underperforms on UltraChat
      (3.5 vs. 6.4), Topic, and Alpaca; the gap reflects compounding ASR error and limited backbone
      reasoning capacity at 1.1B parameters."
    confidence: medium
    relevance: low
  - claim_id: bargein_latency_more_discriminative_than_utmos
    role: supports
    claim: "Barge-in success rate and latency together constitute more discriminative signals for
      evaluating full-duplex systems than speech quality metrics such as UTMOS."
    source: "§5.2, §6.1, Table 2"
    evidence: "On the Impatient set, SALM-Duplex and Moshi have zero false alarms each and UTMOS
      within 0.2 points (4.0 vs. 3.8), yet differ by 39.4 percentage points in barge-in success
      rate, making success rate the dominant differentiating metric."
    confidence: high
    relevance: high
  limitations:
  - "Quantitative comparison is restricted to Moshi; other contemporaneous duplex systems
    (OmniFlatten, SALMONN-Omni, MinMo) are discussed but not benchmarked, limiting how broadly the
    evaluation protocol's conclusions generalize."
  caveats:
  - "The paper's Impatient test set (halved inter-turn silence to force frequent interruption) is a
    deliberately adversarial construction that yields much sharper discrimination between systems
    (39.4-point gap in barge-in success rate) than speech-quality metrics like UTMOS (0.2-point
    gap), illustrating that duplex evaluation requires interaction-specific metrics beyond standard
    speech quality scores."

- id: "2025.acl-industry.42"
  entry_date: "2026-07-20"
  year: 2025
  venue: ACL
  task:
  - TTS
  architecture:
  - GAN
  - transformer-enc-dec
  relevance: low
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: g2p_conversion_most_important_for_tonal_intelligibility
    role: supports
    claim: "Accurate grapheme-to-phoneme conversion is the single most important preprocessing
      component for intelligibility in tonal-language TTS, contributing more to WER reduction than
      tokenisation or pause prediction combined."
    source: "§6, Table 3"
    evidence: "Ablation shows removing the G2P module raises WER from 6.3% to 22.5%, far more than
      removing tokenization (10.2%) or pause prediction (6.5%), confirming G2P as the dominant
      contributor to intelligibility in this Thai TTS system."
    confidence: high
    relevance: low
  - claim_id: domain_specific_data_reduces_proprietary_degradation
    role: supports
    claim: "Proprietary general-purpose TTS systems degrade substantially on domain-specific
      vocabulary, while systems trained with targeted vertical-domain data show much smaller
      performance drops in specialised settings."
    source: "§6, Table 2"
    evidence: "On domain-specific tasks (finance, healthcare, education, law), Google TTS's WER
      rises from 6.5% (general domain) to 14.5%, while the proposed system trained with
      vertical-domain data shows only a small degradation to 6.5% domain WER."
    confidence: medium
    relevance: medium
  - claim_id: zero_shot_speaker_similarity_competitive_with_vc
    role: supports
    claim: "Low-resource TTS systems can achieve competitive speaker similarity in zero-shot voice
      cloning relative to voice conversion models when trained with a style embedding module, even
      without speaker-specific fine-tuning."
    source: "§6, Table 4"
    evidence: "The style-encoder-based zero-shot cloning system achieves SIM 0.91 and SMOS 4.5 on a
      10-second reference clip, exceeding OpenVoice's 0.85 SIM and 4.0 SMOS, without speaker-specific
      fine-tuning."
    confidence: medium
    relevance: low
  - claim_id: tonal_bert_prosody_improves_naturalness
    role: supports
    claim: "Contextual prosody modelling via a tonal phoneme-aware BERT encoder improves naturalness
      scores in tonal-language TTS beyond what standard duration and pitch predictors achieve."
    source: "§5"
    evidence: "The Phoneme-Tone BERT prosody encoder feeding duration, pitch, and energy predictors
      contributes to a general-domain NMOS of 4.4, exceeding all compared open-source Thai TTS
      baselines."
    confidence: medium
    relevance: low
  limitations:
  - "Model size and full architecture details are not reported, limiting reproducibility of the
    reported metric values."
  caveats:
  - "The zero-shot cloning comparison is against OpenVoice, a voice-conversion model, rather than
    another zero-shot TTS system, weakening the evaluative validity of the SIM/SMOS comparison for
    that specific claim."

- id: "2025.acl-long.1252"
  entry_date: "2026-07-20"
  year: 2025
  venue: ACL
  task:
  - TTS
  - SCA
  architecture:
  - hybrid
  relevance: low
  evidence_role:
  - infrastructure
  current_role: frontier_probe
  method_family: []
  claims:
  - claim_id: acoustic_accent_match_improves_chatbot_reception
    role: supports
    claim: "Incorporating an acoustic accent that matches a user's linguistic community improves
      chatbot warmth, similarity, and engagement preference even when the underlying text remains
      in standard dialect."
    source: "§4.4.2, Figure 4"
    evidence: "The AA-accent + SAE-text spoken chatbot configuration outperforms the SAE baseline
      across all evaluated Likert dimensions (comprehension, communication ease, similarity, role
      appropriateness, engagement preference) among 8 AAE-speaking evaluators."
    confidence: medium
    relevance: low
  - claim_id: high_intensity_text_dialect_produces_caricature
    role: complicates
    claim: "Text-based dialect generation at high intensity produces caricature-like representations
      that degrade perceived inoffensiveness and role appropriateness with speakers of that
      dialect."
    source: "§4.4.1, Figure 3"
    evidence: "High-AAE text chatbots receive the worst inoffensiveness scores among all 9 AAE text
      variants, with near-neutral or negative scores for trustworthiness and role appropriateness,
      which the authors attribute to caricature-like over-modification rather than authentic AAE."
    confidence: medium
    relevance: low
  - claim_id: phonetic_modification_dominates_llm_generated_aae
    role: supports
    claim: "Phonetic modification dominates LLM-generated AAE output, while semantic feature
      generation remains sparse across all tested models and intensity levels."
    source: "§4.3, Figure 2"
    evidence: "Claude-Sonnet-3.5-based AAE feature tagging (91% accuracy) shows phonetic features
      dominate across all three LLMs' generated AAE text, while semantic AAE features remain sparse
      regardless of intensity level."
    confidence: medium
    relevance: low
  - claim_id: tts_trained_on_standard_dialect_degrades_on_minority_accent
    role: complicates
    claim: "TTS models trained predominantly on standard-dialect data exhibit degraded speech
      clarity when reproducing minority accent features, limiting the fidelity of
      accent-conditioned spoken chatbots."
    source: "§5"
    evidence: "F5-TTS, trained predominantly on Standard American English data, shows decreasing
      speech clarity ratings as AAE dialect intensity increases in the spoken chatbot condition,
      even though it is applied only via a single CORAAL reference clip for accent."
    confidence: medium
    relevance: low
  limitations:
  - "The evaluator pool is small (12 text, 8 spoken) from a single university demographic, limiting
    the statistical reliability of the 15-metric Likert evaluation framework."
  caveats:
  - "No objective acoustic analysis of the AA-accent TTS output against a ground-truth AA speaker is
    provided, so the study's evaluation relies entirely on subjective Likert ratings without an
    automatic-metric cross-check."

- id: "2025.acl-long.1471"
  entry_date: "2026-07-20"
  year: 2025
  venue: ACL
  task:
  - evaluation
  architecture: []
  relevance: medium
  evidence_role:
  - infrastructure
  current_role: frontier_probe
  method_family: []
  claims:
  - claim_id: prosody_redundant_with_longpast_shortfuture_context
    role: supports
    claim: "Prosodic features such as pitch, loudness, and prominence are redundant with an extended
      past linguistic context of 3-8 words, but are redundant with future context only over a short
      span of 1-2 words."
    source: "§5, §7"
    evidence: "Mutual information between pitch, loudness, and prominence and past linguistic
      context increases until roughly 3-8 words then plateaus, while mutual information with future
      context saturates after only 1-2 words, across LibriTTS audiobook data."
    confidence: high
    relevance: low
  - claim_id: duration_pause_opposite_asymmetry
    role: complicates
    claim: "Duration and pause exhibit the opposite asymmetry to other prosodic features: they carry
      little redundancy with past context beyond word identity, but show stronger redundancy with
      future context, likely due to sentence-boundary predictability."
    source: "§5, §6.4"
    evidence: "Unlike pitch, loudness, and prominence, duration and pause show no MI increase with
      additional past context beyond the word itself, but MI with future context saturates after
      about 4 words for pause and 1 word for duration, attributed to sentence-boundary
      predictability."
    confidence: medium
    relevance: low
  - claim_id: finetuned_mlm_mi_estimator_viable_evaluation_framework
    role: supports
    claim: "Fine-tuned masked language models provide a viable framework for quantifying how much
      linguistic context is needed to predict prosodic features, with mutual information serving as
      an interpretable upper-bounded estimator."
    source: "§3.1, §4.2"
    evidence: "A single fine-tuned BERT/BERT-large/RoBERTa-large model trained on randomly sampled
      context-length spans estimates conditional entropy H(P_t | W_{n,m}) to derive mutual
      information as an interpretable upper-bounded estimator of prosody-context redundancy."
    confidence: high
    relevance: high
  - claim_id: prosody_serves_dual_communicative_function
    role: supports
    claim: "The asymmetric time scale of prosody-context redundancy implies that prosody serves at
      least two distinct communicative functions: reinforcing information from longer-range past
      context and signaling short-term upcoming structure."
    source: "§6.2, §6.3, §7"
    evidence: "The asymmetric long-past/short-future MI pattern found across pitch, loudness, and
      prominence, contrasted with the reversed pattern for duration and pause, is interpreted as
      evidence that prosody reinforces longer-range past context while separately signaling
      short-term upcoming structure."
    confidence: medium
    relevance: low
  limitations:
  - "Mutual information values are cross-entropy upper bounds, and a single BERT-based model handles
    all context-length combinations, which may be suboptimal for any specific (past, future)
    pairing."
  caveats:
  - "The information-theoretic mutual-information framework offers a principled alternative to ad
    hoc correlation-based prosody evaluation, but it has not yet been adopted as an evaluation tool
    within TTS papers themselves, only within this linguistics-oriented analysis."

- id: "2025.acl-long.1498"
  entry_date: "2026-07-20"
  year: 2025
  venue: ACL
  task:
  - TTS
  - codec
  architecture:
  - autoregressive-LM
  - GAN
  relevance: high
  evidence_role:
  - core_evidence
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: context_dependent_encoding_causes_token_divergence
    role: supports
    claim: "Context-dependent encoding in RVQ-based neural audio codecs causes perceptually
      equivalent audio segments to produce divergent discrete token sequences, increasing
      prediction uncertainty in downstream codec language models."
    source: "§2, §2.3"
    evidence: "FunCodec 8 kbps shows only 3.58% consistency across all 16 codebook layers when the
      same audio segment is encoded in isolation versus within a full-length clip, confirming that
      convolutional RVQ encoders with large receptive fields produce context-dependent token
      sequences for perceptually identical audio."
    confidence: high
    relevance: high
  - claim_id: consistency_correlates_with_downstream_tts_quality
    role: supports
    claim: "Codec token consistency and downstream autoregressive TTS quality are monotonically
      correlated: improvements in consistency accuracy reliably reduce word error rate and increase
      speaker similarity."
    source: "§5.2, Figure 4"
    evidence: "Figure 4 shows a clear monotonic relationship between the paper's consistency
      accuracy metric and downstream VALL-E WER across codecs, and the proposed codec (71.03%
      all-layer consistency at 4 kbps) yields VALL-E WER of 3.51% versus 8.51% for the same
      architecture without the consistency constraint."
    confidence: high
    relevance: high
  - claim_id: auxiliary_consistency_losses_negligible_quality_cost
    role: supports
    claim: "Auxiliary consistency losses applied during codec training can substantially increase
      token consistency with negligible impact on reconstruction quality."
    source: "§5.1, Table 1"
    evidence: "The proposed codec's slice-consistency and perturbation-consistency losses raise
      all-layer consistency from FunCodec's 6.86% to 71.03% at 4 kbps while ViSQOL and PESQ change
      by less than 0.02 points relative to the unconstrained baseline."
    confidence: high
    relevance: medium
  - claim_id: consistency_constraint_generalizes_across_architectures
    role: supports
    claim: "Consistency constraint methods applied to codec training generalize across neural codec
      architectures and autoregressive LM backbones, as demonstrated by cross-system experiments on
      both EnCodec-VALL-E and FunCodec-UniAudio pipelines."
    source: "§5.2, Table 3"
    evidence: "Applying the consistency constraint to EnCodec as VALL-E's tokenizer reduces WER from
      9.02% to 5.13% at 960 hours, and applying it within UniAudio's FunCodec pipeline reduces WER
      from 5.90% to 2.39% while raising SIM from 54.20% to 59.09%."
    confidence: high
    relevance: medium
  - claim_id: deeper_codebook_layers_more_inconsistent
    role: supports
    claim: "In RVQ codecs, deeper codebook layers suffer disproportionately from context-induced
      inconsistency, because they encode fine-grained acoustic detail that is more sensitive to
      contextual perturbation than the semantic information stored in shallow layers."
    source: "§2.3, Appendix A.3, Table 6"
    evidence: "Per-layer consistency analysis shows the proposed codec's layer-1 consistency at
      96.13% versus EnCodec's 74.66%, with consistency declining substantially at deeper codebook
      layers across every codec examined because shallow layers encode context-independent semantic
      information while deeper layers encode fragile fine-grained acoustic detail."
    confidence: high
    relevance: medium
  limitations:
  - "The MOS and SMOS subjective evaluations use only 50 audio samples, a small panel by modern
    standards, and confidence intervals are not reported for these subjective metrics."
  caveats:
  - "The consistency accuracy metric introduced here is a genuinely new codec diagnostic (measuring
    token stability under context perturbation, not just reconstruction fidelity), complementary to
    standard codec metrics like PESQ and ViSQOL, and shown to correlate monotonically with
    downstream WER across codecs."

- id: "2025.acl-long.313"
  entry_date: "2026-07-20"
  year: 2025
  venue: ACL
  task:
  - TTS
  architecture:
  - flow-matching
  relevance: medium
  evidence_role:
  - infrastructure
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: explicit_alignment_not_required_for_robust_naf_tts
    role: supports
    claim: "Explicit phoneme-level alignment is not required for robust non-autoregressive zero-shot
      TTS; modality-specific representation refinement before feature concatenation can resolve
      text-speech alignment failures in alignment-free architectures."
    source: "§3.2, §5.1"
    evidence: "ConvNeXt V2 text refinement prior to concatenation resolves the alignment-failure
      mode observed in E2 TTS without reintroducing phoneme-level forced alignment or a duration
      predictor, achieving WER 2.42% on the newly released LibriSpeech-PC test-clean benchmark."
    confidence: high
    relevance: low
  - claim_id: entangled_semantic_acoustic_features_cause_alignment_failure
    role: complicates
    claim: "Deep entanglement of semantic and acoustic features in a shared transformer produces
      systematic alignment failures in non-autoregressive TTS that persist across training scale and
      cannot be addressed by re-ranking."
    source: "§3.2, §5.1, Table 4"
    evidence: "Removing the ConvNeXt text-refinement branch (F5-TTS -Conv2Text) causes complete
      alignment failure, and applying the same refinement to E2 TTS's U-Net backbone instead
      degrades WER to 18.1%, showing the entanglement problem is backbone-specific and not resolved
      by re-ranking alone."
    confidence: high
    relevance: low
  - claim_id: sway_sampling_improves_faithfulness_without_retraining
    role: supports
    claim: "Inference-time flow step scheduling that densifies early integration steps improves
      faithfulness and speaker similarity in flow-matching TTS without any retraining."
    source: "§3.2, §5.2, Table 5"
    evidence: "Sway Sampling improves WER from 2.84% to 2.41% and UTMOS from 3.70 to 3.89 at 32 NFE
      on LibriSpeech-PC test-clean without any retraining, and the same inference-time schedule
      also improves E2 TTS's WER from 2.95% to 2.84%, confirming portability across CFM-based TTS
      models."
    confidence: high
    relevance: low
  - claim_id: naf_flowmatching_matches_ar_at_100k_hour_scale
    role: supports
    claim: "Non-autoregressive flow-matching TTS trained at 100K-hour scale can match autoregressive
      systems on intelligibility while achieving substantially lower real-time factor."
    source: "§5, Table 1"
    evidence: "At 16 NFE, F5-TTS achieves WER 2.53% with an RTF of 0.15, compared to Voicebox's RTF
      of 0.64 and DiTTo-TTS's 0.162, while remaining competitive with autoregressive systems on
      intelligibility across Seed-TTS test-en and test-zh."
    confidence: medium
    relevance: low
  - claim_id: missing_standardized_benchmarks_barrier_to_comparison
    role: supports
    claim: "Absence of standardised benchmark subsets with released prompt lists is a structural
      barrier to fair cross-paper comparison in zero-shot TTS; community-released evaluation sets
      directly reduce this problem."
    source: "§4"
    evidence: "The paper notes that comparisons with VALL-E 2 and MELLE rely on scores from a
      different, incompatible LibriSpeech test-clean subset reported in prior work, motivating the
      release of the fixed-prompt-list LibriSpeech-PC benchmark to enable fair cross-paper
      comparison in zero-shot TTS."
    confidence: high
    relevance: high
  limitations:
  - "Comparisons against VALL-E 2 and MELLE reuse numbers from a different LibriSpeech test-clean
    subset reported in prior work, which cannot be directly compared to the LibriSpeech-PC results
    introduced by this paper."
  caveats:
  - "The paper's release of the LibriSpeech-PC benchmark (with fixed prompt lists) directly
    addresses a structural evaluation problem in the field: prior zero-shot TTS papers used
    incompatible, often unreleased test subsets, precluding fair cross-paper comparison."

- id: "2025.acl-long.598"
  entry_date: "2026-07-20"
  year: 2025
  venue: ACL
  task:
  - TTS
  architecture:
  - autoregressive-LM
  - flow-matching
  - hybrid
  relevance: medium
  evidence_role:
  - infrastructure
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: cross_model_preference_pairs_yield_larger_gains
    role: supports
    claim: "Preference alignment with cross-model preference pairs yields larger intelligibility
      improvements than single-model self-comparison pairs for TTS post-training."
    source: "§5.2, Table 5"
    evidence: "Ablation shows that combining intra-model and inter-model (cross-model) preference
      pairs yields larger WER reductions than intra-model self-comparison pairs alone, with
      inter-pairs and intra-pairs shown to be complementary."
    confidence: medium
    relevance: low
  - claim_id: dpo_derivable_for_flow_matching_and_masked_generative
    role: supports
    claim: "DPO objectives can be derived for flow-matching and masked generative TTS architectures
      by operating in velocity space and masked token distributions, respectively, without
      requiring explicit reward models."
    source: "§4.2, §4.3"
    evidence: "The paper derives DPO-FM by showing the log-ratio of learned versus reference
      velocity fields at each flow timestep is equivalent to an MSE difference in predicted
      velocities, and derives DPO-MGM operating on masked token distributions, enabling principled
      preference alignment for F5-TTS and MaskGCT respectively."
    confidence: high
    relevance: low
  - claim_id: intelligibility_gains_generalize_to_unseen_languages
    role: supports
    claim: "Intelligibility gains from preference alignment on English and Chinese data generalize
      to unseen languages (Japanese, Korean, German, French) without degrading speaker similarity."
    source: "§5.1, Table 10"
    evidence: "INTP alignment trained only on English and Chinese data reduces WER substantially
      when evaluated on Japanese, Korean, German, and French via GTSinger, without measurable loss
      in speaker similarity."
    confidence: high
    relevance: medium
  - claim_id: weak_to_strong_generalization_in_speech_alignment
    role: supports
    claim: "Preference datasets constructed from weaker TTS generators effectively improve stronger
      models outside the training distribution, demonstrating weak-to-strong generalization in
      speech alignment."
    source: "§5.1, Table 4"
    evidence: "Preference data built from the weaker ARS, F5-TTS, and MaskGCT generators improves
      the stronger CosyVoice 2 (average WER 13.09 to 10.56) and the authors' own Ints model, which
      were not part of INTP's construction."
    confidence: high
    relevance: low
  - claim_id: iterative_alignment_diminishing_returns
    role: refines
    claim: "Iterative preference alignment yields diminishing returns across rounds, suggesting that
      base model capability is the primary ceiling on alignment effectiveness."
    source: "§5.3, Table 6"
    evidence: "Ints v1 (INTP-aligned) generates new preference data to train Ints v2, reducing
      average WER from 7.96 to 7.10, a smaller relative gain than the initial alignment round,
      suggesting base model capability bounds further iterative improvement."
    confidence: medium
    relevance: low
  limitations:
  - "All evaluation uses the SeedTTS test sets (English and Chinese); no evaluation on genuinely
    out-of-distribution natural speech (e.g., radio or phone-call recordings) is provided."
  caveats:
  - "The paper constructs custom code-switching and cross-lingual evaluation sets and extends
    testing to Japanese, Korean, German, and French via GTSinger, providing one of the more
    systematic domain-stratified intelligibility evaluations in the zero-shot TTS literature, though
    coverage remains concentrated in English/Chinese for the primary INTP dataset."

- id: "2025.acl-long.681"
  entry_date: "2026-07-20"
  year: 2025
  venue: ACL
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: low
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: large_scale_instruction_datasets_improve_generalization
    role: supports
    claim: "Large-scale instruction datasets that span diverse acoustic and paralinguistic
      dimensions improve speech-text LLM generalization on instruction-following benchmarks beyond
      what smaller task-specific corpora achieve."
    source: "§5.2, Table 3"
    evidence: "SIFT-LLM outperforms O-ASQA-LLM (same backbone, fine-tuned on 2.7M-example
      OpenASQA) across all benchmarks, including 46.1% vs. 22.9% on EvalSIFT closed-ended and 57.4%
      vs. 45.9% on Dynamic-Superb."
    confidence: high
    relevance: low
  - claim_id: instruction_finetuning_reduces_specialized_performance
    role: complicates
    claim: "Instruction fine-tuning on diverse speech tasks reduces specialized performance on
      foundational tasks relative to the pre-trained model checkpoint."
    source: "§5.3, Table 4"
    evidence: "SIFT-LLM WER on LibriSpeech test-clean rises from 2.5% (50K pre-training checkpoint)
      to 3.5% after instruction fine-tuning, consistent with behavior observed in Qwen2-Audio and
      its instruction fine-tuned variant."
    confidence: medium
    relevance: low
  - claim_id: joint_semantic_acoustic_codecs_enable_better_controllable_generation
    role: supports
    claim: "Codec representations that jointly encode acoustic and semantic content enable more
      accurate controllable speech generation than semantic-only representations."
    source: "§5.4, Table 6"
    evidence: "X-codec2 (fused semantic and acoustic codes) achieves QWK of 0.69 for pitch variation
      versus 0.15 for HuBERT codes (semantic-only) on SIFT-LLM GEN controllable generation
      evaluations."
    confidence: high
    relevance: low
  - claim_id: semantic_only_codes_insufficient_for_speaker_dependent_generation
    role: complicates
    claim: "Semantic-only discrete speech representations are insufficient for reliable
      speaker-dependent controllable generation, as they primarily encode content rather than
      prosodic and acoustic identity."
    source: "§5.4, §F.3"
    evidence: "The HuBERT-code vocoder setup achieves approximately 50% gender accuracy against
      instruction-specified gender, compared to 95.8% for X-codec2; pitch variation QWK from
      original audio degrades substantially in HuBERT re-synthesis (0.11 QWK, Table 18 Appendix
      F.3)."
    confidence: high
    relevance: low
  limitations:
  - "Controllable-generation evaluation relies on automatically extracted acoustic features (QWK,
    MAE) compared against instruction-specified targets, which measures categorical agreement rather
    than perceptual quality, and the LLM-as-a-judge methodology for open-ended tasks introduces
    judge-model dependency."
  caveats:
  - "EvalSIFT is introduced as a structured multilingual instruction-following benchmark (30K
    examples across closed-ended, open-ended, and controllable-generation subsets) that fills a gap
    left by English-only benchmarks like Dynamic-Superb and AIR-Bench, though none of the paper's
    four explicit claims focus on the benchmark design itself."

- id: "2025.acl-long.682"
  entry_date: "2026-07-20"
  year: 2025
  venue: ACL
  task:
  - TTS
  - SCA
  - evaluation
  architecture:
  - autoregressive-LM
  - GAN
  - hybrid
  relevance: low
  evidence_role:
  - infrastructure
  - historical_context
  current_role: minor
  method_family: []
  claims:
  - claim_id: gan_vocoders_dominate_due_to_efficiency
    role: supports
    claim: "GAN-based vocoders occupy the dominant position in production speech generation systems
      because their computational efficiency advantage over autoregressive and diffusion
      alternatives is orders of magnitude, at acceptable perceptual quality cost."
    source: "§3.3.1, §F.3, Table 8"
    evidence: "The survey reports GAN-based vocoders (HiFi-GAN, BigVGAN) achieve real-time factors
      70-3,500x faster than diffusion-based alternatives at competitive perceptual quality,
      explaining their prevalence in production SpeechLM systems."
    confidence: medium
    relevance: low
  - claim_id: continued_pretraining_from_textlm_improves_convergence
    role: supports
    claim: "Continued pretraining from a text language model checkpoint improves SpeechLM
      convergence and downstream task performance compared to random initialization."
    source: "§4.2.1"
    evidence: "The survey synthesizes evidence from TWIST and AudioPaLM showing that initializing a
      SpeechLM from a pretrained text-LLM checkpoint improves convergence and downstream task
      performance compared to random (cold) initialization."
    confidence: medium
    relevance: low
  - claim_id: semantic_acoustic_tokenizers_complementary_tradeoff
    role: supports
    claim: "Semantic tokenizers and acoustic tokenizers represent complementary capability
      profiles, strong semantic content fidelity versus strong acoustic reconstruction fidelity, and
      no single tokenizer type dominates both dimensions."
    source: "§3.1, §F.2, Table 6"
    evidence: "The survey's tokenizer classification shows semantic tokenizers (HuBERT, WavLM)
      achieve lower WER but weaker speaker-similarity fidelity, while acoustic codec tokenizers
      (EnCodec, DAC) invert this profile, with mixed-objective tokenizers (SpeechTokenizer, Mimi)
      offering partial balance."
    confidence: medium
    relevance: medium
  - claim_id: post_alignment_addresses_different_failure_modes
    role: supports
    claim: "Post-alignment of SpeechLMs via preference optimization addresses qualitatively
      different failure modes (semantic inconsistency, token distribution mismatch) than
      post-alignment of text LLMs."
    source: "§4.2.3"
    evidence: "The survey notes that post-alignment methods for SpeechLMs (AlignSLM's DPO for
      semantic consistency, SpeechAlign's token distribution alignment) target failure modes
      distinct from those addressed by text-LLM preference optimization, and remain comparatively
      underexplored."
    confidence: low
    relevance: low
  - claim_id: full_duplex_interaction_remains_open_challenge
    role: supports
    claim: "Full-duplex spoken interaction, simultaneous bidirectional speech with interruption
      support, requires joint modeling of both speaker streams and remains an open research
      challenge."
    source: "§4.3"
    evidence: "The survey catalogues dGSLM, Parrot, Moshi, and LSLM as representative full-duplex
      systems requiring joint modeling of both speaker streams to support simultaneous bidirectional
      communication and interruption, identifying this as an emerging and unresolved research
      frontier."
    confidence: medium
    relevance: low
  limitations:
  - "As a survey, this paper reports no original experimental results and its coverage necessarily
    lags the fast-moving field, with limited treatment of systems published after mid-2024."
  caveats:
  - "The survey catalogues evaluation benchmarks across representation, linguistic, paralinguistic,
    generation quality/diversity, real-time interaction, and downstream dimensions (VoxEval,
    VoiceBench, Full-Duplex-Bench), providing a useful organizational map of the evaluation-metrics
    landscape for spoken language models, though this synthesis is not reflected in any of its five
    explicit Claims-section propositions."

- id: "2025.acl-long.911"
  entry_date: "2026-07-20"
  year: 2025
  venue: ACL
  task:
  - TTS
  - evaluation
  architecture:
  - transformer-enc-dec
  relevance: medium
  evidence_role:
  - core_evidence
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: contextual_prompts_produce_more_appropriate_speech
    role: supports
    claim: "Incorporating conversational and environmental context into TTS prompts produces
      measurably more contextually appropriate speech than attribute-label prompts, even when the
      model architecture is otherwise unchanged."
    source: "§4.3, Table 2"
    evidence: "DNA-TTS, trained with situated dialogue/narrative/action context, achieves higher
      MOS-D and MOS-S scores (3.85, 3.83) than none-prompt TTS baselines (3.65-3.78) on the
      DNASpeech leaderboard."
    confidence: medium
    relevance: low
  - claim_id: codec_tts_outperforms_prompt_based_on_situated_benchmark
    role: supports
    claim: "Codec-based TTS systems, despite not being designed for contextual conditioning,
      outperform purpose-built prompt-based baselines on most metrics when evaluated on a situated
      TTS benchmark."
    source: "§4.4, Table 2"
    evidence: "VoiceCraft, a codec TTS system not designed for contextual conditioning, leads MOS-D
      (3.88) and MOS-S (3.89) on the CS-TTS leaderboard, marginally ahead of the purpose-built
      DNA-TTS baseline (3.85 / 3.83)."
    confidence: medium
    relevance: medium
  - claim_id: dialogue_context_benefit_bounded_beyond_8_turns
    role: complicates
    claim: "The benefit of dialogue context in speech generation is bounded: performance peaks at
      4-6 dialogue turns and degrades significantly beyond 8 turns, suggesting that long-context
      integration remains an open problem."
    source: "Appendix F, Table 3"
    evidence: "Analysis of dialogue turn count shows both DNA-TTS and VALL-E peak in performance at
      4-6 turns of context and degrade as context grows beyond 8 turns."
    confidence: medium
    relevance: low
  - claim_id: movie_scripts_viable_source_for_contextual_tts_data
    role: supports
    claim: "Movie scripts provide a viable automated source for constructing contextually rich TTS
      datasets, with speech quality comparable to purpose-built corpora on standard naturalness
      metrics."
    source: "§3.4, Table 1"
    evidence: "Models trained on the movie-derived DNASpeech dataset achieve MOS comparable to
      purpose-built corpora (FastSpeech2 on DNASpeech: 4.01 vs. 3.97 on LJSpeech), despite the
      dataset being constructed via an automated alignment and filtering pipeline rather than
      studio-recorded from scratch."
    confidence: medium
    relevance: low
  limitations:
  - "The human evaluator pool is small (8 individuals, Kendall's W >= 0.5 threshold), which may
    reduce the reliability of the four task-specific MOS variant estimates."
  caveats:
  - "The leaderboard introduces four task-specific MOS variants (MOS-E, MOS-C, MOS-D, MOS-S)
    tailored to environmental alignment, generation consistency, dialogue coherence, and
    action-state alignment respectively, a template for contextual TTS evaluation design distinct
    from generic naturalness/similarity MOS."

- id: "2025.acl-long.937"
  entry_date: "2026-07-20"
  year: 2025
  venue: ACL
  task:
  - codec
  architecture:
  - VAE
  relevance: low
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: domain_adaptive_partitioning_resolves_degradation
    role: supports
    claim: "Domain-adaptive partitioning within a shared codebook resolves the performance
      degradation that plagues unified single-codebook codecs on mixed multi-domain audio."
    source: "§3.2, §5.3, Tables 2, 4, 6"
    evidence: "Removing the partitioned codebook raises Mel Distance from 0.344 to 0.487 on speech
      and from 0.396 to 0.506 on music in ablation; the full UniCodec outperforms WavTokenizer
      (unified) on all three domains in both objective and MUSHRA evaluation."
    confidence: high
    relevance: low
  - claim_id: self_supervised_mask_prediction_improves_semantic_repr
    role: supports
    claim: "Self-supervised mask prediction objectives integrated directly into codec training
      improve semantic representation without requiring external pretrained SSL encoders."
    source: "§3.4, §5.2, Table 5"
    evidence: "The semantic training stage improves RAVDESS classification accuracy from 36.81 to
      40.28 and Audio-MNIST from 69.84 to 70.94 compared to the codec without this stage; no
      auxiliary SSL model is used."
    confidence: medium
    relevance: low
  - claim_id: joint_training_reconstruction_semantic_infeasible
    role: complicates
    claim: "Joint training of reconstruction and self-supervised semantic objectives from scratch
      degrades single-codebook codec performance; sequential staging is required."
    source: "§3.4"
    evidence: "Preliminary experiments show that training reconstruction, mask prediction, and
      contrastive loss simultaneously is infeasible; the two-stage approach (acoustic training
      first, then semantic stage) is necessary for stable convergence."
    confidence: medium
    relevance: low
  - claim_id: large_scale_noisy_data_requires_finetuning
    role: complicates
    claim: "Large-scale diverse audio training data introduces noise that degrades codec
      reconstruction quality, requiring targeted fine-tuning on curated high-quality subsets."
    source: "§4, §5.3, Appendix C, Table 6"
    evidence: "Training on 80K hours of mixed data without the fine-tuning stage raises Mel Distance
      by 0.103 on speech (0.448 vs 0.344) relative to the fine-tuned model; high-quality fine-tuning
      on LibriTTS clean, VCTK, and LJSpeech recovers most of the degradation."
    confidence: medium
    relevance: low
  - claim_id: single_codebook_75tps_competitive_with_600tps_rvq
    role: supports
    claim: "Single-codebook codecs at 75 tokens per second can achieve acoustic reconstruction
      quality competitive with multi-layer RVQ codecs operating at 600 tokens per second when
      combined with domain-adaptive design."
    source: "§5.1, Table 3"
    evidence: "UniCodec PESQ 3.03 and STOI 0.949 on LibriTTS test-clean exceeds Encodec (2.72,
      0.939) and SpeechTokenizer (2.61, 0.917) at 600 TPS, with eight times fewer tokens per
      second."
    confidence: high
    relevance: low
  limitations:
  - "The paper does not demonstrate integration with an actual audio language model, so the
    downstream generation-quality implications of the reported codec metrics (PESQ, STOI, UTMOS,
    Mel Distance, MUSHRA) remain unvalidated."
  caveats:
  - "Evaluation spans three domains (speech, music, sound) simultaneously using both objective
    reconstruction metrics and MUSHRA listening tests, a comprehensive multi-domain evaluation
    design that is uncommon in codec papers, which typically evaluate a single domain."

- id: "2025.acl-short.81"
  entry_date: "2026-07-20"
  year: 2025
  venue: ACL
  task:
  - TTS
  - evaluation
  architecture:
  - autoregressive-LM
  - transformer-enc-dec
  relevance: medium
  evidence_role:
  - infrastructure
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: longform_audio_speaker_id_improves_zeroshot_lowresource_tts
    role: supports
    claim: "Long-form training audio (10-20 seconds per segment) with explicit speaker identities
      improves zero-shot TTS quality for low-resource tonal languages compared to training on
      short-segment corpora."
    source: "§3.1, §4"
    evidence: "Models fine-tuned on PhoAudiobook's 10-20 second long-form segments with explicit
      speaker identity outperform the viVoice-trained viXTTS baseline on WER, SMOS, and F0-RMSE
      across most test sets."
    confidence: medium
    relevance: low
  - claim_id: xtts_v2_architectural_failure_on_short_input
    role: supports
    claim: "Multilingual voice-cloning models such as XTTS-v2 exhibit architectural failure modes on
      short input sequences that are not corrected by data augmentation with short clips."
    source: "§4"
    evidence: "On the VIVOS short-sentence test set, XTTS-v2PAB's MOS drops sharply to 2.79 despite
      a competitive WER of 9.85, with manual inspection revealing rambling or redundant generated
      speech that the authors attribute to an XTTS-v2 architectural issue rather than a data
      problem."
    confidence: high
    relevance: medium
  - claim_id: ar_codec_lms_generalize_better_to_short_sentences
    role: supports
    claim: "Autoregressive codec language models (VALL-E, VoiceCraft) generalize better than
      Tortoise-based models to short-sentence inputs in low-resource language fine-tuning."
    source: "§4, Table 2"
    evidence: "VALL-EPAB (MOS 3.44) and VoiceCraftPAB (MOS 3.85) substantially outperform
      XTTS-v2PAB (MOS 2.79) on the VIVOS short-sentence test set, despite comparable or slightly
      worse WER."
    confidence: medium
    relevance: medium
  - claim_id: dual_asr_agreement_filtering_improves_transcription_quality
    role: supports
    claim: "A dataset curation pipeline based on dual-ASR agreement filtering produces higher-quality
      transcriptions for audiobook audio than single-model transcription alone, enabling more
      reliable TTS training."
    source: "§2.1"
    evidence: "The PhoAudiobook pipeline retains only samples where Whisper-large-v3 and
      PhoWhisper-large transcriptions agree exactly, producing a 941-hour corpus with explicit
      speaker IDs and normalized text absent from prior Vietnamese TTS datasets."
    confidence: medium
    relevance: low
  limitations:
  - "The dataset is audiobook-domain only and models are fine-tuned rather than trained from
    scratch, so performance is bounded by pretrained multilingual capacity rather than reflecting
    Vietnamese-specific architecture capability."
  caveats:
  - "The cross-model benchmark (VALL-E, VoiceCraft, XTTS-v2 vs. the viXTTS baseline) reveals that
    WER and MOS/SMOS can diverge sharply for the same system on short-sentence inputs (XTTS-v2PAB:
    WER 9.85 but MOS 2.79 on VIVOS), underscoring that a single metric is insufficient to
    characterize zero-shot TTS quality in low-resource, short-utterance settings."

- id: "2025.findings-acl.1226"
  entry_date: "2026-07-20"
  year: 2025
  venue: ACL
  task:
  - TTS
  architecture:
  - hybrid
  relevance: medium
  evidence_role:
  - core_evidence
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: multiagent_llm_produces_more_informative_scripts
    role: supports
    claim: "Parallel multi-agent LLM architectures can produce more informative and engaging
      conversational scripts than single-prompt generation for long-form spoken content."
    source: "§5.1, §5.3, Table 1, Table 2"
    evidence: "Host-Guest-Writer system outperforms direct GPT-4 baseline on all five quantitative
      metrics and all five LLM-as-a-Judge dimensions across four topic categories; the single-agent
      ablation also shows substantially lower scores on all metrics."
    confidence: high
    relevance: low
  - claim_id: llm_predicted_style_improves_speech_expressiveness
    role: supports
    claim: "LLM-predicted speaking style instructions improve speech expressiveness in zero-shot TTS
      when used for long-form conversational audio."
    source: "§5.2, Figure 7"
    evidence: "All CMOS scores (0.2-0.9) are positive and preference tests favour LLM-instructed
      synthesis over uninstructed synthesis across all four topic categories in a 9-evaluator
      study."
    confidence: medium
    relevance: medium
  - claim_id: automatic_voice_role_matching_cannot_guarantee_alignment
    role: complicates
    claim: "Automatic voice-role matching from a speaker pool cannot guarantee perceptual alignment
      between voice characteristics and speaker roles in conversational audio generation."
    source: "§5.2, §7"
    evidence: "87.4% average pass rate implies roughly 1 in 8 voice assignments is judged
      inappropriate by participants; the voice pool is also limited to read-speech data
      (LibriTTS-R), and the paper notes the need for more conversational-style voices."
    confidence: medium
    relevance: high
  - claim_id: more_participants_not_monotonically_better
    role: supports
    claim: "Increasing the number of participants in multi-agent dialogue generation does not
      monotonically improve content quality, and smaller groups with more focused interactions
      outperform larger ensembles."
    source: "§5.3, Table 2"
    evidence: "Ablation across 1-5 guest configurations shows that 2-guest setups score highest on
      Distinct-N, MATTR, and Semantic-Div; quality degrades progressively from 3 to 5 guests."
    confidence: medium
    relevance: low
  limitations:
  - "Content evaluation uses GPT-4-as-a-Judge to evaluate GPT-4-generated outputs, introducing
    well-documented self-preference and position biases that the paper only partially mitigates by
    averaging comparison orders."
  caveats:
  - "The paper introduces evaluation guidelines spanning three previously unaddressed axes
    simultaneously (dialogue content quality, voice-role matching accuracy, speech expressiveness)
    for podcast-style long-form audio generation, filling a gap where no standardised benchmark
    existed, though the reference-free content metrics (Distinct-N, MATTR) and LLM-judge scores are
    validated only against a single alternative system (WavJourney) rather than human-produced
    podcasts."
- id: "2025.findings-acl.470"
  entry_date: "2026-07-21"
  year: 2025
  venue: ACL
  task:
  - SCA
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - infrastructure
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: text_llm_speech_extension_degrades_context_recall
    role: supports
    claim: "Extending a pre-trained text LLM to process speech input substantially degrades its ability to recall and utilize long-range conversational context."
    source: "§4.1, Table 2"
    evidence: "All four evaluated open-source voice interaction models score 2.00-2.83 on ContextDialog (5-point GPT Score), compared to 4.03-4.10 for their text-only backbone LLMs; the gap is largest when the LLM backbone is frozen during speech adaptation."
    confidence: high
    relevance: low
  - claim_id: modality_specific_recall_asymmetry
    role: supports
    claim: "Voice interaction models exhibit a modality-specific recall asymmetry, retrieving information from model-generated text responses more reliably than from user-spoken utterances."
    source: "§4.1, Table 2, Figure 3"
    evidence: "All four speech models score significantly higher on questions about the model's own past utterances than past user utterances (p < 0.01); attention maps confirm systematically lower attention weight on user-spoken supporting utterances."
    confidence: high
    relevance: low
  - claim_id: rag_no_consistent_improvement_context_recall
    role: complicates
    claim: "Retrieval-augmented generation provides a practical route to improving multi-turn context recall in spoken dialogue models."
    source: "§4.2, Figure 4, Table 3, Table 5"
    evidence: "Augmenting four open-source voice interaction models with a top-k text retriever (e5-large-v2) yields no consistent improvement and often degrades performance; top-1 retrieval recall is only 0.58 and irrelevant retrieved utterances lower all models below baseline."
    confidence: medium
    relevance: medium
  - claim_id: opensource_voice_models_underdeveloped_longcontext
    role: supports
    claim: "Open-source voice interaction models show critically underdeveloped long-context capabilities compared to closed-source systems, even on simple factual recall tasks."
    source: "§A.1.4, Table 7"
    evidence: "gpt-4o-mini-audio-preview scores 3.83-4.50 overall, more than 1 point above the best open-source model (Lyra, 2.83), even though the closed-source API does not support a proper multi-turn spoken dialogue context."
    confidence: medium
    relevance: low
  limitations:
  - "ContextDialog is entirely synthetic: questions are generated by GPT-4o and corresponding audio is synthesized by Fish Speech, which may cause the benchmark to underestimate recall difficulty on real user speech with natural disfluency and acoustic variability."
  caveats:
  - "ContextDialog is the first speech-to-speech benchmark explicitly designed so correct answers require access to prior conversational turns, filling a gap in earlier spoken dialogue benchmarks that allowed single-turn-derivable answers; the paper validates its LLM-as-judge protocol against human evaluation on Amazon Mechanical Turk (180 participants) confirming the same system ordering."
- id: "2025.findings-acl.534"
  entry_date: "2026-07-21"
  year: 2025
  venue: ACL
  task:
  - SCA
  architecture: []
  relevance: medium
  evidence_role:
  - core_evidence
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: semantic_similarity_reliable_proxy_for_tts_data_filtering
    role: supports
    claim: "Semantic similarity in embedding space can serve as a reliable proxy for linguistic equivalence when filtering TTS-synthesized speech instruction data, avoiding the over-rejection caused by WER-based criteria."
    source: "§5.2, §5.3, Table 1"
    evidence: "The SIM metric achieves over 98% consistency with WER when strict linguistic equivalence holds, and above 92.5% across all conditions and three TTS models on seven QA datasets."
    confidence: high
    relevance: high
  - claim_id: llm_continued_targets_weaker_than_human_annotated
    role: supports
    claim: "Training large speech language models on LLM-continued alignment targets produces systematically weaker instruction-following capability than training on human-annotated responses, regardless of speech synthesis quality."
    source: "§5.3, Table 3"
    evidence: "Models trained with LLM-continued answers achieve 52.54 average ROUGE-L vs. 60.5 with human-annotated golden answers at identical data quality thresholds; the gap persists across all ablation settings."
    confidence: high
    relevance: low
  - claim_id: parallel_multillm_rewriting_improves_tts_data_usability
    role: supports
    claim: "Parallel query rewriting with multiple structurally diverse LLMs improves TTS data usability compared to any single-LLM rewriting approach, due to complementary performance across text types."
    source: "§5.4, Table 2"
    evidence: "Using Llama-3, Phi-3, and Qwen2 together raises average Pass rate by 2-3 percentage points over the best single-LLM baseline across MeloTTS and ParlerTTS-Large in the single-speaker setting."
    confidence: medium
    relevance: low
  - claim_id: wer_filtering_causes_inappropriate_data_rejection
    role: complicates
    claim: "WER-based quality filtering of TTS-synthesized speech instruction data causes inappropriate data rejection due to incidental ASR errors, distorting the resulting dataset distribution."
    source: "§3, §5.3, Table 13"
    evidence: "Strict WER filtering rejects samples where ASR recognition errors occur despite semantic equivalence; SIM-based filtering recovers these samples while maintaining downstream task performance, confirmed by case analysis."
    confidence: medium
    relevance: high
  limitations:
  - "LSLM evaluation covers only four reading comprehension tasks measured with ROUGE-L, which may not reflect instruction-following quality in conversational or multi-turn settings, and all experiments are English-only."
  caveats:
  - "The paper's SIM metric (averaged cosine similarity across three embedding models) is proposed specifically as a more robust alternative to WER for evaluating linguistic fidelity of TTS-synthesized training data, directly extending standard evaluation practice for data curation pipelines rather than end-system quality."
- id: "2025.findings-acl.71"
  entry_date: "2026-07-21"
  year: 2025
  venue: ACL
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - core_evidence
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: listening_comprehension_objective_improves_crossmodal_understanding
    role: supports
    claim: "Explicit listening comprehension objectives improve cross-modal understanding in multimodal LLMs fine-tuned for spoken QA."
    source: "§3.4, Table 3"
    evidence: "Removing the story listening comprehension sub-task from DAMSEL causes the largest single-task performance degradation in ablations on ASK-QA with Speech-Qwen, confirming transcription supervision is the most critical auxiliary signal."
    confidence: high
    relevance: low
  - claim_id: multitask_auxiliary_design_substitutes_for_data_collection
    role: supports
    claim: "Multi-task auxiliary task design can substitute for large-scale data collection in adapting MLLMs to spoken question answering."
    source: "§3.2, Figure 4, Table A7"
    evidence: "DAMSEL with Speech-Qwen surpasses the prior state-of-the-art on Spoken-SQuAD using only 10% of training data (66.38 EM vs. DDNet 64.1 EM trained on 100% of data)."
    confidence: high
    relevance: low
  - claim_id: datacentric_multitask_gains_persist_for_frontier_mllms
    role: supports
    claim: "Data-centric multi-task fine-tuning yields consistent gains even for frontier MLLMs with extensive prior multi-modal pre-training."
    source: "§3.1"
    evidence: "Gemini Pro fine-tuned with DAMSEL on 1% of ASK-QA improves 5.7% relative over single-task tuning; improvement persists with full data (1.6% relative), despite Gemini's prior large-scale multi-modal training."
    confidence: medium
    relevance: low
  - claim_id: tts_synthesized_data_has_quality_ceiling
    role: complicates
    claim: "TTS-synthesised speech datasets have quality ceilings that limit model generalisation to naturalistic paralinguistic variation."
    source: "§Limitations, §B.1"
    evidence: "WER-filtered ASK-QA transcriptions may not perfectly match synthesised speech, and current TTS lacks perfect controllability for speaking rate and pitch; the dynamic evaluation pipeline depends on TTS to regenerate spoken turns, compounding generation quality issues across multi-turn rollouts."
    confidence: medium
    relevance: high
  - claim_id: multitask_gains_diminish_with_scale
    role: refines
    claim: "Spoken QA performance gains from multi-task learning are largest in the low-data regime and diminish as training data scales."
    source: "§3.1, §3.3, Table 2"
    evidence: "Gemini Pro's DAMSEL advantage over single-task tuning narrows from 16.13% relative EM improvement (1% data) to 1.7% (full data) on SD-QA, and from 5.7% to 1.6% relative on ASK-QA."
    confidence: medium
    relevance: medium
  limitations:
  - "Performance relies on ground-truth transcriptions as listening comprehension targets, which are themselves derived from ASR systems with known errors; the paper acknowledges it is unclear whether transcription noise improves robustness or degrades performance."
  caveats:
  - "The paper's ASK-QA introduces a dynamic multi-turn evaluation pipeline where an LLM-based action classifier and user simulator interactively extend spoken dialogue, a distinct evaluation methodology contribution alongside DAMSEL's training approach, though it adds unquantified evaluation variance from ASR and simulator errors."
- id: "2507.17527"
  entry_date: "2026-07-21"
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - core_evidence
  - control_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: e2e_s2s_translation_rl_beats_cascaded_commercial
    role: supports
    claim: "End-to-end speech-to-speech translation trained with reinforcement learning can achieve substantially lower latency than cascaded commercial systems while surpassing them in translation quality."
    source: "§3.3, Table 1"
    evidence: "On RealSI (zh-en), the system achieves VIP 79.5 and SVIP 67.8 at AL 5.18 seconds, versus the best commercial competitor at VIP 53.2 and SVIP 3.0 at AL 48.21."
    confidence: medium
    relevance: low
  - claim_id: twostage_rl_outperforms_single_strategy_streaming
    role: supports
    claim: "Two-stage RL training that separates fine-grained process rewards from holistic sequence-level outcome rewards outperforms applying either strategy in isolation for streaming speech generation."
    source: "§4.3, Table 6"
    evidence: "The combined two-stage scheme achieves higher VIP and lower AL than both single-turn-only and multi-turn-only variants; multi-turn-only trades translation quality for latency, while single-turn-only cannot exploit global latency constraints."
    confidence: medium
    relevance: low
  - claim_id: rl_reward_design_prone_to_exploitation
    role: complicates
    claim: "RL reward design for speech generation is prone to exploitation when individual reward signals are applied without complementary constraints."
    source: "§4.2, Table 5"
    evidence: "Training with the Time Compliance Reward alone caused the model to reduce audio duration by ~35% and text token count by ~15%, yielding an 8-point BLEURT drop while satisfying the temporal constraint; adding an adversarial quality reward restored translation fidelity."
    confidence: high
    relevance: medium
  - claim_id: rl_improves_latency_more_than_quality
    role: supports
    claim: "Reinforcement learning applied after SFT improves latency more substantially than translation quality in simultaneous speech translation."
    source: "§4.1, Tables 3, 4"
    evidence: "RL reduces FLAL from 3.90 to 2.37 and AL from 2.82 to 2.58 on RealSI, while VIP improves more modestly from 75.1 to 79.5 compared to the SFT baseline."
    confidence: medium
    relevance: low
  - claim_id: automated_mt_metrics_insufficient_for_simultaneous_speech
    role: complicates
    claim: "Automated MT metrics such as BLEURT and COMET do not fully capture the quality of simultaneous speech interpretation in realistic long-form scenarios."
    source: "§3.2, Appendix A"
    evidence: "The paper introduces SVIP as a composite human evaluation metric combining translation quality, delivery latency, speech rate, pronunciation, and fluency, arguing automated metrics fail to assess the pragmatic requirements of live spoken interpretation."
    confidence: medium
    relevance: high
  limitations:
  - "Training data, model weights, and all commercial baseline identities are proprietary, so the headline results cannot be independently reproduced or verified."
  caveats:
  - "The paper's most durable evaluation-metrics contribution is SVIP, a composite human evaluation metric spanning translation quality, latency, speech rate, pronunciation, and fluency, proposed specifically because automated MT metrics (BLEURT, COMET) were judged insufficient for simultaneous speech interpretation; the metric's sub-components are not individually validated against isolated ground truth."
- id: "2507.20140"
  entry_date: "2026-07-21"
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - flow-matching
  relevance: medium
  evidence_role:
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: unlearning_via_randomization_suppresses_speaker_identity
    role: supports
    claim: "Machine unlearning via randomization-based training objectives can selectively suppress specific speaker identities in zero-shot TTS while preserving synthesis quality for retained speakers."
    source: "§5.2, Table 1"
    evidence: "TGU achieves SIM-F of 0.169 (within the measured cross-speaker similarity range of 0.02-0.17) and retain-set SPK-SIM of 0.631, a drop of only 2.8% from the original model's 0.649, with WER-F of 2.4% comparable to the original's 2.1%."
    confidence: high
    relevance: low
  - claim_id: data_exclusion_insufficient_for_voice_privacy
    role: complicates
    claim: "Excluding target speakers from the fine-tuning dataset is insufficient for voice privacy protection in zero-shot TTS, because these models generalize at inference time to replicate unseen speakers via in-context learning."
    source: "§5.2, Table 1"
    evidence: "Exact Unlearning and Fine Tuning on the retain set yield SIM-F of 0.687 and 0.675 respectively, nearly identical to the original model's 0.708, confirming the model continues to clone forgotten speakers not present in the fine-tuning data."
    confidence: high
    relevance: low
  - claim_id: gradient_reversal_unlearning_degrades_intelligibility
    role: complicates
    claim: "Gradient-reversal and KL-divergence-based unlearning methods degrade speech intelligibility rather than achieving genuine speaker forgetting in voice-conditioned generative models, due to entanglement between speaker style and linguistic content."
    source: "§5.2, Table 1"
    evidence: "Negative Gradient achieves WER-F of 5.0% and KL divergence maximization achieves WER-F of 47.2%, compared to 2.4% for TGU."
    confidence: high
    relevance: low
  - claim_id: speaker_similarity_alone_insufficient_to_verify_unlearning
    role: supports
    claim: "Speaker similarity metrics alone are insufficient to verify effective machine unlearning in generative speech models, as consistent failure patterns can yield low similarity scores without achieving the randomness needed to resist voice reconstruction."
    source: "§4.3, §5.2, Table 1"
    evidence: "Negative Gradient and KL methods achieve low SIM-F scores (0.402 and 0.179) but spk-ZRF-F values of 0.842 and 0.810, at or below the original model's baseline of 0.846, revealing patterned outputs that could be reverse-engineered; TGU achieves both low SIM-F (0.169) and elevated spk-ZRF-F (0.871)."
    confidence: high
    relevance: high
  - claim_id: pretrained_model_as_own_teacher_for_unlearning
    role: supports
    claim: "A pre-trained generative model can serve as its own teacher for unlearning by providing diverse speaker-identity targets, eliminating the need for aligned cross-speaker audio pairs."
    source: "§4.2"
    evidence: "TGU generates per-step training targets by running VoiceBox conditioned only on text (no audio prompt), producing a different speaker identity at each Gaussian initialization; these unconditional outputs replace paired cross-speaker audio as forget-set targets."
    confidence: medium
    relevance: low
  limitations:
  - "All experiments are conducted on a single TTS architecture (VoiceBox with mel-spectrogram representation); transferability of TGU to codec-based autoregressive ZS-TTS systems is untested."
  caveats:
  - "The paper's spk-ZRF metric (adapted from Zero Retrain Forgetting) is a genuine evaluation-methodology contribution: it distinguishes genuine speaker-identity randomization from consistent patterned failure that speaker-similarity metrics alone cannot detect, exposing a diagnostic gap in existing unlearning evaluation."
- id: "2507.20731"
  entry_date: "2026-07-21"
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - GAN
  relevance: low
  evidence_role:
  - core_evidence
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: linear_degradation_structure_reduces_learning_burden
    role: supports
    claim: "Explicit incorporation of known linear degradation structure (the mel filterbank) into vocoder design reduces the learning burden on the neural component and improves parameter efficiency."
    source: "§4.3, Table 4"
    evidence: "Removing the RND decomposition and replacing it with direct black-box mel-to-spectrum mapping degrades PESQ from 3.987 to 3.655 and causes near-total pitch tracking failure on LJSpeech."
    confidence: high
    relevance: low
  - claim_id: orthogonality_enforcement_important_for_tf_vocoders
    role: supports
    claim: "Enforcing orthogonality between range-space and null-space components in T-F vocoder design is important; making the decomposition matrices learnable degrades reconstruction quality."
    source: "§4.3, Table 4, Figure 6"
    evidence: "Setting A and A† as learnable degrades PESQ from 3.987 to 3.645 and V/UV F1 from 0.9714 to 0.1164 on LJSpeech, indicating the learned matrices no longer maintain orthogonality."
    confidence: high
    relevance: low
  - claim_id: tf_vocoders_can_close_quality_gap_with_time_domain_gans
    role: supports
    claim: "T-F domain vocoders can close the quality gap with large-scale time-domain GAN vocoders while remaining substantially more parameter-efficient and faster on CPU."
    source: "§4.3, Tables 1, 2, 3"
    evidence: "RNDVoC (3.14M parameters) achieves PESQ 4.226 and MUSHRA 80.74 on LibriTTS, matching or exceeding BigVGAN (112M parameters, PESQ 4.027, MUSHRA 79.33) trained for 1M steps, while running at nearly 10x real-time speed on CPU."
    confidence: high
    relevance: medium
  - claim_id: naive_tf_vocoders_remain_inferior_without_subband_design
    role: complicates
    claim: "The quality advantage of T-F domain vocoders over large-scale time-domain models depends on architectural choices for sub-band modeling; naive T-F vocoders remain inferior to well-tuned time-domain GAN vocoders at equivalent scale."
    source: "§4.3, Table 1"
    evidence: "Vocos (13.46M) achieves PESQ 3.522 on LJSpeech while BigVGAN (112M) reaches 4.107; only the proposed hierarchical sub-band design closes this gap at 3.14M parameters."
    confidence: medium
    relevance: medium
  - claim_id: omnidirectional_phase_loss_improves_objective_metrics
    role: supports
    claim: "Extending phase loss to capture differential relations across all eight adjacent T-F bins improves objective vocoder metrics relative to sparse two-direction anti-wrapping losses."
    source: "§4.3, Table 4"
    evidence: "Replacing the proposed omnidirectional phase loss with the prior anti-wrapping formulation reduces PESQ from 3.987 to 3.892 and MCD from 2.047 to 2.214 on LJSpeech."
    confidence: medium
    relevance: low
  limitations:
  - "Evaluation is restricted to single-speaker (LJSpeech) and multi-speaker clean-speech (LibriTTS) benchmarks; no quantitative generalisation results are reported for singing, emotional speech, or noisy conditions."
  caveats:
  - "The paper uses a broad multi-metric evaluation suite (PESQ, MCD, periodicity RMSE, V/UV F1, pitch RMSE, VISQOL, MUSHRA) spanning both objective and subjective axes, providing a thorough comparison template across time-domain and T-F domain vocoder baselines; the MUSHRA panel (35 participants) is drawn from an audio signal processing background rather than general listeners."
- id: "2507.23159"
  entry_date: "2026-07-21"
  year: 2025
  venue: arXiv
  task:
  - SCA
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - infrastructure
  - core_evidence
  current_role: influential
  method_family: []
  claims:
  - claim_id: fullduplex_responsiveness_floorholding_tradeoff
    role: supports
    claim: "Current full-duplex spoken dialogue systems face a fundamental responsiveness-versus-floor-holding trade-off, with no single system achieving strong performance across both genuine interruptions and non-addressee overlap scenarios."
    source: "§4, Table 2"
    evidence: "Across five systems, GPT-4o achieves the highest interruption RESPOND rate (0.78) and fastest stop latency (0.23s) but incorrectly yields in 91-93% of non-addressee and background speech cases, while Nova Sonic holds the floor strongly (RESUME=0.98) but struggles with true interruptions (RESPOND=0.24)."
    confidence: high
    relevance: high
  - claim_id: low_stop_latency_tradeoff_falseyield
    role: complicates
    claim: "Stop latency below roughly 0.5 s under genuine user interruptions is achievable for commercial API-based systems but comes at the cost of significantly elevated false-yield rates on backchannel and background speech."
    source: "§4.1, Table 2"
    evidence: "GPT-4o achieves the fastest stop latency (0.23s) on genuine interruptions among evaluated systems, but the same responsiveness misfires on non-addressee and background speech, where it incorrectly yields in 91% and 93% of cases respectively."
    confidence: high
    relevance: high
  - claim_id: prosodic_adaptation_diverges_across_architectures
    role: supports
    claim: "Full-duplex systems exhibit measurable prosodic adaptation post-interruption, but the adaptation strategies diverge across architectures, with some systems showing unstable or brittle re-entry delivery."
    source: "§5, Table 3"
    evidence: "GPT-4o and Gemini adopt a tempo-and-pitch-lift re-entry strategy, Freeze-Omni and Sonic reduce mean intensity while increasing variability, and Moshi's re-entry is erratic (extreme speed-up with reduced pitch and inconsistent intensity)."
    confidence: medium
    relevance: medium
  - claim_id: automated_overlap_evaluation_feasible_without_human_annotation
    role: supports
    claim: "Automated evaluation of full-duplex overlap handling is feasible without human annotation by combining ASR transcription, LLM-based semantic classification, VAD-based timing measurement, and acoustic feature analysis."
    source: "§2.3"
    evidence: "The benchmark categorises post-overlap dialogue behavior using a GPT-4o evaluator applied to Parakeet-TDT ASR transcripts, strictly separating the evaluation modality from the generation modality, and combines this with VAD-based latency measurement and paired t-test prosodic feature analysis across five systems."
    confidence: high
    relevance: high
  limitations:
  - "All evaluation stimuli are synthesized rather than drawn from real conversational corpora, and the acoustic simulations for off-axis and background speech are rule-based (fixed dB offsets, fixed filters), which may not capture the full distribution of real-world overlap conditions."
  caveats:
  - "The benchmark covers English only and uses a single synthesized speaker voice for most scenarios; behavioral classification relies on GPT-4o applied to ASR output, introducing two unquantified error sources (ASR errors, LLM judgment errors)."
- id: "2025.conll-1.9"
  entry_date: "2026-07-21"
  year: 2025
  venue: CoNLL
  task:
  - TTS
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: naturalness_ratings_dont_reflect_linguistic_prosody_adequacy
    role: complicates
    claim: "Naturalness ratings do not fully reflect whether TTS prosody is linguistically appropriate."
    source: "§5.3, Figure 3"
    evidence: "Syntactic Sensitivity Score precision and recall diverge from the MOS ranking across Tacotron2, SpeechT5, and Parler-TTS; recall does not follow MOS order, revealing that missed boundary errors have less impact on perceived naturalness than spurious boundary errors."
    confidence: high
    relevance: high
  - claim_id: punctuation_dominates_intonational_boundary_placement
    role: supports
    claim: "Punctuation marks are the dominant surface cue for intonational boundary placement in TTS systems, overriding syntactic and semantic information in ambiguous contexts."
    source: "§4.4, §5.3"
    evidence: "All three systems place boundaries reliably only when commas are present; without comma cues in garden path and attachment ambiguity sentences, systems default to the statistically most frequent pattern, and semantic bias has no measurable effect on boundary placement."
    confidence: high
    relevance: medium
  - claim_id: transformer_tts_encodes_partial_clause_boundary_info
    role: supports
    claim: "Transformer-based TTS architectures encode partial clause boundary information for prosody that LSTM-based systems do not."
    source: "§6.1, Figure 4"
    evidence: "LASSO regression selects is_clause_boundary as a significant predictor of pause duration for SpeechT5 and Parler-TTS but not for Tacotron2, which relies more on token position and length features."
    confidence: medium
    relevance: low
  - claim_id: increased_training_exposure_helps_structural_not_semantic_prosody
    role: refines
    claim: "Increasing TTS training exposure to syntactically diverse speech can improve prosodic alignment with syntactic structure for structural cues, but not for semantic disambiguation cues."
    source: "§7.3, Figure 5"
    evidence: "Fine-tuning Parler-TTS on Jenny corpus prepositional phrase data produces more differentiated pause patterns correlated with syntactic function; fine-tuning on synthetic semantic-bias data increases pause duration generally but does not teach the model to distinguish high from low attachment."
    confidence: medium
    relevance: low
  limitations:
  - "The study measures intonational boundaries through duration proxies only (pause insertion and pre-boundary lengthening), omitting pitch contour and intensity changes that also contribute to boundary perception."
  caveats:
  - "The paper's Syntactic Sensitivity Score (precision/recall/F1 at syntactic boundary positions) is a concrete evaluation-metrics contribution that complements MOS by measuring prosodic linguistic adequacy rather than general naturalness, though it is validated on only three TTS systems trained on audiobook speech."
- id: "2025.iwslt-1.5"
  entry_date: "2026-07-21"
  year: 2025
  venue: IWSLT
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - infrastructure
  - core_evidence
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: alignment_aware_compression_improves_crossmodal_understanding
    role: supports
    claim: "Grounding speech compression in explicit speech-text alignment boundaries improves spoken language understanding and cross-modal reasoning in speech-augmented language models."
    source: "§4.3, Tables 2-3"
    evidence: "SSR-CONNECTOR (UNITY2) achieves 64.2%/68.6% (0/5-shot) on Speech-MMLU vs. 40.5%/42.75% for SPIRITLM (LLAMA3), and 74.8% on StoryCloze (S→T) vs. 61.6%, while maintaining 65.3% MMLU text accuracy."
    confidence: high
    relevance: low
  - claim_id: llm_finetuning_on_speech_degrades_crossmodal_understanding
    role: complicates
    claim: "Fine-tuning a pre-trained LLM on speech data degrades cross-modal understanding even when catastrophic forgetting is mitigated through multitask training."
    source: "§5.2, Table 5"
    evidence: "All Stage 2 fine-tuning methods improve speech-only task performance (sWUGGY, sBLIMP) but consistently reduce Speech-MMLU and StoryCloze (S→T) accuracy; multitask fine-tuning limits the drop but cannot eliminate it."
    confidence: high
    relevance: medium
  - claim_id: text_embedding_distillation_effective_for_connector_pretraining
    role: supports
    claim: "Distillation from text embeddings is an effective pre-training objective for speech-text modality connectors, enabling cross-lingual transfer to ASR without explicit transcription supervision."
    source: "§4.3, Table 3"
    evidence: "After Stage 1 distillation alone (no ASR objective), SSR-CONNECTOR achieves 5.6%/4.0% WER on LibriSpeech clean (0/5-shot) via in-context prompting, using only the alignment-supervised distillation loss."
    confidence: medium
    relevance: low
  - claim_id: alignment_segmentation_reduces_lexical_task_effectiveness
    role: complicates
    claim: "Alignment-aware speech segmentation reduces effectiveness on lexical tasks that depend on synthesized anomalous phoneme sequences."
    source: "§4.3"
    evidence: "SSR-CONNECTOR underperforms on sWUGGY because the aligner was not trained on incorrectly spoken words (non-words), causing segmentation errors, a known scope limitation of alignment-based methods."
    confidence: medium
    relevance: low
  limitations:
  - "All experiments use a single language (English), a single LLM backbone (LLAMA3), and a single self-supervised speech encoder (DinoSR), which is not ablated."
  caveats:
  - "The paper introduces Speech-MMLU, a cross-modal benchmark synthesizing MMLU question text to speech, filling a gap in evaluating speech LMs on knowledge-intensive reasoning tasks; the benchmark excludes domains with synthesis quality issues (e.g. algebra), limiting its breadth as a general evaluation tool."
- id: "2025.unlp-1.11"
  entry_date: "2026-07-21"
  year: 2025
  venue: UNLP
  task:
  - TTS
  architecture:
  - transformer-enc-dec
  relevance: medium
  evidence_role:
  - infrastructure
  current_role: minor
  method_family: []
  claims:
  - claim_id: sentencelevel_context_aware_models_outperform_wordlevel_stress_baselines
    role: supports
    claim: "Context-aware sentence-level neural models outperform word-level neural baselines for lexical stress prediction in morphologically complex languages."
    source: "§3.2.4, Table 2"
    evidence: "ByT5 fine-tuned on sentence-level synthetic data achieves 87.7% word-level accuracy, compared to 73.2% for the word-level Ukrainian Accentor, by incorporating broader sentence context during inference."
    confidence: medium
    relevance: low
  - claim_id: neural_models_dont_surpass_dictionaries_on_stress_disambiguation
    role: complicates
    claim: "Neural models do not surpass dictionary-based systems on contextual stress disambiguation even when trained at the sentence level."
    source: "§3.2.4, Table 2"
    evidence: "ByT5 G2P achieves 58.1% ambiguous word accuracy vs. 64.3% for Ukrainian Word Stress (First); the dictionary system's POS-based disambiguation and guaranteed fallback remain advantageous for heteronym resolution."
    confidence: medium
    relevance: low
  - claim_id: hybrid_pipelines_outperform_neural_or_dictionary_alone
    role: supports
    claim: "Hybrid pipelines combining neural and dictionary-based stress prediction outperform either method alone for low-resource languages."
    source: "§3.2.4, Table 2"
    evidence: "Combining ByT5 G2P with Ukrainian Word Stress (OnAmbiguity.Skip) achieves 92.5% word-level and 52.0% sentence-level accuracy, exceeding both standalone neural (87.7%, 35.3%) and dictionary-only (88.7%, 41.5%) results."
    confidence: medium
    relevance: low
  - claim_id: rulebased_g2p_achieves_low_wer_for_transparent_orthographies
    role: supports
    claim: "Carefully designed rule-based G2P systems can achieve very low word error rates for languages with relatively transparent orthographies, substantially outperforming naive mapping."
    source: "§4.4, Table 4"
    evidence: "The rule-based Ukrainian phonemizer reaches 1.23% WER on a constructed phonologically diverse dataset, vs. 48.75% WER for a naive letter-to-phoneme baseline, with errors concentrated in abbreviations and complex consonant clusters."
    confidence: high
    relevance: low
  limitations:
  - "The stress model is trained entirely on automatically generated pseudo-labels with no manually verified training sentences, and the evaluation benchmark contains only 1,026 sentences, making sentence-level accuracy estimates noisy."
  caveats:
  - "This paper's evaluation-metrics contribution is the first publicly available sentence-level benchmark dataset for Ukrainian lexical stress prediction, a narrowly scoped but reusable resource; it does not propose a general-purpose TTS evaluation metric applicable beyond Ukrainian."
- id: "2025.icnlsp-1.34"
  entry_date: "2026-07-21"
  year: 2025
  venue: workshop
  task:
  - TTS
  architecture:
  - autoregressive-LM
  relevance: low
  evidence_role:
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: dpo_with_automatic_preference_pairs_matches_supervised_finetuning
    role: supports
    claim: "Preference alignment via DPO can match the perceptual quality of supervised fine-tuning on human-labeled TTS data when preference pairs are constructed automatically from model-generated samples."
    source: "§3.5, Table 1, Table 2, Table 5"
    evidence: "On VCTK, DPO fine-tuning with LLM-augmented texts (V4) achieves WER 0.013, SS 0.482, and UTMOS 4.108 from the base xTTSv2 checkpoint, outperforming classical fine-tuning on human-labeled data on intelligibility and naturalness; CMOS evaluation confirms no statistically significant perceptual difference (all CM p > 0.30)."
    confidence: high
    relevance: low
  - claim_id: dpo_initialization_checkpoint_more_important_than_label_quality
    role: complicates
    claim: "The initialisation point before DPO fine-tuning critically determines outcome quality, with checkpoint diversity being a more important factor than label quality of the preceding supervised stage."
    source: "§3.6, Table 1, Table 2"
    evidence: "DPO applied from the ASR-fine-tuned checkpoint consistently underperforms DPO from the base model, with V5 reaching WER 0.273 versus V3's WER 0.014, attributed to standard fine-tuning narrowing generation diversity and leaving insufficient variation for DPO preference signal."
    confidence: high
    relevance: low
  - claim_id: llm_augmented_texts_improve_naturalness_on_domain_matched_data
    role: supports
    claim: "Augmenting unlabeled TTS training data with LLM-generated texts improves synthesis naturalness when the dataset's own texts are structurally mismatched with natural language."
    source: "§3.5, Table 1, Table 2"
    evidence: "On VCTK, which contains newspaper sentences well-aligned with LLM output, adding 15,000 LLM-generated texts raises UTMOS from 4.009 to 4.108; on LJSpeech (audiobook fragments), the improvement is smaller and WER increases, attributed to domain mismatch."
    confidence: medium
    relevance: low
  - claim_id: speaker_similarity_hardest_dimension_to_preserve_under_dpo
    role: complicates
    claim: "Speaker similarity is the most difficult quality dimension to preserve when fine-tuning TTS on ASR-transcribed or automatically constructed data, even when naturalness and intelligibility are maintained."
    source: "§3.5, §3.7, Table 4, Table 5"
    evidence: "Human-labeled fine-tuning achieves the highest SS scores across both datasets; DPO from the base model recovers intelligibility and naturalness but trails on SS, and statistical testing shows SS degradation is significant for checkpoint-initialised DPO (p < 0.001) while naturalness differences are not."
    confidence: medium
    relevance: low
  limitations:
  - "All experiments use xTTSv2 as the sole base model; it is unknown whether the same training recipe and checkpoint-initialisation finding generalise to other LM-based TTS architectures, and evaluation covers English only."
  caveats:
  - "The paper's automatic metrics (WER via Whisper, speaker similarity via ECAPA2, UTMOS) are used both to construct the DPO preference dataset and to evaluate the fine-tuned models, creating a closed-loop relationship between the training signal and evaluation signal that could bias reported gains toward the same metrics used for supervision."
- id: "2025.sigdial-1.21"
  entry_date: "2026-07-21"
