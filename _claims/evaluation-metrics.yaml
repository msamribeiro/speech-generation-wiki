  - claim_id: multimodal_cues_improve_turn_taking_prediction
    role: supports
    claim: "Combining multimodal cues (prosodic, lexical, and visual) consistently improves
      turn-taking prediction over single-modality approaches."
    source: "§4.1"
    evidence: "Multiple independent surveyed works demonstrate that joint use of prosodic and word
      features outperforms either in isolation, consistent with prior findings on the additive
      effect of turn-taking cues across human communication."
    confidence: medium
    relevance: low
  - claim_id: vap_models_unify_eou_and_backchannel_prediction
    role: supports
    claim: "Voice Activity Projection models provide a self-supervised framework that unifies
      end-of-turn and backchannel prediction in continuous spoken dialogue."
    source: "§4.1, §5"
    evidence: "VAP models evaluated zero-shot across shift prediction, hold prediction, upcoming
