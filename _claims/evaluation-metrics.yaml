  - evaluation_caution
  - infrastructure
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: llm_generated_qa_correlates_with_human_authored_qa
    role: supports
    claim: "Automated LLM-based QA generation can produce paralinguistic evaluation sets that correlate closely with human-authored ones for assessing speech LLMs."
    source: "§4, Table 2"
    evidence: "Qwen2-Audio-7B-Instruct achieves 60.28 (LLM-generated QA) versus 59.46 (human-generated QA) under the ChatGPT judge with Prompt 2, and 56.82 versus 54.33 under the Llama-70B judge, both differences small and directionally consistent."
    confidence: medium
    relevance: high
  - claim_id: dual_ser_consistency_filtering_reduces_annotation_noise
    role: supports
    claim: "Combining categorical and dimensional emotion recognition with consistency filtering reduces annotation noise in in-the-wild speech data condensation."
    source: "§3.1, Figure 3"
    evidence: "The dual SER consistency condition (categorical sentiment class aligned with valence score) applied on SG TV/Movie data achieved the highest UWA of 33.65% at valence thresholds x=0.5, y=0.4, outperforming single-paradigm labelling and improving class balance."
    confidence: medium
    relevance: medium
  - claim_id: speech_llms_weak_at_empathetic_reasoning
    role: complicates
    claim: "Current speech LLMs exhibit weak performance on contextual empathetic reasoning even when evaluated against well-formed paralinguistic QA."
    source: "§4, §5"
    evidence: "Evaluation of Qwen2-Audio-7B-Instruct on the CPQA set reveals limitations in handling empathetic reasoning tasks, identified as a motivating gap requiring both better data and more robust models."
    confidence: medium
    relevance: low
  - claim_id: automatic_qa_generation_introduces_biases_needing_filtering
    role: complicates
    claim: "Scalable automatic QA generation from speech introduces systematic biases that require post-filtering to produce usable evaluation data."
    source: "§3.2"
    evidence: "ChatGPT-generated QA contained repetitive question variants (multiple paraphrases asking about reasons behind emotion) and irrelevant questions assuming a text transcript was available, requiring keyword-based post-filtering to remove them."
    confidence: medium
    relevance: high
  limitations:
  - "The evaluation benchmark is small (480 samples, 6.5 hours) drawn from a single domain (Singaporean YouTube channels), and the entire framework is validated against a single speech LLM (Qwen2-Audio-7B-Instruct)."
  caveats:
  - "The near-parity between LLM-generated and human-authored QA sets across two independent judges is a direct evaluation-methodology finding relevant to scalable, low-cost benchmark construction for speech LLMs."

- id: "interspeech-2025-0739"
  entry_date: "2026-07-21"
  year: 2025
  venue: Interspeech
  task:
  - SCA
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - evaluation_caution
  - infrastructure
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: internal_interrupt_detection_beats_vad_based_fdsds
    role: supports
    claim: "Full-duplex spoken dialogue systems that integrate interruption detection internally rather than relying on external VAD modules show systematically higher interrupt success rates under challenging conditions."
    source: "§3.2, Table 4"
    evidence: "Moshi, which uses a built-in full-duplex mechanism, achieves SRRate under Easy interruptions of 61.7% versus 11.3% for Freeze-Omni and 26.9% for VITA-1.5, both of which rely on external VAD."
    confidence: high
    relevance: medium
  - claim_id: latency_and_interruption_robustness_tradeoff
    role: complicates
    claim: "Real-time responsiveness (first-speech-emit delay) and interruption robustness trade off against each other: systems optimised for low latency may not handle mid-utterance interruptions reliably."
    source: "§3.2, Table 4"
    evidence: "Freeze-Omni achieves the lowest first-speech-emit delay (449-515 ms versus 2,020-4,155 ms for Moshi) yet handles interruptions far less reliably than Moshi."
    confidence: medium
    relevance: medium
  - claim_id: background_noise_worse_than_gap_noise_for_fdsds
    role: supports
    claim: "Background noise degrades response quality in full-duplex spoken dialogue systems more severely than discrete noise events inserted into silence gaps."
    source: "§3.2, Table 5"
    evidence: "Continuous background noise (Noise-bg) at low SNR degrades subjective response-quality scores across all three tested systems, while gap noise inserted into silence periods has comparatively little effect, with Freeze-Omni's high VAD threshold blocking most spurious gap events."
    confidence: medium
    relevance: medium
  - claim_id: automated_scoring_and_perplexity_are_complementary_not_sufficient
    role: refines
    claim: "Automated LLM-based scoring and conditioned perplexity provide complementary signals for evaluating spoken dialogue quality, but neither alone captures interruption-handling behaviour."
    source: "§2.3, §3.2"
    evidence: "FD-Bench combines GPT-4o-based six-dimension subjective scoring with Llama-3.3-70B conditioned perplexity (c-PPL) alongside dedicated timing metrics (IRD, FSED) because response-quality scoring alone does not capture interruption success or timing behavior."
    confidence: medium
    relevance: high
  - claim_id: fdsds_far_from_human_robustness_under_interruption
    role: supports
    claim: "Current full-duplex spoken dialogue systems remain far from human-level robustness under frequent interruptions, suggesting the capability remains an open engineering and research challenge."
    source: "§3.2, §5"
    evidence: "All three tested open-source FDSDS (Moshi, Freeze-Omni, VITA-1.5) show substantial performance degradation under frequent interruptions and noisy conditions, with no system approaching reliable interrupt handling across all tested scenarios."
    confidence: medium
    relevance: low
  limitations:
  - "All reported results use speech synthesised by CosyVoice2 only; the ChatTTS and F5-TTS subsets are present in the corpus but results are not reported in the paper, and evaluation is English-only."
  caveats:
  - "FD-Bench is itself an evaluation-methodology contribution: it defines a new suite of timing-based interrupt-handling metrics (SRRate, SIRate, SRIRate, IRD, FSED) that did not previously exist for full-duplex dialogue systems, filling a genuine benchmarking gap."

- id: "interspeech-2025-0756"
  entry_date: "2026-07-21"
  year: 2025
  venue: Interspeech
  task:
  - SCA
  architecture:
  - hybrid
  relevance: medium
  evidence_role:
  - evaluation_caution
  current_role: minor
  method_family: []
  claims:
  - claim_id: affective_routing_improves_emotion_prediction_and_response
    role: supports
    claim: "Structuring speech adapter routing around distinct affective dimensions improves emotion prediction and response quality in spoken dialogue systems compared to single-path adapters."
    source: "§3.8, Table 4"
    evidence: "A-SMiLE's task-aware top-1/top-4 expert routing for VAD versus response generation outperforms conv-based, Q-Former, and standard Transformer adapters across METEOR, ROUGE-L, and GPT-4o empathy scores on DailyTalk."
    confidence: medium
    relevance: low
  - claim_id: multitask_emotion_response_training_improves_both
    role: supports
    claim: "Multi-task joint training of emotion regression and response generation improves both emotional alignment and text quality over response-only training in spoken dialogue."
    source: "§3.6, Table 2"
    evidence: "EAML fine-tuning consistently raises CCC scores and METEOR/ROUGE-L for both 0.5B and 7B backbones over text-only and cascaded baselines that receive VAD labels as auxiliary text rather than learned representations."
    confidence: medium
    relevance: low
  - claim_id: discrete_emotion_labels_insufficient_for_finegrained_states
    role: complicates
    claim: "Discrete categorical emotion labels are insufficient for capturing fine-grained paralinguistic states such as sarcasm and depression in spoken dialogue."
    source: "§3.1, §3.5, Table 1"
    evidence: "The hard-case benchmark (sourced from IEMOCAP and MUStARD) specifically targets emotionally complex states where existing systems trained on categorical emotion corpora fail to capture nuance; A-SMiLE's CCC-based VAD modeling shows substantial gains on exactly these cases."
    confidence: medium
    relevance: medium
  - claim_id: text_overlap_and_llm_empathy_metrics_may_not_reflect_human_judgment
    role: complicates
    claim: "Automatic text-overlap metrics (METEOR, ROUGE-L) and LLM-based empathy scoring may not fully reflect human perceptual judgments of emotional appropriateness in dialogue responses."
    source: "§3.2"
    evidence: "The paper evaluates response quality exclusively with METEOR, ROUGE-L, and GPT-4o-1120 empathy scores; no human listening evaluation is reported, leaving open whether score gains translate to perceived empathy."
    confidence: medium
    relevance: high
  limitations:
  - "The evaluation relies entirely on reference-text metrics (METEOR, ROUGE-L) and GPT-4o-based empathy scores, with no human perceptual study, and the DailyTalk corpus is only 20 hours of scripted dialogue between two fixed speakers."
  caveats:
  - "The paper's own acknowledgment that its evaluation suite lacks human perceptual validation is a direct, self-identified evaluation-metrics limitation relevant to how automated empathy/emotion-alignment scoring should be weighed in spoken dialogue research."

- id: "interspeech-2025-0779"
  entry_date: "2026-07-21"
  year: 2025
  venue: Interspeech
  task:
  - TTS
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - evaluation_caution
  - infrastructure
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: asr_metrics_uncorrelated_with_human_math_intelligibility
    role: complicates
    claim: "Standard ASR-based metrics (CER, BLEU, ROUGE) correlate near-zero with human transcription accuracy for TTS of mathematical expressions, making them insufficient proxies for intelligibility in this domain."
    source: "§5.3"
    evidence: "TTS-ASR cascade metrics (CER=0.10, BLEU=0.66, ROUGE=0.84, averaged across models) correlate at less than 0.15 absolute with human intelligibility metrics (Count-of-Correct, LCER)."
    confidence: high
    relevance: high
  - claim_id: math_tts_intelligibility_varies_strongly_by_category
    role: supports
    claim: "TTS intelligibility for mathematical content is strongly dependent on expression category, with numeric expressions near ceiling and summation or matrix expressions substantially degraded, even for state-of-the-art commercial systems."
    source: "§4, Table 2"
    evidence: "Numerics achieve MOS 4.7-4.9 and Count-of-Correct approximately 97-100% across all five commercial TTS systems, while Summation scores MOS 2.3-3.5 with Count-of-Correct only 40-59%, and Matrices score MOS 3.1-3.6 with Count-of-Correct only 17-29%."
    confidence: high
    relevance: medium
  - claim_id: no_single_tts_model_dominates_across_math_categories
    role: refines
    claim: "No single commercial TTS model consistently outperforms others across all mathematical expression categories, indicating that model selection for math-aware TTS must be category-specific."
    source: "§4, Table 2"
    evidence: "Across the eight evaluated mathematical expression categories, the best-performing commercial system (among Amazon Polly, Azure, Google, OpenAI, Seamless) varies by category, with no model dominating on all eight."
    confidence: medium
    relevance: medium
  - claim_id: human_expert_math_rendition_near_perfect_vs_tts_gap
    role: supports
    claim: "Human expert rendition of mathematical expressions achieves near-perfect intelligibility (97% CoC), establishing a large gap relative to all evaluated TTS systems for most expression categories."
    source: "§4, Table 3"
    evidence: "In the L2 MUSHRA-inspired comparison against a hidden human-expert reference, TTS models show difference scores of 24-73 points on a [0,100] scale for all categories except Numerics and Fractions, with human expert Count-of-Correct at 97% versus substantially lower TTS averages."
    confidence: high
    relevance: medium
  - claim_id: llm_pronunciation_correctness_not_the_bottleneck
    role: refines
    claim: "LLM-generated pronunciation text does not significantly affect TTS intelligibility when the pronunciation is correct, indicating that the bottleneck lies in the TTS prosody rather than the text normalization step."
    source: "§4"
    evidence: "ANOVA on LaTeX Character Error Rate shows that LLM choice (QWEN2.5-7B vs. GPT-4) for generating pronunciation text is not a statistically significant factor once pronunciation is verified correct, while TTS model and expression category are both significant (p < 0.05)."
    confidence: medium
    relevance: low
  limitations:
  - "Only English mathematical expressions are evaluated, and fine-tuning TTS systems specifically for mathematical content is left as future work."
  caveats:
  - "This paper is a direct evaluation-metrics contribution: it introduces domain-specific transcription-based intelligibility metrics (Count-of-Correct, LaTeX Character Error Rate, TeXBLEU) and demonstrates that standard ASR-cascade metrics are an inadequate proxy for human intelligibility in a specialized TTS content domain."

