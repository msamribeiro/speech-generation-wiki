    role: supports
    claim: Concatenating neural codec tokens with self-supervised speech representations frame-by-frame is a viable
      tokenization strategy for both speech understanding and generation tasks within a single sequential model.
    source: §3.3
    evidence: The "Codec_SSL" scheme (ESPnet-Codec combined with XEUS SSL tokens) is used for the headline ASR and
      TTS experiments and the paper reports it "behaves well in both speech understanding and generation" *(§3.3)*.
    confidence: high
    relevance: high
  - claim_id: a_decoder_only_autoregressive_speech_language_model_can_match_or
    role: supports
    claim: A decoder-only autoregressive speech language model can match or exceed dedicated, larger ASR-only systems
      on English benchmarks while using substantially fewer parameters.
    source: §4.2, Table 3
    evidence: A 442M-parameter ESPnet-SpeechLM ASR model reaches average WER 5.4% across six English test sets,
      matching OWSM v3.1-medium (1.02B, 5.4%) and beating Whisper-small (244M, 6.4%) and Whisper-medium (769M, 5.7%).
    confidence: high
    relevance: medium
  - claim_id: cross_system_comparisons_of_speech_language_models_reported_in_the
    role: complicates
    claim: Cross-system comparisons of speech language models reported in the literature are frequently not run
      under matched conditions, limiting how much can be concluded from any single performance table.
    source: §4.3, Table 5
    evidence: In the multi-task comparison (Table 5), competitor numbers for Moshi, VITA, GLM-4-Voice, and others
      are taken directly from their own published reports rather than reproduced by the authors, and the paper explicitly
      flags this with footnote markers.
    confidence: high
    relevance: medium
  - claim_id: combining_a_codec_tokenizer_with_a_self_supervised_tokenizer_frame
    role: complicates
    claim: Combining a codec tokenizer with a self-supervised tokenizer frame-by-frame is reported as an effective
      design choice but is not validated against single-tokenizer ablations in the same controlled setting.
    source: §3.3
    evidence: The claim that Codec_SSL tokenization "behaves well" rests on a single line of justification without
      a paired ablation against codec-only or SSL-only tokenization on the same task and dataset.
    confidence: high
    relevance: high
  limitations:
  - The multi-task model's TTS quality (Proxy MOS 3.99, WER 6.0%) is noticeably weaker than the single-task TTS
    model trained on the same architecture (Proxy MOS 4.03, WER 3.1%), indicating a capacity or interference cost
    to joint multi-task training that the paper reports but does not analyze further. Most training and evaluation
    data is English-only (the multilingual text corpus is used only for the TextLM objective, not for speech tasks),
    so the demonstrated speech capabilities are not evidence of multilingual generalization. Competitor numbers
    in the multi-task comparison table are drawn from third-party reports under unmatched training data and conditions
    rather than reproduced by the authors, which the paper itself notes. As a system/demo paper, the contribution
    is the toolkit and its reference recipes rather than a novel architecture or training method; the headline numbers
    serve to validate functionality rather than push state of the art on any individual benchmark.
