  limitations:
  - SpeechTokenizer is trained solely on English LibriSpeech. While preliminary results in Appendix G suggest cross-lingual
    token transfer is plausible, the codec is not validated for multilingual speech language models and the text-alignment
    properties of RVQ-1 may not hold for typologically distant languages.
  - The SLMTokBench mutual information metric relies on a variational upper bound and a fixed BLSTM downstream model;
    its absolute values are not directly comparable across evaluation frameworks. The USLM is evaluated only on
    VCTK with a single 3-second prompt per speaker, which does not represent the range of zero-shot conditions used
    in contemporaneous benchmarks. Model size is not reported for SpeechTokenizer itself. The voice conversion application
    (§5.2) is characterised as a single-shot demonstration rather than a full evaluation against dedicated VC baselines.
