  claims:
  - claim_id: content_adaptive_token_allocation_in_acoustic_tokenisers_achieves_better_reconstruction
    role: supports
    claim: Content-adaptive token allocation in acoustic tokenisers achieves better reconstruction quality than
      fixed-rate designs at equal or lower token budgets.
    source: §4.2, Table 1
    evidence: VARSTok at 30.95 Hz achieves UTMOS 3.8949 on LibriTTS test-clean, surpassing the 40 Hz WavTokenizer
      (3.6107) while using 23% fewer tokens; the 36.81 Hz configuration (UTMOS 4.000) nearly matches the 75 Hz WavTokenizer
      (4.025) with fewer than half the tokens.
    confidence: high
    relevance: medium
  - claim_id: dynamically_segmented_speech_tokens_carry_more_semantically_discriminative_information_than
    role: supports
    claim: Dynamically segmented speech tokens carry more semantically discriminative information than uniformly
      sampled tokens at the same average rate.
    source: §4.3, Table 2
    evidence: All VARSTok configurations outperform the 40 Hz WavTokenizer on all four ARCH benchmark classification
      tasks (emotion, digit recognition, intent), despite operating at lower average frame rates.
    confidence: high
    relevance: medium
  - claim_id: encoding_token_duration_implicitly_in_the_vq_codebook_index_eliminates
    role: supports
    claim: Encoding token duration implicitly in the VQ codebook index eliminates the need for auxiliary duration
      predictors and preserves compatibility with autoregressive speech language models.
    source: §3.4, §4.4, Table 3
    evidence: The implicit duration coding scheme maps each cluster's content index k and duration d to a single
      token ID D = (d-1)*K + k, enabling a standard cross-entropy autoregressive model to generate variable-rate
      token sequences without modification; MOS and WER improve over the fixed-rate baseline in zero-shot TTS.
    confidence: high
    relevance: high
  - claim_id: more_aggressive_temporal_compression_in_variable_rate_tokenisers_trades_reconstruction
    role: complicates
    claim: More aggressive temporal compression in variable-rate tokenisers trades reconstruction quality for token
      efficiency beyond a practical compression threshold.
    source: §4.2, Table 1
    evidence: Increasing S_max from 2 to 8 reduces the average frame rate from 46.5 Hz to 22.38 Hz but degrades
      UTMOS from 4.038 to 3.647 and PESQ from 2.069 to 1.453 on LibriTTS test-clean; the optimal configuration (tau=0.7,
      S_max=4 at 30.95 Hz) sits at the knee of this trade-off curve.
    confidence: high
    relevance: high
  - claim_id: inference_speed_in_autoregressive_speech_lms_depends_primarily_on_sequence
    role: refines
    claim: Inference speed in autoregressive speech LMs depends primarily on sequence length rather than vocabulary
      size, so variable-rate tokenisers with expanded vocabularies still accelerate decoding.
    source: §J, Table 5
    evidence: VARSTok (tau=0.6) achieves RTF 0.487 versus 0.766 for the 40 Hz WavTokenizer baseline (36% speedup)
      despite expanding the token vocabulary from K to K*S_max = 16,384 entries, because shorter sequences reduce
      the dominant cost of attention computation over more function evaluations.
    confidence: high
    relevance: medium
  limitations:
  - Evaluation is restricted to English (LibriTTS). The clustering algorithm relies on cosine similarity in a WavTokenizer
    embedding space trained on English read speech; whether the density-peak boundaries remain meaningful for other
    languages, spontaneous speech, or emotionally expressive styles is untested.
  - Speaker similarity under more aggressive compression (tau=0.6, 26.29 Hz) does show a statistically modest decline
    in objective SIM (0.880 vs 0.918 for the baseline), and while subjective SMOS remains comparable, the long-tail
    impact on voices far from the training distribution is unknown. Codebook collapse becomes severe for K above
    4096 in the expanded index space, suggesting that very large vocabulary configurations require dedicated regularisation
    strategies not addressed here. The clustering algorithm is not differentiable, so joint end-to-end training
    with a downstream TTS model is not straightforward.
  caveats: []
- id: '2509.05863'
  published_date: "2025-09-06"
  entry_date: '2026-07-28'
  year: 2025
