  - VAE
  relevance: medium
  evidence_role:
  - architecture_variant
  current_role: active_evidence
  method_family:
  - vae_vector_quantized_codecs
  claims:
  - claim_id: domain_adaptive_partitioning_within_a_shared_codebook_resolves_the_performance
    role: supports
    claim: Domain-adaptive partitioning within a shared codebook resolves the performance degradation that plagues
      unified single-codebook codecs on mixed multi-domain audio.
    source: §3.2, §5.3, Tables 2, 4, 6
    evidence: Removing the partitioned codebook raises Mel Distance from 0.344 to 0.487 on speech and from 0.396
      to 0.506 on music in ablation; the full UniCodec outperforms WavTokenizer (unified) on all three domains in
      both objective and MUSHRA evaluation.
    confidence: high
    relevance: high
  - claim_id: self_supervised_mask_prediction_objectives_integrated_directly_into_codec_training
    role: supports
    claim: Self-supervised mask prediction objectives integrated directly into codec training improve semantic representation
      without requiring external pretrained SSL encoders.
    source: §3.4, §5.2, Table 5
    evidence: The semantic training stage improves RAVDESS classification accuracy from 36.81 to 40.28 and Audio-MNIST
      from 69.84 to 70.94 compared to the codec without this stage; no auxiliary SSL model is used.
    confidence: high
    relevance: high
  - claim_id: joint_training_of_reconstruction_and_self_supervised_semantic_objectives_from
    role: complicates
    claim: Joint training of reconstruction and self-supervised semantic objectives from scratch degrades single-codebook
      codec performance; sequential staging is required.
    source: §3.4
    evidence: Preliminary experiments show that training reconstruction, mask prediction, and contrastive loss simultaneously
      is infeasible; the two-stage approach (acoustic training first, then semantic stage) is necessary for stable
      convergence.
    confidence: high
    relevance: high
  - claim_id: large_scale_diverse_audio_training_data_introduces_noise_that_degrades
    role: complicates
    claim: Large-scale diverse audio training data introduces noise that degrades codec reconstruction quality,
      requiring targeted fine-tuning on curated high-quality subsets.
    source: §4, §5.3, Appendix C, Table 6
    evidence: Training on 80K hours of mixed data without the fine-tuning stage raises Mel Distance by 0.103 on
      speech (0.448 vs 0.344) relative to the fine-tuned model; high-quality fine-tuning on LibriTTS clean, VCTK,
      and LJSpeech recovers most of the degradation.
    confidence: high
    relevance: high
  - claim_id: single_codebook_codecs_at_75_tokens_per_second_can_achieve
    role: supports
    claim: Single-codebook codecs at 75 tokens per second can achieve acoustic reconstruction quality competitive
      with multi-layer RVQ codecs operating at 600 tokens per second when combined with domain-adaptive design.
    source: §5.1, Table 3
    evidence: UniCodec PESQ 3.03 and STOI 0.949 on LibriTTS test-clean exceeds Encodec (2.72, 0.939) and SpeechTokenizer
      (2.61, 0.917) at 600 TPS, with eight times fewer tokens per second.
    confidence: high
    relevance: high
  limitations:
  - 'Training is sensitive to noisy or low-quality input: large-scale noisy data alone degrades reconstruction quality,
    and the fine-tuning stage is essential. This dependency on curated data limits scalability.'
  - The single-codebook codec struggles to balance both acoustic reconstruction fidelity and semantic density across
    diverse domains simultaneously, as these objectives conflict. Streaming performance degrades relative to non-streaming
    inference. The paper does not demonstrate integration with an actual audio language model, leaving downstream
    generation quality unvalidated.
  caveats: []
