    and reduced-size "CaT-TTS-small" models rather than the full 0.4B system, so it is not established that the
    same magnitude of gains transfers to the full-scale model. Speaker similarity remains a clear weak point relative
    to hybrid and NAR baselines, which the authors attribute to the deliberate absence of continuous acoustic conditioning
    rather than treat as a target for improvement. The evaluation is also dominated by Chinese-language and Chinese-out-of-domain
    test sets (PGC-Hard, PGC-Poly, Seed-TTS test-zh/test-hard), with comparatively less English-language evidence.
  caveats: []
- id: '2509.22167'
  published_date: "2025-09-26"
  entry_date: '2026-07-28'
  year: 2025
  venue: arXiv
  task:
  - TTS
  - codec
  architecture:
  - VAE
  relevance: medium
  evidence_role:
  - architecture_variant
  - control_evidence
  current_role: active_evidence
  method_family:
  - vae_vector_quantized_codecs
  claims:
  - claim_id: regularizing_a_continuous_vae_latent_space_toward_semantic_structure_derived
    role: supports
    claim: Regularizing a continuous VAE latent space toward semantic structure derived from self-supervised speech
      features mitigates the reconstruction-generation trade-off in latent-based non-autoregressive TTS.
    source: §4.1, Table 1
    evidence: At a fixed 64-dimensional latent size, adding cosine-similarity alignment to WavLM features reduces
      WER from 2.65% (vanilla VAE) to 2.10% while raising speaker similarity from 0.59 to 0.64 on LibriSpeech-PC
      test-clean.
    confidence: high
    relevance: medium
  - claim_id: semantic_alignment_regularization_of_the_generation_target_accelerates_training_convergence
    role: supports
    claim: Semantic alignment regularization of the generation target accelerates training convergence of latent
      diffusion/flow-matching TTS models.
    source: §4.1, Figure 3
    evidence: Training-step comparisons show Semantic-VAE-based F5-TTS reaching lower WER and higher SIM than both
      the vanilla-VAE and mel-spectrogram baselines at the same number of training steps.
    confidence: high
    relevance: medium
  - claim_id: the_intelligibility_versus_speaker_similarity_trade_off_in_vae_latent
    role: refines
    claim: The intelligibility-versus-speaker-similarity trade-off in VAE latent representations is governed by
      which layer of a self-supervised model is used for semantic supervision, not eliminated outright by adding
      semantic alignment.
    source: §4.3, Table 3
    evidence: Ablating SSL layer choice shows the final layer of WavLM/HuBERT substantially degrades SIM (0.50-0.58)
      despite comparable WER, while an intermediate layer (WavLM layer 23) gives the best joint WER/SIM balance.
    confidence: high
    relevance: medium
  - claim_id: cosine_similarity_alignment_losses_to_self_supervised_speech_features_preserve
    role: supports
    claim: Cosine-similarity alignment losses to self-supervised speech features preserve useful semantic structure
      in a latent space more effectively than L1 or L2 distance losses to the same features.
    source: §4.3, Table 3
    evidence: Negative cosine alignment achieves 2.10% WER / 0.64 SIM, compared to 3.12% WER / 0.47 SIM for L1 alignment
      and 4.37% WER / 0.48 SIM for L2 alignment under otherwise identical settings.
    confidence: high
    relevance: medium
  - claim_id: adding_a_semantic_regularization_objective_to_a_vae_s_training
    role: complicates
    claim: Adding a semantic regularization objective to a VAE's training loss does not necessarily degrade the
      representation's reconstruction fidelity, contrary to the general expectation that additional regularization
      terms cost reconstruction quality.
    source: §4.2, Table 2
    evidence: Semantic-VAE reconstruction metrics on LibriTTS test-other (PESQ 3.74, STOI 0.96, UTMOS 3.56) are
      nearly identical to an unregularized vanilla VAE of the same architecture (PESQ 3.75, STOI 0.97, UTMOS 3.57).
    confidence: high
    relevance: high
  limitations:
  - The high-resource baseline numbers in Table 1 (CosyVoice, FireRedTTS, E2 TTS, F5-TTS at 100k-580k training hours)
    are quoted directly from their original papers rather than re-run under matched data and compute, so any comparison
    against Semantic-VAE's low-resource (0.6k-hour) results is illustrative context only, not a controlled comparison.
    The method is validated on English speech only, at a single latent configuration (64 dimensions, 40Hz), and
    on two NAR backbones (F5-TTS, E2 TTS); generalization to AR codec-token TTS systems, other languages, or other
    latent dimensionalities/frame rates is untested. The paper also does not report inference latency or discuss
    how the added SSL model changes deployment cost of the VAE training pipeline (inference itself is unaffected,
    since the SSL branch is training-only).
  caveats: []
- id: '2509.24457'
  published_date: "2025-09-29"
  entry_date: '2026-07-28'
  year: 2025
  venue: arXiv
  task:
  - codec
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: neural_network_based_objective_quality_metrics_correlate_more_strongly_with
    role: supports
    claim: Neural-network-based objective quality metrics correlate more strongly with human subjective judgments
      than classical DSP-based metrics when evaluating neural audio codec output.
    source: §4
    evidence: Across 1,700 data points from 17 codec conditions, scoreq_ref reaches a Pearson correlation of 0.87
      with MUSHRA-1S scores and utmos, nomad, scoreq_nr, sheet_ssqa, and audiobox ce all exceed 0.80, while the
      strongest classical baselines (warpq, pesq) reach only 0.73; all metrics with correlation above 0.8 are neural-network-based.
    confidence: high
    relevance: high
  - claim_id: non_intrusive_objective_metrics_trained_on_mos_based_subjective_ratings
    role: complicates
    claim: Non-intrusive objective metrics trained on MOS-based subjective ratings saturate near the top of the
      quality scale, weakening their ability to discriminate between near-transparent codec conditions.
    source: §4
    evidence: Spearman and Kendall correlations for utmos and scoreq_nr drop sharply relative to their Pearson correlation,
      and condition-wise plots show scoreq_nr, ce, sheet_ssqa, and utmos producing near-constant scores in the high-MUSHRA
      range (red-ellipse regions of Fig. 3), attributed to the coarse 5-point ACR scale underlying the MOS targets
      these metrics are trained on.
    confidence: high
    relevance: high
  - claim_id: reference_based_intrusive_objective_metrics_remain_more_statistically_stable_and
    role: refines
    claim: Reference-based (intrusive) objective metrics remain more statistically stable and discriminative than
      reference-free (non-intrusive) metrics for high-quality neural codec conditions, even though non-intrusive
      metrics are the only option when no reference signal is available.
    source: §4
    evidence: Confidence-interval analysis across a high-, medium-, and low-quality codec condition (DAC-8kbps,
      SemantiCodec-1.4kbps, EnCodec-1.5kbps) shows intrusive scoreq_ref producing consistently smaller confidence
      intervals than non-intrusive scoreq_nr across sample sizes, an effect most pronounced for the high-quality
      condition.
    confidence: high
    relevance: high
  - claim_id: reference_based_classical_metrics_can_also_fail_to_discriminate_between
    role: complicates
    claim: Reference-based classical metrics can also fail to discriminate between codec conditions that differ
      substantially in perceived subjective quality, despite having access to the clean reference signal.
    source: §4
    evidence: pesq shows the widest observed blind spot among all evaluated metrics, mapping codecs spanning roughly
      35 MUSHRA points to nearly identical objective scores in the low-to-medium quality range (green-ellipse regions
      of Fig. 3), a limitation the authors note is a previously known phenomenon for pesq.
    confidence: high
    relevance: high
  limitations:
  - All results are obtained under clean speech conditions only; the authors explicitly leave analysis of noise
    and reverberation for future work, so the metric rankings and saturation findings here should not be assumed
    to transfer to noisy or reverberant deployment scenarios.
  - The study is restricted to 12 codecs and 17 conditions selected by the authors, and to a single test set of
    100 files drawn from the LRAC challenge Track 1 blind set; generalization to other speech domains, languages,
    or codec families is untested. Sample-size guidance is derived from only three representative codec conditions
    and two metrics (scoreq_ref, scoreq_nr), leaving open how confidence-interval behavior generalizes across the
    full metric suite. The authors also note unexplained run-to-run variability for utmosv2, possibly from internal
    random frame selection not currently exposed by the toolkit used, which they flag rather than resolve.
  caveats: []
- id: '2509.24570'
  published_date: "2025-09-29"
  entry_date: '2026-07-28'
  year: 2025
  venue: arXiv
  task:
  - TTS
  - VC
  - evaluation
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - architecture_variant
  - control_evidence
  - infrastructure
  current_role: active_evidence
  method_family:
  - autoregressive_codec_language_models
  claims:
  - claim_id: automated_pipelines_combining_expressive_tts_voice_conversion_and_llm_based
    role: supports
    claim: Automated pipelines combining expressive TTS, voice conversion, and LLM-based instruction generation
      can produce large-scale paired speech style editing data without manual recording or annotation, provided
      a multi-criterion filtering step is applied.
    source: §2.1, §2.2, Fig. 3
    evidence: The three-stage pipeline (EmoCapTTS synthesis + Chatterbox voice conversion + Qwen3-8B instruction
      generation) yields 382 hours and ~100,000 pairs from EARS and Expresso source material, filtered to WER <
      10, style similarity > 0.5, and speaker similarity > 0.5 *(§2.1, §2.2, Fig. 3)*.
    confidence: high
    relevance: medium
  - claim_id: fine_grained_diverse_natural_language_instructions_improve_both_in_domain
    role: supports
    claim: Fine-grained, diverse natural-language instructions improve both in-domain accuracy and cross-domain
      generalization of instruction-guided speech style editing models relative to coarse, templated instruction
      sets.
    source: §4.2, Table 2
    evidence: LlasaEdit trained on ISSE outperforms the same architecture trained on ESD across WER, style similarity,
      speaker similarity, and UTMOS in-domain (8.06 vs. 10.07 WER; 0.68 vs. 0.64 style-sim), and the ISSE-trained
      model's cross-domain performance on ESD exceeds the ESD-trained model's in-domain performance on several metrics
      *(§4.2, Table 2)*.
    confidence: high
    relevance: medium
  - claim_id: instruction_guided_style_editing_models_trained_on_narrow_templated_instruction
    role: complicates
    claim: Instruction-guided style editing models trained on narrow, templated-instruction datasets fail catastrophically
      when evaluated on more diverse, fine-grained instruction distributions.
    source: §4.2, Table 2
    evidence: The ESD-trained LlasaEdit model, when evaluated on the ISSE test set, produces a WER of 68.17, compared
      to 10.07 on its own in-domain ESD test set, indicating the model does not generalize beyond the coarse single-attribute
      instructions it was trained on *(§4.2, Table 2)*.
    confidence: high
    relevance: medium
  - claim_id: isolating_style_variation_from_speaker_identity_in_synthetically_generated_paired
    role: complicates
    claim: Isolating style variation from speaker identity in synthetically generated paired training data requires
      an explicit voice-conversion correction step, since expressive TTS models conditioned on style descriptions
      alone conflate style and timbre changes.
    source: §2.1
    evidence: EmoCapTTS-generated stylized speech differs from the anchor speech in timbre because the model lacks
      explicit speaker control; a separate voice conversion stage (Chatterbox) is needed to re-align target timbre
      to the anchor speaker before the pair can be used to define a style-only edit *(§2.1)*.
    confidence: high
    relevance: medium
  limitations:
  - The dataset and benchmark are limited to English, which the authors explicitly flag as constraining applicability
    to multilingual editing scenarios. The generated portion of ISSE (292 of 382 hours) is itself the product of
    a TTS+VC synthesis pipeline rather than real recordings, so any systematic biases or artifacts introduced by
    EmoCapTTS or Chatterbox could propagate into models trained on it; the quality-filtering thresholds (WER < 10,
    similarity > 0.5) are relatively loose and their effect on downstream editing fidelity is not separately ablated.
    The benchmark comparison is against a single alternative dataset (ESD) and a single model architecture (LlasaEdit);
    no comparison is made against other instruction-guided editing systems such as InstructSpeech, and no ablation
    isolates the individual contribution of instruction diversity versus raw data scale.
  caveats: []
- id: '2509.24650'
  published_date: "2025-09-29"
  entry_date: '2026-07-28'
  year: 2025
  venue: arXiv
  task:
  - TTS
  - VC
  architecture:
  - autoregressive-LM
  - diffusion
  relevance: medium
  evidence_role:
  - architecture_variant
  - control_evidence
  current_role: influential
  method_family:
  - autoregressive_codec_language_models
  - diffusion_latent_codec_generators
  claims:
  - claim_id: a_differentiable_scalar_quantization_bottleneck_applied_to_hidden_states_rather
    role: supports
    claim: A differentiable scalar-quantization bottleneck applied to hidden states, rather than used as a discrete
      prediction target, can induce semantic/acoustic task separation inside a continuous autoregressive TTS model
      without an external speech tokenizer.
    source: §4.3, Table 6
    evidence: Removing the FSQ bottleneck from an otherwise identical hierarchical architecture increases ZH-hard-case
      CER from 18.19% to 24.92%, while FSQ dimensionality shows a non-monotonic optimum around 128-256 dimensions
      rather than monotonic improvement with capacity.
    confidence: high
    relevance: medium
  - claim_id: explicitly_separating_acoustic_detail_recovery_into_a_dedicated_residual_module
    role: supports
    claim: Explicitly separating acoustic detail recovery into a dedicated residual module improves robustness on
      complex inputs beyond what a single semantic language model plus a diffusion decoder achieves.
    source: §4.4, Table 7
    evidence: Removing the RALM (TSLM output feeding the diffusion decoder directly, architecturally close to DiTAR)
      degrades EN-WER from 2.98% to 4.34% and ZH-hard-case CER from 18.19% to 25.0%; removing the historical acoustic
      embedding from the RALM input degrades results further.
    confidence: high
    relevance: medium
  - claim_id: learning_rate_schedule_design_not_just_architecture_materially_affects_zero
    role: complicates
    claim: Learning-rate schedule design, not just architecture, materially affects zero-shot speaker similarity
      in large-scale continuous TTS training.
    source: §4.5, Table 8
    evidence: A two-phase Warmup-Stable-Decay schedule's decay phase alone improves ZH-hard-case CER from 13.22%
      to 8.87% and SIM by 4.4 points over the stable-phase-only checkpoint on an otherwise identical model.
    confidence: high
    relevance: low
  - claim_id: classifier_free_guidance_strength_in_diffusion_based_tts_decoders_trades
    role: complicates
    claim: Classifier-free guidance strength in diffusion-based TTS decoders trades off intelligibility against
      speaker similarity non-monotonically, with both very low and very high guidance scales degrading both metrics
      simultaneously.
    source: §4.6, Table 9
    evidence: CFG scale 1.0 (no guidance) yields EN-WER 16.32% and SIM 55.1%, while scale 5.0 yields EN-WER 12.78%
      and SIM 60.7%; the optimum at scale 2.0 achieves EN-WER 1.85% and SIM 72.9%, with degradation on both sides
      of the optimum.
    confidence: high
    relevance: low
  - claim_id: removing_dependency_on_a_pre_trained_discrete_speech_tokenizer_does
    role: refines
    claim: Removing dependency on a pre-trained discrete speech tokenizer does not require sacrificing zero-shot
      voice cloning quality relative to discrete-token-based open-source TTS systems.
    source: §4.2, Table 3
    evidence: On SEED-TTS-EVAL, the fully continuous VoxCPM reports SIM of 72.9% (EN) and 77.2% (ZH), exceeding
      the discrete-token-based IndexTTS2 and CosyVoice2 baselines on the same benchmark.
    confidence: high
    relevance: high
  limitations:
  - Multilingual capability is limited to Chinese and English by construction; the paper explicitly reports uncertain
    generalization to other languages, and prosody/emotion control lacks any intuitive or precise user-facing conditioning
    mechanism. The causal audio VAE operates at 16kHz, which the authors acknowledge falls short of the 24kHz or
    44.1kHz sampling rates typically expected for high-fidelity applications. Baseline comparisons draw on official
    implementations or numbers reported in prior papers rather than a uniformly controlled re-evaluation, so cross-system
    rankings on tables that mix reproduced and self-reported numbers should be read cautiously. The training corpus
    (1.8M hours) is internal and not released, which limits independent reproduction of the full-scale result even
    though code and weights for the trained model are public.
  caveats: []
- id: '2509.25131'
  published_date: "2025-09-29"
  entry_date: '2026-07-28'
  year: 2025
  venue: arXiv
  task:
  - SCA
