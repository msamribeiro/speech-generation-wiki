    ordering of described events is not captured. Vocal quality and lyrics generation are not supported and are
    noted as future work. The 280,000-hour training corpus is proprietary and not released, limiting reproducibility.
    The model weights are not released. Evaluation is conducted against two relatively weak baselines (Mubert, a
    rule-based tag-to-audio API; Riffusion, a fine-tuned image diffusion model on spectrograms); no contemporary
    neural music generation system of comparable scale is included in comparisons.'
