  architecture:
  - autoregressive-LM
  - VAE
  relevance: high
  evidence_role:
  - core_evidence
  - acceleration_evidence
  - control_evidence
  current_role: active_evidence
  method_family:
  - autoregressive_codec_language_models
  - vae_vector_quantized_codecs
  claims:
  - claim_id: cascaded_residual_codec_architectures_can_enforce_attribute_disentanglement_through_structure
    role: supports
    claim: Cascaded residual codec architectures can enforce attribute disentanglement through structure rather
      than through adversarial training objectives.
    source: §2.1, §3.3.3, Table 3
    evidence: MSR-Codec achieves clean separation of timbre, prosody, and semantic content by having each stream
      operate on residuals from the previous stage, without adversarial disentanglement loss; VC experiments confirm
      independent manipulation of each attribute.
    confidence: high
    relevance: high
  - claim_id: explicit_prosodic_supervision_in_a_dedicated_codec_stream_promotes_measurable
    role: supports
    claim: Explicit prosodic supervision in a dedicated codec stream promotes measurable disentanglement of pitch
      from speaker identity.
    source: §2.1.2, §3.3.3, Table 3
    evidence: VQ1 (prosody stream) is trained with MSE loss against ground-truth F0 and spectral energy; prosody-only
      VC achieves low ΔF0,tar (12.3-14.2 Hz) while maintaining high SIM-src (0.59-0.64), confirming that prosody
      and timbre are independently manipulable.
    confidence: high
    relevance: high
  - claim_id: disentangled_codec_designs_can_achieve_competitive_speaker_similarity_at_lower
    role: supports
    claim: Disentangled codec designs can achieve competitive speaker similarity at lower bitrates than undifferentiated
      RVQ codecs.
    source: §3.3.1, Table 1
    evidence: MSR-Codec-424 achieves SPK-SIM 0.80 at 424 bps, higher than WavTokenizer (0.67 at 900 bps) and X-Codec
      (0.72 at 1000 bps), attributed to the time-invariant timbre stream which preserves speaker identity without
      scaling with utterance length.
    confidence: high
    relevance: high
  - claim_id: data_efficient_tts_systems_built_on_factorized_codec_representations_can
    role: supports
    claim: Data-efficient TTS systems built on factorized codec representations can achieve competitive intelligibility
      relative to larger models trained on more data.
    source: §3.3.2, Table 2
    evidence: The 0.2B MSR-Codec-524 TTS model trained on 45k hours achieves WER 3.07% on Seed-TTS-eval English,
      outperforming Llasa-1B trained on 250k hours (WER 3.22%) and FireRedTTS-0.4B trained on 150k hours (WER 3.82%).
    confidence: high
    relevance: high
  - claim_id: signal_fidelity_codec_metrics_stoi_pesq_and_speaker_similarity_diverge
    role: complicates
    claim: Signal-fidelity codec metrics (STOI, PESQ) and speaker similarity diverge at low bitrates, making holistic
      quality assessment difficult.
    source: §3.3.1, Table 1
    evidence: MSR-Codec-424 achieves the highest SPK-SIM (0.80) among codecs at comparable bitrates but lower STOI
      (0.84) and PESQ-WB (1.82) than some baselines, indicating that speaker preservation and signal-level fidelity
      are optimized differently by the multi-stream design.
    confidence: high
    relevance: high
  limitations:
  - No subjective listening test (MOS/MUSHRA) is reported for any condition; all quality comparisons rely on automatic
    metrics (UTMOS, STOI, PESQ, WER, SPK-SIM). Conclusions about perceived naturalness cannot be confirmed from
    the available data.
  - 'The VC evaluation protocol is small in scope: 8 target speakers from VCTK and 100 source utterances from LibriTTS.
    Generalisation to more diverse speakers, accents, or noisy conditions is not assessed. The FreGAN vocoder operates
    at 16 kHz, and the Mel-spectrogram-based pipeline may impose a quality ceiling relative to waveform-domain codecs.
    The TTS model is evaluated only on English; the codec was trained on Mandarin and English data but multilingual
    TTS capability is not demonstrated. Model size figures for the codec itself are not reported; only the TTS model
    size (0.2B) is provided.'
  caveats: []
- id: '2412.16846'
  published_date: "2025-09-17"
  entry_date: '2026-07-28'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  - VAE
  relevance: medium
  evidence_role:
  - architecture_variant
  - acceleration_evidence
  - control_evidence
  current_role: active_evidence
  method_family:
  - autoregressive_codec_language_models
  - vae_vector_quantized_codecs
  claims:
  - claim_id: distributional_training_objectives_for_continuous_ar_speech_modeling_achieve_higher
    role: supports
    claim: Distributional training objectives for continuous AR speech modeling achieve higher intelligibility than
      regression-based alternatives.
    source: §TTS Evaluation, Table 2; §Ablation Study, Table 5
    evidence: KALL-E with KL divergence loss achieves WER 1.94 / CER 0.96 on Seed-TTS test sets, below all discrete-token
      and regression-based baselines; ablation replacing Flow-VAE with Stable Audio VAE (near-zero KL weight, approaching
      a plain autoencoder) collapses CER from 2.79 to 40.09 at the same latent dimension.
    confidence: high
    relevance: medium
  - claim_id: low_frame_rate_continuous_representations_reduce_autoregressive_tts_inference_compute
    role: supports
    claim: Low frame-rate continuous representations reduce autoregressive TTS inference compute by over an order
      of magnitude without sacrificing synthesis quality.
    source: §TTS Evaluation, Table 3, Table 4
    evidence: KALL-E at 12.5 Hz requires 7,947 GFLOPs to synthesize 10 seconds vs. 122,170 for Llasa-1B at 50 Hz,
      while achieving higher MOS (4.17 vs. 3.92) and lower WER (1.94 vs. 3.6) on the same test set.
    confidence: high
    relevance: medium
  - claim_id: objective_speaker_similarity_metrics_for_zero_shot_tts_are_unreliable
    role: complicates
    claim: Objective speaker similarity metrics for zero-shot TTS are unreliable for cross-system comparisons when
      decoder architectures differ in their use of reference audio.
    source: §TTS Evaluation, Table 2, Table 3
    evidence: Discrete-token systems (Seed-TTS SIM 0.796, FireRedTTS SIM 0.635) score differently on objective SPK-SIM
      than KALL-E (SIM 0.646/0.568), but KALL-E receives higher listener naturalness ratings; the authors attribute
      the gap to those systems conditioning the waveform decoder on the reference utterance at decode time, which
      inflates the metric independent of perceived speaker fidelity.
    confidence: high
    relevance: low
  - claim_id: test_time_adaptation_from_a_single_reference_utterance_improves_speaker
    role: supports
    claim: Test-time adaptation from a single reference utterance improves speaker similarity in continuous-representation
      AR TTS without requiring full model retraining.
    source: §Test Time Training; §TTS Evaluation, Table 2
    evidence: KALL-E (TTT) improves SPK-SIM from 0.568 to 0.611 on test-en using N=200 latent sequences sampled
      from the reference utterance's Flow-VAE distribution, with WER remaining stable at 1.90.
    confidence: high
    relevance: high
  - claim_id: increasing_vae_kl_regularization_weight_trades_reconstruction_fidelity_for_a
    role: complicates
    claim: Increasing VAE KL regularization weight trades reconstruction fidelity for a latent space structure that
      is more suitable for downstream generative modeling.
    source: §VAE Evaluation, Table 1; §Ablation Study, Table 5
    evidence: Flow-VAE uses KL weight 32 and scores PESQ-WB 3.26 at 512-dim/12.5 Hz, below Stable Audio VAE (3.11)
      at the same frame rate with near-zero KL weight; however, Stable Audio VAE's latent space causes CER to collapse
      when used as the AR LM encoder, demonstrating that reconstruction quality and generation compatibility impose
      conflicting constraints on VAE training.
    confidence: high
    relevance: medium
  limitations:
  - 'Objective speaker similarity remains below discrete-token systems that condition their decoders on the reference
    audio, suggesting the Flow-VAE''s information bottleneck trades some speaker detail for a more LM-friendly latent
    space. The TTT procedure assumes the transcript of the reference utterance is available, which may not hold
    in all deployment settings. Overfitting risk in TTT is real: CER rises after N=200 in ablation, limiting the
    effective adaptation set size. Evaluations are conducted solely on the Seed-TTS test sets; generalization to
    other benchmarks, out-of-distribution speakers, or noisy acoustic conditions is not assessed. Training data
    composition differs from the most directly comparable system (Llasa-1B), making it difficult to fully isolate
    architecture from data quality as the source of WER gains.'
  caveats: []
- id: '2509.13670'
  published_date: "2025-09-17"
  entry_date: '2026-07-28'
  year: 2025
  venue: arXiv
  task:
  - codec
  architecture:
  - GAN
  relevance: high
  evidence_role:
  - core_evidence
  - acceleration_evidence
  current_role: active_evidence
  method_family:
  - gan_neural_codecs_and_decoders
  claims:
  - claim_id: knowledge_distillation_from_a_non_causal_high_complexity_teacher_can
    role: supports
    claim: Knowledge distillation from a non-causal, high-complexity teacher can effectively recover reconstruction
      quality degraded by model causalization and channel pruning in low-latency streamable neural codecs.
    source: §IV.A, Table I
    evidence: StreamCodec2 (NH→CL direct KD) achieves PESQ 2.744 and ViSQOL 4.313 vs. 2.650 and 4.290 for the undistilled
      student at identical 910 MFLOPs and 5.4 M parameters, with all gains p < 0.01.
    confidence: high
    relevance: low
  - claim_id: multi_stage_distillation_pipelines_do_not_provide_additive_quality_gains
    role: complicates
    claim: Multi-stage distillation pipelines do not provide additive quality gains over direct teacher-to-student
      distillation in neural codec compression.
    source: §IV.A, Table I
    evidence: Both indirect distillation schemes (NH→CH→CL and NH→NL→CL) underperform direct distillation across
      all objective metrics, with ViSQOL 4.294 and 4.305 vs. 4.313 for direct, suggesting that intermediate steps
      dilute rather than refine the knowledge transferred.
    confidence: high
    relevance: high
  - claim_id: fully_causal_neural_codec_architectures_incur_a_meaningful_quality_penalty
    role: complicates
    claim: Fully causal neural codec architectures incur a meaningful quality penalty relative to non-causal counterparts
      at the same bitrate, which knowledge distillation only partially closes.
    source: §IV.A, Table I
    evidence: Even with the best distillation strategy, StreamCodec2 (NH→CL) scores PESQ 2.744 vs. the teacher's
      3.132 and ViSQOL 4.313 vs. 4.463, leaving a gap that reflects the fundamental constraint of causal-only processing.
    confidence: high
    relevance: high
  - claim_id: distillation_loss_weighting_in_codec_training_requires_careful_calibration_excessively
    role: refines
    claim: Distillation loss weighting in codec training requires careful calibration; excessively large weights
      degrade reconstruction quality by shifting the learning objective toward teacher imitation.
    source: §IV.B, Figure 3
    evidence: ViSQOL for StreamCodec2 (NH→CL) peaks at lambda_KD = 0.01 and declines for weights above this value
      (tested at 0.002, 0.005, 0.01, 0.02, 0.05), consistent with the reconstruction objective being displaced by
      over-fitting the teacher's intermediate representations.
    confidence: high
    relevance: high
  limitations:
  - The evaluation uses only objective metrics (LSD, STOI, PESQ, ViSQOL); it is unclear whether the statistically
    significant gains over the undistilled student are perceptually meaningful. Comparisons are limited to the authors'
    own student and teacher variants with no benchmarking against published competing streamable codecs (SoundStream,
    EnCodec, or others) under matched latency and bitrate conditions, making it difficult to assess where StreamCodec2
    stands in the broader landscape. Experiments use a single dataset (LibriTTS at 16 kHz), leaving generalisation
    to other languages, domains, or sampling rates unconfirmed. Future directions noted by the authors include improving
    reconstruction quality further and evaluating on additional audio datasets.
  caveats: []
- id: '2509.14882'
  published_date: "2025-09-18"
  entry_date: '2026-07-28'
  year: 2025
  venue: arXiv
  task:
  - SCA
