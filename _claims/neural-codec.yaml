- id: iclr-2025-868masI331
  published_date: "2025-04-24"
  entry_date: '2026-07-28'
  year: 2025
  venue: ICLR
  task:
  - TTS
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - architecture_variant
  - control_evidence
  current_role: active_evidence
  method_family:
  - autoregressive_codec_language_models
  claims:
  - claim_id: reducing_the_first_layer_rvq_frame_rate_of_a_neural
    role: supports
    claim: Reducing the first-layer RVQ frame rate of a neural audio codec through hierarchical multi-resolution
      distillation enables autoregressive TTS to generate minute-long speech with stable intelligibility.
    source: §4, §7.3, Table 3, Table 4
    evidence: MReQ-Encodec at 8 Hz achieves WER 9.79% on MinutesSpeech test-90s where standard Encodec at 8 Hz produces
      100% WER and naive VALL-E at 48 Hz with long training data yields 16.14%.
    confidence: high
    relevance: high
  - claim_id: lowering_the_codec_frame_rate_in_autoregressive_tts_improves_temporal
    role: complicates
    claim: Lowering the codec frame rate in autoregressive TTS improves temporal coherence and intelligibility for
      long utterances but degrades speaker similarity.
    source: §7.3, Table 4, Table 6
    evidence: HALL-E consistently lags VALL-E by 0.025-0.042 SIM points on MinutesSpeech tests; the paper attributes
      this to acoustic information loss when compressing from 48 Hz to 8 Hz in the first RVQ layer.
    confidence: high
    relevance: high
  - claim_id: post_training_from_a_pre_trained_lm_checkpoint_is_essential
    role: supports
    claim: 'Post-training from a pre-trained LM checkpoint is essential for hierarchical codec TTS: training from
      scratch without pre-trained weights collapses quality.'
    source: §7.4, Table 10
    evidence: Removing VALL-E pre-training from HALL-E increases WER from 9.79% to 49.8% on MinutesSpeech test-90s,
      and removing MReQ pre-training similarly degrades codec reconstruction.
    confidence: high
    relevance: high
  - claim_id: the_frame_rate_at_which_autoregressive_speech_token_generation_becomes
    role: refines
    claim: The frame rate at which autoregressive speech token generation becomes unstable is approximately 8 Hz,
      consistent with average phoneme durations of around 100 ms.
    source: Appendix C.1, Table 18
    evidence: Ablation at 4 Hz first-layer rate raises WER to 20.07%, while 8 Hz yields 9.79%; the paper notes that
      phoneme duration averaging ~100 ms corresponds to ~10 Hz, making 4 Hz fundamentally insufficient.
    confidence: high
    relevance: medium
  - claim_id: length_balanced_training_data_covering_the_target_synthesis_duration_is
    role: supports
    claim: Length-balanced training data covering the target synthesis duration is necessary for autoregressive
      models to generalize to long-form speech.
    source: §7.3, Table 4
    evidence: VALL-E trained only on segments up to 28 seconds achieves WER 39.77% on test-90s, and training on
      longer data decreases but does not eliminate the gap; HALL-E's 8 Hz formulation resolves instability that
      remains even with longer VALL-E training data.
    confidence: high
    relevance: medium
  limitations:
  - 'Speaker similarity consistently degrades with frame rate reduction: HALL-E''s SIM scores are 0.025-0.042 lower
    than VALL-E across test conditions. This reflects a fundamental trade-off between temporal compression and acoustic
    fidelity preservation that the paper does not resolve.'
  - The current NAR model processes audio at full 48 Hz resolution, which limits NAR input length to around 28-54
    seconds during training and requires a sliding window at inference. Integrating cross-attention text conditioning
    addresses alignment but does not eliminate the NAR length bottleneck. The paper also does not compare against
    streaming or chunked autoregressive synthesis approaches, which represent a practical alternative. MinutesSpeech
    training data consists entirely of English podcast speech, and generalization to other languages, domains, or
    reading styles is untested.
  caveats: []
- id: iclr-2025-cuFzE8Jlvb
  published_date: "2025-04-24"
  entry_date: '2026-07-28'
  year: 2025
  venue: ICLR
  task:
  - TTS
  architecture:
  - autoregressive-LM
  - VAE
  relevance: medium
  evidence_role:
  - architecture_variant
  - control_evidence
  current_role: active_evidence
  method_family:
  - autoregressive_codec_language_models
  - vae_vector_quantized_codecs
  claims:
  - claim_id: continuous_latent_representations_can_replace_discrete_vector_quantization_in_autoregressive
    role: supports
    claim: Continuous latent representations can replace discrete vector quantization in autoregressive TTS without
      sacrificing generation quality.
    source: §5.1, Table 1, Table 2
    evidence: GMM-LM trained on continuous GMM-VAE encoder features outperforms VALL-E (RVQ-based) on WER, speaker
      similarity, Q-MOS, and S-MOS on LibriSpeech test-clean across all prompt lengths, while using 10.3% of VALL-E's
      parameter count.
    confidence: high
    relevance: medium
  - claim_id: longer_audio_prompts_do_not_uniformly_improve_zero_shot_speaker
    role: complicates
    claim: Longer audio prompts do not uniformly improve zero-shot speaker cloning across AR architectures.
    source: §5.1, Table 2
    evidence: VALL-E's WER increases monotonically with prompt length (6.04% at 3s, 7.54% at 8s, 9.68% at 15s),
      suggesting that simple cross-attention cannot leverage extended speaker context in AR decoding; the proposed
      GMM-LM shows the opposite trend, consistently benefiting from longer prompts.
    confidence: high
    relevance: medium
  - claim_id: strict_monotonic_alignment_substantially_reduces_word_error_rate_in_autoregressive
    role: supports
    claim: Strict monotonic alignment substantially reduces word error rate in autoregressive TTS compared to standard
      cross-attention and soft monotonic variants.
    source: Appendix A.1, Table 6
    evidence: Among alignment strategies tested on the same GMM-LM architecture, stochastic monotonic alignment
      with ST-Gumbel achieves WER 2.72% vs. 6.6% for cross-attention alone; even monotonic attention with Gumbel
      (without the stochastic binary forward pass) scores 3.34%.
    confidence: high
    relevance: medium
  - claim_id: continuous_speech_representations_improve_downstream_autoregressive_model_performance_relative_to
    role: supports
    claim: Continuous speech representations improve downstream autoregressive model performance relative to discrete
      counterparts, independent of the alignment mechanism.
    source: Appendix A.6, Table 10
    evidence: A head-to-head ablation comparing GMM-LM (continuous) against discrete AR models (VQ-VAE single codebook
      and DAC multi-codebook with delayed prediction), all using the proposed monotonic alignment, shows GMM-LM
      achieves WER 2.72% vs. 5.35% and 5.87% for the discrete variants.
    confidence: high
    relevance: medium
  - claim_id: increasing_the_number_of_gaussian_components_in_continuous_ar_modeling
    role: complicates
    claim: Increasing the number of Gaussian components in continuous AR modeling yields diminishing returns and
      can reduce quality through overfitting.
    source: §5.4, Table 4, Table 5, Appendix A.3
    evidence: GMM-LM with 6 diagonal-covariance Gaussians (WER 2.72%, SIM 0.91) outperforms 3-Gaussian (WER 2.89%,
      SIM 0.85), but 10-Gaussian degrades to WER 5.21%, SIM 0.71; the 6-mixture GMM-VAE also shows worse evaluation-set
      reconstruction than the 3-mixture model despite better training-set fit.
    confidence: high
    relevance: medium
  limitations:
  - The evaluation compares against VALL-E (2023), a dated AR baseline. Stronger AR systems published by the time
    of this paper's submission are not included, limiting the strength of the superiority claim for continuous AR
    over discrete AR in general.
  - The model is evaluated exclusively on English audiobook speech (LibriLight training, LibriSpeech evaluation).
    Generalisation to conversational speech, noisy in-the-wild data, or other languages is not demonstrated, though
    noise robustness experiments (Appendix A.4) show the method degrades gracefully under additive noise in prompts.
  - The GMM-VAE introduces an additional 76.5M-parameter component, partially offsetting the parameter savings claimed
    relative to VALL-E's RVQ codec (which uses 16.7M codec-related params). The total system size (GMM-VAE + GMM-LM-Mini)
    is 76.5M + 51.5M = 128M, larger than the headline 51.5M figure.
  - The stochastic monotonic alignment requires sequential per-step alignment computation (Algorithm 1), which may
    limit training throughput compared to fully parallelisable attention. The paper does not report training wall-clock
    times or throughput comparisons.
  - Code and pre-trained models are planned for release but were not available at submission time.
  caveats: []
- id: iclr-2025-dGSOn7sdWg
  published_date: "2025-04-24"
  entry_date: '2026-07-28'
  year: 2025
  venue: ICLR
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - architecture_variant
  - control_evidence
  current_role: influential
  method_family:
  - autoregressive_codec_language_models
  claims:
  - claim_id: reducing_the_token_rate_of_speech_representations_below_10_hz
    role: supports
    claim: Reducing the token rate of speech representations below 10 Hz is sufficient to preserve semantic content
      adequate for spoken language modelling, while substantially improving training and inference efficiency.
    source: §5.6, Table 6
    evidence: SyllableLM at 6.25 Hz, 90M parameters, matches or exceeds TWIST models up to 13B parameters on sBLIMP
      semantic understanding benchmarks, with 30x less training compute and 4.5x faster inference than an equal-sized
      TWIST baseline.
    confidence: high
    relevance: medium
  - claim_id: the_loss_surface_of_a_masked_prediction_ssl_model_encodes
    role: supports
    claim: The loss surface of a masked-prediction SSL model encodes latent syllabic segmentation boundaries discoverable
      without additional supervised signal or cross-modal supervision.
    source: §3.1, Table 1
    evidence: LossPred, applied to a frozen HuBERT student-teacher pair without any training, achieves F1-50 of
      59.6 on syllabic boundary detection, outperforming the feature-similarity-based baseline (47.3) while requiring
      no fine-tuning.
    confidence: high
    relevance: medium
  - claim_id: iterative_student_teacher_distillation_over_pseudo_syllabic_boundaries_progressively_sharpens
    role: supports
    claim: Iterative student-teacher distillation over pseudo-syllabic boundaries progressively sharpens SSL encoder
      representations toward syllable-level organisation.
    source: §5.3, Table 2
    evidence: SylBoost applied to HuBERT improves boundary detection F1 from 60.1 (LossPred initialisation) to 70.2
      after two iterations; applying it to Data2Vec2 reaches 73.2, each iteration producing a measurable gain over
      the previous.
    confidence: high
    relevance: medium
  - claim_id: low_frequency_speech_units_that_improve_semantic_modelling_efficiency_may
    role: complicates
    claim: Low-frequency speech units that improve semantic modelling efficiency may sacrifice robustness to speaker
      rate variation.
    source: Appendix A.5, Table 11
    evidence: SylBoost unit counts collapse under audio speedups of 0.5x and 0.6x relative to original length, performing
      comparably to SD-HuBERT only at mild speedups (0.8x–0.9x range), while showing greater robustness to slowdowns.
    confidence: high
    relevance: medium
  - claim_id: units_optimised_for_semantic_modelling_in_audiobook_speech_may_lose
    role: complicates
    claim: Units optimised for semantic modelling in audiobook speech may lose paralinguistic information, limiting
      applicability to domains requiring prosodic or tonal fidelity.
    source: §6
    evidence: The authors note that low-frequency SylBoost units may lose paralinguistic features such as tone,
      and the entire evaluation is conducted on audiobook data (LibriSpeech / LibriLight); performance on spontaneous
      or multi-speaker speech is not reported.
    confidence: high
    relevance: medium
  limitations:
  - All training and evaluation uses English audiobook data (LibriSpeech, LibriLight). Generalisation to spontaneous
    conversational speech, other languages, or multi-speaker settings is not demonstrated.
  - The interleaved vocoder decoding pipeline introduces a dependency on the TWIST tokeniser and vocoder for resynthesis,
    meaning the system is not fully end-to-end and unit bitrate for the final waveform is partially bounded by TWIST's
    own quality ceiling (WER 6.3%). The efficiency gains in the SpeechLM do not fully apply to the decoding pipeline,
    which involves an additional language model. Scaling beyond 300M parameters was not attempted due to compute
    constraints, leaving open whether the efficiency advantage persists at very large model scales. The base encoder
    quality (Data2Vec2 vs newer models like w2v-BERT 2.0) is acknowledged as a confounding factor in cross-model
    comparisons.
  caveats: []
- id: iclr-2025-hQvX9MBowC
  published_date: "2025-04-24"
  entry_date: '2026-07-28'
  year: 2025
  venue: ICLR
  task:
  - TTS
  architecture:
  - diffusion
  - transformer-enc-dec
  relevance: medium
  evidence_role:
  - architecture_variant
  - control_evidence
  current_role: influential
  method_family:
  - diffusion_latent_codec_generators
  - transformer_encoder_decoder_tokenizers
  claims:
  - claim_id: diffusion_transformer_backbones_are_better_suited_to_tts_than_u
    role: supports
    claim: Diffusion Transformer backbones are better suited to TTS than U-Net backbones once domain-specific conditioning
      factors (phonemes, durations) are removed.
    source: §5.2, Table 4
    evidence: Under matched training conditions, replacing the DiT backbone with a U-Net (and a U-Net variant without
      down/up-sampling) increases WER from 2.93 to 3.7 and drops SIM-r from 0.588 to 0.389 on the English cross-sentence
      task.
    confidence: high
    relevance: medium
  - claim_id: predicting_total_target_length_and_generating_variable_length_sequences_outperforms
    role: supports
    claim: Predicting total target length and generating variable-length sequences outperforms fixed-length generation
      with padding in diffusion-based TTS.
    source: §5.2, Table 5
    evidence: Fixed-length modeling with padding reaches WER 6.81-8.89, while a learned speech length predictor
      with variable-length generation reaches WER 5.36-5.58 under otherwise identical settings.
    confidence: high
    relevance: medium
  - claim_id: aligning_text_and_speech_latent_representations_improves_cross_attention_conditioned
    role: supports
    claim: Aligning text and speech latent representations improves cross-attention-conditioned generation quality,
      independent of model or training-data scale.
    source: §5.2, Tables 6-7
    evidence: A speech codec fine-tuned with an auxiliary language-modeling loss against a frozen text encoder (Mel-VAE++)
      improves WER/SIM over the unaligned codec regardless of which text encoder (ByT5 or SpeechT5) is paired with
      it, and a jointly text-speech-trained text encoder (SpeechT5, 85M params) outperforms a larger text-only encoder
      (ByT5-base, 415M params) trained on more data.
    confidence: high
    relevance: medium
  - claim_id: removing_domain_specific_alignment_factors_from_ldm_based_tts_narrows
    role: complicates
    claim: Removing domain-specific alignment factors from LDM-based TTS narrows but does not eliminate the gap
      to phoneme-duration-based systems in speaker similarity.
    source: §5.1, Table 2
    evidence: DiTTo-en-XL reaches SIM-r 0.6554 on the cross-sentence task, below Voicebox's reported 0.681 (a phoneme/duration-based
      non-autoregressive model), even though DiTTo-en-XL is faster and matches or exceeds Voicebox on WER.
    confidence: high
    relevance: low
  - claim_id: codec_compression_ratio_not_codec_reconstruction_quality_alone_determines_suitability
    role: complicates
    claim: Codec compression ratio, not codec-reconstruction quality alone, determines suitability as a diffusion
      target for variable-length TTS.
    source: §5.2, Table 7
    evidence: DAC achieves higher PESQ and ViSQOL codec-reconstruction scores than Mel-VAE, but its 7-8x longer
      latent sequences make training and inference substantially less efficient and degrade end-to-end WER/SIM relative
      to the more compressed but lower-fidelity Mel-VAE.
    confidence: high
    relevance: high
  limitations:
  - Code and pretrained weights are not released at publication (only demo samples), and most baseline comparisons
    (Voicebox, VALL-E, NaturalSpeech 2/3) use numbers copied from the original papers' reported results rather than
    reproduced under DiTTo's own evaluation pipeline, limiting independent verification of head-to-head rankings.
  - The speaker-similarity gap to phoneme-duration-based systems like Voicebox persists even at the largest model
    scale tested, suggesting that removing domain-specific factors trades off some speaker-identity preservation
    for simplicity and speed. The paper also does not explore natural-language instruction following or fine-grained
    prosody control, both noted as future directions rather than addressed in this work. Multilingual results are
    reported on only 100 held-out examples per language, which is a narrow evaluation slice given nine languages
    with very different phonological properties.
  caveats: []
- id: iclr-2025-tQ1PmLfPBL
  published_date: "2025-04-24"
  entry_date: '2026-07-28'
  year: 2025
  venue: ICLR
  task:
  - TTS
  architecture:
  - flow-matching
  relevance: medium
  evidence_role:
  - architecture_variant
  - acceleration_evidence
  current_role: influential
  method_family:
  - flow_matching_codec_decoders
  claims:
  - claim_id: flow_matching_enables_higher_quality_waveform_generation_than_diffusion_with
    role: supports
    claim: Flow matching enables higher-quality waveform generation than diffusion with fewer inference steps.
    source: §4.6, Table 8
    evidence: PeriodWave with CFM and 6 steps achieves UTMOS 3.628 versus PeriodWave with DDPM at 50 steps achieving
      UTMOS 3.377 on LibriTTS; the CFM model also reaches comparable quality to 50-step DDPM at only 16 steps.
    confidence: high
    relevance: medium
  - claim_id: explicit_multi_period_decomposition_in_the_generator_architecture_improves_pitch
    role: supports
    claim: Explicit multi-period decomposition in the generator architecture improves pitch accuracy and periodicity
      over GAN and diffusion vocoders.
    source: §4.2, §4.6, Table 1, Table 7
    evidence: PeriodWave achieves pitch error of 15.04 cents and periodicity 0.0744 on LJSpeech, substantially below
      BigVGAN (19.02 cents, 0.0782) and all diffusion baselines; ablation shows monotonic improvement as more distinct
      prime-number periods are added.
    confidence: high
    relevance: medium
  - claim_id: single_step_gan_vocoders_achieve_significantly_faster_inference_than_iterative
    role: complicates
    claim: Single-step GAN vocoders achieve significantly faster inference than iterative flow-matching vocoders.
    source: §E, Table 15, Table 16
    evidence: PeriodWave at 16 steps runs at 7.48× real-time; HiFi-GAN runs at 166.70× real-time; even PeriodWave
      at 2 steps (56.36×) is slower than HiFi-GAN, though it already outperforms HiFi-GAN on all quality metrics.
    confidence: high
    relevance: medium
  - claim_id: iterative_waveform_generation_reduces_train_inference_mismatch_artefacts_in_two
    role: supports
    claim: Iterative waveform generation reduces train-inference mismatch artefacts in two-stage TTS relative to
      one-step GAN vocoders.
    source: §4.7, Table 9, §G
    evidence: In zero-shot TTS with ARDiT-TTS acoustic features, PeriodWave+FreeU achieves MOS 4.07 versus BigVGAN's
      4.03 and BigVSAN's 3.99; the iterative refinement allows the vocoder to correct imperfections in generated
      Mel-spectrograms rather than propagating them.
    confidence: high
    relevance: medium
  - claim_id: flow_matching_vocoders_can_decode_neural_codec_tokens_with_streaming
    role: supports
    claim: Flow-matching vocoders can decode neural codec tokens with streaming generation and minimal quality degradation.
    source: §5, Table 10, Table 11
    evidence: PeriodWave trained for parallel generation from Mimi (Q=8) tokens achieves CER 2.5% versus Mimi decoder's
      3.07%; streaming with single-token delay and 2-step sampling maintains comparable quality (CER 2.45%, UTMOS
      3.85 versus parallel 3.93).
    confidence: high
    relevance: high
  limitations:
  - 'Synthesis speed is the principal limitation: at 16 steps, PeriodWave runs at 7.48× real-time, substantially
    slower than one-step GAN vocoders (HiFi-GAN: 166×, BigVGAN: 38×). For latency-sensitive applications, the 2-step
    variant (56×) is practical but still 3× slower than HiFi-GAN.'
  - High-frequency reproduction remains challenging even with multi-band modeling and FreeU. The single-loss (CFM
    objective only) training means the model lacks the spectral feedback that GAN discriminators provide, and M-STFT
    metrics are generally worse than GAN baselines despite better perceptual scores. The authors plan to incorporate
    short-time Fourier convolution blocks or modified spectral objectives to address this.
  - The codec streaming mode uses a non-causal architecture with a one-token look-ahead, which introduces a small
    latency penalty. In-context streaming generation for longer sequences is identified as future work. Evaluation
    is confined to English speech and music; generalisation to other languages, accents, and audio domains remains
    untested in this paper.
  caveats: []
- id: iclr-2025-uxDFlPGRLX
  published_date: "2025-04-24"
  entry_date: '2026-07-28'
  year: 2025
  venue: ICLR
  task:
  - codec
  architecture:
  - flow-matching
  - GAN
  relevance: medium
  evidence_role:
  - architecture_variant
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - flow_matching_codec_decoders
  - gan_neural_codecs_and_decoders
  claims:
  - claim_id: a_flow_matching_based_stochastic_postfilter_conditioned_on_a_deterministic
    role: supports
    claim: A flow matching-based stochastic postfilter conditioned on a deterministic codec's decoder output can
      replace adversarial training while achieving comparable subjective quality to a GAN-based codec.
    source: §5.2, Figure 6
    evidence: MUSHRA listening tests (Test A, 11 expert listeners) show no significant difference between FlowDec-75m
      and DAC-75 score distributions at matched bitrates of 4.5 and 7.5 kbit/s.
    confidence: high
    relevance: high
  - claim_id: coupling_the_flow_matching_source_distribution_to_the_conditioning_signal
    role: supports
    claim: Coupling the flow matching source distribution to the conditioning signal (rather than sampling it independently)
      removes the need for minibatch optimal-transport solvers and improves postfilter sample quality at low inference
      budgets.
    source: §5.1, Table 4
    evidence: At NFE=6, the proposed coupled formulation achieves FAD×100 of 1.62 versus 145.3 for the diffusion-based
      ScoreDec baseline and approximately 29 for an alternative constant-σ flow matching formulation, on the same
      underlying codec and test set.
    confidence: high
    relevance: medium
  - claim_id: improving_perceptual_distance_metrics_fad_via_generative_postfiltering_trades_off
    role: complicates
    claim: Improving perceptual distance metrics (FAD) via generative postfiltering trades off against intrusive
      distortion metrics relative to discriminator-trained codecs.
    source: §5.1, Figure 4, Figure 5
    evidence: Retrained non-adversarial DAC (NDAC) generally outperforms FlowDec on SI-SDR and fwSSNR even though
      FlowDec achieves better FAD, consistent with the perception-distortion tradeoff; the gap is small in the perceptually
      weighted fwSSNR but clear in SI-SDR.
    confidence: high
    relevance: medium
  - claim_id: generative_postfilters_trained_with_vanilla_score_or_flow_matching_formulations
    role: complicates
    claim: Generative postfilters trained with vanilla score- or flow-matching formulations using a fixed-variance
      or independent prior can fail to converge to the target signal or require expensive multi-step inference to
      reach acceptable quality.
    source: §5.1, Table 4
    evidence: ScoreDec (diffusion-based postfilter) produces unusable audio quality at a reduced inference budget
      of 6 function evaluations (FAD×100 = 145.3, SI-SDR = -27.23), only becoming competitive at roughly 50 evaluations;
      a constant-σ flow matching variant also underperforms the proposed coupled formulation at NFE=6.
    confidence: high
    relevance: medium
  limitations:
  - The proposed codec, like the DAC baseline it builds on, uses a noncausal architecture and is not streaming-capable,
    limiting applicability to real-time communication settings where low-latency, causal processing is required.
  - The authors note this could be addressed with a causal DNN design in future work, but no such variant is evaluated
    in this paper. Additionally, the postfilter and underlying codec are trained in two separate stages; joint training
    is identified as a possible quality improvement but is left unexplored due to potential training instability.
    The NCSN++ backbone used for the postfilter was originally designed for images, and the authors suggest audio-specific
    architectures could further improve quality, indicating the current network design is not optimized end-to-end
    for the audio domain. Listening test sample sizes (11 and 10 raters) and clip counts (21 ten-second clips) are
