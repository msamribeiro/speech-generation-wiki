  - The female reference signal shows consistently lower DRT scores than the male reference (M=85 vs. M=91.87),
    suggesting potential issues with the audio materials rather than codec effects. The authors flag this for further
    investigation, and it limits confidence in the codec-level conclusions for female talkers.
  - The study uses closed-set word tests (DRT/MRT), which are prone to ceiling effects at higher codec qualities
    — a limitation the authors acknowledge by suggesting future use of open-set SUS tests. The benchmark is limited
    to English and to 16 kHz stimuli (codecs designed for higher sampling rates were resampled), which may not reflect
    their intended operating conditions. The crowdsourced sample of 82 participants is distributed unevenly across
    eight test blocks, with some blocks approaching the recommended minimum of eight participants per condition.
