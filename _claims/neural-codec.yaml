  - claim_id: factorised_codec_representations_that_balance_acoustic_and_semantic_attributes_trade
    role: supports
    claim: Factorised codec representations that balance acoustic and semantic attributes trade perceptual naturalness
      (UTMOS) for intelligibility (WER) relative to codecs that prioritise acoustic fidelity.
    source: §4.2
    evidence: Factorised codec representations that balance acoustic and semantic attributes trade perceptual naturalness
      (UTMOS) for intelligibility (WER) relative to codecs that prioritise acoustic fidelity.
    confidence: high
    relevance: high
  - claim_id: fine_tuning_a_zero_shot_tts_model_on_noise_augmented
    role: supports
    claim: Fine-tuning a zero-shot TTS model on noise-augmented prompts preserves intelligibility and substantially
      recovers acoustic quality metrics under low-SNR conditions.
    source: §4.4, Table 4
    evidence: Fine-tuning a zero-shot TTS model on noise-augmented prompts preserves intelligibility and substantially
      recovers acoustic quality metrics under low-SNR conditions.
    confidence: high
    relevance: medium
  limitations:
  - '- UTMOS and speaker similarity lag behind F5-TTS and VoiceCraft; the prior-based approach trades acoustic naturalness
    for intelligibility and speed. - Duration predictor rounding errors (integer quantization of phoneme durations)
    introduce temporal domain artifacts. - FACodec dependency means reproduction requires NaturalSpeech 3''s codec
    infrastructure. - Noise robustness fine-tuning improves non-WER metrics but was validated only on the QUT-NOISE
    database. - Future work: multilingual extension, adaptive noise filtering integration.'
