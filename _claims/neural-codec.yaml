  claims:
  - claim_id: many_transformer_layers_in_autoregressive_llm_tts_backbones_contribute_little
    role: supports
    claim: Many transformer layers in autoregressive LLM-TTS backbones contribute little to synthesis quality and
      can be removed with minimal loss in naturalness and speaker similarity.
    source: §4.1, Table 1
    evidence: Halving CosyVoice 2's depth to 12 layers (39.7% fewer parameters) increases Seed-TTS WER by only 0.68
      and decreases NMOS by 0.13, while speaker similarity and UTMOS remain essentially unchanged.
    confidence: high
    relevance: low
  - claim_id: layer_importance_criteria_developed_for_pruning_text_only_llms_do
    role: refines
    claim: Layer-importance criteria developed for pruning text-only LLMs do not transfer directly to speech generation
      backbones; intelligibility-grounded criteria are needed to identify prunable layers correctly.
    source: §2.1, §4.2, Table 2
    evidence: Cosine-based layer importance (input/output latent similarity) diverges from WER-based importance
      in TTS backbones, and substituting it for the proposed WER-based criterion increases WER from 1.59 to 1.74
      and CER from 0.54 to 0.61 on LibriTTS test-clean.
    confidence: high
    relevance: medium
  - claim_id: knowledge_distillation_can_recover_most_of_the_performance_lost_from
    role: supports
    claim: Knowledge distillation can recover most of the performance lost from aggressive layer pruning in speech-generation
      LLMs using only a small fraction of the original pretraining data.
    source: §3, §4.1, Table 1b
    evidence: Fine-tuning pruned variants required under 5% of the original pretraining data (25% of LibriTTS for
      CosyVoice 2, an upper-bounded 12.5% of LibriHeavy for LLaSA) yet speaker similarity and UTMOS changed by at
      most 0.045 and 0.04 respectively relative to the uncompressed backbones.
    confidence: high
    relevance: medium
  - claim_id: robustness_to_layer_pruning_varies_substantially_across_llm_tts_backbones
    role: complicates
    claim: Robustness to layer pruning varies substantially across LLM-TTS backbones depending on how redundant
      their transformer layers are, so a single pruning ratio does not generalize uniformly.
    source: §4.1
    evidence: LLaSA showed a larger relative quality drop after 50% layer pruning (speaker similarity −0.045, UTMOS
      −0.04) than CosyVoice 2 at the same pruning ratio, attributed to LLaSA's WLI values being more uniformly high
      across layers, indicating less exploitable redundancy.
    confidence: high
    relevance: medium
  limitations:
  - The evaluation covers only two backbones (CosyVoice 2 and LLaSA-1B) and English-only test sets (LibriTTS test-clean,
    Seed-TTS test-en), so it is untested whether the WER-based pruning criterion and dynamic distillation scheme
    generalize to other LLM-TTS architectures, multilingual settings, or streaming inference. The more aggressive
    pruning configurations (9-layer CosyVoice 2) trade a larger, unquantified increase in WER for additional speed
    and memory gains, and the paper does not characterize where this trade-off becomes unacceptable for deployment.
    Computing WLI itself requires running WER evaluation over a data subset for each candidate layer removal, adding
    an upfront cost to the pruning procedure that is not reported in wall-clock terms.
