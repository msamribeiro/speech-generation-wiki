      that, when incorporated into the optimization objective, improves the consistency of generated speech across
      listeners.
    source: §4.2, §6.3, Table 3
    evidence: Uncertainty in human speech quality annotations is not noise to be discarded but an informative signal
      that, when incorporated into the optimization objective, improves the consistency of generated speech across
      listeners.
    confidence: high
    relevance: medium
  - claim_id: rlhf_style_alignment_for_tts_can_be_achieved_with_a
    role: supports
    claim: RLHF-style alignment for TTS can be achieved with a small number of self-generated samples (hundreds)
      without access to ground truth speech, making it practical for post-training fine-tuning at low computational
      cost.
    source: §4.1, §5, Appendix D
    evidence: RLHF-style alignment for TTS can be achieved with a small number of self-generated samples (hundreds)
      without access to ground truth speech, making it practical for post-training fine-tuning at low computational
      cost.
    confidence: high
    relevance: medium
  - claim_id: alignment_objectives_designed_for_naturalness_mos_transfer_to_other_perceptual
    role: supports
    claim: Alignment objectives designed for naturalness MOS transfer to other perceptual dimensions such as emotion
      by substituting the selection criterion, demonstrating that preference-based fine-tuning generalises beyond
      a single quality axis.
    source: §6.4, Table 4
    evidence: Alignment objectives designed for naturalness MOS transfer to other perceptual dimensions such as
      emotion by substituting the selection criterion, demonstrating that preference-based fine-tuning generalises
      beyond a single quality axis.
    confidence: high
    relevance: low
  limitations:
  - 'The comparison with SpeechAlign is acknowledged by the authors to be partially unfair: SpeechAlign-DPO requires
    ground truth speech as positive samples during optimization, which is additional supervision not available to
    UNO. Presenting both as baselines without fully separating this distinction may understate SpeechAlign''s performance
    under matched conditions.'
  - UNO is evaluated exclusively on VoiceCraft, an autoregressive codec language model. Whether the training framework
    transfers to diffusion-based TTS (e.g., NaturalSpeech 3) or flow-matching models is discussed theoretically
    but untested. The paper notes that diffusion-based DPO works have been proposed in parallel for image generation,
    suggesting it is feasible, but speech-specific evidence is absent. Human evaluation uses only 10 listeners for
    120 samples, which is relatively small and may not capture the full distribution of listener preferences across
    accents, domains, or speaking styles. The uncertainty estimators (EDL, I-CNF) are trained on SOMOS, a dataset
    of 200 TTS systems with over 17 annotations per sample, and their behaviour on out-of-distribution speech styles
    is unknown. The practical annotation cost of 400 samples per optimization run is modest but still requires human
    or surrogate labelling infrastructure.
