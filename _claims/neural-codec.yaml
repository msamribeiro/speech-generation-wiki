  claims:
  - claim_id: multi_task_joint_training_on_synthesis_editing_and_continuation_tasks
    role: supports
    claim: Multi-task joint training on synthesis, editing, and continuation tasks improves speech synthesis quality
      over single-task training in non-autoregressive codec models.
    source: §3.2, §3.3, Tables 1, 3
    evidence: In all three tokenizer configurations (ST, STDAC, HuDAC), multi-task SpeechSEC consistently outperforms
      the corresponding single-task baseline on MOS, voice preservation, WER, and CER, with gains confirmed by ablation.
    confidence: high
    relevance: high
  - claim_id: in_multi_task_speech_generation_training_editing_tasks_primarily_contribute
    role: refines
    claim: In multi-task speech generation training, editing tasks primarily contribute intelligibility improvements
      while continuation tasks primarily contribute acoustic quality and voice preservation.
    source: §3.3, Table 3
    evidence: Ablation removing the editing task increases WER by up to 4.4 points with minimal audio quality change;
      removing continuation degrades MOS by up to 0.18 and voice preservation by up to 0.06 with smaller intelligibility
      effects.
    confidence: high
    relevance: medium
  - claim_id: non_autoregressive_masked_token_prediction_frameworks_can_unify_speech_synthesis
    role: supports
    claim: Non-autoregressive masked token prediction frameworks can unify speech synthesis, editing, and continuation
      tasks through task-specific input conditioning within a single model.
    source: §2, §3.2, Table 2
    evidence: SpeechSEC handles all three tasks with a shared Conformer backbone, differentiating tasks via a Task
      Register embedding and per-task masking strategies, achieving competitive quality on editing (MOS 3.93) and
      continuation (MOS 3.63) alongside synthesis.
    confidence: high
    relevance: medium
  - claim_id: the_choice_of_semantic_and_acoustic_token_extractor_significantly_affects
    role: complicates
