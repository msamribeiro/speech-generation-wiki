  - acceleration_evidence
  - control_evidence
  current_role: active_evidence
  method_family:
  - transformer_encoder_decoder_tokenizers
  - hybrid_semantic_acoustic_tokenizers
  claims:
  - claim_id: disentangling_speaker_timbre_and_speaking_style_into_separate_codec_representations
    role: supports
    claim: Disentangling speaker timbre and speaking style into separate codec representations is a necessary condition
      for simultaneous zero-shot speaker cloning and style control; without explicit decoupling, the two conditioning
      signals interfere and controllability collapses.
    source: §4.3, Table 4
    evidence: Disentangling speaker timbre and speaking style into separate codec representations is a necessary
      condition for simultaneous zero-shot speaker cloning and style control; without explicit decoupling, the two
      conditioning signals interfere and controllability collapses.
    confidence: high
    relevance: high
  - claim_id: natural_language_style_descriptions_have_an_inherent_many_to_many
    role: supports
    claim: Natural language style descriptions have an inherent many-to-many relationship with audio that cannot
      be resolved by timbre conditioning alone, requiring a probabilistic model of style variation such as a mixture
      density network.
    source: §3.3
    evidence: Natural language style descriptions have an inherent many-to-many relationship with audio that cannot
      be resolved by timbre conditioning alone, requiring a probabilistic model of style variation such as a mixture
      density network.
    confidence: high
    relevance: medium
  - claim_id: zero_shot_speaker_cloning_capability_in_style_controllable_tts_can
    role: supports
    claim: Zero-shot speaker cloning capability in style-controllable TTS can be achieved by building on a large-scale
      pre-trained disentangled codec without sacrificing audio quality relative to dedicated zero-shot TTS systems.
    source: §4.2, Table 2
    evidence: Zero-shot speaker cloning capability in style-controllable TTS can be achieved by building on a large-scale
      pre-trained disentangled codec without sacrificing audio quality relative to dedicated zero-shot TTS systems.
    confidence: high
    relevance: high
  - claim_id: probabilistic_sampling_from_a_mixture_density_model_of_style_representations
    role: supports
    claim: Probabilistic sampling from a mixture density model of style representations improves both style diversity
      and generalization to out-of-domain style descriptions compared to deterministic style encoding.
    source: §4.2, §4.3, Table 3
    evidence: Probabilistic sampling from a mixture density model of style representations improves both style diversity
      and generalization to out-of-domain style descriptions compared to deterministic style encoding.
    confidence: high
    relevance: medium
  - claim_id: pitch_control_is_measurably_harder_to_preserve_when_timbre_and
    role: supports
    claim: Pitch control is measurably harder to preserve when timbre and style are controlled simultaneously, suggesting
      that pitch conditioning interacts with speaker identity in ways that speed, volume, and emotion do not.
    source: §4.2, Table 1
    evidence: Pitch control is measurably harder to preserve when timbre and style are controlled simultaneously,
      suggesting that pitch conditioning interacts with speaker identity in ways that speed, volume, and emotion
      do not.
    confidence: high
    relevance: low
  limitations:
  - 'The paper explicitly notes two limitations: (1) The training dataset is still limited in scale for style-controllable
    TTS; significantly larger datasets (tens of thousands of hours with style annotations) may be needed to achieve
    more advanced controllability. (2) The exploration of generative model architectures is narrow — only non-autoregressive
    parallel decoding is tried. Diffusion or flow-matching generators operating in the disentangled codec space
    might offer better quality or diversity.'
  - 'Beyond the paper''s self-assessment: pitch accuracy is the only metric where ControlSpeech underperforms style-only
    baselines on both in-domain and out-of-domain test sets. The authors attribute this to simultaneous timbre-style
    control, but the mechanism is unexplained and unresolved. The paper does not evaluate on standard TTS benchmarks
    (LibriSpeech, VCTK), relying entirely on VccmDataset, which makes external comparison difficult. The demo availability
    is not confirmed in the paper. Ethical risks from zero-shot voice cloning are acknowledged but only partially
    addressed (watermarking is proposed as future work).'
  caveats: []
- id: 2025.acl-long.65
  published_date: "2025-07-27"
