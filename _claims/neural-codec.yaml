  - acceleration_evidence
  - control_evidence
  current_role: minor
  method_family:
  - autoregressive_codec_language_models
  - flow_matching_codec_decoders
  claims:
  - claim_id: routing_llm_hidden_states_into_the_tts_module_s_embedding
    role: supports
    claim: Routing LLM hidden states into the TTS module's embedding space can enable voice cloning in an end-to-end
      spoken chatbot without a dedicated speaker encoder.
    source: §1.2
    evidence: JoyTTS projects Qwen-7B hidden states via an MLP into the CosyVoice2-based LLM-TTS embedding, achieving
      SS of 0.73 on seed-tts-zh using prompt audio as the only speaker reference.
    confidence: high
    relevance: medium
  - claim_id: jointly_training_an_llm_chat_module_with_a_tts_module
    role: complicates
    claim: Jointly training an LLM-Chat module with a TTS module in a chatbot pipeline can degrade intelligibility
      relative to running the TTS component standalone, even when speaker similarity improves.
    source: §4, Table 1
    evidence: JoyTTS achieves WER of 5.09 compared to 1.45 for standalone CosyVoice2 on seed-tts-zh, despite closing
      the speaker similarity gap (JoyTTS SS 0.73 vs. CosyVoice2 SS 0.748).
    confidence: high
    relevance: low
  - claim_id: end_to_end_spoken_chatbot_systems_pairing_a_7b_parameter
    role: supports
    claim: End-to-end spoken chatbot systems pairing a 7B-parameter LLM with an autoregressive TTS module can achieve
      sub-2-second response latency on a single consumer GPU without specialised inference optimisations.
    source: §4
    evidence: JoyTTS reports 1.8-second end-to-end latency on a single NVIDIA 4090D with no engineering optimisation
      applied.
    confidence: high
    relevance: low
  limitations:
  - The evaluation is limited to a single Chinese benchmark (seed-tts-zh), leaving performance on English, multilingual,
    or spontaneous conversational speech uncharacterised. The WER gap between JoyTTS (5.09) and standalone CosyVoice2
    (1.45) is large and unexplained; the paper does not ablate whether the regression originates from the joint
    training procedure, the conversational data distribution, or the MLP projection coupling. No subjective listening
    tests are reported, making it impossible to assess naturalness or perceived quality beyond intelligibility and
    speaker similarity metrics. Emotion control, identified as a target for future work, is not implemented in the
    current system.
  caveats: []
- id: '2507.01348'
  published_date: "2025-07-08"
  entry_date: '2026-07-28'
  year: 2025
  venue: arXiv
  task:
  - VC
  - TTS
  architecture:
  - autoregressive-LM
  - VAE
  - GAN
  relevance: medium
  evidence_role:
  - architecture_variant
  current_role: active_evidence
  method_family:
  - autoregressive_codec_language_models
  - vae_vector_quantized_codecs
  - gan_neural_codecs_and_decoders
  claims:
  - claim_id: ctc_regularization_applied_before_vector_quantization_improves_the_temporal_locality
    role: supports
    claim: CTC regularization applied before vector quantization improves the temporal locality and temporal robustness
      of discrete speech content tokens.
    source: §5.2, Table 2
    evidence: SpeechCodeVAE achieves 59% higher De-duplication Efficiency and approximately 9 times better Speed
      Robustness than CosyVoice-50Hz; ablation without CTC loss collapses Speed Robustness from 0.219 to 0.009,
      identifying CTC as the critical factor.
    confidence: high
    relevance: high
  - claim_id: multi_task_learning_with_tts_as_an_auxiliary_objective_compensates
    role: supports
    claim: Multi-task learning with TTS as an auxiliary objective compensates for data scarcity in foreign accent
      conversion, improving both convergence and output quality.
    source: §3, §5.1, Table 1
    evidence: Joint FAC+TTS training on 370 hours of TTS data alongside 9.3 hours of FAC data yields 25% accentedness
      reduction and WER improvement from 14.4% to 9.1% relative to a standalone FAC baseline.
    confidence: high
    relevance: medium
  - claim_id: bert_style_masked_token_restoration_can_correct_stochastic_local_substitution
    role: supports
    claim: BERT-style masked token restoration can correct stochastic local substitution errors introduced by autoregressive
      speech token decoding, improving acoustic continuity.
    source: §5.3, Table 4
    evidence: Removing SpeechRestorer decreases TTS CMOS from 3.850 to 3.629, with the paper attributing the gain
      to error-correction of spurious token substitutions that cause acoustic discontinuities.
    confidence: high
    relevance: medium
  - claim_id: token_level_post_processing_for_llm_speech_generation_can_correct
    role: complicates
    claim: Token-level post-processing for LLM speech generation can correct local substitution errors but fails
      to address higher-level failure modes such as word skipping and repetition.
    source: §6
    evidence: The paper explicitly states that SpeechRestorer cannot fix skipped words or repetitions, as these
      require sequence-level rather than token-level correction.
    confidence: high
    relevance: medium
  - claim_id: training_data_scale_rather_than_architectural_design_is_the_primary
    role: refines
    claim: Training data scale, rather than architectural design, is the primary driver of quality gaps between
      LLM-based TTS systems at different performance levels.
    source: §5.3, Table 4
    evidence: SpeechAccentLLM trails NaturalSpeech2 in TTS naturalness (CMOS 3.850 vs. 3.944) despite comparable
      architecture; the gap is attributed to NS2 training on approximately two orders of magnitude more data.
    confidence: high
    relevance: medium
  limitations:
  - The FAC evaluation is restricted to four L1 backgrounds from L2-ARCTIC and uses a single TTS model (LJSpeech-trained
    VITS) to generate native accent counterparts. Generalisation to other accents, speaking styles, or higher-quality
    native reference speech is untested.
  - Prosody modelling is acknowledged as incomplete; the Variance Adapter models f0 only and does not capture rhythm,
    duration patterns, or prosodic phrasing beyond pitch. Timbre reconstruction quality is bounded by the frozen
    ECAPA-TDNN speaker encoder, which was not trained for the L2/accented-speech domain. SpeechRestorer cannot resolve
    sequence-level decoding failures (word skipping, repetition), leaving a category of LLM-generated errors unaddressed.
    The paper does not report total parameter counts for any module, which complicates direct comparison with other
    systems.
  caveats: []
- id: '2506.23325'
  published_date: "2025-07-09"
  entry_date: '2026-07-28'
  year: 2025
  venue: arXiv
  task:
  - codec
  architecture:
  - GAN
  - hybrid
  relevance: high
  evidence_role:
  - core_evidence
  current_role: active_evidence
  method_family:
  - gan_neural_codecs_and_decoders
  - hybrid_semantic_acoustic_tokenizers
  claims:
  - claim_id: minimizing_shared_parameters_between_semantic_and_acoustic_encoding_pathways_in
    role: supports
    claim: Minimizing shared parameters between semantic and acoustic encoding pathways in a speech codec reduces
      task conflict and enables simultaneous strong text alignment and high acoustic fidelity at low bitrates.
    source: §3.1, §4.4, Table 4
    evidence: XY-Tokenizer's dual-tower architecture (parameters shared only in the RVQ module) achieves WER 0.13
      and SPK-SIM 0.83 at 1 kbps; a matched single-channel model sharing encoder and RVQ across both tasks achieves
      SPK-SIM 0.77 with the same WER, confirming that parameter sharing degrades reconstruction.
    confidence: high
    relevance: high
  - claim_id: llm_based_asr_supervision_during_codec_pre_training_provides_stronger
    role: supports
    claim: LLM-based ASR supervision during codec pre-training provides stronger text alignment than SSL representation
      distillation for low-bitrate codecs.
    source: §4.3, Table 3
    evidence: At approximately 1 kbps, XY-Tokenizer (LLM-based ASR, WER 0.13) substantially outperforms SpeechTokenizer
      variants (distillation-based, WER 0.18-0.34) and Mimi-8 (distillation-based, WER 0.28) on the ASR probing
      task, while maintaining comparable or better reconstruction quality than those baselines.
    confidence: high
    relevance: high
  - claim_id: representation_distillation_from_ssl_models_for_semantic_alignment_introduces_reconstruction
    role: complicates
    claim: Representation distillation from SSL models for semantic alignment introduces reconstruction-quality
      penalties that worsen with distillation strength at low bitrates.
    source: §4.3, Table 3
    evidence: SpeechTokenizer-x3 (5x stronger distillation than the official setting) achieves WER 0.18 but SPK-SIM
      only 0.48 at 1.5 kbps, compared to SpeechTokenizer-x1 (WER 0.34, SPK-SIM 0.65), demonstrating that stronger
      distillation systematically degrades acoustic fidelity.
    confidence: high
    relevance: high
  - claim_id: allowing_the_llm_decoder_to_train_freely_during_multi_task
    role: complicates
    claim: Allowing the LLM decoder to train freely during multi-task codec pre-training improves autoregressive
      text generation but degrades the encoder's transferable text-alignment representations.
    source: §4.4, Table 5
    evidence: A trainable-LLM variant achieves lower LLM decoder WER (0.03 vs. 0.06 at 200K steps) but higher ASR
      probing WER (0.18 vs. 0.13), with the probing WER worsening progressively over 800K training steps, suggesting
      the encoder's text alignment capacity migrates into the flexible decoder.
    confidence: high
    relevance: high
  - claim_id: whisper_s_supervised_asr_pre_training_enables_better_paralinguistic_information
    role: supports
    claim: Whisper's supervised ASR pre-training enables better paralinguistic information preservation in codec
      encoder architectures than self-supervised alternatives.
    source: §2, Table 1
    evidence: Preliminary auto-encoder experiments with frozen encoders show Whisper achieves SPK-SIM 0.68, STOI
      0.88, and PESQ-NB 2.03 on LibriSpeech test-clean, compared to WavLM (SPK-SIM 0.53) and HuBERT (SPK-SIM 0.42),
      motivating Whisper as the codec encoder initialization.
    confidence: high
    relevance: high
  limitations:
  - Evaluation uses only objective metrics (WER, SPK-SIM, STOI, PESQ). No subjective listening tests or MOS scores
    are reported, making it impossible to assess perceptual audio quality relative to competing systems.
  - Achieving further reductions in bitrate below 1 kbps without performance degradation remains an open challenge
    noted by the authors. The scaling behavior of the two-stage training approach with respect to parameter count
    and dataset size is not characterized, leaving open questions about how to optimize training efficiency for
    larger variants. The LLM-based ASR decoder (Qwen2.5-0.5B) adds substantial parameter overhead during pre-training
    that is absent during inference, but the computational cost and training complexity of this stage relative to
    distillation-based approaches is not discussed.
  caveats: []
- id: '2412.18603'
  published_date: "2025-07-10"
  entry_date: '2026-07-28'
  year: 2025
  venue: ICML
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - architecture_variant
  - control_evidence
  - evaluation_caution
  current_role: influential
  method_family:
  - autoregressive_codec_language_models
  claims:
  - claim_id: linear_time_state_space_sequence_models_enable_stable_long_form
    role: supports
    claim: Linear-time state-space sequence models enable stable long-form speech generation that Transformer spoken
      LMs cannot sustain at comparable scale.
    source: §7.1, §7.2, Tables 3-4
    evidence: SpeechSSM-2B maintains N-MOS of 4.12-4.16 across all time strata up to 4+ minutes and stable semantic
      coherence in 16-minute generation, while all Transformer-based baselines and windowed extensions of prior
      spoken LMs degrade rapidly beyond their training lengths.
    confidence: high
    relevance: medium
  - claim_id: separating_speaker_conditioning_into_a_dedicated_acoustic_synthesis_stage_preserves
    role: supports
    claim: Separating speaker conditioning into a dedicated acoustic synthesis stage preserves voice identity more
      effectively in long-form speech generation than encoding speaker information in semantic tokens.
    source: §6.1, §7.1, Tables 2-3
    evidence: SpeechSSM achieves SpkrSim of 0.85 in long-form evaluation (vs. 0.33-0.41 for GSLM and TWIST), attributed
      to SoundStorm's speaker-prompted acoustic stage handling identity independently of the semantic LM.
    confidence: high
    relevance: medium
  - claim_id: standard_evaluation_metrics_for_spoken_language_models_are_unreliable_or
    role: complicates
    claim: Standard evaluation metrics for spoken language models are unreliable or saturating for modern systems,
      particularly in long-form settings.
    source: §6.1, §4
    evidence: sWUGGY scores negatively correlate with generation quality at large token vocabularies (32k vs. hundreds);
      short-form holistic MOS approaches ground truth at 7 seconds while qualitative failures persist; transcript
      perplexity favors repetitive outputs at default temperatures. Reference-based embedding metrics and LLM-as-judge
      side-by-sides prove more discriminative.
    confidence: high
    relevance: medium
  - claim_id: long_form_speech_generation_remains_far_below_human_quality_even
    role: complicates
    claim: Long-form speech generation remains far below human quality even for state-of-the-art spoken language
      models.
    source: §7.1, Table 3
    evidence: No model achieves any wins against LibriSpeech-Long ground truth in 4-minute side-by-side comparisons
      judged by an LLM on fluency, coherence, logicality, and interestingness, demonstrating a large remaining quality
      gap despite strong short-form performance.
    confidence: high
    relevance: medium
  limitations:
  - Model weights are not released and inference requires TPU infrastructure; independent reproducibility of the
    long-form results is not currently possible.
  - 'Comparison fairness across baselines is imperfect: systems differ in training data scale, semantic tokenizer
    choice, token vocabulary size, and whether text was seen during training. The authors partially address this
    with the matched SpeechTransformer-2B baseline, but cannot control all confounds across the full set of comparisons.'
  - The semantic coherence advantage may partly reflect USM-v2's speaker invariance (reducing token entropy from
    vocal variation) rather than the SSM architecture per se. SpeechSSM-X, the extemporaneous variant trained on
    216k hours of monologue speech, is evaluated qualitatively only without quantitative benchmarks. LibriSpeech-Long
    covers read audiobook speech; generalization to spontaneous, multi-speaker, or conversational long-form speech
    is not evaluated.
  caveats: []
- id: '2507.07799'
  published_date: "2025-07-10"
  entry_date: '2026-07-28'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - architecture_variant
  - control_evidence
  - evaluation_caution
  current_role: minor
  method_family:
  - autoregressive_codec_language_models
  claims:
  - claim_id: instruction_conditioned_tts_enables_speaker_anonymization_without_relying_on_source
    role: supports
    claim: Instruction-conditioned TTS enables speaker anonymization without relying on source speaker audio or
      speaker embeddings.
    source: §3.3, §3.4.1, Table 1
    evidence: Parler-TTS with natural language speaker descriptions achieves FAR=0% on SLUE-VoxPopuli, matching
      zero-shot TTS baselines (VALL-E, XTTS-v2) that require reference audio, while offering explicit control over
      gender, pitch, accent, speaking rate, and channel conditions.
    confidence: high
    relevance: medium
  - claim_id: false_acceptance_rate_is_an_unreliable_discriminator_of_speaker_anonymization
    role: complicates
    claim: False acceptance rate is an unreliable discriminator of speaker anonymization quality when evaluation
      design guarantees disjoint training and test speakers.
    source: §3.4.1
    evidence: FAR=0% is achieved by every TTS-based system regardless of architecture or conditioning, because TTS
      models are trained on speakers absent from the evaluation set; the metric cannot distinguish the proposed
      method from any TTS-based pipeline in this setting.
    confidence: high
    relevance: medium
  - claim_id: asr_ner_pipeline_based_content_privacy_is_limited_by_recognition
    role: complicates
    claim: ASR + NER pipeline-based content privacy is limited by recognition and detection errors that allow a
      meaningful share of sensitive content to pass through.
    source: §3.4.1, §4
    evidence: The ASR component achieves 19.00% WER on original speech and DeBERTa-L NER achieves only 71.80% F1
      on predicted transcriptions, meaning many named entities are missed at the detection stage despite 99.95%
      replacement accuracy among detected entities.
    confidence: high
    relevance: medium
  - claim_id: generative_variability_in_prompt_based_tts_limits_consistent_voice_identity
    role: complicates
    claim: Generative variability in prompt-based TTS limits consistent voice identity reproduction across utterances
      sharing the same speaker description.
    source: §4
    evidence: Parler-TTS outputs may sound like different persons across generations even with an identical speaker
      description, undermining multi-utterance anonymization coherence and making deterministic identity control
      difficult.
    confidence: high
    relevance: medium
  - claim_id: speaker_attribute_choice_in_instruction_conditioned_tts_introduces_measurable_variation
    role: supports
    claim: Speaker attribute choice in instruction-conditioned TTS introduces measurable variation in downstream
      speech intelligibility that practitioners must account for.
    source: §3.4.2, Tables 2 and 3
    evidence: WER varies from 12.07% (Slovak accent) to 23.76% (Italian accent) across 38 accent descriptions, and
      from 12.39% (normal rate) to 18.56% (very fast) across speaking rate settings, while speaker privacy (FAR=0%)
      remains constant throughout.
    confidence: high
    relevance: medium
  limitations:
  - FAR=0% is observed for all TTS-based systems including both baselines, because the evaluation speakers are disjoint
    from TTS training speakers. The privacy metric cannot distinguish the proposed approach from any TTS pipeline
    in this experimental design, which materially limits the privacy claims.
  - The NER component (71.80% F1) misses a substantial share of named entities, so content privacy is incomplete
    even when replacement accuracy is near-perfect among detected entities. WER-based content privacy evaluation
    does not capture semantic re-identification risks from context, paraphrase, or implicit references.
  - The pipeline is irreversible by design, making it unsuitable for forensic or audit contexts where original content
    must be recoverable. Prosody cannot be preserved without risking speaker re-identification, since prosodic patterns
    carry speaker-discriminative information. The study covers six speaker attribute dimensions but uses a single
    dataset, limiting generalisability.
  caveats: []
- id: '2507.09070'
  published_date: "2025-07-11"
  entry_date: '2026-07-28'
  year: 2025
  venue: arXiv
  task:
  - VC
  architecture:
  - autoregressive-LM
  - flow-matching
  relevance: medium
  evidence_role:
  - architecture_variant
  - control_evidence
  current_role: active_evidence
  method_family:
  - autoregressive_codec_language_models
  - flow_matching_codec_decoders
  claims:
  - claim_id: audio_codec_and_self_supervised_speech_representations_inherently_encode_speaker
    role: supports
    claim: Audio codec and self-supervised speech representations inherently encode speaker identity, making timbre
      leakage a structural challenge in codec-based voice conversion.
    source: §4.1, Table 1
    evidence: Speaker classification accuracy on LibriHeavy using EnCodec token IDs reaches 96.7%, HuBERT layer
      9 discrete tokens 71.7%, and the authors' BEST-RQ tokenizer 82.05%, all substantially above chance.
    confidence: high
    relevance: high
  - claim_id: aligning_audio_encoder_outputs_to_speaker_independent_text_embeddings_via
    role: supports
    claim: Aligning audio encoder outputs to speaker-independent text embeddings via monotonic alignment search
      produces representations with negligible residual speaker identity.
    source: §4.1, §5, Table 1
    evidence: The SemAlign-trained semantic encoder Q_ϕ achieves 2.84% speaker classification accuracy on LibriHeavy,
      versus 82.05% for the same encoder's raw tokenizer, confirming that the alignment objective removes speaker
      information that CTC loss alone cannot.
    confidence: high
    relevance: medium
  - claim_id: zero_shot_voice_conversion_without_explicit_speaker_verification_embeddings_can
    role: supports
    claim: Zero-shot voice conversion without explicit speaker verification embeddings can achieve higher speaker
      similarity than systems that rely on them.
    source: §4.2, Tables 2-3
    evidence: SemAlignVC achieves the highest SMOS (3.29), WavLM speaker similarity (0.95), ECAPA-TDNN (0.82), and
      Resemblyzer (0.89) among KNNVC, HierSpeech++, and UniAudio on VCTK and LibriHeavy evaluations, despite using
      only a reference mel spectrogram excerpt rather than a speaker embedding.
    confidence: high
    relevance: low
  - claim_id: aggressive_timbre_disentanglement_via_text_embedding_alignment_introduces_intelligibility_trade
    role: complicates
    claim: Aggressive timbre disentanglement via text-embedding alignment introduces intelligibility trade-offs
      when BERT-derived representations replace phoneme-based encodings.
    source: §5, Table 3
    evidence: SemAlignVC achieves 12.31% WER on LibriHeavy, compared to HierSpeech++'s 8.24%, with the authors attributing
      the gap to occasional word substitutions caused by the semantic ambiguity of BERT token representations during
      generation.
    confidence: high
    relevance: medium
  limitations:
  - The audio tokenizer is trained on a proprietary internal dataset and is described as interchangeable, but its
    interaction with SemAlign has not been tested with public codecs. Results may not transfer directly to systems
    using EnCodec, SpeechTokenizer, or other publicly available tokenizers.
  - The evaluation is English-only and uses VCTK and LibriHeavy, which are relatively clean audiobook and read-speech
    corpora. Performance on spontaneous speech, accented speech, or noisy conditions is not assessed. The baseline
    set is modest (three systems), and no ablation isolates the contribution of the flow matching acoustic model
    relative to SemAlign itself. The WER gap relative to HierSpeech++ remains unexplained beyond the synonym-substitution
    hypothesis, which is not directly tested.
  caveats: []
- id: '2507.12197'
  published_date: "2025-07-16"
  entry_date: '2026-07-28'
  year: 2025
  venue: arXiv
  task:
  - TTS
  - singing
  architecture:
  - autoregressive-LM
  - GAN
  relevance: medium
  evidence_role:
  - architecture_variant
  - acceleration_evidence
  - control_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - autoregressive_codec_language_models
  - gan_neural_codecs_and_decoders
  claims:
  - claim_id: scaling_the_number_of_rvq_codebooks_in_a_discrete_speech
    role: supports
    claim: Scaling the number of RVQ codebooks in a discrete speech codec reduces information loss and improves
      reconstruction quality for expressive and challenging vocal content.
    source: §3.2, Table 5
    evidence: QDAC reconstruction improves monotonically from 1 to 16 codebooks across PESQ, STOI, and SI-SDR; 16-codebook
      QDAC at 50Hz achieves PESQ 3.83 versus PESQ 2.98 for 8 codebooks, with similar gains on Mel distance and speaker
      similarity.
    confidence: high
    relevance: high
  - claim_id: higher_multi_codebook_reconstruction_fidelity_in_a_codec_does_not
    role: complicates
    claim: Higher multi-codebook reconstruction fidelity in a codec does not necessarily translate into better speaker
      identity preservation in downstream zero-shot TTS.
    source: §3.2, Table 6
    evidence: QTTS achieves Spk Sim 0.75 on SeedTTS-Easy compared to 0.82 and 0.81 for single-codebook CosyVoice
      v1 and v2, despite QDAC's superior reconstruction metrics in Table 5.
    confidence: high
    relevance: high
  - claim_id: semantic_disentanglement_in_audio_codecs_can_be_achieved_by_backpropagating
    role: supports
    claim: Semantic disentanglement in audio codecs can be achieved by backpropagating ASR loss exclusively through
      the first RVQ codebook, enforcing content isolation without relying on general-purpose self-supervised representations.
    source: §2.1.2, Table 5
    evidence: QDAC trains an AR-ASR module conditioned only on first-codebook tokens; the resulting WER at reconstruction
      (6.42 for 8cb/25Hz) is close to ground truth (6.01), indicating the first codebook encodes phoneme-level content
      while residual codebooks capture acoustic detail.
    confidence: high
    relevance: high
  - claim_id: multi_codebook_autoregressive_tts_admits_a_principled_speed_quality_trade
    role: refines
    claim: Multi-codebook autoregressive TTS admits a principled speed-quality trade-off by choosing between strict
      hierarchical inter-codebook conditioning and a delayed multi-head parallel prediction scheme.
    source: §2.2, §2.3, Tables 1, 3, 4
    evidence: Hierarchy Parallel (200M, dual-AR) and Multihead Delay (120M, parallel with fixed delay) achieve comparable
      TTFT at 512 tokens (26ms vs 24ms) but differ substantially in decode throughput; the Multihead variant reaches
      over 196K codebook tokens/s at short output lengths versus 105K for Hierarchy.
    confidence: high
    relevance: high
  - claim_id: mos_evaluations_in_zero_shot_tts_can_yield_above_reference
    role: complicates
    claim: MOS evaluations in zero-shot TTS can yield above-reference scores for synthesised speech, undermining
      direct absolute comparisons across studies.
    source: §3.2, Table 6
    evidence: Ground truth speech achieves MOS 2.7 while QTTS, CosyVoice, and CosyVoice2 all score between 3.01
      and 3.03 on the same test set, producing a ranking inconsistent with naturalness expectations.
    confidence: high
    relevance: medium
  limitations:
  - Training data is not disclosed, the PGC-hard benchmark is proprietary, and no code or demo is available, making
    results difficult to reproduce or build upon.
  - The evaluation compares only against the CosyVoice v1/v2 family, leaving open how QTTS performs relative to
    flow-matching systems, other multi-codebook approaches, or stronger autoregressive baselines. Speaker similarity
    is lower than both single-codebook baselines (0.75 vs 0.81-0.82), suggesting the multi-codebook generation pipeline
    needs further work to fully leverage the improved codec for speaker transfer. The paper positions singing and
    music synthesis as motivating use cases but does not evaluate on these tasks. Only the 8-codebook QTTS model
    is evaluated for TTS synthesis, leaving open whether 16-codebook generation would further improve or introduce
    new training challenges.
  caveats: []
- id: '2507.16632'
  published_date: "2025-07-22"
