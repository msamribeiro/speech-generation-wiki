  - claim_id: zero_shot_tts_systems_trained_exclusively_on_clean_prompts_degrade
    role: supports
    claim: Zero-shot TTS systems trained exclusively on clean prompts degrade substantially in intelligibility when
      given noisy reference audio, with autoregressive codec models being especially vulnerable.
    source: §4.4, Table 4
    evidence: Zero-shot TTS systems trained exclusively on clean prompts degrade substantially in intelligibility
      when given noisy reference audio, with autoregressive codec models being especially vulnerable.
    confidence: high
