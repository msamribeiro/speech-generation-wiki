    tokenizer ranking to large-scale production settings.
  - The acoustic LM evaluation uses a single architecture (Qwen-2.5 based, 357M) and a single dataset (LibriHeavy),
    so findings on which tokenizers support better SLMs may not generalise to other LM architectures or training
    scales. The ablation study (Section 4) is restricted to a DAC-backbone framework; FSQ and SVQ conclusions may
    not transfer to other encoder-decoder designs. Evaluation metrics for audio generation (FAD, KLD, CLAP) conflate
    vocoder quality with language model quality, making it difficult to attribute performance differences to the
    tokenizer's representational properties versus its decoder quality. The paper does not evaluate streaming tokenizers
    under actual latency constraints, limiting guidance for real-time deployment. Trustworthiness considerations
    (voice deepfakes, bias) are raised as open concerns but not empirically evaluated.
  caveats: []
- id: '2507.02380'
  published_date: "2025-07-03"
  entry_date: '2026-07-28'
  year: 2025
  venue: arXiv
