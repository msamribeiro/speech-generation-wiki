  - claim_id: autoregressive_language_modeling_over_discrete_audio_tokens_can_produce_speech
    role: supports
    claim: Autoregressive language modeling over discrete audio tokens can produce speech continuations indistinguishable
      from real speech to human listeners in an unpaired forced-choice test.
    source: §IV-G
    evidence: Autoregressive language modeling over discrete audio tokens can produce speech continuations indistinguishable
      from real speech to human listeners in an unpaired forced-choice test.
    confidence: high
    relevance: high
  - claim_id: the_semantic_to_acoustic_hierarchical_generation_pattern_transfers_across_audio
    role: supports
    claim: 'The semantic-to-acoustic hierarchical generation pattern transfers across audio domains: a model trained
      on piano music without symbolic notation also benefits from the two-tier tokenization.'
    source: §IV-I
    evidence: 'The semantic-to-acoustic hierarchical generation pattern transfers across audio domains: a model
      trained on piano music without symbolic notation also benefits from the two-tier tokenization.'
    confidence: high
    relevance: medium
  - claim_id: self_supervised_speech_representations_trained_with_masked_language_modeling_objectives
    role: supports
    claim: Self-supervised speech representations trained with masked language modeling objectives encode sufficient
      lexical and syntactic information to outperform earlier causal spoken language models on zero-resource linguistic
      benchmarks.
    source: §IV-E, Table IV
    evidence: Self-supervised speech representations trained with masked language modeling objectives encode sufficient
      lexical and syntactic information to outperform earlier causal spoken language models on zero-resource linguistic
      benchmarks.
    confidence: high
    relevance: medium
  limitations:
  - 'AudioLM is a continuation model only: it generates continuations of an audio prompt but cannot synthesise speech
    from a specified transcript. The paper explicitly frames TTS integration (encoder-decoder with text conditioning)
    as future work, which means the WER/CER results reflect acoustic fidelity to a given semantic token sequence,
    not instruction-following capability.'
  - The system requires three separately trained transformer models totaling approximately 0.9B parameters, plus
    frozen SoundStream and w2v-BERT models, making inference substantially more expensive than single-model TTS
    systems. Inference latency is not reported.
  - All speech experiments use English only; the model is trained on Libri-Light (audiobook speech), which is a
    clean, single-language, read-speech corpus. Generalisability to spontaneous speech, noise, or other languages
    is untested.
  - The paper does not evaluate unconditional generation quality against baselines with matched compute or training
    data, so the contribution of scale versus architecture is not fully disentangled.
  - The anti-spoofing classifier achieving 98.6% accuracy is trained on the same generative model it detects; its
    performance against other generators, or against an adversarially optimised version of AudioLM, is not assessed.
  caveats: []
