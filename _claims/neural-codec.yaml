- id: interspeech-2025-0506
  published_date: "2025-08-17"
  entry_date: '2026-07-28'
  year: 2025
  venue: Interspeech
  task:
  - codec
  architecture:
  - transformer-enc-dec
  relevance: medium
  evidence_role:
  - architecture_variant
  current_role: active_evidence
  method_family:
  - transformer_encoder_decoder_tokenizers
  claims:
  - claim_id: neural_codec_token_spaces_capture_semantically_useful_information_beyond_audio
    role: supports
    claim: Neural codec token spaces capture semantically useful information beyond audio reconstruction, enabling
      effective use as pretraining targets for general audio representation models.
    source: §4, Table 1
    evidence: EnCodecMAE, which predicts frozen EnCodec RVQ tokens, outperforms BEATs (which uses random quantizer
      targets) and AudioMAE on global HEAREval score, with large+ST models reaching 99.2 on Audioset-only pretraining
      versus 96.0 for BEATs Iter 3.
    confidence: high
    relevance: high
  - claim_id: frame_level_temporal_representations_outperform_patch_based_representations_for_speech
    role: supports
    claim: Frame-level temporal representations outperform patch-based representations for speech tasks in universal
      audio models, while both approaches perform comparably on environmental sound classification.
    source: §4, Table 1
    evidence: EnCodecMAE (frame-level) achieves 96.3% speech command accuracy and 75.5% emotion recognition versus
      patch-based BEATs Iter 1's 91.0% and 68.7%, while matching or being slightly behind on ESC-50 (79.8 vs. 82.3).
    confidence: high
    relevance: medium
  - claim_id: self_supervised_universal_audio_representations_do_not_close_the_gap
    role: complicates
    claim: Self-supervised universal audio representations do not close the gap with dedicated speech SSL models
      on phoneme-level tasks such as ASR.
    source: §4, Table 2
    evidence: EnCodecMAE Large+ST achieves 8.59% WER on LibriSpeech with a language model, versus 2.94% for HuBERT
      Large trained solely on speech data. The paper attributes this to differences in target definition (MFCC clusters
      correlating with phonemes) and input representation (raw waveform).
    confidence: high
    relevance: medium
  - claim_id: the_optimal_input_representation_for_self_supervised_audio_models_is
    role: refines
    claim: The optimal input representation for self-supervised audio models is task-dependent rather than universally
      preferable across audio domains.
    source: §4, Table 1
    evidence: Melspectrograms yield higher global HEAREval scores than EnCodec encoder outputs (95.9 vs. 83.4 base
      model), but EnCodec input outperforms melspectrograms on pitch prediction (NSynth), where codec features capture
      finer harmonic structure.
    confidence: high
    relevance: high
  - claim_id: pretraining_data_diversity_is_essential_for_universal_audio_representation_models
    role: supports
    claim: Pretraining data diversity is essential for universal audio representation; models pretrained on a single
      domain generalise poorly outside that domain.
    source: §4, Table 1
    evidence: Speech-only pretraining (LL6K only) gives a global score of 75.3, music-only (FMA only) gives 89.1,
      while the full mixture (AS+FMA+LL6K) reaches 97.1 global, with gains concentrated in the non-primary domain
      for each restricted setting.
    confidence: high
    relevance: high
  limitations:
  - The ASR evaluation uses the SUPERB protocol (frozen encoder, BiLSTM probe, 100h fine-tune), which is designed
    to measure representation quality, not end-to-end ASR. The resulting WERs cannot be directly compared against
    fine-tuned ASR systems trained end-to-end and should be treated as a proxy for phoneme-level representation
    quality only.
  - Evaluation on HEAREval uses instance-level embeddings derived by averaging frame-level features, which discards
    temporal structure useful for tasks requiring sequence-level reasoning. The self-training stage cluster targets
    (k-means over 10k samples with k=1024) may be too coarse for high-resolution phonetic discrimination, which
    the authors identify as a direction for future work alongside exploring alternative training targets to improve
    ASR without sacrificing music and environmental performance. All models are evaluated with a frozen upstream
    encoder; fine-tuning experiments are not reported, leaving open whether the representations would improve further
    under task-specific adaptation.
  caveats: []
