  - autoregressive-LM
  relevance: medium
  evidence_role:
  - architecture_variant
  - control_evidence
  current_role: active_evidence
  method_family:
  - autoregressive_codec_language_models
  claims:
  - claim_id: a_single_transformer_flattened_architecture_can_match_or_surpass_hierarchical
    role: supports
    claim: A single-Transformer flattened architecture can match or surpass hierarchical speech LM designs on acoustic
      consistency tasks when both use identical data and comparable parameter budgets.
    source: §4.3, Table 1
    evidence: Llama-Mimi-1.3B outperforms CSM-1.3B on all SALMon acoustic consistency dimensions and speaker similarity
      (0.346 vs. 0.320) under controlled training conditions.
    confidence: high
    relevance: medium
  - claim_id: flattening_rvq_tokens_into_a_single_autoregressive_sequence_creates_an
    role: complicates
    claim: 'Flattening RVQ tokens into a single autoregressive sequence creates an inherent acoustic-linguistic
      trade-off: strong acoustic performance comes at the cost of weaker linguistic benchmarks relative to SSL-based
      phonetic-token approaches.'
    source: §4.3, Table 1
    evidence: Llama-Mimi-1.3B achieves best acoustic consistency but underperforms TWIST-1.3B on sWUGGY (68.7 vs.
      71.7) and T-Story Cloze (64.0 vs. 69.9), attributed to the Q-fold sequence length increase from RVQ token
      flattening.
    confidence: high
    relevance: high
  - claim_id: increasing_the_number_of_rvq_quantizers_in_a_flattened_speech
    role: complicates
    claim: Increasing the number of RVQ quantizers in a flattened speech LM improves audio quality but degrades
      spoken content coherence, because longer token sequences shift modeling capacity toward acoustic reconstruction.
    source: §4.4, Table 5
    evidence: Ablation with Q∈{2,4,8} shows Q=8 achieves best Audiobox-Aesthetics scores and speaker similarity
      (0.474) but worst content quality (2.54), while Q=2 yields content quality (3.53) comparable to TWIST-1.3B.
    confidence: high
    relevance: high
  - claim_id: applying_a_higher_loss_weight_to_semantic_tokens_in_speech
    role: refines
    claim: Applying a higher loss weight to semantic tokens in speech LM training shifts the acoustic-linguistic
      balance toward linguistic accuracy, but causes measurable degradation in acoustic consistency and speaker
      similarity.
    source: §4.4, Table 3
    evidence: Llama-Mimi-1.3B with semantic weight λ=100 gains on sBLIMP (55.4 vs. 54.3) and T-Story Cloze (68.4
      vs. 64.0), but loses substantially on room consistency (74 vs. 92) and speaker similarity (0.196 vs. 0.346).
    confidence: high
    relevance: low
  - claim_id: scaling_model_size_in_flattened_speech_lms_consistently_improves_performance
    role: supports
    claim: Scaling model size in flattened speech LMs consistently improves performance across both acoustic and
      linguistic tasks, with the largest gains in spoken content quality.
    source: §4.4, Table 4
    evidence: Llama-Mimi-8B improves content quality (4.03 vs. 3.01) and T-Story Cloze (67.6 vs. 64.0) over the
      1.3B model, with qualitative analysis showing more semantically coherent long-form continuations.
    confidence: high
    relevance: medium
  limitations:
  - Evaluations are conducted exclusively on English speech using LibriSpeech prompts; generalisation to other languages,
    speakers, or acoustic conditions is untested. No human listening tests are reported; all acoustic and linguistic
    evaluations rely on automated metrics.
  - The paper evaluates only speech continuation, not text-conditioned generation or dialogue. Whether the acoustic-linguistic
    trade-off in flattened designs persists when text tokens are added to the sequence (as in Moshi's inner monologue
    approach) is left as an open question. The 8B model is evaluated only on a subset of tasks, and the cost of
    the Q-fold sequence length increase at large scale is not fully characterised. Training Mimi weights end-to-end
    jointly with the LM is not explored; the frozen codec is an architectural constraint, not a systematic choice.
  caveats: []
- id: '2509.15462'
  published_date: "2025-09-18"
  entry_date: '2026-07-28'
  year: 2025
  venue: arXiv
