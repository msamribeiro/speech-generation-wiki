  claims:
  - claim_id: deterministic_nearest_neighbor_codeword_selection_in_residual_vector_quantization_is
    role: supports
    claim: Deterministic nearest-neighbor codeword selection in residual vector quantization is fragile to small
      input perturbations, producing codeword reassignments that compound across RVQ stages into audible reconstruction
      artefacts.
    source: §2.1, Figure 1
    evidence: Codeword-shift analysis on Encodec's first RVQ stage (24 kHz, 6 kbps) shows that although the noisy
      codeword usually matches the clean top-1 choice, a pronounced long tail of shifts (k>1) occurs when 15 dB
      SNR DEMAND noise is added to 120 clean VCTK utterances.
    confidence: high
    relevance: high
  - claim_id: neural_speech_codec_noise_robustness_can_be_improved_without_any
    role: supports
    claim: Neural speech codec noise robustness can be improved without any paired noisy-clean training data by
      simulating perturbation-induced instability directly at the quantization step.
    source: §3.4, Table 1
    evidence: Fine-tuning Encodec and WavTokenizer with distance-weighted probabilistic top-K sampling, trained
      exclusively on clean speech, improves SI-SDR, PESQ, STOI, and UTMOS at both 15 dB and 10 dB SNR with statistically
      significant paired t-tests (e.g., Encodec UTMOS 3.475 to 3.586 at 15 dB).
    confidence: high
    relevance: high
  - claim_id: training_on_paired_noisy_clean_data_achieves_stronger_robustness_than
    role: complicates
    claim: Training on paired noisy-clean data achieves stronger robustness than perturbation-only training under
      the specific noise conditions it was exposed to, but this advantage does not transfer to unseen noise types
      and comes at the cost of clean-speech quality.
    source: §3.5.1, Tables 2-3
    evidence: A noise-exposed fine-tuning baseline (Closest*) outperforms the proposed clean-data-only method on
      some noisy-speech metrics (e.g., PESQ) under matched training/test noise, yet degrades clean-speech scores
      and is outperformed by the proposed method on all four metrics across three held-out noise types not present
      in either method's training.
    confidence: high
    relevance: medium
  - claim_id: introducing_training_time_quantization_perturbations_in_a_curriculum_like_schedule
    role: refines
    claim: Introducing training-time quantization perturbations in a curriculum-like schedule, from the finest residual
      quantizer stage toward the coarsest, stabilizes robustness training more effectively than perturbing all quantizer
      stages simultaneously.
    source: §3.5.3, Figure 2
    evidence: PESQ and UTMOS improve steadily as probabilistic top-K sampling is progressively rolled out from the
      6th to the 1st VQ of Encodec's RVQ, whereas applying the same sampling to all six VQs at once ("Direct Top-K")
      yields inferior results due to premature perturbation of core structural features.
    confidence: high
    relevance: medium
  limitations:
  - The evaluation is confined to a VCTK subset (a single-domain, studio-quality English read-speech corpus) and
    to relatively mild noise conditions (10-15 dB SNR from DEMAND). Whether the robustness gains extend to more
    severe noise, non-additive distortions (e.g., reverberation, codec cascading, packet loss), or multilingual/spontaneous
    speech is untested. The method is validated on only two codecs (Encodec, WavTokenizer); both use RVQ-style quantization,
    so its applicability to non-RVQ or single-codebook designs with different codebook geometries is unconfirmed.
    The paper itself notes extending the framework to more streamable architectures and integrating it with large
    speech-language models as future directions, but does not attempt either.
  caveats: []
- id: '2509.19186'
  published_date: "2025-09-23"
  entry_date: '2026-07-28'
  year: 2025
  venue: arXiv
  task:
  - codec
  architecture:
  - GAN
  relevance: high
  evidence_role:
  - core_evidence
  - acceleration_evidence
  current_role: active_evidence
  method_family:
  - gan_neural_codecs_and_decoders
  claims:
  - claim_id: greedy_per_layer_code_selection_in_residual_vector_quantization_leaves
    role: supports
    claim: Greedy per-layer code selection in residual vector quantization leaves quantization error on the table
      that can be recovered purely at test time, without retraining the codec.
    source: §5.2, Table 3
    evidence: Beam-search encoding (B=16) lowers average L2 quantization error on LibriTTS from 5.096 to 4.625 for
      EnCodec and from 22.29 to 21.81 for HiFi-Codec relative to greedy (B=1) encoding of the same pre-trained checkpoints.
    confidence: high
    relevance: high
  - claim_id: reductions_in_rvq_quantization_error_obtained_by_a_better_search
    role: supports
    claim: Reductions in RVQ quantization error obtained by a better search strategy translate into measurable gains
      on standard reconstruction-quality metrics, not just the raw error term.
    source: §5.3, Table 1
    evidence: Increasing beam size from 1 to 16 improves PESQ, STOI, NISQA, and SI-SNR simultaneously for both EnCodec
      and HiFi-Codec on LibriTTS test-clean.
    confidence: high
    relevance: high
  - claim_id: adding_more_rvq_codebooks_higher_bit_rate_does_not_by
    role: refines
    claim: Adding more RVQ codebooks (higher bit-rate) does not by itself eliminate the suboptimality of greedy
      encoding; the search-strategy gap persists even at high codebook counts.
    source: §5.5, Table 4
    evidence: At 24 kbps with 32 codebooks, EnCodec's greedy encoding still trails beam-search encoding (PESQ 3.670
      vs. 3.691, NISQA 3.992 vs. 4.001), a gap of comparable relative size to the one seen at 6 kbps with 8 codebooks.
    confidence: high
    relevance: high
  - claim_id: a_naive_implementation_of_wider_search_codec_encoding_introduces_a
    role: complicates
    claim: A naive implementation of wider-search codec encoding introduces a latency cost that scales with search
      width, and only a parallel hardware-aware implementation avoids this trade-off.
    source: §5.6, Table 5
    evidence: Sequential CPU beam-search encoding increases inference time by 285% from B=1 to B=16 (43.53 ms to
      167.6 ms per 5-second clip), while a GPU-parallelized implementation of the same algorithm increases by only
      about 9% (6.780 ms to 7.366 ms) over the same range.
    confidence: high
    relevance: high
  limitations:
  - The evaluation is confined to two pre-trained codec checkpoints (EnCodec, HiFi-Codec); the paper does not test
    the algorithm on more recent RVQ-GAN codec designs (e.g. DAC-style codecs) or on codecs with substantially larger
    codebook sizes, where the exponential O(S^L) exhaustive-search cost the method is designed to avoid is even
    more pronounced. Beam size B and the per-step candidate width k are always set equal in the experiments, so
    their individual contributions to the error reduction are not disentangled. All reported gains are measured
    on intrinsic reconstruction-quality metrics (PESQ, STOI, NISQA, SI-SNR, mel distance); the paper does not evaluate
    whether the improved codec reconstructions change downstream outcomes for systems that consume the codes, such
    as word error rate in a codec-token TTS or speech language model pipeline. The non-verbal vocalization test
    set is an internal, non-public dataset, limiting reproducibility of that portion of the evaluation.
  caveats: []
