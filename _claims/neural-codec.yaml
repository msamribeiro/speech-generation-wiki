- id: '2509.19883'
  published_date: "2025-09-24"
  entry_date: '2026-07-28'
  year: 2025
  venue: arXiv
  task:
  - singing
  architecture:
  - hybrid
  relevance: high
  evidence_role:
  - core_evidence
  - control_evidence
  current_role: active_evidence
  method_family:
  - hybrid_semantic_acoustic_tokenizers
  claims:
  - claim_id: prompt_based_conditioning_in_masked_generative_or_codec_language_speech
    role: supports
    claim: Prompt-based conditioning in masked generative or codec-language speech synthesis models causes measurable
      leakage of prosodic attributes from the acoustic prompt into the synthesized output, independent of the target
      language.
    source: §V.A, Table I
    evidence: Paired-prompt outputs show consistently lower pitch/energy/jitter differences than unpaired-prompt
      outputs from the same speaker on both LibriTTS (English) and AISHELL-3 (Mandarin) when synthesizing with MaskGCT.
    confidence: high
    relevance: high
  - claim_id: explicit_contrastive_regularization_between_the_acoustic_prompt_and_an_external
    role: supports
    claim: Explicit contrastive regularization between the acoustic prompt and an external control signal (e.g.,
      melody/pitch) reduces attribute leakage and improves controllability in prompt-based zero-shot synthesis.
    source: §V.D, Table V
    evidence: Removing the coarse-to-fine (sequence + frame level) contrastive loss increases F0-RMSE from 0.042
      to 0.08 and lowers SingMOS from 4.32 to 4.12 on the seen-singer test set, with sequence-level and frame-level
      components independently ablated to show complementary effects on speaker-identity and pitch-detail metrics
      respectively.
    confidence: high
    relevance: medium
  - claim_id: integrating_auxiliary_transcription_derived_frame_level_supervision_directly_into_a
    role: supports
    claim: Integrating auxiliary transcription-derived frame-level supervision directly into a synthesis model's
      training loop, rather than using it only as an offline data-cleaning step, improves fine-grained attribute
      alignment.
    source: §V.D, Table V
    evidence: Removing the in-loop SVT auxiliary loss produces the largest single-component degradation in the ablation,
      raising F0-RMSE from 0.042 to 0.194 and lowering SingMOS from 4.32 to 3.95.
    confidence: high
    relevance: medium
  - claim_id: parameter_efficient_fine_tuning_can_match_or_exceed_full_fine
    role: refines
    claim: Parameter-efficient fine-tuning can match or exceed full fine-tuning when adapting a large pretrained
      codec-based speech model to a lower-resource downstream domain, provided the low-rank capacity is placed appropriately.
    source: §V.D, Table VII
    evidence: LoRA fine-tuning of the S2A diffusion estimator (6.51% trainable parameters) achieves lower F0-RMSE
      (0.053) and higher SECS (0.92) than fully fine-tuning the same backbone (100% trainable, F0-RMSE 0.099, SECS
      0.859) when adapting MaskGCT to singing voice synthesis.
    confidence: high
    relevance: high
  limitations:
  - The zero-shot evaluation set (OpenSinger) has no native music-score annotations, so the authors pair OpenSinger
    audio with M4Singer's pitch/duration sequences to construct test inputs. This means the "unseen singer" evaluation
    is not evaluating on musically native score-audio pairs, which could understate or overstate melody-control
    difficulty relative to a genuinely paired unseen-singer benchmark.
  - Beyond that, evaluation is confined to Mandarin singing corpora (M4Singer, Opencpop, OpenSinger); no cross-lingual
    or multilingual SVS results are reported, despite the underlying MaskGCT backbone being multilingual-capable.
    Overall S2A/T2S model size is not reported (only the small SVT module's dimensions are given), limiting reproducibility
    of compute requirements. The subjective evaluation panel is modest (20 musically trained participants), typical
    for SVS papers but smaller than typical large-scale TTS MOS studies. Finally, the sequence-level contrastive
    objective depends on having multiple same-singer utterances available per training batch, which the curated
    corpora used here provide but which may not hold for less structured or lower-resource singing data.
  caveats: []
- id: '2509.20485'
  published_date: "2025-09-24"
  entry_date: '2026-07-28'
  year: 2025
  venue: arXiv
