    role: supports
    claim: Initialising VQ codebook entries from semantic priors derived from self-supervised models improves downstream
      recognition accuracy without additional distillation overhead.
    source: §3.2, Table 6
    evidence: Initialising VQ codebook entries from semantic priors derived from self-supervised models improves
      downstream recognition accuracy without additional distillation overhead.
    confidence: high
    relevance: high
  - claim_id: lower_token_sequence_length_lower_hz_frame_rate_improves_both
    role: supports
    claim: Lower token-sequence length (lower Hz frame rate) improves both training and inference efficiency for
      audio language models, independent of bitrate.
    source: Appendix B, Table 8
    evidence: Lower token-sequence length (lower Hz frame rate) improves both training and inference efficiency
      for audio language models, independent of bitrate.
    confidence: high
    relevance: high
  - claim_id: reconstruction_quality_alone_is_an_insufficient_predictor_of_a_codec
    role: supports
    claim: 'Reconstruction quality alone is an insufficient predictor of a codec''s suitability for autoregressive
      language modelling: codecs with stronger semantic content produce more robust LM-based TTS even at higher
      bitrates.'
    source: §4.6, Table 4
    evidence: 'Reconstruction quality alone is an insufficient predictor of a codec''s suitability for autoregressive
      language modelling: codecs with stronger semantic content produce more robust LM-based TTS even at higher
      bitrates.'
    confidence: high
    relevance: high
  - claim_id: a_masked_autoencoder_auxiliary_loss_during_codec_training_increases_semantic
    role: supports
    claim: A masked autoencoder auxiliary loss during codec training increases semantic information in learned representations
      at a modest reconstruction cost.
    source: §3.3, Table 6
    evidence: A masked autoencoder auxiliary loss during codec training increases semantic information in learned
      representations at a modest reconstruction cost.
    confidence: high
    relevance: high
  limitations:
  - All downstream LM experiments use the same 1B-parameter LLaMA backbone with limited training data (2000 hours
    speech, ~500 hours each sound/music). Gains observed may not transfer to larger-scale audio LM systems, where
    baseline tokenizers may reach ceiling performance.
  - The two-stage training adds complexity and discards large sub-networks (MAE encoder/decoder, AR prediction transformer)
    after training, increasing resource cost without reuse. The authors note this explicitly and flag it as future
    work. Sound and music reconstruction remains challenging at 0.41 kbps, with VISQOL scores substantially lower
    than speech. Semantic retention still lags SSL models for ASR (18.3% WER vs. 6.2% for WavLM), indicating the
    codec does not fully substitute for purpose-built SSL representations. Code and model weights were not released
    at submission time, limiting reproducibility.
