      in codec-based TTS, even when model architecture and training are held constant.
    source: §3.2, Table 1
    evidence: With the same SpeechSEC architecture and training scheme, MOS ranges from 3.65 (STDAC) to 4.20 (ST)
      across the three tokenizer configurations, and voice preservation from 0.61 to 0.72, indicating that tokenizer
      quality is a dominant factor.
    confidence: high
    relevance: high
  limitations:
  - The evaluation is restricted to LibriTTS-R, a clean studio-quality English corpus, leaving generalization to
    noisy, spontaneous, or multilingual speech untested. Cross-system comparisons with SoundStorm use independently
    reported numbers from separate evaluations, weakening the claim of surpassing prior state of the art. Model
    parameter count is not reported, preventing meaningful comparisons of capacity-normalised performance. Speech
