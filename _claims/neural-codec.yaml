  - flow_matching_codec_decoders
  - hybrid_semantic_acoustic_tokenizers
  claims:
  - claim_id: interleaving_discrete_audio_tokens_with_text_tokens_in_a_shared
    role: supports
    claim: Interleaving discrete audio tokens with text tokens in a shared language model vocabulary enables end-to-end
      spoken dialogue systems that respond coherently to paralinguistic cues without requiring separate speech synthesis
      pipelines.
    source: §3.1, §4.6
    evidence: Interleaving discrete audio tokens with text tokens in a shared language model vocabulary enables
      end-to-end spoken dialogue systems that respond coherently to paralinguistic cues without requiring separate
      speech synthesis pipelines.
    confidence: high
    relevance: high
  - claim_id: reinforcement_learning_applied_to_audio_language_models_can_improve_reasoning
    role: supports
    claim: Reinforcement learning applied to audio language models can improve reasoning efficiency in complex acoustic
      scenarios while preserving generation quality.
    source: §3.4
    evidence: Reinforcement learning applied to audio language models can improve reasoning efficiency in complex
      acoustic scenarios while preserving generation quality.
    confidence: high
    relevance: medium
  - claim_id: retrieval_augmented_generation_and_external_tool_calling_can_substantially_reduce
    role: supports
    claim: Retrieval-augmented generation and external tool calling can substantially reduce hallucination and expand
      capability (timbre switching, web-grounded responses) in large audio language models without architectural
      redesign.
    source: §3.1, §4.5
    evidence: Retrieval-augmented generation and external tool calling can substantially reduce hallucination and
      expand capability (timbre switching, web-grounded responses) in large audio language models without architectural
      redesign.
    confidence: high
    relevance: medium
  - claim_id: comprehensive_multi_task_pre_training_across_asr_tts_translation_and
    role: supports
    claim: Comprehensive multi-task pre-training across ASR, TTS, translation, and conversation significantly improves
      spoken dialogue performance in low-resource languages and accented speech.
    source: §3.2, §4.1
    evidence: Comprehensive multi-task pre-training across ASR, TTS, translation, and conversation significantly
      improves spoken dialogue performance in low-resource languages and accented speech.
    confidence: high
    relevance: low
  - claim_id: existing_audio_language_model_benchmarks_fail_to_capture_fine_grained
    role: complicates
    claim: Existing audio language model benchmarks fail to capture fine-grained paralinguistic comprehension and
      voice-triggered tool invocation, leaving important capability dimensions systematically unmeasured.
    source: §4.2, §4.5
    evidence: Existing audio language model benchmarks fail to capture fine-grained paralinguistic comprehension
      and voice-triggered tool invocation, leaving important capability dimensions systematically unmeasured.
    confidence: high
    relevance: medium
  limitations:
  - Two of the main evaluation benchmarks (StepEval-Audio-Paralinguistic, StepEval-Audio-Toolcall) are introduced
    by the authors themselves and have not been validated independently. Results on these benchmarks may overstate
    absolute capability levels even if relative comparisons are informative.
  - Model size is not reported, which makes parameter-count comparisons with other open-source systems (Kimi-Audio,
    Qwen2.5-Omni) difficult to interpret fairly. The open-source mini variant uses Qwen2.5-7B as its backbone, but
    the full model's parameter count remains undisclosed.
  - The audio search tool relies on a proprietary library of hundreds of thousands of speech samples, limiting reproducibility
    of this capability. Latency characteristics are not reported; real-time performance is claimed via VAD and deployment
    infrastructure inherited from Step-Audio but not benchmarked here.
  - Evaluation is primarily Chinese-English bilingual. Performance on other language families, especially those
    with minimal pre-training coverage, is largely uncharacterized. The tool-calling evaluation uses synthesized
    speech conversations generated from text scripts rather than natural speech, which may not reflect real-world
    tool invocation patterns.
  caveats: []
- id: '2507.21138'
  published_date: "2025-07-22"
  entry_date: '2026-07-28'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  relevance: high
  evidence_role:
  - core_evidence
  - control_evidence
  current_role: active_evidence
  method_family:
  - autoregressive_codec_language_models
  claims:
  - claim_id: rl_alignment_with_composite_perceptual_rewards_improves_multiple_speech_quality
    role: supports
    claim: RL alignment with composite perceptual rewards improves multiple speech quality dimensions simultaneously
      over SFT-only baselines in autoregressive codec TTS.
    source: §3.5, Table 8
    evidence: GRPO with combined WER + speaker similarity + DNSMOS rewards achieves gains in all three metrics over
      the SFT baseline, while single-reward models improve only their target dimension; TTS-1 WER drops from 7.9%
      (SFT) to 6.3% (RL-aligned).
    confidence: high
    relevance: high
  - claim_id: audio_pre_training_on_large_scale_raw_speech_substantially_improves
    role: supports
    claim: Audio pre-training on large-scale raw speech substantially improves subsequent SFT quality in LLM-based
      TTS beyond what instruction-tuned LLM initialisation provides.
    source: §3.4, Figure 5
    evidence: Initialising SFT from an audio pre-trained LLaMA-3.2-1B checkpoint yields lower SFT loss, approximately
      15% lower WER, and approximately 3% higher speaker similarity than initialising from the base LLaMA-3.2-1B-Instruct
      checkpoint.
    confidence: high
    relevance: medium
  - claim_id: scaling_speechlm_parameter_count_in_autoregressive_codec_tts_consistently_improves
    role: supports
    claim: Scaling SpeechLM parameter count in autoregressive codec TTS consistently improves intelligibility and
      speaker fidelity across languages.
    source: §4, Figure 8, Table 8
    evidence: TTS-1-Max (8.8B) achieves 5.1% overall WER and higher SIM across all 11 evaluated languages compared
      to TTS-1 (1.6B) at 6.3% WER, with performance correlating with pre-training loss differences.
    confidence: high
    relevance: high
  - claim_id: style_conditioning_via_discrete_text_tags_conflicts_with_speaker_identity
    role: complicates
    claim: Style conditioning via discrete text tags conflicts with speaker identity preservation in single-codebook
      codec TTS architectures.
    source: §3.6
    evidence: Direct prepending of style markup tags during SFT produced no effect on synthesized speech because
      the single-codebook design entangles acoustic and semantic information; successful style control required
      constructing paired neutral/stylized utterances from the same speaker and applying LoRA fine-tuning.
    confidence: high
    relevance: high
  - claim_id: streaming_audio_delivery_in_autoregressive_tts_introduces_audible_artifacts_and
    role: complicates
    claim: Streaming audio delivery in autoregressive TTS introduces audible artifacts and volume inconsistencies
      at segment boundaries that require specific engineering mitigations independent of the generative model's
      quality.
    source: §5.1
    evidence: Without concatenation restricted to non-voicing regions and context-aware decoder decoding with extended
      audio prompt context, segment boundaries introduce clicks and volume drops; these are engineering-layer problems
      independent of SpeechLM quality.
    confidence: high
    relevance: low
  limitations:
  - Model weights are not publicly released, making independent benchmarking and replication impossible. All evaluations
    use proprietary or internal test sets; the internal TTS arena covers only English and uses approximately 20
    annotators with a modest vote count per pair.
  - The training data is drawn from a proprietary mixture of public and licensed sources whose exact composition
    is not disclosed, limiting reproducibility. The evaluation framework does not include standard public TTS benchmarks
    (e.g., LibriTTS or VCTK test sets), making direct numerical comparison with published systems that do report
    on these benchmarks difficult.
  - The paper notes that speaker similarity metrics fluctuate with emotionally expressive speech, suggesting that
    current automated evaluation protocols may not fully capture perceptual quality in dynamic scenarios. The audio
    markup system, while effective for English, shows "reduced fidelity" when generalizing style control to non-English
    languages. Prompt audio caching can cause prosodic bleed from the reference audio into generated speech, and
    longer sequences generated from short prompts may degrade in quality.
  caveats: []
- id: '2505.15670'
  published_date: "2025-07-25"
  entry_date: '2026-07-28'
  year: 2025
  venue: arXiv
  task:
  - SCA
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - architecture_variant
  - acceleration_evidence
  - control_evidence
  current_role: active_evidence
  method_family:
  - autoregressive_codec_language_models
  claims:
  - claim_id: full_duplex_spoken_dialogue_systems_can_be_built_without_speech
    role: supports
    claim: Full-duplex spoken dialogue systems can be built without speech-text pretraining by routing user audio
      through a pretrained streaming encoder rather than requiring the LLM to learn audio representations end-to-end.
    source: §3, §6.1, §6.2, Tables 2–3
    evidence: SALM-Duplex skips speech pretraining entirely and instead uses a 100M streaming CTC encoder for user
      input; it still outperforms Moshi on barge-in success rate (94.5% vs. 55.1%) and reasoning GPT scores across
      all five evaluation sets.
    confidence: high
    relevance: low
  - claim_id: asymmetric_duplex_architectures_that_separate_user_and_agent_speech_pathways
    role: supports
    claim: Asymmetric duplex architectures that separate user and agent speech pathways enable independent specialization,
      including speaker-specific codec fine-tuning without affecting user comprehension.
    source: §3.2, §6.3, Table 4
    evidence: Personalized 0.6 kbps NanoCodec (fine-tuned on 21k target-speaker utterances) outperforms Moshi's
      Mimi at 1.1 kbps and untuned NanoCodec at 1.2 kbps on MOS, CER, and SECS, while operating at roughly half
      the bitrate.
    confidence: high
    relevance: high
  - claim_id: end_to_end_speech_to_speech_models_do_not_consistently
    role: complicates
    claim: End-to-end speech-to-speech models do not consistently match optimal cascaded systems in reasoning quality,
      even when the cascaded oracle has access to ground-truth ASR transcriptions of user speech.
    source: §6.2, Table 3
    evidence: SALM-Duplex outperforms GT+LLM on Roleplay and ASR-QA but underperforms on UltraChat (3.5 vs. 6.4),
      Topic, and Alpaca; the gap reflects compounding ASR error and limited backbone reasoning capacity at 1.1B
      parameters.
    confidence: high
    relevance: medium
  - claim_id: barge_in_success_rate_and_latency_together_constitute_more_discriminative
    role: supports
    claim: Barge-in success rate and latency together constitute more discriminative signals for evaluating full-duplex
      systems than speech quality metrics such as UTMOS.
    source: §5.2, §6.1, Table 2
    evidence: On the Impatient set, SALM-Duplex and Moshi have zero false alarms each and UTMOS within 0.2 points
      (4.0 vs. 3.8), yet differ by 39.4 percentage points in barge-in success rate, making success rate the dominant
      differentiating metric.
    confidence: high
    relevance: low
  limitations:
  - All agent speech in training data is synthesized using a TTS model with a fixed speaker. Generalization to diverse
    agent voices or real conversational speech has not been demonstrated.
  - The 1.1B TinyLlama backbone limits reasoning ceiling; the gap to the GT+LLM oracle on complex dialogue tasks
    suggests ASR error compounds with limited LLM capacity. The quantitative comparison is restricted to Moshi;
    other contemporaneous duplex systems (OmniFlatten, SALMONN-Omni, MinMo) are discussed in related work but not
    benchmarked. The hardcoded 0.64s post-user-turn silence used to suppress unexpected agent barge-in may not transfer
    to naturally paced conversation. Evaluation datasets are largely synthetic, so performance on real recorded
    conversational speech remains an open question.
  caveats: []
- id: '2507.18897'
  published_date: "2025-07-25"
  entry_date: '2026-07-28'
  year: 2025
  venue: arXiv
  task:
  - codec
  architecture:
  - GAN
  relevance: high
  evidence_role:
  - core_evidence
  current_role: active_evidence
  method_family:
  - gan_neural_codecs_and_decoders
  claims:
  - claim_id: single_quantizer_neural_codecs_can_match_multi_quantizer_systems_in
    role: supports
    claim: Single-quantizer neural codecs can match multi-quantizer systems in perceived speech quality at far lower
      bitrates when combined with stabilized VQ spaces and asymmetric decoder architectures.
    source: §4.3, Table 1
    evidence: HH-Codec achieves UTMOS 3.61 on LibriTTS test-clean at 0.3 kbps with a single quantizer, competitive
      with DAC's 4-quantizer configuration at 4 kbps (UTMOS 3.41) and markedly above SpeechTokenizer's single-quantizer
      variant at 0.75 kbps (UTMOS 1.26).
    confidence: high
    relevance: medium
  - claim_id: multi_layer_vq_training_with_single_layer_inference_where_auxiliary
    role: supports
    claim: Multi-layer VQ training with single-layer inference, where auxiliary quantizer layers act as regularizers,
      substantially improves codebook utilization in high-compression single-quantizer settings.
    source: §4.4, Tables 2-3
    evidence: SLM-VQ achieves 98% codebook utilization at 8192 entries versus 56% for Classic VQ and 92% for single-layer
      SLM-VQ, while improving UTMOS from 2.76 (Classic VQ) to 3.07 on LibriTTS test-other.
    confidence: high
    relevance: high
  - claim_id: dual_domain_supervision_combining_intermediate_mel_spectrogram_and_final_audio
    role: supports
    claim: Dual-domain supervision combining intermediate mel-spectrogram and final audio reconstruction objectives
      is critical for stable high-compression neural codec training.
    source: §4.4, Table 2
    evidence: Reducing to single audio-domain supervision drops UTMOS from 3.07 to 1.85 and SPK-SIM from 0.64 to
      0.33 on LibriTTS test-other, the largest degradation across all ablation variants.
    confidence: high
    relevance: high
  - claim_id: standard_adversarial_codec_training_recipes_break_down_at_extreme_compression
    role: complicates
    claim: Standard adversarial codec training recipes break down at extreme compression ratios, requiring architectural
      and procedural modifications to avoid collapse.
    source: §1
    evidence: Below 0.3 kbps with existing methods, the paper documents adversarial training collapse, a 63% UTMOS
      drop below 30 tokens/s, 43% codebook utilization at 8192 entries, and minimal benefit from expanding training
      data, all addressed in HH-Codec through SLM-VQ and progressive training.
    confidence: high
    relevance: high
  limitations:
  - HuBERT-based semantic distillation is trained on English, so multilingual performance of SLM-VQ is unknown.
    The downstream spoken language modeling experiment measures only training loss reduction rather than end-to-end
    TTS quality, leaving it unclear how the 24-token-per-second compression affects downstream synthesis intelligibility
    and naturalness. Training data conditions differ across compared baselines (WavTokenizer and DAC use larger
    or different datasets), which limits direct attribution of gains to architecture versus data. The ablation study
    is conducted on a subset of training data only (LibriTTS train-100/360, not the full training set including
    Emilia), which may underestimate some component contributions.
  caveats: []
