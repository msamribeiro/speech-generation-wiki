  current_role: active_evidence
  method_family:
  - autoregressive_codec_language_models
  - flow_matching_codec_decoders
  - hybrid_semantic_acoustic_tokenizers
  claims:
  - claim_id: chunking_text_into_aligned_segments_with_a_short_token_delay
    role: supports
    claim: Chunking text into aligned segments with a short token-delay before speech decoding reduces error accumulation
      in long-form autoregressive speech generation.
    source: §4.2, Table 6
    evidence: Removing chunk-based decoding raises Long-TTS-Eval error rates above those of concurrent long-form
      TTS baselines, and with it enabled MGM-Omni-TTS-2B achieves EN-hard WER 26.26 versus 42.48-98.61 for CosyVoice2,
      MOSS-TTSD-v0.5, and Higgs-Audio-v2.
    confidence: high
    relevance: medium
  - claim_id: multi_token_parallel_decoding_is_not_restricted_to_rvq_speech
    role: supports
    claim: Multi-token parallel decoding is not restricted to RVQ speech tokenizers and can be applied effectively
      to finite scalar quantization (FSQ) tokenizers.
    source: §4.2, Table 6
    evidence: Increasing parallel decoding size on the CosyVoice2 FSQ tokenizer maintains TTS quality on Seed-TTS-Eval
      while cutting inference RTF by roughly 3x at parallel size 4.
    confidence: high
    relevance: high
  - claim_id: increasing_the_parallel_decoding_size_trades_off_synthesis_error_rate
    role: complicates
    claim: Increasing the parallel decoding size trades off synthesis error rate against inference speed rather
      than improving both simultaneously.
    source: §4.2
    evidence: Larger parallel sizes in the ablation slightly raise audio error rate even as they substantially accelerate
      inference, leading the authors to select a parallel size of 4 as a balance point.
    confidence: high
    relevance: medium
  - claim_id: separating_multimodal_reasoning_from_speech_synthesis_into_distinct_model_components
    role: refines
    claim: Separating multimodal reasoning from speech synthesis into distinct model components can improve long-form
      audio understanding without sacrificing speech generation efficiency.
    source: §4.1.1, §4.1.3, Figure 5, Table 5b
    evidence: The dual-track brain-mouth design lets the MLLM handle needle-in-the-haystack audio inputs up to 4,500
      seconds while the SpeechLM independently achieves the lowest RTF among compared long-form TTS systems.
    confidence: high
    relevance: medium
  limitations:
  - 'The long-form evaluation itself is partly self-authored: Long-TTS-Eval is introduced by this paper, and while
    its construction and normalized-text scoring procedure are documented, results on it cannot yet be cross-checked
    against independent replications. The comparison in Table 5b is limited to three baseline systems, and the qualitative
    long-speech examples in the appendix (a classical Chinese poem and a code-switched English-Chinese poem) are
    illustrative rather than a systematic error analysis. The paper does not report results on emotion or prosody
    control, nor does it evaluate robustness to reference audio recorded in noisy or far-field conditions. The 32B
    MLLM variant''s long-form and vision-speech results are mixed relative to the 7B variant (e.g., lower TextVQA-Speech
    and EN-hard performance context is not directly reported for 32B TTS), suggesting scaling benefits are not uniform
    across all sub-tasks.'
  caveats: []
- id: '2509.26276'
  published_date: "2025-09-30"
  entry_date: '2026-07-28'
  year: 2025
  venue: arXiv
  task:
  - TTS
  - SCA
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - architecture_variant
  - control_evidence
  current_role: active_evidence
  method_family:
  - autoregressive_codec_language_models
  claims:
  - claim_id: acoustic_consistency_in_autoregressive_speech_language_models_can_be_improved
    role: supports
    claim: Acoustic consistency in autoregressive speech language models can be improved through LM-side embedding
      initialization and auxiliary training objectives, independent of parameter count.
    source: §4, Table 1
    evidence: The 0.7B speech-only CAST model scores 90.8 speaker and 90.0 gender consistency on SALMON, exceeding
      the 7B SpiritLM (81.0/85.0) and 7B Twist (71.0/70.0), despite using an order of magnitude fewer parameters
      and the same evaluation protocol.
    confidence: high
    relevance: medium
  - claim_id: interleaving_text_and_speech_tokens_in_a_shared_vocabulary_language
    role: complicates
    claim: Interleaving text and speech tokens in a shared-vocabulary language model improves semantic and lexical
      grounding at the cost of acoustic consistency.
    source: §4, Tables 1-2
    evidence: The 1.0B interleaved model drops SALMON consistency by 5-9 points across every measured factor relative
      to the 1.0B speech-only model (e.g., speaker 83.5 vs. 90.0) while sWUGGY rises from 67.0 to 73.7 and semantic-acoustic
      alignment scores improve by 6-7.5 points.
    confidence: high
    relevance: medium
  - claim_id: auxiliary_objectives_that_require_the_model_to_plan_coarse_content
    role: supports
    claim: Auxiliary objectives that require the model to plan coarse content structure before predicting fine acoustic
      detail materially contribute to speaker- and gender-identity stability beyond what embedding initialization
      alone provides.
    source: §4, Table 4
    evidence: Removing the delayed coarse-label and next-code auxiliary losses drops speaker consistency from 90.8
      to 83.5 in the 0.7B model and from 90.0 to 83.0 in the 1.0B model, with background and room consistency declining
      more moderately.
    confidence: high
    relevance: medium
  - claim_id: initializing_speech_token_embeddings_from_self_supervised_acoustic_features_biases
    role: refines
    claim: Initializing speech-token embeddings from self-supervised acoustic features biases the resulting representation
      toward content structure at the expense of fine-grained prosodic detail.
    source: §4, Table 3
    evidence: Linear probes on frozen LM features show the SSL-initialized variant gains on average +16% relative
      accuracy on content-leaning tasks (ESC-50, US8K, RAVDESS) while losing about 7% relative accuracy on prosody-leaning
      tasks (VIVAE, EMOVO), compared to a randomly initialized baseline.
    confidence: high
    relevance: high
  limitations:
  - The paper evaluates consistency exclusively through likelihood-based pairwise preference scoring (SALMON) rather
    than through generated-sample quality or human listening tests; no MOS or subjective naturalness evaluation
    is reported, so it is untested whether the consistency gains translate into perceptibly better generations.
    The comparison against Twist, SpiritLM, LAST, and Flow-SLM baselines is confounded by differences in tokenizer,
    training data, and architecture beyond scale, which the paper acknowledges only implicitly by noting these systems
    "differ in tokenization, architecture, and training objectives." The 1.0B ablation shows a single anomalous
    result for room consistency that the authors attribute to run instability rather than investigate further. All
    experiments use English-only, largely read-speech and audiobook data (LibriLight, People's Speech), leaving
    open whether the training recipe generalizes to conversational, multilingual, or noisier real-world speech.
  caveats: []
- id: '2510.00264'
