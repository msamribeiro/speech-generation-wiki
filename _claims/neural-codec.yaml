  claims:
  - claim_id: a_full_duplex_speech_language_model_can_perform_structured_dialogue
    role: supports
    claim: A full-duplex speech language model can perform structured dialogue state tracking when DST is executed
      entirely through the model's text stream using explicit delimiter tokens.
    source: §3, §5.3, Table 1
    evidence: J-Moshi-ext fine-tuned on synthesized JMultiWOZ data achieves JGA 65.69 and Slot F1 97.78 on the JMultiWOZ
      test set, with both metrics improving monotonically as training data volume increases from 25% to 100%.
    confidence: high
    relevance: low
  - claim_id: extending_full_duplex_speech_models_to_task_oriented_dialogue_does
    role: complicates
    claim: Extending full-duplex speech models to task-oriented dialogue does not close the gap with text-based
      systems on response generation quality.
    source: §5.3, Table 1
    evidence: The proposed method reaches BLEU 0.129 and BERTScore 0.689, against text-based upper bounds of BLEU
      0.364 and BERTScore 0.830 (T5-large), with the gap attributed to insufficient training data and to the difficulty
      of aligning text and audio modalities during response generation.
    confidence: high
    relevance: low
  - claim_id: tts_data_quality_limitations_compound_into_downstream_training_noise_when
    role: complicates
    claim: TTS data quality limitations compound into downstream training noise when synthesized speech is used
      to construct full-duplex dialogue training corpora.
    source: §5.3
    evidence: The multilingual OuteTTS model used for Japanese speech synthesis generated speech with reduced clarity,
      causing recognition errors during time-annotated tokenization that hindered the model's learning of coherent
      text-audio token sequences for response generation.
    confidence: high
    relevance: low
  - claim_id: dst_timing_estimation_is_feasible_within_a_full_duplex_spoken
    role: supports
    claim: DST timing estimation is feasible within a full-duplex spoken dialogue model but introduces substantial
      prediction error tied to the model's speech perception accuracy.
    source: §5.1, §5.3
    evidence: DST initiation timing (defined as the time of `<bs>` token generation) achieved a MAE of 4.9 seconds,
      with discrepancies attributed to the difficulty of accurately predicting user utterance boundaries from the
      model's audio token representations alone.
    confidence: high
    relevance: low
  limitations:
  - All experiments are conducted in Japanese using J-Moshi, which was trained on less Japanese data than the original
    English Moshi. The authors explicitly note that performance on English equivalents (MultiWOZ, SpokenWOZ) could
    be substantially higher, and cross-lingual generalisability is untested.
  - Evaluation is fully automatic (JGA, Slot F1, BLEU, BERTScore); no subjective listening tests or user studies
    are reported, leaving response naturalness, latency under real deployment conditions, and the effect of DST
    pauses on conversational flow unassessed. The experiment covers only the domains included in JMultiWOZ (travel
    planning), and extension to diverse or open-domain settings is planned but not yet evaluated. Future work includes
    experiments with the original Moshi on SpokenWOZ and DSTC11 datasets and application to additional dialogue
    domains.
