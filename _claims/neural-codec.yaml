- id: interspeech-2025-0355
  published_date: "2025-08-17"
  entry_date: '2026-07-28'
  year: 2025
  venue: Interspeech
  task:
  - codec
  - evaluation
  architecture: []
  relevance: medium
  evidence_role:
  - architecture_variant
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: codec_noise_robustness_does_not_reliably_predict_across_bitrate_regimes
    role: supports
    claim: Codec noise robustness does not reliably predict across bitrate regimes, and clean-speech quality metrics
      are a poor proxy for noisy-condition performance.
    source: §4, Figure 1 in paper
    evidence: At the highest bitrate, DAC outperforms EnCodec in noise robustness; at 3 kbps, EnCodec surpasses
      DAC on most downstream metrics under noise. HiFi-Codec matches EnCodec in clean-speech perceptual quality
      but degrades far more under noise.
    confidence: high
    relevance: high
  - claim_id: neural_speech_codecs_exhibit_non_linear_input_output_behavior_violations
    role: supports
    claim: Neural speech codecs exhibit non-linear input-output behavior (violations of additivity and homogeneity)
      that partially explains their robustness failures under noise and signal overlap.
    source: §5, Figure 2 in paper
    evidence: Additivity improves with bitrate across all evaluated codecs, and codecs with better additivity (DAC)
      show stronger noise robustness. HiFi-Codec and SpeechTokenizer exhibit uneven homogeneity at extreme gains,
      aligning with their higher degradation in speaker and emotion metrics.
    confidence: high
    relevance: medium
  - claim_id: codec_evaluation_using_only_clean_speech_reconstruction_metrics_provides_an
    role: complicates
    claim: Codec evaluation using only clean-speech reconstruction metrics provides an incomplete characterization
      of codec behavior for real-world speech processing pipelines.
    source: §4
    evidence: Perceptual quality (PESQ) converges to similar values across codecs under severe noise, masking large
      differences in phonetic content (WER), speaker identity (EER), and emotional fidelity (SER-ACC).
    confidence: high
    relevance: high
  - claim_id: low_frequency_spectral_emphasis_introduced_by_time_domain_training_losses
    role: supports
    claim: Low-frequency spectral emphasis introduced by time-domain training losses is a consistent artifact across
      neural speech codecs and can cause unintended spectral coloration.
    source: §6, Figure 3 in paper
    evidence: All five evaluated codecs exhibit low-frequency boosting below 100 Hz under sine sweep analysis, most
      pronounced in EnCodec; the effect is attributed to waveform-level L1/L2 losses used in training.
    confidence: high
    relevance: medium
  limitations:
  - The evaluation is limited to five codecs, all of which use residual vector quantization. More recent codecs
    with different quantization strategies (e.g., fully transformer-based or finite scalar quantization approaches)
    are not included. The noise conditions, while diverse, use fixed SNR ranges and do not cover all real-world
    degradation types (e.g., codec artifacts, packet loss, or non-stationary noise sources). All test data are English;
    whether these robustness rankings generalize across languages and speaking styles is unexamined. The emotion
    preservation evaluation relies on a single emotion recognizer (emotion2vec) trained on limited data, and speaker
    identity assessment uses a single ECAPA-TDNN model, which may introduce evaluator-specific biases. No human
    perceptual evaluation is included.
  caveats: []
