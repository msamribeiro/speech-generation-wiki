reassessment_queue:
- id: continuous_discrete_representation_tradeoff
  type: claim_status
  reason: The comparison spans different generators, rates, and sampling procedures.
  trigger: A matched study compares continuous and discrete representations with the same generator, data, rate,
    and evaluation protocol.
  due: 2026-10
  current_assessment: strongly_supported
  watch_for:
  - Matched representation ablations
  - Long-form robustness comparisons
- id: codec_evaluation_lacks_metric_consensus
  type: benchmark_validity
  reason: Metric reliability varies across reconstruction, TTS, voice conversion, and dialogue use cases.
  trigger: A shared multi-task codec benchmark validates objective metrics against controlled listener studies.
  due: 2026-10
  current_assessment: strongly_supported
  watch_for:
  - Cross-dataset metric correlations
  - Listener-calibrated codec benchmarks
- id: hybrid_semantic_acoustic_tokenizers
  type: method_family
  reason: This broad family combines several incompatible placements of semantic supervision.
  trigger: Enough matched systems exist to split pre-quantization guidance, first-layer distillation, and parallel
    semantic streams.
  due: 2026-10
  current_assessment: active_evidence
  watch_for:
  - Matched semantic-integration ablations
  - Layer-wise information probes
- id: learned_codec_low_bitrate_quality
  type: claim_status
  reason: Low-bitrate quality claims are strong but rarely use matched datasets and listening protocols.
  trigger: Independent reproduction compares neural and conventional codecs at matched rates on shared speech data.
  due: 2026-10
  current_assessment: strongly_supported
  watch_for:
  - Independent codec reproductions
  - Rate-controlled listening tests
- id: speaker_prosody_entanglement_is_persistent
  type: claim_status
  reason: Invariance desirable for semantic modeling may be harmful for expressive reconstruction.
  trigger: Task-conditioned evaluations quantify the optimal information split for TTS, VC, and dialogue separately.
  due: 2026-10
  current_assessment: strongly_supported
  watch_for:
  - Task-specific disentanglement studies
  - Prosody and identity leakage probes
open_questions:
- What codec representation rate minimizes sequence cost without losing transient, prosodic, and speaker information
  needed for high-fidelity generation?
- How should semantic and acoustic information be distributed across codebooks for TTS, voice conversion, and spoken
  dialogue respectively?
- Which objective and subjective measures jointly predict both reconstruction quality and downstream generation
  performance?
- Can a single universal codec remain competitive across speech, music, environmental audio, multilingual speech,
  and non-verbal vocalization?
- How much of codec-language-model robustness is determined by the tokenizer versus the generator and alignment
  mechanism?
- Can continuous or hybrid representations retain their quality advantage while matching the storage, streaming,
  and language-model compatibility of discrete tokens?
trend_notes:
- The field moved from waveform-level autoregression toward discrete codec language modeling after 2022.
- Residual quantization remains common, but 2024–2025 work increasingly tests single-codebook and semantically guided
  alternatives.
- Semantic–acoustic hybrid tokenizers became a major design axis as unified speech models expanded beyond TTS.
- Flow-matching and diffusion decoders increasingly reconstruct audio from compact semantic or codec representations
  without fully autoregressive acoustic decoding.
- Codec evaluation is shifting from reconstruction-only scores toward downstream intelligibility, speaker similarity,
  dialogue capability, and listener studies.
