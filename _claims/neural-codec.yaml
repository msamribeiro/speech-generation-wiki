- id: 2025.acl-long.1498
  published_date: "2025-07-27"
  entry_date: '2026-07-28'
  year: 2025
  venue: ACL
  task:
  - TTS
  - codec
  architecture:
  - autoregressive-LM
  - GAN
  relevance: high
  evidence_role:
  - core_evidence
  - control_evidence
  current_role: active_evidence
  method_family:
  - autoregressive_codec_language_models
  - gan_neural_codecs_and_decoders
  claims:
  - claim_id: context_dependent_encoding_in_rvq_based_neural_audio_codecs_causes
    role: supports
    claim: Context-dependent encoding in RVQ-based neural audio codecs causes perceptually equivalent audio segments
      to produce divergent discrete token sequences, increasing prediction uncertainty in downstream codec language
      models.
    source: §2, §2.3
    evidence: Context-dependent encoding in RVQ-based neural audio codecs causes perceptually equivalent audio segments
      to produce divergent discrete token sequences, increasing prediction uncertainty in downstream codec language
      models.
    confidence: high
    relevance: high
  - claim_id: codec_token_consistency_and_downstream_autoregressive_tts_quality_are_monotonically
    role: supports
    claim: 'Codec token consistency and downstream autoregressive TTS quality are monotonically correlated: improvements
      in consistency accuracy reliably reduce word error rate and increase speaker similarity.'
    source: §5.2, Figure 4
    evidence: 'Codec token consistency and downstream autoregressive TTS quality are monotonically correlated: improvements
      in consistency accuracy reliably reduce word error rate and increase speaker similarity.'
    confidence: high
    relevance: high
  - claim_id: auxiliary_consistency_losses_applied_during_codec_training_can_substantially_increase
    role: supports
    claim: Auxiliary consistency losses applied during codec training can substantially increase token consistency
      with negligible impact on reconstruction quality.
    source: §5.1, Table 1
    evidence: Auxiliary consistency losses applied during codec training can substantially increase token consistency
      with negligible impact on reconstruction quality.
    confidence: high
    relevance: high
  - claim_id: consistency_constraint_methods_applied_to_codec_training_generalize_across_neural
    role: supports
    claim: Consistency constraint methods applied to codec training generalize across neural codec architectures
      and autoregressive LM backbones, as demonstrated by cross-system experiments on both EnCodec-VALL-E and FunCodec-UniAudio
      pipelines.
    source: §5.2, Table 3
    evidence: Consistency constraint methods applied to codec training generalize across neural codec architectures
      and autoregressive LM backbones, as demonstrated by cross-system experiments on both EnCodec-VALL-E and FunCodec-UniAudio
      pipelines.
    confidence: high
    relevance: high
  - claim_id: in_rvq_codecs_deeper_codebook_layers_suffer_disproportionately_from_context
    role: supports
    claim: In RVQ codecs, deeper codebook layers suffer disproportionately from context-induced inconsistency, because
      they encode fine-grained acoustic detail that is more sensitive to contextual perturbation than the semantic
      information stored in shallow layers.
    source: §2.3, Appendix A.3, Table 6
    evidence: In RVQ codecs, deeper codebook layers suffer disproportionately from context-induced inconsistency,
      because they encode fine-grained acoustic detail that is more sensitive to contextual perturbation than the
      semantic information stored in shallow layers.
    confidence: high
    relevance: high
  limitations:
  - The DRI fix is applied at codec training time; it does not address the underlying structural cause (large receptive
    fields in the convolutional encoder). A follow-up could explore whether directly reducing receptive field size
    with compensating distillation achieves similar or better consistency.
  - The method is validated on English speech (LibriTTS and MLS, which is multilingual but dominated by English).
    Whether DRI and its mitigation generalize to tonal languages (where fine-grained acoustic context is phonemically
    contrastive) is unstudied.
  - Evaluation is restricted to the VALL-E architecture for downstream TTS. The generalizability claim to "any neural
    codec language model" rests on two additional cross-codec experiments (Table 3), which is suggestive but not
    comprehensive. In particular, the paper does not evaluate on flow-matching TTS (e.g. CosyVoice or E2-TTS), where
    consistency constraints on the codec may have different downstream effects.
  - The MOS and SMOS evaluations use 50 audio samples — a small panel by modern standards. Confidence intervals
    are not reported for subjective metrics.
  - DRI may interact with audio compression artifacts differently at different bitrates; the paper evaluates 4 kbps
    and 8 kbps but does not explore very low bitrates where context-dependence may be even stronger.
  caveats: []
- id: 2025.acl-long.346
  published_date: "2025-07-27"
  entry_date: '2026-07-28'
