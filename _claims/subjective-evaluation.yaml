    role: supports
    claim: Replacing raw reference-audio conditioning with a distilled global speaker embedding reduces language
      leakage from the reference audio into synthesized content in cross-lingual generation.
    source: §4.2, Table 4
    evidence: Switching from context-speech conditioning (M1) to a global speaker embedding (M2) drops WER from
      16.78 to 4.81 on the EN-ZH cross-lingual test set, with the paper attributing M1's high WER to speech content
      becoming "significantly influenced by the language of the reference audio."
