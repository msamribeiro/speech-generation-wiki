    relevance: low
  - claim_id: fine_tuning_an_existing_zero_shot_multilingual_tts_model_on_a_newly_cons
    role: supports
    claim: Fine-tuning an existing zero-shot multilingual TTS model on a newly constructed low-resource-language corpus can produce naturalness and speaker-similarity quality comparable to native single-language TTS systems trained on smaller proprietary datasets.
    source: §5, Table 3
    evidence: XTTS fine-tuned on the 1,804-hour ParsVoice subset achieves MOS 3.6/5 and SMOS 4.0/5 on unseen Persian speakers, compared to MOS 3.72/SMOS 4.02 and MOS 3.34/SMOS 3.81 for two FastSpeech2 systems trained on the separate DeepMine corpus.
