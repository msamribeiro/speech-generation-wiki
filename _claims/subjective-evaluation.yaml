- id: '2510.23312'
  published_date: '2025-10-27'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - codec
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - infrastructure
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: benchmarking_speech_codecs_under_joint_constraints_on_bitrate_compute_an
    role: supports
    claim: Benchmarking speech codecs under joint constraints on bitrate, compute, and latency exposes design trade-offs that are invisible when bitrate or perceptual quality is optimized in isolation.
    source: §2.1, Table 1
    evidence: The challenge specifies simultaneous per-track ceilings on receive-side and total compute (≤300/700 MFLOP/s for Track 1, ≤600/2600 MFLOP/s for Track 2), total latency (≤30/50 ms), and bitrate (≤1/≤6 kbps ultralow/low modes), with a single system and decoder required to satisfy both bitrate modes at once.
    confidence: high
    relevance: medium
  - claim_id: objective_codec_quality_metrics_can_be_unreliable_for_ranking_systems_tr
    role: complicates
    claim: Objective codec-quality metrics can be unreliable for ranking systems trained with generative methods, making them unsuitable as a sole or final arbiter of codec quality.
    source: §5, §5.1
    evidence: The organizers used objective metrics (SCOREQ, UTMOS, SHEET-SSQA, AE-CE, PESQ) only for development-phase feedback and explicitly excluded them from the final test-phase ranking, stating they "may exhibit limited reliability for models trained with generative methods," relying instead on crowdsourced MUSHRA-1S, DCR, ACR, and DRT listening tests.
    confidence: high
    relevance: high
  - claim_id: integrating_speech_enhancement_denoising_and_dereverberation_directly_in
    role: supports
    claim: Integrating speech enhancement (denoising and dereverberation) directly into the codec pipeline, rather than treating it as an upstream front-end, is a viable and separately evaluable design direction for low-bitrate speech coding.
    source: §2.1, §5.2.3, Table 4
    evidence: Track 2 is dedicated to codecs that jointly denoise, dereverberate, and compress under an expanded compute/latency budget, with dedicated ACR-based subjective tests for dereverberation and denoising performance on real-world recordings.
    confidence: high
    relevance: medium
  - claim_id: curated_multi_corpus_training_sets_for_speech_coding_benchmarks_can_stil
    role: complicates
    claim: Curated multi-corpus training sets for speech coding benchmarks can still be skewed toward read speech and a single dominant language, limiting how representative the resulting benchmark is of real-world speech diversity.
    source: §3.1.1, Table 3
    evidence: Read-speech sources (LibriTTS, VCTK, Librivox/DNS5, MLS) account for about 61% of the 702.7-hour curated training corpus, which is predominantly English with only partial French/German/Spanish coverage from MLS.
    confidence: high
    relevance: medium
  limitations:
  - Challenge constraint compliance is self-reported, and the description paper defers comparative analysis of submitted systems to future work.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.


