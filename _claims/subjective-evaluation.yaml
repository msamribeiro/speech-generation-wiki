  - gan_adversarial_generation
  claims:
  - claim_id: dynamic_frequency_resolution_in_a_gan_vocoder_s_time_frequency_discriminator
    role: supports
    claim: Dynamic frequency resolution in a GAN vocoder's time-frequency discriminator improves synthesis quality
      over fixed-resolution STFT discriminators, with the largest gains on signals with dense, fast-moving harmonic
      content such as singing voice.
    source: §IV-C1, Table I
    evidence: On out-of-domain singing, MS-SB-CQT and the proposed UnivHD (both dynamic-resolution) outperform the
      fixed-resolution MS-STFT discriminator on all four objective/subjective metrics for both HiFi-GAN and iSTFTNet
      backbones.
    confidence: high
    relevance: high
  - claim_id: aligning_a_discriminator_s_frequency_filters_to_exact_integer_multiples_of_a
    role: refines
    claim: Aligning a discriminator's frequency filters to exact integer multiples of a base frequency, rather than
      to power-of-two-spaced bins, extends dynamic-resolution time-frequency discriminators to cover odd harmonics
      that constant-Q-based designs systematically miss.
    source: §III-A
    evidence: Because CQT center frequencies are defined as f_c^k = f_min · 2^(k/B), the h-th harmonic h·f_c^k is
      only representable when h = 2^d; the proposed harmonic filter instead scales center frequencies by integer
      harmonic order h, so the k-th bin's h-th harmonic is exactly h times the k-th bin's first harmonic.
    confidence: high
    relevance: low
  - claim_id: combining_a_harmonic_dynamic_resolution_discriminator_with_a_fixed_resolutio
    role: supports
    claim: Combining a harmonic/dynamic-resolution discriminator with a fixed-resolution multi-scale STFT discriminator
      yields complementary gains beyond either alone.
    source: §IV-C1, Table II
    evidence: HiFi-GAN with both MS-STFT and UnivHD (+S+H) improves PESQ and MCD on in- and out-of-domain speech
      over HiFi-GAN with either discriminator alone, and also outperforms the MS-STFT + MS-SB-CQT combination on
      the same test sets.
    confidence: high
    relevance: low
  - claim_id: the_number_of_harmonics_modeled_by_a_harmonic_filter_discriminator_is_not_a
    role: complicates
    claim: The number of harmonics modeled by a harmonic-filter discriminator is not a free hyperparameter to maximize;
      too few harmonics under-resolves the spectrum and too many can push the modeled range past the sample's fundamental
      frequency, degrading pitch fidelity.
    source: §IV-C2
    evidence: Ablation over H ∈ {2, 8, 10, 12, 15, 20} shows near-flat performance in a mid-range but clear degradation
      at both extremes; at 24kHz sampling with H > 20 the discriminator cannot represent fundamental frequencies
      above roughly 600Hz within the first harmonic.
    confidence: high
    relevance: medium
  limitations:
  - MOS uses 15 utterances per condition and 10 raters without a stated significance test, and only two prior discriminator
    families are compared.
  caveats:
  - For subjective evaluation, this paper provides medium-relevance evidence; claims primarily concerning other
    concepts remain included but are marked low relevance.


- id: '2512.04552'
  published_date: '2025-12-04'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  - flow-matching
  relevance: high
  evidence_role:
  - infrastructure
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - autoregressive_generation
  - flow_matching_generation
  claims:
  - claim_id: differentiable_reward_optimization_for_tts_is_vulnerable_to_reward_hacking_w
    role: supports
    claim: Differentiable reward optimization for TTS is vulnerable to reward hacking, where the policy model learns
      to exploit reward model weaknesses via imperceptible-to-measurable acoustic artifacts rather than the intended
      target behavior.
    source: §3.2.1, Table 1
    evidence: The DiffRO baseline achieves a competitive Emotion MOS (3.65) but its Naturalness MOS (3.61) falls
      below even the SFT baseline (3.72), a divergence the authors attribute to the policy exploiting RM vulnerabilities
      with acoustic artifacts.
    confidence: high
    relevance: high
  - claim_id: a_reward_model_s_robustness_against_reward_hacking_can_be_improved_by_combin
    role: supports
    claim: A reward model's robustness against reward hacking can be improved by combining complementary regularization
      techniques that each target a distinct failure mode (label overconfidence, brittle decision boundaries, perturbation
      sensitivity), and this robustness transfers to downstream policy behavior.
    source: §3.2.2, Table 2; §3.2.1, Table 1
    evidence: Progressively adding label smoothing, energy-adaptive Mixup, and adversarial training to the reward
      model raises SER weighted accuracy on IEMOCAP/MER2023/ESD from 66.0/50.9/64.4 (DiffRO baseline) to 68.0/54.8/81.7
      (full RRPO), and the resulting policy achieves the highest subjective MOS on both emotion and naturalness
      axes among all four compared systems.
    confidence: high
    relevance: high
  - claim_id: objective_proxy_metrics_for_reward_model_robustness_do_not_move_uniformly_wi
    role: complicates
    claim: Objective proxy metrics for reward-model robustness do not move uniformly with each added regularization
      component, so component-level ablations can show trade-offs rather than monotonic improvement.
    source: §3.2.2, Table 2
    evidence: Adding adversarial training on top of label smoothing and energy-adaptive Mixup improves MER2023 accuracy
      (52.7 → 54.8) but slightly degrades IEMOCAP (69.1 → 68.0) and ESD (82.3 → 81.7), which the authors attribute
      to a known generalization/adversarial-robustness trade-off.
    confidence: high
    relevance: high
  - claim_id: fine_tuning_a_reward_model_s_robustness_on_data_from_a_single_language_can_s
    role: supports
    claim: Fine-tuning a reward model's robustness on data from a single language can still improve the reward signal's
      reliability on other languages, suggesting the correction targets language-agnostic representations rather
      than language-specific acoustic cues.
    source: §3.2.2
    evidence: Despite the RM being fine-tuned exclusively on Mandarin emotional data, weighted accuracy on the English-language
      IEMOCAP benchmark improves substantially (66.0 → 68.0–69.1 across ablation variants).
    confidence: high
    relevance: medium
  limitations:
  - Training and listening data come from one male Mandarin speaker; 20 raters judge 50 utterances, and cross-lingual
    evidence is objective rather than perceptual.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts
    remain included but are marked low relevance.


- id: '2512.04779'
  published_date: '2025-12-04'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - singing
  architecture:
  - flow-matching
  relevance: medium
  evidence_role:
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - flow_matching_generation
  claims:
  - claim_id: annotation_free_melody_extraction_learned_end_to_end_via_teacher_student_dis
    role: supports
    claim: Annotation-free melody extraction, learned end-to-end via teacher-student distillation and jointly optimized
      with the synthesis model, can substitute for manually-annotated phoneme and pitch alignment as a conditioning
      signal for singing voice synthesis without degrading output quality.
    source: §3.2, §4.5, Table 1
    evidence: An online melody extractor is trained with a KL-divergence distillation loss against a frozen MIDI-pretrained
      teacher, jointly with the DiT synthesis model, using only sentence-level-timestamped weakly-aligned data;
      the resulting system achieves aesthetic scores (CE, CU, PC, PQ) comparable to or better than baselines trained
      with precise phoneme/MIDI annotation.
    confidence: high
    relevance: medium
  - claim_id: reinforcement_learning_post_training_with_a_multi_objective_reward_combining
    role: supports
    claim: Reinforcement learning post-training with a multi-objective reward combining content-accuracy and melodic-similarity
      terms can jointly improve intelligibility and melody adherence in a flow-matching-based singing synthesis
      model, particularly in zero-shot and lyric-editing conditions.
    source: §3.3, §4.6, Table 3
    evidence: Flow-GRPO post-training (single-timestep stochastic noise injection into the ODE flow) reduces WER
      from 16.75% to 15.18% and raises F0 Pearson correlation from 76.64% to 82.84% relative to the pre-trained-only
      model.
    confidence: high
    relevance: low
  - claim_id: an_explicit_representation_alignment_loss_between_a_conditioning_signal_and
    role: complicates
    claim: An explicit representation-alignment loss between a conditioning signal and internal model features can
      accelerate convergence of conditional behavior, but risks degrading a competing objective unless its loss
      weight is annealed during training.
    source: §4.1, §4.6, Table 3
    evidence: The CKA-alignment loss speeds early convergence of melody-following behavior, but the paper reports
      that its weight must be gradually reduced during training; leaving it too high yields strong F0 correlation
      at the cost of increased WER.
    confidence: high
    relevance: low
  - claim_id: zero_shot_singing_voice_timbre_transfer_conditioned_on_a_short_reference_aud
    role: supports
    claim: Zero-shot singing-voice timbre transfer, conditioned on a short reference audio prompt, can generalize
      to unseen speakers without dedicated fine-tuning when the synthesis backbone is initialized from a pretrained
      zero-shot flow-matching TTS model.
    source: §4.3, §4.5, Table 1
    evidence: Evaluated on five unseen in-the-wild speakers absent from training, the system achieves 1.28% WER,
      93.95% speaker similarity, and 81.28% F0 correlation in the zero-shot timbre-transfer setting, outperforming
      TCSinger and Vevo baselines on WER.
    confidence: high
    relevance: medium
  - claim_id: structural_and_lyrical_editing_that_changes_phoneme_counts_and_sentence_stru
    role: complicates
    claim: Structural and lyrical editing that changes phoneme counts and sentence structure remains harder for
      annotation-free singing synthesis than straightforward zero-shot synthesis, since intelligibility degrades
      for the editing task even when melody adherence and relative comparisons to baselines remain favorable.
    source: §4.5, Table 1
    evidence: WER rises to 12.62-18.44% for zero-shot lyric and structural editing versus 1.28% for zero-shot synthesis
      on the same model, though this is still far below Vevo's 67.31-73.97% WER on the identical editing tasks.
    confidence: high
    relevance: medium
  limitations:
  - Subjective editing results cover a narrow Mandarin, unseen-speaker setting, while the broader annotation-free
    claims rely heavily on automatic content and melody metrics.
  caveats:
  - For subjective evaluation, this paper provides medium-relevance evidence; claims primarily concerning other
    concepts remain included but are marked low relevance.


- id: '2512.08006'
  published_date: '2025-12-08'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - hybrid
  relevance: high
  evidence_role:
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - hybrid_generation
  claims:
  - claim_id: decoupling_computationally_heavy_auxiliary_tts_components_into_independently
    role: supports
    claim: Decoupling computationally heavy auxiliary TTS components into independently-running services accessed
      over inter-process communication can remove most of the latency they would otherwise add if embedded directly
      in the synthesis runtime, without sacrificing their accuracy gains.
    source: §4, Table 1
    evidence: RTF for the enhanced lightweight phonemizer drops from 5.519 (direct call) to 0.167 (service-based),
      and for the larger neural G2P variant from 3.840 to 0.396, with phonemization accuracy metrics unchanged between
      the two calling modes.
    confidence: high
    relevance: low
  - claim_id: lightweight_non_neural_context_aware_enhancements_to_a_rule_based_g2p_module
    role: supports
    claim: Lightweight, non-neural context-aware enhancements to a rule-based G2P module can close most of the accuracy
      gap to a much larger neural G2P model on context-dependent phonemization subtasks.
    source: §4, Table 1
    evidence: A statistical homograph disambiguator and a distilled Ezafe tagger raise Ezafe F1 from 19.58% to 90.08%
      and homograph accuracy from 43.87% to 77.67%, matching a 300M-parameter neural G2P's 87.70% Ezafe F1 and 74.53%
      homograph accuracy.
    confidence: high
    relevance: low
  - claim_id: knowledge_distillation_from_a_large_general_purpose_linguistic_tagging_model
    role: supports
    claim: Knowledge distillation from a large general-purpose linguistic tagging model into a small task-specific
      model can retain most of the teacher's accuracy on a narrow phonemization subtask while cutting parameter
      count and inference time by roughly an order of magnitude.
    source: §3.2, Table 2
    evidence: An ALBERT-based Ezafe tagger distilled from a 162.84M-parameter SpaCy POS tagger uses 11.09M parameters
      and 0.037s average inference time versus the teacher's 0.110s, with F1 dropping only from 97.67% to 94.19%.
    confidence: high
    relevance: low
  - claim_id: correcting_a_tts_system_s_phoneme_input_can_meaningfully_improve_perceived_n
    role: complicates
    claim: Correcting a TTS system's phoneme input can meaningfully improve perceived naturalness without closing
      the gap to natural human speech, because naturalness also depends on prosodic and expressive capacity that
      the phonemizer does not control.
    source: §4.1, §Limitations, Table 3
    evidence: Fine-tuning on enhanced phoneme sequences raised MOS from 2.41 to 3.14 over baseline Piper, but this
      remained well below the 4.21 MOS of natural speech, which the authors attribute to the lightweight P2S model's
      limited capacity to reproduce higher-level prosodic and expressive features.
    confidence: high
    relevance: high
  limitations:
  - The MOS study uses 16 native Persian listeners and seven utterances on one lightweight backbone, with a large
    residual gap to natural speech.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts
    remain included but are marked low relevance.


- id: '2512.09504'
  published_date: '2025-12-10'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
