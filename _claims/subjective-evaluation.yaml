      shows larger fluctuations and Euclidean distance a lower performance ceiling.
    confidence: high
    relevance: medium
  - claim_id: improving_emotional_expressiveness_in_conditioned_speech_generation_does_not
    role: complicates
    claim: Improving emotional expressiveness in conditioned speech generation does not automatically preserve intelligibility
      relative to the strongest prior non-emotion-focused system.
    source: §Results and Discussion, Table 1
    evidence: Authentic-Dubber achieves the best EMO-ACC (47.21%) and MOS scores among all compared systems, but
      its WER (25.95) is higher than both StyleDubber (24.70) and Speaker2Dubber (18.27), the two strongest baselines
      on pronunciation accuracy.
    confidence: high
    relevance: high
  limitations:
  - The evaluation uses 20 raters and 12 samples, and improved emotional fidelity can trade off against intelligibility.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts
    remain included but are marked low relevance.


- id: '2511.18487'
  published_date: '2025-11-23'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - flow-matching
  relevance: medium
  evidence_role:
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - flow_matching_generation
  claims:
  - claim_id: natural_language_instruction_conditioning_can_control_timbre_and_paralinguis
    role: supports
    claim: Natural-language instruction conditioning can control timbre and paralinguistic attributes of synthesized
      speech at accuracy competitive with or exceeding reference-audio-dependent methods, without requiring a reference
      audio input.
    source: §3.3, Table 2
    evidence: Against CosyVoice2 (which needs reference audio for gender/age control), InstructAudio achieves 100%
      gender and 86.67% age classification control accuracy using text-only instructions, and outperforms CosyVoice2
      on emotion (83.33% vs. 58.33%) and style (86.67% vs. 65%) control accuracy that CosyVoice2 does support.
    confidence: high
    relevance: medium
  - claim_id: conditioning_speech_synthesis_on_text_only_instructions_rather_than_referenc
    role: complicates
    claim: Conditioning speech synthesis on text-only instructions rather than reference audio introduces one-to-many
      mapping ambiguity that reduces perceived naturalness relative to audio-prompted systems.
    source: §3.3, §3.4, Table 2
    evidence: InstructAudio's NMOS (3.46) trails CosyVoice2's NMOS (3.65) despite InstructAudio outperforming CosyVoice2
      on nearly every objective control, similarity, and distortion metric; the authors attribute the naturalness
      gap to the information loss inherent in text-only conditioning versus reference-audio conditioning.
    confidence: high
    relevance: high
  - claim_id: a_single_instruction_conditioned_architecture_can_jointly_serve_speech_and_m
    role: supports
    claim: A single instruction-conditioned architecture can jointly serve speech and music generation at competitive
      quality in both domains, without requiring task-specific architectural branches or per-task fine-tuning.
    source: §3.3, Tables 1 and 3
    evidence: Trained jointly on 50K hours of speech and 20K hours of music using one standardized instruction-phoneme
      input format and one MM-DiT model, InstructAudio achieves the best SongEval scores across all five evaluated
      dimensions against dedicated TTM systems (DiffRhythm+, ACE-Step) while simultaneously achieving the lowest
      Seed-TTS WER among compared TTS systems, despite using less total training data than the largest single-task
      baselines.
    confidence: high
    relevance: low
  - claim_id: constraining_audio_clip_length_to_enable_joint_training_across_generation_do
    role: complicates
    claim: Constraining audio clip length to enable joint training across generation domains with different natural
      durations limits the applicability of the resulting model to long-form generation in either domain.
    source: §3.2, §3.4
    evidence: To align speech and music training, clips are capped at 5–20 seconds; this disadvantages the TTM comparison
      against DiffRhythm+, which is optimized for full-length song generation and does not natively support outputs
      under 90 seconds, requiring the authors to generate longer sequences and truncate them for the evaluation,
      which they acknowledge "may introduce evaluation bias."
    confidence: high
    relevance: medium
  limitations:
  - Professional listening tests use proprietary datasets and test sets, and baseline-access differences may bias
    comparisons.
  caveats:
  - For subjective evaluation, this paper provides medium-relevance evidence; claims primarily concerning other
    concepts remain included but are marked low relevance.


