      quality before any visual conditioning is added.
    source: §4.1
    evidence: After fine-tuning on audiovisual data with no visual features (M1), speech quality shows a slight
      degradation relative to the original TTS model, attributed to the limited scale of the audiovisual training
      data.
    confidence: high
    relevance: medium
  limitations:
