    role: complicates
    claim: Automatic ASR-based intelligibility metrics can understate the quality of synthesized speech in low-resource languages when the scoring ASR system itself is undertrained on synthetic voices in that language.
    source: §5
    evidence: The fine-tuned system scores WER 22.57% and CER 12.78% via Google STT, yet human raters scored text accuracy at 4.0/5; the authors attribute the gap to Google STT's limited exposure to synthetic Persian speech.
    confidence: high
    relevance: high
