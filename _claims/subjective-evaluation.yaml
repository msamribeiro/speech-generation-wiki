  claims:
  - claim_id: adding_pitch_and_duration_style_tokens_to_a_flow_matching_tts_encoder_im
    role: supports
    claim: Adding pitch and duration style tokens to a flow-matching TTS encoder improves filler naturalness scores but increases word error rate, indicating that prosodic conditioning and phoneme representation compete for capacity in the text encoder.
    source: §6.1, Table 1
    evidence: The full system reaches MOS 3.84 and UTMOS 3.878 versus 3.62 and 3.354 for Matcha-TTS, while WER rises from 4.56% to 6.33%.
    confidence: high
    relevance: high
  - claim_id: cross_attention_between_phoneme_level_and_word_level_pitch_representatio
    role: supports
    claim: Cross-attention between phoneme-level and word-level pitch representations partially recovers pronunciation accuracy lost when a pitch predictor is integrated into the encoder.
    source: §6.2, Table 1
    evidence: The ablation reported in Table 1 shows cross-attention partially recovering the pronunciation accuracy lost after adding the pitch predictor while retaining filler-style conditioning.
    confidence: high
    relevance: medium
  - claim_id: llm_based_filler_prediction_substantially_outperforms_sampling_based_ins
    role: supports
    claim: LLM-based filler prediction substantially outperforms sampling-based insertion baselines on both position accuracy and contextual naturalness, even when the LLM is fine-tuned from only 4.20M trainable LoRA parameters.
    source: §6.3, Table 2
    evidence: Vicuna-7B with LoRA reaches 82.56% position accuracy and 78.44% filler-type accuracy, versus 4.32% and 28.87% for the random baseline.
    confidence: high
    relevance: medium
  - claim_id: dialogue_oriented_llm_pretraining_provides_a_stronger_prior_for_filler_i
    role: supports
    claim: Dialogue-oriented LLM pretraining provides a stronger prior for filler insertion than general instruction tuning, suggesting that conversational context modeling is a key factor in filler placement quality.
    source: §6.3.1, Table 3
    evidence: Among the compared LLaMA, Qwen, and Vicuna variants, Vicuna-7B produces the strongest filler position and type predictions.
    confidence: high
    relevance: medium
  - claim_id: duration_controllability_in_filler_synthesis_is_harder_to_achieve_than_p
    role: complicates
    claim: Duration controllability in filler synthesis is harder to achieve than pitch controllability; pitch conditioning has negligible effect on predicted duration, pointing to a need for dedicated duration control mechanisms.
    source: §6.2
    evidence: The control analysis finds substantially weaker duration control than pitch control and negligible influence from pitch conditioning on predicted filler duration.
    confidence: high
    relevance: medium
  limitations:
  - Listening evaluation is English-only, WER increases with filler conditioning, and the paper leaves duration control and evaluation-protocol scale incompletely characterized.
  caveats:
