  claims:
  - claim_id: late_q4_2605_25504_inserting_non_verbal_vocalizations_into_emotional_speech_synthesis_improves_listeners_ability_to_identify_the_
    role: supports
    claim: Inserting non-verbal vocalizations into emotional speech synthesis improves listeners' ability to identify
      the intended emotion beyond what verbal prosody alone conveys.
    source: §5.3, §5.3.1, Figure 2, Figure 3
    evidence: On verbally ambiguous sentences, human four-way emotion identification rises from 62.1% for verbal-only
      emotional Grad-TTS to 82.0% with fine-grained NV tags, with fear rising from 46.36% to 82.69% when screaming is
      added.
    confidence: medium
    relevance: high
  - claim_id: late_q4_2605_25504_adding_non_verbal_vocalizations_to_synthetic_speech_trades_a_small_loss_in_perceived_naturalness_for_gains_in_
    role: complicates
    claim: Adding non-verbal vocalizations to synthetic speech trades a small loss in perceived naturalness for gains
      in expressiveness.
    source: §5.3, Figure 2, Table 3
    evidence: Naturalness MOS falls from 3.54 (verbal-only) to 3.40 (fine-grained NV) while expressiveness MOS rises
      from 3.81 to 4.20; per emotion, the NV system has lower nMOS than verbal-only in all four categories.
    confidence: medium
    relevance: high
  - claim_id: late_q4_2605_25504_the_emotional_benefit_of_a_non_verbal_vocalization_depends_on_how_specifically_that_vocalization_is_associated
    role: refines
    claim: The emotional benefit of a non-verbal vocalization depends on how specifically that vocalization is associated
      with the target emotion.
    source: §5.3.1, Figure 3, Table 3
    evidence: Emotion-specific cues (screaming for fear, crying for sadness) yield 82.69% and 98.28% recognition, while
      yelling, a generic high-arousal cue used for anger, reaches only 64.35% with eMOS 4.06, the lowest of the four
      emotions; coarse laughter for happy is often misheard as sad.
    confidence: medium
    relevance: high
  - claim_id: late_q4_2605_25504_annotating_non_verbal_vocalizations_with_type_count_and_duration_information_yields_more_recognizable_emotiona
    role: supports
    claim: Annotating non-verbal vocalizations with type, count, and duration information yields more recognizable emotional
      synthesis than presence-only tags.
    source: §5.1, §5.3.1, Table 3, Figure 3
    evidence: A Grad-TTS trained with the fine-grained EARS tags outperforms one trained on coarse NonverbalTTS tags
      in eMOS (4.21 vs 3.85 happy, 4.25 vs 4.15 sad) and happy recognition (82.50% vs 25.74%), though the two variants
      also differ in source data and recording quality.
    confidence: medium
    relevance: high
  limitations:
  - The listening test has 15 participants and 60 samples, reports no confidence intervals or significance tests, and
    gives conflicting overall emotion-recognition totals.
  - The coarse baseline covers only happy and sad and uses a different noisier corpus, so its aggregate comparison is
    not matched.
  caveats:
  - Naturalness, expressiveness, and emotion recognition move differently, reinforcing the need to report them as separate
    perceptual dimensions.
