  claims:
  - claim_id: pitch_modification_can_be_performed_directly_in_a_training_free_signal_proce
    role: supports
    claim: Pitch modification can be performed directly in a training-free signal-processing transform of the mel-spectrogram
      domain and remain compatible with any pretrained mel-based neural vocoder, without model retraining, architectural
      changes, or explicit F0 conditioning.
    source: §3, §2.3
    evidence: The method is validated by applying pitch shifts of -12 to +12 semitones to mel-spectrograms and synthesizing
      audio with four different pretrained, unmodified neural vocoders (HiFiGAN, BigVGAN, Vocos, WaveFM) spanning
      GAN and flow-matching architecture families, with no vocoder-specific adaptation.
    confidence: high
    relevance: medium
  - claim_id: directly_shifting_the_source_component_peak_in_a_cepstrum_like_representatio
    role: supports
    claim: Directly shifting the source-component peak in a cepstrum-like representation of the mel-spectrogram
      can achieve pitch modification without explicitly estimating F0 or voicing decisions, avoiding a class of
      errors that F0-conditioned pitch-control methods are exposed to.
    source: §1, §2.3
    evidence: The pseudo-cepstrum method shifts the cepstral source component above a single threshold quefrency
      (corresponding to the maximum expected F0) without any F0 estimation step, unlike the majority of prior neural
      vocoder pitch-control approaches, which require explicit F0 conditioning as a model input.
    confidence: high
    relevance: medium
  - claim_id: when_paired_with_strong_high_fidelity_neural_vocoders_a_mel_domain_pitch_shi
    role: supports
    claim: When paired with strong, high-fidelity neural vocoders, a mel-domain pitch-shifting method with no access
      to the original waveform can achieve subjective naturalness comparable to TD-PSOLA, the established DSP state-of-the-art
      for pitch modification performed directly on the waveform.
    source: §3.2, Figure 4
    evidence: In subjective MOS tests across the pitch-shift range, the pseudo-cepstrum method combined with HiFiGAN
      or Vocos scores on par with TD-PSOLA, which the authors treat as close to an upper bound since it directly
      modifies the ground-truth waveform.
    confidence: high
    relevance: high
  - claim_id: a_vocoder_s_robustness_to_feature_space_manipulation_of_its_own_conditioning
    role: complicates
    claim: A vocoder's robustness to feature-space manipulation of its own conditioning input varies substantially
      by architecture, so a pitch-modification technique operating purely in the mel-spectrogram domain does not
      guarantee uniform output quality across different pretrained vocoders.
    source: §3.1-3.2, Figures 3-4
    evidence: BigVGAN shows the fastest quality degradation among the four tested vocoders as pitch-shift magnitude
      increases, particularly for negative shifts, scoring lowest of the neural vocoders on both objective pitch-tracking
      metrics and subjective naturalness.
    confidence: high
    relevance: high
  limitations:
  - The listening study uses ten raters per sample and ten LJ Speech utterances; naturalness declines outside the
    recommended plus-or-minus-six-semitone range.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts
    remain included but are marked low relevance.


- id: '2512.20211'
  published_date: '2025-12-23'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - TTS
  - codec
  architecture:
  - GAN
  relevance: high
  evidence_role:
  - infrastructure
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - gan_adversarial_generation
  claims:
  - claim_id: replacing_an_unconstrained_nonlinear_activation_function_with_an_oversampled
    role: supports
    claim: Replacing an unconstrained nonlinear activation function with an oversampled, antiderivative-anti-aliased
      version measurably reduces aliasing artifacts in neural audio synthesis, and this reduction translates into
      improved perceptual audio quality, particularly for high-harmonic-content audio like singing voice and music.
    source: §V.C, Table I, Table V
    evidence: On the synthetic test-signal benchmark, ADAA SnakeBeta combined with 2x oversampling achieves the
      lowest average aliasing-to-harmonic ratio (-45.95 dB) among all tested activation variants, and an ablation
      on singing voice shows removing oversampling or reverting to a plain activation both measurably degrade C-MOS
      quality (-0.38 and up to -1.45 respectively).
    confidence: high
    relevance: high
  - claim_id: replacing_the_convtranspose_upsampling_layer_with_a_resampling_scheme_zero_i
    role: supports
    claim: Replacing the ConvTranspose upsampling layer with a resampling scheme (zero-interlacing plus a longer
      low-pass filter) combined with a deterministic high-frequency noise prior removes both mirrored aliasing and
      tonal artifacts more effectively than linear or nearest-neighbor interpolation alternatives, and the deterministic
      prior is necessary to prevent a training-stability trade-off from this removal.
    source: §V.C, Table I, Table V
    evidence: The proposed upsampling module achieves the lowest average aliasing-to-harmonic ratio (-53.93 dB)
      among all tested upsampling alternatives including ConvTranspose and linear/nearest interpolation, while an
      ablation removing the deterministic high-frequency prior causes the largest C-MOS quality drop (-1.49) of
      any single ablated component tested.
    confidence: high
    relevance: high
  - claim_id: anti_aliasing_improvements_to_neural_vocoder_and_codec_architectures_provide
    role: complicates
    claim: Anti-aliasing improvements to neural vocoder and codec architectures provide domain-dependent benefit,
      yielding clear quality gains on harmonically dense signals like singing voice, music, and general audio, but
      only comparable (not superior) performance on speech, where existing baseline architectures are already comparatively
      well-optimized.
    source: §V.C.2, Table II, Table III
    evidence: Across the analysis-synthesis evaluation, Pupu-Vocoder and Pupu-Codec consistently outperform baselines
      on singing voice, music, and audio domains, while achieving performance that the authors describe as merely
      comparable to baselines on speech, both objectively and subjectively.
    confidence: high
    relevance: high
  - claim_id: anti_aliased_neural_audio_synthesis_modules_incur_a_non_trivial_computationa
    role: complicates
    claim: Anti-aliased neural audio synthesis modules incur a non-trivial computational cost trade-off, particularly
      on CPU, that must be weighed against their quality gains for latency-sensitive deployment scenarios.
    source: §V.C.2
    evidence: Pupu-Codec-large has a higher CPU real-time factor than BigCodec (10.2 vs. 6.8) due to unoptimized
      DDSP oversampling and filtering kernels, though it remains faster than BigCodec on GPU (0.0157 vs. 0.0255)
      due to having fewer parameters; the authors note the approach targets offline production scenarios that can
      tolerate the added compute.
    confidence: high
    relevance: medium
  limitations:
  - Perceptual benefits are strongest for singing, music, and general audio rather than speech, and oversampling
    introduces meaningful CPU overhead.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts
    remain included but are marked low relevance.


- id: '2512.20944'
