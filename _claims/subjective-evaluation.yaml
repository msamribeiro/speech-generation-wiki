    role: supports
    claim: A voice conversion dataset that reflects real spontaneous and emotional variability, rather than acted or scripted speech, can serve as reference audio of comparable or higher perceived naturalness than a widely used acted emotional-speech benchmark.
    source: §V.C.5, Table VII
    evidence: Ground-truth listening tests rate NaturalVoices reference audio as more natural than ESD reference audio (MOS 4.51 ± 0.18 vs. 4.39 ± 0.17), despite NaturalVoices being unscripted, in-the-wild podcast speech.
    confidence: high
    relevance: high
  - claim_id: increasing_the_amount_of_spontaneous_in_the_wild_training_data_does_not_
    role: complicates
    claim: Increasing the amount of spontaneous, in-the-wild training data does not uniformly improve voice conversion model performance; some architectures degrade rather than benefit from scale.
    source: §V.C.5, Table VI
    evidence: DDDM-VC's out-of-domain speaker-verification accuracy on ESD falls from 0.933 (50% training data) to 0.768 (100% training data), and its objective WER/CER also worsen at 100% relative to 50%, while TriAAN-VC and ConsistencyVC scale more consistently.
    confidence: high
    relevance: medium
  - claim_id: models_trained_for_emotional_voice_conversion_on_spontaneous_naturalisti
    role: complicates
    claim: Models trained for emotional voice conversion on spontaneous, naturalistic emotional speech transfer emotion more faithfully in-domain but at a substantial cost to intelligibility on that same in-domain data, compared to conversion evaluated on acted, cleaner emotional speech.
    source: §V.D.4, Table IX
    evidence: DISSC trained on the emotion-balanced NaturalVoices subset achieves higher emotion category accuracy (0.617 vs. 0.255) and emotion embedding cosine similarity (0.724 vs. 0.286) on NaturalVoices than on ESD, but WER is far worse on NaturalVoices (0.454) than on ESD (0.112).
    confidence: high
    relevance: medium
  - claim_id: segment_level_multi_dimensional_automatic_annotation_speech_quality_emot
    role: supports
    claim: Segment-level, multi-dimensional automatic annotation (speech quality, emotion category and attributes, speaker identity, sound events) applied at scale to in-the-wild recordings can substitute for costly manual annotation while still supporting flexible, task-specific subset construction for voice conversion.
    source: §III, §V.B, Table V
    evidence: The four-stage pipeline (ASR/diarization, speaker mapping against MSP-Podcast human labels, multi-metric speech-quality scoring, emotion category/attribute prediction, sound-event detection) produces the filtered 870.26-hour VC subset and 340-hour emotion-balanced subset used directly to train and validate four different baseline VC/EVC systems.
    confidence: high
    relevance: medium
  limitations:
  - Subjective tests use twelve raters, while speaker and emotion annotations across most of the corpus are automatically inferred and may propagate model bias.
