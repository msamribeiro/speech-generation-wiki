  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: retrieval_based_selection_of_speech_prompts_guided_jointly_by_an_accent_conf
    role: supports
    claim: Retrieval-based selection of speech prompts, guided jointly by an accent-confidence score and text-content
      similarity, substantially improves accent fidelity in zero-shot instruction-guided TTS compared to selecting
      prompts without such signals.
    source: §III-B.3, Table I
    evidence: In the ablation, accent accuracy rises from 45.6% (no accent or text-similarity signal in prompt selection)
      to 61.74% once accent-confidence-guided selection is added, a roughly 16-point gain before any text adaptation
      is applied.
    confidence: high
    relevance: medium
  - claim_id: jointly_adapting_the_input_text_toward_the_target_dialect_on_top_of_accent_c
    role: supports
    claim: Jointly adapting the input text toward the target dialect on top of accent-consistent prompt retrieval
      yields a further, though comparatively smaller, gain in accent fidelity beyond acoustic conditioning alone.
    source: §III-B.3, Table I
    evidence: Adding GPT-adapted text on top of accent-score-guided RAAP raises accent accuracy from 61.74% to 63.36%
      (about 1.6 points), a smaller increment than the gain contributed by retrieval-based prompt selection itself;
      NISQA quality is not harmed by the addition (4.25 to 4.31).
    confidence: high
    relevance: medium
  - claim_id: instruction_guided_zero_shot_tts_backbones_trained_on_accent_imbalanced_data
    role: complicates
    claim: Instruction-guided zero-shot TTS backbones trained on accent-imbalanced data exhibit strong, statistically
      significant bias toward majority accents that persists even when explicit contrary accent instructions are
      given, and an input-side mitigation framework can reduce but not eliminate this bias for some accents.
    source: §III-D, Table II/VII
    evidence: A binomial test against a 1/12 random-chance baseline shows the CosyVoice2 backbone has extreme, consistent
      bias toward US/CA accents across all ten tested non-US/CA accents (p as low as 3.6e-67); CLARITY's mitigation
      lowers the bias substantially but remains statistically significant for Chinese, Spanish, Korean, and Portuguese
      accents.
    confidence: high
    relevance: high
  - claim_id: automatic_accent_classifiers_used_both_to_drive_retrieval_based_conditioning
    role: complicates
    claim: Automatic accent classifiers used both to drive retrieval-based conditioning and to evaluate accent fidelity
      are less reliable for accents that are phonetically or prosodically close to other accent groups, which limits
      both the conditioning signal quality and the trustworthiness of the resulting evaluation.
    source: §Appendix B.1, Fig. 10
    evidence: The fine-tuned ECAPA-TDNN accent classifier reaches 89-99% accuracy for Indian, Singaporean, and British
      accents but drops to 50-59% for Japanese, Chinese, and Portuguese accents, with confusion concentrated within
      phonetically related regional clusters (East Asian, North American, European).
    confidence: high
    relevance: high
  limitations:
  - Some accent conditions have very small listening panels, and classifier reliability limits interpretation of
    automatic accent-strength results.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts
    remain included but are marked low relevance.


