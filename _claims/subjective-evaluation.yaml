  current_role: active_evidence
  method_family:
  - flow_matching_generation
  - gan_adversarial_generation
  claims:
  - claim_id: a_causal_streaming_reformulation_of_conditional_flow_matching_that_jointly_e
    role: supports
    claim: A causal, streaming reformulation of conditional flow matching that jointly estimates multiple time-indexed
      vector fields per stream can match or exceed the quality of full-sequence, non-streaming flow-matching and
      GAN-based waveform generation baselines while operating under real-time streaming constraints.
    source: §4.2, Table 1
    evidence: The non-streaming StreamFlow variant outperforms parallel baselines (Vocos, Multi-Band Diffusion,
      RFWave) on M-STFT, PESQ, and UTMOS for EnCodec token reconstruction, and streaming StreamFlow variants outperform
      the streaming causal EnCodec baseline across all reported metrics.
    confidence: high
    relevance: medium
  - claim_id: regularizing_a_diffusion_transformer_s_residual_updates_by_normalizing_and_a
    role: supports
    claim: Regularizing a Diffusion Transformer's residual updates by normalizing and adaptively scaling the difference
      between a block's output and input, before the skip connection, can stabilize training and improve quality
      on high-resolution audio targets without increasing parameter count.
    source: §4.3, §4.4, Tables 2 and 4
    evidence: Replacing Scale-DiT with a vanilla DiT of the same parameter count degrades PESQ from 3.430 to 2.557
      and UTMOS from 3.792 to 3.033 on streaming Mimi-token reconstruction, and separately improves WER from 9.59
      to 6.23 at matched training steps before adversarial fine-tuning.
    confidence: high
    relevance: low
  - claim_id: a_learned_flow_matching_decoder_trained_for_token_reconstruction_can_outperf
    role: supports
    claim: A learned flow-matching decoder trained for token reconstruction can outperform a neural codec's own
      purpose-built causal convolutional decoder on both objective quality and human comparative preference, while
      remaining practical to substitute into an existing real-time speech-LM pipeline.
    source: §4.5, Tables 5-6, Appendix H
    evidence: StreamFlow outperforms the native Mimi decoder on WER, M-STFT, PESQ, pitch error, and UTMOS at matched
      bitrates, receives a positive CMOS preference from listeners, and was integrated as a drop-in replacement
      for the Mimi decoder in Moshi's full-duplex pipeline.
    confidence: high
    relevance: high
  - claim_id: streaming_flow_matching_pretraining_alone_is_not_sufficient_to_reach_full_ge
    role: complicates
    claim: Streaming flow-matching pretraining alone is not sufficient to reach full generation quality; a subsequent
      adversarial fine-tuning stage remains necessary, adding training cost and complexity beyond the core flow-matching
      objective.
    source: §4.3, Table 2
    evidence: Ablating adversarial fine-tuning drops PESQ from 3.430 to 2.669 and UTMOS from 3.792 to 3.178, and
      without prior flow-matching pretraining, adversarial training alone fails to produce working streaming generation,
      resulting in discriminator collapse.
    confidence: high
    relevance: medium
  limitations:
  - Perceptual gains accompany roughly doubled latency and higher memory use than Mimi's native decoder, while quality
    depends on a costly adversarial fine-tuning stage.
  caveats:
  - For subjective evaluation, this paper provides medium-relevance evidence; claims primarily concerning other
    concepts remain included but are marked low relevance.


- id: neurips-2025-SYcggdxX6W
  published_date: '2025-12-10'
  entry_date: '2026-09-19'
  year: 2025
  venue: NeurIPS
  task:
  - TTS
  architecture:
  - autoregressive-LM
  - flow-matching
  relevance: high
  evidence_role:
  - core_evidence
  - control_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - autoregressive_generation
  - flow_matching_generation
  claims:
  - claim_id: word_level_control_of_both_emotion_and_speaking_rate_in_a_pretrained_zero_sh
    role: supports
    claim: Word-level control of both emotion and speaking rate in a pretrained zero-shot TTS model can be achieved
      without any training data containing intra-sentence emotion or speed transitions, by using multi-round inference
      over multiple utterance-level emotional prompts with explicit transition smoothing.
    source: §4.2.1, Table 1
    evidence: Using only ESD's non-transition emotional prompts, WeSCon's first-stage teacher achieves state-of-the-art
      word-level emotion and speaking-rate control metrics with no transition-labeled training data, reducing transition
      discontinuity (DNSV) from 7.612-7.894 (CosyVoice2 baseline) to 4.21-4.58 across English and Chinese.
    confidence: high
    relevance: high
  - claim_id: the_fine_grained_expressive_control_ability_of_a_complex_multi_round_teacher
    role: supports
    claim: The fine-grained expressive control ability of a complex multi-round teacher inference pipeline can be
      distilled into a single end-to-end student model via self-training on teacher-generated pseudo-labels, eliminating
      the need for multi-round inference at deployment.
    source: §4.2.1, Tables 1-2
    evidence: The self-trained student model matches or slightly exceeds the multi-round teacher on nearly all objective
      and subjective metrics (e.g., DNSV improves from 4.980 to 4.210 on Chinese) while replacing multi-round concatenative
      inference with a single end-to-end forward pass.
    confidence: high
    relevance: high
  - claim_id: adding_fine_grained_expressive_controllability_to_a_pretrained_zero_shot_tts
    role: supports
    claim: Adding fine-grained expressive controllability to a pretrained zero-shot TTS model does not have to degrade
      its original zero-shot synthesis quality, if the control mechanism preserves the model's original input format.
    source: §4.2.1, Table 3
    evidence: On the standard zero-shot TTS benchmark SEED test-zh, WeSCon's fine-tuned model achieves CER and speaker
      similarity nearly identical to the unmodified CosyVoice2 backbone (CER 1.45 vs. 1.47, S-SIM 0.748 vs. 0.744).
    confidence: high
    relevance: high
  - claim_id: explicit_word_level_speaking_rate_control_is_not_an_independent_prosodic_dim
    role: complicates
    claim: Explicit word-level speaking-rate control is not an independent prosodic dimension from emotional expressiveness;
      removing it measurably degrades emotion-similarity metrics, not just rate accuracy.
    source: §4.2.2, Table 4
    evidence: Ablating the dynamic speed control mechanism degrades AutoPCP from 2.650 to 2.499 and emotion2vec
      similarity from 0.866 to 0.844, alongside the expected prosody-metric changes.
    confidence: high
    relevance: high
  - claim_id: self_training_data_scale_for_fine_grained_expressive_control_has_a_diminishi
    role: complicates
    claim: Self-training data scale for fine-grained expressive control has a diminishing and eventually reversing
      return when the underlying source dataset has limited emotional and speaker diversity, rather than benefiting
      monotonically from more synthetic training data.
    source: §4.2.2, Figure 5
    evidence: Performance of the self-trained student model peaks at 500 hours of teacher-generated data and declines
      beyond that point, which the authors attribute to overfitting given ESD's limited emotion categories and speaker
      identities.
    confidence: high
    relevance: medium
  limitations:
  - The 15-listener study covers fixed discrete emotions from ESD, without blended emotions, semantic transition
    modeling, or dynamically planned interactive responses.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts
    remain included but are marked low relevance.


- id: neurips-2025-SoRe80Tg48
  published_date: '2025-12-10'
  entry_date: '2026-09-19'
  year: 2025
  venue: NeurIPS
  task:
  - TTS
  architecture:
  - flow-matching
  relevance: medium
  evidence_role:
  - core_evidence
  - acceleration_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - flow_matching_generation
  claims:
  - claim_id: in_coarse_to_fine_flow_matching_tts_starting_the_flow_matching_sampling_proc
    role: supports
    claim: In coarse-to-fine flow-matching TTS, starting the flow-matching sampling process from an intermediate
      state constructed from the weak generator's coarse output, rather than from pure Gaussian noise, improves
      synthesis naturalness without changing the underlying flow-matching training objective's core theory.
    source: §5.1, Table 4
    evidence: Across four TTS backbones spanning both U-Net and DiT-based flow architectures, models trained with
      SFM consistently outperform matched baseline and ablated counterparts on pseudo-MOS metrics and comparative/similarity
      mean opinion scores.
    confidence: high
    relevance: high
  - claim_id: the_temporal_position_of_a_coarse_generator_s_output_on_a_flow_matching_prob
    role: supports
    claim: The temporal position of a coarse generator's output on a flow-matching probability path can be estimated
      adaptively during training via orthogonal projection onto the target, and this estimate benefits from a learned
      inference-time scaling correction rather than being used as-is.
    source: §5.1, Table 3
    evidence: The adaptively estimated intermediate-state time tends to be small during training; scaling it up
      at inference via the SFM strength hyperparameter improves both pseudo-MOS scores and WER up to an optimal
      value, after which quality declines as sampling becomes overly deterministic.
    confidence: high
    relevance: medium
  - claim_id: skipping_the_early_stages_of_a_flow_matching_sampling_trajectory_by_starting
    role: supports
    claim: Skipping the early stages of a flow-matching sampling trajectory by starting from a stabilized intermediate
      state can substantially reduce the number of adaptive-step ODE solver function evaluations needed, without
      affecting fixed-step solvers.
    source: §5.2, Table 5
    evidence: With the Bosh(3) adaptive solver, increasing SFM strength progressively reduces real-time factor by
      up to roughly 59% relative to the ablated model; the acceleration does not apply to fixed-step solvers, which
      always run a predetermined number of steps.
    confidence: high
    relevance: medium
  - claim_id: feeding_a_weak_generator_s_coarse_output_directly_as_an_additional_flow_matc
    role: complicates
    claim: Feeding a weak generator's coarse output directly as an additional flow-matching condition, on top of
      using it to construct the sampling start state, does not reliably improve and can degrade synthesis quality.
    source: §5.1, Table 4
    evidence: The SFM-c variant (coarse mel-spectrograms also used as a flow condition) causes the adaptively estimated
      start time to collapse toward zero in U-Net-based models, making the variant inapplicable there, and underperforms
      standard SFM in subjective evaluation for the DiT-based models where it remains applicable.
    confidence: high
    relevance: medium
  - claim_id: when_the_weak_generator_s_coarse_representation_carries_little_speaker_ident
    role: complicates
    claim: When the weak generator's coarse representation carries little speaker-identity information, using it
      to construct the flow-matching starting state can propagate that missing information forward, since errors
      introduced early in the flow are difficult for later sampling steps to correct.
    source: §5.1
    evidence: When CosyVoice's flow-module encoder receives only ASR-oriented semantic speech tokens (SFM-t) rather
      than tokens concatenated with speaker embeddings, speaker similarity and SMOS scores drop significantly.
    confidence: high
    relevance: medium
  limitations:
  - Naturalness gains are more consistent than WER or speaker-similarity gains, and acceleration applies to adaptive
