  - claim_id: combining_a_new_language_s_trainable_embeddings_with_a_frozen_backbone_s_exi
    role: supports
    claim: Combining a new language's trainable embeddings with a frozen backbone's existing embeddings for a previously-learned
      language can produce limited but perceptible code-switching ability, without any explicit joint multilingual
      training.
    source: §3.2.1, §4.1.3
    evidence: Merging Romanian adapter embeddings with the frozen model's original English character embeddings
      within the same utterance produced code-switched speech rated as showing promising naturalness in a dedicated
