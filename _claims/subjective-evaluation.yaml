      new language's pronunciation, a limitation not resolved by the adapter's capacity alone.
    source: §4.1.2
    evidence: Listeners rated a dedicated Romanian-specific baseline (MMS-TTS-RON) higher than the adapter-based
      approach on most pronunciation-and-naturalness test sentences, attributed in part to a perceptible residual
      English accent in the adapter-generated Romanian speech.
