  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: word_level_accuracy_metrics_such_as_wer_can_diverge_from_listeners_abili
    role: supports
    claim: Word-level accuracy metrics such as WER can diverge from listeners' ability to correctly retrieve key information from synthesized speech, so low WER does not guarantee high real-world comprehension.
    source: §4.4, Table 3
    evidence: FishSpeech V1.4 achieves the lowest WER (5.739%) among the four evaluated systems but the lowest SP-MCQA ACC (81.194%), while CosyVoice 2 has higher WER (9.044%) but the highest SP-MCQA ACC (90.399%)
    confidence: high
    relevance: high
  - claim_id: benchmarking_tts_systems_on_standard_read_speech_test_sets_can_understat
    role: complicates
    claim: Benchmarking TTS systems on standard read-speech test sets can understate intelligibility failures that occur specifically on irregular text such as proper nouns, digits, and abbreviations.
    source: §3.1, Table 5
    evidence: Annotator comments attribute system errors to mispronounced or dropped proper nouns and numbers (e.g., "Ala." rendered as "Alala" by MaskGCT or as silence by FishSpeech), a category of failure the benchmark specifically targets via its regex-based filtering for uppercase and multi-digit content
    confidence: high
    relevance: high
  - claim_id: text_normalization_and_phonetic_accuracy_on_rare_or_irregular_text_remai
    role: refines
    claim: Text normalization and phonetic accuracy on rare or irregular text remain unresolved failure modes for autoregressive and non-autoregressive TTS architectures alike, rather than being specific to one architecture family.
    source: §4.4, Table 4
    evidence: Phonetic errors are the most prevalent error type across all four evaluated systems regardless of architecture, though non-autoregressive systems (F5-TTS, MaskGCT) show comparatively more semantic and structural errors than autoregressive systems (CosyVoice 2, FishSpeech)
    confidence: high
    relevance: high
  - claim_id: multiple_choice_comprehension_based_subjective_evaluation_of_synthesized
    role: complicates
    claim: Multiple-choice comprehension-based subjective evaluation of synthesized speech requires substantial manual annotation effort, limiting its use as a routine, frequently-run metric compared to automated scores.
    source: §5
    evidence: The evaluation pipeline requires 40 screened human annotators with disagreement-driven re-annotation (up to four annotators per task) and golden-question quality filtering, which the authors identify as a scalability limitation motivating future work on Audio LLM-based automation
    confidence: high
    relevance: high
  limitations:
  - The human comprehension protocol is English-only, NPR-specific, annotation-intensive, and evaluated against a ground-truth ceiling degraded by preprocessing errors.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.


- id: '2511.00256'
