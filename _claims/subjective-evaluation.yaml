    role: supports
    claim: Combining a pretrained, discrimination-optimized speaker-verification embedding with a separately trained,
      synthesis-oriented embedding improves speaker identity preservation over using either alone.
    source: §4.3, Table 6
    evidence: An ablation shows the pretrained-encoder-only variant underperforms overall and the learnable-encoder-only
      variant achieves low WER but poor speaker similarity (SIM-o 0.495 vs. 0.655 for the full dual encoder), attributed
      to limited fine-tuning data.
    confidence: high
    relevance: low
