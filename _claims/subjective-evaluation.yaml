  method_family:
  - variational_latent_generation
  - gan_adversarial_generation
  claims:
  - claim_id: applying_differentiable_stylegan_style_data_augmentation_inside_the_adversar
    role: supports
    claim: Applying differentiable, StyleGAN-style data augmentation inside the adversarial training loop's discriminator
      feature space, rather than to the generated waveform directly, can improve pitch and timbre fidelity in singing
      voice synthesis without shifting the model's target output distribution.
    source: §IV-D, Table 1
    evidence: Adding differentiable noise augmentation to VISinger2's discriminator and generator forward passes
      improves Log F0 RMSE from 0.174 to 0.159 and MCD from 7.876 to 7.67 on Opencpop, while augmentation is applied
      only to discriminator-extracted features, not the generated waveform.
    confidence: high
    relevance: medium
  - claim_id: explicitly_predicting_a_singing_voice_synthesis_model_s_frame_level_posterio
    role: supports
    claim: Explicitly predicting a singing voice synthesis model's frame-level posterior uncertainty, supervised
      by reconstruction error, and combining it with adversarial training improves perceived naturalness beyond
      either technique alone.
    source: §IV-D, Table 1
    evidence: The combined strategy achieves the highest overall MOS (3.67 vs. 3.46 for the baseline) and the most
      best-or-second-best scores across all 8 evaluation metrics on Opencpop, exceeding either component applied
      individually.
    confidence: high
    relevance: high
  - claim_id: among_differentiable_augmentation_strategies_for_adversarial_singing_voice_s
    role: supports
    claim: Among differentiable augmentation strategies for adversarial singing-voice-synthesis training, additive
      noise perturbation to discriminator features generalizes better than time/frequency masking or their combination.
    source: §V-A, Table 2
    evidence: In an ablation comparing noise, masking, and combined noise+masking augmentation, additive noise alone
      achieves the highest number of best-or-second-best scores across the 8 evaluation metrics on Opencpop.
    confidence: high
    relevance: medium
  - claim_id: uncertainty_driven_training_improvements_for_singing_voice_synthesis_do_not
    role: complicates
    claim: Uncertainty-driven training improvements for singing voice synthesis do not transfer uniformly across
      all objective metrics when applied to a smaller-scale corpus in a different language; pitch and duration metrics
      can improve while spectral-distortion metrics slightly degrade.
    source: §V-B, Table 3
    evidence: On the Japanese Ofuton-P corpus (roughly 20% the size of Opencpop), the combined strategy improves
      Log F0 RMSE, semitone accuracy, VUV, and Sheet-SSQA relative to baseline, but shows a slight MCD degradation,
      attributed to a pitch-versus-timbre trade-off.
    confidence: high
    relevance: medium
  limitations:
  - Evaluation is limited to two single-singer corpora, and the smaller Japanese corpus shows a pitch-versus-timbre
    trade-off rather than uniform gains.
  caveats:
  - For subjective evaluation, this paper provides medium-relevance evidence; claims primarily concerning other
    concepts remain included but are marked low relevance.


- id: '2512.16519'
