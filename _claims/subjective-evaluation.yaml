  - claim_id: augmenting_speaker_timbre_extraction_with_domain_specific_target_style_d
    role: supports
    claim: Augmenting speaker/timbre extraction with domain-specific target-style data improves style preservation without requiring a redesigned embedding architecture.
    source: §2.3, Table 1
    evidence: Extending CAM++ with clean vocals, DNSMOS-filtered separated vocals, and public singing corpora (SETSE) raised SVC-Hard SMOS from 1.74±0.11 (w/o SETSE) to 2.64±0.10 in the full model.
