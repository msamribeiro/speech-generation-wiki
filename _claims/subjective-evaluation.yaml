- id: '2510.00743'
  published_date: '2025-10-01'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - evaluation
  architecture:
  - autoregressive-LM
  relevance: high
  evidence_role:
  - infrastructure
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - autoregressive_generation
  claims:
  - claim_id: automatic_reward_models_for_speech_quality_generalize_noticeably_worse_t
    role: supports
    claim: Automatic reward models for speech quality generalize noticeably worse to synthetic speech than to natural or mixed human speech, indicating a persistent domain gap in learned quality judgments.
    source: §5.1, Table 2
    evidence: Across all paradigms, accuracy on synthetic-speech-heavy datasets such as SOMOS (74.30-76.80%) and the VC/SVC-heavy VMC'23 OOD set (69.23-77.73%) trails accuracy on BVCC (82.60-86.70%) and NISQA (77.81-83.93%).
    confidence: high
    relevance: high
  - claim_id: preference_based_reward_models_for_speech_quality_remain_unreliable_at_f
    role: complicates
    claim: Preference-based reward models for speech quality remain unreliable at fine-grained discrimination, limiting their use for comparing systems of similar quality.
    source: §5.2, Figure 3
    evidence: A percentile-based error analysis shows error rates above 40% for the top-performing scalar model on the smallest-MOS-difference bin, declining sharply only as the MOS gap widens.
    confidence: high
    relevance: high
  - claim_id: explicitly_weighting_a_reward_model_s_training_signal_by_the_magnitude_o
    role: supports
    claim: Explicitly weighting a reward model's training signal by the magnitude of the ground-truth quality gap improves its ability to discriminate perceptually similar speech samples.
    source: §5.3, Table 3, Figure 4
    evidence: Adding a cosine-shaped MOS-difference reward term to GRM training raises accuracy on hard pairs (MOS difference ≤ 0.5) from 57.44% to 60.74% on TMHINT-QI (GRPO) and 62.79% to 65.12% on BVCC (DAPO), while improving overall accuracy by 0.48-1.06 points across all six evaluation sets.
    confidence: high
    relevance: high
  - claim_id: general_purpose_audio_language_models_used_directly_as_pairwise_judges_a
    role: complicates
    claim: General-purpose audio-language models used directly as pairwise judges are unreliable proxies for speech quality assessment without task-specific reward training.
    source: §5.1, Table 2
    evidence: Gemini-2.5-Pro and Qwen2.5-Omni-7B, evaluated as LLM-as-a-judge, both score below 70% overall accuracy on MOS-RMBench-Eval, trailing every trained scalar, semi-scalar, and generative reward model by 5-19 points.
    confidence: high
    relevance: high
  limitations:
  - The benchmark covers six languages and overall quality only; converting MOS into preferences changes the original score distribution, and code/data were unavailable.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.

- id: '2510.01722'
  published_date: '2025-10-02'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - transformer-enc-dec
  relevance: medium
  evidence_role:
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - transformer_encoder_decoder
  claims:
  - claim_id: explicit_classification_objectives_that_predict_target_attributes_e_g_em
    role: supports
    claim: Explicit classification objectives that predict target attributes (e.g., emotion, speaker identity) from disentangled embeddings provide a stronger and more reliable disentanglement signal than mutual-information minimization alone.
    source: §V-F, Table II
    evidence: Ablating both the Emotion/Speaker Predictors and MINE drops emotion-recognition UAA from 82.42% to 56.84% and worsens MCD from 8.23 to 9.71, a larger degradation than removing either component individually.
    confidence: high
    relevance: medium
  - claim_id: predicting_phoneme_level_rather_than_utterance_level_style_embeddings_fr
    role: supports
    claim: Predicting phoneme-level, rather than utterance-level, style embeddings from a reference signal improves perceived style/emotion similarity without degrading naturalness relative to global-style-vector baselines.
    source: §V-E, Table I
    evidence: The proposed phoneme-aware Emotion Extractor achieves the highest SMOS (3.41 ± 0.06) among all compared systems while matching the best baseline's MOS (3.63 vs. 3.62 for FS2+MIST), evaluated on the same FS2 backbone.
    confidence: high
    relevance: high
  - claim_id: fine_grained_style_embeddings_derived_from_a_reference_utterance_can_lea
    role: complicates
    claim: Fine-grained style embeddings derived from a reference utterance can leak the reference's lexical content into the synthesized output unless the conditioning pathway is explicitly constrained against it.
    source: §V-E
    evidence: The authors omit positional encoding from the reference mel-spectrogram features specifically to prevent "content leakage," and construct evaluation reference clips from a fixed, different-text utterance matching only speaker and emotion, to avoid an artificial similarity boost from shared lexical content.
    confidence: high
    relevance: high
  - claim_id: discrete_codec_derived_reference_embeddings_do_not_uniformly_outperform
    role: refines
    claim: Discrete-codec-derived reference embeddings do not uniformly outperform continuous mel-spectrogram reference embeddings for capturing emotional expressiveness.
    source: §V-E, Table I
    evidence: DC Comix TTS, which replaces the GST reference encoder with an EnCodec-style discrete-code encoder, scores the lowest emotion-recognition UAA (58.79%) of all four baselines, below both continuous-mel-based systems (FS2+GST 74.22%, FS2+MIST 76.17%) on the same evaluation protocol.
    confidence: high
    relevance: medium
  limitations:
  - The closed-set study uses one English emotional-speech corpus and ten known speakers; MOS parity does not establish unseen-speaker generalization.
  caveats:
  - For subjective evaluation, this paper provides medium-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.
- id: '2510.01903'
  published_date: '2025-10-02'
