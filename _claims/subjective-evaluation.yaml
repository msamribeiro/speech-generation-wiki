  - variational_latent_generation
  claims:
  - claim_id: a_frozen_externally_pre_trained_semantic_codebook_can_be_quantized_against_e
    role: supports
    claim: A frozen, externally pre-trained semantic codebook can be quantized against efficiently, with near-full
      codebook utilization, if the codebook itself is first transformed into the encoder's latent space by a lightweight
      learned projector, rather than looked up directly in its original space.
    source: §Ablation Study, Figure 3
    evidence: A naive direct lookup between the encoder and the fixed mHuBERT codebook yields near-zero (5%) codebook
      utilization and a UTMOS of 3.65, while the proposed codebook-space projection achieves nearly 100% utilization
      and a UTMOS of 4.04 on the same setup.
    confidence: high
    relevance: medium
  - claim_id: splitting_quantization_into_a_dedicated_semantic_stage_anchored_to_external
    role: supports
    claim: Splitting quantization into a dedicated semantic stage (anchored to external linguistic knowledge) and
      a dedicated acoustic-residual stage (using a globally-updated, collapse-resistant quantizer) allows a low-bitrate
      codec to achieve reconstruction quality and semantic richness simultaneously, where prior single-mechanism
      approaches had to trade one off against the other.
    source: §Ablation Study, Table 3
    evidence: At 1.5 kbps, SACodec achieves both a UTMOS of 4.0373 (comparable to or exceeding 6 kbps RVQ-based
      baselines) and an ARCH reconstruction-domain semantic accuracy of 0.6311 (on par with 6 kbps DAC), while removing
      either quantizer stage in ablation causes either a 30% collapse in semantic accuracy (removing the semantic
      anchor) or a 12.8% drop in PESQ (removing the residual activator).
    confidence: high
    relevance: high
  - claim_id: a_codec_s_semantic_token_quality_measured_on_raw_compressed_tokens_does_not
    role: complicates
    claim: A codec's semantic token quality measured on raw compressed tokens does not guarantee the same semantic
      quality survives after the codec's own reconstruction pipeline, so compressed-domain-only semantic evaluation
      can overstate a codec's practical semantic usefulness.
    source: §Results and Analysis, Table 2
    evidence: SpeechTokenizer achieves the highest compressed-domain ARCH accuracy (0.5099) among compared codecs
      but drops behind SACodec after reconstruction (0.6013 vs. SACodec's 0.6311), a discrepancy the authors attribute
      to its decoder not fully preserving the intrinsic semantics of its own tokens.
    confidence: high
    relevance: high
  - claim_id: optimizing_a_residual_quantizer_purely_for_semantic_accuracy_by_removing_its
    role: complicates
    claim: Optimizing a residual quantizer purely for semantic accuracy, by removing its dedicated acoustic-detail-recovery
      component, can locally improve a semantic metric while substantially degrading the reconstruction quality
      that downstream applications also depend on.
    source: §Ablation Study, Table 3
    evidence: Removing the Residual Activation module entirely ("semantic-only" configuration) yields the single
      highest compressed-domain semantic accuracy (0.5065) in the ablation study, but causes reconstruction PESQ
      to drop by 12.8% relative to the full model.
    confidence: high
    relevance: high
  limitations:
  - The MUSHRA result is English-only and downstream usefulness is inferred from reconstruction and classification
    rather than direct TTS or speech-language-model integration.
