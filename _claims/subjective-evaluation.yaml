  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: automatic_scoring_of_a_spoken_dialogue_model_s_response_whether_by_transcrib
    role: supports
    claim: Automatic scoring of a spoken dialogue model's response, whether by transcribing and LLM-judging the
      content or by scoring the response audio directly with an audio-aware judge or embedding model, correlates
      strongly with human listening judgments, supporting its use as a scalable proxy for human evaluation.
    source: §4.3, Appendix B.3, Tables 10-13
    evidence: Pairwise preference matching rates between GPT-4o mini scoring and human listeners exceed 70% on open-ended
      dialogue tasks and 90% on QA tasks, and rule-based (emotion2vec + WER) scoring for emotion generation matches
      human preference at 80% on average.
    confidence: high
    relevance: high
  - claim_id: adapting_a_text_based_llm_into_an_end_to_end_speech_in_speech_out_dialogue_m
    role: complicates
    claim: Adapting a text-based LLM into an end-to-end speech-in speech-out dialogue model substantially degrades
      the reasoning and knowledge-retrieval capability the backbone LLM had in text form.
    source: §4.2, Table 4
    evidence: On basic-track English reasoning, GLM-4-Voice scores 55.46 versus 76.29 for a cascaded Whisper + GLM-4-9B-Chat-HF
      baseline using the identical backbone LLM; other SDMs show similarly large drops relative to their backbones
      on datasets like MLC, Gsm8kEval, and OpenbookQA-zh.
    confidence: high
    relevance: medium
  - claim_id: current_end_to_end_spoken_dialogue_models_fail_to_leverage_non_lexical_acous
    role: complicates
    claim: Current end-to-end spoken dialogue models fail to leverage non-lexical acoustic information (environmental
      sound, music, speaker identity via timbre and pitch) even when their lexical content understanding is reasonable.
    source: §4.2 Pro Track discussion, Appendix B.2, Table 8
    evidence: All evaluated open-source SDMs perform close to random guessing on environmental sound and music comprehension
      tasks (ClothoEval-en, MuChoEval-en), and their ability to distinguish speakers by paralinguistic cues in multi-turn
      dialogue (SpeakerAware) is described as extremely weak; a cascaded ASR + audio-captioner + LLM baseline substantially
      outperforms the strongest SDM (GLM-4-Voice) on the same tasks, 64.00 vs 17.36 on ClothoEval.
    confidence: high
    relevance: medium
  - claim_id: larger_spoken_dialogue_models_with_more_diverse_generated_output_trade_off_s
    role: complicates
    claim: Larger spoken dialogue models with more diverse generated output trade off speech-text alignment fidelity
      against content quality, producing higher ASR-derived word/character error rates and lower automatic speech-quality
      scores than smaller, less diverse models.
    source: §4.2 Speech Quality and Speech-text Alignment, Table 5
    evidence: GLM-4-Voice (9B backbone) reaches 11.12% English ASR-WER versus SLAM-Omni's (0.5B backbone) 4.05%,
      attributed to larger models being more prone to long pauses and repetitions in generated audio; UTMOS follows
      the same pattern, with GLM-4-Voice (4.15) below SLAM-Omni (4.45).
    confidence: high
    relevance: high
  limitations:
  - Automatic scores are validated against human judgments, but content-scoring confounds remain and the benchmark
    does not cover every speech interaction setting.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts
    remain included but are marked low relevance.


