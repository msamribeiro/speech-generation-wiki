  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - autoregressive_generation
  claims:
  - claim_id: explicitly_generating_and_training_on_emphasis_aligned_parallel_translat
    role: supports
    claim: Explicitly generating and training on emphasis-aligned parallel translation data enables a cascaded speech translation model to preserve source-language stress more reliably than prompting general-purpose end-to-end audio LLMs.
    source: §5.1, Table 2
    evidence: StressTransfer achieves SSR 78.0 on EmphST-Bench, exceeding GPT-4o (47.4) and Gemini-2.5-Pro (68.4) prompted directly for stress-aware translation, and a cascaded ASR+stress-detection baseline (WhiStress+Qwen2.5-3B-Instruct, 72.9).
    confidence: high
    relevance: high
  - claim_id: pairing_an_emphasis_aware_text_level_translation_model_with_an_off_the_s
    role: supports
    claim: Pairing an emphasis-aware text-level translation model with an off-the-shelf prosody-controllable TTS synthesizer can transfer prosodic emphasis to synthesized target-language speech without a corresponding loss in perceived audio quality or translation intelligibility.
    source: §5.2, Table 4
    evidence: StressTransfer+TTS reaches UTMOS 3.86 and ASR-BLEU 50.26 on the StressTest corpus, comparable to or exceeding Gemini-2.5-Pro+TTS (3.91 / 48.47) and GPT-4o-audio (3.46 / 49.38), while both cascaded systems substantially outperform the direct S2ST baseline SeamlessExpressive (2.63 / 35.06).
    confidence: high
    relevance: high
  - claim_id: training_data_optimized_for_a_secondary_prosodic_objective_emphasis_pres
    role: complicates
    claim: Training data optimized for a secondary prosodic objective (emphasis preservation) can trade off marginally against standard semantic translation metrics.
    source: §5.3, Table 5
    evidence: Training without the EmphST-Instruct emphasis-aligned data yields slightly higher BLEU (47.4 vs. 46.9) and COMET (0.8362 vs. 0.8347) on CoVoST2 en-to-zh, though omitting the data removes the model's stress-aware translation capability entirely.
    confidence: high
    relevance: medium
  - claim_id: benchmarks_for_cross_lingual_prosodic_phenomena_such_as_emphasis_remain
    role: complicates
    claim: Benchmarks for cross-lingual prosodic phenomena such as emphasis remain small and narrow in language coverage, limiting confidence in how well reported gains generalize.
    source: §4.1, Table 1
    evidence: EmphST-Bench, the paper's own evaluation resource, contains only 218 parallel utterances restricted to a single language pair (English source, Chinese target), with average source utterances of just 6.95 words.
    confidence: high
    relevance: high
  limitations:
  - Subjective SSR uses four experts, and the LLM-judge agreement check covers only two systems with seven-rater majority vote on one language pair.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.
- id: '2510.13293'
  published_date: '2025-10-15'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  relevance: high
  evidence_role:
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - autoregressive_generation
  claims:
  - claim_id: in_autoregressive_tts_models_classifier_free_guidance_can_be_made_more_e
    role: supports
    claim: In autoregressive TTS models, classifier-free guidance can be made more effective at resolving competing conditioning signals by contrasting the target condition against the specific opposing signal rather than against an uninformative unconditional baseline.
    source: §2.2.1, §4.1, Table 3
    evidence: CCG-CFG, which substitutes the CFG dropout branch with the text-implied emotion when inconsistency is detected, raises EmoACC over CosyVoice2-CFG at the same nominal guidance-scale setting (e.g., CCG-CFG (H) reaches 64.79% EmoACC vs. 56.40% for CosyVoice2-CFG (H)) while WER is comparable.
    confidence: high
    relevance: medium
  - claim_id: increasing_emotional_expressiveness_in_autoregressive_tts_via_inference
    role: complicates
    claim: Increasing emotional expressiveness in autoregressive TTS via inference-time guidance amplification tends to trade off against intelligibility and perceived naturalness.
    source: §4.1, §4.2, Table 3, Table 5
    evidence: DS-CCG-CFG raises EmoACC to 64.83% over the 50.63% neutral-reference baseline but nearly doubles WER (from 4.61% to 7.86%) and lowers human-rated naturalness (NMOS 3.31) and quality (MOS 3.91) below the unguided baseline (NMOS 3.6, MOS 4.2).
    confidence: high
    relevance: high
  - claim_id: distilling_an_inference_time_guidance_signal_into_a_tts_model_s_weights
    role: supports
    claim: Distilling an inference-time guidance signal into a TTS model's weights via preference optimization can recover much of the guidance's expressiveness benefit while removing its synthesis-artifact cost and its two-pass decoding overhead.
    source: §4.1, §4.2, Table 3, Table 5
    evidence: DS-CCG-CFG-DPO+EXT. improves EmoACC to 59.55% over the 50.63% baseline while lowering WER to 3.76% (better than the unguided baseline's 4.61%) and achieving the highest human MOS (4.33), NMOS (3.94), and EMOS (3.67) scores of any configuration tested, without requiring inference-time two-pass CFG decoding.
    confidence: high
    relevance: high
  - claim_id: providing_a_target_emotion_reference_audio_clip_to_a_zero_shot_voice_clo
    role: complicates
    claim: Providing a target-emotion reference audio clip to a zero-shot voice cloning TTS system, rather than relying on a text-only emotion instruction, can leak style information that inflates apparent natural-language emotion-control performance.
    source: §4.1, Table 3
    evidence: CosyVoice2 with Natural Language Emotion Control achieves 65.11% EmoACC when given a rendered-emotion reference clip, dropping to 50.63% when the reference is replaced with a neutral-emotion clip, leading the authors to adopt the neutral-reference condition as the realistic baseline for all subsequent experiments.
    confidence: high
    relevance: high
  limitations:
  - Human evaluation covers 14 samples, and automated subjective judging depends on proprietary external LLMs.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.

- id: '2510.15364'
  published_date: '2025-10-17'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - codec
  architecture:
  - GAN
  relevance: medium
  evidence_role:
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - gan_adversarial_generation
  claims:
  - claim_id: a_redesigned_residual_unit_channel_expansion_alternative_periodic_activa
    role: supports
    claim: A redesigned residual unit (channel-expansion, alternative periodic activation, channel-shrinkage) can recover reconstruction quality lost to a low-complexity decoder budget more effectively than simply narrowing an existing codec's channel width.
    source: §III.C, Table II
    evidence: Removing the proposed residual unit (leaving a plain channel-pruned decoder) drops ViSQOL from 4.14 to 3.97 even though decoder compute is nearly identical (0.26 vs 0.28 GMACs).
    confidence: high
    relevance: low
  - claim_id: splitting_a_codec_s_latent_features_into_separately_quantized_long_term_
    role: supports
    claim: Splitting a codec's latent features into separately-quantized long-term and short-term streams to exploit inter-frame temporal correlation improves reconstruction fidelity over quantizing each frame independently, at matched bitrate and decoder complexity.
    source: §III.C, Table II
    evidence: Removing the long/short-term split (LSRVQ) and quantizing features directly increases STFT distance from 1.46 to 1.507 at the same 6kbps bitrate and 0.26 GMACs decoder budget.
    confidence: high
    relevance: low
  - claim_id: a_neural_codec_decoder_s_compute_budget_can_be_reduced_by_two_orders_of_
    role: supports
    claim: A neural codec decoder's compute budget can be reduced by two orders of magnitude relative to a full-size baseline while retaining most of its objective reconstruction quality, provided the compute reduction is paired with targeted architectural changes rather than uniform channel pruning alone.
    source: §III.B, Table I
    evidence: LDCodec's decoder (0.26 GMACs) reaches ViSQOL 4.14 versus official DAC's 4.17 at 43.3 GMACs, a roughly 166x compute reduction for a 0.03 ViSQOL gap, while a naively channel-pruned decoder (DACLite) at similarly low compute (0.28 GMACs) only reaches ViSQOL 3.97.
    confidence: high
    relevance: low
  - claim_id: objective_distance_based_codec_metrics_and_subjective_listening_test_sco
    role: complicates
    claim: Objective distance-based codec metrics and subjective listening-test scores do not rank low-bitrate neural codecs consistently, so compute- or bitrate-matched comparisons need both kinds of evidence before declaring one codec superior.
    source: §III.B, Table I, Figure 3
    evidence: FunCodec and DACLite differ only modestly in objective ViSQOL (3.89 vs 3.97) but diverge sharply in the subjective test (2.94 vs 4.14 MOS), and Opus at 12kbps and LDCodec at 6kbps are close on ViSQOL (4.11 vs 4.14) while the subjective gap is similarly close but not proportionally the same (4.10 vs 4.24).
    confidence: high
    relevance: high
  limitations:
  - The subjective test uses 40 internal multilingual sequences, with no reported confidence intervals, significance tests, public benchmark, or independent replication.
  caveats:
  - For subjective evaluation, this paper provides medium-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.


- id: '2510.16841'
  published_date: '2025-10-19'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - codec
  - TTS
  architecture:
  - GAN
  - VAE
  - autoregressive-LM
  relevance: low
  evidence_role:
  - core_evidence
  current_role: minor
  method_family:
  - gan_adversarial_generation
  - variational_latent_generation
  - autoregressive_generation
  claims:
  - claim_id: fully_separating_semantic_and_acoustic_token_streams_rather_than_fusing_
    role: supports
    claim: Fully separating semantic and acoustic token streams (rather than fusing semantic features into a shared representation before quantization) improves semantic representation quality without sacrificing reconstruction fidelity.
    source: §5.1, §5.2, Table 1, Table 3
    evidence: On the ARCH benchmark, SAC's dual-stream tokens reach 56.94–57.57% average accuracy, roughly 10 points above the best "X-shaped" fused codec (XY-Tokenizer, 46.96%), while simultaneously achieving state-of-the-art UTMOS and WER on LibriSpeech test-clean reconstruction at comparable bitrates.
    confidence: high
    relevance: low
  - claim_id: a_dual_stream_codec_can_achieve_near_complete_disentanglement_between_li
    role: supports
    claim: A dual-stream codec can achieve near-complete disentanglement between linguistic content and speaker identity purely through architectural separation, without an explicit adversarial or information-bottleneck disentanglement objective.
    source: §5.5, Table 5, Figure 4
    evidence: Semantic-only (acoustic-masked) reconstruction reaches WER 3.99% (vs. 30.67% for the comparable dual-stream codec SemantiCodec) while SIM collapses to 0.17, and mel-spectrogram analysis shows semantic-only decoding retains no speaker-specific formant structure.
    confidence: high
    relevance: low
  - claim_id: explicit_auxiliary_semantic_supervision_during_codec_decoder_training_is
    role: refines
    claim: Explicit auxiliary semantic supervision during codec decoder training is far less necessary when the semantic stream is architecturally isolated from the reconstruction objective, contrary to codec designs that fuse semantic and acoustic tokens before quantization.
    source: §5.3, §Appendix H, Table 4, Table 13
    evidence: Removing the semantic supervision loss L_sem causes only a slight PESQ drop and under 1% change in ARCH semantic-representation accuracy for SAC, whereas prior "X-shaped" models (e.g., XY-Tokenizer) are reported to suffer substantial ASR-probing degradation without equivalent supervision.
    confidence: high
    relevance: low
  - claim_id: gains_in_codec_token_intelligibility_for_downstream_generative_modeling_
    role: complicates
    claim: Gains in codec-token intelligibility for downstream generative modeling can come at the cost of speaker similarity when using coarser (lower frame-rate) token configurations.
    source: §Appendix D, Table 9
    evidence: The single-stage AR TTS model built on the 37.5 Hz SAC tokenizer achieves markedly lower WER/CER than pure-AR baselines on Seed-TTS-eval, but shows a slight SIM reduction, which the authors attribute to the coarser temporal granularity of the low-bitrate variant relative to the 50 Hz codecs used by the baselines.
    confidence: high
    relevance: medium
  limitations:
  - The MOS study is limited to 20 listeners and 30 low-bitrate utterances, while higher-bitrate systems were excluded after pilot judgments.
  caveats:
  - For subjective evaluation, this paper provides low-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.


- id: '2510.19509'
  published_date: '2025-10-22'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - infrastructure
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: evaluation_protocols_for_speech_foundation_models_must_be_matched_to_the
    role: supports
    claim: Evaluation protocols for speech foundation models must be matched to the specific capabilities a model exposes, since a task that assumes a capability the model lacks yields an infeasible or misleading evaluation.
    source: §3.2
    evidence: The Foundation Model Capability axis (Axis 2) enumerates seven capability types and shows, for example, that encoder-only representation models cannot be meaningfully assessed with generation-based distributional metrics such as Fréchet Audio Distance, while generative models without exposed frame-level representations cannot be probed with intrinsic tasks like ABX discrimination or sWUGGY.
    confidence: high
    relevance: medium
  - claim_id: current_speech_evaluation_benchmarks_systematically_underrepresent_paral
    role: complicates
    claim: Current speech evaluation benchmarks systematically underrepresent paralinguistic/prosodic, indexical, and aesthetic aspects relative to linguistic and acoustic-fidelity aspects, leaving expressive and social dimensions of speech comparatively unmeasured.
    source: §4.2
    evidence: Section 4.2 documents that paralinguistic/prosodic evaluation remains rare and unstandardized (limited to recent efforts like EmphAssess and StressTest), indexical aspects are typically treated as nuisance classification rather than integral evaluation dimensions, and aesthetic evaluation relies mainly on MOS and a small set of automatic predictors with little cross-domain validation.
    confidence: high
    relevance: high
  - claim_id: automatic_evaluation_via_auxiliary_scoring_models_inherits_the_biases_an
    role: complicates
    claim: Automatic evaluation via auxiliary scoring models inherits the biases and limitations of the auxiliary model, so measured performance can reflect properties of the scorer rather than the system under test.
    source: §3.3
    evidence: The Task/Protocol Requirement axis identifies "Evaluation with Auxiliary Models" (e.g., ASR-based WER on synthesized speech, or ASR+LLM pipelines in AudioBench and VoiceBench) as scalable but introducing an additional layer of dependency that must be considered when interpreting results.
    confidence: high
    relevance: high
  - claim_id: interactive_full_duplex_spoken_dialogue_capabilities_such_as_streaming_t
    role: refines
    claim: Interactive, full-duplex spoken dialogue capabilities such as streaming, turn-taking, and backchanneling require a distinct real-time-interaction evaluation axis that current benchmarks address far less thoroughly than offline generation or recognition tasks.
    source: §3.2, §5
    evidence: Full-Duplex-Bench is identified as one of the few benchmarks explicitly targeting the Real-Time Streaming and Interaction capability, and §5 flags interactive/full-duplex evaluation as a systematic blind spot alongside meaning-preservation for discrete or latent semantic units.
    confidence: high
    relevance: medium
  limitations:
  - The taxonomy is illustrative rather than exhaustive, excludes language coverage, and has not been validated through practitioner use or inter-rater coding.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.


- id: '2510.20210'
  published_date: '2025-10-23'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - TTS
  - evaluation
  architecture:
  - transformer-enc-dec
  relevance: medium
  evidence_role:
  - core_evidence
  - infrastructure
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - transformer_encoder_decoder
  claims:
  - claim_id: a_single_evaluator_that_jointly_localizes_acoustic_errors_and_predicts_h
    role: supports
    claim: A single evaluator that jointly localizes acoustic errors and predicts holistic quality can substitute for a cascade of separate ASR, alignment, and quality-assessment tools in TTS quality control.
    source: §Main Results, Table 2
    evidence: Vox-Evaluator, trained on the FGES dataset, achieves a segment-localization IOU of 0.782 versus 0.653 for a fine-tuned wav2vec2.0 baseline, and a transcription WER of 2.64% versus 3.43%/3.05% for SenseVoice/Whisper-S, with a comparable or smaller parameter count.
    confidence: high
    relevance: high
  - claim_id: detecting_and_regenerating_only_the_erroneous_segments_of_zero_shot_tts_
    role: supports
    claim: Detecting and regenerating only the erroneous segments of zero-shot TTS output, rather than fully re-synthesizing an utterance, can materially reduce word error rate on hard cases without any additional model fine-tuning.
    source: §Main Results, Table 3
    evidence: Evaluator-guided correction on Seed-TTS test-en reduces WER by 21% for F5-TTS (1.73% → 1.42%) and by 32% for VoiceCraft (7.56% → 5.11%), consistent across LibriSpeech-PC test-clean as well.
    confidence: high
    relevance: medium
  - claim_id: restricting_a_preference_optimization_loss_to_timestamp_localized_error_
    role: supports
    claim: Restricting a preference-optimization loss to timestamp-localized error segments, rather than computing it over the full utterance, improves the intelligibility and speaker-similarity gains obtainable from DPO-based alignment of TTS models.
    source: §Fine-grained Preference Alignment, Figure 3
    evidence: Segment-level DPO guided by Vox-Evaluator lowers F5-TTS's WER from 1.73% to 1.55% and raises Sim-o to 0.683 over 2000 training steps, with parallel improvement in CMOS and SMOS.
    confidence: high
    relevance: low
  - claim_id: preference_alignment_gains_from_a_learned_reward_model_plateau_and_can_r
    role: complicates
    claim: Preference-alignment gains from a learned reward model plateau and can reverse with continued training once the reward signal saturates.
    source: §Fine-grained Preference Alignment
    evidence: The paper reports that continued DPO training beyond the early stage decreases model performance because the feedback reward saturates once high-quality samples exhibit minimal variation, increasing the difficulty of further preference optimization.
    confidence: high
    relevance: medium
  - claim_id: the_benefit_of_automatic_error_detection_guided_correction_is_backbone_d
    role: complicates
    claim: The benefit of automatic error-detection-guided correction is backbone-dependent, since backbones that already fail less often leave less room for the same correction mechanism to improve.
    source: §Ablation Study, Table 4
    evidence: Ablation on TTSDS2 shows F5-TTS's failure rate drops from 12% to 6% with error detection alone, and the authors note F5-TTS is inherently less prone to speech corruption than VoiceCraft under the same pipeline.
    confidence: high
    relevance: medium
  limitations:
  - The evaluator is trained on synthetic induced errors and tested on only two editing-capable TTS backbones, leaving real-world failure coverage and broader transfer uncertain.
  caveats:
  - For subjective evaluation, this paper provides medium-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.


- id: '2510.20513'
  published_date: '2025-10-23'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - SCA
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - core_evidence
  - infrastructure
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: decomposing_a_holistic_subjective_speech_quality_construct_into_interpre
    role: supports
    claim: Decomposing a holistic, subjective speech quality construct into interpretable sub-dimensions and fusing them with a lightweight, separately-trained model can approximate human preference judgments with high data efficiency.
    source: §2.3, §4.1, Table 2
    evidence: The XGBoost preference-fusion function, trained on only 480 human-annotated clips using three proxy sub-scores as input, reaches SRCC = 0.86 and PCC = 0.91 against averaged human expressiveness ratings.
    confidence: high
    relevance: high
  - claim_id: an_automatic_expressiveness_metric_aligned_with_human_judgment_can_relia
    role: supports
    claim: An automatic expressiveness metric aligned with human judgment can reliably rank competing speech generation systems, offering a scalable substitute for comparative listening tests at the system level.
    source: §4.2, Table 3
    evidence: DeEAR ranks seven SOTA speech-to-speech dialogue systems with SRCC = 0.96 against human rankings and reproduces the near-60-point gap between the highest- and lowest-scoring systems.
    confidence: high
    relevance: high
  - claim_id: filtering_training_data_with_an_automatic_expressiveness_score_can_subst
    role: supports
    claim: Filtering training data with an automatic expressiveness score can substantially increase the expressiveness of a fine-tuned speech generation model without any architectural change to that model.
    source: §4.3.2, Table 4
    evidence: Fine-tuning an existing speech-to-speech model on 51 hours of DeEAR-selected utterances (threshold 63.5) for a single epoch raised the overall expressiveness score from 2.0 to 23.4 (p < 0.001), corroborated by a 78.5%-vs-10% human A/B preference for the fine-tuned model.
    confidence: high
    relevance: high
  - claim_id: using_a_general_purpose_llm_as_a_scalable_proxy_annotator_for_a_subjecti
    role: complicates
    claim: Using a general-purpose LLM as a scalable proxy annotator for a subjective perceptual dimension yields only moderate alignment with human judgment, so its labels should be treated as a noisy training signal rather than as ground truth.
    source: §2.2.2, §4.1, Table 2
    evidence: Gemini 2.5 Pro, used to generate prosodic-richness training labels, itself reaches only SRCC = 0.73 against human ratings, and the resulting Prosody sub-scorer is the weakest of the three dimensions against holistic human perception (PCC = 0.70, SRCC = 0.68).
    confidence: high
    relevance: high
  - claim_id: heuristic_pseudo_labeling_of_a_perceptual_attribute_at_the_dataset_level
    role: complicates
    claim: Heuristic pseudo-labeling of a perceptual attribute at the dataset level, rather than the individual-utterance level, caps the precision of any model subsequently distilled from those labels.
    source: §2.2.3
    evidence: The spontaneity pseudo-label heuristic assigns a single manually-set categorical base level per source dataset, combined with a DNSMOS-derived acoustic-quality adjustment, so utterance-level variation in true spontaneity within a dataset is not captured by the label itself.
    confidence: high
    relevance: medium
  limitations:
  - Human validation uses small, narrow rater pools, and the same automatic metric both selects training data and supplies the headline downstream evaluation score.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.


- id: '2510.20677'
