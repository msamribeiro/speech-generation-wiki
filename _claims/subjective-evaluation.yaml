  - gan_adversarial_generation
  - variational_latent_generation
  claims:
  - claim_id: jointly_quantizing_pairs_of_latent_channels_onto_a_structured_2d_geometric_g
    role: supports
    claim: Jointly quantizing pairs of latent channels onto a structured 2D geometric grid can capture inter-channel
      correlations that per-channel scalar quantization (FSQ) discards, while preserving FSQ's high codebook utilization
      without a learned codebook.
    source: §4.2, Table 3
    evidence: In a controlled comparison that changes only the quantization layer within an otherwise identical
      codec framework, Q2D2 at 1 kbps outperforms both FSQ and VQ on UTMOS, PESQ, STOI, and V/UV F1 across LibriTTS
      test-clean, LibriTTS test-other, and LJSpeech.
    confidence: high
    relevance: low
  - claim_id: the_choice_of_2d_tiling_geometry_materially_affects_reconstruction_quality_a
    role: supports
    claim: The choice of 2D tiling geometry materially affects reconstruction quality at matched bitrate and level
      count, with denser, more isotropic packings yielding lower quantization error.
    source: §5, Table 8
    evidence: Under matched conditions, rhombic grids consistently outperform rectangular and hexagonal grids on
      PESQ and STOI; the authors attribute this to the rhombic lattice's higher packing efficiency (smaller, more
      uniformly distributed neighbor distances) compared to the other two tilings.
    confidence: high
    relevance: low
  - claim_id: a_single_quantizer_geometry_aware_codec_can_match_or_exceed_the_codebook_uti
    role: supports
    claim: A single-quantizer, geometry-aware codec can match or exceed the codebook utilization of FSQ-family quantizers
      while operating at substantially lower token rates than multi-quantizer RVQ codecs, without auxiliary stabilization
      tricks such as commitment losses or codebook reseeding.
    source: §5, Table 10
    evidence: Across tested grid-level configurations, codebook utilization ranges from 92.18% to 99.47%, achieved
      without commitment losses, EMA, or codebook reinitialization, the auxiliary techniques VQ and RVQ require
      to avoid collapse.
    confidence: high
    relevance: low
  - claim_id: discrete_codec_tokens_optimized_primarily_for_reconstruction_fidelity_are_no
    role: complicates
    claim: Discrete codec tokens optimized primarily for reconstruction fidelity are not automatically validated
      as suitable inputs for downstream autoregressive generation; that transfer must be checked separately.
    source: §4.2, Table 6
    evidence: The paper trains a separate 600M-parameter ParlerTTS-based autoregressive TTS model on Q2D2, WavTokenizer,
      and DAC tokens specifically to verify generative usability, reporting CMOS-Q and CMOS-P rather than assuming
      reconstruction-quality rankings transfer directly to generation quality.
    confidence: high
    relevance: high
  - claim_id: a_quantizer_s_core_design_choices_interact_with_each_other_in_ways_that_are
    role: complicates
    claim: A quantizer's core design choices interact with each other in ways that are not decomposable; changing
      dimensionality or level count while holding grid geometry fixed shifts the optimal operating point rather
      than uniformly improving or degrading quality.
    source: §5, Table 9
    evidence: The dimension-size ablation shows a 6-dimensional (3-pair) configuration outperforms both an 8-dimensional,
      lower-resolution configuration and a 4-dimensional, higher-resolution configuration at the same 1 kbps bitrate,
      indicating a non-monotonic trade-off between dimensionality and per-dimension resolution.
    confidence: high
    relevance: low
  limitations:
  - Downstream subjective coverage is limited, and the full codec method is evaluated in only one framework.
  caveats:
  - For subjective evaluation, this paper provides medium-relevance evidence; claims primarily concerning other
    concepts remain included but are marked low relevance.


- id: '2512.03486'
