  claims:
  - claim_id: replacing_a_general_purpose_semantic_encoder_with_a_language_specific_as
    role: supports
    claim: Replacing a general-purpose semantic encoder with a language-specific ASR encoder improves content preservation in zero-shot voice conversion for a low-resource target language.
    source: §4.2, §5.2, Table 2
    evidence: Substituting Seed-VC's original Whisper-small encoder with PhoWhisper-large (Vietnamese-adapted, 1.55B params, 4.67% WER on VIVOS) is credited with the lowest WER (9.83%) among four VLSP 2025 shared-task submissions.
    confidence: high
    relevance: low
  - claim_id: perturbing_source_speech_timbre_during_training_rather_than_only_at_infe
    role: supports
    claim: Perturbing source-speech timbre during training (rather than only at inference) helps align the training objective with the inference-time voice-conversion task and can reduce residual source-identity leakage.
    source: §4.2
    evidence: An external timbre shifter (OpenVoiceV2) perturbs speaker timbre during training only, so the model is not simply trained to reconstruct source timbre; the resulting system achieves the lowest WER and highest MOS on the shared-task leaderboard, though the isolated effect of this component alone is not measured.
    confidence: high
