  claims:
  - claim_id: professional_human_speech_recordings_preserve_fine_grained_paralinguisti
    role: supports
    claim: Professional human speech recordings preserve fine-grained paralinguistic attributes (emotion, tone, prosody) substantially better than current text-to-speech systems, as judged by human listeners.
    source: Appendix E, "Voice Quality Assessment"
    evidence: A 10-rater MOS study on 100 paralanguage-focused queries rated professional human recordings at 4.6/4.5 (attribute match/naturalness) versus 2.4/2.1 for CosyVoice2 and 3.1/3.3 for ElevenLabs TTS.
    confidence: high
    relevance: high
  - claim_id: omni_modal_voice_assistants_that_consume_both_speech_and_visual_input_te
    role: complicates
    claim: Omni-modal voice assistants that consume both speech and visual input tend to under-utilize non-verbal speech cues relative to visual or textual cues when producing a response, even when the speech cue is necessary for correctness.
    source: §5.1.2, §5.2, Table 2, Figure 4
    evidence: 'Across all ten evaluated models, visual grounding scores (e.g., Gemini 2.5 Pro: 91.6-92.0%) are consistently far higher than speech grounding scores (e.g., Gemini 2.5 Pro: 54.75-77.42%), and manual error analysis attributes 75.3% of Gemini''s failures to speech-perception errors versus 7.0% to downstream reasoning errors.'
    confidence: high
    relevance: medium
  - claim_id: aggregate_accuracy_on_speech_grounded_evaluation_tasks_can_substantially
    role: complicates
    claim: Aggregate accuracy on speech-grounded evaluation tasks can substantially overstate a model's genuine reliance on the speech signal, because models can arrive at a correct-seeming answer through modality shortcuts rather than by attending to the intended cue.
    source: §5.3, Figure 5
    evidence: Confounder-pair analysis shows Gemini 2.5 Pro and Qwen2.5-Omni fail to change their answer in 57% and 51% of pairs respectively when the underlying speech property is flipped while text and visual content are held constant, despite both models showing roughly 50% raw accuracy on these items.
    confidence: high
    relevance: high
  - claim_id: an_llm_as_judge_protocol_when_grounded_in_a_reference_answer_rationale_a
    role: supports
    claim: An LLM-as-judge protocol, when grounded in a reference answer, rationale, and modality-specific metadata, can approximate expert human judgment for scoring the contextual appropriateness of multimodal dialogue responses.
    source: Appendix D, "Human vs. LLM Evaluation Experiment"
    evidence: On a blind 300-sample validation, human-LLM inter-rater agreement (Cohen's κ = 0.78) approached human-human agreement (κ = 0.82), with the LLM's rating falling within one point of the expert average in 92% of cases.
    confidence: high
    relevance: high
  limitations:
  - The benchmark scores model responses as text rather than evaluating their generated speech, and judge validation covers only a 300-sample English subset.
  caveats:
