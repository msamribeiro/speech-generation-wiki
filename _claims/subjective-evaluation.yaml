- id: '2510.24372'
  published_date: '2025-10-28'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - core_evidence
  current_role: active_evidence
  method_family:
  - autoregressive_generation
  claims:
  - claim_id: replacing_a_fixed_variance_gaussian_sampling_prior_with_a_dynamically_es
    role: supports
    claim: Replacing a fixed-variance Gaussian sampling prior with a dynamically estimated Bayesian evidential distribution over acoustic targets improves the robustness and speaker similarity of continuous-valued autoregressive TTS without adding parameters or inference latency.
    source: §6.1, Table 2
    evidence: Under identical training data, architecture, and evaluation pipeline, replacing the Gaussian KL sampling objective with the Normal-Inverse-Gamma evidential loss reduces Cross-Sentence WER-H from 3.83% to 2.99% and raises SIM-r from 0.652 to 0.679.
    confidence: high
    relevance: medium
  - claim_id: synthetic_speech_from_multiple_diverse_pretrained_tts_systems_can_serve_
    role: supports
    claim: Synthetic speech from multiple diverse pretrained TTS systems can serve as a statistical support set for variance estimation in single-reference TTS corpora, rather than as imitation targets, and generation quality improves as teacher diversity increases.
    source: §6.3, Table 4
    evidence: Under the proposed weighted "one-to-many" loss, WER and speaker-similarity metrics improve monotonically as the number of teacher models grows from 0 (GT only) to 2 to 6 on a fixed reduced-scale dataset.
    confidence: high
    relevance: low
  - claim_id: increasing_the_volume_of_pooled_multi_source_synthetic_training_data_doe
    role: complicates
    claim: Increasing the volume of pooled multi-source synthetic training data does not by itself explain quality gains in continuous AR TTS, and naive augmentation without a variance-aware weighting scheme can underperform a smaller, principled multi-teacher training set.
    source: §6.3, Table 4
    evidence: A data-augmentation baseline trained on the same total pooled data volume as GT+6 TTS underperforms the smaller GT+2 TTS configuration on multiple WER and similarity metrics.
    confidence: high
    relevance: low
  - claim_id: a_continuous_valued_autoregressive_tts_architecture_with_variance_aware_
    role: supports
    claim: A continuous-valued autoregressive TTS architecture with variance-aware evidential sampling can be adapted to chunked streaming generation while remaining competitive with dedicated streaming baselines.
    source: §6.4, Table 5
    evidence: BELLE-stream attains the lowest WER among compared streaming systems (WER-C 3.54%, WER-H 4.44%), outperforming SMLLE and IST-LM, while reaching a real-time factor of 0.55 and a first-packet latency of about 440ms with a 0.8-second audio chunk.
    confidence: high
    relevance: medium
  - claim_id: the_degree_of_stochastic_diversity_in_evidential_autoregressive_speech_g
    role: refines
    claim: The degree of stochastic diversity in evidential autoregressive speech generation can be controlled at inference time via a single sampling-distribution hyperparameter, trading diversity against robustness.
    source: §6.2, Table 3, Table 7
    evidence: Doubling the Normal-Inverse-Gamma scale parameter β increases within-prompt diversity metrics (cosine distance from 0.0037 to 0.0053) but raises Cross-Sentence WER-C from 2.45% to 3.33% and slightly lowers SIM-o.
    confidence: high
    relevance: medium
  limitations:
  - Evaluation is English-only, and the strongest comparisons are not matched for training scale; several ablations use a reduced dataset.
  caveats:
  - For subjective evaluation, this paper provides medium-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.


