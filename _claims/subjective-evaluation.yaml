  claims:
  - claim_id: explicitly_perturbing_fundamental_frequency_during_training_and_forcing_
    role: supports
    claim: Explicitly perturbing fundamental frequency during training and forcing reconstruction of the clean target reduces a voice conversion model's reliance on noisy F0 tracking, improving robustness to real-world pitch extraction errors.
    source: §2.2, Table 1
    evidence: 'Random jitter/glide/jump F0 perturbation applied to 2-4 segments per sample, combined with reconstruction-of-clean-target training, drove the largest naturalness ablation effect: removing this module (w/o SRE) dropped SVC-Hard NMOS from 2.90±0.11 to 2.23±0.21.'
    confidence: high
