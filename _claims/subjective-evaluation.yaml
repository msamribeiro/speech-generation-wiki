  claims:
  - claim_id: a_simple_input_perturbation_plus_bottleneck_training_strategy_can_disent
    role: supports
    claim: A simple input-perturbation-plus-bottleneck training strategy can disentangle a target speech attribute from a neural codec's latent representation without requiring an adversarial loss or auxiliary predictor.
    source: §4.1, Figure 2
    evidence: Flattening and randomly shifting F0 at the input while conditioning the flow decoder on the true F0, combined with an RVQ bottleneck, yields the lowest F0-RMSE among bottleneck-only, adversarial, and adversarial+HuBERT variants tested on the same backbone.
    confidence: high
    relevance: medium
  - claim_id: disentangling_one_speech_attribute_via_information_bottlenecks_or_pertur
    role: complicates
    claim: Disentangling one speech attribute via information bottlenecks or perturbation can degrade other attributes the system is meant to preserve, such as speaker identity.
    source: §5, Table 1
    evidence: PitchFlower shows lower speaker similarity than SiFiGAN, attributed to distortions introduced by the WORLD-based F0-flattening transformation used to perturb the training input.
    confidence: high
    relevance: high
  - claim_id: adding_a_self_supervised_semantic_distillation_loss_to_a_codec_s_trainin
    role: complicates
    claim: Adding a self-supervised semantic distillation loss to a codec's training objective does not uniformly improve disentanglement quality; its effect depends on which base disentanglement mechanism it is combined with.
    source: §4.1
    evidence: Adding HuBERT distillation improved F0 controllability for the bottleneck and adversarial variants but was detrimental across all metrics (WER, speaker similarity, UTMOS, and F0-RMSE) when combined with PitchFlower's perturbation-based mechanism.
    confidence: high
    relevance: medium
  - claim_id: the_controllability_of_a_bottleneck_based_disentanglement_mechanism_depe
    role: refines
    claim: The controllability of a bottleneck-based disentanglement mechanism depends on the type and capacity of the quantizer, not just its presence.
    source: §6.1, Figure 4
    evidence: At matched capacity, RVQ bottlenecks preserve pitch controllability more robustly than FSQ bottlenecks as capacity increases, and controllability degrades for both as bottleneck capacity grows.
    confidence: high
    relevance: low
  limitations:
  - The subjective comparison is confined to LibriTTS and does not test downstream TTS or singing applications; controllable range follows the narrow training-data F0 distribution.
  caveats:
  - For subjective evaluation, this paper provides medium-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.


- id: '2510.26190'
  published_date: '2025-10-30'
