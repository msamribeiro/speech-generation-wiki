  method_family:
  - variational_latent_generation
  - gan_adversarial_generation
  claims:
  - claim_id: structuring_a_tokenizer_to_compress_genuinely_two_dimensional_time_frequ
    role: supports
    claim: Structuring a tokenizer to compress genuinely two-dimensional time-frequency data, rather than folding frequency variation into a single temporal token sequence, reduces representational redundancy and improves reconstruction fidelity at a matched codebook size.
    source: §4.2, Table 1
    evidence: With a fixed downstream vocoder, replacing a 1D tokenizer with a 2D tokenizer at the same bitrate improves VISQOL from 3.56 to 4.36 and reduces MCD from 11.47 to 2.64.
    confidence: high
    relevance: low
  - claim_id: adding_a_perceptual_loss_computed_on_the_intermediate_spectral_represent
    role: supports
    claim: Adding a perceptual loss computed on the intermediate spectral representation, on top of a plain L1 reconstruction loss, reduces over-smoothing artifacts in discrete audio tokenizers.
    source: §4.2, Table 2, Figure 4
    evidence: Adding a VGG-19-based perceptual loss to mel-spectrogram reconstruction improves LSD from 0.76 to 0.66 and VISQOL from 4.18 to 4.29 relative to L1-only training.
    confidence: high
    relevance: low
  - claim_id: a_single_codebook_audio_codec_can_approach_the_fidelity_of_multi_codeboo
    role: supports
    claim: A single-codebook audio codec can approach the fidelity of multi-codebook residual-VQ codecs on full-bandwidth reconstruction, narrowing the traditional efficiency/quality trade-off between codebook count and reconstruction quality.
    source: §4.3, Table 3
    evidence: At 3.4 kbps with one codebook, the proposed codec achieves the best LSD (0.77) and MCD (2.92) among all compared codecs (including 9-codebook DAC) and a VISQOL (4.17) far above other single-codebook baselines WavTokenizer (3.26) and UniCodec (3.18).
    confidence: high
    relevance: low
  - claim_id: strong_reconstruction_fidelity_scores_for_a_codec_do_not_guarantee_that
    role: complicates
    claim: Strong reconstruction-fidelity scores for a codec do not guarantee that its tokens preserve task-relevant semantic content as well as codecs with lower fidelity scores, particularly for structured classification tasks.
    source: §4.4, Table 6
    evidence: Despite leading fidelity metrics overall, the proposed codec's reconstructed audio yields only 0.57 accuracy on GTZAN music-genre classification, below multi-codebook codecs Spectral Codec (0.65), SNAC (0.63), and the 0.63 ground-truth reference.
    confidence: high
    relevance: low
  - claim_id: claims_of_high_fidelity_full_bandwidth_44_48_khz_audio_compression_are_c
    role: complicates
    claim: Claims of high-fidelity full-bandwidth (44/48 kHz) audio compression are constrained by the scarcity of genuinely high-resolution training data, since much publicly available "full-bandwidth" audio is itself upsampled from lower sampling rates.
    source: §Limitations and Future Work
    evidence: The authors report that training is disrupted when data artificially upsampled to a high sampling rate is used, and note that even open 44/48 kHz corpora often contain content originally recorded at 16 kHz.
    confidence: high
    relevance: low
  limitations:
  - The 15-participant MUSHRA result is not numerically reported, and language-model usefulness of the tokens remains untested.
  caveats:
  - For subjective evaluation, this paper provides low-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.
- id: '2510.05150'
  published_date: '2025-10-02'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
