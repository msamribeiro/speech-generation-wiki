- id: '2511.19734'
  published_date: '2025-11-24'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - codec
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - infrastructure
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: signal_processing_era_perceptual_metrics_can_correlate_with_human_quality_ju
    role: supports
    claim: Signal-processing-era perceptual metrics can correlate with human quality judgments on modern neural-codec-reconstructed
      speech as well as, or better than, metrics specifically designed for neural or non-intrusive quality prediction.
    source: §3.2, Table 1, Table 2
    evidence: PESQ, proposed in 2001, achieved the highest Pearson correlation with MUSHRA scores on combined audio
      (ρ = 0.903) and the second-highest on speech-only audio (ρ = 0.886), outperforming DNSMOS, NISQA, NORESQA-MOS,
      and ViSQOL in both conditions.
    confidence: high
    relevance: high
  - claim_id: objective_quality_metrics_validated_on_clean_or_narrowly_scoped_speech_conte
    role: complicates
    claim: Objective quality metrics validated on clean or narrowly-scoped speech content do not necessarily generalize
      to mixed audio scenes containing background sound.
    source: §3.2, Table 1, Table 2
    evidence: ViSQOL-Speech's Pearson correlation with MUSHRA dropped from ρ = 0.85 on speech-only samples to ρ
      = 0.593 on combined speech-plus-background samples, and several other speech-only-strong metrics (WARP-Q,
      NORESQA-MOS) showed the same degradation pattern.
    confidence: high
    relevance: high
  - claim_id: non_intrusive_reference_free_mos_predictors_can_fail_to_track_quality_differ
    role: complicates
    claim: Non-intrusive, reference-free MOS predictors can fail to track quality differences introduced specifically
      by neural audio codec compression, even though they are designed for general speech-quality prediction.
    source: §3.2, Table 1, Table 2
    evidence: DNSMOS correlated at ρ = 0.683 with MUSHRA on speech-only audio and effectively at chance (ρ = -0.073)
      on combined audio; NISQA and PEAQ likewise showed weak correlations (ρ ≤ 0.6) in both conditions.
    confidence: high
    relevance: high
  - claim_id: simple_signal_fidelity_metrics_snr_sdr_and_their_scale_invariant_variants_re
    role: refines
    claim: Simple signal-fidelity metrics (SNR, SDR and their scale-invariant variants) remain informative proxies
      for perceptual quality even when compared against metrics explicitly modeling human auditory perception.
    source: §3.2, Table 1, Table 2
    evidence: SNR, SDR, SI-SDR, and SA-SDR achieved Pearson correlations in the 0.7-0.77 range on both test conditions,
      comparable to or exceeding several perceptually-motivated metrics such as ViSQOL-Audio, DNSMOS, and PEAQ.
    confidence: high
    relevance: high
  limitations:
  - The double-blind MUSHRA study retains 11 of 17 raters and uses 22 samples, so metric correlations have substantial
    sampling uncertainty.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts
    remain included but are marked low relevance.


- id: '2511.21270'
  published_date: '2025-11-26'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  relevance: medium
  evidence_role:
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - autoregressive_generation
  claims:
  - claim_id: reinforcement_learning_fine_tuning_of_an_autoregressive_tts_llm_policy_can_i
    role: supports
    claim: Reinforcement learning fine-tuning of an autoregressive TTS-LLM policy can improve prosodic stability,
      speaker similarity, and naturalness beyond what supervised fine-tuning of the same pretrained backbone achieves.
    source: §3.2, Table 1
    evidence: On the same LLaSA backbone, RL fine-tuning (LLaSA+RL) reduces test-hard CER from 10.63 (SFT-only)
      to 6.04 and raises MOS from 3.76 to 4.12, without changing the underlying architecture.
    confidence: high
    relevance: medium
  - claim_id: decomposing_an_rl_reward_into_multiple_interpretable_independently_ablatable
    role: supports
    claim: Decomposing an RL reward into multiple interpretable, independently ablatable components (intelligibility,
      speaker similarity, duration, entropy, prosody) allows each dimension of TTS quality to be attributed to a
      specific training signal.
    source: §3.4, Table 2
    evidence: Sequential ablation over the five reward terms shows monotonic improvement in both objective (CER/WER,
      SIM) and subjective (MOS) metrics as each term is added, with the LLM-annotated prosody reward contributing
      the largest single MOS gain (3.68 → 4.25 on zh across the full sequence).
    confidence: high
    relevance: medium
  - claim_id: gains_from_rl_optimizing_an_autoregressive_tts_llm_s_decoding_policy_are_com
    role: supports
    claim: Gains from RL-optimizing an autoregressive TTS-LLM's decoding policy are complementary to, rather than
      subsumed by, downstream acoustic refinement modules.
    source: §3.2, Table 1
    evidence: Attaching a flow-matching decoder on top of the GRPO-optimized AR backbone yields further improvement
      over the RL-only model (SIM 0.758 → 0.79, MOS 4.12 → 4.21 on test-zh), rather than making the RL gains redundant.
    confidence: high
    relevance: low
  - claim_id: the_benefit_of_rl_fine_tuning_for_tts_llms_scales_with_both_training_data_vo
    role: supports
    claim: The benefit of RL fine-tuning for TTS-LLMs scales with both training data volume and backbone parameter
      count, with gains already measurable at comparatively small RL data scales.
    source: §3.3, Figure 2
    evidence: A sweep across 1B/3B/8B models and 1K–1M GRPO training samples shows monotonically decreasing CER
      and increasing SIM as either axis grows, with improvements over the supervised baseline visible at as few
      as 10K samples.
    confidence: high
    relevance: low
  - claim_id: using_an_external_reasoning_llm_to_generate_prosody_pseudo_labels_for_rl_rew
    role: complicates
    claim: Using an external reasoning LLM to generate prosody pseudo-labels for RL reward supervision introduces
      a dependency on handcrafted symbolic mappings to compare generated audio against those labels, rather than
      a fully learned or acoustically-grounded reward.
    source: §2.5
    evidence: Online reward computation converts Whisper-derived silence durations into discrete pause symbols through
      "a handcrafted rule-based mapping" before comparing them to the offline DeepSeek-R1-annotated pseudo-labels,
      and the reward itself is a binary exact-match signal rather than a graded one.
    confidence: high
    relevance: medium
  limitations:
  - MOS is based on 100 utterances and 10 raters without reported significance tests, limiting confidence in small
    differences.
  caveats:
  - For subjective evaluation, this paper provides medium-relevance evidence; claims primarily concerning other
    concepts remain included but are marked low relevance.


