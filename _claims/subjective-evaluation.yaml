    role: supports
    claim: Explicit temporal markup embedded directly into generated text tokens, rather than post-hoc timestamp-window
      filtering of generated words, improves the semantic quality and audio-visual synchronization of speech generated
      from a static, non-temporal text representation.
    source: §5.3, Table 3
    evidence: Removing Chrono-Text Markup (substituting timestamp-window filtering) degrades LSE-D from 9.56 to
      11.51, METEOR from 0.141 to 0.122, and BERTScore F1 from 0.806 to 0.766.
    confidence: high
    relevance: medium
  - claim_id: a_cross_attention_mechanism_using_zero_initialized_positionally_encoded_plac
    role: supports
