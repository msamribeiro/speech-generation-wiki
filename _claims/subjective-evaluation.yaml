    evidence: Without any explicit speaker embedding, MAVE achieves slightly higher WavLM-based cosine speaker similarity than VoiceCraft (0.57 vs. 0.55) on 372 LibriTTS zero-shot TTS samples using only a prepended ~3-second reference clip for speaker conditioning.
