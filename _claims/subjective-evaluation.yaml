    role: supports
    claim: A pretrained zero-shot TTS model's language coverage can be extended via a lightweight, frozen-backbone
      input adapter alone, better preserving the backbone's original voice-cloning fidelity than full fine-tuning
      does.
    source: §4.2.2, Table 5
    evidence: The frozen-backbone adapter achieves substantially higher speaker-similarity cosine scores (mean 0.9013)
      than a fully fine-tuned F5-TTS variant trained on the same Romanian data (mean 0.7946).
