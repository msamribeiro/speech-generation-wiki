  claims:
  - claim_id: converting_frame_level_self_supervised_content_features_to_phoneme_level_fea
    role: supports
    claim: Converting frame-level self-supervised content features to phoneme-level features, guided by forced-alignment
      duration information, improves speaker disentanglement and content preservation relative to using frame-level
      SSL features directly in voice conversion.
    source: §4.3, Table 2
    evidence: Removing either the pooling or attention branch of the phoneme-level SSL encoder raises CER from 6.27%
      to 19.19% (pooling ablation) or 9.45% (attention ablation) and lowers naturalness/similarity MOS, while the
      full phoneme-level encoder achieves the lowest CER (6.27%) and PER (2.22%) among all compared systems.
    confidence: high
    relevance: low
  - claim_id: adding_an_explicit_duration_predictor_conditioned_on_the_target_speaker_s_id
    role: supports
    claim: Adding an explicit duration predictor conditioned on the target speaker's identity, rather than inheriting
      the source utterance's duration by default, improves perceived speaker similarity in voice conversion.
    source: §4.3, Table 2 and Table 3
    evidence: Disabling the duration predictor lowers similarity MOS from 4.49 to 4.25 in the aishell-to-aishell
      scenario, and a Relative Duration Deviation analysis shows converted speech shifts from an average 20.85%
      RDD relative to the target (source duration unchanged) to 11.34% RDD when the predictor is enabled.
    confidence: high
    relevance: high
  - claim_id: supplementing_a_voice_conversion_system_s_content_representation_with_explic
    role: supports
    claim: Supplementing a voice conversion system's content representation with explicit textual features (word,
      phoneme, tone, and pretrained text-embedding features) improves content integrity beyond what a purely acoustic
      self-supervised representation provides.
    source: §4.3, Table 2
    evidence: The full text-and-SSL conditioned model achieves lower CER (6.27%) and PER (2.22%) than all six baseline
      VC systems, including a diffusion-transformer VC system (SeedVC, CER 8.15%) and a repurposed zero-shot TTS
      system (CosyVoice-VC, CER 10.80%) trained or evaluated on the same task.
    confidence: high
    relevance: low
  - claim_id: duration_adaptation_toward_a_target_speaker_in_voice_conversion_is_partial_r
    role: complicates
    claim: Duration adaptation toward a target speaker in voice conversion is partial rather than complete when
      the source and target differ substantially in speaking style, and gains in naturalness can trade off against
      gains in similarity.
    source: §4.3, Table 2 and Table 3
    evidence: In the DataBaker-to-AISHELL-3 scenario, where source and target styles differ more than in the matched
      AISHELL-3-to-AISHELL-3 scenario, FabasedVC's naturalness MOS (3.85) falls slightly below SeedVC's (3.90) even
      though its similarity MOS (4.27) remains the highest; the RDD toward the target speaker averages 11.34%, indicating
      a shift toward but not full adoption of the target's duration profile.
    confidence: high
    relevance: high
