  - claim_id: extending_a_tts_model_to_a_new_language_via_a_lightweight_frozen_backbone_ad
    role: complicates
    claim: Extending a TTS model to a new language via a lightweight, frozen-backbone adapter trades transcription
      accuracy for voice-identity preservation relative to full fine-tuning, rather than improving both simultaneously.
    source: §4.2.1-4.2.2, Tables 4-5
    evidence: The fully fine-tuned F5-TTS model achieves lower WER, MER, and WIL than the adapter-based approach
      on the same Romanian objective evaluation, while the adapter-based approach achieves substantially higher
      speaker similarity.
    confidence: high
