  - transformer_encoder_decoder
  - gan_adversarial_generation
  claims:
  - claim_id: archival_recordings_even_when_severely_degraded_and_drawn_from_a_single_spea
    role: supports
    claim: Archival recordings, even when severely degraded and drawn from a single speaker recorded decades earlier,
      can be systematically restored and combined with quality-stratified multi-speaker training to produce an intelligible
      neural TTS voice for a language with no prior training corpus.
    source: §3.2, §3.3, §4.2
    evidence: 10.5 hours of 1989-1993 recordings, denoised with Resemble-Enhance and split into a 2-hour "good"
      and 8.5-hour "lower quality" subset trained as separate speaker IDs in FastPitch, produced a South Sámi voice
      with no statistically significant Clarity or Pronunciation & Rhythm gap versus ground-truth recordings (p
      ≈ 0.33 and p ≈ 0.52).
    confidence: high
    relevance: medium
  - claim_id: a_tts_voice_trained_on_quality_mixed_archival_material_can_match_ground_trut
    role: complicates
    claim: A TTS voice trained on quality-mixed archival material can match ground-truth recordings on intelligibility
      measures while still lagging on perceptual pleasantness.
    source: §4.2
    evidence: Wilcoxon signed-rank tests over 12 paired evaluation items found a statistically significant difference
      favoring ground truth only for the Pleasantness dimension (p ≈ 0.0039), with no significant gap for Clarity
      or Pronunciation & Rhythm.
    confidence: high
    relevance: high
  - claim_id: decoupling_text_normalization_into_a_shared_rule_based_finite_state_pipeline
    role: supports
    claim: Decoupling text normalization into a shared, rule-based finite-state pipeline lets improvements to text
      processing propagate to synthesis quality without retraining the acoustic model.
    source: §3.4, §4.4
    evidence: The GiellaLT/HFST+VISLCG3 pipeline used for tokenization, disambiguation, and numeral/abbreviation
      normalization is shared across all Divvun language tools; the authors note that fixing text-processing issues
      such as numeral rendering, identified in the qualitative review, would improve output without touching the
      FastPitch model itself.
    confidence: high
    relevance: low
  - claim_id: standard_large_panel_tts_subjective_evaluation_protocols_are_difficult_to_ap
    role: complicates
    claim: Standard large-panel TTS subjective-evaluation protocols are difficult to apply directly to critically
      endangered languages, because the available rater pool is a small fraction of an already tiny speaker population.
    source: §4.2
    evidence: The authors explicitly depart from evaluation norms designed for majority languages, citing the 500-600-speaker
      South Sámi population and risk of research fatigue as reasons to use a reduced 15-sentence test set and a
      single external native-speaker qualitative reviewer rather than a large-panel listening study.
    confidence: high
    relevance: high
  limitations:
  - The community-scaled study covers 15 sentences, 12 paired items, and one external native reviewer, favoring
    contextual validity over statistical generalization.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts
