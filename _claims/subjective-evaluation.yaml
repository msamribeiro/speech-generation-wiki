  claims:
  - claim_id: phoneme_level_text_representations_reduce_duration_estimation_instabilit
    role: supports
    claim: Phoneme-level text representations reduce duration-estimation instability in diffusion-based TTS for tonal languages, compared to character-level inputs.
    source: §2.2 "Phoneme-level representations"
    evidence: The authors describe the character-level duration heuristic in F5-TTS (ratio-based duration estimation with filler-token padding) as unstable for a language where a single character can map to multiple phonetic realizations, and adopt IPA-based phoneme sequences with explicit tone marking for Vietnamese instead.
    confidence: high
    relevance: low
  - claim_id: a_two_stage_asr_tts_pipeline_can_achieve_strong_target_speaker_similarit
    role: supports
    claim: A two-stage ASR-TTS pipeline can achieve strong target-speaker similarity in cross-lingual zero-shot voice conversion by explicitly separating content transcription from speech synthesis.
    source: §3.2, Table 1
    evidence: The system obtained the best target-speaker similarity score (SMOS_TGT = 3.66 ± 0.21) among all four teams on the VLSP 2025 Voice Conversion Task 1 leaderboard.
    confidence: high
    relevance: medium
  - claim_id: optimizing_a_cascaded_asr_tts_voice_conversion_system_for_speaker_simila
    role: complicates
    claim: Optimizing a cascaded ASR-TTS voice conversion system for speaker similarity can come at the cost of content accuracy relative to competing designs.
    source: §3.2, Table 1
    evidence: The system's WER (12.95) was the second-worst of four teams despite its best-in-class SMOS_TGT, and its Final Score (67.53) trailed the top team (72.66), which achieved both a lower WER (9.83) and higher MOS (4.29).
    confidence: high
    relevance: medium
  - claim_id: diffusion_based_tts_models_retain_characteristic_failure_modes_such_as_r
    role: complicates
    claim: Diffusion-based TTS models retain characteristic failure modes such as repetition and hallucination on long text inputs even when integrated into an otherwise well-performing cascaded voice conversion pipeline.
    source: §3.3 "Discussion"
    evidence: The authors state that "the known weaknesses of diffusion-based TTS models, such as repetition and hallucination on long text inputs, persist in our system."
    confidence: high
    relevance: low
