    role: complicates
    claim: Linear-complexity SSM decoders trade wall-clock inference speed for memory efficiency relative to Transformer decoders with KV-caching, and the memory advantage does not automatically translate into a latency advantage on short utterances.
    source: §4.3, Table 4
    evidence: On the RealEdit test set (mean utterance duration 6.21s), MAVE uses roughly 6x less average GPU memory than VoiceCraft with KV-caching (6.2GB vs. 37.9GB) but takes longer in total wall-clock time to process the dataset (5min17s vs. 4min33s), an effect the paper attributes to autoregressive per-step overhead dominating at short output lengths.
    confidence: high
    relevance: low
  - claim_id: ai_edited_speech_can_be_made_perceptually_close_to_indistinguishable_fro
    role: supports
    claim: AI-edited speech can be made perceptually close to indistinguishable from the unedited original for a majority of listeners, even on real-world, out-of-domain recordings with background noise.
    source: §4.1
    evidence: In a pairwise side-by-side study on 40 RealEdit samples (400 judgments across 10 raters), 57.2% of comparisons rated the MAVE-edited and original audio as equally natural, versus 24.8% preferring the original and 18.0% preferring the edit.
    confidence: high
    relevance: high
  limitations:
  - Human studies use modest panels and narrow comparison sets; the FluentSpeech comparison has only 14 externally supplied samples.
  caveats:
  - For subjective evaluation, this paper provides medium-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.
- id: '2510.05619'
  published_date: '2025-10-07'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - hybrid
  relevance: medium
  evidence_role:
  - evaluation_caution
  - core_evidence
  current_role: frontier_probe
  method_family:
  - hybrid_generation
  claims:
  - claim_id: a_reinforcement_learning_policy_can_be_trained_to_produce_recognizable_s
    role: supports
    claim: A reinforcement learning policy can be trained to produce recognizable speech sounds purely from acoustic-similarity feedback, without ever being given a direct acoustic reconstruction loss on the output waveform.
    source: §3.1, §3.3, Table 1
    evidence: Six per-syllable PPO policies, rewarded only by cosine similarity between Sylber embeddings of generated and target audio, converge to similarity scores between 0.79 and 0.92, and a human transcriber correctly recognized three of the six generated syllables (please, loot, cat).
    confidence: high
    relevance: high
  - claim_id: reward_signals_based_on_similarity_to_a_target_embedding_can_reinforce_p
    role: complicates
    claim: Reward signals based on similarity to a target embedding can reinforce partially correct articulatory sequences, so a policy can achieve high similarity scores while still failing to realize the full intended phonetic sequence.
    source: §3.3, Table 1
    evidence: Despite similarity scores of 0.87, 0.79, and 0.92 respectively, road, fan, and age were misheard by the human transcriber as "roar," "fand," and "we," showing the policy learns the onset of a syllable more reliably than its coda.
    confidence: high
    relevance: high
  - claim_id: explicit_low_dimensional_articulatory_control_can_serve_as_an_interpreta
    role: refines
    claim: Explicit, low-dimensional articulatory control can serve as an interpretable intermediate representation for speech generation, in which motor commands can be traced back to individual phonetic targets.
    source: §3.2, Figure 5
    evidence: The trained "please" policy's 13-dimensional articulator/loudness trajectory decomposes into distinguishable, temporally ordered gestures corresponding to /p/, /l/, /iy/, and /z/, allowing the sequence of phonemes to be read directly off the trajectory plot.
    confidence: high
    relevance: low
  - claim_id: reinforcement_learning_based_articulatory_control_frameworks_in_their_cu
    role: complicates
    claim: Reinforcement-learning-based articulatory control frameworks, in their current form, face a substantial gap in scale and perceptual quality relative to data-driven neural speech synthesis.
    source: §4 Discussion
    evidence: The framework trains one independent policy per syllable over six syllables total (not a shared policy or full-sentence generation), and the authors state explicitly that the model does not yet achieve the perceptual quality of current data-driven neural synthesis systems.
    confidence: high
    relevance: medium
  limitations:
  - Intelligibility is judged by one transcriber on six syllables, without MOS, ASR, baselines, or statistical analysis.
  caveats:
  - For subjective evaluation, this paper provides medium-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.

- id: '2510.05799'
  published_date: '2025-10-07'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - autoregressive-LM
  relevance: low
  evidence_role:
  - core_evidence
  current_role: minor
  method_family:
  - autoregressive_generation
  claims:
  - claim_id: reformulating_preference_optimization_to_accept_unpaired_desirable_undes
    role: supports
    claim: Reformulating preference optimization to accept unpaired desirable/undesirable samples substantially increases usable training data relative to paired formulations in TTS, because TTS systems tend to produce consistently correct or consistently incorrect output rather than genuinely paired successes and failures for the same input.
    source: §4.4, Table 1
    evidence: Only 10.5% of generated utterances contained both a desirable and an undesirable sample; paired methods (DPO) were limited to 1.5K samples while unpaired methods used 9K samples, roughly 6× more usable data.
    confidence: high
    relevance: low
  - claim_id: token_level_importance_weighting_derived_from_contrastive_preference_mod
    role: supports
    claim: Token-level importance weighting derived from contrastive preference models can automatically concentrate optimization signal on the specific tokens responsible for a preference difference, without requiring token-level human annotation.
    source: §4.2, Figures 4-5
    evidence: The token corresponding to the ambiguous target character received an average reward of 0.22 versus an overall mean of 0.12 for desirable samples, and -1.54 for undesirable samples, and a case study showed weights concentrated on the target character's tokens.
    confidence: high
    relevance: low
  - claim_id: utterance_level_paired_preference_optimization_for_tts_is_prone_to_relyi
    role: complicates
    claim: Utterance-level paired preference optimization for TTS is prone to relying on a narrow, biased subset of training examples, which limits the learning signal and reduces generalization compared to formulations that can use unpaired data.
    source: §4.2, Table 1
    evidence: Paired DPO/KTO training was restricted to the rare subset of utterances where both a correct and an incorrect pronunciation sample existed for the same text, and underperformed unpaired variants across accuracy, CER, and bad-case ratio on both speakers.
    confidence: high
    relevance: low
  - claim_id: preference_optimization_gains_for_pronunciation_disambiguation_in_llm_ba
    role: refines
    claim: Preference-optimization gains for pronunciation disambiguation in LLM-based TTS are not specific to a single language's script or phonology, but transfer to token-level ambiguity structures (e.g. heteronyms/polyphones) in a second, typologically different language.
    source: §4.5, Table 3
    evidence: Applying the same TKTO method to a Chinese polyphonic-character benchmark ("行") improved accuracy from 0.645 (base) to 0.898 (unpaired TKTO) and reduced CER from 0.024 to 0.014, mirroring the Japanese results.
    confidence: high
    relevance: low
  - claim_id: reported_gains_from_a_novel_preference_optimization_objective_for_tts_ma
    role: complicates
    claim: Reported gains from a novel preference-optimization objective for TTS may not indicate how the method behaves at larger model scale, when only a single small backbone size has been tested.
    source: §Limitations
    evidence: All experiments use a single 0.5B-parameter CosyVoice2 backbone; the authors state that larger versions of the same backbone were not publicly available and computational constraints prevented scaling experiments.
    confidence: high
    relevance: low
  limitations:
  - Human NMOS and ABX tests cover narrow Japanese and Chinese ambiguity benchmarks on one 0.5B backbone, so they do not establish general naturalness gains.
  caveats:
  - For subjective evaluation, this paper provides low-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.
- id: '2510.05984'
  published_date: '2025-10-07'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - diffusion
  - transformer-enc-dec
  relevance: medium
  evidence_role:
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - diffusion_generation
  - transformer_encoder_decoder
  claims:
  - claim_id: consistency_tuning_applied_directly_to_a_pretrained_diffusion_model_with
    role: supports
    claim: Consistency tuning applied directly to a pretrained diffusion model, without a separate teacher-student distillation pipeline, can reach one-step speech synthesis quality comparable to consistency-distillation approaches while requiring substantially fewer total training steps.
    source: §4.4, Table 1
    evidence: ECTSpeech reaches MOS 4.16 (1-step) versus CoMoSpeech's 4.19 (1-step) using 170k consistency-tuning steps atop a 1.7M-step pretrained diffusion model, described by the authors as roughly 10% of CoMoSpeech's total training iterations.
    confidence: high
    relevance: medium
  - claim_id: multi_scale_gated_feature_fusion_in_a_diffusion_denoiser_s_skip_connecti
    role: supports
    claim: Multi-scale gated feature fusion in a diffusion denoiser's skip connections improves one-step generation quality over standard skip connections, particularly when sampling is limited to a single step.
    source: §4.5, Table 2
    evidence: Removing MSGate degrades FAD from 0.5246 to 0.6621, FD from 0.6976 to 0.7453, and MOS from 4.16 to 4.09 under 1-step inference on LJSpeech.
    confidence: high
    relevance: medium
  - claim_id: the_bulk_of_the_quality_recovery_in_one_step_consistency_based_tts_comes
    role: complicates
    claim: The bulk of the quality recovery in one-step consistency-based TTS comes from the consistency-tuning objective itself rather than from architectural improvements to the denoiser.
    source: §4.5, Table 2
    evidence: Disabling consistency tuning (using the pretrained diffusion model directly at 1-step) collapses FD from 0.6976 to 7.9731, FAD from 0.5246 to 1.6863, and MOS from 4.16 to 3.41, a far larger drop than removing MSGate or masked normalization individually.
    confidence: high
    relevance: high
  - claim_id: loss_normalization_by_valid_frame_count_is_needed_to_prevent_longer_utte
    role: complicates
    claim: Loss normalization by valid-frame count is needed to prevent longer utterances from dominating the consistency-tuning objective and degrading quality on shorter utterances.
    source: §3.3, §4.5, Table 2
    evidence: Removing masked normalization raises FAD from 0.5246 to 0.6947 and FD from 0.6976 to 0.7031, with MOS dropping from 4.16 to 4.11.
    confidence: high
    relevance: medium
  limitations:
  - MOS uses ten utterances and ten listeners on single-speaker LJSpeech, with no recent flow-matching baseline or multi-speaker validation.
  caveats:
  - For subjective evaluation, this paper provides medium-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.
- id: '2510.06927'
  published_date: '2025-10-08'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - TTS
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: once_objective_intelligibility_metrics_reach_an_already_low_error_rate_f
    role: supports
    claim: Once objective intelligibility metrics reach an already-low error rate, further numerical improvement does not necessarily correspond to a perceptible gain in synthesized speech quality.
    source: §Appendix C, Table 3
    evidence: An original 10-rater listening test finds MELLE's synthesized speech has a lower WER than ground-truth recordings (1.47% vs. 1.61%) but a nearly identical perceived-intelligibility WER-MOS (1.06% vs. 1.09%).
    confidence: high
    relevance: high
  - claim_id: speaker_similarity_sim_scores_are_not_directly_comparable_across_zero_sh
    role: complicates
    claim: Speaker-similarity (SIM) scores are not directly comparable across zero-shot TTS papers unless the similarity-computation protocol is held fixed, since the protocol itself materially changes the score.
    source: §Appendix B, Table 2
    evidence: Recomputing SIM-o for the same continuation-task output under the VALL-E protocol (prompt excluded from the similarity computation) versus the VALL-E 2 protocol (prompt included) yields 0.754 and 0.905 respectively, an absolute difference of 0.151.
    confidence: high
    relevance: high
  - claim_id: reporting_a_benchmark_name_and_a_metric_value_alone_e_g_librispeech_test
    role: complicates
    claim: Reporting a benchmark name and a metric value alone (e.g., "LibriSpeech test-clean WER") is not sufficient for reproducible cross-paper comparison, because different papers silently evaluate on different subset variants of the same nominally shared benchmark.
    source: §Appendix A, Table 1
    evidence: The same released MaskGCT checkpoint evaluated on two commonly cited LibriSpeech test-clean variants (40 vs. 1234 utterances) for the identical cross-sentence task produces WER of 2.63% and 4.22% respectively.
    confidence: high
    relevance: high
  - claim_id: neural_mos_prediction_models_trained_for_one_purpose_transfer_unreliably
    role: complicates
    claim: Neural MOS-prediction models trained for one purpose transfer unreliably when repurposed for a different evaluation target, and typically report no uncertainty around their point estimates.
    source: §3.1
    evidence: The paper's analysis identifies DNSMOS, trained on speech-enhancement data, as a domain-mismatched but widely used predictor for TTS naturalness, and notes that predicted-MOS models generally provide only point estimates without confidence intervals.
    confidence: high
    relevance: high
  - claim_id: provenance_and_traceability_safeguards_for_synthetic_speech_are_largely
    role: supports
    claim: Provenance and traceability safeguards for synthetic speech are largely absent from mainstream TTS evaluation despite documented real-world misuse.
    source: §5.2
    evidence: The paper's risk analysis cites documented synthetic voice fraud in the financial and communications sectors as evidence that current evaluation practice rarely reports verifiable markers of machine-generated speech or tests for traceability.
    confidence: high
    relevance: medium
  limitations:
  - This is a position paper rather than a systematic review; its appendix studies are single-model illustrations with a ten-rater listening test.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.
- id: '2510.07096'
  published_date: '2025-10-08'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - GAN
  - VAE
  relevance: high
  evidence_role:
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - gan_adversarial_generation
  - variational_latent_generation
  claims:
  - claim_id: retrieval_augmented_conditioning_on_real_reference_exemplars_can_substit
    role: supports
    claim: Retrieval-augmented conditioning on real reference exemplars can substitute for a single manually chosen style-reference utterance in expressive speech synthesis, without a loss in perceived naturalness.
    source: §Sarcastic Speech Synthesis Results, Table 2
    evidence: Prosody-only conditioning using the top-3 retrieved sarcastic exemplars (WavLM-encoded) raised sarcasm MOS from 3.2±0.2 (baseline) to 3.7±0.2 while naturalness MOS stayed flat at 2.6±0.1.
    confidence: high
    relevance: high
  - claim_id: task_specific_fine_tuning_of_a_general_purpose_llm_is_necessary_to_make
    role: supports
    claim: Task-specific fine-tuning of a general-purpose LLM is necessary to make its embeddings useful for conditioning expressive speech synthesis; the pretrained embeddings alone are not sufficient and can be actively harmful.
    source: §Sarcastic Speech Synthesis Results, Table 2
    evidence: Conditioning on untuned LLaMA 3 embeddings degraded both naturalness (2.0±0.1 NMOS, versus 2.6±0.1 for baseline) and perceived sarcasm (2.6±0.2 SMOS, versus 3.2±0.2 for baseline), while the same LLaMA 3 backbone after LoRA fine-tuning raised sarcasm MOS to 3.8±0.2 with naturalness restored to 2.6±0.1.
    confidence: high
    relevance: high
  - claim_id: semantic_and_prosodic_cues_make_complementary_non_redundant_contribution
    role: supports
    claim: Semantic and prosodic cues make complementary, non-redundant contributions to a pragmatic speech phenomenon, and combining them yields effects that neither cue produces alone.
    source: §Sarcastic Speech Synthesis Results, Table 2
    evidence: The combined LoRA+RAG condition achieved the highest downstream sarcasm-detection F1 from synthesized audio (62.5%) among all six tested conditions and the lowest acoustic distortion (9.8 MCD), while matching the best single-cue SMOS (3.8±0.2) at improved naturalness (2.7±0.1 NMOS) relative to either cue alone.
    confidence: high
    relevance: high
  - claim_id: low_level_acoustic_fidelity_metrics_can_fail_to_reflect_meaningful_diffe
    role: complicates
    claim: Low-level acoustic fidelity metrics can fail to reflect meaningful differences in a system's ability to convey pragmatic or paralinguistic intent, so they should not be used as proxies for expressivity.
    source: §Sarcastic Speech Synthesis Results
    evidence: MCD, pitch RMSE, and energy RMSE remained nearly identical across all six conditions (MCD ranging 9.6-10.4) even though sarcasm detection F1 varied from 59.0% to 62.5% and SMOS varied from 2.6±0.2 to 3.8±0.2 across the same conditions.
    confidence: high
    relevance: high
  limitations:
  - The perceptual study uses 30 listeners and eight sentences per system from one English sitcom corpus, without reported significance tests.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.

- id: '2510.07979'
  published_date: '2025-10-09'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - flow-matching
  relevance: medium
  evidence_role:
  - core_evidence
  - evaluation_caution
  - acceleration_evidence
  current_role: active_evidence
  method_family:
  - flow_matching_generation
  claims:
  - claim_id: approximating_average_velocity_via_discrete_numerical_integration_of_tea
    role: supports
    claim: Approximating average velocity via discrete numerical integration of teacher displacements is a viable alternative to Jacobian-vector products for MeanFlow-style distillation, avoiding GPU memory overhead and flash attention incompatibility.
    source: §3.1
    evidence: The student is trained against averaged velocity obtained by summing a fixed teacher's instantaneous velocities over intermediate states, removing JVP computation and self-bootstrap training.
    confidence: high
    relevance: low
  - claim_id: flow_matching_tts_models_can_be_distilled_to_1_3_nfe_with_near_lossless
    role: supports
    claim: Flow-matching TTS models can be distilled to 1–3 NFE with near-lossless quality when the student is initialised from the pretrained teacher with a warm-start strategy.
    source: §3.3, §4.2, §4.3, Table 1, Table 2
    evidence: The 3-NFE F5-TTS student reaches WER 1.60 and SIM-o 0.65 with roughly 11× lower RTF than its 32-NFE teacher, while the 1-NFE CosyVoice2 student has CMOS −0.03 relative to the full system.
    confidence: high
    relevance: medium
  - claim_id: coordinate_wise_ternary_search_over_sampling_step_positions_consistently
    role: supports
    claim: Coordinate-wise ternary search over sampling step positions consistently improves both objective and subjective quality metrics without increasing inference NFE.
    source: §3.2, §4.2.1, Table 1
    evidence: At fixed 2–3 NFE, O3S sharply lowers WER and improves speaker similarity by optimizing step placement rather than adding evaluations; the reported listening scores move in the same direction.
    confidence: high
    relevance: medium
  - claim_id: training_instability_in_direct_meanflow_application_to_tts_manifests_as
    role: complicates
    claim: Training instability in direct MeanFlow application to TTS manifests as degraded subjective quality even when objective metrics (WER, SIM-o) appear competitive.
    source: §4.3, Table 2
    evidence: Direct MeanFlow on CosyVoice2 retains competitive WER and SIM-o but yields CMOS −0.73, compared with −0.03 for IntMeanFlow, despite similar automatic scores.
    confidence: high
    relevance: high
  - claim_id: a_larger_teacher_model_during_distillation_improves_student_quality_even
    role: supports
    claim: A larger teacher model during distillation improves student quality even when the student is significantly smaller, enabling efficient deployment of smaller models trained with stronger teacher guidance.
    source: §4.2.3, Table 1
    evidence: The model-size study compares 158M, 336M, and 592M students and reports improved student quality when stronger teacher guidance is used, including for smaller deployment models.
    confidence: high
    relevance: low
  limitations:
  - Subjective conclusions depend on CMOS/SMOS tests for two flow-based backbones; O3S optimizes speaker similarity only and metric sensitivity is untested.
  caveats:
  - For subjective evaluation, this paper provides medium-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.
- id: '2510.09016'
  published_date: '2025-10-10'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - singing
  architecture:
  - diffusion
  relevance: medium
  evidence_role:
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - diffusion_generation
  claims:
  - claim_id: constraining_cross_attention_to_character_level_temporal_spans_via_a_fix
    role: supports
    claim: Constraining cross-attention to character-level temporal spans via a fixed additive attention bias can substitute for explicit phoneme-level duration labels in phoneme-to-acoustic alignment for singing synthesis.
    source: §2.3, Table 2
    evidence: The implicit alignment mask (Eq. 6–8) is derived only from character-level start times and durations, extended by a tunable offset δ, and is applied identically at training and inference under diffusion reconstruction loss alone; the resulting model achieves the best MCD (3.03) and F0RMSE (11.18) among all compared systems.
    confidence: high
    relevance: medium
  - claim_id: diffusion_transformer_scaling_trends_observed_in_other_modalities_qualit
    role: supports
    claim: Diffusion transformer scaling trends observed in other modalities (quality improving with depth, width, and resolution) extend to singing voice synthesis.
    source: §3.2, Fig. 3
    evidence: Sweeping DiTSinger from Small (depth 4, width 384) to Large (depth 16, width 768) and data from 30h to 530h produces consistent MCD improvements, with a half-resolution Small variant (S2) outperforming a higher-FLOP Base variant (B4), showing resolution has an outsized effect relative to raw compute.
    confidence: high
    relevance: low
  - claim_id: bootstrapping_large_singing_corpora_from_a_small_number_of_melody_specia
    role: complicates
    claim: Bootstrapping large singing corpora from a small number of melody-specialized synthesis models has a data-regime sweet spot rather than improving monotonically with the number of source models.
    source: §3.3, Table 1
    evidence: MOS peaks at 20 PseudoSinger groups (4.05 ± 0.06) and then falls to 3.81 at 50 groups, with MCD rising from 3.12 to 3.65, as each group's melody coverage shrinks and generalization to unseen lyrics worsens.
    confidence: high
    relevance: high
  - claim_id: cross_system_comparisons_in_singing_voice_synthesis_are_hard_to_interpre
    role: complicates
    claim: Cross-system comparisons in singing voice synthesis are hard to interpret when baselines differ in whether they are retrained on the evaluation corpus or conditioned via a reference clip.
    source: §3.1, §3.4, Table 2
    evidence: DiffSinger is retrained on the paper's own 530h corpus, while StyleSinger and TCSinger are instead conditioned on a reference clip from the same singer rather than retrained, so the MOS/MCD gaps in Table 2 partly reflect this mismatch in evaluation protocol rather than architecture alone.
    confidence: high
    relevance: high
  limitations:
  - MOS results use an unreleased Chinese corpus and baselines with mismatched retraining/reference-conditioning protocols.
  caveats:
  - For subjective evaluation, this paper provides medium-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.
- id: '2510.10774'
