  - claim_id: evaluators_trained_on_synthetic_or_curated_role_play_speech_generalize_p
    role: complicates
    claim: Evaluators trained on synthetic or curated role-play speech generalize poorly to real, unscripted human performance.
    source: §5.2, Table 4
    evidence: On the real-recording realism test set, all models, including the fine-tuned DRAME-Eval, drop to 0.04-0.25 average correlation with human ratings, versus 0.625 on the synthetic/curated realism test set, with the fine-tuning advantage over few-shot prompting shrinking sharply.
    confidence: high
    relevance: high
  - claim_id: coarse_stereotype_driven_archetype_evaluation_and_fine_grained_human_gro
    role: complicates
    claim: Coarse, stereotype-driven (archetype) evaluation and fine-grained, human-grounded (realism) evaluation of speech role-play can yield different rankings and different levels of automatic-judge reliability, so a single evaluation strategy is not sufficient to characterize role-play quality.
    source: §6, "Human alignment"; Tables 5-6
    evidence: 'Human-judgment alignment with DRAME-Eval is 0.706 Spearman correlation for archetype evaluation but only 0.375 for realism evaluation, and system rankings shift: cascaded TTS pipelines lead clearly on archetype scoring while end-to-end models match or exceed them on realism scoring.'
    confidence: high
    relevance: high
  - claim_id: cascading_a_text_llm_with_a_dedicated_zero_shot_tts_system_can_still_out
    role: supports
    claim: Cascading a text LLM with a dedicated zero-shot TTS system can still outperform end-to-end spoken dialogue models on stereotype-driven role-play delivery, though the gap is narrowing.
    source: §6, Table 5
    evidence: On DRAME-RoleBench archetype evaluation, cascaded pipelines using IndexTTS2 (G-IndexTTS2, Q-IndexTTS2) achieve the highest content pass rates (94.3%, 94.7%) and average scores, while the best end-to-end model (GLM4-Voice, 88.5% content pass) trails slightly but already exceeds 3.0 average rating.
    confidence: high
    relevance: high
  limitations:
  - The realism judge has weak human agreement and poor transfer to real recordings, and the held-out human-alignment study covers only 10% of the benchmark.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.


- id: '2511.02104'
  published_date: '2025-11-03'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - TTS
  - evaluation
  architecture: []
  relevance: high
  evidence_role:
  - infrastructure
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: a_two_tier_evaluation_scheme_that_separately_scores_discrete_prosodic_ev
    role: supports
    claim: A two-tier evaluation scheme that separately scores discrete prosodic event placement and continuous acoustic realization can reproduce perceptual naturalness rankings of TTS systems while providing per-cue diagnostic detail that a single perceptual or MOS-style score cannot.
    source: §3.2, Figures 3-4
    evidence: The framework's aggregate rankings across five commercial/open TTS systems (OpenAI > Google > Azure > Polly > VITS) matched the MOS-based perceptual ranking, while per-feature F1/error breakdowns identified specific weaknesses (e.g., OpenAI's weak pitch control vs. strong duration/intensity control) invisible in the single MOS number.
    confidence: high
    relevance: high
  - claim_id: encoding_the_natural_variability_of_human_prosodic_realization_into_an_o
    role: supports
    claim: Encoding the natural variability of human prosodic realization into an objective scoring function, rather than scoring against a single reference target, allows the metric to correctly treat genuine human variation as acceptable while still separating human from synthetic speech.
    source: §3.3, Table 4
    evidence: In leave-one-out self-validation, all five human reference speakers achieved a smoothed zero-one loss of exactly 0.000 (indicating the variability-aware metric does not penalize natural inter-speaker differences) while still scoring statistically higher than every TTS model on all 18 tested feature/metric combinations.
    confidence: high
    relevance: high
  - claim_id: perceptual_evaluation_methods_that_are_treated_as_a_single_gold_standard
    role: complicates
    claim: Perceptual evaluation methods that are treated as a single "gold standard" can disagree with each other even when administered to the same listener pool, undermining their use as a stable ground truth for validating objective metrics.
    source: §3.1.2
    evidence: The same participant pool produced a different naturalness ranking under MOS versus pairwise comparison testing, with VITS and Amazon Polly swapping relative rank between the two protocols.
    confidence: high
    relevance: high
  - claim_id: event_placement_accuracy_and_continuous_acoustic_realization_accuracy_ar
    role: complicates
    claim: Event-placement accuracy and continuous acoustic-realization accuracy are separable dimensions of prosodic quality, so a system can excel at one while lagging on the other, meaning naturalness is not fully explained by either dimension alone.
    source: §3.2, §4
    evidence: Azure achieved higher binary F1 than Google for several cues (e.g., duration F1 0.723 vs. 0.684) yet had higher continuous error (e.g., pitch error 0.660 vs. 0.468) and was judged less natural overall than Google, indicating precise continuous realization mattered more for perceived naturalness than correct event placement alone.
    confidence: high
    relevance: high
  limitations:
  - Validation covers one English audiobook chapter, five female narrators, and fixed threshold and event-detection settings whose sensitivity is not tested.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.


- id: 2025.emnlp-main.1160
  published_date: '2025-11-05'
  entry_date: '2026-09-19'
  year: 2025
  venue: EMNLP
  task:
  - SCA
