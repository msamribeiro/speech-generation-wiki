    role: supports
    claim: Using text as an explicit, timestamped intermediate modality between a multimodal LLM's language understanding
      and a downstream TTS module can improve both the content quality and audio-visual timing accuracy of synchronized,
      incrementally generated speech, compared to generating audio tokens directly from LLM hidden states.
    source: §5.3, Table 3
    evidence: Removing TempoVoice (predicting audio tokens directly from trimmed/padded hidden states via an MLP)
