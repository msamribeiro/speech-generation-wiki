      for speed can degrade output quality without offering any formal distributional guarantee at any level of
      granularity.
    source: §3.2, Table 1
    evidence: The SSD baseline, which adds a constant bias term to the acceptance ratio, reaches the same 1.4× speedup
      as PCG but with higher WER/CER (18.5/11.6) and lower naturalness MOS (3.78 vs. 4.09), while providing no exactness
      guarantee.
