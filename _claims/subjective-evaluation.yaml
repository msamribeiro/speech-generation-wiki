    role: complicates
    claim: Automatic intelligibility metrics computed with off-the-shelf ASR systems degrade sharply on singing material with ambiguous pronunciation and complex vocal techniques, independent of the voice conversion system's own quality.
    source: §4.1
    evidence: CER on the SVC-Hard test set (25.77% for R2-SVC) was roughly double the SVC-Normal CER (13.41%) for the same system, attributed to ambiguous pronunciation and complex singing techniques in the hard set rather than conversion failures.
