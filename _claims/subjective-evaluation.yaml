    relevance: medium
  - claim_id: robustness_interventions_aimed_at_noisy_real_world_conditions_can_trade_
    role: complicates
    claim: Robustness interventions aimed at noisy real-world conditions can trade off against raw speaker-similarity scores measured by automatic embedding cosine similarity.
    source: §4.3, Table 1
    evidence: The ablated w/o-SETSE and w/o-SRE variants achieved higher SPK-SIM than the full R2-SVC model on both test sets (e.g., 78.95% vs. 75.17% on SVC-Normal), even though the full model scored better on subjective naturalness and similarity (NMOS, SMOS).
