      acoustic interchangeability than raw spectral (Mel) similarity.
    source: §4, Table 3
    evidence: Constructing acceptance groups from Mel-spectrogram similarity instead of embedding cosine similarity
      yields higher WER and CER (13.9/7.9 vs. 12.6/6.6) at matched speaker similarity, for the same underlying method.
    confidence: high
    relevance: low
  - claim_id: discrete_acoustic_tokens_produced_by_neural_codec_language_models_often_form
    role: refines
    claim: Discrete acoustic tokens produced by neural codec language models often form large equivalence classes
      that can be substituted for one another with only minor perceptual cost, refining how much token-level precision
      is actually needed for faithful speech reconstruction.
    source: §4, Table 2
    evidence: Randomly replacing 91.4% of target-generated tokens with alternatives from their Acoustic Similarity
      Group changes WER by only +0.007 and speaker similarity by only -0.027 relative to unmodified target output.
    confidence: high
    relevance: low
  limitations:
  - The subjective study is small, with four raters evaluating 85 samples, limiting precision for close MOS comparisons.
  caveats:
  - For subjective evaluation, this paper provides medium-relevance evidence; claims primarily concerning other
    concepts remain included but are marked low relevance.


- id: '2511.05143'
