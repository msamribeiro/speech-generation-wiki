    role: complicates
    claim: Speaker identity labels derived from unsupervised diarization and clustering over large multi-narrator audiobook corpora do not perfectly recover ground-truth narrator identity, so speaker-conditioned training data built this way carries residual label noise.
    source: §3.5, §4.1
    evidence: The two-stage ECAPA-TDNN diarization-and-clustering pipeline achieves 97.0% consistency with known narrator labels only on the subset of audiobooks that had usable narrator metadata (roughly 60% of the corpus), with the remainder unverifiable against ground truth.
    confidence: high
    relevance: medium
  limitations:
  - Cross-paper MOS comparisons use different corpora, raters, and protocols; corpus speaker labels remain partly unverifiable.
