      source text-token sequence, while remaining synchronized to a parallel, independently-generated visual stream.
    source: §3.1
    evidence: TempoVoice's decoder uses zero-initialized, sinusoidally-positioned placeholder tokens as cross-attention
      queries over fused text-voice representations, enabling autoregressive audio-token generation in lockstep
