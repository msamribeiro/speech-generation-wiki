  - claim_id: mel_spectrogram_level_augmentation_used_to_improve_speaker_content_disen
    role: complicates
    claim: Mel-spectrogram-level augmentation used to improve speaker-content disentanglement can trade off phonetic fidelity for robustness.
    source: §6.1 "Effect of SR augmentation"
    evidence: The authors note that Spectrogram Resize augmentation (frequency- and time-axis mel perturbation) "can slightly distort phonetic details, potentially increasing WER in extreme cases," though they argue the strong semantic encoder largely offsets this risk.
    confidence: high
    relevance: low
  - claim_id: leaderboard_rankings_for_zero_shot_voice_conversion_do_not_agree_across
    role: complicates
    claim: Leaderboard rankings for zero-shot voice conversion do not agree across metrics, so a single aggregate score can mask which quality dimension actually improved.
    source: §5.2, Table 2
    evidence: Twinkle-VC wins on MOS, WER, and Final Score but ranks second in SMOS_TGT (target-speaker similarity) and third in SMOS_SRC (residual source similarity) among the four VLSP 2025 T1 submissions.
    confidence: high
    relevance: high
  limitations:
  - The four-system shared-task evaluation provides no ablations, so subjective gains cannot be attributed to individual components.
  caveats:
