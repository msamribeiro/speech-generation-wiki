    evidence: The sentiment-aware prosody module maintained a stable mean F0 (~262 Hz) and consistent pitch range across a 76-second multilingual sample and across cross-script transitions such as French-Arabic, with listeners citing "more expressive intonation" as a strength of the proposed system.
