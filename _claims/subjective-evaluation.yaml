  claims:
  - claim_id: a_single_global_utterance_level_conditioning_attribute_can_drive_a_synthesis
    role: supports
    claim: A single global (utterance-level) conditioning attribute can drive a synthesis system to apply a targeted
      modification in the correct, phonetically-restricted regions of an utterance, even when the attribute itself
      carries no positional information.
    source: §3.1, Table 1
    evidence: Embedding-space MAE between manipulated and unmanipulated representations grows with manipulation
      strength and is consistently larger for voiced phonemes than unvoiced phonemes, for both seen and unseen speakers
    confidence: high
    relevance: medium
  - claim_id: frame_wise_or_word_level_conditioning_signals_are_not_strictly_necessary_for
    role: refines
    claim: Frame-wise or word-level conditioning signals are not strictly necessary for controlling voice qualities
      that are themselves localized and intermittent; a coarser global attribute can produce comparable perceptual
      control.
    source: §3.2, Table 2
    evidence: The proposed global-conditioning system tracks the perceptual creak and MOS trends of CreakVC, a baseline
      that relies on frame-wise creak probabilities, across suppressed, unmanipulated, and amplified conditions
      in the listening test
    confidence: high
    relevance: high
  - claim_id: manipulating_a_learned_global_attribute_dimension_co_varies_with_the_establi
    role: supports
    claim: Manipulating a learned global attribute dimension co-varies with the established acoustic correlates
      of the target voice quality, indicating the manipulation captures genuine phonetic structure rather than an
      arbitrary embedding-space direction.
    source: §3.3, Table 3
    evidence: Pearson correlations between manipulation strength and independently measured pitch, HNR, and H1-H2
      are strong and in the direction predicted by the acoustic-phonetic definition of creaky voice
    confidence: high
