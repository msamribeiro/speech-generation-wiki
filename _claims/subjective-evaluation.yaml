- id: '2511.07116'
  published_date: '2025-11-10'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - TTS
  architecture:
  - diffusion
  relevance: high
  evidence_role:
  - infrastructure
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - diffusion_generation
  claims:
  - claim_id: framing_an_acoustic_feature_to_waveform_generation_problem_as_data_to_data_r
    role: supports
    claim: Framing an acoustic-feature-to-waveform generation problem as data-to-data restoration, where the reverse
      diffusion trajectory begins from a structurally-related surrogate of the target rather than Gaussian noise,
      shortens the required sampling trajectory and improves quality at low step counts.
    source: §V-B, Table IX; Fig. 13
    evidence: The proposed Schrödinger Bridge formulation, conditioned on a range-space spectral surrogate of the
      target Mel-spectrum instead of noise, matches or exceeds GAN and flow-matching baselines evaluated at 10-16
      steps using only 4 (and competitively even 2) diffusion steps.
    confidence: high
    relevance: low
  - claim_id: matching_a_diffusion_model_s_internal_network_architecture_to_the_frequency
    role: supports
    claim: Matching a diffusion model's internal network architecture to the frequency-domain structure of audio,
      via uneven subband decomposition concentrated at low/mid frequencies and large-kernel convolutional attention
      in place of self-attention, can substantially cut compute relative to image-derived backbones without sacrificing
      quality.
    source: §V-A, Table VI
    evidence: Replacing an NCSN++ backbone (borrowed from image diffusion) with the proposed subband-aware BCD network
      reduces MACs by 95.6% at matched inference steps while achieving equal or better PESQ, UTMOS, and M-STFT.
    confidence: high
    relevance: low
  - claim_id: naive_feature_space_distillation_losses_for_single_step_diffusion_based_spec
    role: complicates
    claim: Naive feature-space distillation losses for single-step diffusion-based spectral generation can fail
      specifically due to phase-wrapping ambiguity in complex spectral representations, rather than due to distillation
      as a strategy in general.
    source: §III-F, §V-D, Table XIII, Id1→Id2
    evidence: A standard L2 distillation loss on real/imaginary student-teacher outputs produces severe spectral
      distortion (PESQ 2.614); replacing it with an omnidirectional phase-aware distillation loss that applies fixed
      directional convolution kernels to the phase before comparison raises PESQ to 4.182 in the corresponding ablation.
    confidence: high
    relevance: low
  - claim_id: objective_spectral_reconstruction_metrics_for_vocoders_do_not_reliably_predi
    role: complicates
    claim: Objective spectral-reconstruction metrics for vocoders do not reliably predict subjective listener preference,
      particularly for high-frequency artifacts that fall outside the sensitivity of commonly used metrics.
    source: §V-B, Table XII discussion
    evidence: WaveFM attains competitive objective scores on LibriTTS and out-of-distribution sets but receives
      markedly lower similarity-MOS ratings than BridgeVoC and other baselines in listening tests, which participants
      attributed to audible high-frequency current-noise artifacts not penalized by the objective metrics used.
    confidence: high
    relevance: high
  limitations:
  - The study uses 24 trained listeners, and divergence between objective speaker similarity and SMOS complicates
    claims about identity preservation.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts
    remain included but are marked low relevance.


- id: '2511.08496'
  published_date: '2025-11-11'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - singing
  - VC
  architecture:
  - diffusion
  - hybrid
  relevance: high
  evidence_role:
  - infrastructure
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - diffusion_generation
  - hybrid_generation
  claims:
  - claim_id: combining_a_frozen_pre_disentangled_codec_s_content_and_speaker_features_wit
    role: supports
    claim: Combining a frozen, pre-disentangled codec's content and speaker features with explicit pitch and energy
      conditioning can match or exceed the quality of large-scale adversarially-trained zero-shot singing voice
      conversion systems while using substantially less training data and compute.
    source: §Experimental Results and Analysis, Table 1
    evidence: HQ-SVC, trained on under 80 hours of Mandarin singing data for 11 hours on a single RTX 3090, outperforms
      SaMoye-SVC (pretrained on 1,700 hours on an A100 for 7 days) on STOI, F0-RMSE, FPC, NISQA, and NMOS.
    confidence: high
    relevance: low
  - claim_id: whether_a_unified_codec_derived_representation_or_separate_dedicated_content
    role: complicates
    claim: Whether a unified codec-derived representation or separate dedicated content/speaker encoders produce
      better zero-shot voice conversion depends on which quality dimension is prioritized, not a uniform ranking.
    source: §Ablation Studies, Table 5
    evidence: The HQ-SVC-SE ablation, which replaces the shared FACodec front end with separate CAM++ (speaker)
      and ContentVec (content) encoders, improves SECS (timbre similarity) from 0.627 to 0.668 but degrades STOI,
      F0-RMSE, and NISQA relative to the unified-encoder design.
    confidence: high
    relevance: low
  - claim_id: automatic_speaker_similarity_metrics_derived_from_speaker_verification_embed
    role: complicates
    claim: Automatic speaker-similarity metrics derived from speaker-verification embeddings can diverge from human
      speaker-similarity judgments when pitch consistency is altered.
    source: §Experimental Results and Analysis
    evidence: SaMoye-SVC scores higher SECS than HQ-SVC (0.647 vs. 0.627) despite HQ-SVC scoring higher on subjective
      SMOS in the main comparison, and removing the speaker or F0 losses in ablation improves SMOS slightly while
      degrading SECS, which the authors attribute to CAM++ embeddings implicitly encoding pitch information that
      diverges from human perceptual sensitivity to pitch shifts.
    confidence: high
    relevance: high
  - claim_id: predicting_a_target_speaker_s_pitch_statistics_from_their_speaker_embedding
    role: supports
    claim: Predicting a target speaker's pitch statistics from their speaker embedding, rather than requiring reference
      pitch data, is a viable way to condition pitch generation in zero-shot voice conversion.
    source: §Enhanced Voice Adaption Module, Table 5
    evidence: The Speaker-F0 Predictor, trained with an L1 loss on predicted vs. actual F0 mean/variance from the
      speaker embedding alone, improves F0-RMSE, SECS, and NISQA relative to an ablation without this loss.
    confidence: high
    relevance: low
  - claim_id: feature_representations_designed_for_zero_shot_singing_voice_conversion_can
    role: supports
    claim: Feature representations designed for zero-shot singing voice conversion can transfer to audio super-resolution
      without architectural modification when training and inference sampling rates are deliberately mismatched.
    source: §Model Evaluation on Voice Super-resolution, Table 3
    evidence: Because HQ-SVC extracts features at 16 kHz but optimizes against 44.1 kHz ground-truth Mel spectrograms,
      the same trained model performs zero-shot voice super-resolution, outperforming AudioSR (trained on over 7,000
      hours) on NMOS and SMOS despite using under 80 hours of training data.
    confidence: high
    relevance: medium
  limitations:
  - The listening study uses 12 raters and eight samples per system, while objective speaker similarity and SMOS
    do not rank systems consistently.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts
    remain included but are marked low relevance.


- id: '2511.10112'
  published_date: '2025-11-13'
  entry_date: '2026-09-19'
