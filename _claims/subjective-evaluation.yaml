  architecture: []
  relevance: high
  evidence_role:
  - infrastructure
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family: []
  claims:
  - claim_id: llm_as_a_judge_evaluation_of_a_spoken_dialogue_model_s_transcribed_text_
    role: supports
    claim: LLM-as-a-judge evaluation of a spoken dialogue model's transcribed text response can closely approximate human judgment of correctness, provided the judgment task does not require perceiving audio-only information.
    source: §4.2, Reliability Analysis; Table 4
    evidence: Pearson, Spearman, and Kendall correlation coefficients between LLM-judge (GPT-4o and DeepSeek-R1) scores and human-expert labels of GPT-4o-Audio-Preview's responses all exceed 0.87 in both the English and Chinese subsets, with p < 0.001 for every coefficient.
    confidence: high
    relevance: high
  - claim_id: transcript_based_evaluation_of_spoken_dialogue_model_outputs_cannot_capt
    role: complicates
    claim: Transcript-based evaluation of spoken dialogue model outputs cannot capture whether the model produces correct prosodic realizations, so assessing certain generation capabilities requires directly evaluating the generated audio rather than its text.
    source: §4.2, LLM-based Evaluation
    evidence: For the phonological ambiguity "Generation" subtask (correcting pause placement, stress, intonation, heteronym or tonal pronunciation), the authors bypass transcription and have three human experts label each SDM's audio output directly, "as it requires examining phonological features that cannot be captured by the transcribed text."
    confidence: high
    relevance: high
  - claim_id: a_spoken_dialogue_model_s_relative_competence_ranking_is_language_depend
    role: complicates
    claim: A spoken dialogue model's relative competence ranking is language-dependent, so single-language evaluation cannot be assumed to generalize to the model's overall conversational competence.
    source: §5.2.3; Table 2
    evidence: GPT-4o-Audio-Preview is the top performer on the English subset (55.68% overall accuracy) but is outperformed by Qwen2.5-Omni on the Chinese subset (40.08% vs. GPT-4o-Audio-Preview's 29.45%); the English-Chinese accuracy gap exceeds 8 percentage points in every phenomenon category, and some models (e.g., Freeze-Omni, GLM-4-Voice) more than double their accuracy from Chinese to English.
    confidence: high
    relevance: medium
  - claim_id: explicitly_pointing_out_to_a_spoken_dialogue_model_that_a_comprehension_
    role: complicates
    claim: Explicitly pointing out to a spoken dialogue model that a comprehension-relevant phenomenon (e.g., omission, coreference) is present in the input only partially improves the model's ability to correctly resolve it.
    source: §5.2.2; Table 3
    evidence: Comparing detection accuracy against completion/resolution accuracy for the same phenomena, most SDMs score much higher on detecting the presence of omission or coreference than on completing or resolving it (e.g., overall omission detection reaches 38.65% in Chinese versus 3.75% for completion, and 8.57% versus 8.98% in English), showing the benefit of an explicit hint is limited or absent for most models.
    confidence: high
    relevance: medium
  limitations:
  - Most benchmark audio is TTS-synthesized and controlled, human audio judging can retain rater bias, and coverage is limited to English and Chinese end-to-end systems.
  caveats:
  - For subjective evaluation, this paper provides high-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.


- id: 2025.emnlp-main.1447
