  claims:
  - claim_id: automated_pipelines_combining_voice_activity_detection_asr_based_re_tran
    role: supports
    claim: Automated pipelines combining voice-activity detection, ASR-based re-transcription, and a linguistic completeness classifier can convert long-form audiobook recordings into TTS-ready segments at large scale without manual sentence-boundary annotation.
    source: §3.2, §4.1, Table 1
    evidence: The three-phase segmentation pipeline (WebRTC VAD, Google STT transcription, ParsBERT-based sentence-completion classifier with iterative 0.1-second boundary extension) processed 2,000 audiobooks into 5,158,344 initial segments, yielding 3,526 hours of clean speech before quality filtering.
