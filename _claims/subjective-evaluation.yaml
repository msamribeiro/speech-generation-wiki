  claims:
  - claim_id: replacing_idle_silence_token_prediction_with_structured_incremental_reas
    role: supports
    claim: Replacing idle silence-token prediction with structured incremental reasoning during the listening phase of a full-duplex spoken dialogue model improves response quality on tasks that require multi-step reasoning, with limited effect on tasks that do not.
    source: §4.4.1, Table 3
    evidence: Adding the chronological thinking chain improves GPT-judged response quality by 8.75% on SpokenWOZ (task-oriented dialogue requiring cross-turn and logical reasoning) but only 2.09% on MtBenchEval (casual multi-turn dialogue).
    confidence: high
    relevance: low
  - claim_id: decoupling_audio_token_prediction_into_a_separate_decoder_conditioned_on
    role: supports
    claim: Decoupling audio-token prediction into a separate decoder conditioned on the LLM's hidden states, rather than having a single LLM backbone predict both text and audio tokens, improves response quality in speech-to-speech dialogue models with an otherwise comparable architecture.
    source: §4.4.1, Table 3; §4.4.2, Table 4
    evidence: Both CT-Duplex variants (LLM predicts text only, separate Transformer decoder predicts speech) outperform SALM-Duplex (LLM predicts both text and audio jointly) on GPT score, BLEU, and Sentence-BERT similarity across SpokenWOZ and MtBenchEval, and on accuracy for Llama Questions and Web Questions.
    confidence: high
    relevance: low
  - claim_id: reasoning_mechanisms_added_to_the_listening_phase_of_a_full_duplex_dialo
    role: complicates
    claim: Reasoning mechanisms added to the listening phase of a full-duplex dialogue model yield little benefit on tasks that depend primarily on retrieving factual knowledge rather than performing multi-step inference over the conversation.
    source: §4.4.2, Table 4
    evidence: Chronological thinking produces only a 1.0-point accuracy gain on Llama Questions (31.4% vs. 30.4%) and a 0.1-point gain on Web Questions (13.3% vs. 13.2%) over the no-thinking ablation, attributed to these benchmarks requiring minimal reasoning.
    confidence: high
    relevance: low
  - claim_id: reasoning_content_for_a_streaming_dialogue_agent_can_be_amortized_within
    role: supports
    claim: Reasoning content for a streaming dialogue agent can be amortized within an existing idle listening window without introducing additional turn-taking or barge-in latency, provided the reasoning representation is compact and preemptible.
    source: §4.4.3, Table 5
    evidence: Turn-taking latency differs by only 0.23s and barge-in latency by 0.01s between the thinking and no-thinking variants, while barge-in success rate improves from 88.63% to 94.05% with thinking enabled.
    confidence: high
    relevance: low
  - claim_id: cross_system_comparisons_of_full_duplex_spoken_dialogue_models_against_h
    role: complicates
    claim: Cross-system comparisons of full-duplex spoken dialogue models against half-duplex or turn-based systems on knowledge benchmarks conflate architectural duplex mode and model scale with the effect of any specific mechanism under study.
    source: §4.4.2
    evidence: GLM-4-Voice (half-duplex, 9B parameters) outperforms CT-Duplex (full-duplex, 1.5B parameters) on Llama Questions and Web Questions accuracy, a gap the authors attribute partly to GLM-4-Voice's larger scale and its lack of real-time causal constraints rather than to the presence or absence of chronological thinking.
    confidence: high
    relevance: low
  limitations:
  - Subjective validation is a ten-rater A/B test on synthetic English dialogue and does not compare external systems.
  caveats:
  - For subjective evaluation, this paper provides low-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.
- id: '2510.03735'
  published_date: '2025-10-04'
  entry_date: '2026-09-19'
  year: 2025
  venue: arXiv
  task:
  - codec
  architecture:
  - GAN
  relevance: medium
  evidence_role:
  - core_evidence
  - evaluation_caution
  current_role: active_evidence
  method_family:
  - gan_adversarial_generation
  claims:
  - claim_id: a_cascade_of_codec_branches_operating_at_different_native_sampling_rates
    role: supports
    claim: A cascade of codec branches operating at different native sampling rates, where each higher-rate branch encodes only the residual left by lower-rate branches, can achieve frequency disentanglement without the reconstruction-and-recombination artifacts of hard spectral sub-band splitting.
    source: §V, Table III
    evidence: The 32 kHz branch's output correlates far more strongly with the true signal in its target [8-16 kHz] band (5.85 dB SDR) than in the [0-8 kHz] band it also touches (3.80 dB), and SDR measured near the 8 kHz crossover matches the overall SDR (5.61 dB vs. 5.67 dB), indicating no discontinuity artifact at the band boundary.
    confidence: high
    relevance: low
  - claim_id: frequency_cascade_disentanglement_in_neural_codecs_can_improve_reconstru
    role: complicates
    claim: Frequency-cascade disentanglement in neural codecs can improve reconstruction and perceptual quality over a matched non-disentangled baseline, but absolute perceptual quality still trails the reference signal by a wide margin.
    source: §IV.D, Table II
    evidence: MUSHRA scores for the proposed model reach only 53±20 (16 kHz) and 66±19 (32 kHz) against a reference of 95±9/96±5, an improvement over the retrained DAC baseline (31±18/49±20) but far from reference quality.
    confidence: high
    relevance: high
  - claim_id: a_codec_trained_with_residual_band_limited_conditioning_between_branches
    role: supports
    claim: A codec trained with residual, band-limited conditioning between branches can extrapolate plausible high-frequency content from low-frequency-only input, offering a route to bandwidth extension without task-specific supervision.
    source: §VI, Table IV, Table V
    evidence: Given a residual input containing no information above 8 kHz, the 32 kHz branch still achieves a small positive SDR in the missing [8-16 kHz] band and improves overall reconstruction metrics (mel loss 2.04 vs. 2.56, SI-SDR 6.22 dB vs. 3.75 dB) relative to naive upsampling of the low-rate reconstruction.
    confidence: high
    relevance: low
  - claim_id: generic_task_agnostic_frequency_disentanglement_methods_for_neural_codec
    role: complicates
    claim: Generic, task-agnostic frequency-disentanglement methods for neural codecs are often validated only on music, leaving their applicability to the speech-specific disentanglement goals (content, speaker, prosody separation) that motivate them empirically untested.
    source: §IV.A
    evidence: All training and evaluation data are drawn from MUSDB18 and Jamendo (music only), even though the paper's introduction and related work motivate the approach by referencing speech disentanglement and codec-based zero-shot TTS methods.
    confidence: high
    relevance: medium
  limitations:
  - The MUSHRA panel has 13 mostly audio-research listeners and two six-excerpt sets; all data are music rather than speech.
  caveats:
  - For subjective evaluation, this paper provides medium-relevance evidence; claims primarily concerning other concepts remain included but are marked low relevance.
