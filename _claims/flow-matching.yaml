  - id: "2507.14988"
    entry_date: 2026-07-15
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching]
    relevance: high
    evidence_role:
      - acceleration_evidence
      - core_evidence
    current_role: active_evidence
    method_family: [fm_acceleration]
    claims:
      - claim_id: dmospeech2_grpo_subcomponent_cheap_gains
        role: supports
        claim: "Applying GRPO to a discrete upstream subcomponent of a distilled TTS pipeline achieves perceptual metric gains at substantially lower computational cost than whole-system RL."
        source: "§3.2.2, §4.1, Table 1"
        evidence: "Duration-predictor GRPO fine-tuning uses only 4-step student inference for reward computation and converges in 1.5K steps; on Seed-TTS-en, WER improves from 3.750 (no RL) to 1.752 and SIM from 0.672 to 0.698 without modifying the synthesis model."
        confidence: high
        relevance: medium
      - claim_id: dmospeech2_duration_independently_bottlenecks
        role: supports
        claim: "Duration prediction quality independently constrains intelligibility and speaker similarity in non-autoregressive TTS regardless of synthesis model capacity."
        source: "§A.1, Table 3"
        evidence: "With the same flow-matching generator, WER on Seed-TTS-en ranges from 1.723 (best-of-8 oracle duration sampling) to 3.750 (unoptimized predictor) to 1.752 (RL-optimized), establishing duration as the primary bottleneck independent of the acoustic model."
        confidence: high
        relevance: medium
      - claim_id: dmospeech2_distillation_reduces_prosodic_diversity
        role: complicates
        claim: "Distribution matching distillation in flow-matching TTS reduces prosodic diversity disproportionately relative to acoustic quality, concentrating degradation in temporal and structural dimensions."
        source: "§3.3.1, §4.3.3, Table 1, Figure 3"
        evidence: "Step reduction from 32 to 4 lowers pitch coefficient of variation (CV-f0) by 30.3% (0.666 to 0.464) while mean-centered UTMOS distributions remain consistent across teacher and student, showing diversity loss is prosodic rather than spectral."
        confidence: high
        relevance: high
      - claim_id: dmospeech2_bestofn_ceiling_for_rl_duration
        role: refines
        claim: "Best-of-N sampling over discrete duration predictions establishes a practical performance ceiling for RL-based duration optimization in non-autoregressive TTS."
        source: "§A.1, Table 3"
        evidence: "Best-of-8 duration sampling achieves WER 1.723 and SIM 0.724 on Seed-TTS-en; the RL-optimized system reaches WER 1.752 and SIM 0.698 in a single pass, approaching but not fully closing the gap to this oracle upper bound."
        confidence: high
        relevance: low
      - claim_id: dmospeech2_teacherguided_restores_diversity
        role: supports
        claim: "A hybrid inference strategy using a high-diversity teacher for early denoising and a distilled student for acoustic refinement can restore prosodic diversity without sacrificing metric optimization gains."
        source: "§3.3.2, §4.3.3, Table 1"
        evidence: "Teacher-guided sampling (t_switch=0.25, 16 steps) recovers CV-f0 to 0.593 (89.1% of teacher diversity) while achieving WER 1.738 and SIM 0.699, outperforming the teacher on both objective metrics at 1.8x faster RTF than the F5-TTS teacher."
        confidence: high
        relevance: high
    limitations:
      - "RL training is sensitive to step count: performance degrades beyond 1.5K steps due to reward over-optimization, constraining total optimization capacity."
      - "The teacher-guided variant requires holding both teacher (300M) and student (300M) models in memory simultaneously, which may be prohibitive in constrained deployments."
    caveats:
      - "The prosodic-diversity-loss finding (claim 3) directly complicates the existing fm_inference_acceleration cluster's characterisation of distillation as a low-cost acceleration mechanism, identifying a specific dimension (prosody) where quality is not preserved."
      - "The teacher-guided sampling mechanism (claim 5) provides a partial remedy but does not fully recover teacher-level diversity, and doubles memory requirements relative to student-only inference."

