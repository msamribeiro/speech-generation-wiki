        evidence: "ASR pre-training reduces ChatGPT Score from 39.32 to 34.02 and TTS pre-training to 27.22, while ASR-WER improves only marginally."
        confidence: high
        relevance: low
      - claim_id: slamomni_timbre_control_data_constrained
        role: complicates
        claim: "Zero-shot timbre control in spoken dialogue systems achieves competitive speaker similarity but remains constrained by training data volume relative to dedicated TTS systems."
        source: "§5.2, Table 5"
        evidence: "SLAM-Omni reaches SIM-o of 0.517, comparable to FireRedTTS (0.486) but below CosyVoice2 (0.684), with the gap attributed to approximately 50x less training data."
