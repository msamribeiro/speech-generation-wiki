        role: supports
        claim: "Aligning audio encoder outputs to speaker-independent text embeddings via monotonic alignment search produces representations with negligible residual speaker identity."
        source: "§4.1, §5, Table 1"
        evidence: "The SemAlign-trained semantic encoder achieves 2.84% speaker classification accuracy on LibriHeavy, versus 82.05% for the same encoder's raw tokenizer output, confirming near-complete speaker information removal."
        confidence: high
        relevance: low
      - claim_id: semalignvc_no_speaker_embedding_higher_sim
        role: supports
        claim: "Zero-shot voice conversion without explicit speaker verification embeddings can achieve higher speaker similarity than systems that rely on them."
        source: "§4.2, Tables 2-3"
        evidence: "SemAlignVC achieves the highest SMOS (3.29) and speaker similarity across three embedding models among KNNVC, HierSpeech++, and UniAudio, despite using only a reference mel excerpt (fed to the flow-matching acoustic model) rather than a speaker embedding."
        confidence: high
        relevance: low
      - claim_id: semalignvc_disentanglement_intelligibility_tradeoff
        role: complicates
        claim: "Aggressive timbre disentanglement via text-embedding alignment introduces intelligibility trade-offs when BERT-derived representations replace phoneme-based encodings."
        source: "§5, Table 3"
        evidence: "SemAlignVC achieves 12.31% WER on LibriHeavy compared to HierSpeech++'s 8.24%, attributed to occasional word substitutions from the semantic ambiguity of BERT token representations during generation."
        confidence: medium
