        relevance: high
      - claim_id: e2ebpvc_metrics_insufficient_for_background
        role: complicates
        claim: "Standard voice conversion evaluation metrics (speaker similarity, character error rate, speech quality) are insufficient for assessing systems that operate on speech with background sounds."
        source: "§4.1, Table 1"
        evidence: "ECAPA-TDNN speaker similarity and ASR-based CER are degraded by background sound in both source and converted audio, causing a clean-output-only baseline to appear relatively stronger on objective metrics despite scoring only 0.70 on background-similarity MOS."
        confidence: medium
        relevance: low
      - claim_id: e2ebpvc_noise_robust_ssl_improves_disentanglement
        role: supports
        claim: "Noise-robust self-supervised speech representations improve content disentanglement in voice conversion systems trained on speech with background sounds."
        source: "§4.3, Table 3"
        evidence: "Replacing HuBERT with WavLM as the semantic-token backbone for the flow-matching conditioning reduces CER from 10.27 to 7.99 under noisy evaluation, and training k-means on noisy speech further reduces CER to 7.99 vs 9.22."
        confidence: medium
        relevance: medium
      - claim_id: e2ebpvc_background_objective_tradeoff
        role: complicates
        claim: "Designing a single voice conversion model to handle background preservation introduces a competing objective that slightly degrades clean-speech conversion quality relative to a clean-speech-only system."
        source: "§4.1, Table 1"
        evidence: "E2E-BPVC achieves SIM 0.849 and CER 3.18 on clean-speech conversion, modestly below a clean-only ICL-VC baseline (SIM 0.873, CER 2.37)."
        confidence: medium
        relevance: medium
    limitations:
      - "Evaluation relies exclusively on LibriTTS with synthetically added noise and music at controlled SNRs, without testing on real-world recordings with natural, non-stationary backgrounds."
      - "The comparison set is limited to two baselines sharing the same ICL-VC foundation, so the flow-matching backbone's performance relative to independent VC architectures is unknown."
    caveats:
      - "The flow-matching model here is an 8-layer Transformer encoder predicting mel spectrograms via the standard ODE formulation; the paper's novelty is the mask-and-reconstruct task design rather than a change to the flow-matching mechanism itself."

