    caveats:
      - "This is the first application of consistency-model training to flow matching specifically for TTS (as distinct from diffusion consistency distillation, e.g. Comospeech); the paper's own field-significance assessment (high) credits the insight that straight FM trajectories are a superior foundation for consistency training compared to curved diffusion trajectories."
