        claim: "Duration prediction strategy choice in zero-shot TTS presents language-dependent trade-offs between intelligibility and speaker similarity that are not consistent across multilingual settings."
        source: "§5, Table 3, Table 5"
        evidence: "The speaker-prompted (PFlow-style) duration predictor improves Tamil intelligibility (WER 0.295 vs. 0.312) and speaker similarity but degrades Marathi intelligibility substantially (WER 0.365 vs. 0.224 for infill), while Bengali evaluation favours infill on both dimensions."
        confidence: high
        relevance: medium
      - claim_id: indiantts_speaker_prompted_duration_no_alignment
        role: supports
        claim: "Speaker-conditioned audio prompting enables duration prediction without forced alignment, yielding competitive or superior speaker similarity in low-resource multilingual TTS."
        source: "§3.4.2, §5.1, Table 4, Table 5"
        evidence: "The 84M-parameter speaker-prompted predictor, conditioning on a 3-second mel segment via cross-attention, achieves higher speaker similarity than the infill predictor for Tamil, Telugu, and Bengali without using duration context at inference."
        confidence: high
        relevance: medium
      - claim_id: indiantts_pooled_lowresource_needs_filtering
        role: complicates
        claim: "Pooled low-resource training corpora for multilingual TTS contain significant quality variance that requires aggressive filtering before flow-matching models can be reliably trained."
        source: "§4.2.2"
        evidence: "WER-based filtering using IndicWhisper reduced the Hindi training set from 1.3M to 1M utterances, indicating roughly 23% of the raw pooled corpus was too noisy or misaligned to be usable."
        confidence: medium
        relevance: low
      - claim_id: indiantts_speaker_prompt_benefit_depends_on_phonology
        role: refines
        claim: "The relative benefit of speaker-prompted duration conditioning over text-and-alignment conditioning is not uniform and depends on the phonological and prosodic characteristics of the target language."
        source: "§5.1, §5.2, Table 3, Table 4, Table 5"
        evidence: "Tamil, with complex phoneme structures and high prosodic variability, benefits consistently from speaker prompting; Marathi shows a clear regression; Hindi and Bengali show mixed patterns depending on test subset."
        confidence: medium
        relevance: low
    limitations:
      - "All experiments use speech infilling (50% masking), not full-sentence TTS generation; results may not transfer directly to single-utterance TTS evaluation."
      - "No external TTS baselines from the Indian language literature are included; comparisons are only against the two proposed duration predictors and ground truth."
    caveats:
      - "The audio backbone is a Voicebox-style CNF trained with the flow-matching objective, unmodified except for training data; the paper's contribution is a comparative study of two duration-prediction strategies, one of which (PFlow-style) is itself borrowed from prior work."
      - "This paper's own field_significance rating is low; findings are narrow in scope (five Indian languages, infilling task only) and language-dependent rather than generalisable flow-matching principles."

