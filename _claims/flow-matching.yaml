        role: supports
        claim: "A mel-conditioned prior that matches the energy distribution of the target signal reduces transportation cost in flow matching vocoders and substantially improves one-step generation quality."
        source: "§3.1, Table 4"
        evidence: "Removing the mel-conditioned prior (reverting to standard Gaussian noise) drops SMOS from 4.11 to 3.79 in the paper's component ablation, the single largest contributor among the three innovations."
        confidence: high
        relevance: high
      - claim_id: wavefm_reparam_enables_aux_losses
        role: supports
        claim: "Reparameterizing the flow matching objective to directly predict clean output, rather than random derivatives, enables auxiliary perceptual losses (STFT, mel) and periodic activation functions that cannot otherwise be applied."
        source: "§3.2, Table 4"
        evidence: "Without the reparameterization, SMOS drops to 3.88 because auxiliary STFT and mel losses and Snake-beta periodic activations cannot be applied to a model predicting random instantaneous derivatives."
        confidence: high
        relevance: high
      - claim_id: wavefm_consistency_distillation_near_gan_speed
        role: supports
        claim: "Consistency distillation can be adapted to flow matching vocoders with dynamic priors, enabling single-step inference at near-GAN speeds without adversarial training."
        source: "§3.3, Table 3"
        evidence: "WaveFM-1 Step (distilled) achieves SMOS 4.11 and runs at 303x real-time, essentially matching HiFi-GAN V1's 325x real-time speed, using only ~25k additional distillation steps on top of the base 1M training steps."
        confidence: high
        relevance: high
      - claim_id: wavefm_aux_losses_improve_ood_generalisation
        role: supports
        claim: "Flow matching vocoders trained with auxiliary perceptual losses generalize better to out-of-distribution audio (music) than diffusion vocoders trained without them."
        source: "§4.4, Table 2"
        evidence: "WaveFM-6 Steps achieves SMOS 4.05 versus BigVGAN-base's 3.95 on out-of-distribution MUSDB18-HQ music, attributed to the refined multi-resolution STFT and mel auxiliary losses unlocked by the reparameterized objective."
        confidence: medium
        relevance: medium
    limitations:
      - "The model is a vocoder (mel-to-waveform); it does not address text-to-mel acoustic modeling."
      - "Evaluated only on English speech; whether the reparameterization technique generalizes to latent (non-waveform) flow matching is unexplored."
    caveats:
      - "The reparameterized flow-matching objective (predicting clean output rather than instantaneous derivatives) is a transferable design pattern that could apply beyond vocoding to other flow-matching speech generation stages."
      - "Comparisons are primarily against GAN and diffusion vocoder baselines (HiFi-GAN, BigVGAN, DiffWave, PriorGrad, FastDiff, FreGrad); no comparison against other flow-matching vocoders (e.g. PeriodWave) is reported."

