      - "The 12.5 Hz frame rate of the content-style tokenizer slightly limits voice conversion intelligibility compared to the FM-only Vevo2-FM variant operating at 50 Hz."
      - "Singing voice training data (7K hours, source-separated from in-the-wild songs) may have variable quality, and generalisation to tonal languages in singing is not specifically evaluated."
    caveats:
      - "Vevo2's core novelty (chromagram prosody tokenizer, EPL/IPL unification, multi-objective GRPO) sits at the AR/tokenizer and post-training stages; the flow-matching acoustic stage itself is architecturally unchanged from prior AR+FM systems (Vevo, CosyVoice), consistent with this concept YAML's existing trend_note that recent hybrid papers increasingly direct their contributions away from the FM stage."

  - id: "2508.16790"
    published_date: "2025-08-22"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [codec, TTS]
    architecture: [diffusion, transformer-enc-dec, autoregressive-LM]
    relevance: medium
    evidence_role:
      - core_evidence
      - infrastructure
    current_role: frontier_probe
    method_family: [fm_vocoder]
    claims:
      - claim_id: tadicodec_text_conditioning_enables_compression
        role: supports
        claim: "Text conditioning in the codec decoder, rather than in the language model alone, is a viable lever for achieving extreme compression rates in speech tokenization without adversarial training."
        source: "§3.1, Table 4"
        evidence: "Ablating text conditioning at 12.5 Hz pushes WER above 10%, while the full text-aware decoder at 6.25 Hz achieves WER 3.02 (2.73 with fine-tuning), showing text conditioning is what enables the aggressive compression rate."
        confidence: high
        relevance: low
      - claim_id: tadicodec_single_fm_objective_sufficient
        role: supports
        claim: "A single end-to-end training objective (flow-matching loss) is sufficient to jointly optimise quantization and reconstruction in a speech codec, eliminating the need for multi-stage pipelines."
        source: "§3.1, §4.2.2"
        evidence: "TaDiCodec trains its encoder, BSQ quantizer, and diffusion decoder jointly with a single flow-matching loss, in contrast to prior diffusion-decoder codecs (CosyVoice, FireRedTTS, Vevo) that train the VQ and decoder as separate stages."
        confidence: high
        relevance: high
      - claim_id: tadicodec_reconstruction_generation_gap_varies
        role: supports
        claim: "The reconstruction-generation gap - the degradation in intelligibility when tokens are predicted by a language model rather than encoding reference speech - varies substantially across tokenizer architectures and is not captured by reconstruction metrics alone."
        source: "§4.3, Figure 3"
        evidence: "TaDiCodec retains nearly all reconstruction quality at generation time, while a comparison tokenizer (Mimi) degrades by 104.5% on English WER from reconstruction to generation."
        confidence: medium
        relevance: low
      - claim_id: tadicodec_lower_rate_improves_ar_intelligibility
        role: supports
        claim: "Lower token rates in speech tokenizers can improve autoregressive TTS intelligibility by shortening prediction sequences and reducing error accumulation, particularly on linguistically challenging inputs."
        source: "§4.3, Table 5"
        evidence: "TaDiCodec-AR (4B) at 6.25 Hz achieves WER 2.28/1.19 (en/zh) on SeedTTS, outperforming CosyVoice 2 and MaskGCT, with larger gains on code-switching test sets (9.16 vs. 15.03 WER)."
        confidence: medium
        relevance: low
      - claim_id: tadicodec_bsq_stable_without_commitment_loss
        role: supports
        claim: "Binary Spherical Quantization without a commitment loss achieves stable end-to-end training of a speech codec and produces superior representations to standard VQ under equal codebook sizes."
        source: "§4.2.2, Table 4"
        evidence: "BSQ projects encoder embeddings onto a unit hypersphere and binarises each dimension without a learnable codebook or commitment loss, enabling stable joint training with the flow-matching decoder loss."
        confidence: medium
        relevance: low
    limitations:
      - "The text-aware decoder requires a transcript at both training and inference time, and is not a general-purpose audio codec; performance at 6.25 Hz without text conditioning is not competitive."
      - "The diffusion decoder's multi-step inference (32 steps) is slower than GAN vocoders, and reducing to 5 steps degrades quality noticeably; distillation is proposed but not yet demonstrated."
    caveats:
      - "This paper's architecture tag does not include flow-matching, but its decoder training objective is explicitly a flow-matching loss; its relevance to this concept is the finding that a single FM objective can jointly train quantization and reconstruction, a novel application of the FM training paradigm to the codec-design problem rather than to acoustic modeling."

  - id: "2508.19098"
    published_date: "2025-08-26"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching, VAE]
    relevance: high
    evidence_role:
      - core_evidence
      - architecture_variant
      - acceleration_evidence
    current_role: influential
    method_family: [continuous_ar_fm_head]
    claims:
      - claim_id: clear_continuous_vae_reduces_ar_steps
        role: supports
        claim: "Replacing discrete neural codec tokens with continuous VAE latents in an autoregressive TTS framework reduces the number of AR decoding steps and lowers inference RTF without sacrificing speech quality."
        source: "§5.1, Table 2"
        evidence: "CLEAR-Base needs an average of 78 AR decoding steps for a 10-second utterance (RTF 0.18) versus VALL-E's 750 steps (RTF 1.03) and MELLE's 620 steps (RTF 0.55), while matching or exceeding their WER."
        confidence: high
        relevance: high
      - claim_id: clear_per_token_mlp_fm_enables_streaming
        role: supports
        claim: "A per-token MLP rectified flow head that operates independently on each AR hidden state enables streaming speech synthesis with latency competitive with non-streaming systems."
        source: "§5.3, Table 4"
        evidence: "The MLP flow head decodes each conditioning vector as soon as it is produced, rather than waiting for full-sequence context as DiT-based heads require, yielding 96ms first-frame latency and WER 2.34% in streaming mode versus near-identical non-streaming performance."
        confidence: high
        relevance: high
      - claim_id: clear_high_compression_vae_reconstruction_quality
        role: supports
        claim: "High-compression-ratio VAE latents (2048x downsampling) can achieve reconstruction quality comparable to ground truth on standard benchmarks while producing sequences short enough to benefit AR sequence modeling."
        source: "§3.4, Appendix C.1"
        evidence: "The wav-VAE compresses 16kHz audio to roughly 7.8 latent frames per second (versus 100 for mel spectrograms) using shortcut connections and a multi-task reconstruction loss, enabling CLEAR's short AR sequences."
        confidence: medium
        relevance: medium
      - claim_id: clear_joint_single_stage_matches_cascaded
        role: supports
        claim: "Continuous AR TTS systems trained with a joint language model and flow-matching head in a single stage can match or exceed the WER of two-stage cascaded discrete AR systems trained on comparable data."
        source: "§5.1, Table 1"
        evidence: "CLEAR-Large achieves WER 1.88% on LibriSpeech-PC test-clean, a 21.3% relative WER reduction over DiTAR (600M, a comparable two-stage cascaded system), while using fewer AR decoding steps."
        confidence: high
        relevance: high
      - claim_id: clear_objective_sim_underestimates_perceptual_fidelity
        role: complicates
        claim: "Objective speaker similarity metrics underestimate the perceptual voice fidelity of AR systems that rely entirely on in-context learning from an audio prompt, as shown by divergence between WavLM-TDNN scores and subjective S-MOS ratings."
        source: "§5.2, Table 3, Appendix D.2"
        evidence: "CLEAR relies entirely on in-context learning from the audio prompt with no explicit speaker-embedding conditioning, and its WavLM-TDNN speaker-similarity score lags systems with explicit speaker embeddings despite competitive subjective S-MOS."
        confidence: medium
        relevance: low
    limitations:
      - "CLEAR relies entirely on in-context learning from the audio prompt with no explicit speaker conditioning, limiting speaker fidelity under high VAE compression relative to systems with explicit speaker embeddings."
      - "Evaluation is English-only; multilingual generalisation of the per-token rectified-flow-head architecture is untested."
    caveats:
      - "CLEAR's rectified-flow head is architecturally distinct from DiT-based continuous-AR heads (ARDiT, DiTAR, FELLE's per-token flow matching) in that it denoises each AR hidden state independently via a lightweight MLP rather than a transformer, which is the mechanism enabling its streaming capability; comparisons to DiTAR/F5-TTS use different training data (Libri-50k vs. Emilia-100k), partially confounding direct WER comparison."

  - id: "2502.11128"
    published_date: "2025-09-03"
