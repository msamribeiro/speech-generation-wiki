    claims:
      - claim_id: svcc2025_dynamic_features_harder_than_static
        role: supports
        claim: "Dynamic temporal features in singing (vibrato, glissando, breathy voice) are substantially harder to convert than static spectral features, and current systems cannot model them reliably."
        source: "§4.1"
        evidence: "Style accuracy scores for vibrato (43.9%), glissando (42.6%), and breathy (37.3%) were markedly lower than falsetto (48.8%), mixed voice (48.3%), and pharyngeal (44.8%)."
        confidence: high
        relevance: low
      - claim_id: svcc2025_joint_conversion_degrades_naturalness
        role: supports
        claim: "Jointly converting singer identity and singing style simultaneously degrades naturalness compared to identity-only conversion."
        source: "§4.1"
        evidence: "Top SVCC 2025 systems achieved approximately 3.7 MOS naturalness, below the approximately 3.9 MOS ground truth, whereas prior SVCC 2023 top systems reached human-level naturalness on the simpler identity-only task."
        confidence: medium
        relevance: low
      - claim_id: svcc2025_arlm_fm_competitive_with_diffusion
        role: supports
        claim: "Autoregressive language model architectures with flow-matching decoders are competitive with specialized diffusion systems for singing voice conversion."
        source: "§4.1"
        evidence: "Systems based on Vevo1.5 (ARLM + flow-matching decoder) achieved the highest singing style similarity scores in the challenge, outperforming pure diffusion-based systems using SeedVC and Serenade."
        confidence: medium
        relevance: high
      - claim_id: svcc2025_neural_mos_predictors_correlate_better
        role: supports
        claim: "Neural MOS prediction models show stronger correlation with subjective naturalness scores for singing voice than traditional signal-based metrics."
        source: "§4.2"
        evidence: "SHEETSSQA and SingMOS achieved Spearman rank correlation coefficients above 0.6 with subjective naturalness scores; speaker and singer embeddings were the strongest predictors of identity and style similarity."
        confidence: high
        relevance: low
      - claim_id: svcc2025_identity_evaluation_confounded_by_design
        role: complicates
        claim: "Singer identity similarity evaluation in challenges is confounded by evaluation design: even ground truth recordings achieve only approximately 70% similarity scores with a single-sample reference."
        source: "§4.1"
        evidence: "Ground truth samples reached only approximately 70% singer identity similarity in SVCC 2025 listening tests; the challenge responded by presenting three reference samples per singer instead of one."
        confidence: medium
        relevance: low
    limitations:
      - "The challenge attracted only 7 participating teams (26 systems including ablations), limiting the diversity of architectural approaches evaluated, including within the flow-matching-based baselines and submissions."
    caveats:
      - "Flow matching appears as the decoder in several of the strongest baselines and submissions (Serenade, Vevo1.5, NU-SVC) but the paper itself contributes no new flow-matching architecture; its role for this concept is comparative evidence that ARLM+flow-matching hybrids are competitive with pure diffusion systems in singing voice conversion."

  - id: "2509.15845"
    published_date: "2025-09-19"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching, autoregressive-LM]
    relevance: high
    evidence_role:
      - architecture_variant
      - control_evidence
    current_role: active_evidence
    method_family: [fm_auxiliary_attribute]
    claims:
      - claim_id: deepdubbing_fm_generates_speaker_embeddings_from_text
        role: supports
        claim: "Conditioning a flow matching model to generate speaker embeddings from natural language descriptions enables automatic voice assignment for characters without requiring reference audio."
        source: "§2.2, §3.3, Table 2"
        evidence: "The TTT model, trained with OT-CFM to map text descriptions to speaker embeddings, achieves CMS of 2.866 and sex accuracy above 96% for adult demographics; Qwen3-Embedding-0.6B outperforms T5-Large and RoBERTa-Large."
        confidence: high
        relevance: high
      - claim_id: deepdubbing_emotion_instructions_improve_expressiveness
        role: supports
        claim: "Providing LLM-derived emotion-scene instructions as an additional conditioning signal to TTS improves emotional expressiveness without substantially degrading intelligibility."
        source: "§3.3, Table 3"
        evidence: "CA-Instruct-TTS achieves MOS-E of 4.15 vs. 3.67 and MOS-N of 3.33 vs. 3.10 compared to the instruction-free CA-TTS baseline, with WER increasing only from 2.39% to 2.54%."
        confidence: high
        relevance: low
      - claim_id: deepdubbing_embedding_speaker_gen_degrades_child_voices
        role: complicates
        claim: "Embedding-based speaker generation from text degrades for child voices due to acoustic similarity and training data artifacts."
        source: "§3.3, Figure 2"
        evidence: "The TTT model shows notably lower age accuracy for the child category (74.38% with TTT-Qwen3-0.6B) compared to adult categories (90%+)."
        confidence: medium
        relevance: medium
      - claim_id: deepdubbing_larger_encoders_improve_embedding_generation
        role: supports
        claim: "Larger, semantically richer text encoders improve text-conditioned speaker embedding generation across demographic categories."
        source: "§3.3, Table 2"
        evidence: "TTT-Qwen3-0.6B achieves substantially higher CMS (2.866) and age accuracy across most categories compared to TTT-T5-Large (CMS 2.375) and TTT-RoBERTa-Large (CMS 2.359)."
        confidence: medium
        relevance: medium
      - claim_id: deepdubbing_fm_extends_to_speaker_embedding_synthesis
        role: refines
        claim: "The flow matching framework extends naturally from speech waveform generation to speaker embedding synthesis."
        source: "§2.2"
        evidence: "The OT-CFM framework is applied directly to the generation of continuous speaker embedding vectors from noise, using the same DiT backbone and conditioning architecture as the speech-side flow matching decoder."
        confidence: medium
        relevance: high
    limitations:
      - "All evaluations use proprietary internal data; no comparisons to published expressive audiobook TTS systems are included, limiting independent verification of the flow-matching-based TTT module's reported gains."
      - "The TTT model struggles with child voice generation, an acknowledged limitation tied to data scarcity and label noise in child speech corpora."
    caveats:
      - "The genuine flow-matching-specific novelty is the TTT module's application of OT-CFM to speaker-embedding synthesis (a continuous but non-waveform target space); the CA-Instruct-TTS module's own flow-matching decoder is a largely unmodified component from the CosyVoice-style architecture it follows."

  - id: "2509.17988"
    published_date: "2025-09-22"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching]
    relevance: medium
    evidence_role:
      - evaluation_caution
      - infrastructure
    current_role: minor
    method_family: [pure_fm]
    claims:
      - claim_id: nordparl_inthewild_recordings_convertible_to_corpora
        role: supports
        claim: "In-the-wild recordings can be converted into usable TTS training corpora at scale for languages lacking studio-recorded resources, provided the processing pipeline applies dedicated noise, diarization, VAD, and perceptual-quality filtering."
        source: "§3.1, §3.2, Table 1"
        evidence: "An adapted Emilia-style pipeline applied to parliamentary recordings yields 900 hours of Finnish and 5090 hours of Swedish TTS-ready speech, where previously only 60 hours (Finnish) or zero hours (Swedish) of public data existed."
        confidence: high
        relevance: low
      - claim_id: nordparl_dual_asr_crossvalidation_filters_transcripts
        role: supports
        claim: "Cross-validating transcripts from two independently trained ASR models is a practical way to filter noisy automatic transcripts for corpus construction when a single ASR system is unreliable for the target language."
        source: "§3.1"
        evidence: "Because faster-whisper-large-v3 underperformed on Finnish, the pipeline retained only segments where Whisper and a Finnish-specific Wav2Vec2-large model's transcripts agreed within 5% WER."
        confidence: high
        relevance: low
      - claim_id: nordparl_explicit_alignment_improves_intelligibility
        role: complicates
        claim: "Explicit duration/alignment modeling in non-autoregressive TTS improves intelligibility and reduces hallucination relative to implicit alignment learned via diffusion transformers, but this comes at some cost to perceived naturalness."
        source: "§5, Table 2"
        evidence: "Matcha-TTS (explicit MAS alignment) achieves substantially lower CER (2.55% Finnish, 4.66% Swedish) and far fewer hallucinated utterances than F5-TTS-Base (6.72% Finnish, 13.64% Swedish CER), yet F5-TTS-Base scores higher CMOS in both languages."
        confidence: high
        relevance: high
      - claim_id: nordparl_speaker_sim_conditioning_inconsistent_across_languages
        role: complicates
        claim: "The relative speaker-similarity performance of prompt-based zero-shot conditioning versus fixed speaker-embedding conditioning is not consistent across languages or training corpora."
        source: "§5, Table 2"
        evidence: "Fixed speaker-embedding conditioning (Matcha-TTS) outperforms prompt-based conditioning (F5-TTS-Base) on Finnish SIM (0.566 vs. 0.538) but underperforms it on Swedish SIM (0.442 vs. 0.53)."
        confidence: medium
        relevance: medium
    limitations:
      - "No autoregressive TTS baseline was evaluated due to lack of available open-source implementations, so the benchmarking results reflect only two non-autoregressive, flow-matching-based systems (Matcha-TTS, F5-TTS)."
      - "Subjective evaluation used 20-22 raters per language, a modest panel size for CMOS/SMOS testing."
    caveats:
      - "The paper's primary contribution is dataset construction; its flow-matching-relevant findings (explicit MAS alignment vs. implicit DiT-based alignment trade-offs) are a validation exercise using existing published systems rather than a new architectural contribution."

  - id: "2509.18060"
    published_date: "2025-09-22"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching]
    relevance: medium
    evidence_role:
      - control_evidence
      - architecture_variant
    current_role: minor
    method_family: [pure_fm]
    claims:
      - claim_id: tmdtts_dialect_specific_ffn_routing_captures_variation
        role: supports
        claim: "Routing hidden representations through dialect-specific sub-networks inside the Transformer FFN captures fine-grained dialectal acoustic variation more effectively than conditioning through a shared-parameter network alone."
        source: "§3.3, Table 2"
        evidence: "Ablating DSDR-Net (replacing it with a standard shared FFN) while keeping the dialect fusion embedding drops dialect classification accuracy from 80.25% to 60.12% and dialect embedding cosine similarity from 78.3% to 58.6%."
        confidence: high
        relevance: low
      - claim_id: tmdtts_early_conditioning_beats_late_stage_vocoders
        role: supports
        claim: "Injecting dialect/style conditioning early, into both the encoder and the generative (flow-prediction) network, produces more dialect-consistent speech than injecting it only at the output stage via separate per-dialect vocoders."
        source: "§3.2, Table 1"
        evidence: "Compared to a prior Tibetan multi-dialect design sharing a mel-decoder with separate per-dialect WaveNet vocoders, TMD-TTS's early dialect fusion module plus DSDR-Net reaches up to 88.09% DECS and 87.78% DCA versus 65.2-65.8% for the late-fusion baseline."
        confidence: high
        relevance: medium
      - claim_id: tmdtts_synthetic_dialect_speech_usable_downstream
        role: supports
        claim: "Synthetic speech generated by a dialect-conditioned TTS system, when filtered for dialect consistency and perceptual quality, is usable as training data for a downstream speech-to-speech conversion task and can outperform a small, manually collected parallel corpus."
        source: "§3.5, Table 4"
        evidence: "A voice conversion model (DurFlex-EVC) trained on the TMDD dataset synthesized by TMD-TTS achieves higher MOS (3.23/3.63 at 16k/22kHz) than the same model trained on the prior manually collected baseline dataset (3.07/3.54)."
        confidence: medium
        relevance: low
      - claim_id: tmdtts_consistency_gains_cost_inference_speed
        role: complicates
        claim: "Gains in speaker/style-consistency metrics from dialect- or attribute-specific conditioning mechanisms can come with a measurable inference-speed cost relative to simpler architectures."
        source: "§3.2"
        evidence: "TMD-TTS's real-time factor (~0.031-0.032) is roughly 50% higher than VITS2's (~0.020-0.021), even though TMD-TTS still meets real-time synthesis requirements."
        confidence: medium
        relevance: low
    limitations:
      - "The evaluation is confined to a single language (Tibetan) and its three dialects; no experiments test whether the dialect-conditioning approach generalizes to other flow-matching TTS backbones."
    caveats:
      - "TMD-TTS is built directly on Matcha-TTS's conditional flow-matching decoder without modification to the flow-matching objective itself; the concept-relevant contribution is limited to how dialect conditioning is injected into the encoder and flow-prediction network."

  - id: "2509.18470"
    published_date: "2025-09-22"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [diffusion, flow-matching]
    relevance: high
    evidence_role:
      - architecture_variant
      - evaluation_caution
    current_role: frontier_probe
    method_family: [pure_fm]
    claims:
      - claim_id: graddt_discrete_time_matches_continuous_baseline
        role: supports
        claim: "A fully discrete-time training and inference formulation can match the subjective and objective speech quality of a continuous-time diffusion baseline while eliminating the continuous/discrete mismatch inherent to score-based samplers."
        source: "§4.1, Table 1; §4.2, Table 3"
        evidence: "Grad-TTS-DT (discretized additive-Gaussian noising, clean-data prediction) achieves MCD 5.53, log F0 error 0.31, UTMOSv2 3.95 versus the continuous Grad-TTS baseline's 5.71/0.33/4.03 at 10 inference steps, and a higher subjective MOS (4.07 vs. 4.02)."
        confidence: high
        relevance: high
      - claim_id: graddt_multiplicative_noise_viable_alternative
        role: supports
        claim: "Multiplicative Gaussian noise is a viable alternative to additive Gaussian noise as a diffusion-like noising process for speech, despite its non-isotropic covariance structure."
        source: "§4.1, Table 1, Table 2"
        evidence: "RFMG (multiplicative noise) achieves MCD, log F0, and UTMOSv2 close to RFAG (additive noise) across matched sigma values at both 10-step and 5-step inference."
        confidence: high
        relevance: high
      - claim_id: graddt_deterministic_noising_insufficient_naturalness
        role: complicates
        claim: "Fully deterministic noising processes are insufficient on their own for naturalness in discrete-time diffusion-like speech synthesis; some stochasticity in the noising process appears necessary."
        source: "§4.1, Table 1, Table 2; §4.2, Table 3"
        evidence: "The fully deterministic Blurring system records the lowest UTMOSv2 of all compared systems (3.71 at 10 steps, 3.66 at 5 steps) and ties for the lowest subjective MOS (3.86)."
        confidence: medium
        relevance: medium
      - claim_id: graddt_traintest_consistency_determines_robustness
        role: refines
        claim: "Consistency between training and inference conditions, not just the number of inference steps, determines how well a diffusion-like TTS model generalizes to fewer sampling steps."
        source: "§4.1, Table 1, Table 2"
        evidence: "All discrete-time systems retain near-identical MCD and log F0 error when inference steps are reduced from 10 to 5, which the authors attribute to the discrete-time formulation exposing the model to identical conditions at training and inference."
        confidence: medium
        relevance: high
    limitations:
      - "All systems are trained/evaluated on a single English, single-speaker corpus (LJSpeech) with a text encoder inherited unmodified from a pretrained Grad-TTS checkpoint the authors describe as suboptimal."
      - "The paper does not compare against more recent flow-matching TTS systems (e.g. rectified-flow or OT-CFM models), only against the original score-based Grad-TTS, leaving unclear how the discrete-time variants compare to the current flow-matching state of the art."
    caveats:
      - "The rectified-flow-style discrete-time variants (RFAG, RFMG) are discretized approximations built for comparison purposes within this paper's controlled framework, not a proposal to replace standard continuous-time flow matching in production TTS systems."

  - id: "2509.19928"
    published_date: "2025-09-24"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS, evaluation]
    architecture: []
    relevance: medium
    evidence_role:
      - evaluation_caution
      - negative_evidence
    current_role: active_evidence
    method_family: []
    claims:
      - claim_id: dswed_token_edit_distance_correlates_better
        role: supports
        claim: "Acoustic proxy metrics for prosodic variation correlate weakly with human perception, while distance measures computed over discretized self-supervised speech tokens correlate substantially better."
        source: "§4.1, Table 1"
        evidence: "Averaged Pearson correlation with human PMOS ratings is r=0.30 for log F0 RMSE and r=0.66 for MCD, versus r=0.77 for the proposed token-edit-distance metric, aggregated across 1000 samples and 2000 ratings."
        confidence: high
        relevance: low
      - claim_id: dswed_ar_more_diverse_than_fm_but_not_mgm
        role: supports
        claim: "Autoregressive generation provides greater output diversity in prosody than non-autoregressive flow-matching models with implicit text-speech alignment, but this advantage does not extend to non-autoregressive masked generative modeling."
        source: "§4.4-4.5, Table 2"
        evidence: "On the DS-WED benchmark, three AR systems (XTTS-v2, CosyVoice, CosyVoice 2) outperform three flow-matching NAR systems (E2 TTS, F5-TTS, ZipVoice), while the masked generative modeling system (MaskGCT) surpasses all AR systems on LibriSpeech despite training on the same Emilia corpus as the flow-matching systems."
        confidence: high
        relevance: high
      - claim_id: dswed_duration_control_partially_restores_diversity
        role: complicates
        claim: "Explicit duration control during inference is a significant, but not sufficient, factor in restoring prosodic diversity to non-autoregressive TTS systems with implicit alignment."
        source: "§4.5, Table 3"
        evidence: "Applying duration perturbation (0.8-1.2x) to two flow-matching/MGM NAR systems increases DS-WED diversity by 13.8-28.5%, but the perturbed flow-matching system (F5-TTS) still lags behind AR and MGM systems evaluated without perturbation."
        confidence: high
        relevance: high
      - claim_id: dswed_dpo_suppresses_prosody_diversity
        role: complicates
        claim: "Preference optimization that targets one quality dimension (intelligibility) can measurably suppress output diversity along an unrelated axis (prosody) as a side effect."
        source: "§4.5, Table 4"
        evidence: "Applying DPO for intelligibility to CosyVoice 2 and MaskGCT reduces DS-WED prosody-diversity scores by 18.8% and 2.9-3.2% respectively across two test sets."
        confidence: high
        relevance: low
      - claim_id: dswed_llm_judge_unreliable_for_prosody
        role: contradicts
        claim: "A general-purpose large audio language model with strong multimodal reasoning capability can serve as a reliable automatic judge of fine-grained prosodic variation."
        source: "§4.5, Table 5"
        evidence: "Gemini 2.5 Pro, prompted to rate relative prosodic difference within groups of five samples, achieves only a weak correlation with human PMOS ratings (r=0.27) and unstable correlations with objective metrics."
        confidence: high
        relevance: low
    limitations:
      - "The benchmark's paradigm-level conclusions rest on three flow-matching systems (E2 TTS, F5-TTS, ZipVoice) among seven total systems evaluated across only two corpora, and the duration-perturbation exploration covers only one flow-matching system (F5-TTS)."
    caveats:
      - "Flow matching (via F5-TTS, E2 TTS, ZipVoice) is the paradigm found to have the lowest prosody diversity among the three architecture classes tested, a negative-evidence finding rather than a proposed fix; the paper attributes the shortfall to implicit text-speech alignment rather than to the flow-matching objective itself."

  - id: "2509.19668"
    published_date: "2025-09-24"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching]
    relevance: high
    evidence_role:
      - evaluation_caution
      - negative_evidence
    current_role: active_evidence
    method_family: [pure_fm]
    claims:
      - claim_id: selectivecfg_image_cfg_techniques_dont_transfer
        role: contradicts
        claim: "CFG strategies effective in image generation transfer directly to improve zero-shot TTS quality."
        source: "§5, Figure 1, Figure 2"
        evidence: "Weight schedules, perpendicular re-weighting, and zero-init CFG techniques from image generation literature fail to improve F5-TTS, with some substantially degrading both SIM and WER, particularly when high CFG weight is applied early in generation."
        confidence: high
        relevance: high
      - claim_id: selectivecfg_timestep_selective_cfg_improves_similarity
        role: supports
        claim: "Applying standard CFG only in early timesteps and switching to speaker-emphasized CFG for later timesteps can improve speaker similarity in zero-shot TTS without substantially increasing WER."
        source: "§4, §5, Figure 4"
        evidence: "The proposed 'def text' strategy (standard CFG for t<0.08, then input-text separated CFG) raises F5-TTS SIM from 0.675 to 0.682 on LibriSpeech and from 0.679 to 0.690 on Seed-TTS-eval English, with WER changes of 0.002 or less."
        confidence: high
        relevance: high
      - claim_id: selectivecfg_effectiveness_depends_on_text_architecture
        role: refines
        claim: "The effectiveness of separated-condition CFG in zero-shot TTS is dependent on the text representation architecture of the underlying model, with language differences producing divergent outcomes for the same CFG strategy."
        source: "§5, §6, Figure 6"
        evidence: "The def text strategy is ineffective for Mandarin with F5-TTS (no SIM improvement, WER increase) while CosyVoice2's input-text-condition strategy shows no such language gap, a difference the authors attribute to F5-TTS's small ConvNeXt text encoder versus CosyVoice2's 506M-parameter LLM text encoder (not ablated)."
        confidence: medium
        relevance: medium
      - claim_id: selectivecfg_inference_tuning_insufficient_for_gap
        role: complicates
        claim: "Inference-time CFG tuning alone is insufficient to close the speaker similarity gap between open-weight and closed-source zero-shot TTS systems."
        source: "§6, Table 1"
        evidence: "Even with the best CFG variant, both F5-TTS and CosyVoice2 remain well below closed-source SOTA speaker similarity (Minimax-Speech 0.738, Seed-TTS 0.762 on Seed-TTS-eval English)."
        confidence: high
        relevance: medium
    limitations:
      - "Only two base flow-matching models (F5-TTS, CosyVoice2) are tested; generalizability to other flow-matching TTS architectures (e.g., Voicebox, E2-TTS variants) is unverified."
      - "The root cause of the Mandarin failure for F5-TTS is hypothesized but not verified experimentally, and no subjective (MOS) evaluation is reported."
    caveats:
      - "This is a systematic empirical evaluation of existing flow-matching models' inference-time behavior under various CFG strategies; no new flow-matching training or architecture is proposed."

