    limitations:
      - "All experiments use speech infilling (50% masking), not full-sentence TTS generation; results may not transfer directly to single-utterance TTS evaluation."
      - "No external TTS baselines from the Indian language literature are included; comparisons are only against the two proposed duration predictors and ground truth."
    caveats:
      - "The audio backbone is a Voicebox-style CNF trained with the flow-matching objective, unmodified except for training data; the paper's contribution is a comparative study of two duration-prediction strategies, one of which (PFlow-style) is itself borrowed from prior work."
      - "This paper's own field_significance rating is low; findings are narrow in scope (five Indian languages, infilling task only) and language-dependent rather than generalisable flow-matching principles."

  - id: "2507.18119"
    entry_date: 2026-07-15
    year: 2025
    venue: arXiv
    task: [SCA]
    architecture: [autoregressive-LM, flow-matching]
    relevance: low
    evidence_role:
      - infrastructure
    current_role: minor
    method_family: [ar_fm_hybrid]
    claims:
      - claim_id: goatslm_paralinguistic_internalised_without_instruction
        role: supports
        claim: "Modality-alignment spoken language models can internalize paralinguistic cues (dialect, age, emotion, non-speech vocalizations) through staged training without requiring explicit user instructions at inference time."
        source: "§5.2, Table 7, Table 8"
        evidence: "GOAT-SLM achieves 50.73% average dialect-following accuracy across five Chinese dialects without explicit prompting, versus 18.91% for the next-best model, and 40.91% on non-speech vocal response where all other models score below 10%."
        confidence: high
        relevance: low
      - claim_id: goatslm_shared_head_preserves_linguistic_competence
        role: supports
        claim: "Initializing a speech generation head from a pretrained LLM text head promotes parameter reuse and can preserve linguistic competence in the speech branch without full retraining."
        source: "§3, §5.1, Table 6"
        evidence: "The Speak module is initialized from the Write module's weights and retains multi-turn dialogue accuracy of 84% despite not training on multi-turn data, attributed to this parameter-sharing initialization strategy."
        confidence: medium
        relevance: low
      - claim_id: goatslm_paralinguistic_tradeoff_general_qa
        role: complicates
        claim: "Incorporating paralinguistic awareness into a spoken language model introduces a trade-off with general semantic question-answering performance."
        source: "§5.1, Table 4"
        evidence: "GOAT-SLM's general audio question-answering performance declines to average level across eight QA datasets compared to models without paralinguistic training, a trade-off the authors attribute to the expanded training objectives."
        confidence: medium
        relevance: low
      - claim_id: goatslm_dialect_generation_uneven
        role: complicates
        claim: "Dialectal speech generation quality is uneven across dialects, with closely related varieties more reliably acquired than typologically distant ones."
        source: "§5.2, Table 10"
        evidence: "GOAT-SLM exceeds 90% subjective consistency for Cantonese, Henan, Shanghainese, and Sichuanese dialect generation, but achieves only 57.2% for northeastern Mandarin, which is lexically close to standard Mandarin."
        confidence: high
        relevance: low
      - claim_id: goatslm_gradient_masking_improves_pronunciation
        role: supports
        claim: "Confidence-based gradient masking during speech token training can improve pronunciation stability by selectively updating tokens where the model's predictions are reliable."
        source: "§4.3"
        evidence: "GOAT-SLM applies confidence-based gradient masking during Stage 3 speech token training, masking low-confidence tokens during backpropagation, credited with enhanced pronunciation stability."
        confidence: medium
        relevance: low
    limitations:
      - "Evaluation is restricted to Chinese-language dialects and Mandarin-English bilingual content; generalization to non-Chinese languages is untested."
      - "The paper does not ablate the impact of LLM-initialized speech branch weights versus random initialization in a controlled experiment."
    caveats:
      - "Flow matching enters this paper only as the final acoustic decoder stage (converting predicted speech tokens to acoustic features), unchanged from prior practice and uncharacterised in the paper's own analysis or ablations."
      - "None of the five extracted claims characterise flow-matching mechanics; all concern the dual-modality head architecture, training curriculum, and paralinguistic capability evaluation."

claim_clusters:
  - id: fm_simulation_free_training
    claim: "Flow matching enables simulation-free training of continuous normalizing flows by regressing conditional vector fields, providing a tractable and stable alternative to score matching for generative modeling."
    status: strongly_supported
    confidence: high
    supporting_papers:
      - "2210.02747"
      - "2312.15821"
      - "2406.18009"
    contradicting_papers: []
    refining_papers:
      - "2025.acl-long.313"
    caveats:
      - "The theoretical guarantee holds for Gaussian conditional paths; extensions to non-Gaussian paths are not formally established."
      - "Concurrent work (Rectified Flow, Stochastic Interpolants) arrived at equivalent objectives independently; priority is contested in the literature."
    last_reviewed: 2026-06-24

  - id: fm_ot_path_inference_efficiency
    claim: "Optimal Transport paths in flow matching produce straighter generation trajectories than diffusion paths, reducing the number of ODE function evaluations needed to achieve equivalent sample quality."
    status: strongly_supported
    confidence: high
    supporting_papers:
      - "2210.02747"
      - "2412.04724"
      - "2025.acl-long.313"
    contradicting_papers: []
    refining_papers:
      - "2312.15821"
      - "2025.acl-long.1043"
    caveats:
      - "OT optimality is at the conditional level between paired Gaussian distributions; marginal-level optimality is not theoretically guaranteed."
      - "Practical NFE requirements depend heavily on the ODE solver and the complexity of the target distribution; straight-line trajectories may still require more than 1 step for high-fidelity speech."
    last_reviewed: 2026-06-24

  - id: fm_surpasses_diffusion_speed_quality
    claim: "Flow matching surpasses diffusion-based generative models in inference efficiency while maintaining or exceeding sample quality, making it the preferred backbone for continuous-output speech synthesis."
    status: strongly_supported
    confidence: high
    supporting_papers:
      - "2210.02747"
      - "2412.04724"
      - "2025.acl-long.313"
      - "iclr-2025-tQ1PmLfPBL"
      - "2506.09874"
    contradicting_papers: []
    refining_papers:
      - "2312.15821"
      - "2406.05551"
      - "2025.coling-main.518"
    caveats:
      - "Comparisons are against a range of diffusion baselines at varying NFE budgets; the advantage depends on the NFE regime and solver choice."
      - "Quality advantage over diffusion in speech is established primarily on speaker similarity and WER metrics; perceptual naturalness differences are smaller."
      - "This evidence now spans mel-spectrogram TTS (F5-TTS), raw-waveform vocoding (PeriodWave), and environment-aware synthesis (UmbraTTS), suggesting the FM-over-diffusion advantage is robust across target representations and task domains rather than specific to acoustic modeling."
    last_reviewed: 2026-07-15

  - id: fm_inference_acceleration
    claim: "Flow-matching speech models admit substantial inference acceleration — to as few as 1–4 steps — through post-training solver optimisation, distillation, learned priors, or coupled/conditioned source distributions, without requiring architectural changes to the base model."
    status: strongly_supported
    confidence: high
    supporting_papers:
      - "2312.15821"
      - "2406.05551"
      - "2025.acl-long.1043"
      - "2502.18924"
      - "2506.13053"
      - "2025.naacl-long.110"
    contradicting_papers: []
    refining_papers:
      - "2412.10117"
      - "2503.14345"
      - "iclr-2025-uxDFlPGRLX"
      - "2507.14988"
    caveats:
      - "The acceleration mechanisms now tracked in this cluster (learned ODE solvers, distillation variants (DMD, DMD2, PeRFlow, consistency distillation), learned priors, CFG-strength-conditioned distillation, and coupled-source flow matching) each introduce distinct quality-speed tradeoffs and are not directly comparable."
      - "Distillation-based acceleration (e.g. DMD) can improve perceptual naturalness over the teacher in some settings, but this finding requires independent replication."
      - "Learned-prior approaches trade naturalness (lower UTMOS) for single-step speed; the mechanism is fundamentally different from post-training acceleration."
      - "DMOSpeech 2 shows that DMD-style distillation from 32 to 4 steps disproportionately reduces prosodic diversity (CV-f0 drops 30.3%) while spectral quality is preserved; teacher-guided sampling partially mitigates this but doubles memory requirements."
    last_reviewed: 2026-07-15

  - id: fm_implicit_alignment_feasibility
    claim: "Flow-matching TTS models can learn text-speech alignment implicitly from character sequences and filler tokens, or via simple deterministic duration heuristics, without phoneme-level duration supervision, grapheme-to-phoneme converters, or explicit aligner components."
    status: emerging
    confidence: high
    supporting_papers:
      - "2406.18009"
      - "2025.acl-long.313"
    contradicting_papers: []
    refining_papers:
      - "2025.acl-long.313"
      - "2506.13053"
    caveats:
      - "Implicit alignment is prone to systematic failure modes in languages with complex scripts (e.g. Mandarin), and requires modality-specific text preprocessing (ConvNeXt refinement in F5-TTS) to be reliable."
      - "Alignment-free training is slower to converge than supervised alignment approaches in the early training phase."
      - "ZipVoice shows a parameter-free uniform-duration upsampling heuristic (assigning each token floor(T/N) frames) substantially outperforms filler-token-only padding and matches ConvNeXt refinement, suggesting the alignment-free approach generalises beyond learned refinement modules to simple deterministic heuristics."
    last_reviewed: 2026-07-15

  - id: explicit_alignment_naturalness_ceiling
    claim: "Explicit phoneme alignment supervision in non-autoregressive TTS imposes a naturalness ceiling: removing alignment constraints and training jointly on character sequences enables flow-matching models to exceed the naturalness of alignment-supervised baselines."
    status: emerging
    confidence: high
    supporting_papers:
      - "2406.18009"
      - "2025.acl-long.313"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "The naturalness advantage is demonstrated on standard reading-style speech benchmarks; whether it holds for expressive or spontaneous speech is untested."
      - "Both supporting papers share a common architectural lineage (Voicebox infilling); independent confirmation from architecturally distinct systems is lacking."
    last_reviewed: 2026-06-24

  - id: fm_nar_speed_quality_competitive_ar
    claim: "Non-autoregressive flow-matching TTS achieves competitive or superior intelligibility compared to autoregressive codec-LM systems at training scales of 100K hours or more, while generating speech at substantially lower real-time factors."
    status: emerging
    confidence: high
    supporting_papers:
      - "2025.acl-long.313"
      - "2412.04724"
    contradicting_papers: []
    refining_papers:
      - "2406.05551"
      - "2502.07243"
    caveats:
      - "Speed advantage is most pronounced for utterance-level generation; autoregressive systems can achieve competitive RTF at the token level in streaming settings."
      - "Intelligibility advantage over AR systems does not uniformly extend to speaker similarity, where some AR systems retain a measurable lead."
      - "The AR-vs-NAR tradeoff is modulated by task: AR systems show stronger style imitation at the cost of higher WER."
    last_reviewed: 2026-06-24

  - id: fm_step_scheduling_improves_fidelity
    claim: "Early steps in the flow-matching ODE trajectory (near the Gaussian prior) carry disproportionate influence over global speech attributes; densifying or restricting conditioning to these early steps improves speech fidelity, speaker similarity, or targeted attribute control (e.g. emotion) in flow-matching TTS without full retraining."
    status: emerging
    confidence: high
    supporting_papers:
      - "2025.acl-long.313"
      - "2507.04349"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "Sway Sampling has been demonstrated on one system (F5-TTS/E2 TTS) with a single architecture family; generalization to other flow-matching TTS architectures is unverified."
      - "The optimal step density schedule (s = -1) was found empirically; theoretical justification for why early steps are more informative in speech flow is not yet established."
      - "TTS-CtrlNet independently found that emotion conditioning is concentrated in early flow steps ([0, 0.1] of the trajectory) in a different system (F5-TTS ControlNet adapter) and for a different purpose (training-time conditioning restriction rather than inference-time step scheduling); the two findings are consistent but use distinct mechanisms and have not been directly compared."
    last_reviewed: 2026-07-15

  - id: fm_velocity_space_alignment
    claim: "Preference and reinforcement-learning-based post-training alignment can be formulated for flow-matching TTS architectures — either as a direct DPO objective in the velocity space, or via Gaussian reparameterization of the deterministic output combined with policy-gradient methods (GRPO) — enabling post-training intelligibility and speaker-similarity improvements without full retraining."
    status: emerging
    confidence: high
    supporting_papers:
      - "2025.acl-long.598"
      - "2504.02407"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "The DPO-FM derivation is demonstrated on a single hybrid AR+FM system (F5-TTS backbone); F5R-TTS demonstrates a distinct GRPO-based mechanism on a pure (non-hybrid) flow-matching backbone, partially addressing this gap."
      - "Preference pairs are constructed from WER-based selection in both supporting papers; the relationship between RL/preference alignment and perceptual naturalness improvements is not characterized in either."
      - "F5R-TTS shows RL post-training provides smaller relative gains on hard text (tongue twisters, repetitive phrasing) than on plain text, indicating the alignment does not resolve difficult phonetic sequences."
    last_reviewed: 2026-07-15

  - id: fm_postvq_quality_refinement
    claim: "Flow-matching decoders applied as post-quantization refinement stages can substantially recover audio quality lost during discrete speech tokenization, enabling modular integration into codec-LM pipelines without retraining the language model."
    status: emerging
    confidence: high
    supporting_papers:
      - "2502.17239"
    contradicting_papers: []
    refining_papers:
      - "2407.05407"
      - "2412.10117"
      - "2502.07243"
    caveats:
      - "Quality recovery is measured primarily on UTMOS and WER; speaker similarity and subjective naturalness MOS comparisons against dedicated TTS systems are not reported in the supporting papers."
      - "The improvement magnitude depends heavily on codec type; FACodec-based systems trade naturalness for intelligibility relative to mel-spectrogram-based systems."
    last_reviewed: 2026-06-24

  - id: ssl_pretraining_improves_fm_generalisation
    claim: "Self-supervised pretraining on large unlabeled audio corpora measurably improves the generalisation of flow-matching speech models to out-of-domain speakers and acoustic conditions."
    status: emerging
    confidence: high
    supporting_papers:
      - "2312.15821"
      - "2406.18009"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "Both supporting papers use Voicebox-lineage architectures; the benefit may partly reflect the specific SSL objective used rather than a general property of flow-matching training."
      - "Pretraining gains are most pronounced on out-of-domain test sets; in-domain gains are smaller and inconsistent across papers."
    last_reviewed: 2026-06-24

  - id: ar_fm_hybrid_style_timbre_decoupling
    claim: "Hybrid architectures that separate autoregressive style token generation from flow-matching acoustic decoding achieve stronger decoupling of style and timbre attributes than single-stage flow-matching systems conditioned in-context."
    status: emerging
    confidence: high
    supporting_papers:
      - "2502.07243"
      - "2412.10117"
    contradicting_papers: []
    refining_papers:
      - "2407.05407"
    caveats:
      - "The style-timbre decoupling advantage comes at the cost of sequential decoding latency from the AR stage, making these systems less suitable for real-time applications."
      - "Evaluation of decoupling quality relies on automatic speaker similarity metrics and style MOS ratings, whose reliability for this specific task is not independently validated."
    last_reviewed: 2026-06-24

  - id: fm_otcfm_data_requirements
    claim: "Standard OT-CFM flow matching for mel-spectrogram TTS is data-hungry, requiring tens of thousands of hours to achieve competitive intelligibility; learned prior variants reduce this requirement by orders of magnitude."
    status: emerging
    confidence: high
    supporting_papers:
      - "2025.acl-long.1043"
    contradicting_papers: []
    refining_papers:
      - "2406.18009"
    caveats:
      - "The 190x data reduction claim is based on a single comparison between OZSpeech (500h, learned prior) and F5-TTS (95K hours, OT-CFM); both systems differ in more ways than just the prior, including codec type and model architecture."
      - "The naturalness cost of the learned prior (UTMOS 3.15 vs. 3.76 for F5-TTS) is not accounted for in the data efficiency comparison."
    last_reviewed: 2026-06-24

  - id: cfg_conditioning_mechanism_adopted
    claim: "The classifier-free guidance conditioning mechanism from diffusion modeling transfers to flow-matching TTS systems and is sufficient for zero-shot speaker conditioning without discriminative components, and can be decoupled into independent guidance scales to control additional attributes such as accent intensity."
    status: strongly_supported
    confidence: high
    supporting_papers:
      - "2207.12598"
      - "2406.18009"
      - "2407.05407"
      - "2412.10117"
    contradicting_papers: []
    refining_papers:
      - "2312.15821"
      - "2502.18924"
    caveats:
      - "CFG doubles inference compute per step; in low-NFE regimes the compute cost of CFG is proportionally larger."
      - "The guidance strength hyperparameter has no principled selection criterion and is typically tuned empirically per system."
      - "MegaTTS 3 shows that decoupling text and speaker guidance scales into independent CFG parameters produces an emergent, continuous accent-intensity control axis without any accent labels in training, extending CFG's role beyond binary conditional/unconditional interpolation."
    last_reviewed: 2026-07-15

  - id: fm_vocoder_speed_gan_gap
    claim: "GAN vocoders retain a substantial real-time-factor advantage over flow-matching vocoders despite flow matching matching or exceeding GAN vocoders on perceptual quality, pitch accuracy, and periodicity metrics."
    status: emerging
    confidence: high
    supporting_papers:
      - "iclr-2025-tQ1PmLfPBL"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "Demonstrated on a single flow-matching vocoder (PeriodWave) against HiFi-GAN and BigVGAN; whether the gap narrows with acceleration techniques already validated at the acoustic-model level (distillation, learned priors) is untested for raw-waveform flow matching."
      - "Even PeriodWave's fastest 2-step variant (56.36x real-time) remains slower than HiFi-GAN (166.70x), despite already outperforming it on all quality metrics, indicating the gap is not merely a step-count tuning issue."
    last_reviewed: 2026-07-15

  - id: fm_postfilter_matches_gan_quality
    claim: "A flow-matching-based generative postfilter conditioned on a deterministic codec's decoder output can replace adversarial training while achieving comparable subjective quality to a GAN-trained codec, extending the FM-vs-adversarial-training comparison beyond acoustic modeling into neural audio coding."
    status: emerging
    confidence: medium
    supporting_papers:
      - "iclr-2025-uxDFlPGRLX"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "Demonstrated on a single system (FlowDec) against a single GAN baseline (DAC); the postfilter still trails DAC on intrusive distortion metrics (SI-SDR, fwSSNR) even though it matches DAC on subjective MUSHRA quality and exceeds it on FAD."
      - "The underlying codec and postfilter are noncausal and not streaming-capable, limiting applicability relative to the mostly-causal GAN vocoder baselines it is compared against."
    last_reviewed: 2026-07-15

  - id: fm_prosody_latent_diversity
    claim: "Conditional flow matching can be applied to compact latent spaces beyond mel-spectrograms or full acoustic features — such as self-supervised prosody representations — to enable diverse, reference-free generation of that specific attribute at inference."
    status: emerging
    confidence: medium
    supporting_papers:
      - "2025.coling-main.518"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "Demonstrated on a single system (ProsodyFlow) and a single single-speaker English dataset (LJSpeech); generalisation to multi-speaker or zero-shot settings is untested."
      - "The base architecture (StyleTTS 2) retains GAN discriminators for the acoustic decoder; flow matching in this system replaces only the prosody-sampling sub-component, not the full generative pipeline."
    last_reviewed: 2026-07-15

  - id: fm_reparam_enables_auxiliary_losses
    claim: "Reparameterizing a flow-matching model to predict the clean target directly, rather than the instantaneous velocity or derivative, allows auxiliary perceptual losses (STFT, mel) and periodic activation functions to be combined with the flow-matching objective, which cannot otherwise be applied."
    status: emerging
    confidence: high
    supporting_papers:
      - "2025.naacl-long.110"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "Demonstrated on a single flow-matching vocoder (WaveFM); whether the reparameterization generalizes to latent or mel-spectrogram-target flow matching (rather than raw waveform) is unexplored by the supporting paper."
      - "The technique is architecturally general (any model with a final linear layer predicting velocity), similar in spirit to the Gaussian-reparameterization technique used for RL alignment (F5R-TTS) but applied for a different purpose (auxiliary loss compatibility rather than policy-gradient RL)."
    last_reviewed: 2026-07-15

  - id: fm_flow_vae_latent_enrichment
    claim: "Augmenting a VAE's latent space with a normalizing flow between the encoder's posterior and the standard normal prior produces a richer target representation for flow-matching prediction, improving both reconstruction fidelity and downstream speaker similarity relative to a standard VAE latent."
    status: emerging
    confidence: medium
    supporting_papers:
      - "2505.07916"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "Demonstrated on a single system (MiniMax-Speech's Flow-VAE) with a proprietary, unreleased training corpus and unreported model size, limiting independent verification."
      - "The improvement is measured via both resynthesis metrics (PESQ, MS-STFT) and downstream TTS speaker similarity, but the paper does not isolate whether the reconstruction or the downstream gain is the primary driver of the observed TTS quality improvement."
    last_reviewed: 2026-07-15

  - id: fm_compact_architecture_efficiency
    claim: "Flow-matching TTS models can match the quality of systems two to eight times larger when backbone architecture components are selected for per-parameter efficiency — such as repurposed ASR encoders with multi-resolution (U-Net-style) structure — rather than adopted by default from the image-diffusion literature."
    status: emerging
    confidence: medium
    supporting_papers:
      - "2506.13053"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "Demonstrated on a single system (ZipVoice's Zipformer backbone, repurposed from ASR); whether the same per-parameter efficiency gains transfer to other non-Transformer or non-U-Net backbone choices is untested."
      - "Speaker similarity for the compact model consistently trails larger baselines (F5-TTS and other NAR systems) despite matching or exceeding them on quality and intelligibility, suggesting the parameter-efficiency gain is not uniform across all quality dimensions."
    last_reviewed: 2026-07-15

method_families:
  - id: pure_fm
    name: "Pure Flow-Matching Systems"
    summary: "Models that use flow matching as the sole generative backbone, typically operating directly on mel spectrograms. These systems train a velocity field estimator with OT-CFM or CFM objectives and sample via ODE integration at inference. They require no autoregressive component and achieve sub-linear RTF scaling with utterance length."
    papers:
      - "2210.02747"
      - "2312.15821"
      - "2406.18009"
      - "2412.04724"
      - "2025.acl-long.313"
      - "2411.09943"
      - "2502.18924"
      - "2504.02407"
      - "2025.naacl-short.69"
      - "2506.13053"
      - "2507.03887"
      - "2507.04349"
      - "2506.09874"
      - "2507.16875"
    open_questions:
      - "What is the minimum data volume at which pure OT-CFM mel-spectrogram systems achieve competitive intelligibility, and can architectural changes (e.g. DiT vs. U-Net) shift this threshold?"
      - "Does the Sway Sampling step scheduling principle generalise across all pure FM architectures, or is it specific to the DiT + ConvNeXt design of F5-TTS?"
      - "This family now spans mel-spectrogram TTS, VC (Seed-VC), and latent-diffusion variants (MegaTTS 3) that use rectified flow rather than the canonical OT-CFM objective; does the family's shared 'no autoregressive component' property predict shared failure modes and scaling behaviour across these variants, or do task and target-representation differences dominate?"

  - id: ar_fm_hybrid
    name: "Autoregressive LM + Flow-Matching Acoustic Model"
    summary: "Two-stage pipelines where an autoregressive language model generates discrete semantic or style tokens, and a separate flow-matching model decodes those tokens into continuous speech. The AR stage handles content and prosody at a semantic level; the FM stage handles fine-grained acoustic detail. This architecture trades the latency of AR decoding for stronger control over speaker style and paralinguistic attributes."
    papers:
      - "2407.05407"
      - "2412.10117"
      - "2025.acl-long.598"
      - "2502.07243"
      - "2502.17239"
      - "2503.14345"
      - "2025.findings-naacl.184"
      - "2505.07916"
      - "2505.17589"
      - "2507.09070"
      - "2507.18119"
    open_questions:
      - "What is the optimal interface between the AR token stage and the FM acoustic stage — how many semantic token levels, which codec, and how much conditioning information should flow between stages?"
      - "Can the AR stage be replaced with a non-autoregressive masked predictor while retaining the style control advantages of the hybrid architecture?"
      - "Several recent hybrid papers (CosyVoice 3, GOAT-SLM, SemAlignVC) leave the FM acoustic stage architecturally unchanged and focus their contribution on the AR/tokenizer stage instead; is the FM stage in this family approaching a stable, 'solved' design, or is this a temporary lull before the next FM-specific innovation?"

  - id: fm_acceleration
    name: "Accelerated / Single-Step Flow Matching"
    summary: "Systems that specifically target reducing the inference-time ODE integration steps of flow-matching models to 1–4, using distillation (DMD, DMD2, PeRFlow, consistency distillation, CFG-conditioned guided distillation), learned ODE solvers (Bespoke Solvers), or learned prior distributions that absorb the complexity previously resolved by multi-step integration. These approaches directly trade some portion of sample quality for real-time usability."
    papers:
      - "2406.05551"
      - "2025.acl-long.1043"
      - "2507.14988"
    open_questions:
      - "Do distillation-based acceleration and learned-prior acceleration achieve equivalent perceptual quality at equivalent NFE, or do they produce qualitatively different speech artefacts?"
      - "Is there a principled lower bound on the number of ODE steps required for high-fidelity mel-spectrogram synthesis, given the complexity of the speech manifold?"
      - "DMOSpeech 2 shows distillation disproportionately reduces prosodic diversity relative to spectral quality; does this diversity cost hold across all distillation mechanisms tracked in this family (DMD, PeRFlow, consistency distillation, CFG-conditioned distillation), or is it specific to DMD-style objectives?"

  - id: fm_vocoder
    name: "Flow-Matching Vocoders (Raw Waveform / Postfilter)"
    summary: "Systems that apply the flow-matching or conditional-flow-matching objective directly to raw waveform generation or to postfiltering a deterministic codec/vocoder's output, rather than to mel-spectrogram or semantic-token acoustic modeling. These systems compete directly with GAN vocoders (HiFi-GAN, BigVGAN) and diffusion vocoders, trading iterative sampling cost for gains in pitch accuracy, periodicity, and postfilter quality without adversarial training."
    papers:
      - "iclr-2025-tQ1PmLfPBL"
      - "2025.naacl-long.110"
    open_questions:
      - "Can flow-matching vocoders close the substantial real-time-factor gap to single-step GAN vocoders (PeriodWave: 7.48x vs. HiFi-GAN's 166x at matched or better quality) through the same acceleration techniques (distillation, learned priors) already validated at the acoustic-model level?"
