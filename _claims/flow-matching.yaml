      - claim_id: uddetts_continuous_control_depends_on_quantization
        role: complicates
        claim: "The reliability of continuous emotion control depends heavily on how the continuous space is quantized into controllable units, not just on the underlying representation."
        source: "§4.4, Table 2, §4.6"
        evidence: "Replacing the clustering-based nonlinear ADV quantizer with linear binning drops Spearman's Rank Correlation for perceived emotion control across all three ADV dimensions, e.g. valence SRC falls from 0.92 to 0.57."
        confidence: high
        relevance: low
      - claim_id: uddetts_text_predicted_emotion_enables_labelfree_inference
        role: supports
        claim: "Predicting an emotion conditioning signal directly from input text allows emotional TTS to operate without an explicit emotion label or reference at inference time."
        source: "§4.5, §4.6, Table 3"
        evidence: "An ADV predictor infers pseudo-ADV tokens from text alone; removing it biases synthesis toward neutral emotion and drops pairwise preference against baselines from 67.33%/58.60% to 46.88%/28.50%."
        confidence: medium
        relevance: low
      - claim_id: uddetts_finegrained_control_bounded_by_annotation_consistency
        role: complicates
        claim: "Fine-grained control over continuous emotion representations remains bounded by the consistency of the human annotations used to train the control mechanism."
        source: "§Limitations"
        evidence: "The authors note that subjective inter-annotator variation in ADV labels degrades linear control accuracy, and that texts with ambiguous emotional attributes cause the ADV predictor to infer inappropriate values."
        confidence: medium
        relevance: low
    limitations:
      - "Speaker conditioning uses a fixed embedding averaged from a speaker's neutral-emotion utterances rather than zero-shot cloning from an arbitrary reference clip, a narrower speaker-control setting than several LLM-based baselines the flow-matching module is compared against."
    caveats:
      - "The OT-CFM module's concept-relevant contribution is its emotional mixture encoder (cross-attention fusion of ADV and label tokens with semi-supervised gating), applied to a comparatively standard mel-spectrogram reconstruction role; the paper's more foundational novelty (semi-supervised annotation-agnostic training) lives primarily at the neural codec LM stage."

  - id: "2509.22727"
    published_date: "2025-09-25"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching]
    relevance: low
    evidence_role:
      - infrastructure
    current_role: minor
    method_family: [pure_fm]
    claims:
      - claim_id: diamoetts_joint_training_induces_style_averaging
        role: supports
        claim: "Joint training across multiple dialects induces style averaging, where dialect-specific prosodic identity is diluted unless the model has a mechanism to route dialect-specific information separately."
        source: "§4.4.2, Table 3"
        evidence: "Ablating the dialect-aware MoE module (removing it while keeping the IPA frontend) degrades both MOS (2.46 vs. 3.15 on Xi'an) and WER (45.08% vs. 33.00% on Xi'an) relative to the full model."
        confidence: high
        relevance: low
      - claim_id: diamoetts_ipa_resolves_g2p_ambiguity_better_than_pinyin
        role: supports
        claim: "A standardized phonetic representation (IPA) resolves grapheme-to-phoneme ambiguity better than orthography-based inputs (e.g., pinyin) when a single model must serve multiple dialects with divergent character-to-sound mappings."
        source: "§4.4.2, Table 3"
        evidence: "Replacing the IPA frontend with pinyin input (keeping the MoE module) collapses MOS to roughly 1.0-1.2 and raises WER to roughly 90-93% across four dialects."
        confidence: high
        relevance: low
      - claim_id: diamoetts_peft_extends_to_new_lowresource_dialect
        role: supports
        claim: "Parameter-efficient fine-tuning (LoRA plus lightweight adapters) on a frozen multidialect backbone can extend zero/few-shot speech synthesis to a new, extremely low-resource dialect using only a few hours of data."
        source: "§3.3, §4.1, Table 2"
        evidence: "Stage 3 adapts the frozen Stage-2 model to Peking Opera (Jingbai/Yunbai) and Nanjing dialect using only ~3 hours of data per target style, training only LoRA and Conditioning Adapters while the flow-matching backbone stays frozen."
        confidence: medium
        relevance: low
      - claim_id: diamoetts_open_data_underperforms_proprietary_on_wer
        role: complicates
        claim: "Open, modest-scale multidialect training data can substantially underperform proprietary, large-scale commercial systems on standard intelligibility metrics even when subjective naturalness scores are comparable."
        source: "§4.4.1, Table 1, Table 2"
        evidence: "Trained on ~1.1k total hours versus CosyVoice2's ~150k hours and Qwen-TTS's ~3,000k hours, DiaMoE-TTS's WER trails the baseline average by wide margins in several dialects even where its UTMOSv2 score is on par with or better than the commercial average."
        confidence: high
        relevance: low
    limitations:
      - "Word error rate is substantially worse than commercial baselines across nearly every dialect evaluated, and the paper does not report a controlled comparison isolating whether this gap stems from training data scale, IPA/G2P errors, or the MoE routing itself."
    caveats:
      - "DiaMoE-TTS inherits F5-TTS's flow-matching DiT backbone unchanged; none of the paper's four claims concern the flow-matching objective or architecture itself, only the dialect-conditioning and low-resource-adaptation layers built on top of it."

  - id: "2509.22167"
    published_date: "2025-09-26"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS, codec]
    architecture: [VAE]
    relevance: high
    evidence_role:
      - architecture_variant
      - infrastructure
    current_role: active_evidence
    method_family: [pure_fm]
    claims:
      - claim_id: semanticvae_regularization_mitigates_recon_gen_tradeoff
        role: supports
        claim: "Regularizing a continuous VAE latent space toward semantic structure derived from self-supervised speech features mitigates the reconstruction-generation trade-off in latent-based non-autoregressive TTS."
        source: "§4.1, Table 1"
        evidence: "At a fixed 64-dimensional latent size, adding cosine-similarity alignment to WavLM features reduces WER from 2.65% (vanilla VAE) to 2.10% while raising speaker similarity from 0.59 to 0.64 on LibriSpeech-PC test-clean, when substituted into the flow-matching F5-TTS backbone."
        confidence: high
        relevance: high
      - claim_id: semanticvae_accelerates_fm_training_convergence
        role: supports
        claim: "Semantic alignment regularization of the generation target accelerates training convergence of latent diffusion/flow-matching TTS models."
        source: "§4.1, Figure 3"
        evidence: "Training-step comparisons show Semantic-VAE-based F5-TTS reaching lower WER and higher SIM than both the vanilla-VAE and mel-spectrogram baselines at the same number of training steps."
        confidence: medium
        relevance: high
      - claim_id: semanticvae_tradeoff_governed_by_ssl_layer_choice
        role: refines
        claim: "The intelligibility-versus-speaker-similarity trade-off in VAE latent representations is governed by which layer of a self-supervised model is used for semantic supervision, not eliminated outright by adding semantic alignment."
        source: "§4.3, Table 3"
        evidence: "Ablating SSL layer choice shows the final layer of WavLM/HuBERT substantially degrades SIM (0.50-0.58) despite comparable WER, while an intermediate layer (WavLM layer 23) gives the best joint WER/SIM balance."
        confidence: high
        relevance: medium
      - claim_id: semanticvae_cosine_alignment_beats_l1_l2
        role: supports
        claim: "Cosine-similarity alignment losses to self-supervised speech features preserve useful semantic structure in a latent space more effectively than L1 or L2 distance losses to the same features."
        source: "§4.3, Table 3"
        evidence: "Negative cosine alignment achieves 2.10% WER / 0.64 SIM, compared to 3.12% WER / 0.47 SIM for L1 alignment and 4.37% WER / 0.48 SIM for L2 alignment under otherwise identical settings."
        confidence: high
        relevance: medium
      - claim_id: semanticvae_regularization_doesnt_cost_reconstruction
        role: complicates
        claim: "Adding a semantic regularization objective to a VAE's training loss does not necessarily degrade the representation's reconstruction fidelity, contrary to the general expectation that additional regularization terms cost reconstruction quality."
        source: "§4.2, Table 2"
        evidence: "Semantic-VAE reconstruction metrics on LibriTTS test-other (PESQ 3.74, STOI 0.96, UTMOS 3.56) are nearly identical to an unregularized vanilla VAE of the same architecture (PESQ 3.75, STOI 0.97, UTMOS 3.57)."
        confidence: high
        relevance: medium
    limitations:
      - "Validated on English speech only, at a single latent configuration (64 dimensions, 40Hz), and on two NAR flow-matching backbones (F5-TTS, E2 TTS); generalization to AR codec-token TTS, other languages, or other latent dimensionalities is untested."
      - "High-resource baseline numbers are quoted from prior papers rather than re-run under matched data and compute, so comparisons against Semantic-VAE's low-resource results are illustrative context only."
    caveats:
      - "Semantic-VAE itself is architecturally a VAE/codec contribution rather than a flow-matching model; its concept relevance for flow-matching lies entirely in its use as a drop-in replacement latent target for existing flow-matching TTS backbones (F5-TTS, E2 TTS), with the flow-matching objective itself left unchanged."

  - id: "2509.24650"
    published_date: "2025-09-29"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS, VC]
    architecture: [autoregressive-LM, diffusion]
    relevance: medium
    evidence_role:
      - architecture_variant
    current_role: active_evidence
    method_family: [continuous_ar_fm_head]
    claims:
      - claim_id: voxcpm_fsq_bottleneck_induces_task_separation
        role: supports
        claim: "A differentiable scalar-quantization bottleneck applied to hidden states, rather than used as a discrete prediction target, can induce semantic/acoustic task separation inside a continuous autoregressive TTS model without an external speech tokenizer."
        source: "§4.3, Table 6"
        evidence: "Removing the FSQ bottleneck from an otherwise identical hierarchical architecture increases ZH-hard-case CER from 18.19% to 24.92%, and FSQ dimensionality shows a non-monotonic optimum around 128-256 dimensions rather than benefiting from either extreme."
        confidence: high
        relevance: low
      - claim_id: voxcpm_ralm_residual_improves_robustness
        role: supports
        claim: "Explicitly separating acoustic detail recovery into a dedicated residual module improves robustness on complex inputs beyond what a single semantic language model plus a diffusion decoder achieves."
        source: "§4.4, Table 7"
        evidence: "Removing the RALM (TSLM output feeding the diffusion decoder directly, architecturally close to DiTAR) degrades EN-WER from 2.98% to 4.34% and ZH-hard-case CER from 18.19% to 25.0%; removing the historical acoustic embedding from the RALM input degrades results further."
        confidence: high
        relevance: low
      - claim_id: voxcpm_wsd_schedule_affects_speaker_similarity
        role: complicates
        claim: "Learning-rate schedule design, not just architecture, materially affects zero-shot speaker similarity in large-scale continuous TTS training."
        source: "§4.5, Table 8"
        evidence: "A two-phase Warmup-Stable-Decay schedule's decay phase alone improves ZH-hard-case CER from 13.22% to 8.87% and SIM by 4.4 points over the stable-phase-only checkpoint on an otherwise identical model."
        confidence: medium
        relevance: low
      - claim_id: voxcpm_cfg_scale_nonmonotonic_tradeoff
        role: complicates
        claim: "Classifier-free guidance strength in diffusion-based TTS decoders trades off intelligibility against speaker similarity non-monotonically, with both very low and very high guidance scales degrading both metrics simultaneously."
        source: "§4.6, Table 9"
        evidence: "CFG scale 1.0 (no guidance) yields EN-WER 16.32% and SIM 55.1%, while scale 5.0 yields EN-WER 12.78% and SIM 60.7%; the optimum at scale 2.0 achieves EN-WER 1.85% and SIM 72.9%, with degradation on both sides of the optimum."
        confidence: high
        relevance: medium
      - claim_id: voxcpm_tokenizer_free_matches_discrete_quality
        role: refines
        claim: "Removing dependency on a pre-trained discrete speech tokenizer does not require sacrificing zero-shot voice cloning quality relative to discrete-token-based open-source TTS systems."
        source: "§4.2, Table 3"
        evidence: "On SEED-TTS-EVAL, the fully continuous VoxCPM reports SIM of 72.9% (EN) and 77.2% (ZH), exceeding the discrete-token-based IndexTTS2 and CosyVoice2 baselines on the same benchmark."
        confidence: medium
        relevance: low
    limitations:
      - "The sole flow-matching-trained component (the LocDiT decoder) operates on latents from a causal audio VAE limited to 16kHz, below the 24kHz/44.1kHz typically expected for high-fidelity synthesis, and baseline comparisons draw on official implementations or prior-paper numbers rather than a uniformly controlled re-evaluation."
    caveats:
      - "Flow-matching is used only as the end-to-end training objective for the hierarchical FSQ+RALM+LocDiT stack; four of the paper's five claims concern the FSQ bottleneck, RALM residual pathway, or training schedule rather than the flow-matching objective itself, with the CFG-scale ablation (Table 9) the one finding directly informative for flow-matching-based decoders generally."

  - id: "2509.24773"
    published_date: "2025-09-29"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching]
    relevance: medium
    evidence_role:
      - architecture_variant
    current_role: frontier_probe
    method_family: [pure_fm]
    claims:
      - claim_id: vssflow_joint_training_no_degradation_with_separated_conditioning
        role: supports
        claim: "Joint training of two video-conditioned audio generation tasks with different output characteristics does not need to degrade either task's performance, provided the conditioning pathways for each task's signals are architecturally separated."
        source: "§4.4, Figure 4"
        evidence: "Learning curves comparing joint (V2S+VisualTTS), sound-only, and speech-only training at matched epochs show the joint-trained model reaches performance parity with each single-task model on FAD/DeSync (sound) and WER/UTMOS (speech), contrasting with a prior report that joint training of these tasks causes mutual degradation."
        confidence: medium
        relevance: low
      - claim_id: vssflow_condition_routing_by_temporal_density
        role: refines
        claim: "The choice between cross-attention and channel-concatenation conditioning in a DiT-based generative model should be determined by whether the conditioning signal is temporally dense/aligned or sparse/global, not fixed uniformly across all condition types."
        source: "§4.3, Figure 3"
        evidence: "A 5-variant ablation shows concatenation-based conditioning improves WER and lip-sync error for temporally-dense signals (transcript, sound/speech sync cues), while cross-attention conditioning improves FAD and video-audio semantic alignment for the sparse, global video-semantic feature."
        confidence: high
        relevance: medium
      - claim_id: vssflow_synthetic_feature_mixing_substitutes_real_joint_data
        role: supports
        claim: "Feature-level synthesis of paired training examples, constructed by mixing independently-sourced single-modality data in representation space, can substitute for scarce real multimodal joint-generation training data."
        source: "§4.4, Table 4"
        evidence: "Fine-tuning on synthetic sound-speech mixtures alone yields the best WER (19.4) and UTMOS (2.07) on the V2C-Animation joint-generation benchmark among all training-data configurations tested, exceeding fine-tuning on the small (8k-sample) real V2C corpus alone (36.5 WER)."
        confidence: medium
        relevance: low
      - claim_id: vssflow_frozen_extractors_and_synthetic_data_bound_quality
        role: complicates
        claim: "Unified video-conditioned generation systems that depend on frozen pretrained feature extractors for their conditioning signals inherit those extractors' representational limits, and systems adapted with synthetic joint data remain bounded by the distributional gap between synthetic and real joint data."
        source: "§Limitations"
        evidence: "The authors state that reliance on frozen pretrained extractors (CLIP, Synchformer, AV-HuBERT) may limit capture of fine-grained audio-visual nuances, and that generation quality on real joint scenarios is inherently constrained by the distributional gap of the synthetic training data used for joint-generation fine-tuning."
        confidence: medium
        relevance: low
    limitations:
      - "The joint sound-speech generation results are evaluated on a single, animation-only benchmark (V2C-Animation), and the joint-generation comparison is against pipeline baselines assembled by the authors rather than another end-to-end unified flow-matching system, since none exists in the public literature at time of writing."
    caveats:
      - "VSSFlow's flow-matching DiT backbone and training objective are standard (follows Stable Audio Open's block design); its contribution to the flow-matching literature specifically is the conditioning-routing rule (cross-attention for sparse/global signals, concatenation for temporally-dense signals), not a new flow-matching formulation, and the paper's scope is a narrow video-conditioned sub-area rather than mainstream text-only TTS."

  - id: "2509.26514"
    published_date: "2025-09-30"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching, GAN]
    relevance: low
    evidence_role:
      - infrastructure
    current_role: minor
    method_family: [ar_fm_hybrid]
    claims:
      - claim_id: batonvoice_decoupled_instruction_rendering_matches_annotated_systems
        role: supports
        claim: "Decoupling instruction interpretation from speech rendering, via an explicit intermediate textual feature representation, can match or exceed instruction-annotated controllable TTS systems without requiring any manually labeled instruction-speech data."
        source: "§3.2, Table 1"
        evidence: "BatonVoice-1.7B reaches 57.6% emotion accuracy using 0 hours of manual instruction annotation, exceeding CosyVoice (43.8%, 556 hours) and CosyVoice2 (37.8%, 1,500 hours) on the same Seed-TTS-derived English emotion benchmark."
        confidence: high
        relevance: low
      - claim_id: batonvoice_text_conditioning_transfers_upstream_llm_gains
        role: supports
        claim: "When conditioning signals are represented as explicit text rather than learned embeddings, a downstream generation model can gain synthesis quality from a stronger upstream language model without any retraining of the generation model itself."
        source: "§3.5, Figure 3b"
        evidence: "Holding BatonTTS fixed and only changing the external conductor LLM that produces the vocal plan, emotion accuracy rises monotonically from 29.8% (Qwen3-1.7B) through 39.8% (Qwen3-80B) and 47.8% (Qwen3-Max) to 57.6% (Gemini-2.5-Pro)."
        confidence: high
        relevance: low
      - claim_id: batonvoice_automatic_vs_human_eval_divergence
        role: complicates
        claim: "Automatic emotion-classification accuracy and human-judged naturalness can diverge, so strong performance on an LLM-judged style-control metric does not guarantee a favorable human preference outcome against commercial systems."
        source: "§3.3, Table 2"
        evidence: "On a free-form instruction-following test set judged by trained human annotators, BatonVoice wins only 56% of comparisons against CosyVoice and just 30% against Minimax-2.5-HD, with annotators specifically citing weaker fluency and naturalness."
        confidence: high
        relevance: low
      - claim_id: batonvoice_numerical_representation_beats_qualitative_text
        role: refines
        claim: "Numerical, structured representations of prosodic control targets transfer more precisely to a conditioned TTS decoder than free-text qualitative descriptions of the same target style."
        source: "§B.2, Table 5"
        evidence: "On a RAVDESS reconstruction task, the structured numerical vocal-plan format achieves 1.54 Mel-Cepstral Distortion versus 2.62 for an equivalent caption-based qualitative description, and ablating any single numerical feature (pitch, energy, or spectral centroid) increases MCD."
        confidence: medium
        relevance: low
    limitations:
      - "Headline emotion-control results rely entirely on an LLM (Gemini-2.5-Pro) as automatic judge; the one benchmark that does use human evaluation shows BatonVoice losing to the top closed-source baseline on naturalness and fluency (30% win rate against Minimax-2.5-HD)."
    caveats:
      - "BatonTTS's flow-matching component is CosyVoice2's pre-trained speech decoder used entirely frozen and unmodified; none of the paper's four claims concern the flow-matching model itself, only the upstream LLM-based instruction-to-feature-plan decoupling built on top of it."

claim_clusters:
  - id: fm_simulation_free_training
    claim: "Flow matching enables simulation-free training of continuous normalizing flows by regressing conditional vector fields, providing a tractable and stable alternative to score matching for generative modeling."
    status: strongly_supported
    confidence: high
    supporting_papers:
      - "2210.02747"
      - "2312.15821"
      - "2406.18009"
    contradicting_papers: []
    refining_papers:
      - "2025.acl-long.313"
      - "interspeech-2025-1066"
    caveats:
      - "The theoretical guarantee holds for Gaussian conditional paths; extensions to non-Gaussian paths are not formally established."
      - "Concurrent work (Rectified Flow, Stochastic Interpolants) arrived at equivalent objectives independently; priority is contested in the literature."
      - "A theoretical paper shows sliced score matching and flow matching are formally equivalent at a single interpolation timestep, reinforcing that the objective's priority dispute (above) reflects genuine underlying redundancy between the score-based and flow-based formulations rather than superficial naming differences."
    last_reviewed: "2026-07-19"

  - id: fm_ot_path_inference_efficiency
    claim: "Optimal Transport paths in flow matching produce straighter generation trajectories than diffusion paths, reducing the number of ODE function evaluations needed to achieve equivalent sample quality."
    status: strongly_supported
    confidence: high
    supporting_papers:
      - "2210.02747"
      - "2412.04724"
      - "2025.acl-long.313"
    contradicting_papers: []
    refining_papers:
      - "2312.15821"
      - "2025.acl-long.1043"
    caveats:
      - "OT optimality is at the conditional level between paired Gaussian distributions; marginal-level optimality is not theoretically guaranteed."
      - "Practical NFE requirements depend heavily on the ODE solver and the complexity of the target distribution; straight-line trajectories may still require more than 1 step for high-fidelity speech."
    last_reviewed: 2026-06-24

  - id: fm_surpasses_diffusion_speed_quality
    claim: "Flow matching surpasses diffusion-based generative models in inference efficiency while maintaining or exceeding sample quality, making it the preferred backbone for continuous-output speech synthesis."
    status: strongly_supported
    confidence: high
    supporting_papers:
      - "2210.02747"
      - "2412.04724"
      - "2025.acl-long.313"
      - "iclr-2025-tQ1PmLfPBL"
      - "2506.09874"
      - "2025.acl-long.87"
      - "2508.14049"
      - "2509.08379"
      - "interspeech-2025-1779"
      - "2509.15629"
    contradicting_papers: []
    refining_papers:
      - "2312.15821"
      - "2406.05551"
      - "2025.coling-main.518"
    caveats:
      - "Comparisons are against a range of diffusion baselines at varying NFE budgets; the advantage depends on the NFE regime and solver choice."
      - "Quality advantage over diffusion in speech is established primarily on speaker similarity and WER metrics; perceptual naturalness differences are smaller."
      - "This evidence now spans mel-spectrogram TTS (F5-TTS), raw-waveform vocoding (PeriodWave), environment-aware synthesis (UmbraTTS), voice conversion (Takin-VC, and a latent-space diffusion-vs-FM comparison), and singing voice conversion, suggesting the FM-over-diffusion advantage is robust across target representations, tasks, and domains rather than specific to acoustic modeling."
      - "The singing-VC confirmation (2509.15629) compares a full AR+FM hybrid system against specialized diffusion systems at the system level rather than isolating the generative objective as a controlled variable, so it is weaker evidence for the specific FM-vs-diffusion mechanism than the component-level comparisons."
    last_reviewed: "2026-07-19"

  - id: fm_inference_acceleration
    claim: "Flow-matching speech models admit substantial inference acceleration — to as few as 1–4 steps — through post-training solver optimisation, distillation, learned priors, or coupled/conditioned source distributions, without requiring architectural changes to the base model."
    status: strongly_supported
    confidence: high
    supporting_papers:
      - "2312.15821"
      - "2406.05551"
      - "2025.acl-long.1043"
      - "2502.18924"
      - "2506.13053"
      - "2025.naacl-long.110"
      - "2025.acl-long.790"
      - "2508.04996"
      - "interspeech-2025-0455"
      - "interspeech-2025-0554"
      - "interspeech-2025-1779"
      - "interspeech-2025-2449"
      - "2509.08696"
      - "2509.09748"
      - "2509.08379"
    contradicting_papers: []
    refining_papers:
      - "2412.10117"
      - "2503.14345"
      - "iclr-2025-uxDFlPGRLX"
      - "2507.14988"
      - "interspeech-2025-1779"
      - "2509.18470"
    caveats:
      - "The acceleration mechanisms now tracked in this cluster (learned ODE solvers, distillation variants (DMD, DMD2, PeRFlow, consistency distillation, shortcut self-consistency training), learned priors, CFG-strength-conditioned distillation, adversarial post-training, non-uniform step scheduling, training-free caching, and coupled-source flow matching) each introduce distinct quality-speed tradeoffs and are not directly comparable."
      - "Distillation-based acceleration (e.g. DMD) can improve perceptual naturalness over the teacher in some settings, but this finding requires independent replication."
      - "Learned-prior approaches trade naturalness (lower UTMOS) for single-step speed; the mechanism is fundamentally different from post-training acceleration."
      - "DMOSpeech 2 shows that DMD-style distillation from 32 to 4 steps disproportionately reduces prosodic diversity (CV-f0 drops 30.3%) while spectral quality is preserved; teacher-guided sampling partially mitigates this but doubles memory requirements."
      - "This evidence base has broadened substantially beyond mel-spectrogram TTS: shortcut self-consistency training (R-VC) and Shortcut Models both independently confirm 2-10x step reduction in voice conversion, and training-free layer/attention caching (two independent papers) confirms acceleration without any architectural change or retraining is possible for DiT-based TTS specifically, distinct from the distillation/learned-prior mechanisms that require retraining."
      - "Recursive rectification (retraining a rectified-flow model on its own generated samples, interspeech-2025-1779) yields only marginal further acceleration gains once the initial model is already well-trained, suggesting diminishing returns for iterative straightening beyond a single rectification pass."
      - "A discrete-time reformulation (2509.18470) shows that consistency between training and inference conditions, not merely the number of inference steps, determines how well a diffusion-like model generalises to fewer sampling steps — a mechanism-level nuance that applies across the acceleration techniques tracked here."
    last_reviewed: "2026-07-19"

  - id: fm_implicit_alignment_feasibility
    claim: "Flow-matching TTS models can learn text-speech alignment implicitly from character sequences and filler tokens, or via simple deterministic duration heuristics, without phoneme-level duration supervision, grapheme-to-phoneme converters, or explicit aligner components."
    status: emerging
    confidence: high
    supporting_papers:
      - "2406.18009"
      - "2025.acl-long.313"
    contradicting_papers: []
    refining_papers:
      - "2025.acl-long.313"
      - "2506.13053"
      - "2509.19928"
      - "2509.17988"
    caveats:
      - "Implicit alignment is prone to systematic failure modes in languages with complex scripts (e.g. Mandarin), and requires modality-specific text preprocessing (ConvNeXt refinement in F5-TTS) to be reliable."
      - "Alignment-free training is slower to converge than supervised alignment approaches in the early training phase."
      - "ZipVoice shows a parameter-free uniform-duration upsampling heuristic (assigning each token floor(T/N) frames) substantially outperforms filler-token-only padding and matches ConvNeXt refinement, suggesting the alignment-free approach generalises beyond learned refinement modules to simple deterministic heuristics."
      - "A dedicated prosody-diversity benchmark (DS-WED) finds that flow-matching NAR systems with implicit alignment (E2 TTS, F5-TTS, ZipVoice) produce measurably less prosodic diversity than autoregressive systems, and attributes the shortfall specifically to implicit alignment rather than to the flow-matching objective itself; explicit duration-perturbation partially but not fully restores the diversity gap."
      - "A separate paper reports that explicit duration/alignment modeling improves intelligibility and reduces hallucination relative to implicit alignment learned via diffusion transformers, at some cost to perceived naturalness — indicating the implicit-alignment feasibility claim understates a robustness-naturalness trade-off that explicit alignment can partially resolve."
    last_reviewed: "2026-07-19"

  - id: explicit_alignment_naturalness_ceiling
    claim: "Explicit phoneme alignment supervision in non-autoregressive TTS imposes a naturalness ceiling: removing alignment constraints and training jointly on character sequences enables flow-matching models to exceed the naturalness of alignment-supervised baselines."
    status: emerging
    confidence: high
    supporting_papers:
      - "2406.18009"
      - "2025.acl-long.313"
    contradicting_papers: []
    refining_papers:
      - "2509.17988"
    caveats:
      - "The naturalness advantage is demonstrated on standard reading-style speech benchmarks; whether it holds for expressive or spontaneous speech is untested."
      - "Both supporting papers share a common architectural lineage (Voicebox infilling); independent confirmation from architecturally distinct systems is lacking."
      - "A 2025 paper reports the inverse trade-off from the opposite direction: explicit duration/alignment modeling improves intelligibility and reduces hallucination relative to implicit alignment in diffusion transformers, at some naturalness cost, suggesting the naturalness ceiling this cluster describes is one side of a bidirectional trade-off rather than a one-way limitation of explicit alignment."
    last_reviewed: "2026-07-19"

  - id: fm_nar_speed_quality_competitive_ar
    claim: "Non-autoregressive flow-matching TTS achieves competitive or superior intelligibility compared to autoregressive codec-LM systems at training scales of 100K hours or more, while generating speech at substantially lower real-time factors."
    status: emerging
    confidence: high
    supporting_papers:
      - "2025.acl-long.313"
      - "2412.04724"
    contradicting_papers: []
    refining_papers:
      - "2406.05551"
      - "2502.07243"
      - "2509.19928"
    caveats:
      - "Speed advantage is most pronounced for utterance-level generation; autoregressive systems can achieve competitive RTF at the token level in streaming settings."
      - "Intelligibility advantage over AR systems does not uniformly extend to speaker similarity, where some AR systems retain a measurable lead."
      - "The AR-vs-NAR tradeoff is modulated by task: AR systems show stronger style imitation at the cost of higher WER."
      - "The DS-WED benchmark adds a further dimension to this tradeoff: AR systems produce measurably more prosodic diversity than flow-matching NAR systems with implicit alignment, though this AR advantage does not extend to non-autoregressive masked generative modeling (MaskGCT), indicating the diversity gap is specific to implicit-alignment flow matching rather than to non-autoregressive generation in general."
    last_reviewed: "2026-07-19"

  - id: fm_step_scheduling_improves_fidelity
    claim: "Early steps in the flow-matching ODE trajectory (near the Gaussian prior) carry disproportionate influence over global speech attributes; densifying or restricting conditioning to these early steps improves speech fidelity, speaker similarity, or targeted attribute control (e.g. emotion) in flow-matching TTS without full retraining."
    status: strongly_supported
    confidence: high
    supporting_papers:
      - "2025.acl-long.313"
      - "2507.04349"
      - "interspeech-2025-2449"
    contradicting_papers: []
    refining_papers:
      - "2508.03543"
    caveats:
      - "Sway Sampling has been demonstrated on one system (F5-TTS/E2 TTS) with a single architecture family; an independent non-uniform step-scheduling paper (interspeech-2025-2449) confirms the same early-step-critical pattern training-free and across architectures, reducing but not eliminating this generalisation concern."
      - "The optimal step density schedule (s = -1) was found empirically; theoretical justification for why early steps are more informative in speech flow is not yet established."
      - "TTS-CtrlNet independently found that emotion conditioning is concentrated in early flow steps ([0, 0.1] of the trajectory) in a different system (F5-TTS ControlNet adapter) and for a different purpose (training-time conditioning restriction rather than inference-time step scheduling); the two findings are consistent but use distinct mechanisms and have not been directly compared."
      - "At very low NFE (below 6 steps), interspeech-2025-2449 finds quality degradation becomes abrupt rather than gradual, suggesting a practical floor on how far early-step-density scheduling alone can push inference reduction without distillation."
      - "A separate interpretability paper (2508.03543) finds emotion is encoded as linear, spatially-localized directions in DiT activation space (across layers/positions rather than timesteps); this is a related but distinct finding about where attribute information concentrates in flow-matching TTS, and has not been directly reconciled with the timestep-based concentration finding in this cluster."
    last_reviewed: "2026-07-19"

  - id: fm_velocity_space_alignment
    claim: "Preference and reinforcement-learning-based post-training alignment can be formulated for flow-matching TTS architectures — either as a direct DPO objective in the velocity space, or via Gaussian reparameterization of the deterministic output combined with policy-gradient methods (GRPO) — enabling post-training intelligibility and speaker-similarity improvements without full retraining."
    status: emerging
    confidence: high
    supporting_papers:
      - "2025.acl-long.598"
      - "2504.02407"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "The DPO-FM derivation is demonstrated on a single hybrid AR+FM system (F5-TTS backbone); F5R-TTS demonstrates a distinct GRPO-based mechanism on a pure (non-hybrid) flow-matching backbone, partially addressing this gap."
      - "Preference pairs are constructed from WER-based selection in both supporting papers; the relationship between RL/preference alignment and perceptual naturalness improvements is not characterized in either."
      - "F5R-TTS shows RL post-training provides smaller relative gains on hard text (tongue twisters, repetitive phrasing) than on plain text, indicating the alignment does not resolve difficult phonetic sequences."
    last_reviewed: 2026-07-15

  - id: fm_postvq_quality_refinement
    claim: "Flow-matching decoders applied as post-quantization refinement stages can substantially recover audio quality lost during discrete speech tokenization, enabling modular integration into codec-LM pipelines without retraining the language model."
    status: emerging
    confidence: high
    supporting_papers:
      - "2502.17239"
      - "2508.07302"
    contradicting_papers: []
    refining_papers:
      - "2407.05407"
      - "2412.10117"
      - "2502.07243"
    caveats:
      - "Quality recovery is measured primarily on UTMOS and WER; speaker similarity and subjective naturalness MOS comparisons against dedicated TTS systems are not reported in the supporting papers."
      - "The improvement magnitude depends heavily on codec type; FACodec-based systems trade naturalness for intelligibility relative to mel-spectrogram-based systems."
      - "An independent multilingual synthesis paper (2508.07302) confirms that flow-matching alignment between discrete codec tokens and mel-spectrograms improves both speaker identity and prosodic naturalness, extending the post-quantization refinement pattern to a multilingual setting."
    last_reviewed: "2026-07-19"

  - id: ssl_pretraining_improves_fm_generalisation
    claim: "Self-supervised pretraining on large unlabeled audio corpora measurably improves the generalisation of flow-matching speech models to out-of-domain speakers and acoustic conditions."
    status: emerging
    confidence: high
    supporting_papers:
      - "2312.15821"
      - "2406.18009"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "Both supporting papers use Voicebox-lineage architectures; the benefit may partly reflect the specific SSL objective used rather than a general property of flow-matching training."
      - "Pretraining gains are most pronounced on out-of-domain test sets; in-domain gains are smaller and inconsistent across papers."
    last_reviewed: 2026-06-24

  - id: ar_fm_hybrid_style_timbre_decoupling
    claim: "Hybrid architectures that separate autoregressive style token generation from flow-matching acoustic decoding achieve stronger decoupling of style and timbre attributes than single-stage flow-matching systems conditioned in-context."
    status: emerging
    confidence: high
    supporting_papers:
      - "2502.07243"
      - "2412.10117"
      - "2508.02038"
    contradicting_papers: []
    refining_papers:
      - "2407.05407"
    caveats:
      - "The style-timbre decoupling advantage comes at the cost of sequential decoding latency from the AR stage, making these systems less suitable for real-time applications."
      - "Evaluation of decoupling quality relies on automatic speaker similarity metrics and style MOS ratings, whose reliability for this specific task is not independently validated."
      - "Marco-Voice (2508.02038) demonstrates a distinct decoupling mechanism — an explicit cross-dot-product orthogonality loss between speaker and emotion embedding spaces, rather than architectural separation of AR style tokens from FM acoustic decoding — achieving independent control of voice identity and emotional style within a single hybrid model; the paper's own novelty assessment describes this as primarily an engineering recipe rather than a new decoupling principle."
    last_reviewed: "2026-07-19"

  - id: fm_otcfm_data_requirements
    claim: "Standard OT-CFM flow matching for mel-spectrogram TTS is data-hungry, requiring tens of thousands of hours to achieve competitive intelligibility; learned prior variants reduce this requirement by orders of magnitude."
    status: emerging
    confidence: high
    supporting_papers:
      - "2025.acl-long.1043"
    contradicting_papers: []
    refining_papers:
      - "2406.18009"
    caveats:
      - "The 190x data reduction claim is based on a single comparison between OZSpeech (500h, learned prior) and F5-TTS (95K hours, OT-CFM); both systems differ in more ways than just the prior, including codec type and model architecture."
      - "The naturalness cost of the learned prior (UTMOS 3.15 vs. 3.76 for F5-TTS) is not accounted for in the data efficiency comparison."
    last_reviewed: 2026-06-24

  - id: cfg_conditioning_mechanism_adopted
    claim: "The classifier-free guidance conditioning mechanism from diffusion modeling transfers to flow-matching TTS systems and is sufficient for zero-shot speaker conditioning without discriminative components, and can be decoupled into independent guidance scales to control additional attributes such as accent intensity or environment."
    status: contested
    confidence: high
    supporting_papers:
      - "2207.12598"
      - "2406.18009"
      - "2407.05407"
      - "2412.10117"
    contradicting_papers:
      - "2509.19668"
    refining_papers:
      - "2312.15821"
      - "2502.18924"
      - "interspeech-2025-0455"
      - "2509.14684"
      - "2509.24650"
    caveats:
      - "CFG doubles inference compute per step; in low-NFE regimes the compute cost of CFG is proportionally larger."
      - "The guidance strength hyperparameter has no principled selection criterion and is typically tuned empirically per system."
      - "MegaTTS 3 shows that decoupling text and speaker guidance scales into independent CFG parameters produces an emergent, continuous accent-intensity control axis without any accent labels in training, extending CFG's role beyond binary conditional/unconditional interpolation; UmbraTTS (2509.14684) independently demonstrates the same decoupling pattern for speaker vs. environment attributes."
      - "A 2025 paper (2509.19668) directly contradicts the 'transfers cleanly' framing of this cluster: CFG strategies effective in image generation do not transfer directly to zero-shot TTS speaker similarity, and require separated-condition, time-varying guidance scheduling (standard CFG in early timesteps, speaker-emphasized CFG later) to be effective; the paper further finds this fix is itself dependent on the underlying model's text-representation architecture, with effectiveness diverging across languages, and that inference-time CFG tuning alone cannot close the gap between open-weight and closed-source systems. Status changed from strongly_supported to contested pending further evidence (see reassessment_queue)."
      - "Hybrid CFG (interspeech-2025-0455), which decouples the unconditional branch to a frozen base-model checkpoint, and VoxCPM's diffusion decoder (2509.24650) both confirm a non-monotonic guidance-strength trade-off (too little or too much guidance degrades both intelligibility and speaker similarity), consistent with the naive-transfer difficulties reported by 2509.19668 even where the systems do not describe their finding as a contradiction of CFG's usefulness per se."
    last_reviewed: "2026-07-19"

  - id: fm_vocoder_speed_gan_gap
    claim: "GAN vocoders retain a substantial real-time-factor advantage over flow-matching vocoders despite flow matching matching or exceeding GAN vocoders on perceptual quality, pitch accuracy, and periodicity metrics."
    status: emerging
    confidence: high
    supporting_papers:
      - "iclr-2025-tQ1PmLfPBL"
      - "2509.15085"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "Demonstrated on a single flow-matching vocoder (PeriodWave) against HiFi-GAN and BigVGAN; whether the gap narrows with acceleration techniques already validated at the acoustic-model level (distillation, learned priors) is untested for raw-waveform flow matching."
      - "Even PeriodWave's fastest 2-step variant (56.36x real-time) remains slower than HiFi-GAN (166.70x), despite already outperforming it on all quality metrics, indicating the gap is not merely a step-count tuning issue."
      - "A second, independent flow-matching vocoder built for streaming (2509.15085) confirms that FM vocoders can match or exceed GAN vocoders on intrusive perceptual quality metrics even under a streaming constraint that reduces available inference steps, via causal per-layer cache buffers rather than PeriodWave's period-aware architecture; it also finds that streaming's algorithmic-latency cost, not step count, is the practical barrier for diffusion-buffer-style streaming approaches specifically."
    last_reviewed: "2026-07-19"

  - id: fm_postfilter_matches_gan_quality
    claim: "A flow-matching-based generative postfilter conditioned on a deterministic codec's decoder output can replace adversarial training while achieving comparable subjective quality to a GAN-trained codec, extending the FM-vs-adversarial-training comparison beyond acoustic modeling into neural audio coding."
    status: emerging
    confidence: medium
    supporting_papers:
      - "iclr-2025-uxDFlPGRLX"
    contradicting_papers: []
    refining_papers:
      - "interspeech-2025-0854"
    caveats:
      - "Demonstrated on a single system (FlowDec) against a single GAN baseline (DAC); the postfilter still trails DAC on intrusive distortion metrics (SI-SDR, fwSSNR) even though it matches DAC on subjective MUSHRA quality and exceeds it on FAD."
      - "The underlying codec and postfilter are noncausal and not streaming-capable, limiting applicability relative to the mostly-causal GAN vocoder baselines it is compared against."
      - "A related but distinct postfiltering setting (interspeech-2025-0854) applies generative postprocessing to spectrogram output (rather than codec output) for low-resource speakers, and finds flow-matching postprocessors achieve higher absolute naturalness than GAN-based postprocessors, but show smaller and statistically insignificant gains from a proposed low-resource-data-augmentation strategy compared to GAN-based postprocessors — suggesting the FM-vs-GAN postfilter comparison is domain-dependent rather than a uniform FM advantage."
    last_reviewed: "2026-07-19"

  - id: fm_prosody_latent_diversity
    claim: "Conditional flow matching can be applied to compact latent spaces beyond mel-spectrograms or full acoustic features — such as self-supervised prosody representations — to enable diverse, reference-free generation of that specific attribute at inference."
    status: emerging
    confidence: medium
    supporting_papers:
      - "2025.coling-main.518"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "Demonstrated on a single system (ProsodyFlow) and a single single-speaker English dataset (LJSpeech); generalisation to multi-speaker or zero-shot settings is untested."
      - "The base architecture (StyleTTS 2) retains GAN discriminators for the acoustic decoder; flow matching in this system replaces only the prosody-sampling sub-component, not the full generative pipeline."
    last_reviewed: 2026-07-15

  - id: fm_reparam_enables_auxiliary_losses
    claim: "Reparameterizing a flow-matching model to predict the clean target directly, rather than the instantaneous velocity or derivative, allows auxiliary perceptual losses (STFT, mel) and periodic activation functions to be combined with the flow-matching objective, which cannot otherwise be applied."
    status: emerging
    confidence: high
    supporting_papers:
      - "2025.naacl-long.110"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "Demonstrated on a single flow-matching vocoder (WaveFM); whether the reparameterization generalizes to latent or mel-spectrogram-target flow matching (rather than raw waveform) is unexplored by the supporting paper."
      - "The technique is architecturally general (any model with a final linear layer predicting velocity), similar in spirit to the Gaussian-reparameterization technique used for RL alignment (F5R-TTS) but applied for a different purpose (auxiliary loss compatibility rather than policy-gradient RL)."
    last_reviewed: 2026-07-15

  - id: fm_flow_vae_latent_enrichment
    claim: "Augmenting a VAE's latent space with a normalizing flow between the encoder's posterior and the standard normal prior produces a richer target representation for flow-matching prediction, improving both reconstruction fidelity and downstream speaker similarity relative to a standard VAE latent."
    status: emerging
    confidence: medium
    supporting_papers:
      - "2505.07916"
    contradicting_papers: []
    refining_papers:
      - "2509.22167"
    caveats:
      - "Demonstrated on a single system (MiniMax-Speech's Flow-VAE) with a proprietary, unreleased training corpus and unreported model size, limiting independent verification."
      - "The improvement is measured via both resynthesis metrics (PESQ, MS-STFT) and downstream TTS speaker similarity, but the paper does not isolate whether the reconstruction or the downstream gain is the primary driver of the observed TTS quality improvement."
      - "A distinct latent-design technique (2509.22167) pursues the same goal — a richer VAE latent target for downstream flow-matching/diffusion TTS — via semantic regularization toward self-supervised speech features rather than a flow-augmented prior; it additionally reports that this regularization accelerates training convergence and, contrary to general expectation, does not necessarily cost reconstruction fidelity. Whether flow-augmented priors and semantic regularization are complementary or redundant latent-design techniques is untested."
    last_reviewed: "2026-07-19"

  - id: fm_compact_architecture_efficiency
    claim: "Flow-matching TTS and VC models can match the quality of systems two to eight times larger, or an order of magnitude more parameters, when backbone architecture components are selected for per-parameter efficiency — such as repurposed ASR encoders with multi-resolution (U-Net-style) structure, in-context conditioning, or improved positional embedding design — rather than adopted by default from the image-diffusion literature."
    status: strongly_supported
    confidence: high
    supporting_papers:
      - "2506.13053"
      - "interspeech-2025-2684"
      - "2509.11084"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "Demonstrated on a single system (ZipVoice's Zipformer backbone, repurposed from ASR); whether the same per-parameter efficiency gains transfer to other non-Transformer or non-U-Net backbone choices is untested."
      - "Speaker similarity for the compact model consistently trails larger baselines (F5-TTS and other NAR systems) despite matching or exceeding them on quality and intelligibility, suggesting the parameter-efficiency gain is not uniform across all quality dimensions."
      - "Two independent papers confirm the pattern generalises beyond Zipformer-style backbones: an in-context-learning voice conversion system achieves competitive zero-shot quality at substantially fewer parameters than larger autoregressive baselines, and a compact attention-based TTS system matches the pronunciation accuracy of models more than an order of magnitude larger through improved positional embedding design alone, without parameter scaling."
    last_reviewed: "2026-07-19"

  - id: continuous_ar_fm_efficiency_gains
    claim: "Replacing the discrete-token interface between an autoregressive language model and its acoustic decoder with continuous representations and a flow-matching or diffusion output head — via an AR-conditioned informative prior, continuous VAE latents that shorten the AR sequence, or block-wise AR generation with parallel intra-block denoising — reduces AR decoding steps or per-token function evaluations relative to discrete-token autoregressive TTS, without sacrificing quality."
    status: strongly_supported
    confidence: high
    supporting_papers:
      - "2502.11128"
      - "2508.19098"
      - "2507.22746"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "The three supporting papers achieve the shared efficiency outcome via three distinct mechanisms (informative AR prior for per-token flow matching; continuous VAE latents replacing discrete codec tokens; block-wise AR generation with parallel flow-matching denoising per block); whether these mechanisms compose or are redundant alternatives is untested."
      - "Each paper independently reports a non-monotonic relationship between the flow-matching/diffusion head's NFE and downstream quality: moderate NFE improves intelligibility, but excessive NFE degrades both intelligibility and speaker similarity, unlike the typical acceleration-literature framing of NFE reduction as a pure quality-speed trade-off."
      - "This family is entirely composed of 2025 papers; a fourth, closely related system (VoxCPM, 2509.24650) uses an AR-conditioned diffusion decoder with a similar continuous-latent philosophy but its directly relevant claims concern classifier-free guidance behaviour rather than this specific efficiency mechanism, so it is tracked under the cfg_conditioning_mechanism_adopted cluster instead."
    last_reviewed: "2026-07-19"

  - id: fm_generalizes_to_auxiliary_latent_spaces
    claim: "The flow-matching (or rectified-flow) training and sampling framework generalises cleanly from full acoustic/waveform generation to compact auxiliary continuous target spaces — self-supervised prosody latents, stochastic prosody/duration predictors, and text-conditioned speaker embeddings — functioning as a modular, diverse-sampling sub-component within an otherwise conventional (often non-FM) TTS pipeline."
    status: strongly_supported
    confidence: medium
    supporting_papers:
      - "2025.coling-main.518"
      - "interspeech-2025-1940"
      - "2509.15845"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "All three supporting papers are single-system demonstrations (ProsodyFlow, a FastSpeech2-style stochastic prosody predictor, and DeepDubbing's text-to-speaker-embedding module); the generalisation claim rests on convergent independent discovery of the same pattern rather than on any one paper directly comparing across target spaces."
      - "In every supporting system, the primary acoustic decoder remains a conventional (often non-FM, e.g. StyleTTS 2 or CosyVoice-style) pipeline; flow matching is applied only to the auxiliary target, not to the full generative process, so this cluster's evidence does not bear on whether FM is preferable to alternatives for the primary acoustic signal."
      - "The 'strongly_supported' status here reflects three independent confirmations of the pattern rather than three confirmations of an identical mechanism; treat with somewhat more caution than other strongly_supported clusters in this file given the mechanism diversity."
    last_reviewed: "2026-07-19"

  - id: fm_emotion_linear_representation
    claim: "Pre-trained flow-matching TTS models encode emotion as approximately linear, spatially-localized directions within DiT activation space, enabling training-free activation steering that achieves emotion control competitive with systems explicitly trained for emotion conditioning, and that generalises across architectures and scales without retraining."
    status: emerging
    confidence: high
    supporting_papers:
      - "2508.03543"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "Demonstrated by a single paper, though validated across three different flow-matching TTS architectures (F5-TTS, E2-TTS, CosyVoice2) at three different DiT depths (8, 22, and 56 layers), which is stronger cross-architecture evidence than most single-paper emerging clusters in this file."
      - "Training-free emotion steering incurs a moderate speaker-similarity cost relative to the unsteered baseline, indicating residual speaker-emotion entanglement in DiT representations that vector arithmetic does not fully resolve."
      - "This finding is related to, but not yet reconciled with, the fm_step_scheduling_improves_fidelity cluster's finding that emotion conditioning is concentrated in early ODE timesteps (TTS-CtrlNet); the two describe emotion concentration along different axes (activation position/layer vs. sampling timestep) of the same class of models."
    last_reviewed: "2026-07-19"

  - id: fm_crosslingual_lowresource_adaptation
    claim: "Flow-matching TTS models pretrained on a multilingual foundation can be efficiently adapted to new or typologically distant languages using limited target-language data — via fine-tuning, vocabulary expansion, or low-rank adaptation — while preserving zero-shot speaker identity, though transcript-free adaptation incurs a small but consistent speaker-similarity cost."
    status: emerging
    confidence: medium
    supporting_papers:
      - "interspeech-2025-1344"
      - "interspeech-2025-raju25_interspeech"
    contradicting_papers: []
    refining_papers:
      - "2509.14579"
    caveats:
      - "The two supporting papers use different adaptation mechanisms (LoRA fine-tuning on under 15 hours of data vs. vocabulary expansion with phoneme-based tokenisation) and different target languages; whether a single adaptation recipe is optimal across language families is untested."
      - "LoRA-based adaptation exhibits a rank-dependent trade-off between linguistic accuracy and speaker generalisation, with the optimal rank dependent on dataset scale, and the text-conditioning module requires proportionally more adapted parameters than the acoustic generation module for typologically distant languages."
      - "The transcript-free variant (2509.14579) achieves cross-lingual zero-shot cloning without audio prompt transcripts via forced-alignment word-boundary partitioning, but this convenience costs a small, consistent speaker-similarity reduction relative to transcript-supervised conditioning."
    last_reviewed: "2026-07-19"

  - id: fm_handles_nonclean_acoustic_conditions
    claim: "Flow-matching TTS and VC systems can be extended to handle non-clean acoustic conditions — background noise, environmental sound, or reverberant reference prompts — through explicit environment conditioning, source separation, or noise-robust representations, though this typically introduces a competing-objective cost relative to clean-condition performance."
    status: emerging
    confidence: medium
    supporting_papers:
      - "2509.14684"
      - "interspeech-2025-1229"
    contradicting_papers: []
    refining_papers:
      - "2508.04996"
    caveats:
      - "The two supporting systems address different problems (UmbraTTS: synthesising speech that itself contains a controllable acoustic environment; the VC paper: preserving background sound while converting timbre) united by the shared theme of moving beyond the clean-speech assumption common to most flow-matching systems in this corpus."
      - "UmbraTTS confirms that flow-matching TTS systems trained on clean speech are sensitive to acoustic environment in the speaker prompt, with degradation visible in both speaker similarity and naturalness — motivating the explicit conditioning and source-separation mechanisms both papers introduce."
      - "The VC paper explicitly reports that designing a single model to handle background preservation introduces a competing objective that slightly degrades clean-speech-only conversion quality relative to a dedicated clean-speech system, and a third paper (2508.04996) finds implicit alignment (borrowed from NAR TTS) improves noise robustness in VC as a further, distinct mechanism."
    last_reviewed: "2026-07-19"

  - id: discrete_fm_token_subspace_factorization
    claim: "Discrete flow matching defined directly over factorized speech-attribute token subspaces, using multi-head velocity prediction with a separate head per subspace, can achieve competitive naturalness and superior prosody reconstruction compared to continuous-space flow-matching and diffusion TTS baselines trained on comparable data, while matching the inference latency of single-step continuous flow-matching systems at higher NFE."
    status: emerging
    confidence: medium
    supporting_papers:
      - "2509.09631"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "This is the only discrete-space flow-matching system in the corpus; every other pure_fm paper operates in a continuous mel-spectrogram or latent space, so the generality of this variant relative to the dominant continuous-space paradigm is unverified."
      - "The paper reports that global speaker-embedding conditioning via AdaLN is insufficient for reliable zero-shot speaker similarity in this discrete-token setting, and that perceptual similarity judgements diverge from embedding-based automatic metrics (SIM-O) — a evaluation-validity caveat specific to discrete-space conditioning that has not been checked against continuous-space systems in this corpus."
    last_reviewed: "2026-07-19"

  - id: fm_joint_codec_training_objective
    claim: "A single end-to-end flow-matching loss is sufficient to jointly optimise quantization and reconstruction in a neural speech codec, eliminating the need for the multi-stage (encoder, quantizer, adversarial decoder) training pipelines typical of GAN-based codecs."
    status: emerging
    confidence: medium
    supporting_papers:
      - "2508.16790"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "Demonstrated on a single system; the paper's own current_role in this concept is frontier_probe, and the joint-training claim has not been benchmarked head-to-head against the two-stage postfiltering pattern (FlowDec) already tracked in the fm_vocoder family, which instead trains a flow-matching postfilter on top of a separately-trained deterministic codec."
      - "Whether joint end-to-end FM training or two-stage postfiltering produces better quality-latency trade-offs, or whether the two approaches could be combined, is untested."
    last_reviewed: "2026-07-19"

  - id: discrete_time_diffusion_fm_equivalence
    claim: "Reformulating diffusion-like speech generation in fully discrete time — with either additive or multiplicative Gaussian noising — can match the quality of continuous-time diffusion formulations while eliminating the continuous/discrete mismatch inherent to continuous-time score-based samplers, provided some stochasticity is retained in the noising process."
    status: emerging
    confidence: medium
    supporting_papers:
      - "2509.18470"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "Demonstrated on a single system; the paper's current_role in this concept is frontier_probe. Multiplicative Gaussian noise is reported as a viable alternative to additive noise despite its non-isotropic covariance structure, but fully deterministic noising is found insufficient on its own for naturalness, indicating some minimum stochasticity is load-bearing."
      - "This cluster is adjacent to but distinct from the core flow-matching literature in this concept: the paper frames its contribution against continuous-time diffusion/score-based samplers specifically, and its relevance to the OT-CFM objective used by most pure_fm papers is by analogy (both are continuous-time formulations facing a similar training/inference consistency question) rather than direct comparison."
    last_reviewed: "2026-07-19"

  - id: ar_fm_hybrid_emotion_representation_richness
    claim: "In hybrid autoregressive-plus-flow-matching TTS architectures, richer or multi-format emotion/style conditioning — combining discrete and continuous emotion representations, orthogonalizing speaker and emotion embedding spaces, or deep hidden-state-level fusion between the AR and FM stages — measurably improves emotional expressiveness or phonetic clarity under emotional expressiveness beyond what a single conditioning format achieves."
    status: emerging
    confidence: medium
    supporting_papers:
      - "2505.10599"
      - "2508.02038"
    contradicting_papers: []
    refining_papers:
      - "2506.21619"
    caveats:
      - "The two supporting papers pursue different mechanisms (combining discrete emotion labels with continuous dimensional emotion representations vs. orthogonalizing speaker/emotion embedding spaces via a cross-dot-product loss) united by the shared finding that a single conditioning format under-serves emotional expressiveness in hybrid AR+FM systems."
      - "The refining paper (2506.21619) reports a related but narrower finding: GPT-latent fusion between the AR semantic module and the FM acoustic module improves phonetic clarity specifically under high emotional expressiveness, as measured by WER on an emotional test set, rather than improving expressiveness itself."
      - "None of the three papers directly compare their mechanism against the others; whether these approaches are complementary or converge on the same underlying fix for emotion-expressiveness limitations in hybrid architectures is untested."
    last_reviewed: "2026-07-19"

  - id: fm_speaker_unlearning_feasibility
    claim: "Machine unlearning via randomization-based training objectives can selectively suppress specific speaker identities in a pre-trained flow-matching zero-shot TTS model while preserving synthesis quality for retained speakers, using the pre-trained model itself as its own teacher to provide diverse alternative-identity targets without requiring aligned cross-speaker audio pairs."
    status: emerging
    confidence: medium
    supporting_papers:
      - "2507.20140"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "Demonstrated on a single paper; the paper's current_role in this concept is frontier_probe. This is the only privacy/unlearning-focused paper in the corpus for this concept, so the finding has no independent replication."
      - "The self-teacher mechanism (using the pre-trained model's own outputs as unlearning targets) is specific to generative models with a tractable sampling procedure and may not transfer to discriminative or discrete-token generative TTS architectures without adaptation."
    last_reviewed: "2026-07-19"

  - id: fm_dialect_generalization_gap
    claim: "Flow-matching TTS models trained predominantly on standard-dialect data exhibit degraded speech clarity when reproducing minority-dialect or accent-specific phonetic features via reference-clip conditioning, limiting the fidelity of accent-conditioned downstream applications such as spoken chatbots."
    status: emerging
    confidence: medium
    supporting_papers:
      - "2025.acl-long.1252"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "The supporting paper uses F5-TTS entirely off-the-shelf as a deployed backbone and develops no flow-matching methodology of its own; this claim is included because it is a generalisable, field-level limitation finding about standard-dialect training data, not because the paper contributes to flow-matching architecture or technique."
      - "The finding is based on a single TTS backbone (F5-TTS) and a single accent (African American English); whether the clarity degradation is specific to this system's training data or a general property of standard-dialect-trained flow-matching TTS is untested."
    last_reviewed: "2026-07-19"

  - id: fm_outperforms_gan_decoders_vc_singing
    claim: "Flow-matching decoders produce higher perceptual audio quality than GAN-based decoders in voice and singing voice conversion when conditioning signal quality is held constant."
    status: emerging
    confidence: medium
    supporting_papers:
      - "interspeech-2025-0203"
      - "interspeech-2025-0305"
    contradicting_papers: []
    refining_papers:
      - "interspeech-2025-0854"
    caveats:
      - "Demonstrated in emotional voice conversion and singing voice conversion respectively, both against GAN and/or autoencoder baselines; this is a distinct comparison axis from the fm_vocoder_speed_gan_gap cluster, which concerns real-time-factor rather than quality, and from fm_surpasses_diffusion_speed_quality, which compares against diffusion rather than GAN baselines."
      - "The refining paper (interspeech-2025-0854) extends this comparison to spectrogram-postprocessing rather than primary decoding, and finds the FM-vs-GAN quality advantage narrows in low-resource conditions, where FM shows smaller and statistically insignificant gains from a proposed data-augmentation strategy relative to the GAN-based postprocessor."
    last_reviewed: "2026-07-19"

  - id: fm_training_convergence_acceleration_techniques
    claim: "Auxiliary losses applied at intermediate transformer depths — alignment supervision or self-supervised-encoder teacher distillation — can substantially accelerate the training convergence of flow-matching TTS models without any change to the inference-time sampling procedure, and are most effective when different supervision types are applied at different network depths rather than at the same layer."
    status: emerging
    confidence: high
    supporting_papers:
      - "interspeech-2025-1236"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "Demonstrated on a single paper. This cluster concerns training-time convergence acceleration, which is a distinct axis from the fm_inference_acceleration cluster's inference-time step-count reduction; the two are complementary rather than competing techniques."
      - "The paper additionally finds that training-time alignment acceleration primarily improves text intelligibility and speaker similarity rather than overall naturalness, indicating faster convergence does not uniformly improve all quality dimensions."
    last_reviewed: "2026-07-19"

  - id: fm_singing_multilingual_moe_f0
    claim: "Flow-matching transformers for singing voice synthesis benefit from language-conditioned mixture-of-experts routing and intermediate-layer F0 supervision, improving multilingual synthesis quality and style fidelity beyond architectures adapted directly from speech TTS without singing-specific structure."
    status: emerging
    confidence: high
    supporting_papers:
      - "2025.findings-acl.687"
    contradicting_papers: []
    refining_papers: []
    caveats:
      - "Demonstrated on a single system; this is the first singing-specific pure flow-matching paper in this corpus, so the MoE-routing and intermediate-F0-supervision techniques have no independent replication."
      - "The same paper also reports that boundary masking during training improves zero-shot naturalness by removing reliance on precise phoneme/note alignment annotations, and that contrastive cross-modal style embeddings (singing, speech, natural language) support style transfer without modality-specific architectures; these are tracked here as supporting mechanisms rather than as separate clusters given their common source."
    last_reviewed: "2026-07-19"

method_families:
  - id: pure_fm
    name: "Pure Flow-Matching Systems"
    summary: "Models that use flow matching as the sole generative backbone, typically operating directly on mel spectrograms or a compact latent space, with no autoregressive component. This is now the largest and most heterogeneous family in the corpus: alongside the original OT-CFM mel-spectrogram TTS/VC pattern, it has absorbed emotion/environment/dialect control work, cross-lingual and low-resource adaptation, compact-architecture efficiency work, interpretability studies of FM DiT activations, and a first discrete-space flow-matching variant. All members share the property of achieving sub-linear RTF scaling with utterance length and requiring no separate AR token stage."
    papers:
      - "2210.02747"
      - "2312.15821"
      - "2406.18009"
      - "2412.04724"
      - "2025.acl-long.313"
