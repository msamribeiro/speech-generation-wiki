        role: supports
        claim: "Adapter-based fine-tuning preserves zero-shot TTS capability in multilingual models more reliably than full parameter fine-tuning on single-speaker low-resource data."
        source: "§4.3, Table 2"
        evidence: "On the multi-speaker Korean evaluation, full fine-tuning of F5-TTS loses zero-shot capability entirely (NMOS 2.24 ± 0.21), while the adapter-based PEFT-TTS retains it (NMOS 3.06 ± 0.28)."
        confidence: high
        relevance: low
      - claim_id: peft_tts_cross_lingual_low_data_feasible
        role: supports
        claim: "Cross-lingual adaptation of TTS models is feasible with fewer than 15 hours of single-speaker data when a multilingual pre-trained foundation is available."
        source: "§4.1.1, §4.2"
        evidence: "PEFT-TTS adapts F5-TTS to Korean using only the 12.65-hour single-speaker KSS dataset and 1.72% of model parameters, achieving CER 4.906 versus 17.345 for F5-TTS trained from scratch on the same data."
        confidence: high
        relevance: medium
      - claim_id: peft_tts_text_conditioning_needs_more_capacity
        role: supports
        claim: "In flow-matching TTS fine-tuning, the text conditioning module requires more parameters to adapt to a typologically distant language than the acoustic generation module."
        source: "§4.4.1"
        evidence: "The ablation shows that a compressed Conv-Adapter on the ConvNeXt V2 text encoder (compression factor 0.25, full adaptation) is necessary for reliable Korean pronunciation, whereas the DiT acoustic blocks use a much smaller LoRA rank (16) without degrading pronunciation."
        confidence: medium
        relevance: high
      - claim_id: peft_tts_lora_rank_tradeoff
        role: supports
        claim: "Low-rank adaptation in DiT-based TTS models exhibits a rank-dependent trade-off between linguistic accuracy and speaker generalisation, with optimal rank dependent on dataset scale."
        source: "§4.4.3"
        evidence: "The ablation shows increasing DiT LoRA rank improves pronunciation accuracy but reduces zero-shot speaker adaptation capability, motivating the paper's choice of rank 16 over larger ranks."
        confidence: medium
        relevance: high
    limitations:
      - "Reproducibility is limited to the Korean-specific KSS dataset; generalisation of the parameter-allocation findings to other low-resource languages is assumed but not tested."
      - "Multi-speaker WER (21.6%) remains well above a large-scale multilingual baseline (10.9%), with hallucination artefacts not fully resolved by the proposed adapters."
    caveats:
      - "The paper's contribution is an adapter-based fine-tuning recipe layered onto a frozen F5-TTS backbone; it does not modify the flow-matching objective or the DiT architecture itself, only which of its existing components receive gradient updates."

