        source: "§3.3.1, §3.3.2, Tables 2, 4"
        evidence: "Applying a 1.6x duration stretch only to tense-vowel target words via Matcha-TTS's duration-predictor output achieved 15.15% total WER versus 19.82% for global 1.2x stretch and 24.30% for the base condition."
        confidence: medium
