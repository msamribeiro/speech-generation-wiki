        source: "§4.1, §4.2, Table 3"
        evidence: "F5-TTS yields delta-WER Disparate Impact of 0.59 for high-severity dysarthric speakers and delta-CER DI of 0.75 (both rated poor), while speaker-similarity DI (0.85) and prosody DI (0.90) remain comparatively stable."
