    caveats:
      - "The flow-matching decoder (adapted from RFWave's ConvNeXtV2 backbone and rectified-flow objective) directly replaces a GAN-based decoder in an existing SVC pipeline, providing a controlled within-paper comparison of flow matching against GAN decoding for singing synthesis."

  - id: "interspeech-2025-0455"
    published_date: "2025-08-17"
    entry_date: "2026-07-19"
    year: 2025
    venue: Interspeech
    task: [TTS]
    architecture: [flow-matching, VAE, hybrid]
    relevance: high
    evidence_role:
      - core_evidence
      - acceleration_evidence
    current_role: active_evidence
    method_family: [fm_acceleration]
    claims:
      - claim_id: aptts_adversarial_posttraining_reduces_steps
        role: supports
        claim: "Adversarial post-training applied to a pre-trained flow matching decoder can reduce the required ODE sampling steps by 5-8x while maintaining competitive naturalness and improving intelligibility relative to the full-step baseline."
        source: "§3.3, Table 1, Table 2"
        evidence: "APTTS (4 steps) achieves MOS 3.58, WER 2.08% versus F5-TTS (32 steps) at MOS 3.66, WER 2.52%, with RTF 0.052 versus F5-TTS's 0.217, a 4x speedup."
        confidence: high
        relevance: high
      - claim_id: aptts_latent_fm_matches_intelligibility_lowdata
        role: supports
        claim: "Latent flow matching TTS trained on approximately 1K hours can match or surpass the intelligibility of zero-shot systems trained on 60-100K hours, though speaker similarity remains lower at this data scale."
        source: "§4.2, Table 2"
        evidence: "APTTS achieves WER 1.73% on full LibriSpeech test-clean, the lowest of all baselines including VALL-E (WER 5.9%, 60K+ hours) and Voicebox (WER 1.9%), while its SIM-o of 0.55 lags Voicebox (0.66) and F5-TTS (0.64)."
        confidence: high
        relevance: high
      - claim_id: aptts_infilling_avoids_separate_speaker_encoder
        role: supports
        claim: "Framing zero-shot TTS as a speech infilling task within a latent space enables prompt-conditioned generation without requiring a separate speaker encoder or d-vector lookup."
        source: "§3.2"
        evidence: "APTTS masks 70-100% of the latent sequence and trains the flow-matching decoder to reconstruct masked frames conditioned on the unmasked prompt region, with no separate speaker embedding module."
        confidence: medium
        relevance: medium
      - claim_id: aptts_hybrid_cfg_reduces_error_accumulation
        role: supports
        claim: "Hybrid classifier-free guidance, decoupling the unconditional branch to a frozen base model checkpoint, reduces error accumulation in few-step generators compared to applying a fixed large guidance scale during adversarial post-training."
        source: "§3.3"
        evidence: "During adversarial post-training the decoder is always fully conditioned, while at inference the unconditional CFG term is derived from the pre-AP base model rather than the few-step generator, avoiding the error accumulation of a fixed large guidance scale on the distilled model."
        confidence: medium
        relevance: high
      - claim_id: aptts_ap_generalizes_across_fm_domains
        role: supports
        claim: "Adversarial post-training generalises across flow matching representation domains: the same post-training procedure improves both latent-domain (APTTS) and mel-spectrogram-domain (Matcha-TTS) models."
        source: "§4.3, Table 3"
        evidence: "Applying adversarial post-training to Matcha-TTS on VCTK, AP at 2 steps surpasses the 10-step base model in both MOS (3.96 vs 3.71) and WER (4.8% vs 6.81%)."
        confidence: high
        relevance: high
    limitations:
      - "SIM-o scores lag behind large-scale trained models, suggesting prompt fidelity would improve with more data."
      - "The system is English-only; multilingual extension is unexplored."
    caveats:
      - "This paper's adversarial post-training technique and RapFlow-TTS's consistency flow matching (interspeech-2025-0554, also in this batch) both converge on the finding that flow matching's straight trajectories enable aggressive inference-step reduction, via different mechanisms (adversarial discrimination vs. consistency constraints); the paper's own Wiki Connections section draws this comparison explicitly."

  - id: "interspeech-2025-0554"
    published_date: "2025-08-17"
