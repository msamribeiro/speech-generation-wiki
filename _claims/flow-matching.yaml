open_questions:
  - "Speaker similarity in zero-shot FM-TTS consistently lags behind speaker verification ground truth, particularly for out-of-domain speakers. Is this a fundamental limitation of the mel-spectrogram representation, the OT-CFM objective, or the scale of training data?"
  - "The naturalness-intelligibility tradeoff between learned-prior (OZSpeech) and standard OT-CFM (F5-TTS) systems raises the question of whether a single FM architecture can simultaneously achieve top-tier performance on both axes, or whether codec choice forces a permanent tradeoff."
  - "Most pure FM-TTS papers train on clean audiobook-style English data. The extent to which current flow-matching architectures generalise to spontaneous, noisy, or code-switched speech remains largely uncharacterised; the Indigenous-language (Ojibwe/Mi'kmaq/Maliseet) and Indian-language duration-prediction papers are the first exceptions in this corpus, and both report language-dependent, non-uniform results."
  - "Inference-time step scheduling (Sway Sampling) and post-training solver optimisation (Bespoke Solvers) both improve FM TTS without retraining. Are these techniques composable, and do their gains stack when applied together?"
  - "Preference/RL-based alignment for flow-matching TTS has now been demonstrated on both a hybrid AR+FM system (DPO-FM) and a pure flow-matching system (F5R-TTS's GRPO), using different mechanisms (direct velocity-space DPO vs. Gaussian reparameterization with policy gradients). Whether these two mechanisms are complementary or convergent, and whether either transfers cleanly to the other's architecture class, remains untested."
  - "The finding that flow-matching trajectories concentrate certain information (speech fidelity per Sway Sampling; emotion per TTS-CtrlNet) in early ODE steps has now emerged independently in two systems. Does this generalise to other conditioning attributes (speaker identity, language, prosody), and is there a unified theoretical account of why early steps carry disproportionate semantic weight?"
  - "GAN vocoders retain a substantial real-time-factor advantage over flow-matching vocoders (PeriodWave, WaveFM) despite matching or exceeding them on perceptual quality and pitch accuracy. Whether the acceleration techniques already validated at the acoustic-model level (distillation, learned priors, Bespoke Solvers) close this gap for raw-waveform flow matching specifically is untested."
  - "Distillation-based acceleration (DMOSpeech 2) disproportionately reduces prosodic diversity relative to spectral quality. Does this diversity cost generalise across all distillation mechanisms tracked in the fm_acceleration family (DMD, PeRFlow, consistency distillation, CFG-conditioned distillation), or is it specific to DMD-style objectives?"

trend_notes:
  - "Flow matching has displaced diffusion as the dominant continuous-output generative backbone in TTS and VC since 2023, with adoption spanning both pure FM architectures (E2 TTS, F5-TTS) and hybrid AR+FM pipelines (CosyVoice, Vevo)."
  - "From 2024 onward, the predominant architectural pattern is the AR-FM hybrid: an autoregressive LM generates semantic tokens, and a flow-matching model decodes them to mel spectrograms. As of this update, the ar_fm_hybrid family accounts for 11 of 34 papers in this corpus, but several of the most recent hybrid papers (CosyVoice 3, GOAT-SLM, SemAlignVC) leave the flow-matching stage unchanged and direct their contributions at the AR/tokenizer stage instead, suggesting the FM component of the hybrid pattern may be architecturally stabilising."
  - "Inference acceleration for flow-matching speech models has become an active subfield since 2024, now spanning at least six distinct mechanisms: learned ODE solvers (Bespoke Solvers), flow distillation (DMD, DMD2, PeRFlow), consistency distillation, learned priors, and CFG-strength-conditioned guided distillation. No single mechanism has established clear dominance, and DMOSpeech 2 (mid-2025) is the first paper in this corpus to identify a specific quality cost (reduced prosodic diversity) attributable to distillation-based acceleration."
  - "Post-training alignment and fine-tuning of flow-matching models continued to diversify through mid-2025: beyond DPO-FM's velocity-space formulation and CosyVoice 2/3's differentiable ASR reward optimisation, F5R-TTS demonstrates GRPO-based RL alignment on a pure (non-hybrid) flow-matching backbone via Gaussian output reparameterization, and DMOSpeech 2 applies GRPO specifically to the duration-prediction subcomponent rather than the full generator."
  - "The mel-spectrogram bottleneck — sequence length scaling and speaker similarity ceiling — is increasingly identified as a limitation of pure FM-TTS architectures relative to codec-token-based systems, suggesting a potential shift toward codec-native FM pipelines as the dominant paradigm."
  - "As of mid-2025, flow matching has expanded well beyond mel-spectrogram acoustic modeling into new application domains: direct raw-waveform vocoding (PeriodWave, WaveFM), neural codec postfiltering (FlowDec), self-supervised prosody-latent generation (ProsodyFlow), joint speech-plus-environment synthesis (UmbraTTS), and frozen-backbone adapter-based control (TTS-CtrlNet's ControlNet adaptation for time-varying emotion). Several of these remain single-paper findings and are flagged as emerging clusters pending independent replication."
