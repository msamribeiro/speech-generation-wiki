      - "interspeech-2025-1229"
      - "interspeech-2025-1236"
      - "interspeech-2025-1344"
      - "interspeech-2025-1536"
      - "interspeech-2025-2159"
      - "interspeech-2025-2573"
      - "interspeech-2025-2684"
      - "interspeech-2025-raju25_interspeech"
      - "2506.23367"
      - "2509.08379"
      - "2509.09631"
      - "2509.11084"
      - "2509.12171"
      - "2509.14684"
      - "2509.14579"
      - "2509.17988"
      - "2509.18060"
      - "2509.18470"
      - "2509.19668"
      - "2509.22727"
      - "2509.22167"
      - "2509.24773"
    open_questions:
      - "What is the minimum data volume at which pure OT-CFM mel-spectrogram systems achieve competitive intelligibility, and can architectural changes (e.g. DiT vs. U-Net) shift this threshold?"
      - "Does the Sway Sampling step scheduling principle generalise across all pure FM architectures, or is it specific to the DiT + ConvNeXt design of F5-TTS?"
      - "This family now spans mel-spectrogram TTS, VC (Seed-VC), and latent-diffusion variants (MegaTTS 3) that use rectified flow rather than the canonical OT-CFM objective; does the family's shared 'no autoregressive component' property predict shared failure modes and scaling behaviour across these variants, or do task and target-representation differences dominate?"
      - "A discrete flow-matching variant defined over factorized token subspaces (rather than continuous mel or latent targets) has now appeared as a single paper in this family; is discrete-space FM a viable third branch alongside continuous mel-spectrogram and latent FM, or a narrow niche specific to prosody/acoustic factorization?"
      - "Interpretability findings (emotion encoded as linear directions in DiT activation space) and control findings (dual CFG for speaker/environment, early-injection dialect conditioning) have emerged independently across several papers in this family; do they reflect a single underlying geometric structure of FM DiT representations, or are they attribute-specific coincidences?"

  - id: ar_fm_hybrid
    name: "Autoregressive LM + Flow-Matching Acoustic Model"
    summary: "Two-stage pipelines where an autoregressive language model generates discrete semantic or style tokens, and a separate flow-matching model decodes those tokens into continuous speech. The AR stage handles content and prosody at a semantic level; the FM stage handles fine-grained acoustic detail. This architecture trades the latency of AR decoding for stronger control over speaker style and paralinguistic attributes. Recent additions to this family increasingly focus their novelty on richer emotion/style conditioning of the AR-to-FM interface rather than on the FM stage itself."
    papers:
      - "2407.05407"
      - "2412.10117"
      - "2025.acl-long.598"
      - "2502.07243"
      - "2502.17239"
      - "2503.14345"
      - "2025.findings-naacl.184"
      - "2505.07916"
      - "2505.17589"
      - "2507.09070"
      - "2507.18119"
      - "2025.acl-long.912"
      - "2025.findings-acl.101"
      - "2508.02038"
      - "2508.14049"
      - "2508.07302"
      - "2508.08715"
      - "2508.16332"
      - "2506.21619"
      - "2509.14946"
      - "2509.15629"
      - "2505.10599"
      - "2509.26514"
    open_questions:
      - "What is the optimal interface between the AR token stage and the FM acoustic stage — how many semantic token levels, which codec, and how much conditioning information should flow between stages?"
      - "Can the AR stage be replaced with a non-autoregressive masked predictor while retaining the style control advantages of the hybrid architecture?"
      - "Several recent hybrid papers (CosyVoice 3, GOAT-SLM, SemAlignVC) leave the FM acoustic stage architecturally unchanged and focus their contribution on the AR/tokenizer stage instead; is the FM stage in this family approaching a stable, 'solved' design, or is this a temporary lull before the next FM-specific innovation?"
      - "A cluster of recent additions (Marco-Voice, GPT-latent fusion TTS, discrete+continuous emotion conditioning) all report richer emotion/style conditioning schemes at the AR-FM interface; is this converging toward a standard multi-format emotion conditioning recipe, or do the specific mechanisms (orthogonalized embeddings, deep hidden-state fusion, dual discrete/continuous representations) remain genuinely distinct and non-composable?"

  - id: fm_acceleration
    name: "Accelerated / Single-Step Flow Matching"
    summary: "Systems that specifically target reducing the inference-time ODE integration steps (or per-step compute) of flow-matching models, using distillation (DMD, DMD2, PeRFlow, consistency distillation, shortcut self-consistency training, CFG-conditioned guided distillation), learned ODE solvers, non-uniform step schedules, training-free caching, adversarial post-training, or learned prior distributions. Originally demonstrated almost exclusively on mel-spectrogram TTS, this family now has substantial independent confirmation in voice conversion and in streaming/training-free acceleration of DiT-based TTS, indicating the acceleration techniques generalise across tasks and are not tied to any single acoustic representation."
    papers:
      - "2406.05551"
      - "2025.acl-long.1043"
      - "2507.14988"
      - "2025.acl-long.790"
      - "2508.04996"
      - "interspeech-2025-0455"
      - "interspeech-2025-0554"
      - "interspeech-2025-1779"
      - "interspeech-2025-2449"
      - "2509.08696"
      - "2509.09748"
    open_questions:
      - "Do distillation-based acceleration and learned-prior acceleration achieve equivalent perceptual quality at equivalent NFE, or do they produce qualitatively different speech artefacts?"
      - "Is there a principled lower bound on the number of ODE steps required for high-fidelity mel-spectrogram synthesis, given the complexity of the speech manifold?"
      - "DMOSpeech 2 shows distillation disproportionately reduces prosodic diversity relative to spectral quality; does this diversity cost hold across all distillation mechanisms tracked in this family (DMD, PeRFlow, consistency distillation, CFG-conditioned distillation, shortcut self-consistency), or is it specific to DMD-style objectives?"
      - "This family now spans at least four largely independent acceleration strategies — distillation/consistency training, non-uniform step scheduling, training-free activation/attention caching, and adversarial post-training — each validated on different systems and tasks; do any of these compose (e.g. caching applied to an already-distilled model), or do they target redundant sources of inference cost?"

  - id: fm_vocoder
    name: "Flow-Matching Vocoders and Codecs (Raw Waveform / Postfilter)"
    summary: "Systems that apply the flow-matching or conditional-flow-matching objective directly to raw waveform generation, to postfiltering a deterministic codec/vocoder's output, to joint codec quantization-and-reconstruction training, or to postprocessing acoustic-model spectrogram output, rather than to mel-spectrogram or semantic-token acoustic modeling proper. These systems compete directly with GAN vocoders (HiFi-GAN, BigVGAN) and diffusion vocoders, trading iterative sampling cost for gains in pitch accuracy, periodicity, and postfilter/postprocessing quality without adversarial training."
    papers:
      - "iclr-2025-tQ1PmLfPBL"
      - "2025.naacl-long.110"
      - "iclr-2025-uxDFlPGRLX"
      - "interspeech-2025-0854"
      - "2508.16790"
      - "2509.15085"
    open_questions:
      - "Can flow-matching vocoders close the substantial real-time-factor gap to single-step GAN vocoders (PeriodWave: 7.48x vs. HiFi-GAN's 166x at matched or better quality) through the same acceleration techniques (distillation, learned priors) already validated at the acoustic-model level?"
      - "Do the two distinct techniques identified in this family for improving one-step/few-step waveform quality — WaveFM's mel-conditioned prior and PeriodWave's period-aware architecture — compose, or are they redundant solutions to the same underlying problem?"
      - "FlowDec's coupled-source postfiltering, the streaming causal-cache vocoder, and the joint quantization-reconstruction codec (which trains the entire codec end-to-end with a single flow-matching loss) each solve a different problem at the codec/vocoder boundary; is there a unifying design that combines coupled priors, streaming causality, and joint quantization training in one system?"

  - id: historical_guidance
    name: "Classifier-Free Guidance (Predecessor)"
    summary: "The classifier-free guidance paper establishes the conditioning mechanism later adopted by flow-matching TTS systems. It is not a flow-matching system, but provides the theoretical and practical foundation for the CFG conditioning strategy universally adopted in zero-shot FM-TTS."
    papers:
      - "2207.12598"
    open_questions:
      - "Is the joint training with conditioning dropout equally effective for flow-matching velocity field estimation as it is for score-based diffusion, given the different training objective geometry?"

  - id: continuous_ar_fm_head
    name: "Continuous Autoregressive Models with Flow-Matching/Diffusion Heads"
    summary: "Single-stage architectures that generate continuous acoustic representations (mel frames, VAE latents, or fixed-length token blocks) autoregressively, using a flow-matching or diffusion sampling head as the per-step or per-block output distribution, rather than routing through a separate discrete-token acoustic decoder as in the ar_fm_hybrid pattern. The distinguishing property is a single jointly-trained model in which the flow-matching component is the output layer of the AR model itself, not a downstream module. Across the four papers in this family, this pattern consistently reduces AR sequence length or per-token NFE relative to discrete-token AR baselines without sacrificing — and sometimes improving — quality."
    papers:
      - "2502.11128"
      - "2507.22746"
      - "2508.19098"
      - "2509.24650"
    open_questions:
      - "Three distinct mechanisms achieve the family's shared efficiency gain — an AR-conditioned informative prior replacing the Gaussian prior for per-token flow matching, continuous VAE latents replacing discrete tokens to shorten the AR sequence, and block-wise AR generation with parallel intra-block denoising; are these complementary and stackable, or do they address the same underlying redundancy from different angles?"
      - "Every paper in this family reports a non-monotonic relationship between the flow-matching/diffusion head's NFE (or FSQ/latent dimensionality) and downstream quality, with excess computation degrading rather than improving results; is there a shared theoretical account of why continuous AR heads saturate or degrade at high NFE, unlike the acceleration literature's typical framing of NFE reduction as a pure quality-speed trade-off?"
      - "This family is new and entirely composed of 2025 papers; whether it displaces the two-stage discrete-token ar_fm_hybrid pattern, coexists as a latency-optimised alternative, or is absorbed into it (e.g. by hybridising continuous and discrete stages) is unresolved."

  - id: fm_auxiliary_attribute
    name: "Flow Matching Applied to Auxiliary (Non-Acoustic) Latent Targets"
    summary: "Systems that apply the flow-matching or rectified-flow objective not to the primary acoustic output (mel-spectrogram, waveform, or codec tokens) but to a compact auxiliary attribute space — prosody latents, stochastic prosody/duration/pitch predictors, or text-conditioned speaker embeddings — as a modular sub-component feeding into an otherwise separate, often non-FM, acoustic pipeline. This is a small but consistent pattern across three independently-authored 2025 papers, suggesting flow matching's simulation-free training and diverse-sampling properties transfer cleanly from full acoustic generation to lower-dimensional conditioning targets."
    papers:
      - "2025.coling-main.518"
      - "interspeech-2025-1940"
      - "2509.15845"
    open_questions:
      - "All three papers in this family retain a conventional (non-FM) acoustic decoder and use flow matching only for the auxiliary target; would applying the same auxiliary-latent pattern within a fully FM-native pipeline (e.g. a pure_fm acoustic model conditioned by an fm_auxiliary_attribute prosody or speaker-embedding module) compound the benefits, or is the modular separation itself load-bearing?"
      - "Prosody latents (ProsodyFlow, stochastic prosody predictors) and speaker embeddings (DeepDubbing's TTT module) are the two auxiliary target spaces demonstrated so far; what other sub-components of a TTS pipeline (e.g. duration, language ID, emotion category) would benefit from the same treatment, and does the benefit scale with the dimensionality of the target space?"

reassessment_queue:
  - id: cfg_conditioning_mechanism_adopted
    type: claim_status
    reason: "This cluster was strongly_supported on the basis of CFG transferring cleanly from diffusion to flow-matching TTS; a 2025 paper (2509.19668) reports that CFG strategies effective in image generation do not transfer directly and require separated-condition, time-varying scheduling to be effective for zero-shot speaker similarity, contradicting the cluster's core claim as stated. The cluster has been marked contested pending further evidence."
    trigger: "Two or more additional papers independently confirming (or refuting) that naive CFG transfer from image/diffusion literature is insufficient for FM-TTS speaker conditioning without architecture-specific tuning."
    due: "2026-10"
    current_assessment: contested
    watch_for:
      - "Papers proposing a standardised or theoretically-motivated CFG scheduling recipe for FM-TTS, rather than per-system empirical tuning."
      - "Direct replication of 2509.19668's separated-condition CFG finding on additional open-weight FM-TTS systems beyond the one studied."
  - id: continuous_ar_fm_head
    type: method_family
    reason: "This is a newly-created method family (four 2025 papers) built on a consistent but still narrow evidentiary base; whether it represents a durable third architectural branch (alongside pure_fm and ar_fm_hybrid) or a transient set of concurrent, unrelated efficiency tricks is not yet established."
    trigger: "Three or more additional 2026 papers adopting the same continuous-AR-plus-FM/diffusion-head pattern, or a head-to-head comparison against ar_fm_hybrid/pure_fm systems at matched training scale."
    due: "2027-01"
    current_assessment: frontier_probe
    watch_for:
      - "Direct benchmark comparisons between continuous_ar_fm_head systems and matched-scale ar_fm_hybrid or pure_fm systems on the same evaluation protocol."
      - "Adoption of this pattern by a large industry lab (as opposed to academic single-paper demonstrations), which would signal architectural convergence rather than a one-off technique."
  - id: discrete_fm_token_subspace_factorization
    type: method_family
    reason: "A single paper (2509.09631) introduces discrete flow matching over factorized token subspaces as an alternative to the continuous-space FM objective used by every other paper in the pure_fm family; it is currently a one-paper finding within a much larger family and its generality is unverified."
    trigger: "A second independent paper adopting discrete-space flow matching for TTS or VC, confirming or refuting the reported naturalness/prosody advantages over continuous-space FM and diffusion baselines."
    due: "2026-12"
    current_assessment: frontier_probe
    watch_for:
      - "Any paper explicitly contrasting discrete-space and continuous-space flow matching on the same benchmark and training data."

open_questions:
  - "Speaker similarity in zero-shot FM-TTS consistently lags behind speaker verification ground truth, particularly for out-of-domain speakers. Is this a fundamental limitation of the mel-spectrogram representation, the OT-CFM objective, or the scale of training data?"
  - "The naturalness-intelligibility tradeoff between learned-prior (OZSpeech) and standard OT-CFM (F5-TTS) systems raises the question of whether a single FM architecture can simultaneously achieve top-tier performance on both axes, or whether codec choice forces a permanent tradeoff."
  - "Most pure FM-TTS papers train on clean audiobook-style English data. The extent to which current flow-matching architectures generalise to spontaneous, noisy, or code-switched speech remains largely uncharacterised; the Indigenous-language (Ojibwe/Mi'kmaq/Maliseet) and Indian-language duration-prediction papers are the first exceptions in this corpus, and both report language-dependent, non-uniform results."
  - "Inference-time step scheduling (Sway Sampling) and post-training solver optimisation (Bespoke Solvers) both improve FM TTS without retraining. Are these techniques composable, and do their gains stack when applied together?"
  - "Preference/RL-based alignment for flow-matching TTS has now been demonstrated on both a hybrid AR+FM system (DPO-FM) and a pure flow-matching system (F5R-TTS's GRPO), using different mechanisms (direct velocity-space DPO vs. Gaussian reparameterization with policy gradients). Whether these two mechanisms are complementary or convergent, and whether either transfers cleanly to the other's architecture class, remains untested."
  - "The finding that flow-matching trajectories concentrate certain information (speech fidelity per Sway Sampling; emotion per TTS-CtrlNet) in early ODE steps has now emerged independently in two systems. Does this generalise to other conditioning attributes (speaker identity, language, prosody), and is there a unified theoretical account of why early steps carry disproportionate semantic weight?"
  - "GAN vocoders retain a substantial real-time-factor advantage over flow-matching vocoders (PeriodWave, WaveFM) despite matching or exceeding them on perceptual quality and pitch accuracy. Whether the acceleration techniques already validated at the acoustic-model level (distillation, learned priors, Bespoke Solvers) close this gap for raw-waveform flow matching specifically is untested."
  - "Distillation-based acceleration (DMOSpeech 2) disproportionately reduces prosodic diversity relative to spectral quality. Does this diversity cost generalise across all distillation mechanisms tracked in the fm_acceleration family (DMD, PeRFlow, consistency distillation, CFG-conditioned distillation), or is it specific to DMD-style objectives?"
  - "Classifier-free guidance's transfer from diffusion to flow-matching TTS was treated as strongly_supported through mid-2025, but a subsequent paper (2509.19668) reports that naive CFG strategies from image generation do not transfer directly and require separated-condition, time-varying scheduling, with effectiveness dependent on the underlying text-representation architecture. Is this a genuine limitation of CFG-for-FM-TTS specific to certain architectures or languages, or does it reflect a broader gap between how CFG was validated (mostly English, mostly one architecture family) and how it is now being deployed?"
  - "A new architectural pattern (continuous_ar_fm_head: AR generation of continuous representations with a flow-matching or diffusion output head, rather than a separate discrete-token acoustic decoder) has emerged across four independent 2025 papers. Is this a durable third branch alongside pure_fm and ar_fm_hybrid, or will it be absorbed into one of the existing patterns as the field consolidates?"
  - "Flow matching applied to auxiliary, non-acoustic latent targets (prosody latents, stochastic prosody predictors, text-conditioned speaker embeddings) has now appeared in three independent papers. Would combining this auxiliary-latent pattern with a fully FM-native acoustic pipeline (rather than the conventional non-FM decoders used in all three supporting papers) compound the benefits?"

trend_notes:
  - "Flow matching has displaced diffusion as the dominant continuous-output generative backbone in TTS and VC since 2023, with adoption spanning both pure FM architectures (E2 TTS, F5-TTS) and hybrid AR+FM pipelines (CosyVoice, Vevo)."
  - "From 2024 onward, the predominant architectural pattern is the AR-FM hybrid: an autoregressive LM generates semantic tokens, and a flow-matching model decodes them to mel spectrograms. As of this update (97 papers through Q3 2025), the ar_fm_hybrid family accounts for 23 of 97 papers in this corpus, and the pure_fm family has grown to 44 of 97 as flow matching has been applied to an increasingly wide range of control, robustness, and efficiency problems beyond its original mel-spectrogram TTS core. Several of the most recent hybrid papers (CosyVoice 3, GOAT-SLM, SemAlignVC, Marco-Voice) continue to leave the flow-matching stage itself largely unchanged and direct their contributions at the AR/tokenizer stage or at richer emotion/style conditioning of the AR-FM interface instead, reinforcing the earlier observation that the FM component of the hybrid pattern may be architecturally stabilising."
  - "Inference acceleration for flow-matching speech models has become one of the most active subfields in this concept, now spanning at least eight distinct mechanisms across TTS and VC: learned ODE solvers, flow distillation (DMD, DMD2, PeRFlow), consistency distillation, shortcut self-consistency training, learned priors, CFG-strength-conditioned guided distillation, non-uniform step scheduling, adversarial post-training, and training-free activation/attention caching. By Q3 2025, acceleration evidence has moved decisively beyond mel-spectrogram TTS into voice conversion (R-VC, Shortcut Models for VC) and streaming/training-free DiT acceleration (two independent caching papers), with no single mechanism established as dominant."
  - "Post-training alignment and fine-tuning of flow-matching models continued to diversify through mid-2025: beyond DPO-FM's velocity-space formulation and CosyVoice 2/3's differentiable ASR reward optimisation, F5R-TTS demonstrates GRPO-based RL alignment on a pure (non-hybrid) flow-matching backbone via Gaussian output reparameterization, and DMOSpeech 2 applies GRPO specifically to the duration-prediction subcomponent rather than the full generator."
  - "The mel-spectrogram bottleneck — sequence length scaling and speaker similarity ceiling — is increasingly identified as a limitation of pure FM-TTS architectures relative to codec-token-based systems, suggesting a potential shift toward codec-native FM pipelines as the dominant paradigm. A new continuous_ar_fm_head family (four Q3 2025 papers) represents one concrete response to this bottleneck, replacing discrete codec tokens or the two-stage AR+FM interface with continuous per-token or per-block flow-matching/diffusion heads directly inside the autoregressive model."
  - "As of mid-2025, flow matching has expanded well beyond mel-spectrogram acoustic modeling into new application domains: direct raw-waveform vocoding (PeriodWave, WaveFM), neural codec postfiltering (FlowDec), self-supervised prosody-latent generation (ProsodyFlow), joint speech-plus-environment synthesis (UmbraTTS), and frozen-backbone adapter-based control (TTS-CtrlNet's ControlNet adaptation for time-varying emotion). By Q3 2025, several of these have gained independent confirmation from additional Q3 2025 papers (e.g. joint codec quantization-reconstruction training, streaming causal-cache FM vocoding, semantic-regularized VAE latents, text-conditioned speaker-embedding generation via flow matching), while others (discrete-space flow matching, discrete-time diffusion/FM unification, FM-based speaker unlearning) remain single-paper findings flagged as emerging clusters pending independent replication."
  - "A notable reversal emerged in Q3 2025: the previously strongly_supported claim that CFG transfers cleanly from diffusion to flow-matching TTS was contested by evidence that naive CFG strategies require architecture- and language-dependent tuning to be effective for zero-shot speaker similarity, the first status downgrade of a strongly_supported cluster in this concept's history."
