        confidence: high
        relevance: high
      - claim_id: adma_training_acceleration_not_naturalness
        role: complicates
        claim: "Training-time alignment acceleration for diffusion TTS primarily improves text intelligibility and speaker similarity rather than overall speech naturalness, as measured by automatic MOS prediction."
