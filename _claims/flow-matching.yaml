        source: "§4.1, Table 1"
        evidence: "Speaker classification accuracy on LibriHeavy using EnCodec reaches 96.7%, HuBERT layer 9 reaches 71.7%, and the paper's own BEST-RQ tokenizer reaches 82.05%, all far above chance."
        confidence: high
        relevance: low
