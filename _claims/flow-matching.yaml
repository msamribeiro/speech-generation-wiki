        source: "§5.1, Table 1"
        evidence: "LLaMA-Omni2 achieves UTMOS 4.19-4.22 across model sizes, substantially above the original LLaMA-Omni's NAR CTC-based decoder (UTMOS 3.67), while maintaining latency around 582ms."
        confidence: high
        relevance: low
      - claim_id: llamaomni2_gate_fusion_improves_consistency
        role: supports
        claim: "A gate fusion mechanism that adaptively blends LLM hidden states with text token embeddings as input to the TTS language model improves both instruction following quality and text-speech consistency over simpler additive fusion."
        source: "§5.2, Table 2"
        evidence: "Ablations in Table 2 confirm the gate fusion module's contribution to both ChatGPT Score and ASR-WER relative to additive-fusion baselines."
        confidence: medium
        relevance: low
      - claim_id: llamaomni2_streaming_pretraining_critical
        role: supports
        claim: "Streaming TTS pretraining on speech dialogue data is critical for quality: initializing from a text-only pretrained model degrades performance substantially, and training from scratch fails to converge."
        source: "§5.2, Table 3"
        evidence: "Table 3 ablations show that initializing M_TTS from a text-only checkpoint or training it from scratch both substantially underperform initializing from Qwen2.5-0.5B with the described two-stage recipe."
        confidence: high
        relevance: low
      - claim_id: llamaomni2_multiturn_data_outperforms_singleturn
        role: supports
        claim: "Multi-turn dialogue training data consistently outperforms single-turn data of the same total size for modular speech language models across spoken QA and instruction-following benchmarks."
        source: "§5.3, Table 5"
        evidence: "Table 5 shows multi-turn InstructS2S-200K training data yields higher scores than a single-turn dataset of equal size across the evaluated benchmarks."
        confidence: medium
        relevance: low
      - claim_id: llamaomni2_s2t_s2s_gap_indicator
        role: supports
        claim: "The S2T-to-S2S accuracy gap in spoken question answering is a meaningful indicator of speech generation quality, and autoregressive TTS decoders reduce this gap relative to non-autoregressive alternatives."
        source: "§5.1, Table 1"
        evidence: "LLaMA-Omni2-7B reduces the S2T-to-S2S accuracy gap to 3.2 points on Web Questions, compared to 16.3 for GLM-4-Voice and 9.7 for the original LLaMA-Omni."
