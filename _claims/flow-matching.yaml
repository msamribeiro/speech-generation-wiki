        source: "§4.3, Table 4"
        evidence: "Adding F5-TTS synthetic data alongside reference audio reduces WER by 44.6% for low-severity speakers but increases WER by 5.7% and 7.7% for mid- and high-severity speakers respectively."
        confidence: medium
