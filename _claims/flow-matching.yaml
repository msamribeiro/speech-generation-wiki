  - id: "iclr-2025-uxDFlPGRLX"
    entry_date: 2026-07-15
    year: 2025
    venue: ICLR
    task: [codec]
    architecture: [flow-matching, GAN]
    relevance: high
    evidence_role:
      - core_evidence
      - architecture_variant
    current_role: active_evidence
    method_family: []
    claims:
      - claim_id: flowdec_fm_postfilter_matches_gan_quality
        role: supports
        claim: "A flow matching-based stochastic postfilter conditioned on a deterministic codec's decoder output can replace adversarial training while achieving comparable subjective quality to a GAN-based codec."
        source: "§5.2, Figure 6"
        evidence: "MUSHRA listening tests with 11 expert listeners show no significant difference between the FlowDec postfilter and DAC (GAN-based codec) score distributions at matched bitrates of 4.5 and 7.5 kbit/s."
        confidence: high
        relevance: high
      - claim_id: flowdec_coupled_prior_removes_ot_solver_need
        role: supports
        claim: "Coupling the flow matching source distribution to the conditioning signal, rather than sampling it independently, removes the need for minibatch optimal-transport solvers and improves postfilter sample quality at low inference budgets."
        source: "§5.1, Table 4"
        evidence: "At NFE=6, the coupled formulation achieves FAD×100 of 1.62 versus 145.3 for a diffusion-based postfilter (ScoreDec) and approximately 29 for a constant-variance flow matching ablation, on the same codec and test set."
        confidence: high
        relevance: high
      - claim_id: flowdec_fad_distortion_tradeoff
        role: complicates
        claim: "Improving perceptual distance metrics (FAD) via generative postfiltering trades off against intrusive distortion metrics relative to discriminator-trained codecs."
        source: "§5.1, Figure 4, Figure 5"
        evidence: "The retrained non-adversarial codec generally outperforms the flow-matching postfilter on SI-SDR and fwSSNR even though the postfilter achieves better FAD, consistent with a perception-distortion tradeoff."
        confidence: high
        relevance: medium
      - claim_id: flowdec_vanilla_fm_prior_convergence_failure
        role: complicates
        claim: "Generative postfilters trained with vanilla score- or flow-matching formulations using a fixed-variance or independent prior can fail to converge to the target signal or require expensive multi-step inference to reach acceptable quality."
        source: "§5.1, Table 4"
        evidence: "The diffusion-based ScoreDec postfilter produces unusable quality at NFE=6 (FAD×100 = 145.3, SI-SDR = -27.23), only becoming competitive at roughly 50 evaluations; a constant-variance flow matching variant also underperforms the coupled formulation."
        confidence: high
        relevance: medium
    limitations:
      - "The proposed codec, like the DAC baseline it builds on, uses a noncausal architecture and is not streaming-capable."
      - "The postfilter and underlying codec are trained in two separate stages; joint training is left unexplored due to potential instability."
    caveats:
      - "This paper extends the CFM framework from 2210.02747 to the audio codec postfiltering setting, introducing a novel coupled-source formulation rather than applying the original OT-CFM path directly."
      - "The application domain (postfiltering a codec's output) is narrower than full generative TTS or VC; findings about the coupled-prior formulation may not generalise to full mel-spectrogram or waveform generation from scratch."

