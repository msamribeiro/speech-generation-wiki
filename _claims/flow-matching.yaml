        source: "§3.4, Table 1"
        evidence: "Removing full-reference in-context conditioning and using only the timbre vector drops Seed-VC's SECS from 0.8676 to 0.7948 on the flow-matching diffusion transformer backbone."
        confidence: high
        relevance: medium
      - claim_id: seedvc_disentanglement_mitigates_tradeoff
        role: supports
        claim: "The speaker similarity versus intelligibility trade-off that limits bottleneck-based zero-shot VC approaches can be mitigated by separating timbre perturbation from content feature extraction."
        source: "§1, §3.3.1"
        evidence: "Seed-VC's timbre-shifter separates timbre perturbation (training-time augmentation) from content feature extraction (Whisper encoder), avoiding the aggressive bottlenecking that trades intelligibility for disentanglement in prior VC systems."
        confidence: medium
        relevance: low
      - claim_id: seedvc_f0_conditioning_extends_to_singing
        role: supports
        claim: "F0 conditioning enables diffusion transformer VC models to extend to zero-shot singing voice conversion with competitive pitch preservation and improved lyric intelligibility over per-speaker trained baselines."
        source: "§3.5, Table 2"
        evidence: "The singing variant of Seed-VC, adding quantised F0 conditioning to the flow-matching-objective diffusion transformer, outperforms RVCv2 on SECS (0.7405 vs. 0.7264) and CER (19.70% vs. 28.46%) despite RVCv2 requiring per-speaker training."
        confidence: high
