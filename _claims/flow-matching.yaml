        role: supports
        claim: "Reparameterizing the flow matching objective to directly predict clean output, rather than random derivatives, enables auxiliary perceptual losses (STFT, mel) and periodic activation functions that cannot otherwise be applied."
        source: "§3.2, Table 4"
        evidence: "Without the reparameterization, SMOS drops to 3.88 because auxiliary STFT and mel losses and Snake-beta periodic activations cannot be applied to a model predicting random instantaneous derivatives."
        confidence: high
        relevance: high
      - claim_id: wavefm_consistency_distillation_near_gan_speed
        role: supports
        claim: "Consistency distillation can be adapted to flow matching vocoders with dynamic priors, enabling single-step inference at near-GAN speeds without adversarial training."
        source: "§3.3, Table 3"
        evidence: "WaveFM-1 Step (distilled) achieves SMOS 4.11 and runs at 303x real-time, essentially matching HiFi-GAN V1's 325x real-time speed, using only ~25k additional distillation steps on top of the base 1M training steps."
        confidence: high
        relevance: high
      - claim_id: wavefm_aux_losses_improve_ood_generalisation
