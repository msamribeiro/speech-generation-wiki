        role: supports
        claim: "Joint generative modelling of speech and environmental audio produces more naturally integrated output than post-hoc mixing of separately generated speech with background sounds."
        source: "§4.2"
        evidence: "A/B tests with 20+ raters per sample show 87.89% preference for UmbraTTS's joint flow-matching generation over F5-TTS with post-hoc background mixing across 30 AudioSet samples."
        confidence: high
        relevance: low
      - claim_id: umbratts_selfsupervised_extraction_sufficient
        role: supports
        claim: "Self-supervised extraction of speech and background audio from unlabeled mixed recordings is sufficient to train environmentally conditioned TTS to state-of-the-art performance."
        source: "§3, §4.1, Table 1"
        evidence: "UmbraTTS uses VAD-based silence extraction and learned source separation on AudioSet to construct training triplets without manual annotation, achieving best WER and FAD among baselines on AudioCaps."
        confidence: high
        relevance: low
      - claim_id: umbratts_fm_beats_diffusion_envaware
        role: supports
        claim: "Flow matching outperforms diffusion-based architectures in environmentally aware speech synthesis on both automatic and human evaluation metrics."
        source: "§4.1, §4.2, Tables 1-3"
        evidence: "UmbraTTS (CFM-based) achieves WER 6.89% and FAD 4.14 versus VoiceDiT (diffusion DiT) at 7.09%/4.60 and VoiceLDM (diffusion LDM) at 10.39%/5.56 on AudioCaps, with 78.54-81.91% human preference over VoiceLDM."
        confidence: high
        relevance: high
      - claim_id: umbratts_ser_scalar_needed_for_balance_control
        role: complicates
        claim: "Controlling speech-to-environment balance in jointly generated audio scenes requires an explicit scalar conditioning parameter; standard text and speaker conditioning are insufficient for this degree of output control."
        source: "§3, §4.2"
        evidence: "UmbraTTS introduces a dedicated speech-to-environment ratio (SER) signal injected via adaLN-zero; a controlled listening test confirms 96.6% of participants correctly distinguish the intended background volume direction."
        confidence: high
        relevance: low
    limitations:
      - "The evaluation protocol is borrowed from VoiceLDM and covers only AudioCaps and MusicCaps test subsets."
      - "The vocoder used to convert mel spectrograms to waveforms is not specified, and model size and training data volume are not reported."
    caveats:
      - "UmbraTTS is built directly on the F5-TTS CFM/DiT framework with an added environmental conditioning pathway; the FM-vs-diffusion comparison (against VoiceDiT and VoiceLDM) provides new-domain evidence supporting the existing fm_surpasses_diffusion_speed_quality cluster."
      - "This is the first paper in this corpus to apply flow-matching TTS to joint speech-plus-background-audio generation rather than clean speech alone."

