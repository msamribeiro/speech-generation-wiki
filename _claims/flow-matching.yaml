      - claim_id: prosodyflow_wavlm_beats_pitch_energy_predictors
        role: supports
        claim: "Self-supervised speech representations (WavLM) provide a more effective prosody conditioning signal for TTS than conventional pitch and energy predictors, as shown by ablation."
        source: "§3.4, Table 3"
        evidence: "Removing the WavLM prosody encoder and reverting to a reference encoder or explicit pitch/energy prediction causes the largest CMOS drops (-0.27 and -0.18) in the paper's component ablation."
        confidence: high
        relevance: low
      - claim_id: prosodyflow_fm_matches_diffusion_lower_cost
        role: supports
        claim: "Flow matching in a prosody latent space achieves comparable quality to diffusion-based prosody modeling with substantially lower computational cost."
        source: "§3.4, Table 3"
        evidence: "Replacing flow matching with a diffusion objective in the prosody latent space causes only a -0.04 CMOS change (essentially unchanged quality) while requiring markedly more computation."
        confidence: medium
        relevance: high
      - claim_id: prosodyflow_low_nfe_sufficient
        role: supports
        claim: "A small number of flow matching function evaluations (n=1) is sufficient to match or exceed legacy TTS baselines on MOS and WER, confirming the sample efficiency of flow matching for prosody."
        source: "§3.3, Table 2"
