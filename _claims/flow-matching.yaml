  - id: "interspeech-2025-0854"
    published_date: "2025-08-17"
    entry_date: "2026-07-19"
    year: 2025
    venue: Interspeech
    task: [TTS]
    architecture: [GAN, flow-matching, transformer-enc-dec]
    relevance: medium
    evidence_role:
      - core_evidence
    current_role: minor
    method_family: [fm_vocoder]
    claims:
      - claim_id: postproc_lowresource_artifact_underrepresentation
        role: supports
        claim: "Generative postprocessing models for spectrogram enhancement lose effectiveness in low-resource settings because the acoustic model produces stronger artifacts that are underrepresented in the available training pairs."
        source: "§1, §2.1"
        evidence: "The paper documents that low-resource acoustic models produce stronger oversmoothing artifacts than high-resource ones, while training pairs available to teach a postprocessor to correct them are far scarcer."
        confidence: high
        relevance: medium
      - claim_id: postproc_simulated_lowresource_pairs_help
        role: supports
        claim: "Simulating low-resource speaker conditions from subsampled high-resource data provides a viable source of artifact-realistic training pairs for spectrogram postprocessors, yielding consistent naturalness improvements across both GAN and flow-matching architectures."
        source: "§2.2, §4, Table 2"
        evidence: "Both GAN (MUSHRA 74.8 vs. 72.3 standard) and CFM (MUSHRA 79.8 vs. 79.0 standard) postprocessors improve with the proposed subsampled-data generation strategy over the standard training recipe."
        confidence: high
        relevance: high
      - claim_id: postproc_fm_higher_naturalness_smaller_gain
        role: supports
        claim: "Flow-matching postprocessors achieve higher absolute naturalness than GAN-based postprocessors on low-resource speakers, but show smaller and statistically insignificant gains from the proposed data generation strategy compared to GAN-based postprocessors."
        source: "§4, Table 2"
        evidence: "CFM Proposed (MUSHRA 79.8) outperforms GAN Proposed (74.8) in absolute terms, but the CFM gain over its own standard-training baseline (79.8 vs. 79.0) is not statistically significant, unlike the GAN's significant gain (Wilcoxon p ≤ 0.01)."
        confidence: high
        relevance: high
      - claim_id: postproc_noise_augmentation_no_naturalness_gain
        role: complicates
        claim: "Noise augmentation of the acoustic model does not improve spectrogram naturalness when ground-truth prosody is used at evaluation, as its primary benefit is prosody prediction rather than spectrogram texture quality."
        source: "§4, Table 2"
        evidence: "The noise-augmentation baseline (MUSHRA 45.9) underperforms both the plain ForwardTacotron baseline (50.9) and the proposed postprocessing systems, because ground-truth prosody features are supplied at evaluation, isolating spectrogram texture from prosody."
        confidence: medium
        relevance: low
      - claim_id: postproc_rbe_reveals_hidden_reference_limits
        role: complicates
        claim: "Multi-stimulus hidden-reference tests alone may be insufficient to detect when a TTS system exceeds vocoded ground-truth quality; ranking-by-elimination tests can reveal preferences for synthetic over reference conditions that MUSHRA-style scoring cannot capture."
        source: "§3.3, §4"
        evidence: "The CFM-proposed system was preferred over the vocoded reference in 26.6% of RBE rankings using Plackett-Luce analysis, a preference not evident from MUSHRA scores alone."
        confidence: medium
        relevance: low
    limitations:
      - "Evaluation uses ground-truth prosody at inference, so it is unclear how the flow-matching postprocessor performs in full end-to-end synthesis with predicted prosody."
