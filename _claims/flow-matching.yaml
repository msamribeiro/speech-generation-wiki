        source: "§ Semantic-to-Mel Module, Table 2"
        evidence: "Fusing T2S transformer hidden states (H_GPT) with semantic tokens as conditioning for the flow-matching S2M module is shown by ablation to reduce WER on emotionally expressive speech, preserving phonetic clarity when style is strong."
        confidence: medium
        relevance: high
      - claim_id: indextts2_three_stage_curriculum_essential
        role: supports
        claim: "A three-stage curriculum that separates base capability training from emotion-conditioner fine-tuning is essential for emotional expressiveness; removing it causes EMOS to collapse from 4.22 to 2.82."
        source: "§ Experiment Results — Emotional Performance, Table 2"
        evidence: "The ablation removing the three-stage training curriculum (base capability, emotional subset with GRL, full-dataset fine-tune) collapses EMOS from 4.22 to 2.82."
        confidence: high
        relevance: low
      - claim_id: indextts2_llm_distillation_emotion_routing
        role: supports
        claim: "Knowledge distillation from a large reasoning LLM into a small fine-tuned model provides a usable soft emotion routing interface for TTS that outperforms instruction-tuned baselines on naturalness and prosody."
        source: "§ Text-to-Emotion, Table 3/5"
        evidence: "The DeepSeek-R1-to-Qwen3-1.7B distilled Text-to-Emotion module outperforms CosyVoice2 on natural-language emotion control (SMOS 3.875 vs. 2.973)."
