    current_role: active_evidence
    method_family: [ar_fm_hybrid]
    claims:
      - claim_id: mooncast_spontaneous_script_equal_acoustic
        role: supports
        claim: "Spontaneous scripting from an LLM is roughly as important as the acoustic modeling choice for perceived spontaneity in long-form dialogue TTS."
        source: "§4.2.2, Table 3"
        evidence: "Removing spontaneous details from the ground-truth script drops spontaneity MOS from 4.16 to 3.21; this gap (0.95) is nearly as large as the gap between the proposed system (4.25) and the best baseline (3.85), confirming the script component contributes as much as the audio model."
        confidence: high
        relevance: low
      - claim_id: mooncast_full_sequence_interleaving_coherence
        role: supports
        claim: "Full-sequence interleaving of text and speech codes, extended to 40,000-token context windows with speaker-change tokens, enables coherent long-form zero-shot multi-speaker synthesis that turn-level concatenation cannot match."
        source: "§3.2.1, Tables 1–2"
        evidence: "MoonCast with full-sequence interleaving outperforms turn-level concatenation on coherence MOS (4.13 vs. 3.80 Chinese; 4.50 vs. 3.58 English) and spontaneity MOS; the difference is largest on English."
        confidence: high
        relevance: low
      - claim_id: mooncast_curriculum_codec_lm
        role: supports
        claim: "Curriculum learning, progressively exposing a codec LM to increasing dialogue complexity, is an effective strategy for developing long-context and spontaneous generation capability."
        source: "§3.2.1"
        evidence: "Training progresses from single-turn single-speaker TTS, through long-context two-speaker non-conversational audiobooks (up to 40,000 tokens), to long-context two-speaker conversational data; this staged approach enables coherent podcast-length generation."
        confidence: medium
        relevance: low
      - claim_id: mooncast_auto_sim_subjective_disagreement
        role: complicates
        claim: "Automatic speaker similarity metrics (cosine embedding similarity) can disagree with subjective speaker similarity ratings in long-form generation settings, particularly when the acoustic model attends to prosodic rather than purely timbral features."
        source: "§4.2.1"
        evidence: "MoonCast achieves SIM-O 0.53 on English vs. concatenation baseline 0.75, while subjective speaker similarity MOS is competitive (3.44 vs. 3.58); the gap between objective and subjective signals is large, suggesting SIM-O captures different qualities from human perception in this setting."
        confidence: high
        relevance: low
      - claim_id: mooncast_chunk_causal_fm_continuity
        role: supports
        claim: "Chunk-wise autoregressive decoding with a causal chunk mask provides a practical solution to the continuity and memory constraints of mel-spectrogram reconstruction from long semantic code sequences."
        source: "§3.2.2"
        evidence: "The 0.8B DiT-style flow-matching detokenizer processes 3-second chunks with causal chunk attention (each chunk attends to all previous), enabling inference over 10+ minute podcasts without loading the full sequence into memory."
        confidence: high
        relevance: high
    limitations:
      - "All evaluation is on a small internal test set (4 knowledge sources, 7 podcasts); results cannot be independently reproduced."
      - "SIM-O score on English (0.53 vs. 0.75 baseline) reveals unresolved speaker consistency challenges in long-context English generation."
    caveats:
      - "The flow-matching component (speech detokenizer) is a DiT-based model operating on semantic codes, following the design established by prior work (ARDiT for chunk-wise causal masking); MoonCast's contribution is the extension to the multi-speaker long-context setting."
      - "Training data (~515K hours) is entirely proprietary, restricting reproducibility and generalization assessment."

