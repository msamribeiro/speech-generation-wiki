    claims:
      - claim_id: ozspeech_learned_prior_single_step
        role: supports
        claim: "Replacing Gaussian noise with a learned prior as the starting point for flow matching reduces the number of required inference steps to one without needing a separate distillation stage."
        source: "§3.1, §3.3"
        evidence: "OZSpeech's OT-CFM Vector Field Estimator regresses from learned prior codes x_pr to data x_1 rather than from Gaussian noise; the prior time τ is learned implicitly, and the system achieves NFE=1 at inference without any distillation."
        confidence: high
        relevance: high
      - claim_id: ozspeech_otcfm_data_hungry
        role: supports
        claim: "Flow-matching TTS systems trained on traditional OT-CFM are data-hungry and fail to generalise when retrained on limited data, while neural codec-based systems remain effective with as few as 500 hours."
        source: "§4.2, Table 1"
        evidence: "F5-TTS (OT-CFM, 95K hours) achieves WER 0.24% on LibriSpeech test-clean; OZSpeech (learned-prior CFM, 500 hours) achieves WER 0.05%, demonstrating that the learned prior reduces data requirements by ~190x."
        confidence: high
        relevance: high
      - claim_id: ozspeech_noisy_prompt_degradation
        role: supports
        claim: "Zero-shot TTS systems trained exclusively on clean prompts degrade substantially in intelligibility when given noisy reference audio, with autoregressive codec models being especially vulnerable."
        source: "§4.4, Table 4"
        evidence: "VALL-E reaches WER 93% at 0 dB SNR noisy prompts; OZSpeech maintains WER 0.05–0.06 across all SNR levels, attributed to the prior's learned distribution being less sensitive to reference audio quality."
        confidence: high
        relevance: medium
      - claim_id: ozspeech_factorised_codec_tradeoff
        role: supports
        claim: "Factorised codec representations that balance acoustic and semantic attributes trade perceptual naturalness (UTMOS) for intelligibility (WER) relative to codecs that prioritise acoustic fidelity."
        source: "§4.2"
        evidence: "OZSpeech using FACodec achieves WER 0.05% but UTMOS 3.15, compared to F5-TTS's WER 0.24% but UTMOS 3.76; the codec design choice explicitly trades naturalness for intelligibility and speed."
        confidence: high
        relevance: low
      - claim_id: ozspeech_noisy_finetuning_recovery
        role: supports
        claim: "Fine-tuning a zero-shot TTS model on noise-augmented prompts preserves intelligibility and substantially recovers acoustic quality metrics under low-SNR conditions."
        source: "§4.4, Table 4"
        evidence: "Fine-tuning OZSpeech with noisy prompts at various SNR levels maintains WER at 0.05–0.06 across all SNR conditions while improving F0-RMSE and UTMOS relative to the no-fine-tuning baseline at low SNR."
        confidence: high
