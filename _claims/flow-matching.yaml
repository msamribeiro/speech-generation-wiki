    claims:
      - claim_id: aae_accent_improves_chatbot_reception
        role: supports
        claim: "Incorporating an acoustic accent that matches a user's linguistic community improves chatbot warmth, similarity, and engagement preference even when the underlying text remains in standard dialect."
        source: "§4.4.2, Figure 4"
        evidence: "In the Spoken Chatbot evaluation, the configuration pairing an African American accent with Standard American English dialect text outperforms the Standard American voice baseline across all evaluated dimensions, including warmth and similarity."
        confidence: medium
        relevance: low
      - claim_id: aae_text_high_intensity_caricature
        role: supports
        claim: "Text-based dialect generation at high intensity produces caricature-like representations that degrade perceived inoffensiveness and role appropriateness with speakers of that dialect."
        source: "§4.4.1, Figure 3"
        evidence: "High-AAE text chatbots receive the worst inoffensiveness scores among all nine AAE variants, which the paper attributes to excessive phonetic modification producing caricature-like output rather than authentic AAE."
        confidence: medium
        relevance: low
      - claim_id: aae_phonetic_dominance_semantic_sparsity
        role: supports
        claim: "Phonetic modification dominates LLM-generated AAE output, while semantic feature generation remains sparse across all tested models and intensity levels."
        source: "§4.3, Figure 2"
        evidence: "AAE feature tagging (91% accuracy on held-out test set) confirms AAE expression scales monotonically with prompt intensity, with phonetic features dominating and semantic features remaining sparse across the three LLMs tested (Llama3.1-70B, Claude-Sonnet-3.5, GPT-4o)."
        confidence: high
        relevance: low
      - claim_id: fm_tts_standard_dialect_bias_clarity
        role: complicates
        claim: "TTS models trained predominantly on standard-dialect data exhibit degraded speech clarity when reproducing minority accent features, limiting the fidelity of accent-conditioned spoken chatbots."
        source: "§5"
        evidence: "F5-TTS, used unmodified as the paper's TTS backbone, was trained predominantly on Standard American English data; the authors identify this as a likely cause of reduced speech clarity when reproducing AAE phonetics via reference-clip accent conditioning."
        confidence: medium
        relevance: medium
    limitations:
      - "Small evaluator pool (12 text, 8 spoken) from a single university demographic."
      - "F5-TTS was trained predominantly on SAE data; its ability to reproduce AAE phonetics authentically is limited, likely contributing to reduced speech clarity."
    caveats:
      - "F5-TTS (a flow-matching diffusion-transformer) is used entirely off-the-shelf as a deployed TTS backbone with a single reference clip; the paper develops no flow-matching methodology, and three of its four claims concern dialect/accent perception rather than flow-matching mechanics."

  - id: "2025.acl-long.790"
    published_date: "2025-07-27"
    entry_date: "2026-07-19"
    year: 2025
    venue: ACL
    task: [VC]
    architecture: [flow-matching]
    relevance: high
    evidence_role:
      - core_evidence
      - acceleration_evidence
    current_role: active_evidence
    method_family: [fm_acceleration]
    claims:
      - claim_id: rvc_shortcut_fm_two_step_matches_full
        role: supports
        claim: "Self-consistency training enables shortcut flow matching to match full-step quality in voice conversion with as few as two inference steps."
        source: "§4.2, Table 1"
        evidence: "R-VC at NFE=2 matches NFE=10 across all quality metrics (SECS 0.930 vs 0.931, UTMOS 4.1 vs 4.1, QMOS 4.03 vs 4.05, SMOS 4.11 vs 4.12) while reducing inference time by 2.83x; vanilla CFM degrades sharply below 10 steps."
        confidence: high
        relevance: high
      - claim_id: rvc_duration_model_improves_emotion_transfer
        role: supports
        claim: "Explicit rhythm modeling via a target-conditioned duration model substantially improves emotion style transfer in zero-shot VC."
        source: "§4.3, §4.5, Table 2, Table 4"
        evidence: "Removing the duration module from R-VC drops the emotion score from 0.59 to 0.425 on the ESD dataset, while baselines that preserve source rhythm score 0.395-0.489."
        confidence: high
        relevance: medium
      - claim_id: rvc_fine_grained_duration_instability
        role: complicates
        claim: "Fine-grained duration prediction in non-autoregressive models introduces instability in voice conversion that coarser duration strategies do not fully resolve."
        source: "§7, Table 4"
        evidence: "R-VC's masked transformer duration model produces occasional over-extended pronunciations; sentence-level duration as a fallback yields worse WER (9.86 vs 6.95) and UTMOS (3.58 vs 3.85), offering no stability improvement in practice."
        confidence: medium
        relevance: low
      - claim_id: rvc_perturbation_reduces_leakage
        role: supports
        claim: "Data perturbation before discrete content tokenisation reduces timbre leakage more effectively than relying on the self-supervised representation alone."
        source: "§4.5, Table 4"
        evidence: "Removing pitch perturbation before HuBERT token extraction degrades WER from 3.51 to 7.28 and speaker similarity from 0.930 to 0.869, confirming that perturbation actively suppresses content-irrelevant speaker information."
        confidence: high
        relevance: low
    limitations:
      - "The system is evaluated only on English (MLS, LibriSpeech, ESD) and English Seed-TTS subsets; generalisation to cross-lingual or multilingual VC is untested."
      - "The masked transformer duration model has a known instability causing over-extended pronunciations; sentence-level duration as an alternative proved worse in both stability and quality."
    caveats:
      - "This is the first application in the corpus of shortcut-model self-consistency training (from image generation) to a DiT-based flow-matching TTS/VC decoder, directly relevant to the flow-matching acceleration literature."

  - id: "2025.acl-long.87"
    published_date: "2025-07-27"
    entry_date: "2026-07-19"
    year: 2025
    venue: ACL
    task: [VC]
    architecture: [flow-matching]
    relevance: medium
    evidence_role:
      - acceleration_evidence
    current_role: minor
    method_family: [pure_fm]
    claims:
      - claim_id: takinvc_hybrid_content_fusion_reduces_leakage
        role: supports
        claim: "Combining ASR-derived phonetic features and quantized self-supervised representations via adaptive fusion reduces timbre leakage while preserving paralinguistic content in zero-shot voice conversion."
        source: "§5.3, Table 3"
        evidence: "Removing the PPG branch (WavLM-only) causes SMOS to drop from 4.11 to 3.07 and SECS from 0.71 to 0.45 on LibriTTS, indicating that SSL features alone carry substantial timbre leakage."
        confidence: high
        relevance: low
      - claim_id: takinvc_fm_faster_than_diffusion
        role: supports
        claim: "Flow matching provides faster inference than diffusion-based voice conversion systems without sacrificing speaker similarity or naturalness."
        source: "§5.1, Table 1"
        evidence: "Takin-VC achieves RTF 0.154, lower than DiffVC (0.294), NS2VC (0.347), and SeedVC (0.341), while simultaneously outperforming these baselines on NMOS, SMOS, and SECS."
        confidence: high
        relevance: high
      - claim_id: takinvc_global_embeddings_insufficient
        role: complicates
        claim: "Global, time-invariant speaker embeddings are insufficient for robust timbre modeling in expressive zero-shot voice conversion."
        source: "§5.3, Table 4"
        evidence: "Removing the context-aware cross-attention module drops SMOS from 4.11 to 3.61 and SECS from 0.71 to 0.58, while the memory-augmented module removal drops SECS to 0.52."
        confidence: high
        relevance: low
      - claim_id: takinvc_cross_gender_similarity_gap
        role: complicates
        claim: "Cross-gender voice conversion consistently yields lower speaker similarity than same-gender conversion even in well-trained systems."
        source: "§5.2, Table 2"
        evidence: "On the large-scale multilingual dataset, same-gender pairs (F2F: SECS 0.74; M2M: 0.73) outperform cross-gender pairs (F2M: 0.71; M2F: 0.70) in speaker embedding cosine similarity."
        confidence: high
        relevance: low
      - claim_id: takinvc_quantized_ssl_reduces_leakage
        role: refines
        claim: "Quantizing self-supervised speech features before content encoding reduces timbre leakage more effectively than using continuous SSL representations directly."
        source: "§3.2, §5.3, Table 3"
        evidence: "The RVQ quantizer (codebook size 8,200) applied to WavLM features is the key mechanism for timbre suppression; ablation with continuous WavLM-only features shows SECS drops to 0.45 compared to 0.71 for the full model."
        confidence: high
        relevance: low
    limitations:
      - "All large-scale training data (500k hours) and the 100-speaker evaluation set are proprietary and not publicly available."
      - "No targeted evaluation of paralinguistic preservation (breathing, crying, emotion transfer), despite this being listed as a primary contribution."
    caveats:
      - "The OT-CFM decoder is adopted unmodified from prior flow-matching practice; the paper's own novelty assessment states this architectural choice 'is not novel in this paper.' Only one claim (RTF comparison against diffusion baselines) speaks directly to flow-matching's field-level properties."

