        role: supports
        claim: "Chromagram-based prosody tokenization provides a notation-free, octave-invariant representation that bridges the F0 distribution gap between speech and singing, enabling unified prosody control without expert MIDI annotations."
        source: "§III-A"
        evidence: "The prosody tokenizer (6.25 Hz, codebook 512) encodes octave-free, notation-free chromagram features that condition both the AR content-style stage and, indirectly via those tokens, the downstream flow-matching acoustic stage."
        confidence: medium
        relevance: low
      - claim_id: vevo2_llm_init_ar_low_framerate_competitive
        role: supports
        claim: "Autoregressive models initialized from LLM checkpoints can achieve competitive zero-shot TTS quality at low codec frame rates (12.5 Hz) when paired with strong post-training, partially compensating for the sequence granularity disadvantage relative to higher frame-rate systems."
        source: "§V-A, Table VII"
        evidence: "Post-trained Vevo2 achieves WER 3.64/2.94 (en/zh) on SeedTTS, competitive with CosyVoice 2 and MaskGCT despite its content-style tokenizer's lower frame rate (12.5 Hz vs. 25-50 Hz), with the flow-matching stage decoding these tokens to mel spectrograms."
        confidence: medium
        relevance: low
      - claim_id: vevo2_single_objective_alignment_degrades_others
        role: complicates
        claim: "Single-objective preference alignment in multi-capability speech models degrades complementary objectives; joint multi-objective optimization is necessary to avoid quality regressions on non-targeted capabilities."
        source: "§V-F, Figure 5"
        evidence: "Intelligibility-only GRPO post-training drops melody accuracy from 65% to 50%, whereas joint intelligibility-plus-prosody-similarity optimization achieves gains on both objectives simultaneously."
        confidence: medium
        relevance: low
      - claim_id: vevo2_pitch_shift_sim_intelligibility_tradeoff
        role: complicates
        claim: "Inference-time pitch shift applied to prosody tokens improves speaker similarity in voice and singing conversion tasks, at the cost of a minor intelligibility degradation due to train-inference distribution mismatch."
        source: "§V-E, Table VI"
        evidence: "Pitch-shifted prosody tokens are out-of-distribution for the flow-matching acoustic stage's training data, causing a slight WER increase alongside the speaker-similarity gain."
        confidence: medium
