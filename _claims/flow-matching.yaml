        source: "§1, §3.1, Table 1"
        evidence: "RapFlow-TTS builds consistency constraints on Matcha-TTS's straight flow-matching trajectories and at 2 NFE (MOS 3.89) exceeds Comospeech's diffusion-based consistency distillation at 2 NFE (MOS 3.19) on LJSpeech."
        confidence: high
        relevance: high
      - claim_id: rapflow_adversarial_learning_most_impactful
        role: supports
        claim: "Adversarial learning at the mel-spectrogram level is the single most impactful technique for improving few-step consistency TTS naturalness, outperforming all other regularisation methods individually."
        source: "§3.2, §4.3, Table 2"
        evidence: "Ablation confirms adversarial learning yields the largest NISQA improvement (3.78 to 4.19 on LJSpeech) among all improved techniques tested (encoder freeze, shared dropout, Huber loss, delta scheduling)."
        confidence: high
        relevance: high
      - claim_id: rapflow_consistency_models_dont_benefit_from_more_steps
        role: supports
        claim: "Consistency models for TTS do not benefit from increasing the number of inference steps beyond what they were trained for, and can degrade with more steps."
        source: "§4.3, Table 2"
        evidence: "The paper documents that more NFE steps do not consistently improve quality for RapFlow-TTS's consistency-trained model, a characteristic behaviour distinct from standard flow-matching models."
        confidence: high
        relevance: high
      - claim_id: rapflow_two_stage_recipe_enables_2step_realtime
        role: supports
        claim: "Combining a straight flow pre-training stage with consistency fine-tuning and multi-segment objectives enables 2-step TTS at real-time factors comparable to non-autoregressive models such as FastSpeech2."
        source: "§3.1, §4.2, Table 1"
        evidence: "RapFlow-TTS+ achieves RTF 0.031 at 2 NFE, matching FastSpeech2's speed, while reaching MOS 4.01 versus FastSpeech2's 3.35 on LJSpeech."
        confidence: high
