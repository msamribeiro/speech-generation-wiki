        source: "§4.1, §4.2, Table 1, Table 2"
        evidence: "Replacing NeuCoSVC's GAN-based FastSVC decoder with a conditional flow-matching module (ConvNeXtV2 backbone, rectified-flow objective) improves MCD from 8.634 to 7.220 and MOS-Naturalness from 3.47 to 3.80 on OpenSinger, with the ablation confirming the improvement holds even without the paper's other proposed modules."
