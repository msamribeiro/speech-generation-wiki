        confidence: medium
        relevance: medium
      - claim_id: periodwave_streaming_codec_decoding
        role: supports
        claim: "Flow-matching vocoders can decode neural codec tokens with streaming generation and minimal quality degradation."
        source: "§5, Table 10, Table 11"
        evidence: "PeriodWave trained for parallel generation from Mimi (Q=8) tokens achieves CER 2.5% versus the Mimi decoder's 3.07%; streaming with single-token delay and 2-step sampling maintains comparable quality."
        confidence: high
