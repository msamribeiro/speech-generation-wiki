        source: "§3.2, Table 1; §3.5, Table 3"
        evidence: "MiniMax-Speech zero-shot mode achieves WER 0.83% (zh) / 1.65% (en) versus higher WER in one-shot mode, while one-shot SIM (0.799/0.738) exceeds zero-shot SIM (0.783/0.692)."
        confidence: high
        relevance: low
      - claim_id: minimaxspeech_flowvae_improves_reconstruction_and_sim
        role: supports
        claim: "Augmenting a VAE with a normalizing flow on the latent space (Flow-VAE) improves both waveform reconstruction quality and downstream TTS speaker similarity over a standard VAE with the same architecture."
        source: "§3.7, Tables 5-6"
        evidence: "Flow-VAE improves resynthesis quality (NB-PESQ 4.34 vs. 4.27, WB-PESQ 4.30 vs. 4.20) and downstream TTS SIM scores relative to a standard VAE, by inserting a normalizing flow between the encoder posterior and the standard normal prior."
        confidence: high
        relevance: high
      - claim_id: minimaxspeech_speaker_encoder_supports_crosslingual
        role: supports
        claim: "Speaker encoder representations trained without text dependencies support cross-lingual synthesis with high intelligibility, outperforming prompt-based systems that require transcribed reference audio in cross-lingual scenarios."
        source: "§3.5, Table 3"
        evidence: "Because the speaker encoder does not require a transcribed reference, MiniMax-Speech avoids the cross-lingual degradation seen in systems requiring paired text-audio prompts in the source language."
        confidence: medium
        relevance: low
      - claim_id: minimaxspeech_disentangled_embedding_enables_pvc
        role: supports
        claim: "Disentangled speaker embeddings from a task-specific encoder enable parameter-efficient per-speaker adaptation by fine-tuning only the speaker embedding vector, preserving base model generalization."
        source: "§4.3"
        evidence: "The professional voice cloning (PVC) extension fine-tunes only the speaker embedding vector for a target speaker while keeping the AR Transformer frozen, leveraging the disentangled representation from the jointly-trained encoder."
        confidence: medium
        relevance: low
    limitations:
      - "The training dataset is proprietary and the model size is not reported, making independent replication impossible."
      - "WER metrics for several tested languages (Cantonese, French, Hindi) remain substantially higher than for well-resourced languages."
    caveats:
      - "The Flow-VAE decoder is the paper's clearest contribution to flow matching specifically: it augments a standard VAE with a normalizing flow to produce a richer latent target for the flow-matching prediction, distinct from the mel-spectrogram target used by most pure_fm systems in this corpus."
      - "Most of the paper's claims concern the jointly-trained speaker encoder and zero-shot/one-shot distinction, which are AR-model-level contributions largely orthogonal to the flow-matching decoder."

  - id: "2505.17589"
