  - id: "2207.12598"
    published_date: "2022-07-26"
    entry_date: 2026-06-24
    year: 2022
    venue: arXiv
    task: []
    architecture: [diffusion]
    relevance: low
    evidence_role:
      - historical_context
    current_role: historical_context
    method_family: [historical_guidance]
    claims:
      - claim_id: cfg_quality_diversity_tradeoff
        role: historical_context
        claim: "Diffusion models can trade sample fidelity for diversity at inference time by interpolating conditional and unconditional score estimates, without any externally trained classifier or discriminator."
        source: "§3.2"
        evidence: "Guided score estimate is formed as a linear combination of conditional and unconditional score estimates; w=0 recovers the unguided model, increasing w sharpens the conditional distribution."
        confidence: high
        relevance: medium
      - claim_id: cfg_joint_training_sufficient
        role: historical_context
        claim: "Jointly training a single model for both conditional and unconditional generation, via random conditioning dropout, is sufficient to recover the full quality-diversity trade-off of classifier guidance."
        source: "§3.2, §4.1"
        evidence: "Single U-Net trained with conditioning dropped at rate p_uncond=0.1-0.2 matches or exceeds separately trained classifier guidance on ImageNet FID."
        confidence: high
        relevance: medium
      - claim_id: cfg_uncond_fraction_sensitivity
        role: historical_context
        claim: "A small unconditional training fraction (p_uncond of 0.1 to 0.2) is sufficient for effective guidance; dedicating a larger fraction to unconditional training harms performance across the guidance sweep."
        source: "§4.2"
        evidence: "Ablation over p_uncond values shows 0.1 and 0.2 consistently outperform 0.5 across the full guidance sweep."
        confidence: high
        relevance: low
      - claim_id: cfg_double_forward_cost
        role: historical_context
        claim: "Classifier-free guidance requires two score-function evaluations per sampling step, making the per-step compute cost twice that of classifier-free unconditional sampling; fair comparisons with single-pass baselines must account for this."
        source: "§4.3"
        evidence: "At T=256, each CFG step requires two model evaluations; headline FID comparison holds only when evaluating at twice the inference compute budget of single-pass baselines."
        confidence: high
        relevance: low
      - claim_id: cfg_generative_guidance_principle
        role: historical_context
        claim: "The quality-diversity trade-off in conditional generative models is a general property accessible to pure generative formulations, not uniquely enabled by discriminative classifiers or adversarial components."
        source: "§5"
        evidence: "Implicit classifier interpretation shows guided score corresponds to Bayes-rule ratio of conditional to unconditional densities, achievable without any discriminative component."
        confidence: high
        relevance: medium
    limitations:
      - "All experiments are on class-conditional image generation (ImageNet); the paper makes no claims about speech or audio modalities."
      - "The guidance strength w is a manual hyperparameter with no principled selection criterion."
    caveats:
      - "CFG is adopted by flow-matching TTS systems (e.g. Voicebox, E2 TTS) as an analogous conditioning mechanism, but this paper predates flow matching and does not address it; the connection is indirect and established by downstream work."

  - id: "2210.02747"
    published_date: "2022-10-06"
    entry_date: 2026-06-24
    year: 2022
    venue: arXiv
    task: []
    architecture: [flow-matching]
    relevance: high
    evidence_role:
      - core_evidence
    current_role: foundational
    method_family: [pure_fm]
    claims:
      - claim_id: fm_simulation_free_cnf
        role: supports
        claim: "Simulation-free training of Continuous Normalizing Flows is achievable by regressing conditional vector fields rather than marginal vector fields, without any gradient bias."
        source: "§3.2, Theorem 2"
        evidence: "The Conditional Flow Matching (CFM) objective regresses per-sample conditional vector fields and is proven to yield identical gradients to the intractable marginal flow matching objective."
        confidence: high
        relevance: high
      - claim_id: fm_ot_straighter_trajectories
        role: supports
        claim: "Optimal Transport paths yield straighter generation trajectories than diffusion paths, enabling accurate sample generation with fewer ODE function evaluations."
        source: "§4.1, §6.2, Figure 7"
        evidence: "OT path sets mean and standard deviation to change linearly in time, producing straight-line particle trajectories; FM-OT achieves same numerical error threshold as diffusion at roughly 60% of NFEs on ImageNet-32."
        confidence: high
        relevance: high
      - claim_id: fm_objective_more_stable
        role: supports
        claim: "The Flow Matching objective provides more stable and faster-converging training than denoising score matching when applied to the same diffusion probability paths."
        source: "§6.1, Figure 5"
        evidence: "FM with diffusion paths (FM-Diffusion) consistently outperforms training diffusion models via score matching; sampling cost under FM remains constant across training while score matching shows variable NFE."
        confidence: high
        relevance: high
      - claim_id: fm_diffusion_special_case
        role: supports
        claim: "Diffusion-based generative models are a restricted special case of the broader flow matching framework, which encompasses a continuous family of probability paths with varying efficiency trade-offs."
        source: "§4.1"
        evidence: "Both Variance Exploding and Variance Preserving diffusion paths are recovered as special cases by specific choices of time-dependent mean and standard deviation in the Gaussian conditional path parametrization."
        confidence: high
        relevance: high
    limitations:
      - "Experiments are conducted on image generation only (CIFAR-10, ImageNet); speech and audio modalities are flagged as future applications but not explored."
      - "Theoretical analysis assumes Gaussian conditional paths throughout; extensions to non-Gaussian or manifold-constrained paths are not explored."
    caveats:
      - "The OT path is optimal at the conditional level (between paired Gaussians) but this optimality does not carry over to the marginal vector field; empirically reasonable but not theoretically guaranteed."
      - "Concurrent independent work (Liu et al. Rectified Flow; Albergo & Vanden-Eijnden Stochastic Interpolants) arrived at closely related objectives; relative priority is fuzzy."

  - id: "2312.15821"
    published_date: "2023-12-25"
    entry_date: 2026-06-24
    year: 2023
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching]
    relevance: high
    evidence_role:
      - core_evidence
      - acceleration_evidence
    current_role: influential
    method_family: [pure_fm]
    claims:
      - claim_id: audiobox_unified_model_surpasses_specialists
        role: supports
        claim: "A single generative model trained across speech, sound, and music modalities can match or surpass modality-specific models on dedicated benchmarks."
        source: "§5.4, §6.4, §7.5, Tables 1, 5, 13, 14"
        evidence: "Audiobox Sound achieves FAD 0.77 on AudioCaps, below AudioLDM2-Full (1.76); Audiobox Speech surpasses Voicebox on SPK-SIM across five evaluation sets."
        confidence: high
        relevance: medium
      - claim_id: audiobox_ssl_pretraining_generalisation
        role: supports
        claim: "Self-supervised pre-training on large-scale unlabeled audio substantially improves multi-domain style generalisation in subsequent supervised fine-tuning, with gains most pronounced on out-of-domain test sets."
        source: "§5.5, Table 3"
        evidence: "Audiobox Speech with SSL pre-training improves over Voicebox by 0.096 to 0.156 absolute SPK-SIM on CommonVoice, Switchboard, Expresso, and internal Accent datasets."
        confidence: high
        relevance: medium
      - claim_id: audiobox_clap_failure_speech_attributes
        role: supports
        claim: "General audio-language embedding models trained primarily on sound events fail to capture fine-grained speech attributes, rendering them unreliable for evaluating description-conditioned speech generation."
        source: "§7.3.1, Table 8"
        evidence: "Stock CLAP achieves recall@10 of 2.29 on speech-description retrieval; Joint-CLAP raises this to 22.01 and achieves Pearson correlation 0.727 with human REL scores vs. 0.028 for stock CLAP."
        confidence: high
        relevance: low
      - claim_id: fm_bespoke_solver_25x_speedup
        role: supports
        claim: "Flow-matching models admit post-training inference optimisation via learned ODE reparameterisation (Bespoke Solvers) that reduces function evaluations by 25x without measurable quality degradation."
        source: "§8, Table 15"
        evidence: "Bespoke Solver at 4 steps (8 NFE) matches midpoint solver at 32 steps (64 NFE) on speaker similarity and WER across five test sets."
        confidence: high
        relevance: high
      - claim_id: audiobox_trailing_silence_prompt
        role: supports
        claim: "Removing trailing silence from audio context prompts substantially improves speaker similarity in zero-shot TTS, particularly on datasets with long prompt silences."
        source: "§5.5, Table 3"
        evidence: "Ablation in Table 3 shows silence removal yields consistent SPK-SIM gains, especially on Expresso and Accent datasets where trailing silence is common."
        confidence: medium
        relevance: low
    limitations:
      - "Speech description data is primarily English; the description-based conditioning pipeline depends on LLM-generated captions from categorical attribute labels with limited granularity."
      - "The gap between dedicated Audiobox Sound (FAD 0.77) and unified Audiobox (FAD 1.10) suggests task-specific models still edge out unified models in their domain."
    caveats:
      - "The flow-matching infilling backbone is taken from Voicebox/SpeechFlow; Audiobox's contribution to flow-matching specifically is the extension to multi-modal audio and inference acceleration via Bespoke Solvers."
      - "Joint-CLAP evaluation model is introduced by the same paper and has not been independently validated as a general benchmark metric."

  - id: "2406.05551"
    published_date: "2024-06-08"
    entry_date: 2026-06-24
    year: 2024
    venue: arXiv
    task: [TTS]
    architecture: [hybrid]
    relevance: medium
    evidence_role:
      - architecture_variant
      - acceleration_evidence
    current_role: active_evidence
    method_family: [fm_acceleration]
    claims:
      - claim_id: ardit_continuous_tokens_avoid_codec_tradeoff
        role: supports
        claim: "Autoregressive generation of continuous speech tokens preserves the quality advantages of high-bitrate representations while avoiding the length constraints of high-bitrate discrete codecs."
        source: "§1, §3.2"
        evidence: "VAE-based continuous tokens at 1.7 kbps yield near-lossless reconstruction vs. discrete codecs at similar bitrates; ARDiT avoids the bitrate-fidelity tradeoff of VQ."
        confidence: high
        relevance: medium
      - claim_id: fm_distillation_improves_naturalness
        role: supports
        claim: "Diffusion distillation into single-step generators can improve perceptual naturalness of TTS samples relative to their multi-step teacher models, not only match it."
        source: "§4.2, Table 1"
        evidence: "ARDiT(DMD, B=4) achieves MUSHRA naturalness 79.3 vs. teacher model's lower naturalness score; DMD distillation improves over the multi-step ODE teacher on perceptual quality."
        confidence: medium
        relevance: high
      - claim_id: ardit_ar_order_improves_quality
        role: supports
        claim: "Autoregressive decoding order materially improves speech intelligibility and speaker similarity in TTS compared to fully parallel non-autoregressive diffusion generation at the same total computation budget."
        source: "§4.4, Figure 4"
        evidence: "Block-size ablation shows AR models consistently outperform fully non-autoregressive limit (B=INF) on intelligibility and speaker similarity, with gap widening with more training."
        confidence: high
        relevance: medium
      - claim_id: ardit_fim_speech_editing
        role: supports
        claim: "Fill-in-the-middle training enables near-ground-truth speech editing quality with continuous-token autoregressive models, bringing MUSHRA scores within statistical confidence intervals of human recordings."
        source: "§4.3, Table 2"
        evidence: "ARDiT(DMD, R=1) achieves MUSHRA naturalness 77.8 on Test Set C vs. ground truth 78.1; significantly outperforms VoiceCraft (64.6) at p < 0.01."
        confidence: high
        relevance: low
    limitations:
      - "All training and evaluation is on LibriTTS (reading-style English audiobook speech); generalization to in-the-wild or noisy speech is unverified."
      - "Evaluation uses MUSHRA rather than MOS, making direct numerical comparison with most TTS literature harder."
    caveats:
      - "Flow matching in ARDiT is the intra-block generative model only; the outer autoregressive structure is the primary architectural novelty. The paper's contribution to flow-matching specifically is the combination with AR decoding and DMD distillation."
      - "The DMD distillation framing is specific to flow-matching velocity fields; its improvement over teacher naturalness requires independent replication."

  - id: "2406.18009"
    published_date: "2024-06-26"
    entry_date: 2026-06-24
    year: 2024
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching]
    relevance: high
    evidence_role:
      - core_evidence
    current_role: influential
    method_family: [pure_fm]
    claims:
      - claim_id: e2tts_alignment_pipeline_naturalness_ceiling
        role: supports
        claim: "Explicit phoneme alignment supervision in non-autoregressive TTS, while useful for early convergence, imposes a naturalness ceiling that joint character-level training can exceed."
        source: "§3.4, Table 2"
        evidence: "E2 TTS trained with characters + filler tokens achieves CMOS -0.05 vs. ground truth, while Voicebox (with phoneme alignment) scores -0.78; E2 TTS convergence is slower early but surpasses Voicebox by end of training."
        confidence: high
        relevance: high
      - claim_id: e2tts_implicit_alignment_from_characters
        role: supports
        claim: "Flow-matching mel spectrogram generators can learn alignment implicitly from raw characters and filler tokens, eliminating the need for grapheme-to-phoneme converters, phoneme aligners, and duration models."
        source: "§2.1, §2.3"
        evidence: "E2 TTS uses raw character sequence padded with filler tokens to match mel-spectrogram length; the model learns to recover masked regions without any alignment supervision, achieving WER 1.9% and SIM-o 0.708."
        confidence: high
        relevance: high
      - claim_id: e2tts_ssl_pretraining_benefits
        role: supports
        claim: "Unsupervised pretraining on unlabeled speech improves downstream zero-shot TTS performance in both intelligibility and speaker similarity."
        source: "§3.4, Table 1"
        evidence: "E2 TTS with unsupervised pretraining achieves WER 1.9% and SIM-o 0.708 vs. WER 2.0% and SIM-o 0.675 from random initialization on LibriSpeech-PC test-clean."
        confidence: high
        relevance: medium
      - claim_id: e2tts_spk_sim_metric_ceiling
        role: complicates
        claim: "Zero-shot TTS speaker similarity scores at inference can exceed those of ground-truth recordings on standard speaker verification metrics, suggesting the metrics reward consistency within a generation rather than perceptual identity."
        source: "§3.4, Table 2"
        evidence: "E2 TTS SIM-o values on some test conditions exceed the ground-truth resynthesis reference, indicating speaker verification metrics may not align with human perception of speaker identity."
        confidence: medium
        relevance: low
      - claim_id: e2tts_nar_tts_data_scaling
        role: supports
        claim: "Non-autoregressive TTS systems trained jointly on duration and acoustics scale predictably with training data volume without requiring architectural changes."
        source: "§3.4, Table 1"
        evidence: "E2 TTS trained on 200,000h proprietary data achieves WER 1.9% and SIM-o 0.707 from random initialization, closely matching the pretrained-init result and outperforming smaller-data baselines."
        confidence: medium
        relevance: medium
    limitations:
      - "CMOS evaluation covers only 39 samples from 39 LibriSpeech speakers; naturalness claims are narrow in scope — spontaneous speech, non-native speakers, and cross-lingual settings are untested."
      - "E2 TTS requires specifying a target duration at inference; a separate regression-based duration model is used, reintroducing a pipeline dependency."
    caveats:
      - "The Transformer backbone and flow-matching objective are taken directly from Voicebox; E2 TTS's contribution to flow-matching specifically is demonstrating that the infilling objective can be decoupled from phoneme-level alignment supervision."
      - "Inference uses midpoint ODE solver with 32 NFE; no inference acceleration experiments are reported in this paper."

  - id: "2407.05407"
    published_date: "2024-07-07"
    entry_date: 2026-06-24
    year: 2024
    venue: arXiv
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching, hybrid]
    relevance: medium
    evidence_role:
      - architecture_variant
    current_role: active_evidence
    method_family: [ar_fm_hybrid]
    claims:
      - claim_id: cosyvoice_s3_tokens_better_alignment
        role: supports
        claim: "Inserting a vector quantizer into a supervised ASR encoder yields discrete speech tokens that preserve significantly stronger text-semantic alignment than unsupervised alternatives such as HuBERT or EnCodec tokens."
        source: "§2.1, §5.1, Table 7"
        evidence: "S3 tokens with BPE text achieve WER 3.93% vs. HuBERT-based 7.41% on LibriTTS test-clean while maintaining equivalent speaker similarity."
        confidence: high
        relevance: low
      - claim_id: cosyvoice_text_speech_token_independence
        role: supports
        claim: "In autoregressive codec-LM TTS, both the text tokenizer and the speech tokenizer independently contribute to content consistency, while speaker similarity is primarily controlled by the speaker embedding and acoustic model conditioning."
        source: "§5.2, Table 7"
        evidence: "Ablation over tokenizer combinations in Table 7 shows independent contributions from text encoding and speech tokenization to WER, while SPK-SIM remains stable across tokenizer choices."
        confidence: medium
        relevance: low
      - claim_id: cosyvoice_asr_reranking_consistency
        role: supports
        claim: "ASR re-ranking is an effective post-hoc method for improving content consistency in autoregressive TTS without any model retraining, at the cost of increased inference-time compute."
        source: "§5.3, Tables 8, 9"
        evidence: "5x ASR re-ranking reduces EN WER from 2.89% to 1.51% and ZH CER from 3.82% to 1.84% without any model change."
        confidence: high
        relevance: low
      - claim_id: cosyvoice_instruction_finetuning_paralinguistics
        role: supports
        claim: "Instruction fine-tuning on a modest amount of labelled data (556h) enables a TTS system to control fine-grained paralinguistic features — including laughter, breath, and word emphasis — with substantially improved accuracy over the base model."
        source: "§2.4, §5.4, Table 10"
        evidence: "CosyVoice-instruct achieves emotion accuracy improvements from 0.45 to 0.98 for Sad and 0.26 to 0.64 for Surprised relative to the base model."
        confidence: high
        relevance: low
      - claim_id: cosyvoice_tts_data_augments_asr
        role: supports
        claim: "High-quality TTS-synthesized speech can serve as effective training data augmentation for ASR, with text diversity of the synthesis prompts contributing more to downstream ASR gains than the raw duration of the synthetic corpus."
        source: "§5.5, Table 11"
        evidence: "ASR model trained on CosyVoice-synthesized LibriSpeech achieves WER 3.0%/6.59%; combining real + MLS synthetic data yields 2.04%/4.53%, with diversity of prompts driving the gain."
        confidence: medium
        relevance: low
    limitations:
      - "Only a single VQ codebook (4096 codes) is used; multi-level RVQ and optimal VQ insertion layer are unresolved."
      - "No subjective (MOS) evaluation in the main paper; relies entirely on objective WER/CER/SS metrics."
    caveats:
      - "The flow-matching component (OT-CFM) in CosyVoice is the acoustic model that maps semantic tokens to mel spectrograms; it is one of four components and not the primary novelty. Claims above are mostly about the S3 tokenizer and LLM components."
      - "CFG is applied by randomly dropping all conditions (p=0.2); guidance strength 0.7 at inference. This follows standard practice established by prior work."

  - id: "2412.04724"
    published_date: "2024-12-06"
    entry_date: 2026-06-24
    year: 2024
    venue: arXiv
    task: [VC]
    architecture: [flow-matching]
    relevance: high
    evidence_role:
      - core_evidence
      - acceleration_evidence
    current_role: active_evidence
    method_family: [pure_fm]
    claims:
      - claim_id: stablevc_dual_conditioning_no_degradation
        role: supports
        claim: "Independent timbre and style transfer from distinct unseen speakers can be achieved without degrading either attribute when conditioning streams are separated via parallel cross-attention with adaptive gating."
        source: "§DualAGC, Table 2"
        evidence: "StableVC achieves F0 correlation 0.75 on style transfer task with different timbre and style references; removing adaptive gate drops SECS from 0.64 to 0.36."
        confidence: high
        relevance: medium
      - claim_id: fm_vc_surpasses_diffusion_speed_quality
        role: supports
        claim: "Flow matching enables zero-shot voice conversion that surpasses diffusion baselines in both sample quality and inference speed, with quality stabilising in as few as 10 ODE steps."
        source: "§Conditional Flow Matching, Table 1, Table 3"
        evidence: "StableVC achieves UTMOS 4.12 vs. DDDM-VC 3.75 and RTF 0.146 vs. DDDM-VC 0.287 (1.65x speedup); quality is stable at 10 Euler steps with minor drop to UTMOS 3.82 at 5 steps."
        confidence: high
        relevance: high
      - claim_id: stablevc_timbre_leakage_failure_mode
        role: supports
        claim: "Timbre leakage into style representations is a failure mode in jointly trained VC systems, and adversarial disentanglement via gradient reversal measurably reduces this cross-contamination."
        source: "§Training Objectives, Table 4"
        evidence: "Ablation shows removing GRL loss degrades both style F0 correlation and timbre SECS metrics; GRL is necessary to prevent timbre signal from contaminating the style encoder."
        confidence: high
        relevance: medium
      - claim_id: stablevc_multiple_refs_speaker_prior
        role: supports
        claim: "Using multiple reference utterances alongside a pre-trained speaker verification prior as the timbre attention key dramatically improves intelligibility in cross-attention-based timbre modeling, as its removal causes WER to collapse from 2% to over 22%."
        source: "§DualAGC, Table 4"
        evidence: "Removing the timbre prior and multiple references causes WER to jump from 2.03% to 22.16%, confirming that the multi-reference + speaker verification prior combination is critical for intelligibility."
        confidence: high
        relevance: medium
      - claim_id: fm_nar_constant_latency
        role: supports
        claim: "Non-autoregressive VC generation maintains near-constant latency regardless of utterance length, a qualitative advantage over token-by-token autoregressive decoding that is not captured by fixed-length RTF comparisons."
        source: "§Experimental Results on Zero-shot VC"
        evidence: "StableVC's non-autoregressive design means latency scales with utterance length rather than sequence token count; compared to autoregressive LM-VC RTF 3.891 vs. StableVC RTF 0.146 (25x speedup)."
        confidence: high
        relevance: high
    limitations:
      - "Evaluation covers English speakers only (VCTK for timbre, ESD for style); cross-lingual style transfer is untested."
      - "The factorized codec used as the style extractor is not described in detail in the paper, restricting exact reproducibility."
    caveats:
      - "This is the first flow-matching paper in this set applied to voice conversion (VC task) rather than TTS; the acceleration advantage over diffusion baselines is specific to the VC setting with 10 Euler steps."
      - "Results on real-world noisy conditions are not reported; training was filtered by DNSMOS quality."

  - id: "2412.10117"
    published_date: "2024-12-13"
    entry_date: 2026-06-24
    year: 2024
    venue: arXiv
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching, hybrid]
    relevance: high
    evidence_role:
      - core_evidence
      - architecture_variant
    current_role: influential
    method_family: [ar_fm_hybrid]
    claims:
      - claim_id: cosyvoice2_fsq_full_codebook_utilization
        role: supports
        claim: "Finite scalar quantization achieves full codebook utilization in supervised speech tokenizers, capturing substantially more semantic content than vector quantization at equivalent bitrates."
        source: "§2.2, §4.1, Table 4"
        evidence: "FSQ achieves 100% codebook utilization vs. VQ's 23%, and reduces ASR error rate from 18.26% to 10.67% on CommonVoice EN."
        confidence: high
        relevance: low
      - claim_id: cosyvoice2_pretrained_llm_improves_consistency
        role: supports
        claim: "Replacing a randomly initialized custom LM with a pre-trained LLM backbone improves content consistency in hybrid TTS systems without requiring a separate text encoder."
        source: "§2.3, §4.3, Table 7"
        evidence: "Switching to Qwen2.5-0.5B backbone yields 18.46% relative CER improvement on Chinese test set (Table 7 ablation); removing the text encoder does not hurt performance."
        confidence: high
        relevance: low
      - claim_id: cosyvoice2_streaming_unified_ar
        role: supports
        claim: "Streaming and non-streaming synthesis can be unified in a single autoregressive model through interleaved text-speech token sequences, with virtually lossless quality on typical inputs relative to offline mode."
        source: "§2.3, §4.2, Table 8"
        evidence: "Streaming LM + streaming FM (M4) achieves CER 1.45% zh and WER 2.38% en vs. offline WER 2.57%, with only minor degradation on hard cases (8.08% vs. 6.83%)."
        confidence: high
        relevance: medium
      - claim_id: fm_multi_mask_latency_quality_continuum
        role: supports
        claim: "Training a flow matching model simultaneously on multiple causal mask types — from non-causal to full-causal — enables a single model to span the latency-quality trade-off continuum at inference time, with masks providing implicit self-distillation."
        source: "§2.4, §4.3, Table 8"
        evidence: "Chunk-aware causal FM trained on non-causal, full-causal, Chunk-M, and Chunk-2M masks achieves streaming/offline quality parity on typical cases; more-context masks implicitly distill into less-context masks."
        confidence: high
        relevance: high
      - claim_id: cosyvoice2_differentiable_asr_reward
        role: supports
        claim: "Differentiable ASR reward optimization generalizes better to out-of-domain and hard-case inputs than preference-based DPO in TTS speaker fine-tuning."
        source: "§2.8, §4.7, Table 11"
        evidence: "Combining differentiable ASR reward + DPO achieves best results on both in-domain speaker and SEED test sets, including hard cases where standard DPO degrades."
        confidence: medium
        relevance: low
    limitations:
      - "EN quality still lags behind Seed-TTS and F5-TTS on SEED test-en (WER 2.57% vs. 1.83% for F5-TTS), reflecting data imbalance toward Chinese."
      - "Streaming still incurs hard degradation on test-hard, suggesting contextual information from future text is important for difficult patterns."
    caveats:
      - "The chunk-aware causal flow matching design is the primary flow-matching contribution; it solves a streaming problem specific to hybrid LM+FM architectures and is not a general flow-matching advance."
      - "Japanese synthesis degrades due to character set overlap with Chinese (CER 18.79% test-ja vs. 7.98% test-ko), indicating data distribution limits the architecture's multilingual scope."

  - id: "2025.acl-long.313"
    published_date: "2025-07-27"
    entry_date: 2026-06-24
    year: 2025
    venue: ACL
    task: [TTS]
    architecture: [flow-matching]
    relevance: high
    evidence_role:
      - core_evidence
      - architecture_variant
    current_role: influential
    method_family: [pure_fm]
    claims:
      - claim_id: f5tts_convnext_text_refinement_alignment
        role: supports
        claim: "Explicit phoneme-level alignment is not required for robust non-autoregressive zero-shot TTS; modality-specific representation refinement before feature concatenation can resolve text-speech alignment failures in alignment-free architectures."
        source: "§3.2, §5.1"
        evidence: "ConvNeXt V2 blocks applied to the padded character sequence before concatenation eliminate the systematic 7% Mandarin failure rate seen in E2 TTS; removing the ConvNeXt branch causes complete alignment failure."
        confidence: high
        relevance: high
      - claim_id: f5tts_flat_transformer_entanglement_failure
        role: supports
        claim: "Deep entanglement of semantic and acoustic features in a shared transformer produces systematic alignment failures in non-autoregressive TTS that persist across training scale and cannot be addressed by re-ranking."
        source: "§3.2, §5.1, Table 4"
        evidence: "E2 TTS with a flat U-Net transformer exhibits a persistent ~7% Mandarin failure rate (WER >50%) that is unchanged by re-ranking; the failure is architecture-specific and resolved by the DiT + ConvNeXt combination."
        confidence: high
        relevance: high
      - claim_id: f5tts_sway_sampling_improves_faithfulness
        role: supports
        claim: "Inference-time flow step scheduling that densifies early integration steps improves faithfulness and speaker similarity in flow-matching TTS without any retraining."
        source: "§3.2, §5.2, Table 5"
        evidence: "Sway Sampling (s = -1) on LibriSpeech-PC test-clean improves WER from 2.84% to 2.41% and UTMOS from 3.70 to 3.89 at 32 NFE; the strategy also transfers to E2 TTS without retraining."
        confidence: high
        relevance: high
      - claim_id: f5tts_nar_100k_hour_matches_ar
        role: supports
        claim: "Non-autoregressive flow-matching TTS trained at 100K-hour scale can match autoregressive systems on intelligibility while achieving substantially lower real-time factor."
        source: "§5, Table 1"
        evidence: "F5-TTS (32 NFE) achieves WER 1.83% on Seed-TTS test-en vs. CosyVoice (AR hybrid) WER ~3%, while RTF 0.15 at 16 NFE compares favorably to Voicebox RTF 0.64."
        confidence: high
        relevance: high
      - claim_id: f5tts_librispeech_pc_benchmark_gap
        role: complicates
        claim: "Absence of standardised benchmark subsets with released prompt lists is a structural barrier to fair cross-paper comparison in zero-shot TTS; community-released evaluation sets directly reduce this problem."
        source: "§4"
        evidence: "The paper releases LibriSpeech-PC (1,127-sample benchmark with fixed prompt lists) after observing that prior work used incompatible unreleased test subsets, making cross-paper WER/SPK-SIM comparisons unreliable."
        confidence: high
        relevance: low
    limitations:
      - "Speaker similarity (SPK-SIM 0.66–0.67 on English) remains below ground truth and well below Seed-TTS DiT (0.790), with it unclear whether the gap is architectural or a data-volume effect."
      - "Mel spectrogram representation creates a sequence-length bottleneck that scales unfavourably with utterance length compared to more compressed token representations."
      - "Duration estimation via character-count ratio introduces uncontrolled variance at inference for prosodically irregular or complex text."
    caveats:
      - "The CFM objective, DiT backbone, infilling training task, and CFG strategy are all established prior to this paper; F5-TTS's contribution to flow-matching specifically is the ConvNeXt text refinement and Sway Sampling inference strategy."
      - "The ConvNeXt fix is shown to be DiT-specific and cannot transfer to E2 TTS's U-Net backbone, limiting its applicability as a general recipe."

  - id: "2025.acl-long.598"
    published_date: "2025-07-27"
    entry_date: 2026-06-24
