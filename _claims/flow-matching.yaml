      - claim_id: disclvc_compact_fm_icl_competitive_with_large_ar
        role: supports
        claim: "Flow matching with in-context learning achieves competitive zero-shot voice conversion quality at substantially fewer parameters than larger autoregressive systems."
        source: "§3.2, Table 1"
        evidence: "Discl-VC's 131M-parameter flow-matching transformer achieves MOS 4.31, UTMOS 4.079, and SECS 0.929 on VCTK zero-shot VC, surpassing the 922M-parameter Vevo on naturalness while matching its speaker similarity."
        confidence: high
        relevance: high
      - claim_id: disclvc_prosody_identity_tradeoff
        role: complicates
        claim: "Prosody transfer from a reference speaker introduces a trade-off with target speaker identity preservation."
        source: "§3.2, Table 2"
        evidence: "In the prosody conversion task, Discl-VC achieves lower speaker similarity (SECS 0.847) than Vevo (0.892) despite better UTMOS and WER, suggesting replacing source prosody with reference tokens disrupts timbre modeling."
        confidence: medium
        relevance: low
      - claim_id: disclvc_simvq_reduces_codebook_collapse
        role: supports
        claim: "SimVQ (freezing codebook vectors and learning a linear projection) reduces codebook collapse in VQ-based speech discretisation."
        source: "§3.3, Table 3"
        evidence: "Ablation replacing SimVQ with standard VQ degrades all metrics (UTMOS 4.042 vs 4.079, WER 2.182% vs 1.946%), attributed to codebook collapse during training."
        confidence: medium
        relevance: low
      - claim_id: disclvc_ssl_prosody_speaker_leakage
        role: complicates
        claim: "SSL-based prosody extraction for VC can retain speaker-correlated information when the same-speaker assumption holds during training, causing train-inference mismatch."
        source: "§3.3, Table 3"
        evidence: "Ablation without ContentVec (using raw mel dimensions as prosody input) shows the largest performance drop (UTMOS 4.034, WER 3.147%), attributed to residual speaker information in the prosody tokens during same-speaker training."
        confidence: medium
        relevance: low
    limitations:
      - "Evaluation is limited to English and uses only two baselines (Vevo, FAcodec) on a relatively small test set (450 pairs for zero-shot VC)."
      - "The two-stage training procedure requires the stage-1 flow-matching encoder to be frozen before the prosody mask transformer can be trained, adding complexity."
    caveats:
      - "The flow-matching transformer's role in Discl-VC is acoustic generation from disentangled content/prosody tokens plus in-context speaker conditioning; the paper's primary novelty is the disentanglement and prosody-mask-transformer design around it, not a change to the flow-matching objective itself."

