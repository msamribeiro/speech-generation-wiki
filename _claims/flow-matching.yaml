      - infrastructure
    current_role: minor
    method_family: [ar_fm_hybrid]
    claims:
      - claim_id: synparaspeech_synthetic_mixing_effective_finetuning_data
        role: supports
        claim: "Automated mixing of isolated paralinguistic audio events with clean conversational speech, combined with voice conversion for timbre alignment, can produce effective fine-tuning data for paralinguistic TTS."
        source: "§4.2.1, Table 3"
        evidence: "CosyVoice2 SFT on SynParaSpeech achieves PMOS 3.31 versus 2.35 for NVS SFT and 1.88 baseline; F5-TTS SFT on SynParaSpeech similarly achieves PMOS 3.10 versus 1.49 for NVS SFT."
        confidence: high
        relevance: medium
      - claim_id: synparaspeech_dpo_paired_utterances_improves_quality
        role: supports
        claim: "DPO with naturally paired utterances (with vs. without paralinguistic events) can improve paralinguistic speech quality beyond SFT alone."
        source: "§4.2.1, Table 3"
        evidence: "CosyVoice2 DPO-Joint achieves PMOS 3.46 and QMOS 4.12 versus SFT-only PMOS 3.31 and QMOS 4.01."
        confidence: high
        relevance: low
      - claim_id: synparaspeech_standard_metrics_unreliable_paralinguistic
        role: complicates
        claim: "Standard automatic speech quality metrics are unreliable for evaluating paralinguistic TTS systems."
        source: "§4.2.1, Table 3"
        evidence: "All models fine-tuned on paralinguistic data show degraded CER, SECS, and UTMOSv2 relative to baselines despite achieving higher subjective NMOS and QMOS."
        confidence: high
        relevance: low
      - claim_id: synparaspeech_fewshot_icl_improves_event_detection
        role: supports
        claim: "Few-shot in-context prompting with paralinguistic examples improves paralinguistic event detection in multimodal LLMs."
        source: "§4.2.2, Table 4"
        evidence: "SynParaSpeech prompt tuning raises accuracy and macro F1 for both Kimi Audio and Qwen 2.5 Omni over no-context baselines, with optimal performance at 5-shot context."
        confidence: medium
        relevance: low
      - claim_id: synparaspeech_diminishing_returns_more_shots
        role: complicates
        claim: "Increasing prompt context length for in-context learning in paralinguistic event detection yields diminishing returns and eventually degrades performance."
        source: "§4.2.2, Table 4"
        evidence: "Kimi Audio accuracy peaks at 5-shot (0.382) and declines at 7-shot (0.371); Qwen 2.5 Omni also peaks at 5-shot (0.473) and declines at 7-shot (0.423)."
        confidence: medium
        relevance: low
    limitations:
      - "The corpus is Chinese-only and covers only 6 paralinguistic categories; paralinguistic events are inserted synthetically rather than captured in natural speech."
    caveats:
      - "Flow matching (via F5-TTS) is one of two TTS backbones used only to validate the dataset's downstream utility; the paper introduces no new flow-matching architecture or training objective, and the DPO alignment experiments target the autoregressive CosyVoice2 backbone rather than F5-TTS."

  - id: "2509.15629"
