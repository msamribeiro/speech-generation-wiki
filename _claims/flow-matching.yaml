        source: "§4.2, §6.2, Table 3"
        evidence: "Initialising the flow-matching ODE for frame i from the previous predicted frame (rather than a standard Gaussian) reduces required NFEs from 7+ to 3 without quality loss, confirmed by ablation removing the previous-frame prior."
        confidence: high
        relevance: high
      - claim_id: felle_coarse_to_fine_improves_sim
        role: supports
        claim: "Hierarchical coarse-to-fine spectral decomposition within each flow-matching step improves speaker similarity over holistic or fully decoupled generation approaches in continuous-token autoregressive TTS."
        source: "§4.2, §6.2, Table 3"
        evidence: "Ablation replacing the coarse-to-fine flow-matching module with holistic (HFM) or fully decoupled (DFM) flow matching degrades speaker similarity, WER, or both."
        confidence: high
        relevance: high
      - claim_id: felle_continuous_matches_discrete_intelligibility_exceeds_sim
        role: supports
        claim: "Continuous mel-spectrogram autoregressive models can match discrete-token systems on intelligibility while substantially surpassing them on speaker similarity in zero-shot TTS."
        source: "§6.1, Table 2"
        evidence: "FELLE achieves WER-C 1.53% (continuation), matching MELLE's 1.53%, while reaching SIM-r 0.539 versus VALL-E's 0.508 on the same continuation task."
        confidence: high
        relevance: medium
      - claim_id: felle_nfe_tradeoff_intelligibility_sim
        role: complicates
        claim: "The number of flow-matching function evaluations introduces a trade-off in autoregressive TTS: moderate NFE improves intelligibility but excessive NFE degrades both intelligibility and speaker similarity."
        source: "§6.3, Figure 3"
        evidence: "The NFE-sweep ablation shows both WER and SIM peak at a moderate number of function evaluations (3 NFEs) and degrade if NFE is increased further."
        confidence: medium
        relevance: high
    limitations:
      - "Inference is significantly slower than non-autoregressive systems due to the frame-by-frame autoregressive loop compounded with per-frame flow-matching NFEs; streaming or parallel decoding is not explored."
      - "Training and evaluation are English-only (LibriSpeech); multilingual zero-shot capability is not tested, and the LM parameter count is not reported."
    caveats:
      - "FELLE is cited as a direct comparison baseline by later continuous-AR-FM papers in this corpus (CLEAR, Dragon-FM), indicating its previous-frame-prior and coarse-to-fine flow-matching design has become a reference point for this architectural sub-line."

  - id: "2506.21619"
