        relevance: medium
      - claim_id: latentvoicegrad_fm_matches_dpm_fewer_steps
        role: supports
        claim: "Flow matching achieves comparable voice conversion quality to diffusion models with substantially fewer inference steps."
        source: "§IV.G, §IV.J, Tables VII, IX"
        evidence: "VoiceGrad-FM with L=3 Euler steps achieves pMOS 3.85 (versus 3.86 for VoiceGrad-DPM at L=20), at GPU RTF 0.007 versus 0.045, a six-fold speedup with no quality penalty."
        confidence: high
        relevance: high
      - claim_id: latentvoicegrad_adversarial_autoencoder_improves_quality
        role: supports
        claim: "Adversarial autoencoder training substantially improves audio quality and speaker similarity in latent-domain voice conversion compared to reconstruction-only training."
        source: "§IV.F, Table V"
        evidence: "Adding adversarial loss during autoencoder training improves pMOS from 3.78 to 3.93 and SECS from 0.829 to 0.844 on VCTK zero-shot VC with the DPM generative model."
        confidence: high
        relevance: low
      - claim_id: latentvoicegrad_discrete_tokens_underperform_continuous
        role: complicates
        claim: "Discrete acoustic token sequences from neural audio codecs underperform continuous spectral representations as the conversion domain for iterative generative voice conversion models."
        source: "§IV.E, Tables II, III"
        evidence: "VoiceGrad with DAT features (DAC codec, dimensionality 1024) achieves pMOS 2.41 versus 3.86 for mel-spectrograms; LatentVoiceGrad-DAT shows CER 9.08 versus 2.99 for the mel-spectrogram variant."
        confidence: medium
        relevance: low
      - claim_id: latentvoicegrad_noise_ratio_controls_tradeoff
        role: refines
        claim: "The noise injection ratio at the initial point of the ODE in flow-matching voice conversion controls a three-way trade-off between audio quality, intelligibility, and speaker similarity."
        source: "§IV.G, Table VI"
        evidence: "Systematic sweeps of r from 0 to 1 in VoiceGrad-FM and LatentVoiceGrad-FM show increasing r raises SECS but degrades CER, with pMOS peaking around r=0.4-0.6; r=0.7 provides a practical balance."
        confidence: high
        relevance: high
    limitations:
      - "Evaluation is limited to English speech (VCTK, LibriTTS) and a 12-listener subjective test that omits FACodec as a comparison."
      - "The discrete-token (DAT) evaluation is acknowledged as potentially sub-optimal due to untuned hyperparameters, leaving the conclusion about discrete-token unsuitability tentative."
    caveats:
      - "FM's step-efficiency advantage is demonstrated specifically within the VoiceGrad VC latent-diffusion framework; whether the r=0.7 noise-mixing ratio and 3-5 step regime generalize to other flow-matching architectures or to TTS is untested."

  - id: "2509.08696"
    published_date: "2025-09-10"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching]
    relevance: high
    evidence_role:
      - acceleration_evidence
      - evaluation_caution
    current_role: minor
    method_family: [fm_acceleration]
    claims:
      - claim_id: smoothcache_zero_training_caching_accelerates_fm_tts
        role: supports
        claim: "Zero-training transformer layer caching can accelerate diffusion-based TTS inference without retraining or architectural changes."
        source: "§3.2, Table 1"
        evidence: "Applying SmoothCache to F5-TTS with alpha=0.25 (caching approximately half of 32 NFE steps) reduces RTF from 0.46 to 0.26 while keeping WER, SIM-o, and UTMOS within measurement noise on LibriSpeech-PC test-clean."
        confidence: high
        relevance: high
      - claim_id: smoothcache_quality_benefit_depends_on_trajectory_length
        role: complicates
        claim: "The inference-time quality benefit of layer caching in diffusion TTS depends on the length of the denoising trajectory."
        source: "§4.1, Table 1"
        evidence: "At 32 NFE, caching 50% of steps preserves quality; at 16 NFE, the same proportional caching degrades UTMOS from 3.90 to 3.79 and NISQA from 4.14 to 3.97 on LibriSpeech-PC test-clean, comparable to reducing NFE directly."
        confidence: high
        relevance: medium
      - claim_id: smoothcache_independent_schedules_cause_artifacts
        role: complicates
        claim: "Per-layer cache schedules derived independently for attention and feed-forward sublayers introduce inter-layer dependency artefacts in diffusion transformer TTS."
        source: "§3.1"
        evidence: "Applying separate Attn-only and FFN-only cache schedules to F5-TTS caused audible artefacts in informal listening tests; a unified schedule derived from the attention layer pattern resolved this issue."
        confidence: medium
        relevance: medium
      - claim_id: smoothcache_caching_beats_step_reduction_at_high_nfe
        role: supports
        claim: "Calibrated layer caching provides a marginally superior quality-compute trade-off compared to equivalent step reduction at high NFE settings."
        source: "§4.1, Table 2"
        evidence: "A 37-participant user study found 53% preference for 32 NFE with caching over a 24 NFE no-cache baseline at the same compute budget; the difference collapsed to 49% vs. 51% at 16 NFE."
        confidence: medium
        relevance: medium
    limitations:
      - "RTF measurements use a single GPU (NVIDIA T4) and a single flow-matching TTS model (F5-TTS); generalization to other DiT-based TTS systems or GPU architectures is untested."
      - "The calibration set contains only ten utterances, which may not capture the full distribution of synthesis conditions."
    caveats:
      - "The technique is an inference-time wrapper (SmoothCache) applied unchanged from image/video diffusion acceleration work; it does not modify the flow-matching training objective or model weights."

  - id: "2509.09748"
    published_date: "2025-09-11"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching]
    relevance: high
    evidence_role:
      - acceleration_evidence
    current_role: active_evidence
    method_family: [fm_acceleration]
    claims:
      - claim_id: ditreducio_training_free_caching_reduces_flops
        role: supports
        claim: "Training-free caching of redundant DiT computations can substantially reduce FLOPs in TTS without retraining and without significant intelligibility degradation."
        source: "§4.2, Table 1"
        evidence: "At the optimal T4 threshold, DiTReducio reduces F5-TTS FLOPs by 54.4% while keeping WER within 0.002 percentage points of the uncompressed baseline on LibriSpeech-PC test-clean."
        confidence: high
        relevance: high
      - claim_id: ditreducio_diagonal_attention_predicts_redundancy
        role: supports
        claim: "Diagonal-like self-attention patterns in DiT layers are a reliable proxy for identifying temporally redundant layer-timestep pairs during diffusion inference."
        source: "§3.3, Figure 4"
        evidence: "Cosine similarity between an attention heatmap and the identity matrix is strongly correlated with temporal redundancy; layer-step pairs scoring above 0.35 in diagonal similarity approach 100% redundancy."
        confidence: high
        relevance: medium
      - claim_id: ditreducio_temporal_skipping_alone_loses_info
        role: complicates
        claim: "Temporal skipping alone in DiT TTS inference causes severe conditional information loss, making branch skipping a necessary complement for quality-preserving acceleration."
        source: "§4.3, Figure 6"
        evidence: "Ablation on F5-TTS shows TS-only reaches WER of 23.06% at maximum threshold, while full DiTReducio (TS + BS) holds WER at 2.9% under the same threshold."
        confidence: high
        relevance: medium
      - claim_id: ditreducio_threshold_dependent_quality_cliff
        role: complicates
        claim: "Training-free DiT acceleration exhibits a threshold-dependent quality cliff: beyond a moderate compression ratio, marginal speed gains decrease while speaker similarity degradation accelerates."
        source: "§4.2, Table 1"
        evidence: "For F5-TTS, moving from T4 to T6 yields only an additional 0.017 RTF improvement (0.129 to 0.112) but drops SIM-o from 0.618 to 0.590."
        confidence: high
        relevance: medium
      - claim_id: ditreducio_image_acceleration_needs_domain_adaptation
        role: refines
        claim: "Inference-time acceleration techniques from image and video diffusion transfer to speech synthesis but require domain-specific adaptation, particularly for classifier-free guidance structures."
        source: "§3.2, §Appendix A.1"
        evidence: "Branch skipping is introduced to handle speech CFG's conditional/unconditional branch redundancy, and MegaTTS 3's multi-condition CFG requires separate residuals for each branch pair."
        confidence: medium
        relevance: high
    limitations:
      - "Evaluation is narrow: two models, one dataset (LibriSpeech-PC test-clean), no human listening test, and no comparison against other TTS-specific distillation methods on equivalent hardware."
      - "The framework applies only to DiT-based flow-matching models and does not generalize to autoregressive or non-DiT architectures."
    caveats:
      - "The FLOPs reduction figure cited in the abstract (75.4%) is inconsistent with the paper's own Table 1 Ops Ratio values, making the headline efficiency claim difficult to verify precisely."

  - id: "2509.09631"
    published_date: "2025-09-11"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching, transformer-enc-dec]
    relevance: high
    evidence_role:
      - architecture_variant
    current_role: frontier_probe
    method_family: [pure_fm]
    claims:
      - claim_id: diflowtts_discrete_fm_competitive_naturalness_prosody
        role: supports
        claim: "Discrete flow matching defined directly over factorized speech token subspaces achieves competitive naturalness and superior prosody reconstruction compared to continuous-space flow and diffusion TTS baselines trained on comparable data."
        source: "§4.2, Table 1, Table 2"
        evidence: "DiFlow-TTS attains the best UTMOS (3.98) and best-by-a-wide-margin F0-RMSE (7.97, versus 14.33 for MaskGCT and 13.78 for F5-TTS) on LibriSpeech test-clean, and the best naturalness MOS (4.18) and intelligibility MOS (4.41) in the subjective listening test."
        confidence: high
        relevance: high
      - claim_id: diflowtts_factorized_multihead_improves_prosody
        role: supports
        claim: "Factorized multi-head velocity prediction, using separate prediction heads for distinct speech attribute subspaces within a single discrete flow model, improves prosody and acoustic fidelity over a single-head alternative."
        source: "§4.3, Table 4"
        evidence: "The Method section describes dedicated prosody and acoustic prediction heads within the DiT (factorized multi-head prediction), and the paper's ablation (Table 4) confirms this factorization outperforms a single unified head on prosody and acoustic fidelity, though exact metric values are not detailed on the ingested paper page."
        confidence: medium
        relevance: high
      - claim_id: diflowtts_global_adaln_insufficient_speaker_sim
        role: complicates
        claim: "Global speaker embedding conditioning via AdaLN is insufficient for reliable zero-shot speaker similarity in discrete token-space TTS, and perceptual similarity judgements diverge from embedding-based automatic metrics (SIM-O) in this setting."
        source: "§4.2, Table 1, Table 2"
        evidence: "SIM-O (0.45) trails MaskGCT (0.67) and F5-TTS (0.52) in objective evaluation, while subjective similarity MOS (4.42) is highest among compared systems, a divergence the authors attribute to perceptual identity cues not captured by embedding cosine similarity."
        confidence: high
        relevance: medium
      - claim_id: diflowtts_compact_dit_matches_single_step_latency
        role: supports
        claim: "Non-autoregressive discrete flow models with compact DiT backbones can match the inference latency of single-step flow matching systems while operating at higher NFE, without compromising data efficiency."
        source: "§4.2, Table 3"
        evidence: "DiFlow-TTS (164M, 4 NFE) achieves GPU RTF 0.03, matching OZSpeech's 1-NFE RTF, while DiFlow-TTS-Small (122M, 16 NFE) reaches RTF 0.05, 5.2x-34x faster than continuous-space baselines despite training on only 470 hours."
        confidence: high
        relevance: high
    limitations:
      - "Global AdaLN speaker conditioning is identified as the system's primary weakness for zero-shot speaker similarity; the authors suggest cross-attention over local timbre embeddings as future work."
      - "Evaluated on a single language (English) and a moderately sized training set (470h), leaving multilingual scalability and larger-data behavior open questions."
    caveats:
      - "This is the first published baseline for discrete flow matching in speech, framed explicitly by the authors as an entry point rather than a finished production system; comparisons to continuous-space flow-matching baselines (e.g. F5-TTS) use heterogeneous training data scales (470h vs. up to 100K h), complicating direct quality attribution to the discrete-flow-matching design itself."

  - id: "2509.11084"
    published_date: "2025-09-14"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching]
    relevance: medium
    evidence_role:
      - architecture_variant
    current_role: minor
    method_family: [pure_fm]
    claims:
      - claim_id: laroped_length_normalized_pe_improves_long_form
        role: supports
        claim: "Length-normalized positional encoding in cross-attention TTS substantially improves alignment accuracy for long-form speech synthesis, where standard absolute-index RoPE degrades."
        source: "§4.2, Table 1"
        evidence: "LARoPE with K_e=4 reduces WER on tc-long (10-30s) from 4.98% to 2.16%, while RoPE's WER on tc-long is nearly double that of tc-short."
        confidence: high
        relevance: low
      - claim_id: laroped_diagonal_bias_accelerates_training
        role: supports
        claim: "A diagonal inductive bias in cross-attention positional embeddings accelerates text-speech alignment learning during training."
        source: "§4.3, Figure 2"
        evidence: "At 200k training iterations without batch expansion, LARoPE reduces CER from 2.00% to 1.23% versus RoPE, with the gap maintained throughout 700k iterations."
        confidence: high
        relevance: low
      - claim_id: laroped_standard_rope_suboptimal_cross_attention
        role: complicates
        claim: "Standard RoPE is suboptimal in cross-attention TTS because relative positional distances based on absolute indices do not align diagonally when query and key sequence lengths differ."
        source: "§3, Figure 1"
        evidence: "Analysis of relative upper bounds shows RoPE's attention score map loses diagonal structure whenever L_q != L_k, whereas LARoPE preserves the diagonal regardless of length ratio."
        confidence: high
        relevance: low
      - claim_id: laroped_compact_models_match_larger_via_pe
        role: supports
        claim: "Compact attention-based TTS systems can achieve pronunciation accuracy competitive with models more than an order of magnitude larger through improved positional embedding design rather than parameter scaling."
        source: "§4.5, Table 3"
        evidence: "The 19M-parameter LARoPE model achieves 2.25% WER on LibriSpeech test-clean, outperforming E2 TTS (333M, 2.95%), F5-TTS (336M, 2.42%), and DiTTo-TTS (740M, 2.56%) at RTF 0.05."
        confidence: high
        relevance: medium
      - claim_id: laroped_prior_rope_extensions_leave_cross_attn_unresolved
        role: refines
        claim: "Existing RoPE extensions (position interpolation, YaRN, LongRoPE) address self-attention length extrapolation but leave the cross-attention alignment problem in TTS unresolved."
        source: "§5.1"
        evidence: "The paper identifies that all prior RoPE extensions are designed for self-attention and do not modify the relative distance formulation for cross-attention with differing query and key lengths."
        confidence: medium
        relevance: low
    limitations:
      - "Evaluated entirely within the SupertonicTTS flow-matching framework; generalizability to other cross-attention flow-matching or diffusion TTS architectures is asserted but not tested."
      - "Does not benchmark LARoPE against alternative alignment strategies such as guided attention loss or diagonal priors in monotonic alignment search."
    caveats:
      - "The contribution is a positional-embedding modification orthogonal to the flow-matching generative objective; it targets the cross-attention alignment problem shared by any cross-attention TTS architecture, not something specific to flow matching."

  - id: "2509.12171"
    published_date: "2025-09-15"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [SCA, evaluation]
    architecture: [flow-matching]
    relevance: low
    evidence_role:
      - infrastructure
    current_role: minor
    method_family: [pure_fm]
    claims:
      - claim_id: c3t_accuracy_insufficient_for_fairness
        role: supports
        claim: "Raw accuracy metrics are insufficient to surface demographic fairness failures in speech-aware LLMs."
        source: "§7, Table 1"
        evidence: "Models achieve overall fairness scores of 0.43-0.83, but when constrained to tasks they can solve for at least one speaker, constrained fairness drops below 5% across all models."
        confidence: high
        relevance: low
      - claim_id: c3t_population_robustness_masks_group_inconsistency
        role: complicates
        claim: "Speech-aware LLMs that perform robustly at the population level may still exhibit systematic speaker-group inconsistencies."
        source: "§7, Table 1"
        evidence: "Audio Flamingo 3 achieves an overall fairness of 0.83 but a constrained fairness of 0.002, and its cross-modal robustness trails overall fairness by 13 percentage points."
        confidence: high
        relevance: low
      - claim_id: c3t_voice_cloning_scales_speaker_diverse_benchmarks
        role: supports
        claim: "Voice cloning provides a scalable alternative to human recording for constructing diverse-speaker evaluation benchmarks."
        source: "§3, §6"
        evidence: "C3T uses a Voicebox-based conditional flow matching TTS to synthesize 14-29 speaker variants per task instance, covering age, gender, and accent groups from ESLTTS and GLOBE."
        confidence: medium
        relevance: medium
      - claim_id: c3t_crossmodal_degradation_beyond_asr_error
        role: refines
        claim: "Cross-modal degradation in speech-aware LLMs reflects not only ASR errors but also speaker-characteristic-dependent response variation that survives correct transcription."
        source: "§1, §5"
        evidence: "The benchmark explicitly tests scenarios where transcription is correct but model output differs across speakers, isolating demographic sensitivity from recognition error as distinct failure modes."
        confidence: medium
        relevance: low
    limitations:
      - "The benchmark's TTS-synthesized speech may not fully capture the acoustic variability of natural recordings, and the degree to which voice cloning artifacts influence downstream model behavior is not characterized."
    caveats:
      - "Flow matching appears only as an infrastructural component (a Voicebox-style conditional flow matching TTS model used to synthesize speaker-diverse audio prompts); the paper contributes no new flow-matching architecture or objective."

  - id: "2509.14684"
    published_date: "2025-09-18"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching]
    relevance: high
    evidence_role:
      - control_evidence
      - architecture_variant
    current_role: active_evidence
    method_family: [pure_fm]
    claims:
      - claim_id: daien_cross_attention_improves_env_fidelity
        role: supports
        claim: "Injecting time-varying environment conditioning via cross-attention into flow-matching TTS backbones produces higher environment fidelity than direct concatenation of environment features."
        source: "§4.2, Table 1"
        evidence: "DAIEN-TTS with cross-attention achieves ESMOS 3.65 versus 3.49 for the concatenation-based ablated variant, with naturalness MOS also improving from 3.68 to 3.78."
        confidence: high
        relevance: high
      - claim_id: daien_source_separation_enables_environmental_prompts
        role: supports
        claim: "A pretrained source separation module can enable zero-shot TTS to use environmental speech as a speaker prompt without degradation from background noise."
        source: "§4.1, Table 1"
        evidence: "DAIEN-TTS achieves WER 1.93% and MOS 3.84 under environmental speaker prompts, slightly outperforming F5-TTS with clean prompts (WER 2.30%, MOS 3.80) and substantially outperforming F5-TTS under the same environmental conditions (WER 2.87%, MOS 3.09)."
        confidence: high
        relevance: medium
      - claim_id: daien_dual_cfg_enables_independent_control
        role: supports
        claim: "Dual classifier-free guidance enables independent control of speaker and environment attributes in a jointly trained flow-matching TTS model."
        source: "§2.3.1, §4.2"
        evidence: "DCFG with separate guidance strengths for the speech-text condition and the environment condition is the inference-time mechanism through which DAIEN-TTS independently controls timbre and acoustic background."
        confidence: medium
        relevance: high
      - claim_id: daien_no_baselines_limits_assessment
        role: complicates
        claim: "The absence of established baseline systems for time-varying environment-aware TTS makes it difficult to assess absolute performance gains beyond ablation comparisons."
        source: "§3.2"
        evidence: "For the background environment synthesis condition, no existing systems match the task definition; all comparisons are between DAIEN-TTS and its own ablated variant, with no external reference point."
        confidence: medium
        relevance: low
      - claim_id: daien_fm_tts_sensitive_to_prompt_environment
        role: complicates
        claim: "Flow-matching TTS systems trained on clean speech are sensitive to acoustic environment in the speaker prompt, with degradation visible in both speaker similarity and naturalness."
        source: "§4.1, Table 1"
        evidence: "F5-TTS (trained on clean LibriTTS data) shows SIM-o dropping from 0.58 to 0.49 and MOS dropping from 3.80 to 3.09 when the speaker prompt contains background noise rather than clean speech."
        confidence: high
        relevance: medium
    limitations:
      - "Evaluation compares DAIEN-TTS only against its own ablation; no external environment-aware TTS baseline exists in the paper, limiting the strength of absolute performance claims."
      - "Model size is not reported, making efficiency comparisons against other flow-matching TTS systems impossible."
    caveats:
      - "The environment-conditioning contribution sits in the conditioning and cross-attention injection design layered on F5-TTS's existing CFM training objective and DiT backbone, which are adopted unchanged."

  - id: "2509.15085"
    published_date: "2025-09-18"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching]
    relevance: high
    evidence_role:
      - architecture_variant
      - acceleration_evidence
    current_role: active_evidence
    method_family: [fm_vocoder]
    claims:
      - claim_id: melflow_fm_matches_gan_quality_streaming
        role: supports
        claim: "Flow matching vocoders can match or exceed GAN vocoders in intrusive perceptual quality metrics even under a streaming constraint that reduces inference steps."
        source: "§5, Table 1"
        evidence: "MelFlow at N=5 (streaming) achieves PESQ 4.12 vs HiFi-GAN's 2.99 and SI-SDR -8.8 dB vs -29.9 dB on EARS-WHAM v2, while maintaining RTF < 1 on a consumer GPU."
        confidence: high
        relevance: high
      - claim_id: melflow_low_step_count_degrades_spectral_fidelity
        role: complicates
        claim: "Low step-count budgets in streaming flow/diffusion inference degrade spectral fidelity even when perceptual quality remains competitive."
        source: "§5, Table 1"
        evidence: "MelFlow at N=5 shows LSD 1.0 and MCD 3.28 on EARS-WHAM v2, worse than HiFi-GAN (LSD 0.77, MCD 2.41), whereas the non-streaming N=25 variant recovers to LSD 0.7 and MCD 1.7."
        confidence: high
        relevance: high
      - claim_id: melflow_nbuffer_avoids_traintest_mismatch
        role: supports
        claim: "Streaming inference for multi-step flow and diffusion models can be achieved without train-test mismatch by maintaining N independent sets of per-layer causal cache buffers."
        source: "§3.2"
        evidence: "The N-buffer scheme produces outputs identical to offline batch processing (up to floating-point precision) because cached past activations never change, enabling standard parallel training alongside streaming deployment."
        confidence: high
        relevance: high
      - claim_id: melflow_diffusion_buffer_latency_barrier
        role: complicates
        claim: "High algorithmic latency is a significant barrier for diffusion-buffer streaming approaches, limiting practical streaming to methods that avoid coupling diffusion time to physical time."
        source: "§2.2"
        evidence: "The Diffusion Buffer requires at least 20 frames per buffer, giving a minimum effective algorithmic latency of ~340 ms at 16 ms hop size, which MelFlow avoids by using the per-layer cache scheme."
        confidence: medium
        relevance: medium
    limitations:
      - "MelFlow operates at 16 kHz only; extension to 24 kHz or 44.1 kHz is not evaluated, and the step-count constraint tightens at higher sample rates."
      - "The training dataset is relatively small (~87 hours); behavior on highly diverse or noisy speech is untested."
    caveats:
      - "The contribution targets flow-matching vocoding (mel-to-waveform) specifically in a streaming-latency setting, not text-to-speech synthesis itself; the mel-generation stage of a TTS pipeline is unaffected."

  - id: "2509.14579"
    published_date: "2025-09-18"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS, VC]
    architecture: [flow-matching]
    relevance: high
    evidence_role:
      - control_evidence
      - architecture_variant
    current_role: active_evidence
    method_family: [pure_fm]
    claims:
      - claim_id: clf5_transcript_free_crosslingual_cloning
        role: supports
        claim: "Cross-lingual zero-shot voice cloning in flow-matching TTS can be achieved without audio prompt transcripts by using forced alignment to partition training data at word boundaries."
        source: "§4.3, Table 3"
        evidence: "CL-F5 achieves WER 2.496% on a cross-lingual English test set drawn from four unseen languages (German, French, Hindi, Korean), while the F5-TTS baseline cannot perform cross-lingual cloning at all due to its transcript dependency."
        confidence: high
        relevance: high
      - claim_id: clf5_speaking_rate_predictors_reliable_duration
        role: supports
        claim: "Multi-granularity speaking rate predictors trained with ordinal-aware Gaussian loss provide reliable duration estimation for transcript-free flow-matching TTS."
        source: "§4.1, §4.2, Table 1, Table 2"
        evidence: "The phoneme-level predictor (M1) achieves MAE=0.759s on LibriSpeech-PC and enables WER 2.079%, improving over the length-ratio baseline (2.205%); the syllable-level predictor (M2) is preferred for Chinese synthesis."
        confidence: high
        relevance: high
      - claim_id: clf5_removing_transcripts_costs_speaker_sim
        role: complicates
        claim: "Removing audio prompt transcripts from flow-matching TTS incurs a small but consistent cost in speaker similarity."
        source: "§4.2, Table 2, §5"
        evidence: "CL-F5 M1 achieves SIM-o 0.663 vs. 0.668 for the transcript-conditioned baseline on LibriSpeech-PC; the authors also report reduced capacity for transferring accent and emotion."
        confidence: high
        relevance: medium
      - claim_id: clf5_optimal_granularity_language_dependent
        role: refines
        claim: "The optimal linguistic granularity for acoustic speaking rate prediction is language-dependent rather than universal."
        source: "§4.1, Table 1"
        evidence: "Phoneme-level (M1) outperforms syllable-level (M2) for English duration prediction, while M2 outperforms M1 for Chinese on SeedTTS test-zh; word-level (M3) is consistently the weakest across all languages."
        confidence: high
        relevance: medium
    limitations:
      - "Speaking rate predictors are trained exclusively on English and Chinese; genuinely low-resource or typologically distant language generalization remains untested despite empirical cross-lingual demonstration on four additional languages."
      - "Speaker characteristic transfer (accent, emotional cues) is degraded compared to the transcript-conditioned baseline."
    caveats:
      - "The duration-estimation fix addresses a limitation specific to F5-TTS-style flow-matching infilling TTS (duration as a length-ratio of target-to-reference text), rather than a general property of flow matching as a generative objective."

  - id: "2509.14946"
    published_date: "2025-09-18"
    entry_date: "2026-07-19"
