  - id: "interspeech-2025-1066"
    published_date: "2025-08-17"
    entry_date: "2026-07-19"
    year: 2025
    venue: Interspeech
    task: [TTS]
    architecture: [diffusion]
    relevance: medium
    evidence_role:
      - core_evidence
    current_role: frontier_probe
    method_family: []
    claims:
      - claim_id: ebm_score_training_singlestep
        role: supports
        claim: "Score-based training objectives for energy-based models can reduce TTS inference to a single step, bypassing the many-iteration MCMC requirement of NCE-trained EBMs."
        source: "§4.2, Table 2, Table 3"
        evidence: "Both SSM- and delta-loss-trained EBMs obtain their best UTMOSv2 and MOS results after just 1 inference step, versus the 100-step MCMC schedule needed by NCE-trained EBMs from prior work."
        confidence: high
        relevance: low
      - claim_id: ebm_training_objective_shapes_score_geometry
        role: supports
        claim: "The choice of training objective for score-based generative models materially affects the geometry of learned score functions and their suitability for first-order iterative inference."
        source: "§3.2"
        evidence: "Delta loss, which explicitly enforces linear score paths between hypothesis and reference, degrades sharply at 100 steps (UTMOSv2 drops from 3.703 to 2.937) while SSM, which does not enforce this geometry, remains comparatively stable."
        confidence: medium
        relevance: medium
      - claim_id: ssm_fm_formal_equivalence
        role: supports
        claim: "Sliced score matching and flow matching objectives are formally equivalent at a single interpolation timestep, suggesting a deeper structural connection between energy-based and flow-based TTS training regimes."
        source: "§3.3"
        evidence: "The paper derives that its delta-loss objective (equation 9) is formally equivalent to the flow-matching objective (equation 10) when t=0, connecting EBM score training to the continuously-interpolated vector field used in rectified-flow-style TTS."
        confidence: high
        relevance: high
      - claim_id: ebm_mos_utmos_divergence
        role: complicates
        claim: "Automatic MOS predictors and subjective listening scores can diverge for EBM-based TTS systems, limiting the reliability of UTMOSv2 as a sole quality proxy in non-standard synthesis paradigms."
        source: "§4.2, §4.3"
        evidence: "Delta loss produces a low UTMOSv2 score (2.959) but a competitive subjective MOS (3.95 ± 0.05), with far fewer low listener ratings than SSM despite comparable mean MOS."
        confidence: medium
        relevance: low
    limitations:
      - "Experiments use only single-speaker LJSpeech with a Tacotron 2 + mel + HiFi-GAN backbone substantially behind current codec-based or DiT-based practice, so it is untested whether the flow-matching-equivalence finding transfers to modern flow-matching TTS architectures."
      - "The subjective evaluation uses only 3 listeners and 100 test clips, giving insufficient statistical power to draw strong conclusions."
    caveats:
      - "This paper's architecture tag is diffusion, not flow-matching; its relevance to this concept is the theoretical bridge it draws between its delta-loss EBM objective and the flow-matching objective, not an implementation of flow matching itself."

