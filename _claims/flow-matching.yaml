  - id: "2025.acl-long.1043"
    published_date: "2025-07-27"
    entry_date: 2026-06-24
    year: 2025
    venue: ACL
    task: [TTS]
    architecture: [flow-matching, hybrid]
    relevance: high
    evidence_role:
      - core_evidence
      - acceleration_evidence
      - architecture_variant
    current_role: active_evidence
    method_family: [fm_acceleration]
    claims:
      - claim_id: ozspeech_learned_prior_single_step
        role: supports
        claim: "Replacing Gaussian noise with a learned prior as the starting point for flow matching reduces the number of required inference steps to one without needing a separate distillation stage."
        source: "§3.1, §3.3"
        evidence: "OZSpeech's OT-CFM Vector Field Estimator regresses from learned prior codes x_pr to data x_1 rather than from Gaussian noise; the prior time τ is learned implicitly, and the system achieves NFE=1 at inference without any distillation."
        confidence: high
        relevance: high
      - claim_id: ozspeech_otcfm_data_hungry
        role: supports
        claim: "Flow-matching TTS systems trained on traditional OT-CFM are data-hungry and fail to generalise when retrained on limited data, while neural codec-based systems remain effective with as few as 500 hours."
        source: "§4.2, Table 1"
        evidence: "F5-TTS (OT-CFM, 95K hours) achieves WER 0.24% on LibriSpeech test-clean; OZSpeech (learned-prior CFM, 500 hours) achieves WER 0.05%, demonstrating that the learned prior reduces data requirements by ~190x."
        confidence: high
        relevance: high
      - claim_id: ozspeech_noisy_prompt_degradation
        role: supports
        claim: "Zero-shot TTS systems trained exclusively on clean prompts degrade substantially in intelligibility when given noisy reference audio, with autoregressive codec models being especially vulnerable."
        source: "§4.4, Table 4"
        evidence: "VALL-E reaches WER 93% at 0 dB SNR noisy prompts; OZSpeech maintains WER 0.05–0.06 across all SNR levels, attributed to the prior's learned distribution being less sensitive to reference audio quality."
        confidence: high
        relevance: medium
      - claim_id: ozspeech_factorised_codec_tradeoff
        role: supports
        claim: "Factorised codec representations that balance acoustic and semantic attributes trade perceptual naturalness (UTMOS) for intelligibility (WER) relative to codecs that prioritise acoustic fidelity."
        source: "§4.2"
        evidence: "OZSpeech using FACodec achieves WER 0.05% but UTMOS 3.15, compared to F5-TTS's WER 0.24% but UTMOS 3.76; the codec design choice explicitly trades naturalness for intelligibility and speed."
        confidence: high
        relevance: low
      - claim_id: ozspeech_noisy_finetuning_recovery
        role: supports
        claim: "Fine-tuning a zero-shot TTS model on noise-augmented prompts preserves intelligibility and substantially recovers acoustic quality metrics under low-SNR conditions."
        source: "§4.4, Table 4"
        evidence: "Fine-tuning OZSpeech with noisy prompts at various SNR levels maintains WER at 0.05–0.06 across all SNR conditions while improving F0-RMSE and UTMOS relative to the no-fine-tuning baseline at low SNR."
        confidence: high
        relevance: low
    limitations:
      - "UTMOS and speaker similarity lag behind F5-TTS (3.15 vs. 3.76); the learned-prior approach trades perceptual naturalness for intelligibility and single-step speed."
      - "FACodec dependency means reproduction requires NaturalSpeech 3's codec infrastructure, limiting accessibility."
      - "Duration predictor rounding errors (integer quantization of phoneme durations) introduce temporal artifacts."
    caveats:
      - "The single-step result is achieved through a fundamentally different mechanism than distillation-based one-step models (e.g. DMD); the learned prior absorbs the complexity previously resolved by multi-step integration, making the comparison to multi-step systems non-trivial."
      - "Training data is 500 hours of LibriTTS only; scale and generalization to in-the-wild or multilingual settings are not tested."

  - id: "2502.07243"
    published_date: "2025-02-11"
    entry_date: 2026-06-24
    year: 2025
    venue: ICLR
    task: [TTS, VC]
    architecture: [autoregressive-LM, flow-matching, hybrid]
    relevance: medium
    evidence_role:
      - architecture_variant
      - control_evidence
    current_role: active_evidence
    method_family: [ar_fm_hybrid]
    claims:
      - claim_id: vevo_vqvae_bottleneck_disentanglement
        role: supports
        claim: "The VQ-VAE codebook vocabulary size can function as a self-supervised information bottleneck for progressive disentanglement of timbre, style, and linguistic content in self-supervised speech representations."
        source: "§3.1, Table 2"
        evidence: "Reducing VQ-VAE codebook size from 4,096 (content-style tokens, timbre removed) to 32 (content tokens, timbre and most style removed) is confirmed by vocabulary size ablation; reducing below 32 causes a large WER increase marking the linguistic boundary."
        confidence: high
        relevance: low
      - claim_id: vevo_annotation_free_style_imitation
        role: supports
        claim: "Zero-shot style imitation (accent and emotion conversion) without annotation can match or exceed supervised baselines that rely on parallel corpora and style labels."
        source: "§4.3, Table 4"
        evidence: "Vevo-Style outperforms ASR-AC, VoiceShop, Conv-Speak (accent) and Emovox (emotion) on N-CMOS and style accuracy metrics despite using no parallel corpus, no style labels, and no text transcriptions."
        confidence: high
        relevance: low
      - claim_id: vevo_hybrid_two_stage_decoupling
        role: supports
        claim: "Hybrid two-stage pipelines combining autoregressive style modeling with flow-matching acoustic generation can decouple style and timbre control more effectively than single-stage in-context learning approaches."
        source: "§3.4, Tables 3–5"
        evidence: "Vevo separates content-style token generation (AR transformer) from timbre conditioning (flow-matching acoustic model with span-masking); ablations confirm each stage contributes independently to style and timbre fidelity."
        confidence: high
        relevance: medium
      - claim_id: vevo_ar_intelligibility_tradeoff
        role: supports
        claim: "Autoregressive models in zero-shot TTS consistently trade intelligibility (higher WER) for stronger style imitation compared to non-autoregressive alternatives trained on the same data."
        source: "§4.4, Tables 5, 9"
        evidence: "Vevo-TTS (AR stage) achieves WER 12.07% on ACCENT+EMOTION vs. Voicebox 9.41%, while leading on emotion similarity (4.03) and accent similarity (4.12) MOS; the intelligibility-style tradeoff is consistent across evaluations."
        confidence: high
        relevance: medium
      - claim_id: vevo_duration_reduction_style_transfer
        role: supports
        claim: "Duration reduction on content tokens improves style transfer fidelity by removing unit-level duration patterns that encode source speaking style."
        source: "§4.5, Table 6"
        evidence: "Duration reduction (collapsing consecutive duplicate content tokens before AR generation) improves style imitation metrics and reduces inference input length to 42% without degrading intelligibility."
        confidence: high
        relevance: low
    limitations:
      - "Training is restricted to English audiobook speech (60K hours, clean); multilingual and expressive speech generalization are not tested."
      - "Style imitation evaluations (Table 4) use demo website samples from baselines rather than a controlled shared test set, making comparisons approximate."
    caveats:
      - "The flow-matching component in Vevo is the Stage 2 acoustic model only (span-masking timbre conditioning); the primary novelty is the VQ-VAE bottleneck disentanglement, not the flow-matching design itself."
      - "The AR content-style model (463M parameters) introduces sequential decoding latency; the overall system is not optimized for real-time inference."

  - id: "2502.17239"
    published_date: "2025-02-24"
    entry_date: 2026-06-24
    year: 2025
    venue: arXiv
    task: [SCA, TTS]
    architecture: [autoregressive-LM, flow-matching, hybrid]
    relevance: low
    evidence_role:
      - architecture_variant
    current_role: minor
    method_family: [ar_fm_hybrid]
    claims:
      - claim_id: baichuan_multivq_semantic_alignment
        role: supports
        claim: "Multi-codebook RVQ tokenizers with semantic alignment objectives better preserve both acoustic and linguistic content than single-codebook designs, with each additional layer reducing ASR error substantially up to 8 layers."
        source: "§3.1, Table 1"
        evidence: "8-layer VQ achieves WER 5.3% vs. 26.2% for 1-layer on LibriSpeech; adding layers from 1 to 8 shows monotonic WER improvement while maintaining Mel MAE reconstruction quality."
        confidence: high
        relevance: low
      - claim_id: baichuan_staged_pretraining_intelligence
        role: supports
        claim: "Staged pretraining (frozen LLM first, then joint training) measurably reduces intelligence degradation in end-to-end speech LMs relative to single-stage joint training."
        source: "§3.3.1, Table 5"
        evidence: "Two-stage training achieves sStoryCloze 79.6 vs. 77.5 for single-stage joint training, closing roughly 2 percentage points of the gap to the pure-text T→T baseline of 83."
        confidence: high
        relevance: low
      - claim_id: baichuan_text_guided_aligned_generation
        role: supports
        claim: "Text-guided aligned generation, where the model completes text tokens before emitting the corresponding audio tokens, mitigates semantic incoherence in speech LM outputs."
        source: "§3.3, §4.1"
        evidence: "Baichuan-Audio alternates text and audio token generation with modality-switching special tokens; ablations confirm that dropping this alignment degrades both intelligibility and reasoning benchmark scores."
        confidence: high
        relevance: low
      - claim_id: baichuan_fm_postvq_quality_recovery
        role: supports
        claim: "Flow-matching decoders trained as post-VQ refinement stages recover significant audio quality lost during quantisation, with UTMOS improvements of 0.6 points possible without retraining the LLM."
        source: "§3.2, Table 3"
        evidence: "U-Net OT-CFM decoder raises UTMOS from 3.43 (VQ-only) to 4.05 on LibriSpeech-dev, approaching ground truth (4.08); WER also improves from 2.84% to 2.78%, added without LLM retraining."
        confidence: high
        relevance: high
      - claim_id: baichuan_s2s_quality_penalty
        role: supports
        claim: "End-to-end speech LMs evaluated in S→S mode exhibit notably lower benchmark performance than the same model evaluated in S→T mode, indicating that audio token generation itself introduces a quality penalty beyond the comprehension step."
        source: "§4.3, Table 8"
        evidence: "Baichuan-Audio consistently scores lower in S→S vs S→T mode across all OpenAudioBench tasks; the gap is largest on Reasoning QA and AlpacaEval, where audio generation quality compounds errors."
        confidence: high
        relevance: low
    limitations:
      - "TTS quality evaluation is limited to an in-house test set (MED-TTS); no comparison against standard TTS benchmarks or dedicated TTS systems."
      - "The intelligence gap to GPT-4o-Audio remains 15-20 percentage points on QA tasks, and the paper does not identify the architectural factors responsible."
    caveats:
      - "The flow-matching decoder in Baichuan-Audio is a post-VQ refinement component that follows Matcha-TTS and CosyVoice closely; it is an engineering integration rather than a flow-matching advance."
      - "Results for the flow-matching decoder are measured only on UTMOS and WER on LibriSpeech-dev; no speaker similarity, naturalness MOS, or comparison to dedicated TTS systems is reported."

  - id: "2503.14345"
    published_date: "2025-03-18"
    entry_date: 2026-06-24
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching]
