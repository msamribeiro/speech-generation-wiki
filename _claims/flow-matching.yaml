        source: "§4.2, Table 1, Table 2"
        evidence: "The SSL-matching-only ablation achieves SSIM 0.709 versus 0.692 for NeuCoSVC (marginal improvement), while adding speaker embeddings with the full dual cross-attention module raises SSIM to 0.754."
        confidence: high
