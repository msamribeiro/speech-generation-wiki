        source: "§ Proposed Method — Emotional Control, Table 2"
        evidence: "The GRL-trained emotion perceiver, combined with a frozen speaker perceiver, lets IndexTTS2 dominate baselines on emotional-test-set EMOS (4.22 vs. 3.37 for MaskGCT) while retaining separate speaker conditioning."
        confidence: high
        relevance: low
      - claim_id: indextts2_gpt_latent_fusion_improves_clarity_under_emotion
