  - id: fm_otcfm_data_requirements
    claim: "Standard OT-CFM flow matching for mel-spectrogram TTS is data-hungry, requiring tens of thousands of hours to achieve competitive intelligibility; learned prior variants reduce this requirement by orders of magnitude."
