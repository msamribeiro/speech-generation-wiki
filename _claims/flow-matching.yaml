    current_role: active_evidence
    method_family: [fm_acceleration]
    claims:
      - claim_id: epss_nonuniform_schedule_reduces_steps
        role: supports
        claim: "Non-uniform ODE time-step schedules can reduce flow-matching TTS inference to 7 steps with minimal quality degradation when steps are pruned from the later, near-linear portion of the trajectory."
        source: "§3.2, §4.3, Table 1"
        evidence: "EPSS reduces F5-TTS from 32 to 7 NFE (RTF 0.030 vs. 0.123, a 4x speedup) while WER on Seed-TTS test-en moves only from 1.70% to 1.74%, versus 7.96% for naive uniform 7-step sampling on test-zh."
        confidence: high
        relevance: high
      - claim_id: epss_early_phase_disproportionately_critical
        role: supports
        claim: "The early, high-curvature phase of flow-matching inference in TTS is disproportionately critical for quality, and uniform step reduction degrades performance primarily by under-sampling this phase."
        source: "§3.1, §4.4, Table 3"
        evidence: "PCA-based trajectory analysis shows the early ODE phase is highly curved and requires dense sampling, while ablation confirms pruning early steps degrades quality (2.71% WER) more than pruning later steps (2.41% WER) at matched step count."
        confidence: high
        relevance: high
      - claim_id: epss_generalises_across_fm_architectures
        role: supports
        claim: "Training-free step scheduling methods generalise across flow-matching TTS architectures without requiring model-specific retraining."
        source: "§4.3, Table 1"
        evidence: "EPSS is applied without retraining to both F5-TTS (336M) and E2 TTS (333M), recovering most of the quality lost by naive step reduction in both cases."
        confidence: medium
        relevance: medium
      - claim_id: epss_low_nfe_abrupt_degradation
        role: complicates
        claim: "At very low NFE (below 6 steps), quality degradation in flow-matching TTS becomes abrupt rather than gradual, suggesting a practical floor for inference reduction without distillation."
        source: "§4.4, Table 3"
        evidence: "Ablation shows quality degrades sharply below 6 NFE, establishing an empirical floor for training-free step-schedule pruning absent distillation-based acceleration."
        confidence: medium
        relevance: medium
    limitations:
      - "EPSS is validated only on F5-TTS and E2 TTS, both mel-spectrogram-based flow-matching systems with similar backbone design; applicability to token-based or vocoder-free flow-matching systems is unexplored."
      - "No subjective listening tests (MOS) are reported; quality assessment relies entirely on UTMOS, WER, and speaker cosine similarity."
    caveats:
      - "EPSS's time-step configuration is determined empirically by visual trajectory inspection rather than a principled search procedure, and the paper does not explore combining it with distillation-based acceleration (DMD, consistency distillation), leaving open whether the two acceleration classes stack."

