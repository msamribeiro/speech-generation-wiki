  - id: "2506.13053"
    entry_date: 2026-07-15
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching]
    relevance: high
    evidence_role:
      - core_evidence
      - acceleration_evidence
      - architecture_variant
    current_role: active_evidence
    method_family: [pure_fm]
    claims:
      - claim_id: zipvoice_compact_matches_larger_models
        role: supports
        claim: "Compact flow-matching TTS models can match the speech quality of models two to eight times larger when architectural components are selected for per-parameter efficiency rather than chosen by default from the diffusion literature."
        source: "§V.A, Table I"
        evidence: "ZipVoice (123M params) matches or exceeds the speech quality of F5-TTS (336M) and other baselines 2-8x larger by repurposing the Zipformer ASR encoder as the flow-matching vector field estimator backbone."
        confidence: high
        relevance: high
      - claim_id: zipvoice_uniform_upsampling_beats_filler_padding
        role: supports
        claim: "In non-autoregressive TTS without explicit duration prediction, a simple uniform-duration upsampling assumption provides substantially better initial alignment than filler-token padding, yielding large intelligibility improvements without additional parameters."
        source: "§II.D, §V.C, Table IV"
        evidence: "Removing average upsampling (reverting to filler-token-only padding, the E2-TTS approach) raises WER from 1.69% to 20.19% on LibriSpeech-PC test-clean, with the parameter-free uniform-duration heuristic matching or exceeding F5-TTS's learned ConvNeXt refinement."
        confidence: high
        relevance: high
      - claim_id: zipvoice_cfg_distillation_eliminates_double_pass
        role: supports
        claim: "Flow distillation that conditions the student on CFG strength eliminates the doubled forward-pass cost of classifier-free guidance while preserving its quality benefit, outperforming consistency distillation and ReFlow at 4 NFEs."
        source: "§II.E, §V.E, Table VI"
        evidence: "ZipVoice-Distill, conditioned on CFG strength via a Fourier embedding, internalizes CFG behavior to bypass the doubled evaluation cost at runtime, outperforming consistency distillation and ReFlow baselines at 4 NFEs in the paper's distillation-method comparison."
        confidence: high
        relevance: high
      - claim_id: zipvoice_zipformer_inductive_bias_transfers
        role: supports
        claim: "The U-Net-style multi-resolution structure and convolutional modules in Zipformer transfer the inductive biases beneficial for diffusion-family models from ASR into TTS vector field estimation, with ablation evidence showing each structural element independently contributes to intelligibility and naturalness."
        source: "§II.C, §V.D, Table V"
        evidence: "Component ablation confirms the U-Net-style structure, convolutional modules, and attention-weight reuse mechanism each independently improve intelligibility and naturalness metrics relative to a standard Transformer flow-matching backbone."
        confidence: high
        relevance: medium
    limitations:
      - "Speaker similarity (SIM-o) for ZipVoice-Distill is consistently below F5-TTS and larger NAR baselines despite quality and intelligibility advantages, and the cause is not mechanistically isolated."
      - "Average upsampling assumes uniform token durations within a sentence, a poor model of natural prosody that may limit expressiveness for prosodically varied speech."
    caveats:
      - "This paper directly extends the implicit-alignment findings of E2 TTS (2406.18009) and F5-TTS (2025.acl-long.313) in this corpus, replacing ConvNeXt text refinement with a parameter-free uniform-duration heuristic."
      - "The CFG-strength-conditioned distillation technique is a distinct acceleration mechanism from the Bespoke Solver (Audiobox), DMD (ARDiT), and learned-prior (OZSpeech) mechanisms already tracked in the fm_inference_acceleration cluster."

  - id: "2507.03887"
    entry_date: 2026-07-15
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching]
    relevance: low
    evidence_role:
      - infrastructure
    current_role: minor
    method_family: [pure_fm]
    claims:
      - claim_id: traceabletts_joint_training_improves_attribution
        role: supports
        claim: "Joint training of a TTS generator and a speech discriminator with aligned optimization objectives improves out-of-domain generalization of model-specific attribution compared to training the discriminator independently."
        source: "§5.4, Table 3"
        evidence: "Jointly training F5-TTS and a wav2vec 2.0 + LCNN discriminator improves out-of-domain AUC from 0.8823 to 0.9421 and EER from 18.99% to 11.50% relative to independent discriminator training."
        confidence: high
        relevance: low
      - claim_id: traceabletts_preserves_quality
        role: supports
        claim: "Watermark-free TTS traceability through joint training can preserve or slightly improve synthesis quality relative to the base model."
        source: "§5.6, Table 5"
        evidence: "The jointly trained F5-TTS achieves WER 2.033% (vs. 2.202% baseline), UTMOS 3.958 (vs. 3.926), and SIM 0.661 (vs. 0.659) on LibriSpeech-PC test-clean, indicating no quality penalty from the traceability objective."
        confidence: high
        relevance: low
      - claim_id: traceabletts_vulnerable_noise_pitch
        role: complicates
        claim: "TTS attribution discriminators based on audio feature patterns are vulnerable to additive noise and pitch manipulation, but robust to common audio processing operations."
        source: "§5.5, Table 4"
        evidence: "Out-of-domain AUC drops by 0.1233 under additive noise (MUSAN) and 0.0901 under pitch shifting, while remaining stable under resampling, time-stretching, reverb, volume scaling, and MP3 compression."
        confidence: high
        relevance: low
      - claim_id: traceabletts_differentiability_precondition
        role: complicates
        claim: "Differentiability of the full synthesis pipeline from text input to output waveform is a necessary precondition for watermark-free traceability via joint generator-discriminator training, excluding discrete token-based TTS architectures."
        source: "§6"
        evidence: "The paper explicitly notes VALL-E-type models using non-differentiable discrete token generation are incompatible with the framework because the discriminator's loss cannot backpropagate through discrete generation."
        confidence: high
        relevance: medium
    limitations:
      - "Evaluated on a single TTS backbone (F5-TTS) with a single discriminator architecture; out-of-domain testing uses only three other TTS systems."
      - "The framework is architecturally restricted to end-to-end differentiable TTS models, ruling out discrete token-based systems."
    caveats:
      - "Flow matching (F5-TTS) is used here purely as the differentiable generator backbone chosen for compatibility with backpropagation through the traceability discriminator; the paper does not advance flow-matching methodology itself."
      - "The differentiability-precondition finding (claim 4) is the one point of genuine relevance to flow matching's comparative architecture advantages: it identifies end-to-end differentiability as an advantage of flow-matching/diffusion TTS over discrete-token AR TTS for this specific application."

  - id: "2507.04349"
    entry_date: 2026-07-15
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching]
    relevance: high
    evidence_role:
      - control_evidence
      - architecture_variant
    current_role: active_evidence
    method_family: [pure_fm]
    claims:
      - claim_id: ttsctrlnet_frozen_adapter_less_data
        role: supports
        claim: "Frozen-backbone adapter training can add fine-grained, time-varying conditioning to pretrained flow-matching TTS with substantially less data than full fine-tuning."
        source: "§1, §4.4, Table 5"
        evidence: "ControlNet blocks trained on ~400 hours of public emotion data achieve higher Emo-SIM and Aro-Val SIM than EmoCtrl-TTS, which requires 87k hours including 27k hours of in-house emotion data, while preserving the frozen backbone's zero-shot voice cloning capability."
        confidence: high
        relevance: medium
      - claim_id: ttsctrlnet_emotion_intelligibility_tradeoff
        role: complicates
        claim: "Stronger emotion conditioning in flow-matching TTS introduces a trade-off with text intelligibility."
        source: "§4.3.4, Table 4"
        evidence: "Increasing the ControlNet control scale lambda from 0 to 1 consistently improves emotion similarity metrics but raises WER from 2.9% to 9.58% on the EMO-Change benchmark."
        confidence: high
        relevance: medium
      - claim_id: ttsctrlnet_dit_blocks_unequal_contribution
        role: supports
        claim: "Transformer blocks in DiT-based TTS models contribute unequally to speaker identity and text intelligibility, and block selection is important for conditional control."
        source: "§4.3.1, Figure 2, Table 3"
        evidence: "Layer-wise skip analysis on F5-TTS shows removing specific blocks dramatically increases WER and reduces speaker similarity; excluding those critical blocks from ControlNet connections yields WER 0% versus 8.9% WER when all blocks are connected."
        confidence: high
        relevance: medium
      - claim_id: ttsctrlnet_emotion_concentrated_early_flow_steps
        role: supports
        claim: "Emotion in a flow-matching trajectory is concentrated at early denoising steps, and restricting conditioning to this interval improves both efficiency and intelligibility."
        source: "§4.3.2, Table 1, Table 8"
        evidence: "Training with flow step interval [0, 0.1] achieves Emo-SIM 0.565 and 1.9% WER, whereas training on the full [0, 1] interval degrades to Emo-SIM 0.389 with 0% WER; restricting ControlNet to early steps also reduces per-sample inference time from 5.4s to 4.2s."
        confidence: high
        relevance: high
      - claim_id: ttsctrlnet_ser_needs_temporal_smoothing
        role: complicates
        claim: "Frame-level emotion features from self-supervised SER models require temporal smoothing to serve as effective conditioning signals for TTS."
        source: "§4.3.3, Table 2"
        evidence: "Using emotion window size of 1 (no smoothing) produces Emo-SIM 0.500 and WER 4.7%; a window size of 30 achieves Emo-SIM 0.565 and WER 1.9%, showing token-level SER features without pooling lose emotional coherence."
        confidence: high
        relevance: low
    limitations:
      - "Most baseline comparisons use values reported in a prior paper (EmoCtrl-TTS) rather than independently reproduced, limiting reliability of direct numerical comparisons."
      - "The underlying SER model cannot reliably recognize non-verbal vocalizations (laughing, crying), restricting expressiveness relative to systems with dedicated non-verbal encoders."
    caveats:
      - "The finding that emotion is concentrated at early flow steps is a novel structural insight into flow-matching trajectories specifically, distinct from prior acceleration or alignment findings in this corpus, and could generalise to other conditioning types beyond emotion."
      - "The ControlNet mechanism itself is adapted directly from image diffusion (Zhang et al. 2023); this paper's novelty is the flow-matching-specific design choices (selective block connection, emotion-specific flow step, SER window smoothing), not the adapter paradigm itself."

  - id: "2506.09874"
    entry_date: 2026-07-15
    year: 2025
    venue: arXiv
    task: [TTS]
