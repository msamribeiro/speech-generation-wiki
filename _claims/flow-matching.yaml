        claim: "In transformer-based generative models, text-semantic and speaker-acoustic alignment supervision are best applied at different network depths rather than at the same layer."
        source: "§4.2, Table 2"
        evidence: "Layer-wise ablation on F5-TTS Small (18 DiT layers) shows CTC text alignment at layer 8 combined with HuBERT speech alignment at layer 12 (WER 2.226%) outperforms same-layer dual alignment at either layer 8 (3.063%) or layer 12 (2.688%)."
        confidence: high
        relevance: medium
      - claim_id: adma_ssl_teacher_improves_sim
