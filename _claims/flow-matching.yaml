    claims:
      - claim_id: f5rtts_gaussian_reparam_enables_rl
        role: supports
        claim: "Reformulating the output of a flow-matching TTS model as a Gaussian distribution is sufficient to enable standard policy-gradient RL algorithms without architectural redesign."
        source: "§2.2"
        evidence: "F5R-TTS modifies only the final linear layer of the F5-TTS DiT backbone to output a mean and variance instead of a deterministic velocity, leaving the rest of the flow-matching architecture unchanged while enabling GRPO sampling."
        confidence: high
        relevance: high
      - claim_id: f5rtts_grpo_reduces_wer_improves_sim
        role: supports
        claim: "GRPO with WER and speaker-similarity rewards consistently reduces word error rate and increases speaker similarity in non-autoregressive TTS post-training, across diverse Mandarin datasets."
        source: "§3.2.2, Table 1, Table 2"
        evidence: "F5R-TTS reduces WER from 2.10% to 1.48% (29.5% relative) and improves SIM from 0.698 to 0.730 on Seed-TTS-eval test-cn; results replicate on an internal 10,000-hour dataset (18.4% WER reduction, 3.1% SIM improvement)."
        confidence: high
        relevance: high
      - claim_id: f5rtts_rl_improves_noise_robustness
        role: supports
        claim: "RL post-training that optimises speaker-similarity reward also improves robustness to noisy reference audio, not only clean-reference speaker cloning."
        source: "§3.2.2, Table 1"
        evidence: "On the noise-robustness subset with noisy reference audio, F5R-TTS shows a 33.6% relative WER reduction (2.32% to 1.54%), a larger gain than on the clean general set."
        confidence: high
        relevance: medium
      - claim_id: f5rtts_hard_text_limits_rl_gains
        role: complicates
        claim: "Hard text (tongue twisters and repetitive phrasing) degrades all flow-matching TTS variants substantially, and RL training with WER rewards provides smaller relative gains in this regime than on plain text."
        source: "§3.2.2, Table 1"
        evidence: "On the hard set, WER only drops from 11.30% to 10.63% (6.1% relative) versus a 29.5% relative reduction on the general set, showing RL post-training does not resolve difficult phonetic sequences."
        confidence: high
        relevance: medium
      - claim_id: f5rtts_grpo_data_efficient
        role: supports
        claim: "The GRPO phase requires only a small fraction of the pretraining data (100 h out of 7,226 h) and update steps to achieve measurable objective improvements, suggesting that RL fine-tuning is data-efficient for this task."
        source: "§3.1"
        evidence: "The GRPO phase uses only 100 hours of data and 1,100 update steps on 8 A100 GPUs, compared to 1 million pretraining steps, while still yielding substantial WER and SIM gains."
        confidence: medium
        relevance: low
    limitations:
      - "No subjective (MOS or MUSHRA) evaluation is reported; all claimed improvements rely on automatic WER and speaker cosine similarity proxy metrics."
      - "Evaluation is restricted to Mandarin (Seed-TTS-eval test-cn); generalisation to English or other languages is untested."
    caveats:
      - "This is the first paper in this corpus to demonstrate RL post-training for a pure (non-hybrid) flow-matching TTS system, complementing the existing DPO-FM velocity-space cluster which uses a hybrid AR+FM backbone."
      - "The probabilistic output reformulation is a general technique applicable to any deterministic continuous-output generative model with a final linear layer, not specific to F5-TTS."

  - id: "iclr-2025-tQ1PmLfPBL"
    entry_date: 2026-07-15
