        role: supports
        claim: "Zero-shot voice conversion without explicit speaker verification embeddings can achieve higher speaker similarity than systems that rely on them."
        source: "§4.2, Tables 2-3"
        evidence: "SemAlignVC achieves the highest SMOS (3.29) and speaker similarity across three embedding models among KNNVC, HierSpeech++, and UniAudio, despite using only a reference mel excerpt (fed to the flow-matching acoustic model) rather than a speaker embedding."
