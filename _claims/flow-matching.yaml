        source: "§3.3.3, Table 7"
        evidence: "Whisper ASR showed no benefit from the clarity-mode duration manipulation (17.68% vs. 17.10% WER for base) while L2 human listeners achieved their lowest WER (15.15%) with clarity mode, and ASR's error pattern diverged fundamentally from L2 listener errors."
        confidence: high
        relevance: low
      - claim_id: l2clarity_global_slowing_hurts_social_perception
        role: complicates
        claim: "Global speech rate reduction is an effective clarity strategy for L2 listener experience."
        source: "§3.3.1, §3.3.2, Tables 2, 3, 5, 6"
        evidence: "Full-stretch TTS scored significantly lower on naturalness (nMOS ~4.2 vs. ~7.0-7.9 for other conditions), prosody, encouragement, and respect in both experiments, despite the duration manipulation being applied via the same flow-matching duration predictor as clarity mode."
        confidence: medium
        relevance: low
      - claim_id: l2clarity_subjective_intelligibility_diverges_from_accuracy
        role: complicates
        claim: "L2 listeners' subjective perceived intelligibility judgments reflect their actual comprehension accuracy for TTS systems."
        source: "§3.3.1, §3.3.2, §5"
        evidence: "Despite clarity mode producing lower objective WER than the emphasis condition in both experiments, L2 participants consistently rated emphasis as most intelligible subjectively, unaware of the underlying duration mechanism."
        confidence: medium
        relevance: low
    limitations:
      - "The study is restricted to French-L1 English-L2 speakers at relatively high proficiency, covering only three English tense/lax vowel pairs; generalisability to other L1 backgrounds or vowel distinctions is untested."
      - "The 1.6x duration stretch factor was calibrated empirically and may not be optimal across different base speech rates or speaker styles."
    caveats:
      - "No new flow-matching model training occurs in this paper; the contribution is an inference-time phoneme-selective duration multiplier applied via a Hadamard product on Matcha-TTS's existing duration-predictor output, with no change to the flow-matching backbone itself."

