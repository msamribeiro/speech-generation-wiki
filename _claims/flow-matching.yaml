        claim: "Modality-alignment spoken language models can internalize paralinguistic cues (dialect, age, emotion, non-speech vocalizations) through staged training without requiring explicit user instructions at inference time."
        source: "§5.2, Table 7, Table 8"
        evidence: "GOAT-SLM achieves 50.73% average dialect-following accuracy across five Chinese dialects without explicit prompting, versus 18.91% for the next-best model, and 40.91% on non-speech vocal response where all other models score below 10%."
