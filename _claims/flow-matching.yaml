        source: "§E, Table 15, Table 16"
        evidence: "PeriodWave at 16 steps runs at 7.48x real-time versus HiFi-GAN's 166.70x; even PeriodWave at 2 steps (56.36x) remains slower than HiFi-GAN despite already outperforming it on all quality metrics."
        confidence: high
        relevance: high
      - claim_id: periodwave_iterative_reduces_mismatch
        role: supports
        claim: "Iterative waveform generation reduces train-inference mismatch artefacts in two-stage TTS relative to one-step GAN vocoders."
        source: "§4.7, Table 9, §G"
        evidence: "In zero-shot TTS with ARDiT-TTS acoustic features, PeriodWave+FreeU achieves MOS 4.07 versus BigVGAN's 4.03, attributed to iterative refinement correcting imperfections in generated mel-spectrograms rather than propagating them."
        confidence: medium
        relevance: medium
      - claim_id: periodwave_streaming_codec_decoding
        role: supports
        claim: "Flow-matching vocoders can decode neural codec tokens with streaming generation and minimal quality degradation."
        source: "§5, Table 10, Table 11"
        evidence: "PeriodWave trained for parallel generation from Mimi (Q=8) tokens achieves CER 2.5% versus the Mimi decoder's 3.07%; streaming with single-token delay and 2-step sampling maintains comparable quality."
        confidence: high
        relevance: medium
    limitations:
      - "At 16 steps, PeriodWave runs at 7.48x real-time, substantially slower than one-step GAN vocoders (HiFi-GAN 166x, BigVGAN 38x)."
