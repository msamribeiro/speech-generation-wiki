      - control_evidence
    current_role: active_evidence
    method_family: [fm_auxiliary_attribute]
    claims:
      - claim_id: stochastic_prosody_naturalness_diversity_parity
        role: supports
        claim: "Stochastic prosody predictors achieve naturalness parity with human recordings while enabling prosodic diversity that deterministic predictors cannot produce."
        source: "§3.4, Figure 5, Figure 6"
        evidence: "Rectified flow at 0.4 temperature shows no statistically significant difference from human naturalness ratings (Kruskal-Wallis, Dunn post-hoc) across 40 Prolific raters, while the deterministic baseline achieves highest naturalness but lowest diversity."
        confidence: high
        relevance: high
      - claim_id: stochastic_prosody_cascade_vs_joint
        role: refines
        claim: "For explicit prosody modeling, cascaded prediction of prosodic features outperforms joint prediction for duration, but the ordering of pitch and energy within the cascade has negligible impact."
        source: "§3.3, Table 1"
        evidence: "Joint prediction yields 17% higher duration Jensen-Shannon divergence (0.562) than cascading (0.481), while pitch-first and energy-first orderings differ by less than 0.005 across all prosodic parameters, a pattern that holds across NF, CFM, and RF predictors."
        confidence: medium
        relevance: low
      - claim_id: stochastic_prosody_naturalness_diversity_tradeoff
        role: complicates
        claim: "Naturalness and prosodic diversity are inversely correlated, constraining simultaneous optimization of both properties in TTS."
        source: "§3.4, Figure 5, Figure 6"
        evidence: "Subjective ratings show no system, including the human baseline itself, achieves both maximal naturalness and maximal diversity simultaneously."
        confidence: medium
        relevance: medium
      - claim_id: stochastic_prosody_temperature_control
        role: supports
        claim: "Sampling temperature in generative prosody predictors enables effective runtime control over prosodic variability without retraining."
        source: "§3.3, Figure 2, Figure 3"
        evidence: "Pitch contour and duration variance increase monotonically with temperature for all three stochastic methods (NF, CFM, RF), following a near-exponential relationship."
        confidence: high
        relevance: medium
    limitations:
      - "Experiments are restricted to read speech (LibriTTS); conversational speech, where stochastic duration prediction has shown larger benefits in prior work, is explicitly deferred to future work."
      - "Synthetic KDE prosodic distributions remain consistently narrower and more unimodal than human reference distributions, suggesting current predictor capacity is a limiting factor."
    caveats:
      - "The flow-matching (CFM) and rectified-flow (RF) predictors here are applied as modular variance predictors for pitch/energy/duration within a FastSpeech2-style pipeline, not as the primary acoustic-modeling mechanism; the CFM postnet inherited from Matcha-TTS is held at zero temperature throughout so all measured stochasticity originates from the prosody predictors."

