      - core_evidence
    current_role: active_evidence
    method_family: [ar_fm_hybrid]
    claims:
      - claim_id: intp_cross_model_pairs_larger_gains
        role: supports
        claim: "Preference alignment with cross-model preference pairs yields larger intelligibility improvements than single-model self-comparison pairs for TTS post-training."
        source: "§5.2, Table 5"
        evidence: "Ablation in Table 5 shows inter-pairs (cross-model comparisons) and intra-pairs are complementary; combining all three pair types (intra, inter, perturbed) gives the largest WER reductions across all domain types."
        confidence: high
        relevance: low
      - claim_id: dpo_fm_velocity_space_objective
        role: supports
        claim: "DPO objectives can be derived for flow-matching TTS architectures by operating in velocity space, without requiring explicit reward models."
        source: "§4.2, §4.3"
        evidence: "DPO-FM shows the log-ratio of learned vs. reference velocity fields at each timestep t is equivalent to the MSE difference in predicted velocities, yielding a tractable velocity-space DPO loss without sampling."
        confidence: high
        relevance: high
      - claim_id: intp_cross_lingual_generalisation
        role: supports
        claim: "Intelligibility gains from preference alignment on English and Chinese data generalize to unseen languages (Japanese, Korean, German, French) without degrading speaker similarity."
        source: "§5.1, Table 10"
        evidence: "Ints model aligned on EN+ZH INTP data shows WER reductions across all four unseen languages in Table 10 with SPK-SIM essentially unchanged (±0.01)."
        confidence: high
        relevance: low
      - claim_id: intp_weak_to_strong_generalisation
        role: supports
        claim: "Preference datasets constructed from weaker TTS generators effectively improve stronger models outside the training distribution, demonstrating weak-to-strong generalization in speech alignment."
        source: "§5.1, Table 4"
        evidence: "INTP built from ARS/F5-TTS/MaskGCT improves CosyVoice 2 (stronger model not in data distribution) from average WER 13.09 to 10.56 with consistent N-CMOS improvements."
        confidence: high
        relevance: low
      - claim_id: intp_iterative_alignment_diminishing_returns
        role: supports
        claim: "Iterative preference alignment yields diminishing returns across rounds, suggesting that base model capability is the primary ceiling on alignment effectiveness."
        source: "§5.3, Table 6"
        evidence: "Ints v1 (round 1 INTP alignment) reaches average WER 7.96%; Ints v2 (iterative, round 2 data from v1) reaches 7.10% — a smaller improvement than the first round (11.97 → 7.96)."
        confidence: high
        relevance: low
    limitations:
