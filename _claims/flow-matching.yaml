      - claim_id: tcsinger2_f0_supervision_improves_quality
        role: supports
        claim: "F0 supervision applied to intermediate transformer representations improves both synthesis quality and style fidelity in zero-shot singing voice synthesis."
        source: "§3.4, Table 4"
        evidence: "Removing F0 supervision from the flow-matching transformer's first block output causes CMOS-Q -0.33 and CMOS-S -0.24 in style transfer, and CMOS-Q -0.31 and CMOS-C -0.27 in style control."
        confidence: high
        relevance: high
      - claim_id: tcsinger2_style_annotation_costly
        role: complicates
        claim: "Multi-level style control via natural language prompts in singing synthesis requires costly manual annotation, limiting dataset scale and introducing labelling errors."
        source: "§6, Appendix B"
        evidence: "Style labels were annotated by music experts at $300/hour then converted to natural language via GPT-4o; the paper cites labelling cost and annotation errors as primary limitations constraining generalisation."
        confidence: high
        relevance: low
    limitations:
      - "Training and test sets share the same underlying singer pool; 30 'unseen' singers are held out from a pool drawn from the same data collection, limiting assessment of true out-of-distribution generalisation."
      - "Generation speed does not meet real-time industrial requirements despite 25-step ODE inference; streaming inference is deferred to future work."
    caveats:
      - "The mixture-of-experts routing and F0 supervision are implemented directly inside the flow-matching transformer's blocks, making this one of the more architecturally direct flow-matching contributions among singing-synthesis papers in this concept, rather than a case of flow matching used as an unmodified downstream component."

  - id: "2507.20140"
    published_date: "2025-07-27"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching]
    relevance: medium
    evidence_role:
      - control_evidence
    current_role: frontier_probe
    method_family: [pure_fm]
    claims:
      - claim_id: tgu_randomization_unlearning_suppresses_identity
        role: supports
        claim: "Machine unlearning via randomization-based training objectives can selectively suppress specific speaker identities in zero-shot TTS while preserving synthesis quality for retained speakers."
        source: "§5.2, Table 1"
        evidence: "TGU, implemented as a modified CFM loss on VoiceBox, achieves SIM-F of 0.169 (within the measured cross-speaker similarity range of 0.02-0.17) and retain-set SPK-SIM of 0.631, a drop of only 2.8% from the original model's 0.649."
        confidence: high
        relevance: medium
      - claim_id: tgu_data_exclusion_insufficient
        role: complicates
        claim: "Excluding target speakers from the fine-tuning dataset is insufficient for voice privacy protection in zero-shot TTS, because these models generalize at inference time to replicate unseen speakers via in-context learning."
        source: "§5.2, Table 1"
        evidence: "Exact Unlearning (retraining from scratch on the retain set) and Fine Tuning on the retain set yield SIM-F of 0.687 and 0.675 respectively, nearly identical to the original model's 0.708."
        confidence: high
        relevance: low
      - claim_id: tgu_gradient_methods_degrade_intelligibility
        role: complicates
        claim: "Gradient-reversal and KL-divergence-based unlearning methods degrade speech intelligibility rather than achieving genuine speaker forgetting in voice-conditioned generative models, due to entanglement between speaker style and linguistic content."
        source: "§5.2, Table 1"
        evidence: "Negative Gradient achieves WER-F of 5.0% and KL divergence maximization achieves WER-F of 47.2%, compared to 2.4% for TGU, on the same VoiceBox CFM backbone."
        confidence: high
        relevance: low
      - claim_id: tgu_similarity_alone_insufficient_verification
        role: supports
        claim: "Speaker similarity metrics alone are insufficient to verify effective machine unlearning in generative speech models, as consistent failure patterns can yield low similarity scores without achieving the randomness needed to resist voice reconstruction."
        source: "§4.3, §5.2, Table 1"
        evidence: "Negative Gradient and KL methods achieve low SIM-F scores (0.402 and 0.179) but spk-ZRF-F values of 0.842 and 0.810, at or below the original model's baseline of 0.846, revealing patterned outputs."
        confidence: high
        relevance: low
      - claim_id: tgu_self_teacher_via_unconditional_sampling
        role: supports
        claim: "A pre-trained generative model can serve as its own teacher for unlearning by providing diverse speaker-identity targets, eliminating the need for aligned cross-speaker audio pairs."
        source: "§4.2"
        evidence: "TGU generates per-step training targets by running VoiceBox conditioned only on text (no audio prompt), which produces a different speaker identity at each Gaussian initialization; these unconditional CFM outputs replace paired cross-speaker audio as forget-set targets."
        confidence: high
        relevance: medium
    limitations:
      - "All experiments are conducted on a single TTS architecture (VoiceBox with mel-spectrogram representation); transferability to codec-based autoregressive ZS-TTS systems is not evaluated."
      - "TGU introduces a trade-off in speech diversity, measured by Frechet Speech Distance, which increases from 170.2 to 177.8 on LibriSpeech test-other."
    caveats:
      - "This is the first paper in the concept YAML to modify the CFM training objective for a privacy/unlearning purpose rather than a quality or speed purpose; its generalizability claim is explicitly tied to flow-matching, mel-spectrogram architectures by the paper's own novelty assessment."

  - id: "2503.11026"
    published_date: "2025-07-30"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching]
    relevance: medium
    evidence_role:
      - control_evidence
      - architecture_variant
    current_role: active_evidence
    method_family: [pure_fm]
    claims:
      - claim_id: mavflow_multimodal_conditioning_improves_speaker_consistency
        role: supports
        claim: "Conditioning a flow matching mel-spectrogram generator on rich multimodal speaker representations produces more consistent speaker identity in zero-shot cross-lingual speech synthesis than injecting a single speaker embedding at the vocoder stage."
        source: "§5.4, Table 1"
        evidence: "MAVFlow achieves an average 36% improvement in speaker similarity over the AV2AV baseline across four language pairs on MuAViC, using an OT-CFM Transformer decoder conditioned on x-vector speaker embeddings plus facial emotion embeddings, while AV2AV uses d-vector conditioning in the vocoder only."
        confidence: high
        relevance: high
      - claim_id: mavflow_mel_quality_propagates_to_face_gen
        role: supports
        claim: "Higher-quality intermediate mel-spectrogram synthesis propagates benefits to downstream talking-face generation even when the face decoder itself is unchanged."
        source: "§5.5, Table 5"
        evidence: "MAVFlow improves LSE-C by +0.87 and FID by -0.61 relative to AV2AV on LRS3 visual evaluation despite using the same unchanged Wav2Lip face decoder."
        confidence: medium
        relevance: low
      - claim_id: mavflow_visual_alone_insufficient_for_emotion
        role: complicates
        claim: "Visual emotion conditioning is insufficient on its own to improve emotion expression in synthesized speech and requires concurrent audio speaker conditioning to be effective."
        source: "§5.6, Table 8"
        evidence: "Adding only visual guidance to the CFM model reduces emotion accuracy from 28.66% to 26.83% on CREMA-D; the combination of audio and visual guidance is needed to reach 36.46%."
        confidence: high
        relevance: medium
      - claim_id: mavflow_paralinguistic_linguistic_compatible
        role: supports
        claim: "Paralinguistic and linguistic generation objectives are compatible in zero-shot cross-lingual speech synthesis; improving speaker fidelity does not require sacrificing translation accuracy."
        source: "§5.4, Tables 1 and 3"
        evidence: "MAVFlow maintains competitive ASR-BLEU scores (26.97 Es-En vs 26.57 for AV2AV) while substantially improving speaker similarity, using the same unit translation module as AV2AV."
        confidence: high
        relevance: medium
      - claim_id: mavflow_emotion_recognition_gap_unsolved
        role: complicates
        claim: "Emotion recognition accuracy in synthesized cross-lingual speech remains far below ground-truth levels even with multimodal conditioning, indicating that paralinguistic preservation is an unsolved challenge."
        source: "§5.4, Table 2; §5.6, Table 7"
        evidence: "MAVFlow achieves 36.46% audio emotion accuracy versus a ground-truth upper bound of 81.95% on CREMA-D, even with dual audio-visual guidance in the CFM decoder."
        confidence: high
        relevance: low
    limitations:
      - "The unit extractor and unit-to-unit translation modules are adopted unchanged from AV2AV; improvements in semantic translation quality require addressing those upstream components separately."
      - "Evaluation is limited to five European languages with English as the target; generalization to typologically distant language pairs is untested."
    caveats:
      - "The OT-CFM formulation itself is taken directly from Matcha-TTS and related work per the paper's own novelty assessment; the contribution relevant to flow-matching is the dual audio-visual conditioning scheme injected into the CFM Transformer decoder, not a new training objective."

  - id: "2507.22746"
    published_date: "2025-08-01"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [hybrid]
    relevance: high
    evidence_role:
      - core_evidence
      - architecture_variant
      - acceleration_evidence
    current_role: frontier_probe
    method_family: [continuous_ar_fm_head]
    claims:
      - claim_id: dragonfm_chunkwise_ar_fm_composition
        role: supports
        claim: "Composing autoregressive generation across fixed-length token blocks with parallel flow-matching denoising within each block can simultaneously provide KV-cache efficiency and bidirectional contextual refinement."
        source: "§3.1, Table 3"
        evidence: "Dragon-FM processes 2-second chunks autoregressively across chunks via KV cache while running flow-matching denoising with bidirectional attention within each chunk, achieving a Total Number of Function Evaluations of 2-4 versus 150 for VALL-E and 32 for E2 TTS."
        confidence: high
        relevance: high
      - claim_id: dragonfm_fsq_codec_preserves_quality_low_framerate
        role: supports
        claim: "Neural codecs using finite scalar quantisation can preserve speaker similarity and intelligibility at frame rates (12.5 Hz) where STFT-based vocoders suffer significant quality degradation."
        source: "§4.3.3, Table 4"
        evidence: "CodecB at 12.5 Hz achieves SPK-SIM of 0.916 and WER of 2.74, outperforming mel-spectrogram vocoders at 16 Hz (SIM 0.904, WER 3.01)."
        confidence: high
        relevance: low
      - claim_id: dragonfm_continuous_denoising_implicit_classification
        role: supports
        claim: "Continuous denoising models can implicitly classify discrete token targets through appropriate embedding design, without requiring a separate discrete language model head."
        source: "§3.1"
        evidence: "Dragon-FM treats FSQ token embeddings as continuous vectors for the flow-matching denoising objective, denoising continuous representations of codebook entries rather than predicting discrete logits directly."
        confidence: medium
        relevance: high
      - claim_id: dragonfm_framerate_reduction_more_tractable_than_step_reduction
        role: supports
        claim: "Reducing the token frame rate is a more tractable path to low-latency hybrid AR-diffusion TTS than increasing diffusion step efficiency alone, given the quadratic scaling of self-attention with sequence length."
        source: "§3.1, §4.3.2"
        evidence: "Combining a 12.5 Hz codec frame rate with mean-flow step reduction brings Dragon-FM to as few as 2 NFE per 2-second chunk, an approach the paper positions as complementary to, and more scalable than, step-efficiency improvements alone."
        confidence: medium
        relevance: medium
    limitations:
      - "No MOS or SMOS listening test results are reported; all quality comparisons use SPK-SIM, WER, and FAD on an internal podcast dataset."
      - "The codec and acoustic model are proprietary (Microsoft internal), with no public code or demo reported."
    caveats:
      - "The chunk-wise AR-plus-within-chunk-flow-matching design and the use of continuous FSQ embeddings as a flow-matching denoising target are both genuinely novel architectural contributions per the paper's own novelty assessment, though evaluation is confined to internal data without MOS comparisons against published baselines."

  - id: "2508.02038"
    published_date: "2025-08-04"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS, VC]
    architecture: [autoregressive-LM, flow-matching, hybrid]
    relevance: medium
    evidence_role:
      - control_evidence
    current_role: minor
    method_family: [ar_fm_hybrid]
    claims:
      - claim_id: marcovoice_difference_in_means_emotion_embeddings
        role: supports
        claim: "Difference-in-means emotion embeddings, computed from paired emotional and neutral speech, enable speaker-independent emotion representations that generalise across speakers."
        source: "§2.2"
        evidence: "Rotational Emotion Embeddings are computed by averaging the normalized difference between emotional and neutral speech encodings from the same speaker over N=10 pairs, aggregating out speaker-specific variation."
        confidence: medium
        relevance: low
      - claim_id: marcovoice_orthogonality_enables_independent_control
        role: supports
        claim: "Enforcing orthogonality between speaker and emotion embedding spaces via a cross-dot-product loss enables independent control of voice identity and emotional style without degrading either."
        source: "§2.3, Table 1"
        evidence: "The cross-orthogonal constraint (λ_orth=0.1) forces speaker embeddings s and emotion embeddings e to be perpendicular before both are injected into the flow-matching module via cross-attention, and ablation versions (v1-v4) show progressive improvement as this constraint is added."
        confidence: medium
        relevance: medium
      - claim_id: marcovoice_unified_modeling_outperforms_separate
        role: supports
        claim: "Unified joint modeling of voice cloning and emotion control produces higher speaker similarity and emotional naturalness than systems that address the two capabilities separately."
        source: "§4.1, §4.2, Tables 1-2"
        evidence: "Marco-Voice v4 achieves speaker similarity 0.8275 versus CosyVoice2's 0.605 and emotional expression MOS 4.225 versus CosyVoice2's 3.240 in human evaluation."
        confidence: medium
        relevance: low
      - claim_id: marcovoice_fillers_inflate_wer
        role: complicates
        claim: "Expressive emotional TTS systems that include naturalistic vocalized fillers exhibit higher word error rates on clean-transcript benchmarks, even when perceived speech quality is high."
        source: "§4.4, Table 4-5"
        evidence: "Marco-Voice v4 shows WER 17.6 on AISHELL-3 versus CosyVoice1's 3.0, attributed to the system inserting vocalized fillers (ah, um) natural in expressive speech but absent from clean reference transcripts."
        confidence: medium
        relevance: low
      - claim_id: marcovoice_gender_imbalance_recognition_gap
        role: complicates
        claim: "Gender imbalance in emotional speech training data produces systematic differences in emotion recognition accuracy, with male speakers underperforming female speakers across most emotion categories."
        source: "§4.4, Figure 6"
        evidence: "Emotion recognition accuracy analysis shows a systematic gender-based gap attributed to imbalanced representation of male versus female speakers in the training corpora used (ESD, CSEMOTIONS)."
        confidence: medium
        relevance: low
    limitations:
      - "Requires paired emotional/neutral speech data from the same speaker for emotion embedding extraction, which limits scalability and language coverage."
      - "Model size not reported; training efficiency uncharacterized."
    caveats:
      - "The cross-attention mechanism injecting the orthogonally-constrained emotion embedding into the flow-matching module (query = emotion embedding, keys/values = LM token sequence) is the one component that modifies flow-matching conditioning directly; the paper's own novelty assessment otherwise describes the contribution as 'primarily engineering and recipe rather than fundamentally new methodology.'"

  - id: "2508.03543"
    published_date: "2025-08-05"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: influential
    method_family: [pure_fm]
    claims:
      - claim_id: emosteer_trainingfree_steering_competitive
        role: supports
        claim: "Training-free inference-time activation steering can achieve emotion control in flow-matching TTS models that is competitive with or superior to systems explicitly trained for emotion conditioning."
        source: "§4.2, Table 1"
        evidence: "EmoSteer-TTS + F5-TTS achieves E-SIM 0.280 and WER 2.79 in-distribution, comparing favourably to unsteered CosyVoice2 (E-SIM 0.240) and the trained baseline EmoVoice (E-SIM 0.205, WER 5.31), while requiring no additional training."
        confidence: high
        relevance: high
      - claim_id: emosteer_emotion_linear_in_dit_activations
        role: supports
        claim: "Pre-trained flow-matching TTS models encode emotion as approximately linear directions in DiT activation space, enabling vector arithmetic over multiple emotion categories."
        source: "§3, §4.6"
        evidence: "Steering vectors are constructed as normalized differences between emotional and neutral activation means at a specific DiT layer, and adding, subtracting, or interpolating these vectors during inference reliably produces emotion conversion, interpolation, erasure, and multi-emotion blending across F5-TTS, E2-TTS, and CosyVoice2."
        confidence: high
        relevance: high
      - claim_id: emosteer_emotion_concentrated_in_topk_tokens
        role: supports
        claim: "Emotion-bearing information in TTS DiT activations is concentrated in a subset of token positions identifiable via speech emotion recognition scores, and selective steering of these positions outperforms global activation modification."
        source: "§3.3, §4.6"
        evidence: "An emotion2vec model scores each token position by emotional relevance and only top-k positions are steered; this topk selective steering avoids distorting prosodically neutral segments like silences or unstressed phonemes."
        confidence: medium
        relevance: high
      - claim_id: emosteer_generalizes_across_architectures
        role: supports
        claim: "Activation steering for emotion control generalises across model architectures and scales without retuning, producing consistent results on F5-TTS (22 layers), E2-TTS (8 layers), and CosyVoice2 (56 layers)."
        source: "§4.2, §4.5"
        evidence: "The same steering methodology, applied every 3-5 layers depending on model depth, produces consistent emotion conversion results across three DiT-based flow-matching TTS models of substantially different layer counts."
        confidence: high
        relevance: high
      - claim_id: emosteer_steering_costs_speaker_similarity
        role: complicates
        claim: "Training-free emotion manipulation via activation steering incurs a moderate speaker similarity cost relative to the unsteered baseline, indicating residual speaker-emotion entanglement in DiT representations."
        source: "§4.2, Table 1"
        evidence: "Speaker similarity drops from S-SIM 0.66 (unsteered F5-TTS) to 0.59 (EmoSteer + F5-TTS), suggesting some speaker-emotion coupling in the activations being steered."
        confidence: medium
        relevance: medium
    limitations:
      - "The steering vectors are derived from difference-in-means, which assumes linearity of emotional representations in DiT activations, a plausible but unverified assumption."
      - "The method requires access to DiT intermediate activations, ruling out fully black-box deployment."
    caveats:
      - "This paper's central finding, that flow-matching DiT activations encode emotion as linear, steerable directions, is a genuine characterisation of flow-matching internal representations rather than an application built on top of an unmodified flow-matching backbone."

  - id: "2508.14049"
    published_date: "2025-08-05"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching]
    relevance: low
    evidence_role:
      - infrastructure
    current_role: minor
    method_family: [ar_fm_hybrid]
    claims:
      - claim_id: mahatts_semantic_tokens_transfer_lowresource
        role: supports
        claim: "Large multilingual TTS systems built on semantic token intermediaries transfer to low-resource languages more readily than end-to-end spectrogram models."
        source: "§2.1, §5.1"
        evidence: "MahaTTS-v2 uses wav2vec2.0 (XLS-R) k-means semantic tokens as an intermediary and adds new languages with approximately 200 hours of data each, which the authors attribute to the semantic token front-end's cross-lingual generalisation."
        confidence: medium
        relevance: low
      - claim_id: mahatts_decoupled_stages_ease_new_languages
        role: supports
        claim: "Decoupling the text-to-semantic and semantic-to-acoustic stages enables independent training and simplifies the addition of new languages without full system retraining."
        source: "§2, §4.1"
        evidence: "M1 (text-to-semantic) and M2 (semantic-to-acoustic flow-matching model) are trained independently with no joint optimisation required; adding a new language requires only fine-tuning M1 on approximately 200 hours of new-language data."
        confidence: medium
        relevance: low
      - claim_id: mahatts_fm_viable_diffusion_replacement
        role: supports
        claim: "Flow matching is a viable replacement for diffusion in the acoustic generation stage of two-stage TTS pipelines, maintaining competitive quality at lower training complexity."
        source: "§2.3, §5.1"
        evidence: "M2, a 300M-parameter Matcha-TTS-style OT-CFM model, reaches competitive WER across 17 languages using a training regime the authors describe as less complex than diffusion-based acoustic decoders."
        confidence: low
        relevance: medium
      - claim_id: mahatts_lowresource_intelligibility_gap
        role: complicates
        claim: "Intelligibility in low-resource languages with limited training data remains markedly worse than high-resource languages within the same multilingual system."
        source: "§5.1, Table 2"
        evidence: "MahaTTS-v2 reports WER as high as 73% on Odia and 42% on Assamese, both low-resource languages with limited training hours, versus 2% on English."
        confidence: high
        relevance: low
    limitations:
      - "Evaluation relies exclusively on WER over 10 sentences per language with no MOS, SMOS, or naturalness scores reported."
      - "English dominates the training set at 58%, raising questions about whether true cross-lingual transfer or data dominance explains strong English results."
    caveats:
      - "The flow-matching acoustic stage (M2) is described by the paper's own novelty assessment as one of several 'established components' assembled into the pipeline; none of the four claims characterise flow-matching mechanics beyond the single generic claim that it is a viable diffusion substitute."

  - id: "2508.04996"
    published_date: "2025-08-07"
    entry_date: "2026-07-19"
    year: 2025
    venue: arXiv
    task: [VC]
    architecture: [flow-matching]
    relevance: medium
    evidence_role:
      - acceleration_evidence
    current_role: active_evidence
    method_family: [fm_acceleration]
    claims:
      - claim_id: refvc_ssl_expressiveness_needs_mitigation
        role: complicates
        claim: "SSL features improve paralinguistic expressiveness in voice conversion but introduce timbre leakage and noise sensitivity that require explicit mitigation."
        source: "§I, §II.B"
        evidence: "WavLM-derived SSL features carry prosody and emotion but are shown to leak source timbre and degrade under noise unless mitigated by the paper's random erasing strategy."
        confidence: high
        relevance: low
      - claim_id: refvc_random_erasure_reduces_reliance
        role: supports
        claim: "Random feature erasure at training time can reduce a model's over-reliance on information-rich but noise-sensitive representations without information bottleneck machinery."
        source: "§II.B"
        evidence: "Removing random erasing collapses SECS to 0.5248 (clean) / 0.4384 (noisy) and raises CER to 18.64% on the noisy set, versus 0.8253/0.8031 SECS and 8.03% CER with erasing applied."
        confidence: high
        relevance: low
      - claim_id: refvc_implicit_alignment_improves_noise_robustness
        role: supports
        claim: "Implicit alignment borrowed from non-autoregressive TTS can improve noise robustness in voice conversion by preventing the model from over-reconstructing noise-carrying source frames."
        source: "§II.C"
        evidence: "Removing the E2TTS-inspired implicit alignment (blank-frame padding fusion feeding the flow-matching DiT) degrades SMOS substantially, from 3.98 to 3.51 on the clean set."
        confidence: high
        relevance: medium
      - claim_id: refvc_shortcut_models_reduce_fm_steps
        role: supports
        claim: "Shortcut Models reduce flow-matching inference steps by an order of magnitude with only marginal quality loss in voice conversion."
        source: "§II.D, Table I"
        evidence: "REF-VC's 4-step Shortcut Model configuration achieves NMOS 3.89, CER 8.79, and SECS 0.7919 on the noisy set, remaining competitive with the 32-step baseline (NMOS 3.68, CER 8.03, SECS 0.8031) and with Seed-VC's 32-step baseline."
        confidence: high
        relevance: high
      - claim_id: refvc_asr_ssl_complementary
        role: supports
        claim: "ASR-based bottleneck features and SSL representations are complementary: the former provides noise-robust linguistic content, the latter contributes paralinguistic fidelity that ASR training suppresses."
        source: "§I, §II.A"
        evidence: "REF-VC fuses Wenet ASR bottleneck features (noise-robust, content-only) with WavLM SSL features (paralinguistic-rich, noise-sensitive) as dual conditioning to the flow-matching DiT decoder."
        confidence: high
        relevance: low
    limitations:
      - "Evaluation scale is small: 100 clean and 50 noisy test utterances is insufficient to draw strong conclusions about generalisation across noise types or speaking styles."
      - "The model cannot synthesise arbitrarily long utterances due to a maximum-length constraint from the implicit alignment mechanism."
    caveats:
      - "The Shortcut Models acceleration technique (a step-size-conditioned flow-matching estimator with self-consistency training) is applied here to voice conversion rather than TTS, extending an acceleration approach seen elsewhere in this concept's corpus (e.g. 2025.acl-long.790) to a new task."

  - id: "2508.07302"
