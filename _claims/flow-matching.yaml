        source: "§3.1, §4.2, Table 1"
        evidence: "The ablation comparing NReFlow-VC (without the cross-attention feature-fusion module) to full ReFlow-VC shows the gated fusion module accounts for most of the speaker-similarity gain (SECS 0.751 to 0.830 at one step)."
        confidence: high
        relevance: medium
      - claim_id: reflowvc_onestep_matches_diffusion_multistep
        role: supports
        claim: "A single-step ODE solver can match the quality of dozens of diffusion steps when the flow trajectories are sufficiently linear."
        source: "§4.2, Table 1"
        evidence: "ReFlow-VC's one-step Euler solver achieves SECS 0.830 and WER 4.54%, comparable to Diff-VC's 30-step output (SECS 0.766, WER 13.8%), at 0.10 seconds versus Diff-VC's 4.68 seconds sampling time."
        confidence: high
        relevance: high
      - claim_id: reflowvc_recursive_rectification_marginal
        role: refines
        claim: "Recursive rectification (retraining on model-generated samples) yields only marginal improvements when the initial model is already well-trained."
