method_families:
  - id: pure_fm
    name: "Pure Flow-Matching Systems"
    summary: "Models that use flow matching as the sole generative backbone, typically operating directly on mel spectrograms. These systems train a velocity field estimator with OT-CFM or CFM objectives and sample via ODE integration at inference. They require no autoregressive component and achieve sub-linear RTF scaling with utterance length."
    papers:
      - "2210.02747"
      - "2312.15821"
      - "2406.18009"
      - "2412.04724"
      - "2025.acl-long.313"
    open_questions:
      - "What is the minimum data volume at which pure OT-CFM mel-spectrogram systems achieve competitive intelligibility, and can architectural changes (e.g. DiT vs. U-Net) shift this threshold?"
      - "Does the Sway Sampling step scheduling principle generalise across all pure FM architectures, or is it specific to the DiT + ConvNeXt design of F5-TTS?"

  - id: ar_fm_hybrid
    name: "Autoregressive LM + Flow-Matching Acoustic Model"
    summary: "Two-stage pipelines where an autoregressive language model generates discrete semantic or style tokens, and a separate flow-matching model decodes those tokens into continuous speech. The AR stage handles content and prosody at a semantic level; the FM stage handles fine-grained acoustic detail. This architecture trades the latency of AR decoding for stronger control over speaker style and paralinguistic attributes."
    papers:
      - "2407.05407"
      - "2412.10117"
      - "2025.acl-long.598"
      - "2502.07243"
      - "2502.17239"
      - "2503.14345"
    open_questions:
      - "What is the optimal interface between the AR token stage and the FM acoustic stage — how many semantic token levels, which codec, and how much conditioning information should flow between stages?"
      - "Can the AR stage be replaced with a non-autoregressive masked predictor while retaining the style control advantages of the hybrid architecture?"

  - id: fm_acceleration
    name: "Accelerated / Single-Step Flow Matching"
    summary: "Systems that specifically target reducing the inference-time ODE integration steps of flow-matching models to 1–4, using distillation (DMD), learned ODE solvers (Bespoke Solvers), or learned prior distributions that absorb the complexity previously resolved by multi-step integration. These approaches directly trade some portion of sample quality for real-time usability."
    papers:
      - "2406.05551"
      - "2025.acl-long.1043"
    open_questions:
      - "Do distillation-based acceleration and learned-prior acceleration achieve equivalent perceptual quality at equivalent NFE, or do they produce qualitatively different speech artefacts?"
      - "Is there a principled lower bound on the number of ODE steps required for high-fidelity mel-spectrogram synthesis, given the complexity of the speech manifold?"

  - id: historical_guidance
    name: "Classifier-Free Guidance (Predecessor)"
    summary: "The classifier-free guidance paper establishes the conditioning mechanism later adopted by flow-matching TTS systems. It is not a flow-matching system, but provides the theoretical and practical foundation for the CFG conditioning strategy universally adopted in zero-shot FM-TTS."
    papers:
      - "2207.12598"
    open_questions:
      - "Is the joint training with conditioning dropout equally effective for flow-matching velocity field estimation as it is for score-based diffusion, given the different training objective geometry?"

reassessment_queue: []

open_questions:
  - "Speaker similarity in zero-shot FM-TTS consistently lags behind speaker verification ground truth, particularly for out-of-domain speakers. Is this a fundamental limitation of the mel-spectrogram representation, the OT-CFM objective, or the scale of training data?"
  - "The naturalness-intelligibility tradeoff between learned-prior (OZSpeech) and standard OT-CFM (F5-TTS) systems raises the question of whether a single FM architecture can simultaneously achieve top-tier performance on both axes, or whether codec choice forces a permanent tradeoff."
  - "Most pure FM-TTS papers train on clean audiobook-style English data. The extent to which current flow-matching architectures generalise to spontaneous, noisy, or code-switched speech remains largely uncharacterised."
  - "Inference-time step scheduling (Sway Sampling) and post-training solver optimisation (Bespoke Solvers) both improve FM TTS without retraining. Are these techniques composable, and do their gains stack when applied together?"
  - "The DPO-FM velocity-space alignment approach is demonstrated on a single hybrid system. Whether preference-based alignment can improve pure flow-matching systems (without an AR stage) at similar cost remains an open question."

trend_notes:
  - "Flow matching has displaced diffusion as the dominant continuous-output generative backbone in TTS and VC since 2023, with adoption spanning both pure FM architectures (E2 TTS, F5-TTS) and hybrid AR+FM pipelines (CosyVoice, Vevo)."
  - "From 2024 onward, the predominant architectural pattern is the AR-FM hybrid: an autoregressive LM generates semantic tokens, and a flow-matching model decodes them to mel spectrograms. This pattern appears in six of the fourteen papers in this corpus."
  - "Inference acceleration for flow-matching speech models has become an active subfield since 2024, with three distinct mechanisms emerging in quick succession: learned ODE solvers, flow distillation (DMD), and learned priors. No single mechanism has established clear dominance."
  - "Post-training alignment and fine-tuning of flow-matching models is an emerging area as of 2025, with DPO-FM (velocity-space preference alignment) being the first systematic formulation; concurrent work (CosyVoice 2) explores differentiable ASR reward optimization as a complementary approach."
  - "The mel-spectrogram bottleneck — sequence length scaling and speaker similarity ceiling — is increasingly identified as a limitation of pure FM-TTS architectures relative to codec-token-based systems, suggesting a potential shift toward codec-native FM pipelines as the dominant paradigm."
