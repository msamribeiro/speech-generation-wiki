- id: '2509.06074'
  published_date: "2025-09-07"
  entry_date: '2026-07-30'
  year: 2025
  venue: EMNLP
  task:
  - TTS
  architecture:
  - transformer-enc-dec
  relevance: medium
  evidence_role:
