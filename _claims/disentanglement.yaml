        evidence: "The benchmark shows higher-bitrate (more codebook) configurations consistently improve reconstruction metrics while degrading performance on several DASB downstream discriminative tasks."
        confidence: medium
        relevance: low
      - claim_id: das_semantic_distillation_generalization_tradeoff
        role: refines
        claim: "Semantic distillation from SSL features into early RVQ layers improves phonetic content preservation in acoustic tokenizers but may reduce cross-domain generalization when the distillation source is speech-specific."
        source: "§4.2 (Distillation Effect), Table 16"
