    claims:
      - claim_id: styletts_zs_compressed_prosody_enables_distillation
        role: supports
        claim: "Compressing prosodic variation into a fixed-length discrete latent before diffusion modeling makes one-step distillation feasible with a small simulation budget, whereas bootstrapping-based distillation methods require significantly more samples or fail entirely on variable-length latents."
        source: "§3.3, Appendix A.3, Table 6"
        evidence: "The RVQ-quantized fixed-length (K=50) prosody latent is small enough that simulation-based one-step distillation succeeds with only 10k samples, achieving a 90% inference-time reduction with no statistically significant naturalness degradation."
        confidence: high
        relevance: low
      - claim_id: styletts_zs_codecfree_competitive_with_codec_systems
        role: supports
        claim: "Codec-free end-to-end waveform synthesis achieves competitive or superior human-rated naturalness and similarity compared to codec-dependent systems, while adversarial training with multimodal discriminators compensates for the quantisation reconstruction gap."
        source: "§3.1, §3.4, §4.2, Table 1"
        evidence: "StyleTTS-ZS (LibriLight) achieves CMOS-N of 0.00, outperforming NaturalSpeech 3 (-0.28) and FlashSpeech (-0.42), without relying on any neural audio codec."
        confidence: high
        relevance: low
      - claim_id: styletts_zs_joint_prompt_text_encoding_helps
        role: supports
        claim: "Jointly encoding the speech prompt and input text into prompt-aligned embeddings alongside a global style vector provides larger naturalness and similarity gains than using either conditioning alone in zero-shot TTS."
        source: "§4.3, Table 3"
        evidence: "Ablation shows removing prompt-aligned text embeddings (PATE) or the global style vector each independently drops CMOS-N (by 0.24 and 0.31 respectively), confirming both the timbre (global style) and content-alignment signals are separately necessary."
        confidence: high
        relevance: medium
      - claim_id: styletts_zs_automatic_metrics_diverge_from_human
        role: complicates
        claim: "Automatic speaker embedding similarity metrics can diverge from human-rated similarity in zero-shot TTS when codec-free systems are compared to codec-dependent ones, suggesting that codec representations may be tuned to neural-network perceptions rather than human perception."
        source: "§4.2, Table 1"
        evidence: "StyleTTS-ZS's automatic speaker embedding SIM (0.56) trails NaturalSpeech 3 (0.66), but human CMOS-S shows no significant difference between the two systems."
        confidence: medium
        relevance: low
    limitations:
      - "The model is English-only (LibriTTS and LibriLight are English audiobook corpora). Speaker embedding SIM is somewhat lower than NaturalSpeech 3, suggesting the codec-free approach may leave some neural-network-measured timbre fidelity on the table."
    caveats:
      - "The architecture separates global style (timbre) from time-varying style (prosody) as two distinct representations, but no claim in the paper directly measures cross-leakage between these two streams; the disentanglement design is implicit in the architecture rather than empirically validated as a standalone result."

