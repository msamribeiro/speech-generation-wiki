      - "Evaluation uses only 2 target speakers (one male, one female from ESD), both trained exclusively on neutral utterances; WER of 16.16% indicates non-trivial intelligibility degradation, and scalability to languages beyond English is undemonstrated."
    caveats:
      - "Directly critiques GRL, VQ, and orthogonal-loss disentanglement approaches as relying on explicit speaker labels and introducing a tension between feature separation and synthesis quality, offering a comparative framing distinct from papers that only report their own method's ablations."

  - id: "interspeech-2025-1397"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [singing, VC]
    architecture: [diffusion]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: active_evidence
    method_family: [signal_level_prosody_decomposition]
    claims:
      - claim_id: vibesvc_dwt_f0_decomposition_control
        role: supports
        claim: "Explicit frequency-domain decomposition of the F0 contour enables more accurate and controllable singing style transfer than implicit style-embedding approaches."
        source: "§4.1.1, Table 1"
        evidence: "VibE-SVC achieves 0.700 style accuracy in style-only conversion versus 0.213-0.525 for SoVITS baselines using direct style embeddings, on the VocalSet straight/vibrato benchmark."
        confidence: high
        relevance: high
      - claim_id: vibesvc_mpd_style_accuracy
        role: supports
        claim: "Adversarial training on the target frequency band of the F0 contour improves singing style accuracy without degrading naturalness."
        source: "§4.3, Table 1"
        evidence: "Removing the multi-period discriminator reduces style accuracy from 0.700 to 0.625 and MOS from 4.124 to 4.016 in the style-only conversion experiment."
        confidence: high
        relevance: medium
      - claim_id: vibesvc_naturalness_tradeoff
        role: complicates
        claim: "Increasing style transfer accuracy in singing voice conversion trades off against naturalness, and explicit disentanglement does not fully eliminate this tension."
        source: "§4.1.2, Figure 3"
        evidence: "Figure 3 shows a consistent inverse correlation between MOS and style accuracy across all baselines and VibE-SVC; the highest-accuracy model (VibE-SVC) has lower naturalness than the highest-naturalness baseline (SoVITS with style embedding, 0.213 style accuracy)."
        confidence: medium
        relevance: medium
      - claim_id: vibesvc_dwt_level_sensitivity
        role: refines
        claim: "The effective granularity of F0-based singing style disentanglement via DWT is sensitive to decomposition level, with an optimal level that captures vibrato without including unrelated high-frequency content."
        source: "§4.3, Table 3"
        evidence: "Style accuracy is 0.163 at DWT level 3 (vibrato information absent), 0.694 at level 4 (optimal), and drops slightly at level 5 due to inclusion of irrelevant high-frequency components."
        confidence: high
        relevance: high
      - claim_id: vibesvc_continuous_vibrato_control
        role: supports
        claim: "Vibrato extent in singing voice conversion can be controlled continuously at inference time by scalar multiplication of the isolated high-frequency F0 component, without retraining."
        source: "§4.2, Table 2, Figure 5"
        evidence: "Scaling the high-frequency F0 contour from 0.1 to 2.0 produces style accuracy ranging from 0.066 to 0.928; frame-level control is also demonstrated by applying scaling at specific target frame indices."
        confidence: high
        relevance: high
    limitations:
      - "The model is restricted to two singing styles (straight and vibrato) derived from VocalSet and does not address falsetto, breathy voice, belt, or melisma; human evaluation uses at minimum 20 Amazon MTurk raters per model, on the low end for resolving the small MOS differences reported."
    caveats:
      - "Demonstrates disentanglement specifically for F0 sub-components (melody vs. vibrato) via discrete wavelet transform rather than the more common content/timbre/prosody split, broadening the range of attributes addressed under this concept."

  - id: "interspeech-2025-1434"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [VC]
    architecture: [diffusion]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: active_evidence
    method_family: [data_training_recipe_disentanglement]
    claims:
      - claim_id: rewind_time_reversal_augmentation
        role: supports
        claim: "Full-utterance time reversal can serve as an effective signal-level data augmentation for speaker representation learning in voice conversion, as it suppresses phonemic content while retaining speaker-discriminative tonal features."
        source: "§3.1, Table 1"
        evidence: "A perceptual study shows 80.3% speaker identification accuracy from time-reversed speech; Table 1 confirms complete reversal achieves 100% WER (full linguistic removal) alongside the highest cosine speaker similarity score (0.96), higher than any short-time reversal window."
        confidence: high
        relevance: high
      - claim_id: rewind_embedding_fusion_similarity
        role: supports
        claim: "Fusing speaker embeddings from augmented training signals with conventional embeddings improves speaker similarity in zero-shot diffusion-based voice conversion."
        source: "§4.3, Table 2"
        evidence: "Adding reversed-speech speaker embeddings via a weighted fusion layer (α = β = 0.5) improves objective speaker similarity by 4.16% on average across DiffHierVC and DDDM-VC; DDDM-VC objective SPK-SIM rises from 0.70 to 0.79 and subjective MUSHRA from 77.46 to 78.61."
        confidence: high
        relevance: high
      - claim_id: rewind_backbone_variance
        role: complicates
        claim: "The effectiveness of speaker embedding augmentation in voice conversion varies substantially across backbone architectures, complicating claims of generalisability."
        source: "§4.3, Table 2"
        evidence: "For DiffVC, the augmentation improves subjective speaker similarity (50.12 to 53.42) but reduces objective similarity (0.75 to 0.71), while DiffHierVC shows objective improvement but negligible subjective change; only DDDM-VC shows consistent gains on both metrics."
        confidence: medium
        relevance: medium
      - claim_id: rewind_no_quality_tradeoff
        role: supports
        claim: "Improving speaker disentanglement through augmentation does not necessarily trade off against generated speech quality in diffusion-based voice conversion."
        source: "§4.3, Table 2"
        evidence: "DDDM-VC+Ours improves both WV-MOS (3.84 to 3.91) and UTMOS (3.21 to 3.55) alongside speaker similarity gains, indicating that stronger speaker conditioning from the STR augmentation does not degrade synthesis quality."
        confidence: high
        relevance: medium
    limitations:
      - "The perceptual study supporting the time-reversal principle is small (25 participants, 6 speakers, English only); the approach has been evaluated only on diffusion-based VC systems, and no code is publicly released."
    caveats:
      - "Offers a novel signal-level (non-architectural) disentanglement mechanism — time reversal as data augmentation — distinct from the adversarial, VQ, and orthogonality-based approaches otherwise dominant in this concept's evidence base."

  - id: "interspeech-2025-1440"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [codec]
    architecture: [VAE]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: active_evidence
    method_family: [rvq_semantic_acoustic_distillation]
    claims:
      - claim_id: freecodec_ssl_disentangle_match_supervised
        role: supports
        claim: "Self-supervised disentanglement of speech into content, speaker, and prosody streams can match or exceed supervised codec quality at significantly lower bitrate."
        source: "§4.1, Table 1, Table 2"
        evidence: "FreeCodec-v1 at 0.45 kbps achieves UTMOS 4.034, STOI 0.918, and speaker cosine similarity 0.919 on VCTK, matching or exceeding SpeechTokenizer at 3 kbps and FACodec at 2.4 kbps on most metrics despite using unsupervised content/speaker/prosody factorisation via dedicated frame-level encoders."
        confidence: high
        relevance: high
      - claim_id: freecodec_factorization_over_capacity
        role: supports
        claim: "Codec coding efficiency is more sensitive to information factorisation than to raw model capacity or bitrate allocation."
        source: "§4.1, Table 1"
        evidence: "FreeCodec-v2 (fully discrete, 0.45 kbps) scores MUSHRA 87.44, beating DAC, TiCodec, FACodec, and SpeechTokenizer despite operating at 2-7x lower bitrate, indicating the three-way factorisation rather than added model capacity drives the efficiency gain."
        confidence: medium
        relevance: medium
      - claim_id: freecodec_decoder_supervision_routing
        role: supports
        claim: "Routing WavLM supervision to the decoder rather than the encoder during training improves speaker-content disentanglement for voice conversion."
        source: "§2.5, §4.2"
        evidence: "FreeCodec-v3 moves the WavLM cosine-similarity content loss from the content encoder to the decoder branch specifically to prevent speaker leakage into the content encoder, enabling any-to-any VC with SECS 0.847 versus 0.553 for FACodec at 5x higher bitrate."
        confidence: high
        relevance: high
      - claim_id: freecodec_ultralow_bitrate_competitive
        role: supports
        claim: "Ultra-low-bitrate codecs (below 0.5 kbps) can achieve MUSHRA scores competitive with codecs operating at 2-3 kbps when disentanglement is applied to reduce frame-level redundancy."
        source: "§4.1, Table 2"
        evidence: "FreeCodec-v2 at 0.45 kbps (87.44 MUSHRA) outperforms FACodec at 2.4 kbps (80.44) and SpeechTokenizer at 3 kbps (82.0), attributing the gain to the three-encoder factorisation reducing redundant information encoded per frame."
        confidence: medium
        relevance: medium
    limitations:
      - "Evaluation is restricted to English (LibriSpeech and VCTK); generalisation to other languages, accents, or spontaneous-speech domains is untested. The prosody encoder's separation is validated only via t-SNE visualisation without a formal mutual information analysis, and partial speaker clustering suggests the separation is not complete."
    caveats:
      - "The paper explicitly acknowledges (via t-SNE visualisation) that its own prosody/speaker separation is incomplete, providing a rare self-reported limitation on disentanglement completeness rather than a claim of clean separation."

  - id: "interspeech-2025-1531"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [singing, VC]
    architecture: [VAE, GAN]
    relevance: high
    evidence_role:
