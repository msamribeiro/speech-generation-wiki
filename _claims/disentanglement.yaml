    entry_date: "2026-07-22"
    year: 2025
    venue: ACL
    task: [VC]
    architecture: [hybrid]
    relevance: medium
    evidence_role:
      - control_evidence
      - architecture_variant
    current_role: minor
    method_family: [explicit_multiencoder_factorization]
    claims:
      - claim_id: rtvc_articulatory_disentanglement_preserves_intelligibility
        role: supports
        claim: "Articulatory feature spaces enable interpretable content-speaker disentanglement in voice conversion without sacrificing intelligibility relative to SSL-based approaches."
        source: "§5.3, Table 1"
        evidence: "RT-VC's SPARC-derived articulatory pipeline achieves WER 6.69% and CER 2.12% on LibriTTS to VCTK zero-shot conversion, close to StreamVC's SSL-based WER of 6.22% and CER 2.17%, while relying on interpretable EMA features rather than an abstract latent space."
        confidence: medium
        relevance: medium
      - claim_id: rtvc_realtime_cpu_below_70ms
        role: supports
        claim: "Real-time zero-shot voice conversion on CPU hardware is achievable below 70 ms end-to-end latency while maintaining naturalness MOS above 3.8."
        source: "§3.6, Table 1"
        evidence: "RT-VC achieves 61.4 ms CPU latency (13.3% faster than StreamVC's 70.8 ms) with MOS 3.87 and SMOS 3.59 on LibriTTS test-clean to VCTK conversion."
        confidence: high
        relevance: low
      - claim_id: rtvc_ddsp_competitive_with_gan
        role: supports
        claim: "Causal DDSP vocoders conditioned on articulatory features provide competitive synthesis quality compared to GAN-based alternatives at substantially lower computational cost."
        source: "§2.3, §3.5"
        evidence: "The causal harmonic-plus-noise DDSP vocoder, conditioned on articulatory features and speaker embedding via FiLM layers, achieves MOS 3.87 while running within the 61.4 ms end-to-end CPU latency budget."
        confidence: medium
        relevance: low
      - claim_id: rtvc_noise_robustness_floor
        role: complicates
        claim: "Voice conversion systems trained with static noise augmentation degrade gracefully down to approximately 20 dB SNR input but fail at 10 dB, suggesting a practical noise floor for real-time deployment."
        source: "§5.4"
        evidence: "RT-VC remains robust to static noise down to approximately 20 dB SNR (WER stays near 10%), but white noise at 10 dB SNR degrades quality substantially."
        confidence: medium
        relevance: low
    limitations:
      - "EMA representation omits nasal cavity and laryngeal dynamics, limiting modeling of nasal sounds and vocal fry; pseudo-EMA labels come from a WavLM model pretrained on English, limiting cross-lingual performance."
    caveats:
      - "The articulatory-space content-speaker disentanglement is inherited from prior SPARC work (Cho et al. 2024); RT-VC's own contribution is a streaming-capable causal adaptation, not a new disentanglement mechanism."

  - id: "2025.acl-long.1043"
    entry_date: "2026-07-22"
    year: 2025
    venue: ACL
    task: [TTS]
    architecture: [flow-matching, hybrid]
    relevance: low
    evidence_role:
      - infrastructure
    current_role: minor
    method_family: [explicit_multiencoder_factorization]
    claims:
      - claim_id: ozspeech_learned_prior_single_step
        role: supports
        claim: "Replacing Gaussian noise with a learned prior as the starting point for flow matching reduces the number of required inference steps to one without needing a separate distillation stage."
        source: "§3.1, §3.3"
        evidence: "OZSpeech's Prior Codes Generator produces a learned prior close to the target distribution, allowing the OT-CFM Vector Field Estimator to reach the target in a single step (NFE=1) versus 32 steps for F5-TTS."
        confidence: high
        relevance: low
      - claim_id: ozspeech_codec_systems_more_data_efficient
        role: complicates
        claim: "Flow-matching TTS systems trained on traditional OT-CFM are data-hungry and fail to generalise when retrained on limited data, while neural codec-based systems remain effective with as few as 500 hours."
        source: "§4.2, Table 1"
        evidence: "OZSpeech (500h training) achieves WER 0.05 versus F5-TTS's 0.24 (trained on 95,000h), showing that a codec-based single-step approach can outperform a data-hungry Gaussian-initialized flow-matching baseline at far lower data scale."
        confidence: high
        relevance: low
      - claim_id: ozspeech_noise_robust_intelligibility
        role: supports
        claim: "Zero-shot TTS systems trained exclusively on clean prompts degrade substantially in intelligibility when given noisy reference audio, with autoregressive codec models being especially vulnerable."
        source: "§4.4, Table 4"
        evidence: "Under noisy prompts, VALL-E's WER rises to 93% at 0 dB SNR, while OZSpeech maintains WER 0.05-0.06 across all tested SNR levels, essentially unchanged from clean conditions."
        confidence: high
        relevance: low
      - claim_id: ozspeech_factorized_codec_naturalness_intelligibility_tradeoff
        role: refines
        claim: "Factorised codec representations that balance acoustic and semantic attributes trade perceptual naturalness (UTMOS) for intelligibility (WER) relative to codecs that prioritise acoustic fidelity."
        source: "§4.2"
        evidence: "OZSpeech, built on FACodec's factorized (prosody/content/acoustic-detail) representation, achieves markedly lower WER than F5-TTS and VALL-E but lower UTMOS (3.15 vs. 3.7+), a trade-off the authors attribute to the codec balancing acoustic and semantic representation."
        confidence: medium
        relevance: medium
      - claim_id: ozspeech_noise_finetuning_recovers_quality
        role: supports
        claim: "Fine-tuning a zero-shot TTS model on noise-augmented prompts preserves intelligibility and substantially recovers acoustic quality metrics under low-SNR conditions."
        source: "§4.4, Table 4"
        evidence: "Fine-tuning OZSpeech with noisy prompts further improves acoustic quality metrics under low-SNR conditions while WER remains essentially unchanged."
        confidence: medium
        relevance: low
    limitations:
      - "UTMOS and speaker similarity lag behind F5-TTS and VoiceCraft; FACodec dependency means reproduction requires NaturalSpeech 3's codec infrastructure."
    caveats:
      - "OZSpeech uses FACodec's factorized representation as a frozen, off-the-shelf disentangled codec; the paper does not modify or evaluate the disentanglement mechanism itself, only builds a flow-matching generator on top of it."

  - id: "2025.acl-long.346"
    entry_date: "2026-07-22"
    year: 2025
    venue: ACL
    task: [TTS]
    architecture: [transformer-enc-dec, hybrid]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: influential
    method_family: [explicit_multiencoder_factorization]
    claims:
      - claim_id: ctrlspeech_decoupling_necessary_for_joint_control
        role: supports
        claim: "Disentangling speaker timbre and speaking style into separate codec representations is a necessary condition for simultaneous zero-shot speaker cloning and style control; without explicit decoupling, the two conditioning signals interfere and controllability collapses."
        source: "§4.3, Table 4"
        evidence: "The codec decoupling ablation shows that without decoupling, controllability collapses on test set A (pitch accuracy drops to 0.492, speed to 0.517, emotion to 0.237), confirming that independently disentangling the speech prompt and style prompt is necessary to prevent cross-channel interference."
        confidence: high
        relevance: high
      - claim_id: ctrlspeech_style_description_many_to_many
        role: supports
        claim: "Natural language style descriptions have an inherent many-to-many relationship with audio that cannot be resolved by timbre conditioning alone, requiring a probabilistic model of style variation such as a mixture density network."
        source: "§3.3"
        evidence: "ControlSpeech identifies the many-to-many mapping between style descriptions and acoustic realizations as an inherent ambiguity of natural language itself, distinct from PromptTTS 2's attribution of one-to-many ambiguity to missing timbre information, motivating the SMSD mixture-density module."
        confidence: medium
        relevance: medium
      - claim_id: ctrlspeech_zeroshot_cloning_on_disentangled_codec
        role: supports
        claim: "Zero-shot speaker cloning capability in style-controllable TTS can be achieved by building on a large-scale pre-trained disentangled codec without sacrificing audio quality relative to dedicated zero-shot TTS systems."
        source: "§4.2, Table 2"
        evidence: "On out-of-domain speakers (test set B), ControlSpeech achieves WER 3.3% vs. VALL-E's 6.7%, with MOS-Q 3.95 comparable to MobileSpeech's 3.94, despite additionally providing independent style control via the frozen FACodec disentangled representation."
        confidence: high
        relevance: high
      - claim_id: ctrlspeech_probabilistic_sampling_improves_generalization
        role: supports
        claim: "Probabilistic sampling from a mixture density model of style representations improves both style diversity and generalization to out-of-domain style descriptions compared to deterministic style encoding."
        source: "§4.2, §4.3, Table 3"
        evidence: "The ablation without SMSD drops MOS-SA from 3.84 to 3.59 and MOS-SD from 4.05 to 3.66 on the many-to-many style control test set, and ControlSpeech degrades much less than baselines on out-of-domain style descriptions (test set C)."
        confidence: high
        relevance: medium
      - claim_id: ctrlspeech_pitch_harder_under_joint_control
        role: complicates
        claim: "Pitch control is measurably harder to preserve when timbre and style are controlled simultaneously, suggesting that pitch conditioning interacts with speaker identity in ways that speed, volume, and emotion do not."
        source: "§4.2, Table 1"
        evidence: "ControlSpeech's pitch accuracy (0.833) is the only style-control metric where it trails style-only baselines InstructTTS (0.849) and PromptTTS 2 (0.867), attributed by the authors to the difficulty of simultaneously controlling timbre and style."
        confidence: medium
        relevance: medium
    limitations:
      - "The training dataset is still limited in scale for style-controllable TTS; the exploration of generative model architectures is narrow (only non-autoregressive parallel decoding is tried)."
    caveats:
      - "The core disentanglement mechanism (FACodec's frozen prosody/content/acoustic-detail/timbre factorization) is reused from NaturalSpeech 3 rather than newly proposed here; ControlSpeech's own contribution is the SMSD module and the joint conditioning architecture built on top of that pre-trained disentangled codec."

  - id: "2025.acl-long.87"
    entry_date: "2026-07-22"
    year: 2025
    venue: ACL
    task: [VC]
    architecture: [flow-matching]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: active_evidence
    method_family: [asr_text_alignment_disentanglement]
    claims:
      - claim_id: takinvc_hybrid_fusion_reduces_leakage
        role: supports
        claim: "Combining ASR-derived phonetic features and quantized self-supervised representations via adaptive fusion reduces timbre leakage while preserving paralinguistic content in zero-shot voice conversion."
        source: "§5.3, Table 3"
        evidence: "Removing the PPG branch (WavLM-only) causes SMOS to drop from 4.11 to 3.07 and SECS from 0.71 to 0.45 on LibriTTS, indicating that SSL features alone carry substantial timbre leakage; removing the SSL branch degrades NMOS and WER, confirming PPGs alone lose paralinguistic richness."
        confidence: high
        relevance: high
      - claim_id: takinvc_flow_matching_faster_than_diffusion
        role: supports
        claim: "Flow matching provides faster inference than diffusion-based voice conversion systems without sacrificing speaker similarity or naturalness."
        source: "§5.1, Table 1"
        evidence: "Takin-VC achieves RTF 0.154, lower than DiffVC (0.294), NS2VC (0.347), and SeedVC (0.341), while simultaneously outperforming these baselines on NMOS, SMOS, and SECS."
        confidence: high
        relevance: low
      - claim_id: takinvc_global_speaker_embedding_insufficient
        role: complicates
        claim: "Global, time-invariant speaker embeddings are insufficient for robust timbre modeling in expressive zero-shot voice conversion."
        source: "§5.3, Table 4"
        evidence: "Removing the context-aware cross-attention module (which aligns source content with target timbre dynamically) drops SMOS from 4.11 to 3.61 and SECS to 0.58, while the memory-augmented module removal drops SECS to 0.52; both modules provide content-sensitive timbre conditioning beyond a static speaker embedding alone."
        confidence: high
        relevance: high
      - claim_id: takinvc_cross_gender_lower_similarity
        role: complicates
        claim: "Cross-gender voice conversion consistently yields lower speaker similarity than same-gender conversion even in well-trained systems."
        source: "§5.2, Table 2"
        evidence: "On the large-scale multilingual dataset, same-gender pairs (F2F: SECS 0.74; M2M: 0.73) outperform cross-gender pairs (F2M: 0.71; M2F: 0.70) in speaker embedding cosine similarity, a gap that persists across all conversion directions."
        confidence: medium
        relevance: low
      - claim_id: takinvc_quantized_ssl_reduces_leakage
        role: refines
        claim: "Quantizing self-supervised speech features before content encoding reduces timbre leakage more effectively than using continuous SSL representations directly."
        source: "§3.2, §5.3, Table 3"
        evidence: "The RVQ quantizer (codebook size 8,200) applied to WavLM features is the key mechanism for timbre suppression in the hybrid encoder; ablation with WavLM-only (continuous features without adaptive fusion) shows SECS drops to 0.45 compared to 0.71 for the full model."
        confidence: high
        relevance: high
    limitations:
      - "All large-scale training data (500k hours) and the 100-speaker evaluation set are proprietary and not publicly available, so it is unclear how much of the gain over competitive baselines is attributable to data scale rather than the proposed modules."
    caveats:
      - "The paper does not include targeted evaluation of paralinguistic preservation (breathing, crying, emotion transfer), despite listing this as a primary contribution; NMOS and SMOS measure general naturalness and speaker similarity but are not designed to capture expressive fidelity or disentanglement quality specifically."

  - id: "2025.ccl-1.77"
    entry_date: "2026-07-22"
    year: 2025
    venue: workshop
    task: [TTS]
    architecture: [diffusion]
    relevance: medium
    evidence_role:
      - control_evidence
    current_role: minor
    method_family: [explicit_multiencoder_factorization]
    claims:
      - claim_id: hfsdv2c_face_features_sufficient_speaker_signal
        role: supports
        claim: "Cross-modal facial features can provide sufficient speaker identity signal for zero-shot voice generation without reference audio."
        source: "§3.2, Table 1, Table 2"
        evidence: "The cross-modal biometric unseen speaker modelling module maps a face image to a speaker embedding via ResNet50 and a trainable visual network; Id.Acc of 66.87/68.99 on LRS2/GRID exceeds all baselines that require reference audio at inference."
        confidence: medium
        relevance: medium
      - claim_id: hfsdv2c_diffusion_improves_prosodic_diversity
        role: supports
        claim: "Diffusion-based denoising in a multimodal TTS/dubbing pipeline improves prosodic diversity relative to deterministic autoregressive or attention-based baselines."
        source: "§4.2.4, Figure 4"
        evidence: "Running HFSD-V2C 10 times per speaker produces diverse F0 contours capturing individual accent patterns, while Neural Dubber and HPMDubbing produce fixed prosodic distributions."
        confidence: medium
        relevance: low
      - claim_id: hfsdv2c_hierarchical_prosody_improves_emotion
        role: supports
        claim: "Hierarchical multimodal prosody modelling (video, audio, and text levels jointly) improves emotion accuracy over methods relying on fewer modalities."
        source: "§4.2.1, §4.2.5, Table 1, Table 2"
        evidence: "Emo.Acc reaches 65.63 on LRS2 and 66.32 on GRID, against 61.46 and 63.66 for HPMDubbing; the ablation (w/o UP) drops Emo.Acc to 22.08/27.64, confirming the prosody module's role."
        confidence: high
        relevance: medium
      - claim_id: hfsdv2c_biometric_embeddings_dont_fully_replace_reference
        role: complicates
        claim: "Zero-shot visual voice cloning accuracy remains significantly below ground-truth speaker identity, indicating that cross-modal biometric embeddings do not fully replace reference audio."
        source: "§4.2.1, Table 1"
        evidence: "GT Id.Acc on LRS2 is 91.52 vs. HFSD-V2C's 66.87; GT MOS is 4.72 vs. 4.29 for HFSD-V2C, a gap of 0.43 that persists after hierarchical multimodal conditioning."
        confidence: high
        relevance: medium
    limitations:
      - "The evaluation is restricted to LRS2 and GRID, both containing constrained speaking styles; the subjective MOS is collected on only 20 clips rated by 20 evaluators, a limited sample for drawing robust conclusions."
    caveats:
      - "Disentanglement in this paper is achieved via separate auxiliary losses (speaker timbre binding, prosody/emotion consistency, duration alignment) rather than an explicit architectural bottleneck or information-theoretic objective; no direct leakage metric between speaker, prosody, and content representations is reported."

  - id: "2508.02038"
    entry_date: "2026-07-22"
    year: 2025
    venue: arXiv
    task: [TTS, VC]
    architecture: [autoregressive-LM, flow-matching, hybrid]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: active_evidence
    method_family: [explicit_multiencoder_factorization, orthogonality_constraint_disentanglement]
    claims:
      - claim_id: marco_diffmeans_emotion_embedding_generalizes
        role: supports
        claim: "Difference-in-means emotion embeddings, computed from paired emotional and neutral speech, enable speaker-independent emotion representations that generalise across speakers."
        source: "§2.2"
        evidence: "Marco-Voice's Rotational Emotion Embedding aggregates the normalized difference between emotional and neutral speech from the same speaker over 10 pairs to produce a speaker-independent emotion direction vector, which is then injected into both the LM and flow-matching module for any speaker."
        confidence: medium
        relevance: high
      - claim_id: marco_orthogonality_enables_independent_control
        role: supports
        claim: "Enforcing orthogonality between speaker and emotion embedding spaces via a cross-dot-product loss enables independent control of voice identity and emotional style without degrading either."
        source: "§2.3, Table 1"
        evidence: "Marco-Voice v4 (with cross-orthogonal constraint) achieves speaker similarity 0.8275 vs CosyVoice2's 0.605 and emotional expression MOS 4.225 vs CosyVoice2's 3.240, indicating both identity and style are preserved simultaneously under the orthogonality regularization."
        confidence: high
        relevance: high
      - claim_id: marco_unified_modeling_beats_separate_systems
        role: supports
        claim: "Unified joint modeling of voice cloning and emotion control produces higher speaker similarity and emotional naturalness than systems that address the two capabilities separately."
        source: "§4.1, §4.2, Tables 1-2"
        evidence: "Marco-Voice achieves overall satisfaction 4.430 vs CosyVoice2's 3.330 and is preferred over CosyVoice1/CosyVoice2 in 60%/65% of A/B comparisons."
        confidence: medium
        relevance: medium
      - claim_id: marco_expressive_fillers_inflate_wer
        role: complicates
        claim: "Expressive emotional TTS systems that include naturalistic vocalized fillers exhibit higher word error rates on clean-transcript benchmarks, even when perceived speech quality is high."
        source: "§4.4, Table 4-5"
        evidence: "Marco-Voice v4 shows WER 17.6 on AISHELL-3 (higher than CosyVoice1's 3.0) despite high subjective quality, attributed to vocalized fillers and prosodic elements not present in the reference transcript."
        confidence: medium
        relevance: low
      - claim_id: marco_gender_imbalance_emotion_recognition
        role: complicates
        claim: "Gender imbalance in emotional speech training data produces systematic differences in emotion recognition accuracy, with male speakers underperforming female speakers across most emotion categories."
        source: "§4.4, Figure 6"
        evidence: "Emotion recognition accuracy analysis on Marco-Voice v4 output shows systematic accuracy gaps between male and female speakers across most of the 7 emotion categories tested."
        confidence: medium
        relevance: low
    limitations:
      - "Requires paired emotional/neutral speech data from the same speaker for emotion embedding extraction, which limits scalability and language coverage; model size not reported."
    caveats:
      - "The cross-orthogonal constraint is validated through downstream naturalness/similarity/expression scores rather than a direct information-leakage metric between the speaker and emotion embedding spaces; disentanglement quality is inferred from generation quality, not measured directly."

  - id: "2508.02849"
    entry_date: "2026-07-22"
    year: 2025
    venue: arXiv
    task: [codec]
    architecture: [VAE]
    relevance: high
    evidence_role:
      - core_evidence
      - architecture_variant
    current_role: active_evidence
    method_family: [rvq_semantic_acoustic_distillation]
    claims:
      - claim_id: secousti_ssl_distillation_incomplete_disentanglement
        role: complicates
        claim: "Distillation from self-supervised models such as HuBERT or WavLM does not achieve true semantic disentanglement in speech codecs, as these representations inherently retain paralinguistic content."
        source: "§II.A, §V.B"
        evidence: "The paper motivates its cross-modal contrastive approach by noting that HuBERT/WavLM-distilled codecs (SpeechTokenizer, MimiCodec) leave incomplete separation because the distillation targets themselves carry residual paralinguistic content."
        confidence: medium
        relevance: high
      - claim_id: secousti_contrastive_learning_cleaner_than_classification
        role: supports
        claim: "Frame-level cross-modal contrastive learning between phoneme and speech representations produces cleaner semantic-paralinguistic separation than phoneme classification loss in neural codecs."
        source: "§V.D, Table IV"
        evidence: "In the voice conversion ablation, SecoustiCodec's frame-level contrastive approach achieves SPK-SIM 0.71 and Emo-Sim 0.86, versus SecoustiCodec-ASR-Loss (phoneme classification) at SPK-SIM 0.64 and Emo-Sim 0.69."
        confidence: high
        relevance: high
      - claim_id: secousti_vae_fsq_improves_utilization
        role: supports
        claim: "VAE-augmented finite scalar quantization (VAE+FSQ) achieves substantially higher codebook utilisation and reduced long-tail token distribution compared to VQ-VAE in single-codebook speech codecs."
        source: "§V.C, Figure 4, Table II"
        evidence: "The VAE+FSQ configuration achieves 98.06% codebook utilisation, substantially higher than reported rates for VQ-VAE and SimVQ under the same conditions."
        confidence: high
        relevance: medium
      - claim_id: secousti_paralinguistic_bridge_improves_reconstruction
        role: supports
        claim: "Explicit modeling of paralinguistic information as a reconstruction bridge between semantic and acoustic encodings improves both semantic completeness and reconstruction fidelity in low-bitrate streaming codecs."
        source: "§III.B, §V.B"
        evidence: "SecoustiCodec models three coordinated representations (semantic S, acoustic A, paralinguistic G) with the approximate relationship S + G ~ A, achieving PESQ 1.77-2.58 and WER 3.99-11.58 at 0.27-1 kbps, competitive with or exceeding causal multi-codebook baselines at lower bitrate."
        confidence: medium
        relevance: high
      - claim_id: secousti_staged_training_necessary
        role: supports
        claim: "Staged training that freezes acoustic modules before introducing semantic and KL losses is necessary for stable convergence in multi-objective codec training."
        source: "§III.E, §V.C, Table II"
        evidence: "Ablations without the acoustic-constrained staged training strategy show significant degradation across all metrics relative to the two-stage protocol."
        confidence: medium
        relevance: low
    limitations:
      - "The contrastive learning objective requires duration-aligned phoneme-level text labels during training, which the authors flag as the key limitation and identify unsupervised disentanglement as the primary future direction."
    caveats:
      - "Codebook utilisation of 98.06% is reported for the VAE-FSQ variant but without a direct connection to downstream LM or TTS training quality being demonstrated empirically; the disentanglement claim rests on the voice-conversion ablation (Table IV) rather than a dedicated information-leakage probe."

  - id: "2508.04141"
    entry_date: "2026-07-22"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [autoregressive-LM, hybrid]
    relevance: medium
    evidence_role:
      - core_evidence
      - architecture_variant
    current_role: active_evidence
    method_family: [explicit_multiencoder_factorization]
    claims:
      - claim_id: parallelgpt_parallel_tokens_reduce_wer
        role: supports
        claim: "Generating semantic and acoustic tokens simultaneously in a single autoregressive forward pass, rather than cascading semantic prediction before acoustic prediction, reduces word error rate and improves naturalness in zero-shot TTS."
        source: "§V.A, Table I"
        evidence: "Parallel GPT achieves MOS 4.11/4.08 (dev/test) and WER 0.211/0.241, outperforming cascaded baselines MaskGCT and CosyVoice on naturalness on LibriTTS."
        confidence: medium
        relevance: medium
      - claim_id: parallelgpt_specialist_ssl_enables_disentanglement
        role: supports
        claim: "Combining specialist SSL models for distinct speech attributes (semantic content, acoustic texture, speaker identity) as frozen feature extractors enables more effective token-level disentanglement than using a single encoder for all attributes."
        source: "§III.A, Tables III-IV"
        evidence: "Ablation shows that removing parallel tokenization (using only Wav2Vec or only BEATs) sharply degrades MOS and WER relative to the full Parallel Tokenizer combining Wav2Vec 2.0 (semantic), BEATs (acoustic), and CampPlus (speaker)."
        confidence: medium
        relevance: high
      - claim_id: parallelgpt_hybrid_ar_nar_distributes_complexity
        role: supports
        claim: "A hybrid AR+NAR design that enforces independence at the coarse token level and interdependence at the fine-grained level distributes modeling complexity more effectively than an all-AR or all-NAR approach."
        source: "§V.B, Tables III-IV"
        evidence: "Removing parallel AR prediction (-w/o parallel) causes the largest WER increase (0.505 dev English), and using only AR without the Coupled NAR stage degrades SMOS and UTMOS, confirming both stages contribute distinct value."
        confidence: medium
        relevance: low
      - claim_id: parallelgpt_naturalness_gains_dont_close_speaker_gap
        role: complicates
        claim: "Parallel semantic-acoustic modeling improves naturalness and intelligibility without fully closing the speaker similarity gap relative to systems with dedicated speaker embedding refinement."
        source: "§V.A, Table I"
        evidence: "Parallel GPT's SMOS (4.08/3.92) trails CosyVoice's (4.23/4.11) on English, a gap the authors attribute to CosyVoice's specialized speaker embedding refinement absent from Parallel GPT's disentangled token design."
        confidence: medium
        relevance: medium
    limitations:
      - "Speaker similarity lags behind CosyVoice (SMOS gap approximately 0.15-0.2 on English); model size is not reported, making compute comparisons difficult."
    caveats:
      - "The subjective decoupling evaluation (§V.C) relies on 90% evaluator agreement rather than a standardized quantitative metric, leaving rigorous assessment of the semantic/acoustic/speaker disentanglement as an open question."

  - id: "2507.20091"
    entry_date: "2026-07-22"
    year: 2025
