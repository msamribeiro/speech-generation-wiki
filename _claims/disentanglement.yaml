        source: "§3, Table 1, Figure 1"
        evidence: "With ground-truth input held fixed, Unit-HiFiGAN scores SECS 0.555 / EER 40.52 versus HiFi-GAN's SECS 0.894 / EER 22.96, and spectrogram visualization shows the unit-based vocoder output diverges from ground truth in the frequency domain."
        confidence: high
        relevance: high
      - claim_id: divise_avpretraining_supplies_speaker_identity
        role: supports
        claim: "Audio-visual pre-trained visual encoders can supply enough speaker-identity information from silent video to make explicit speaker embeddings unnecessary in video-to-speech synthesis."
        source: "§5.2, Table 4"
        evidence: "DiVISe attains the best or near-best SECS scores on LRS2 (0.609) and LRS3 (0.624) among all compared methods, including several that use audio speaker embeddings during training or inference (SVTS, Multi-Task)."
        confidence: high
        relevance: medium
      - claim_id: divise_objective_gains_dont_transfer_to_subjective_quality
        role: complicates
        claim: "Gains in objective intelligibility metrics from architectural changes do not necessarily transfer to subjective audio-quality preference, especially when speaker-identity cues are removed from the listening context."
        source: "Appendix C, Table 16"
        evidence: "In an audio-only MOS test without speaker reference images, Unit-HiFiGAN scores higher (4.37±0.11) than the Mel-based HiFi-GAN (4.24±0.12), the inverse of the speaker-matching and intelligibility rankings observed elsewhere in the paper."
