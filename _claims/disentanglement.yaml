    current_role: active_evidence
    method_family: [data_training_recipe_disentanglement]
    claims:
      - claim_id: diemotts_selfsupervised_distillation_vs_grl_vq
        role: supports
        claim: "Self-supervised distillation with emotion-specific inductive biases can learn speaker-independent emotion embeddings more effectively than GRL-based or VQ-based disentanglement."
        source: "§3.4, Table 1"
        evidence: "DiEmo-TTS surpasses Trans-GRL, Trans-VQ, and Trans-Ort on eMOS across all four emotion categories in subjective evaluation, without requiring explicit speaker labels during emotion encoder training."
        confidence: high
        relevance: high
      - claim_id: diemotts_formant_perturbation_disentangle
        role: supports
        claim: "Formant-based speaker perturbation is more effective for disentangling speaker identity from emotion than non-targeted noise augmentation in cross-speaker emotion transfer."
        source: "§3.6, Table 2"
        evidence: "Replacing formant perturbation with MUSAN/RIR noise augmentation in the ablation increases WER and degrades SECS, whereas formant perturbation exploits the timbre-formant correlation to distort identity while preserving emotional expression."
        confidence: high
        relevance: high
      - claim_id: diemotts_dct_conditioning_balance
        role: supports
        claim: "Multi-factor conditioning via shared attention mechanisms produces better balance between speaker fidelity and emotional expressiveness than concatenation conditioning in transformer-based TTS."
        source: "§3.6, Table 2"
        evidence: "Adding the DCT block improves eMOS from 3.89 to 4.07 while keeping sMOS comparable in the ablation; the block applies weight-sharing multi-head attention per style signal and fuses outputs via MLP."
        confidence: high
        relevance: medium
      - claim_id: diemotts_ssl_labeled_dependency
        role: complicates
        claim: "Achieving speaker-independent emotion representations via self-supervised methods still depends on labeled auxiliary data for emotion space definition."
        source: "§4, §3.2"
        evidence: "The emotion clustering step requires a WavLM-based emotional attribute predictor fine-tuned on the MSP-Podcast labeled corpus; the authors identify dependence on this predictor as a limitation for generalising to unseen speakers."
        confidence: medium
        relevance: medium
