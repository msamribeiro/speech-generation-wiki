        role: supports
        claim: "Synthetic speech generated by a dialect-conditioned TTS system, when filtered for dialect consistency and perceptual quality, is usable as training data for a downstream speech-to-speech conversion task and can outperform a small, manually collected parallel corpus."
        source: "§3.5, Table 4"
        evidence: "A voice conversion model (DurFlex-EVC) trained on the TMDD dataset synthesized by TMD-TTS achieves higher MOS (3.23/3.63 at 16k/22kHz) than the same model trained on the prior manually collected baseline dataset (3.07/3.54)."
        confidence: medium
        relevance: low
      - claim_id: tmdtts_attribute_conditioning_inference_cost
        role: complicates
        claim: "Gains in speaker/style-consistency metrics from dialect- or attribute-specific conditioning mechanisms can come with a measurable inference-speed cost relative to simpler architectures."
        source: "§3.2"
        evidence: "TMD-TTS's real-time factor (approximately 0.031-0.032) is roughly 50% higher than VITS2's (approximately 0.020-0.021), even though TMD-TTS still meets real-time synthesis requirements."
        confidence: medium
        relevance: low
    limitations:
      - "Evaluation is confined to a single language (Tibetan) and its three dialects; the dialect classifier used for evaluation metrics is not itself independently validated; comparison baselines were reimplemented by the authors rather than run from official checkpoints."
    caveats:
      - "TMD-TTS's DSDR-Net routes dialect-specific acoustic patterns through dedicated FFN sub-networks, a conditional-computation form of attribute disentanglement distinct from the semantic/acoustic or speaker/style separations more commonly seen in this concept; relevance is real but narrower in scope, confined to a single low-resource dialect continuum."
  - id: "2509.19231"
