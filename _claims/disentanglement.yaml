      - claim_id: indextts2_distilled_emotion_routing
        role: supports
        claim: "Knowledge distillation from a large reasoning LLM into a small fine-tuned model provides a usable soft emotion routing interface for TTS that outperforms instruction-tuned baselines on naturalness and prosody."
        source: "§ Text-to-Emotion, Table 3/5"
        evidence: "The T2E module (DeepSeek-R1 teacher distilled into Qwen3-1.7B via LoRA) outperforms CosyVoice2 on all four MOS dimensions for natural language emotion control (SMOS 3.875 vs. 2.973)."
        confidence: medium
        relevance: low
    limitations:
      - "Emotional training data (135 hours, 361 speakers) is modest and partly commercial, raising reproducibility and demographic-coverage questions; the GRL-based disentanglement targets only 7 discrete basic emotions rather than continuous or compositional emotion representations; WER degrades slightly on AISHELL-1 relative to IndexTTS, suggesting the emotional training may slightly hurt clean-speech intelligibility."
    caveats:
      - "The GRL-based emotion-speaker disentanglement is a real architectural mechanism but is not directly ablated in isolation in this paper; its validation is inferred from the three-stage curriculum results (which combine disentanglement and staged-training effects) rather than a dedicated GRL on/off comparison."
  - id: "2509.09201"
    entry_date: "2026-07-22"
    year: 2025
    venue: arXiv
    task: [codec, VC]
    architecture: [GAN]
    relevance: high
    evidence_role:
      - core_evidence
    current_role: active_evidence
    method_family: [orthogonality_constraint_disentanglement]
    claims:
      - claim_id: decodec_disentangles_speech_background
        role: supports
        claim: "Neural audio codecs can disentangle speech and background sound in the representation domain, enabling downstream tasks to selectively access either component without explicit front-end separation."
        source: "§4.3, §4.5, §6.1, Table 4, Table 6"
        evidence: "DeCodec's SOP+RST design achieves orthogonal speech and background subspaces; recombining representations enables one-shot VC (SPK-SIM 0.83, WER 50.46) and speech enhancement (DNSMOS OVL 3.39) without denoising pre-processing, outperforming cascaded StoRM+SpeechTokenizer on ASR (WER* 26.7 vs. 34.5)."
        confidence: high
        relevance: high
      - claim_id: decodec_semantic_guidance_noise_robust_asr
        role: supports
        claim: "Semantic guidance from self-supervised features in the first quantiser layer improves the noise-robustness of codec representations used for downstream ASR."
        source: "§6.1.4, Table 5"
        evidence: "Ablation-3 (SOP+RST without semantic guidance) achieves WER* 41.9 on noisy speech; adding HuBERT-L9 guidance reduces it to 25.8 (causal) and 23.6 (non-causal)."
        confidence: high
        relevance: medium
      - claim_id: decodec_disentanglement_reconstruction_tradeoff
        role: complicates
        claim: "Explicit disentanglement constraints in neural codecs introduce a reconstruction quality trade-off relative to purely reconstruction-optimised designs."
        source: "§6.1.1, Table 2"
        evidence: "DeCodec's mel distance on clean speech (0.89) is worse than DAC (0.65) and HiFi-Codec (0.75), which use no orthogonality or disentanglement losses, suggesting that forcing orthogonal subspace separation increases spectral distortion."
        confidence: medium
        relevance: high
      - claim_id: decodec_hierarchical_controllable_background
        role: supports
        claim: "Hierarchical codec disentanglement enables controllable background sound handling in zero-shot TTS without retraining the downstream generation model."
        source: "§6.2.2, Table 7"
        evidence: "VALL-E trained on DeCodec tokens achieves MOS 4.09 with background preserved versus MOS 3.96 without, controlled solely by whether background tokens are included at inference; the TTS model itself was trained only on clean speech."
        confidence: medium
        relevance: medium
      - claim_id: decodec_noisy_vc_wer_despite_similarity
        role: complicates
        claim: "Voice conversion on noisy speech via representation recombination produces high WER even when speaker similarity is well-preserved, due to voiced/unvoiced segment boundary mismatches between source and reference utterances."
        source: "§6.1.3, Table 4"
        evidence: "DeCodec one-shot VC achieves SPK-SIM 0.83 but WER 50.46, which the authors attribute to structural mismatch in speech segment timing rather than semantic content corruption."
        confidence: medium
        relevance: medium
    limitations:
      - "Subjective evaluations use small panels (10-12 volunteers, 300 clips); the noisy speech test set is constructed by synthetically mixing clean LibriSpeech with DNS-Noise rather than real-world recordings; model size is not reported; the high VC WER under noise indicates the representation-recombination approach needs further design work before practical deployment."
    caveats:
      - "DeCodec's SOP+RST design is one of the more rigorous disentanglement contributions in this batch, with an explicit orthogonality constraint and swap-training procedure that directly proves non-leakage between speech and background subspaces rather than relying on downstream task performance alone."
  - id: "2509.13068"
    entry_date: "2026-07-22"
    year: 2025
    venue: arXiv
    task: [TTS, codec, VC]
    architecture: [autoregressive-LM, VAE]
    relevance: high
    evidence_role:
      - core_evidence
    current_role: active_evidence
    method_family: [rvq_semantic_acoustic_distillation]
    claims:
      - claim_id: msrcodec_cascaded_residual_structural_disentanglement
        role: supports
        claim: "Cascaded residual codec architectures can enforce attribute disentanglement through structure rather than through adversarial training objectives."
        source: "§2.1, §3.3.3, Table 3"
        evidence: "MSR-Codec achieves clean separation of timbre, prosody, and semantic content by having each stream operate on residuals from the previous stage, without adversarial disentanglement loss; VC experiments confirm independent manipulation of each attribute."
        confidence: high
        relevance: high
      - claim_id: msrcodec_prosody_supervision_disentangles_pitch
        role: supports
        claim: "Explicit prosodic supervision in a dedicated codec stream promotes measurable disentanglement of pitch from speaker identity."
        source: "§2.1.2, §3.3.3, Table 3"
        evidence: "The prosody stream (VQ1) is trained with MSE loss against ground-truth F0 and spectral energy; prosody-only VC achieves low pitch deviation (12.3-14.2 Hz) while maintaining high source-speaker similarity (0.59-0.64), confirming prosody and timbre are independently manipulable."
        confidence: high
        relevance: high
      - claim_id: msrcodec_disentangled_lowbitrate_speaker_sim
        role: supports
        claim: "Disentangled codec designs can achieve competitive speaker similarity at lower bitrates than undifferentiated RVQ codecs."
        source: "§3.3.1, Table 1"
        evidence: "MSR-Codec-424 achieves SPK-SIM 0.80 at 424 bps, higher than WavTokenizer (0.67 at 900 bps) and X-Codec (0.72 at 1000 bps), attributed to the time-invariant timbre stream that preserves speaker identity independent of utterance length."
        confidence: medium
        relevance: medium
      - claim_id: msrcodec_dataefficient_competitive_intelligibility
        role: supports
        claim: "Data-efficient TTS systems built on factorized codec representations can achieve competitive intelligibility relative to larger models trained on more data."
        source: "§3.3.2, Table 2"
        evidence: "The 0.2B MSR-Codec-524 TTS model trained on 45k hours achieves WER 3.07% on Seed-TTS-eval English, outperforming Llasa-1B trained on 250k hours (WER 3.22%) and FireRedTTS-0.4B trained on 150k hours (WER 3.82%)."
        confidence: medium
        relevance: low
      - claim_id: msrcodec_fidelity_similarity_diverge_lowbitrate
        role: complicates
        claim: "Signal-fidelity codec metrics (STOI, PESQ) and speaker similarity diverge at low bitrates, making holistic quality assessment difficult."
        source: "§3.3.1, Table 1"
        evidence: "MSR-Codec-424 achieves the highest SPK-SIM (0.80) among codecs at comparable bitrates but lower STOI (0.84) and PESQ-WB (1.82) than some baselines, indicating speaker preservation and signal-level fidelity are optimized differently by the multi-stream design."
        confidence: medium
        relevance: medium
    limitations:
      - "No subjective listening test (MOS/MUSHRA) is reported for any condition; the VC evaluation protocol is small (8 target speakers from VCTK, 100 source utterances from LibriTTS); the FreGAN vocoder operates at 16 kHz; the TTS model is evaluated only in English despite the codec's bilingual training data."
    caveats:
      - "MSR-Codec is presented explicitly as a structural alternative to adversarial disentanglement methods such as NaturalSpeech 3, directly relevant to the concept's distinction between architectural and adversarial disentanglement approaches."
  - id: "2509.14684"
    entry_date: "2026-07-22"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching]
    relevance: high
    evidence_role:
      - core_evidence
    current_role: active_evidence
    method_family: [explicit_multiencoder_factorization]
    claims:
      - claim_id: daiental_crossattention_beats_concatenation
        role: supports
        claim: "Injecting time-varying environment conditioning via cross-attention into flow-matching TTS backbones produces higher environment fidelity than direct concatenation of environment features."
        source: "§4.2, Table 1"
        evidence: "DAIEN-TTS with cross-attention achieves ESMOS 3.65 versus 3.49 for the concatenation-based ablated variant, with naturalness MOS also improving from 3.68 to 3.78."
        confidence: medium
        relevance: medium
      - claim_id: daiental_separation_module_enables_environmental_prompts
        role: supports
        claim: "A pretrained source separation module can enable zero-shot TTS to use environmental speech as a speaker prompt without degradation from background noise."
        source: "§4.1, Table 1"
        evidence: "DAIEN-TTS achieves WER 1.93% and MOS 3.84 under environmental speaker prompts, slightly outperforming F5-TTS with clean prompts (WER 2.30%, MOS 3.80) and substantially outperforming F5-TTS under the same environmental conditions (WER 2.87%, MOS 3.09)."
        confidence: high
        relevance: high
      - claim_id: daiental_dual_cfg_independent_control
        role: supports
        claim: "Dual classifier-free guidance enables independent control of speaker and environment attributes in a jointly trained flow-matching TTS model."
        source: "§2.3.1, §4.2"
        evidence: "DCFG with separate guidance strengths for the speech-text condition and the environment condition is the inference-time mechanism through which DAIEN-TTS independently controls timbre and acoustic background; ablating the cross-attention (which effectively collapses environment guidance) degrades environment fidelity without recovering speaker similarity."
        confidence: medium
        relevance: high
      - claim_id: daiental_no_baselines_for_timevarying_env
        role: complicates
        claim: "The absence of established baseline systems for time-varying environment-aware TTS makes it difficult to assess absolute performance gains beyond ablation comparisons."
        source: "§3.2"
        evidence: "For the background environment synthesis condition, no existing systems match the task definition; all comparisons are between DAIEN-TTS and its own ablated variant, with no external reference point for environmental fidelity."
        confidence: medium
        relevance: low
      - claim_id: daiental_flowmatching_sensitive_to_prompt_environment
        role: complicates
        claim: "Flow-matching TTS systems trained on clean speech are sensitive to acoustic environment in the speaker prompt, with degradation visible in both speaker similarity and naturalness."
        source: "§4.1, Table 1"
        evidence: "F5-TTS (trained on clean LibriTTS data) shows SIM-o dropping from 0.58 to 0.49 and MOS dropping from 3.80 to 3.09 when the speaker prompt contains background noise rather than clean speech."
        confidence: high
        relevance: medium
    limitations:
      - "Model size is not reported; the SES module introduces a separate pretrained component that must be trained and aligned with the TTS module, adding pipeline complexity; the SNR adaptation strategy assumes target SNR should match the environment prompt, which may not always align with creative intent."
    caveats:
      - "DAIEN-TTS's SES module is a genuine speech/environment separation mechanism validated via ablation (cross-attention vs. concatenation), directly relevant to representation-level disentanglement even though its downstream framing is environment-aware TTS rather than speaker/content separation."
  - id: "2509.15626"
    entry_date: "2026-07-22"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [VAE]
    relevance: high
    evidence_role:
      - core_evidence
    current_role: active_evidence
    method_family: [data_training_recipe_disentanglement]
    claims:
      - claim_id: libritts_vi_leakage_structural
        role: supports
        claim: "Impression leakage in controllable TTS arises structurally when a single reference utterance is used for both speaker identity and style conditioning during training."
        source: "§2, §5.2, Table 2"
        evidence: "VIC-base achieves leakage delta 0.22 (significantly different from zero), confirming the reference audio biases synthesized VI toward the reference's inherent voice impression even when GRL and high-rate dropout are applied."
        confidence: high
        relevance: high
      - claim_id: libritts_vi_decoupled_utterances_reduce_leakage
        role: supports
        claim: "Decoupled training using distinct utterances for speaker and style conditioning reduces style leakage without changing the underlying TTS architecture."
        source: "§4.1, §5.2, Table 2"
        evidence: "VIC-dis uses a separate utterance from the same speaker for reference conditioning during training, reducing leakage delta from 0.22 to 0.14 with a statistically significant improvement in RVI-MSE (0.61 to 0.51)."
        confidence: high
        relevance: high
      - claim_id: libritts_vi_speakerfree_strongest_leakage_reduction
        role: supports
        claim: "Eliminating the speaker reference and conditioning solely on a style vector achieves the strongest leakage reduction, at a moderate cost in speaker fidelity."
        source: "§4.2, §5.2, Table 2"
        evidence: "VIC-srf reduces the leakage delta to 0.05 (not significantly different from zero), while SECS drops to 0.72, remaining above the cross-speaker bound of 0.63 but below the same-speaker bound of 0.81."
        confidence: high
        relevance: high
      - claim_id: libritts_vi_llm_tts_poor_numerical_control
        role: complicates
        claim: "LLM-based TTS systems conditioned on natural language prompts are inadequate for fine-grained numerical voice impression control."
        source: "§5.1, §5.2, Table 2, Table 3"
        evidence: "Qwen3-TTS (zero-shot) achieves VI-MSE of 0.82 versus 0.39 for the VITS-based baseline; fine-tuning worsens controllability further (VI-MSE 0.87), and text-VI entanglement is confirmed empirically by punctuation biasing predicted impressions."
        confidence: medium
        relevance: low
      - claim_id: libritts_vi_annotation_agreement_valid
        role: supports
        claim: "Perceptual voice impression annotation can achieve inter-annotator agreement comparable to other subjective speech tasks, supporting the validity of VI corpora."
        source: "§3, Table 1"
        evidence: "Krippendorff's alpha averages 0.470 across 10 VI dimensions, exceeding reported agreement for speech emotion recognition (0.442) and singing voice preference (0.153)."
        confidence: medium
        relevance: low
    limitations:
      - "The LibriTTS-VI corpus contains only 130 manually annotated utterances; the remaining LibriTTS-R annotations are estimated by a trained VI estimator; several VI dimensions fall below the reliable inter-annotator agreement threshold; evaluation is confined to the clean LibriTTS-R audiobook domain; the subjective MOS evaluation uses only two speakers."
    caveats:
      - "This paper is notable within the concept for demonstrating that leakage reduction can be achieved purely through training-data decoupling (different reference utterances, or no reference at all) rather than an architectural or adversarial mechanism, complementing MSR-Codec's structural approach and Noro's contrastive approach."
  - id: "2509.16010"
    entry_date: "2026-07-22"
    year: 2025
    venue: arXiv
    task: [TTS, VC]
    architecture: [hybrid]
    relevance: high
    evidence_role:
      - core_evidence
    current_role: active_evidence
    method_family: [explicit_multiencoder_factorization]
    claims:
      - claim_id: fedpisa_separate_adapters_improve_both
        role: supports
        claim: "Disentangling speaker identity from expressive style into separate adapter modules improves both speaker similarity and style expressivity in personalised voice cloning."
        source: "§3.3, Table 2"
        evidence: "Ablations on GPT-SOVITS-V4 show removing the private ID-LoRA drops speaker similarity from 0.645 to 0.507, while removing the Style-LoRA drops style expressivity from 0.704 to 0.588; a single unified adapter cannot optimise both objectives without mutual degradation."
        confidence: high
        relevance: high
      - claim_id: fedpisa_collaborative_style_overcomes_scarcity
        role: supports
        claim: "Collaborative style learning across clients in a federated setting can overcome per-client data scarcity and produce higher speaker similarity than purely local fine-tuning."
        source: "§3.2, Table 2"
        evidence: "Fed-PISA exceeds local fine-tuning in both speaker similarity (0.645 vs 0.529) and naturalness MOS (4.08 vs 3.36), demonstrating that sharing expressive style information across clients compensates for limited per-client data."
        confidence: medium
        relevance: low
      - claim_id: fedpisa_personalized_aggregation_beats_fedavg
        role: supports
        claim: "Personalized aggregation weighted by stylistic similarity between clients outperforms uniform averaging for federated style learning."
        source: "§3.3, Table 2"
        evidence: "Under identical backbone and LoRA configuration, attention-based personalized aggregation achieves style expressivity 0.704 and speaker similarity 0.645 versus FedAvg's 0.476 and 0.523, confirming that style-averaged updates homogenise client models and harm expressivity."
        confidence: medium
        relevance: low
      - claim_id: fedpisa_stylisation_ceiling_without_identity_loss
        role: complicates
        claim: "In speaker adaptation, stylisation steps beyond a small fraction of total training degrade speaker identity and peak naturalness, establishing a ceiling on achievable style transfer without identity loss."
        source: "§3.4, Figure 2"
        evidence: "Holding total steps at 100, speaker similarity decreases monotonically as stylisation steps increase, while naturalness peaks at 20% stylisation; excessive stylisation corrupts identity and degrades naturalness MOS."
        confidence: medium
        relevance: medium
      - claim_id: fedpisa_legacy_backbone_comparison_confound
        role: complicates
        claim: "Fair cross-framework comparison in federated TTS is obstructed when competing methods are architecturally coupled to legacy backbones and cannot be reimplemented on modern foundations."
        source: "§3.1.2"
        evidence: "FedSpeech and Federated Dynamic Transformer use FastSpeech2-XL and Transformer-TTS respectively and are incompatible with LoRA, making it impossible to isolate the contribution of the federation strategy from the backbone quality."
        confidence: medium
        relevance: low
    limitations:
      - "Federated baselines run on architecturally distinct, weaker backbones, confounding attribution of gains to the federation strategy versus modern backbone quality; evaluation uses 60 speakers as 60 independent clients from four relatively small emotion datasets; naturalness is evaluated by only 22 in-lab researchers rather than crowd-sourced raters."
    caveats:
      - "Fed-PISA's ID-LoRA/Style-LoRA split is a clean instance of identity-style disentanglement implemented via separate, non-overlapping-gradient adapter modules rather than a shared representation regularised by a disentanglement loss."
  - id: "2509.17006"
    entry_date: "2026-07-22"
    year: 2025
    venue: arXiv
    task: [codec]
    architecture: [GAN]
    relevance: high
    evidence_role:
      - core_evidence
    current_role: active_evidence
    method_family: [rvq_semantic_acoustic_distillation]
    claims:
      - claim_id: mbcodec_explicit_disentanglement_improves_reconstruction
        role: supports
        claim: "Explicit semantic-acoustic disentanglement in neural codecs improves reconstruction quality at comparable bitrates relative to conventional residual quantization approaches."
        source: "§3.2, Table 1"
        evidence: "MBCodec (16 codebooks, 50Hz, 8.8kbps) achieves PESQ 3.83 and MUSHRA 85.9, versus EnCodec at the same bitrate scoring PESQ 2.78 and MUSHRA 85.3; at 4.4kbps, MBCodec scores PESQ 3.64 versus SpeechTokenizer's PESQ 1.26 and MUSHRA 79.0."
        confidence: high
        relevance: high
      - claim_id: mbcodec_pqmf_supervision_improves_fidelity
        role: supports
        claim: "PQMF-based frequency subband supervision substantially improves spectral reconstruction fidelity in multi-codebook codec training."
        source: "§3.4, Table 3"
        evidence: "Ablation shows removing PQMF supervision degrades PESQ from 3.83 to 2.34 (a 39% drop) and increases Mel-spectrogram distance from 2.34 to 3.45 in the best MBCodec configuration."
        confidence: high
        relevance: high
      - claim_id: mbcodec_nonuniform_dropout_beats_uniform
        role: supports
        claim: "Non-uniform codebook dropout distributions that concentrate sampling on early RVQ layers outperform uniform dropout, better matching the hierarchical information density of residual quantization."
        source: "§2.2, §3.4, Table 2, Table 3"
        evidence: "Half-Gaussian adaptive dropout achieves PESQ 3.28 versus exponential decay at 3.02 and chi-squared at 2.75; removing adaptive dropout entirely drops SI-SDR from 7.94 to 7.32 and increases STFT distance from 0.08 to 0.22."
        confidence: medium
        relevance: low
      - claim_id: mbcodec_ultralow_bitrate_persistent_gap
        role: complicates
        claim: "Ultra-low bitrate neural audio compression imposes a persistent quality gap relative to ground truth, even with strong disentanglement strategies."
        source: "§3.2, Table 1"
        evidence: "MBCodec at 2.2kbps achieves MUSHRA 82.8 versus ground truth MUSHRA 90.7 (a gap of 7.9 points) and PESQ 2.98 versus 4.64, despite the 170x compression ratio and explicit semantic-acoustic disentanglement."
        confidence: medium
        relevance: medium
    limitations:
      - "Not evaluated as a token representation for downstream TTS or speech LM inference, which is presented as a primary motivation; trained/evaluated on speech-dominant data only, not music or general audio; no parameter count reported; comparison set limited to DAC, EnCodec, and SpeechTokenizer, missing more recent codecs such as Mimi or BiCodec."
    caveats:
      - "MBCodec's contribution is the operationalisation of semantic-acoustic disentanglement via explicit PQMF frequency-band codebook assignment, extending SpeechTokenizer's residual-distillation approach to a more granular, per-codebook functional separation."
  - id: "2509.17516"
    entry_date: "2026-07-22"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching, GAN]
    relevance: medium
    evidence_role:
      - control_evidence
    current_role: active_evidence
    method_family: [data_training_recipe_disentanglement]
    claims:
      - claim_id: audiobookcc_decoupled_training_improves_alignment
        role: supports
        claim: "Decoupling the training pairing between the speech prompt and the synthesis target (rather than using identical prompt/target audio) improves text-prosody alignment in style-controllable TTS, at the cost of an inflated speaker-similarity score under the coupled setup."
        source: "§3.3, Table 2"
        evidence: "Switching from non-decoupled to decoupled prompt/target training raises S-MOS from 3.45 to 3.82-3.93 while reducing speaker-similarity from 0.87 (interpreted as over-similar timbre/prosody) to 0.69-0.8."
        confidence: high
        relevance: high
      - claim_id: audiobookcc_context_improves_coherence
        role: supports
        claim: "Providing an autoregressive speech language model with explicit surrounding-sentence text context improves narrative coherence in long-form speech generation beyond what sentence-isolated synthesis achieves."
        source: "§2.1, §3.3, Table 1"
        evidence: "Adding pre/post-context text sequences raises Chapter M-MOS from 3.88 (CosyVoice2 baseline, sentence-level synthesis) to 4.13, with a qualitative example showing the model generating contextually appropriate laughter for a sentence with no explicit emotional markers when given preceding-sentence context."
        confidence: medium
        relevance: low
      - claim_id: audiobookcc_decoupling_threshold_tradeoff
        role: complicates
        claim: "The strength of the prompt/target decoupling threshold used during training trades off speaker-identity stability against naturalness, rather than improving both simultaneously."
        source: "§3.3, Table 2"
        evidence: "Sweeping the voiceprint-similarity clustering threshold shows a lower threshold reduces speaker-similarity (with occasional timbre discontinuities) but yields slightly higher S-MOS, while a higher threshold approaches the non-decoupled model's inflated similarity at the cost of lower S-MOS."
        confidence: medium
        relevance: high
      - claim_id: audiobookcc_selfdistillation_mitigates_emotion_scarcity
        role: supports
        claim: "Self-distillation from a pretrained emotional TTS model, filtered by objective quality metrics, can mitigate the scarcity of high-intensity emotional training data and improve controllable emotional expressiveness."
        source: "§2.2, §3.3, Table 3, Table 4"
        evidence: "On the CV3-Eval text-unrelated test set, the model trained with 500 hours of emotional data plus 5,300 hours of self-distilled augmentation achieves larger high- vs. low-intensity F1 discriminability than a CosyVoice2-instruct baseline and higher mixed-emotion S-MOS (3.87 vs. 3.35)."
        confidence: medium
        relevance: low
    limitations:
      - "All training data and all three test sets are proprietary and internally constructed; no code, model weights, or evaluation data are released; evaluation is confined to Chinese-language audiobook content with a single subjective rater pool; the decoupling-threshold ablation does not identify a clearly optimal setting."
    caveats:
      - "The decoupled prompt/target training strategy is a training-recipe-level disentanglement mechanism (separating what the prompt teaches about identity from what the target teaches about prosody), distinct from the architectural or adversarial mechanisms used by codec-focused papers in this concept."
  - id: "2509.18060"
    entry_date: "2026-07-22"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [flow-matching]
    relevance: medium
    evidence_role:
      - architecture_variant
    current_role: minor
    method_family: []
    claims:
      - claim_id: tmdtts_dialect_routing_beats_shared_ffn
        role: supports
        claim: "Routing hidden representations through dialect-specific sub-networks inside the Transformer FFN captures fine-grained dialectal acoustic variation more effectively than conditioning through a shared-parameter network alone."
        source: "§3.3, Table 2"
        evidence: "Ablating DSDR-Net (replacing it with a standard shared FFN) while keeping the dialect fusion embedding drops dialect classification accuracy from 80.25% to 60.12% and dialect embedding cosine similarity from 78.3% to 58.6%."
