  - id: "2509.19883"
    entry_date: "2026-07-22"
    year: 2025
    venue: arXiv
    task: [singing]
    architecture: [hybrid]
    relevance: high
    evidence_role:
      - core_evidence
    current_role: active_evidence
    method_family: [data_training_recipe_disentanglement]
    claims:
      - claim_id: comelsinger_prompt_leakage_language_independent
        role: supports
        claim: "Prompt-based conditioning in masked generative or codec-language speech synthesis models causes measurable leakage of prosodic attributes from the acoustic prompt into the synthesized output, independent of the target language."
        source: "§V.A, Table I"
        evidence: "Paired-prompt outputs show consistently lower pitch/energy/jitter differences than unpaired-prompt outputs from the same speaker on both LibriTTS (English) and AISHELL-3 (Mandarin) when synthesizing with MaskGCT."
        confidence: high
        relevance: high
      - claim_id: comelsinger_contrastive_reduces_leakage
        role: supports
        claim: "Explicit contrastive regularization between the acoustic prompt and an external control signal (e.g., melody/pitch) reduces attribute leakage and improves controllability in prompt-based zero-shot synthesis."
        source: "§V.D, Table V"
        evidence: "Removing the coarse-to-fine (sequence + frame level) contrastive loss increases F0-RMSE from 0.042 to 0.08 and lowers SingMOS from 4.32 to 4.12 on the seen-singer test set, with sequence-level and frame-level components independently ablated to show complementary effects on speaker-identity and pitch-detail metrics respectively."
        confidence: high
        relevance: high
      - claim_id: comelsinger_inloop_transcription_supervision
        role: supports
        claim: "Integrating auxiliary transcription-derived frame-level supervision directly into a synthesis model's training loop, rather than using it only as an offline data-cleaning step, improves fine-grained attribute alignment."
        source: "§V.D, Table V"
        evidence: "Removing the in-loop SVT auxiliary loss produces the largest single-component degradation in the ablation, raising F0-RMSE from 0.042 to 0.194 and lowering SingMOS from 4.32 to 3.95."
        confidence: high
        relevance: medium
      - claim_id: comelsinger_lora_matches_full_finetuning
        role: refines
        claim: "Parameter-efficient fine-tuning can match or exceed full fine-tuning when adapting a large pretrained codec-based speech model to a lower-resource downstream domain, provided the low-rank capacity is placed appropriately."
        source: "§V.D, Table VII"
        evidence: "LoRA fine-tuning of the S2A diffusion estimator (6.51% trainable parameters) achieves lower F0-RMSE (0.053) and higher speaker similarity (0.92) than fully fine-tuning the same backbone (100% trainable, F0-RMSE 0.099, SECS 0.859)."
        confidence: medium
        relevance: low
    limitations:
      - "The zero-shot evaluation set (OpenSinger) lacks native music-score annotations, so pitch/duration sequences are paired from a different corpus (M4Singer); evaluation is confined to Mandarin singing corpora; overall S2A/T2S model size is not reported; the subjective evaluation panel is modest (20 musically trained raters)."
    caveats:
      - "CoMelSinger's diagnostic experiment provides direct, general evidence, beyond its own singing-synthesis application, that prosody leakage from acoustic prompts is a real phenomenon in prompt-based masked generative TTS models broadly, generalizing beyond the paper's singing-synthesis framing."
  - id: "2509.22718"
    entry_date: "2026-07-22"
    year: 2025
    venue: arXiv
    task: [singing]
    architecture: [hybrid]
    relevance: low
    evidence_role:
