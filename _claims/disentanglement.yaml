    claims:
      - claim_id: spotlighttts_voiced_aware_quantization
        role: supports
        claim: "Restricting style quantization to acoustically informative (voiced) speech regions improves both style expressiveness and prosodic accuracy in reference-based TTS."
        source: "§4.4.1, Table 4.3"
        evidence: "On ESD, removing voiced extraction raises RMSE_F0 from 8.27 to 11.48 Hz and WER from 12.64 to 14.06; the full model achieves the best style similarity MOS (3.84) over all baselines."
        confidence: high
        relevance: high
      - claim_id: spotlighttts_sd_sp_loss_pairing
        role: supports
        claim: "Pairing style disentanglement with a complementary prosody-preserving loss stabilises training and prevents prosody degradation from aggressive content removal."
        source: "§4.4.2, Table 4.3"
        evidence: "Removing only the SP loss raises pitch error to 9.74 Hz; removing both SD and SP degrades nMOS to 3.66 and WER to 15.38, with the SP-only-removed condition showing worse prosody than the case with no disentanglement losses at all."
        confidence: high
        relevance: high
      - claim_id: spotlighttts_biased_attention_unvoiced_fill
        role: supports
        claim: "Asymmetric (biased) self-attention in unvoiced region filling, allowing information flow from voiced to unvoiced positions but not the reverse, outperforms symmetric or fully blocked alternatives for prosodic continuity."
        source: "§4.4.3, Table 4.4"
        evidence: "Standard self-attention in the UF module degrades pitch error to 16.38 Hz and F1 v/uv to 0.6668; binary masking partially recovers at 13.19 Hz versus 8.27 Hz for biased attention."
        confidence: high
        relevance: medium
      - claim_id: spotlighttts_narrow_corpus_generalization
        role: complicates
        claim: "Style transfer quality gains from region-specific quantization have been established only within a controlled emotional corpus, leaving open the question of whether the approach generalises to broader speaking styles or modern generative architectures."
        source: "§4.1, Table 4.1"
        evidence: "All baselines are FastSpeech 2 variants evaluated solely on ESD (10 speakers, 5 discrete emotions); no comparison with flow-matching, diffusion, or large-scale systems is provided."
        confidence: medium
        relevance: low
    limitations:
      - "All evaluations are conducted on a single English emotional speech corpus (ESD); baselines are restricted to FastSpeech 2-based systems, and model size is not reported."
    caveats:
      - "Introduces the SD (orthogonality) + SP (prosody-preserving cosine) loss pairing as an explicit remedy for the failure mode where aggressive content removal also strips prosody, directly relevant to the disentanglement-completeness open question raised by other papers in this batch (e.g. FreeCodec's incomplete prosody/speaker separation)."

  - id: "interspeech-2025-2684"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [VC]
    architecture: [flow-matching]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: active_evidence
    method_family: [discrete_bottleneck_disentanglement]
    claims:
      - claim_id: disclvc_content_prosody_ssl_disentangle
        role: supports
        claim: "Explicit disentanglement of content and prosody into separate discrete token spaces via different SSL representations enables independent control of speaking style in zero-shot voice conversion."
        source: "§2.1, §3.2, Table 2"
        evidence: "Using HuBERT (content) and ContentVec with SimVQ bottleneck (prosody) as separate extractors, with a prosody mask transformer for reference-guided style transfer, yields F0 Corr of 0.941 for prosody preservation and 0.822 for prosody conversion on ESD/VCTK, while ablations show that using a single mel-based prosody input significantly degrades performance."
        confidence: high
        relevance: high
      - claim_id: disclvc_flowmatching_efficient_incontext
        role: supports
        claim: "Flow matching with in-context learning achieves competitive zero-shot voice conversion quality at substantially fewer parameters than larger autoregressive systems."
        source: "§3.2, Table 1"
        evidence: "Discl-VC (131M params) achieves MOS 4.31, UTMOS 4.079, and SECS 0.929 on VCTK zero-shot VC, surpassing Vevo (922M params) on naturalness and matching speaker similarity, demonstrating that compact flow matching transformers are competitive with large-scale AR systems for VC."
        confidence: high
        relevance: low
      - claim_id: disclvc_prosody_identity_tradeoff
        role: complicates
        claim: "Prosody transfer from a reference speaker introduces a trade-off with target speaker identity preservation."
        source: "§3.2, Table 2"
        evidence: "In the prosody conversion task, Discl-VC achieves lower SECS (0.847) than Vevo (0.892) despite better UTMOS and WER, suggesting that explicitly replacing source prosody with reference tokens disrupts timbre modeling and degrades speaker similarity relative to a system where prosody and identity are more entangled."
        confidence: medium
        relevance: high
      - claim_id: disclvc_simvq_codebook_collapse
        role: supports
        claim: "SimVQ (freezing codebook vectors and learning a linear projection) reduces codebook collapse in VQ-based speech discretisation."
        source: "§3.3, Table 3"
        evidence: "Ablation replacing SimVQ with standard VQ causes degradation across all metrics (UTMOS 4.042 vs 4.079, WER 2.182% vs 1.946%, F0 Corr 0.970 vs 0.973, SECS 0.928 vs 0.929), attributed to codebook collapse during training."
        confidence: high
        relevance: medium
      - claim_id: disclvc_prosody_speaker_leakage_mismatch
        role: complicates
        claim: "SSL-based prosody extraction for VC can retain speaker-correlated information when the same-speaker assumption holds during training, causing train-inference mismatch."
        source: "§3.3, Table 3"
        evidence: "Ablation without ContentVec (using mel spectrogram first 20 dimensions as prosody input) shows the largest performance drop (UTMOS 4.034, WER 3.147%), attributed to prosody tokens containing residual speaker information because source and target audio come from the same speaker during training, creating a mismatch with cross-speaker inference."
        confidence: high
        relevance: high
    limitations:
      - "Evaluation is limited to English and uses only two baselines (Vevo and FAcodec) on a relatively small test set (450 pairs for zero-shot VC); no results on multilingual speakers or noisy conditions are reported."
    caveats:
      - "Provides a direct empirical demonstration of an incomplete disentanglement failure mode: the same-speaker training assumption for the prosody encoder causes residual speaker information to leak into prosody tokens, producing the largest ablation degradation of any component tested."

