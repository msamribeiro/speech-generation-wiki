        evidence: "Entropy-guided 15 Hz outperforms HuBERT original on BLEU for speech-to-text translation (31.5/30.9/31.6 vs. 28.2/28.5/29.3 across EN-CN/EN-FR/EN-ES) despite a 70% reduction in token count."
        confidence: medium
        relevance: low
      - claim_id: entropycompress_boundaries_align_linguistic_units
        role: supports
