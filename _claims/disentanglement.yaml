      - claim_id: avlm_qformer_prefix_fusion
        role: supports
        claim: "Prefix-based visual fusion using compressed Q-Former query latents integrates more effectively into autoregressive speech LMs than direct feature concatenation, which collapses perplexity."
        source: "§5.1, Table 3"
        evidence: "Among three fusion strategies compared during pre-training on LRS3, Q-Former Prefix with 30% speech attention masking achieved the lowest perplexity and was adopted for all downstream fine-tuning."
        confidence: medium
        relevance: low
      - claim_id: avlm_visual_guidance_generation_alignment
        role: supports
        claim: "Visual guidance during training improves not only classification accuracy but also the emotional alignment of generated speech in conversational settings."
        source: "§5.3, Table 7"
        evidence: "For expressive speech generation evaluated by Qwen2-Audio, AVLM achieves 42.49% emotion F1 versus 38.39% for the speech-only baseline, a +4.1 point gain."
        confidence: medium
        relevance: low
      - claim_id: avlm_prompt_only_controllability_insufficient
        role: complicates
        claim: "Emotion controllability through prompt-only label manipulation is insufficient when a model is trained on data where input and response emotions are correlated; in-context demonstrations are necessary to override this bias."
        source: "§5.3, Figure 5"
        evidence: "Zero-shot prompt modification of the emotion label largely fails to change the emotional tone of generated speech, while in-context learning demonstrations per emotion class considerably improve responsiveness, though the model remains heavily anchored to input audio-visual context."
        confidence: medium
        relevance: low
    limitations:
