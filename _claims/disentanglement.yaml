        source: "§5.2, Table 3"
        evidence: "The two-stage schedule (stage one trains phoneme/pitch encoders and decoder; stage two adds the frozen visual encoder and VCFM) outperforms single-stage training on every objective metric reported."
        confidence: medium
        relevance: low
      - claim_id: performsinger_dubbing_architectures_dont_generalize
        role: complicates
        claim: "Visual dubbing architectures built for spoken dialogue do not generalize to singing without substantial adaptation, even when augmented with pitch information."
        source: "§4.1, §5.1, Table 1"
        evidence: "HPMDubbing, a lip-synchronized speech dubbing model, and its pitch-augmented variant both perform far below SVS-specific baselines on every metric, despite the pitch-augmented variant adding phoneme-level pitch as input."
        confidence: medium
        relevance: low
    limitations:
      - "All results are reported on a single self-constructed dataset (9 singers, 69 songs, ~3 hours, Chinese only), evaluated against two adapted rather than natively-designed baselines; the visual encoder is frozen during stage-two training rather than fine-tuned jointly; model parameter counts and inference latency are not reported."
    caveats:
      - "Disentanglement here is entirely inherited from StyleSinger's RVQ-based style extractor, used as a frozen or lightly adapted component; PerformSinger itself does not introduce a new disentanglement mechanism, so relevance to this concept is peripheral."
  - id: "2505.10599"
    entry_date: "2026-07-22"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching, GAN, hybrid]
