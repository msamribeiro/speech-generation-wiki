        source: "§1, §2.1"
        evidence: "The method relies on the pretrained SpeechTokenizer RVQ scheme's own disentanglement (VQ layer 1 = content, layers 2-8 = speaker-specific timbre/pitch/prosody), reasoning that any zero-shot VC model must transfer those speaker-specific latents to produce a convincing clone."
        confidence: medium
