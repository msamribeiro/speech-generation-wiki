        source: "§4.4, Table 2, §4.6"
        evidence: "Replacing the clustering-based nonlinear ADV quantizer with linear binning drops Spearman's Rank Correlation for perceived emotion control across all three ADV dimensions, e.g. valence SRC falls from 0.92 to 0.57."
        confidence: medium
        relevance: low
      - claim_id: uddetts_text_predicted_emotion_no_reference
        role: supports
        claim: "Predicting an emotion conditioning signal directly from input text allows emotional TTS to operate without an explicit emotion label or reference at inference time."
