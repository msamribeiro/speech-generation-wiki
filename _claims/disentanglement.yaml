    method_family: [ssl_statistical_normalization_disentanglement]
    claims:
      - claim_id: svc_dimreduction_timbre_leakage
        role: supports
        claim: "In singing voice conversion, reducing the dimensionality of SSL embeddings through random channel selection proportionally reduces timbre leakage while preserving sufficient phonetic content for accurate reconstruction."
        source: "§4. Results, Table 1"
        evidence: "SSL-128-Emb (128 of 768 HuBERT dimensions) achieves SMOS 3.920 vs. SSL-Emb's 2.750 on the Chinese test set, while maintaining CMOS 4.244 vs. 4.366 for full embeddings. The pattern holds for SSL-Soft and ContentVec variants."
        confidence: high
        relevance: high
      - claim_id: svc_discrete_token_generalization_failure
        role: complicates
        claim: "Discrete token-based content representations for voice conversion cannot generalize to phonetic inventories outside the training distribution."
        source: "§4. Results, Table 2"
        evidence: "SSL-Token CMOS drops from 4.086 on Chinese to 3.210 on other languages (English, Korean, Vietnamese, Japanese, Cantonese), demonstrating that k-means quantization of HuBERT with up to 10,000 clusters still loses phonetic detail that is language-specific. Continuous dimension-reduced embeddings maintain CMOS above 4.17 across both conditions."
        confidence: high
        relevance: medium
      - claim_id: svc_ssl_dimension_uniform_distribution
        role: supports
        claim: "Self-supervised speech embedding dimensions contain roughly proportional timbre and content signal, such that uniform random subsampling functions as an effective form of timbre disentanglement."
        source: "§2.2, §4. Results"
        evidence: "The uniform-distribution assumption underlying random dimension selection is empirically supported by consistent improvements across three distinct SSL embedding types (HuBERT, SSL-Soft, ContentVec), each responding to dimension reduction in the same direction."
        confidence: medium
        relevance: high
      - claim_id: svc_unsupervised_matches_supervised_disentangle
        role: refines
        claim: "Supervised disentanglement methods for SSL content encoders in voice conversion can be matched or exceeded by unsupervised dimensionality reduction at equivalent embedding sizes."
        source: "§4. Results, Table 1, Table 2"
        evidence: "SSL-256-Emb surpasses SSL-Soft-Emb (which uses supervised soft target training) at the same 256-dimensional size on both SSIM and SMOS metrics in Chinese. ContentVEC-256-Emb matches token-based singer similarity while outperforming token-based CMOS on cross-lingual evaluation."
        confidence: medium
        relevance: high
    limitations:
      - "All training data is proprietary (200h internal Chinese singing corpus); no public benchmark is used, and the optimal dimension count d is determined by grid search with no principled selection criterion."
    caveats:
      - "Frames disentanglement as a purely geometric/statistical property of pretrained SSL embedding dimensions rather than an explicit architectural or loss-based mechanism, an unusual framing relative to most disentanglement papers in this concept."

