      - claim_id: tmdtts_early_fusion_beats_late_vocoder_conditioning
        role: supports
        claim: "Injecting dialect/style conditioning early, into both the encoder and the generative (flow-prediction) network, produces more dialect-consistent speech than injecting it only at the output stage via separate per-dialect vocoders."
        source: "§3.2, Table 1"
        evidence: "Compared to a prior Tibetan multi-dialect design that shares a mel-decoder and uses separate per-dialect WaveNet vocoders, TMD-TTS's early dialect fusion plus DSDR-Net reaches up to 88.09% dialect cosine similarity and 87.78% dialect classification accuracy versus 65.2-65.8% for the late-fusion baseline."
