        evidence: "An ADV predictor infers pseudo-ADV tokens from text alone; removing it biases synthesis toward neutral emotion and drops pairwise preference against baselines from 67.33%/58.60% to 46.88%/28.50%."
        confidence: medium
        relevance: low
      - claim_id: uddetts_annotation_consistency_bounds_control
        role: complicates
        claim: "Fine-grained control over continuous emotion representations remains bounded by the consistency of the human annotations used to train the control mechanism."
        source: "§Limitations"
