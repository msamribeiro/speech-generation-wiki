papers:
  - id: "2010.05646"
    entry_date: "2026-07-22"
    year: 2020
    venue: arXiv
    task: [TTS]
    architecture: [GAN]
    relevance: low
    evidence_role:
      - infrastructure
      - historical_context
    current_role: minor
    method_family: []
    claims:
      - claim_id: hifigan_periodic_structure_quality
        role: supports
        claim: "Explicitly modeling periodic structure in speech at multiple timescales is necessary for GAN-based vocoders to match the perceptual quality of autoregressive models."
        source: "§2.3, Table 2"
        evidence: "The multi-period discriminator reshapes waveforms into 2D grids indexed by period to model periodicity explicitly; removing it drops MOS from 4.10 to 2.28 in the ablation study."
        confidence: high
        relevance: low
      - claim_id: hifigan_compact_realtime_quality
        role: supports
        claim: "A compact GAN vocoder can achieve CPU real-time synthesis with quality comparable to autoregressive models when discriminator design, rather than generator depth, is the primary quality bottleneck."
        source: "§4.1, Table 1"
        evidence: "V3 (1.46M parameters) achieves MOS 4.05 at 13.4x faster than real-time on CPU, comparable to WaveNet MoL at a fraction of the compute cost."
        confidence: high
        relevance: low
      - claim_id: hifigan_speaker_generalization_mel_only
        role: supports
        claim: "Vocoders trained on single-speaker data generalise to unseen speakers when the generator is conditioned only on mel-spectrograms, with quality exceeding flow-based and autoregressive alternatives."
        source: "§4.3, Table 3"
        evidence: "On VCTK's nine held-out speakers, all three HiFi-GAN variants outperform WaveNet MoL, WaveGlow, and MelGAN despite training only on single-speaker mel-spectrogram conditioning, indicating the mel-spectrogram representation itself generalises across speaker identity without explicit speaker conditioning."
        confidence: medium
        relevance: medium
      - claim_id: hifigan_finetuning_predicted_spectrograms
        role: supports
        claim: "Fine-tuning a mel-spectrogram vocoder on predicted (rather than ground-truth) spectrograms substantially improves end-to-end TTS quality, while flow-based vocoders do not benefit from the same adaptation."
        source: "§4.4, Table 4"
        evidence: "In the end-to-end experiment with Tacotron2-predicted mel-spectrograms, fine-tuned HiFi-GAN variants all exceed MOS 4.0, while fine-tuned WaveGlow does not improve over its pre-fine-tuning baseline."
        confidence: high
        relevance: low
      - claim_id: hifigan_discriminator_over_generator
        role: supports
        claim: "Discriminator architecture choices have a larger impact on GAN vocoder quality than generator architecture choices."
        source: "§4.2, Table 2"
        evidence: "The ablation shows removing MPD causes a catastrophic MOS drop from 4.10 to 2.28, a far larger effect than varying generator capacity across the V1/V2/V3 variants."
        confidence: high
        relevance: low
    limitations:
      - "Evaluation is limited to LJSpeech (single speaker) and VCTK (multi-speaker English); performance on noisy, spontaneous, or cross-lingual speech is not assessed."
    caveats:
      - "The paper does not explicitly evaluate or optimize for disentangling speaker identity from content; the unseen-speaker generalization result is used here only as indirect evidence that mel-spectrogram conditioning does not require explicit speaker-disentanglement mechanisms."

  - id: "2104.00355"
    entry_date: "2026-07-22"
    year: 2021
    venue: arXiv
    task: [TTS, VC]
    architecture: [GAN, VAE]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: foundational
    method_family: [ssl_statistical_normalization_disentanglement]
    claims:
      - claim_id: ssl_disentangled_vc_correlation
        role: supports
        claim: "SSL content representations that are well-disentangled from speaker identity also exhibit stronger voice conversion performance, while representations that entangle speaker information perform worse at conversion but better at pitch reconstruction."
        source: "§4, Table 1, Table 2"
        evidence: "HuBERT units achieve EER 0.31 on LJ-to-VCTK voice conversion (near-complete speaker disentanglement), while VQ-VAE content codes perform substantially worse (EER 9.65) but retain more pitch information (VDE 7.19 vs. 13.09 for HuBERT)."
        confidence: high
        relevance: high
      - claim_id: ssl_units_ultra_low_bitrate_codec
        role: supports
        claim: "Discrete speech units learned by SSL models can form the basis of an ultra-low-bitrate speech codec that outperforms classical parametric codecs in subjective quality."
        source: "§4, Figure 2"
        evidence: "HuBERT with 50 units (300 bps content) combined with a 65 bps F0 track yields a 365 bps codec that outperforms Opus at 9 kbps, Codec2 at 2.4 kbps, and LPCNet at 1.6 kbps in MUSHRA evaluation."
        confidence: medium
        relevance: medium
      - claim_id: hubert_less_speaker_pitch_leakage
        role: supports
        claim: "Among self-supervised content encoders, HuBERT units carry less speaker and pitch information than VQ-VAE units, making them better suited for downstream controllable synthesis."
        source: "§4, Table 2"
        evidence: "VQ-VAE outperforms HuBERT and CPC on F0 reconstruction metrics, and performs substantially worse than HuBERT on voice-conversion EER, indicating VQ-VAE content codes retain more entangled pitch and speaker information."
        confidence: high
        relevance: high
      - claim_id: independent_pitch_speaker_conditioning
        role: supports
        claim: "Pitch and speaker identity can be independently conditioned in a GAN vocoder through separate discrete token streams, enabling controllable F0 manipulation without retraining."
        source: "§3, §4"
        evidence: "The architecture uses three parallel encoders (content, F0, speaker) whose outputs are independently substitutable at inference: speaker conversion by swapping the d-vector, pitch manipulation by replacing or flattening F0 tokens."
        confidence: high
        relevance: high
    limitations:
      - "The codec evaluation uses only 20 utterances from 5 VCTK speakers, all unseen during training but from the same corpus; generalization to out-of-domain speech is untested. Resynthesis MOS remains well below ground truth on both LJSpeech (3.66 vs. 4.33) and VCTK (3.41 vs. 4.08)."
    caveats:
      - "Disentanglement is evaluated indirectly through proxy metrics (EER for speaker leakage, VDE/FFE for pitch) rather than a direct information-theoretic measure of attribute separation."

  - id: "2209.03143"
    entry_date: "2026-07-22"
    year: 2022
    venue: arXiv
    task: [TTS, SCA]
    architecture: [autoregressive-LM]
    relevance: medium
    evidence_role:
      - core_evidence
      - historical_context
    current_role: influential
    method_family: [rvq_semantic_acoustic_distillation]
    claims:
      - claim_id: audiolm_semantic_acoustic_hierarchy_resolves_tension
        role: supports
        claim: "Combining self-supervised semantic tokens with codec acoustic tokens in a hierarchical language model resolves the quality-versus-coherence tension that affects single-tokenizer audio language models."
        source: "§III-B, §III-C, Table I"
        evidence: "Semantic tokens alone allow only poor waveform reconstruction (ViSQOL ≈ 1.1) while acoustic tokens alone lack long-term coherence; the three-stage cascade combining both achieves both fidelity and coherence."
        confidence: high
        relevance: low
      - claim_id: audiolm_semantic_acoustic_complementary
        role: supports
        claim: "Semantic and acoustic tokens in speech carry complementary information: semantic tokens primarily encode linguistic content and prosody, while acoustic tokens primarily encode speaker identity and recording conditions."
        source: "§IV-C, §IV-D, Tables II–III"
        evidence: "Speaker classification accuracy on acoustic generations conditioned on the same semantic tokens is only 3.2% (versus 100% for direct SoundStream reconstructions), confirming speaker identity is carried by acoustic tokens rather than semantic tokens, while WER/CER on semantic-token-conditioned generation (6.0%/3.4%) confirms linguistic content is carried by the semantic stream."
        confidence: high
        relevance: high
      - claim_id: audiolm_indistinguishable_continuations
        role: supports
        claim: "Autoregressive language modeling over discrete audio tokens can produce speech continuations indistinguishable from real speech to human listeners in an unpaired forced-choice test."
        source: "§IV-G"
        evidence: "In a forced-choice real-vs-synthetic listening test, raters achieved only 51.2% accuracy, not statistically distinguishable from chance (binomial test p=0.23)."
        confidence: high
        relevance: low
      - claim_id: audiolm_cross_domain_transfer
        role: supports
        claim: "The semantic-to-acoustic hierarchical generation pattern transfers across audio domains: a model trained on piano music without symbolic notation also benefits from the two-tier tokenization."
        source: "§IV-I"
        evidence: "A model retrained on 40k hours of internal piano data generates continuations preferred over acoustic-token-only baselines in 83.3% of pairs in a subjective test."
        confidence: medium
        relevance: low
      - claim_id: audiolm_mlm_ssl_zero_resource
        role: supports
        claim: "Self-supervised speech representations trained with masked language modeling objectives encode sufficient lexical and syntactic information to outperform earlier causal spoken language models on zero-resource linguistic benchmarks."
        source: "§IV-E, Table IV"
        evidence: "AudioLM achieves 71.5% sWUGGY (all) and 64.7% sBLIMP, improving over GSLM's 68.7% in-vocab WUGGY and 57.1% sBLIMP."
        confidence: high
        relevance: low
    limitations:
      - "All speech experiments use English only, trained on Libri-Light (audiobook speech); generalisability to spontaneous speech, noise, or other languages is untested. The system requires three separately trained transformers (~0.9B parameters total), making inference substantially more expensive than single-model TTS systems."
    caveats:
      - "Speaker/content separation is measured only via a speaker-classification proxy metric (3.2% accuracy on semantic-token-conditioned generations vs. 100% on codec reconstructions), not a direct information-theoretic disentanglement measure; the paper's central contribution is the generation cascade, not disentanglement per se."

  - id: "2304.09116"
    entry_date: "2026-07-22"
    year: 2023
    venue: arXiv
    task: [TTS, VC, singing]
    architecture: [diffusion, VAE]
    relevance: low
    evidence_role:
      - architecture_variant
    current_role: minor
    method_family: []
    claims:
      - claim_id: ns2_latent_diffusion_avoids_ar_errors
        role: supports
        claim: "Latent diffusion models operating on continuous codec vectors avoid the word-skipping and repetition errors that arise from autoregressive generation over long discrete token sequences."
        source: "§2.3, §5.3, Table 7"
        evidence: "NaturalSpeech 2 achieves 0% error rate on 50 adversarially hard sentences versus 24% for Tacotron, 34% for Transformer-TTS, and known failures for VALL-E."
        confidence: high
        relevance: low
      - claim_id: ns2_speech_prompting_zeroshot_adaptation
        role: supports
        claim: "Speech prompting via in-context learning during training enables zero-shot speaker adaptation without requiring speaker embeddings or multi-step speaker encoding pipelines."
        source: "§3.3, §5.5"
        evidence: "Removing the diffusion prompt entirely causes convergence failure, confirming the speech prompting mechanism (rather than an explicit speaker embedding) is the load-bearing adaptation signal."
        confidence: medium
        relevance: medium
      - claim_id: ns2_prosody_scales_with_prompt_length
        role: supports
        claim: "Prosody adherence in zero-shot TTS improves monotonically with the length of the reference speech prompt, at least up to 10 seconds."
        source: "§5.5, Table 10"
        evidence: "Longer (10-second) prompts substantially reduce pitch mean difference compared to 3-second prompts on LibriSpeech."
        confidence: medium
        relevance: low
      - claim_id: ns2_nonAR_robust_hard_phonemes
        role: supports
        claim: "Non-autoregressive TTS architectures maintain near-zero error rates on adversarially difficult phoneme sequences where autoregressive models degrade significantly."
        source: "§5.3, Table 7"
        evidence: "NaturalSpeech 2 achieves 0% error on 50 hard sentences versus substantial failure rates for autoregressive Tacotron and Transformer-TTS baselines."
        confidence: high
        relevance: low
      - claim_id: ns2_crossmodal_timbre_transfer
        role: supports
        claim: "A system trained jointly on speech and singing data can synthesise singing in novel timbres using only a speech reference prompt, demonstrating cross-modal timbre transfer within a shared latent space."
        source: "§5.6"
        evidence: "The model synthesises singing in speaker timbres taken from speech-only prompts, using continuous pitch and duration predictors rather than a discrete singing-specific token structure."
        confidence: medium
        relevance: medium
    limitations:
      - "The model is described as still underfitting at 300K training steps; inference requires 150 diffusion steps (1000 for singing), which is slow for real-time deployment. Training and evaluation are English-only."
    caveats:
      - "The paper does not explicitly evaluate content/speaker/prosody disentanglement; its controllability claims rely on the speech-prompting mechanism rather than a decomposed latent space with measured attribute leakage."

  - id: "2308.16692"
    entry_date: "2026-07-22"
    year: 2023
    venue: arXiv
    task: [TTS, codec]
    architecture: [GAN]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: influential
    method_family: [rvq_semantic_acoustic_distillation]
    claims:
      - claim_id: speechtokenizer_rvq_separation_improves_quality_and_coherence
        role: supports
        claim: "Separating semantic content from paralinguistic information across RVQ layers within a single codec improves both reconstruction quality and speech language model coherence compared to undifferentiated acoustic tokenisation."
        source: "§4.4, Tables 2 and 4"
        evidence: "SpeechTokenizer achieves MUSHRA 90.55 versus EnCodec's 79.86 in reconstruction, and USLM (built on SpeechTokenizer) outperforms a reproduced VALL-E on WER, SPK-SIM, MOS, and SMOS in zero-shot TTS under identical training conditions."
        confidence: high
        relevance: high
      - claim_id: standard_codecs_entangle_content_speaker
        role: supports
        claim: "Acoustic tokens from standard neural codecs encode content and speaker identity in an entangled form that causes systematic word errors in autoregressive language model generation."
        source: "§2.3, Table 3"
        evidence: "EnCodec RVQ-1 tokens achieve mutual information of only 16.5 with text, versus 31.6-32.9 for SpeechTokenizer RVQ-1, confirming that undifferentiated acoustic tokens carry weaker content alignment."
        confidence: high
        relevance: high
      - claim_id: speechtokenizer_daxis_distillation_stronger
        role: supports
        claim: "A distillation objective computed per feature dimension (D-axis) produces stronger semantic guidance to a codec's first quantizer than the conventional per-timestep (T-axis) formulation."
        source: "Appendix C, Table 7"
        evidence: "Ablations comparing D-axis versus T-axis cosine distillation losses show D-axis produces higher phoneme-code correspondence in the first RVQ layer."
        confidence: medium
        relevance: medium
      - claim_id: speechtokenizer_layer_swap_vc
        role: supports
        claim: "The first-layer tokens of a hierarchically disentangled codec can serve as a zero-shot voice conversion mechanism by swapping higher-layer tokens from a reference speaker, without requiring a separate conversion model."
        source: "§5.2, Table 5"
        evidence: "Swapping RVQ layers 2-8 (paralinguistic) while keeping RVQ-1 (content) fixed from the source utterance achieves voice conversion without any dedicated VC training."
        confidence: medium
        relevance: high
      - claim_id: undifferentiated_codecs_weak_phoneme_correspondence
        role: supports
        claim: "Codec tokens trained without explicit content supervision exhibit poor codebook utilisation and weak phoneme-code correspondence, increasing the modelling burden on downstream language models."
        source: "Appendix F, Table 8"
        evidence: "SpeechTokenizer RVQ-1 reaches PNMI of 0.71, versus 0.43 for HuBERT KM500 units and 0.28 for EnCodec RVQ-1, showing distillation-guided first-layer codes correspond far more cleanly to phoneme categories than undistilled acoustic tokens."
        confidence: high
        relevance: medium
    limitations:
      - "SpeechTokenizer is trained solely on English LibriSpeech; cross-lingual token transfer is only preliminarily assessed (Appendix G). The SLMTokBench mutual information metric relies on a variational upper bound and a fixed BiLSTM downstream model, so absolute scores are not directly comparable across evaluation frameworks."
    caveats:
      - "Voice conversion via layer-swapping (§5.2) is characterised in the paper itself as a single-shot demonstration rather than a full evaluation against dedicated VC baselines, so the disentanglement quality it implies is not rigorously quantified beyond this qualitative use case."

  - id: "2312.01479"
    entry_date: "2026-07-22"
    year: 2023
    venue: arXiv
    task: [TTS]
    architecture: [GAN, VAE]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: active_evidence
    method_family: [explicit_multiencoder_factorization]
    claims:
      - claim_id: openvoice_decoupled_tone_color_control
        role: supports
        claim: "Decoupling tone color transfer from style and language generation enables flexible post-cloning control over emotion, accent, and rhythm without requiring paired multi-attribute training data."
        source: "§2.1, §2.2"
        evidence: "The tone color converter uses a KL-divergence tone color elimination objective in a normalising flow to strip speaker identity while preserving phonetic/style content extracted from the base speaker model, allowing independent post-hoc control of each attribute."
        confidence: medium
        relevance: high
      - claim_id: openvoice_ipa_crosslingual_generalization
        role: supports
        claim: "Using IPA as a universal phoneme representation in a normalising flow allows voice cloning to generalise to unseen languages without retraining on massive multilingual speaker data."
        source: "§2.3, §3 \"Importance of IPA\""
        evidence: "The IPA-aligned flow representation enables cross-lingual cloning for languages absent from the MSML training set, demonstrated qualitatively across multiple target languages."
        confidence: medium
        relevance: medium
      - claim_id: openvoice_feedforward_realtime
        role: supports
        claim: "Feed-forward voice cloning pipelines (encoder-flow-decoder without autoregressive or diffusion components) achieve real-time or faster inference, making large-scale commercial deployment feasible."
        source: "§3 \"Fast Inference with Low Cost\""
        evidence: "The full pipeline achieves 12x real-time inference on a single A10G GPU with an estimated upper bound of 40x."
        confidence: medium
        relevance: low
      - claim_id: openvoice_crossstudy_comparison_confounded
        role: complicates
        claim: "Cross-study quantitative comparison of voice cloning systems is systematically confounded by differences in test set composition, training data scale, and evaluation protocol."
        source: "§3"
        evidence: "The authors explicitly decline to report numerical MOS scores, arguing that cross-study comparisons with VALL-E, XTTS, YourTTS, or Voicebox using different raters and test sets would be unfair; all evaluation in the paper is qualitative."
        confidence: medium
        relevance: low
    limitations:
      - "The paper reports no quantitative metrics anywhere; all evaluation is qualitative via a demo website. Style preservation through the tone color converter is imperfect for highly expressive inputs, with emotion occasionally being neutralised."
    caveats:
      - "The framework's disentanglement claims rely entirely on qualitative demonstrations; no MOS, EER, or other quantitative disentanglement metric is reported anywhere in the paper."

  - id: "2402.05755"
    entry_date: "2026-07-22"
    year: 2024
    venue: arXiv
    task: [SCA, TTS]
    architecture: [autoregressive-LM]
    relevance: medium
    evidence_role:
      - control_evidence
    current_role: influential
    method_family: [explicit_multiencoder_factorization]
    claims:
      - claim_id: spiritlm_interleaved_pretraining_transfers_fewshot
        role: supports
        claim: "Continuous pretraining of a text LLM on interleaved speech and text tokens transfers the text model's few-shot learning and semantic reasoning abilities to the speech modality."
        source: "§4.2, §4.3, Table 4"
        evidence: "Spirit LM Base achieves 36.9% MMLU accuracy (5-shot, text-only) despite pretraining on 30B+ speech tokens, showing largely preserved text-LLM capability."
        confidence: high
        relevance: low
      - claim_id: spiritlm_word_interleaving_beats_parallel_training
        role: supports
        claim: "Word-level interleaving of speech and text during training is more effective than parallel ASR/TTS training or speech-only fine-tuning for cross-modal semantic understanding."
        source: "§4.2, Table 6"
        evidence: "Ablations show removing interleaved data while keeping speech and text separately drops cross-modal StoryCloze performance by more than 10 points versus the full interleaved recipe."
        confidence: high
        relevance: low
      - claim_id: spiritlm_expressive_tokens_supplement_content
        role: supports
        claim: "Expressive speech properties (sentiment, pitch, style) can be modeled in a language model through discrete token streams that supplement phonetic tokens, enabling cross-modal sentiment preservation."
        source: "§5, Table 3"
        evidence: "The Expressive variant merges HuBERT content tokens with separately-extracted pitch (VQ-VAE) and style (speaker-normalized SpeechProp) token streams by timestamp, achieving 0.48 average STSP accuracy versus 0.41 for the Base (content-only) model."
        confidence: high
        relevance: high
      - claim_id: spiritlm_expressivity_lexical_tradeoff
        role: complicates
        claim: "Adding expressive speech tokens to a speech LM improves expressivity at the cost of moderate degradation in lexical and grammatical speech understanding."
        source: "§4.2, Table 4"
        evidence: "The Expressive model's gains on the STSP expressivity benchmark come with measurable trade-offs on WUGGY (lexical) and BLIMP (grammatical) benchmarks relative to the content-only Base model."
        confidence: medium
        relevance: medium
      - claim_id: spiritlm_cascade_stronger_taskspecific
        role: supports
        claim: "Cascade speech pipelines remain substantially stronger than end-to-end unified models on task-specific metrics such as ASR WER and TTS intelligibility at equivalent model scale."
        source: "§4.3, Table 5"
        evidence: "The Whisper + LLaMA 2 cascade topline substantially outperforms Spirit LM on both few-shot ASR WER (3.7% vs. 21.9%) and TTS CER (4.0% vs. 45.5%)."
        confidence: high
        relevance: low
    limitations:
      - "Spirit LM's vocoder is conditioned on only 4 speaker voices from the Expresso dataset, severely constraining synthesis diversity. The model was evaluated only in English."
    caveats:
      - "The three token streams (HuBERT content, pitch VQ-VAE, style clusters) are extracted by separately pre-trained components merged by timestamp rather than jointly optimized for disentanglement, so cross-stream leakage between the streams is not directly measured."

  - id: "2403.03100"
    entry_date: "2026-07-22"
    year: 2024
    venue: arXiv
    task: [TTS, VC]
    architecture: [diffusion, hybrid]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: foundational
    method_family: [explicit_multiencoder_factorization, adversarial_grl_disentanglement]
    claims:
      - claim_id: ns3_explicit_disentanglement_reduces_complexity
        role: supports
        claim: "Explicit disentanglement of speech attributes in the codec representation reduces the complexity of zero-shot generation and improves speaker similarity, quality, and prosody simultaneously."
        source: "§3, §4.2, Table 1, Table 2"
        evidence: "Ablation confirms factorisation is the primary driver of quality: removing it degrades Sim-O from 0.67 to 0.55, CMOS by 0.25, and SMOS by 0.42."
        confidence: high
        relevance: high
      - claim_id: ns3_grl_supervised_losses_suppress_leakage
        role: supports
        claim: "Gradient reversal combined with attribute-specific supervised losses is an effective mechanism for suppressing cross-attribute information leakage in neural codec quantization."
        source: "§3.2.2, Appendix B.4"
        evidence: "FACodec applies gradient reversal layers alongside F0/phoneme/speaker supervised auxiliary losses on the prosody, content, and timbre subspaces respectively to actively suppress cross-attribute leakage during codec training."
        confidence: high
        relevance: high
      - claim_id: ns3_factorization_architecture_agnostic
        role: supports
        claim: "The factorization paradigm for codec representations is architecture-agnostic and improves both autoregressive and non-autoregressive generators when applied."
        source: "§4.3.2, Table 6"
        evidence: "Substituting VALL-E for the diffusion modules while retaining FACodec still improves results over standard VALL-E, demonstrating the factorized representation benefits transfer across generator architectures."
        confidence: high
        relevance: high
      - claim_id: ns3_discrete_diffusion_faster_than_ar
        role: supports
        claim: "Discrete masked diffusion over disentangled codec tokens is faster than autoregressive LM-based codec generation at comparable or better quality."
        source: "Appendix A.5, Table 10"
        evidence: "NaturalSpeech 3 achieves RTF of 0.296 compared to 4.52 for VALL-E on a single V100."
        confidence: high
        relevance: low
      - claim_id: ns3_scales_with_data_and_size
        role: supports
        claim: "Performance on zero-shot TTS scales predictably with both training data volume and model size when the underlying speech representation captures disentangled attributes."
        source: "§4.4, Tables 7, 8"
        evidence: "Scaling to 1B parameters and 200K hours of training data improves Sim-O from 0.73 to 0.78 and WER from 2.11% to 1.71% on an internal test set."
        confidence: medium
        relevance: medium
    limitations:
      - "FACodec requires phoneme-level transcriptions for content supervision, constraining applicability to languages/settings without reliable alignments. The zero-shot TTS evaluation is English-only."
    caveats:
      - "The acoustic-detail subspace still exhibits measurable content and prosody leakage without gradient reversal (verified qualitatively in Appendix B.4), so the factorization is not fully complete even within this system's own attribute taxonomy; background sounds and other fine-grained characteristics are also explicitly not captured (Appendix C)."

  - id: "2406.02430"
    entry_date: "2026-07-22"
    year: 2024
    venue: arXiv
    task: [TTS, VC]
    architecture: [autoregressive-LM, diffusion, hybrid]
    relevance: medium
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: influential
    method_family: [data_training_recipe_disentanglement]
    claims:
      - claim_id: seedtts_ar_scale_human_parity
        role: supports
        claim: "Autoregressive codec language models trained at sufficient scale can generate zero-shot speech with naturalness and speaker similarity indistinguishable from human speech as measured by CMOS."
        source: "§3.1, Table 1"
        evidence: "Seed-TTS ICL achieves CMOS of -0.07 (EN) and -0.08 (ZH) versus human speech, the first system to reach within 0.1 CMOS of human ground truth in a zero-shot in-the-wild setting."
        confidence: high
        relevance: low
      - claim_id: seedtts_selfdistillation_timbre_disentanglement
        role: supports
        claim: "Self-distillation on perturbation-generated pairs is an effective method for timbre disentanglement in TTS systems, achieving large speaker similarity gains in voice conversion without modifying model architecture or loss functions."
        source: "§4.1, Table 6"
        evidence: "Applying speaker-perturbation self-distillation to the diffusion module raises voice-conversion SIM from 0.491 to 0.753 (EN) and 0.636 to 0.791 (ZH), far exceeding DiffVC (0.311) and HierSpeech++ (0.387)."
        confidence: high
        relevance: high
      - claim_id: seedtts_rl_posttraining_robustness
        role: supports
        claim: "Reinforcement learning post-training with objective speech quality rewards improves robustness and speaker similarity in autoregressive TTS while introducing reward hacking that must be carefully managed."
        source: "§4.2, Tables 7, 8"
        evidence: "RL-SIM-WER reduces EN WER from 2.249 to 1.945 and 'Hard' set WER from 7.585 to 6.423, but the authors report reward hacking (over-slow, over-articulated speech) as a side effect requiring careful tuning."
        confidence: high
        relevance: low
      - claim_id: seedtts_dit_matches_ar_without_duration_supervision
        role: supports
        claim: "End-to-end diffusion models that predict total duration and learn local text-audio alignment implicitly can match or exceed the quality of autoregressive codec LM systems without per-phoneme duration supervision."
        source: "§4.3, Table 10"
        evidence: "Seed-TTSDiT achieves EN WER 1.733 and SIM 0.790, superior SIM to the autoregressive Seed-TTS ICL variant, while estimating only total duration rather than per-phoneme durations."
        confidence: high
        relevance: low
      - claim_id: seedtts_synthetic_data_asr_utility
        role: supports
        claim: "Synthetic speech generated by a high-quality zero-shot TTS system can train ASR models that approach real-data performance on clean test sets, though a gap persists on noisy sets due to background noise smoothing."
        source: "§3.1, Table 2"
        evidence: "An ASR model trained on synthetic Seed-TTS LibriSpeech data achieves WER within 0.31% absolute of a real-data baseline on clean sets, with a larger gap on noisy sets."
        confidence: medium
        relevance: low
    limitations:
      - "Model weights are not released and no parameter count is reported. Zero-shot ICL struggles with speakers having strong accents or unique styles not captured in a short (15s) prompt. Reward hacking in RL post-training requires careful tuning."
    caveats:
      - "Self-distillation for timbre disentanglement is validated only via voice-conversion speaker-similarity metrics; no direct measurement of residual timbre leakage in the token stream itself is reported."

  - id: "2408.16532"
    entry_date: "2026-07-22"
    year: 2024
    venue: arXiv
    task: [codec]
    architecture: [GAN, VAE]
    relevance: low
    evidence_role:
      - negative_evidence
      - infrastructure
    current_role: minor
    method_family: [rvq_semantic_acoustic_distillation]
    claims:
      - claim_id: wavtokenizer_single_quantizer_reconstruction
        role: supports
        claim: "A single large-codebook quantizer can achieve higher perceptual reconstruction quality than multi-quantizer residual VQ systems at substantially higher bitrates, when supported by a strong decoder."
        source: "§4.2, Table 1, Table 2"
        evidence: "WavTokenizer at 0.9 kbps (1 quantizer, 75 tokens/s) achieves UTMOS 4.05, exceeding DAC's 9 kbps 9-quantizer configuration at UTMOS 3.91."
        confidence: high
        relevance: low
      - claim_id: wavtokenizer_single_quantizer_downstream_gen
        role: supports
        claim: "Codec tokens produced by a single quantizer enable better downstream autoregressive speech generation than tokens from multi-quantizer codecs, as measured by intelligibility and speaker similarity."
        source: "§4.2, Appendix I, Table 12"
        evidence: "Downstream TTS built on WavTokenizer achieves WER 5.1% and SPK-SIM 0.61, versus 6.9% WER and 0.59 SPK-SIM for DAC at 9 kbps."
        confidence: medium
        relevance: low
      - claim_id: wavtokenizer_semantic_richness_without_distillation
        role: complicates
        claim: "Incorporating attention mechanisms in the codec decoder and extending the training context window improves the semantic richness of discrete audio tokens without requiring distillation from a semantic model."
        source: "§3.3, §4.3, Table 9"
        evidence: "WavTokenizer with 75 tokens outperforms DAC and EnCodec at comparable or higher quantizer counts on 7 of 12 ARCH benchmark classification tasks, achieved via the attention decoder and extended context window rather than a HuBERT-style distillation objective."
        confidence: medium
        relevance: medium
      - claim_id: wavtokenizer_codebook_expansion_diminishing_returns
        role: supports
        claim: "Expanding the VQ codebook space beyond the conventional 1024 entries improves reconstruction quality under extreme compression, but excessively large codebooks reduce codebook utilisation and yield diminishing returns."
        source: "§3.2, §4.3, Table 5"
        evidence: "Codebook analysis shows utilisation plateaus below 2^12 entries even at large training scale, motivating the 4096-entry default rather than a larger vocabulary."
        confidence: medium
        relevance: low
      - claim_id: wavtokenizer_ifft_decoder_outperforms_transposed_conv
        role: supports
        claim: "Inverse Fourier transform decoding significantly outperforms mirrored transposed-convolution upsampling in high-compression codec settings."
        source: "§3.3, §4.3, Table 7"
        evidence: "Ablation of the Vocos-derived inverse-STFT decoder against a standard transposed-convolution decoder shows consistent quality gains at the same compression rate."
        confidence: medium
        relevance: low
    limitations:
      - "WavTokenizer lacks ASR-level speech understanding capabilities, constraining use in unified multimodal understanding-and-generation frameworks. Training uses approximately 8K hours, substantially less than frontier systems."
    caveats:
      - "WavTokenizer packs semantic and acoustic information into a single undifferentiated quantizer rather than disentangling them into separate subspaces; its semantic-richness result is evidence that some semantic content can coexist with acoustic detail without explicit separation, which complicates (rather than supports) the case for architectural disentanglement as a necessary design choice."

  - id: "2411.09943"
    entry_date: "2026-07-22"
    year: 2024
    venue: arXiv
    task: [VC]
    architecture: [diffusion, transformer-enc-dec]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: active_evidence
    method_family: [data_training_recipe_disentanglement]
    claims:
      - claim_id: seedvc_timbre_shifter_reduces_leakage
        role: supports
        claim: "Using an imperfect external VC model as a timbre-shifting augmentation device during training reduces timbre leakage in content representations without requiring discrete bottlenecking, preserving intelligibility."
        source: "§3.3, Table 1"
        evidence: "Seed-VC achieves SECS 0.8676 with the lowest WER (11.99%) and CER (2.92%) among compared systems on zero-shot VC, by extracting Whisper semantic features from timbre-shifted (rather than original) source audio during training."
        confidence: high
        relevance: high
      - claim_id: seedvc_incontext_reference_improves_similarity
        role: supports
        claim: "Conditioning a generative VC model on the full reference utterance via in-context learning yields higher speaker similarity than conditioning on a single speaker embedding alone."
        source: "§3.4, Table 1"
        evidence: "Removing full reference enrollment and using only the timbre vector drops SECS from 0.8676 to 0.7948."
        confidence: high
        relevance: medium
      - claim_id: seedvc_mitigates_similarity_intelligibility_tradeoff
        role: supports
        claim: "The speaker similarity versus intelligibility trade-off that limits bottleneck-based zero-shot VC approaches can be mitigated by separating timbre perturbation from content feature extraction."
        source: "§1, §3.3.1"
        evidence: "By perturbing timbre before content extraction rather than quantising content features to remove speaker information, Seed-VC avoids the intelligibility loss typically associated with aggressive bottlenecking (k-means, VQ)."
        confidence: medium
        relevance: high
      - claim_id: seedvc_f0_conditioning_singing_vc
        role: supports
        claim: "F0 conditioning enables diffusion transformer VC models to extend to zero-shot singing voice conversion with competitive pitch preservation and improved lyric intelligibility over per-speaker trained baselines."
        source: "§3.5, Table 2"
        evidence: "On M4Singer, Seed-VC outperforms RVCv2 on SECS (0.7405 vs. 0.7264) and CER (19.70% vs. 28.46%) in a zero-shot setting, while RVCv2 requires per-character training."
        confidence: medium
        relevance: medium
    limitations:
      - "No subjective listening tests (MOS or MUSHRA) are reported; all quality comparisons rely on DNSMOS, an automatic metric. The training data advantage (Emilia-101k, ~100k hours) versus baselines is substantial and not dataset-controlled."
    caveats:
      - "Disentanglement quality is validated only via downstream VC speaker-similarity and WER metrics; the paper does not directly measure residual timbre leakage in the Whisper-derived semantic features themselves."

  - id: "2412.04724"
    entry_date: "2026-07-22"
    year: 2024
    venue: arXiv
    task: [VC]
    architecture: [flow-matching]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: active_evidence
    method_family: [explicit_multiencoder_factorization, adversarial_grl_disentanglement]
    claims:
      - claim_id: stablevc_independent_timbre_style_transfer
        role: supports
        claim: "Independent timbre and style transfer from distinct unseen speakers can be achieved without degrading either attribute when conditioning streams are separated via parallel cross-attention with adaptive gating."
        source: "§DualAGC, Table 2"
        evidence: "On the style transfer task with timbre and style references from different unseen speakers, StableVC achieves F0 correlation 0.75 and RMSE 12.87, versus 0.69/15.68 for the next-best diffusion baseline."
        confidence: high
        relevance: high
      - claim_id: stablevc_flow_matching_beats_diffusion_speed_quality
        role: supports
        claim: "Flow matching enables zero-shot voice conversion that surpasses diffusion baselines in both sample quality and inference speed, with quality stabilising in as few as 10 ODE steps."
        source: "§Conditional Flow Matching, Table 1, Table 3"
        evidence: "StableVC achieves nMOS 3.96 and RTF 0.146, a 1.65x speedup over the diffusion baseline DDDM-VC (RTF 0.287, nMOS 3.67); quality stabilises at 10 Euler steps."
        confidence: high
        relevance: low
      - claim_id: stablevc_grl_reduces_timbre_leakage_into_style
        role: supports
        claim: "Timbre leakage into style representations is a failure mode in jointly trained VC systems, and adversarial disentanglement via gradient reversal measurably reduces this cross-contamination."
        source: "§Training Objectives, Table 4"
        evidence: "Ablation removing the GRL adversarial loss degrades both style and timbre metrics, confirming the gradient reversal layer actively suppresses timbre information from leaking into the style encoder."
        confidence: high
        relevance: high
      - claim_id: stablevc_multiref_speaker_prior_critical_for_intelligibility
        role: supports
        claim: "Using multiple reference utterances alongside a pre-trained speaker verification prior as the timbre attention key dramatically improves intelligibility in cross-attention-based timbre modeling, as its removal causes WER to collapse from 2% to over 22%."
        source: "§DualAGC, Table 4"
        evidence: "Ablation removing the timbre prior and multiple references causes severe intelligibility collapse, with WER jumping from 2.03% to 22.16%."
        confidence: high
        relevance: medium
      - claim_id: stablevc_nonAR_constant_latency
        role: supports
        claim: "Non-autoregressive VC generation maintains near-constant latency regardless of utterance length, a qualitative advantage over token-by-token autoregressive decoding that is not captured by fixed-length RTF comparisons."
        source: "§Experimental Results on Zero-shot VC"
        evidence: "StableVC runs at RTF 0.146, a 25x speedup over autoregressive LM-VC (RTF 3.891), attributed to its non-autoregressive flow-matching decoding scheme."
        confidence: medium
        relevance: low
    limitations:
      - "The factorized codec used as the style extractor is referenced as a public tool but not described in detail in the paper, restricting exact reproducibility. The evaluation covers English speakers only (VCTK for timbre, ESD for style)."
    caveats:
      - "The style extractor (a third-party factorized codec) is not described in detail in the paper, limiting exact reproducibility of the disentanglement pipeline's style-extraction stage."

  - id: "2409.09098"
    entry_date: "2026-07-22"
    year: 2025
    venue: arXiv
    task: [TTS]
    architecture: [transformer-enc-dec]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: active_evidence
    method_family: [explicit_multiencoder_factorization]
    claims:
      - claim_id: accentbox_speaker_accent_entanglement_hurts_generalization
        role: supports
        claim: "Speaker-accent entanglement in accent identification models causes poor generalisation to unseen speakers and limits the utility of accent embeddings for conditioning TTS systems."
        source: "§III.A, §IV.A, Table IV"
        evidence: "The CommonAccent baseline achieves 0.96 accuracy on seen speakers but only 0.43 on unseen speakers (gap 0.53), and has a high Silhouette Coefficient for Speaker Clusters (SCSC) of 0.236, indicating it memorises speaker-to-accent mappings; GenAID with information bottleneck and adversarial training reduces the gap to 0.06 and SCSC to 0.079."
        confidence: high
        relevance: high
      - claim_id: accentbox_continuous_embeddings_beat_onehot
        role: supports
        claim: "Continuous accent embeddings extracted from a speaker-agnostic model provide stronger accent conditioning for zero-shot TTS than discrete one-hot accent labels."
        source: "§IV.B, Tables V–VII"
        evidence: "AccentBox conditioned on continuous GenAID embeddings achieves higher accent cosine similarity than the Accent_ID system using one-hot accent embeddings in both inherent and cross accent generation, and is preferred by listeners in subjective accent similarity tests."
        confidence: high
        relevance: high
      - claim_id: accentbox_accent_naturalness_tradeoff_data_dependent
        role: complicates
        claim: "Zero-shot accent generation introduces a trade-off between accent fidelity and naturalness that varies with accent data coverage."
        source: "§IV.B, Table VI"
        evidence: "AccentBox shows higher naturalness preference for American accent (60.0% preferred over Baseline, p=0.011) but lower preference for Irish accent (33.9%), where limited training data and sensitivity to monotonic prosody in reference speech cause degradation."
        confidence: medium
        relevance: medium
      - claim_id: accentbox_objective_subjective_speaker_similarity_mismatch
        role: complicates
        claim: "Objective speaker similarity metrics may not align with subjective listener perception when accent and speaker identity are jointly manipulated."
        source: "§IV.B, Tables V–VI"
        evidence: "For inherent accent generation, AccentBox achieves lower SpkCos (0.8293) than Baseline (0.8413) and VALL-E X (0.8605) in objective evaluation, yet listeners subjectively prefer AccentBox for speaker similarity (70.0%, p=0.002 for American accent)."
        confidence: medium
        relevance: medium
      - claim_id: accentbox_standard_evals_miss_accent_hallucination
        role: refines
        claim: "Standard ZS-TTS evaluations based on naturalness and speaker similarity fail to detect accent hallucination, underrepresenting the accent fidelity gap between TTS systems trained predominantly on American English and target accented speakers."
        source: "§I, §III.B"
        evidence: "The paper demonstrates that current SOTA ZS-TTS systems (including VALL-E X) generate a default American-English accent regardless of the target speaker's accent, an artefact not captured by conventional MOS or speaker-similarity metrics."
        confidence: medium
        relevance: medium
    limitations:
      - "Subjective listening tests are restricted to two accents (American and Irish) due to budget constraints. The TTS backbone (YourTTS, VITS-based) is several generations behind current LLM-based and flow-matching ZS-TTS systems."
    caveats:
      - "GenAID's speaker-accent disentanglement is validated via classification accuracy and clustering metrics (SCSC) rather than a direct evaluation of downstream TTS accent fidelity in isolation from naturalness."

  - id: "2025.coling-main.352"
    entry_date: "2026-07-22"
    year: 2025
    venue: COLING
    task: [TTS]
    architecture: [diffusion, transformer-enc-dec]
    relevance: low
    evidence_role:
      - negative_evidence
      - control_evidence
    current_role: minor
    method_family: [explicit_multiencoder_factorization]
    claims:
      - claim_id: diffstyletts_prosodic_cfg_speed_quality
        role: supports
        claim: "Applying diffusion-based classifier-free guidance to low-dimensional prosodic features (pitch, energy, duration) rather than the full Mel-spectrogram achieves faster inference than Mel-diffusion baselines while retaining prosodic diversity benefits over regression-based models."
        source: "§3.2, Table 1"
        evidence: "DiffStyleTTS achieves RTF 0.048, faster than Grad-TTS (0.250) and Guided-TTS (0.479), because diffusion runs only over low-dimensional prosodic features rather than full Mel-spectrograms."
        confidence: high
        relevance: low
      - claim_id: diffstyletts_hierarchical_conditioning_outperforms
        role: supports
        claim: "Hierarchical conditioning combining coarse-grained implicit style tokens with fine-grained explicit prosodic diffusion outperforms both purely regression-based and discriminator-constrained diffusion baselines on naturalness and prosodic distribution accuracy."
        source: "§3.2, Table 1"
        evidence: "DiffStyleTTS achieves MOS 4.18, outperforming FastSpeech2 (3.85), Grad-TTS (4.08), Guided-TTS (4.15), and DiffProsody (4.10)."
        confidence: high
        relevance: low
      - claim_id: diffstyletts_cfg_scale_diversity_naturalness_tradeoff
        role: supports
        claim: "Classifier-free guidance scale controls a trade-off between prosodic diversity and naturalness quality in diffusion-based prosody prediction, with distortion artefacts emerging at high guiding scales."
        source: "§3.3, Table 2"
        evidence: "Phoneme distortion artefacts (elongation/noise) emerge at guiding scales η ≥ 7.0 without the dynamic thresholding correction."
        confidence: medium
        relevance: low
      - claim_id: diffstyletts_dynamic_thresholding_mitigates_distortion
        role: supports
        claim: "Dynamic thresholding applied to CFG noise outputs effectively mitigates phoneme distortion caused by excessive guiding scales in prosodic diffusion models."
        source: "§2.2, §3.3"
        evidence: "The correction scale γ corrects the standard deviation of the guided noise output, preventing the distortion artefacts observed at high guiding scales."
        confidence: medium
        relevance: low
      - claim_id: diffstyletts_gst_style_transfer_preferred
        role: supports
        claim: "GST-based implicit style conditioning enables meaningful prosodic transfer across speakers, outperforming both regression-based style transfer and discriminator-constrained diffusion in subjective preference evaluations."
        source: "§3.4, Table 3"
        evidence: "DiffStyleTTS is preferred over FastSpeech2+GST (52.5% vs. 33.1%, p=0.008) and over DiffProsody (50.0% vs. 16.7%, p=0.013) in prosodic transfer preference tests."
        confidence: high
        relevance: medium
    limitations:
      - "The evaluation is conducted on a private Mandarin Chinese dataset (9 male speakers from similar genres), limiting generalization claims across languages, genders, or more varied speaking styles."
    caveats:
      - "The paper explicitly reports that speaker timbre and prosody are not disentangled: the model can transfer prosodic style but cannot fully separate it from speaker identity, and GST token t-SNE visualizations show partial overlap indicating incomplete independence — a negative result for prosody/timbre disentanglement in GST-based systems."

  - id: "2502.06490"
    entry_date: "2026-07-22"
    year: 2025
    venue: arXiv
    task: [TTS, VC, codec]
    architecture: []
    relevance: high
    evidence_role:
      - core_evidence
      - evaluation_caution
    current_role: active_evidence
    method_family: [rvq_semantic_acoustic_distillation]
    claims:
      - claim_id: survey_acoustic_semantic_tradeoff_space
        role: supports
        claim: "Acoustic tokens and semantic tokens occupy fundamentally distinct points in a reconstruction-versus-semantics trade-off space, and no single tokenization strategy currently achieves strong performance on both axes simultaneously."
        source: "§VI-C, Table I"
        evidence: "The unified comparison shows general-purpose acoustic tokens (EnCodec) achieve the strongest reconstruction (PESQ 2.83) but weak semantic probe performance (34.8% intent classification), while semantic SSL tokens achieve superior intent classification (67-74%) but poor signal quality (PESQ ~1.15)."
        confidence: high
        relevance: high
      - claim_id: survey_speaker_disentanglement_costs_reconstruction
        role: supports
        claim: "Speaker disentanglement in acoustic tokens enables voice conversion capability but consistently reduces reconstruction quality metrics at equivalent bitrates."
        source: "§VI-D, Table I"
        evidence: "Disentangled acoustic tokens (FACodec, LSCodec) enable voice conversion with speaker similarity (SECS) up to 0.852 but sacrifice reconstruction PESQ relative to general-purpose acoustic codecs."
        confidence: high
        relevance: high
      - claim_id: survey_kmeans_discards_prosody
        role: supports
        claim: "K-means clustering on SSL model embeddings discards prosody information more severely than supervised or internally-quantized semantic tokenizers, making offline clustering ill-suited for tasks requiring prosody fidelity."
        source: "§VI-C, §VI-D, Table I"
        evidence: "Semantic SSL tokens (HuBERT Large, WavLM Large) suffer severe prosody loss (GPE ~15-18%) versus ~1% for acoustic tokens, while the supervised S3 Tokenizer retains better prosody than k-means-clustered SSL tokens."
        confidence: high
        relevance: high
      - claim_id: survey_bpe_favors_lowdensity_tokens
        role: supports
        claim: "Acoustic byte-pair encoding achieves greater length reduction on tokens with lower information density, such as speaker-decoupled and semantic tokens, than on general-purpose acoustic tokens."
        source: "§V-A, Figure 8"
        evidence: "Semantic tokens and speaker-decoupled LSCodec tokens compress more under acoustic BPE than general-purpose acoustic tokens, confirming that BPE gain is inversely related to information density."
        confidence: medium
        relevance: medium
      - claim_id: survey_single_codebook_lowbitrate_degradation
        role: supports
        claim: "Single-codebook tokens at very low frame rates improve compatibility with language model generation but currently exhibit measurable quality and intelligibility degradation relative to multi-codebook or higher frame-rate alternatives."
        source: "§VIII.1, §VI-C"
        evidence: "The survey's unified comparison table documents consistent quality/intelligibility degradation for single-codebook low-frame-rate tokenizers relative to multi-codebook alternatives."
        confidence: medium
        relevance: low
    limitations:
      - "The experimental comparisons are conducted on English data only (LibriTTS, LibriSpeech), leaving multilingual tokenization trade-offs unexplored. Not all acoustic tokens support voice conversion in the paper's framework, so the VC comparison covers only a subset of systems."
    caveats:
      - "As a survey, this paper's claims aggregate cross-system comparisons rather than presenting a novel disentanglement mechanism; the unified vocoder used for the controlled experiment (CTX-vec2wav) is itself optimized for semantic tokens, which may bias reconstruction comparisons in favor of disentangled/semantic representations."

  - id: "2502.07243"
    entry_date: "2026-07-22"
    year: 2025
    venue: ICLR
    task: [TTS, VC]
    architecture: [autoregressive-LM, flow-matching, hybrid]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: influential
    method_family: [discrete_bottleneck_disentanglement]
    claims:
      - claim_id: vevo_vqvae_vocab_size_as_bottleneck
        role: supports
        claim: "The VQ-VAE codebook vocabulary size can function as a self-supervised information bottleneck for progressive disentanglement of timbre, style, and linguistic content in self-supervised speech representations."
        source: "§3.1, Table 2"
        evidence: "A vocabulary-size ablation shows that as codebook size decreases from 4096 to 32, HuBERT-derived tokens progressively strip timbre, then style, then content, tracked via speaker-similarity, style-accuracy, and WER metrics."
        confidence: high
        relevance: high
      - claim_id: vevo_annotationfree_style_imitation_matches_supervised
        role: supports
        claim: "Zero-shot style imitation (accent and emotion conversion) without annotation can match or exceed supervised baselines that rely on parallel corpora and style labels."
        source: "§4.3, Table 4"
        evidence: "Vevo-Style outperforms accent conversion baselines (ASR-AC, VoiceShop, Conv-Speak) and emotion conversion baseline (Emovox) in N-CMOS and style accuracy metrics despite using no parallel corpus, style labels, or transcriptions."
        confidence: medium
        relevance: medium
      - claim_id: vevo_hybrid_two_stage_decouples_style_timbre
        role: supports
        claim: "Hybrid two-stage pipelines combining autoregressive style modeling with flow-matching acoustic generation can decouple style and timbre control more effectively than single-stage approaches that use in-context learning to mimic all speech attributes jointly."
        source: "§3.4, Tables 3–5"
        evidence: "By conditioning the AR content-style stage on style references and the flow-matching acoustic stage on separate timbre references, Vevo supports four independently-controllable task variants (Timbre, Style, Voice, TTS) from one shared backbone."
        confidence: high
        relevance: high
      - claim_id: vevo_ar_intelligibility_style_tradeoff
        role: supports
        claim: "Autoregressive models in zero-shot TTS consistently trade intelligibility (higher WER) for stronger style imitation compared to non-autoregressive alternatives trained on the same data."
        source: "§4.4, Tables 5, 9"
        evidence: "Vevo-TTS WER (12.07%) is higher than non-AR Voicebox (9.41%) on the same ACCENT+EMOTION subset, despite Vevo-TTS surpassing Voicebox on style-dimension metrics."
        confidence: medium
        relevance: low
      - claim_id: vevo_duration_reduction_improves_style_transfer
        role: supports
        claim: "Duration reduction on content tokens improves style transfer fidelity by removing unit-level duration patterns that encode source speaking style."
        source: "§4.5, Table 6"
        evidence: "Ablation confirms duration reduction (collapsing consecutive duplicate content tokens) improves style imitation and reduces inference input length."
        confidence: medium
        relevance: medium
    limitations:
      - "Style imitation evaluations use demo website samples from baseline systems as the test set rather than a shared controlled test set. Training is restricted to English audiobook speech, with no multilingual or expressive speech experiments reported."
    caveats:
      - "Vevo's vocabulary-size ablation (Table 2) is the paper's main direct evidence for progressive attribute stripping, but the specific vocabulary sizes (K_s=4096, K_c=32) are empirically selected rather than derived from a principled information-theoretic criterion."

  - id: "2503.01710"
