        role: supports
        claim: "Contrastive training with noise-augmented views enforces noise-invariant speaker representations and substantially improves one-shot VC robustness at low SNR without adding inference cost."
        source: "§III.A, Tables I-II"
        evidence: "Noro's dual-branch reference encoding module and noise-agnostic contrastive speaker loss hold SECS at 80.09 and CER at 4.66 in 0-5 dB noise, versus 77.28 and 7.26 for the baseline; weight sharing means inference architecture is unchanged."
        confidence: high
        relevance: high
      - claim_id: noro_baseline_degrades_under_noise
        role: complicates
        claim: "Standard one-shot voice conversion systems degrade substantially when reference speech contains background noise, even after data augmentation training."
        source: "§III.A.2, Table II"
        evidence: "The diffusion-based baseline trained on LibriLight with no noise-robustness mechanism shows CMOS dropping from 3.29 to 2.09 and SMOS from 3.02 to 2.75 under 0-5 dB noisy reference conditions."
        confidence: high
        relevance: medium
      - claim_id: noro_vc_encoder_competitive_speaker_verification
        role: supports
        claim: "Voice conversion reference encoders trained on large-scale speech data develop speaker representations competitive with dedicated self-supervised speaker models."
        source: "§III.B.2, Table III"
        evidence: "VC-SPK2VEC (the Noro baseline reference encoder repurposed as a speaker encoder, 72.4M params, trained on LibriLight) achieves 5.32% EER on VoxCeleb1 under SUPERB, outperforming wav2vec 2.0 Base (6.02%) and Large (5.65%) and HuBERT Large (5.98%)."
        confidence: medium
        relevance: low
      - claim_id: noro_explicit_alignment_beyond_augmentation
        role: refines
        claim: "Speaker-noise disentanglement in voice conversion benefits from training objectives that explicitly align clean and noisy representations of the same speaker, beyond simple noise augmentation."
        source: "§III.A.2, Figure 2"
        evidence: "t-SNE visualisations show that the baseline (trained with augmentation but no contrastive alignment) produces clearly separated clean/noisy representation clusters, while Noro's contrastive loss causes them to mix, correlating with the performance gap under noise."
        confidence: medium
        relevance: high
    limitations:
      - "Evaluation uses VCTK studio-recorded English with synthetically added DEMAND noise; the test set is small (150 objective pairs, ten per condition for subjective evaluation); the contrastive loss requires speaker labels at training time, so the approach does not extend to fully unsupervised training; the secondary VC-SPK2VEC finding is evaluated under only one SUPERB protocol."
    caveats:
      - "Noro's core contribution is a genuine, directly validated speaker-noise disentanglement objective (the noise-agnostic contrastive loss), confirmed via t-SNE visualisation showing clean/noisy representation clusters merging under the proposed loss rather than assumed from architecture alone."
