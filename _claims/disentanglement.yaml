        confidence: medium
        relevance: low
      - claim_id: voicemark_codec_watermarking_quality_tradeoff
        role: complicates
        claim: "Codec-based watermarking pipelines introduce perceptible audio quality degradation compared to waveform-level methods, representing a trade-off between VC resistance and transparency."
        source: "§3.7, Table 3"
        evidence: "VoiceMark achieves PESQ 2.2 and SMOS 4.25, lower than AudioSeal's PESQ 4.32 and SMOS 4.67, though comparable to SpeechTokenizer's own reconstruction quality (SMOS 4.63)."
        confidence: high
        relevance: low
    limitations:
      - "The model is trained only on VCTK, a small clean dataset, limiting robustness to out-of-distribution audio editing; coverage is limited to English and the approach does not address adversarial attacks designed specifically to remove latent-space watermarks."
    caveats:
      - "This paper does not propose a new disentanglement mechanism; it exploits an existing codec's speaker/content separation (SpeechTokenizer's RVQ layering) as infrastructure for a watermarking application, making it evidence for the practical consequences of codec-level disentanglement rather than a contribution to disentanglement methodology itself."

  - id: "interspeech-2025-0596"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [TTS]
    architecture: [transformer-enc-dec]
    relevance: medium
    evidence_role:
      - control_evidence
    current_role: active_evidence
    method_family: [explicit_multiencoder_factorization]
    claims:
      - claim_id: dysarthric_teacher_student_reduces_articulation_errors
        role: supports
        claim: "A teacher-student speaker encoder architecture, where the teacher conditions the TTS backbone during training and the student handles inference-time pathological inputs, substantially reduces phoneme articulation errors compared to single-encoder approaches in dysarthric TTS."
        source: "§4.2, Table 3"
        evidence: "The proposed method achieves PER 14.254% vs. 31.017% for the best baseline (Hybrid, FastPitch+FreeVC), a greater than 50% relative reduction; removing the student model raises PER from 14.254 to 22.846 in the ablation."
        confidence: high
        relevance: medium
      - claim_id: dysarthric_curriculum_learning_outperforms_random_cropping
        role: supports
        claim: "Progressive curriculum learning, which gradually reduces the duration of student encoder inputs during training, outperforms random cropping and substantially improves phoneme error rate over training without structured audio augmentation."
        source: "§4.3, Figure 3"
        evidence: "Removing curriculum learning raises PER further to 26.428 in the ablation, and the paper reports progressive cropping (75% to 50% to 25% of full length over three stages) is superior to random cropping."
        confidence: high
        relevance: low
      - claim_id: dysarthric_zeroshot_generalization_from_normal_speech
        role: supports
        claim: "Zero-shot multi-speaker TTS trained on normal speech can generalize to dysarthric speakers at inference time without any dysarthric training data, provided the speaker encoder is made robust to articulation distortions and short reference lengths."
        source: "§1, §3"
        evidence: "The system trains exclusively on LibriSpeech (normal speech) and is evaluated by zero-shot synthesis on UASpeech dysarthric recordings, with the teacher-student curriculum bridging the domain and length mismatch."
        confidence: medium
        relevance: low
      - claim_id: dysarthric_similarity_intelligibility_jointly_improved
        role: supports
        claim: "Speaker similarity and phoneme intelligibility can be simultaneously improved through knowledge anchoring, avoiding the trade-off seen in prior hybrid approaches where intelligibility gains came at the cost of speaker identity."
        source: "§4.1, Table 1"
        evidence: "Speaker similarity is 0.619 (comparable to Conditional at 0.647, better than Hybrid at 0.534) while PER simultaneously drops to 14.254%, whereas the Hybrid baseline (FastPitch + FreeVC) achieves intelligibility only by sacrificing speaker identity."
        confidence: medium
        relevance: medium
    limitations:
      - "The system is English-only and non-autoregressive (FastSpeech2, mel-spectrogram output); speaker similarity (0.619) remains below what might be needed for truly personalized assistive use, and the approach has not been tested on languages with non-Latin scripts."
    caveats:
      - "The disentanglement here is between speaker timbre and articulation distortion (via the knowledge-anchoring teacher-student objective), a narrower and more applied framing than the content-speaker-prosody disentanglement more typical of this concept."

  - id: "interspeech-2025-0656"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [VC]
    architecture: [hybrid]
    relevance: medium
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: active_evidence
    method_family: []
    claims:
      - claim_id: eegvc_crossmodal_alignment_enables_vc
        role: supports
        claim: "Cross-modal feature alignment between neural signals and speaker embeddings can enable voice conversion without any target-speaker voice data."
        source: "§3.1.2, §4.4"
        evidence: "The EEG-voice feature alignment module, trained with embedding MSE and speaker classification losses, produces speaker embeddings from EEG that drive FreeVC-based conversion to zero-shot quality (Naturalness MOS 4.00, Consistency obj 0.8026 for unseen speakers)."
        confidence: medium
        relevance: high
      - claim_id: eegvc_nonspeech_biometric_encodes_identity
        role: supports
        claim: "Non-speech biometric signals can encode speaker-identity information sufficient to guide voice timbre conversion."
        source: "§4.4.1, Figure 2"
        evidence: "t-SNE visualisation shows synthesised speech clusters align with reference audio per speaker, and Homogeneity scores (0.9437-0.9465) exceed the FreeVC speech-only baseline (0.9371), indicating EEG features encode timbre-discriminative information."
        confidence: medium
        relevance: high
      - claim_id: eegvc_requires_speech_pretraining_stage
        role: complicates
        claim: "Zero-shot voice conversion from EEG signals requires a large-scale speech-only pre-training stage to compensate for the scarcity and noise of paired EEG-speech data."
        source: "§3.2"
        evidence: "The three-stage curriculum first pre-trains on VCTK (Stage I, speech only), then aligns EEG to pre-trained speaker embeddings (Stage II), before joint fine-tuning (Stage III); the authors explicitly attribute feasibility to leveraging the pre-trained VC model's representations."
        confidence: medium
        relevance: low
      - claim_id: eegvc_evaluation_limited_by_paired_data
        role: complicates
        claim: "Evaluation of EEG-driven voice conversion is fundamentally limited by the availability of paired EEG-speech corpora at the scale needed for generalisation."
        source: "§4.1, §5"
        evidence: "The entire EEG evaluation uses the Single-Word-Production Dutch-iBIDS dataset (10 speakers, single-word utterances); seen-speaker training uses 80% of this data, and the authors note that more data will improve performance."
        confidence: medium
        relevance: low
    limitations:
      - "The evaluation dataset contains only 10 speakers producing single words in Dutch; the baseline comparison (FreeVC) is not equivalent since it uses a target-speaker voice prompt rather than EEG, and no intelligibility metrics (WER/CER) are reported."
    caveats:
      - "The alignment module explicitly maps EEG features into a shared speaker embedding space, a cross-modal disentanglement scheme distinct from the within-speech content-speaker disentanglement more typical of this concept; the EEG recordings used (intracranial, high SNR) may not transfer to consumer-grade scalp EEG."

  - id: "interspeech-2025-0723"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [TTS]
    architecture: [transformer-enc-dec, VAE]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: active_evidence
    method_family: []
    claims:
      - claim_id: cae_encoder_activations_encode_prosody_phonetics
        role: supports
        claim: "Encoder representations in trained encoder-decoder TTS models encode prosodic and phonetic properties in a distributed, neuron-level format that is recoverable by linear classifiers."
        source: "§3.1, §5.1"
        evidence: "A logistic or linear regression classifier trained on the encoder's last-layer LSTM activations successfully predicts prosodic properties (pitch, duration, energy) or semantic tokens (HuBERT layer-6 k-means), locating which neurons carry the relevant information."
        confidence: medium
        relevance: medium
      - claim_id: cae_manifold_preserving_latent_edits
        role: supports
        claim: "Gradient ascent in a compressed VAE latent space produces more controlled prosodic edits than direct activation manipulation in the ambient space, reducing off-manifold artifacts."
        source: "§3.2.1, §5.2"
        evidence: "Activations are encoded into a beta-VAE latent space (dim=16) before gradient ascent toward the target class, then decoded back; Manifold Preserving CAE achieves more accurate pitch/duration ratio changes than direct CAE or the truncation-trick baseline."
        confidence: high
        relevance: high
      - claim_id: cae_prototype_anchoring_preserves_phoneme_identity
        role: supports
        claim: "Anchoring latent edits to a VQ-VAE prototype codebook is necessary to preserve phoneme identity under large prosodic shifts at inference time."
        source: "§3.2.2, §5.2"
        evidence: "The prototype loss anchors edits to the nearest discrete VQ-VAE codebook prototype, and the paper reports this component is critical for preserving intelligibility under large prosody shifts."
        confidence: high
        relevance: high
      - claim_id: cae_pronunciation_correction_without_dictionary
        role: supports
        claim: "Post-hoc activation editing can correct mispronunciations in grapheme-input TTS without a pronunciation dictionary, using a speech-only correction query as the sole supervision signal."
        source: "§5.3, Table 1"
        evidence: "On 78 mispronounced words, WER drops from 0.151 to 0.056 and PER from 0.069 to 0.017 after CAE correction, using only a speech-only correction query rather than a grapheme-to-phoneme dictionary."
        confidence: high
        relevance: low
    limitations:
      - "Validated only on Tacotron 2 with single-speaker LJSpeech; applicability to flow-matching or codec-based LM TTS is untested, and feature entanglement remains (controlling duration slightly shifts pitch)."
    caveats:
      - "This is a post-hoc, retraining-free disentanglement approach (editing pre-trained encoder activations in a compressed latent space) rather than a training-time architectural mechanism, offering a distinct methodological angle within the concept."

  - id: "interspeech-2025-0815"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [VC]
    architecture: [VAE, GAN]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
      - negative_evidence
    current_role: active_evidence
    method_family: [explicit_multiencoder_factorization]
    claims:
      - claim_id: expvc_discrete_units_reduce_leakage_hurt_intelligibility
        role: complicates
        claim: "Discrete speech unit representations reduce source speaker leakage in voice conversion but introduce pronunciation artefacts that degrade intelligibility compared to continuous feature counterparts."
        source: "§4.2, Table 1"
        evidence: "The proposed model using mHuBERT-147 discrete units improves emotion transfer (ECA 37.0% to 78.9%) and reduces source leakage (EER 14.6% to 7.4% on LibriTTS) relative to Hierspeech++, but at a WER cost (7.98% vs. 5.01% on ESD, 8.84% vs. 3.48% on LibriTTS)."
        confidence: high
        relevance: high
      - claim_id: expvc_mixln_mitigates_train_inference_mismatch
        role: supports
        claim: "Mix-style layer normalisation mitigates the train-inference mismatch caused by content-style dependence in style encoders, improving zero-shot generalisation on unseen speakers."
        source: "§4.3, Table 2"
        evidence: "Removing Mix-LN causes the most severe WER degradation on LibriTTS (19.83%) in the ablation, consistent with the hypothesis that Mix-LN reduces train-inference content-style mismatch."
        confidence: high
        relevance: high
      - claim_id: expvc_enriched_style_embeddings_improve_transfer
        role: supports
        claim: "Enriching global style embeddings with explicit pitch and energy features improves emotion transfer fidelity in expressive voice conversion beyond mel-spectrogram-only style encoding."
        source: "§3.5, §4.3, Table 2"
        evidence: "The style encoder fuses separate embeddings from mel spectrograms, F0 contours, and energy contours via a trainable weighted sum; ablation shows this enriched embedding contributes to the emotion transfer gains over Hierspeech++."
        confidence: medium
        relevance: medium
      - claim_id: expvc_cross_attention_f0_beats_additive
        role: supports
        claim: "Cross-attention fusion of local F0 contours with content embeddings produces stronger prosodic alignment to the target than additive F0 injection in non-autoregressive voice conversion."
        source: "§3.1, §4.3, Table 2"
        evidence: "Removing F0 cross-attention degrades SECS by 0.6pp and ECA by 12.5pp in the ablation, and the cross-attention design allows target F0 to be directly used regardless of source/target length differences."
        confidence: medium
        relevance: medium
      - claim_id: expvc_crosslingual_vc_without_multilingual_training
        role: refines
        claim: "Zero-shot cross-lingual voice conversion is achievable with a monolingual training corpus when content representations are extracted from a multilingual speech model, though intelligibility degrades for unseen source languages."
        source: "§4.4, Table 4"
        evidence: "The system achieves 76.1% ECA for English-to-German conversion vs. 61.7% for Hierspeech++, though German-to-English WER is 30.84%, indicating intelligibility degrades when the source language is absent from training."
        confidence: medium
        relevance: low
    limitations:
      - "The evaluation uses a small subjective panel (15 listeners); cross-lingual results are restricted to English and German, and model size and computational cost are not reported."
    caveats:
      - "This paper's title frames source timbre leakage explicitly as a disentanglement problem, making it a directly central paper for the concept; the acknowledged and unresolved intelligibility regression from discrete units is a clear negative data point for the disentanglement-via-quantization approach."

  - id: "interspeech-2025-0816"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [singing, VC]
    architecture: [diffusion]
    relevance: low
    evidence_role:
