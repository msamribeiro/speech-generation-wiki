        claim: "Speaker adversarial perturbations transfer less effectively to black-box speaker extractors with strong verification capability, indicating that white-box EER gains overstate real-world privacy protection."
        source: "§V-G, Table II"
        evidence: "Black-box transfer to the ResNet100 extractor reduces EERs to 7.04% (de-identification) and 7.53% (unlinkability), versus 46.79%/38.93% in the white-box setting."
        confidence: medium
        relevance: low
    limitations:
      - "Privacy guarantees are limited to white-box threat models; identity unlinkability generalises less well than de-identification to out-of-domain datasets (LibriSpeech, AIShell), and the method degrades speech intelligibility (WER increases across ASR test sets)."
    caveats:
      - "This paper is only tangentially related to disentanglement: it perturbs the speech signal to fool a speaker verification system rather than explicitly separating speaker identity from content or style in a learned representation."

  - id: "2508.15931"
    entry_date: "2026-07-22"
    year: 2025
    venue: arXiv
