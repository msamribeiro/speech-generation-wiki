  - id: "interspeech-2025-1639"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [codec, VC]
    architecture: [GAN]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: active_evidence
    method_family: [rvq_semantic_acoustic_distillation]
    claims:
      - claim_id: lombardtokenizer_rvq_layer_distillation
        role: supports
        claim: "Targeted distillation into specific RVQ layers can isolate fine-grained speaking style attributes (such as vocal effort) independently of semantic content in neural speech codecs."
        source: "§2.3, §3.1, Table 2"
        evidence: "LombardTokenizer conditions the second RVQ layer via cosine distillation from Lombard speech encoders while keeping RVQ layer 1 semantically focused via mHuBERT; the resulting system achieves WER 10.97% and EER 6.67% on vocal effort conversion on AVID, substantially outperforming FreeVC (WER 20.35%, EER 16.67%) while retaining comparable synthesis quality."
        confidence: high
        relevance: high
      - claim_id: lombardtokenizer_disentangle_quality_tradeoff
        role: complicates
        claim: "Disentanglement constraints in neural codecs reduce unconstrained reconstruction quality relative to codecs without regularisation."
        source: "§3.1, Table 1"
        evidence: "EnCodec (no disentanglement) achieves PESQ 3.32 and STOI 0.94 on LibriSpeech, while LombardTokenizer's dual distillation (semantic and Lombard) yields PESQ 3.07 and STOI 0.93, consistent with SpeechTokenizer's 3.01; the quality gap widens on in-distribution neutral speech but narrows on expressive zero-shot data."
        confidence: high
        relevance: high
      - claim_id: lombardtokenizer_encoder_integration_matters
        role: complicates
        claim: "Providing a specialized style encoder to a voice conversion model architecture does not guarantee that the encoder's information will be effectively exploited for style control."
        source: "§3.2, Table 2, Figure 2"
        evidence: "FreeVC modified with the same Lombard encoder (FVClmb) fails to produce statistically distinguishable vocal effort levels in perceptual evaluation, and degrades WER on FLombard (32.63%) relative to the standard speaker-encoder variant (24.04%), while LT1 using the same encoder via RVQ distillation achieves WER 17.74% and accurate perceptual effort transfer."
        confidence: high
        relevance: high
      - claim_id: lombardtokenizer_crosslingual_generalization
        role: supports
        claim: "Zero-shot generalization of speaking style transfer across languages is achievable when codec disentanglement is guided by multilingual self-supervised representations."
        source: "§2.1, §3.2, Table 2"
        evidence: "LombardTokenizer trained on English AVID achieves WER 15.77% on the unseen French FLombard dataset (zero-shot), compared to FreeVC's 24.04-32.63%; the paper attributes part of this advantage to replacing HuBERT with multilingual mHuBERT in the semantic RVQ layer."
        confidence: medium
        relevance: medium
      - claim_id: lombardtokenizer_crossspeaker_low_leakage
        role: supports
        claim: "Codec-level disentanglement enables robust cross-speaker style transfer with low speaker identity leakage under both intra-speaker and inter-speaker conditions."
        source: "§3.2, Table 2, Figure 2"
        evidence: "LombardTokenizer inter-speaker vocal effort conversion produces perceptual distributions not significantly different from intra-speaker conversion (Dunn's test), with EER remaining below 8% on AVID for both LT1 (6.67%) and LT2 (7.83%), indicating preserved speaker identity."
        confidence: high
        relevance: high
    limitations:
      - "The zero-shot evaluation is from English training to French test data, and both languages are Indo-European; the AVID dataset uses instructed intensity levels rather than naturally elicited Lombard speech, which may reduce ecological validity."
    caveats:
      - "Provides a direct empirical contrast between codec-level (RVQ distillation) and surface-level (VC conditioning) disentanglement for the same style attribute and encoder, finding the codec-level route succeeds while the conditioning route fails — a useful architectural datapoint for the concept."

  - id: "interspeech-2025-1684"
