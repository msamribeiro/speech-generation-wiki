        role: supports
        claim: "Synchronized visual cues from a speaker's or singer's mouth region can substitute for explicit phoneme-level duration annotations in duration-based speech and singing synthesis pipelines."
        source: "§3.5, §5.1, Table 1"
        evidence: "Replacing externally supplied phoneme durations with a duration predictor conditioned on lip-cue-fused content features allows the duration predictor to operate without duration inputs at inference, while achieving lower MCD and F0 Frame Error than a duration-free StyleSinger baseline with no visual input."
        confidence: medium
        relevance: low
      - claim_id: performsinger_speech_fusion_needs_adaptation_for_singing
        role: complicates
        claim: "Fusion mechanisms designed for one cross-modal alignment problem do not transfer directly to singing, because singing's rhythmic and prosodic complexity differs from speech."
        source: "§5.2, Table 3"
        evidence: "Adopting StyleDubber's Stepwise Monotonic Multi-head Attention (designed for movie-dubbing lip-speech alignment) for textual-visual fusion in this SVS setting produced worse MCD, speaker cosine similarity, and lip-sync error than the no-visual baseline, whereas the proposed VCFM improved on the same baseline across all metrics."
        confidence: medium
        relevance: low
      - claim_id: performsinger_staged_training_beats_joint
        role: supports
