      - evaluation_caution
    current_role: minor
    method_family: []
    claims:
      - claim_id: qvtad_pairwise_framing_label_sparsity
        role: supports
        claim: "Pairwise comparison framing reduces annotation subjectivity and label sparsity in perceptual attribute modelling more effectively than scalar labelling alone."
        source: "§2.2, §3.1"
        evidence: "Framing timbre attribute detection as a pairwise relative-strength task allows DAG-based transitive augmentation to expand 6,038 original training pairs to 166,409 samples without additional human annotation."
        confidence: medium
        relevance: low
      - claim_id: qvtad_differential_attention_generalization
        role: supports
        claim: "Differential attention that subtracts shared information between two representations improves cross-speaker generalisation in timbre attribute discrimination."
        source: "§3.2, Table 1"
        evidence: "The RTSA² module computes two attention maps and subtracts them (scaled by a learnable λ) to suppress shared timbral signal and amplify attribute-specific contrast; removing RTSA² causes a 0.71% drop in unseen-speaker accuracy while marginally improving seen accuracy, confirming it trades absolute-identity fit for cross-speaker generalisation."
        confidence: high
        relevance: high
      - claim_id: qvtad_transitivity_augmentation
        role: supports
        claim: "Transitivity-based data augmentation over sparse pairwise labels significantly expands training coverage and improves model robustness without requiring additional human annotation."
        source: "§3.1, Table 2"
        evidence: "Removing the DSU/DAG data augmentation hurts seen accuracy by 2.12% and unseen accuracy by 1.44%, confirming the augmented pseudo-labels contribute measurable generalisation gains."
        confidence: high
        relevance: low
      - claim_id: qvtad_acoustic_perceptual_inconsistency
        role: complicates
        claim: "Acoustic signal features and human perceptual judgements of timbre attributes are systematically inconsistent, limiting the effectiveness of handcrafted feature approaches."
        source: "§2.2, Figure 1"
        evidence: "The paper motivates learned differential attention over handcrafted acoustic features by noting systematic mismatches between raw acoustic measurements and human timbre attribute ratings."
        confidence: medium
        relevance: low
    limitations:
      - "Evaluation is confined to VCTK-RVA (110 clean studio-recorded English speakers) with no downstream generation validation; the FACodec encoder is frozen throughout, so it is unclear whether joint fine-tuning would further improve performance."
    caveats:
      - "The disentanglement mechanism here (differential attention suppressing shared identity information between paired speaker embeddings) targets attribute detection rather than attribute generation, making this an evaluation-side rather than synthesis-side contribution to the concept."

  - id: "2508.16188"
