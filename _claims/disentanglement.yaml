        role: supports
        claim: "Replacing codec tokens with explicit, interpretable word-level prosody annotations enables a pre-trained text LLM to acquire prosody processing capabilities, including contrastive focus, emotion recognition, and style transfer, without task-specific fine-tuning."
        source: "§3.1, §4.2-4.4"
        evidence: "ProsodyLM is the only group-A model (matched data/budget) that reproduces both on-focus pitch elevation and post-focus pitch compression, and shows a statistically significant 6.6% log-probability increase for emphasised words on EmphAssess, where codec-token baselines show near-zero signal."
        confidence: high
        relevance: high
      - claim_id: prosodylm_disentangling_prosody_content_tradeoff
        role: refines
        claim: "Disentangling prosodic and linguistic content in the token sequence trades voice quality fidelity for prosodic expressiveness and controllability."
        source: "§3.1, §5"
        evidence: "ProsodyLM's decoder is frozen at StyleTTS2 pre-trained weights, which constrains output voice quality, and the five-dimensional prosody token cannot encode voice-quality changes (breathiness, creakiness), a direct trade-off against the gains in explicit prosody control."
        confidence: medium
        relevance: high
      - claim_id: prosodylm_prosody_to_content_harder
        role: supports
        claim: "Prosody-to-content dependencies (detecting emphasis or emotion from speech) are more difficult for codec-token LMs than content-to-prosody generation."
        source: "§4.3, Table 4"
        evidence: "Codec-token baselines show substantially weaker signal on prosody understanding tasks (emphasis detection, emotion recognition) than on prosody generation tasks relative to ProsodyLM's explicit-token design."
        confidence: medium
        relevance: medium
      - claim_id: prosodylm_minimal_lm_interference
        role: supports
        claim: "Word-level prosody tokens impose only marginal degradation on text language modelling capability when interleaved with transcription tokens in a joint sequence."
        source: "§4.5, Table 9"
        evidence: "Text perplexity on held-out audiobooks increases by only 2 points relative to a text-only fine-tuned Llama (11.70 vs. 13.87) after adding prosody tokens to the sequence."
        confidence: high
        relevance: low
    limitations:
      - "ProsodyLM is trained and evaluated exclusively on audiobooks (Librilight); generalisation to spontaneous conversation, emotional dialogue, or cross-domain settings is untested."
    caveats:
      - "The decoder is frozen at StyleTTS2 pre-trained weights, which bounds output quality regardless of prosody-content disentanglement quality; the paper's disentanglement claim is architectural (separate [Text] and [Prosody] token sections) rather than validated via a direct cross-leakage probe between the two."

  - id: "2508.06890"
    entry_date: "2026-07-22"
    year: 2025
    venue: ASRU
    task: [VC]
    architecture: [GAN, transformer-enc-dec]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: active_evidence
    method_family: [explicit_multiencoder_factorization, adversarial_grl_disentanglement]
    claims:
      - claim_id: maestroevc_framelevel_emotion_improves_transfer
        role: supports
        claim: "Frame-level emotion representations improve speaker emotion classification accuracy and prosody transfer fidelity over utterance-level representations in voice conversion."
        source: "§IV.C, Table I"
        evidence: "Maestro-EVC's temporal content-aware emotion modeling (TCEM) module, using frame-level embeddings from a speech emotion diarization model, raises emotion embedding cosine similarity (EECS) from 0.779 (ZEST baseline) to 0.819."
        confidence: high
        relevance: high
      - claim_id: maestroevc_grl_reduces_phonetic_leakage
        role: supports
        claim: "Adversarial disentanglement via gradient reversal layers reduces phonetic leakage into emotion embeddings, improving intelligibility under cross-linguistic-content conversion."
        source: "§IV.C, Table I"
        evidence: "Removing the content GRL causes the largest degradation in the ablation (WER rises to 20.98% from the full model's 11.78%), confirming the GRL's role in suppressing residual phonetic information from the emotion embedding."
        confidence: high
        relevance: high
      - claim_id: maestroevc_explicit_prosody_conditioning_beats_implicit
        role: supports
        claim: "Explicit conditioning on extracted prosodic features (F0 and energy) from an emotion reference transfers temporal dynamics more faithfully than implicit prediction from latent codes."
        source: "§IV.A, Table I"
        evidence: "Maestro-EVC's explicit emotional prosody transfer (EEPT) module, conditioning F0 and energy prediction directly on smoothed prosodic features, achieves MOS prosody similarity of 4.15 versus 2.86 for the ZEST baseline's implicit latent-code prediction."
        confidence: high
        relevance: medium
      - claim_id: maestroevc_prosody_augmentation_improves_robustness
        role: supports
        claim: "Training-time prosody augmentation through temporal shifting and warping improves robustness of prosody transfer under mismatched reference conditions without sacrificing naturalness."
        source: "§IV.C, Table I"
        evidence: "Removing prosody augmentation raises WER from 11.78% to 17.56% in the ablation, confirming the augmentation strategy's role in generalising the FE predictor across misaligned prosody sequences at inference."
        confidence: medium
        relevance: low
    limitations:
      - "Training and primary evaluation use only the English ESD corpus (350 parallel utterances across 10 speakers and 5 emotion categories), a narrow domain; generalisation to spontaneous, noisy, or multilingual emotional speech is entirely untested."
    caveats:
      - "The small, parallel ESD corpus makes it difficult to assess whether the content/speaker/emotion disentanglement holds under more naturalistic or non-parallel conditions; the ablation study evaluates only the seen scenario, leaving unclear whether ablated variants degrade similarly for unseen speakers and emotions."

  - id: "2508.07426"
    entry_date: "2026-07-22"
    year: 2025
    venue: ASRU
    task: [TTS]
    architecture: [transformer-enc-dec, GAN, VAE]
    relevance: medium
    evidence_role:
      - control_evidence
    current_role: minor
    method_family: [data_training_recipe_disentanglement]
    claims:
      - claim_id: accenttts_label_quality_over_volume
        role: supports
        claim: "Accent label quality exerts a larger effect on accent synthesis fidelity than raw data volume, and filtering noisy self-reported labels consistently outperforms using them directly."
        source: "§V-C, Table VI"
        evidence: "The geolocation-filtered system achieves DCF 0.571 averaged across all accents, outperforming the unfiltered system's DCF 0.735, which uses the same underlying data volume but with noisy self-reported labels."
        confidence: high
        relevance: low
      - claim_id: accenttts_vc_augmentation_aids_disentanglement
        role: supports
        claim: "Speaker-accent disentanglement in low-resource settings benefits from voice conversion-based timbre augmentation, even when the augmented data introduces acoustic degradation."
        source: "§V-D, Table VIII"
        evidence: "Applying kNN-VC to diversify speaker timbre within each accent class (converting training utterances to randomly sampled LibriTTS speakers while preserving accent) improves objective accent similarity, though the augmented data itself introduces some acoustic degradation."
        confidence: medium
        relevance: high
      - claim_id: accenttts_metric_human_divergence
        role: complicates
        claim: "Automatic accent identification metrics and human perceptual evaluations of accent plausibility frequently diverge, limiting the reliability of either metric alone as a benchmark."
        source: "§V-B, §V-E"
        evidence: "kNN-VC augmentation improves objective DCF accent-similarity scores but shows unclear or mixed effects in human evaluation, and human evaluators found no clear benefit for augmented versus non-augmented systems in Australian and Scottish evaluations despite objective improvements."
        confidence: medium
        relevance: low
      - claim_id: accenttts_zeroshot_style_copying_competitive
        role: supports
        claim: "Large zero-shot TTS systems can produce competitive accented speech through style copying without explicit accent conditioning, often matching or exceeding dedicated accent-controllable models on naturalness."
        source: "§V-B, Table VII"
        evidence: "CosyVoice2, using zero-shot style copying without explicit accent conditioning, ranks highest across all four human-evaluated accent sets, including above real utterances in the US accent test."
        confidence: medium
        relevance: low
      - claim_id: accenttts_geolocation_discovery_variable_precision
        role: complicates
        claim: "Geolocation-based accent label discovery is extensible to languages and accent varieties without existing labeled speech, but precision varies substantially across accent regions depending on broadcast training data coverage."
        source: "§III-A, Table III"
        evidence: "Precision on Canada (13.3%), Scotland (9.4%), Germany (15.9%), Ireland (20.4%), and Malaysia (7.1%) is poor, limiting practical applicability of the geolocation-based discovery approach to a subset of the 11 accents studied."
        confidence: high
        relevance: low
    limitations:
      - "The paper evaluates English accent synthesis only, despite XTTS-v2 supporting multiple languages; the WER gap between the proposed systems and CosyVoice2 (13.1% vs. 7.1%) is notable and unexplained in depth."
    caveats:
      - "Speaker-accent disentanglement here is pursued through data augmentation (kNN-VC timbre diversification) rather than an architectural or objective-level disentanglement mechanism; no direct information-leakage metric between speaker and accent representations is reported."

  - id: "2508.08095"
    entry_date: "2026-07-22"
    year: 2025
    venue: arXiv
    task: [SCA]
    architecture: [transformer-enc-dec]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: active_evidence
    method_family: [explicit_multiencoder_factorization]
    claims:
      - claim_id: dualslm_heterogeneous_adapters_enable_perception
        role: supports
        claim: "Disentangling paralinguistic and linguistic information through separate adapter architectures improves an SLM's ability to perceive both modalities independently without modifying the underlying encoder or LLM."
        source: "§III.A, §V.A, Table I"
        evidence: "Both SLM-Qwen and SLM-Llama achieve high weighted accuracy on paralinguistic classification (gender 93.2-93.4%, pitch 82-84%, tempo 91%, energy 79-81%, emotion 90%) even when only paralinguistic embeddings are presented, demonstrating successful disentanglement while keeping the Whisper encoder and LLM frozen."
        confidence: high
        relevance: high
      - claim_id: dualslm_err_prevents_adapter_collapse
        role: supports
        claim: "Training-time randomisation over paralinguistic embedding sources (speech, text caption, or absent) can prevent adapter collapse into task-specific vectors and preserve contextual generalisation."
        source: "§III.C, §V.B"
        evidence: "The Equivalence Replacement Regularization (ERR) strategy randomly combines linguistic embeddings with paralinguistic embeddings drawn from different sources at equal probability during training, forcing the linguistic adapter to capture only information text cannot explain."
        confidence: medium
        relevance: high
      - claim_id: dualslm_adapteronly_competitive_with_finetuning
        role: supports
        claim: "Parameter-efficient adapter-only training on a frozen LLM is competitive with full fine-tuning approaches for emotional dialogue tasks when the information encoding is structured by design."
        source: "§V.A, Table II-III, §V.B, Table IV"
        evidence: "On the MELD emotion recognition benchmark, SLM-Qwen and SLM-Llama (53.3% and 54.9% weighted accuracy) are competitive with Qwen-Audio (55.7%) and Qwen2-Audio (55.3%) despite training neither the encoder nor the LLM."
        confidence: medium
        relevance: medium
      - claim_id: dualslm_llm_judge_not_substitute_for_human
        role: complicates
        claim: "Automatic LLM-as-judge evaluation of emotional conversation quality does not substitute for human subjective evaluation; score magnitudes are judge-model-dependent."
        source: "§IV.B, §V.B"
        evidence: "The emotional conversation evaluation shows different absolute score magnitudes depending on which LLM (Qwen2.5-72B vs. Llama-3.1-70B) serves as judge, with no human listening tests reported to calibrate either judge."
        confidence: medium
        relevance: low
    limitations:
      - "The system generates text responses, not speech; despite targeting emotional spoken conversation, the emotional response is encoded in linguistic content and style, not in synthesised speech prosody."
    caveats:
      - "ERR assumes each task type primarily relies on one information type, but in practice multi-dimensional emotional speech may engage both simultaneously; the degree to which the disentanglement generalises beyond the training task taxonomy is untested, and the paper does not report adapter parameter counts, limiting efficiency comparisons."

  - id: "2508.08399"
    entry_date: "2026-07-22"
    year: 2025
    venue: arXiv
    task: [codec]
    architecture: [VAE]
    relevance: high
    evidence_role:
      - core_evidence
      - architecture_variant
    current_role: active_evidence
    method_family: [rvq_semantic_acoustic_distillation, discrete_bottleneck_disentanglement]
    claims:
      - claim_id: disentcodec_fully_discrete_without_labels
        role: supports
        claim: "Fully discrete disentanglement of phonetic, prosodic, and speaker information in a speech codec is achievable without phoneme labels or F0 supervision, at the cost of a small reconstruction quality degradation."
        source: "§III, §IV.B, Table II"
        evidence: "SKQ3+sigma (fully quantized phonetic/prosody/speaker streams derived unsupervised from frozen WavLM hidden vectors) achieves ViSQOL 3.88, only slightly below non-disentangled baselines Vanilla RVQ (4.01) and SNAC (4.01), while requiring no phoneme labels, F0 labels, or gradient reversal layers."
        confidence: high
        relevance: high
      - claim_id: disentcodec_speaker_quantization_reduces_fidelity
        role: complicates
        claim: "Quantizing speaker vectors into discrete codes reduces speaker identity fidelity compared to continuous speaker representations, posing a fundamental trade-off between LLM compatibility and speaker retention."
        source: "§IV.B, Table III"
        evidence: "Quantizing the speaker vector (via GRVQ) slightly increases EER relative to a continuous speaker representation in the one-shot voice conversion evaluation, showing a direct trade-off between discretization (needed for LLM compatibility) and speaker fidelity."
        confidence: medium
        relevance: high
      - claim_id: disentcodec_instance_norm_separates_speaker_prosody
        role: supports
        claim: "Instance normalization of SSL residual features provides a label-free mechanism to separate time-invariant speaker statistics from time-variant prosodic content."
        source: "§III.B"
        evidence: "Instance normalization applied to the residual after phonetic content is removed separates the time-invariant mean/variance (speaker) from the time-variant remainder (prosody), and UMAP visualizations confirm quantized speaker vectors cluster by identity while quantized prosody vectors align with speaker-normalized F0 deviation rather than speaker identity."
        confidence: high
        relevance: high
      - claim_id: disentcodec_matches_vc_baselines
        role: supports
        claim: "Fully discrete speech codecs can match conventional voice conversion methods on intelligibility and naturalness while enabling attribute manipulation through codebook-level operations."
        source: "§IV.B, Table III"
        evidence: "SKQ3+sigma achieves WER 2.62%, EER 5.62%, and UTMOSv2 2.92 on one-shot voice conversion, broadly matching the non-fully-quantized SKQ baseline (2.25%/6.88%/3.03), while enabling speaker swapping through discrete codebook substitution alone."
        confidence: medium
        relevance: high
    limitations:
      - "All experiments use LibriSpeech clean speech (16 kHz, studio conditions); performance on noisy, spontaneous, or out-of-domain speech is untested, and the one-shot VC evaluation uses only two reference speakers, limiting statistical confidence."
    caveats:
      - "The model is not tested on any downstream application (TTS, ASR, speech LM); whether the disentangled discrete tokens actually improve over non-disentangled tokens on downstream tasks remains open future work per the authors' own acknowledgment."

  - id: "2508.11224"
    entry_date: "2026-07-22"
    year: 2025
    venue: ASRU
    task: [evaluation, TTS]
    architecture: []
    relevance: medium
    evidence_role:
      - evaluation_caution
    current_role: active_evidence
    method_family: []
    claims:
      - claim_id: prosodybench_maskedpred_relative_contours
        role: supports
        claim: "SSL models using frame-wise masked prediction capture relative prosodic contours within an utterance rather than absolute acoustic magnitudes, making them insensitive to global intensity rescaling."
        source: "§V-A, Fig. 1"
        evidence: "HuBERT, ContentVec, and data2vec show near-zero Token Error Rate change under utterance-level uniform intensity scaling but respond strongly to word-level prosodic emphasis, attributable to waveform normalisation in their CNN front-ends."
        confidence: high
        relevance: medium
      - claim_id: prosodybench_discrete_targets_smaller_clusters
        role: supports
        claim: "Models pretrained to predict discrete targets encode phoneme-like structure effectively at small cluster sizes, while models pretrained on continuous targets require larger cluster sizes to approach the same phonemic alignment."
        source: "§V-A, Fig. 3"
        evidence: "HuBERT and ContentVec (discrete-target pretraining) capture phoneme-like structure even at 100 clusters, while data2vec and emotion2vec (continuous-target pretraining) show degraded prosodic sensitivity at small cluster sizes in their final layers."
        confidence: high
        relevance: low
      - claim_id: prosodybench_emotional_kmeans_increases_sensitivity
        role: supports
        claim: "Training k-means clustering on emotionally expressive speech increases the prosodic sensitivity of resulting tokens for most SSL model and layer combinations."
        source: "§V-B, Table I"
        evidence: "Training k-means on the MEAD emotional-speech dataset significantly increases sensitivity to prosodic variation relative to training on LibriSpeech read speech (p < 0.05) for most model/layer conditions, at the cost of moderately increased sensitivity to real speaker variation."
        confidence: high
        relevance: medium
      - claim_id: prosodybench_moving_average_tradeoff
        role: refines
        claim: "Applying a temporal moving average to SSL features before k-means clustering provides an adjustable trade-off between prosodic sensitivity and speaker invariance, with intermediate window sizes improving both simultaneously."
        source: "§V-C, Fig. 5"
        evidence: "For HuBERT's final layer with 2000 clusters, moving-average window sizes of 9-11 frames outperform no smoothing on prosodic sensitivity while simultaneously reducing speaker sensitivity, showing the two properties are not strictly in tension at intermediate settings."
        confidence: medium
        relevance: high
      - claim_id: prosodybench_layerwise_divergence
        role: supports
        claim: "Differences between SSL pretraining objectives in their token-level linguistic and prosodic encoding are concentrated in the final transformer layers, while intermediate layers exhibit largely similar behaviour across model families."
        source: "§V-A, §V-B"
        evidence: "Phone normalised mutual information (PNMI) confirms that intermediate layers (around layers 9-10) behave similarly across HuBERT, ContentVec, data2vec, and emotion2vec, with divergence concentrated in each model's final layer."
        confidence: medium
        relevance: medium
    limitations:
      - "The analysis measures sensitivity via Token Error Rate, a proxy for how much token sequences change in response to acoustic manipulation, rather than directly probing what information is decodable from the tokens; whether observed sensitivity differences translate to downstream task gains remains untested."
    caveats:
      - "The benchmark evaluates only semantic (SSL-derived) tokens, not acoustic codec tokens, and uses a single read-speech corpus (TIMIT); duration is excluded from the prosody analysis because deduplication collapses durational information, so the benchmark does not cover the full prosody space relevant to disentanglement claims."

  - id: "interspeech-2025-0115"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [codec]
    architecture: [transformer-enc-dec]
    relevance: high
    evidence_role:
      - evaluation_caution
      - negative_evidence
    current_role: active_evidence
    method_family: [rvq_semantic_acoustic_distillation]
    claims:
      - claim_id: ancogen_disentanglement_objectives_fail_on_pitch
        role: contradicts
        claim: "Even codecs explicitly trained with disentanglement objectives fail to cleanly separate pitch from other speech attributes in their token embeddings."
        source: "§2.3, §2.4"
        evidence: "Across all four benchmarked codecs (DAC, SpeechTokenizer, Mimi, BigCodec), pitch remains the most diffusely encoded attribute; even Mimi's split-RVQ design, intended to prevent semantic leakage into higher scales, still carries substantial linguistic content in upper scales, attributed to its low 12.5 Hz frame rate."
        confidence: high
        relevance: high
      - claim_id: ancogen_content_concentrates_low_scales
        role: refines
        claim: "Linguistic content in neural audio codec representations concentrates in the lowest RVQ scales regardless of whether distillation was used, but leaks into higher scales when the frame rate is very low."
        source: "§2.1"
        evidence: "Token co-occurrence analysis against HuBERT semantic classes shows content concentrating in the first RVQ scale across all four codecs; SpeechTokenizer's distillation-trained first scale shows the strongest HuBERT alignment, while BigCodec's single-VQ structure yields only 8% mean mapping to the top HuBERT token."
        confidence: high
        relevance: high
      - claim_id: ancogen_masked_autoencoder_bridges_tokens_attributes
        role: supports
        claim: "A masked-autoencoder framework can bridge codec tokens and perceptual speech attributes bidirectionally, enabling voice conversion at dramatically lower bitrates than spectrogram-based equivalents."
        source: "§3.1, §3.2"
        evidence: "AnCoGen-SpeechTokenizer achieves content accuracy 82% and speaker cosine similarity 0.74 on voice conversion at 4 kbps, and AnCoGen-BigCodec operates at 1.04 kbps, versus a Melspectrogram-based AnCoGen baseline requiring 51.2 kbps for broadly comparable quality."
        confidence: medium
        relevance: medium
      - claim_id: ancogen_interpretability_reveals_tradeoffs
        role: complicates
        claim: "Post-hoc interpretability tools reveal systematic trade-offs between content accuracy and synthesis quality that differ by codec design, complicating the choice of codec for controllable speech generation."
        source: "§3.2, Table 1"
        evidence: "AnCoGen-BigCodec achieves the highest resynthesis N-MOS (4.39 vs. 4.34 for SpeechTokenizer) but at the cost of poorer content reconstruction (73.58% vs. 82% content accuracy), showing codec choice trades content fidelity against perceptual quality."
        confidence: medium
        relevance: medium
    limitations:
      - "All experiments use LibriSpeech, a clean read-speech corpus with limited acoustic diversity; whether the observed encoding patterns hold for spontaneous speech, expressive data, or noise-conditioned codecs is untested."
    caveats:
      - "The bidirectional AnCoGen-Codec is compared only against the Melspectrogram baseline and not against dedicated disentanglement-oriented codec frameworks such as FreeCodec or SpeechFlow, which would provide stronger context for how the interpretability findings apply to purpose-built disentangled codecs."

  - id: "interspeech-2025-0196"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [codec]
    architecture: [GAN, VAE]
    relevance: medium
    evidence_role:
      - architecture_variant
    current_role: minor
    method_family: []
    claims:
      - claim_id: spcodec_spectral_disentanglement_compression
        role: supports
        claim: "Imposing spectral structure on codec latent embeddings through supervised disentanglement improves compression efficiency over unstructured group quantization."
        source: "§2.2, §3.3, Table 3"
        evidence: "e_l is supervised via reconstruction loss on a low-pass-filtered version of the input while e_h captures the residual; in the ablation on a shared DAC backbone, the SP module improves over unstructured group VQ (HiFiCodec) and split-residual (SRCodec) approaches on MelDistance, STOI, and POLQA at both bitrates and sample rates."
        confidence: high
        relevance: high
      - claim_id: spcodec_intergroup_prediction_redundancy
        role: supports
        claim: "Inter-group prediction in neural codecs, where high-frequency representations are predicted from quantized low-frequency components, reduces bitstream redundancy without proportional increases in model size."
        source: "§2.2, §3.1"
        evidence: "The attention-based prediction module uses the quantized low-frequency embedding to predict and subtract a correction from the high-frequency embedding before quantization, adding only 33K parameters and 4.3 MMAC/s of compute."
        confidence: high
        relevance: medium
      - claim_id: spcodec_bitrate_scaling_advantage
        role: refines
        claim: "The performance advantage of latent-space spectral decomposition in neural codecs scales with bitrate, with larger gains at higher bitrates where low-frequency quality is sufficient to anchor the prediction."
        source: "§3.3, Table 3"
        evidence: "At 32 kHz/16 kbps, SPCODEC reaches POLQA 4.543 vs. DAC's 4.501, but the gap narrows at 5.33 kbps; the authors attribute this to the predictive module deriving more benefit from higher-quality low-frequency representations at higher bitrates."
        confidence: medium
        relevance: low
      - claim_id: spcodec_causal_codec_parity_traditional
        role: supports
        claim: "Causal, time-domain neural speech codecs can match or exceed traditional codecs (EVS, Opus) on perceptual quality metrics at equivalent bitrates."
        source: "§3.2, Table 2"
        evidence: "At 10.66 kbps (16 kHz), SPCODEC achieves POLQA 4.5 and MOS 4.63 compared to Opus at POLQA 4.15/MOS 4.46 and EVS at POLQA 4.14/MOS 4.12."
        confidence: medium
        relevance: low
    limitations:
      - "The subjective MOS evaluation used only 7 professional listeners, below standard listening-test practice, and the cross-codec comparisons in Table 2 mix sampling rates, complicating direct comparison."
    caveats:
      - "The disentanglement mechanism here is spectral (low/high frequency partitioning), not the speaker/content/prosody disentanglement more commonly evaluated in this concept; whether the spectral supervision approach generalizes to attribute-level disentanglement is untested."

  - id: "interspeech-2025-0203"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [VC]
    architecture: [flow-matching, transformer-enc-dec]
    relevance: low
    evidence_role:
      - control_evidence
    current_role: minor
    method_family: [explicit_multiencoder_factorization]
    claims:
      - claim_id: clapfmevc_prompt_parity_reference_speech
        role: supports
        claim: "Natural language prompts can control emotional voice conversion at parity with reference speech for the majority of listeners, reducing reliance on hard-to-source reference audio."
        source: "§3.2.2"
        evidence: "An ABX preference test found 57.4% of 47 participants expressed no preference between reference-speech-driven and prompt-driven conversion, with 19.1% favouring the prompt-driven output."
        confidence: medium
        relevance: low
      - claim_id: clapfmevc_flow_matching_quality_gain
        role: supports
        claim: "Flow matching produces noticeably higher speech naturalness and audio quality in emotional voice conversion than GAN and autoencoder baselines."
        source: "§3.2.1, Table 1"
        evidence: "ClapFM-EVC's flow-matching decoder achieves nMOS 4.09 vs. MixEmo's GAN/autoencoder-based nMOS 2.98, a 37.2% relative naturalness improvement, and UTMOS rises from 2.09 to 3.68."
        confidence: high
        relevance: low
      - claim_id: clapfmevc_soft_label_contrastive_training
        role: supports
        claim: "Combining categorical emotion labels with free-form prompt labels through soft-label contrastive training improves emotion embedding quality over prompt-only or label-only training."
        source: "§3.3, Table 2"
        evidence: "Removing categorical labels causes EECS to drop from 0.79 to 0.66; replacing the symmetric KL-divergence loss with plain KL causes a 10.1% EECS decline."
        confidence: medium
        relevance: low
      - claim_id: clapfmevc_intensity_gate_disentanglement
        role: supports
        claim: "An explicit scalar intensity gate applied to emotional embeddings before content-emotion fusion improves both naturalness and emotion similarity in converted speech."
        source: "§3.3, Table 2"
        evidence: "Removing the adaptive intensity gate (AIG) degrades both nMOS (4.01 to 3.62) and EECS (0.79 to 0.74) in the ablation, confirming the module's role in controlling expression strength independently of the fused content-emotion representation."
        confidence: high
        relevance: high
    limitations:
      - "The system is trained and evaluated entirely on a proprietary internal Mandarin corpus in an any-to-one (fixed target speaker) setting, and baselines are restricted to older GAN and autoencoder EVC systems rather than recent diffusion- or flow-matching-based competitors."
    caveats:
      - "The AIG module is the paper's only genuine disentanglement mechanism, isolating emotion intensity from the fused content-emotion representation; the remaining claims concern conditioning modality (natural language vs. reference speech) and training objective rather than disentanglement per se."

  - id: "interspeech-2025-0246"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [codec]
    architecture: [transformer-enc-dec]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: active_evidence
    method_family: [rvq_semantic_acoustic_distillation]
    claims:
      - claim_id: dcspin_speaker_invariant_dual_codebook
        role: supports
        claim: "Speaker-invariant discrete speech tokens, trained with a dual-codebook objective, can improve both spoken language model performance and speech resynthesis intelligibility simultaneously."
        source: "§3.2, §3.3, Tables 1-3"
        evidence: "DC-Spin 100,4096 achieves 78.47 sWUGGY and 61.35 sBLIMP vs. NAST's 73.35/55.86 at the same unit count, and SpinHuBERT + DC-Spin 500,4096 + PR achieves 18.7% resynthesis WER vs. 24.4% for HuBERT + K-means 500, a roughly 23% relative intelligibility improvement."
        confidence: high
        relevance: high
      - claim_id: dcspin_ngram_pnmi_better_proxy_than_abx
        role: refines
        claim: "N-gram predictability and phoneme/character mutual information are stronger proxies for SLM downstream performance than the widely-used ABX error rate."
        source: "§3.5, Figure 3b"
        evidence: "Proxy analysis shows n-gram predictability, phoneme normalised mutual information (PNMI), and character normalised mutual information (CNMI) are the strongest predictors of downstream SLM performance, while ABX error rate negatively correlates with TSC and sBLIMP."
        confidence: medium
        relevance: medium
      - claim_id: dcspin_ssl_tokens_beat_codec_at_lower_bitrate
        role: supports
        claim: "SSL-based tokenizers can match or exceed neural codec tokenizers on speech intelligibility (WER) at substantially lower bitrates when the encoder is fine-tuned to suppress speaker variation."
        source: "§3.3, Table 3"
        evidence: "SpinHuBERT + DC-Spin + PR achieves 18.7% WER at 448 bps, surpassing EnCodec's 27.5% WER at 1.5 kbps (RVQ1:2), showing SSL tokens fine-tuned to suppress speaker variation can beat codec tokens at a fraction of the bitrate."
        confidence: high
        relevance: high
      - claim_id: dcspin_pr_sft_beats_asr_sft
        role: supports
        claim: "Supervised fine-tuning with phoneme recognition targets provides consistent gains over ASR targets for speech resynthesis intelligibility, suggesting phoneme alignment is more directly beneficial than word-level transcription for unit-based vocoders."
        source: "§3.3, Table 3"
        evidence: "Across all tested unit counts and codebook sizes in Table 3, supervised fine-tuning with phoneme recognition (PR) targets consistently outperforms ASR-based SFT on resynthesis WER."
        confidence: medium
        relevance: low
      - claim_id: dcspin_scaling_diminishing_returns_semantic
        role: complicates
        claim: "Scaling SLM model size has diminishing returns on tasks that require sentence-level semantic coherence when the tokenizer quality is the primary bottleneck."
        source: "§3.2, Table 2"
        evidence: "A 150M-parameter SLM trained on 6k hours exceeds sBLIMP/sWUGGY of models using up to 13B parameters and 150k+ hours, but the topic-story-cloze (TSC) gap (70.7 vs. 82.9 for SPIRIT LM) remains large, attributed to scale rather than tokenizer quality."
        confidence: medium
        relevance: low
    limitations:
      - "Evaluation is English-only; the HiFi-GAN vocoder receives speaker and style IDs externally, so the speaker-invariance of the tokens is not tested in an open-vocabulary, zero-shot resynthesis scenario; Expresso WER figures are elevated by expressive speaking styles (laughter, whisper)."
    caveats:
      - "The speaker-invariance claim is validated primarily through downstream SLM benchmark performance and reduced resynthesis WER rather than through a direct probe of residual speaker information remaining in the tokens themselves."

  - id: "interspeech-2025-0347"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [codec, singing]
    architecture: [GAN, VAE]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
      - negative_evidence
    current_role: active_evidence
    method_family: [adversarial_grl_disentanglement, signal_level_prosody_decomposition]
    claims:
      - claim_id: periodcodec_periodic_signals_decouple_pitch
        role: supports
        claim: "Injecting explicit periodic signals into a neural codec decoder enables independent F0 control during waveform reconstruction, decoupling pitch from the discrete token stream."
        source: "§4.2, §4.3, Table 1, Figure 2"
        evidence: "Period variants achieve substantially lower F0-RMSE than Base (which embeds pitch implicitly in tokens) across all pitch shift conditions, and MOS improves from 2.37 to 3.28 at no shift."
        confidence: high
        relevance: high
      - claim_id: periodcodec_singing_data_extends_f0_coverage
        role: supports
        claim: "Including singing voice data in codec training improves F0 accuracy at high pitch ranges that speech-only corpora do not cover."
        source: "§4.2, Figure 2, Figure 3"
        evidence: "Period+GT reduces F0-RMSE relative to Period when log F0 is shifted upward by 6-12 semitones, corresponding to the extended high-pitch coverage of GTSinger vs. LibriTTS."
        confidence: medium
        relevance: medium
      - claim_id: periodcodec_grl_disentanglement_hurts_quality
        role: complicates
        claim: "Gradient reversal-based pitch disentanglement in neural codecs does not reliably improve perceptual quality and may degrade it."
        source: "§4.3, Table 1"
        evidence: "Period-GRL scores 2.44 MOS vs. Period at 3.28 MOS at no shift; Period-GRL+GT scores 3.33 vs. Period+GT at 3.55; the authors note the effect varies with training data domain, leaving the mechanism unclear."
        confidence: high
        relevance: high
      - claim_id: periodcodec_wider_pitch_range_tradeoff
        role: complicates
        claim: "Codec training on data with a wider pitch range can improve quality at high pitches but reduces quality at lower pitches that are underrepresented in the new data."
        source: "§4.3, Table 1"
        evidence: "At -6 semitone shift, Period+GT (3.29 MOS) scores lower than Period (3.42 MOS), attributed to the model allocating capacity to the wider pitch range of GTSinger at the cost of fidelity in the lower range."
        confidence: medium
        relevance: low
    limitations:
      - "All subjective evaluation is conducted on a proprietary Japanese children's song dataset recorded by two singers unseen during training; the paper presents a codec reconstruction task only, with no downstream discrete-token-based singing synthesis system evaluated."
    caveats:
      - "The GRL-based pitch disentanglement module, the paper's explicit disentanglement mechanism, did not improve naturalness in subjective evaluation and in some conditions worsened it, an unresolved negative result for gradient-reversal approaches to pitch-content separation in codecs."

  - id: "interspeech-2025-0383"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [VC]
    architecture: [transformer-enc-dec]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: active_evidence
    method_family: [explicit_multiencoder_factorization]
    claims:
      - claim_id: likabilityvc_discrete_unit_scalar_attribute_control
        role: supports
        claim: "Discrete-unit voice conversion can be extended to control subjective perceptual attributes beyond speaker identity by adding a scalar conditioning signal to the synthesis model."
        source: "§3, §5.3, Figure 6"
        evidence: "A FastSpeech 2 model conditioned on HuBERT-based discrete units, ECAPA-TDNN speaker embeddings, and a target likability scalar successfully steered perceived likability for 3 of 4 speakers in pairwise preference tests."
        confidence: medium
        relevance: high
      - claim_id: likabilityvc_automatic_predictor_sufficient_proxy
        role: supports
        claim: "Automatic likability predictors based on TDNN regression on crowd-sourced ratings can provide sufficient proxy labels to train large-scale perceptual attribute control systems."
        source: "§4.2, Table 2"
        evidence: "The predictor achieved LCC 0.46 and SRCC 0.49 with human ratings (p < 3e-17) and 74% binary classification accuracy; its outputs were used to automatically annotate the JVS and JTES corpora for VC training."
        confidence: medium
        relevance: medium
      - claim_id: likabilityvc_control_identity_tension
        role: complicates
        claim: "Strong likability control and speaker identity preservation are in tension in discrete-unit VC systems, particularly at extreme target values."
        source: "§5.2, §5.3, Figures 4-6"
        evidence: "At target likability = 2 (outside the training range), CER increased substantially for female speakers, and speaker m49 showed degraded speaker similarity and an unexpected subjective likability drop; the inference-time scalar multiplier partially mitigates but does not eliminate this trade-off."
        confidence: high
        relevance: high
      - claim_id: likabilityvc_per_speaker_failure
        role: complicates
        claim: "Voice likability control demonstrates effective behaviour for majority speaker groups but can fail for individual speakers due to identity-likability interaction effects."
        source: "§5.3, Figure 6"
        evidence: "Three of four speakers showed significant preference differences between target -1 and 1; speaker m49 exhibited the opposite trend, attributed to failure to preserve speaker identity."
        confidence: medium
        relevance: medium
      - claim_id: likabilityvc_multifactorial_demographic_modeling
        role: refines
        claim: "Perceived voice likability is a multi-factorial attribute requiring demographic-stratified modelling, not a single group-level score."
        source: "§2, §4.2, Table 2"
        evidence: "The predictor uses four separate listener-group outputs (by gender and age); per-group LCC ranges from 0.36 to 0.41 while the aggregate LCC is 0.46, confirming systematic variation across listener demographics."
        confidence: medium
        relevance: medium
    limitations:
      - "The evaluation is limited to four speakers and one language (Japanese); the practical control range of the system is narrow, with predicted likability shifting only from approximately -0.51 to -0.23 despite targets spanning -2 to 2."
    caveats:
      - "The system explicitly targets disentanglement of likability from speaker identity and linguistic content using separate conditioning signals, making this a clean test case for the identity-attribute control tension that recurs across disentanglement-oriented VC systems."

  - id: "interspeech-2025-0433"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [VC]
    architecture: [VAE]
    relevance: medium
    evidence_role:
      - architecture_variant
      - control_evidence
    current_role: active_evidence
    method_family: [explicit_multiencoder_factorization]
    claims:
      - claim_id: h2nhvc_human_vc_needs_adaptation_for_nonhuman
        role: supports
        claim: "Voice conversion architectures designed for human speech require non-trivial adaptation to generalise to non-human vocalizations with broad frequency ranges and transient-rich characteristics."
        source: "§4.2.2, Table 1"
        evidence: "Replacing the proposed preprocessing pipeline with a conventional speech-focused one degraded WER from 24.02% to 62.29% and MOS-S from 3.78 to 3.53."
        confidence: high
        relevance: low
      - claim_id: h2nhvc_style_isolation_reduces_leakage
        role: supports
        claim: "Isolating style conditioning to the prior network and normalizing flow, and excluding it from the posterior encoder and decoder, reduces style leakage and improves speaker similarity in CVAE-based voice conversion."
        source: "§4.2.3, Table 1"
        evidence: "Adding the style embedding to the audio encoder and decoder (w/ SEED ablation) reduced MOS-S from 3.78 to 3.61, attributed to style overlap between the reference encoder output and latent acoustic tokens."
        confidence: high
        relevance: high
      - claim_id: h2nhvc_kl_annealing_mitigates_posterior_collapse
        role: supports
        claim: "KL annealing mitigates posterior collapse in VAE-based voice conversion and improves linguistic content preservation, particularly for complex non-human vocalizations."
        source: "§4.2.3, Table 1"
        evidence: "Removing KL annealing increased CER from 15.48% to 28.89% and WER from 24.02% to 44.69%, while MOS scores changed minimally."
        confidence: high
        relevance: low
      - claim_id: h2nhvc_f0_estimation_fails_nonharmonic
        role: complicates
        claim: "Existing fundamental frequency (F0) estimation methods are not reliable for sounds lacking a well-defined harmonic structure, constraining prosodic feature extraction in non-human voice conversion systems."
        source: "§3.1"
        evidence: "The authors tested frame-level F0 from non-human sounds but found existing estimators (Praat, CREPE, SPICE, PESTO) exhibited limitations due to absent harmonic structure; the system falls back to energy-only prosodic features."
        confidence: medium
        relevance: low
    limitations:
      - "The dataset is entirely internal and evaluation uses only 9 human raters on an unspecified number of test samples; F0 estimation for non-human sounds remains unsolved, so the system omits pitch conditioning entirely."
    caveats:
      - "The style-isolation modification (excluding style from the posterior encoder and decoder) is the paper's genuine disentanglement contribution, adapted here to a domain (non-human vocalization) far outside the concept's typical human-speech scope."

  - id: "interspeech-2025-0438"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [VC]
    architecture: [hybrid]
    relevance: high
    evidence_role:
      - core_evidence
      - evaluation_caution
    current_role: influential
    method_family: [orthogonality_constraint_disentanglement, ssl_statistical_normalization_disentanglement]
    claims:
      - claim_id: linearvc_linear_transform_sufficient
        role: supports
        claim: "Linear transformations of self-supervised speech features are sufficient for competitive voice conversion, without complex nonlinear decoders or model fine-tuning."
        source: "§3.2, Table 1"
        evidence: "LinearVC's single learned projection matrix on WavLM-Large layer 6 achieves WER 4.9%, EER 33.6%, and MUSHRA naturalness 62.5 on LibriSpeech test-clean, statistically indistinguishable from kNN-VC and SoundStorm in both naturalness and speaker similarity."
        confidence: high
        relevance: medium
      - claim_id: linearvc_orthogonal_content_speaker_subspaces
        role: supports
        claim: "Content and speaker identity information reside in orthogonal low-dimensional subspaces within the same SSL layer, enabling voice style transfer through geometric manipulation."
        source: "§4, Table 2; §5.2, Figure 4"
        evidence: "Constraining the linear transformation to rotation and reflection only achieves EER 27.7% vs. 31.8% for unconstrained; adding translation alone gives only EER 7.7% with intelligibility maintained (CER 2.9%); SVD factorization at rank 16 achieves CER < 4% while speaker similarity requires rank ~100."
        confidence: high
        relevance: high
      - claim_id: linearvc_naturalness_similarity_tradeoff
        role: complicates
        claim: "High naturalness in voice conversion does not imply high speaker similarity; these objectives can trade off sharply depending on the system design."
        source: "§3.2, Table 1"
        evidence: "FreeVC achieves the highest naturalness (71.1 MUSHRA) among all systems but the lowest speaker similarity (EER 10.5% vs. 33.6% for LinearVC and 38.9% for kNN-VC), indicating perceptual smoothness and target-speaker fidelity are partly in tension."
        confidence: high
        relevance: medium
      - claim_id: linearvc_eer_coarse_similarity_proxy
        role: refines
        claim: "EER as an objective speaker similarity metric provides only coarse correspondence with perceived speaker similarity in voice conversion evaluation."
        source: "§3.2"
        evidence: "The paper notes small EER differences do not reliably track subjective similarity ratings; LinearVC and kNN-VC have comparable subjective similarity (67.5 vs. 67.2) but different EERs (33.6 vs. 38.9)."
        confidence: medium
        relevance: low
    limitations:
      - "The analysis is restricted to WavLM-Large (layer 6) on English LibriSpeech; whether the orthogonal subspace structure holds for other SSL models, layers, or languages is left untested, and the shared pretrained HiFi-GAN vocoder makes it difficult to isolate conversion quality from synthesis quality."
    caveats:
      - "The SVD factorization and constrained-transformation ablation provide unusually clean, model-agnostic evidence for the orthogonal content-speaker subspace hypothesis that underlies much of this concept's SSL-based disentanglement work."

  - id: "interspeech-2025-0455"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [TTS]
    architecture: [flow-matching, VAE, hybrid]
    relevance: low
    evidence_role:
      - infrastructure
    current_role: minor
    method_family: []
    claims:
      - claim_id: aptts_adversarial_posttraining_step_reduction
        role: supports
        claim: "Adversarial post-training applied to a pre-trained flow matching decoder can reduce the required ODE sampling steps by 5-8x while maintaining competitive naturalness and improving intelligibility relative to the full-step baseline."
        source: "§3.3, Table 1, Table 2"
        evidence: "APTTS (4 steps) achieves WER 1.73% on the full LibriSpeech test-clean set, the lowest of all baselines, with RTF 0.052 vs. F5-TTS's 32-step RTF 0.217, a 4x speedup."
        confidence: high
        relevance: low
      - claim_id: aptts_latent_fm_low_data_parity
        role: supports
        claim: "Latent flow matching TTS trained on approximately 1K hours can match or surpass the intelligibility of zero-shot systems trained on 60-100K hours, though speaker similarity remains lower at this data scale."
        source: "§4.2, Table 2"
        evidence: "APTTS achieves WER 1.73%/CER 0.40% on full LibriSpeech test-clean, below VALL-E (WER 5.9%) and comparable to Voicebox (WER 1.9%), but SIM-o is 0.55 vs. 0.66 for Voicebox and 0.64 for F5-TTS."
        confidence: medium
        relevance: low
      - claim_id: aptts_infilling_framing_no_speaker_encoder
        role: supports
        claim: "Framing zero-shot TTS as a speech infilling task within a latent space enables prompt-conditioned generation without requiring a separate speaker encoder or d-vector lookup."
        source: "§3.2"
        evidence: "Zero-shot TTS is framed as masked-frame infilling with a binary mask covering 70-100% of the latent, letting the FM decoder condition on the speech prompt directly rather than via an explicit speaker embedding."
        confidence: medium
        relevance: low
      - claim_id: aptts_hybrid_cfg_reduces_error_accumulation
        role: supports
        claim: "Hybrid classifier-free guidance, decoupling the unconditional branch to a frozen base model checkpoint, reduces error accumulation in few-step generators compared to applying a fixed large guidance scale."
        source: "§3.3"
        evidence: "The unconditional term used at inference is derived from the pre-adversarial-post-training base model rather than the few-step generator, enabling stable guidance without the error accumulation seen with a fixed large guidance scale."
        confidence: medium
        relevance: low
      - claim_id: aptts_ap_generalizes_across_domains
        role: supports
        claim: "Adversarial post-training generalises across flow matching representation domains: the same post-training procedure improves both latent-domain (APTTS) and mel-spectrogram-domain (Matcha-TTS) models."
        source: "§4.3, Table 3"
        evidence: "AP at 2 steps applied to Matcha-TTS surpasses MAT-10 in both MOS (3.96 vs. 3.71) and WER (4.8% vs. 6.81%), confirming the strategy generalizes beyond the latent-domain backbone."
        confidence: medium
        relevance: low
    limitations:
      - "SIM-o scores lag behind large-scale trained models; the system is English-only and the fixed ODE time steps are empirically chosen rather than derived per input."
    caveats:
      - "Disentanglement is only a peripheral aspect of this paper (pitch separation within the VAE latent, per the Wiki Connections note); none of the paper's Claims are primarily about content-speaker or content-prosody disentanglement, so its relevance to this concept is low across the board."

  - id: "interspeech-2025-0464"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [VC, codec]
    architecture: [autoregressive-LM]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: active_evidence
    method_family: [mutual_information_minimization, signal_level_prosody_decomposition]
    claims:
      - claim_id: pace_mi_minimisation_prosody_timbre_disentanglement
        role: supports
        claim: "Explicit mutual information minimisation at the codec-embedding level provides effective prosody-timbre disentanglement for voice conversion."
        source: "§3.5, Table 3"
        evidence: "Removing the MI loss (L_MI) from the full system leads to a notably higher normalised F0 distance in the prosody-from-source scenario (3.28 vs. 2.82), while quality and timbre metrics change only modestly, isolating prosody control as the primary benefit of the MI objective."
        confidence: high
        relevance: high
      - claim_id: pace_icl_codec_lm_controllable_backbone
        role: supports
        claim: "In-context learning codec LMs can serve as controllable VC backbones when augmented with prosody-disentangling encoder modules."
        source: "§3.4, §3.5, Table 2, Table 3"
        evidence: "The proposed system builds on VALL-E X's ICL mechanism and outperforms VALL-E X in speaker similarity (ASV 0.91 vs. 0.84), intelligibility (WER 0.101 vs. 0.115), naturalness (MOS 4.36 vs. 4.19), and prosody alignment (F0 distance 2.70 vs. 3.10) in the prompt-based scenario."
        confidence: high
        relevance: medium
      - claim_id: pace_disentanglement_fidelity_tradeoff
        role: complicates
        claim: "Prosody disentanglement at the codec level introduces a small trade-off in absolute codec reconstruction fidelity compared to the unmodified encoder."
        source: "§3.3, Table 1"
        evidence: "PACE's ASV score (0.662) and NISQA score (3.98) are lower than the baseline EnCodec encoder (0.681, 4.17), though the gap does not substantially affect system-level VC performance."
        confidence: medium
        relevance: high
      - claim_id: pace_source_vs_prompt_prosody_distinct_axes
        role: refines
        claim: "Prosody-from-source and prosody-from-prompt are distinct capability axes in voice conversion; systems strong at one do not automatically handle the other."
        source: "§3.5, Table 3"
        evidence: "VALL-E X supports only prosody-from-prompt and is excluded from the source-prosody evaluation; TriAAN-VC and ProsoVC support only source-prosody and are excluded from the prompt-prosody evaluation; only the proposed system is evaluated in both modes."
        confidence: medium
        relevance: medium
    limitations:
      - "The 54-hour training dataset is modest for a codec language model approach; evaluation is confined to LibriTTS-clean-100/test-clean, and no cross-lingual or noisy-environment experiments are reported."
    caveats:
      - "The paper does not ablate the number of RVQ codebooks or the sensitivity of the MI-minimisation trade-off weight, leaving the robustness of the disentanglement objective itself undercharacterised beyond the single reported configuration."

  - id: "interspeech-2025-0468"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [codec]
    architecture: [VAE, GAN]
    relevance: medium
    evidence_role:
      - architecture_variant
      - core_evidence
    current_role: active_evidence
    method_family: [rvq_semantic_acoustic_distillation]
    claims:
      - claim_id: dualcodec_direct_ssl_encoding_beats_distillation
        role: supports
        claim: "Directly encoding SSL features as a first-class codec stream produces stronger semantic preservation in RVQ-1 tokens than distillation from an SSL model, particularly for tonal languages where pitch fidelity is critical."
        source: "§4.2, Table 2"
        evidence: "Dual encoding reduces English WER from 55.4% (plain DAC, no enhancement) to 2.98% and Chinese WER to 2.91%, closely matching ground truth, and reduces EN WER from 28.4% (distillation) to 5.59% at 25Hz with the same codebook size."
        confidence: high
        relevance: high
      - claim_id: dualcodec_low_framerate_more_rvq_quality
        role: supports
        claim: "Operating a neural codec at lower frame rates with more RVQ layers at fixed token rate improves audio quality over higher-frame-rate codecs with fewer layers at the same bitrate."
        source: "§4.3, Table 3"
        evidence: "DualCodec 12.5Hz with 16384+4096 codebooks (G5) reaches MUSHRA 88.2 and UTMOS 4.11, the strongest results in the low-bitrate regime across all systems tested at normalised 75 tokens/s."
        confidence: medium
        relevance: low
      - claim_id: dualcodec_rvq1_semantic_quality_drives_tts_intelligibility
        role: supports
        claim: "Semantic quality of RVQ-1 tokens is a primary determinant of downstream TTS intelligibility in autoregressive codec-based systems, independent of codec audio reconstruction quality."
        source: "§4.4, Table 4"
        evidence: "VALL-E with DualCodec 25Hz achieves EN WER 3.4% and ZH WER 2.49%, versus 8.16%/10.5% for VALL-E with Mimi and 15.4%/21.5% with SpeechTokenizer, tracking RVQ-1 semantic quality rather than reconstruction MUSHRA rankings."
        confidence: high
        relevance: medium
      - claim_id: dualcodec_ssl_stream_improves_perceptual_quality
        role: supports
        claim: "An SSL-based semantic stream in a codec encoder can improve perceptual audio quality beyond what waveform-only codecs achieve, even when using the same decoder architecture."
        source: "§4.3, Table 3"
        evidence: "DualCodec 25Hz with 16384 codebook exceeds WavTokenizer-large (MUSHRA 81.0) and Mimi (MUSHRA 72.8) at MUSHRA 86.2, despite sharing the DAC-derived waveform decoder architecture."
        confidence: medium
        relevance: medium
    limitations:
      - "The SSL model (w2v-BERT-2.0, 600M parameters, frozen) is required at TTS training time, making the training pipeline heavier than pure waveform codec approaches; the subjective test has only 8 participants, limiting confidence for closely-scoring MUSHRA comparisons."
    caveats:
      - "The residual subtraction between the SSL-derived RVQ-1 stream and the waveform-derived residual stream is the paper's explicit disentanglement mechanism (semantic content vs. acoustic residual); the 12.5 Hz variant's lower semantic accuracy indicates this decomposition is not lossless under aggressive downsampling."

  - id: "interspeech-2025-0575"
    entry_date: "2026-07-22"
