    current_role: minor
    method_family: [discrete_bottleneck_disentanglement]
    claims:
      - claim_id: vevo2_joint_speech_singing_pretraining
        role: supports
        claim: "Joint pre-training on speech and singing voice data improves generation quality in both domains, with singing data contributing to expressive speech prosody richness and speech data compensating for the limited size of singing corpora."
        source: "§V-A, Table I"
        evidence: "Vevo2 substantially outperforms zero-shot TTS baselines on singing voice N-CMOS (gap > 1.5) and SS-CMOS (gap > 0.9) after joint training on Emilia speech and SingNet-derived singing data."
        confidence: medium
        relevance: low
      - claim_id: vevo2_chromagram_prosody_bridge
        role: supports
        claim: "Chromagram-based prosody tokenization provides a notation-free, octave-invariant representation that bridges the F0 distribution gap between speech and singing, enabling unified prosody control without expert MIDI annotations."
        source: "§III-A"
        evidence: "The prosody tokenizer (6.25 Hz, codebook 512) encodes chromagram features that are octave-free and notation-free, avoiding the MIDI-annotation dependency of prior singing-specific prosody representations."
        confidence: medium
        relevance: medium
      - claim_id: vevo2_low_framerate_llm_init
        role: supports
        claim: "Autoregressive models initialized from LLM checkpoints can achieve competitive zero-shot TTS quality at low codec frame rates (12.5 Hz) when paired with strong post-training, partially compensating for the sequence granularity disadvantage relative to higher frame-rate systems."
        source: "§V-A, Table VII"
        evidence: "Post-trained Vevo2 achieves WER 3.64 (en) / 2.94 (zh) and SIM-o 0.693/0.754 on SeedTTS, competitive with CosyVoice 2 and MaskGCT despite its content-style tokenizer operating at 12.5 Hz versus their 25-50 Hz."
        confidence: medium
        relevance: low
      - claim_id: vevo2_singleobjective_degrades_complementary
        role: complicates
        claim: "Single-objective preference alignment in multi-capability speech models degrades complementary objectives; joint multi-objective optimization is necessary to avoid quality regressions on non-targeted capabilities."
        source: "§V-F, Figure 5"
        evidence: "Intelligibility-only GRPO post-training drops melody accuracy from 65% to 50%, while the joint intelligibility-plus-prosody-similarity reward achieves gains on both objectives simultaneously."
        confidence: medium
        relevance: low
      - claim_id: vevo2_pitchshift_similarity_tradeoff
        role: supports
        claim: "Inference-time pitch shift applied to prosody tokens improves speaker similarity in voice and singing conversion tasks, at the cost of a minor intelligibility degradation due to train-inference distribution mismatch."
        source: "§V-E, Table VI"
        evidence: "Pitch-shifted prosody tokens are out-of-distribution for the content-style tokenizer, causing slight WER degradation alongside the speaker-similarity gains observed in Table VI."
        confidence: medium
        relevance: low
    limitations:
      - "Content-style tokens from pitch-shifted audio are out-of-distribution, causing slight WER degradation; the 12.5 Hz frame rate of the content-style tokenizer slightly limits VC intelligibility compared to Vevo-FM (50 Hz), and generalization to tonal languages in singing is not specifically evaluated."
    caveats:
      - "The content-style tokenizer's timbre disentanglement (via an information bottleneck, reconstructing chromagram and Whisper features while excluding speaker identity) is described only briefly in the Method section and is not directly ablated in this paper; the more thoroughly evidenced contributions (chromagram prosody bridging, EPL/IPL unification, multi-objective GRPO) are captured under prosody-control and rlhf-speech rather than disentanglement specifically."
  - id: "2508.17031"
