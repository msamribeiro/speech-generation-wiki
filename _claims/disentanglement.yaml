      - claim_id: rephrasetts_multiloss_reduces_artefacts
        role: supports
        claim: "Combining local and global adversarial losses with a triplet-based style matching loss reduces perceptual artefacts in synthesised speech segments that L1 reconstruction loss alone cannot eliminate."
        source: "§3.3, §4.3"
        evidence: "Phase two training adds local/global LSGAN losses plus a triplet-based style matching loss on top of phase one's L1 reconstruction; the ablation in Table 3 shows each component contributes to perceptual quality on dev-clean."
        confidence: medium
