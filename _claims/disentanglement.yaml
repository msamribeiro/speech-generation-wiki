        source: "§3.2, Table 7"
        evidence: "Continuous WavLM-large representations remain the ceiling across most DASB discriminative tasks, outperforming every discrete tokenizer benchmarked, with the largest margins observed in low-resource settings."
        confidence: high
        relevance: low
    limitations:
