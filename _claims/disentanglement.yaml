        claim: "Watermarks embedded in the speaker-specific latent space of a neural codec survive zero-shot voice cloning synthesis, whereas waveform-level watermarks do not."
        source: "§1, §3.5, Table 1"
        evidence: "VoiceMark achieves bit-wise accuracy of 0.964/0.979/0.957 across CosyVoice, F5-TTS, and MaskGCT zero-shot VC, while AudioSeal, WavMark, and Timbre all fall to ACC approximately 0.5 (near-random) after the same conversions."
