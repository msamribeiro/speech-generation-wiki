    caveats:
      - "Disentanglement here refers to SMIRK's separation of facial expression and jaw parameters in the visual modality (chosen specifically for this property over larger visual encoders), rather than any disentanglement mechanism applied to the speech signal itself; relevance to this concept is peripheral."

  - id: "2508.16332"
    entry_date: "2026-07-22"
