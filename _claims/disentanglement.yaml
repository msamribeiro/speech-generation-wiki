      - claim_id: rephrasetts_nar_variable_length_no_alignment
        role: supports
        claim: "Non-autoregressive TTS architectures with duration prediction can infer variable-length insertion segments without explicit phoneme-level alignment at inference time."
        source: "§3.1, §3.2"
