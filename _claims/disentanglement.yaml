        claim: "Single-codebook discrete speech codecs can match or exceed multi-codebook acoustic codec reconstruction quality at ultra-low bitrates when content and speaker information are explicitly decoupled."
        source: "§3.2, Table 1"
        evidence: "LSCodec-50Hz (V=300, 0.45 kbps) achieves WER 3.33% and MOS 4.49 on LibriTTS test-clean, outperforming all single-codebook baselines including WavTokenizer-small (WER 7.86, MOS 4.14 at 0.48 kbps) and multi-codebook SemantiCodec (WER 4.16 at 0.63 kbps)."
        confidence: high
        relevance: high
      - claim_id: lscodec_lower_framerate_degrades_content_disproportionately
        role: complicates
        claim: "Reducing codec frame rate through temporal downsampling degrades content intelligibility without proportional improvement in speaker disentanglement."
        source: "§3.2, Table 1; §3.3, Table 2"
        evidence: "Halving the frame rate from 50Hz to 25Hz reduces bitrate from 0.45 to 0.25 kbps but increases reconstruction WER from 3.33% to 5.46% and VC WER from 4.04% to 6.32%, while reconstruction SECS changes only marginally (0.954 to 0.945)."
        confidence: high
        relevance: medium
      - claim_id: lscodec_ssl_prediction_needed_under_bottleneck
        role: refines
        claim: "An auxiliary SSL token prediction objective is necessary for maintaining content intelligibility when an information bottleneck is used to remove speaker timbre."
        source: "§3.5, Table 3"
        evidence: "Ablating the SSL token prediction loss increases VAE-stage WER from 4.96% to 11.22% while SECS remains essentially unchanged (0.811 to 0.811), confirming the SSL prediction task guides content encoding independently of the speaker removal objective."
        confidence: high
        relevance: high
      - claim_id: lscodec_multistage_training_improves_both
        role: supports
        claim: "Multi-stage codec training, establishing a continuous disentangled space before quantization, improves both content preservation and speaker disentanglement compared to direct VQ training."
        source: "§3.5, Table 3"
        evidence: "Skipping stage 1 (VAE pre-training) and training VQ-VAE directly degrades WER from 3.39% to 3.84% and SECS from 0.817 to 0.800 in the VQ-VAE stage, confirming continuous-space initialization benefits discrete representation quality."
        confidence: medium
        relevance: medium
    limitations:
      - "The model is evaluated exclusively on English LibriTTS data; the vocoder (CTX-vec2wav alpha) is trained on a fixed 24 kHz corpus and speaker probing uses a single X-vector classifier, which may not detect all forms of residual speaker information."
    caveats:
      - "LSCodec's explicit speaker-perturbation-plus-bottleneck design provides a clean, well-ablated single-codebook counterpoint to the SSL-distillation-based disentanglement approaches (e.g., DualCodec, SpeechTokenizer) elsewhere in this concept."

  - id: "interspeech-2025-1115"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [TTS]
    architecture: [diffusion, autoregressive-LM]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: active_evidence
    method_family: [explicit_multiencoder_factorization]
    claims:
      - claim_id: mpetts_unified_emotion_encoder_control
        role: supports
        claim: "Unified multi-modal emotion encoders that align different prompt modalities to a shared emotion representation space enable flexible emotion control in zero-shot TTS without sacrificing speaker similarity."
        source: "§2.2, §3.4, Table 1"
        evidence: "MPEE ablation shows removing the multi-modal encoder drops MOS from 3.73 to 3.20 and emotion accuracy from 48% to 35% in speech-prompt mode; SSMOS (3.73) is maintained even when emotion and timbre are drawn from different speakers."
        confidence: high
        relevance: medium
      - claim_id: mpetts_ecl_prosody_emotion_alignment
        role: supports
        claim: "Auxiliary emotion consistency losses applied to autoregressive prosody prediction improve emotion alignment in generated speech."
        source: "§2.3, §3.4, Tables 1–3"
        evidence: "ECL ablation reduces ESMOS from 4.05 to 3.83 and ACC from 48% to 45% in speech-prompt mode; the gain is larger for text and image prompts, where the emotion signal is less direct."
        confidence: high
        relevance: medium
      - claim_id: mpetts_emotion_accuracy_gap
        role: complicates
        claim: "Emotion accuracy in expressive zero-shot TTS remains substantially below ground truth even with explicit emotion conditioning and auxiliary training objectives."
        source: "§3.4, Tables 1–3"
        evidence: "Best system ACC is 48% vs 54% for ground-truth mel-spectrograms; the 6-point gap persists despite MPEE and ECL, indicating that fine-grained emotion control is not yet solved at this data scale."
        confidence: high
        relevance: low
      - claim_id: mpetts_baseline_reproduction_limitation
        role: complicates
        claim: "Evaluating multi-modal TTS systems against prior work is complicated by the absence of official open-source implementations for key baselines."
        source: "§3.4"
        evidence: "MM-TTS has no official open-source release; all comparisons in this paper are against a reproduction based on the original paper's settings, which the authors acknowledge as a limitation of the experimental evaluation."
        confidence: medium
        relevance: low
      - claim_id: mpetts_hierarchical_disentanglement_granularity
        role: supports
        claim: "Hierarchical disentanglement of speech attributes at different granularity levels enables fine-grained independent control over timbre and emotion in zero-shot TTS."
        source: "§2.1, §3.4, Tables 1–3"
        evidence: "The disentangling strategy separates coarse-grained features (timbre, emotion as global vectors) from fine-grained features (content, prosody at frame level), using distinct bottleneck designs; SSMOS remains stable (3.73–3.76) across all three prompt modalities despite using different emotion sources from the timbre reference."
        confidence: high
        relevance: high
    limitations:
      - "MPE-TTS is fine-tuned on only 36 hours of MEAD-TTS (48 actors, 8 emotions), evaluates only English speech, and only one emotion modality can be provided at inference (no multi-modal fusion); WER is noticeably worse than ground-truth reconstructed mel (23.4% vs. 18.8%)."
    caveats:
      - "The hierarchical disentanglement strategy separates attributes primarily by granularity (coarse global vs. frame-level) rather than by an explicit information-theoretic or adversarial bottleneck; SSMOS stability across the three prompt modalities is the paper's main indirect evidence for successful timbre-emotion separation."

  - id: "interspeech-2025-1192"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [TTS]
    architecture: [transformer-enc-dec]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: active_evidence
    method_family: [adversarial_grl_disentanglement]
    claims:
      - claim_id: voiceimpression_grl_adversarial_disentanglement
        role: supports
        claim: "Adversarial disentanglement via a gradient reversal layer can separate voice impression information from speaker identity in a zero-shot TTS speaker encoder, enabling independent modulation of perceived voice characteristics."
        source: "§2.2, §4.1, Figure 5"
        evidence: "The control module applies GRL + 0.8 dropout to the speaker embedding to remove impression signal, then reintroduces it via an 11-dim impression vector; cosine similarity to the target speaker remains above the inter-speaker distribution at all tested modulation levels."
        confidence: high
        relevance: high
      - claim_id: voiceimpression_llm_style_vector_generation
        role: supports
        claim: "LLMs can generate low-dimensional speech style parameter vectors from free-form natural language descriptions, providing a usable zero-shot interface for voice characteristic control."
        source: "§2.3, §4.3, Table 4"
        evidence: "ChatGPT-4o prompted with dimension definitions and pre-modulation values produces impression vectors preferred over unmodulated speech in 94.6% of \"sleepy\" trials and 74.6% of \"urgent, attention-grabbing\" trials (n=436, crowdsourced)."
        confidence: medium
        relevance: low
      - claim_id: voiceimpression_naturalness_tradeoff
        role: complicates
        claim: "Fine-grained impression control in TTS involves a trade-off: stronger modulation produces more perceptually distinct impressions but degrades naturalness, particularly when the target impression is socially incongruent with the source speaker."
        source: "§4.2, Table 3"
        evidence: "MOS naturalness at maximum modulation (±3) falls to 2.71-2.88 for the Powerful-Weak and Dark-Bright dimensions, compared to 3.61-3.72 at zero modulation; low-scoring samples correspond to combinations such as \"feminine male\" or \"strongly dark/bright.\""
        confidence: high
        relevance: medium
      - claim_id: voiceimpression_labeling_pipeline_error
        role: complicates
        claim: "Automatic annotation of high-dimensional perceptual voice attributes at training scale requires indirect labeling pipelines that introduce estimation error, limiting the precision of supervision."
        source: "§3.2"
        evidence: "Crowdsourced subjective ratings were collected for only 1,154 of 20,270 speakers; a HuBERT-based estimator extrapolated labels to the remaining data with an RMSE of 0.338 on held-out utterances."
        confidence: medium
        relevance: low
    limitations:
      - "All training and evaluation data is a proprietary in-house Japanese corpus (no public datasets), and the evaluation spans only two held-out speakers; the eleven impression dimensions exhibit substantial inter-correlation (up to 0.8), so independent perceptual dimensions are not fully captured by the vector design."
    caveats:
      - "No ablation isolates the GRL component from the 0.8-dropout component, so the paper does not cleanly attribute disentanglement quality to the adversarial mechanism alone versus the dropout regularisation."

  - id: "interspeech-2025-1210"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [VC]
    architecture: [diffusion]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: active_evidence
    method_family: [orthogonality_constraint_disentanglement]
    claims:
      - claim_id: diffemotionvc_dual_granularity_emotion
        role: supports
        claim: "Dual-granularity emotion feature extraction (combining utterance-level and frame-level representations) improves emotion discriminability in voice conversion compared to single-scale approaches."
        source: "§2.1.3, §3.3.3, Table 3"
        evidence: "DiffEmotionVC's dual-granularity emotion encoder achieves 80% ECA and 0.78 Pearson Corr on the ESD dataset; ablation confirms removing the emotion encoder is the most damaging intervention, dropping Corr to 0.38."
        confidence: high
        relevance: medium
      - claim_id: diffemotionvc_orthogonality_stable_disentanglement
        role: supports
        claim: "Orthogonality constraints on emotion, speaker, and content feature spaces provide a stable and effective disentanglement mechanism for emotional voice conversion."
        source: "§2.2.2, §3.3.3, Table 3"
        evidence: "Removing orthogonal loss reduces SECS from 0.73 to 0.70 and Corr from 0.78 to 0.72; the paper explicitly motivates orthogonal loss as a remedy for the training instability of the mutual information loss used in prior work."
        confidence: high
        relevance: high
      - claim_id: diffemotionvc_arousal_confusion
        role: complicates
        claim: "Diffusion-based EVC systems achieve strong overall emotion accuracy but struggle to discriminate between high-arousal emotions sharing similar arousal-valence profiles."
        source: "§3.3.1"
        evidence: "DiffEmotionVC reaches 80% ECA overall but the paper notes difficulty distinguishing happy, surprised, and angry, attributing this to insufficient emotional diversity in the ESD training data rather than a fundamental model limitation."
        confidence: medium
        relevance: low
      - claim_id: diffemotionvc_discretization_leakage
        role: complicates
        claim: "Discretisation of continuous speech representations degrades emotion voice conversion by introducing content-emotion feature leakage."
        source: "§3.3.2, Table 2"
        evidence: "Replacing continuous ContentVec with VQ-ContentVec drops UTMOS from 4.04 to 2.54 and Corr from 0.78 to 0.50; SpeechTokenizer RVQ1 discrete features produce the worst performance (UTMOS 1.79), demonstrating that discrete tokens cause timbre and emotion entanglement."
        confidence: high
        relevance: high
      - claim_id: diffemotionvc_crossattention_fusion
        role: supports
        claim: "Cross-attention fusion outperforms additive fusion for integrating heterogeneous speech features in voice conversion systems."
        source: "§3.3.3, Table 3"
        evidence: "Ablation replacing gated cross-attention with simple additive fusion reduces UTMOS from 4.04 to 3.26, a 19% degradation in predicted audio quality."
        confidence: high
        relevance: low
    limitations:
      - "Evaluation is limited to the ESD dataset (five emotions, primarily Mandarin Chinese; the ablation table specifically targets the zh-Angry subset), restricting generalisability to other languages and broader emotion categories; model size is unreported and no code is released."
    caveats:
      - "The orthogonality loss is framed explicitly as a stability improvement over mutual-information-based disentanglement losses used in prior emotional voice conversion work, providing a direct methodological comparison point for this concept."

  - id: "interspeech-2025-1394"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [TTS]
    architecture: [transformer-enc-dec]
    relevance: high
    evidence_role:
