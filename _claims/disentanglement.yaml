        source: "§3.4, Figure 4"
        evidence: "Across the seven benchmarked tokenizers, Discrete WavLM leads discriminative tasks, DAC leads speaker recognition, and SQ-Codec matches higher-bitrate codecs on several speech metrics, with no single system topping all three evaluation axes (reconstruction, downstream, LM)."
