      - claim_id: sparktts_hierarchical_cot_attribute_control
        role: supports
        claim: "Attribute-controllable TTS benefits from hierarchical coarse-to-fine prediction within the LM inference loop rather than requiring separate conditioning modules."
        source: "§4.1, §6.3"
        evidence: "The chain-of-thought mechanism predicts fine-grained pitch/speed attributes from coarse labels, then global tokens, then semantic tokens, all within the same LM's inference loop, achieving 99.77% gender accuracy."
        confidence: medium
        relevance: low
    limitations:
      - "Speaker similarity in zero-shot cloning is meaningfully lower than multi-stage methods, with no mitigation evaluated in this work. BiCodec training data is English-only (LibriSpeech + Emilia EN/CN)."
    caveats:
      - "BiCodec's disentanglement into semantic and global speaker tokens trades off speaker-similarity fidelity relative to multi-stage systems (SIM 0.672 vs. 0.774 for MaskGCT on test-zh), a limitation the paper attributes to AR variability without explicit disentanglement constraints between the two token streams."

  - id: "2025.findings-naacl.130"
