        role: supports
        claim: "Converting speech timbre to singing requires cross-modal speaker embedding alignment, and standard singer-identity conditioning generalises poorly across the speech-singing domain boundary."
        source: "§1, §2.1"
        evidence: "The Speaker-Singer Adaptation Network (SSAN) is introduced specifically because standard SVC conditioning mechanisms fail to generalise across the speech-singing embedding-space gap; SSAN uses a cosine embedding loss to align matched speaker-singer pairs from NUS-48E."
        confidence: medium
        relevance: medium
      - claim_id: ssansvc_cycle_training_compensates_scarce_data
        role: supports
        claim: "Cycle training strategies that simulate paired cross-domain data can compensate for the scarcity of matched speech-singing corpora in voice conversion training."
        source: "§2.3"
        evidence: "Stage 2 cross-domain cycle training pairs singing content from one speaker with speech timbre from another, generates an intermediate output, and reuses it as timbre input for a second conversion pass, simulating paired data without requiring it."
        confidence: medium
        relevance: low
      - claim_id: ssansvc_speech_prompted_lower_similarity_than_indomain
        role: complicates
        claim: "Zero-shot singing voice conversion with speech prompts achieves lower timbre similarity scores than same-domain (singing-to-singing) conversion, indicating that the cross-modal gap is not fully closed by embedding alignment alone."
        source: "§3.3, Table 1, Table 2"
        evidence: "SSANSVC-stage2 achieves SIM 0.506 on the cross-domain speech-prompted singing task, an improvement over CoMoSVC's 0.448 but still below in-domain singing-to-singing conversion performance."
        confidence: medium
        relevance: medium
      - claim_id: ssansvc_automated_metrics_vs_smallpanel_subjective
        role: refines
        claim: "Automated speaker similarity metrics capture relative improvements from cross-domain adaptation that are not clearly reflected in small-panel subjective timbre similarity ratings."
        source: "§3.2, §3.3, Table 3"
        evidence: "SSANSVC-stage2 shows a clear SIM gain (+0.058) over the baseline, but subjective MOS-ts confidence intervals overlap between SSANSVC-stage2 and SSANSVC-stage1 with only 10 listeners."
        confidence: low
        relevance: low
    limitations:
      - "The subjective evaluation relies on only 10 volunteers, producing overlapping confidence intervals across systems; the loss function addresses only mel reconstruction, with timbre loss and lyrics recognition loss absent."
    caveats:
      - "The disentanglement/alignment problem addressed here is cross-domain (speech vs. singing) speaker embedding alignment rather than the within-utterance content-speaker-prosody disentanglement more typical of this concept."

  - id: "interspeech-2025-0948"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [VC]
    architecture: [VAE, diffusion]
    relevance: medium
    evidence_role:
      - control_evidence
    current_role: active_evidence
    method_family: [signal_level_prosody_decomposition]
    claims:
      - claim_id: promptevc_nl_prompts_flexible_emotion_control
        role: supports
        claim: "Natural language prompts enable more flexible and subjectively accurate emotion control in voice conversion than numeric intensity values or reference audio selection."
        source: "§1, §3.4"
        evidence: "PromptEVC achieves MOS 4.22 and 81.3% emotion similarity on TextrolSpeech, compared to the strongest prior baseline (Emovox) at MOS 3.95 and 76.5% similarity, using natural-language prompts rather than labels or numeric values."
        confidence: medium
        relevance: low
      - claim_id: promptevc_diffusion_mapper_replaces_reference_audio
        role: supports
        claim: "A diffusion-based mapping from text embeddings to speech emotion embeddings is sufficient to replace reference audio at inference time without significant quality loss."
        source: "§2.1, §3.2, Table 1"
        evidence: "The prompt mapper, a score-based diffusion model conditioned on Emotion2Vec reference embeddings during training, is used alone at inference (no reference audio needed), and the system achieves the best CER (4.09%) and log-F0 RMSE (42.58) among five compared systems."
        confidence: medium
        relevance: low
      - claim_id: promptevc_joint_training_improves_naturalness
        role: supports
        claim: "Joint training of a text-to-emotion mapper with reference emotion embeddings improves prosody naturalness over direct prediction from text alone."
        source: "§3.3, Table 1"
        evidence: "Removing the prompt mapper degrades F0 RMSE by 1.29 and naturalness MOS by 0.39 in the ablation, confirming the value of joint training against the reference-derived Emotion2Vec target distribution."
        confidence: medium
        relevance: low
      - claim_id: promptevc_f0_constraint_needed_for_identity_preservation
        role: supports
        claim: "Preserving speaker identity during emotional pitch manipulation requires an explicit F0 constraint in the speaker encoder; adversarial training alone is insufficient."
        source: "§2.3, §3.3, Table 1"
        evidence: "Removing the speaker encoder's F0 regression constraint (log-F0 L2 loss) raises F0 RMSE substantially (49.36 vs. 42.58 for the full system), confirming the constraint's role in preventing identity drift under pitch manipulation."
        confidence: high
        relevance: high
      - claim_id: promptevc_mixed_emotion_harder_to_control
        role: complicates
        claim: "Mixed-emotion synthesis remains harder to control than single-category emotion intensity across both subjective and objective metrics."
        source: "§3.4, Table 2, Table 3"
        evidence: "Mixed-emotion classification accuracy (E_mx 61.3%) is substantially lower than intensity (77.6%), pitch (86.4%), speed (89.7%), and volume (91.5%) control accuracy."
        confidence: medium
        relevance: low
    limitations:
      - "Training and evaluation are conducted entirely on TextrolSpeech, a single corpus with a limited speaker set; subjective MOS evaluation uses only 25 listeners across 132 utterances."
    caveats:
      - "The F0-constrained speaker encoder is the paper's genuine disentanglement mechanism, isolating speaker identity from emotion-driven pitch manipulation; the remaining claims concern the natural-language conditioning interface rather than disentanglement per se."

  - id: "interspeech-2025-1081"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [VC]
    architecture: [GAN]
    relevance: high
    evidence_role:
      - core_evidence
      - evaluation_caution
    current_role: active_evidence
    method_family: [ssl_statistical_normalization_disentanglement]
    claims:
      - claim_id: sncr_content_restoration_compensates_in_degradation
        role: supports
        claim: "Explicit content-restoration mechanisms can compensate for linguistic information degraded by instance normalization in speaker disentanglement, preserving intelligibility without SSL feature extractors."
        source: "§2.1, Table 2"
        evidence: "The SNCR dual restoration loss, which decomposes the instance-normalization residual into content-relevant and content-irrelevant parts via phoneme-entropy constraints, reduces WER from 5.57% (without SNCR) to 3.78% compared to a baseline trained with neither IN nor dual restoration loss."
        confidence: high
        relevance: high
      - claim_id: sncr_gan_matches_diffusion_lower_cost
        role: supports
        claim: "GAN-based zero-shot voice conversion systems can match the speaker similarity of diffusion-based systems at substantially lower parameter count and faster inference."
        source: "§3.2, Table 1"
        evidence: "The proposed 50M-parameter GAN system achieves SECS 0.25 versus DDDM-VC's SECS 0.27, while running at RTF 0.11 versus 0.29 and using 366M fewer parameters; naturalness (nMOS 3.86 vs. 3.52) also favors the GAN system."
        confidence: high
        relevance: low
      - claim_id: sncr_attention_discriminator_improves_quality
        role: supports
        claim: "Integrating self-attention layers into CNN-based discriminators improves adversarial training quality for mel-spectrogram reconstruction in voice conversion."
        source: "§3.3, Table 2"
        evidence: "Ablation with the discriminator's self-attention layers removed (replaced with a standard CNN discriminator) degrades nMOS and increases WER compared to the full system."
        confidence: medium
        relevance: low
      - claim_id: sncr_speaker_similarity_inflated_by_overlap
        role: complicates
        claim: "Speaker similarity metrics in zero-shot VC evaluations can be inflated when the test set speakers overlap with a baseline system's training set, making fair cross-system comparison difficult."
        source: "§3.2"
        evidence: "VQMIVC achieves SECS 0.23 (close to the proposed system's 0.25) but was trained on VCTK, which overlaps with the VCTK test speakers; its WER of 21.4% reveals conversions are not actually intelligible despite the seemingly competitive SECS."
        confidence: high
        relevance: medium
    limitations:
      - "The system trains and evaluates on English only (LibriLight and VCTK); the ablation evaluates components one at a time, leaving interactions between SNCR and consistency loss unexplored."
    caveats:
      - "The SNCR module's entropy-based dual restoration loss is a genuinely distinct disentanglement mechanism from mutual-information or gradient-reversal approaches elsewhere in this concept, offering an instance-normalization-residual framing of the content-speaker separation problem."

  - id: "interspeech-2025-1101"
    entry_date: "2026-07-22"
    year: 2025
    venue: Interspeech
    task: [VC]
    architecture: [diffusion]
    relevance: high
    evidence_role:
      - core_evidence
      - control_evidence
    current_role: active_evidence
    method_family: [mutual_information_minimization]
    claims:
      - claim_id: zsdevc_diffusion_mi_guidance_zeroshot_emotion_control
        role: supports
        claim: "Diffusion-based voice conversion systems can achieve strong emotion controllability in zero-shot settings when combined with mutual-information disentanglement and inference-time guidance."
        source: "§3.2, §3.3, Table 2"
        evidence: "ZSDEVC achieves subjective emotion classification accuracy (ECA) of 0.53 vs. 0.256 for EMOCONV-DIFF, with the disentanglement mechanism alone raising ECA by 16.8-21.1% and expressive guidance adding a further 34.4-40.0% relative gain over the backbone."
        confidence: high
        relevance: high
      - claim_id: zsdevc_mi_minimisation_no_parallel_data
        role: supports
        claim: "Disentangling speaker identity and emotion via mutual information minimisation improves emotion controllability in voice conversion without requiring parallel or speaker-specific training data."
        source: "§2.1.4, §3.3, Table 2"
        evidence: "The vCLUB contrastive upper-bound estimator minimises MI between speaker and emotion projections during training on MSP-Podcast, an in-the-wild corpus with no parallel emotional recordings, and this alone raises ECA by 16.8% on MSP-Podcast and 21.1% on ESD over the backbone."
        confidence: high
        relevance: high
      - claim_id: zsdevc_autoencoder_higher_accuracy_lower_naturalness
        role: complicates
        claim: "In emotional voice conversion, autoencoder-based methods tend to achieve higher emotion accuracy than GAN-based methods, but at the cost of substantially lower naturalness and higher speech distortion."
        source: "§3.2, Table 1"
        evidence: "The paper notes that autoencoder-disentanglement approaches accurately separate emotion but tend to produce distorted, low-naturalness outputs, motivating the diffusion-plus-guidance approach instead of a pure autoencoder disentanglement pipeline."
        confidence: medium
        relevance: medium
      - claim_id: zsdevc_cfg_style_guidance_tradeoff
        role: complicates
        claim: "Classifier-free-style guidance applied to emotion representations at inference time provides a direct lever for trading naturalness against emotion controllability in diffusion-based EVC."
        source: "§2.1.3, §3.3, Table 2"
        evidence: "Adding EG_emo guidance boosts ECA by 40.0% on MSP-Podcast and 37.4% on ESD relative to the backbone, with a slight cost in naturalness (UTMOS drops from 2.427 to 2.353 on MSP-Podcast)."
        confidence: medium
        relevance: medium
      - claim_id: zsdevc_large_scale_itw_training_generalizes
        role: supports
        claim: "Training on large-scale in-the-wild emotional corpora enables zero-shot generalisation to speakers absent from training, even when evaluation is conducted on acted-speech datasets with different recording conditions."
        source: "§3.4, §4"
        evidence: "The model is trained on 48,389 utterances from 1,381 speakers in MSP-Podcast (in-the-wild podcast recordings) and evaluated on entirely held-out speakers from both MSP-Podcast and the acted ESD dataset with consistent trends."
        confidence: medium
        relevance: low
    limitations:
      - "The comparison between ZSDEVC and EMOCONV-DIFF in Table 1 is not fully fair, as EMOCONV-DIFF is evaluated in a seen-speaker scenario while ZSDEVC operates zero-shot; evaluation covers only five emotion categories and excludes neutral-to-emotional conversion."
    caveats:
      - "The MI-minimisation disentanglement mechanism (vCLUB) and the paired auxiliary supervised heads together give this paper a well-controlled ablation isolating the specific contribution of disentanglement from that of inference-time guidance, a useful methodological separation for the concept."

