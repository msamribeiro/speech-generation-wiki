        confidence: medium
        relevance: low
    limitations:
      - "Reported WER remains high (35.68-36.24% in the full-resource setting), and the paper's own subjective MOS audio-quality test (without speaker context) ranks the proposed Mel-based vocoder below the unit-based baseline. Evaluation is restricted to English-only corpora."
    caveats:
      - "The paper's central finding concerns vocoder representation choice (discrete units vs. continuous mel-spectrogram) rather than a novel disentanglement mechanism; it is best read as diagnostic/negative evidence about a common disentanglement-adjacent design choice (unit-based tokenization) rather than a new disentanglement method."

  - id: "2025.naacl-long.242"
