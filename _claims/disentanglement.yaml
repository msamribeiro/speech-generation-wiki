method_families:
  - id: explicit_multiencoder_factorization
    name: "Explicit Multi-Encoder Attribute Factorization"
    summary: "Dedicated encoders or conditioning streams are trained (or composed) for each target attribute (content, speaker/timbre, prosody, style, emotion, accent), with disentanglement enforced by architectural separation rather than a single shared representation. This is the largest and most heterogeneous family in the corpus, spanning the foundational FACodec/NaturalSpeech 3 factorization and its direct derivatives (ControlSpeech, OZSpeech) alongside independently-developed dedicated-encoder systems for accent, emotion, articulatory, style, and adapter-based speaker/style control. Several members explicitly report incomplete or unvalidated separation (DiffStyleTTS's GST timbre/prosody overlap, ChiresSD and CoNAN's inherited-rather-than-novel mechanisms), so membership reflects a shared architectural pattern rather than uniformly strong evidence of clean separation."
    papers:
      - "2025.acl-demo.37"
      - "2025.acl-long.1043"
      - "2025.acl-long.346"
      - "2025.ccl-1.77"
      - "2025.coling-main.352"
      - "2025.naacl-long.242"
      - "2312.01479"
      - "2402.05755"
      - "2403.03100"
      - "2409.09098"
      - "2412.04724"
      - "2505.07916"
      - "2507.01348"
      - "2507.14534"
      - "2508.02038"
      - "2508.04141"
      - "2508.06890"
      - "2508.08095"
      - "2509.14684"
      - "2509.16010"
      - "2509.19231"
      - "interspeech-2025-0203"
      - "interspeech-2025-0383"
      - "interspeech-2025-0433"
      - "interspeech-2025-0596"
      - "interspeech-2025-0815"
      - "interspeech-2025-1115"
      - "interspeech-2025-1538"
      - "interspeech-2025-1779"
      - "interspeech-2025-cho25c_interspeech"
    open_questions:
      - "Does architectural factorization alone (without an adversarial or information-theoretic penalty) reliably prevent cross-stream leakage, or does it require a secondary mechanism (GRL, orthogonality, MI minimization) to hold under distribution shift?"
      - "As this family absorbs increasingly attribute-specific dedicated-encoder designs (accent, articulatory, likability, dialect) and increasingly many papers that only inherit an earlier system's factorization without modifying it, is there still a shared underlying architectural principle, or has the family become a catch-all?"
  - id: adversarial_grl_disentanglement
    name: "Adversarial / Gradient-Reversal-Based Disentanglement"
    summary: "A gradient reversal layer (or equivalent adversarial classifier) actively penalizes a representation for retaining predictable information about an attribute it should not encode, such as speaker identity in an emotion embedding or pitch in a content token."
    papers:
      - "2403.03100"
      - "2412.04724"
      - "2506.21619"
      - "2508.06890"
      - "interspeech-2025-0347"
      - "interspeech-2025-1192"
      - "interspeech-2025-1638"
    open_questions:
      - "Why does GRL-based disentanglement measurably degrade perceptual quality in some systems (PeriodCodec) but not others (StableVC, MaestroEVC), and is this attributable to the target attribute (pitch vs. timbre/emotion), the training curriculum, or the strength of the adversarial penalty?"
  - id: mutual_information_minimization
    name: "Mutual-Information-Minimization-Based Disentanglement"
    summary: "An explicit information-theoretic objective, such as a vCLUB or variational mutual-information upper bound, is minimized between attribute representations during training, directly targeting statistical independence rather than relying on adversarial classification."
    papers:
      - "interspeech-2025-0464"
      - "interspeech-2025-1101"
    open_questions:
      - "Only two papers in this concept use MI minimization as their primary disentanglement objective; does this remain a niche technique relative to GRL and orthogonality constraints, or is broader adoption limited primarily by the added implementation and tuning complexity of MI estimators?"
  - id: orthogonality_constraint_disentanglement
    name: "Orthogonality-Constraint-Based Disentanglement"
    summary: "Attribute embedding spaces are explicitly regularized to be geometrically orthogonal, via a cross-dot-product or similar loss, or are found to occupy naturally orthogonal subspaces within a shared pretrained representation."
    papers:
      - "2508.02038"
      - "2509.09201"
      - "interspeech-2025-0438"
      - "interspeech-2025-1210"
      - "interspeech-2025-2586"
    open_questions:
      - "LinearVC finds orthogonal content-speaker subspaces occur naturally within pretrained SSL representations without any imposed loss; does this mean explicit orthogonality losses in other systems are formalizing a structure the representation would develop anyway, or are they doing genuine additional work?"
  - id: rvq_semantic_acoustic_distillation
    name: "Hierarchical RVQ / Codec Semantic-Acoustic Distillation"
    summary: "A neural codec's residual quantizer layers are functionally specialized, typically by distilling semantic or linguistic supervision from SSL features or ASR into the first codebook while leaving later layers to capture acoustic and speaker detail. This is the largest codec-level family and traces its lineage to AudioLM's semantic/acoustic token split and SpeechTokenizer's per-layer distillation; several later members (VibeVoice, PerformSinger) inherit this pattern from an earlier system rather than modifying it, and WavTokenizer and AnCoGen provide direct complicating evidence that the split is incomplete or degrades under certain conditions."
    papers:
      - "2025.findings-naacl.130"
      - "2209.03143"
      - "2308.16692"
      - "2408.16532"
      - "2502.06490"
      - "2506.10274"
      - "2506.23325"
      - "2508.02849"
      - "2508.08399"
      - "2508.19205"
      - "2509.13068"
      - "2509.17006"
      - "2509.22062"
      - "2509.22718"
      - "interspeech-2025-0115"
      - "interspeech-2025-0246"
      - "interspeech-2025-0468"
      - "interspeech-2025-1440"
      - "interspeech-2025-1639"
    open_questions:
      - "Does the semantic-acoustic split degrade at very low frame rates or very low bitrates, as AnCoGen and MBCodec both suggest, and is there a principled floor below which hierarchical RVQ disentanglement breaks down regardless of distillation strength?"
  - id: asr_text_alignment_disentanglement
    name: "ASR / Text-Alignment-Based Content Isolation"
    summary: "Content representations are aligned to ASR outputs, phoneme sequences, or speaker-independent text embeddings via CTC, monotonic alignment search, or ASR-loss backpropagation, rather than distilled from generic self-supervised features, on the premise that linguistic supervision more directly removes non-content information."
    papers:
      - "2025.acl-long.87"
      - "2506.23325"
      - "2507.01348"
      - "2507.09070"
      - "2507.12197"
      - "2509.22062"
      - "interspeech-2025-1538"
    open_questions:
      - "Does the reported advantage of ASR/text-alignment supervision over SSL distillation hold on public, open codecs, or is it currently confounded by proprietary training-data scale in the papers reporting it (SemAlign, XY-Tokenizer)?"
  - id: discrete_bottleneck_disentanglement
    name: "Discrete / Scalar Quantization Bottleneck as Implicit Disentanglement"
    summary: "Constraining a representation through a small VQ vocabulary, finite scalar quantization, or a differentiable scalar-quantization bottleneck is used as an implicit information bottleneck that strips non-essential (typically speaker or acoustic-detail) information, without a dedicated adversarial or distillation loss targeting that attribute."
    papers:
      - "2502.07243"
      - "2503.01710"
      - "2508.08399"
      - "2508.16332"
      - "2509.24650"
      - "interspeech-2025-1106"
      - "interspeech-2025-2684"
    open_questions:
      - "Is bottleneck size the primary lever for the quality/disentanglement trade-off across this family, or do the specific quantization scheme (VQ vs. FSQ vs. SimVQ) and codebook-collapse mitigations matter as much as vocabulary size itself?"
  - id: signal_level_prosody_decomposition
    name: "Explicit Signal-Level Prosody/Pitch Decomposition"
    summary: "Prosodic sub-attributes, most often F0, are decomposed at the signal level, through periodic-component injection, discrete wavelet transform, or mutual-information-guided prosody-timbre separation, rather than relying on a learned representation to separate them implicitly."
    papers:
      - "2507.20091"
      - "interspeech-2025-0347"
      - "interspeech-2025-0464"
      - "interspeech-2025-0948"
      - "interspeech-2025-1397"
      - "interspeech-2025-1779"
    open_questions:
      - "Signal-level pitch decomposition methods in this family report success where representation-level disentanglement methods elsewhere in the concept (GRL, generic SSL distillation) report failure on pitch specifically; is signal-level decomposition a structurally more reliable route to pitch disentanglement, or do current representation-level methods simply lack an equivalent dedicated mechanism?"
  - id: data_training_recipe_disentanglement
    name: "Data-Level / Training-Recipe Disentanglement"
    summary: "Disentanglement is achieved primarily through data augmentation, perturbation, decoupled training-pair construction, or self-distillation on synthetically perturbed data, rather than through a new architectural component or loss function."
    papers:
      - "2406.02430"
      - "2411.09943"
      - "2411.19770"
      - "2508.07426"
      - "2509.15626"
      - "2509.17516"
      - "2509.19883"
      - "interspeech-2025-1106"
      - "interspeech-2025-1394"
      - "interspeech-2025-1434"
      - "interspeech-2025-1684"
    open_questions:
      - "ReWind reports substantial variance in the effectiveness of augmentation-based speaker disentanglement across backbone architectures; is data-level disentanglement backbone-agnostic in principle, or does it require re-validation for each new generative architecture it is applied to?"
  - id: ssl_statistical_normalization_disentanglement
    name: "SSL-Representation Statistical & Normalization-Based Disentanglement"
    summary: "Disentanglement is achieved by exploiting or lightly manipulating the existing statistical or geometric structure of pretrained self-supervised representations, for example dimensionality reduction, instance normalization of residual statistics, or subspace projection, rather than training a new disentangling objective from scratch."
    papers:
      - "2104.00355"
      - "interspeech-2025-0438"
      - "interspeech-2025-1081"
      - "interspeech-2025-1531"
    open_questions:
      - "Is the proportional timbre/content signal distribution found in SSL embedding dimensions (SVC) a general property of self-supervised speech models, or specific to the particular pretraining objective and model family tested?"

reassessment_queue:
  - id: explicit_multiencoder_factorization
    type: method_family
    reason: "This is by far the largest and most heterogeneous family in the concept (30 papers spanning FACodec-lineage codecs, adapter-based speaker/style splits, and attribute-specific dedicated encoders for accent, articulation, and likability, plus several papers that only inherit an earlier system's factorization without modifying it); it risks becoming a catch-all rather than a coherent architectural pattern."
    trigger: "A future integration pass finds the family's members no longer share a clearly identifiable common mechanism (a dedicated per-attribute representation or encoder), or a natural sub-family (e.g. accent-specific, articulatory, or adapter-based encoders) has grown large enough to warrant its own family."
    due: "2026-10"
    current_assessment: influential
    watch_for:
      - "Growth of the accent/articulation/likability-specific subset to 5+ papers, which would justify splitting into a dedicated attribute-specific conditioning family."
      - "A survey or benchmark paper directly comparing explicit multi-encoder factorization against the other 9 families on matched systems."
  - id: grl_disentanglement_leakage_vs_quality_tradeoff
    type: claim_status
    reason: "Only one paper (PeriodCodec) in this batch reports a clean quality regression from GRL-based disentanglement, and only one (DiEmoTTS) directly critiques GRL as a design choice, against 5 papers reporting GRL successfully reduces leakage; the contested status rests on a small number of dissenting papers."
    trigger: "Two or more additional papers independently replicating either a GRL-induced quality regression on a new attribute, or a clean ablation showing GRL disentanglement with no quality cost."
    due: "2026-12"
    current_assessment: contested
    watch_for:
      - "A direct head-to-head ablation of GRL vs. no-GRL on identical architecture and data, isolating the quality effect from confounds like curriculum or data scale."
  - id: disentanglement_oriented_codecs_fail_on_pitch
    type: claim_status
    reason: "AnCoGen's finding that disentanglement-trained codecs including SpeechTokenizer- and Mimi-style designs fail on pitch is a strong, direct claim, but the contradicting evidence (PACE, VibeSVC, PromptEVC) all use dedicated signal-level F0 mechanisms rather than the generic representation-level disentanglement AnCoGen evaluated, so the two bodies of evidence may not be in genuine conflict."
    trigger: "A paper applying signal-level F0 decomposition inside one of the specific codecs AnCoGen evaluated (SpeechTokenizer, Mimi, EnCodec) and re-testing pitch separability, or conversely a generic representation-level method achieving clean pitch separation without dedicated signal-level machinery."
    due: "2027-01"
    current_assessment: contested
    watch_for:
      - "Direct pitch-leakage probes (not just downstream VC/EVC quality) applied to both signal-level and representation-level disentanglement methods on the same evaluation protocol."
  - id: mutual_information_minimization
    type: method_family
    reason: "Only two papers currently instantiate this family; it is unclear whether MI-minimization is a durable third disentanglement paradigm alongside GRL and orthogonality constraints, or a narrow technique specific to voice-conversion emotion/prosody control."
    trigger: "One additional paper adopting MI minimization as its primary disentanglement objective outside voice conversion, e.g. in TTS or codec design."
    due: "2026-12"
    current_assessment: frontier_probe
    watch_for:
      - "Adoption of vCLUB or a similar MI upper bound outside the two VC papers currently in this family."
      - "A direct comparison paper contrasting MI minimization against GRL or orthogonality constraints on matched systems."
  - id: prompt_based_conditioning_causes_attribute_leakage
    type: claim_status
    reason: "This cluster is built on three 2025 papers (CoMelSinger, LibriTTS-VI, AudiobookCC) that each independently identified prompt-based attribute leakage as a problem in masked generative or codec-LM TTS; it is a fast-emerging finding worth tracking for further replication before treating it as an established property of the paradigm."
    trigger: "Two or more additional papers reporting prompt-based attribute leakage in a masked-generative or codec-LM TTS system not already in this cluster."
    due: "2026-11"
    current_assessment: strongly_supported
    watch_for:
      - "A systematic benchmark quantifying prompt-leakage magnitude across multiple codec-LM TTS systems on a shared evaluation protocol."
  - id: "2508.16332"
    type: paper_role
    reason: "Vevo2's information-bottleneck content-style tokenizer follows the same pattern as the discrete_bottleneck_disentanglement family (Vevo, VoxCPM, SparkTTS), but the paper's own description states the mechanism is not directly ablated; it was assigned to that family this round on architectural grounds pending clearer evidence."
    trigger: "A follow-up paper or an updated version of Vevo2 that directly ablates the content-style tokenizer's disentanglement quality."
    due: "2026-10"
    current_assessment: minor
    watch_for:
      - "A dedicated ablation isolating the information bottleneck's contribution to timbre exclusion in Vevo2 or a successor system."
  - id: objective_metrics_dont_predict_subjective_disentanglement_quality
    type: claim_status
    reason: "Only three papers (AccentBox, DiViSe, SNCR) directly support this cluster, each in a different sub-domain (accent conditioning, video-to-speech, zero-shot VC); it is marked emerging rather than strongly_supported pending replication within a single sub-domain."
    trigger: "Two or more additional papers within the same sub-domain (e.g. two more zero-shot VC papers, or two more accent-conditioning papers) independently reporting objective/subjective disagreement."
    due: "2027-01"
    current_assessment: emerging
    watch_for:
      - "A systematic study directly comparing objective disentanglement metrics (EER, classifier accuracy) against controlled listening tests on the same set of systems."

open_questions:
  - "Most papers in this concept validate disentanglement indirectly, through downstream voice-conversion similarity, WER, or classifier-proxy metrics, rather than a direct information-theoretic leakage probe between representations; is a standardized direct-measurement protocol feasible, or does the field need to accept indirect validation as the practical ceiling?"
  - "Pitch/F0 disentanglement appears to be a persistent weak point across nearly every architectural family (GRL, RVQ distillation, MI minimization); does the field need a dedicated pitch-disentanglement benchmark analogous to SLMTokBench or ProsodyBench for content/speaker separation?"
  - "The concept's ten identified method families are not mutually exclusive (14 of 100 papers combine two mechanisms); is there a natural hierarchy, for example is architectural factorization a prerequisite substrate onto which adversarial, orthogonality, or MI-based objectives are subsequently layered?"
  - "Speaker similarity is the attribute most frequently sacrificed across the disentanglement-reconstruction fidelity trade-off cluster; is this because speaker identity is inherently harder to disentangle than content or prosody, or because speaker-similarity metrics are simply more standardized and therefore more consistently reported as a regression?"

trend_notes:
  - "The 2025 Interspeech proceedings contributed the single largest concentration of disentanglement-focused papers in the corpus (over 35), with a marked shift toward emotion/style-speaker disentanglement in voice conversion and TTS relative to the 2023-2024 focus on codec-level content-speaker separation."
  - "Explicit signal-level prosody/pitch decomposition and prompt-based-leakage diagnosis are the most recent (mid-to-late 2025) additions to the concept, suggesting the field's disentanglement frontier is moving from coarse content/speaker/prosody separation toward finer-grained sub-attribute leakage (pitch sub-components, prompt-derived style leakage)."
  - "ASR/text-alignment-based content isolation, as opposed to generic SSL-feature distillation, has grown from a minority technique (SpeechTokenizer, 2023) to a recurring 2025 pattern across both TTS and VC systems (SemAlign, XY-Tokenizer, TakinVC, QTTS, CAT-TTS/S3Codec)."
