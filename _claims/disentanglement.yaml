        source: "§5.1, Table 1; §6.3, Table 5"
        evidence: "Voice conversion quality degrades progressively with coarser compression (Q-MOS drops from 3.85 at 15 Hz to 3.33 at 7 Hz, WER rising to 9.1%), confirming generation tasks are less tolerant of compression than understanding tasks, which benefit from compression near phoneme rate."
        confidence: medium
