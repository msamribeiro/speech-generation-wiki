    claims:
      - claim_id: avlm_visual_complementary_emotion
        role: supports
        claim: "Full-face visual features encode complementary emotional information not captured by audio alone, and combining both modalities yields meaningfully higher emotion recognition accuracy than either modality individually."
        source: "§3, Table 1"
        evidence: "AVLM improves IEMOCAP four-class emotion recognition F1 from 61.3% (speech-only) to 66.2% (audio-visual), a +4.9 point gain, using SMIRK's disentangled facial expression parameters as the visual feature source."
        confidence: medium
