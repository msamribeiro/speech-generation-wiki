papers:
  - id: 2508.02849
    year: 2025
    task: [codec]
    architecture: [VAE]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Frame-level cross-modal contrastive learning between phoneme and speech representations achieves cleaner semantic-paralinguistic separation than SSL distillation.
      - VAE+FSQ quantisation substantially reduces long-tail token distributions that impair downstream LM training.
    evidence:
      - SecoustiCodec: 98% codebook utilisation with VAE+FSQ; frame-level contrastive training removes paralinguistic content more effectively than HuBERT/WavLM distillation.
    limitations:
      - Requires duration-aligned phoneme labels for contrastive training.

  - id: 2508.04996
    year: 2025
    task: [VC]
    architecture: [flow-matching]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - Random feature erasure during training reduces over-reliance on noise-sensitive SSL representations without information bottleneck machinery.
    evidence:
      - REF-VC: random erasing of SSL features reduces timbre leakage and noise sensitivity; CER 8.03% vs. 12.45% for Seed-VC on noisy test.
    limitations:
      - Evaluated on 10 unseen speakers; limited generalization test.

  - id: 2508.06890
    year: 2025
    task: [VC]
    architecture: [transformer-enc-dec]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Frame-level emotion representations from speech diarisation models improve prosody transfer fidelity over utterance-level representations.
      - Temporal content-aware emotion features that vary with phoneme context outperform utterance-uniform emotion conditioning.
    evidence:
      - Maestro-EVC: TCEM cross-attention with content representations querying frame-level emotion embeddings; GRL on content classifier suppresses residual phonetic leakage.
    limitations:
      - Evaluated on ESD corpus only (350 utterances, 10 speakers).

  - id: 2508.07302
    year: 2025
    task: [TTS]
    architecture: [flow-matching]
    relevance: low
    contribution_type: engineering-integration
    claims:
      - Language-agnostic Emo2Vec embeddings as cross-lingual retrieval signal avoid direct prosody disentanglement across typologically distant languages.
    evidence:
      - XEmoRAG uses Emo2Vec retrieval as an alternative to cross-lingual prosody disentanglement; EMOS 4.65 on Thai from Chinese emotional data.
    limitations:
      - Retrieval-based; not a disentanglement approach per se.

  - id: 2508.07426
    year: 2025
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: medium
    contribution_type: empirical-benchmark
    claims:
      - kNN-VC timbre augmentation provides speaker-accent disentanglement in low-resource accent TTS; geolocation-based accent label discovery provides cleaner accent conditioning.
    evidence:
      - kNN-VC augmentation improves objective accent similarity; geolocation-based filtering outperforms raw self-reported labels.
    limitations:
      - Mixed human evaluation; kNN-VC benefit unclear perceptually.

  - id: 2508.08399
    year: 2025
    task: [VC]
    architecture: [VAE]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Fully discrete three-factor codec disentanglement from WavLM is achievable without phoneme labels or F0 supervision.
      - Quantizing speaker vectors into discrete codes introduces a measurable trade-off between LLM compatibility and speaker identity fidelity.
    evidence:
      - WavLM-Large (6th layer) + instance normalization + GRVQ for speaker codes; UMAP confirms quantized prosody vectors align with speaker-normalized F0 deviation; speaker fidelity vs. codebook size quantified.
    limitations:
      - Quality evaluation on small held-out set; no comparison against leading disentanglement systems.

  - id: 2508.08961
    year: 2025
    task: [SCA, TTS]
    architecture: [autoregressive-LM]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - Decoupling understanding-oriented and acoustic-generation token streams resolves the semantic-acoustic tension in unified speech LLMs.
    evidence:
