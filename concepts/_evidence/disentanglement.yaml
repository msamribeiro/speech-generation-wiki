open_questions:
  - How well does Conan's CVQ style encoder actually capture emotion independently of timbre?
  - Can activation-space direction arithmetic scale to multi-factor simultaneous disentanglement?
  - Can factorized codecs disentangle language from speaker in multilingual settings for true cross-lingual voice identity transfer?
  - What codebook design mitigates the speaker code discretization trade-off while preserving LLM compatibility?

trend_notes:
  - The field is converging on multiple complementary approaches: codec-level factorization (DisCodec, FACodec, SecoustiCodec, SPCODEC), activation-space direction arithmetic (Marco-Voice, EmoSteer-TTS), regularisation-based (REF-VC), and semantic/acoustic decoupling (DualSpeechLM).
  - Integration pass 5 adds: frame-level temporal emotion alignment (Maestro-EVC), spectral codec disentanglement (SPCODEC), cross-modal contrastive disentanglement (SecoustiCodec), systematic ablation of fully-discrete disentanglement (2508.08399), and modality-based MoE routing (MoE-TTS).
  - Primary open frontier: multi-factor simultaneous disentanglement (content + timbre + prosody + emotion) and cross-domain transfer (speech-singing, cross-lingual).
  - "Integration pass 6 (Interspeech 2025): Seven new disentanglement-focused papers — interpretable codec probing (interspeech-2025-0115), speaker-invariant DC-Spin (interspeech-2025-0246), DualCodec low-frame-rate (interspeech-2025-0468), expressive VC disentanglement (interspeech-2025-0815), zero-shot EVC with MI disentanglement (interspeech-2025-1101), FreeCodec fewer-token disentanglement (interspeech-2025-1440), training-free OT VC (interspeech-2025-2043). Codec-level disentanglement is confirmed as the dominant paradigm with MI minimisation and discrete unit approaches as key strategies."
  - Can speech-singing cross-domain embedding alignment (interspeech-2025-0816) generalise to other cross-modal conversion scenarios?
  - id: 2402.05755
    year: 2024
    task: [SCA, TTS]
    architecture: [autoregressive-LM]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - Expressive speech properties (sentiment, pitch, style) can be disentangled as discrete token streams supplementing phonetic tokens, enabling cross-modal sentiment preservation.
    evidence:
      - Spirit LM expressive tokens improve cross-modal sentiment accuracy by 15% over base token-only variant; pitch and style tokens are separable streams.
    limitations:
      - Adding expressive tokens causes moderate degradation in lexical and grammatical speech understanding metrics.

  - id: 2104.00355
    year: 2021
    task: [TTS, VC]
    architecture: [GAN, VAE]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Explicit factorization of speech into content (SSL units), F0, and speaker identity enables high-quality resynthesis and any-to-any VC without parallel data.
    evidence:
      - HuBERT+F0+d-vector resynthesis achieves naturalness competitive with original audio on VCTK; speaker swap demonstrates any-to-any VC without task-specific training.
    limitations:
      - Requires separate SSL encoder, F0 extractor, and speaker encoder; more complex than end-to-end codec disentanglement.

