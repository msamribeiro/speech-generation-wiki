papers:
  - id: 2507.22746
    year: 2025
    task: [TTS]
    architecture: [hybrid]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Hybrid chunk-wise AR + within-chunk bidirectional FM in a unified model is KV-cache compatible and achieves 2-NFE synthesis.
      - Combining AR temporal backbone with FM intra-chunk denoising bridges the latency and quality trade-offs of pure AR and pure NAR systems.
    evidence:
      - Dragon-FM achieves SPK-SIM 0.916 and WER 2.74 on internal podcast data; 2-step mean-flow denoising; KV-cache compatible streaming design at 12.5 Hz FSQ.
    limitations:
      - Evaluated on internal podcast data only; no standardized benchmark comparison.

  - id: 2508.04996
    year: 2025
    task: [VC]
    architecture: [flow-matching]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - DiT-based FM decoder with Shortcut Models reduces FM inference from 32 to 4 steps at marginal quality cost.
      - Random feature erasure during training provides noise-robust SSL/ASR fusion in voice conversion without information bottleneck machinery.
    evidence:
      - REF-VC achieves CER 8.03% vs. 12.45% for Seed-VC on noisy test set; Shortcut Models enable 4-step inference with competitive quality.
    limitations:
      - Evaluated on 10 unseen speakers from Seed-TTS-Eval; generalization to out-of-domain speakers untested.

  - id: 2508.07302
    year: 2025
    task: [TTS]
    architecture: [flow-matching]
    relevance: medium
    contribution_type: engineering-integration
    claims:
      - OT-CFM with 1.6:1 upsampling alignment bridges discrete codec tokens to mel-spectrograms for cross-lingual emotion transfer.
    evidence:
      - XEmoRAG achieves EMOS 4.65 vs. DelightfulTTS 3.89 on Thai using retrieval-based cross-lingual emotion prompting with FM alignment.
    limitations:
      - Thai-only evaluation; limited to 1K hours non-emotional + 60 hours emotional data.

  - id: 2508.08715
    year: 2025
    task: [TTS]
    architecture: [flow-matching]
    relevance: low
    contribution_type: engineering-integration
    claims:
      - Fine-tuning a pre-trained FM-based TTS for child-friendly speech preserves FM-based quality for low-resource language TTS.
    evidence:
      - MultiGen achieves MOS 3.97 on Singaporean-accented Mandarin via CosyVoice-300M FM fine-tuning.
    limitations:
      - Inherits CosyVoice-300M FM; no novel FM contribution.

  - id: 2508.14049
    year: 2025
    task: [TTS]
    architecture: [flow-matching]
    relevance: medium
    contribution_type: engineering-integration
    claims:
      - Matcha-TTS-inspired OT-CFM with flat alternating attention and RelativePositionBias is effective for long-context multilingual semantic-to-mel generation.
    evidence:
      - MahaTTS achieves competitive WER across 17 Indic languages with a conditional FM acoustic model as the second stage.
    limitations:
      - FM stage not independently ablated from text-to-semantic LM stage.

  - id: interspeech-2025-0203
    year: 2025
    task: [VC]
    architecture: [flow-matching]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - CFM decoder with OT conditioning for EVC produces richer prosodic variation than GAN-based baselines.
      - Gaussian-to-mel transport conditioned on PPGs and CLAP emotional embeddings achieves dual-mode (reference or NL prompt) emotion control.
    evidence:
      - ClapFM-EVC achieves MOS 4.09 vs. MixEmo 2.98; 57.4% listeners show no preference between reference speech and NL prompt modes.
    limitations:
      - Any-to-one evaluation only; any-to-any EVC with unseen target speakers not tested.

  - id: interspeech-2025-1344
    year: 2025
    task: [TTS]
    architecture: [flow-matching]
    relevance: medium
    contribution_type: engineering-integration
    claims:
      - Adapter-based PEFT (1.72% params) for FM TTS preserves zero-shot multilingual capability while full fine-tuning on single-speaker data destroys it.
      - Cross-lingual PEFT of FM TTS to a typologically distant language (Korean) is feasible with 12h single-speaker data.
    evidence:
      - PEFT-TTS on F5-TTS: CER 4.906, MOS 3.88; full fine-tune loses zero-shot (NMOS 2.24 vs. 3.06).
    limitations:
      - Korean only; multi-speaker WER substantially higher (21.6%) than large-scale systems.

  - id: interspeech-2025-2449
    year: 2025
    task: [TTS]
    architecture: [flow-matching]
    relevance: high
    contribution_type: engineering-integration
    claims:
      - Non-uniform ODE step pruning enables 4× FM TTS speedup (32→7 NFE) with near-negligible quality loss, exploiting near-linearity of late FM trajectory.
      - Training-free step scheduling generalises across FM TTS architectures without retraining.
    evidence:
      - Fast F5-TTS EPSS (7 NFE): RTF 0.030 vs. 0.123 (32 NFE); WER 1.74% vs. 1.70%; UTMOS 3.78 vs. 3.76 on Seed-TTS test-en.
    limitations:
      - Validated only on mel-spectrogram-based FM TTS; applicability to waveform-latent or token-based FM untested.

