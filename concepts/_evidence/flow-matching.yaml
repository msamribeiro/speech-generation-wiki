open_questions:
  - Why do image CFG improvements fail for FM TTS? Is it output modality or conditioning structure?
  - Can discrete FM (DiFlow-TTS) be accelerated to the 1-2 NFE range of continuous FM?
  - Does Dragon-FM's hybrid AR+FM design scale to standardized benchmarks like Seed-TTS-Eval?
  - Can REF-VC's 4-step Shortcut Models approach be generalized to TTS systems beyond VC?
  - Can EPSS-style non-uniform step pruning be combined with FM distillation to push below 5 NFE without retraining?
  - Does the PEFT-first cross-lingual adaptation finding (interspeech-2025-1344) extend to languages more phonologically distant than Korean from English/Chinese?

trend_notes:
  - 2025: FM acceleration via consistency (RapFlow-TTS), adversarial post-training (APTTS), Shortcut Models (REF-VC), and learned prior (OZSpeech) all demonstrated simultaneously — convergence on sub-5 NFE as practical target.
  - 2026: LongCat-AudioDiT shifted FM from mel-spectrogram to waveform VAE latent, revealing training-inference mismatch in all prior Voicebox/F5-TTS style training.
  - Dual-mode reference/text conditioning for FM emotional VC (ClapFM-EVC) is an emerging direction for instruction-conditioned voice conversion.
  - 2025 (Interspeech): Non-uniform ODE step pruning (EPSS, interspeech-2025-2449) validated as a training-free 4× speedup for F5-TTS; PEFT for cross-lingual continual adaptation (interspeech-2025-1344) confirms FM models adapt well with minimal parameters but require PEFT rather than full fine-tuning to preserve multi-language capability.
