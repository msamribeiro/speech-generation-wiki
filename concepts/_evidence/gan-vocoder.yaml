  - id: 2411.01156
    year: 2024
    task: [TTS]
    architecture: [GAN, autoregressive-LM]
    relevance: high
    contribution_type: engineering-integration
    claims:
      - VQGAN with MPD+MSD discriminators in an LLM-based TTS pipeline enables high-quality multilingual synthesis.
    evidence:
      - Fish-Speech VQGAN with dual discriminators achieves MOS 4.0+ across tested languages; GAN training objectives are production-stable at this scale.
    limitations:
