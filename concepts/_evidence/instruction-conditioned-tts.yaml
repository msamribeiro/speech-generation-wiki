concept: instruction-conditioned-tts
last_updated: 2026-06-13
paper_count: 30

papers:
  - id: 2504.12867
    year: 2025
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Freestyle natural language emotion prompting can control emotional expressiveness in AR codec LM TTS without a fixed taxonomy.
      - Parallel phoneme token prediction as a secondary LLM output head reduces intelligibility errors in LLM-based instruction-conditioned TTS.
    evidence:
      - EmoVoice achieves emotion recall 0.424 on EmoVoice-DB approaching GPT-4o-mini-tts (0.456); phoneme-boost parallel decoding head reduces WER.
    limitations:
      - Training circularity from GPT-4o-audio synthetic emotional data.

  - id: 2508.11326
    year: 2025
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Instruction-conditioned TTS systems trained on tag-derived datasets fail to generalise to figurative or metaphorical descriptions at inference.
      - Modality-based MoE routing with frozen text experts reduces catastrophic forgetting during speech fine-tuning.
    evidence:
      - MoE-TTS outperforms ElevenLabs and MiniMax on OOD figurative description alignment; modality routing preserves LLM text understanding.
    limitations:
      - 20–40 samples per condition; small-scale evaluation.

  - id: interspeech-2025-0203
    year: 2025
    task: [VC]
    architecture: [flow-matching]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - Natural language prompts can drive emotional VC at parity with reference speech when contrastive alignment bridges speech and text emotional representations.
    evidence:
      - ClapFM-EVC: 57.4% listeners show no preference between reference and NL prompt modes; MOS 4.09 vs. MixEmo 2.98.
    limitations:
      - Any-to-one EVC only; unseen target speaker generalization not tested.

