open_questions:
  - Can instruction-conditioned TTS generalise to instructions in languages other than the synthesis language?
  - How many hours of style-annotated data are needed for robust generalisation to novel description phrasings?
  - Does the MoE approach benefit persist across all LLM backbone sizes?
  - Does EmoVoice's freestyle emotion prompting generalise to languages and speaker styles beyond the GPT-4o-audio training distribution?

trend_notes:
  - 2026: Open-source instruction-conditioned TTS (Fish Audio S2, Qwen3-TTS) has surpassed frontier closed-source systems on expressive paralinguistic tasks.
  - Integration pass 5 adds: EmoVoice (freestyle emotion prompting with phoneme-boost head), MoE-TTS (OOD figurative description evaluation), ClapFM-EVC (dual-mode reference/NL prompt EVC).
  - The "thinking pattern" paradigm (Qwen3-TTS) represents a qualitative shift: LLM reasoning applied to style description interpretation before generation.
  - id: 2310.00704
    year: 2023
    task: [TTS, VC, singing]
    architecture: [autoregressive-LM, hybrid]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - Natural language task descriptions can condition a multi-task audio LM to perform different generation tasks without task-specific architectures.
    evidence:
      - UniAudio uses natural language task prompts for TTS, VC, and singing tasks; MOS competitive with task-specific systems on all three.
    limitations:
      - Task instruction conditioning is coarse (task-type level); fine-grained attribute control not demonstrated.

  - id: 2402.01912
    year: 2024
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Automatic acoustic labeling can substitute for human annotations in training large-scale instruction-conditioned speech LMs.
      - Including ~1% high-fidelity data with explicit quality labels enables professional-quality generation on demand.
    evidence:
      - NL Guidance TTS covers 30+ accent varieties and 5 speaking styles via automatic labels; DNSMOS 3.41 for quality-conditioned outputs.
    limitations:
      - Label vocabulary bounded by automatic classifier categories; novel instruction types at inference may fail.

  - id: 2501.06282
    year: 2025
    task: [TTS, SCA]
    architecture: [autoregressive-LM, flow-matching]
    relevance: medium
    contribution_type: engineering-integration
    claims:
      - End-to-end speech LMs can respond to natural language instructions for both speech generation and comprehension within a unified framework.
    evidence:
      - MinMo handles spoken instructions for TTS style, language, and emotion attributes; DNSMOS 3.89 on instruction-conditioned test set.
    limitations:
      - Instruction-following evaluation not systematically benchmarked against dedicated instruction-conditioned TTS systems.

  - id: 2502.11946
    year: 2025
    task: [TTS, SCA]
    architecture: [autoregressive-LM, flow-matching, hybrid]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Synthetic speech data generated by a large multi-modal model can substitute for manually curated data for instruction-conditioned TTS across emotions, dialects, and singing styles.
    evidence:
      - Step-Audio uses GPT-4-generated synthetic data for emotion and dialect TTS conditioning; covers 8 emotion categories and 5 dialect variants.
    limitations:
      - Synthetic data quality depends on GPT-4 generation capability; may not cover rare or culturally specific speaking styles.

