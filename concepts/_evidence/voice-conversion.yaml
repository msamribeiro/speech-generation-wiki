concept: voice-conversion
last_updated: 2026-06-05
paper_count: 18

papers:
  - id: 2508.00317
    year: 2025
    task: [evaluation]
    architecture: []
    relevance: medium
    contribution_type: evaluation-contribution
    claims:
      - No general-purpose VC quality predictor exists; VoiceMOS/AudioMOS Challenge confirms near-human-quality systems defeat all current SQA predictors.
    evidence:
      - VoiceMOS/AudioMOS Challenge series (four years) shows community infrastructure drives progress more than individual modelling; VC quality assessment remains an active unsolved track.
    limitations:
      - Retrospective analysis only; no new VC system proposed.

  - id: 2508.02849
    year: 2025
    task: [codec]
    architecture: [VAE]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Unsupervised frame-level cross-modal contrastive learning removes paralinguistic content from the semantic codec stream more effectively than SSL distillation, improving VC quality.
    evidence:
      - SecoustiCodec achieves cleaner semantic-paralinguistic separation than SSL distillation approaches; VC via reference speaker embedding at decoder.
    limitations:
      - Requires duration-aligned phoneme labels for contrastive training.

  - id: 2508.04996
    year: 2025
    task: [VC]
    architecture: [flow-matching]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - ASR bottleneck features and SSL features are complementary for VC; ASR provides noise-robust phonetic content while SSL adds paralinguistic expressiveness.
      - Random feature erasure during training mitigates SSL timbre leakage and noise sensitivity without information bottleneck machinery.
    evidence:
      - REF-VC achieves CER 8.03% vs. 12.45% for Seed-VC on noisy test; Shortcut Models reduce inference from 32 to 4 steps.
    limitations:
      - Evaluated on 10 unseen speakers only; limited diversity.

  - id: 2508.06890
    year: 2025
    task: [VC]
    architecture: [transformer-enc-dec]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Three independent reference inputs (content, speaker, emotion) with dedicated encoders provide finer-grained emotional VC than single-reference methods.
      - Frame-level temporal emotion alignment improves prosody transfer fidelity in emotional VC over utterance-level representations.
    evidence:
      - Maestro-EVC demonstrates TCEM frame-level emotion alignment; explicit F0+energy conditioning from reference; prosody augmentation for mismatch robustness on ESD corpus.
    limitations:
      - Evaluated only on ESD corpus (350 utterances, 10 speakers); spontaneous or cross-domain speech not tested.

  - id: 2508.08399
    year: 2025
    task: [VC]
    architecture: [VAE]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Fully discrete disentanglement of phonetic, prosodic, and speaker information in a neural codec enables VC via codebook-level operations without explicit VC training objective.
    evidence:
      - Discrete three-factor codec disentanglement from WavLM features achieves VC via speaker code swap; quantifies fidelity cost of speaker code discretization.
    limitations:
      - Quality evaluation on small held-out set; no comparison against leading zero-shot VC systems.

  - id: 2508.08961
    year: 2025
    task: [SCA, TTS, VC]
    architecture: [autoregressive-LM]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - Dual-token architecture enables VC as a downstream task competitive with dedicated VC systems at 4.5K hours training.
    evidence:
      - DualSpeechLM uses speaker embedding from 3D-Speaker to condition WavTokenizer acoustic generation for VC; competitive VC quality at 4.5K hours.
    limitations:
      - VC quality not benchmarked against SOTA dedicated VC systems.

  - id: interspeech-2025-0203
    year: 2025
    task: [VC]
    architecture: [flow-matching]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Natural language prompts can control emotional VC at parity with reference speech when contrastive alignment bridges speech and text emotional representations.
    evidence:
      - ClapFM-EVC achieves MOS 4.09 vs. MixEmo 2.98; 57.4% listeners show no preference between reference and NL prompt modes.
    limitations:
      - Any-to-one EVC; any-to-any with unseen speakers not tested.

