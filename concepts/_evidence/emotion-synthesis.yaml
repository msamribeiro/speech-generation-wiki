concept: emotion-synthesis
last_updated: 2026-06-12
paper_count: 38

papers:
  - id: 2504.12867
    year: 2025
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Freestyle natural language emotion prompting can control emotional expressiveness in AR codec LM TTS without a fixed taxonomy.
      - Automatic emotion similarity metrics correlate only ~40% with human MOS at the sentence level.
      - Multimodal LLMs are not yet reliable judges of emotional speech quality.
    evidence:
      - EmoVoice achieves emotion recall 0.424 on EmoVoice-DB approaching GPT-4o-mini-tts (0.456); sentence-level emotion similarity correlates ~40% with human MOS across 30 raters.
    limitations:
      - Trained and evaluated on GPT-4o-audio synthetic emotional data; circularity risk for naturalness claims.

  - id: 2507.20091
    year: 2025
    task: [TTS, SCA]
    architecture: [autoregressive-LM]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - Explicit word-level prosody tokens enable emotion recognition as emergent LM capability without task-specific fine-tuning.
      - Codec-token LM baselines show near-zero sensitivity to emotional cues.
    evidence:
      - ProsodyLM correctly identifies sadness and excitement categories through probability shifts without emotion-specific supervision; codec-token baselines near-zero emotion sensitivity.
    limitations:
      - Trained on audiobooks only; generalisability to spontaneous emotional speech unclear.

  - id: 2508.02013
    year: 2025
    task: [SCA]
    architecture: [autoregressive-LM]
    relevance: medium
    contribution_type: empirical-benchmark
    claims:
      - Emotion appropriateness in spoken role-playing lags naturalness and coherence in evaluation; cascaded systems outperform end-to-end models on emotion appropriateness.
    evidence:
      - SpeechRole benchmark shows EA dimension scores lag NA and SC; cascaded systems outperform E2E on EA; LLM-as-judge rank correlation with humans is ρ 0.67–0.98.
    limitations:
      - TTS-synthesised references rather than human recordings as benchmark; quality ceiling risk.

  - id: 2508.05385
    year: 2025
    task: [TTS]
    architecture: [transformer-enc-dec]
    relevance: low
    contribution_type: dataset-contribution
    claims:
      - Non-verbal vocalizations provide a complementary expressiveness layer to emotional TTS; automated annotation achieves high inter-annotator consistency.
    evidence:
      - NV pipeline provides bilingual EN/ZH corpus with 10 NV categories; automated annotation using wav2vec-bert 2.0 for detection.
    limitations:
      - NV synthesis not evaluated separately from detection; TTS integration not tested.

  - id: 2508.06890
    year: 2025
    task: [VC]
    architecture: [transformer-enc-dec]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Frame-level temporal emotion alignment in EVC using cross-attention improves prosody transfer fidelity over utterance-level emotion representations.
      - Explicit F0+energy conditioning from reference transfers temporal prosody dynamics more faithfully than implicit prediction.
    evidence:
      - Maestro-EVC demonstrates TCEM cross-attention with GRL on content classifier; prosody augmentation (shift + piecewise warp) for mismatch robustness on ESD corpus with 25 listeners.
    limitations:
      - Evaluated only on ESD corpus (350 utterances, 10 speakers); spontaneous speech not tested.

  - id: 2508.07302
    year: 2025
    task: [TTS]
    architecture: [flow-matching]
    relevance: medium
    contribution_type: engineering-integration
    claims:
      - Language-agnostic emotion embeddings (Emo2Vec) enable cross-lingual emotion transfer via retrieval without parallel bilingual emotional data.
    evidence:
      - XEmoRAG achieves EMOS 4.65 vs. DelightfulTTS 3.89 on Thai; retrieval from Chinese emotional data without bilingual parallel corpus.
    limitations:
      - Thai-only evaluation; culture-specific emotional expression conventions not tested.

  - id: 2508.08715
    year: 2025
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching]
    relevance: low
    contribution_type: engineering-integration
    claims:
      - LLM-based TTS systems fine-tuned with appropriate speaker conditioning substantially outperform conventional non-autoregressive models on emotion naturalness for low-resource languages.
    evidence:
      - MultiGen achieves MOS 4.05 on Tamil; emotional prosody primarily from foundation model fine-tuning rather than explicit emotion conditioning.
    limitations:
      - No explicit emotion evaluation; naturalness MOS used as proxy.

  - id: interspeech-2025-0203
    year: 2025
    task: [VC]
    architecture: [flow-matching]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Natural language prompts can control emotional VC at parity with reference speech via contrastive alignment of speech and text emotional representations.
      - Soft-label contrastive training with both categorical and prompt labels improves emotion embedding quality over single-source training.
    evidence:
      - ClapFM-EVC: 57.4% listeners show no preference between reference and NL prompt modes; MOS 4.09 vs. MixEmo 2.98; symKL soft-label contrastive training improves emotion embedding quality.
    limitations:
      - Any-to-one setting; unseen target speaker generalization not tested.

