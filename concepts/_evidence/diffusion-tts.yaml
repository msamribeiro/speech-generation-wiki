  - id: interspeech-2025-1066
    year: 2025
    task: [TTS]
    architecture: [diffusion]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - Score-based training objectives for EBMs can reduce TTS inference to a single MCMC step, bypassing many-iteration NCE-trained EBMs.
      - The delta loss criterion for EBMs is formally equivalent to the flow matching objective at t=0, suggesting structural connection between energy-based and flow-based TTS.
      - Automatic MOS predictors and subjective MOS can diverge for EBM-based TTS systems.
    evidence:
      - Delta loss EBM achieves 3.95 MOS at 1 inference step vs. Tacotron 2 at 3.74 on LJSpeech; UTMOSv2 and MOS diverge for delta loss model.
    limitations:
      - Single-speaker LJSpeech only; 3-listener MOS panel too small for strong conclusions.
      - Tacotron 2 backbone is dated by 2025 standards; generalisability to codec-based architectures untested.

  - id: interspeech-2025-1101
    year: 2025
    task: [VC]
    architecture: [diffusion]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Diffusion-based zero-shot EVC with MI disentanglement and expressive guidance achieves substantially higher emotion controllability than seen-speaker diffusion baselines (ECA 0.53 vs. 0.256).
      - Classifier-free-style guidance on emotion representations at inference time provides direct control over naturalness-emotion trade-off in diffusion-based EVC.
      - Training on in-the-wild emotional corpora enables zero-shot generalisation to speakers absent from training.
    evidence:
      - ZSDEVC on ESD: ECA 0.53 vs. EMOCONV-DIFF 0.256; naturalness lower (MOS 4.342 vs. 4.709) but EMOCONV-DIFF evaluated under seen-speaker setup.
    limitations:
      - Cross-system comparison mixes seen-speaker and zero-shot evaluation conditions.
      - Intensity control within a single emotion category not provided.

open_questions:
  - Can discrete masked diffusion be accelerated to the 1-2 NFE range of continuous flow matching?
  - Does training-inference mismatch correction in LongCat-AudioDiT apply to existing pre-trained models post-hoc?
  - Can the LSE+Vocos2D pipeline be accelerated via flow matching without losing spectrogram realism gains?
  - Does the UTMOS vs. human MOS divergence for EBM-based TTS (interspeech-2025-1066) extend to other non-standard synthesis paradigms?
  - Can diffusion-based EVC (ZSDEVC) match seen-speaker naturalness while maintaining zero-shot controllability?

trend_notes:
  - 2025: DiTAR patch-based continuous AR+diffusion established hybrid paradigm; DiSTAR extended to discrete token space.
  - 2026: LongCat-AudioDiT shifted the representation from mel-spectrogram to waveform VAE latent, achieving SOTA SIM for diffusion NAR.
  - The SIM gap between diffusion NAR and AR systems has largely closed as of 2026.
  - id: 2106.15561
    year: 2021
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching, diffusion, GAN, VAE, transformer-enc-dec]
    relevance: medium
    contribution_type: conceptual-contribution
    claims:
      - Diffusion-based vocoders achieve high perceptual quality but suffer from slow inference due to iterative reverse diffusion, motivating step-reduction methods.
    evidence:
      - Survey covers WaveGrad, DiffWave, and PriorGrad as diffusion vocoders; notes quality-speed trade-off as the primary open problem as of 2021.
    limitations:
      - Pre-dates the score-based EDM and DDIM approaches that substantially improved diffusion sampling efficiency post-2021.

  - id: 2305.07243
    year: 2023
    task: [TTS]
    architecture: [autoregressive-LM, diffusion, VAE]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Conditioning a diffusion decoder on continuous AR latents rather than discrete token outputs substantially improves quality in cascaded AR-diffusion TTS.
      - Applying image-generation scaling techniques (large-scale pretraining, multi-stage AR-diffusion) to speech synthesis yields high-expressiveness multi-speaker TTS.
    evidence:
      - Tortoise AR-conditioned diffusion achieves MUSHRA exceeding professional narrators; diffusion on continuous latents outperforms discrete token conditioning by ~5 MUSHRA points.
    limitations:
      - Very slow inference (minutes per utterance); no streaming; predates codec LM mainstream approach.

