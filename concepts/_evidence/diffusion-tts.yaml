papers:
  - id: 2207.12598
    year: 2022
    task: []
    architecture: [diffusion]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Diffusion models can trade sample fidelity for diversity at inference time by interpolating conditional and unconditional score estimates, without any externally trained classifier.
      - Jointly training a single model for both conditional and unconditional generation via random conditioning dropout recovers the full quality-diversity trade-off of classifier guidance.
      - Classifier-free guidance requires two score-function evaluations per sampling step; fair comparisons with single-pass baselines must account for this compute overhead.
      - The quality-diversity trade-off in conditional generative models is accessible to pure generative formulations without discriminative classifiers.
    evidence:
      - CFG at w=0.3 on ImageNet-128 achieves FID 2.43, outperforming ADM-G (2.97); IS reaches 421 at w=4, exceeding BigGAN (253).
      - p_uncond of 0.1–0.2 consistently outperforms 0.5 across guidance sweep; only a small unconditional fraction needed.
    limitations:
      - Experiments limited to class-conditional image generation; generalisation to speech/audio demonstrated in subsequent work, not in this paper.
      - Double forward-pass cost at inference is a structural overhead not resolved by this paper.
      - Guidance strength w has no principled selection criterion; requires per-task tuning.

  - id: 2508.01796
    year: 2025
    task: [singing]
    architecture: [diffusion]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - Inserting an explicit bandwidth extension step via a diffusion model prior to vocoding improves perceived audio quality in singing voice synthesis.
      - 2D-convolution DiT-based vocoder redesigned to handle higher-resolution intermediate spectrograms is necessary for the bandwidth extension gains to transfer to audio output.
    evidence:
      - LSE+Vocos2D pipeline improves singing MOS from 3.576 to 4.176 over the Vocos baseline; explicit spectrogram super-resolution via 32-step diffusion is the key step.
    limitations:
      - 32-step diffusion is slow; no flow-matching or consistency distillation acceleration provided.
      - Evaluated only on singing voice synthesis, not conversational TTS.

