open_questions:
  - Can natural language prosody control generalise to fine-grained instructions beyond standard attributes (pitch, speed, volume, emotion, gender)?
  - Does explicit word-level prosody tokenisation (ProsodyLM) generalise to conversational or spontaneous speech?
  - Is acoustic pitch the most difficult attribute to independently control under multi-factor conditioning?
  - What is the minimal phonological expertise burden for LoRA pitch accent correction to be practical for end users?

trend_notes:
  - 2025: ProsodyLM demonstrates that prosody emergence requires tokenisation design rather than data scale — a conceptually novel finding that reframes the prosody control problem.
  - Integration pass 5 adds: UtterTune (LoRA-based pitch accent correction for Japanese), Maestro-EVC (frame-level temporal emotion/prosody alignment), REF-VC (multi-scale pitch encoder for source prosody preservation), NV pipeline (temporal-semantic alignment for NV positioning).
  - The SpeechRole benchmark confirms prosodic consistency is the hardest evaluation dimension for spoken role-playing agents.
