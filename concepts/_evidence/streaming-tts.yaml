    supporting_papers: [2025.emnlp-main.989, 2507.14534]
    contradicting_papers: []

  - claim: Chunk-wise AR + within-chunk FM denoising is KV-cache compatible and enables 2 NFE streaming synthesis.
    status: emerging
    supporting_papers: [2507.22746]
    contradicting_papers: []

  - claim: Whether 37 ms latency is perceptually transparent in real-time communication is not established.
    status: contested
