concept: streaming-tts
last_updated: 2026-06-02
paper_count: 19

papers:
  - id: 2507.22746
    year: 2025
    task: [TTS]
    architecture: [hybrid]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Chunk-wise AR generation combined with within-chunk bidirectional FM denoising is KV-cache compatible and enables streaming at 2 NFE per chunk.
    evidence:
      - Dragon-FM: causal FSQ codec decoder at 12.5 Hz; chunk-AR generation with KV-cache; within-chunk FM at 2 NFE; SPK-SIM 0.916 and WER 2.74 on internal podcast data.
    limitations:
      - Internal podcast evaluation only; no standardized benchmark comparison.

  - id: 2508.02849
    year: 2025
    task: [codec]
    architecture: [VAE]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - Fully causal single-codebook streaming codec with 12.08 ms initial latency is achievable with VAE+FSQ quantisation and frame-level contrastive learning.
    evidence:
      - SecoustiCodec: 12.08 ms initial latency; encoder RTF 0.002; 20 tokens/s; designed for voice-dialogue downstream tasks.
    limitations:
      - Downstream streaming TTS pipeline integration not demonstrated end-to-end.

  - id: 2508.05207
    year: 2025
    task: [codec]
    architecture: [GAN]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - 2D time-frequency domain codec architecture achieves 80 ms architectural latency for stereo audio with 1-embedding look-ahead in decoder.
    evidence:
      - SpectroStream: 80 ms architectural latency; real-time CPU inference; causal 2D-TF codec for 48 kHz stereo.
    limitations:
      - Music/general audio focus; speech-specific streaming TTS quality not evaluated.

claim_clusters:
  - claim: Streaming zero-shot VC can match or exceed offline quality in speaker similarity.
    status: strongly_supported
    supporting_papers: [2507.14534]
    contradicting_papers: []

