  - id: 2402.05755
    year: 2024
    task: [SCA, TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - HuBERT units as speech tokens for LLM pretraining enable cross-modal transfer of few-shot learning from text to speech.
      - Word-level interleaving of HuBERT speech tokens and text tokens is more effective than sentence-level interleaving for cross-modal semantic understanding.
    evidence:
      - Spirit LM uses HuBERT 500-unit tokens; few-shot spoken category score 0.724 with word-level vs. 0.672 with sentence-level interleaving.
    limitations:
      - HuBERT compression limits reconstruction fidelity; speech output quality substantially below dedicated TTS.

