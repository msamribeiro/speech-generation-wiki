open_questions:
  - Can SSL models be explicitly trained to suppress paralinguistic variability in speech tokens (2412.17048) while retaining phonetic content?
  - Is there a sweet spot between ASR-supervised (semantically concentrated) and SSL features (acoustically rich) for low-frame-rate codec design?
  - As supervised foundation models increasingly replace SSL in codec design, will the SSL vs. supervised distinction collapse?
  - Does XLS-R-based multilingual SSL generalise better as semantic targets across low-resource languages than English-centric SSL models?

trend_notes:
  - The field has shifted from "which SSL model?" toward "SSL vs. supervised foundation model?" as the core design question for codec and SLM architectures.
  - 2025: SecoustiCodec proposes eliminating SSL distillation in favour of frame-level contrastive learning; DualSpeechLM trains a tokenizer against LLM objectives — departing from both SSL distillation and ASR supervision.
  - SSL retains strong practical value for VC content extraction and low-resource multilingual TTS (MahaTTS-v2 with XLS-R).
  - Integration pass 6 (Interspeech 2025): Nine new SSL applications — codec interpretability probing (interspeech-2025-0115), speaker-invariant DC-Spin tokeniser (interspeech-2025-0246), DualCodec SSL-guided low-frame-rate (interspeech-2025-0468), expressive VC with mHuBERT-147 discrete units (interspeech-2025-0815), speech-prompted singing VC (interspeech-2025-0816), FreeCodec SSL-based content stream (interspeech-2025-1440), cross-lingual PEFT TTS (interspeech-2025-1344), ZSDEVC Wav2Vec2 emotion encoder (interspeech-2025-1101), training-free OT VC (interspeech-2025-2043). SSL-based discrete unit extraction remains the dominant content representation choice for VC systems in this batch.
  - id: 2305.02765
    year: 2023
    task: [codec]
    architecture: [GAN, VAE]
    relevance: medium
    contribution_type: engineering-integration
