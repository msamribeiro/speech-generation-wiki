  - id: 2305.09636
    year: 2023
    task: [TTS, SCA]
    architecture: [autoregressive-LM]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - SSL-derived semantic tokens from AudioLM serve as the conditioning layer in SoundStorm's two-stage pipeline, demonstrating that SSL representations enable high-quality acoustic generation.
