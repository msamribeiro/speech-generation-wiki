  - id: 2508.06890
    year: 2025
    task: [VC]
    architecture: [transformer-enc-dec]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - HuBERT-base K-means clusters provide strong content-speaker disentanglement for emotional VC because K-means clustering naturally suppresses speaker-specific variation.
    evidence:
      - Maestro-EVC uses HuBERT-base K-means (500 clusters) for phonetic content extraction with GRL to suppress residual emotional leakage into content tokens.
    limitations:
      - Standard use of HuBERT; no novel SSL contribution beyond applying it as content encoder.

  - id: 2508.08399
    year: 2025
    task: [VC]
    architecture: [VAE]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - WavLM-Large (6th layer) as frozen encoder with k-means VQ provides speaker-independent phonetic content; instance normalization separates time-invariant speaker statistics from time-variant prosody.
    evidence:
      - WavLM residual after instance normalization separates speaker statistics from prosody; GRVQ quantises speaker component; discrete speaker codes introduce a measurable speaker fidelity trade-off.
    limitations:
      - Ablation on small held-out set; not compared to leading disentanglement systems.

  - id: 2508.08961
    year: 2025
    task: [SCA, TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
