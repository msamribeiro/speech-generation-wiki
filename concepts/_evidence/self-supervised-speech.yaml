    architecture: [transformer-enc-dec, VAE]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Perceptual losses derived from SSL speech models (WavLM-Large features) are critical for achieving intelligible reconstruction at low bitrates beyond what adversarial and spectral losses provide.
    evidence:
