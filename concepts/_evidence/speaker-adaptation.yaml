  - id: 2406.18009
    year: 2024
    task: [TTS]
    architecture: [flow-matching]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - Implicit speaker adaptation via reference conditioning in flow-matching TTS achieves speaker similarity without explicit speaker encoding.
      - Unsupervised pretraining on unlabeled speech improves speaker similarity in zero-shot adaptation.
    evidence:
      - E2 TTS SIM 0.71 on SeedTTS test-en with fully implicit conditioning; pretraining adds +0.03 SIM in ablation.
    limitations:
      - Implicit conditioning may underperform explicit speaker encoders for very distinctive voices.

