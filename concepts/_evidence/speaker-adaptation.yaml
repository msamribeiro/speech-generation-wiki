  - id: interspeech-2025-1344
    year: 2025
    task: [TTS]
    architecture: [flow-matching]
    relevance: high
    contribution_type: engineering-integration
    claims:
      - Adapter-based PEFT preserves zero-shot TTS capability in multilingual models more reliably than full parameter fine-tuning on single-speaker low-resource data.
      - Cross-lingual adaptation of TTS models is feasible with fewer than 15 hours of single-speaker data when a multilingual pre-trained foundation is available.
      - In flow-matching TTS fine-tuning, the text conditioning module requires more parameters to adapt to a typologically distant language than the acoustic generation module.
      - Low-rank adaptation in DiT-based TTS shows a rank-dependent trade-off between linguistic accuracy and speaker generalisation.
    evidence:
      - PEFT-TTS (1.72% params) achieves CER 4.906/WER 12.625 vs. full fine-tune CER 5.671; full fine-tune loses zero-shot capability (NMOS 2.24 vs. 3.06 for PEFT).
    limitations:
      - Multi-speaker WER substantially higher (21.6%) than large-scale CosyVoice 2 (10.9%); hallucination artefacts remain.
      - Korean-only adaptation; generalisation to other low-resource non-Latin-script languages untested.

open_questions:
  - At what data scale does full fine-tuning outperform parameter-efficient adaptation (LoRA, adapters) for TTS?
  - Can LoRA-based pitch accent correction generalise to other tonally complex languages beyond Japanese?
  - What is the minimum data floor for reliable domain adaptation to a new speaker type?
  - Does kNN-VC timbre augmentation reliably improve perceived accent quality, or only automatic metrics?
  - Do the optimal adapter hyperparameters (compression factor, LoRA rank) transfer across language pairs of varying phonological distance from the pre-training distribution?

trend_notes:
  - Integration pass 5 confirms that parameter-efficient adaptation (LoRA, fine-tuning) is increasingly the practical default, with adaptation scope ranging from pronunciation-specific (UtterTune) to full domain transfer (MultiGen).
  - Two-stage semantic-acoustic decoupling (MahaTTS) establishes 200 hours as a practical threshold for new language addition without acoustic model retraining.
  - The gap between zero-shot and adapted quality is narrowing in high-resource settings; adaptation remains essential for specialized populations and low-resource languages.
  - Integration pass 6: interspeech-2025-1344 confirms PEFT-first is not just computationally efficient but functionally necessary for cross-lingual continual adaptation — full fine-tuning causes catastrophic forgetting of prior languages even with small (12h) adaptation datasets.
  - id: 1609.03499
    year: 2016
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - Multi-speaker conditioning via speaker embeddings in an AR model enables shared internal structure across speakers, improving per-speaker quality relative to single-speaker training.
    evidence:
      - WaveNet multi-speaker model with 109-speaker embedding conditioning achieves MOS improvements over training per-speaker models on less data; establishes multi-speaker AR as viable.
    limitations:
      - Speaker embeddings learned jointly with the model; zero-shot generalisation to unseen speakers not demonstrated.

  - id: 2305.07243
    year: 2023
    task: [TTS]
    architecture: [autoregressive-LM, diffusion, VAE]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Contrastive speaker conditioning using a text-speech CLVP discriminator enables robust zero-shot speaker adaptation at inference.
    evidence:
      - Tortoise uses CLVP-based speaker conditioning; achieves MOS exceeding professional narrators across diverse target speakers including distinctive voices.
    limitations:
      - Very slow inference; CLVP training requires large parallel speech-text corpus.

  - id: 2406.04904
    year: 2024
    task: [TTS]
    architecture: [autoregressive-LM, GAN]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Perceiver Resampler speaker encoding handles variable-length reference audio and improves speaker adaptation robustness across 16+ languages.
      - ~10 minutes of fine-tuning data substantially improves speaker similarity even for extreme prosody styles.
    evidence:
      - XTTS Perceiver Resampler +0.18 SMOS over single-embedding; 10-min fine-tuned SMOS 4.31 vs. zero-shot 3.82.
    limitations:
