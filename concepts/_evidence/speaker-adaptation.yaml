open_questions:
  - At what data scale does full fine-tuning outperform parameter-efficient adaptation (LoRA, adapters) for TTS?
  - Can LoRA-based pitch accent correction generalise to other tonally complex languages beyond Japanese?
  - What is the minimum data floor for reliable domain adaptation to a new speaker type?
  - Does kNN-VC timbre augmentation reliably improve perceived accent quality, or only automatic metrics?

trend_notes:
  - Integration pass 5 confirms that parameter-efficient adaptation (LoRA, fine-tuning) is increasingly the practical default, with adaptation scope ranging from pronunciation-specific (UtterTune) to full domain transfer (MultiGen).
  - Two-stage semantic-acoustic decoupling (MahaTTS) establishes 200 hours as a practical threshold for new language addition without acoustic model retraining.
  - The gap between zero-shot and adapted quality is narrowing in high-resource settings; adaptation remains essential for specialized populations and low-resource languages.
