  - id: 2508.07426
    year: 2025
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: medium
    contribution_type: empirical-benchmark
    claims:
      - Voice conversion-based timbre augmentation (kNN-VC) for low-resource accent data improves objective accent similarity but shows unclear benefit in human perceptual evaluation.
    evidence:
      - Scalable Controllable Accented TTS: kNN-VC augmentation improves objective accent similarity; human evaluation benefit is unclear; geolocation-based filtering outperforms raw labels.
    limitations:
      - Human perceptual evaluation of accent quality shows mixed results for kNN-VC augmentation.

  - id: 2508.08399
    year: 2025
    task: [VC]
    architecture: [VAE]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - Fully-discrete speaker adaptation via speaker code swap in codec-level VC quantifies the trade-off between speaker code discretization and speaker fidelity.
    evidence:
      - Discrete speaker codes introduce a measurable speaker identity fidelity cost; quantified via SPK-SIM vs. codebook size ablation.
    limitations:
      - Evaluated on small held-out set; not benchmarked against leading speaker adaptation systems.

  - id: 2508.08715
    year: 2025
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching]
    relevance: high
    contribution_type: engineering-integration
    claims:
      - Foundation TTS models adapted to child-friendly speech with x-vector conditioning substantially outperform conventional models on low-resource Southeast Asian languages from as few as 1,400 utterances.
    evidence:
      - MultiGen achieves MOS 4.05 on Tamil and 3.97 on Singaporean-accented Mandarin; effective from 1,400 utterances for CosyVoice-300M fine-tuning.
    limitations:
      - Small-scale evaluation (10 listeners, 30 samples); no comparison to dedicated low-resource systems.

