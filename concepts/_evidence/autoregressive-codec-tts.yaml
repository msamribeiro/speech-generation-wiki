papers:
  - id: 2504.12867
    year: 2025
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Parallel phoneme prediction as a secondary LLM output head reduces intelligibility errors in LLM-based TTS.
      - Freestyle natural language emotion prompting can control expressiveness in AR codec LM TTS without a fixed taxonomy.
      - Automatic emotion similarity metrics correlate only ~40% with human MOS at the sentence level.
    evidence:
      - EmoVoice's parallel phoneme-boost head reduces WER relative to the Qwen2.5 AR baseline; emotion recall 0.424 on EmoVoice-DB approaching GPT-4o-mini-tts (0.456).
    limitations:
      - Trained and evaluated on GPT-4o-audio synthetic emotional data, introducing circularity in emotional naturalness claims.
      - Evaluated only on English with in-distribution emotional descriptions.

  - id: 2507.20091
    year: 2025
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Replacing codec tokens with explicit prosody-text dual tokens enables prosody emergence in AR LMs without data scale.
      - Conventional codec-token AR LMs show near-zero sensitivity to prosody cues as emergent capabilities.
    evidence:
      - ProsodyLM achieves contrastive focus accuracy 82%, emotion recognition across sadness and excitement categories, and style continuity without task-specific fine-tuning; codec-token baseline shows near-zero emotion sensitivity.
    limitations:
      - Trained on audiobooks only; generalisability to conversational speech is untested.
      - Audio quality fidelity is lower than codec-based AR LMs due to prosody-token compression.

  - id: 2507.22746
    year: 2025
    task: [TTS]
    architecture: [hybrid]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Chunk-wise AR combined with within-chunk bidirectional flow-matching denoising is KV-cache compatible and enables streaming operation.
      - Hybrid AR+FM with FSQ codec at 12.5 Hz achieves competitive zero-shot quality and streaming-friendly design.
    evidence:
      - Dragon-FM achieves SPK-SIM 0.916 and WER 2.74 on internal podcast data; KV-cache compatible chunk-AR backbone with mean-flow 2-NFE within-block denoising.
    limitations:
      - Evaluated on internal podcast data only; no standardized benchmark comparison against Seed-TTS-Eval.
      - Custom FSQ codec at 12.5 Hz not independently benchmarked.

  - id: 2508.04585
    year: 2025
    task: [SCA]
    architecture: [autoregressive-LM]
    relevance: medium
    contribution_type: engineering-integration
    claims:
      - Joint AR prediction of interleaved speech and visual tokens from a multimodal dialogue context is feasible at matching token rates.
    evidence:
      - UniTalker achieves SIM_SPK 0.702 on IEMOCAP unseen speakers with Qwen2.5-0.5B backbone predicting speech and facial landmark tokens.
    limitations:
      - Evaluated only on acted emotional speech (IEMOCAP); spontaneous speech not tested.

  - id: 2508.08715
    year: 2025
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching]
    relevance: medium
    contribution_type: engineering-integration
    claims:
      - Foundation TTS models adapted to child-friendly speech with x-vector conditioning substantially outperform conventional models on low-resource Southeast Asian languages from as few as 1,400 utterances.
    evidence:
      - MultiGen achieves MOS 4.05 on Tamil and 3.97 on Singaporean-accented Mandarin via CosyVoice-300M fine-tuning with x-vector speaker conditioning.
    limitations:
      - Small-scale evaluation (10 listeners, 30 samples per language) limits statistical reliability.

  - id: 2508.08961
    year: 2025
    task: [TTS, SCA]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Separating the token used for LLM input from the token used for generation output resolves the understanding-generation tension in unified speech LLMs.
      - Understanding-driven tokenizer trained against LLM objectives reduces modality gap at low data scales.
    evidence:
      - DualSpeechLM achieves competitive performance at 4.5K hours on ASR, S2TT, SER, TTS, and VC tasks; understanding-driven USTokenizer reduces modality gap.
    limitations:
      - Evaluated only at 4.5K hours; advantage over shared-token systems may diminish at larger data scales.

  - id: 2508.09767
    year: 2025
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: medium
    contribution_type: engineering-integration
    claims:
      - LoRA-based fine-tuning with phoneme-tag tokens can restore pitch accent correction to BPE-input AR TTS at less than 0.5% of model parameters.
    evidence:
      - UtterTune raises accent correctness from 0.498 to 0.899 on Japanese with rank-16 LoRA on CosyVoice2; <0.5% trainable parameters.
    limitations:
      - Requires user-supplied phoneme transcription; not applicable without explicit G2P preprocessing.

  - id: 2508.11326
    year: 2025
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Modality-based MoE routing with frozen text experts preserves LLM text understanding during speech fine-tuning.
      - Instruction-conditioned TTS systems trained on tag-derived datasets fail to generalise to figurative descriptions at inference.
    evidence:
      - MoE-TTS outperforms ElevenLabs and MiniMax on out-of-domain figurative description alignment; modality routing prevents catastrophic forgetting.
    limitations:
      - Evaluated on only 20–40 samples per condition; small scale limits reliability.

  - id: 2508.14049
    year: 2025
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching]
    relevance: high
    contribution_type: engineering-integration
    claims:
      - Two-stage semantic-acoustic decoupling allows new language addition to a multilingual system at approximately 200 hours of target language data.
      - Intelligibility in low-resource languages remains markedly worse than high-resource languages within the same multilingual system.
    evidence:
      - MahaTTS achieves competitive WER across 17 Indic languages from 20K hours open-source data with Gemma-based LM and Matcha-TTS acoustic model.
    limitations:
      - English dominates (58%) the training data; cross-lingual transfer vs. data dominance not disentangled.

