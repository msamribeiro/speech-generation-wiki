  - id: interspeech-2025-1641
    year: 2025
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Explicit phoneme position supervision during AR codec training eliminates alignment errors (skipping, repetition, one-to-many) more effectively than identity prediction or monotonic decoding.
      - Alignment failures in codec LM TTS are a training-objective problem, not an inference-time problem.
      - Jointly predicting phoneme identity and position introduces conflicting signals that degrade pronunciation accuracy compared to position-only prediction.
    evidence:
      - 52.7% relative CER reduction (6.69%→3.16%) over VALL-E on Seed-TTS test-zh; 67.2% reduction on hard 400-case subset; zero alignment errors in any error category on hard set.
    limitations:
      - Mandarin only; requires phoneme duration annotations at training time.
      - 15-listener subjective panel; model size not reported.

  - id: interspeech-2025-2447
    year: 2025
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Speculative decoding for AR TTS achieves 1.4× inference speedup without measurable subjective quality degradation.
      - Speech token sequences exhibit many-to-one perceptual mappings, enabling relaxed acceptance criteria beyond strict distributional matching.
    evidence:
      - SSD on CosyVoice 2: RTF 0.36 vs. 0.504; MOS 3.925 vs. 3.930; WER rises 3.67%→5.70% (attributed to draft data scale mismatch).
    limitations:
      - WER increase unresolved; evaluated on single English model.

open_questions:
  - At what AR frame rate does performance degrade irreversibly for a given codec design?
  - Is the Factor C problem addressable within the AR+NAR framework, or does it require fundamentally different architectures?
  - Does the dual-token advantage in DualSpeechLM persist at 100K+ hour scale?
  - Can MTP improve speaker similarity as well as intelligibility in AR speech LMs?
  - Does modality-based MoE routing benefit all LLM backbone sizes equally?
  - Would scaling the SSD draft model to match the target corpus close the WER gap?
  - Does explicit position supervision in codec LM TTS generalise to languages without reliable forced-alignment annotations?

trend_notes:
  - AR TTS has bifurcated by 2026 into two tracks: scaling AR LMs with better tokenizers/RL alignment, and challenging whether AR decoding is necessary at all.
  - Dual-AR (slow semantic + fast acoustic) is emerging as the dominant industrial architecture in 2026.
  - Hybrid AR+FM (CosyVoice 2, Dragon-FM) is now the standard for production streaming systems.
  - "2025 (Interspeech): Two robustness/efficiency advances: phoneme position prediction (interspeech-2025-1641) eliminates AR alignment errors on hard Mandarin cases; speculative decoding (interspeech-2025-2447) achieves 1.4x AR speedup without modifying the target model."
  - "Integration pass 9 (2026-06-12): 12 historical papers added including foundational (SpeechGPT 2305.11000, SpeechTokenizer 2308.16692), influential (NaturalSpeech 2 2304.09116, MaskGCT 2409.00750, VALL-E 2 2406.05370, FunAudioLLM 2407.04051), and scaling (Llasa 2502.04128, Spark-TTS 2503.01710, CosyVoice 3 2505.17589) systems. Key new evidence: MaskGCT demonstrates NAR masked generative models outperform AR on hard-text robustness (2409.00750); Llasa demonstrates inference-time scaling via speech understanding verifiers (2502.04128); CosyVoice 3 introduces differentiable reward optimization over discrete tokens (2505.17589)."
  - "Integration pass 10 (2026-06-13): 22 historical/foundational papers added including the full pre-codec era (WaveNet 1609.03499, Tacotron 1703.10135, Tacotron 2 1712.05884) and the codec-era transition (SoundStorm 2305.09636, VALL-E X 2303.03926, AudioPaLM 2306.12925, Tortoise 2305.07243, BASE TTS 2402.08093, VoiceCraft 2403.16973, Spirit LM 2402.05755, UniAudio 2310.00704, Step-Audio 2502.11946, Baichuan-Audio 2502.17239, Step-Audio 2 2507.16632). Key new evidence: The pre-codec era shows the historical necessity of AR bottlenecks that the codec-LM paradigm later resolved; Spirit LM demonstrates cascade baselines still dominate unified models at equivalent scale (2402.05755); BASE TTS confirms scaling AR codec LMs to 500M+ parameters and 10K+ hours produces qualitatively different prosody on complex inputs (2402.08093)."

papers:
  - id: 2308.16692
    year: 2023
    task: [TTS, codec]
    architecture: [GAN, VAE]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Separating semantic content from acoustic detail across RVQ layers improves downstream AR TTS coherence compared to undifferentiated acoustic tokenisation.
    evidence:
      - SpeechTokenizer downstream VALL-E uses RVQ-1 semantic tokens for AR stage; improved WER vs. EnCodec baseline in GSLM metrics.
    limitations:
      - Downstream evaluation uses limited AR TTS baselines; benefit vs. fully supervised alternatives unclear.

  - id: 2305.11000
    year: 2023
    task: [SCA, TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Expanding an LLM's token vocabulary with discretised speech units enables a single model to perform speech comprehension and generation without a cascade pipeline.
      - A multi-stage training curriculum separating modality adaptation, cross-modal instruction tuning, and chain-of-modality alignment is necessary for reliable cross-modal instruction-following.
      - The chain-of-modality pattern (text intermediate before speech response) is a practical mechanism for transferring LLM reasoning to speech output.
    evidence:
      - SpeechGPT achieves instruction-following on spoken commands with chain-of-modality; subjective evaluation shows reasonable speech naturalness for a first-generation SLM.
    limitations:
      - Uses HuBERT k-means tokens with low reconstruction quality; speech generation naturalness substantially below dedicated TTS systems.

  - id: 2406.05370
    year: 2024
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Grouped codec code prediction reduces effective AR sequence length and simultaneously improves long-context modelling quality.
      - Adaptive sampling that detects and breaks token repetition loops stabilises AR codec LM decoding without forced-alignment data.
      - Autoregressive codec TTS can match or exceed ground-truth speech on robustness and speaker similarity at standard English audiobook benchmarks.
    evidence:
      - VALL-E 2 achieves human parity on LibriSpeech (WER 2.2%, SIM-O 0.648) and VCTK (WER 2.2%, SIM-O 0.595); repetition-aware sampling eliminates loop failures.
    limitations:
      - Evaluated only on clean English audiobook data; no multilingual or noisy condition evaluation; proprietary model.

  - id: 2409.00750
    year: 2024
    task: [TTS, VC]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Non-autoregressive masked generative transformers can achieve human-level speaker similarity in zero-shot TTS without explicit text-speech alignment.
      - Masked generative TTS substantially outperforms autoregressive TTS on hard-text robustness (tongue twisters, repeating phrases).
    evidence:
      - MaskGCT achieves SIM-O 0.789 and UTMOS 4.32 on SeedTTS test-en; 0.13% failure rate on hard-text vs. ~5% for AR baselines.
    limitations:
      - VQ-VAE codec evaluation limited; no streaming variant; multilingual results include only 6 languages.

  - id: 2502.04128
    year: 2025
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Both model scale and training data volume independently improve TTS quality, consistent with scaling laws in text LLMs.
      - Inference-time compute scaling via speech understanding verifiers substantially improves TTS quality over single-sample decoding.
    evidence:
      - Llasa-8B achieves WER 1.48% on SeedTTS test-en; Best-of-8 with verifier achieves WER 0.74% vs. 1.94% greedy on same model; scaling from 1B to 8B reduces WER monotonically.
    limitations:
      - Verifier training cost not reported; evaluated on English only; XCodec single-codebook may limit acoustic quality vs. multi-codebook systems.

  - id: 2503.01710
    year: 2025
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Disentangling speech tokens into linguistic content and global speaker attributes within a single-stream codec enables small LLM (0.5B) to perform competitive zero-shot TTS.
      - Single-stage AR TTS consistently trails multi-stage or NAR methods on speaker similarity even when intelligibility is comparable.
    evidence:
      - Spark-TTS achieves WER 3.0% on SeedTTS test-en with Qwen2.5-0.5B; SIM-O lags CosyVoice2 by ~0.05 due to single-stage AR limitations.
    limitations:
      - Single-stage AR limitations acknowledged; evaluation limited to English and Mandarin.

  - id: 2407.04051
    year: 2024
    task: [TTS]
    architecture: [hybrid]
    relevance: high
    contribution_type: engineering-integration
    claims:
      - Supervised speech tokenizers from ASR encoders provide stronger semantic alignment than unsupervised codec tokens.
      - Cross-lingual zero-shot voice cloning requires omitting source-language prompt tokens at inference to prevent prosody leakage.
    evidence:
      - CosyVoice achieves WER 3.0% on SeedTTS test-en with supervised S3 tokenizer vs. higher WER for unsupervised alternatives; cross-lingual cloning validated across 5 languages.
    limitations:
      - Requires high-resource ASR model (SenseVoice-Large); Chinese-centric training data dominates.

  - id: 2505.17589
    year: 2025
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Differentiable reward optimization over discrete speech tokens enables scalable post-training for LLM-based TTS without generating full audio sequences.
      - Multi-task supervised tokenizer training captures richer paralinguistic content than ASR-only training, with measurable downstream gains.
    evidence:
      - CosyVoice 3 achieves best or near-best WER, SIM, and emotion accuracy on SeedTTS test-en and test-zh; differentiable reward optimization reduces training cost vs. audio-generation-based reward.
    limitations:
      - Differentiable reward approach requires token sequences to be differentiably connected to quality signals; generalisation to non-differentiable rewards unclear.

  - id: 2409.03283
    year: 2024
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching, hybrid]
    relevance: medium
    contribution_type: engineering-integration
    claims:
      - Few-shot fine-tuning of a large foundation TTS model substantially outperforms zero-shot in-context learning for highly expressive or distinctive target voices.
      - Prompt audio enhancement improves voice cloning quality for noisy prompts but can slightly degrade performance on clean prompts.
    evidence:
      - FireRedTTS few-shot (1 hour data) achieves SIM-O 0.742 vs. 0.685 zero-shot on expressive voice evaluation; noisy prompt enhancement +0.03 SIM-O on noisy test set.
    limitations:
      - Few-shot evaluation uses only a small set of distinctive voices; benefit may shrink for average speakers.

  - id: 2411.00774
    year: 2024
    task: [SCA]
    architecture: [autoregressive-LM, hybrid]
    relevance: medium
    contribution_type: engineering-integration
    claims:
      - Freezing the LLM backbone during speech-modality alignment reduces the intelligence gap between spoken and text Q&A performance compared to fine-tuned approaches.
    evidence:
      - Freeze-Omni achieves spoken dialogue IQ test performance within 5% of base LLM on text; fine-tuned baselines degrade 10-20%.
    limitations:
      - Evaluated on limited proprietary benchmarks; codec TTS quality not independently evaluated.

  - id: 2408.16725
    year: 2024
    task: [SCA, TTS]
    architecture: [autoregressive-LM]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - Simultaneous text and audio generation conditioned on parallel text tokens enables streaming speech output without sequential text-then-audio decode latency.
      - Audio reasoning quality lags text reasoning quality in end-to-end speech LMs, and batch inference can partially bridge this gap.
    evidence:
      - Mini-Omni achieves 1.3s response latency vs. 3.5s for cascade baseline; audio reasoning accuracy ~80% of text reasoning on same questions.
    limitations:
      - Small model (0.5B); evaluated on limited question types; no systematic evaluation on standard TTS benchmarks.

  - id: 1609.03499
    year: 2016
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Direct generation of raw audio waveforms, without intermediate vocoder parameters, produces substantially higher naturalness than parametric or concatenative synthesis pipelines.
      - Dilated causal convolutions enable autoregressive audio models to achieve receptive fields orders of magnitude larger than standard causal convolutions at comparable computational cost.
      - Autoregressive raw-waveform generation creates a fundamental speed-quality trade-off that constrains deployment in real-time applications.
    evidence:
      - WaveNet achieves MOS 4.21 vs 3.86 for HMM concatenative synthesis on English TTS; sample-by-sample generation requires 1 second to generate 0.02 seconds of audio on the hardware of the era.
    limitations:
      - Sequential sample-level inference is prohibitively slow for real-time use; requires conditional input (linguistic features) for high-quality TTS.

  - id: 1703.10135
    year: 2017
    task: [TTS]
    architecture: [transformer-enc-dec]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - End-to-end TTS from characters can match production statistical parametric systems in subjective naturalness without hand-engineered linguistic features.
      - Multi-frame decoder output per attention step substantially improves training stability and alignment quality.
    evidence:
      - Tacotron achieves MOS 3.82 vs 3.69 for parametric baseline; attention-based alignment emerges automatically from character-level supervision.
    limitations:
      - Output mel spectrograms require a separate vocoder (Griffin-Lim in this work) for final waveform generation; prosody can be unnatural for long sentences.

  - id: 1712.05884
    year: 2017
    task: [TTS]
    architecture: [transformer-enc-dec]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - Conditioning WaveNet on mel spectrograms from a seq2seq model enables end-to-end trainable TTS that substantially improves naturalness over Griffin-Lim vocoders.
      - Mel spectrograms are a compact intermediate representation that decouples acoustic modeling from waveform synthesis, enabling compositional pipeline improvements.
    evidence:
      - Tacotron 2 achieves MOS 4.526 on LJSpeech, approaching natural speech (MOS 4.582) and exceeding all prior systems.
    limitations:
      - Two-stage pipeline; WaveNet vocoder is slow; training requires paired text-speech data.

  - id: 2106.15561
    year: 2021
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching, diffusion, GAN, VAE, transformer-enc-dec]
    relevance: medium
    contribution_type: conceptual-contribution
    claims:
      - The transition from attention-based alignment to explicit duration prediction eliminates word skipping and repeating artefacts while enabling parallel mel-spectrogram generation.
      - Zero-shot speaker adaptation relying solely on a speaker encoder without fine-tuning produces noticeably lower voice quality than few-shot adaptation for out-of-distribution speakers.
    evidence:
      - Comprehensive survey of neural TTS up to 2021; categorises 100+ systems across acoustic models, vocoders, and expressivity methods.
    limitations:
      - Pre-dates the codec LM era (VALL-E 2023); does not cover autoregressive codec TTS or neural codec architectures.

  - id: 2303.03926
    year: 2023
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Large-scale multilingual codec language models can transfer speaker identity, emotion, and acoustic environment across languages without paired bilingual data.
      - Language ID conditioning is essential for native-sounding accent in cross-lingual codec TTS; removing it degrades accent scores significantly.
      - The AR/NAR two-stage codec LM architecture extends naturally to cross-lingual generation by treating bilingual phoneme sequences as concatenated prompts.
    evidence:
      - VALL-E X achieves cross-lingual speaker similarity CMOS +0.23 over XTTS baseline; accent naturalness score 3.92/5 vs. 3.13 for no language-ID ablation.
    limitations:
      - Proprietary model; no public code or weights; evaluated on limited language pairs (English-Chinese primarily).

  - id: 2305.02765
    year: 2023
    task: [codec]
    architecture: [GAN, VAE]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - Group-RVQ in parallel chains improves reconstruction quality per codebook count relative to sequential RVQ.
      - The burden codec codebook count imposes on downstream generation models is a practical constraint that drives codec architecture choices independently of raw reconstruction quality.
    evidence:
      - HiFi-Codec achieves comparable MOS to EnCodec with fewer codebooks using GRVQ design; released as open-source codec for downstream research.
    limitations:
      - Evaluated primarily on single-speaker reconstruction; no systematic downstream AR TTS comparison.

  - id: 2305.07243
    year: 2023
    task: [TTS]
    architecture: [autoregressive-LM, diffusion, VAE]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Conditioning a diffusion decoder on continuous AR latents rather than discrete token outputs substantially improves quality in cascaded AR-diffusion TTS.
      - Contrastive re-ranking of multiple AR candidates using a text-speech discriminator measurably improves final output without running the decoder on every candidate.
      - Large-scale self-supervised pretraining and multi-stage AR-diffusion generation transfer image-generation scaling insights to speech synthesis effectively.
    evidence:
      - Tortoise achieves MOS exceeding professional audiobook narrators in MUSHRA-style test; contrastive re-ranking improves CLVP discriminator scores by approximately 10%.
    limitations:
      - Very slow inference (minutes per utterance); architecture predates codec LM mainstream; no streaming capability.

  - id: 2305.09636
    year: 2023
    task: [TTS, SCA]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Parallel masked decoding adapted to RVQ structure enables acoustic generation two orders of magnitude faster than autoregressive decoding at matched perceptual quality.
      - Non-AR RVQ-level-by-level decoding maintains better voice and acoustic consistency over long sequences than autoregressive chunk-and-prompt approaches.
      - Fine-level RVQ tokens are conditionally independent given coarser tokens and can be decoded greedily in a single pass.
    evidence:
      - SoundStorm generates 30 seconds of speech in 0.5s on TPU; SIM parity with AudioLM prompt-based AR baseline on voice consistency metrics.
    limitations:
      - Requires semantic tokens from a separate AR model (AudioLM-style); not standalone end-to-end; conditioning path is complex.

  - id: 2306.00814
    year: 2023
    task: [TTS]
    architecture: [GAN]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - Fourier-domain GAN vocoders reduce periodicity errors more effectively than time-domain GANs, suggesting frequency-domain inductive bias benefits voiced speech modeling.
      - A Fourier-domain GAN vocoder deployed as a neural codec decoder improves perceptual quality over the original codec decoder across all bitrates.
    evidence:
      - Vocos MUSHRA score 82.6 vs. HiFi-GAN 79.1; 10x faster inference than HiFi-GAN v1; as EnCodec decoder, MUSHRA +2.1 over original decoder.
    limitations:
      - Evaluated primarily on TTS; no ablation on very low bitrate codecs where time-domain methods may retain advantages.

