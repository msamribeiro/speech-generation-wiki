open_questions:
  - Does inference-time compute scaling via speech verifiers (Llasa 2502.04128) generalise to multilingual settings and expressive speech?
  - Can differentiable reward optimization (CosyVoice 3 2505.17589) extend to non-differentiable reward signals such as speaker similarity or emotion accuracy?
  - At what degree of voice distinctiveness does zero-shot generalization break down relative to few-shot fine-tuning (FireRedTTS 2409.03283)?
  - Does the chain-of-modality training approach (SpeechGPT 2305.11000) scale to larger LLMs without degrading text instruction-following?
  - How much of WaveNet's quality advantage was due to raw-waveform generation vs. the dilated causal convolution architecture itself?
  - Does SoundStorm's NAR masked decoding advantage over AR hold for languages with higher phonemic diversity or tonal languages?
  - At what scale does the speed-quality tradeoff in AR codec LMs become acceptable for real-time deployment without streaming tricks?
