open_questions:
  - Should the community adopt a shared subjective evaluation benchmark (fixed test set, fixed reference samples, centralized annotation)?
  - What is the minimum number of evaluators for statistically reliable CMOS comparison at the 0.1-point level?
  - For emotion-conditioned TTS, what evaluation paradigm captures utterance-level emotional appropriateness reliably beyond ~40% correlation?
  - Does multi-reference normalisation in LLM-as-judge create a quality ceiling when TTS-synthesised references are used?

trend_notes:
  - VoiceMOS/AudioMOS challenge retrospective (2508.00317) confirms that near-human-quality systems defeat all current SQA predictors — a quality ceiling problem requiring new benchmark design.
  - FreeGAN (2508.07711) adds to the growing evidence of UTMOS vs. subjective MOS divergence, reinforcing that UTMOS is unreliable for systems with architectural novelty.
  - SpeechRole demonstrates LLM-as-judge with multi-reference normalisation as a scalable alternative to human evaluation for role-playing benchmarking.
  - The trend toward automated reproducible benchmarks (Full-Duplex-Bench, SpeechRole, VoiceMOS) reduces reliance on costly subjective listening tests for specific evaluation dimensions.
  - Integration pass 6: Three new papers expand subjective evaluation — interspeech-2025-0401 provides a replicability checklist for TTS listening tests, interspeech-2025-2765 introduces human fooling rate as a new naturalness evaluation paradigm, and interspeech-2025-1066 adds another UTMOS vs. human MOS divergence data point for EBM TTS systems.
