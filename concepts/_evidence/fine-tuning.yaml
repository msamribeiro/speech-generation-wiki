concept: fine-tuning
last_updated: 2026-06-10
paper_count: 5

papers:
  - id: 2407.10759
    year: 2024
    task: []
    architecture: []
    relevance: medium
    contribution_type: engineering-integration
    claims:
      - Multi-stage fine-tuning of a pre-trained LLM on audio (pre-training, SFT, DPO) produces strong audio-language instruction following without architecture changes.
      - Direct preference optimization improves factuality alignment in audio-language models.
    evidence:
      - Qwen2-Audio outperforms Gemini-1.5-pro on AIR-Bench audio-centric instruction following via three-stage fine-tuning.
    limitations:
      - Understanding-focused model; speech synthesis not the primary capability.

  - id: 2407.21783
    year: 2024
    task: []
    architecture: [autoregressive-LM]
    relevance: medium
    contribution_type: engineering-integration
    claims:
      - Speech capability can be added to a pre-trained LLM by training a separate speech encoder and adapter while keeping LLM weights frozen, preserving text capabilities.
    evidence:
      - Llama 3 + 1B conformer + 100M adapter enables spoken dialogue across 34 languages; LLM weights unchanged.
    limitations:
      - Speech extension described at high level; encoder and adapter training details limited in the tech report.

  - id: interspeech-2025-1344
    year: 2025
    task: [TTS]
    architecture: [flow-matching]
    relevance: high
    contribution_type: empirical-benchmark
    claims:
      - Full fine-tuning of multilingual zero-shot TTS on single-language single-speaker data destroys zero-shot capability; PEFT with 1.72% of parameters preserves it.
      - In flow-matching TTS, the text conditioning module requires more adapter capacity to adapt to a typologically distant language than the acoustic generation module.
      - Low-rank adaptation exhibits a rank-dependent trade-off between task-specific accuracy and generalisation; optimal rank decreases as dataset scale decreases.
    evidence:
      - Three-adapter PEFT (5.81M params) achieves F0-RMSE 0.112 and WER 15.39% on Korean vs full FT WER 42.04% (destroys zero-shot).
      - Rank-16 DiT LoRA consistently outperforms rank-4 and rank-8 across evaluated conditions.
    limitations:
      - Single target language (Korean); single source speaker; 12.65h data; training on single GPU only.

  - id: 2508.09767
    year: 2025
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: empirical-benchmark
    claims:
      - LoRA fine-tuning with task-specific special tokens can insert narrow pronunciation control at <0.5% of model parameters without degrading general synthesis quality.
    evidence:
      - UtterTune rank-16 LoRA on CosyVoice 2: accent correctness 0.499→0.899; MOS 3.44→3.88; 0.5% trainable params.
    limitations:
      - Japanese-only evaluation; phoneme-tag tokens require linguistic annotation; not tested on other LM backbones.

  - id: 2508.18006
    year: 2025
    task: [TTS]
    architecture: []
    relevance: medium
    contribution_type: empirical-benchmark
    claims:
      - Bottleneck adapter fine-tuning (10% of parameters) for language and speaker adaptation outperforms full fine-tuning on naturalness and speaker similarity.
    evidence:
      - English→Spanish adapter achieves MOS 3.59 vs full fine-tuning 3.41; SPK-SIM 0.73 vs 0.68.
    limitations:
      - English→Spanish only; single low-resource scenario; no zero-shot preservation test.

claim_clusters:
  - claim: PEFT (LoRA, adapters) is functionally necessary, not merely computationally convenient, for cross-lingual TTS adaptation because full fine-tuning destroys zero-shot multi-speaker capability.
    status: strongly_supported
    supporting_papers: [interspeech-2025-1344, 2508.18006]
    contradicting_papers: []

  - claim: LoRA with task-specific special tokens can insert narrow task-specific capabilities (pronunciation control, accent) at less than 1% of model parameters without degrading general synthesis quality.
    status: strongly_supported
    supporting_papers: [2508.09767, interspeech-2025-1344]
    contradicting_papers: []

  - claim: Adding speech capability to a pre-trained LLM without modifying its weights via a frozen adapter approach preserves language model knowledge while enabling speech understanding and synthesis.
    status: emerging
    supporting_papers: [2407.21783, 2407.10759]
    contradicting_papers: []
    notes: Demonstrated for understanding; synthesis capability of this pattern is less well established.

open_questions:
  - At what data scale does full fine-tuning outperform PEFT for TTS, if ever?
  - Does optimal PEFT module selection (which layers to adapt) transfer across architectures (AR LM vs flow-matching vs diffusion)?
  - Can instruction fine-tuning enable new TTS capabilities without task-specific data?
  - How does PEFT interact with post-training (RLHF/GRPO)?

trend_notes:
  - 2025: PEFT established as default for cross-lingual TTS adaptation; the key finding is that catastrophic forgetting makes full fine-tuning harmful even when it produces better per-language performance.
  - Multi-stage post-training (SFT + DPO/GRPO) is the emerging standard for audio-language models (Qwen2-Audio, GLM-4-Voice), borrowing from LLM alignment methodology.
