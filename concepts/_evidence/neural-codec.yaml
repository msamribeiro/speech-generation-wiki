  - id: 2508.16790
    year: 2025
    task: [codec, TTS, zero-shot-tts]
    architecture: [diffusion, transformer-enc-dec]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Text conditioning in the codec decoder enables extreme compression (6.25 Hz) without adversarial training or SSL distillation.
      - A single end-to-end flow-matching objective is sufficient to jointly optimise quantization and reconstruction.
      - The reconstruction-generation gap varies substantially across tokenizer architectures and is not captured by reconstruction metrics alone.
      - Binary Spherical Quantization without commitment loss achieves stable end-to-end training of a speech codec.
    evidence:
      - TaDiCodec: 0.0875 kbps, WER 2.28% on SeedTTS test-en outperforming CosyVoice 2 (2.89%); reconstruction-generation gap analysis shows Mimi degrades 104.5% on English WER.
    limitations:
      - Requires transcript at both training and inference; not a general-purpose audio codec; multi-step diffusion decoder adds latency.

  - id: 2508.19205
    year: 2025
    task: [TTS]
    architecture: [hybrid]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Extreme continuous VAE compression (7.5 Hz, single codebook) can achieve superior perceptual quality over multi-codebook discrete codecs at higher frame rates.
      - Separate acoustic and semantic tokenizers trained with task-specific objectives outperform a unified codec for long-form generation.
    evidence:
      - VibeVoice 7.5 Hz VAE tokenizer achieves PESQ 3.068 and UTMOS 4.181 on LibriTTS test-clean, beating DAC and WavTokenizer 75 Hz.
    limitations:
