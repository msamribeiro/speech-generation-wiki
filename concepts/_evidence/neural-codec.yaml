  - id: 2408.16725
    year: 2024
    task: [SCA, TTS]
    architecture: [autoregressive-LM]
    relevance: low
    contribution_type: engineering-integration
    claims:
      - Multi-codebook codec tokens with batch inference strategy enable parallel simultaneous text-audio generation in a streaming spoken LM.
    evidence:
      - Mini-Omni generates speech via multi-codebook tokens in parallel with text reasoning tokens; batch inference reduces effective decode time vs. sequential token prediction.
    limitations:
      - Codec-specific details not fully disclosed; speech quality measured only against voice naturalness, not against codec reconstruction benchmarks.
