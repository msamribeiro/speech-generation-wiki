  - id: 2409.03283
    year: 2024
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching, hybrid]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - Two-stage waveform generation separating a low-sampling-rate mel decoder from a super-resolution vocoder allows a system trained predominantly on low-rate data to produce high-fidelity 48 kHz output.
    evidence:
      - FireRedTTS achieves 48 kHz output quality comparable to ground truth on high-fidelity benchmarks using a 24 kHz mel decoder and SR vocoder combination.
    limitations:
