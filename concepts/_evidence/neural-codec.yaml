    claims:
      - Combining a Whisper encoder for speech input with streaming codec-based TTS for output enables low-latency spoken dialogue without modifying the LLM backbone.
    evidence:
      - Freeze-Omni achieves competitive spoken dialogue quality with chunk-level duplex detection integrated with the LLM prefill stage.
