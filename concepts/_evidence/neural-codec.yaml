open_questions:
  - Can dynamic frame merging be extended to sub-3 Hz without catastrophic quality loss?
  - Does FlexiCodec's dynamic merging interact well with prosodic information (Factor C from 2412.17048)?
  - Is there a natural lower bound on frame rate below which semantic content cannot be preserved in discrete tokens?
  - Can SecoustiCodec's contrastive training be extended to a fully unsupervised setting without phoneme labels?

trend_notes:
  - The field is tracking two competing codec futures: lower-frame-rate discrete (toward text-rate ~4.5 Hz) and continuous waveform latent (bypassing codec discretization entirely).
  - 2025: SecoustiCodec proposes cross-modal contrastive learning as an alternative to SSL distillation; SPCODEC introduces spectral supervision; SpectroStream establishes TF-domain codec for full-band audio.
  - 2026: Codec frame rate competition continues with Fish Audio S2 (21 Hz streaming) vs. Qwen3-TTS (12.5 Hz).
