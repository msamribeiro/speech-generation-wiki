trend_notes:
  - "Integration pass 10 (2026-06-13): 18 historical papers added spanning the full codec era from WaveNet (1609.03499, 2016) through the early 2023 codec designs (HiFi-Codec 2305.02765, SoundStorm 2305.09636) through 2024-2025 industrial systems. Key themes: (1) The pre-codec era (WaveNet) motivates why learned discrete representations were needed; (2) MELLE (2407.08551) is the first strong evidence that continuous AR can outperform discrete codec AR, opening a new question about whether discretization is necessary; (3) TAAE (2411.19842) and BigCodec (2409.05377) confirm that scaling codec model size and using FSQ yield the most reliable quality improvements at low bitrates."
  - "Integration pass 11 (2026-06-15): 13 Tier 1 citation-discovery papers added: DASB (2406.14294) provides the first systematic benchmark for discrete audio/speech tokens across 11 downstream tasks; Discrete Speech Tokens review (2502.06490) unifies the tokenization taxonomy; SLM surveys (2410.03751, 2504.08528) confirm codec design is the central research lever for SLM quality; SpeechBrain (2106.04624) and vq-wav2vec (2104.00355) provide foundational SSL context; Fish-Speech (2411.01156), IndexTTS (2502.05512), Mini-Omni2 (2410.11190), OmniFlatten (2410.17799), SLAM-Omni (2412.15649), Vevo (2502.07243), MiniMax-Speech (2505.07916) demonstrate the codec as enabling infrastructure for 2024-2025 zero-shot TTS and dialogue systems."
