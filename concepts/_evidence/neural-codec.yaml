  - id: 1609.03499
    year: 2016
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - Direct raw-waveform autoregressive generation achieves substantially higher naturalness than vocoder-parameter synthesis but requires sample-level sequential decoding.
