  - id: interspeech-2025-0196
    year: 2025
    task: [codec]
    architecture: [GAN]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Imposing spectral structure on codec latent embeddings via supervised low/high frequency disentanglement improves codec efficiency at higher bitrates.
      - Performance advantage of spectral supervision scales with bitrate, where cross-band redundancy is largest.
    evidence:
      - SPCODEC achieves POLQA 4.5 at 10.66 kbps; performance advantage increases with bitrate, confirming cross-band redundancy reduction.
    limitations:
      - Evaluated only at standard bitrates; ultra-low frame rate downstream TTS quality not tested.

