  - id: 2508.08961
    year: 2025
    task: [SCA, TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Understanding-driven tokenizer trained against LLM objectives (USTokenizer) provides better LLM-speech alignment than reconstruction-trained codecs.
    evidence:
      - DualSpeechLM achieves competitive understanding and generation performance at 4.5K hours with USTokenizer (250 bps) + WavTokenizer output codec.
    limitations:
      - USTokenizer training cost is substantially higher than standard codec training.

  - id: 2508.11326
    year: 2025
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: low
    contribution_type: engineering-integration
    claims:
      - CosyVoice2 semantic tokenizer at 25 Hz with 6,561-token vocabulary is effective for instruction-conditioned AR TTS.
    evidence:
      - MoE-TTS uses CosyVoice2 semantic tokenizer; 6,561-token speech vocabulary appended to LLM for generation.
    limitations:
