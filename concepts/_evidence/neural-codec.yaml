  - id: 2508.20660
    year: 2025
    task: [codec, evaluation]
    architecture: []
    relevance: high
    contribution_type: evaluation-contribution
    claims:
      - Existing codec benchmarks conflate acoustic and semantic quality, requiring separate evaluation dimensions for use in downstream speech generation.
    evidence:
      - CodecBench introduces separate acoustic (reconstruction) and semantic (content understanding) evaluation tracks for comprehensive codec assessment.
    limitations:
      - Benchmark coverage of multi-speaker diversity and cross-lingual conditions not detailed in available summary.

  - id: interspeech-2025-0115
    year: 2025
    task: [codec]
    architecture: [transformer-enc-dec]
    relevance: high
    contribution_type: conceptual-contribution
    claims:
      - Neural audio codec tokens can be post-hoc analysed for interpretability using probing classifiers, revealing which codebook layers encode phonetic, speaker, prosodic, and acoustic-environment information.
    evidence:
      - Probing analysis on multiple codec architectures reveals that different RVQ layers specialise in different speech attributes; semantic information is concentrated in early layers.
    limitations:
      - Probing results are architecture-dependent; findings may not generalise across codec types.

  - id: interspeech-2025-0246
    year: 2025
    task: [codec]
    architecture: [transformer-enc-dec]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Speaker-invariant speech tokenisers that suppress paralinguistic information improve downstream spoken language model performance.
    evidence:
      - DC-Spin achieves improved ASR-in-LM and VC performance by discarding speaker information during tokenisation.
    limitations:
      - Trade-off between speaker invariance and acoustic detail preservation not fully characterised.

  - id: interspeech-2025-0468
    year: 2025
    task: [codec]
    architecture: [VAE, GAN]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Semantically-enhanced low-frame-rate codec (DualCodec) reduces downstream AR TTS latency while preserving downstream generation quality.
    evidence:
      - DualCodec achieves competitive speech generation quality at lower frame rates than standard EnCodec/DAC through SSL-guidance.
    limitations:
