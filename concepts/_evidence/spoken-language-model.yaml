open_questions:
  - Can paralinguistic variability in speech tokens (2412.17048) be solved by better codecs alone, or does it require architectural changes?
  - Is full-duplex strictly necessary for natural conversation, or can well-designed turn-taking logic in half-duplex suffice?
  - Does the dual-token advantage in DualSpeechLM persist at 100K+ hour scale?
  - Full-Duplex-Bench reveals a consistent aggressiveness-caution tension; is this fundamental to the E2E paradigm or addressable by training regime?
  - Can token-level thinking-in-speaking (Mini-Omni-Reasoner, 2508.15827) scale to complex reasoning tasks without sacrificing speech naturalness?
  - Does triadic VAP (interspeech-2025-2660) accuracy degrade gracefully beyond three participants, or is it fundamentally limited by state-space explosion?

trend_notes:
  - 2025: Full-Duplex-Bench provides the first automated benchmark for turn-taking in full-duplex systems; SpeechRole provides the first large-scale S2S role-playing benchmark.
  - Integration pass 5 adds: Full-Duplex-Bench (aggressiveness-caution tension), SpeechRole (text-LM bottleneck), UniTalker (speech-visual joint prediction), DualSpeechLM (dual-token decoupling).
  - The convergence toward hybrid architectures (text LLM + speech I/O) is accelerating with systems like VocalNet, LLaMA-Omni 2, and DualSpeechLM.
  - "2025 (Interspeech): Several new SCA directions: dual information stream for emotional conversations (2508.08095), token-level concurrent thinking-in-speaking (2508.15827), direct duplex modeling (interspeech-2025-0874), and triadic multi-party turn-taking prediction (interspeech-2025-2660)."
  - "2025 (Aug-Sep pass 7): TurnGuide (2508.07375) demonstrates turn-level text-speech interleaving substantially improves full-duplex semantic quality. OSUM-EChat (2508.09600) adds three-stage paralinguistic curriculum for empathetic dialogue. EMO-Reasoning (2508.17623) and VoxRole (2509.03940) provide systematic evidence that emotional coherence is a consistent failure mode across all tested SLMs. TaDiCodec (2508.16790) and VibeVoice (2508.19205) demonstrate that codec compression to 6.25-7.5 Hz is tractable and benefits SLM generation efficiency."
  - "Integration pass 9 (2026-06-12): 6 historical SLM papers added: SpeechGPT (2305.11000, foundational chain-of-modality paradigm), Mini-Omni (2408.16725, simultaneous text-audio streaming), LLaMA-Omni (2409.06666, CTC streaming decoder), Freeze-Omni (2411.00774, frozen LLM approach), WavTokenizer (2408.16532, single-codebook for audio LM), and VoiceBench (2410.17196, key negative result showing pipeline systems dominate). VoiceBench is particularly important as it provides systematic evidence that E2E audio LLMs trail pipeline systems substantially on instruction understanding — a finding that contextualises all subsequent claims about end-to-end SLMs."
  - "Integration pass 11 (2026-06-15): 11 Tier 1 citation-discovery papers added: foundation LMs (GPT-3 2005.14165, Llama 2 2307.09288, Gemini 2312.11805, DeepSeek-V3 2412.19437) as SLM backbone references; SALMONN (2310.13289) as dual-encoder audio LM; Mini-Omni2 (2410.11190), OmniFlatten (2410.17799), SLAM-Omni (2412.15649) as 2024 full-duplex systems; two survey papers (2410.03751, 2504.08528) confirming AR dominance and identifying evaluation gaps; Discrete Speech Tokens review (2502.06490) unifying tokenization taxonomy. Key finding: VoiceBench-MMAU negative correlation (2504.08528) now well-supported across multiple papers."

papers:
  - id: 2305.11000
    year: 2023
    task: [SCA, TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Expanding an LLM's token vocabulary with discretised speech units enables a single model to perform speech comprehension and generation without a cascade pipeline.
      - A multi-stage training curriculum separating modality adaptation, cross-modal instruction tuning, and chain-of-modality alignment is necessary for reliable cross-modal instruction-following.
      - The chain-of-modality pattern (text intermediate before speech response) is a practical mechanism for transferring LLM reasoning to speech output.
    evidence:
      - SpeechGPT demonstrates spoken instruction following on 8-category tasks; chain-of-modality enables text-conditional speech generation from HuBERT discrete units.
    limitations:
      - HuBERT k-means tokens have low reconstruction quality; speech generation naturalness substantially below dedicated TTS; LLaMA-7B backbone only.

  - id: 2408.16725
    year: 2024
    task: [SCA, TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Simultaneous text and audio generation conditioned on parallel text tokens enables streaming speech output without the latency penalty of sequential text-then-audio decoding.
      - Audio reasoning quality lags text reasoning quality in end-to-end speech LMs, and batch inference can partially bridge this gap.
      - A three-stage adapter-based training curriculum can integrate speech input and output into a frozen LLM backbone with minimal text capability degradation.
    evidence:
      - Mini-Omni achieves 1.3s first audio token latency; audio reasoning accuracy ~80% of text reasoning; three-stage curriculum preserves >95% of original text performance.
    limitations:
      - Small model (0.5B); limited benchmark coverage; no comparison to streaming cascade baselines with matched model size.

  - id: 2409.06666
    year: 2024
    task: [SCA]
    architecture: [hybrid]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - End-to-end speech LLMs with parallel text-speech generation can achieve lower response latency than cascaded pipelines without sacrificing prosody coherence under streaming conditions.
      - Aligning LLM output to speech interaction conventions through targeted instruction data rewriting substantially improves response style, independently of model architecture.
    evidence:
      - LLaMA-Omni achieves 284ms speech response latency vs. 2.1s for ASR+LLM cascade; instruction rewriting improves response appropriateness scores by 15%.
    limitations:
      - CTC decoding limits speech output naturalness; evaluated on limited instruction sets; Llama3.1-8B backbone only.

  - id: 2411.00774
    year: 2024
    task: [SCA]
    architecture: [autoregressive-LM, hybrid]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Freezing the LLM backbone during speech-modality alignment substantially reduces the intelligence gap between spoken and text Q&A performance.
      - Chunk-level state classification integrated into the LLM's prefill stage enables duplex interruption detection without a separate streaming model.
    evidence:
      - Freeze-Omni spoken IQ test performance within 5% of base LLM; fine-tuned baselines degrade 10-20% on same tests; interruption detection achieves >85% accuracy.
    limitations:
      - Evaluated on proprietary benchmarks only; codec TTS quality not independently benchmarked.

