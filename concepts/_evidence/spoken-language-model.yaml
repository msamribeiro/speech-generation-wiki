  - id: 2410.17196
    year: 2024
    task: [evaluation, SCA]
    architecture: []
    relevance: high
    contribution_type: evaluation-contribution
    claims:
      - Pipeline-based voice assistants substantially outperform end-to-end audio LLMs on spoken instruction understanding, with the gap persisting for state-of-the-art systems.
      - End-to-end audio LLM training can degrade the underlying LLM's text-instruction and safety alignment capabilities.
      - Mispronunciation causes significantly greater performance degradation in voice assistants than disfluencies or grammatical errors.
    evidence:
      - VoiceBench: Whisper+LLM pipeline outperforms GPT-4o audio by 18% on instruction-following tasks; GPT-4o audio scores 15% lower than GPT-4o text on identical tasks; mispronunciation degrades 25% vs. 8% for disfluency.
    limitations:
      - Automated VoiceBench scores may not fully reflect human naturalness perception; some proprietary models not fully evaluated.

