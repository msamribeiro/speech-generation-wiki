concept: spoken-language-model
last_updated: 2026-06-05
paper_count: 35

papers:
  - id: 2503.04721
    year: 2025
    task: [SCA]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: empirical-benchmark
    claims:
      - Full-duplex spoken dialogue models that rely on end-to-end architectures interrupt user pauses at high rates; explicit turn-state prediction substantially reduces unwanted interruptions.
      - Backchannel generation remains a largely unsolved capability in current full-duplex systems; most open-source models produce near-zero backchannel frequency.
    evidence:
      - Full-Duplex-Bench: first automated benchmark for full-duplex SLM turn-taking across four scenarios; reveals consistent aggressiveness-caution tension across all tested models; commercial systems better calibrated than open-source.
    limitations:
      - Automated evaluation without human validation of turn-taking naturalness.

  - id: 2507.20091
    year: 2025
    task: [TTS, SCA]
    architecture: [autoregressive-LM]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - Prosody emergence in LLMs requires explicit prosody token design rather than data scale.
    evidence:
      - ProsodyLM achieves contrastive focus, emotion recognition, and style continuity without task-specific fine-tuning by replacing codec tokens with explicit word-level prosody annotations.
    limitations:
      - Audiobooks only; spontaneous conversational speech not tested.

  - id: 2508.02013
    year: 2025
    task: [SCA]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: empirical-benchmark
    claims:
      - The quality of spoken role-playing is more strongly determined by the underlying text LM's reasoning ability than by the speech synthesis architecture.
    evidence:
      - SpeechRole benchmark (111K dialogues, 98 roles): text-LM quality is the primary bottleneck for both cascaded and E2E systems; LLM-as-judge rank correlation ρ 0.67–0.98 with human experts.
    limitations:
      - TTS-synthesised references as benchmark; quality ceiling risk.

  - id: 2508.04585
    year: 2025
    task: [SCA]
    architecture: [autoregressive-LM]
    relevance: medium
    contribution_type: engineering-integration
    claims:
      - LLM joint prediction of interleaved speech and visual tokens from multimodal dialogue context is feasible and outperforms cascaded speech-then-video generation on emotion consistency.
    evidence:
      - UniTalker achieves SIM_SPK 0.702 on IEMOCAP unseen speakers; joint speech-visual prediction from Qwen2.5-based SLM.
    limitations:
      - IEMOCAP acted emotional speech only.

  - id: 2508.08961
    year: 2025
    task: [SCA, TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Separating the token used for LLM input from the token used for generation output resolves the understanding-generation tension in unified speech LLMs while reducing data requirements.
    evidence:
      - DualSpeechLM: competitive at 4.5K hours on ASR, S2TT, SER, TTS, VC with USTokenizer (understanding) + WavTokenizer (acoustic); reduces modality gap.
    limitations:
      - Advantage may diminish at larger data scales.

