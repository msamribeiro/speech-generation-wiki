  - id: interspeech-2025-0739
    year: 2025
    task: [SCA, evaluation]
    architecture: []
    relevance: high
    contribution_type: evaluation-contribution
    claims:
      - Full-duplex spoken dialogue systems require dedicated benchmarks that test turn-taking timing, speech quality, and semantic coherence simultaneously.
      - Aggressiveness-caution tension is a consistent property of current full-duplex E2E systems under automated evaluation.
    evidence:
      - FD-Bench pipeline evaluates real-time SDS on turn-taking, speech quality, and semantic coherence; reveals consistent tension between aggressive response and cautious turn-taking.
    limitations:
      - Automated pipeline; human correlation study not yet conducted.

  - id: interspeech-2025-0874
    year: 2025
    task: [SCA]
    architecture: [autoregressive-LM, hybrid]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Direct duplex modeling via unified speech-text token interleaving achieves natural full-duplex dialogue without dedicated turn-detection modules.
    evidence:
