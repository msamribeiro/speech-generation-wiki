  - id: interspeech-2025-1595
    year: 2025
    task: [SCA]
    architecture: [autoregressive-LM]
    relevance: medium
    contribution_type: engineering-integration
    claims:
      - Scheduled interleaved speech-text training improves speech-to-speech translation quality in an end-to-end LLM architecture.
    evidence:
      - Gradual exposure to speech inputs via scheduled training achieves competitive S2ST quality vs. cascade systems.
    limitations:
