papers:
  - id: 2503.04721
    year: 2025
    task: [SCA]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: empirical-benchmark
    claims:
      - Full-duplex SLMs show a consistent aggressiveness-caution tension in turn-taking across all tested architectures.
      - Backchannel generation remains near-zero for most current full-duplex open-source models.
      - Commercial full-duplex systems are better calibrated on turn-taking than open-source counterparts.
    evidence:
      - Full-Duplex-Bench: automated benchmark for four turn-taking scenarios; aggressiveness-caution tension consistent across all models; commercial systems better calibrated; open-source models produce near-zero backchannel frequency.
    limitations:
      - Automated evaluation without human validation of turn-taking naturalness; no end-to-end S2S benchmark yet.

  - id: 2508.02013
    year: 2025
    task: [SCA]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: empirical-benchmark
    claims:
      - Spoken role-playing quality is more strongly determined by text LM reasoning than by speech synthesis architecture in both cascaded and E2E systems.
    evidence:
      - SpeechRole (111K dialogues, 98 roles): text-LM quality is the primary bottleneck for both cascaded and E2E systems; LLM-as-judge ρ 0.67–0.98 with human experts.
    limitations:
      - TTS-synthesised references as benchmark; quality ceiling risk.

