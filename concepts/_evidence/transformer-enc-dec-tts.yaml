concept: transformer-enc-dec-tts
last_updated: 2026-06-13
paper_count: 19

papers:
  - id: 2006.04558
    year: 2020
    task: [TTS]
    architecture: [transformer-enc-dec]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Explicit variance conditioning on pitch, energy, and duration eliminates the information gap between text and speech in non-autoregressive TTS, enabling quality matching or surpassing autoregressive models without autoregressive inference.
      - Phoneme durations from forced alignment are substantially more accurate than teacher-extracted durations, and this accuracy difference directly improves output voice quality.
      - Modeling pitch in the frequency domain via CWT produces more natural pitch distributions than direct F0 regression.
      - Removing teacher-student distillation from non-autoregressive TTS training can simultaneously simplify the pipeline, reduce training time, and improve quality.
    evidence:
      - FastSpeech 2 MOS 3.83 vs Tacotron 2 3.70 and FastSpeech 3.68 on LJSpeech with matched vocoder; CMOS +0.885 over FastSpeech, +0.235 over Transformer TTS.
      - Training time 17.02h vs 53.12h for FastSpeech (3.12x reduction); inference 48x real-time.
      - Removing pitch from FastSpeech 2s costs 1.130 CMOS; MFA durations improve CMOS by 0.195 vs teacher durations.
    limitations:
      - Evaluated on single studio-quality English speaker (LJSpeech); no multi-speaker or cross-lingual generalisation demonstrated.
      - Relies on external forced aligner (MFA) and pitch extractor (PyWorldVocoder); not end-to-end.

  - id: 2025.acl-long.911
    year: 2025
    task: [TTS, evaluation]
    architecture: [transformer-enc-dec]
    relevance: medium
    contribution_type: dataset-contribution, evaluation-contribution
    claims:
      - Contextual situational prompts (dialogue history, scene descriptions, action cues) provide measurable benefit over direct acoustic attribute labels in TTS naturalness and style alignment.
      - Contextualized TTS performance degrades when dialogue history exceeds 8 turns.
      - Codec TTS models not designed for contextualized tasks can outperform dedicated FastSpeech2-style baselines on that task.
    evidence:
      - DNA-TTS MOS-D 3.85 vs none-prompt TTS 3.65–3.78 on ESD dialogues; contextual prompts yield ~0.1 MOS gain.
      - VoiceCraft (codec TTS) leads on MOS-D (3.88) above dedicated DNA-TTS baseline (3.85).
      - Ablation: removing Style Fusion drops MOS-D from 3.85 to 3.74, approaching none-prompt TTS level.
    limitations:
      - Movie-sourced 18-hour English-only dataset; small evaluator pool (8 people).
      - Baseline DNA-TTS is not SOTA; codec systems already surpass it without CS-TTS-specific design.

  - id: 2025.acl-short.81
    year: 2025
    task: [TTS, evaluation]
    architecture: [autoregressive-LM, transformer-enc-dec]
    relevance: medium
    contribution_type: dataset-contribution, empirical-benchmark
    claims:
      - Architecture interacts strongly with input utterance length; transformer-enc-dec-based models (XTTS-v2) fail on short inputs while autoregressive codec LMs (VALL-E) remain robust.
      - Large-scale high-quality audiobook data with explicit speaker identity labels enables competitive zero-shot TTS in low-resource languages.
    evidence:
      - XTTS-v2PAB MOS on VIVOS short-sentence set drops to 2.79 vs VALL-E 3.44 and VoiceCraft 3.85.
      - XTTS-v2PAB WER 8.32 vs viXTTS baseline 12.54 on viVoice; SMOS 3.55 vs 2.88.
    limitations:
      - All models fine-tuned from English pretrained checkpoints; audiobook domain only; tonal phonology handling not ablated.

  - id: 2025.coling-main.352
    year: 2025
    task: [TTS]
    architecture: [diffusion, transformer-enc-dec]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Applying diffusion to prosodic feature prediction (pitch, energy, duration) rather than full Mel-spectrograms achieves faster RTF while preserving diversity benefits over regression-based NAR TTS.
      - Hierarchical prosody conditioning — combining implicit global style tokens with explicit fine-grained features — improves inference-time controllability over single-level approaches.
      - Classifier-free guidance without dynamic thresholding causes phoneme distortion at high guidance scales, requiring explicit standard-deviation correction.
    evidence:
      - DiffStyleTTS RTF 0.048 vs Guided-TTS 0.479 (10× faster) while achieving higher MOS (4.18 vs 4.15).
      - JS Divergence on pitch distribution: 0.065 (DiffStyleTTS) vs 0.079 (FastSpeech2).
      - Prosodic transfer preference over DiffProsody: 50.0% vs 16.7% (p=0.013).
      - Ablation: removing ISC from diffusion condition degrades MOS from 4.18 to 3.92.
    limitations:
      - Speaker timbre and prosody not disentangled; private Mandarin dataset with 9 male speakers only.

  - id: 2508.11273
    year: 2025
    task: [TTS]
    architecture: [transformer-enc-dec]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Self-supervised speech representations discretized via k-means provide language-agnostic prosodic tokens that improve multilingual emotional TTS consistency.
      - Spherical AVD emotion vector representations enable smooth interpolation across emotional states while remaining independent of speaker identity in the reference audio.
    evidence:
      - MOS 4.13 vs EmoSphere-TTS 4.05 (English); 3.94 vs 3.63 (Japanese).
      - LogF0RMSE 0.341 vs 0.359 (EmoSphere-TTS, English); AVD RMSE 0.0773 vs 0.0798.
      - Speaker-mismatched reference audio has minimal adverse impact on prosody quality.
    limitations:
      - Single-speaker datasets in two languages; small listener panels; separate per-language encoder instances don't scale to many languages.

  - id: 2508.12001
    year: 2025
    task: [TTS]
    architecture: [VAE, GAN, hybrid]
    relevance: medium
    contribution_type: architectural-novelty
    claims:
      - Mixture-of-Experts in the duration predictor enables speaker-specific prosodic diversity that deterministic or stochastic scalar predictors cannot capture.
      - Vocoder architecture and duration predictor complexity are coupled; improving one without the other yields limited or negative net gains.
    evidence:
      - MoE-DP alone with HiFi-GAN degrades MOS to 3.92; MoE-DP + VOCOS + CoMBD + SBD achieves 4.48 (vs VITS 4.26).
      - Phoneme duration classification accuracy: 67.07% (FNH-TTS) vs 65.76% (VITS+SDP) vs 11.17% (F5-TTS).
      - Vocoder RTF: 0.0046 (FNH-TTS) vs 0.00748 (HiFi-GAN), 1.6× speedup.
    limitations:
      - English-only; no code or demo; CPU RTF not contextualized against AR baselines.

  - id: 2604.01760
    year: 2026
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Encoder-decoder architectures solve the text-conditioning dilution problem of decoder-only autoregressive TTS by providing constant cross-attention to full bidirectional text representations at every generation step.
      - PM-RoPE cross-attention enables reliable duration control in autoregressive codec LMs without explicit duration supervision, generalizing across typologically diverse languages.
      - Large pretrained multilingual encoder-decoder backbones can generalize to unseen languages not present in TTS training data.
    evidence:
      - Disabling PM-RoPE at inference: CER degrades from 0.129 to 0.982; Duration Accuracy drops from 79% to 46%; SIM drops from 0.666 to 0.109.
      - Korean (zero-shot language): SIM 0.747, competitive with XTTSv2 (0.741) despite Korean absent from training.
      - French/German (European out-of-training): WER 0.475/0.453, substantially above XTTSv2 (0.080/0.060).
    limitations:
      - RTF 0.8–2.0, unsuitable for real-time; lower naturalness than non-AR baselines; LibriSpeech English results are upper bound (training data overlap).

  - id: 2604.12438
    year: 2026
    task: [TTS]
    architecture: [transformer-enc-dec]
    relevance: high
    contribution_type: engineering-integration, architectural-novelty
    claims:
      - Non-autoregressive depth-wise sequential decoding over RVQ layers enables sub-50ms time-to-first-byte latency without temporal autoregressive overhead.
      - Conditioning each quantizer layer on accumulated prior-layer embeddings within a single frame is necessary for coherent multi-layer RVQ prediction; naive parallel prediction collapses.
      - Phoneme-level text granularity is mandatory for NAR codec TTS; subword BPE causes catastrophic intelligibility failures.
    evidence:
      - RTF ~0.0033 (303× real-time); TTFB 48.99ms (well below 200ms perceptual threshold).
      - Depth-wise sequential vs naive parallel: WER 8.89% vs 14.37%; MCD 10.20 vs 12.49 dB.
      - BPE input: catastrophic failure (unintelligible output).
      - English MOS 2.51 ± 0.11 vs FastSpeech2+PWG baseline 2.81 ± 0.13.
    limitations:
      - English quality below continuous baseline; single-speaker only; 11 listeners; Malay result lacks baseline comparison.

  - id: interspeech-2025-0596
    year: 2025
    task: [TTS]
    architecture: [transformer-enc-dec]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Teacher-student knowledge distillation in the speaker encoder enables zero-shot TTS to synthesize intelligible speech from pathological (dysarthric) reference audio by anchoring speaker representations to clean speech priors.
      - Progressive curriculum learning — gradually shortening training audio — bridges the domain gap between training (long utterances) and inference (single words) for personalized TTS.
    evidence:
      - PER 14.254% vs best baseline 31.017% (Hybrid); >50% relative reduction.
      - Removing curriculum learning raises PER from 14.254% to 26.428%.
      - MOS-Nat 3.601 vs Hybrid 3.371; MOS-Spk 3.909 vs 3.731.
    limitations:
      - English-only; FastSpeech2 quality ceiling; SPK-SIM 0.619 may be insufficient for assistive use.

  - id: interspeech-2025-0754
    year: 2025
    task: [TTS]
    architecture: [transformer-enc-dec]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Strong emotional prosody inadvertently suppresses word-level emphasis percepts; joint modeling of emphasis and emotion is necessary for expressive TTS with reliable emphasis delivery.
      - Attention-weight biasing at emphasis positions protects emphasis from emotional prosody interference without degrading naturalness.
    evidence:
      - EAT 0.78 (EME-TTS) vs 0.73 (w/o EPE); improvement most pronounced in surprise emotion (0.64 vs 0.55).
      - MOS 4.22 vs EmoSpeech 4.14; emotion accuracy 0.67 vs EmoSpeech 0.58.
    limitations:
      - Small ESD dataset (English only); fixed EPE strength hyperparameter; inference requires GPT-4 for emphasis prediction.

  - id: interspeech-2025-0469
    year: 2025
    task: [TTS, evaluation]
    architecture: [transformer-enc-dec]
    relevance: medium
    contribution_type: dataset-contribution, empirical-benchmark
    claims:
      - Phoneme-based text analysis is necessary for morphologically complex low-resource South Asian languages; character-level massively multilingual approaches produce systematic intelligibility failures.
      - Script-specific phonetic lexicons and text normalization modules are prerequisite infrastructure for effective TTS in languages with complex orthographies.
    evidence:
      - Tacotron2+WaveGlow WER 16.1% vs MMS 31.4% on Punjabi; CER 9.1% vs 16.1%.
      - MMS fails completely on number and symbol synthesis in both Punjabi and Urdu.
      - Tacotron1 RTF 0.17 (real-time capable); Tacotron2+WaveGlow RTF 3.54 (not real-time).
    limitations:
      - One accent/dialect per language; bootstrapped Festival reference may not capture real-world noise; 20-participant evaluation panel.

  - id: interspeech-2025-1034
    year: 2025
    task: [TTS]
    architecture: [transformer-enc-dec]
    relevance: medium
    contribution_type: empirical-benchmark
    claims:
      - Multi-accent joint training enables cross-accent phonological knowledge transfer, reducing per-accent pronunciation data requirements by up to 95% relative to uni-accent training.
      - Accent pair similarity (Levenshtein distance over pronunciation lexicon) weakly mediates the strength of knowledge transfer; low-similarity pairs require more than 1k sentences.
    evidence:
      - 1k training sentences achieves 89.21% unseen word accuracy vs ceiling baseline 88.32% for high-similarity pair (ABD1/EDI, similarity 0.99).
      - Low-similarity pair (GNZ/EDI, similarity 0.91) fails at 1k sentences (statistically significant accuracy drop, p < 0.05).
    limitations:
      - Single target accent (EDI) tested; bootstrapped pronunciation data; frontend only (no end-to-end TTS quality evaluation).

claim_clusters:
  - claim: Explicit variance conditioning (pitch, energy, duration) in non-autoregressive transformer TTS eliminates the one-to-many mapping problem and enables quality matching or surpassing autoregressive acoustic models without sequential decoding.
    status: strongly_supported
    supporting_papers: [2006.04558]
    contradicting_papers: []
    notes: FastSpeech 2 established this as the foundational claim for the enc-dec TTS paradigm.

  - claim: FastSpeech2-style transformer encoder-decoder architectures provide a compact, adaptable foundation for specialized TTS tasks (emotion, accent, dysarthria, streaming) where codec LMs would be over-parameterized, but face a perceptual quality ceiling relative to autoregressive and flow-matching systems.
    status: strongly_supported
    supporting_papers: [2508.11273, interspeech-2025-0596, interspeech-2025-0754, 2604.12438, 2025.coling-main.352]
    contradicting_papers: [2025.acl-long.911]
    notes: 2025.acl-long.911 shows codec TTS (not NAR enc-dec) already outperforms dedicated FastSpeech2-style baseline on CS-TTS.

  - claim: The duration predictor is a critical prosodic bottleneck in non-autoregressive transformer TTS; improvements to duration modeling (diffusion, MoE, PM-RoPE) yield measurable gains in naturalness and speaker-specific prosody.
    status: strongly_supported
    supporting_papers: [2508.12001, 2025.coling-main.352, 2604.01760, 2604.12438]
    contradicting_papers: []
    notes: 2508.12001 demonstrates that the vocoder must also be upgraded jointly; duration predictor improvement alone is insufficient.

  - claim: Encoder-decoder architectures provide a structural solution to text-conditioning dilution in autoregressive codec LMs by routing bidirectional text representations through cross-attention at every decoder layer.
    status: emerging
    supporting_papers: [2604.01760]
    contradicting_papers: []
    notes: Supported by a single paper (T5Gemma-TTS); replication needed across other encoder-decoder codec LMs.

  - claim: Non-autoregressive depth-wise sequential codec decoding can achieve streaming TTS with sub-50ms time-to-first-byte latency, at a measurable perceptual quality cost relative to two-stage NAR systems.
    status: emerging
    supporting_papers: [2604.12438]
    contradicting_papers: []
    notes: English MOS 2.51 below baseline 2.81; Malay result (4.31) lacks baseline comparison; single-speaker only.

  - claim: Phoneme-based input is necessary for NAR TTS in morphologically complex or low-resource languages; character-level or subword inputs produce systematic intelligibility failures.
    status: emerging
    supporting_papers: [interspeech-2025-0469, 2604.12438]
    contradicting_papers: [2604.01760]
    notes: T5Gemma-TTS uses subword input for cross-lingual TTS with competitive results, but is an autoregressive encoder-decoder with large pretrained backbone — different regime from NAR FastSpeech2-style models.

  - claim: Cross-domain and cross-condition knowledge transfer (accent similarity, teacher-student distillation) substantially reduces data requirements for specialized TTS scenarios.
    status: emerging
    supporting_papers: [interspeech-2025-1034, interspeech-2025-0596]
    contradicting_papers: []
    notes: Both results are English-only and narrow in scope; generalization to other languages/domains untested.

open_questions:
  - Can depth-wise codec decoding in NAR frameworks match the perceptual quality of flow-matching or diffusion systems at the same latency target?
  - Does curriculum-based speaker encoder training generalize beyond dysarthric scenarios to other short-reference personalized TTS conditions?
  - What is the upper bound of prosodic diversity achievable in NAR frameworks relative to stochastic AR or diffusion decoding?
  - Can MoE-based duration predictors be combined with flow-matching or diffusion decoders rather than GAN-based vocoders?
  - Does PM-RoPE duration control transfer from encoder-decoder autoregressive TTS to NAR transformer-enc-dec frameworks?

trend_notes:
  - FastSpeech2 remains a popular backbone for specialized TTS tasks (2025–2026 papers: emotion, accent, dysarthria, streaming, prosody), particularly where computational efficiency or domain specificity matters.
  - The encoder-decoder paradigm is re-emerging at larger scale (T5Gemma-TTS, 4B params) as a solution to decoder-only text dilution, blurring the boundary between classical NAR enc-dec and autoregressive codec LMs.
  - Streaming TTS is an active direction within the transformer-enc-dec paradigm; depth-wise codec decoding is a promising but not yet quality-competitive approach.
  - Low-resource and specialized-domain TTS (South Asian languages, dysarthric speakers, non-standard accents) is a growing sub-area where FastSpeech2-family models are preferred due to data efficiency.
  - Hybrid architectures (diffusion + FastSpeech2, VAE + MoE + GAN) are increasingly common, suggesting the "pure" transformer-enc-dec paradigm is being augmented rather than replaced.
  - id: 1703.10135
    year: 2017
    task: [TTS]
    architecture: [transformer-enc-dec]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Seq2seq attention-based TTS from characters achieves naturalness competitive with statistical parametric synthesis without hand-engineered features.
      - Multi-frame output per step substantially improves training stability and alignment quality.
    evidence:
      - Tacotron MOS 3.82 vs. parametric 3.69; multiple output frames per attention step required for stable training; establishes seq2seq TTS paradigm.
    limitations:
      - Griffin-Lim vocoder output; prosody for long sentences can be unnatural; no explicit duration control.

  - id: 1712.05884
    year: 2017
    task: [TTS]
    architecture: [transformer-enc-dec]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Mel spectrogram conditioning of WaveNet achieves near-human naturalness; establishes the two-stage acoustic model + neural vocoder pipeline.
      - Mel spectrograms are the standard intermediate representation decoupling sequence modeling from waveform synthesis.
    evidence:
      - Tacotron 2 MOS 4.526 vs. GT 4.582 on LJSpeech; establishes mel+WaveNet as the dominant TTS paradigm until non-AR methods emerged.
    limitations:
      - Two-stage pipeline; WaveNet vocoder is slow; training requires paired text-speech data.

  - id: 2106.15561
    year: 2021
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching, diffusion, GAN, VAE, transformer-enc-dec]
    relevance: high
    contribution_type: conceptual-contribution
    claims:
      - The transition from attention-based alignment to explicit duration prediction in non-AR acoustic models eliminates word skipping and repeating artefacts while enabling parallel generation.
      - Transformer encoder-decoder TTS achieved near-human quality by 2020 (FastSpeech 2 + HiFi-GAN), setting the quality bar for later codec LM approaches.
    evidence:
      - Survey synthesises FastSpeech, Transformer TTS, and VITS approaches; shows parallel non-AR TTS with duration predictors achieves quality comparable to AR models.
    limitations:
      - Pre-dates codec LM era; transformer enc-dec paradigm was largely superseded by codec LMs for expressive TTS by 2023.

