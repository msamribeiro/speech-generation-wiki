  - id: 2025.findings-emnlp.424
    year: 2025
    task: [SCA]
    architecture: [autoregressive-LM]
    relevance: medium
    contribution_type: empirical-benchmark
    claims:
      - GRPO (Group Relative Policy Optimization) with AI-generated feedback is a viable route for aligning conversational interaction capabilities in spoken dialogue models.
