  - id: 2406.02430
    year: 2024
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - RL reward optimization for intelligibility (RL-SIM-WER) reduces WER in large-scale TTS systems; RL-SER improves emotion control accuracy substantially.
      - Reward hacking is a concrete risk in TTS RL: optimizing intelligibility reward produces over-slow, over-articulated speech.
    evidence:
      - "RL-SIM-WER: EN WER reduced from 2.249 to 1.945; RL-SER: emotion accuracy from 0.13-0.53 to 0.78-0.91."
    limitations:
      - Reward hacking observed; reward weighting requires careful tuning.

  - id: 2412.10117
    year: 2024
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Differentiable ASR reward via Gumbel-softmax sampling through FSQ indices enables WER optimization in autoregressive codec TTS without iterative DPO overhead.
      - Combining RL (differentiable reward) with DPO achieves better results than either alone in streaming TTS.
    evidence:
      - CosyVoice 2: RL+DPO combination achieves best intelligibility results in ablation.
    limitations:
      - Gumbel-softmax temperature annealing schedule must be carefully tuned to maintain generation diversity.

  - id: 2512.14291
    year: 2025
    task: [TTS]
    architecture: [autoregressive-LM]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Multi-reward GRPO with CER, SIM, emotion, and laughter rewards enables simultaneous alignment across multiple TTS quality dimensions.
      - Emotion reward trades off against CER in GRPO; careful reward weighting is necessary to prevent one objective from dominating.
    evidence:
      - 4-reward GRPO with dynamic sampling, hierarchical regularization, asymmetric gradient clipping in GLM-TTS.
      - Pronunciation/emotion trade-off documented and requires reward scheduling.
    limitations:
      - Reward weighting and dynamic sampling schedule require tuning; trade-off may be fundamental rather than engineering solvable.

  - id: 2508.16332
    year: 2025
    task: [TTS, singing]
    architecture: [flow-matching, hybrid]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Multi-objective GRPO post-training can simultaneously improve intelligibility and prosody similarity without sacrificing either dimension.
      - Single-objective RL optimization degrades the complementary quality dimension; multi-objective formulation is necessary for unified speech+singing alignment.
    evidence:
      - Single-objective intelligibility-only training drops melody from 65% to 50%; multi-objective GRPO maintains both.
      - GRPO with Bradley-Terry intelligibility reward + chromagram cosine prosody reward on INTP corpus.
    limitations:
      - Whether objectives are genuinely incompatible in other task combinations is untested.

