    year: 2025
    task: [TTS, SCA]
    architecture: [autoregressive-LM, flow-matching, hybrid]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - RLHF reward models trained on speech interaction data exhibit failure modes unless explicit counter-examples are constructed during reward model training.
      - Post-training RLHF improves intelligibility and responsiveness in large-scale speech interaction systems.
    evidence:
      - Step-Audio RLHF counter-example approach prevents evasive non-answer behavior in production; WER 1.8% post-RLHF vs. 2.4% pre-RLHF on SeedTTS test-en.
    limitations:
      - Counter-example construction requires manual effort to identify failure modes; RLHF reward model details not fully disclosed.

  - id: 2307.09288
    year: 2023
    task: [SCA]
    architecture: [autoregressive-LM]
    relevance: medium
    contribution_type: engineering-integration
    claims:
      - Iterative RLHF with PPO and rejection sampling fine-tuning substantially improves helpfulness and safety without catastrophic forgetting of language modeling capability.
    evidence:
      - Llama 2 Chat models win human preference over ChatGPT in 68% pairwise comparisons; RLHF methodology adopted across speech RLHF papers including Step-Audio and CosyVoice 3.
