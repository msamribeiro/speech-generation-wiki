  - id: interspeech-2025-0704
    year: 2025
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - Reward prediction directly from codec token sequences (bypassing FM+vocoder) enables differentiable end-to-end reward backpropagation in codec LM-based TTS via Gumbel-Softmax.
      - Multi-task reward models (ASR, emotion, MOS) computed at the codec token level can simultaneously improve intelligibility, emotion accuracy, and multilingual WER.
    evidence:
      - DiffRO WER 0.78% on seed-tts-eval zh vs CosyVoice 2.0 baseline 1.56% (halved).
      - MTR-reward DiffRO: Japanese WER 9.13% → 6.36% without explicit multilingual RL data.
      - Codec-level rewards have limited impact on audio MOS because FM+vocoder largely denoise the output.
    limitations:
      - FM+vocoder denoising reduces the practical impact of codec-level MOS rewards; end-to-end audio-level reward optimization remains open.

  - id: interspeech-2025-0063
    year: 2025
    task: [TTS]
    architecture: [diffusion]
    relevance: high
    contribution_type: architectural-novelty
    claims:
      - RLHF is viable for diffusion-domain TTS when the original training loss (DDPM noise-prediction) is added as a reward regularizer to prevent temporal incoherence and mode collapse.
      - Standard image-domain RL methods (DDPO, DPOK, KLinR) fail for diffusion audio TTS due to score function estimator variance and KL regularizer limitations specific to sequential audio.
    evidence:
      - DLPO (WaveGrad 2R): UTMOS 3.65 vs 2.90 baseline; preferred in 67% of pairwise comparisons; WER 1.2% maintained.
      - DDPM loss penalty prevents temporal incoherence that standard DDPO/KLinR cause.
    limitations:
      - Validated on single-speaker LJSpeech only; scaling to multi-speaker and zero-shot diffusion TTS untested.

claim_clusters:
  - claim: Preference alignment via DPO or GRPO consistently improves TTS intelligibility (WER/CER) relative to supervised pre-training, with 31–50% relative reductions achievable across diverse systems and architectures.
    status: strongly_supported
    supporting_papers: [2025.acl-long.598, 2406.02430, 2412.10117, 2509.00685, interspeech-2025-0704]
    contradicting_papers: []
    notes: Effect size depends on base model quality and preference pair quality; diminishing returns observed in iterative alignment.

  - claim: Reward hacking is a concrete and recurring failure mode in TTS RL; optimizing single-dimensional rewards (e.g., WER only) produces degenerate speech styles and degrades complementary dimensions.
    status: strongly_supported
    supporting_papers: [2406.02430, 2508.16332, 2512.14291]
    contradicting_papers: [2509.00685, 2603.08823]
    notes: 2509.00685 (MPO) and 2603.08823 (Fish S2) address this via multidimensional rewards; reward hacking is mitigated but not eliminated.

  - claim: Preference alignment generalizes across TTS architecture families; DPO extensions for flow-matching (DPO-FM) and masked generative models (DPO-MGM) are viable without fundamental reformulation of the preference objective.
    status: emerging
    supporting_papers: [2025.acl-long.598, interspeech-2025-0063]
    contradicting_papers: []
    notes: DPO-FM and DPO-MGM introduced in one paper each; DLPO for diffusion TTS introduced in one paper. Cross-architecture replication needed.

  - claim: Weak-to-strong generalization applies to TTS preference alignment; preference pairs built from weaker generators can improve stronger models beyond the weaker model's ceiling.
    status: emerging
    supporting_papers: [2025.acl-long.598]
    contradicting_papers: []
    notes: Supported by one paper with careful experimental design; broader validation across architectures needed.

  - claim: Multi-objective GRPO post-training is necessary when multiple quality dimensions (intelligibility, prosody, speaker similarity) are relevant; single-objective optimization degrades the complementary dimensions.
    status: emerging
    supporting_papers: [2508.16332, 2509.00685, 2512.14291]
    contradicting_papers: []
    notes: 2512.14291 documents the emotion/CER trade-off; 2508.16332 documents the intelligibility/melody trade-off; MPO (2509.00685) is the most principled multi-dimensional solution so far.

  - claim: Using the same models for data filtering during pretraining and as reward signals during RL post-training eliminates distribution shift between stages.
    status: emerging
    supporting_papers: [2603.08823]
    contradicting_papers: []
    notes: Conceptually sound but validated in one system; risk of self-reinforcing bias not yet ruled out empirically.

  - claim: RLHF is viable for non-autoregressive diffusion TTS; the DDPM training loss functions as a natural reward regularizer that prevents temporal incoherence during policy gradient optimization.
    status: emerging
    supporting_papers: [interspeech-2025-0063]
    contradicting_papers: []
    notes: Validated on single-speaker LJSpeech only; scaling to multi-speaker and zero-shot diffusion systems is an open question.

open_questions:
  - Does diminishing return in iterative alignment saturate at the base model's inherent capability, or can curriculum design break through the ceiling?
  - How well do WER-ranked synthetic pairs correlate with human intelligibility preferences for code-switching and cross-lingual synthesis?
  - Can reward models operate on the flow-matching model's target space rather than the codec LM's token space to improve audio MOS rewards?
  - GLM-TTS shows emotion reward trades off against CER in GRPO; is this trade-off universal or architecture-specific?
  - Does the dual-purpose pipeline (same models for data filtering and RL rewards) introduce self-reinforcing bias, or does distributional alignment help generalization?
  - Does DLPO's diffusion-loss penalty scale to multi-speaker and zero-shot diffusion TTS systems?
  - Can GFlowNet-based TTS alignment (no preference pairs required) scale to the same intelligibility improvements as large DPO datasets?

trend_notes:
  - 2023–2024: RL first applied to TTS intelligibility via reward model (PPO-style) in Seed-TTS and CosyVoice 2; DPO first applied to TTS by SpeechAlign.
  - 2025 (ACL/Interspeech/EMNLP): Multi-model cross-comparison preference pairs, architecture-general DPO extensions (FM, MGM), weak-to-strong generalization, and first RLHF for diffusion TTS; paradigm expands from AR-codec-LM-only to all major TTS architectures.
  - 2025 (arXiv): Multi-objective GRPO (Vevo2, GLM-TTS, MPO) emerges as the dominant post-training paradigm; emotion/prosody alignment joins intelligibility as routine GRPO targets.
  - 2026: The post-training paradigm converges on GRPO with multi-dimensional rewards as standard practice; DPO is now primarily used for targeted intelligibility alignment in combination with GRPO. Sequential DPO → GRPO pipelines adopted at 5M-hour scale (Qwen3-TTS). Dual-purpose pipeline concept (Fish Audio S2) addresses distribution shift. GFlowNets introduced as a no-preference-data alternative.
  - Interspeech 2025 contributions (DiffRO, DLPO) establish that RLHF applies across codec LM and diffusion TTS domains, not just autoregressive models.
  - The main open frontier is multi-dimensional reward co-optimization at scale without reward hacking or self-reinforcing bias.
