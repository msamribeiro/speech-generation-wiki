  - id: 2603.08823
    year: 2026
    task: [TTS]
    architecture: [autoregressive-LM, flow-matching]
    relevance: high
    contribution_type: architectural-novelty, conceptual-contribution
    claims:
      - Using the same quality and ASR models as both pretraining data filters and RL reward signals eliminates distribution shift between the pretraining and RL stages.
      - Dr.GRPO (no value network) with composite multi-dimensional reward achieves TTS alignment without the memory overhead of value network-based PPO.
    evidence:
      - Fish Audio S2 dual-purpose pipeline: pretraining filters = RL reward models by construction.
      - Composite reward: intelligibility + quality + speaker similarity.
    limitations:
      - Self-reinforcing bias risk: reward models may be biased toward the pretraining distribution in ways that obscure genuine alignment quality.

