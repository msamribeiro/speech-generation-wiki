papers:
  - id: 2025.acl-long.598
    year: 2025
    task: [TTS]
    architecture: [flow-matching, autoregressive-LM, hybrid]
    relevance: high
    contribution_type: architectural-novelty, empirical-benchmark
    claims:
      - Preference alignment via DPO reduces WER by 31–46% relative across five TTS systems while maintaining speaker similarity (±0.01 SPK-SIM).
      - DPO can be extended to flow-matching models (DPO-FM, operating in velocity space) and masked generative models (DPO-MGM, summing log-probabilities over unmasked tokens).
      - Weak-to-strong generalization applies to TTS alignment: preference pairs built from weaker models improve stronger models (CosyVoice 2, Ints).
      - Supervised fine-tuning on positive samples alone is consistently weaker than DPO; the negative pair contrast is the critical discriminative signal.
    evidence:
      - INTP ~251K preference pairs (EN+ZH) across 5 domains; 5 TTS systems aligned.
      - SFT on positive samples: ARS WER 22.32 vs DPO 15.41 (Table 5); DPO uniformly better.
      - Iterative alignment: Ints v2 average WER 7.10 vs baseline 11.97.
    limitations:
      - Diminishing returns in iterative alignment suggest base model capability is the ceiling.
      - Weak-to-strong generalization limited by pair quality from weaker generators.

  - id: 2025.acl-long.682
